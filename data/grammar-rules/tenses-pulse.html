<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTUITY — Tense Rush</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800;900&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════════════
   TENSE RUSH — three games, one lesson.

   The falling-card-into-lanes engine is Pulse's: a beat, a card, four
   answers you tap. The round ladder that fills as you catch is Stars':
   five marks, climbed fresh every round, so a slow start can still end in
   Blaze. The scoreboard is Burrow's: not a percentage but a Cambridge-style
   140–190 score with a letter grade, because "163" tells a B2 candidate
   exactly where they stand and "68%" does not.

   What's new is the WHY. A phrasal verb is arbitrary — "give up" means what
   it means, full stop. A tense choice is never arbitrary: it's reasoned
   from a time marker, a finished/unfinished period, an earlier-or-later
   relationship between two events. So every wrong tap earns one line of
   the reasoning, not just a red flash — the toast in Burrow named the
   right word; this one names the right RULE.
   ══════════════════════════════════════════════════════════════════════ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --gold:#C9A961; --ink:#0b0b0d;
  --accent:#FFD94A; --accent-rgb:255,217,74;
  --ok:#abc32f; --wrong:#E86A5C;
  --paper:#e9e9eb; --dim:rgba(233,233,235,.55); --faint:rgba(233,233,235,.26);
  --s0:#cdbf8e; --s1:#e8935a; --s2:#ff7a45; --s3:#ff4d4d; --s4:#ffd94a;
  --grp-color:#61b5ed; --grp-rgb:97,181,237;
  --header-h:150px; --hud-h:78px; --lane-h:112px;
}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0c;overscroll-behavior:none}
body{font-family:'DM Sans',sans-serif;color:var(--paper);user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* ══ HEADER ══ */
.header{
  position:fixed;top:0;left:0;right:0;z-index:30;
  display:flex;flex-direction:column;gap:.45rem;padding:.6rem 1.25rem .5rem;
  background:rgba(10,10,12,.9);backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(255,255,255,.06);
}
.htop{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.brand{display:flex;flex-direction:column;align-items:center;line-height:1.05}
.brand b{font-family:'Space Grotesk',sans-serif;font-weight:900;font-size:1.05rem;letter-spacing:.2em;color:var(--gold)}
.brand span{font-size:.58rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.32);margin-top:.12rem}
.tag{justify-self:end;font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:.3rem .65rem}
.tag b{color:var(--gold)}

.tabs{display:flex;flex-wrap:wrap;justify-content:center;gap:.3rem}
.tab{
  font-family:'Space Grotesk',sans-serif;font-size:.62rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:.34rem .8rem;border-radius:999px;border:1px solid transparent;color:rgba(255,255,255,.35);
  white-space:nowrap;transition:all .18s;
}
.tab:hover{color:rgba(255,255,255,.75);border-color:rgba(255,255,255,.18)}
.tab.active{color:var(--tc,var(--gold));border-color:var(--tc,var(--gold));background:rgba(255,255,255,.06)}
.tab .dot{display:inline-block;width:5px;height:5px;border-radius:50%;margin-left:.4rem;vertical-align:middle;opacity:0}
.tab.g-a .dot{background:var(--s4);opacity:1;box-shadow:0 0 6px rgba(255,217,74,.6)}
.tab.g-b .dot{background:var(--ok);opacity:1}
.tab.g-c .dot{background:#7dd3fc;opacity:1}
.tab.g-d .dot{background:var(--wrong);opacity:1}
@media(max-width:640px){.tab{padding:.26rem .6rem;font-size:.56rem}}

/* ══ HUD ══ */
.hud{
  position:fixed;top:var(--header-h);left:0;right:0;height:var(--hud-h);z-index:25;
  display:flex;flex-direction:column;gap:.4rem;padding:.5rem 1rem .4rem;
  background:rgba(10,10,12,.86);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.05);
}
.hudtop{display:flex;align-items:center;justify-content:space-between;gap:.7rem;font-family:'DM Mono',monospace;font-size:.64rem;color:var(--faint)}
.hstat{display:flex;align-items:center;gap:.5rem}
.hstat b{font-family:'Space Grotesk',sans-serif;font-weight:900;font-size:1rem;color:var(--paper);font-variant-numeric:tabular-nums}
.combo{color:var(--faint);transition:color .15s,transform .15s}
.combo.live{color:var(--accent)}
.combo.pop{transform:scale(1.3)}
.clock{font-family:'Space Grotesk',sans-serif;font-weight:800;color:var(--paper);font-variant-numeric:tabular-nums}
.clock.low{color:var(--wrong)}
.speeds{display:flex;gap:.16rem}
.spd{font-family:'DM Mono',monospace;font-size:.52rem;letter-spacing:.06em;text-transform:uppercase;
  padding:.14rem .4rem;border-radius:99px;border:1px solid transparent;color:rgba(255,255,255,.24)}
.spd.on{color:var(--accent);border-color:rgba(var(--accent-rgb),.45);background:rgba(var(--accent-rgb),.1)}
.mutebtn{opacity:.55;font-size:.8rem}
.mutebtn.off{opacity:.28}
@media(max-width:600px){.speeds{display:none}}

/* the ladder — five marks, filled fresh every round */
.ladder{display:flex;align-items:center;justify-content:center;gap:.35rem}
.rung{display:flex;flex-direction:column;align-items:center;gap:.12rem;width:38px}
.rung .d{position:relative;width:15px;height:15px}
.rung .d svg{width:100%;height:100%}
.rung:not(.done):not(.cur) svg{opacity:.4}
.rung .lb{font-family:'DM Mono',monospace;font-size:.4rem;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.rung.cur .lb{color:var(--accent)}
.link{width:clamp(6px,2vw,16px);height:1px;background:rgba(255,255,255,.12);margin-top:8px}
.link.done{background:var(--gold)}
.rung.pop svg{animation:rpop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes rpop{0%{transform:scale(1)}35%{transform:scale(1.8)}100%{transform:scale(1)}}

/* ══ FIELD ══ */
.field{
  position:fixed;top:calc(var(--header-h) + var(--hud-h));left:0;right:0;bottom:var(--lane-h);
  overflow:hidden;background:radial-gradient(ellipse at 50% 108%,rgba(var(--grp-rgb),.10),transparent 60%);
}
.field::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:1;
  background-image:repeating-linear-gradient(0deg,transparent 0,transparent calc(20% - 1px),rgba(255,255,255,.035) 20%);
}
.field::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:4;
  background:radial-gradient(ellipse at 50% 38%,transparent 58%,rgba(9,9,11,.74) 100%)}
.strike{position:absolute;left:0;right:0;bottom:0;height:2px;z-index:5;
  background:linear-gradient(90deg,transparent,rgba(var(--accent-rgb),.7),transparent)}
.strike.beat{box-shadow:0 0 16px 2px rgba(var(--accent-rgb),.5)}

.card{
  position:absolute;left:50%;top:0;width:min(92%,620px);transform:translate(-50%,-100%);
  display:flex;flex-direction:column;align-items:center;gap:.5rem;
  padding:.9rem 1.2rem 1rem;border-radius:.8rem;text-align:center;
  background:linear-gradient(178deg,rgba(24,24,27,.97),rgba(14,14,16,.99));
  border:1px solid rgba(201,169,97,.22);box-shadow:0 .6rem 1.6rem rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);
}
.card .sent{font-family:'DM Sans',sans-serif;font-weight:600;font-size:clamp(1rem,3vw,1.28rem);line-height:1.45;color:var(--paper)}
.card .sent .blank{display:inline-block;min-width:2.8em;margin:0 .15em;border-bottom:2px dashed rgba(var(--accent-rgb),.55);color:var(--accent);font-weight:800}
.card .sent mark{background:none;color:var(--gold);font-weight:700;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:.18em}
.card .grp{font-family:'DM Mono',monospace;font-size:.56rem;letter-spacing:.16em;text-transform:uppercase;color:var(--grp-color,var(--gold))}
.card.hit{border-color:var(--ok);background:linear-gradient(178deg,rgba(74,102,26,.92),rgba(36,52,14,.96))}
.card.miss{border-color:var(--wrong);background:linear-gradient(178deg,rgba(112,42,38,.92),rgba(54,20,18,.96))}

.tapstart{position:absolute;left:50%;bottom:1.1rem;transform:translateX(-50%);z-index:9;
  font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);background:rgba(10,10,10,.82);border:1px solid rgba(var(--accent-rgb),.35);
  border-radius:999px;padding:.4rem 1rem;pointer-events:none;transition:opacity .4s;white-space:nowrap}
.tapstart.gone{opacity:0}

/* ── START CARD ──
   Shown the first time and again whenever a different set is opened, so the
   instruction is never more than a set-switch away. Chalk-on-slate reads as
   "someone wrote this for you" rather than as UI chrome, and the arrow
   points straight down at the lanes it's describing. */
#startcard{
  position:absolute;inset:0;z-index:14;display:none;align-items:center;justify-content:center;
  background:rgba(6,6,7,.82);backdrop-filter:blur(3px);
}
#startcard.show{display:flex;animation:scIn .32s ease both}
@keyframes scIn{from{opacity:0}to{opacity:1}}
.sc-note{
  position:relative;max-width:min(90%,480px);text-align:center;
  background:linear-gradient(160deg,#1e2422,#141917);
  border:1px solid rgba(255,255,255,.16);border-radius:12px;
  padding:1.4rem 1.6rem 1.5rem;box-shadow:0 22px 60px rgba(0,0,0,.75),inset 0 0 60px rgba(255,255,255,.02);
  animation:chalkIn .45s cubic-bezier(.22,1,.36,1) both;
}
@keyframes chalkIn{from{transform:translateY(10px) rotate(-.6deg);opacity:0}to{transform:none;opacity:1}}
.sc-note p{
  font-family:'Caveat',cursive;font-size:clamp(1.5rem,4vw,2rem);line-height:1.3;
  color:#f4f2ec;text-shadow:0 0 12px rgba(255,255,255,.28),0 1px 0 rgba(0,0,0,.4);
}
.sc-note p b{color:var(--accent);font-weight:700;text-shadow:0 0 16px rgba(255,217,74,.55)}
.sc-go{
  margin-top:1.05rem;font-family:'Caveat',cursive;font-size:clamp(1.3rem,3.2vw,1.65rem);
  padding:.3rem 1.9rem .4rem;border-radius:999px;border:2px solid var(--accent);color:var(--accent);
  text-shadow:0 0 14px rgba(255,217,74,.45);animation:chalkPulse 1.9s ease-in-out infinite;
  transition:background .15s,color .15s;
}
.sc-go:hover{background:var(--accent);color:#12100a;text-shadow:none;animation:none}
@keyframes chalkPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,217,74,0)}50%{box-shadow:0 0 0 7px rgba(255,217,74,.10)}}
.sc-arrow{position:absolute;left:50%;top:100%;width:60px;height:64px;transform:translateX(-50%);pointer-events:none}
.sc-arrow path{
  fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linecap:round;
  filter:drop-shadow(0 0 6px rgba(255,217,74,.5));
  stroke-dasharray:120;stroke-dashoffset:120;animation:drawArrow .7s ease .25s forwards;
}
@keyframes drawArrow{to{stroke-dashoffset:0}}

/* ══ LANES ══ */
.lanes{position:fixed;bottom:0;left:0;right:0;height:var(--lane-h);z-index:20;
  display:grid;grid-template-columns:repeat(2,1fr);gap:.4rem;padding:.5rem .5rem .7rem;
  background:rgba(10,10,12,.96);border-top:1px solid rgba(255,255,255,.08)}
@media(min-width:720px){.lanes{grid-template-columns:repeat(4,1fr)}}
.lane{position:relative;display:flex;align-items:center;justify-content:center;gap:.4rem;
  border-radius:.6rem;border:1.5px solid var(--lc);background:color-mix(in srgb,var(--lc) 11%,transparent);
  font-family:'DM Sans',sans-serif;font-weight:700;padding:0 .5rem;
  transition:transform .09s,background .12s,box-shadow .12s}
.lane .p{font-size:clamp(.78rem,2.6vw,.98rem);color:var(--paper);line-height:1.25;text-align:center}
.lane .k{font-family:'DM Mono',monospace;font-size:.5rem;font-weight:400;color:rgba(255,255,255,.24);flex-shrink:0}
.lane:active,.lane.tap{transform:translateY(3px);background:color-mix(in srgb,var(--lc) 30%,transparent);
  box-shadow:0 0 20px color-mix(in srgb,var(--lc) 40%,transparent)}
.lane.correct{background:rgba(171,195,47,.38);border-color:var(--ok);box-shadow:0 0 24px rgba(171,195,47,.45)}
.lane.wrongtap{background:rgba(232,106,92,.3);border-color:var(--wrong)}

/* ══ FX ══ */
.spark{position:absolute;width:5px;height:5px;border-radius:50%;pointer-events:none;z-index:8}
.flash{position:absolute;width:70px;height:70px;border-radius:50%;pointer-events:none;z-index:8;
  background:radial-gradient(circle,#fff 0%,var(--accent) 35%,rgba(var(--accent-rgb),0) 70%)}
.banner{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.8);z-index:35;
  font-family:'Space Grotesk',sans-serif;font-weight:900;font-size:clamp(1.2rem,5.5vw,2.1rem);
  letter-spacing:.1em;text-transform:uppercase;opacity:0;pointer-events:none;text-align:center;
  text-shadow:0 0 26px currentColor;transition:opacity .18s,transform .35s cubic-bezier(.2,1.6,.4,1)}
.banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.slide-flash{animation:sflash .8s ease-out}
@keyframes sflash{0%{box-shadow:inset 0 0 0 0 var(--fc,rgba(255,217,74,.5))}30%{box-shadow:inset 0 0 60px 4px var(--fc,rgba(255,217,74,.5))}100%{box-shadow:inset 0 0 0 0 rgba(0,0,0,0)}}

/* ══ SUMMARY ══ */
.over{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:1.2rem;
  background:rgba(6,6,7,.4);backdrop-filter:blur(2px)}
.over.show{display:flex}
.over-card{position:relative;width:100%;max-width:23rem;max-height:min(80vh,34rem);overflow-y:auto;
  display:flex;flex-direction:column;align-items:center;gap:.4rem;text-align:center;
  padding:1.7rem 1.5rem 1.4rem;border-radius:1.1rem;
  background:linear-gradient(165deg,rgba(24,24,27,.98),rgba(13,13,15,.99));
  border:1px solid rgba(201,169,97,.25);box-shadow:0 20px 55px rgba(0,0,0,.6),0 0 40px rgba(201,169,97,.06);
  animation:cardIn .28s cubic-bezier(.2,1,.4,1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.over .closex{position:absolute;top:.55rem;right:.7rem;width:26px;height:26px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:1rem;line-height:1;
  color:var(--faint);border:1px solid rgba(255,255,255,.12)}
.over .closex:hover{color:var(--paper);border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.06)}
.over .eyebrow{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
.over .score{font-family:'Space Grotesk',sans-serif;font-weight:900;font-size:clamp(2rem,7vw,2.7rem);font-variant-numeric:tabular-nums;margin:.15rem 0}
.over .score .gr{font-size:.5em;margin-left:.3rem;vertical-align:.35em}
.g-a{color:var(--s4)} .g-b{color:var(--ok)} .g-c{color:#7dd3fc} .g-d{color:var(--wrong)}
.over .gword{font-family:'DM Mono',monospace;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.stats{display:flex;gap:1.4rem;margin:.7rem 0 .3rem;font-family:'DM Mono',monospace;font-size:.7rem;color:var(--dim)}
.stats div{display:flex;flex-direction:column;align-items:center;gap:.12rem}
.stats b{font-family:'Space Grotesk',sans-serif;font-size:1.05rem;color:var(--paper)}
.missed{margin-top:.6rem;width:100%;text-align:left;font-size:.8rem;line-height:1.75;color:var(--dim)}
.missed .mi{margin-bottom:.4rem;padding-bottom:.4rem;border-bottom:1px dashed rgba(255,255,255,.1)}
.missed .mi:last-child{border-bottom:none}
.missed b{color:var(--gold)}
.recap{width:100%;margin-top:.8rem;padding-top:.7rem;border-top:1px dashed rgba(255,255,255,.12)}
.recapLabel{font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:.45rem}
.chips{display:flex;flex-wrap:wrap;gap:.35rem;justify-content:center}
.chip{padding:.28rem .6rem;border-radius:999px;font-family:'DM Mono',monospace;font-size:.6rem;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);color:var(--dim)}
.chip.done{background:rgba(171,195,47,.2);border-color:var(--ok);color:#e8ffb0}
.chip.done::before{content:'✓ ';opacity:.8}
.acts{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;margin-top:1.1rem}
.go{padding:.72rem 1.6rem;border-radius:99px;background:var(--accent);color:#12100a;
  font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase}
.quiet{padding:.7rem 1.4rem;border-radius:99px;color:var(--dim);border:1px solid rgba(255,255,255,.16);
  font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;font-family:'Space Grotesk',sans-serif;font-weight:700}
.quiet:hover{color:var(--paper)}

#stageup{position:fixed;inset:0;z-index:45;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;
  background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,.55),rgba(0,0,0,.94));backdrop-filter:blur(3px);cursor:pointer}
#stageup.show{display:flex}
#stageup svg{width:88px;height:88px;margin-bottom:.6rem;filter:drop-shadow(0 0 22px var(--gc,rgba(255,217,74,.6)))}
#stageup .eb{font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}
#stageup .nm{font-family:'Space Grotesk',sans-serif;font-weight:900;font-size:clamp(1.7rem,5.5vw,2.4rem);margin:.15rem 0 .5rem}
#stageup .ds{font-size:.76rem;color:var(--dim);max-width:300px}
#stageup .tp{font-family:'DM Mono',monospace;font-size:.58rem;color:var(--faint);margin-top:1.3rem}

.loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0a0a0c;z-index:99}
.ld{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:ld 1.2s ease-in-out infinite}
@keyframes ld{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1.3)}}

@media(max-width:600px){
  :root{--lane-h:168px}
  .card{width:94%;padding:.75rem .9rem .85rem}
  .card .sent{font-size:1.08rem;line-height:1.5}
  .lane .p{font-size:.92rem}
}
@media(max-width:399px){
  .lanes{grid-template-columns:1fr}
  :root{--lane-h:196px}
}
@media(max-height:520px) and (max-width:900px){
  :root{--header-h:104px}
  .brand span{display:none}
  .tag{display:none}
}
@media(prefers-reduced-motion:reduce){.card,.lane,.combo,.banner{transition:none!important}}
</style>
</head>
<body>

<div class="loading" id="loading"><div class="ld"></div></div>

<header class="header">
  <div class="htop">
    <span></span>
    <div class="brand"><b>INTUITY</b><span>Tense Rush</span></div>
    <span class="tag">Level <b>B2–C1</b></span>
  </div>
  <div class="tabs" id="tabs"></div>
</header>

<div class="hud">
  <div class="hudtop">
    <span class="hstat">score <b id="score">0</b></span>
    <span class="speeds" id="speeds">
      <button class="spd" data-s="relaxed">Relaxed</button>
      <button class="spd" data-s="steady">Steady</button>
      <button class="spd" data-s="quick">Quick</button>
    </span>
    <span class="hstat combo" id="combo">×1</span>
    <button class="mutebtn" id="muteBtn" title="Sound on/off">🔊</button>
    <span class="clock" id="clock">1:15</span>
  </div>
  <div class="ladder" id="ladder"></div>
</div>

<div class="field" id="field">
  <div class="strike" id="strike"></div>
  <div class="tapstart" id="tapStart">Tap the correct form · keys 1–4</div>
  <div id="startcard">
    <div class="sc-note">
      <p>Read the sentence and pick the right tense — <b>tap the correct form</b> as it comes down.</p>
      <button class="sc-go" id="scGo">Click to start</button>
      <svg class="sc-arrow" viewBox="0 0 60 64">
        <path d="M30 2 C30 24, 20 34, 30 56"/>
        <path d="M23 48 L30 59 L37 48"/>
      </svg>
    </div>
  </div>
</div>

<div class="lanes" id="lanes"></div>
<div class="banner" id="banner"></div>

<div class="over" id="over">
  <div class="over-card">
    <button class="closex" id="closeX" aria-label="Close">×</button>
    <div class="eyebrow" id="ovGroup">GROUP</div>
    <div class="score" id="ovScore"></div>
    <div class="gword" id="ovWord"></div>
    <div class="stats">
      <div><b id="sHit">0</b><span>hit</span></div>
      <div><b id="sMiss">0</b><span>missed</span></div>
      <div><b id="sBest">0</b><span>best combo</span></div>
    </div>
    <div class="missed" id="ovMissed"></div>
    <div class="recap" id="recap">
      <div class="recapLabel">All items in this set</div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="acts">
      <button class="quiet" id="againBtn">↺ Same set again</button>
      <button class="go" id="nextBtn">Next set →</button>
    </div>
  </div>
</div>

<div id="stageup">
  <svg id="suIcon" viewBox="0 0 24 24"></svg>
  <div class="eb">New stage</div>
  <div class="nm" id="suName"></div>
  <div class="ds" id="suDesc"></div>
  <div class="tp">tap to continue</div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════
   DATA — hard-coded, curated for B2/C1, eight tense-contrast sets.
   Each item: cue + blank + after, the correct form, three grammatically
   parallel distractors (same subject, different tense — the real
   confusion), a short rule as the miss-note, and words to underline as
   the clue the sentence actually gives you.
   ══════════════════════════════════════════════════════════════════════ */
const GROUPS = [
{ id:'pres', label:'Present', color:'#61b5ed', desc:'Simple vs continuous — routine vs right now', items:[
  { cue:"I usually drive to work, but today I", after:"the bus.", mark:["usually","today"],
    answer:"am taking", options:["am taking","take","was taking","have taken"],
    note:"A one-off change from a routine → Present Continuous, not Present Simple." },
  { cue:"Water", after:"at 100°C.", mark:[],
    answer:"boils", options:["boils","is boiling","boiled","has boiled"],
    note:"A permanent scientific fact → Present Simple." },
  { cue:"Listen! Someone", after:"the piano upstairs.", mark:["Listen"],
    answer:"is playing", options:["is playing","plays","played","has played"],
    note:"Happening at the exact moment of speaking → Present Continuous." },
  { cue:"My train", after:"at 7:15 tomorrow morning.", mark:["tomorrow"],
    answer:"leaves", options:["leaves","is leaving","will leave","has left"],
    note:"A fixed timetable → Present Simple, even with a future time word." },
  { cue:"She", after:"her keys constantly — it drives me mad!", mark:["constantly"],
    answer:"is always losing", options:["is always losing","always loses","was always losing","has always lost"],
    note:"'always' + Present Continuous = a complaint about a repeated habit." },
  { cue:"He", after:"in London these days, while his flat is being renovated.", mark:["these days"],
    answer:"is staying", options:["is staying","stays","stayed","has stayed"],
    note:"A temporary situation, not a permanent one → Present Continuous." }
]},
{ id:'pp', label:'Perfect', color:'#c084fc', desc:'Present perfect simple vs continuous', items:[
  { cue:"They met in 2019, so they", after:"each other for five years now.", mark:["for","now"],
    answer:"have known", options:["have known","knew","are knowing","will have known"],
    note:"'know' is a state verb — the simple form even with 'for'." },
  { cue:"I", after:"Spanish for three years, and I still have a lot to learn.", mark:["for","still"],
    answer:"have been studying", options:["have been studying","studied","study","had studied"],
    note:"An action continuing up to now → Present Perfect Continuous." },
  { cue:"She's exhausted because she", after:"for an hour.", mark:["because"],
    answer:"has been running", options:["has been running","ran","runs","had run"],
    note:"Recent activity with a visible result now → Present Perfect Continuous." },
  { cue:"I", after:"that book already, so I don't need to buy it.", mark:["already"],
    answer:"have read", options:["have read","am reading","had read","was reading"],
    note:"A completed action with a result now → Present Perfect Simple." },
  { cue:"How long", after:"for the bus?", mark:["How long"],
    answer:"have you been waiting", options:["have you been waiting","did you wait","are you waiting","had you been waiting"],
    note:"'How long' about an action still going on → Present Perfect Continuous." },
  { cue:"We", after:"Tom since last Christmas.", mark:["since"],
    answer:"haven't seen", options:["haven't seen","didn't see","aren't seeing","hadn't seen"],
    note:"'since' + a period continuing to now → Present Perfect." }
]},
{ id:'narr', label:'Narrative', color:'#5ED39B', desc:'Past simple, continuous and perfect together', items:[
  { cue:"When I arrived at the cinema, the film", after:"already.", mark:["already"],
    answer:"had started", options:["had started","started","was starting","has started"],
    note:"The earlier of two past actions → Past Perfect." },
  { cue:"While I", after:"home, I saw an old friend.", mark:["While"],
    answer:"was walking", options:["was walking","walked","had walked","have walked"],
    note:"A longer background action interrupted by a shorter one → Past Continuous." },
  { cue:"I", after:"snow before I moved to Canada.", mark:["before"],
    answer:"had never seen", options:["had never seen","never saw","have never seen","was never seeing"],
    note:"Experience before another past point → Past Perfect." },
  { cue:"As soon as I", after:"the news, I called my parents.", mark:["As soon as"],
    answer:"heard", options:["heard","was hearing","had heard","have heard"],
    note:"A short, complete past action → Past Simple." },
  { cue:"She was angry because someone", after:"her sandwich.", mark:["because"],
    answer:"had eaten", options:["had eaten","ate","was eating","has eaten"],
    note:"The cause happened even earlier in the past → Past Perfect." },
  { cue:"The children", after:"in the garden when it started to snow.", mark:["when"],
    answer:"were playing", options:["were playing","played","had played","have played"],
    note:"Background action already in progress → Past Continuous." }
]},
{ id:'ppast', label:'Past Perfect', color:'#fb923c', desc:'Simple vs continuous — completion vs duration', items:[
  { cue:"I was exhausted because I", after:"for twelve hours.", mark:["because","for"],
    answer:"had been working", options:["had been working","worked","was working","have been working"],
    note:"Duration leading up to a past result → Past Perfect Continuous." },
  { cue:"The ground was wet because it", after:"all night.", mark:["because","all night"],
    answer:"had been raining", options:["had been raining","rained","was raining","has been raining"],
    note:"Visible evidence in the past, explained by duration → Past Perfect Continuous." },
  { cue:"By the time we arrived, they", after:".", mark:["By the time"],
    answer:"had left", options:["had left","left","were leaving","have left"],
    note:"Simply completed before another past moment → Past Perfect Simple." },
  { cue:"He knew London well because he", after:"there for years.", mark:["because","for"],
    answer:"had been living", options:["had been living","lived","was living","has lived"],
    note:"An ongoing situation explaining a past state → Past Perfect Continuous." },
  { cue:"She failed her test because she", after:"enough.", mark:["because"],
    answer:"hadn't been practicing", options:["hadn't been practicing","didn't practice","wasn't practicing","hasn't been practicing"],
    note:"Repeated lack of activity before a past result → Past Perfect Continuous." },
  { cue:"After she", after:"dinner, she went to bed.", mark:["After"],
    answer:"had finished", options:["had finished","finished","was finishing","has finished"],
    note:"Simple completion before the next past action → Past Perfect Simple." }
]},
{ id:'fut', label:'Future', color:'#FFD94A', desc:'Will, going to, present forms for the future', items:[
  { cue:"Look at those clouds! It", after:"soon.", mark:["Look"],
    answer:"is going to rain", options:["is going to rain","will rain","rains","is raining"],
    note:"A prediction with present evidence → 'going to'." },
  { cue:"I think the home team", after:"tonight.", mark:["I think"],
    answer:"will win", options:["will win","are going to win","are winning","win"],
    note:"An opinion-based prediction, no evidence → 'will'." },
  { cue:"We", after:"Sarah for lunch tomorrow at 1pm.", mark:["tomorrow"],
    answer:"are meeting", options:["are meeting","will meet","are going to meet","meet"],
    note:"A fixed personal arrangement, time and place set → Present Continuous." },
  { cue:"The phone's ringing — I", after:"it.", mark:[],
    answer:"will answer", options:["will answer","am answering","answer","am going to answer"],
    note:"A decision made at the moment of speaking → 'will'." },
  { cue:"The train", after:"at 8:30 tomorrow morning.", mark:["tomorrow"],
    answer:"leaves", options:["leaves","will leave","is going to leave","is leaving"],
    note:"A fixed timetable → Present Simple." },
  { cue:"Watch out! That vase", after:"!", mark:["Watch out"],
    answer:"is going to fall", options:["is going to fall","will fall","falls","is falling"],
    note:"A prediction based on what you can see right now → 'going to'." }
]},
{ id:'futperf', label:'Future Perfect', color:'#ff7a45', desc:'Completion and duration by a future point', items:[
  { cue:"By next June, we", after:"in this house for ten years.", mark:["By next June","for"],
    answer:"will have been living", options:["will have been living","will have lived","are living","have been living"],
    note:"Duration reaching up to a future point → Future Perfect Continuous." },
  { cue:"She", after:"by 5pm, so call after that.", mark:["by"],
    answer:"will have finished", options:["will have finished","finishes","is finishing","will finish"],
    note:"Completed before a stated future time → Future Perfect." },
  { cue:"Don't call between 8 and 9 — I", after:"dinner.", mark:["between 8 and 9"],
    answer:"will be having", options:["will be having","will have","am having","will have had"],
    note:"In progress at a specific future time → Future Continuous." },
  { cue:"By the time you read this, I", after:"the country.", mark:["By the time"],
    answer:"will have already left", options:["will have already left","am already leaving","will already leave","have already left"],
    note:"Completed before a future reference point → Future Perfect." },
  { cue:"This time tomorrow, I", after:"to New York.", mark:["This time tomorrow"],
    answer:"will be flying", options:["will be flying","fly","will have flown","am flying"],
    note:"In progress at a specific future moment → Future Continuous." },
  { cue:"By the end of the year, he", after:"here for twenty years.", mark:["By the end of the year","for"],
    answer:"will have been teaching", options:["will have been teaching","will have taught","teaches","has been teaching"],
    note:"Ongoing duration up to a future point → Future Perfect Continuous." }
]},
{ id:'cond', label:'Conditionals', color:'#7dd3fc', desc:'If and wish across real, unreal and past', items:[
  { cue:"If it", after:"tomorrow, we'll stay at home.", mark:["If"],
    answer:"rains", options:["rains","will rain","is raining","rained"],
    note:"First Conditional: if + Present Simple, will + infinitive." },
  { cue:"If I", after:", I would have come earlier.", mark:["would have"],
    answer:"had known", options:["had known","knew","have known","would know"],
    note:"Third Conditional: if + Past Perfect, would have + past participle." },
  { cue:"If she", after:"harder, she would pass the exam.", mark:["would"],
    answer:"studied", options:["studied","studies","had studied","would study"],
    note:"Second Conditional: if + Past Simple, would + infinitive." },
  { cue:"I wish I", after:"harder for that exam.", mark:["wish"],
    answer:"had studied", options:["had studied","studied","have studied","would study"],
    note:"A regret about the past → wish + Past Perfect." },
  { cue:"I wish it", after:"raining — I want to go outside.", mark:["wish"],
    answer:"would stop", options:["would stop","stopped","stops","had stopped"],
    note:"Wishing a present situation would change → wish + would." },
  { cue:"Unless you", after:"now, you'll miss the bus.", mark:["Unless"],
    answer:"leave", options:["leave","will leave","are leaving","left"],
    note:"After 'unless', Present Simple carries the future meaning." }
]},
{ id:'mix', label:'C1 Mix', color:'#ff4d4d', desc:'Every tense together — the real test', items:[
  { cue:"By next summer, they", after:"married for ten years.", mark:["By next summer","for"],
    answer:"will have been", options:["will have been","are","have been","were"],
    note:"Future Perfect for a state whose duration reaches into the future." },
  { cue:"The ground is wet because it", after:".", mark:["because"],
    answer:"has been raining", options:["has been raining","rained","was raining","had been raining"],
    note:"Recent activity with a present result → Present Perfect Continuous." },
  { cue:"It's the best film I", after:"ever seen.", mark:["ever"],
    answer:"have", options:["have","had","was","am"],
    note:"After a superlative + 'ever', about your life so far → Present Perfect." },
  { cue:"She told me she", after:"London before.", mark:["before"],
    answer:"had never visited", options:["had never visited","never visited","has never visited","was never visiting"],
    note:"Reported speech shifts the tense one step back → Past Perfect." },
  { cue:"I can't find my keys — I", after:"them somewhere.", mark:[],
    answer:"have lost", options:["have lost","lost","am losing","had lost"],
    note:"A past action with a present result → Present Perfect." },
  { cue:"When he woke up, he realised he", after:"his alarm.", mark:["When"],
    answer:"had missed", options:["had missed","missed","was missing","has missed"],
    note:"An earlier past action, discovered later → Past Perfect." },
  { cue:"By the time she's 30, she", after:"50 countries.", mark:["By the time"],
    answer:"will have visited", options:["will have visited","visits","has visited","will visit"],
    note:"An achievement expected by a future deadline → Future Perfect." },
  { cue:"He", after:"late — it's so annoying!", mark:[],
    answer:"is always arriving", options:["is always arriving","always arrives","was always arriving","has always arrived"],
    note:"'always' + Present Continuous for an annoying repeated habit." }
]}
];

const SPEEDS = { relaxed:1.5, steady:1.05, quick:.75 };
let speed = localStorage.getItem('tenserush-speed') || 'relaxed';
const BPM = 84, BEAT = 60000/BPM, ROUND_MS = 75000;
const STAGES = [
  { label:'Spark', color:'var(--s0)', glow:'rgba(205,191,142,.5)', desc:'You are starting to feel the difference between the tenses.' },
  { label:'Ember', color:'var(--s1)', glow:'rgba(232,147,90,.55)', desc:'The reasoning is sticking. Keep going.' },
  { label:'Flame', color:'var(--s2)', glow:'rgba(255,122,69,.6)', desc:'Fast, confident choices. Halfway to Crown.' },
  { label:'Blaze', color:'var(--s3)', glow:'rgba(255,77,77,.65)', desc:'Nearly flawless under time pressure.' },
  { label:'Crown', color:'var(--s4)', glow:'rgba(255,217,74,.8)', desc:'A perfect run. This is exam-ready.' },
];
const TIERS = [2,4,6,8,10]; // hits needed per rung, this round

const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const shuffle = a => { const b=[...a]; for(let i=b.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[b[i],b[j]]=[b[j],b[i]];} return b; };

let groupIdx = 0, running = false, startedAt = 0, rafId = null, started = false, lastShownGroup = null;
let seq = [], seqAt = 0, live = null, lanes = [];
let score = 0, combo = 0, bestCombo = 0, hits = 0, misses = 0, missLog = [], caught = new Set();
let tier = -1, nextSpawnAt = 0, lastBeat = -1;

/* ── memory: weight items this learner has actually missed ── */
const MEM_KEY = 'tenserush-mem';
function loadMem(){ try{ return JSON.parse(localStorage.getItem(MEM_KEY)||'{}'); }catch(e){ return {}; } }
function saveMem(m){ try{ localStorage.setItem(MEM_KEY,JSON.stringify(m)); }catch(e){} }
const memKey = (g,i) => g+':'+i;
function noteResult(g,i,ok){ const m=loadMem(),k=memKey(g,i),e=m[k]||{miss:0}; e.miss = ok ? Math.max(0,e.miss-1) : e.miss+1; m[k]=e; saveMem(m); }
function weightOf(g,i,mem){ const e = mem[memKey(g,i)]; return e ? 1+Math.min(6,e.miss*3) : 2; }

/* ── progress: best score/grade per group ── */
const PROG_KEY = 'tenserush-progress';
function loadProg(){ try{ return JSON.parse(localStorage.getItem(PROG_KEY)||'{}'); }catch(e){ return {}; } }
function saveProg(p){ try{ localStorage.setItem(PROG_KEY,JSON.stringify(p)); }catch(e){} }
let progress = loadProg();

/* ── Cambridge-style scale, B2 First anchored ── */
function scaleScore(acc){
  const A=[[0,140],[.55,160],[.72,173],[.85,180],[1,190]];
  for (let i=1;i<A.length;i++){ const [a0,s0]=A[i-1],[a1,s1]=A[i]; if (acc<=a1) return Math.round(s0+(acc-a0)/(a1-a0)*(s1-s0)); }
  return 190;
}
const gradeOf = s => s>=180?['A','Excellent','g-a']:s>=173?['B','Very good','g-b']:s>=160?['C','Pass','g-c']:['D','Try again','g-d'];

/* ── audio: one clean tone engine shared by hits, misses and the beat ── */
let ac=null, master=null, soundOn = localStorage.getItem('tenserush-sound') !== 'off';
function audio(){ if(!ac){ ac=new (window.AudioContext||window.webkitAudioContext)(); master=ac.createGain(); master.gain.value=.5; master.connect(ac.destination);} if(ac.state==='suspended') ac.resume(); return ac; }
function tone(f,d,ty,v,when,glide){ if(!soundOn||!ac) return; const t0=when||ac.currentTime; const o=ac.createOscillator(),g=ac.createGain();
  o.type=ty||'sine'; o.frequency.setValueAtTime(f,t0); if(glide) o.frequency.exponentialRampToValueAtTime(glide,t0+d);
  g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(v||.14,t0+.008); g.gain.exponentialRampToValueAtTime(.0008,t0+d);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0+d+.02); }
function playBeat(){ if(!ac) return; const t=ac.currentTime; tone(58,.11,'sine',.28,t,34); if(combo>=4) tone(174,.16,'triangle',.06,t); }
function sfxHit(m){ if(!ac) return; const t=ac.currentTime,b=523.25*Math.pow(1.0595,Math.min(12,m)); tone(b,.1,'triangle',.16,t); tone(b*1.5,.14,'triangle',.12,t+.05); }
function sfxMiss(){ if(!ac) return; tone(180,.22,'sawtooth',.13,ac.currentTime,90); }
function sfxTier(){ if(!ac) return; const t=ac.currentTime; [440,660,880].forEach((f,i)=>tone(f,.22,'sine',.15,t+i*.08)); }

/* ── sequence building ── */
function buildSequence(g){
  const mem = loadMem(), bag = g.items.map((it,i)=>({it,i,w:weightOf(g.id,i,mem)}));
  const out = [];
  // enough laps to comfortably fill the round, reshuffled each lap
  for (let lap=0; lap<6; lap++){
    const pool = bag.map(x=>({...x}));
    while (pool.length){
      let total = pool.reduce((s,x)=>s+x.w,0), r = Math.random()*total, c=0, j=0;
      for (;j<pool.length;j++){ c+=pool[j].w; if (r<=c) break; }
      j = Math.min(j,pool.length-1);
      out.push(pool[j]); pool.splice(j,1);
    }
  }
  return out;
}
function fallMsFor(item){
  const len = (item.cue.length+item.after.length);
  const beats = Math.min(9, 4.4 + len/26);
  return beats * BEAT * (SPEEDS[speed]||1);
}

function paintLanes(options, correctText){
  lanes = options;
  const el = $('lanes');
  el.innerHTML = options.map((o,i)=>
    `<button class="lane" data-i="${i}" style="--lc:var(--grp-color)">
       <span class="p">${esc(o)}</span><span class="k">${i+1}</span></button>`).join('');
  el.querySelectorAll('.lane').forEach(b=>{
    b.addEventListener('pointerdown', e=>{ e.preventDefault(); firstTouch(); tapLane(+b.dataset.i); });
  });
}
function firstTouch(){ if (started) return; started = true; audio(); $('tapStart').classList.add('gone'); }

/* ── round ── */
function applyGroupColor(){
  const g = GROUPS[groupIdx];
  document.documentElement.style.setProperty('--grp-color', g.color);
  const rgb = hexToRgb(g.color);
  document.documentElement.style.setProperty('--grp-rgb', rgb.join(','));
}
function hexToRgb(h){ h=h.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }

function startRound(){
  running = false; cancelAnimationFrame(rafId);
  const g = GROUPS[groupIdx];
  seq = buildSequence(g); seqAt = 0; live = null; caught = new Set();
  score=0; combo=0; bestCombo=0; hits=0; misses=0; missLog=[]; tier=-1;
  $('score').textContent='0'; setCombo(0); renderLadder();
  $('field').querySelectorAll('.card').forEach(n=>n.remove());
  $('over').classList.remove('show');

  /* The note is not a one-time tutorial: it returns whenever a *different*
     set is opened, since the lane contents and pace genuinely change.
     Replaying the same set straight away (Retry) skips it — nothing new
     to explain. The clock does not run behind the note. */
  if (g.id === lastShownGroup){ startPlaying(); }
  else { lastShownGroup = g.id; showStartCard(); }
}
function showStartCard(){ $('startcard').classList.add('show'); }
function dismissStartCard(){
  $('startcard').classList.remove('show');
  if (!running) startPlaying();
}
function startPlaying(){
  running = true; startedAt = performance.now(); nextSpawnAt = 0; lastBeat = -1;
  rafId = requestAnimationFrame(loop);
}

function loop(now){
  if (!running) return;
  const t = now - startedAt;

  const b = Math.floor(t/BEAT);
  if (b !== lastBeat){ lastBeat=b; playBeat(); const s=$('strike'); s.classList.add('beat'); setTimeout(()=>s.classList.remove('beat'),90); }

  if (!live && t >= nextSpawnAt && seqAt < seq.length){
    spawn(seq[seqAt++], t);
  }

  const fh = $('field').clientHeight;
  if (live && !live.done){
    const p = (t-live.born)/live.fallMs;
    live.el.style.transform = `translate(-50%,${p*(fh+50)-50}px)`;
    if (p >= 1) resolveCard(null, t);
  } else if (live && live.done){
    if (t - live.doneAt > 380){ live.el.remove(); live = null; nextSpawnAt = t + BEAT*0.5; }
  }

  const leftMs = Math.max(0, ROUND_MS - t);
  $('clock').textContent = '0:' + String(Math.ceil(leftMs/1000)).padStart(2,'0');
  $('clock').classList.toggle('low', leftMs <= 10000);

  if (t >= ROUND_MS){ finish(); return; }
  if (seqAt >= seq.length && !live){ finish(); return; }
  rafId = requestAnimationFrame(loop);
}

function spawn(entry, t){
  const g = GROUPS[groupIdx], item = entry.it;
  const el = document.createElement('div');
  el.className = 'card';
  let sentence = esc(item.cue) + ' <span class="blank">____</span> ' + esc(item.after);
  (item.mark||[]).forEach(w => {
    const re = new RegExp('\\b'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i');
    sentence = sentence.replace(re, m => '<mark>'+m+'</mark>');
  });
  el.innerHTML = `<div class="grp">${esc(g.label)}</div><div class="sent">${sentence}</div>`;
  $('field').appendChild(el);
  const bonus = seqAt <= 1 ? BEAT*1.6 : 0;
  live = { el, entry, item, born:t, done:false, fallMs: fallMsFor(item)+bonus };
  paintLanes(shuffle(item.options), item.answer);
}

function tapLane(i){
  if (!running || !live || live.done) return;
  const el = $('lanes').querySelectorAll('.lane')[i];
  if (el){ el.classList.add('tap'); setTimeout(()=>el.classList.remove('tap'),110); }
  resolveCard(lanes[i], performance.now()-startedAt);
}

function resolveCard(chosen, t){
  if (!live || live.done) return;
  live.done = true; live.doneAt = t;
  const item = live.item, entry = live.entry, g = GROUPS[groupIdx];
  const ok = chosen === item.answer;
  const correctIdx = lanes.indexOf(item.answer);
  const laneEls = $('lanes').querySelectorAll('.lane');

  noteResult(g.id, entry.i, ok);

  if (ok){
    hits++; combo++; bestCombo = Math.max(bestCombo,combo); caught.add(entry.i);
    score += 100 * (1 + Math.floor(combo/4));
    live.el.classList.add('hit');
    if (laneEls[correctIdx]){ laneEls[correctIdx].classList.add('correct'); setTimeout(()=>laneEls[correctIdx].classList.remove('correct'),260); }
    sfxHit(combo); burst(live.el, combo>=8); setCombo(combo);
    checkTier();
  } else {
    misses++; combo=0; setCombo(0);
    missLog.push({ item, chosen });
    live.el.classList.add('miss');
    if (laneEls[correctIdx]){ laneEls[correctIdx].classList.add('correct'); setTimeout(()=>laneEls[correctIdx].classList.remove('correct'),420); }
    const wi = lanes.indexOf(chosen);
    if (chosen && laneEls[wi]){ laneEls[wi].classList.add('wrongtap'); setTimeout(()=>laneEls[wi].classList.remove('wrongtap'),300); }
    sfxMiss();
  }
  $('score').textContent = score;
}

function setCombo(n){
  const el = $('combo');
  el.textContent = '×' + (1+Math.floor(n/4)) + (n ? '  '+n : '');
  el.classList.toggle('live', n>=4);
  el.classList.add('pop'); setTimeout(()=>el.classList.remove('pop'),150);
}

function banner(txt,col){
  const b=$('banner'); b.textContent=txt; b.style.color=col;
  b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
  setTimeout(()=>b.classList.remove('show'),750);
}
function checkTier(){
  let nt = -1; for (let i=0;i<TIERS.length;i++) if (hits>=TIERS[i]) nt = i;
  if (nt <= tier) { renderLadder(); return; }
  tier = nt;
  const st = STAGES[tier];
  sfxTier();
  document.body.style.setProperty('--fc', st.glow);
  const field = $('field'); field.classList.remove('slide-flash'); void field.offsetWidth; field.classList.add('slide-flash');
  field.style.setProperty('--fc', st.glow);
  banner(st.label, st.color);
  renderLadder();
}
function burst(cardEl,big){
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const field=$('field'), fr=field.getBoundingClientRect(), r=cardEl.getBoundingClientRect();
  const cx=r.left+r.width/2-fr.left, cy=r.top+r.height/2-fr.top;
  const f=document.createElement('div'); f.className='flash';
  f.style.cssText+=`left:${cx}px;top:${cy}px;transform:translate(-50%,-50%)`;
  field.appendChild(f);
  f.animate([{transform:'translate(-50%,-50%) scale(.2)',opacity:1},{transform:`translate(-50%,-50%) scale(${big?3:2})`,opacity:0}],
    {duration:big?420:300,easing:'cubic-bezier(.1,.8,.2,1)'});
  setTimeout(()=>f.remove(),440);
  const COLS=['#FFD94A','#C9A961','#5ED39B','#61b5ed','#ffffff','#c084fc'];
  for (let i=0;i<(big?24:11);i++){
    const p=document.createElement('div'); p.className='spark';
    const col=COLS[(Math.random()*COLS.length)|0], sz=3+Math.random()*3;
    p.style.cssText+=`left:${cx}px;top:${cy}px;width:${sz}px;height:${sz}px;background:${col};box-shadow:0 0 ${sz*2.5}px ${col}`;
    field.appendChild(p);
    const a=Math.random()*Math.PI*2, d=40+Math.random()*(big?130:70), dur=600+Math.random()*350;
    p.animate([{transform:'translate(-50%,-50%) scale(1.1)',opacity:1},
      {transform:`translate(-50%,-50%) translate(${Math.cos(a)*d}px,${Math.sin(a)*d+45}px) scale(.2)`,opacity:0}],
      {duration:dur,easing:'cubic-bezier(.12,.75,.3,1)'});
    setTimeout(()=>p.remove(),dur+30);
  }
}

/* ── ladder rendering (round-local, resets each round) ── */
const CROWN = "M2 18l3-11 5 4 4-7 4 7 5-4 3 11H2z", FLAME = "M12 2c.4 2.6-1 4-2.4 5.6C8.2 9.3 7 11 7 13.2A5 5 0 0 0 12 18a5 5 0 0 0 5-4.8c0-1.6-.7-2.7-1.6-3.7.2 1.4-.3 2.3-1 2.9.3-2.6-1-4-1.6-5.5C12.4 5.6 12.3 3.7 12 2z";
function svgIcon(i,col){
  if (i===0) return `<circle cx="12" cy="12" r="4.5" fill="${col}"/>`;
  if (i===1) return `<circle cx="12" cy="12" r="5" fill="${col}"/><circle cx="12" cy="12" r="8" fill="none" stroke="${col}" stroke-opacity=".35"/>`;
  if (i===4) return `<path d="${CROWN}" fill="${col}"/>`;
  return `<path d="${FLAME}" fill="${col}"/>`;
}
function renderLadder(){
  const el = $('ladder'); el.innerHTML='';
  STAGES.forEach((st,i)=>{
    if (i>0) el.insertAdjacentHTML('beforeend', `<div class="link${i<=tier?' done':''}"></div>`);
    const cur = i===tier+1, done = i<=tier;
    el.insertAdjacentHTML('beforeend',
      `<div class="rung${done?' done':''}${cur?' cur':''}"><div class="d">${svgIcon(i, done?st.color:'rgba(255,255,255,.3)')}</div><div class="lb">${st.label}</div></div>`);
  });
}

/* ── tabs ── */
function bandClass(score){ if (score===null) return ''; if (score>=180) return ' g-a'; if (score>=173) return ' g-b'; if (score>=160) return ' g-c'; return ' g-d'; }
function buildTabs(){
  const wrap = $('tabs'); wrap.innerHTML='';
  GROUPS.forEach((g,i)=>{
    const rec = progress[g.id];
    const btn = document.createElement('button');
    btn.className = 'tab' + (i===groupIdx?' active':'') + bandClass(rec?rec.best:null);
    btn.style.setProperty('--tc', g.color);
    btn.innerHTML = esc(g.label) + '<span class="dot"></span>';
    btn.title = g.desc + (rec ? ` · best ${rec.best} (${gradeOf(rec.best)[0]})` : '');
    btn.addEventListener('click', ()=> switchGroup(i));
    wrap.appendChild(btn);
  });
}
function switchGroup(i){ groupIdx=i; applyGroupColor(); buildTabs(); startRound(); }

/* ── summary ── */
function renderChips(){
  const g = GROUPS[groupIdx], row = $('chips');
  row.innerHTML='';
  g.items.forEach((it,i)=>{
    const chip = document.createElement('span');
    chip.className = 'chip' + (caught.has(i)?' done':'');
    chip.textContent = it.answer;
    row.appendChild(chip);
  });
}
function finish(){
  running=false; cancelAnimationFrame(rafId);
  if (live) live.el.remove(); live=null;
  const total = hits+misses, acc = total ? hits/total : 0;
  const sc = scaleScore(acc), [letter,word,cls] = gradeOf(sc);

  const g = GROUPS[groupIdx], prev = progress[g.id] || {best:0};
  progress[g.id] = { best: Math.max(sc, prev.best||0) };
  saveProg(progress); buildTabs();

  $('ovGroup').textContent = g.label.toUpperCase() + ' · ' + g.desc;
  $('ovScore').className = 'score ' + cls;
  $('ovScore').innerHTML = sc + '<span class="gr">'+letter+'</span>';
  $('ovWord').textContent = word;
  $('sHit').textContent = hits; $('sMiss').textContent = misses; $('sBest').textContent = bestCombo;

  const seen = new Map();
  missLog.forEach(m => { const k = m.item.answer; if (!seen.has(k)) seen.set(k, { n:0, note:m.item.note }); seen.get(k).n++; });
  $('ovMissed').innerHTML = seen.size
    ? [...seen].map(([k,e]) => `<div class="mi"><b>${esc(k)}</b>${e.n>1?' ×'+e.n:''} — ${esc(e.note)}</div>`).join('')
    : '<div class="mi">Every item caught first time. Top band.</div>';

  renderChips();
  $('over').classList.add('show');
}
function closeOver(){ $('over').classList.remove('show'); }

/* ── stage-up (kept for parity, subtle — tier banners already fire mid-round) ── */

/* ── events ── */
document.addEventListener('keydown', e=>{
  if (e.key==='Escape' && $('over').classList.contains('show')){ closeOver(); return; }
  const i = ['1','2','3','4'].indexOf(e.key);
  if (i>=0 && i<lanes.length){ e.preventDefault(); firstTouch(); tapLane(i); }
  if (e.key==='m'||e.key==='M') toggleMute();
});
$('over').addEventListener('click', e => { if (e.target === $('over')) closeOver(); });
$('closeX').addEventListener('click', closeOver);
$('againBtn').addEventListener('click', ()=>{ firstTouch(); startRound(); });
$('nextBtn').addEventListener('click', ()=>{ switchGroup((groupIdx+1) % GROUPS.length); });
function toggleMute(){
  soundOn = !soundOn;
  try{ localStorage.setItem('tenserush-sound', soundOn?'on':'off'); }catch(e){}
  $('muteBtn').textContent = soundOn ? '🔊' : '🔇';
  $('muteBtn').classList.toggle('off', !soundOn);
}
$('muteBtn').addEventListener('click', ()=>{ firstTouch(); toggleMute(); });
function paintSpeed(){ document.querySelectorAll('.spd').forEach(b=>b.classList.toggle('on', b.dataset.s===speed)); }
document.querySelectorAll('.spd').forEach(b=>b.addEventListener('click', ()=>{
  speed=b.dataset.s; try{ localStorage.setItem('tenserush-speed',speed); }catch(e){} paintSpeed();
}));
$('scGo').addEventListener('click', ()=>{ firstTouch(); dismissStartCard(); });
$('field').addEventListener('pointerdown', firstTouch);

/* ── boot ── */
function syncHeader(){
  const h = document.querySelector('.header'), hu = document.querySelector('.hud');
  if (h) document.documentElement.style.setProperty('--header-h', h.offsetHeight+'px');
  if (hu) document.documentElement.style.setProperty('--hud-h', hu.offsetHeight+'px');
}
window.addEventListener('resize', syncHeader);
window.addEventListener('orientationchange', ()=>setTimeout(syncHeader,120));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(syncHeader);

function boot(){
  applyGroupColor(); buildTabs(); paintSpeed();
  $('muteBtn').textContent = soundOn ? '🔊' : '🔇';
  $('muteBtn').classList.toggle('off', !soundOn);
  syncHeader();
  $('loading').style.display = 'none';
  renderLadder();
  startRound();
  setTimeout(()=>{ if (!started) $('tapStart').classList.add('gone'); }, 6000);
}
boot();
</script>
