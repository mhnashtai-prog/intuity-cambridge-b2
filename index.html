<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>INTUITY — Cambridge B2 First</title>
<meta name="theme-color" content="#FAF7F2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..900&family=Geist+Mono:wght@400..600&family=Space+Grotesk:wght@700&family=Anton&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&display=swap" rel="stylesheet">
<style>
  :root{
    --stage:#FAF7F2;
    --paper:#FEFCF9;
    --ink:#2B2129;
    --soft:#5C4E52;
    --mute:#8B7B78;
    --rule:#D9C0A4;
    --clay:#B4653A;
    --spring:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow-x:hidden;}   /* nothing may widen the page */
  body{background:var(--stage);color:var(--ink);
    font-family:'Geist', system-ui, sans-serif;
    display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none;}
  
  /* ── THE MASTHEAD (10 Nov 2026, the teacher's layout) ───────────────────
     Three lines, all compact, under 3 cm on a phone:
       1 · Intuitive learning in the left corner, B2 First · Cambridge in the right
       2 · INTUITY, centred and widely spaced
       3 · Majid Nashtai under the title
     The review pill that sat under it moved to where the map's path begins. */
  .bar{flex:none;display:flex;flex-direction:column;align-items:center;
    padding:calc(12px + env(safe-area-inset-top,0px)) 16px 4px;text-align:center}
  .bar-top{align-self:stretch;display:flex;justify-content:space-between;align-items:center;
    font-family:'Geist Mono',ui-monospace,monospace;font-size:clamp(.56rem,2.5vw,.66rem);letter-spacing:.16em;
    text-transform:uppercase;color:var(--mute);white-space:nowrap;margin:0 0 52px}   /* about 9 mm on a phone */
  .bar-top b{font-weight:600;color:var(--soft)}
  /* a short screen (iPhone SE with its bars) keeps less air, so the map keeps its room */
  @media (max-height:600px){ .bar-top{margin-bottom:32px} }   /* room for the dots */
  .brand{margin:0;font-family:'Anton',Impact,sans-serif;text-transform:uppercase;font-weight:400;
    font-size:clamp(2rem,9vw,2.6rem);line-height:1;letter-spacing:.34em;margin-right:-.34em;color:#14110E}
  /* the I's dots (10 Nov 2026) are off until the teacher decides; the CSS is in git history (commit 8e292c22) */
  .byline{margin:7px 0 0;font-size:.75rem;letter-spacing:.02em;color:var(--soft)}

  .map{position:relative;flex:1;min-height:0;margin:0 10px calc(12px + env(safe-area-inset-bottom,0px));}
  @media(max-width:480px){ .map{margin:0 6px calc(10px + env(safe-area-inset-bottom,0px));} }
  .mapPath{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
  .mapPath .road{fill:none;stroke:var(--mute);stroke-width:.16;stroke-linecap:round;}
  .mapPath .stem{stroke:var(--rule);stroke-width:.4;}
  .mapPath .dot{fill:var(--paper);stroke:rgb(139,123,120);stroke-width:.3;}
  .mapPath .endDot{stroke:none;}

  .nodes{position:absolute;inset:0;}
  .node{position:absolute;transform:translateY(-50%);width:100%;}

  .pill{position:absolute;top:0;transform:translate(-50%,-50%);
    display:flex;align-items:center;border:none;background:none;padding:0;cursor:pointer;
    transition:transform .18s var(--spring);}
  .pill:active{transform:translate(-50%,-50%) scale(.96);}
  .pill:focus-visible{outline:2px solid var(--clay);outline-offset:6px;border-radius:999px;}

  .pill .circle{width:48px;height:48px;border-radius:50%;flex:none;position:relative;z-index:2;order:1;
    display:flex;align-items:center;justify-content:center;
    font-family:'Anton', Impact, sans-serif;font-size:1.27rem;letter-spacing:.02em;
    box-shadow:0 6px 15px rgba(30,24,16,.24);}
  .pill .rect{height:40px;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;order:2;
    border-radius:0 999px 999px 0;padding:0 22px 0 31px;margin-left:-18px;
    font-family:'Anton', Impact, sans-serif;text-transform:uppercase;
    font-size:.88rem;letter-spacing:.09em;text-indent:.09em;white-space:nowrap;
    box-shadow:0 6px 15px rgba(30,24,16,.2);}
  .pill .go{order:3;flex:none;width:16px;height:16px;margin:0 2px 0 -13px;
    position:relative;z-index:3;display:flex;align-items:center;justify-content:center;
    opacity:.42;transition:opacity .15s;}
  .pill.circle-right .go{order:0;margin:0 -13px 0 2px;transform:scaleX(-1);}
  .pill:hover .go{opacity:.72;}
  .pill .go svg{width:100%;height:100%;display:block;}

  .pill.circle-right .circle{order:2;margin-left:-13px;}
  .pill.circle-right .rect{order:1;margin-left:0;padding:0 33px 0 20px;
    border-radius:999px 0 0 999px;}

  .cap{position:absolute;top:0;transform:translateY(-50%);max-width:44%;}
  .cap .ct{font-size:0.6875rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;
    color:var(--ink);margin-bottom:3px;}
  .cap .cs{font-size:.72rem;line-height:1.3;color:var(--soft);}
  .cap.right{text-align:left;}
  .cap.left{text-align:right;}

  @media(max-width:560px){
    .pill .circle{width:51px;height:51px;font-size:1.29rem;
      box-shadow:0 6px 15px rgba(30,24,16,.24);}
    .pill .rect{height:41px;font-size:.78rem;letter-spacing:.07em;text-indent:.07em;
      padding:0 14px 0 24px;margin-left:-19px;
      box-shadow:0 6px 15px rgba(30,24,16,.2);}
    .pill.circle-right .circle{margin-left:-14px;}
    .pill.circle-right .rect{padding:0 24px 0 14px;}
    .pill .go{width:15px;height:15px;margin:0 1px 0 -13px;}
    .pill.circle-right .go{margin:0 -13px 0 1px;}
    .cap .ct{font-size:0.6875rem;letter-spacing:.1em;}
    .cap .cs{font-size:0.6875rem;line-height:1.25;}
    .cap{max-width:52%;}
    .mapPath .stem{display:none;}
    .mapPath .dot{display:none;}
  }

  .panelWrap{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    z-index:50;padding:clamp(12px,4vw,28px);}
  .panelWrap.open{display:flex;}
  .scrim{position:absolute;inset:0;background:rgba(250,247,242,.78);
    -webkit-backdrop-filter:blur(10px) saturate(1.05);
    backdrop-filter:blur(10px) saturate(1.05);
    opacity:0;transition:opacity .26s ease;}
  .panelWrap.open .scrim{opacity:1;}
  .panel{position:relative;width:min(520px,100%);max-height:84vh;overflow-y:auto;
    background:#FBF8F3;color:#14110E;border-radius:18px;
    padding:clamp(22px,5.5vw,34px) clamp(20px,5vw,30px);
    box-shadow:
      0 1px 2px   rgba(43,33,41,.04),
      0 4px 10px  rgba(43,33,41,.05),
      0 12px 28px rgba(43,33,41,.06),
      0 28px 64px rgba(43,33,41,.07);
    transform:scale(.94);opacity:0;transition:transform .32s var(--spring),opacity .24s ease;}
  .panelWrap.open .panel{transform:scale(1);opacity:1;}
  .panel .x{position:absolute;top:12px;right:14px;border:none;background:none;
    font-size:1.15rem;color:rgba(20,17,14,.4);cursor:pointer;line-height:1;padding:8px;}
  .panel .x:hover{color:#14110E;}
  .panel .kick{display:flex;align-items:center;gap:9px;font-size:0.6875rem;letter-spacing:.22em;
    text-transform:uppercase;color:rgba(20,17,14,.55);margin-bottom:14px;}
  .panel .kick i{display:block;width:26px;height:10px;flex:none;background:var(--accent,#14110E);}
  .panel h2{font-family:'Anton', Impact, sans-serif;text-transform:uppercase;font-weight:400;
    font-size:clamp(2rem,10vw,3rem);line-height:.9;margin-bottom:4px;}
  .panel h2::after{content:'';display:block;width:44px;height:3px;background:#14110E;margin:14px 0 4px;}

  .items{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));
    gap:18px 10px;padding:4px 0 2px;}

  .item{display:flex;flex-direction:column;align-items:center;gap:8px;
    border:none;background:none;font:inherit;color:inherit;cursor:pointer;
    padding:0;text-align:center;
    transition:transform .16s var(--spring);}
  .item:active{transform:scale(.94);}
  .item:focus-visible{outline:2px solid #C2956E;outline-offset:4px;border-radius:14px;}

  .item .idx{
    --d:58px;
    --bezel:5.49%;
    --core:14.78%;
    --ring:#8AA79C;
    width:var(--d);height:var(--d);border-radius:50%;position:relative;flex:none;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(145deg,#FFFFFF,#E4DDD1);
    box-shadow:calc(var(--d) * -.0417) calc(var(--d) * -.0417) calc(var(--d) * .0938) rgba(255,255,255,.9),
               calc(var(--d) * .052)   calc(var(--d) * .052)   calc(var(--d) * .1354) rgba(43,33,41,.16);
    font-family:'Geist', var(--f-display, sans-serif);
    font-weight:550;font-size:.900rem;letter-spacing:.01em;
    color:var(--mark-ink,#E5D1B8);font-variant-numeric:tabular-nums;
    transition:box-shadow .2s,transform .16s var(--spring);}
  .item .idx::before{content:'';position:absolute;inset:var(--bezel);border-radius:50%;
    background:var(--ring);}
  .item .idx::after{content:'';position:absolute;inset:var(--core);border-radius:50%;
    background:var(--mark-core,#201E1C);}
  .item .idx span{position:relative;z-index:2;}
  .item:hover .idx{transform:translateY(-2px);
    box-shadow:calc(var(--d) * -.0417) calc(var(--d) * -.0417) calc(var(--d) * .0938) rgba(255,255,255,.95),
               calc(var(--d) * .086)   calc(var(--d) * .086)   calc(var(--d) * .19) rgba(43,33,41,.2);}

  .item .lbl{font-size:.7rem;font-weight:500;line-height:1.25;color:var(--ink);
    max-width:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;}
  .item .go{display:none;}

  .item[data-sub] .idx{font-size:1.6rem;}
  .item .idx.glyph{font-size:1.25rem;font-weight:600;}

  .group{margin-top:14px;}
  /* a hairline between Part 1 and Part 2, and between the menu's sections */
  .group.ruled{border-top:1px solid rgba(20,17,14,.14);padding-top:14px;margin-top:16px}
  .item.hero{grid-column:1/-1;padding-top:34px;margin-bottom:6px}
  .item.hero .hang{position:relative;display:block;transform-origin:50% -30px;animation:heroSwing 2.8s ease-in-out infinite}
  .item.hero .hang::before{content:'';position:absolute;left:50%;top:-30px;width:1px;height:30px;transform:translateX(-50%);
    background:linear-gradient(180deg,transparent,rgba(20,17,14,.45))}
  .item.hero .hang::after{content:'';position:absolute;left:50%;top:-33px;width:7px;height:7px;border-radius:50%;transform:translateX(-50%);
    background:rgba(20,17,14,.55)}
  .item.hero .idx{--d:100px !important;--ring:#C2956E;font-size:1.8rem}
  .item.hero .lbl{font-weight:600}
  .item.hero .lbl{margin-top:4px}
  .item.hero .hs{font-size:.72rem;color:rgba(20,17,14,.6);margin-top:-2px;max-width:24ch;text-align:center;line-height:1.3}
  @keyframes heroSwing{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
  @media(prefers-reduced-motion:reduce){.item.hero .hang{animation:none}}
  .item.today{display:flex;flex-direction:row;align-items:center;gap:12px;width:100%;margin:10px 0 2px;padding:11px 14px;
    background:#F3EADF;border:0;border-left:3px solid #C2956E;border-radius:0;text-align:left;min-height:0}
  .item.today .td-k{font-family:'Geist Mono',monospace;font-size:.625rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#9A5A2C}
  .item.today .td-t{flex:1;font-size:.9rem;color:#14110E}
  .item.today .go{position:static;opacity:1;color:#9A5A2C}
  .item .etag{font-family:'Geist Mono', monospace;font-size:0.625rem;letter-spacing:.06em;text-transform:uppercase;
    color:rgba(20,17,14,.62);margin-top:-4px;}
  .item .etag.fix{color:#9A5A2C;font-weight:600}
  /* a ring's promise: what you get from it, in two or three words */
  /* one ring above the hanging Challenge sits on its axis, not in a corner */
  .group .items > .item:not(.hero):first-child:nth-last-child(2){grid-column:1/-1}
  .item .hint{font-size:.625rem;line-height:1.25;color:rgba(20,17,14,.58);margin-top:-3px;max-width:100%}
  .group .items{grid-template-columns:repeat(auto-fill,minmax(92px,1fr));}
  .gname{font-family:'Geist Mono', monospace;font-weight:600;font-size:0.6875rem;letter-spacing:.14em;
    text-transform:uppercase;color:rgba(20,17,14,.62);margin:0 0 10px;}

  .item.soon{cursor:default;}
  .item.soon .idx{box-shadow:none;}
  .item.soon .idx{--ring:#BCB1A0;}
  .item.soon .lbl{color:rgba(20,17,14,.45);}
  .item.soon .tag{font-family:'Geist Mono', monospace;font-size:0.6875rem;letter-spacing:.1em;
    text-transform:uppercase;color:rgba(20,17,14,.5);
    border:1px solid rgba(20,17,14,.25);border-radius:999px;padding:.2em .5em;}

  .backlink{border:none;background:none;font:inherit;cursor:pointer;padding:0 0 12px;
    font-family:'Geist Mono', monospace;font-size:0.6875rem;letter-spacing:.14em;
    text-transform:uppercase;color:rgba(20,17,14,.5);}
  .backlink:hover{color:#14110E;}

  @media(max-width:560px){
    .items{grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:20px 10px;}
    .item .idx{--d:99px;--bezel:5.9545%;font-size:1.4rem;}
    .item[data-sub] .idx{font-size:2.2rem;}
    .item .lbl{font-size:0.6875rem;line-height:1.2;}
    .item{gap:6px;}
    .group .items{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));}
    .group .item .idx{--d:80px;}
  }

  @media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important;}}
</style>
<script src="/tools/be2-brand.js?v=20261112b"></script>
</head>
<body>

<header class="bar">
  <div class="bar-top"><span>Intuitive learning</span><span><b>B2 First</b> · Cambridge</span></div>
  <h1 class="brand">Intuity</h1>
  <p class="byline">Majid Nashtai</p>
</header>

<!-- TODAY (10 Nov 2026): the streak and the review deck, as a dial where the
     map's path begins: today's review first, then the six skills. Shown only once
     the student has practised; a first visit sees the path end in its plain dot. -->
<style>
  .today{position:absolute;z-index:3;display:flex;align-items:center;gap:9px;flex-direction:row-reverse;
    transform:translate(calc(-100% + 18px),-50%);text-decoration:none;color:#14110E;-webkit-tap-highlight-color:transparent}
  .today[hidden]{display:none}
  .today .dial{flex:none;width:36px;height:36px;border-radius:50%;background:#14110E;color:#F7F5F1;display:grid;place-items:center;
    font:400 1.15rem/1 'Anton',Impact,sans-serif;box-shadow:0 0 0 4px #8AA79C,0 8px 16px -8px rgba(20,17,14,.55)}
  .today.none .dial{background:#F7F5F1;color:#4A6B5C;font:700 1rem/1 'Geist',system-ui,sans-serif}
  .today .tx{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font:500 .62rem/1.1 'Geist Mono',ui-monospace,monospace;
    letter-spacing:.12em;text-transform:uppercase;color:var(--soft);white-space:nowrap}
  .today .tx b{color:#14110E;font-weight:600}
  .today:focus-visible .dial{outline:2px solid #C2956E;outline-offset:4px}
  @media (hover:hover){.today:hover .dial{transform:scale(1.06)}} .today .dial{transition:transform .2s}
</style>
<script>
/* the dial's numbers; placeToday() (called by the map once the path is drawn) puts it at the path's head */
/* 10 Nov 2026: switched off for now at the teacher's request - the landing shows just
   the tiles. Set to true to bring the dial back; everything else is ready. */
window.SHOW_TODAY = false;
window.todayState = function () {
  if (!window.SHOW_TODAY || !window.Be2) return null;
  var n = Be2.streak(), r = Be2.dueToday ? Be2.dueToday() : Be2.review().length;
  return { n: n, r: r };
};
window.placeToday = function (pt) {
  var el = document.getElementById('today'); if (!el) return;
  var st = window.todayState(); if (!st || (!st.n && !st.r)) { el.hidden = true; return; }
  el.querySelector('.dial').innerHTML = st.r ? '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>' : '✓';
  el.querySelector('.tx').innerHTML = (st.r ? '<b>' + st.r + ' to review</b>' : '<b>all clear</b>') + (st.n ? '<span>🔥 ' + st.n + ' day' + (st.n === 1 ? '' : 's') + '</span>' : '');
  el.classList.toggle('none', !st.r);
  if (st.r) el.setAttribute('href', '/review.html'); else el.removeAttribute('href');
  el.setAttribute('aria-label', st.r ? st.r + ' to review' + (st.n ? ', ' + st.n + ' day streak' : '') : 'All clear' + (st.n ? ', ' + st.n + ' day streak' : ''));
  if (pt) { el.style.left = pt.x + '%'; el.style.top = pt.y + '%'; window.todayPt = pt; }
  el.hidden = false;
};
/* Be2 can arrive after the map; and coming back to the tab after practising elsewhere */
(function () { var k = 0, t = setInterval(function () { if (window.Be2 || ++k > 40) { clearInterval(t);
  var st = window.todayState && todayState();
  if (st && (st.n || st.r) && window.todayDrawn === false && typeof buildMap === 'function') buildMap();
  else if (window.todayPt) placeToday(window.todayPt); } }, 150); })();
document.addEventListener('visibilitychange', function () { if (!document.hidden && window.todayPt) placeToday(window.todayPt); });
</script>

<!-- REVIEW IN THE CORNER (10 Nov 2026, the teacher's call): a small REVIEW pill in the
     bottom corner, outlined by one thin line whose colour tells how much the app has been
     used in the last 24 days:
       never used yet   thin grey          (no one is greeted in red)
       0-3 days         thin pale red      (you've been away)
       4-11 days        light green, a little thicker
       12+ days         strong lettuce green, thickest
     The line thickens as it greens, so the change shows for colour-blind pupils too. -->
<!-- TODAY IN THE CORNER (12 Nov 2026, the teacher's choice): the REVIEW pill, same shape and
     colour, now reads "5 MIN" and opens today's five minutes (/review.html?today=1: the cards due, one exam
     bite, one phrase). Its rim keeps the 24-day colour code below; once today's session is
     done it says DONE. The board is one tap away from the session. -->
<a class="rv-corner" id="rvCorner" href="/review.html?today=1" aria-label="Today's five minutes"><b id="rvN">5</b><small id="rvU">MIN</small></a>
<style>
  .rv-corner{position:fixed;z-index:5;right:14px;bottom:calc(12px + env(safe-area-inset-bottom,0px));
    display:inline-flex;align-items:center;gap:.4em;min-height:28px;padding:0 13px 0 calc(13px + .16em);box-sizing:border-box;
    border-radius:999px;border:1px solid #C9C1B4;background:rgba(250,248,245,.92);text-decoration:none;color:#3A3530;
    font:600 .62rem/1 'Geist Mono',ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase;
    -webkit-tap-highlight-color:transparent;transition:border-color .6s ease,border-width .6s ease}
  .rv-corner b,.rv-corner small{font:inherit}
  .rv-corner.lv-away{border-color:#E4A59B}
  .rv-corner.lv-some{border-color:#A9D18E;border-width:1.5px}
  .rv-corner.lv-strong{border-color:#5FA42B;border-width:2.2px}
  .rv-corner:focus-visible{outline:2px solid #C2956E;outline-offset:3px}
</style>
<script>
(function () {
  var N = 24;
  function read() {
    try {
      var days = JSON.parse(localStorage.getItem('be2.days.v1') || '[]'), seen = {}, n = 0, t = new Date();
      days.forEach(function (x) { seen[x] = 1; });
      for (var i = 0; i < N; i++) {
        var dt = new Date(t.getFullYear(), t.getMonth(), t.getDate() - i),
            k = dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
        if (seen[k]) n++;
      }
      return { ever: days.length > 0, n: n };
    } catch (e) { return { ever: false, n: 0 }; }
  }
  function paint() {
    var u = read(), el = document.getElementById('rvCorner');
    var lv = !u.ever ? '' : u.n >= 12 ? 'lv-strong' : u.n >= 4 ? 'lv-some' : 'lv-away';
    el.classList.remove('lv-away', 'lv-some', 'lv-strong'); if (lv) el.classList.add(lv);
    var due = 0; try { if (window.Be2) due = Be2.dueToday ? Be2.dueToday() : Be2.review().length; } catch (e) {}
    var d = new Date(), key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'), done = false;
    try { done = localStorage.getItem('intuity.today.done') === key; } catch (e) {}
    el.classList.toggle('done', done);
    document.getElementById('rvN').textContent = done ? '\u2713' : '5';
    document.getElementById('rvU').textContent = done ? 'DONE' : 'MIN';
    el.setAttribute('aria-label', (done ? 'Today done' : 'Today\u2019s five minutes') + (due ? ', ' + due + ' to review' : '') + (u.ever ? ' · practised ' + u.n + ' of the last ' + N + ' days' : ''));
  }
  paint();
  var c = 0, t = setInterval(function () { if (window.Be2 || ++c > 40) { clearInterval(t); paint(); } }, 150);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) paint(); });
})();
</script>

<div class="map" id="map">
  <svg class="mapPath" id="mapPath" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
  <a class="today" id="today" hidden><span class="dial"></span><span class="tx"></span></a>

<script src="/tools/be2-map.js?v=4"></script>
<script>
const AREAS = BE2_MAP.areas, SKILLS = BE2_MAP.skills, SUB = BE2_MAP.sub;   /* the menus live in /tools/be2-map.js (11 Nov 2026) */

const $ = id => document.getElementById(id);
try{ sessionStorage.removeItem('intuity.sheetReturn'); }catch(e){}

const ROW_TOP = 15, ROW_BOT = 85;
function layoutFor(n){
  if(n === 1) return [{ y:(ROW_TOP+ROW_BOT)/2, capSide:'right' }];
  const span = ROW_BOT - ROW_TOP;
  return Array.from({length:n}, (_,i) => ({
    y: ROW_TOP + span * i / (n-1),
    capSide: i % 2 === 0 ? 'right' : 'left'
  }));
}

function buildMap(){
  /* ── WHY THE MAP SOMETIMES OVERFLOWED ON A PHONE ──────────────────────
     Every position this function writes is derived from the map's measured
     width, and one of them divides by it:

         pillEl.style.left = (… / mapWpx * 100) + '%'

     If the map has no width at the moment of measuring, that is a division
     by zero: left becomes Infinity% or NaN%, the pills leave the page, and
     the layout stays broken until something re-runs the maths. Refreshing
     re-measured against a real width, which is why a reload always "fixed"
     it — the tell that this was a timing bug, not a layout one.

     A phone hits it coming BACK from a skill page: the page is restored
     from bfcache so nothing re-runs on a fresh layout, but the address bar
     animating fires a resize, and the debounced rebuild can land before the
     restored document has been laid out.

     So: if there is nothing to measure, do not guess. Wait for a frame and
     try again. Same rule as the Anton guard below — never measure a thing
     that is not ready. */
  const mapEl = $('map');
  if(!mapEl) return;
  if(mapEl.clientWidth < 40 || mapEl.getBoundingClientRect().width < 40){
    requestAnimationFrame(buildMap);
    return;
  }
  const LAYOUT = layoutFor(AREAS.length);
  const mapWidthPx = mapEl.clientWidth || 760;
  const OFFSET   = Math.max(8, Math.min(18, 46 / mapWidthPx * 100));
  const STEM_LEN = Math.max(30, Math.min(46, 150 / mapWidthPx * 100));
  const CAP_GAP  = 0.4;

  const pillXs = LAYOUT.map(n => n.capSide === 'right' ? 50 - OFFSET : 50 + OFFSET);
  const dirs   = LAYOUT.map(n => n.capSide === 'right' ? 1 : -1);
  const dots   = LAYOUT.map((n,i) => ({ x: pillXs[i] + dirs[i]*STEM_LEN, y: n.y }));

  let d = 'M '+dots[0].x+' '+dots[0].y;
  for(let i=1;i<dots.length;i++){
    const a = dots[i-1], b = dots[i], my = (a.y+b.y)/2;
    d += ' C '+a.x+' '+my+', '+b.x+' '+my+', '+b.x+' '+b.y;
  }
  let svg = '<path class="road" d="'+d+'"/>';
  AREAS.forEach((_,i) => {
    const n = LAYOUT[i], dot = dots[i];
    svg += '<line class="stem" data-i="'+i+'" x1="'+(pillXs[i]+dirs[i]*11)+'" y1="'+n.y+'" x2="'+dot.x+'" y2="'+n.y+'"/>'+
           '<circle class="dot" data-i="'+i+'" cx="'+dot.x+'" cy="'+n.y+'" r="0.46"/>';
  });
  $('mapPath').innerHTML = svg;

  $('nodes').innerHTML = AREAS.map((a,i) => {
    const n = LAYOUT[i], px = pillXs[i], dot = dots[i];
    const circleRight = px >= 50;
    const capFrom = n.capSide === 'right' ? dot.x + CAP_GAP : 3;
    const capTo   = n.capSide === 'right' ? 97 : dot.x - CAP_GAP;
    const count   = SKILLS[a.key].length;
    return '<div class="node" style="top:'+n.y+'%">'+
      '<button class="pill'+(circleRight?' circle-right':'')+'" data-key="'+a.key+'" data-i="'+i+'" '+
        'type="button" style="left:'+px+'%" aria-label="'+a.name+', '+count+' activities">'+
        '<span class="circle" style="background:'+a.tone.bg+';color:'+a.tone.fg+'">'+count+'</span>'+
        '<span class="rect" style="background:'+a.tone.bg+';color:'+a.tone.fg+'">'+a.name+'</span>'+
        '<span class="go" aria-hidden="true" style="color:'+a.tone.fg+'"><svg viewBox="0 0 24 24" '+
          'fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" '+
          'stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span>'+
      '</button>'+
      '<div class="cap '+n.capSide+'" style="left:'+capFrom+'%;right:'+(100-capTo)+'%">'+
        '<div class="ct">'+a.name+'</div>'+
        '<div class="cs">'+a.what+'</div>'+
      '</div>'+
    '</div>';
  }).join('');

    $('nodes').querySelectorAll('.pill').forEach(b => {
    b.onclick = () => openPanel(b.dataset.key, +b.dataset.i);
  });
  
  requestAnimationFrame(() => {
    /* ── WHY THE BANNERS INFLATED ON REFRESH ─────────────────────────────
       The six banners are locked to a common width so the map reads as one
       object: measure the widest, apply it to all. The measurement has to
       happen in the FINAL font, and it was not.

       .rect is set in Anton — a very condensed face. Until the webfont
       arrives the browser draws the fallback, and on Linux and Android
       there is no Impact either, so it lands on the system sans, which is
       far wider. Measured in that moment, "USE OF ENGLISH" is perhaps 30%
       too wide, and that number gets written into every banner as an
       explicit width. Anton then loads, the text shrinks inside it, and the
       banners stay inflated — with the road drawn to meet edges that are no
       longer where the words end.

       Refreshing appeared to fix it because the second load takes Anton
       from cache and it is ready before the first measurement. That is the
       whole bug: a race, won or lost depending on the cache.

       So: do not guess. If Anton is not ready, measure nothing and leave
       the banners at their natural width — momentarily uneven, which is far
       better than uniformly wrong — and let the fonts.ready pass below set
       them once the real face is in.

       The three passes are also deliberate. Resetting and measuring in one
       loop means each banner is measured while its siblings still hold the
       previous run's explicit width, which is a second way to measure the
       wrong thing. Reset all, then measure all, then set all. */
    const rects = [...$('nodes').querySelectorAll('.pill .rect')];
    const fontReady = !document.fonts || document.fonts.check("400 .88rem Anton");
    rects.forEach(r => { r.style.width = ''; });
    if (fontReady) {
      const maxW = rects.reduce((m, r) => Math.max(m, r.offsetWidth), 0);
      rects.forEach(r => { r.style.width = maxW + 'px'; });
    }

    /* ── THE GUARD HAS TO COVER THE WAVE TOO ──────────────────────────
       Everything below measures the banners, and one of those numbers
       decides the DIRECTION of the curve:

           side = -Math.sign(tightDots[0].x - cxW)

       tightDots[0].x is the first banner's inner edge. In Anton that edge
       sits well clear of cxW and the sign is stable. In the fallback face
       — which is far wider, and is what the browser draws until Anton
       arrives — the edge crosses cxW and the sign INVERTS. The whole map
       is drawn backwards.

       That is the bug where the wave is mirrored on arrival and correct
       after a refresh: the reload takes Anton from cache and wins the race
       the first load lost. Coming back through bfcache is the same cold
       moment, which is why returning from a skill page could flip it too.

       The guard above already refuses to MEASURE widths in the wrong font.
       It just stopped there, and let the wave be measured anyway. So stop
       here instead: draw nothing rather than draw it mirrored. The
       document.fonts.load("...Anton") promise at the foot of this file
       calls buildMap again the moment the real face is in, and that pass
       does the work. */
    if (!fontReady) return;


    const PILL_GAP_PX = 5 * 96 / 25.4;
    const CAP_GAP_PX  = 2 * 96 / 25.4;
    const mapRect = $('map').getBoundingClientRect();
    const capEls  = $('nodes').querySelectorAll('.cap');
    const toPctX  = px => px / mapRect.width * 100;

    const tightDots = dots.map((dot,i) => {
      const pillEl = $('nodes').querySelector('.pill[data-i="'+i+'"]');
      const dir = dirs[i], pRect = pillEl.getBoundingClientRect();
      const edgePx = dir > 0 ? (pRect.right - mapRect.left) : (pRect.left - mapRect.left);
      return { x: toPctX(edgePx) + dir*toPctX(PILL_GAP_PX), y: dot.y };
    });
    const capDots = dots.map((dot,i) => {
      const dir = dirs[i], cRect = capEls[i].getBoundingClientRect();
      const capEdgePx = dir > 0 ? (cRect.left - mapRect.left) : (cRect.right - mapRect.left);
      return { x: toPctX(capEdgePx) - dir*toPctX(CAP_GAP_PX), y: dot.y };
    });

    $('nodes').querySelectorAll('.pill').forEach(pillEl => {
      const i = +pillEl.dataset.i;
      const stem = $('mapPath').querySelector('.stem[data-i="'+i+'"]');
      const dotE = $('mapPath').querySelector('.dot[data-i="'+i+'"]');
      if(stem){ stem.setAttribute('x1', tightDots[i].x); stem.setAttribute('x2', capDots[i].x); }
      if(dotE) dotE.setAttribute('cx', capDots[i].x);
    });

    if(tightDots.length < 2) return;

    const ys = tightDots.map(d => d.y);
    const y0 = ys[0], yN = ys[ys.length-1];
    const gap = (yN - y0) / (ys.length - 1);
    const LAM = 2 * gap;
    const xs  = tightDots.map(d => d.x);
    const cxW = (Math.min(...xs) + Math.max(...xs)) / 2;
    const MIN_AMP_PX = 30;
    const amp = Math.max(MIN_AMP_PX / mapRect.width * 100,
                         (Math.max(...xs) - Math.min(...xs)) / 2);
    /* ── THE PHASE IS FIXED, NOT MEASURED ─────────────────────────────
       +1 puts the cosine at its MAXIMUM on the first row: the spine starts
       right, swings left as it comes down to the first node, and alternates
       from there. -1 gives the mirror image.

       It used to be Math.sign(tightDots[0].x - cxW) — derived from the
       first banner's inner edge against the midpoint. That edge moves with
       the width of the words and with which font has loaded, so the sign
       could come back either way and the map drew itself mirrored on some
       loads and not others. No amount of flipping the sign fixed a value
       that was not stable in the first place.

       A constant cannot be measured wrong. The wave now opens left on a
       cold load, a warm load, a bfcache restore, at 360px and at 1920, in
       Anton or in the fallback face. If it ever needs to open right, this
       is -1 to 1 and nothing else. */
    const side = 1;
    const waveX = y => cxW + side * amp * Math.cos(2*Math.PI * (y - y0) / LAM);

    const EXT = 0.62, N = 240, pts = [];
    /* when today's review hangs at the head of the path, the path climbs higher
       so the dial has room above the first banner (10 Nov 2026) */
    const st = window.todayState ? todayState() : null, hasToday = !!(st && (st.n || st.r));
    window.todayDrawn = hasToday;
    const EXT_TOP = hasToday ? Math.max(EXT, Math.min(1.15, (y0 - 3.5) / gap)) : EXT;
    for(let i=0;i<=N;i++){
      const y = (y0 - EXT_TOP*gap) + ((yN + EXT*gap) - (y0 - EXT_TOP*gap)) * (i/N);
      pts.push({ x: waveX(y), y });
    }
    const road = $('mapPath').querySelector('.road');
    if(road) road.setAttribute('d',
      'M '+pts[0].x.toFixed(3)+' '+pts[0].y.toFixed(3)+
      pts.slice(1).map(p => ' L '+p.x.toFixed(3)+' '+p.y.toFixed(3)).join(''));

    const CLEAR_PX = 2.5 * 96 / 25.4;
    const mapWpx = mapRect.width  || 760;   /* never divide by zero */
    const mapHpx = mapRect.height || 600;
    $('nodes').querySelectorAll('.pill').forEach(pillEl => {
      const i = +pillEl.dataset.i, dir = dirs[i];
      const pRect = pillEl.getBoundingClientRect();
      const halfPill = pRect.width / 2;
      const halfHpct = (pRect.height / 2) / mapHpx * 100;

      let nearest = null;
      for(let s = -6; s <= 6; s++){
        const wx = waveX(LAYOUT[i].y + halfHpct * (s / 6)) / 100 * mapWpx;
        if(nearest === null) nearest = wx;
        else nearest = dir > 0 ? Math.min(nearest, wx) : Math.max(nearest, wx);
      }
      const edge = nearest - dir * CLEAR_PX;
      pillEl.style.left = ((dir > 0 ? edge - halfPill : edge + halfPill) / mapWpx * 100) + '%';
    });

    $('nodes').querySelectorAll('.pill').forEach(pillEl => {
      const i = +pillEl.dataset.i, dir = dirs[i];
      const wavePx = waveX(LAYOUT[i].y) / 100 * mapWpx;
      const startPx = wavePx + dir * CLEAR_PX;
      const stem = $('mapPath').querySelector('.stem[data-i="'+i+'"]');
      if(stem) stem.setAttribute('x1', toPctX(startPx));
    });

    $('nodes').querySelectorAll('.pill').forEach(pillEl => {
      const i = +pillEl.dataset.i, dir = dirs[i];
      const stem = $('mapPath').querySelector('.stem[data-i="'+i+'"]');
      const dotE = $('mapPath').querySelector('.dot[data-i="'+i+'"]');
      const capEl = capEls[i];
      if(!stem || !capEl) return;

      const x1 = parseFloat(stem.getAttribute('x1'));
      const x2 = parseFloat(stem.getAttribute('x2'));
      const frac = mapWpx < 560 ? (1/3) * 1.10 : 1/2;
      const half = x1 + (x2 - x1) * frac;

      stem.setAttribute('x2', half);
      if(dotE) dotE.setAttribute('cx', half);

      const g = toPctX(CAP_GAP_PX);
      if(dir > 0){ capEl.style.left = (half + g) + '%'; capEl.style.right = '3%'; }
      else       { capEl.style.right = (100 - half + g) + '%'; capEl.style.left = '3%'; }
    });

    let caps = $('mapPath').querySelector('.endCaps');
    if(!caps){
      caps = document.createElementNS('http://www.w3.org/2000/svg','g');
      caps.setAttribute('class','endCaps');
      $('mapPath').appendChild(caps);
    }
    caps.innerHTML =
      '<circle class="endDot" fill="rgb(139,123,120)" cx="'+pts[0].x.toFixed(3)+'" cy="'+pts[0].y.toFixed(3)+'" r="0.46"/>'+
      '<circle class="endDot" fill="rgb(139,123,120)" cx="'+pts[N].x.toFixed(3)+'" cy="'+pts[N].y.toFixed(3)+'" r="0.46"/>';
    /* the path begins at today's review (10 Nov 2026) */
    if(window.placeToday) placeToday({ x: pts[0].x, y: pts[0].y });
  });
}

  let lastFocus = null;
let panelStack = [];
let currentKey = null;

/* MISTAKES WAITING (Nov 2026). A Master page whose mistakes are due today
   says so on the menu — "4 to fix" — read straight from the Ring the pages
   already keep (intuity-ring.js, localStorage 'intuity.ring.v1'). The one
   reason to come back tomorrow, shown where the student chooses. */
function toFix(prefix){
  try{
    const all=JSON.parse(localStorage.getItem('intuity.ring.v1')||'{}'), d=new Date();
    const today=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    return Object.keys(all).filter(id=>id.indexOf(prefix)===0&&all[id].due<=today).length;
  }catch(e){ return 0; }
}
function itemHTML(o, n){
  /* the Challenge (5 Nov, Michael: "simple"): one ring, bigger, rimmed in
     caramel and hung on a string, swinging like the gate pendulums */
  if(o.banner)
    return '<button class="item hero" type="button" data-url="'+o.url+'"><span class="hang"><span class="idx glyph"><span>'+o.glyph+'</span></span></span>'+
           '<span class="lbl">'+o.name+'</span><span class="hs">'+o.banner+'</span></button>';
    const num = o.noNum ? '0' : String(o.part || n+1).padStart(2,'0');
  const idx = '<span class="idx'+(o.glyph?' glyph':'')+'"'+(o.ring?' style="--ring:'+o.ring+'"':'')+'><span>'+
    (o.glyph ? o.glyph : (o.sub ? '&rsaquo;' : num))+'</span></span>';
  if(o.soon)
    return '<div class="item soon">'+idx+'<span class="lbl">'+o.name+'</span>'+
           '<span class="tag">Soon</span></div>';
  if(o.sub)
    return '<button class="item" type="button" data-sub="'+o.sub+'">'+idx+
           '<span class="lbl">'+o.name+'</span>'+(o.hint?'<span class="hint">'+o.hint+'</span>':'')+
           '<span class="go" aria-hidden="true">&rsaquo;</span></button>';
  const nf = o.fix ? toFix(o.fix) : 0;
  const etag = o.exam ? '<span class="etag">'+(o.exam==='schools'?'Schools only':'B2 First only')+'</span>'
             : nf ? '<span class="etag fix">'+nf+' to fix</span>'
             : o.hint ? '<span class="hint">'+o.hint+'</span>' : '';
  return '<button class="item" type="button" data-url="'+o.url+'">'+idx+
         '<span class="lbl">'+o.name+'</span>'+etag+'<span class="go">&rarr;</span></button>';
}

/* A list with {group:…} rows is drawn as labelled rows of rings; an item
   marked exam:'schools'|'standard' carries a small tag saying so. */
function groupedHTML(list){
  const groups = []; let top = '';
  list.forEach(o => {
    if(o.reviewStrip){ top = reviewStripHTML(); return; }
    if(o.group){ groups.push({name:o.group, rule:!!o.rule, items:[]}); return; }
    if(!groups.length) groups.push({name:'', items:[]});
    groups[groups.length-1].items.push(o);
  });
  return top + groups.map(g => '<div class="group'+(g.rule?' ruled':'')+'">'+(g.name?'<h3 class="gname">'+g.name+'</h3>':'')+
      '<div class="items">'+g.items.map(itemHTML).join('')+'</div></div>').join('');
}
/* TODAY: the review deck at the top of the menu, only when cards are due */
function reviewStripHTML(){
  try{
    /* read the saved deck directly: the menu can open before Be2 has loaded */
    const deck = JSON.parse(localStorage.getItem('be2.review.v1') || '{}'), d = new Date();
    const today = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    /* at most 12 a day (5 Nov, tools/be2-progress.js), minus those already reviewed today */
    const done = JSON.parse(localStorage.getItem('be2.reviewed.v1') || '{}');
    const n = Math.min(Object.keys(deck).filter(k => !deck[k].due || deck[k].due <= today).length, Math.max(0, 12 - (done.day === today ? done.n : 0)));
    if(!n) return '';
    const min = Math.max(1, Math.round(n * 20 / 60));
    return '<button class="item today" type="button" data-url="review.html"><span class="td-k">Today</span>'+
           '<span class="td-t"><b>'+n+'</b> to review · about '+min+' min</span><span class="go">&rarr;</span></button>';
  }catch(e){ return ''; }
}

function paintPanel(title, list, accent, back){
  $('panel').style.setProperty('--accent', accent);
  $('panel').innerHTML =
    '<button class="x" id="panelX" type="button" aria-label="Close">&#10005;</button>'+
    (back
      ? '<button class="backlink" id="panelBack" type="button">&larr; '+back+'</button>'
      : '<div class="kick"><i></i>Cambridge B2 First</div>')+
    '<h2>'+title+'</h2>'+
    (list.some(o => o.group) ? groupedHTML(list) : '<div class="items">'+list.map(itemHTML).join('')+'</div>');



  $('panelWrap').classList.add('open');
  $('panelX').onclick = closePanel;
  const b = $('panelBack');
  if(b) b.onclick = () => { const prev = panelStack.pop(); if(prev) prev(); };

$('panel').querySelectorAll('.item[data-url]').forEach(el => {
  el.onclick = () => {
    if(currentKey) sessionStorage.setItem('be2firstSubmenu', currentKey);
    location.href = el.dataset.url;
  };
});
  $('panel').querySelectorAll('.item[data-sub]').forEach(el => {
    el.onclick = () => openSub(el.dataset.sub, accent, title);
  });
  $('panel').scrollTop = 0;
  $('panelX').focus();
}

/* A skill whose entry is a page rather than a panel. One entry today; the
   shape is here so the next one is an entry and not another branch. */
const DOORS = {};

function openPanel(key, i){
  const list = SKILLS[key]; if(!list) return;
  const area = AREAS[i];
  lastFocus = document.activeElement;
  panelStack = [];
  currentKey = key;
  history.pushState({panel:key}, '', location.pathname);
  paintPanel(area.name, list, accentFor(area.tone.bg), null);
}

function openSub(subKey, accent, parentTitle){
  const s = SUB[subKey]; if(!s) return;
  const back = () => paintPanel(parentTitle, SKILLS.writing, accent, null);
  panelStack.push(back);
  paintPanel(s.title, s.items, accent, parentTitle);
}

function accentFor(bg){
  const hex = bg.match(/^#([0-9a-f]{6})$/i);
  let c;
  if(hex){ const n = parseInt(hex[1],16); c = [n>>16&255, n>>8&255, n&255]; }
  else { const m = bg.match(/[\d.]+/g); c = m && m.length>=3 ? m.slice(0,3).map(Number) : [20,17,14]; }
  const lum = v => 0.2126*v[0] + 0.7152*v[1] + 0.0722*v[2];
  const GROUND = 248;
  let guard = 0;
  while(Math.abs(GROUND - lum(c)) < 55 && guard++ < 12) c = c.map(v => Math.round(v*0.86));
  return 'rgb('+c.join(',')+')';
}

   function closePanel(){
    $('panelWrap').classList.remove('open');
    if(lastFocus) lastFocus.focus();
  }
  $('scrim').onclick = closePanel;
  window.addEventListener('popstate', e => {
    if(!e.state || !e.state.panel){
      $('panelWrap').classList.remove('open');
    }
  });
  document.addEventListener('keydown', e => {
    if(e.key !== 'Escape' || !$('panelWrap').classList.contains('open')) return;
    const prev = panelStack.pop();
    if(prev) prev(); else closePanel();
  });


  buildMap();
  let t = null;
  window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(buildMap, 150); });
  /* Coming back from a skill page, the browser may restore this document
     from bfcache: no load event, no re-run, and whatever the layout was
     when it left. pageshow with persisted=true is the only signal for it. */
  window.addEventListener('pageshow', e => { if(e.persisted) requestAnimationFrame(buildMap); });
  /* A tab measured while hidden measures nothing. */
  document.addEventListener('visibilitychange', () => {
    if(!document.hidden) requestAnimationFrame(buildMap);
  });
  /* Ask for the face by name rather than waiting on fonts.ready. ready
     resolves for the whole document, which on a cold load includes faces
     the map does not use; loading Anton explicitly resolves when the one
     font the measurement depends on is actually available. The redraw is
     harmless when it was already loaded. */
  if(document.fonts && document.fonts.load){
    document.fonts.load("400 .88rem Anton").then(buildMap).catch(() => {});
  } else if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(buildMap);
  }

  /* ── COMING BACK FROM A SKILL PAGE ───────────────────────────────────
     This read only ?panel=, and NOT ONE PAGE IN THE REPO SENDS THAT. All
     102 back-links across 136 skill pages say ?openModal=<key>, so every
     "← Grammar" and "← Vocabulary" in the product has been dropping the
     student on the landing page with the menu shut, since the beginning.

     Fixed here rather than in 102 links: one file to change instead of
     136, and it also catches every page nobody has renovated yet. ?panel=
     keeps working, so nothing that might already use it breaks.

     An unknown key is ignored on purpose — a stale bookmark should land on
     the map, not on an error. */
  const q = new URLSearchParams(location.search);
  const wantPanel = q.get('panel') || q.get('openModal');
  if(wantPanel){
    /* ?openModal=writing is what 102 back-links in this repo say, and the
       writing pages now go back to the door instead — but a bookmark, or a
       page nobody has renovated, will still arrive here asking for the
       panel. Send it to the door as well, so there is one Writing entry
       rather than two that disagree. */
    if(DOORS[wantPanel]){ top.location.replace(DOORS[wantPanel]); }
    const idx = AREAS.findIndex(a => a.key === wantPanel);
    if(idx >= 0 && !DOORS[wantPanel]){
      openPanel(wantPanel, idx);
      /* Writing's links carry &submenu=essays and the like — a second level
         the panel already knows how to draw but was never told to open.
         Deferred a frame so it lands on top of the panel just painted. */
      const wantSub = q.get('submenu');
      if(wantSub && typeof SUB === 'object' && SUB[wantSub]){
        requestAnimationFrame(() => {
          openSub(wantSub, accentFor(AREAS[idx].tone.bg), AREAS[idx].name);
        });
      }
    }
  }
</script>
