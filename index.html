<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>INTUITY — Cambridge B2 First</title>
<meta name="theme-color" content="#FAF7F2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    /* Lifted to the paper the section maps use, so the front door and the
       rooms behind it are one colour. Every tone gains contrast against it. */
    --stage:#FAF7F2;
    --paper:#FEFCF9;
    --ink:#2B2129;
    --soft:#5C4E52;
    --mute:#8B7B78;
    --rule:#D9C0A4;
    --clay:#B4653A;
    --spring:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{background:var(--stage);color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none;}

  /* ---------- masthead ---------- */
  /* Three columns: name left, tagline dead centre, level right. The outer
     columns are equal 1fr so the tagline centres on the PAGE, not between
     two unequal blocks. */
  .bar{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;
    padding:calc(14px + env(safe-area-inset-top,0px)) 16px 12px;}
  .brandblock{justify-self:start;min-width:0;display:inline-block;}
  .brand{font-family:'Anton',Impact,sans-serif;text-transform:uppercase;
    font-size:clamp(1.28rem,5.4vw,1.85rem);letter-spacing:.2em;line-height:1;}
  /* Centred under the wordmark, not the page: the block is inline-block so
     it is only as wide as INTUITY, and Anton's trailing letter-spacing is
     subtracted so the name sits on the optical centre of the word. */
  .byline{font-size:.64rem;color:var(--soft);margin-top:4px;white-space:nowrap;
    text-align:center;margin-right:.2em;}
  .strap{justify-self:center;font-size:.58rem;font-weight:700;letter-spacing:.18em;
    text-transform:uppercase;color:var(--mute);white-space:nowrap;}
  .lvl{justify-self:end;font-family:'JetBrains Mono',monospace;font-size:.54rem;
    letter-spacing:.12em;text-transform:uppercase;color:var(--mute);
    border:1px solid var(--rule);border-radius:999px;padding:.34em .66em;white-space:nowrap;}
  /* Narrow phones can't hold three columns — but the tagline is part of the
     identity, so it moves to its own line rather than being dropped. Almost
     every student is on a phone, which makes this the layout that matters. */
  @media(max-width:560px){
    .bar{grid-template-columns:1fr auto;
      grid-template-areas:'brand level' 'strap strap';row-gap:7px;}
    .brandblock{grid-area:brand;}
    .lvl{grid-area:level;align-self:start;}
    .strap{grid-area:strap;justify-self:start;letter-spacing:.2em;}
  }

  /* ---------- map ---------- */
  .map{position:relative;flex:1;min-height:0;margin:0 10px calc(12px + env(safe-area-inset-bottom,0px));}
  @media(max-width:480px){ .map{margin:0 6px calc(10px + env(safe-area-inset-bottom,0px));} }
  .mapPath{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
  .mapPath .road{fill:none;stroke:var(--mute);stroke-width:.16;stroke-linecap:round;}
  .mapPath .stem{stroke:var(--rule);stroke-width:.4;}
  .mapPath .dot{fill:var(--paper);stroke:rgb(139,123,120);stroke-width:.3;}
  .mapPath .endDot{stroke:none;}

  .nodes{position:absolute;inset:0;}
  .node{position:absolute;transform:translateY(-50%);width:100%;}

  .pill{position:absolute;top:0;transform:translate(-50%,-50%);
    display:flex;align-items:center;border:none;background:none;padding:0;cursor:pointer;
    transition:transform .18s var(--spring);}
  .pill:active{transform:translate(-50%,-50%) scale(.96);}
  .pill:focus-visible{outline:2px solid var(--clay);outline-offset:6px;border-radius:999px;}

  /* the circle carries the COUNT, not an index: six skills are not a
     sequence, so a number here has to mean something or it is decoration */
  .pill .circle{width:44px;height:44px;border-radius:50%;flex:none;position:relative;z-index:2;order:1;
    display:flex;align-items:center;justify-content:center;
    font-family:'Anton',Impact,sans-serif;font-size:1.15rem;letter-spacing:.02em;
    box-shadow:0 5px 14px rgba(30,24,16,.24);}
  /* Anton is ultra-condensed: at this size its strokes crowd and long words
     read as a picket fence. Opened tracking is what makes the label legible;
     text-indent cancels the trailing space the tracking adds after the last
     letter, which would otherwise push centred text a fraction left. */
  .pill .rect{height:36px;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;order:2;
    border-radius:0 999px 999px 0;padding:0 20px 0 28px;margin-left:-16px;
    font-family:'Anton',Impact,sans-serif;text-transform:uppercase;
    font-size:.8rem;letter-spacing:.09em;text-indent:.09em;white-space:nowrap;
    box-shadow:0 5px 14px rgba(30,24,16,.2);}
  /* ── THE TAP CUE ──
     Nothing said these were pressable. A chevron on the outer end: the iOS
     convention for "there is more behind this", low-contrast on purpose. */
  .pill .go{order:3;flex:none;width:15px;height:15px;margin:0 2px 0 -12px;
    position:relative;z-index:3;display:flex;align-items:center;justify-content:center;
    opacity:.42;transition:opacity .15s;}
  .pill.circle-right .go{order:0;margin:0 -12px 0 2px;transform:scaleX(-1);}
  .pill:hover .go{opacity:.72;}
  .pill .go svg{width:100%;height:100%;display:block;}

  .pill.circle-right .circle{order:2;margin-left:-12px;}
  .pill.circle-right .rect{order:1;margin-left:0;padding:0 30px 0 18px;
    border-radius:999px 0 0 999px;}

  .cap{position:absolute;top:0;transform:translateY(-50%);max-width:44%;}
  .cap .ct{font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;
    color:var(--ink);margin-bottom:3px;}
  .cap .cs{font-size:.72rem;line-height:1.3;color:var(--soft);}
  .cap.right{text-align:left;}
  .cap.left{text-align:right;}

  /* ── PHONE: THE PILL HAS TO FIT THE HALF-WIDTH ───────────────────────
     Everything on this map hangs off the wave, and the wave is in the
     middle — so a pill has only half the screen to live in, minus the 2.5mm
     clearance. On a 288px map that is about 135px, and the desktop pill is
     165px: it ran off both edges.

     So the pill is rebuilt smaller rather than scaled — the circle drops to
     32px, the label to .6rem, and the padding tightens. Anton stays: it is
     the one face that holds up condensed at this size, which is why it was
     chosen for these labels in the first place.

     The caption sizes come down with it, because the caption column is
     whatever the pill leaves behind. */
  @media(max-width:560px){
    /* The circle keeps its size. It carries the count, it is the tap target,
       and it is the one part of the pill that is an object rather than a
       label — shrinking it was the wrong economy. The width comes out of the
       label's padding instead, and out of the stem below. */
    .pill .circle{width:40px;height:40px;font-size:1.02rem;}
    .pill .rect{height:32px;font-size:.62rem;letter-spacing:.07em;text-indent:.07em;
      padding:0 11px 0 19px;margin-left:-15px;}
    .pill.circle-right .circle{margin-left:-11px;}
    .pill.circle-right .rect{padding:0 19px 0 11px;}
    .pill .go{width:12px;height:12px;margin:0 1px 0 -10px;}
    .pill.circle-right .go{margin:0 -10px 0 1px;}
    .cap .ct{font-size:.52rem;letter-spacing:.1em;}
    .cap .cs{font-size:.64rem;line-height:1.25;}
    .cap{max-width:52%;}
  }

  /* ---------- panel ---------- */
  .panelWrap{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    z-index:50;padding:clamp(12px,4vw,28px);}
  .panelWrap.open{display:flex;}
  /* A near-black wash over a map of warm light tones turned the screen brown
     on open and back on close. The page's own paper at 78%, blurred: the map
     steps back rather than being blacked out. */
  .scrim{position:absolute;inset:0;background:rgba(250,247,242,.78);
    -webkit-backdrop-filter:blur(10px) saturate(1.05);
    backdrop-filter:blur(10px) saturate(1.05);
    opacity:0;transition:opacity .26s ease;}
  .panelWrap.open .scrim{opacity:1;}
  .panel{position:relative;width:min(520px,100%);max-height:84vh;overflow-y:auto;
    /* #D4CEBE was chosen against a black wash; against a light scrim it is
       the only muddy surface on screen. Anton reads at 17.8:1 on paper
       against 12:1 on the greige. */
    background:#FBF8F3;color:#14110E;border-radius:18px;
    padding:clamp(22px,5.5vw,34px) clamp(20px,5vw,30px);
    /* four shadows, each wider and fainter — a stack falls off the way light
       does, where a single large blur has a visible edge */
    box-shadow:
      0 1px 2px   rgba(43,33,41,.04),
      0 4px 10px  rgba(43,33,41,.05),
      0 12px 28px rgba(43,33,41,.06),
      0 28px 64px rgba(43,33,41,.07);
    transform:scale(.94);opacity:0;transition:transform .32s var(--spring),opacity .24s ease;}
  .panelWrap.open .panel{transform:scale(1);opacity:1;}
  .panel .x{position:absolute;top:12px;right:14px;border:none;background:none;
    font-size:1.15rem;color:rgba(20,17,14,.4);cursor:pointer;line-height:1;padding:8px;}
  .panel .x:hover{color:#14110E;}
  .panel .kick{display:flex;align-items:center;gap:9px;font-size:.54rem;letter-spacing:.22em;
    text-transform:uppercase;color:rgba(20,17,14,.55);margin-bottom:14px;}
  .panel .kick i{display:block;width:26px;height:10px;flex:none;background:var(--accent,#14110E);}
  .panel h2{font-family:'Anton',Impact,sans-serif;text-transform:uppercase;font-weight:400;
    font-size:clamp(2rem,10vw,3rem);line-height:.9;margin-bottom:4px;}
  .panel h2::after{content:'';display:block;width:44px;height:3px;background:#14110E;margin:14px 0 4px;}

  /* ── A GRID OF DIALS ─────────────────────────────────────────────────
     Not a list. The panel is a board of Forge dials — the same caramel ring,
     sand hairline and dark core, at a fraction of the size — laid out the
     way a phone lays out apps.

     Why this beats the list it replaces: a list is read top to bottom, which
     implies an order that does not exist. Tenses is not before Conditionals.
     A grid says these are peers, and lets the eye land anywhere. It also
     fits fourteen items in four rows instead of fourteen. */
  .items{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));
    gap:18px 10px;padding:4px 0 2px;}

  .item{display:flex;flex-direction:column;align-items:center;gap:8px;
    border:none;background:none;font:inherit;color:inherit;cursor:pointer;
    padding:0;text-align:center;
    transition:transform .16s var(--spring);}
  .item:active{transform:scale(.94);}
  .item:focus-visible{outline:2px solid #C2956E;outline-offset:4px;border-radius:14px;}

  /* The dial, at 58px against Forge's 150 — the same three layers and the
     same inset percentages, so it is a miniature rather than a lookalike. */
  .item .idx{width:58px;height:58px;border-radius:50%;position:relative;flex:none;
    display:flex;align-items:center;justify-content:center;
    background:#C2956E;
    box-shadow:0 5px 13px rgba(43,33,41,.18),inset 0 1px 0 rgba(255,255,255,.25);
    font-family:'Anton',Impact,sans-serif;font-size:1.02rem;letter-spacing:.02em;
    color:#E5D1B8;font-variant-numeric:tabular-nums;
    text-shadow:0 1px 3px rgba(0,0,0,.4);
    transition:box-shadow .2s,transform .16s var(--spring);}
  .item .idx::before{content:'';position:absolute;inset:10.5%;border-radius:50%;
    box-shadow:0 0 0 .5px #E5D1B8,0 0 4px .5px rgba(229,209,184,.35);pointer-events:none;}
  .item .idx::after{content:'';position:absolute;inset:12.7%;border-radius:50%;
    background:#2B2129;
    box-shadow:inset 0 3px 9px rgba(0,0,0,.35),inset 0 -2px 0 rgba(255,255,255,.05);}
  .item .idx span{position:relative;z-index:2;}
  .item:hover .idx{transform:translateY(-2px);
    box-shadow:0 8px 18px rgba(43,33,41,.22),inset 0 1px 0 rgba(255,255,255,.25);}

  /* The label sits under the disc, as it does under an app icon. Two lines
     maximum — anything longer is a name that needs shortening, not a box
     that needs widening. */
  .item .lbl{font-size:.7rem;font-weight:500;line-height:1.25;color:var(--ink);
    max-width:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;}
  .item .go{display:none;}

  /* An item that opens a sub-panel shows a chevron in the core instead of a
     number: it is not the nth thing, it is a way in. */
  .item[data-sub] .idx{font-size:1.35rem;}

  .item.soon{cursor:default;}
  .item.soon .idx{background:#BCB1A0;box-shadow:none;}
  .item.soon .lbl{color:rgba(20,17,14,.45);}
  .item.soon .tag{font-family:'JetBrains Mono',monospace;font-size:.5rem;letter-spacing:.1em;
    text-transform:uppercase;color:rgba(20,17,14,.5);
    border:1px solid rgba(20,17,14,.25);border-radius:999px;padding:.2em .5em;}

  .backlink{border:none;background:none;font:inherit;cursor:pointer;padding:0 0 12px;
    font-family:'JetBrains Mono',monospace;font-size:.58rem;letter-spacing:.14em;
    text-transform:uppercase;color:rgba(20,17,14,.5);}
  .backlink:hover{color:#14110E;}

  /* ── PHONE: SMALLER DIALS, TIGHTER BOARD ─────────────────────────────
     Desktop keeps 58px — at that size the caramel ring, the sand hairline
     and the dark core are all clearly three things, which is the point of
     reusing Forge's object.

     A phone has about 300px of usable panel width, so 58px dials give three
     across with the columns nearly touching. At 46px the ring still reads as
     a ring and a fourth column fits, which matters more here: fourteen items
     is five rows at three across and four at four, and a panel that does not
     scroll is worth more than 12px of disc. */
  @media(max-width:560px){
    .items{grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:14px 8px;}
    .item .idx{width:46px;height:46px;font-size:.84rem;}
    .item[data-sub] .idx{font-size:1.1rem;}
    .item .lbl{font-size:.64rem;line-height:1.2;}
    .item{gap:6px;}
  }

  @media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important;}}
</style>
</head>
<body>

<div class="bar">
  <div class="brandblock">
    <div class="brand">Intuity</div>
    <div class="byline">Majid Nashtai</div>
  </div>
  <span class="strap">Intuitive learning</span>
  <span class="lvl">Cambridge B2</span>
</div>

<div class="map" id="map">
  <svg class="mapPath" id="mapPath" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
  <div class="nodes" id="nodes"></div>
</div>

<div class="panelWrap" id="panelWrap" role="dialog" aria-modal="true">
  <div class="scrim" id="scrim"></div>
  <div class="panel" id="panel"></div>
</div>

<script>
/* Opaque, not rgba(0,0,0,.7): the circle overlaps the rectangle, so a
   translucent tone composites with itself there and the overlap renders
   noticeably darker than either piece. #484641 is exactly what that alpha
   resolved to over the cream ground, so nothing shifts visually. */
/* Six areas. Built-out ones first — the order is editorial, not a sequence,
   which is why the circles carry counts rather than 1..6. */
const AREAS = [
  { key:'grammar',    name:'Grammar',    tone:{bg:'#DD8E58', fg:'#FEFCF9'},
    what:'Tense maps, conditionals, modals, phrasal verbs' },
  { key:'vocabulary', name:'Vocabulary', tone:{bg:'#708A81', fg:'#FEFCF9'},
    what:'Collocations, phrase banks, academic lists' },
  { key:'english',    name:'Use of English', tone:{bg:'#E5D1B8', fg:'#2B2129'},
    what:'Parts 1–4, with key word transformation' },
  { key:'reading',    name:'Reading',    tone:{bg:'#C2956E', fg:'#2B2129'},
    what:'Parts 5–7 and full practice tests' },
  /* Writing's label is warm grey rather than white: on the one dark pill,
     white shouts against five pills whose labels sit quietly on mid tones.
     #EBE7DE is nearly white but keeps the warm cast, so it stays in family. */
  { key:'writing',    name:'Writing',    tone:{bg:'#484641', fg:'#EBE7DE'},
    what:'Essays, reviews, reports, emails, articles' },
  { key:'speaking',   name:'Speaking',   tone:{bg:'#DD8E58', fg:'#FEFCF9'},
    what:'Practice hub, picture tasks, dialogue work' }
];

const SKILLS = {
  grammar:[
    {name:"Tenses", url:"skills/grammar-rules/tenses-rules.html"},
    {name:"Conditionals", url:"skills/grammar-rules/conditionals-rules.html"},
    {name:"Past Modals", url:"skills/grammar-rules/past-modals-rules.html"},
    {name:"Comparatives", url:"skills/grammar-rules/comparatives-rules.html"},
    {name:"Passive Voice", url:"skills/grammar-rules/passive-voice-rules.html"},
    {name:"Reported Speech", url:"skills/grammar-rules/reported-speech-rules.html"},
    {name:"Linking Words", url:"skills/grammar-rules/linking-words-rules.html"},
    {name:"Inversion", url:"skills/grammar-rules/inversion-rules.html"},
    {name:"Gerunds & Infinitives", url:"skills/grammar-rules/gerunds-infinitives-rules.html"},
    {name:"Miscellaneous", url:"skills/grammar-rules/miscellaneous-rules.html"},
    {name:"Phrasal Verbs 1", url:"skills/grammar-rules/phrasal-verbs-quiz.html"},
    {name:"Phrasal Verbs 2", url:"skills/grammar-rules/phrasal-verbs-play.html"},
    {name:"Barometer", url:"skills/grammar-rules/barometer.html"},
    {name:"Report", url:"skills/grammar-rules/intuity-report.html"}
  ],
  vocabulary:[
    {name:"Similar Words", url:"skills/similar-words/vocabulary.html"},
    {name:"Collocations", url:"skills/similar-words/collocations.html"},
    {name:"Descriptive Words", url:"skills/similar-words/collective-expressions-master.html"},
    {name:"Phrasal Verbs", url:"skills/grammar-rules/phrasal-verbs.html"},
    {name:"Academic Vocabulary", url:"skills/similar-words/academic-vocabulary.html"},
    {name:"Idiomatic Expressions", url:"skills/similar-words/proverbs-quiz.html"},
    {name:"Useful Lists", url:"skills/similar-words/useful-lists.html"},
    {name:"Phrase Bank", url:"skills/similar-words/phrase-bank.html"}
  ],
  english:[
    {name:"Part 1 \u00b7 Multiple Choice Cloze", url:"skills/use-of-english/multiple-choice/multiple-choice.html"},
    {name:"Part 2 \u00b7 Open Cloze", url:"skills/use-of-english/gap-fill/gap-fill.html"},
    {name:"Part 3 \u00b7 Word Formation", url:"skills/use-of-english/word-formation/word-formation.html"},
    {name:"Part 4 \u00b7 Key Word Transformation", url:"skills/use-of-english/word-transformation/word-transformation.html"}
  ],
  reading:[
    {name:"Part 5 \u00b7 Multiple Choice", url:"skills/reading/multiple-choice-menu/reading-part5.html"},
    {name:"Part 6 \u00b7 Gapped Text", url:"skills/reading/gapped-texts-menu/reading-part6.html"},
    {name:"Part 7 \u00b7 Multiple Matching", url:"skills/reading/multiple-matching-menu/reading-part7.html"},
    {name:"Full tests", soon:true}
  ],
  writing:[
    {name:"Essays", sub:"essays"},
    {name:"Reviews", sub:"reviews"},
    {name:"Reports", sub:"reports"},
    {name:"Emails", sub:"emails"},
    {name:"Articles", url:"skills/writing/articles/article-question.html"},
    {name:"Narrative", url:"skills/writing/narrative/narrative-question.html"},
    {name:"Sentence Structure", sub:"sentence"},
    {name:"Assessment", sub:"assessment"},
    {name:"Writing Hub", url:"skills/writing/essays/writing-hub.html"},
    {name:"Slides", url:"skills/writing/slide-galleries-fetching.html"}
  ],
  speaking:[
    {name:"Practice Hub", url:"skills/speaking/hub-practice.html"},
    {name:"Speaking Slides", url:"skills/speaking/speaking-slides.html"},
    {name:"Part 2 \u00b7 Pictures", url:"skills/speaking/part2-picture.html"},
    {name:"Part 3 \u00b7 Dialogue", url:"skills/speaking/part3-dialogue.html"},
    {name:"Part 4 \u00b7 Discussion", url:"skills/speaking/part-four.html"},
    {name:"Phrase Bank", url:"skills/speaking/useful-expressions.html"},
    {name:"Structure \u00b7 Part 1", url:"skills/speaking/part1-structure.html"},
    {name:"Structure \u00b7 Part 2", url:"skills/speaking/part2-structure.html"},
    {name:"Structure \u00b7 Part 3", url:"skills/speaking/part3-structure.html"}
  ]
};

/* ── THE SECOND LEVEL ────────────────────────────────────────────────────
   Writing is the one area with real depth: each genre has a browse view, a
   structure view, a builder, samples and a writing surface. The old landing
   page opened these as sub-menus and the new one flattened them away, which
   quietly cost twenty-two working pages their only route in.

   A sub-panel rather than a longer list: thirty items under one heading is a
   wall, and the grouping is real — a student picks a genre first, then what
   they want to do with it. */
const SUB = {
  essays:{ title:"Essays", items:[
    {name:"Browse questions", url:"skills/writing/essays/essay-question.html"},
    {name:"Structures", url:"skills/writing/essays/essay-model.html"},
    {name:"Paragraph", url:"skills/writing/essays/essay-build.html"},
    {name:"Samples", url:"skills/writing/essays/essay-sample.html"},
    {name:"Lecture", url:"skills/writing/essays/essay-lecture.html"},
    {name:"Phrases", url:"skills/writing/essays/useful-expressions.html"},
    {name:"Plan", url:"skills/writing/essays/essay-plan.html"},
    {name:"Structures guide", url:"skills/writing/essays/structures-guide.html"}
  ]},
  reviews:{ title:"Reviews", items:[
    {name:"Browse questions", url:"skills/writing/reviews/review-question-selector.html"},
    {name:"Structures", url:"skills/writing/reviews/review-structure.html"},
    {name:"Builder", url:"skills/writing/reviews/review-builder.html"},
    {name:"Samples", url:"skills/writing/reviews/review-sample.html"},
    {name:"Write", url:"skills/writing/reviews/review-writer.html?mode=write"},
    {name:"Adjectives", url:"skills/writing/reviews/adjective-practice.html"}
  ]},
  reports:{ title:"Reports", items:[
    {name:"Browse questions", url:"skills/writing/reports/report-question-selector.html"},
    {name:"Structures", url:"skills/writing/reports/report-structure-practice.html"},
    {name:"Builder", url:"skills/writing/reports/report-sentence-builder.html"},
    {name:"Samples", url:"skills/writing/reports/report-sample.html"},
    {name:"Write", url:"skills/writing/reports/report-writer.html"},
    {name:"Adjectives", url:"skills/writing/reports/adjective-practice.html"}
  ]},
  emails:{ title:"Emails", items:[
    {name:"Browse questions", url:"skills/writing/emails/email-question.html"},
    {name:"Structures", url:"skills/writing/emails/emails-structure.html"},
    {name:"Builder", url:"skills/writing/emails/emails-builder.html"},
    {name:"Samples", url:"skills/writing/emails/email-sample.html"},
    {name:"Write", url:"skills/writing/emails/emails-write.html"},
    {name:"Plan", url:"skills/writing/emails/email-plan.html"},
    {name:"Model", url:"skills/writing/emails/email-model.html"},
    {name:"Adjectives", soon:true}
  ]},
  sentence:{ title:"Sentence Structure", items:[
    {name:"Sentence Builder", url:"skills/writing/sentence-structure/sentence-builder.html"},
    {name:"Paragraph Builder", url:"skills/writing/sentence-structure/paragraph-builder.html"},
    {name:"Cohesion Tools", url:"skills/writing/sentence-structure/cohesion-drills.html"},
    {name:"Band Descriptors", url:"skills/writing/sentence-structure/band-descriptors.html"},

  ]},
  assessment:{ title:"Assessment", items:[

};

const $ = id => document.getElementById(id);

/* Rows generated from the count, exactly as the section maps do it. */
const ROW_TOP = 15, ROW_BOT = 85;
function layoutFor(n){
  if(n === 1) return [{ y:(ROW_TOP+ROW_BOT)/2, capSide:'right' }];
  const span = ROW_BOT - ROW_TOP;
  return Array.from({length:n}, (_,i) => ({
    y: ROW_TOP + span * i / (n-1),
    capSide: i % 2 === 0 ? 'right' : 'left'
  }));
}

function buildMap(){
  const LAYOUT = layoutFor(AREAS.length);
  const mapWidthPx = $('map').clientWidth || 760;
  const OFFSET   = Math.max(8, Math.min(18, 46 / mapWidthPx * 100));
  const STEM_LEN = Math.max(30, Math.min(46, 150 / mapWidthPx * 100));
  const CAP_GAP  = 0.4;

  const pillXs = LAYOUT.map(n => n.capSide === 'right' ? 50 - OFFSET : 50 + OFFSET);
  const dirs   = LAYOUT.map(n => n.capSide === 'right' ? 1 : -1);
  const dots   = LAYOUT.map((n,i) => ({ x: pillXs[i] + dirs[i]*STEM_LEN, y: n.y }));

  let d = 'M '+dots[0].x+' '+dots[0].y;
  for(let i=1;i<dots.length;i++){
    const a = dots[i-1], b = dots[i], my = (a.y+b.y)/2;
    d += ' C '+a.x+' '+my+', '+b.x+' '+my+', '+b.x+' '+b.y;
  }
  let svg = '<path class="road" d="'+d+'"/>';
  AREAS.forEach((_,i) => {
    const n = LAYOUT[i], dot = dots[i];
    svg += '<line class="stem" data-i="'+i+'" x1="'+(pillXs[i]+dirs[i]*11)+'" y1="'+n.y+'" x2="'+dot.x+'" y2="'+n.y+'"/>'+
           '<circle class="dot" data-i="'+i+'" cx="'+dot.x+'" cy="'+n.y+'" r="0.46"/>';
  });
  $('mapPath').innerHTML = svg;

  $('nodes').innerHTML = AREAS.map((a,i) => {
    const n = LAYOUT[i], px = pillXs[i], dot = dots[i];
    const circleRight = px >= 50;
    const capFrom = n.capSide === 'right' ? dot.x + CAP_GAP : 3;
    const capTo   = n.capSide === 'right' ? 97 : dot.x - CAP_GAP;
    const count   = SKILLS[a.key].length;
    return '<div class="node" style="top:'+n.y+'%">'+
      '<button class="pill'+(circleRight?' circle-right':'')+'" data-key="'+a.key+'" data-i="'+i+'" '+
        'type="button" style="left:'+px+'%" aria-label="'+a.name+', '+count+' activities">'+
        '<span class="circle" style="background:'+a.tone.bg+';color:'+a.tone.fg+'">'+count+'</span>'+
        '<span class="rect" style="background:'+a.tone.bg+';color:'+a.tone.fg+'">'+a.name+'</span>'+
        '<span class="go" aria-hidden="true" style="color:'+a.tone.fg+'"><svg viewBox="0 0 24 24" '+
          'fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" '+
          'stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span>'+
      '</button>'+
      '<div class="cap '+n.capSide+'" style="left:'+capFrom+'%;right:'+(100-capTo)+'%">'+
        '<div class="ct">'+a.name+'</div>'+
        '<div class="cs">'+a.what+'</div>'+
      '</div>'+
    '</div>';
  }).join('');

  $('nodes').querySelectorAll('.pill').forEach(b => {
    b.onclick = () => openPanel(b.dataset.key, +b.dataset.i);
  });

  requestAnimationFrame(() => {
    const rects = $('nodes').querySelectorAll('.pill .rect');
    let maxW = 0;
    rects.forEach(r => { r.style.width = ''; maxW = Math.max(maxW, r.offsetWidth); });
    rects.forEach(r => { r.style.width = maxW + 'px'; });


    const PILL_GAP_PX = 5 * 96 / 25.4;
    const CAP_GAP_PX  = 2 * 96 / 25.4;
    const mapRect = $('map').getBoundingClientRect();
    const capEls  = $('nodes').querySelectorAll('.cap');
    const toPctX  = px => px / mapRect.width * 100;

    const tightDots = dots.map((dot,i) => {
      const pillEl = $('nodes').querySelector('.pill[data-i="'+i+'"]');
      const dir = dirs[i], pRect = pillEl.getBoundingClientRect();
      const edgePx = dir > 0 ? (pRect.right - mapRect.left) : (pRect.left - mapRect.left);
      return { x: toPctX(edgePx) + dir*toPctX(PILL_GAP_PX), y: dot.y };
    });
    const capDots = dots.map((dot,i) => {
      const dir = dirs[i], cRect = capEls[i].getBoundingClientRect();
      const capEdgePx = dir > 0 ? (cRect.left - mapRect.left) : (cRect.right - mapRect.left);
      return { x: toPctX(capEdgePx) - dir*toPctX(CAP_GAP_PX), y: dot.y };
    });

    $('nodes').querySelectorAll('.pill').forEach(pillEl => {
      const i = +pillEl.dataset.i;
      const stem = $('mapPath').querySelector('.stem[data-i="'+i+'"]');
      const dotE = $('mapPath').querySelector('.dot[data-i="'+i+'"]');
      if(stem){ stem.setAttribute('x1', tightDots[i].x); stem.setAttribute('x2', capDots[i].x); }
      if(dotE) dotE.setAttribute('cx', capDots[i].x);
    });

    if(tightDots.length < 2) return;

    /* ── THE WAVE ────────────────────────────────────────────────────────
       One cosine, as supplied and as every section map draws it. The arc
       experiments — true semicircles, then half-ellipses at 60% and 80% —
       are gone: they were geometrically exact and read worse. A cosine has
       no join to flatten because there is no join; the curvature varies
       smoothly along the whole length rather than resetting at every row.

       Amplitude is measured from the pill edges, so the wave keeps its
       relationship to the banners rather than to a constant. */
    const ys = tightDots.map(d => d.y);
    const y0 = ys[0], yN = ys[ys.length-1];
    const gap = (yN - y0) / (ys.length - 1);
    const LAM = 2 * gap;
    const xs  = tightDots.map(d => d.x);
    const cxW = (Math.min(...xs) + Math.max(...xs)) / 2;
    /* ── THE WAVE NEEDS A FLOOR, IN PIXELS ───────────────────────────────
       The amplitude is measured from the pill edges, and those edges are then
       pulled toward the centre by PILL_GAP_PX. On a phone that still leaves a
       generous swing. On a 1366px screen the pills sit at 42% and 58%, their
       facing edges land at 48.1% and 51.9%, and the 5mm gap closes that to
       49.5% and 50.5% — an amplitude of half a per cent, about 7px. That is
       the straight line.

       A floor in PIXELS rather than per cent, because the eye reads the wave
       at a physical size: 30px of swing looks the same on any screen, where
       30% of the width does not. The measurement still wins whenever it is
       larger, so the phone is untouched. */
    const MIN_AMP_PX = 30;
    const amp = Math.max(MIN_AMP_PX / mapRect.width * 100,
                         (Math.max(...xs) - Math.min(...xs)) / 2);
    /* Negated: the wave's phase only. The pills and captions keep their
       sides — this flips which way the first bulge leans, so the curve
       passes on the other side of each banner all the way down. */
    const side = -Math.sign(tightDots[0].x - cxW);
    const waveX = y => cxW + side * amp * Math.cos(2*Math.PI * (y - y0) / LAM);

    const EXT = 0.62, N = 240, pts = [];
    for(let i=0;i<=N;i++){
      const y = (y0 - EXT*gap) + ((yN + EXT*gap) - (y0 - EXT*gap)) * (i/N);
      pts.push({ x: waveX(y), y });
    }
    const road = $('mapPath').querySelector('.road');
    if(road) road.setAttribute('d',
      'M '+pts[0].x.toFixed(3)+' '+pts[0].y.toFixed(3)+
      pts.slice(1).map(p => ' L '+p.x.toFixed(3)+' '+p.y.toFixed(3)).join(''));

    /* ── EACH PILL 7mm FROM THE WAVE ─────────────────────────────────────
       The pills sat at a fixed 42% and 58%, so the gap to the road was
       whatever the arithmetic happened to leave — about 55px on a wide
       screen, and different again on a phone. Now the road is drawn first
       and each pill is placed against it: the edge that faces the wave stops
       exactly 7mm short of it, on every row and at every width.

       The order matters. Amplitude is measured from the pill edges, so
       moving the pills after the wave is computed would change the wave that
       positioned them — a loop that never settles. The wave is fixed first,
       then the pills are hung off it, and the wave is not recomputed. */
    /* 2.5mm, down from 7. The pill and the road are one object with a
       hairline between them, rather than two things near each other.

       It is a floor as much as a gap: the road is a curve and the pill edge
       is a straight vertical, so they are only this close at the row itself
       and the distance opens above and below. Below about 2mm the curve's
       shoulder starts to touch the pill's corner between rows, which reads
       as a collision even though the measured gap at the row is positive. */
    const CLEAR_PX = 2.5 * 96 / 25.4;
    const mapWpx = mapRect.width;
    const mapHpx = mapRect.height;
    $('nodes').querySelectorAll('.pill').forEach(pillEl => {
      const i = +pillEl.dataset.i, dir = dirs[i];
      const pRect = pillEl.getBoundingClientRect();
      const halfPill = pRect.width / 2;
      const halfHpct = (pRect.height / 2) / mapHpx * 100;

      /* ── MEASURED ACROSS THE PILL'S HEIGHT, NOT AT ITS MIDLINE ──────────
         The pill's edge is a straight vertical 44px tall; the road is a curve
         that leans back toward the centre as it leaves the row. So the two
         are closest at the pill's CORNERS, not beside its middle — at 2.5mm
         measured on the midline the corners came within half a pixel.

         Sampling the road across the pill's own height and taking the point
         that comes nearest gives a gap that is true along the whole edge. */
      let nearest = null;
      for(let s = -6; s <= 6; s++){
        const wx = waveX(LAYOUT[i].y + halfHpct * (s / 6)) / 100 * mapWpx;
        if(nearest === null) nearest = wx;
        else nearest = dir > 0 ? Math.min(nearest, wx) : Math.max(nearest, wx);
      }
      const edge = nearest - dir * CLEAR_PX;
      pillEl.style.left = ((dir > 0 ? edge - halfPill : edge + halfPill) / mapWpx * 100) + '%';
    });

    /* ── THE STEMS START BEYOND THE ROAD ─────────────────────────────────
       The caption and the wave sit on the SAME side of every pill, so a stem
       drawn from the pill's edge to its caption has to cross the road — on
       all six rows, not occasionally. Two lines meeting at a shallow angle
       read as a join, which is a relationship the map does not mean.

       So the stem begins on the far side of the road, the same 7mm clear of
       it as the pill is on the near side. The road passes through a
       symmetrical gap, touching nothing, and the caption still reads as
       belonging to its pill because nothing else is on that line. */
    $('nodes').querySelectorAll('.pill').forEach(pillEl => {
      const i = +pillEl.dataset.i, dir = dirs[i];
      const wavePx = waveX(LAYOUT[i].y) / 100 * mapWpx;
      const startPx = wavePx + dir * CLEAR_PX;
      const stem = $('mapPath').querySelector('.stem[data-i="'+i+'"]');
      if(stem) stem.setAttribute('x1', toPctX(startPx));
    });

    /* ── THE CAPTIONS COME IN, THE STEMS HALVE ───────────────────────────
       The captions were anchored to a stem length worked out before the
       pills moved — 150px of rule between the road and the text, on a page
       whose whole logic is now "everything hangs off the wave".

       So the stem is halved and the caption is re-anchored to where the stem
       now ends. Shortening the rule alone would have left the text where it
       was with a gap in front of it; the two have to move together, which is
       why the caption's box is rewritten here rather than at paint time. */
    $('nodes').querySelectorAll('.pill').forEach(pillEl => {
      const i = +pillEl.dataset.i, dir = dirs[i];
      const stem = $('mapPath').querySelector('.stem[data-i="'+i+'"]');
      const dotE = $('mapPath').querySelector('.dot[data-i="'+i+'"]');
      const capEl = capEls[i];
      if(!stem || !capEl) return;

      const x1 = parseFloat(stem.getAttribute('x1'));      /* just past the road */
      const x2 = parseFloat(stem.getAttribute('x2'));      /* at the caption */
      /* Half the run on a desktop; a third on a phone. The stem is the one
         element that carries no information — it is a rule pointing at text
         that is already obviously aligned with its pill — so it is the first
         thing to give up width when there is none to spare. Shortening it
         moves the caption closer to the wave, which is where the reading
         room comes from. */
      const frac = mapWpx < 560 ? 1/3 : 1/2;
      const half = x1 + (x2 - x1) * frac;

      stem.setAttribute('x2', half);
      if(dotE) dotE.setAttribute('cx', half);

      /* the caption starts where the stem now stops, plus its own small gap */
      const g = toPctX(CAP_GAP_PX);
      if(dir > 0){ capEl.style.left = (half + g) + '%'; capEl.style.right = '3%'; }
      else       { capEl.style.right = (100 - half + g) + '%'; capEl.style.left = '3%'; }
    });

    let caps = $('mapPath').querySelector('.endCaps');
    if(!caps){
      caps = document.createElementNS('http://www.w3.org/2000/svg','g');
      caps.setAttribute('class','endCaps');
      $('mapPath').appendChild(caps);
    }
    caps.innerHTML =
      '<circle class="endDot" fill="rgb(139,123,120)" cx="'+pts[0].x.toFixed(3)+'" cy="'+pts[0].y.toFixed(3)+'" r="0.46"/>'+
      '<circle class="endDot" fill="rgb(139,123,120)" cx="'+pts[N].x.toFixed(3)+'" cy="'+pts[N].y.toFixed(3)+'" r="0.46"/>';
  });
}

/* ---------- panel: the same poster the section maps open ---------- */
let lastFocus = null;
let panelStack = [];      /* where "back" returns to */

function itemHTML(o, n){
  const idx = '<span class="idx"><span>'+
    (o.sub ? '&rsaquo;' : String(n+1).padStart(2,'0'))+'</span></span>';
  if(o.soon)
    return '<div class="item soon">'+idx+'<span class="lbl">'+o.name+'</span>'+
           '<span class="tag">Soon</span></div>';
  if(o.sub)
    /* A sub-panel opens rather than navigates, so the arrow is a chevron —
       the same glyph the section maps use for "there is more behind this". */
    return '<button class="item" type="button" data-sub="'+o.sub+'">'+idx+
           '<span class="lbl">'+o.name+'</span>'+
           '<span class="go" aria-hidden="true">&rsaquo;</span></button>';
  return '<button class="item" type="button" data-url="'+o.url+'">'+idx+
         '<span class="lbl">'+o.name+'</span><span class="go">&rarr;</span></button>';
}

function paintPanel(title, list, accent, back){
  $('panel').style.setProperty('--accent', accent);
  $('panel').innerHTML =
    '<button class="x" id="panelX" type="button" aria-label="Close">&#10005;</button>'+
    (back
      ? '<button class="backlink" id="panelBack" type="button">&larr; '+back+'</button>'
      : '<div class="kick"><i></i>Cambridge B2 First</div>')+
    '<h2>'+title+'</h2>'+
    '<div class="items">'+list.map(itemHTML).join('')+'</div>';

  $('panelWrap').classList.add('open');
  $('panelX').onclick = closePanel;
  const b = $('panelBack');
  if(b) b.onclick = () => { const prev = panelStack.pop(); if(prev) prev(); };

  $('panel').querySelectorAll('.item[data-url]').forEach(el => {
    el.onclick = () => { location.href = el.dataset.url; };
  });
  $('panel').querySelectorAll('.item[data-sub]').forEach(el => {
    el.onclick = () => openSub(el.dataset.sub, accent, title);
  });
  $('panel').scrollTop = 0;
  $('panelX').focus();
}

function openPanel(key, i){
  const list = SKILLS[key]; if(!list) return;
  const area = AREAS[i];
  lastFocus = document.activeElement;
  panelStack = [];
  paintPanel(area.name, list, accentFor(area.tone.bg), null);
}

function openSub(subKey, accent, parentTitle){
  const s = SUB[subKey]; if(!s) return;
  /* remember how to get back, so the second level is never a dead end */
  const back = () => paintPanel(parentTitle, SKILLS.writing, accent, null);
  panelStack.push(back);
  paintPanel(s.title, s.items, accent, parentTitle);
}

/* Deepen a tone until it separates from the poster ground — same rule the
   section posters use, so the accent block always reads. */
function accentFor(bg){
  const hex = bg.match(/^#([0-9a-f]{6})$/i);
  let c;
  if(hex){ const n = parseInt(hex[1],16); c = [n>>16&255, n>>8&255, n&255]; }
  else { const m = bg.match(/[\d.]+/g); c = m && m.length>=3 ? m.slice(0,3).map(Number) : [20,17,14]; }
  const lum = v => 0.2126*v[0] + 0.7152*v[1] + 0.0722*v[2];
  /* the poster ground moved from #D4CEBE (~206) to #FBF8F3 */
  const GROUND = 248;
  let guard = 0;
  while(Math.abs(GROUND - lum(c)) < 55 && guard++ < 12) c = c.map(v => Math.round(v*0.86));
  return 'rgb('+c.join(',')+')';
}

function closePanel(){
  $('panelWrap').classList.remove('open');
  if(lastFocus) lastFocus.focus();
}
$('scrim').onclick = closePanel;
document.addEventListener('keydown', e => {
  if(e.key !== 'Escape' || !$('panelWrap').classList.contains('open')) return;
  /* one level at a time: a sub-panel returns to its parent, and only the top
     level closes the sheet */
  const prev = panelStack.pop();
  if(prev) prev(); else closePanel();
});

buildMap();
let t = null;
window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(buildMap, 150); });
if(document.fonts && document.fonts.ready) document.fonts.ready.then(buildMap);
</script>
