<style>
/* ── What INTUITY's shell, vocab.css and colloc.css supply, in miniature.
   Token names match INTUITY's, so wordformation.css (inlined after this
   block, unchanged) works here exactly as it does in the app. ── */
:root{
  --screen:#F3F1ED; --card:#FAF8F5; --tile-bg:#E8E1D6; --rule:#BCB1A0;
  --ink:#232C31; --paper:#4A433D; --dim:#5C5852; --faint:#756B6E;
  --accent:#DD8E58;
  --poster:var(--card); --poster-ink:#14110E; --poster-body:#5C5852;
  --poster-faint:rgba(20,17,14,.50); --poster-rule:rgba(20,17,14,.20);
  --poster-fill:rgba(20,17,14,.09); --poster-fill-hi:rgba(20,17,14,.15);
  --caramel:#B0865C;
  --tile-ok-bg:#D2E3D6; --tile-ok-ink:#1F4230; --tile-no-bg:#F3D9D2; --tile-no-ink:#6E2416;
  --r-field:3px;
  --f-display:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'Geist Mono',ui-monospace,Menlo,monospace;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--screen)}
body{font-family:var(--f-display);color:var(--paper);-webkit-font-smoothing:antialiased;
  padding-bottom:5.5rem}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.header{position:sticky;top:0;z-index:20;background:var(--screen);
  padding:.7rem 1rem .5rem;display:flex;flex-direction:column;align-items:center;gap:.45rem}
.header::after{content:'';position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  width:min(45rem,calc(100% - 2rem));height:1px;background:var(--rule)}
.title{font-weight:800;letter-spacing:.2em;font-size:1.05rem;color:var(--ink);text-transform:uppercase}
.subtitle{font-size:.6rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim);margin-top:-.25rem}
.seg{display:inline-flex;padding:.14rem;background:var(--tile-bg);border-radius:999px}
.seg button{font-size:.68rem;font-weight:600;letter-spacing:.04em;color:var(--dim);
  padding:.34rem .95rem;min-height:28px;border-radius:999px;white-space:nowrap;
  transition:background .18s,color .18s,box-shadow .18s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--screen);color:var(--ink);font-weight:700;
  box-shadow:0 1px 2px rgba(0,0,0,.08)}
.set-tabs{display:flex;flex-wrap:wrap;justify-content:center;gap:.1rem;max-width:45rem}
.vtab{position:relative;font-family:var(--f-mono);font-size:.62rem;letter-spacing:.09em;
  text-transform:uppercase;color:var(--faint);padding:.45rem .6rem;white-space:nowrap}
.vtab:hover{color:var(--ink)}
.vtab.active{color:var(--ink)}
.vtab.active::after{content:'';position:absolute;left:.6rem;right:.6rem;bottom:.22rem;
  height:1.5px;background:var(--accent);border-radius:1px}
.vtab .pct{opacity:.7;margin-left:.3rem;font-variant-numeric:tabular-nums}

/* layout */
.wrap{max-width:45rem;margin:0 auto;padding:1rem .75rem}
.strip{display:flex;align-items:center;justify-content:space-between;gap:1rem;
  padding:0 .25rem .8rem;font-family:var(--f-mono);font-size:.62rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--faint)}
.strip-tally{margin-left:.55rem;color:var(--ink)}
.dots{display:flex;gap:.3rem;flex-wrap:wrap;justify-content:flex-end}
.dot{width:7px;height:7px;border-radius:50%;background:var(--rule)}
.dot.answered{background:var(--ink)}
.dot.answered.miss{background:#A23B2C}
.bank,.board.quiz{display:flex;flex-direction:column;gap:.6rem}
.pat-note{font-size:.84rem;line-height:1.6;color:var(--dim);padding:0 0 .9rem;
  margin-bottom:.2rem;border-bottom:1px solid var(--rule)}
.error,.loading{padding:2rem 1rem;text-align:center;color:var(--dim)}

/* the card */
.poster{position:relative;background:var(--poster);box-shadow:0 1px 3px rgba(0,0,0,.10);
  padding:clamp(1.3rem,4.4vw,1.9rem) clamp(1.1rem,4vw,1.6rem)}
.kick{display:flex;align-items:center;gap:9px;font-family:var(--f-mono);font-size:.56rem;
  letter-spacing:.22em;text-transform:uppercase;color:var(--poster-faint);margin-bottom:.9rem}
.kick i{display:block;width:26px;height:10px;flex:none;background:var(--caramel)}
.poster .node{font-family:'Anton',Impact,'Arial Narrow',sans-serif;font-weight:400;
  font-size:clamp(1.47rem,6.3vw,2.1rem);line-height:.95;color:var(--poster-ink);margin:0 0 .2rem}
.cols{display:flex;flex-direction:column;gap:.05rem}
.col{display:grid;grid-template-columns:minmax(6.5rem,auto) 1fr;gap:.1rem .9rem;
  align-items:baseline;padding:.45rem 0}
.col+.col{border-top:1px solid var(--poster-rule)}
.col .w{font-weight:700;font-size:1rem;color:var(--poster-ink);justify-self:start}
.col.strong .w{box-shadow:inset 0 -1px 0 var(--caramel)}
.col .eg{font-size:.9rem;line-height:1.55;color:var(--poster-body)}
.col .eg b{font-weight:600;color:var(--poster-ink)}
.avoid{margin-top:.9rem;padding-top:.75rem;border-top:1px solid var(--poster-rule)}
.avoid-label{font-family:var(--f-mono);font-size:.56rem;letter-spacing:.2em;
  text-transform:uppercase;color:var(--poster-faint);margin-bottom:.5rem}
.av{display:grid;grid-template-columns:minmax(6.5rem,auto) 1fr;gap:.1rem .9rem;
  align-items:baseline;padding:.3rem 0}
.av .w{font-weight:700;font-size:.95rem;color:var(--poster-faint);
  text-decoration:line-through;text-decoration-thickness:1px}
.av .why{font-size:.82rem;line-height:1.5;color:var(--poster-body)}

/* practice */
.q .stem{font-size:1.05rem;line-height:1.75;color:var(--poster-body);margin:.4rem 0 .8rem}
.q .gap{display:inline-block;min-width:5em;padding:.1em .6em;margin:0 .12rem;
  border-radius:var(--r-field);background:var(--poster-fill);font-weight:600;color:var(--poster-ink)}
.q.done .gap{background:none;padding:0 .1em;font-family:'Anton',Impact,sans-serif;
  font-weight:400;font-size:1.25em;line-height:1;box-shadow:inset 0 -2px 0 var(--caramel)}
.q.done.miss .gap{box-shadow:none;color:var(--tile-no-ink);text-decoration:line-through;
  text-decoration-thickness:1px}
.picks{display:flex;flex-wrap:wrap;gap:.55rem}
.pick{font-size:.82rem;font-weight:600;padding:.45rem .9rem;border-radius:999px;
  background:var(--poster-fill);box-shadow:0 2px 5px rgba(20,17,14,.08);color:var(--poster-body);
  transition:background .15s,transform .1s}
.pick:hover:not(:disabled){background:var(--poster-fill-hi)}
.pick:active:not(:disabled){transform:scale(.96)}
.pick:disabled{cursor:default}
.pick.picked{background:var(--poster-ink);box-shadow:none;color:var(--poster)}
.pick.is-answer{background:var(--tile-ok-bg);box-shadow:none;color:var(--tile-ok-ink)}
.pick.is-wrong{background:var(--tile-no-bg);box-shadow:none;color:var(--tile-no-ink);
  text-decoration:line-through;text-decoration-thickness:1px}
.pick:disabled:not(.is-answer):not(.is-wrong){opacity:.4}
.why-note{display:none;margin-top:.7rem;padding:.1rem 0 .1rem .8rem;
  border-left:2px solid var(--caramel);font-size:.86rem;line-height:1.55;color:var(--poster-body)}
.why-note.show{display:block}
.why-note b{color:var(--poster-ink);font-weight:600}
.score-banner{text-align:center;padding:1.2rem 1rem;background:var(--card);
  box-shadow:0 1px 3px rgba(0,0,0,.10)}
.score-banner.clean{outline:2px solid var(--caramel)}
.score-text{font-family:'Anton',Impact,sans-serif;font-size:2.4rem;color:var(--poster-ink);line-height:1}
.score-label{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--poster-faint);margin-top:.35rem}
.poster.shake{animation:shake .42s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-9px)}
  40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}

/* action bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:none;justify-content:center;
  gap:.6rem;padding:.8rem 1rem calc(.8rem + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to top,var(--screen) 70%,rgba(243,241,237,0))}
.btn{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:.7rem 1.4rem;min-height:44px;border-radius:4px}
.btn.primary{background:var(--ink);color:var(--screen)}
.btn.primary:disabled{background:var(--rule);color:var(--faint);cursor:default}
.btn.secondary{background:var(--tile-bg);color:var(--ink)}

@media (max-width:640px){
  .col,.av{grid-template-columns:1fr;gap:.15rem}
  .pick{font-size:16px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
