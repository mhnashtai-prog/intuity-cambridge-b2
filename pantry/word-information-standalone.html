<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word formation lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F6FB; --card:#FFFFFF; --ink:#14172B; --body:#394058; --dim:#5E6480; --rule:#DCDFEE; --tint:#ECEEF8;
  --pre:#D9412F; --pre-t:#FFFFFF; --suf:#08806A; --suf-t:#FFFFFF; --hl:#FFE066;
  --ok-bg:#D6F2E2; --ok-ink:#10432A; --no-bg:#FFDFD8; --no-ink:#7A1F12;
  --disp:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --text:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1120; --card:#191C33; --ink:#F2F3FA; --body:#C6C9DE; --dim:#9CA0BC; --rule:#2D3153; --tint:#232744;
    --pre:#FF8A7A; --pre-t:#2A0C07; --suf:#3DD6B5; --suf-t:#04231C; --hl:#7A6A12;
    --ok-bg:#16402B; --ok-ink:#CFF5DF; --no-bg:#4A1D17; --no-ink:#FFD3CB;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1120; --card:#191C33; --ink:#F2F3FA; --body:#C6C9DE; --dim:#9CA0BC; --rule:#2D3153; --tint:#232744;
  --pre:#FF8A7A; --pre-t:#2A0C07; --suf:#3DD6B5; --suf-t:#04231C; --hl:#7A6A12;
  --ok-bg:#16402B; --ok-ink:#CFF5DF; --no-bg:#4A1D17; --no-ink:#FFD3CB;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 7rem)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--body);font-family:var(--text);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:3px solid var(--pre);outline-offset:2px}
p{max-width:62ch}

/* the one bold thing: morpheme tiles */
.tile{display:inline-block;padding:.1em .5em .14em;border-radius:7px;font-family:var(--disp);font-weight:700;line-height:1.25;white-space:nowrap}
.tile.pre{background:var(--pre);color:var(--pre-t)}
.tile.suf{background:var(--suf);color:var(--suf-t)}
.tile.base{background:var(--ink);color:var(--bg)}
.plus{color:var(--dim);font-weight:600;margin:0 .3em}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--rule)}
.hwrap{max-width:46rem;margin:0 auto;padding:.7rem .9rem .5rem;display:grid;grid-template-columns:1fr auto;gap:.5rem .8rem;align-items:center}
.logo{font-size:1.25rem;display:flex;align-items:center;gap:.15rem;flex-wrap:wrap}
.logo .tile{font-size:1.05rem}
.me{text-align:right;font-size:.8rem;color:var(--dim);line-height:1.25}
.me b{display:block;color:var(--ink);font-family:var(--disp);font-size:.95rem}
.xpbar{height:5px;border-radius:3px;background:var(--tint);margin-top:.3rem;overflow:hidden;min-width:7.5rem}
.xpbar i{display:block;height:100%;background:var(--suf);transition:width .4s}
nav{grid-column:1/-1;display:flex;gap:.25rem;overflow-x:auto}
nav button{flex:1;padding:.5rem .6rem;min-height:44px;border-radius:10px;font-weight:600;font-size:.9rem;color:var(--dim);white-space:nowrap}
nav button.on{background:var(--ink);color:var(--bg)}
nav button:not(.on):hover{background:var(--tint);color:var(--ink)}

main{max-width:46rem;margin:0 auto;padding:1rem .9rem 4rem}
h1,h2,h3,.node{font-family:var(--disp);color:var(--ink);line-height:1.1}
.filters{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:.9rem;align-items:center}
.seg{display:inline-flex;background:var(--tint);padding:3px;border-radius:999px;flex-wrap:wrap}
.seg button{padding:.35rem .85rem;min-height:36px;border-radius:999px;font-size:.85rem;font-weight:600;color:var(--dim)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.sel{display:inline-flex;align-items:center;gap:.4rem;font-size:.85rem;color:var(--dim);font-weight:600}
select,.search,#ti{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--rule);border-radius:10px;padding:.45rem .7rem;min-height:40px}
.search{flex:1;min-width:10rem}
.count{font-size:.85rem;color:var(--dim);margin:0 0 .6rem}
.list{display:flex;flex-direction:column;gap:.8rem}

.card{background:var(--card);border-radius:16px;padding:1.1rem 1.1rem 1rem;border:1px solid var(--rule)}
.meta{font-size:.78rem;color:var(--dim);font-weight:600;margin-bottom:.4rem}
.head{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.4rem}
.node{font-size:clamp(1.7rem,6vw,2.3rem);font-weight:800}
.pos{font-size:.8rem;color:var(--dim)}
.spk{width:36px;height:36px;border-radius:50%;background:var(--tint);font-size:1rem}
.spk:hover{background:var(--rule)}
.row{padding:.85rem 0;border-top:1px solid var(--rule)}
.rw{display:flex;align-items:baseline;gap:.5rem}
.w{font-family:var(--disp);font-weight:700;font-size:1.25rem;color:var(--ink);text-align:left}
.row.strong .w{background:linear-gradient(transparent 62%,var(--hl) 62%)}
.cl{font-size:.75rem;color:var(--dim);font-weight:600}
.mast{font-size:.75rem;color:var(--suf);font-weight:700}
.eq{margin:.35rem 0;font-size:.9rem}
.gl{color:var(--ink);font-weight:500;font-size:.95rem}
.eg{margin-top:.25rem;font-size:.95rem}
.eg b{color:var(--ink)}
.eg.teen{color:var(--dim)}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.55rem}
.chip{font-size:.8rem;font-weight:600;padding:.3rem .7rem;min-height:32px;border-radius:999px;background:var(--tint);color:var(--ink)}
.chip:hover{background:var(--rule)}
.pop{margin-top:.6rem;padding:.7rem .9rem;border-radius:12px;background:var(--tint);color:var(--ink);font-size:.92rem}
.pop[hidden]{display:none}
.avoid{margin-top:.2rem;padding-top:.7rem;border-top:1px solid var(--rule)}
.avoid h3{font-size:.9rem;margin-bottom:.4rem}
.av{display:grid;grid-template-columns:minmax(6rem,auto) 1fr;gap:.6rem;padding:.2rem 0;font-size:.9rem}
.av s{color:var(--no-ink);font-weight:700;text-decoration-thickness:2px}
.note{margin-top:.8rem;padding:.2rem 0 .2rem .8rem;border-left:4px solid var(--hl);color:var(--ink);font-size:.92rem}
.empty{padding:2rem 1rem;text-align:center;color:var(--dim)}

/* practice */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:.7rem;margin-top:.6rem}
.mode{text-align:left;padding:1rem;border-radius:16px;background:var(--card);border:1.5px solid var(--rule);transition:transform .12s,border-color .12s}
.mode:hover{border-color:var(--ink);transform:translateY(-2px)}
.mode h3{font-size:1.1rem;margin-bottom:.25rem}
.mode p{font-size:.88rem;color:var(--dim)}
.sbar{display:flex;align-items:center;gap:.7rem;margin-bottom:.8rem}
.x{width:40px;height:40px;border-radius:50%;background:var(--tint);font-size:1rem}
.prog{flex:1;height:10px;border-radius:5px;background:var(--tint);overflow:hidden}
.prog i{display:block;height:100%;background:var(--suf);border-radius:5px;transition:width .3s}
.combo{min-width:3.5rem;text-align:right;font-weight:700;color:var(--pre)}
.q .stem{font-size:1.2rem;line-height:1.7;color:var(--ink);margin:.6rem 0 1rem}
.q .stem b{font-weight:800}
.gap{display:inline-block;min-width:3.4em;padding:0 .4em;border-radius:6px;background:var(--tint);box-shadow:inset 0 -3px 0 var(--dim);font-weight:700;text-align:center;color:var(--ink)}
.gap.wrong{background:var(--no-bg);color:var(--no-ink);box-shadow:none;text-decoration:line-through;text-decoration-thickness:2px}
.gap.ok{background:var(--ok-bg);color:var(--ok-ink);box-shadow:none}
.gap.miss{background:var(--no-bg);color:var(--no-ink);box-shadow:none;text-decoration:line-through}
.picks{display:flex;flex-wrap:wrap;gap:.6rem}
.pick{padding:.6rem 1.1rem;min-height:46px;border-radius:12px;background:var(--tint);color:var(--ink);font-weight:700;font-size:1rem;border:2px solid transparent;transition:transform .1s}
.pick:hover:not(:disabled){border-color:var(--ink)}
.pick:active:not(:disabled){transform:scale(.96)}
.pick:disabled{cursor:default}
.pick.is-answer{background:var(--ok-bg);color:var(--ok-ink);border-color:var(--ok-ink)}
.pick.is-wrong{background:var(--no-bg);color:var(--no-ink);text-decoration:line-through}
.pick:disabled:not(.is-answer):not(.is-wrong){opacity:.45}
.typebox{display:flex;gap:.5rem;flex-wrap:wrap}
#ti{flex:1;min-width:10rem;font-size:1.1rem;font-weight:700}
.btn{padding:.6rem 1.2rem;min-height:46px;border-radius:12px;font-weight:700;background:var(--tint);color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn:hover{filter:brightness(.95)}
.fb{margin-top:1rem;padding:.9rem 1rem;border-radius:12px;background:var(--tint)}
.fb[hidden]{display:none}
.fb.ok{background:var(--ok-bg);color:var(--ok-ink)}
.fb.no{background:var(--no-bg);color:var(--no-ink)}
.fb-h{font-family:var(--disp);font-weight:800;font-size:1.1rem;margin-bottom:.25rem}
.fb p{margin:.2rem 0;color:inherit}
.fb .btn{margin-top:.7rem}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}}
.big{font-family:var(--disp);font-weight:800;font-size:3rem;color:var(--ink);line-height:1}
.res{text-align:center}
.res .acts{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;margin-top:1rem}
.miss-list{text-align:left;margin-top:1rem}
.miss-list .row:first-child{border-top:none}

/* lab */
.lab-top{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-bottom:.8rem}
.stage{text-align:center;padding:1.3rem 1rem}
.stage .tile.base{font-size:clamp(1.8rem,8vw,2.8rem);padding:.1em .6em .16em}
.palette{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin:1.1rem 0 .5rem}
.palette .tile{font-size:1.05rem;min-height:44px;padding:.35em .8em;border:3px solid transparent;transition:transform .1s}
.palette .tile:hover{transform:translateY(-2px)}
.palette .tile.done{opacity:.4;cursor:default;transform:none}
.palette .tile.tried{opacity:.45;text-decoration:line-through}
.lab-msg{min-height:1.6em;color:var(--no-ink);font-weight:600;font-size:.95rem}
.lab-msg b{text-decoration:line-through}
.found-n{font-weight:700;color:var(--ink)}
.win{margin-top:.8rem;padding:.7rem 1rem;border-radius:12px;background:var(--ok-bg);color:var(--ok-ink);font-weight:700}

/* progress */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(8.5rem,1fr));gap:.6rem;margin-bottom:1rem}
.stat{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:.8rem}
.stat b{display:block;font-family:var(--disp);font-size:1.8rem;color:var(--ink);line-height:1.1}
.stat span{font-size:.82rem;color:var(--dim)}
.sec{margin-top:1.4rem}
.sec h2{font-size:1.25rem;margin-bottom:.5rem}
.pill{display:inline-block;margin:.15rem .25rem .15rem 0;padding:.25rem .7rem;border-radius:999px;background:var(--tint);color:var(--ink);font-weight:600;font-size:.88rem}
.data-box{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:1rem}
.data-box p{font-size:.9rem;margin:.3rem 0 .6rem}
.tip{font-size:.85rem;color:var(--dim)}
footer{max-width:46rem;margin:0 auto;padding:1rem .9rem 2rem;font-size:.8rem;color:var(--dim);border-top:1px solid var(--rule)}
.skel{display:flex;flex-direction:column;gap:.8rem}
.skel i{display:block;height:7.5rem;border-radius:16px;background:linear-gradient(90deg,var(--tint),var(--rule),var(--tint));background-size:200% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.err{background:var(--card);border:1px solid var(--rule);border-left:6px solid var(--pre);border-radius:16px;padding:1.2rem}
.err h2{font-size:1.3rem;margin-bottom:.4rem}
.err p,.err li{margin:.4rem 0;font-size:.95rem}
.err ol{padding-left:1.2rem}
.err code{background:var(--tint);padding:.1em .4em;border-radius:5px;font-size:.88rem;color:var(--ink)}
.warn{font-size:.85rem;color:var(--no-ink);background:var(--no-bg);border-radius:10px;padding:.6rem .8rem;margin-top:.5rem}
.warn li{margin-left:1rem}
@media (max-width:560px){.av{grid-template-columns:1fr;gap:.1rem}.hwrap{grid-template-columns:1fr}.me{text-align:left}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* v2.2 additions */
.goal{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:.8rem 1rem;margin-bottom:.8rem}
.goal-t{display:flex;justify-content:space-between;gap:.6rem;font-size:.85rem;color:var(--dim);margin-bottom:.4rem}
.goal-t b{color:var(--ink);font-family:var(--disp)}
.mode.hero{grid-column:1/-1;background:var(--ink);border-color:var(--ink)}
.mode.hero h3,.mode.hero p{color:var(--bg)}
.mode.hero h3{font-size:1.3rem}
.pick .k{display:inline-block;min-width:1.4em;margin-right:.5em;padding:0 .3em;border-radius:5px;background:var(--card);color:var(--dim);font-size:.75rem;line-height:1.5;text-align:center}
@media (pointer:coarse){.pick .k{display:none}}
.hearts{font-size:1.2rem;letter-spacing:.15em;margin-bottom:.6rem}
.lose{margin-top:.8rem;padding:.7rem 1rem;border-radius:12px;background:var(--no-bg);color:var(--no-ink);font-weight:700}
.badges{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:.5rem}
.badge{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:.6rem .8rem}
.badge b{display:block;color:var(--ink);font-family:var(--disp);font-size:.95rem}
.badge span{font-size:.8rem;color:var(--dim)}
.badge.locked{opacity:.6;background:var(--tint)}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 1rem);display:flex;flex-direction:column;gap:.4rem;align-items:center;z-index:50;pointer-events:none;width:calc(100% - 2rem);max-width:30rem}
.toast{background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:12px;font-weight:700;font-size:.92rem;box-shadow:0 4px 14px rgba(0,0,0,.3);animation:pop .3s}
@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}

/* v2.3 effects and feedback */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
.combo{min-width:6rem;white-space:nowrap}
.bump{display:inline-block;animation:bump .55s}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.35);color:var(--suf)}100%{transform:scale(1)}}
.fb.ok{animation:glow .9s}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(61,214,181,.7)}100%{box-shadow:0 0 0 18px rgba(61,214,181,0)}}
.stars{font-size:2.4rem;letter-spacing:.12em;color:var(--dim);line-height:1;margin-bottom:.4rem}
.stars .on{color:#F5B700;display:inline-block;animation:tw 1.6s ease-in-out infinite;animation-delay:calc(var(--i)*.25s)}
@keyframes tw{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.2) rotate(8deg)}}
.coach{margin:1rem auto 0;padding:.8rem 1rem;border-radius:12px;background:var(--tint);color:var(--ink);text-align:left;font-size:.92rem}
.coach b{font-family:var(--disp)}
.coach p{margin:.25rem 0 0}
</style>
</head>
<body>
<header>
 <div class="hwrap">
  <div class="logo" aria-label="Word formation lab"><span class="tile pre">re-</span><span class="tile base">form</span><span class="tile suf">-ation</span><span style="margin-left:.4rem;font-family:var(--disp);font-weight:800;color:var(--ink)">lab</span></div>
  <div class="me" id="me"></div>
  <nav id="nav" aria-label="Sections">
   <button data-act="tab" data-t="practice" class="on">Practise</button>
   <button data-act="tab" data-t="lab">Word lab</button>
   <button data-act="tab" data-t="explore">Explore</button>
   <button data-act="tab" data-t="progress">My progress</button>
  </nav>
 </div>
</header>
<main id="view"><div class="skel" aria-busy="true"><i></i><i></i><i></i></div></main>
<footer id="foot"></footer>


<script>window.WF_DATA={"meta":{"schema":"wordformation-v2","title":"Word formation","audience":"Learners aged 13-15","level":"B2-C1","version":"2.1","provenance":"Seed set, drafted rather than harvested. Pairs, spelling rules and sentences are standard but not checked against a frequency list. Review before classroom use."},"rules":[{"id":"drop-e","title":"Drop the e","text":"A silent e disappears before an ending that starts with a vowel: create + ive = creative."},{"id":"keep-e","title":"Keep the e","text":"Keep the e after c or g so the sound stays soft: courage + ous = courageous."},{"id":"y-to-i","title":"y becomes i","text":"After a consonant, y changes to i before most endings: happy + ness = happiness, rely + able = reliable."},{"id":"double","title":"Double the letter","text":"Some words double the last letter before an ending: sun + y = sunny. After a prefix, both letters stay: mis + spell = misspell."},{"id":"stem-change","title":"The stem changes","text":"Some words change inside before the ending. Learn the pair, not the rule: decide, decision. strong, strength."},{"id":"assimilation","title":"in- changes shape","text":"in- becomes im- before p or m, il- before l and ir- before r."},{"id":"keep-both","title":"Keep every letter","text":"A prefix or ending never removes a letter from the base: dis + satisfied, embarrass + ment."}],"affixes":{"un-":{"meaning":"not, the opposite","tip":"The most common negative prefix. Use it with many adjectives and with verbs that reverse an action."},"in-":{"meaning":"not","tip":"Often used with Latin-style words: inaccurate, incomplete. Changes to im-, il-, ir-."},"im-":{"meaning":"not","tip":"in- before p or m: impatient, immature."},"il-":{"meaning":"not","tip":"in- before l: illegal, illogical."},"ir-":{"meaning":"not","tip":"in- before r: irregular, irresponsible."},"dis-":{"meaning":"not, the opposite, apart","tip":"Used with verbs and nouns: disagree, dishonest, disconnect."},"mis-":{"meaning":"wrongly, badly","tip":"Something done in the wrong way: misunderstand, mislead."},"re-":{"meaning":"again","tip":"Do something a second time: rebuild, rewrite."},"over-":{"meaning":"too much","tip":"overestimate, overreact. The opposite is under-."},"under-":{"meaning":"too little","tip":"underestimate, underpay."},"en-":{"meaning":"cause to be, put into","tip":"Makes verbs: enable, enlarge, encourage."},"-ion":{"meaning":"the act or result of","tip":"Makes nouns from verbs. The stem often changes: decide, decision."},"-ation":{"meaning":"the act or result of","tip":"Makes nouns from verbs ending in -ate, -ise, or -ify: organise, organisation."},"-ition":{"meaning":"the act or result of","tip":"Makes nouns from verbs like compete: competition."},"-ive":{"meaning":"having the quality of","tip":"Makes adjectives from verbs: attractive, creative."},"-ful":{"meaning":"full of","tip":"Only one l. Careful, useful, successful."},"-less":{"meaning":"without","tip":"The opposite of -ful: careless, useless."},"-able":{"meaning":"can be done","tip":"More common than -ible. Use it with whole base words: enjoyable, reliable."},"-ible":{"meaning":"can be done","tip":"Sounds the same as -able. Only the spelling tells you: accessible, visible."},"-ous":{"meaning":"full of, having","tip":"Makes adjectives: dangerous, nervous, jealous."},"-eous":{"meaning":"full of, having","tip":"Keeps the e after g to keep the soft sound: courageous, outrageous."},"-ious":{"meaning":"full of, having","tip":"Often after the letters c, t or x: cautious, suspicious."},"-ment":{"meaning":"the result of an action","tip":"Makes nouns from verbs. Keep the base letters: improvement, embarrassment."},"-ness":{"meaning":"the state of being","tip":"Makes nouns from adjectives: happiness, kindness."},"-ity":{"meaning":"the state or quality of","tip":"Makes nouns from adjectives: popularity, creativity."},"-ance":{"meaning":"the state of, the act of","tip":"Sounds the same as -ence, so learn each noun: importance, appearance."},"-ence":{"meaning":"the state of, the act of","tip":"Often follows -ent adjectives: confident, confidence."},"-ant":{"meaning":"a person or thing that, having the quality of","tip":"tolerant, pollutant."},"-ent":{"meaning":"having the quality of","tip":"Adjectives: different, dependent, confident."},"-al":{"meaning":"to do with","tip":"Makes adjectives from nouns: environmental, national."},"-ial":{"meaning":"to do with","tip":"influential, financial."},"-ical":{"meaning":"to do with","tip":"Sometimes has a different meaning from -ic: economic and economical."},"-ic":{"meaning":"to do with","tip":"historic, economic, artistic."},"-ly":{"meaning":"in this way","tip":"Makes adverbs. Watch the spelling: happily, truly, gently."},"-ally":{"meaning":"in this way","tip":"After adjectives ending in -ic: basically."},"-ify":{"meaning":"make, become","tip":"Makes verbs: simplify, clarify, justify."},"-ise":{"meaning":"make, become","tip":"Makes verbs. British spelling; -ize is American."},"-en":{"meaning":"make, become","tip":"Makes verbs from adjectives: widen, strengthen."},"-th":{"meaning":"the state of","tip":"Makes nouns, with a vowel change: long, length. deep, depth."},"-ist":{"meaning":"a person who does or studies","tip":"scientist, artist, environmentalist."},"-er":{"meaning":"a person who does something","tip":"employer, influencer."},"-or":{"meaning":"a person who does something","tip":"visitor, competitor."},"-y":{"meaning":"state, quality","tip":"Makes nouns (jealousy, honesty) and adjectives (sunny)."},"-acy":{"meaning":"the state of","tip":"privacy, democracy."},"-ety":{"meaning":"the state of","tip":"anxiety, society."},"-ing":{"meaning":"causing a feeling, or happening now","tip":"Makes adjectives from verbs: confusing, embarrassing. Compare -ed: embarrassed means how you feel."}},"nodes":[{"base":"decide","pos":"verb","level":"B2","topic":"school","forms":[{"w":"decision","cls":"noun","type":"suffix","affix":"-ion","strength":"strong","rule":"stem-change","gloss":"a choice you make after thinking","ex":"It was a difficult decision.","teen":"Choosing my subjects for next year was a big decision."},{"w":"decisive","cls":"adjective","type":"suffix","affix":"-ive","strength":"strong","rule":"stem-change","gloss":"able to decide quickly and clearly","ex":"She took decisive action.","teen":"The captain made a decisive move in the last minute."}],"avoid":[{"w":"decidion","for":"decision","why":"Wrong. decide loses -de and gains -s: de-cis-ion."},{"w":"decisative","for":"decisive","why":"Wrong. decide loses -de and gains -s: de-cis-ive."}]},{"base":"create","pos":"verb","level":"B2","topic":"tech","forms":[{"w":"creation","cls":"noun","type":"suffix","affix":"-ion","strength":"strong","rule":"drop-e","gloss":"the act of making something new","ex":"The creation of new jobs is a priority.","teen":"Her latest creation is a game about robots."},{"w":"creative","cls":"adjective","type":"suffix","affix":"-ive","strength":"strong","rule":"drop-e","gloss":"full of new ideas","ex":"She found a creative solution.","teen":"My friend is really creative and designs her own clothes."},{"w":"creativity","cls":"noun","type":"suffix","affix":"-ity","strength":"medium","rule":"drop-e","gloss":"the ability to think of new ideas","ex":"Children show great creativity.","teen":"Making videos gives me a way to show my creativity."}],"avoid":[{"w":"creatative","for":"creative","why":"Wrong. Drop the e of create, then add -ive."},{"w":"creatation","for":"creation","why":"Wrong. Drop the e of create, then add -ion."}]},{"base":"attract","pos":"verb","level":"B2","topic":"general","forms":[{"w":"attraction","cls":"noun","type":"suffix","affix":"-ion","strength":"strong","gloss":"something that makes people want to visit","ex":"The castle is a major tourist attraction.","teen":"The water park was the main attraction of the trip."},{"w":"attractive","cls":"adjective","type":"suffix","affix":"-ive","strength":"strong","gloss":"pleasant to look at or interesting","ex":"That is an attractive offer.","teen":"The new phone has an attractive design."}],"avoid":[{"w":"attractful","for":"attractive","why":"Wrong. This verb takes -ive, not -ful."},{"w":"atraction","for":"attraction","why":"Spelling. Keep both t: attract + ion."}]},{"base":"addict","pos":"verb","level":"C1","topic":"tech","forms":[{"w":"addiction","cls":"noun","type":"suffix","affix":"-ion","strength":"strong","gloss":"being unable to stop doing or using something","ex":"He is fighting an addiction to gambling.","teen":"Some people talk about a phone addiction."},{"w":"addictive","cls":"adjective","type":"suffix","affix":"-ive","strength":"strong","gloss":"so enjoyable that it is hard to stop","ex":"Sugar can be addictive.","teen":"Short videos are very addictive."}],"avoid":[{"w":"adiction","for":"addiction","why":"Spelling. Keep both d: addict + ion."},{"w":"adictive","for":"addictive","why":"Spelling. Keep both d: addict + ive."}]},{"base":"influence","pos":"noun","level":"C1","topic":"society","forms":[{"w":"influential","cls":"adjective","type":"suffix","affix":"-ial","strength":"strong","rule":"stem-change","gloss":"having a strong effect on people","ex":"She is an influential writer.","teen":"Which online creators are the most influential for your age group?","alts":["-al","-ical","-ive"],"altwhy":{"-al":"-ial is needed here: influence changes to influent- before the ending."}},{"w":"influencer","cls":"noun","type":"suffix","affix":"-er","strength":"strong","gloss":"a person who affects what others buy or do online","ex":"The brand paid an influencer to advertise it.","teen":"My cousin wants to become an influencer."}],"avoid":[{"w":"influencial","for":"influential","why":"Wrong. The c changes to t: influence, influential."},{"w":"influencor","for":"influencer","why":"Wrong. A person who influences is an influencer."}]},{"base":"popular","pos":"adjective","level":"B2","topic":"society","forms":[{"w":"popularity","cls":"noun","type":"suffix","affix":"-ity","strength":"strong","gloss":"being liked by many people","ex":"The band's popularity grew quickly.","teen":"The popularity of the game has exploded."},{"w":"unpopular","cls":"adjective","type":"prefix","affix":"un-","strength":"medium","gloss":"not liked by many people","ex":"It was an unpopular decision.","teen":"The new school rule is very unpopular.","alts":["in-","dis-","im-"]}],"avoid":[{"w":"inpopular","for":"unpopular","why":"Wrong. popular takes un-."},{"w":"popularety","for":"popularity","why":"Wrong. The noun ending is -ity."}]},{"base":"pollute","pos":"verb","level":"B2","topic":"environment","forms":[{"w":"pollution","cls":"noun","type":"suffix","affix":"-ion","strength":"strong","rule":"drop-e","gloss":"harmful substances in air, water or soil","ex":"Air pollution is a serious problem.","teen":"Our class is studying plastic pollution in the sea."},{"w":"pollutant","cls":"noun","type":"suffix","affix":"-ant","strength":"medium","rule":"drop-e","gloss":"a substance that pollutes","ex":"Cars release harmful pollutants.","teen":"Factories must reduce each pollutant they release."}],"avoid":[{"w":"polution","for":"pollution","why":"Spelling. Keep both l: pollute + ion."},{"w":"polutant","for":"pollutant","why":"Spelling. Keep both l: pollute + ant."}]},{"base":"sustain","pos":"verb","level":"C1","topic":"environment","forms":[{"w":"sustainable","cls":"adjective","type":"suffix","affix":"-able","strength":"strong","gloss":"able to continue without harming the environment","ex":"We need sustainable energy.","teen":"Our school is switching to more sustainable materials.","alts":["-ible","-ous","-ive"]},{"w":"sustainability","cls":"noun","type":"suffix","affix":"-ity","strength":"medium","gloss":"the ability to continue for a long time without harm","ex":"The firm is proud of its sustainability record.","teen":"Sustainability is a hot topic at school."}],"avoid":[{"w":"sustainible","for":"sustainable","why":"Wrong. This one is -able."},{"w":"sustainabilty","for":"sustainability","why":"Spelling. -able becomes -abil- before -ity."}]},{"base":"danger","pos":"noun","level":"B2","topic":"general","forms":[{"w":"dangerous","cls":"adjective","type":"suffix","affix":"-ous","strength":"strong","gloss":"likely to cause harm","ex":"It is a dangerous road.","teen":"Skating on the wet pavement is dangerous.","alts":["-ious","-eous","-ful"]},{"w":"endanger","cls":"verb","type":"prefix","affix":"en-","strength":"medium","gloss":"put in danger","ex":"They would never endanger a child.","teen":"Hunting can endanger rare animals.","alts":["in-","re-","dis-"]}],"avoid":[{"w":"dangerful","for":"dangerous","why":"Wrong. Danger takes -ous."},{"w":"dangerus","for":"dangerous","why":"Spelling. The ending is -ous, not -us."}]},{"base":"courage","pos":"noun","level":"B2","topic":"feelings","forms":[{"w":"courageous","cls":"adjective","type":"suffix","affix":"-eous","strength":"strong","rule":"keep-e","gloss":"brave","ex":"It was a courageous decision.","teen":"It was courageous of her to speak up in class.","alts":["-ous","-ious","-ful"]},{"w":"encourage","cls":"verb","type":"prefix","affix":"en-","strength":"strong","gloss":"give someone confidence to do something","ex":"Good teachers encourage shy pupils to speak up.","teen":"My coach tries to encourage everyone on the team.","alts":["dis-","in-","re-"],"altwhy":{"dis-":"discourage is the opposite of encourage."}},{"w":"discourage","cls":"verb","type":"prefix","affix":"dis-","strength":"medium","gloss":"make someone less willing to do something","ex":"High prices discourage people from buying.","teen":"Do not let one bad mark discourage you.","alts":["en-","un-","mis-"],"altwhy":{"en-":"encourage is the opposite: to give confidence."}}],"avoid":[{"w":"couragous","for":"courageous","why":"Wrong. Keep the e, so the g stays soft: courageous."},{"w":"incourage","for":"encourage","why":"Wrong. The verb is encourage, with en-."}]},{"base":"care","pos":"noun","level":"B2","topic":"general","forms":[{"w":"careful","cls":"adjective","type":"suffix","affix":"-ful","strength":"strong","gloss":"paying attention to avoid mistakes","ex":"Be careful on the stairs.","teen":"Be careful with my headphones."},{"w":"careless","cls":"adjective","type":"suffix","affix":"-less","strength":"strong","gloss":"not paying enough attention","ex":"It was a careless mistake.","teen":"A careless tackle gave away a penalty."},{"w":"carefully","cls":"adverb","type":"suffix","affix":"-ly","strength":"medium","gloss":"in a careful way","ex":"Drive carefully.","teen":"Read the question carefully before you answer."}],"avoid":[{"w":"carefull","for":"careful","why":"Spelling. -ful has one l, even when you add -ly: careful + ly = carefully."},{"w":"carelss","for":"careless","why":"Spelling. -less has two s: care + less."}]},{"base":"rely","pos":"verb","level":"B2","topic":"general","forms":[{"w":"reliable","cls":"adjective","type":"suffix","affix":"-able","strength":"strong","rule":"y-to-i","gloss":"can be trusted","ex":"A reliable source told us.","teen":"My phone is old and not very reliable.","alts":["-ible","-ant","-ful"]},{"w":"reliance","cls":"noun","type":"suffix","affix":"-ance","strength":"medium","rule":"y-to-i","gloss":"depending on something or someone","ex":"Our reliance on oil is a problem.","teen":"Their reliance on social media worries teachers.","alts":["-ence","-ity","-ment"]}],"avoid":[{"w":"relyable","for":"reliable","why":"Wrong. y becomes i before -able."},{"w":"relience","for":"reliance","why":"Wrong. This noun ends in -ance."}]},{"base":"enjoy","pos":"verb","level":"B2","topic":"feelings","forms":[{"w":"enjoyable","cls":"adjective","type":"suffix","affix":"-able","strength":"strong","gloss":"giving pleasure","ex":"It was an enjoyable evening.","teen":"The school trip was really enjoyable.","alts":["-ible","-ful","-ous"]},{"w":"enjoyment","cls":"noun","type":"suffix","affix":"-ment","strength":"medium","gloss":"the feeling of pleasure","ex":"She reads purely for enjoyment.","teen":"He plays guitar for pure enjoyment."}],"avoid":[{"w":"enjoiable","for":"enjoyable","why":"Wrong. y after a vowel stays y: enjoy + able."},{"w":"enjoiment","for":"enjoyment","why":"Wrong. y after a vowel stays y: enjoy + ment."}]},{"base":"depend","pos":"verb","level":"B2","topic":"general","forms":[{"w":"dependent","cls":"adjective","type":"suffix","affix":"-ent","strength":"strong","gloss":"needing something or someone","ex":"She has a dependent child.","teen":"Younger kids are dependent on their parents.","alts":["-ant","-ive","-ous"],"altwhy":{"-ant":"-ant makes the noun (a dependant) in British English."}},{"w":"dependence","cls":"noun","type":"suffix","affix":"-ence","strength":"medium","gloss":"needing something to survive","ex":"Dependence on foreign oil is risky.","teen":"Heavy dependence on screens affects sleep.","alts":["-ance","-ity","-ment"]},{"w":"independent","cls":"adjective","type":"prefix","affix":"in-","strength":"strong","gloss":"not needing others","ex":"This is an independent report.","teen":"I want to be more independent this year.","alts":["un-","im-","dis-"]},{"w":"independence","cls":"noun","type":"prefix","affix":"in-","strength":"strong","gloss":"freedom to act without help","ex":"The country won its independence.","teen":"Getting a bus pass gave me more independence.","alts":["un-","im-","dis-"]}],"avoid":[{"w":"dependant","for":"dependent","why":"Not for the adjective. In British English -ant is the noun (a dependant)."},{"w":"dependance","for":"dependence","why":"Wrong. The noun is -ence."}]},{"base":"confide","pos":"verb","level":"B2","topic":"feelings","forms":[{"w":"confident","cls":"adjective","type":"suffix","affix":"-ent","strength":"strong","gloss":"sure of yourself","ex":"She felt confident.","teen":"I feel confident about the maths test.","alts":["-ant","-ive","-ous"]},{"w":"confidence","cls":"noun","type":"suffix","affix":"-ence","strength":"strong","gloss":"belief in your own ability","ex":"He lacks confidence.","teen":"Drama club really built my confidence.","alts":["-ance","-ity","-ment"]}],"avoid":[{"w":"confidance","for":"confidence","why":"Wrong. The noun ends -ence."},{"w":"confidant","for":"confident","why":"Not for the adjective. A confidant is a person you trust with secrets."}]},{"base":"economy","pos":"noun","level":"C1","topic":"society","forms":[{"w":"economic","cls":"adjective","type":"suffix","affix":"-ic","strength":"strong","gloss":"to do with the economy","ex":"The country needs economic growth.","teen":"We debated the economic effects of tourism.","alts":["-ical","-al","-ive"],"altwhy":{"-ical":"economical means cheap to run, not 'to do with the economy'."}},{"w":"economical","cls":"adjective","type":"suffix","affix":"-ical","strength":"strong","gloss":"cheap to run, not wasteful","ex":"This is an economical car.","teen":"A bus pass is more economical than paying each day.","alts":["-ic","-al","-ive"],"altwhy":{"-ic":"economic means to do with the economy."}}],"avoid":[{"w":"economical","for":"economic","why":"Different word. economical means cheap to run; economic means to do with the economy."},{"w":"economic","for":"economical","why":"Different word. economic is about the economy; economical means cheap to run."}],"note":"Two adjectives, two meanings. economic = to do with the economy; economical = cheap to run."},{"base":"history","pos":"noun","level":"B2","topic":"school","forms":[{"w":"historic","cls":"adjective","type":"suffix","affix":"-ic","strength":"strong","gloss":"important in history","ex":"It was a historic victory.","teen":"The team won a historic title.","alts":["-ical","-al","-ive"],"altwhy":{"-ical":"historical means to do with the past; historic means important in history."}},{"w":"historical","cls":"adjective","type":"suffix","affix":"-ical","strength":"strong","gloss":"to do with the past","ex":"He writes historical novels.","teen":"We watched a historical film about Rome.","alts":["-ic","-al","-ive"],"altwhy":{"-ic":"historic means important in history, not just 'about the past'."}}],"avoid":[{"w":"historical","for":"historic","why":"Different word. historical means to do with the past; historic means important in history."},{"w":"historic","for":"historical","why":"Different word. historic means important; historical means to do with the past."}],"note":"historic = important in history; historical = to do with the past."},{"base":"argue","pos":"verb","level":"B2","topic":"school","forms":[{"w":"argument","cls":"noun","type":"suffix","affix":"-ment","strength":"strong","rule":"drop-e","gloss":"a disagreement, or a set of reasons","ex":"They had a heated argument.","teen":"Your argument needs more evidence."}],"avoid":[{"w":"arguement","for":"argument","why":"Spelling. argue drops its e before -ment, an exception to the usual rule."},{"w":"argumant","for":"argument","why":"Spelling. The ending is -ment."}]},{"base":"happy","pos":"adjective","level":"B2","topic":"feelings","forms":[{"w":"happiness","cls":"noun","type":"suffix","affix":"-ness","strength":"strong","rule":"y-to-i","gloss":"the feeling of being happy","ex":"Money cannot buy happiness.","teen":"Her happiness was clear when she got the part."},{"w":"happily","cls":"adverb","type":"suffix","affix":"-ly","strength":"strong","rule":"y-to-i","gloss":"in a happy way","ex":"They lived happily ever after.","teen":"The kids played happily all afternoon."},{"w":"unhappy","cls":"adjective","type":"prefix","affix":"un-","strength":"strong","gloss":"not happy","ex":"She felt unhappy at school.","teen":"He was unhappy with his results.","alts":["in-","dis-","im-"]}],"avoid":[{"w":"happyness","for":"happiness","why":"Wrong. y becomes i: happiness."},{"w":"happyly","for":"happily","why":"Wrong. y becomes i: happily."}]},{"base":"strong","pos":"adjective","level":"B2","topic":"sport","forms":[{"w":"strength","cls":"noun","type":"suffix","affix":"-th","strength":"strong","rule":"stem-change","gloss":"the quality of being strong","ex":"Swimming builds physical strength.","teen":"Her biggest strength is staying calm."},{"w":"strengthen","cls":"verb","type":"suffix","affix":"-en","strength":"strong","rule":"stem-change","gloss":"make stronger","ex":"Exercise will strengthen your heart.","teen":"Extra training will strengthen the team."}],"avoid":[{"w":"strongth","for":"strength","why":"Wrong. strong becomes strength."},{"w":"strongen","for":"strengthen","why":"Wrong. strong becomes strength- before -en."}]},{"base":"deep","pos":"adjective","level":"B2","topic":"general","forms":[{"w":"depth","cls":"noun","type":"suffix","affix":"-th","strength":"strong","rule":"stem-change","gloss":"how deep something is","ex":"Check the depth of the lake.","teen":"Divers explored the depth of the cave."},{"w":"deepen","cls":"verb","type":"suffix","affix":"-en","strength":"strong","gloss":"become deeper","ex":"Cracks began to deepen.","teen":"Their friendship will deepen over time."}],"avoid":[{"w":"deepth","for":"depth","why":"Wrong. deep becomes depth, with one e."},{"w":"depen","for":"deepen","why":"Spelling. Keep both e: deep + en."}]},{"base":"simple","pos":"adjective","level":"B2","topic":"school","forms":[{"w":"simplify","cls":"verb","type":"suffix","affix":"-ify","strength":"strong","rule":"stem-change","gloss":"make easier","ex":"We need to simplify the form.","teen":"Can you simplify the instructions?"},{"w":"simply","cls":"adverb","type":"suffix","affix":"-ly","strength":"strong","rule":"stem-change","gloss":"in an easy way, or just","ex":"Simply add water.","teen":"She simply forgot her homework."},{"w":"simplicity","cls":"noun","type":"suffix","affix":"-ity","strength":"medium","rule":"stem-change","gloss":"being easy and plain","ex":"I like the simplicity of the design.","teen":"The simplicity of the game makes it fun."}],"avoid":[{"w":"simplyfy","for":"simplify","why":"Wrong. The verb ending is -ify, and the -le is dropped."},{"w":"simplicty","for":"simplicity","why":"Spelling. The noun ending is -ity: simplic + ity."}]},{"base":"clear","pos":"adjective","level":"B2","topic":"school","forms":[{"w":"clarify","cls":"verb","type":"suffix","affix":"-ify","strength":"strong","rule":"stem-change","gloss":"make clear","ex":"Can you clarify what you mean?","teen":"Could you clarify the task for us?"},{"w":"clarity","cls":"noun","type":"suffix","affix":"-ity","strength":"medium","rule":"stem-change","gloss":"being easy to understand","ex":"He writes with great clarity.","teen":"Her essay was praised for its clarity."}],"avoid":[{"w":"clearify","for":"clarify","why":"Wrong. clear to clarify is an irregular change."},{"w":"clearity","for":"clarity","why":"Wrong. clear to clarity is an irregular change."}]},{"base":"true","pos":"adjective","level":"B2","topic":"general","forms":[{"w":"truly","cls":"adverb","type":"suffix","affix":"-ly","strength":"strong","rule":"drop-e","gloss":"really","ex":"I am truly grateful.","teen":"That was a truly amazing concert."},{"w":"truth","cls":"noun","type":"suffix","affix":"-th","strength":"strong","rule":"drop-e","gloss":"what is real","ex":"Tell me the truth.","teen":"I told my mum the truth about the broken window."}],"avoid":[{"w":"truely","for":"truly","why":"Spelling. true drops its e: truly, an exception."},{"w":"trueth","for":"truth","why":"Spelling. true drops its e: truth."}]},{"base":"fortunate","pos":"adjective","level":"B2","topic":"general","forms":[{"w":"fortunately","cls":"adverb","type":"suffix","affix":"-ly","strength":"strong","gloss":"luckily","ex":"Fortunately, nobody was hurt.","teen":"Fortunately, I remembered my charger."},{"w":"unfortunate","cls":"adjective","type":"prefix","affix":"un-","strength":"strong","gloss":"unlucky","ex":"It was an unfortunate incident.","teen":"It was an unfortunate time to lose my phone.","alts":["in-","dis-","im-"]},{"w":"unfortunately","cls":"adverb","type":"prefix","affix":"un-","strength":"strong","gloss":"sadly, as bad luck","ex":"Unfortunately, the flight was cancelled.","teen":"Unfortunately, the match was cancelled.","alts":["in-","dis-","im-"]}],"avoid":[{"w":"infortunately","for":"unfortunately","why":"Wrong. fortunate takes un-."},{"w":"infortunate","for":"unfortunate","why":"Wrong. fortunate takes un-."}]},{"base":"employ","pos":"verb","level":"B2","topic":"society","forms":[{"w":"unemployed","cls":"adjective","type":"prefix","affix":"un-","strength":"strong","gloss":"without a job","ex":"She has been unemployed for a year.","teen":"My uncle was unemployed for a few months.","alts":["in-","dis-","im-"]},{"w":"employment","cls":"noun","type":"suffix","affix":"-ment","strength":"strong","gloss":"having paid work","ex":"He found full-time employment.","teen":"Many students look for part-time employment."},{"w":"employer","cls":"noun","type":"suffix","affix":"-er","strength":"strong","gloss":"a person or company that gives jobs","ex":"Her employer was supportive.","teen":"My employer lets me swap shifts."}],"avoid":[{"w":"employement","for":"employment","why":"Wrong. Keep the base as it is: employ + ment."},{"w":"employeer","for":"employer","why":"Wrong. employ + er, with one e."},{"w":"inemployed","for":"unemployed","why":"Wrong. employed takes un-."}]},{"base":"agree","pos":"verb","level":"B2","topic":"school","forms":[{"w":"disagree","cls":"verb","type":"prefix","affix":"dis-","strength":"strong","gloss":"have a different opinion","ex":"I disagree with you.","teen":"I disagree with the teacher's choice.","alts":["un-","in-","mis-"]},{"w":"agreement","cls":"noun","type":"suffix","affix":"-ment","strength":"strong","gloss":"a shared decision","ex":"The two sides reached an agreement.","teen":"We made an agreement to share the console."},{"w":"agreeable","cls":"adjective","type":"suffix","affix":"-able","strength":"medium","gloss":"pleasant, or willing to agree","ex":"He is an agreeable colleague.","teen":"She is an agreeable person to work with.","alts":["-ible","-ful","-ous"]}],"avoid":[{"w":"unagree","for":"disagree","why":"Wrong. The opposite of agree is disagree."},{"w":"agreable","for":"agreeable","why":"Spelling. Keep both e: agree + able."},{"w":"agreament","for":"agreement","why":"Spelling. The ending is -ment."}]},{"base":"appear","pos":"verb","level":"B2","topic":"general","forms":[{"w":"disappear","cls":"verb","type":"prefix","affix":"dis-","strength":"strong","gloss":"go out of sight","ex":"The tracks disappear in the snow.","teen":"My charger seems to disappear every week.","alts":["un-","in-","mis-"]},{"w":"appearance","cls":"noun","type":"suffix","affix":"-ance","strength":"strong","gloss":"how someone or something looks","ex":"Her appearance had changed.","teen":"Do not judge a person by appearance.","alts":["-ence","-ity","-ment"]}],"avoid":[{"w":"unappear","for":"disappear","why":"Wrong. appear takes dis-."},{"w":"appearence","for":"appearance","why":"Wrong. This noun ends -ance."},{"w":"dissappear","for":"disappear","why":"Spelling. dis + appear has one s then two p: disappear."}]},{"base":"estimate","pos":"verb","level":"C1","topic":"school","forms":[{"w":"overestimate","cls":"verb","type":"prefix","affix":"over-","strength":"strong","gloss":"guess too high","ex":"Do not overestimate your chances; the other team is stronger.","teen":"Do not overestimate how much you can learn the night before.","alts":["under-","re-","mis-"],"altwhy":{"under-":"underestimate means to guess too low. This sentence warns against guessing too high."}},{"w":"underestimate","cls":"verb","type":"prefix","affix":"under-","strength":"strong","gloss":"guess too low","ex":"Never underestimate her; she is smarter than she looks.","teen":"Never underestimate a small team.","alts":["over-","re-","mis-"],"altwhy":{"over-":"overestimate means to guess too high. This sentence is about guessing too low."}}],"avoid":[{"w":"misestimate","for":"overestimate","why":"Not natural. Use over- (too high) or under- (too low)."},{"w":"misestimate","for":"underestimate","why":"Not natural. Use over- (too high) or under- (too low)."}]},{"b :"compete","pos":"verb","level":"B2","topic":"sport","forms":[{"w":"competition","cls":"noun","type":"suffix","affix":"-ition","strength":"strong","rule":"stem-change","gloss":"a contest","ex":"She won the national competition.","teen":"Our school entered the robotics competition."},{"w":"competitive","cls":"adjective","type":"suffix","affix":"-ive","strength":"strong","rule":"stem-change","gloss":"wanting very much to win","ex":"He is very competitive.","teen":"My brother gets really competitive at video games."},{"w":"competitor","cls":"noun","type":"suffix","affix":"-or","strength":"medium","rule":"stem-change","gloss":"a person who competes","ex":"Each competitor received a medal.","teen":"Every competitor warmed up before the race."}],"avoid":[{"w":"competion","for":"competition","why":"Wrong. compete becomes competition, with -ition."},{"w":"competetive","for":"competitive","why":"Wrong. compete becomes competit- before -ive."}]},{"base":"environment","pos":"noun","level":"B2","topic":"environment","forms":[{"w":"environmental","cls":"adjective","type":"suffix","affix":"-al","strength":"strong","gloss":"to do with nature and the planet","ex":"Environmental damage is increasing.","teen":"I joined the environmental club at school.","alts":["-ial","-ical","-ive"]},{"w":"environmentalist","cls":"noun","type":"suffix","affix":"-ist","strength":"medium","gloss":"a person who protects nature","ex":"The environmentalist spoke at the protest.","teen":"She wants to become an environmentalist."}],"avoid":[{"w":"enviromental","for":"environmental","why":"Spelling. Keep the n before the m: environ + ment + al."},{"w":"enviromentalist","for":"environmentalist","why":"Spelling. Keep the n before the m: environ + ment + alist."}]},{"base":"respect","pos":"noun","level":"B2","topic":"society","forms":[{"w":"respectful","cls":"adjective","type":"suffix","affix":"-ful","strength":"strong","gloss":"showing respect","ex":"Be respectful to your teachers.","teen":"Online, stay respectful even when you disagree."},{"w":"disrespectful","cls":"adjective","type":"prefix","affix":"dis-","strength":"medium","gloss":"showing no respect","ex":"It is disrespectful to interrupt.","teen":"Laughing at someone's accent is disrespectful.","alts":["un-","in-","mis-"]},{"w":"respectable","cls":"adjective","type":"suffix","affix":"-able","strength":"medium","gloss":"good enough, or socially acceptable","ex":"She got a respectable score.","teen":"A respectable grade is better than none.","alts":["-ible","-ful","-ous"]}],"avoid":[{"w":"respectfull","for":"respectful","why":"Spelling. -ful has one l."},{"w":"unrespectful","for":"disrespectful","why":"Wrong. respectful takes dis-."}]}]};</script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const esc=v=>String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.random()*a.length|0];
const an=w=>/^[aeiou]/i.test(w)?'an '+w:'a '+w;
const CL={verb:'verb',noun:'noun',adjective:'adjective',adverb:'adverb'};
const KEY='wf2_progress', DAILY=10, BLITZ=60;
const TITLES=['Rookie','Word smith','Affix hunter','Morpheme master','Word wizard','Spelling sniper','Prefix pro','Suffix sage','Lexicon legend','Grammar guru','Word-formation champion'];

let D,ALL=[],tab='practice',S=null,L=null,resetArm=false,fOpen=false,TM=null;
const freshP=()=>({xp:0,streak:0,last:'',forms:{},mistakes:[],found:[],best:0,perfect:0,rounds:0,labFams:[],typed:0,blitzBest:0,badges:[],daily:{d:'',n:0},right:0,total:0,bestRound:0,fx:true});
let P=freshP();
let F={kind:'all',cls:'all',level:'all',topic:'all',q:''};
try{const s=localStorage.getItem(KEY);if(s)P=Object.assign(P,JSON.parse(s))}catch(e){}
const saveP=()=>{try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}};

/* ---------- data ---------- */
function normalise(d){
  if(!d||!Array.isArray(d.nodes))throw new Error('This file has no "nodes" list.');
  d.affixes=d.affixes||{};d.rules=d.rules||[];d.meta=d.meta||{};
  d.nodes.forEach(n=>{n.base=n.base||n.node;n.avoid=n.avoid||[];n.level=n.level||'B2';n.topic=n.topic||'general';n.pos=n.pos||'';
    if(!n.base||!Array.isArray(n.forms))throw new Error('A word entry is missing "base" or "forms".');
    n.forms.forEach(f=>{f.ex=f.ex||f.example||'';f.gloss=f.gloss||'';f.strength=f.strength||'medium'})});
  return d;
}
let SRC='built-in data';
function setData(d,src){
  SRC=src||SRC;D=normalise(d);ALL=[];
  D.nodes.forEach(n=>n.forms.forEach(f=>{f.id=n.base+':'+f.w;f._n=n;ALL.push(f)}));
  F={kind:'all',cls:'all',level:'all',topic:'all',q:''};S=null;L=null;
}
function validate(d){
  const w=[],ids=new Set(),rules=new Set(d.rules.map(r=>r.id));
  d.nodes.forEach(n=>{
    const ws=new Set(n.forms.map(f=>f.w));
    n.forms.forEach(f=>{
      const id=n.base+':'+f.w;if(ids.has(id))w.push('Duplicate form: '+id);ids.add(id);
      ['ex','teen'].forEach(k=>{if(f[k]&&!f[k].toLowerCase().includes(f.w.toLowerCase()))w.push(`${f.w}: the ${k==='ex'?'example':'teen'} sentence does not contain the word`)});
      if(!f.ex)w.push(f.w+': no example sentence');
      if(!f.affix)w.push(f.w+': no affix');
      else if(Object.keys(d.affixes).length&&!d.affixes[f.affix])w.push(`${f.w}: affix ${f.affix} is missing from the glossary`);
      if(f.rule&&!rules.has(f.rule))w.push(`${f.w}: unknown rule "${f.rule}"`);
      if(f.alts){const b=(f.affix||'').replace(/-/g,'');
        if(f.alts.length!==3)w.push(f.w+': alts must have exactly 3 items');
        else if(!(f.type==='prefix'?f.w.startsWith(b):f.w.endsWith(b)))w.push(f.w+': the word does not start/end with its affix, so the affix question cannot be built')}
    });
    n.avoid.forEach(a=>{if(!ws.has(a.for))w.push(`${a.w}: "for" points to ${a.for}, which is not a form of ${n.base}`)});
  });
  return w;
}
const ruleOf=id=>D.rules.find(r=>r.id===id);
const match=f=>{
  const n=f._n;
  if(F.kind!=='all'&&f.type!==F.kind)return false;
  if(F.cls!=='all'&&f.cls!==F.cls)return false;
  if(F.level!=='all'&&n.level!==F.level)return false;
  if(F.topic!=='all'&&n.topic!==F.topic)return false;
  if(tab==='explore'&&F.q){const q=F.q.toLowerCase();if(!n.base.toLowerCase().includes(q)&&!f.w.toLowerCase().includes(q))return false}
  return true;
};

/* ---------- small helpers ---------- */
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
function mark(ex,w){const i=ex.toLowerCase().indexOf(w.toLowerCase());return i<0?esc(ex):esc(ex.slice(0,i))+'<b>'+esc(ex.substr(i,w.length))+'</b>'+esc(ex.slice(i+w.length))}
function tiles(f){
  const a=esc(f.affix),b=esc(f._n.base);
  return f.type==='prefix'
    ?`<span class="tile pre">${a}</span><span class="plus">+</span><span class="tile base">${b}</span>`
    :`<span class="tile base">${b}</span><span class="plus">+</span><span class="tile suf">${a}</span>`;
}
function buildHTML(f){
  const r=f.rule&&ruleOf(f.rule);
  return `<span class="eq">${tiles(f)}<span class="plus">=</span><b>${esc(f.w)}</b></span>`+(r?`<br><b>${esc(r.title)}.</b> ${esc(r.text)}`:'');
}
function lev(a,b){const m=[];for(let i=0;i<=a.length;i++){m[i]=[i]}for(let j=1;j<=b.length;j++)m[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]}
function lvInfo(){let n=1,x=P.xp,need=100;while(x>=need){x-=need;n++;need=100+40*(n-1)}return{n,into:x,need}}
const level=()=>lvInfo().n;
const title=n=>TITLES[Math.min(n-1,TITLES.length-1)];
const mastered=f=>(P.forms[f.id]||{b:0}).b>=3;

function renderFoot(){
  const m=D.meta;
  $('foot').textContent=[m.title||'Word bank',m.version?'v'+m.version:'',D.nodes.length+' word families',ALL.length+' forms','Source: '+SRC].filter(Boolean).join(' · ')+(m.provenance?'. '+m.provenance:'');
}
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function renderMe(){
  const li=lvInfo(),dn=P.daily.d===ymd(new Date())?P.daily.n:0;
  $('me').innerHTML=`<b>Level ${li.n}: ${esc(title(li.n))}</b>${P.xp} XP${P.streak>1?' · '+P.streak+' day streak':''} · Today ${Math.min(dn,DAILY)}/${DAILY}${dn>=DAILY?' ✓':''}<div class="xpbar"><i style="width:${li.into/li.need*100}%"></i></div>`;
}
function touchStreak(){
  const t=new Date(),today=ymd(t);
  if(P.last!==today){const y=ymd(new Date(t.getFullYear(),t.getMonth(),t.getDate()-1));P.streak=P.last===y?P.streak+1:1;P.last=today}
}
function toast(m){
  let c=$('toasts');if(!c){c=document.createElement('div');c.id='toasts';c.setAttribute('role','status');document.body.appendChild(c)}
  const t=document.createElement('div');t.className='toast';t.textContent=m;c.appendChild(t);setTimeout(()=>t.remove(),3400);
}
function bumpDaily(){
  const t=ymd(new Date());if(P.daily.d!==t)P.daily={d:t,n:0};
  P.daily.n++;if(P.daily.n===DAILY){gain(20);toast('Daily goal reached! +20 XP');fireworks(2)}
}
/* ---------- sparkle effects ---------- */
const FX={cv:null,ctx:null,ps:[],run:false};
const reduceMotion=()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}};
function fxReady(){
  if(P.fx===false||reduceMotion())return false;
  if(!FX.cv){
    try{
      const c=document.createElement('canvas');c.id='fx';c.setAttribute('aria-hidden','true');document.body.appendChild(c);
      FX.cv=c;FX.ctx=c.getContext('2d');
      addEventListener('resize',fxSize);fxSize();
    }catch(e){FX.ctx=null}
  }
  return !!FX.ctx;
}
function fxSize(){if(!FX.cv||!FX.ctx)return;const r=window.devicePixelRatio||1;FX.cv.width=innerWidth*r;FX.cv.height=innerHeight*r;FX.ctx.setTransform(r,0,0,r,0,0)}
const FXC=['#FFE066','#FF8A7A','#3DD6B5','#8EA2FF','#FF7AD9','#FFFFFF','#FFB347'];
const rnd=(a,b)=>a+Math.random()*(b-a);
function fxAdd(a){FX.ps.push(...a);if(FX.ps.length>700)FX.ps.splice(0,FX.ps.length-700);if(!FX.run){FX.run=true;requestAnimationFrame(fxLoop)}}
function fxStar(c,x,y,r){c.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,rr=i%2?r*.28:r;c.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}c.closePath();c.fill()}
function fxLoop(){
  const c=FX.ctx;if(!c){FX.run=false;return}
  c.clearRect(0,0,innerWidth,innerHeight);
  FX.ps=FX.ps.filter(p=>p.life>0);

function weight(f){const s=P.forms[f.id];let w=!s?3:[5,3,2,1,.4][s.b];if(P.mistakes.includes(f.id))w+=3;return w}
function sample(pool,n){
  let p=pool.slice(),held=[],out=[];
  while(out.length<n&&(p.length||held.length)){
    if(!p.length){p=held;held=[]}
    let r=Math.random()*p.reduce((a,f)=>a+weight(f),0),i=0;
    for(;i<p.length;i++){r-=weight(p[i]);if(r<=0)break}
    if(i>=p.length)i=p.length-1;
    const f=p.splice(i,1)[0];out.push(f);
    for(let j=p.length-1;j>=0;j--)if(p[j]._n===f._n)held.push(p.splice(j,1)[0]);
  }
  return out;
}
let REAL=null;
function realSet(){if(!REAL){REAL=new Set();ALL.forEach(f=>REAL.add(f.w.toLowerCase()));D.nodes.forEach(n=>REAL.add(n.base.toLowerCase()))}return REAL}
/* plausible wrong spellings: swapped endings, doubled or missing letters, dropped or added e */
function misspell(w){
  const o=new Set(),add=x=>{if(x&&x!==w&&x.length>3)o.add(x)};
  [['ance','ence'],['ence','ance'],['ant','ent'],['ent','ant'],['able','ible'],['ible','able'],['ious','eous'],['eous','ious'],['ous','us'],['tion','sion'],['ity','ety'],['ety','ity'],['ial','ical'],['ful','full'],['ment','mant'],['ness','nes'],['ly','ely'],['y','i']]
    .forEach(([a,b])=>{if(w.endsWith(a))add(w.slice(0,-a.length)+b)});
  [['ie','ei'],['ei','ie'],['ou','o'],['ea','e'],['ee','e'],['ai','a'],['cc','c']].forEach(([a,b])=>{if(w.includes(a))add(w.replace(a,b))});
  for(let i=1;i<w.length;i++)if(w[i]===w[i-1])add(w.slice(0,i)+w.slice(i+1));
  for(let i=2;i<w.length-1;i++){const c=w[i];if('bcdfgklmnprst'.includes(c)&&c!==w[i-1]&&c!==w[i+1])add(w.slice(0,i+1)+c+w.slice(i+1))}
  const m=w.match(/^(.*[^aeiou])(ive|ion|ity|ous|ance|ence|ing|ment|able|ant|ent|ly)$/);
  if(m)add(m[1]+'e'+m[2]);
  const R=realSet();
  return [...o].filter(x=>!R.has(x.toLowerCase()));
}
function distract(f,skip){
  const n=f._n,opts=[f.w],why={},sk=(skip||'').toLowerCase();
  const add=(x,r)=>{
    if(opts.length>=4||x.toLowerCase()===sk||opts.some(o=>o.toLowerCase()===x.toLowerCase()))return;
    opts.push(x);why[x]=r;
  };
  /* 1. common mistakes written by hand (at most 2) */
  shuffle(n.avoid.filter(a=>a.for===f.w)).slice(0,2).forEach(a=>add(a.w,a.why));
  /* 2. one real word of another class, so word class still gets tested */
  const sib=shuffle(n.forms.filter(g=>g.cls!==f.cls&&g.w!==f.w));
  const sibWhy=g=>`That is the ${g.cls} form. The gap needs ${an(f.cls)}.`;
  if(sib.length)add(sib[0].w,sibWhy(sib[0]));
  /* 3. generated near-miss spellings */
  shuffle(misspell(f.w)).forEach(m=>add(m,`Not a real word. Check the spelling: ${f.w}.`));
  /* 4. fallbacks */
  sib.slice(1).forEach(g=>add(g.w,sibWhy(g)));
  shuffle(ALL.slice()).forEach(g=>{if(g.cls===f.cls&&g._n!==n)add(g.w,'That word belongs to a different family. Check the base word.')});
  return {opts:shuffle(opts),why};
}
function makeQ(f,t){
  const n=f._n;
  let s=(f.teen&&Math.random()<.45)?f.teen:f.ex;
  let k=s.toLowerCase().indexOf(f.w.toLowerCase());
  if(k<0){s=f.ex;k=s.toLowerCase().indexOf(f.w.toLowerCase())}
  const cap=k>=0&&s.charAt(k)!==s.charAt(k).toLowerCase();
  const q={t,f,cap,answer:f.w,kick:''};
  const gap='<span class="gap" id="gap"></span>';
  if(t==='affix'){
    const bare=f.affix.replace(/-/g,''),pre=f.type==='prefix',rest=pre?f.w.slice(bare.length):f.w.slice(0,f.w.length-bare.length);
    q.answer=f.affix;q.kick=pre?'Choose the prefix':'Choose the ending';q.opts=shuffle([f.affix].concat(f.alts));q.why={};
    f.alts.forEach(a=>{const ab=a.replace(/-/g,''),made=pre?ab+rest:rest+ab;
      const hit=n.avoid.find(x=>x.w===made);
      q.why[a]=(f.altwhy&&f.altwhy[a])||(hit&&hit.why)||`${made} is not the word wanted here: ${f.w}.`});
    q.gapMode='affix';
    q.stem=k<0?esc(s):esc(s.slice(0,k))+(pre?gap+'<b>'+esc(s.substr(k+bare.length,rest.length))+'</b>':'<b>'+esc(s.substr(k,rest.length))+'</b>'+gap)+esc(s.slice(k+f.w.length));
    q.cap=pre&&cap;
  }else if(t==='fix'){
    const av=pick(n.avoid.filter(a=>a.for===f.w));
    const wrong=cap?av.w.charAt(0).toUpperCase()+av.w.slice(1):av.w;
    const d=distract(f,av.w);q.opts=d.opts;q.why=d.why;q.why[av.w]=av.why;
    q.kick='Spot the mistake, then fix it';q.shown=av;
    q.stem=k<0?esc(s):esc(s.slice(0,k))+`<span class="gap wrong" id="gap">${esc(wrong)}</span>`+esc(s.slice(k+f.w.length));
  }else if(t==='type'){
    q.kick=`Type the ${f.cls} form`;
    q.stem=k<0?esc(s):esc(s.slice(0,k))+gap+esc(s.slice(k+f.w.length));
    q.prompt=`Base word: <b>${esc(n.base)}</b>`;
  }else{
    const d=distract(f);q.opts=d.opts;q.why=d.why;q.kick=`Choose the ${f.cls} form`;
    q.stem=k<0?esc(s):esc(s.slice(0,k))+gap+esc(s.slice(k+f.w.length));
  }
  return q;
}
function pickType(f,mode){
  const hasAvoid=f._n.avoid.some(a=>a.for===f.w),hasAlts=f.alts&&f.alts.length===3;
  if(mode==='fix')return hasAvoid?'fix':(hasAlts?'affix':'choose');
  if(mode==='type')return 'type';
  if(mode==='choose')return hasAlts?'affix':'choose';
  const b=(P.forms[f.id]||{b:0}).b;
  if(hasAlts&&Math.random()<.55)return 'affix';
  if(b>=2)return 'type';
  if(hasAvoid&&Math.random()<.25)return 'fix';
  return 'choose';
}

function judge(val){

  if(gap){gap.className='gap '+(ok?'ok':'miss');gap.textContent=q.t==='affix'?q.show(ok?q.answer:v):(q.cap&&q.t!=='fix'?(ok?q.answer:v).replace(/^./,c=>c.toUpperCase()):(ok?q.answer:v))}
  if(q.opts)document.querySelectorAll('.pick').forEach((b,j)=>{b.disabled=true;if(q.opts[j]===q.answer)b.classList.add('is-answer');else if(q.opts[j]===v)b.classList.add('is-wrong')});
  const ti=$('ti');if(ti)ti.disabled=true;
  if(!ok)$('qcard').classList.add('shake');
  let why='';
  if(!ok){
    if(q.t==='type'){const hit=f._n.avoid.find(a=>a.w.toLowerCase()===v.toLowerCase());
      why=`<p>${hit?`<b>${esc(v)}</b>: ${esc(hit.why)}`:(near?`<b>${esc(v)}</b> is very close. Check the spelling.`:`<b>${esc(v)}</b> does not fit here.`)}</p>`}
    else why=`<p>${q.why&&q.why[v]?`<b>${esc(q.show(v))}</b>: ${esc(q.why[v])}`:`<b>${esc(q.show(v))}</b> does not fit here.`}</p>`;
    why+=`<p>Answer: <b>${esc(q.answer)}</b></p>`;
  }
  const fb=$('fb');fb.hidden=false;fb.className='fb '+(ok?'ok':'no');
  fb.innerHTML=`<div class="fb-h">${ok?esc(praise())+(xp?' +'+xp+' XP':''):(near?'So close!':'Not quite.')}</div>${why}<p>${buildHTML(f)}</p>${f.gloss?`<p>Meaning: ${esc(f.gloss)}.</p>`:''}<button class="btn primary" data-act="next">${S.i+1<S.items.length?'Next question':'See results'}</button>`;
  fb.querySelector('.btn').focus();
  if(ok)celebrate();
}
function results(){
  stopClock();
  const n=S.blitz?S.answered:S.items.length,pct=n?Math.round(S.score/n*100):0;
  let rec='',bonus=0;
  P.rounds++;if(!S.blitz)P.bestRound=Math.max(P.bestRound,S.score);
  if(S.blitz){const nb=S.score>P.blitzBest;if(nb)P.blitzBest=S.score;rec=nb&&S.score>0?`<p><b>New best: ${S.score}!</b></p>`:`<p>Your best: ${P.blitzBest}</p>`}
  else if(n>=5&&S.score===n){P.perfect++;bonus=10;gain(bonus);S.xp+=bonus}
  touchStreak();saveP();renderMe();checkBadges();
  const msg=n&&S.score===n?'Perfect round.':pct>=70?'Strong round.':'Good practice. Mistakes are how these stick.';
  const stars=S.blitz?(S.score>=15?3:S.score>=8?2:S.score>0?1:0):(!n?0:pct>=90?3:pct>=70?2:1);
  $('view').innerHTML=`<article class="card res"><div class="stars" aria-label="${stars} out of 3 stars">${[0,1,2].map(i=>`<span class="${i<stars?'on':''}" style="--i:${i}">${i<stars?'★':'☆'}</span>`).join('')}</div><div class="big">${S.blitz?S.score:S.score+'/'+n}</div><p style="margin:.3rem auto 0">${S.blitz?`correct in ${BLITZ} seconds. `:''}${msg} You earned ${S.xp} XP${bonus?' (including a +10 perfect-round bonus)':''}.</p>${rec}
   <div class="coach"><b>Coach says</b><p>${coach()}</p></div>
   ${S.missed.length?`<div class="miss-list"><h2 style="font-size:1.1rem;margin-bottom:.3rem">Review these</h2>${S.missed.map(q=>`<div class="row"><div class="rw"><span class="w">${esc(q.f.w)}</span><span class="cl">${CL[q.f.cls]}</span></div><p class="eg">${buildHTML(q.f)}</p></div>`).join('')}</div>`:''}
   <div class="acts"><button class="btn primary" data-act="start" data-m="${S.mode}">Another round</button>${S.missed.length?'<button class="btn" data-act="start" data-m="weak">Practise weak spots</button>':''}<button class="btn" data-act="tab" data-t="practice">Change mode</button></div></article>`;
  const cheer=stars===3?4:stars===2?2:0;
  S=null;window.scrollTo(0,0);
  if(cheer)setTimeout(()=>fireworks(cheer),250);
}

/* ---------- word lab ---------- */
const LIVES=5;
function labNew(n){
  n=n||pick(D.nodes);
  const real=[...new Set(n.forms.map(f=>f.affix))];
  const decoys=shuffle(Object.keys(D.affixes).filter(a=>!real.includes(a))).slice(0,6);
  L={n,chips:shuffle(real.concat(decoys)),found:new Set(),tried:new Set(),msg:'',lives:LIVES,over:false,done:false,flawless:false};
}
function labView(){
  if(!L)labNew();
  const n=L.n,total=n.forms.length,found=n.forms.filter(f=>L.found.has(f.id)),missed=L.over?n.forms.filter(f=>!L.found.has(f.id)):[];
  const locked=L.over||L.done;
  const chip=a=>{const pre=a.endsWith('-');
    const done=n.forms.some(f=>f.affix===a&&L.found.has(f.id)),tried=L.tried.has(a);
    return `<button class="tile ${pre?'pre':'suf'}${done?' done':''}${tried?' tried':''}" data-act="chip" data-a="${esc(a)}"${done||locked?' disabled':''}>${esc(a)}</button>`};
  const hearts='❤️'.repeat(L.lives)+'🖤'.repeat(LIVES-L.lives);
  $('view').innerHTML=`<div class="lab-top"><label class="sel">Word <select id="labSel">${D.nodes.map(x=>`<option value="${esc(x.base)}"${x===n?' selected':''}>${esc(x.base)}</option>`).join('')}</select></label><button class="btn" data-act="labnew">Surprise me</button></div>
   <article class="card stage"><p class="tip" style="margin:0 auto .7rem">Tap an affix to join it to the word. Find every real word. Each wrong guess costs a heart.</p>
    <div class="hearts" aria-label="${L.lives} of ${LIVES} tries left">${hearts}</div>
    <span class="tile base">${esc(n.base)}</span>
    <div class="palette">${L.chips.map(chip).join('')}</div>
    <div class="lab-msg" id="labmsg" aria-live="polite">${L.msg}</div>
    <p class="found-n">${found.length} of ${total} words found</p>
    ${L.done?`<div class="win">Family complete.${L.flawless?' Flawless: +10 XP.':''} +5 XP for every new word.</div>`:''}
    ${L.over?`<div class="lose">Out of tries. Here ${missed.length===1?'is the word':'are the words'} you missed. Try another family.</div>`:''}</article>
   <div class="list" style="margin-top:.8rem">${found.length?`<article class="card">${found.map(rowHTML).join('')}<div class="pop" hidden></div></article>`:''}${missed.length?`<article class="card"><div class="meta">Missed</div>${missed.map(rowHTML).join('')}<div class="pop" hidden></div></article>`:''}</div>`;
}
function labTap(a,el){
  if(L.over||L.done)return;
  const n=L.n,hits=n.forms.filter(f=>f.affix===a);
  if(hits.length){
    hits.forEach(f=>{L.found.add(f.id);if(!P.found.includes(f.id)){P.found.push(f.id);gain(5)}});
    glitterAt(el);
    L.msg='';
    if(n.forms.every(f=>L.found.has(f.id))){
      L.done=true;fireworks(3);
      if(!P.labFams.includes(n.base)){P.labFams.push(n.base);if(L.lives===LIVES){gain(10);L.flawless=true}}
    }
  }else{
    L.tried.add(a);L.lives--;
    const bare=a.replace(/-/g,''),w=a.endsWith('-')?bare+n.base:n.base+bare;
    L.msg=`<b>${esc(w)}</b> is not a word. Try another.`;
    if(L.lives<=0){L.over=true;L.msg=''}
  }
  touchStreak();saveP();renderMe();checkBadges();labView();
}

/* ---------- progress ---------- */
function progressView(){
  const seen=ALL.filter(f=>P.forms[f.id]),mast=ALL.filter(mastered);
  const weak=seen.filter(f=>P.forms[f.id].b<2).sort((a,b)=>P.forms[b.id].m-P.forms[a.id].m).slice(0,10);
  const lv=level();
  $('view').innerHTML=`<div class="stats">
   <div class="stat"><b>${lv}</b><span>${esc(title(lv))}</span></div>
   <div class="stat"><b>${P.xp}</b><span>XP earned</span></div>
   <div class="stat"><b>${P.streak||0}</b><span>day streak</span></div>
   <div class="stat"><b>${mast.length}<small style="font-size:1rem;font-weight:500"> / ${ALL.length}</small></b><span>words mastered</span></div>
   <div class="stat"><b>${P.found.length}</b><span>found in the lab</span></div>
   <div class="stat"><b>${P.blitzBest}</b><span>best in Beat the clock</span></div>
   <div class="stat"><b>${P.total?Math.round(P.right/P.total*100):0}%</b><span>accuracy (${P.right} of ${P.total})</span></div>
   <div class="stat"><b>${P.bestRound}<small style="font-size:1rem;font-weight:500"> / 10</small></b><span>best round</span></div></div>
   <p class="tip">A word is mastered after you get it right three times in a row.</p>
   <section class="sec"><h2>Badges <small style="font-size:.9rem;font-weight:500;color:var(--dim)">${P.badges.length} of ${BADGES.length}</small></h2><div class="badges">${BADGES.map(b=>{const g=P.badges.includes(b.id);return `<div class="badge${g?'':' locked'}"><b>${g?'🏅':'🔒'} ${esc(b.n)}</b><span>${esc(b.d)}</span></div>`}).join('')}</div></section>
   <section class="sec"><h2>Needs more practice</h2>${weak.length?weak.map(f=>`<span class="pill">${esc(f.w)}</span>`).join('')+'<p style="margin-top:.6rem"><button class="btn primary" data-act="start" data-m="weak">Practise weak spots</button></p>':'<p>Nothing here yet. Play a round to see which words need work.</p>'}</section>
   <section class="sec"><h2>Your data</h2><div class="data-box"><p><b>${esc(D.meta.title||'Word bank')}</b>: ${D.nodes.length} word families, ${ALL.length} forms.</p>
   <p>${(()=>{const w=validate(D);return w.length?`<span class="tip">Data check found ${w.length} issue${w.length>1?'s':''}:</span></p><ul class="warn">${w.slice(0,8).map(x=>'<li>'+esc(x)+'</li>').join('')}${w.length>8?'<li>and '+(w.length-8)+' more</li>':''}</ul><p>`:'Data check: no problems found.'})()}</p>
   <p>Teachers: load your own word bank (JSON). The old v1 format works too. A loaded file lasts until the page is refreshed. To make a bank permanent, host it next to this page and open the page with <code>?data=yourfile.json</code>.</p>
   <input type="file" id="file" accept=".json,application/json" aria-label="Load a word bank JSON file"><p id="fileMsg" class="tip"></p>
   <button class="btn" data-act="reset">${resetArm?'Tap again to erase my progress':'Reset my progress'}</button></div></section>`;
}

/* ---------- routing & events ---------- */
function render(){
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  if(tab==='explore')exploreView();else if(tab==='practice')S?showQ():practiceHome();
  else if(tab==='lab')labView();else progressView();
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act;
  if(a==='retry'){boot();return}
  if(!D)return;
  if(a==='tab'){tab=el.dataset.t;if(tab!=='practice'){S=null;stopClock()}resetArm=false;render();window.scrollTo(0,0)}
  else if(a==='ftoggle'){fOpen=!fOpen;render()}
  else if(a==='fxtoggle'){P.fx=P.fx===false;if(P.fx===false)FX.ps=[];saveP();render();if(P.fx)setTimeout(()=>{glitterAt(document.querySelector('[data-act=fxtoggle]'));fireworks(1)},50)}
  else if(a==='f'){F[el.dataset.k]=el.dataset.v;render()}
  else if(a==='say')say(el.dataset.t);
  else if(a==='aff'||a==='rule'){
    const card=el.closest('.card'),pop=card.querySelector('.pop'),key=a+(el.dataset.a||el.dataset.r);
    if(!pop.hidden&&pop.dataset.key===key){pop.hidden=true;return}
    let html='';
    if(a==='aff'){const x=D.affixes[el.dataset.a];html=x?`<b>${esc(el.dataset.a)}</b> means <b>${esc(x.meaning)}</b>. ${esc(x.tip||'')}`:`No note for ${esc(el.dataset.a)} yet.`}
    else{const r=ruleOf(el.dataset.r);html=r?`<b>${esc(r.title)}.</b> ${esc(r.text)}`:''}
    pop.innerHTML=html;pop.dataset.key=key;pop.hidden=false;
  }
  else if(a==='start')startSession(el.dataset.m);
  else if(a==='quit'){stopClock();S=null;render()}
  else if(a==='pick'){const q=S.items[S.i];judge(q.opts[+el.dataset.j])}
  else if(a==='submit')judge($('ti').value);
  else if(a==='hint'){const q=S.items[S.i];if(q.done)return;S.hint=true;$('ti').placeholder=q.answer.slice(0,2)+'…  ('+q.answer.length+' letters)';$('ti').focus()}
  else if(a==='next'){S.i++;S.i<S.items.length?showQ():results()}
  else if(a==='chip')labTap(el.dataset.a,el);
  else if(a==='labnew'){labNew();labView()}
  else if(a==='reset'){if(resetArm){P=freshP();saveP();renderMe();resetArm=false}else resetArm=true;progressView()}
});
document.addEventListener('change',e=>{
  if(e.target.id==='topicSel'){F.topic=e.target.value;render()}
  else if(e.target.id==='labSel'){labNew(D.nodes.find(n=>n.base===e.target.value));labView()}
  else if(e.target.id==='file'){
    const file=e.target.files[0];if(!file)return;
    const r=new FileReader();
    r.onload=()=>{try{setData(JSON.parse(r.result),file.name+' (loaded by you)');tab='practice';render();renderMe();renderFoot()}catch(err){$('fileMsg').textContent='Could not load that file: '+err.message}};
    r.readAsText(file);
  }
});
document.addEventListener('input',e=>{if(e.target.id==='q'){F.q=e.target.value;paintCards()}});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='ti'){e.preventDefault();judge(e.target.value);return}
  if(tab==='practice'&&S&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)){
    const q=S.items[S.i];
    if(q&&!q.done&&q.opts&&/^[1-4]$/.test(e.key)&&q.opts[+e.key-1]!==undefined)judge(q.opts[+e.key-1]);
  }
});

const DATA_URL=new URLSearchParams(location.search).get('data')||'wordformation-v2.json';
function showError(err){
  const local=location.protocol==='file:';
  $('view').innerHTML=`<div class="err" role="alert"><h2>The word bank could not be loaded</h2>
   <p><b>${esc(err.message)}</b></p>
   <p>This page reads its words from <code>${esc(DATA_URL)}</code>.</p>
   <ol>${local?'<li>You opened the page straight from a folder, and browsers block that. Serve the folder instead: open a terminal in it, run <code>python -m http.server</code>, then visit <code>http://localhost:8000</code>.</li>':''}
   <li>Check that <code>${esc(DATA_URL)}</code> is in the same folder as this page.</li>
   <li>Check the JSON is valid. A missing comma or quote is the usual cause.</li></ol>
   <p>Or load the file by hand:</p><input type="file" id="file" accept=".json,application/json" aria-label="Load a word bank JSON file"><p id="fileMsg" class="tip"></p>
   <p><button class="btn primary" data-act="retry">Try again</button></p></div>`;
  $('foot').textContent='';
}
async function boot(){
  if(window.WF_DATA&&!new URLSearchParams(location.search).get('data')){setData(window.WF_DATA,'built into this page');renderMe();render();renderFoot();return}
  $('view').innerHTML='<div class="skel" aria-busy="true"><i></i><i></i><i></i></div>';
  try{
    const r=await fetch(DATA_URL,{cache:'no-cache'});
    if(!r.ok)throw new Error('The server answered '+r.status+' for '+DATA_URL);
    let j;try{j=await r.json()}catch(e){throw new Error('The file is not valid JSON ('+e.message+')')}
    setData(j,DATA_URL);renderMe();render();renderFoot();
  }catch(err){showError(err.message?err:new Error(String(err)))}
}
renderMe();boot();
})();
</script>
