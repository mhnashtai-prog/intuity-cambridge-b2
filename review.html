<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F3F1EC">
<title>Be2FIRST — Your review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..900&family=Geist+Mono:wght@400..600&family=Space+Grotesk:wght@700&family=Anton&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=20261105">
<style>
/* ═══ THE REVIEW DECK ═══
   Twelve of the student's own cards, one at a time, each played the way its
   game is played (10 Nov 2026): tap one of the game's options, or type the
   missing words. The app checks it; nobody grades themselves.
   Two right answers retire a card. Nothing here is new content — it is the
   app handing back what it already saw the student miss. */
:root{--paper:#F3F1EC;--card:#FAF8F5;--ink:#14110E;--quiet:#5C5852;--faint:#8A8378;--rule:rgba(20,17,14,.12);
  --caramel:#A9774A;--sage:#527065}
html,body{background:var(--paper)}
body{margin:0;color:var(--ink);font-family:'Geist',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{max-width:34rem;margin:0 auto;padding:calc(var(--rv-head,96px) + 14px) 16px 48px}
.lead{text-align:center;margin:8px 0 22px}
.streak{display:inline-flex;align-items:center;gap:8px;font:500 12px/1 'Geist Mono',ui-monospace,monospace;letter-spacing:.08em;
  text-transform:uppercase;color:#7A5A36;background:#F1E6D6;border-radius:999px;padding:8px 14px}
.streak b{font-weight:700}
.count{font:500 11px/1 'Geist Mono',ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-top:14px}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(20,17,14,.12)}
.dots i.done{background:var(--sage)}.dots i.miss{background:var(--caramel)}.dots i.here{outline:2px solid var(--ink);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:22px 20px 18px;box-shadow:0 1px 3px rgba(20,17,14,.06);
  animation:in .28s cubic-bezier(.2,.9,.25,1.1)}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.from{font:500 11px/1 'Geist Mono',ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--caramel);
  display:flex;align-items:center;gap:8px}
.from i{width:14px;height:3px;background:var(--caramel)}
.misses{margin-left:auto;color:var(--faint)}
.prompt{font-family:'Newsreader',Georgia,serif;font-size:1.32rem;line-height:1.55;margin:16px 0 6px}
.gap{display:inline-block;min-width:4.5rem;border-bottom:2px solid var(--ink);margin:0 .2rem;text-align:center;font-family:'Geist',sans-serif;
  font-weight:600;font-size:1.05rem;color:var(--sage)}
.phrase{font-family:'Geist',sans-serif;font-weight:700;font-size:2rem;letter-spacing:-.02em;margin:18px 0 4px}
.task{font-size:.95rem;color:var(--quiet);margin:4px 0 0}
.reveal{margin-top:16px;padding-top:14px;border-top:1px solid var(--rule);font-size:.95rem;line-height:1.5}
.reveal .ans{font-weight:700;font-size:1.1rem}
.reveal .yours{color:var(--faint);text-decoration:line-through;margin-left:.5rem}
.reveal .why{color:var(--quiet);margin-top:6px}
.practise{display:block;margin-top:10px;font:500 11px/1 'Geist Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--quiet);text-decoration:none}
.row{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;min-height:50px;border-radius:999px;font:600 15px/1 'Geist',system-ui,sans-serif;cursor:pointer;border:1.5px solid var(--ink);
  background:transparent;color:var(--ink)}
.btn.dark{background:var(--ink);color:var(--card)}
.btn:active{transform:scale(.97)}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.opt{width:100%;min-height:50px;padding:12px 16px;border-radius:12px;border:1.5px solid var(--rule);background:#fff;color:var(--ink);
  font:500 15px/1.4 'Geist',system-ui,sans-serif;text-align:left;cursor:pointer;transition:background .15s,border-color .15s}
.opt:active{transform:scale(.985)}
.opt.is-ok{background:#E3ECE7;border-color:var(--sage);color:#2F4A40;font-weight:600}
.opt.is-no{background:#F6ECE2;border-color:#C9A57F;color:var(--faint);text-decoration:line-through}
.opt[disabled]{cursor:default}
.gapin{font:600 1.02rem/1.2 'Geist',system-ui,sans-serif;color:var(--ink);border:0;border-bottom:2px solid var(--ink);background:transparent;
  padding:2px 4px;margin:0 .2rem;min-width:5rem;max-width:100%;border-radius:0;outline:none;text-align:center}
.nw{white-space:nowrap}
.phrase .gapin{font:inherit;color:var(--ink);margin:0;padding:0 2px;min-width:3ch;text-align:left}
.gapin:focus{border-bottom-color:var(--caramel);background:rgba(169,119,74,.07)}
.gapin.is-ok{color:var(--sage);border-bottom-color:var(--sage)}
.gapin.is-no{color:var(--faint);text-decoration:line-through;border-bottom-color:#C9A57F}
.verdict{margin-top:14px;padding-top:12px;border-top:1px solid var(--rule);font-size:.95rem;line-height:1.5}
.verdict .v{font-weight:700}.verdict .v.ok{color:var(--sage)}.verdict .v.no{color:#8E6238}
.verdict .ans{font-weight:700}
.verdict .why{color:var(--quiet);margin-top:4px}
.mine{background:none;border:0;padding:0;margin-top:8px;font:500 12px/1.4 'Geist',sans-serif;color:var(--quiet);text-decoration:underline;cursor:pointer}
.run{font:500 11px/1 'Geist Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-left:10px}
.score-sub{margin-top:6px}
/* ═══ THE BOARD (11 Nov 2026) ═══════════════════════════════════════════
   The review opens on a trading-floor screen: every skill, two bars.
     EXPLORED  the share of the skill's menu the pupil has opened
     SCORE     right answers out of the last 30 in that skill, so it rises
               when they improve; ▲▼ this week against before
   Green on grey, never red: an empty bar is room to fill, not a verdict.
   Three unexplored pages, a tap away. Then the pendulum: tap it to start. */
.board{background:#15120F;color:#ECE7DE;border-radius:18px;padding:16px 16px 14px;box-shadow:0 14px 34px rgba(20,17,14,.18);
  font-family:'Geist',system-ui,sans-serif}
.bd-top{display:flex;justify-content:space-between;align-items:baseline;font:500 10.5px/1 'Geist Mono',ui-monospace,monospace;
  letter-spacing:.14em;text-transform:uppercase;color:rgba(236,231,222,.55)}
.bd-top b{color:#ECE7DE;font-weight:600}
.bd-live{display:inline-block;width:6px;height:6px;border-radius:50%;background:#7BC043;margin-right:7px;vertical-align:1px;animation:bdBlink 2s infinite}
@keyframes bdBlink{50%{opacity:.25}}
.bd-tick{overflow:hidden;white-space:nowrap;margin:12px 0 2px;padding:8px 0;border-top:1px solid rgba(236,231,222,.1);
  border-bottom:1px solid rgba(236,231,222,.1);font:500 11px/1 'Geist Mono',ui-monospace,monospace;letter-spacing:.06em;color:rgba(236,231,222,.7)}
.bd-tape{display:inline-flex;gap:16px;padding-right:16px}
.bd-tick.roll .bd-tape{animation:tape 22s linear infinite}
@keyframes tape{to{transform:translateX(-50%)}}
.bd-tick b{color:#ECE7DE;font-weight:600}
.bd-tick .up{color:#9BD36A}.bd-tick .dn{color:#E4A59B}
.bd-legend{display:flex;justify-content:flex-end;gap:14px;margin:8px 0 0;font:500 9.5px/1 'Geist Mono',ui-monospace,monospace;
  letter-spacing:.14em;text-transform:uppercase;color:rgba(236,231,222,.45)}
.bd-legend i{display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:6px;vertical-align:1px}
.bd-row{display:grid;grid-template-columns:1fr auto;column-gap:12px;row-gap:4px;padding:7px 0;border-bottom:1px solid rgba(236,231,222,.07)}
.bd-row:last-child{border-bottom:0}
.bd-name{font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;letter-spacing:.01em}
.bd-name s{width:8px;height:8px;border-radius:2px;flex:none}
.bd-num{font:500 12px/1.2 'Geist Mono',ui-monospace,monospace;text-align:right;color:rgba(236,231,222,.75);white-space:nowrap}
.bd-num b{color:#ECE7DE;font-weight:600}
.bd-num .up{color:#9BD36A}.bd-num .dn{color:#E4A59B}.bd-num .na{color:rgba(236,231,222,.38)}
.bd-bars{grid-column:1/-1;display:grid;gap:4px}
.bd-bar{height:4px;border-radius:3px;background:rgba(236,231,222,.1);overflow:hidden}
.bd-bar i{display:block;height:100%;border-radius:3px;width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.bd-bar.ex i,.bd-legend .ex{background:#A9D18E}
.bd-bar.sc i,.bd-legend .sc{background:#5FA42B}
.bd-bar.sc.none{background:repeating-linear-gradient(90deg,rgba(236,231,222,.12) 0 4px,transparent 4px 8px)}
.bd-next{margin:22px 0 0}
.bd-next h3{margin:0 0 8px;font:500 10.5px/1 'Geist Mono',ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);text-align:center}
.bd-next a{display:flex;justify-content:space-between;align-items:center;gap:10px;text-decoration:none;color:var(--ink);
  padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--rule);margin-top:6px;font-size:14px;font-weight:500}
.bd-next a span{flex:none;font:500 10px/1 'Geist Mono',ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.bd-next a:active{background:#EFEBE4}
/* the pendulum: the bob is the start button */
.pend-wrap{display:flex;flex-direction:column;align-items:center;margin:-7px 0 0;height:178px;position:relative}
.pend-pivot{width:14px;height:14px;border-radius:50%;background:var(--ink);position:relative;z-index:2}
.pend{position:absolute;top:7px;left:50%;width:0;height:170px;transform-origin:0 0;animation:swing 2.2s cubic-bezier(.45,0,.55,1) infinite alternate;rotate:-14deg}
@keyframes swing{to{rotate:14deg}}
.pend::before{content:"";position:absolute;left:-1px;top:0;width:2px;height:84px;background:var(--ink)}
.pend button{position:absolute;top:78px;left:-44px;width:88px;height:88px;border-radius:50%;border:0;cursor:pointer;
  background:var(--ink);color:#F3F1EC;box-shadow:0 10px 24px rgba(20,17,14,.28),inset 0 -6px 0 rgba(255,255,255,.06);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:'Geist',system-ui,sans-serif}
.pend button b{font:700 15px/1 'Geist',system-ui,sans-serif;letter-spacing:.12em}
.pend button small{font:500 10px/1 'Geist Mono',ui-monospace,monospace;letter-spacing:.08em;color:#9BD36A}
.pend.stop{animation:none;rotate:0deg;transition:rotate .3s ease}
.pend-say{text-align:center;color:var(--quiet);font-size:13px;margin:0 0 4px}
.board-empty{text-align:center;color:var(--quiet);font-size:14.5px;line-height:1.55;margin:18px 6px 0}
@media (prefers-reduced-motion:reduce){.bd-tick.roll .bd-tape{animation:none}.pend{animation:none;rotate:0deg}.bd-live{animation:none}.bd-bar i{transition:none}}
.empty{text-align:center;padding:40px 8px;color:var(--quiet);line-height:1.55}
.empty h2{font-family:'Anton',Impact,sans-serif;font-weight:400;text-transform:uppercase;font-size:2.4rem;line-height:.95;color:var(--ink);margin:0 0 12px}
.empty a{display:inline-block;margin-top:18px;min-height:48px;line-height:48px;padding:0 26px;border-radius:999px;background:var(--ink);
  color:var(--card);text-decoration:none;font-weight:600}
.header-spacer b{color:var(--ink)}
@media(prefers-reduced-motion:reduce){.card{animation:none}}
  .tf-1{display:block;font-size:.88em;color:#5C5852;margin-bottom:.5rem}
  .tf-k{display:block;font-family:'Geist',sans-serif;font-weight:700;font-size:.72em;letter-spacing:.14em;margin-bottom:.35rem}
  .phrase .cue{color:#9A5A2C;font-weight:700;letter-spacing:.04em}
  .phrase mark{background:none;box-shadow:inset 0 -.5em 0 rgba(194,149,110,.45);color:inherit}
</style>

<body>
<header class="header">
  <div class="header-top">
    <a class="back-link" href="/index.html" target="_top">← Home</a>
    <div class="header-title">
      <div class="app-title">INTUITY</div>
      <div class="app-subtitle">Your review</div>
    </div>
    <span class="header-spacer">Level <b>B2</b></span>
  </div>
</header>

<main class="wrap">
  <div class="lead" id="lead"></div>
  <div id="stage"></div>
</main>

<script src="/skills/grammar-rules/intuity-sound.js"></script>
<script src="/tools/intuity-cheer.js?v=2"></script>
<script src="/tools/be2-map.js?v=1"></script>
<script src="/tools/be2-progress.js?v=20261111"></script>
<script>
(function () {
  /* at most 12 a day (5 Nov): the oldest-due first, the rest wait for tomorrow */
  var deck = Be2.review(Be2.dueToday ? Be2.dueToday() : 10), i = 0, results = [], run = 0, bestRun = 0, timer = 0, pend = null;
  var lead = document.getElementById('lead'), stage = document.getElementById('stage');
  var ALL = (function () { try { var d = JSON.parse(localStorage.getItem('be2.review.v1') || '{}'); return Object.keys(d).map(function (k) { return d[k]; }); } catch (e) { return []; } })();
  /* games played by picking: an old card from them (sent before options were kept) gets options from its neighbours */
  var PICK = /^(similar-words|collocations|prepositions|descriptive-words|idiomatic-expressions|phrasal-verbs|which-task|uoe-part1|writing-sort|writing-switch|writing-finish|sentence-|cohesion-patterns|speaking-)/;
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function norm(s) { return String(s || '').toLowerCase().replace(/[‘’`]/g, "'").replace(/[^a-z0-9' ]+/g, ' ').replace(/\s+/g, ' ').trim(); }
  function shuffle(a) { a = a.slice(); for (var k = a.length - 1; k > 0; k--) { var j = Math.floor(Math.random() * (k + 1)), t = a[k]; a[k] = a[j]; a[j] = t; } return a; }
  function cheer(f) { try { if (window.Cheer) Cheer[f].apply(null, [].slice.call(arguments, 1)); } catch (e) {} }

  function head() {
    var n = Be2.streak();
    lead.innerHTML =
      (n ? '<span class="streak">🔥 <b>' + n + '</b> day' + (n === 1 ? '' : 's') + ' in a row</span>' : '') +
      (deck.length ? '<div class="count">' + Math.min(i + 1, deck.length) + ' / ' + deck.length + (run > 1 ? '<span class="run">run ' + run + '</span>' : '') + '</div><div class="dots">' +
        deck.map(function (_, k) { return '<i class="' + (results[k] === true ? 'done' : results[k] === false ? 'miss' : '') + (k === i ? ' here' : '') + '"></i>'; }).join('') +
      '</div>' : '');
  }
  function from(c) {
    return '<div class="from"><i></i>' + esc(c.topicName) + '<span class="misses">' + (c.misses ? 'missed ' + c.misses + '×' : 'check-in') + '</span></div>';
  }

  /* how the card is played: 'pick' (options), 'type' (the gap), 'done' (a phrase to use) */
  function optionsFor(c) {
    if (c.opts && c.opts.length > 1) return c.opts.indexOf(c.answer) < 0 ? [c.answer].concat(c.opts).slice(0, 6) : c.opts;
    if (!PICK.test(c.topic || '')) return null;
    var pool = [];
    if (c.given && norm(c.given) !== norm(c.answer)) pool.push(c.given);
    shuffle(ALL).forEach(function (o) { if (o.topic === c.topic && o.answer && pool.indexOf(o.answer) < 0 && norm(o.answer) !== norm(c.answer) && !o.ask === !c.ask) pool.push(o.answer); });
    return pool.length ? [c.answer].concat(pool.slice(0, 3)) : null;
  }
  function accepted(c) {
    var a = [c.answer].concat(c.accept || []), out = [];
    a.forEach(function (x) { String(x || '').split('/').forEach(function (y) { y = norm(y); if (y && out.indexOf(y) < 0) out.push(y); }); });
    return out;
  }

  /* the prompt with its gap; in a typed card the gap is the box */
  function gapLine(c, box) {
    var raw = String(c.prompt || ''), t;
    /* a key word transformation: first sentence · KEY WORD · the sentence to complete, on three lines as in the exam */
    var tf = raw.match(/^(.*?)\s(?:→|·)\s([A-Z][A-Z' ]+?)\s?(?::|·)\s(.*)$/);
    if (tf) t = '<span class="tf-1">' + esc(tf[1]) + '</span><span class="tf-k">' + esc(tf[2]) + '</span>' + esc(tf[3]);
    else t = esc(raw);
    var g = box || '<span class="gap">&nbsp;</span>';
    t = /_{2,}/.test(t) ? t.replace(/_{2,}/, g).replace(/_{2,}/g, '<span class="gap">&nbsp;</span>') : t + ' ' + g;
    return '<div class="prompt">' + t + '</div>';
  }
  function boxFor(c, w) {
    var n = Math.max(6, Math.min(26, String(w || '').length + 3));
    return '<input class="gapin" id="box" style="width:' + n + 'ch" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="Your answer">';
  }

  function show() {
    clearTimeout(timer); head();
    if (i >= deck.length) return end();
    var c = deck[i], html = '<div class="card">' + from(c), mode;
    if (c.kind === 'phrase') {
      mode = 'done';
      html += '<div class="phrase">' + esc(c.prompt) + '</div><p class="task">Say a sentence of your own with it, out loud. Then go back and use it in the game.</p>' +
        '<div class="row"><button class="btn dark" id="go" type="button">Done</button></div>';
    } else if (c.kind === 'recall') {
      /* a phrase from the Quick revision sheet, one word hidden: “could be the p___ option” */
      mode = 'type';
      var cue = String(c.prompt || ''), words = String(c.answer || '').split(' '), k = cue.split(' ').findIndex(function (w) { return /___/.test(w); });
      c._word = words[k] || ''; c._lead = (cue.split(' ')[k] || '').replace(/_+.*$/, '');
      html += '<div class="phrase">' + cue.split(' ').map(function (w, j) { return j === k ? '<span class="nw"><span class="cue">' + esc(c._lead) + '</span>' + boxFor(c, c._word.slice(c._lead.length)) + '</span>' : esc(w); }).join(' ') + '</div>' +
        '<p class="task">Type the missing word.</p>';
    } else {
      var opts = optionsFor(c);
      if (opts) {
        mode = 'pick';
        html += (c.ask ? '<div class="phrase" style="font-size:1.35rem;line-height:1.4">' + esc(c.prompt) + '</div><p class="task">' + esc(c.ask) + '</p>' : gapLine(c)) +
          '<div class="opts">' + shuffle(opts).map(function (o) { return '<button class="opt" type="button" data-o="' + esc(o) + '">' + esc(o) + '</button>'; }).join('') + '</div>';
      } else {
        mode = 'type';
        html += (c.ask ? '<div class="phrase" style="font-size:1.35rem;line-height:1.4">' + esc(c.prompt) + '</div><p class="task">' + esc(c.ask) + '</p><div class="prompt">' + boxFor(c, c.answer) + '</div>' : gapLine(c, boxFor(c, c.answer)));
      }
    }
    if (mode === 'type') html += '<div class="row"><button class="btn dark" id="go" type="button">Check</button></div>';
    stage.innerHTML = html + '<div id="after"></div></div>';
    var go = document.getElementById('go');
    if (mode === 'done') go.onclick = function () { settle(true, ''); next(); };
    if (mode === 'pick') [].forEach.call(stage.querySelectorAll('.opt'), function (b) { b.onclick = function () { pick(b); }; });
    if (mode === 'type') {
      var box = document.getElementById('box');
      go.onclick = function () { typed(box, go); };
      box.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); typed(box, go); } });
      setTimeout(function () { try { box.focus({ preventScroll: true }); } catch (e) {} }, 60);
    }
  }

  function pick(b) {
    var c = deck[i], o = b.getAttribute('data-o'), ok = norm(o) === norm(c.answer);
    [].forEach.call(stage.querySelectorAll('.opt'), function (x) { x.disabled = true; if (norm(x.getAttribute('data-o')) === norm(c.answer)) x.classList.add('is-ok'); });
    if (!ok) b.classList.add('is-no');
    settle(ok, ok ? '' : o, ok ? b : null, false, true);
  }
  function typed(box, go) {
    var c = deck[i], v = box.value.trim();
    if (!v) { box.focus(); return; }
    var n = norm(v), ok;
    if (c.kind === 'recall') ok = n === norm(c._word) || norm(c._lead + v) === norm(c._word);
    else ok = accepted(c).indexOf(n) >= 0;
    box.disabled = true; box.classList.add(ok ? 'is-ok' : 'is-no'); go.parentNode.remove();
    settle(ok, ok ? '' : v, ok ? box : null, true);
  }

  /* the verdict, the reason, and the way on */
  function settle(ok, given, el, wasTyped, picked) {
    var c = deck[i];
    results[i] = ok;
    if (ok) { run++; bestRun = Math.max(bestRun, run); } else run = 0;
    /* saved when the pupil moves on, so "count it" can still change the verdict */
    pend = { c: c, ok: ok, given: given, accept: c.accept };
    if (c.kind === 'phrase') return;
    if (ok) { cheer('right', el, true); if (run % 5 === 0) cheer('streak', el); } else cheer('soft');
    head();
    var why = c.meaning || c.rule || '', after = document.getElementById('after');
    after.innerHTML = '<div class="verdict">' +
      (ok ? '<span class="v ok">Right.</span>' + (wasTyped ? ' <span class="ans">' + esc(c.answer) + '</span>' : '')
          : '<span class="v no">Not this time.</span>' + (picked ? '' : ' <span class="ans">' + esc(c.answer) + '</span>')) +
      (why ? '<div class="why">' + esc(why) + '</div>' : '') +
      (!ok && wasTyped && /\s/.test(String(c.answer).trim()) ? '<button class="mine" id="mine" type="button">Mine says the same thing: count it</button>' : '') +
      (!ok && c.href ? '<a class="practise" href="' + esc(c.href) + '">Practise ' + esc(c.topicName) + ' →</a>' : '') +
      '</div><div class="row"><button class="btn dark" id="nx" type="button">' + (i + 1 < deck.length ? 'Next' : 'See my score') + '</button></div>';
    document.getElementById('nx').onclick = next;
    var m = document.getElementById('mine');
    if (m) m.onclick = function () {
      /* the pupil's wording was a fair paraphrase the key did not list: count it, quietly */
      results[i] = true; run = 1; bestRun = Math.max(bestRun, 1);
      pend.ok = true; pend.given = ''; pend.accept = (c.accept || [c.answer]).concat([given]);
      cheer('right', m, false); next();
    };
    if (ok) timer = setTimeout(next, 1600 + Math.min(2400, why.length * 25));
    else setTimeout(function () { try { document.getElementById('nx').scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (e) {} }, 50);
  }
  function save() {
    if (!pend) return; var p = pend, c = p.c; pend = null;
    if (Be2.countReviewed) Be2.countReviewed();
    Be2.answer(c.topic, { id: c.id, correct: p.ok, prompt: c.prompt, answer: c.answer, given: p.given || c.given || '', meaning: c.meaning, rule: c.rule,
      href: c.href, kind: c.kind, ask: c.ask, opts: c.opts, accept: p.accept });
  }
  function next() { clearTimeout(timer); save(); i++; show(); }
  window.addEventListener('pagehide', save);

  function end() {
    var due = Be2.review().length, room = Be2.dueToday ? Be2.dueToday() : due, later = Be2.deckSize() - due;
    var rule = 'A card comes back after 1, 3, 7 and 21 days, and leaves once you know it every time.';
    if (!deck.length) {
      var capped = due && !room;
      stage.innerHTML = '<div class="empty"><h2>' + (capped ? 'Done for today' : later ? 'Nothing due today' : 'Nothing to review') + '</h2>' +
        (capped ? 'You have reviewed ' + Be2.daily + ' cards today: that is enough. ' + due + ' wait' + (due === 1 ? 's' : '') + ' for tomorrow. ' :
          later ? later + ' card' + (later === 1 ? ' comes' : 's come') + ' back on a later day. ' : 'What you get wrong comes back here, and some of what you get right. ') +
        rule + '<br><a href="/index.html">' + (capped || later ? 'Back home' : 'Start practising') + '</a></div>';
      return;
    }
    var got = results.filter(Boolean).length, all = got === deck.length;
    var bk = 'intuity.best.review.run', best = 0; try { best = +localStorage.getItem(bk) || 0; } catch (e) {}
    var nb = bestRun > best; if (nb) try { localStorage.setItem(bk, String(bestRun)); } catch (e) {}
    stage.innerHTML = '<div class="empty"><h2 id="sc">' + got + ' of ' + deck.length + '</h2>' +
      '<div class="score-sub">' + (all ? 'Every one. ' : '') + 'Longest run <b>' + bestRun + '</b>' + (nb && best ? ' · new best' : best ? ' · best ' + Math.max(best, bestRun) : '') + '.</div><br>' +
      (room ? room + ' more card' + (room === 1 ? '' : 's') + ' due today. ' : due ? 'That is today’s ' + Be2.daily + '. The rest wait for tomorrow. ' : '') +
      rule + '<br><a href="' + (room ? '/review.html' : '/index.html') + '">' + (room ? 'Another round' : 'Back home') + '</a></div>';
    setTimeout(function () { var h = document.getElementById('sc'); if (all) cheer('finale'); else if (nb && best) cheer('streak', h); else cheer('done', h); }, 250);
  }

  /* ═══ THE BOARD: the review's front door (11 Nov 2026) ═══ */
  function board() {
    var B = Be2.board ? Be2.board() : [];
    if (!B.length) return show();
    lead.innerHTML = '';
    var n = Be2.streak(), wk = B.reduce(function (a, b) { return a + b.week; }, 0);
    var d = new Date(), DAYS = ['SUN','MON','TUE','WED','THU','FRI','SAT'], MON = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    var tick = [ '<span>DUE <b>' + deck.length + '</b></span>', '<span>DECK <b>' + Be2.deckSize() + '</b></span>', '<span>THIS WEEK <b>' + wk + '</b> answers</span>' ];
    B.forEach(function (b) { if (b.trend) tick.push('<span>' + b.name.toUpperCase() + ' <b class="' + (b.trend > 0 ? 'up' : 'dn') + '">' + (b.trend > 0 ? '▲' : '▼') + Math.abs(b.trend) + '</b></span>'); });
    var rows = B.map(function (b) {
      var ex = b.total ? Math.round(100 * b.done / b.total) : 0;
      var sc = b.answers >= 5 ? b.acc : null;
      return '<div class="bd-row"><div class="bd-name"><s style="background:' + b.tone.bg + '"></s>' + esc(b.name) + '</div>' +
        '<div class="bd-num"><b>' + b.done + '</b>/' + b.total + ' · ' + (sc == null ? '<span class="na">— %</span>' : '<b>' + sc + '%</b>') +
          (b.trend ? ' <span class="' + (b.trend > 0 ? 'up' : 'dn') + '">' + (b.trend > 0 ? '▲' : '▼') + Math.abs(b.trend) + '</span>' : '') + '</div>' +
        '<div class="bd-bars"><div class="bd-bar ex"><i data-w="' + ex + '"></i></div><div class="bd-bar sc' + (sc == null ? ' none' : '') + '"><i data-w="' + (sc || 0) + '"></i></div></div></div>';
    }).join('');
    /* the next three: from the least-explored skills, the first page on each menu not yet opened */
    var next = B.filter(function (b) { return b.todo.length; }).sort(function (a, b) { return a.done / a.total - b.done / b.total; })
      .slice(0, 3).map(function (b) { return '<a href="' + esc(b.todo[0].url) + '">' + esc(b.todo[0].name) + '<span>' + esc(b.name) + ' →</span></a>'; }).join('');
    var html = '<section class="board" aria-label="Your board">' +
      '<div class="bd-top"><span><i class="bd-live"></i><b>Your board</b></span><span>' + DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()] + (n ? ' · 🔥 ' + n : '') + '</span></div>' +
      '<div class="bd-tick" id="tick"><span class="bd-tape">' + tick.join('') + '</span></div>' +
      '<div class="bd-legend"><span><i class="ex"></i>Explored</span><span><i class="sc"></i>Score</span></div>' + rows +
      '</section>';
    if (deck.length) {
      html += '<div class="pend-wrap"><div class="pend-pivot"></div><div class="pend" id="pend"><button type="button" id="startRv" aria-label="Start the review: ' + deck.length + ' cards">' +
        '<b>START</b><small>' + deck.length + ' card' + (deck.length === 1 ? '' : 's') + '</small></button></div></div>' +
        '<p class="pend-say">Your own mistakes, checked again. About ' + Math.max(1, Math.round(deck.length * 0.4)) + ' minute' + (deck.length > 2 ? 's' : '') + '.</p>';
    } else {
      var due = Be2.review().length;
      html += '<p class="board-empty">' + (due ? 'Today’s ' + Be2.daily + ' are done. ' + due + ' wait for tomorrow.' :
        Be2.deckSize() ? 'Nothing due today. Your cards come back on a later day.' : 'Nothing to review yet. What you get wrong in the games comes back here.') + '</p>';
    }
    if (next) html += '<div class="bd-next"><h3>Not explored yet</h3>' + next + '</div>';
    stage.innerHTML = html;
    /* the tape rolls only when it is longer than the screen: the second copy makes the loop seamless */
    var tk = document.getElementById('tick'), tp = tk && tk.firstChild;
    if (tp && tp.scrollWidth > tk.clientWidth) { tp.innerHTML += tp.innerHTML; tk.classList.add('roll'); }
    requestAnimationFrame(function () { setTimeout(function () { [].forEach.call(stage.querySelectorAll('.bd-bar i'), function (x) { x.style.width = x.getAttribute('data-w') + '%'; }); }, 60); });
    var go = document.getElementById('startRv');
    if (go) go.onclick = function () {
      document.getElementById('pend').classList.add('stop'); cheer('tick');
      setTimeout(function () { window.scrollTo(0, 0); show(); }, 320);
    };
  }

  /* The shell header is fixed; measure it so the deck starts below it. */
  function fit() { var h = document.querySelector('.header'); if (h) document.documentElement.style.setProperty('--rv-head', h.offsetHeight + 'px'); }
  fit(); window.addEventListener('resize', fit); setTimeout(fit, 300);
  board();
})();
</script>
</body>
</html>
