<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F3F1EC">
<title>Be2FIRST — Your review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..900&family=Geist+Mono:wght@400..600&family=Space+Grotesk:wght@700&family=Anton&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=20261105">
<style>
/* ═══ THE REVIEW DECK ═══
   Ten of the student's own mistakes, one at a time: the sentence with its
   gap, a moment to think, the answer, and an honest "got it / not yet".
   Two right answers retire a card. Nothing here is new content — it is the
   app handing back what it already saw the student miss. */
:root{--paper:#F3F1EC;--card:#FAF8F5;--ink:#14110E;--quiet:#5C5852;--faint:#8A8378;--rule:rgba(20,17,14,.12);
  --caramel:#A9774A;--sage:#527065}
html,body{background:var(--paper)}
body{margin:0;color:var(--ink);font-family:'Geist',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{max-width:34rem;margin:0 auto;padding:calc(var(--rv-head,96px) + 14px) 16px 48px}
.lead{text-align:center;margin:8px 0 22px}
.streak{display:inline-flex;align-items:center;gap:8px;font:500 12px/1 'Geist Mono',ui-monospace,monospace;letter-spacing:.08em;
  text-transform:uppercase;color:#7A5A36;background:#F1E6D6;border-radius:999px;padding:8px 14px}
.streak b{font-weight:700}
.count{font:500 11px/1 'Geist Mono',ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-top:14px}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(20,17,14,.12)}
.dots i.done{background:var(--sage)}.dots i.miss{background:var(--caramel)}.dots i.here{outline:2px solid var(--ink);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:22px 20px 18px;box-shadow:0 1px 3px rgba(20,17,14,.06);
  animation:in .28s cubic-bezier(.2,.9,.25,1.1)}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.from{font:500 11px/1 'Geist Mono',ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--caramel);
  display:flex;align-items:center;gap:8px}
.from i{width:14px;height:3px;background:var(--caramel)}
.misses{margin-left:auto;color:var(--faint)}
.prompt{font-family:'Newsreader',Georgia,serif;font-size:1.32rem;line-height:1.55;margin:16px 0 6px}
.gap{display:inline-block;min-width:4.5rem;border-bottom:2px solid var(--ink);margin:0 .2rem;text-align:center;font-family:'Geist',sans-serif;
  font-weight:600;font-size:1.05rem;color:var(--sage)}
.phrase{font-family:'Geist',sans-serif;font-weight:700;font-size:2rem;letter-spacing:-.02em;margin:18px 0 4px}
.task{font-size:.95rem;color:var(--quiet);margin:4px 0 0}
.reveal{margin-top:16px;padding-top:14px;border-top:1px solid var(--rule);font-size:.95rem;line-height:1.5}
.reveal .ans{font-weight:700;font-size:1.1rem}
.reveal .yours{color:var(--faint);text-decoration:line-through;margin-left:.5rem}
.reveal .why{color:var(--quiet);margin-top:6px}
.practise{display:block;margin-top:10px;font:500 11px/1 'Geist Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--quiet);text-decoration:none}
.row{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;min-height:50px;border-radius:999px;font:600 15px/1 'Geist',system-ui,sans-serif;cursor:pointer;border:1.5px solid var(--ink);
  background:transparent;color:var(--ink)}
.btn.dark{background:var(--ink);color:var(--card)}
.btn:active{transform:scale(.97)}
.empty{text-align:center;padding:40px 8px;color:var(--quiet);line-height:1.55}
.empty h2{font-family:'Anton',Impact,sans-serif;font-weight:400;text-transform:uppercase;font-size:2.4rem;line-height:.95;color:var(--ink);margin:0 0 12px}
.empty a{display:inline-block;margin-top:18px;min-height:48px;line-height:48px;padding:0 26px;border-radius:999px;background:var(--ink);
  color:var(--card);text-decoration:none;font-weight:600}
.header-spacer b{color:var(--ink)}
@media(prefers-reduced-motion:reduce){.card{animation:none}}
  .tf-1{display:block;font-size:.88em;color:#5C5852;margin-bottom:.5rem}
  .tf-k{display:block;font-family:'Geist',sans-serif;font-weight:700;font-size:.72em;letter-spacing:.14em;margin-bottom:.35rem}
  .phrase .cue{color:#9A5A2C;font-weight:700;letter-spacing:.04em}
  .phrase mark{background:none;box-shadow:inset 0 -.5em 0 rgba(194,149,110,.45);color:inherit}
</style>
<script src="/tools/be2-brand.js?v=20261108"></script>
</head>
<body>
<header class="header">
  <div class="header-top">
    <a class="back-link" href="/index.html" target="_top">← Home</a>
    <div class="header-title">
      <div class="app-title">INTUITY</div>
      <div class="app-subtitle">Your review</div>
    </div>
    <span class="header-spacer">Level <b>B2</b></span>
  </div>
</header>

<main class="wrap">
  <div class="lead" id="lead"></div>
  <div id="stage"></div>
</main>

<script src="/tools/be2-progress.js?v=20261105b"></script>
<script>
(function () {
  /* at most 12 a day (5 Nov): the oldest-due first, the rest wait for tomorrow */
  var deck = Be2.review(Be2.dueToday ? Be2.dueToday() : 10), i = 0, results = [];
  var lead = document.getElementById('lead'), stage = document.getElementById('stage');
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  function head() {
    var n = Be2.streak();
    lead.innerHTML =
      (n ? '<span class="streak">🔥 <b>' + n + '</b> day' + (n === 1 ? '' : 's') + ' in a row</span>' : '') +
      (deck.length ? '<div class="count">' + Math.min(i + 1, deck.length) + ' / ' + deck.length + '</div><div class="dots">' +
        deck.map(function (_, k) { return '<i class="' + (results[k] === true ? 'done' : results[k] === false ? 'miss' : '') + (k === i ? ' here' : '') + '"></i>'; }).join('') +
      '</div>' : '');
  }

  /* a phrase from the Quick revision sheet, one word hidden: “could be the p___ option” */
  function recallHTML(c, shown) {
    var cue = String(c.prompt || ''), full = String(c.answer || '');
    if (!shown) return '<div class="phrase">' + esc(cue).replace(/(\S)___/, '<span class="cue">$1___</span>') + '</div>' +
      '<p class="task">Say the missing word, out loud or in your head. Then check.</p>';
    var a = full.split(' '), k = cue.split(' ').findIndex(function (w) { return /___/.test(w); });
    return '<div class="phrase">' + a.map(function (w, j) { return j === k ? '<mark>' + esc(w) + '</mark>' : esc(w); }).join(' ') + '</div>';
  }
  function from(c) {
    return '<div class="from"><i></i>' + esc(c.topicName) + '<span class="misses">' + (c.misses ? 'missed ' + c.misses + '×' : 'check-in') + '</span></div>';
  }
  function promptHTML(c, shown) {
    if (c.kind === 'recall') return recallHTML(c, shown);
    if (c.kind === 'phrase') return '<div class="phrase">' + esc(c.prompt) + '</div>' +
      '<p class="task">Say a sentence of your own with it, out loud. Then go back and use it in the game.</p>';
    /* a key word transformation (Rewrite): the first sentence, the key word,
       then the sentence to complete, each on its own line as in the exam */
    var tf = String(c.prompt || '').match(/^(.*) \u2192 ([A-Z' ]+): (.*)$/);
    var t = tf ? '<span class="tf-1">' + esc(tf[1]) + '</span><span class="tf-k">' + esc(tf[2]) + '</span>' + esc(tf[3]) : esc(c.prompt || '');
    var gap = '<span class="gap">' + (shown ? esc(c.answer) : '&nbsp;') + '</span>';
    t = /_{2,}/.test(t) ? t.replace(/_{2,}/, gap).replace(/_{2,}/g, '<span class="gap">&nbsp;</span>') : t + ' ' + gap;
    return '<div class="prompt">' + t + '</div>' +
      (shown ? '' : '<p class="task">What goes in the gap? Say it first.</p>');
  }

  function show() {
    head();
    if (i >= deck.length) return end();
    var c = deck[i];
    stage.innerHTML = '<div class="card">' + from(c) + promptHTML(c, false) +
      '<div class="row"><button class="btn dark" id="see" type="button">' + (c.kind === 'phrase' ? 'Done' : 'Show the answer') + '</button></div></div>';
    document.getElementById('see').onclick = c.kind === 'phrase' ? function () { mark(true); } : reveal;
  }

  function reveal() {
    var c = deck[i];
    var why = c.meaning || c.rule || '';
    stage.innerHTML = '<div class="card">' + from(c) + promptHTML(c, true) +
      '<div class="reveal">' + (c.kind === 'recall' ? '' : '<span class="ans">' + esc(c.answer) + '</span>') +
        (c.given ? '<span class="yours">' + esc(c.given) + '</span>' : '') +
        (why ? '<div class="why">' + esc(why) + '</div>' : '') +
        (c.href ? '<a class="practise" href="' + esc(c.href) + '">Practise ' + esc(c.topicName) + ' →</a>' : '') +
      '</div>' +
      '<div class="row"><button class="btn" id="no" type="button">Not yet</button><button class="btn dark" id="yes" type="button">I knew it</button></div></div>';
    document.getElementById('no').onclick = function () { mark(false); };
    document.getElementById('yes').onclick = function () { mark(true); };
  }

  function mark(ok) {
    var c = deck[i];
    results[i] = ok;
    if (Be2.countReviewed) Be2.countReviewed();
    Be2.answer(c.topic, { id: c.id, correct: ok, prompt: c.prompt, answer: c.answer, meaning: c.meaning, rule: c.rule, href: c.href, kind: c.kind });
    i++; show();
  }

  function end() {
    var due = Be2.review().length, room = Be2.dueToday ? Be2.dueToday() : due, later = Be2.deckSize() - due;
    var rule = 'A card comes back after 1, 3, 7 and 21 days, and leaves once you know it every time.';
    if (!deck.length) {
      var capped = due && !room;
      stage.innerHTML = '<div class="empty"><h2>' + (capped ? 'Done for today' : later ? 'Nothing due today' : 'Nothing to review') + '</h2>' +
        (capped ? 'You have reviewed ' + Be2.daily + ' cards today: that is enough. ' + due + ' wait' + (due === 1 ? 's' : '') + ' for tomorrow. ' :
          later ? later + ' card' + (later === 1 ? ' comes' : 's come') + ' back on a later day. ' : 'What you get wrong comes back here, and some of what you get right. ') +
        rule + '<br><a href="/index.html">' + (capped || later ? 'Back home' : 'Start practising') + '</a></div>';
      return;
    }
    var got = results.filter(Boolean).length;
    stage.innerHTML = '<div class="empty"><h2>' + got + ' of ' + deck.length + '</h2>' +
      (got === deck.length ? 'Every one. ' : '') +
      (room ? room + ' more card' + (room === 1 ? '' : 's') + ' due today. ' : due ? 'That is today’s ' + Be2.daily + '. The rest wait for tomorrow. ' : '') +
      rule + '<br><a href="' + (room ? '/review.html' : '/index.html') + '">' + (room ? 'Another round' : 'Back home') + '</a></div>';
  }

  /* The shell header is fixed; measure it so the deck starts below it. */
  function fit() { var h = document.querySelector('.header'); if (h) document.documentElement.style.setProperty('--rv-head', h.offsetHeight + 'px'); }
  fit(); window.addEventListener('resize', fit); setTimeout(fit, 300);
  show();
})();
</script>
</body>
</html>
