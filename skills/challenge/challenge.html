<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F3F1ED">
<title>INTUITY — The Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500;700&family=Anton&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=12">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   THE CHALLENGE · stage 1

   One page, three screens:
     1 THE WIZARD  — Game or Exam, then a topic
     2 THE TRACK   — fourteen identical cells, 01 to 14, one game per cell
     3 THE RESULT  — score and time (Game), or percentage and review (Exam)

   The page is only the frame. Every game is a shared script in
   /data/challenge/games/ that draws one round into the focus card and
   reports right or wrong; the rules (lives, retries, feedback) belong to the
   page. Content is one file per topic in /data/challenge/, which may import
   rounds from a game's own file instead of copying them.

   GAME · learning: one topic, a surprise behind every cell, three lives,
          retries and feedback straight away.
   EXAM · knowing: one attempt per cell, no feedback until the end, then a
          percentage, a grade and a full review.
   ═══════════════════════════════════════════════════════════════════════ */
.wrap,.scrim{
  /* ── STAGE 4 · THE QUIET SYSTEM ─────────────────────────────────────────
     Every colour on this page and in its games is one of these roles, taken
     from the home page that inspired the app. Six neutrals, four colours:
     sage is the ring, caramel the app's own accent, and one right and one
     wrong — dark sage and clay, the only pair from the palette that stays
     apart for colour-blind eyes AND passes contrast on paper. On the black
     track tiles a tick uses the light ring sage, or it would vanish.
     Two radii: anything tapped on one line is a pill; anything that holds
     content — a card, a field, a pile, a choice of several lines — has one
     soft corner.
     SCOPE: these roles are set on the page's content (.wrap, .scrim), not on
     :root. The shared stylesheet uses some of the same names with its own
     meaning — there --paper is the BODY TEXT colour — and the header must
     look exactly as it does on every other page. So nothing here reaches the
     header, and the light surface has a name of its own: --sheet. */
  --ink:#2B2129; --sheet:#FEFCF9; --stage:#FAF7F2; --soft:#5C4E52; --mute:#8B7B78; --rule:#D9C0A4;
  --sage:#8AA79C; --caramel:#C2956E; --caramel-ink:#8A6440;
  --right:#4A6B5C; --wrong:#B4653A;
  --right-soft:rgba(74,107,92,.12); --wrong-soft:rgba(180,101,58,.13); --sage-soft:rgba(138,167,156,.16);
  --r-box:16px; --r-tap:999px;
  /* the old names, kept so nothing that reads them breaks — now pointing at the roles */
  --accent:var(--caramel); --accent-ink:var(--caramel-ink); --good:var(--right); --bad:var(--wrong);
  --dim:var(--soft); --faint:var(--mute); --sentence:var(--soft); --card:var(--sheet);
}
[hidden]{display:none!important}
.header{position:sticky;top:0;z-index:20;background:var(--bg,var(--screen,#F3F1ED))}
.wrap{max-width:45.6rem;margin:0 auto;padding:1rem var(--gutter,1rem) 3rem}
.card{background:var(--card,#FAF8F5);border:1px solid var(--rule);border-radius:var(--r-box);box-shadow:0 12px 28px -18px rgba(35,44,49,.35);padding:1.5rem 1.4rem 1.5rem}
.kick{display:flex;align-items:center;gap:9px;font-family:var(--f-mono);font-size:.58rem;letter-spacing:.24em;text-transform:uppercase;color:var(--accent-ink)}
.kick::before{content:'';display:block;width:26px;height:10px;flex:none;background:var(--caramel)}
.title{font-family:var(--f-display);font-weight:800;font-size:clamp(1.3rem,4.4vw,1.9rem);letter-spacing:.34em;text-transform:uppercase;line-height:1.1;color:var(--ink);
  margin:.6rem 0 .8rem;padding-bottom:.7rem;border-bottom:3px double var(--ink)}
.lead{font-size:.95rem;line-height:1.55;color:var(--dim);margin:0 0 1.2rem;max-width:34rem}
.lab{display:block;font-family:var(--f-display);font-size:.84rem;letter-spacing:0;color:var(--faint);margin:1.4rem 0 .6rem}
.btn{font-family:var(--f-display);font-size:.92rem;font-weight:600;letter-spacing:0;padding:.75rem 1.5rem;border-radius:var(--r-tap);cursor:pointer;
  border:1.5px solid var(--ink);background:none;color:var(--ink)}
.btn.fill{background:var(--ink);color:var(--sheet)}
.btn:disabled{opacity:.35;cursor:default}
.cta{display:flex;justify-content:center;gap:.6rem;flex-wrap:wrap;margin-top:1.2rem}

/* ── 1 · THE GATE — as on Conditionals Decide: a pendulum and one instruction ── */
.gate{text-align:center;padding-top:3.2rem}
.gate .gate-mark{width:104px;height:104px;margin:0 auto 1.4rem}
.gate .gate-mark .pend-dial span{font-size:1.6rem}
.gate .kick{justify-content:center}
.gate .title{display:inline-block;margin-left:auto;margin-right:auto}
.pick{font-family:var(--f-display);font-size:.92rem;letter-spacing:0;color:var(--ink);margin:.6rem auto .4rem;padding:.8rem 0;
  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);max-width:26rem}
.mode-note{font-size:.9rem;line-height:1.5;color:var(--sentence);margin:.8rem auto 1rem;max-width:30rem}
/* the header's two tiers */
/* the row is the topic page's own, so it keeps that page's spacing */
.header .mode-selector button.mode-btn{background:none;border:none;cursor:pointer}
/* ten topics on one line: the tier set a touch tighter than on a five-tab page */
.header .set-tabs{box-sizing:border-box;width:auto;max-width:100%;margin-left:auto!important;margin-right:auto!important}
/* inside the overflow frame the tabs scroll in their track: auto margins would size a grid item to its content and push the page sideways */
.header .ovf > .set-tabs{margin-left:0!important;margin-right:0!important}
@media(min-width:561px){ .header .set-tabs{flex-wrap:nowrap;justify-content:center;gap:0} .header .set-tabs .vtab{font-size:.6rem;letter-spacing:.08em;padding-left:.5rem;padding-right:.5rem;white-space:nowrap} }
.header .set-tabs .vtab:disabled{opacity:.38;cursor:default}
@media(max-width:560px){ .header .set-tabs{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;scrollbar-width:none}
  .header .set-tabs::-webkit-scrollbar{display:none} .header .set-tabs .vtab{white-space:nowrap;flex:none} }
/* ── 2 · THE TRACK ── */
.meters{display:flex;align-items:center;gap:1.3rem;flex-wrap:wrap;font-family:var(--f-display);font-size:.82rem;letter-spacing:0;color:var(--faint)}
.meters b{font-family:var(--f-display);font-size:1.05rem;font-weight:900;letter-spacing:0;color:var(--ink);font-variant-numeric:tabular-nums;margin-left:.3rem}
.lives{display:flex;gap:4px;margin-left:.35rem}
.lives svg{width:15px;height:15px;fill:var(--bad);transition:fill .3s,transform .3s}
.lives svg.gone{fill:var(--rule);transform:scale(.8)}
/* practice: the hearts give way to one quiet word — a state, not a failure */
.lives .practice{font-family:var(--f-display);font-size:.8rem;font-weight:600;letter-spacing:0;text-transform:none;color:var(--soft,#5C4E52)}
.hint{text-align:center;font-family:var(--f-display);font-size:.86rem;letter-spacing:0;color:var(--faint);margin:.6rem 0 0}
/* ── THE TRACK · 1930s minimal ──────────────────────────────────────
   The sketch: the track IS the tiles — one band, cut into cells by straight
   cross-lines. Drawn in the Deco manner: a double-rule border (a heavy line
   and a hairline), cream paper, near-black ink, ochre for the cells won.
   Flat fills, square cuts, no shadow, no pulse: every cell — including the
   first and last — is drawn and treated exactly the same. */
:root{ --deco-ink:#2B2129; --deco-paper:#F6F1E6; --deco-ochre:#C2956E; --deco-red:#B4653A;
  /* the pendulum ring, unrolled: its sage rim, its dark core, its cream numerals */
  --ring-sage:#8AA79C; --ring-core:#201E1C; --ring-ink:#E5D1B8;
  /* an answered tile: its own token, so its colour can change without
     touching anything else (it was the decorative ochre) */
  --tile-done:var(--deco-ochre); --tile-done-ink:var(--deco-paper);
  /* the Board's marks: a tile keeps its black and wears a tick or a cross */
  --mark-right:#8AA79C; --mark-wrong:#B4653A; --mark-answered:var(--ring-ink); }   /* on the black tiles: light sage, clay */
/* GAME mode: the black tiles stay, the rim turns caramel — on the track
   and on every game's rings, which read the same token */
body.mode-game{ --ring-sage:#C2956E; --mark-sweep:#C2956E; }   /* --mark-sweep: the pendulums' rim */
.board{margin:1.1rem 0 .2rem}
.board svg{display:block;width:100%;height:auto;max-height:62vh;overflow:visible}
/* the ring in index.html, unrolled — the same three layers, the same proportions:
   a raised bezel shaded #FFFFFF → #E4DDD1 at 145° (white light top-left, soft
   shadow bottom-right), the sage band #8AA79C, and the dark core. */
.bezel{fill:none;stroke:url(#bezelShade);stroke-width:var(--bw-a);stroke-linejoin:round;filter:url(#raise)}
.sage{fill:none;stroke:var(--ring-sage);stroke-width:var(--bw-b);stroke-linejoin:round}
.cap-bezel{stroke:url(#bezelShade)}
.cap-sage{stroke:var(--ring-sage)}
.cell{fill:none;stroke:var(--ring-core);stroke-width:var(--bw);stroke-linejoin:miter;cursor:default;transition:stroke .35s}
.cell.done{stroke:var(--ring-core)}              /* answered: the tile stays black, as on the Board */
.num.done{opacity:.5}
.cell.open{stroke:var(--ring-ink);cursor:pointer}
.cut{stroke:var(--ring-sage);stroke-width:1.8}

.num{font-family:'Anton',Impact,var(--f-display),sans-serif;font-weight:400;font-size:23.4px;letter-spacing:.02em;fill:var(--ring-ink);text-anchor:middle;dominant-baseline:central;pointer-events:none;transition:fill .35s}
.num.done{fill:var(--ring-ink)}
.num.open{fill:var(--ring-core)}
/* each cell is the whole path, dashed — so the browser's own focus box would
   frame the entire track. The focus mark is the cell's own colour instead. */
.cell:focus,.cell:focus-visible{outline:none}
.cell.open:focus-visible{stroke:var(--ink)}
.legend{display:flex;justify-content:center;gap:1.4rem;flex-wrap:wrap;margin-top:1rem;font-family:var(--f-display);font-size:.8rem;letter-spacing:0;color:var(--faint)}
.legend i{display:inline-block;width:10px;height:10px;margin-right:.45rem;vertical-align:-1px;border:2px solid var(--ring-sage);background:var(--ring-core)}
.legend i.o{background:var(--ring-ink)} .legend i.d{background:var(--tile-done)}

/* ── THE FOCUS CARD ── */
.scrim{position:fixed;inset:0;z-index:900;display:flex;align-items:center;justify-content:center;padding:1rem;
  background:rgba(20,17,14,.34);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;transition:opacity .25s}
.scrim.on{opacity:1}
.focus{position:relative;width:min(var(--w-focus,35rem),100%);max-height:90vh;overflow-y:auto;background:var(--card,#FAF8F5);border-radius:var(--r-box);
  box-shadow:0 24px 60px -18px rgba(20,17,14,.38),0 6px 16px rgba(20,17,14,.14);padding:1.6rem 1.5rem 1.4rem;
  transform:translateY(24px) scale(.97);transition:transform .45s cubic-bezier(.2,1.3,.4,1)}
.scrim.on .focus{transform:none}
.focus .x{position:absolute;top:.8rem;right:.9rem;border:none;background:none;font-size:1rem;color:var(--faint);cursor:pointer;padding:.4rem}
.focus h2{font-family:'Anton',Impact,var(--f-display),sans-serif;font-weight:400;font-size:clamp(1.6rem,6vw,2.1rem);line-height:1.02;color:var(--ink);margin:.45rem 0 .2rem}
.focus h2::after{content:'';display:block;width:40px;height:3px;background:var(--ink);margin:.65rem 0 0}
.feedback{min-height:1.4em;margin:.9rem 0 0;font-size:.92rem;line-height:1.5;color:var(--sentence)}
.feedback b{color:var(--ink)}
.focus .cta{justify-content:flex-start;margin-top:.9rem}

/* ── the games' shared parts (cg-*) ── */
.cg-prompt{font-size:.98rem;line-height:1.55;color:var(--sentence);margin:1rem 0 .9rem}
body.board-page .board-toggle{display:flex;justify-content:center;padding:.2rem 0 .9rem;border-bottom:1px solid var(--rule,#D8CFC2);margin-bottom:.4rem}
body.board-page .board-toggle .viewtog{margin:0}
.aim{font-size:.86rem;line-height:1.5;color:var(--dim);margin:.6rem 0 0;padding-left:.7rem;border-left:3px solid var(--caramel)}   /* not .focus: that is the card */
.cg-line{font-family:var(--f-display);font-weight:700;font-size:1.12rem;line-height:1.5;color:var(--ink);margin:.9rem 0 1rem}
.cg-blank{display:inline-block;min-width:5.5em;border-bottom:2px solid var(--ink);text-align:center;color:var(--accent-ink)}
.cg-opts{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.cg-opt{display:flex;align-items:center;gap:.8rem;text-align:left;padding:.8rem .2rem;border:none;border-bottom:1px solid var(--rule);background:none;
  font:inherit;font-size:.98rem;color:var(--ink);cursor:pointer;transition:background .2s}
.cg-l{flex:none;width:24px;height:24px;border-radius:50%;background:rgba(20,17,14,.07);display:grid;place-items:center;font-family:var(--f-mono);font-size:.66rem;color:var(--faint)}
.cg-opt.cg-ok{background:var(--right-soft);color:var(--right)} .cg-opt.cg-ok .cg-l{background:var(--good);color:var(--sheet)}
.cg-opt.cg-no{background:var(--wrong-soft);color:var(--wrong)} .cg-opt.cg-no .cg-l{background:var(--bad);color:var(--sheet)}
.cg-opt.cg-picked{background:var(--tile-bg)} .cg-opt.cg-picked .cg-l{background:var(--ink);color:var(--sheet)}
.cg-opt:disabled{cursor:default}
.cg-field{display:flex;gap:.5rem}
.cg-field input{flex:1;min-width:0;font:inherit;font-size:1rem;padding:.7rem .95rem;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:var(--r-box)}
.cg-field input:focus{outline:2px solid var(--accent);outline-offset:1px}
.cg-btn{font-family:var(--f-display);font-size:.9rem;font-weight:600;letter-spacing:0;border-radius:var(--r-tap);padding:.7rem 1.25rem;border:1.5px solid var(--ink);background:var(--ink);color:var(--sheet);cursor:pointer}
.cg-btn.cg-ghost{background:none;color:var(--ink)}
.cg-btn:disabled{opacity:.35;cursor:default}
.cg-row{display:flex;gap:.5rem;margin-top:.8rem}
.cg-chips{display:flex;flex-wrap:wrap;gap:.4rem;min-height:2.5rem}
.cg-chip{font:inherit;font-size:.94rem;padding:.45rem .75rem;border-radius:999px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);cursor:pointer}
.cg-chip.cg-used{visibility:hidden}
.cg-built{min-height:2.7rem;padding:.5rem 0;margin:0 0 .7rem;border-bottom:2px solid var(--ink);display:flex;flex-wrap:wrap;gap:.35rem}
.cg-built .cg-chip{background:var(--tile-bg);border-color:transparent;cursor:default}
.cg-bins{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:.8rem}
.cg-bin{border:1px dashed var(--rule);border-radius:var(--r-box);padding:.55rem;min-height:5.2rem}
.cg-bin h4{font-family:var(--f-display);font-size:.8rem;font-weight:400;letter-spacing:0;color:var(--faint);margin:0 0 .4rem}
.cg-bin .cg-chip{font-size:.84rem;padding:.32rem .6rem;margin:0 .25rem .3rem 0}
.cg-bin.cg-ready{border-color:var(--accent);cursor:pointer}
.cg-chip.cg-sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.cg-chip.cg-ok{background:var(--right-soft);border-color:transparent} .cg-chip.cg-no{background:var(--wrong-soft);border-color:transparent}
.cg-key{margin:.2rem 0 .1rem} .cg-key span{display:inline-block;font-family:var(--f-mono);font-weight:700;font-size:.8rem;letter-spacing:.2em;padding:.35rem .8rem;border:1.5px solid var(--ink);border-radius:var(--r-tap)}
.cg-match{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-top:.4rem}
.cg-match>div{display:flex;flex-direction:column;gap:.4rem}
.cg-m{position:relative;border-radius:var(--r-box);text-align:left;font:inherit;font-size:.9rem;line-height:1.35;padding:.6rem .7rem .6rem 2rem;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);cursor:pointer}
.cg-m::before{content:attr(data-n);position:absolute;left:.55rem;top:50%;transform:translateY(-50%);width:1rem;height:1rem;border-radius:50%;
  font-family:var(--f-mono);font-size:.6rem;line-height:1rem;text-align:center;background:var(--tile-bg);color:var(--faint)}
.cg-m[data-n]::before{background:var(--ink);color:var(--sheet)}
.cg-m.cg-sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.cg-m.cg-ok{background:var(--right-soft);border-color:transparent} .cg-m.cg-no{background:var(--wrong-soft);border-color:transparent}
.cg-shake{animation:cgShake .42s cubic-bezier(.2,.9,.3,1)}
@keyframes cgShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}45%{transform:translateX(7px)}70%{transform:translateX(-3px)}}
/* the pendulum game: the Speaking gate's dials, sized for a focus card */
:root{ --mark-sweep:#708A81; --mark-rest:#4A433D; --mark-core:#201E1C; --mark-ink:#E5D1B8; --mark-pct:100%; }
.cg-dials{display:grid;grid-template-columns:repeat(2,auto);justify-content:center;gap:1.5rem 2.4rem;margin:1.6rem 0 1rem;--dial:clamp(92px,26vw,118px)}
.dial-b{display:flex;flex-direction:column;align-items:center;border:none;background:none;padding:0;cursor:pointer;font:inherit;color:inherit}
.dial-b .pend-hang{display:block;width:var(--dial);height:var(--dial);transform-origin:50% -10px;animation:pendCalm 5.2s cubic-bezier(.37,0,.63,1) infinite}
.dial-b .pend-hang::before{top:-10px;height:10px} .dial-b .pend-hang::after{top:-13px;width:6px;height:6px}
@keyframes pendCalm{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.dial-b .pend-dial span{font-size:calc(var(--dial) * .12);font-weight:700;line-height:1.12;max-width:62%;text-align:center}
.dial-b.cg-ok .pend-dial{--mark-sweep:var(--good)} .dial-b.cg-no .pend-dial{--mark-sweep:var(--bad)} .dial-b.cg-picked .pend-dial{--mark-sweep:var(--ink)}
.dial-b.cg-no{opacity:.5;cursor:default}
.cg-done .dial-b .pend-hang{animation:none;transform:rotate(0)}
.cg-done .dial-b:not(.cg-ok):not(.cg-picked){opacity:.35}
.cg-sent{border-top:1px solid var(--rule);padding-top:.6rem}
.cg-lab{display:block;font-family:var(--f-display);font-size:.78rem;letter-spacing:0;color:var(--faint);margin:0 0 .15rem}
.cg-act{font-size:.95rem;color:var(--dim);margin:0 0 .5rem}
.cg-sent .cg-line{margin:.1rem 0 0}

/* ── 3 · THE RESULT ── */
.big{font-family:'Anton',Impact,var(--f-display),sans-serif;font-size:3.2rem;line-height:1;color:var(--ink);margin:.8rem 0 .2rem}
/* game controls are tapped, not read: no text selection, no long-press menu
   (on Android a press-and-hold on the legend opened Translate · Copy and a
   search for "WRONG"). The sentences themselves stay selectable. */
.board,.board *,.legend,.meters,.lives,.btn,.cg-btn,.cg-opt,.cg-chip,.cg-m,.cg-bin,.dial-b,.mode-btn,.viewbtn,
.cg-wire,.pg-peg,.pg-row,.sg-pile,.sg-card,.ht-w,.ko-card,.fc-card,.gk-ring{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.look{font-size:.95rem;margin:.2rem 0 0} .look.ok b{color:var(--right)} .look.no b{color:var(--wrong)}
.partno{font-size:.82rem;color:var(--soft,#5C4E52);margin:.15rem 0 .7rem}
.grade{font-family:var(--f-display);font-size:.92rem;letter-spacing:0;color:var(--accent-ink)}
/* what the run did to the learner's mistakes: plain sentence case, dark sage for the numbers */
.ring-line{font-size:.92rem;line-height:1.55;color:var(--soft,#5C4E52);margin:.9rem 0 .2rem;padding:.75rem .9rem;border-radius:var(--r-box);background:rgba(74,107,92,.07)}
.ring-line b{color:var(--right)}
.review{margin:1rem 0 0;border-top:1px solid var(--rule)}
.review li{list-style:none;padding:.65rem 0;border-bottom:1px solid var(--rule);font-size:.88rem;line-height:1.45;color:var(--sentence)}
.review .rh{display:flex;justify-content:space-between;gap:.6rem;font-family:var(--f-display);font-size:.78rem;letter-spacing:0;color:var(--faint);margin-bottom:.2rem}
.review .ok{color:var(--good)} .review .no{color:var(--bad)}
.review b{color:var(--ink)}
.mk{fill:none;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;opacity:0;transition:opacity .25s}
.mk.on{opacity:1}
.mk.tick{stroke:var(--mark-right);stroke-width:3.4}
.mk.cross{stroke:var(--mark-wrong);stroke-width:3.4}
.mk.dot{fill:var(--mark-answered);stroke:none}
.legend svg{width:12px;height:12px;margin-right:.4rem;vertical-align:-2px;overflow:visible}
.mute{border:none;background:none;cursor:pointer;font-size:.9rem;line-height:1;padding:0 .35rem 0 0;vertical-align:-1px}
.mute.off{opacity:.32;filter:grayscale(1)}
/* GLITTER: a small burst from a tile's new tick — Game only, never over a card */
.glitter{position:fixed;left:0;top:0;width:0;height:0;pointer-events:none;z-index:40}
.glitter i{position:absolute;left:0;top:0;width:var(--s);height:var(--s);margin:calc(var(--s) / -2) 0 0 calc(var(--s) / -2);background:var(--c);
  border-radius:var(--r);opacity:0;animation:glit var(--d) cubic-bezier(.15,.7,.3,1) var(--w) forwards}
@keyframes glit{0%{opacity:0;transform:translate(0,0) rotate(0) scale(.4)}15%{opacity:1}
  100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--rot)) scale(1)}}

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const G=window.ChallengeGames, P=new URLSearchParams(location.search);
const BASE='/data/challenge/';
const SECTION=P.get('section')||'grammar';
const SEC=()=>TOPICS.sections.find(s=>s.id===SECTION)||TOPICS.sections[0];
const N=14;                    /* fourteen cells, all identical — every one fetches its own exercise */
/* WHAT STUDENTS SEE IS "Challenge", NOT "Exam". The mode is the same honest
   measure — one try per question, Cambridge task types only — but "Exam"
   told a returning student "you will be judged" before a single tile. The
   menu already calls this The Ultimate Challenge, so the word is familiar:
   play it as a Game, or take the Challenge. Underneath it is still
   mode=exam, so every link already shared keeps working. */
const NOTE={game:'Game · fourteen tiles, fourteen games — Defuse, Swing, Knock-out, Sort, Pegs, Forge, Pairs, Flip and Hunt. Three lives, another try after a mistake, the answer explained straight away.',
            exam:'Challenge · Cambridge task types only: multiple choice, open cloze (Part 2), word formation (Part 3) and key word transformation (Part 4). One attempt per question and the answer straight after — then your percentage, how close you are, and a full review.'};
/* THE EXAM PLAYS ONLY WHAT THE PAPER ASKS. Odd one out, Sort it, Match, Put
   it in order, Correct the error and the bracketed-verb gap are good
   practice and live on in Game, as Knock-out, Sort, Pegs, Forge, Hunt and
   Pairs — but none of them is a B2 First task, so a score built on them
   would partly measure tasks the learner will never sit. The value is the
   label shown on the card: '' for multiple choice, which is a sentence-level
   cousin of Part 1 and not claimed as Part 1 itself. */
const CAMBRIDGE={choose:'',opencloze:'Part 2',wordform:'Part 3',transform:'Part 4'};

/* ══ STATE ══ */
let mode=P.get('mode')==='game'?'game':'exam',     /* Exam by default; Game is one tap away */ TOPICS=null, topic=null, pool=[], plan=[];
let lives=3, score=0, playing=false, t0=0, tick=null, tries=0, log=[], vocabItems=[];
/* practice: lives ran out, the run carries on without points. ring: what this
   run did to the learner's mistakes, for the result card */
let practice=false, practiceAt=0, practiceRight=0, ringRun={came:0,fixed:0,half:0};
/* games where the learner TYPES the answer — the only ones a letter can help */
const TYPED={pairs:1,flip:1,hunt:1,gap:1,opencloze:1,wordform:1,transform:1,correct:1};

/* ══ 1 · THE HEADER AND THE GATE ══ */
function paintMute(){ const m=$('mute'); if(!m||!window.SFX) return; const on=SFX.isOn(); m.classList.toggle('off',!on); m.setAttribute('aria-pressed',on); m.setAttribute('aria-label',on?'Sound on':'Sound off'); }
if($('mute')) $('mute').onclick=()=>{ if(window.SFX){ SFX.toggle(); paintMute(); } };
paintMute();
function drawModes(){
  const lg=$('legend'); if(lg) lg.innerHTML=mode==='game'
    ? '<span><svg viewBox="0 0 12 12"><path d="M2 6.4l2.8 3 5-5.8" fill="none" stroke="var(--mark-right)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Right</span><span><svg viewBox="0 0 12 12"><path d="M2 6.4l2.8 3 5-5.8" fill="none" stroke="var(--mark-right)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><svg viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" fill="none" stroke="var(--mark-wrong)" stroke-width="2.2" stroke-linecap="round"/></svg>After a mistake</span><span><svg viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" fill="none" stroke="var(--mark-wrong)" stroke-width="2.2" stroke-linecap="round"/></svg>Wrong</span>'
    : '<span><svg viewBox="0 0 12 12"><path d="M2 6.4l2.8 3 5-5.8" fill="none" stroke="var(--mark-right)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Right</span><span><svg viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" fill="none" stroke="var(--mark-wrong)" stroke-width="2.2" stroke-linecap="round"/></svg>Wrong</span>';
  document.body.classList.toggle('mode-game', mode==='game');     /* Game's caramel rim */
  document.querySelectorAll('#modeRow [data-mode], #topicTabs [data-mode]').forEach(b=>{ const on=b.dataset.mode===mode; b.classList.toggle('active',on); on?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'); });
  $('modeNote').textContent=NOTE[mode]; $('gKick').textContent=(TOPICS?SEC().label:'Grammar')+' · '+(mode==='game'?'Game':'Challenge');
  if(topic){ $('tKick').textContent=topic.label+' · '+(mode==='game'?'Game':'Challenge');
    $('mScore').hidden=mode==='exam'; $('mLives').hidden=mode==='exam'; $('mDone').hidden=mode!=='exam'; }
}
function wireModes(){ document.querySelectorAll('#modeRow [data-mode], #topicTabs [data-mode]').forEach(b=>b.onclick=()=>{
  if(b.dataset.mode===mode) return; mode=b.dataset.mode; drawModes(); if(topic){ if(BOARD&&SETS.length) usePool(); reset(); paint(); } }); }
wireModes();
function drawTopics(){
  if(BOARD) return;                                   /* a Board has one topic and no tabs */
  const sec=SEC();
  $('topicTabs').innerHTML=sec.topics.map(t=>`<button type="button" role="tab" class="vtab${topic&&topic.id===t.id?' active':''}" data-t="${esc(t.id)}"
     aria-selected="${!!(topic&&topic.id===t.id)}" title="${esc(t.label)}${(t.file||t.vocab)?'':' · coming soon'}"${(t.file||t.vocab)?'':' disabled'}>${esc(t.short||t.label)}</button>`).join('');
  $('topicTabs').querySelectorAll('[data-t]:not(:disabled)').forEach(b=>b.onclick=()=>choose(b.dataset.t));
}
/* one vocabulary sentence → several round shapes, so the Board has variety */
/* a short, stable fingerprint of a vocabulary item's text: the same item
   gets the same id on every device and every visit, without editing the
   vocabulary files. Edit the item's words and it becomes a new item. */
const fp=s=>{ let h=5381; s=String(s); for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))>>>0; return h.toString(36); };
const vid=(it,g)=>'v-'+fp([it.cue,it.answer,it.after].join('|'))+'-'+g;
/* is any round built from this vocabulary item waiting in the Ring? */
const itemDue=it=>{ try{ return !!window.IntuityRing&&['choose','gap','correct','odd'].some(g=>IntuityRing.isDue(vid(it,g))); }catch(e){ return false; } };
function vocabRounds(items){
  const full=(it,w)=>[it.cue,w,it.after].filter(Boolean).join(' ').replace(/\s+/g,' ').trim();
  const wrongOf=it=>shuffle(it.options.filter(o=>o!==it.answer))[0];
  const out=[];
  items.forEach(it=>{
    const tag=it.tense||'', note=it.note||'';
    const line=(it.cue+' ___ '+it.after).trim();
    out.push({id:vid(it,'choose'),game:'choose',prompt:line,options:it.options,answer:it.answer,note,tag});
    out.push({id:vid(it,'gap'),game:'gap',prompt:line+'  ('+it.answer.charAt(0)+'…)',answer:[it.answer],note,tag});
    /* no "put the words in order" here: built from a vocabulary sentence it
       tests word order, not the word — the one thing this round is about */
    const bad=wrongOf(it);
    /* "a burst" → "an accumulation": the article travels with the option, so
       striking just "burst" and typing just "accumulation" — what any learner
       does — must count. The noun is the word being tested, not the article. */
    const art=w=>String(w).match(/^(a|an|the)\s+(.+)$/i), ba=art(bad), aa=art(it.answer);
    out.push({id:vid(it,'correct'),game:'correct',sentence:full(it,bad),answer:aa?[it.answer,aa[2]]:[it.answer],wrong:ba?[bad,ba[2]]:bad,note,tag});   /* `wrong`: Hunt checks the strike */
  });
  const sh=shuffle(items);
  for(let i=0;i+3<sh.length;i+=4){
    const g=sh.slice(i,i+4), bad=g[0], odd=full(bad,wrongOf(bad));
    out.push({id:vid(bad,'odd'),game:'odd',options:[odd].concat(g.slice(1).map(x=>full(x,x.answer))),answer:odd,
      note:'Correct version: '+full(bad,bad.answer),tag:bad.tense||''});
  }
  return out;
}

async function choose(id){
  const t=SEC().topics.find(x=>x.id===id); if(!t||!(t.file||t.vocab)) return;
  $('pick').textContent='Loading '+t.label+'…';
  try{
    if(t.vocab){
      let items=[];
      for(const vid of t.vocab){
        try{
          const m=await ChallengeMixes.loadVocab(vid);
          let its=[]; m.groups.forEach(g=>g.items.forEach(it=>its.push(it)));
          /* keep Mixed balanced: 40 from each source — but waiting mistakes are
             kept first, or a mistake could fall outside the sample and never come back */
          if(t.vocab.length>1){ its=shuffle(its); its.sort((a,b)=>itemDue(b)-itemDue(a)); its=its.slice(0,40); }
          items=items.concat(its);
        }catch(e){}
      }
      pool=vocabRounds(items).filter(r=>G[r.game]).map(r=>Object.assign(r,{part:t.part||'UoE1'})); topic={id,label:t.label,focus:t.focus||''};
      vocabItems=items;
    }else{
      vocabItems=[];
      const d=await (await fetch(BASE+t.file,{cache:'no-store'})).json();
      let rounds=(d.rounds||[]).slice();
      for(const im of d.imports||[]){
        try{ const x=await (await fetch(im.file,{cache:'no-store'})).json(); (x.rounds||[]).forEach(r=>rounds.push(Object.assign({game:im.game},r))); }catch(e){}
      }
      pool=rounds.filter(r=>G[r.game]); topic={id,label:d.topic||t.label,focus:t.focus||''};
    }
    if(!pool.length) throw new Error('no rounds');
    if(BOARD) makeSets();
  }catch(e){ $('pick').textContent='That topic didn’t load — pick it again'; return; }
  $('gate').hidden=true; $('trackCard').hidden=false; drawTopics(); drawModes();
  reset(); drawBoard(); scrollTo(0,0);
}

/* ══ THE DRAW — fourteen cells, a surprise each ══
   Both modes: seven cells that ask the student to RECOGNISE and seven that
   ask them to PRODUCE, the same format never twice in a row, and no
   sentence twice in a run.
   EXAM: only Cambridge task types (see CAMBRIDGE) — recognise (multiple
   choice), produce (open cloze, word formation, key word transformation).
   No feedback until the end.
   GAME: the same split, and every tile a game — each exam format played as
   the INTUITY game that does its job: Choose as Defuse, the situation
   rounds as Swing, Odd one out as Knock-out, Sort it as Sort, Match as
   Pegs (recognising); Put it in order as Forge, Fill the gap as Pairs, Key
   word transformation as Flip, Correct the error as Hunt (producing). The
   question inside is the Exam's; only the way it is played changes.
   A game that declares `accepts` plays the topic's existing rounds (Defuse
   and Forge play the choose and pendulum sentences); a game without it
   plays only rounds written for it. */
function draw(){
  const items=vocabItems;
  const by={}; pool.forEach(r=>(by[r.game]=by[r.game]||[]).push(r));

  /* Match: four different words, each paired with its own sentence */
  const mRounds=[], mh=shuffle(items);
  for(let i=0;i+3<mh.length;i+=4){
    const g=mh.slice(i,i+4);
    if(new Set(g.map(x=>x.answer)).size<4) continue;
    mRounds.push({game:'match',prompt:'Match each word to its sentence.',
      pairs:g.map(x=>[x.answer,(x.cue+' ___ '+x.after).trim()]),note:'',tag:''});
  }
  if(mRounds.length&&G.match) by.match=mRounds;

  /* Sort it: two sets with at least three different words each */
  const sRounds=[], bySet={};
  items.forEach(it=>{ const t=it.tense; if(!t||/^none$/i.test(t)) return;
    (bySet[t]=bySet[t]||new Map()).set(it.answer,it); });
  const sets=shuffle(Object.keys(bySet).filter(t=>bySet[t].size>=3));
  for(let i=0;i+1<sets.length&&i<12;i+=2){
    const a=sets[i], b=sets[i+1];
    const wa=shuffle([...bySet[a].keys()]).slice(0,3);
    const wb=shuffle([...bySet[b].keys()]).filter(w=>!wa.includes(w)).slice(0,3);
    if(wb.length<3) continue;
    sRounds.push({game:'sort',prompt:'Sort the words into their sets.',bins:[a,b],
      items:wa.map(w=>[w,0]).concat(wb.map(w=>[w,1])),note:'',tag:''});
  }
  if(sRounds.length&&G.sort) by.sort=sRounds;

  /* games that declare `accepts` play any existing round, including Match and Sort */
  const all=pool.concat(mRounds,sRounds);
  Object.keys(G).forEach(k=>{ if(G[k].accepts){ const rs=all.filter(G[k].accepts); if(rs.length) by[k]=rs; } });

  const kind=k=>G[k].kind||'exam', skill=k=>G[k].skill||'receptive';
  const due=r=>(mode==='game'&&r.id&&window.IntuityRing&&IntuityRing.isDue(r.id))?1:0;
  const dueIn=k=>by[k].reduce((n,r)=>n+due(r),0);
  const have=Object.keys(by).filter(k=>G[k]);
  const fill=(types,n)=>{ if(!types.length||n<=0) return []; const s=shuffle(types).slice(0,n); while(s.length<n) s.push(types[(Math.random()*types.length)|0]); return s; };
  const exOK=k=>kind(k)==='exam'&&(k in CAMBRIDGE);
  const side=(sk,want)=>{
    const ex=have.filter(k=>exOK(k)&&skill(k)===sk), gm=have.filter(k=>kind(k)==='game'&&skill(k)===sk);
    /* EXAM plays the exam formats, GAME plays the games — every tile a game.
       Either way the formats are taken in turn, so each gets its share and
       none crowds the others; a topic missing one shares its tiles out. */
    /* in Game, the spare tiles go to the games holding the most waiting mistakes */
    /* the Exam never falls back to a game */
    const pl=mode==='exam'?ex:(gm.length?gm:ex), g=shuffle(pl), picks=[], n={};
    if(mode==='game') g.sort((a,b)=>dueIn(b)-dueIn(a));
    if(!g.length) return [];
    /* formats in turn — but never more tiles for a format than it has
       rounds, or the same round would come back twice in one run */
    for(let i=0;picks.length<want&&i<(want+1)*g.length;i++){ const k=g[i%g.length]; if((n[k]||0)<by[k].length){ picks.push(k); n[k]=(n[k]||0)+1; } }
    return picks;
  };
  /* seven to recognise and seven to produce — unless one side is thin: then
     it lends its spare tiles to the other. Passive has six multiple-choice
     rounds, so its Exam is six and eight, never seven with a repeat. */
  let rec=side('receptive',N/2), pro=side('productive',N-rec.length);
  if(rec.length+pro.length<N) rec=side('receptive',N-pro.length);
  let slots=rec.concat(pro);
  /* a topic with nothing on one side (Word formation has no recognising
     rounds) fills the gap from its own mode's formats: never a game in the
     Exam, never a bare exam format in Game */
  const own=have.filter(k=>mode==='exam'?exOK(k):kind(k)==='game');
  /* fill by what each format can still give: a Board set holds about twenty
     rounds, so a format may have only one or two of them — handing it more
     cells would bring the same sentence back in one run */
  if(slots.length<N){
    const cnt={}; slots.forEach(k=>cnt[k]=(cnt[k]||0)+1);
    const pl=own.length?own:have; let grew=true;
    while(slots.length<N&&grew){ grew=false;
      for(const k of shuffle(pl)){ if(slots.length>=N) break; if((cnt[k]||0)<by[k].length){ slots.push(k); cnt[k]=(cnt[k]||0)+1; grew=true; } } }
    if(slots.length<N) slots=slots.concat(fill(pl,N-slots.length));
  }
  let seq=null;
  for(let t=0;t<600&&!seq;t++){
    const c=shuffle(slots), count={}; c.forEach(x=>count[x]=(count[x]||0)+1);
    if(c.every((x,i)=>i===0||x!==c[i-1]) && c.every(x=>count[x]<=by[x].length)) seq=c;
  }
  if(!seq) seq=shuffle(slots);
  /* GAME serves due mistakes first: each list is shuffled, then the due
     rounds are moved to the end, where pop() takes them first. The EXAM
     keeps a fair random sample — a measure weighted to your mistakes would
     understate you, and one weighted away from them would flatter you. */
  const left={}; Object.keys(by).forEach(k=>{ left[k]=shuffle(by[k]); left[k].sort((a,b)=>due(a)-due(b)); });
  /* one sentence, one cell: Defuse, Forge and Choose can play the same
     rounds, so the game with the fewest to choose from picks first */
  const used=new Set(), out=new Array(seq.length);
  seq.map((k,i)=>i).sort((a,b)=>by[seq[a]].length-by[seq[b]].length).forEach(i=>{ const k=seq[i];
    let g=k, r; while((r=left[k].pop())&&used.has(r)); if(!r) r=shuffle(by[k]).find(x=>!used.has(x));
    /* nothing new left for this format (two games can share the same
       sentences): play a sentence nobody has seen yet in another format of
       the same mode, rather than repeat one */
    if(!r){ const alt=shuffle(own.length?own:have).find(kk=>by[kk].some(x=>!used.has(x)));
      if(alt){ g=alt; r=shuffle(by[alt]).find(x=>!used.has(x)); } }
    if(!r) r=by[k][0];
    used.add(r); out[i]=Object.assign({},r,{game:g,src:r.game}); });
  return out;
}
/* ══ THE TRACK — the sketch as one band, cut into cells ══
   Every cell is the same path, dashed to show only its own stretch, so the
   cells meet edge to edge like the segments in the drawing. Cross-lines are
   drawn at each join, square to the band. All fourteen cells are the same
   length and treated identically — no special START/FINISH tile. */
const PATH='M 80 26 L 80 248 Q 80 318 150 318 L 197 318 Q 267 318 267 248 L 267 124 Q 267 48 350 48 Q 434 48 434 124 L 434 336';
const W=65;                    /* the band's width in viewBox units (+20%) */
let cells=[];
function drawBoard(){
  const ns='http://www.w3.org/2000/svg';
  /* the ring's proportions scaled to the band: core diameter .7044, sage .0929, bezel .0549 */
  const D=W/.7044, SG=D*.0929, BZ=D*.0549;
  $('board').innerHTML=`<svg viewBox="22 -18 474 400" role="group" aria-label="The track"
      style="--bw:${W}px;--bw-a:${W+2*(SG+BZ)}px;--bw-b:${W+2*SG}px">
    <defs>
      <linearGradient id="bezelShade" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="360" y2="370">
        <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E4DDD1"/></linearGradient>
      <filter id="raise" x="-10%" y="-10%" width="120%" height="120%">
        <feDropShadow dx="-${(D*.0417).toFixed(1)}" dy="-${(D*.0417).toFixed(1)}" stdDeviation="${(D*.0469).toFixed(1)}" flood-color="#FFFFFF" flood-opacity=".9"/>
        <feDropShadow dx="${(D*.052).toFixed(1)}" dy="${(D*.052).toFixed(1)}" stdDeviation="${(D*.0677).toFixed(1)}" flood-color="#2B2129" flood-opacity=".16"/>
      </filter>
    </defs>
    <g id="capsB"></g><path class="bezel" d="${PATH}"/><g id="capsS"></g><path class="sage" d="${PATH}"/>
    <g id="cells"></g><g id="cuts"></g><g id="nums"></g><g id="marks"></g></svg>`;
  const svg=$('board').querySelector('svg'), probe=svg.querySelector('.sage'), L=probe.getTotalLength();
  const unit=L/N;
  let at0=0; cells=[];
  for(let i=0;i<N;i++){ const a=at0, b=at0+unit; cells.push([a,b]); at0=b; }
  const gc=$('cells'), gk=$('cuts'), gn=$('nums');
  cells.forEach(([a,b],i)=>{
    const c=document.createElementNS(ns,'path');
    c.setAttribute('d',PATH); c.setAttribute('class','cell');
    c.style.strokeDasharray=`${b-a} ${L}`; c.style.strokeDashoffset=String(-a);
    c.dataset.i=i; c.setAttribute('role','button');
    c.setAttribute('aria-label','Tile '+String(i+1).padStart(2,'0'));
    c.addEventListener('click',()=>tap(i)); c.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); tap(i); } });
    gc.appendChild(c);
    const m=probe.getPointAtLength((a+b)/2), t=document.createElementNS(ns,'text');
    t.setAttribute('x',m.x); t.setAttribute('y',m.y); t.setAttribute('class','num'); t.dataset.i=i;
    t.textContent=String(i+1).padStart(2,'0'); gn.appendChild(t);
    /* the Board's marks, placed as the Board places them: beside the number,
       tick low and cross high, turned with the band so a curve keeps them in */
    { const pa=probe.getPointAtLength(Math.max(0,(a+b)/2-1)), pb=probe.getPointAtLength(Math.min(L,(a+b)/2+1));
      let tx=pb.x-pa.x, ty=pb.y-pa.y; const tn=Math.hypot(tx,ty)||1; tx/=tn; ty/=tn;
      let nx=-ty, ny=tx; if(nx<-.01||(Math.abs(nx)<=.01&&ny<0)){ nx=-nx; ny=-ny; }
      if(ty<0||(Math.abs(ty)<.01&&tx<0)){ tx=-tx; ty=-ty; }
      const at=(s,u)=>({x:m.x+nx*s+tx*u, y:m.y+ny*s+ty*u}), S=6.2;
      const T=at(21,8), C=at(21,-9), D=at(21,0);
      const g=document.createElementNS(ns,'g'); g.dataset.i=i;
      g.innerHTML=`<path class="mk tick" d="M${T.x-S} ${T.y+.4}l${S*.72} ${S*.78}l${S*1.3} -${S*1.5}"/>`+
        `<path class="mk cross" d="M${C.x-S*.72} ${C.y-S*.72}l${S*1.44} ${S*1.44}M${C.x+S*.72} ${C.y-S*.72}l-${S*1.44} ${S*1.44}"/>`+
        `<circle class="mk dot" cx="${D.x}" cy="${D.y}" r="3.4"/>`;
      $('marks').appendChild(g); }
    if(i>0){ /* the cut at the join, square to the band */
      const p0=probe.getPointAtLength(Math.max(0,a-.5)), p1=probe.getPointAtLength(Math.min(L,a+.5));
      const dx=p1.x-p0.x, dy=p1.y-p0.y, n=Math.hypot(dx,dy)||1, nx=-dy/n*(W/2+1.5), ny=dx/n*(W/2+1.5), q=probe.getPointAtLength(a);
      const k=document.createElementNS(ns,'line'); k.setAttribute('x1',q.x-nx); k.setAttribute('y1',q.y-ny); k.setAttribute('x2',q.x+nx); k.setAttribute('y2',q.y+ny);
      k.setAttribute('class','cut'); gk.appendChild(k); }
  });
  /* the two ends of the band stay open: like a strip of film, the two rims
     run unbroken from tile 01 to tile 14 and simply stop */
  paint();
}


/* ══ 2 · THE TRACK ══ */
/* FREE ORDER: all fourteen tiles are identical and can be opened in any
   order. Tapping the first tile starts the run (timer, lives) and opens it
   in the same motion. A card closed without an answer leaves its tile to
   do, to come back to later — as on a real paper. The lives (Game) count
   across the whole run. Results appear automatically once all fourteen are
   answered — there's no separate finish tile to tap. */
let doneSet=new Set(), triesAt={}, revealed=false;
function reset(){ stop(); doneSet=new Set(); triesAt={}; revealed=false; lives=3; score=0; playing=false; log=[]; cur=null;
  practice=false; practiceAt=0; practiceRight=0; ringRun={came:0,fixed:0,half:0};
  const waiting=dueCount();
  $('clock').textContent='0:00'; $('answered').textContent='0 / '+N; $('hint').hidden=false;
  $('hint').textContent='Tap any tile to begin'+(waiting?' · '+waiting+' to fix from last time':''); $('again').hidden=true; }
/* mistakes waiting in this topic (Game only: the Exam doesn't serve them first) */
function dueCount(){ if(mode!=='game'||!window.IntuityRing) return 0; try{ return IntuityRing.count(pool.map(r=>r.id).filter(Boolean)); }catch(e){ return 0; } }
/* ONE place writes every result down: the log for the report, the Ring for
   what comes back. Called once per tile — its first answer decides it. */
function remember(r,ok){
  if(!r||!r.id) return;
  try{ if(window.IntuityRing){ const was=IntuityRing.has(r.id);
    if(ok){ IntuityRing.right(r.id); if(was){ IntuityRing.has(r.id)?ringRun.half++:ringRun.fixed++; } }
    else IntuityRing.miss(r.id,{topic:topic.id,part:r.part}); } }catch(e){}
  try{ if(window.INTUITY) INTUITY.log(topic.id, r.id, ok, {game:(BOARD?'board':'challenge')+'-'+mode}); }catch(e){}
}
function stop(){ clearInterval(tick); tick=null; }
function allDone(){ return doneSet.size>=N; }
function paint(){
  document.querySelectorAll('.cell,.num').forEach(t=>{
    const i=+t.dataset.i;
    const done=doneSet.has(i);
    const open=playing&&cur&&cur.i===i&&!$('scrim').hidden;
    t.classList.toggle('done',done&&!open); t.classList.toggle('open',open);
    if(t.classList.contains('cell')){
      const live=((playing||!log.length)&&!doneSet.has(i))||doneSet.has(i);   /* a finished tile opens again, to look back */
      t.setAttribute('tabindex',live?'0':'-1'); t.style.cursor=live?'pointer':''; } });
  /* the marks: Game shows them as you go; the Exam shows a dot for
     "answered" and keeps right and wrong for the result */
  const res={}; log.forEach(x=>{ res[x.i]=x.ok; });
  document.querySelectorAll('#marks g').forEach(g=>{
    const i=+g.dataset.i, done=doneSet.has(i)||i in res, ok=res[i], missed=(triesAt[i]||0)>0;
    const show=done;                                  /* both modes now mark each tile as it is answered */
    g.querySelector('.tick').classList.toggle('on', show&&ok===true);
    g.querySelector('.cross').classList.toggle('on', show&&(ok===false||(mode==='game'&&ok===true&&missed)));
    g.querySelector('.dot').classList.toggle('on', false); });
  $('score').textContent=score; $('answered').textContent=doneSet.size+' / '+N;
  if(practice) $('lives').innerHTML='<span class="practice">Practice</span>'; else
  $('lives').innerHTML=[0,1,2].map(i=>`<svg viewBox="0 0 24 24" class="${i<lives?'':'gone'}"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4.5 6.7 4.5c2.1 0 3.6 1.2 4.3 2.4.7-1.2 2.2-2.4 4.3-2.4 3.7 0 5.8 3.8 4.3 7.2C19.5 16.4 12 21 12 21z"/></svg>`).join('');
  if(playing) $('hint').textContent=allDone()?'All done':(doneSet.size?'Pick any tile, in any order · tap a finished one to look again':'Pick any tile, in any order');
}
function begin(){ reset(); plan=draw(); playing=true;
  try{ if(window.IntuityRing) ringRun.came=plan.filter(r=>r.id&&IntuityRing.isDue(r.id)).length; }catch(e){}
  t0=performance.now(); $('hint').hidden=false;
  tick=setInterval(()=>{ const s=Math.floor((performance.now()-t0)/1000); $('clock').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); },500);
  paint(); }
function tap(i){
  if(doneSet.has(i)) return lookAgain(i);
  if(!playing&&log.length) return;   /* a run just finished — wait for Start/Try again */
  if(!playing) begin();
  openCell(i); }

/* LOOK AGAIN. Any finished tile opens again, at any time — during the run
   or after it, in both modes. Checking and looking again is part of
   learning, so the card shows the question, what the learner gave, the
   answer, why, and whether it is still waiting in the Ring. Nothing can be
   changed: the first answer is the one that counted. */
function qText(r){ const t=r.prompt||r.sentence||r.passive||r.line||(r.words?'Put the words in order.':'');
  return esc(String(t)).replace('___','<span class="cg-blank">&nbsp;</span>'); }
function lookAgain(i){
  const e=log.slice().reverse().find(x=>x.i===i); if(!e) return;
  const r=e.r, g=e.g, missed=(triesAt[i]||0)>0;
  let sol=''; try{ sol=String(g.solution(r)||''); }catch(e2){}
  const head=e.ok&&!missed?'Right first time':e.ok?'Right, after a mistake':'Missed';
  const waiting=(()=>{ try{ return r.id&&window.IntuityRing&&IntuityRing.has(r.id); }catch(x){ return false; } })();
  cur=null;
  openCard(`<div class="kick">Tile ${String(i+1).padStart(2,'0')} · Look again</div><h2 id="fTitle">${esc(g.title)}</h2>
    <p class="cg-line">${qText(r)}</p>
    <p class="look ${e.ok?'ok':'no'}"><b>${head}</b>${!e.ok&&e.given&&e.given!=='(shown)'?` · you wrote <i>${esc(e.given)}</i>`:''}</p>
    <p class="feedback">The answer: <b>${esc(sol)}</b>${r.tag?' · '+esc(r.tag):''}. ${esc(r.note||'')}</p>
    ${waiting?'<p class="ring-line">Still to fix — it will come back first next time.</p>':''}
    <div class="cta"><button class="btn fill" type="button" id="lookClose">Back to the track</button></div>`);
  $('lookClose').onclick=closeCard;
}

/* ══ THE FOCUS CARD — the page runs the rules; the game draws the round ══ */
let cur=null, settled=false;
function openCard(html){ $('focus').innerHTML='<button class="x" type="button" aria-label="Close" id="fx">✕</button>'+html;
  const s=$('scrim'); s.hidden=false; requestAnimationFrame(()=>s.classList.add('on')); $('fx').onclick=closeCard; }
function closeCard(){ clearTimeout(autoT); if(autoOff) autoOff(); const s=$('scrim'); s.classList.remove('on'); setTimeout(()=>{ s.hidden=true; paint();
  if(owed){ const o=owed; owed=null; requestAnimationFrame(()=>burst(o.i,o.first)); } },250); }
function openCell(i){
  const r=plan[i], g=G[r.game]; cur={i,r,g}; settled=false; tries=triesAt[i]||0;
  /* the round's tag (a tense, an area) would give the answer away — it is
     shown only after answering, in the feedback and in the Exam review */
  /* …but the TOPIC is not a secret: every card says what is being
     practised, and in one plain line what that means — a learner who chose
     the tab by accident, or came back after a break, still knows the aim */
  openCard(`<div class="kick">${esc(topic.label)} · Tile ${String(i+1).padStart(2,'0')} of ${N}</div><h2 id="fTitle">${esc(g.title)}</h2>${mode==='exam'&&CAMBRIDGE[r.game]?`<div class="partno">Use of English · ${CAMBRIDGE[r.game]}</div>`:''}
    ${topic.focus?`<p class="aim">${esc(topic.focus)}</p>`:''}<div id="host"></div><p class="feedback" id="fb" aria-live="polite"></p><div class="cta" id="next" hidden><button class="btn fill" type="button" id="nextBtn">Continue</button></div>`);
  /* exam:false even in the Challenge: every answer is shown straight away now,
     so the formats draw right and wrong as they do in Game. ONE attempt is
     still the rule — answer() settles the tile on the first answer — so the
     percentage measures exactly what it did before. */
  g.render($('host'), r, {exam:false, esc, shuffle, answer, nudge});
  paint();
}
/* RIGHT, BUT NOT THIS ONE. Some rounds list alsoRight: answers that are
   correct English but not the structure the topic practises ("If I were
   you" on an Inversion card). In Game those get a nudge, not a lost life.
   The Exam gives no feedback, so it marks them as it marks any other
   answer; the focus line on the card is what tells the learner the aim. */
function nudge(note){
  if(settled||mode==='exam') return false;
  $('fb').innerHTML='<b>That’s correct English</b> — but not the one we’re after. '+esc(note||('Try it again with '+topic.label.toLowerCase()+'.'));
  return true;
}
function answer(ok,given){
  if(settled) return false;
  const fb=$('fb');
  if(mode==='exam'){                                   /* one attempt — and the answer straight after */
    settled=true; log.push({i:cur.i,r:cur.r,g:cur.g,ok,given}); doneSet.add(cur.i); remember(cur.r,ok); paint();
    let sol=''; try{ sol=String(cur.g.solution(cur.r)||''); }catch(e){}
    const tag=cur.r.tag?' · '+esc(cur.r.tag):'';
    fb.innerHTML=ok?'<b>Right'+tag+'.</b> '+esc(cur.r.note||'')
                   :'<b>Not this time'+tag+'.</b> The answer: <b>'+esc(sol)+'</b>. '+esc(cur.r.note||'');
    const last=doneSet.size>=N; showNext(last?()=>finish(true):()=>{ closeCard(); }, last?'See your result':undefined, ok?1100:3200); return false;
  }
  if(ok){
    celebrate(cur.i, !tries);
    settled=true; const pts=practice?0:tries?50:100; score+=pts; if(practice) practiceRight++; log.push({i:cur.i,r:cur.r,g:cur.g,ok:true,given}); doneSet.add(cur.i);
    if(!tries) remember(cur.r,true);
    fb.innerHTML='<b>Right'+(pts?' · +'+pts:'')+(cur.r.tag?' · '+esc(cur.r.tag):'')+'.</b> '+esc(cur.r.note||'');
    const last=doneSet.size>=N; showNext(last?()=>finish(true):()=>{ closeCard(); }, last?'See your result':undefined, tries?1800:1100); return false;
  }
  if(!tries) remember(cur.r,false);                   /* the tile's first slip is what's remembered */
  tries++; triesAt[cur.i]=tries;
  /* PRACTICE: no lives to lose, so another try costs nothing — the mistake is already in the Ring */
  /* THE HINT LADDER — a student's idea, from the first classroom test. In
     practice, a typed answer that keeps missing gets the smallest clue that
     still leaves the work to the learner: the first letter after three
     tries, one more letter each try after that, and after five a "Show me".
     Never in the Challenge, which stays a clean measure. A hinted answer is
     never "fixed": the mistake was remembered at the first slip, and a
     right answer after a slip doesn't promote it, so it comes back tomorrow. */
  if(practice){ paint(); fb.innerHTML='Not quite — try again.'+ladder(); 
    const sm=$('showMe'); if(sm) sm.onclick=showMe; return true; }
  lives--; paint();
  /* NO DEAD END. Running out of lives used to end the run — and on a Board,
     the learner who most needs the topic was the first one sent away. Now
     the tile is settled with its answer shown, and the run carries on as
     practice: no more points, every tile still played and remembered. */
  if(lives<=0){ settled=true; practice=true; practiceAt=doneSet.size; log.push({i:cur.i,r:cur.r,g:cur.g,ok:false,given}); doneSet.add(cur.i); paint();
    fb.innerHTML='<b>No lives left'+(cur.r.tag?' · '+esc(cur.r.tag):'')+'.</b> '+esc(cur.r.note||'')+
      '<br><br>The rest of the run is practice: no more points, but every tile still counts towards fixing your mistakes.';
    const last=doneSet.size>=N; showNext(last?()=>finish(true):()=>{ closeCard(); }, last?'See your result':'Carry on', 5000); return false; }
  fb.innerHTML='Not quite — <b>'+lives+'</b> '+(lives===1?'life':'lives')+' left. Try again.'; return true;
}
/* ══ CELEBRATION (Game only) ══
   A right answer is heard at once, in the card: the struck bowl the other
   INTUITY games use, or the drier two-note pop when it took a second try.
   The glitter waits for the card to close and bursts from the tile's new
   tick on the track, so nothing ever covers the sentence or its note.
   Sound follows the device-wide mute; the glitter follows reduced motion. */
let owed=null;
const sfx=name=>{ try{ if(window.SFX&&SFX.isOn()&&SFX[name]) SFX[name](); }catch(e){} };
function celebrate(i,first){ if(mode!=='game') return; sfx(first?'correct':'pop'); owed={i,first}; }
function burst(i,first){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const tk=document.querySelector(`#marks g[data-i="${i}"] .tick`); if(!tk) return;
  tk.classList.remove('pop'); void tk.getBoundingClientRect(); tk.classList.add('pop');
  const b=tk.getBoundingClientRect(), g=document.createElement('div'); g.className='glitter';
  g.style.left=(b.left+b.width/2)+'px'; g.style.top=(b.top+b.height/2)+'px';
  const cols=['#C2956E','var(--ring-ink)','var(--mark-right)','#F6F1E6','#E9C98F'], n=first?16:9;
  for(let k=0;k<n;k++){ const a=Math.PI*2*k/n+Math.random()*.5, d=(first?30:20)+Math.random()*(first?26:14), s=2.5+Math.random()*(first?4:3);
    const e=document.createElement('i');
    e.style.cssText=`--x:${(Math.cos(a)*d).toFixed(1)}px;--y:${(Math.sin(a)*d-6).toFixed(1)}px;--s:${s.toFixed(1)}px;`+
      `--c:${cols[k%cols.length]};--r:${k%3?'1px':'50%'};--rot:${Math.round(Math.random()*240-120)}deg;--d:${650+Math.round(Math.random()*250)}ms;--w:${Math.round(Math.random()*70)}ms`;
    g.appendChild(e); }
  document.body.appendChild(g); setTimeout(()=>g.remove(),1100);
}
/* NO "CONTINUE" BUTTON. A student who has just answered knows what comes
   next; asking for one more tap per tile was a tax on every question. The
   card now closes by itself — quickly after a right answer, slower after a
   wrong one, so the answer and its reason are actually read — and a thin
   line runs down to show it is about to go. Any tap or Enter skips the
   wait. (Choosing the next tile on the track stays the student's move:
   that IS the game.) */
let autoT=null, autoOff=null;
function showNext(fn,label,ms){
  clearTimeout(autoT); if(autoOff) autoOff();
  ms=ms||1100;
  const n=$('next'); n.hidden=false; n.innerHTML='<span class="auto" style="--ms:'+ms+'ms" aria-hidden="true"></span>';
  const done=()=>{ clearTimeout(autoT); if(autoOff) autoOff(); fn(); };
  const tap=e=>{ if(e.target.closest&&e.target.closest('#fx')) return; done(); };
  const key=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); done(); } };
  /* the listeners wait a moment, so the tap that answered doesn't also skip */
  const arm=setTimeout(()=>{ document.addEventListener('pointerdown',tap,true); document.addEventListener('keydown',key,true); },300);
  autoOff=()=>{ clearTimeout(arm); document.removeEventListener('pointerdown',tap,true); document.removeEventListener('keydown',key,true); autoOff=null; };
  autoT=setTimeout(done,ms);
}

/* ══ 3 · THE RESULT ══ */
function ladder(){
  if(!TYPED[cur.r.game]||tries<3) return '';
  let sol=''; try{ sol=String(cur.g.solution(cur.r)||''); }catch(e){}
  if(!sol) return '';
  const n=Math.min(tries-2,Math.max(1,sol.length-1));
  return ' It starts with <b>“'+esc(sol.slice(0,n))+'…”</b>'+(tries>=5?' <button class="btn" type="button" id="showMe">Show me</button>':'');
}
function showMe(){
  if(settled) return; settled=true;
  let sol=''; try{ sol=String(cur.g.solution(cur.r)||''); }catch(e){}
  log.push({i:cur.i,r:cur.r,g:cur.g,ok:false,given:'(shown)'}); doneSet.add(cur.i);
  const h=$('host'); h.dataset.locked='1'; h.querySelectorAll('input,button').forEach(x=>x.disabled=true);
  paint(); $('fb').innerHTML='<b>The answer: '+esc(sol)+'</b>'+(cur.r.tag?' · '+esc(cur.r.tag):'')+'. '+esc(cur.r.note||'')+' It will come back, so you can get it on your own.';
  const last=doneSet.size>=N; showNext(last?()=>finish(true):()=>{ closeCard(); }, last?'See your result':'Carry on');
}
/* what this run did to the learner's mistakes, in one plain line */
function ringLine(){
  const waiting=(()=>{ try{ return window.IntuityRing?pool.filter(r=>r.id&&IntuityRing.has(r.id)).length:0; }catch(e){ return 0; } })();
  const bits=[];
  if(ringRun.came) bits.push(`<b>${ringRun.came}</b> ${ringRun.came===1?'tile was a mistake':'tiles were mistakes'} from before`);
  if(ringRun.fixed) bits.push(`<b>${ringRun.fixed}</b> fixed for good`);
  if(ringRun.half) bits.push(`<b>${ringRun.half}</b> right today — ${ringRun.half===1?'it comes':'they come'} back tomorrow to make sure`);
  const head=bits.length?bits.join(' · ')+'. ':'';
  return `<p class="ring-line">${head}${waiting?`Still to fix in ${esc(topic.label)}: <b>${waiting}</b>.`:'Nothing left to fix in '+esc(topic.label)+'.'}</p>`;
}
/* ══ BOARD SETS ══════════════════════════════════════════════════════════
   Students asked for Set 1, Set 2, Set 3: somewhere to finish and move on.
   A topic's rounds are dealt into sets of about twenty, round-robin by game
   type in file order, so every set has the same mix of formats and Set 2 is
   always the same sentences on every device. A run on a set draws its
   fourteen cells from that set only; Mix plays the whole topic, as the
   Board always did. A finished set earns a tick, a clean run (or 100% in
   the Challenge) a star, kept on this device. */
let FULL=[], SETS=[], SETK=0;
const SKEY=()=>'intuity.board.sets.'+(topic&&topic.id);
const sDone=()=>{ try{ return JSON.parse(localStorage.getItem(SKEY())||'{}')||{}; }catch(e){ return {}; } };
function makeSets(){
  FULL=pool.slice(); SETS=[];
  const K=Math.max(2,Math.min(8,Math.round(FULL.length/20)));
  for(let k=0;k<K;k++) SETS.push([]);
  const by={}; FULL.forEach(r=>(by[r.game]=by[r.game]||[]).push(r));
  let j=0; Object.keys(by).sort().forEach(g=>by[g].forEach(r=>{ SETS[j%K].push(r); j++; }));
  const d=sDone(); const next=SETS.findIndex((s,i)=>!d[i+1]);
  SETK=next<0?1:next+1;                       /* open on the first set not yet finished */
  usePool(); drawSets();
}
function usePool(){
  if(!SETK){ pool=FULL; return; }
  const p=SETS[SETK-1].slice();
  /* the Challenge plays only the Cambridge formats, and a set of twenty
     holds seven or eight of them: it borrows exam rounds from the next sets,
     in order, so fourteen cells are fourteen different questions */
  if(mode==='exam'){
    const isEx=r=>G[r.game]&&(G[r.game].kind||'exam')==='exam'&&(r.game in CAMBRIDGE);
    let n=p.filter(isEx).length;
    for(let j=1;j<SETS.length&&n<20;j++) SETS[(SETK-1+j)%SETS.length].forEach(r=>{ if(n<20&&isEx(r)){ p.push(r); n++; } });
  }
  pool=p;
}
function drawSets(){
  const el=$('boardSets'); if(!el||!SETS.length) return; el.hidden=false; el.classList.remove('hidden');
  const d=sDone();
  el.innerHTML=SETS.map((s,i)=>`<button type="button" role="tab" class="vtab${SETK===i+1?' active':''}" aria-selected="${SETK===i+1}" data-k="${i+1}">Set ${i+1}${d[i+1]?`<span class="pct">${d[i+1]==='cup'?'★':'✓'}</span>`:''}</button>`).join('')
    +`<button type="button" role="tab" class="vtab${SETK===0?' active':''}" aria-selected="${SETK===0}" data-k="0" title="Every round in the topic, at random">Mix</button>`;
  el.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{ const k=+b.dataset.k; if(k===SETK) return; SETK=k; usePool(); drawSets(); reset(); paint(); });
}
function markSet(v){
  if(!BOARD||!SETK) return;
  const d=sDone(); if(d[SETK]!=='cup') d[SETK]=v;
  try{ localStorage.setItem(SKEY(),JSON.stringify(d)); }catch(e){}
  drawSets();
}
function finish(won){
  playing=false; stop(); cur=null; revealed=true; paint(); $('hint').hidden=true; $('again').hidden=false;
  const t=$('clock').textContent;
  if(mode==='exam'){
    const right=log.filter(x=>x.ok).length, pct=Math.round(right/N*100);
    markSet(pct===100?'cup':'done');
    /* not Cambridge's grade names: those come from a full exam on the Cambridge
       English Scale, and fourteen cells can't award them. A learner told
       "Grade A" by an exam tool believes it. These say how close you are. */
    const grade=pct>=90?'Exam-ready':pct>=75?'Nearly there':pct>=60?'Getting there':'Not yet — keep practising';
    openCard(`<div class="kick">${esc(topic.label)} · Challenge</div><h2 id="fTitle">Your result</h2>
      <div class="big">${pct}%</div><div class="grade">${grade} · ${right} of ${N} right · ${t}</div>
      <ul class="review">${log.slice().sort((a,b)=>a.i-b.i).map(x=>`<li><div class="rh"><span>Cell ${String(x.i+1).padStart(2,'0')} · ${esc(x.g.title)}${x.r.tag&&x.r.tag!==x.g.title?' · '+esc(x.r.tag):''}</span><span class="${x.ok?'ok':'no'}">${x.ok?'Right':'Wrong'}</span></div>
        ${x.ok?'':`Your answer: ${esc(x.given)}<br>`}<b>${esc(x.g.solution(x.r))}</b>${x.r.note?' — '+esc(x.r.note):''}</li>`).join('')}</ul>
      ${ringLine()}<div class="cta"><button class="btn fill" type="button" id="rAgain">Try again</button></div>`);
  }else{
    const clean=won&&log.length===N&&log.every(x=>x.ok)&&!Object.values(triesAt).some(v=>v>0);
    if(won) markSet(clean?'cup':'done');
    owed=null; sfx(clean?'fanfare':won?'bowlLow':'');
    const CUP=`<svg class="cup" viewBox="0 0 92 92" aria-hidden="true"><circle cx="46" cy="46" r="43" fill="var(--ring-core)"/><circle class="rim" cx="46" cy="46" r="40"/>
      <path d="M31 27h30v9c0 9-6.5 16-15 16s-15-7-15-16z M31 31h-7c0 8 4 12 9 12 M61 31h7c0 8-4 12-9 12 M46 52v9 M36 66h20" fill="none" stroke="#E9C98F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    const said=practice?`All ${N} tiles in <b>${t}</b>: <b>${practiceAt+1}</b> played for points, ${N-practiceAt-1} as practice${practiceRight?` — and <b>${practiceRight}</b> of those right`:''}.`
      :clean?`All ${N} right first time, in <b>${t}</b>.`:`All ${N} games in <b>${t}</b>, with <b>${lives}</b> ${lives===1?'life':'lives'} to spare.`;
    openCard(`<div class="kick">${clean?'A clean run':practice?'Challenge complete · with practice':'Challenge complete'}</div>${clean?CUP:''}<h2 id="fTitle">${clean?'The cup.':'Finish.'}</h2>
      <div class="big">${score}</div><p class="cg-prompt">${said}</p>${ringLine()}
      <div class="cta"><button class="btn fill" type="button" id="rAgain">Try again</button></div>`);
  }
  $('rAgain').onclick=()=>{ closeCard(); reset(); paint(); };
}
$('again').onclick=()=>{ reset(); paint(); };
$('scrim').addEventListener('click',e=>{ if(e.target.id==='scrim') closeCard(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && !$('scrim').hidden) closeCard(); });

/* ══ BOARD — the Challenge for one topic, opened from that topic's page ══
   ?board=1&topic=inversion. Same engine, same rounds, same games, cards,
   marks and celebration — only the frame changes: the header shows the
   topic page's own mode row with Board lit, Game · Exam moves down to a
   small switch where the topic tabs were, and the page calls itself The
   Board. The row is read from the topic page itself, so a page that gains
   or loses a mode never falls out of step with its Board. */
const BOARD=P.get('board')==='1'&&!!P.get('topic');
/* each topic's own page: the Board copies its mode row AND its level from
   there, so the two can never disagree (Past Modals is B2–C1 on its page,
   and now on its Board). Vocabulary topics are here too — before, only
   grammar was, so a vocabulary Board never got its topic's row. */
const RULES_PAGE={passive:'grammar-rules/passive-voice-rules',tenses:'grammar-rules/tenses-rules',conditionals:'grammar-rules/conditionals-rules',
  'past-modals':'grammar-rules/past-modals-rules',comparatives:'grammar-rules/comparatives-rules',reported:'grammar-rules/reported-speech-rules',
  linking:'grammar-rules/linking-words-rules',inversion:'grammar-rules/inversion-rules',gerunds:'grammar-rules/gerunds-infinitives-rules',
  misc:'grammar-rules/miscellaneous-rules',
  'similar-words':'similar-words/vocabulary','topic-vocabulary':'similar-words/topic-vocabulary','collocations':'similar-words/collocations',
  descriptive:'similar-words/collective-expressions-master',academic:'similar-words/academic-vocabulary',
  'phrasal-verbs':'grammar-rules/phrasal-verbs-quiz','word-formation':'use-of-english/word-formation/word-families'};
if(BOARD){
  document.body.classList.add('board-page');
  document.querySelectorAll('h1.title').forEach(x=>x.textContent='The Board');
  const tabs=$('topicTabs'); tabs.removeAttribute('role'); tabs.className='board-toggle';
  tabs.innerHTML='<div class="viewtog" role="group" aria-label="How to play"><button class="viewbtn" type="button" data-mode="game">Game</button><button class="viewbtn" type="button" data-mode="exam">Challenge</button></div>';
  $('modeRow').setAttribute('aria-label','Topic modes'); $('modeRow').innerHTML='<span class="mode-btn active" aria-current="page">Board</span>';
  wireModes();
}
async function boardHeader(t){
  const page=RULES_PAGE[t.id]; if(!page) return;
  const url='/skills/'+page;
  document.querySelector('.app-subtitle').textContent=t.label+' · Board';
  document.title='INTUITY — '+t.label+' · Board';
  try{
    const html=await (await fetch(url+'.html',{cache:'no-store'})).text();
    const doc=new DOMParser().parseFromString(html,'text/html');
    const lv=(html.match(/Level\s*<b>([^<]+)<\/b>/i)||[])[1], mine=document.querySelector('.header-spacer b');
    if(lv&&mine) mine.textContent=lv.trim();                       /* the topic page's own level */
    const back=doc.querySelector('.back-link'), mineBack=document.querySelector('.back-link');   /* Word formation lives under Use of English */
    if(back&&mineBack&&/openModal=/.test(back.getAttribute('href')||'')){ mineBack.textContent=back.textContent.trim(); mineBack.setAttribute('href',back.getAttribute('href')); }
    const row=doc.querySelector('.mode-selector'); if(!row) return;
    let placed=false; const out=[];
    [...row.children].forEach(el=>{
      /* the label without its count badge; a button may leave by data-href */
      const label=[...el.childNodes].filter(n=>!(n.classList&&n.classList.contains('mode-badge'))).map(n=>n.textContent).join('').trim(),
            m=el.dataset&&el.dataset.mode, href=el.getAttribute&&(el.getAttribute('href')||el.getAttribute('data-href'));
      if(/^(forge|board)$/i.test(label)&&!m||/challenge\.html/.test(href||'')){          /* Forge's place — or a Board link — is ours */
        if(!placed){ out.push('<span class="mode-btn active" aria-current="page">Board</span>'); placed=true; } return; }
      if(el.classList.contains('mode-soon')) return;
      const go=m?(url+'?mode='+m):href?new URL(href,location.origin+url).pathname+new URL(href,location.origin+url).search:url;
      if(go) out.push(`<a class="mode-btn" href="${esc(go)}">${esc(label)}</a>`);
    });
    if(!placed) out.push('<span class="mode-btn active" aria-current="page">Board</span>');
    $('modeRow').innerHTML=out.join('');
  }catch(e){}
}
document.querySelector('.header').addEventListener('click', e => {
  const a = e.target.closest('a[href]');
  if (!a || e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
  const href = a.getAttribute('href');
  if (!href || href.startsWith('#')) return;
  e.preventDefault();
  location.replace(a.href);
});

/* ← goes back to the submenu this page was opened from */
(function(){
  const b=document.querySelector('.back-link'); if(!b) return;
  b.textContent='← '+(SECTION==='vocabulary'?'Vocabulary':'Grammar');
  b.setAttribute('href','/index.html?openModal='+SECTION);
})();

/* ══ LOAD ══ */
drawModes();
fetch(BASE+'challenge-topics.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{
  TOPICS=d; drawTopics(); drawModes();
  const want=P.get('topic'); if(want) choose(want);      /* a teacher's link: ?topic=passive&mode=exam */
  if(BOARD){ const t=d.sections.flatMap(x=>x.topics).find(x=>x.id===want); if(t) boardHeader(t); }
}).catch(()=>{ $('pick').textContent='The topics didn’t load — reload to try again'; });
})();
</script>
