<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F3F1ED">
<title>INTUITY — The Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500;700&family=Anton&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=12">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   THE CHALLENGE — a winding track, one game per tile

   The track is the sketch: down, round, up, over and down, from START to
   FINISH. Drawn flat: a hairline pipe on the paper card, square tiles with
   iOS corners inside it. Tiles open in order — the next one pulses — and
   each opens a FOCUS CARD (the 560px layer) holding a different game:
   choose, fill the gap, put it in order, odd one out, sort. Three lives
   give it tension; the score and the clock give it something to beat.
   Reach FINISH to win. The rounds come from a data list, so any topic mix
   can be a challenge.
   ═══════════════════════════════════════════════════════════════════════ */
:root{ --caramel:#B0865C; --accent:#DD8E58; --accent-ink:#9A5A2C; --good:#1F7A4A; --bad:#C4402F; }
[hidden]{display:none!important}
.header{position:sticky;top:0;z-index:20;background:var(--bg,var(--screen,#F3F1ED))}
.wrap{max-width:45.6rem;margin:0 auto;padding:1rem var(--gutter,1rem) 3rem}
.card{background:var(--card,#FAF8F5);border:1px solid var(--rule);box-shadow:0 12px 28px -18px rgba(35,44,49,.35);padding:1.5rem 1.4rem 1.4rem}

/* the top of the card: kicker, headline, the three things to watch */
.kick{display:flex;align-items:center;gap:9px;font-family:var(--f-mono);font-size:.58rem;letter-spacing:.24em;text-transform:uppercase;color:var(--accent-ink)}
.kick::before{content:'';display:block;width:26px;height:10px;flex:none;background:var(--caramel)}
.title{font-family:var(--f-display);font-weight:800;font-size:clamp(1.3rem,4.4vw,1.9rem);letter-spacing:.34em;text-transform:uppercase;line-height:1.1;color:var(--deco-ink,#1E1B18);
  margin:.6rem 0 .8rem;padding-bottom:.7rem;border-bottom:3px double var(--deco-ink,#1E1B18)}
.meters{display:flex;align-items:center;gap:1.3rem;flex-wrap:wrap;font-family:var(--f-mono);font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.meters b{font-family:var(--f-display);font-size:1.05rem;font-weight:900;letter-spacing:0;color:var(--ink);font-variant-numeric:tabular-nums;margin-left:.3rem}
.lives{display:flex;gap:4px;margin-left:.35rem}
.lives svg{width:15px;height:15px;fill:var(--bad);transition:fill .3s,transform .3s}
.lives svg.gone{fill:var(--rule);transform:scale(.8)}

/* ── THE TRACK · 1930s minimal ──────────────────────────────────────
   The sketch: the track IS the tiles — one band, cut into cells by straight
   cross-lines. Drawn in the Deco manner: a double-rule border (a heavy line
   and a hairline), cream paper, near-black ink, ochre for the cells won and
   one vermilion for FINISH. Flat fills, square cuts, no shadow, no pulse:
   the next cell is simply filled black. */
:root{ --deco-ink:#1E1B18; --deco-paper:#F6F1E6; --deco-ochre:#B0865C; --deco-red:#C4553A;
  /* the pendulum ring, unrolled: its sage rim, its dark core, its cream numerals */
  --ring-sage:#8AA79C; --ring-core:#201E1C; --ring-ink:#E5D1B8; }
.board{margin:1.1rem 0 .2rem}
.board svg{display:block;width:100%;height:auto;max-height:62vh;overflow:visible}
/* the ring in index.html, unrolled — the same three layers, the same proportions:
   a raised bezel shaded #FFFFFF → #E4DDD1 at 145° (white light top-left, soft
   shadow bottom-right), the sage band #8AA79C, and the dark core. */
.bezel{fill:none;stroke:url(#bezelShade);stroke-width:var(--bw-a);stroke-linejoin:round;filter:url(#raise)}
.sage{fill:none;stroke:var(--ring-sage);stroke-width:var(--bw-b);stroke-linejoin:round}
.cap-bezel{stroke:url(#bezelShade)}
.cap-sage{stroke:var(--ring-sage)}
.cell{fill:none;stroke:var(--ring-core);stroke-width:var(--bw);stroke-linejoin:miter;cursor:default;transition:stroke .35s}
.cell.end{stroke:var(--ring-core)}
.cell.done,.cell.end.done{stroke:var(--deco-ochre)}
.cell.open{stroke:var(--ring-ink);cursor:pointer}
.cell.end.open{stroke:var(--deco-red)}
.cut{stroke:var(--ring-sage);stroke-width:1.8}

.num{font-family:'Anton',Impact,var(--f-display),sans-serif;font-weight:400;font-size:23.4px;letter-spacing:.02em;fill:var(--ring-ink);text-anchor:middle;dominant-baseline:central;pointer-events:none;transition:fill .35s}
.num.end{font-size:23.4px}
/* START and FINISH keep a small caption under their numeral */
.cap-txt{font-family:var(--f-mono);font-size:7px;letter-spacing:.34em;font-weight:700;fill:var(--ring-ink);text-anchor:middle;dominant-baseline:central;pointer-events:none;transition:fill .35s}
.cap-txt.done,.cap-txt.open{fill:var(--deco-paper)}
.num.done{fill:var(--deco-paper)}
.num.open{fill:var(--ring-core)}
.num.end.open{fill:var(--deco-paper)}
/* each cell is the whole path, dashed — so the browser's own focus box would
   frame the entire track. The focus mark is the cell's own colour instead. */
.cell:focus,.cell:focus-visible{outline:none}
.cell.open:focus-visible{stroke:#3A342E}
.legend{display:flex;justify-content:center;gap:1.4rem;flex-wrap:wrap;margin-top:1rem;font-family:var(--f-mono);font-size:.54rem;letter-spacing:.22em;text-transform:uppercase;color:var(--faint)}
.legend i{display:inline-block;width:10px;height:10px;margin-right:.45rem;vertical-align:-1px;border:2px solid var(--ring-sage);background:var(--ring-core)}
.legend i.o{background:var(--ring-ink)} .legend i.d{background:var(--deco-ochre)}
.cta{display:flex;justify-content:center;gap:.6rem;margin-top:1.2rem}
.btn{font-family:var(--f-mono);font-size:.62rem;font-weight:700;letter-spacing:.26em;text-transform:uppercase;padding:.8rem 1.5rem;border-radius:0;cursor:pointer;border:1.5px solid var(--ink);background:none;color:var(--ink)}
.btn.fill{background:var(--deco-ink,#1E1B18);border-color:var(--deco-ink,#1E1B18);color:var(--deco-paper,#F6F1E6)}
.btn:disabled{opacity:.35;cursor:default}

/* ── THE FOCUS CARD ── */
.scrim{position:fixed;inset:0;z-index:900;display:flex;align-items:center;justify-content:center;padding:1rem;
  background:rgba(20,17,14,.34);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;transition:opacity .25s}
.scrim.on{opacity:1}
.focus{position:relative;width:min(var(--w-focus,35rem),100%);max-height:88vh;overflow-y:auto;background:var(--card,#FAF8F5);
  box-shadow:0 24px 60px -18px rgba(20,17,14,.38),0 6px 16px rgba(20,17,14,.14);padding:1.7rem 1.5rem 1.4rem;
  transform:translateY(24px) scale(.97);transition:transform .45s cubic-bezier(.2,1.3,.4,1)}
.scrim.on .focus{transform:none}
.focus .x{position:absolute;top:.8rem;right:.9rem;border:none;background:none;font-size:1rem;color:var(--faint);cursor:pointer;padding:.4rem}
.focus h2{font-family:'Anton',Impact,var(--f-display),sans-serif;font-weight:400;font-size:clamp(1.7rem,6vw,2.2rem);line-height:1.02;color:var(--ink);margin:.45rem 0 .2rem}
.focus h2::after{content:'';display:block;width:40px;height:3px;background:var(--ink);margin:.7rem 0 0}
.prompt{font-size:.98rem;line-height:1.55;color:var(--sentence);margin:1rem 0 .9rem}
.prompt b{color:var(--ink)}
.gapline{font-family:var(--f-display);font-weight:700;font-size:1.15rem;line-height:1.5;color:var(--ink);margin:.2rem 0 1rem}
.blank{display:inline-block;min-width:5.5em;border-bottom:2px solid var(--ink);text-align:center;color:var(--accent-ink)}
.opts{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.opt{display:flex;align-items:center;gap:.8rem;text-align:left;padding:.85rem .2rem;border:none;border-bottom:1px solid var(--rule);background:none;
  font:inherit;font-size:.98rem;color:var(--ink);cursor:pointer;transition:background .2s}
.opt .l{flex:none;width:24px;height:24px;border-radius:50%;background:rgba(20,17,14,.07);display:grid;place-items:center;font-family:var(--f-mono);font-size:.66rem;color:var(--faint)}
.opt.ok{background:#DCEFE2;color:#1B4A31} .opt.ok .l{background:var(--good);color:#fff}
.opt.no{background:#F6DDD7;color:#6E2416} .opt.no .l{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.field{display:flex;gap:.5rem}
.field input{flex:1;font:inherit;font-size:1rem;padding:.7rem .8rem;border:1px solid var(--rule);background:#fff;color:var(--ink);border-radius:var(--r-field,6px)}
.field input:focus{outline:2px solid var(--accent);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;min-height:2.6rem}
.chip{font:inherit;font-size:.95rem;padding:.5rem .8rem;border-radius:999px;border:1px solid var(--rule);background:#fff;color:var(--ink);cursor:pointer}
.chip.used{visibility:hidden}
.built{min-height:2.8rem;padding:.55rem 0;margin:0 0 .7rem;border-bottom:2px solid var(--ink);display:flex;flex-wrap:wrap;gap:.35rem}
.built .chip{background:var(--tile-bg);border-color:transparent}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-top:.8rem}
.bin{border:1px dashed var(--rule);padding:.6rem;min-height:5.5rem}
.bin h4{font-family:var(--f-mono);font-size:.56rem;font-weight:400;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:0 0 .4rem}
.bin .chip{font-size:.85rem;padding:.35rem .65rem;margin:0 .25rem .3rem 0}
.bin.ready{border-color:var(--accent);cursor:pointer}
.chip.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.chip.ok{background:#DCEFE2;border-color:transparent} .chip.no{background:#F6DDD7;border-color:transparent}
.feedback{min-height:1.4em;margin:.9rem 0 0;font-size:.92rem;line-height:1.5;color:var(--sentence)}
.feedback b{color:var(--ink)}
.focus .cta{justify-content:flex-start;margin-top:1rem}
.shake{animation:shake .42s cubic-bezier(.2,.9,.3,1)}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}45%{transform:translateX(7px)}70%{transform:translateX(-3px)}}
.big{font-family:'Anton',Impact,var(--f-display),sans-serif;font-size:3.2rem;line-height:1;color:var(--ink);margin:.8rem 0 .2rem}
@media(prefers-reduced-motion:reduce){ .scrim,.focus,.cell,.num{transition:none} }
</style>
</head>
<body>

<header class="header">
  <div class="header-top">
    <a class="back-link" href="/index.html" target="_top">← Home</a>
    <div class="header-title"><div class="app-title">INTUITY</div><div class="app-subtitle">The Challenge</div></div>
    <span class="header-spacer">Level <b>B2</b></span>
  </div>
  <nav class="mode-selector" aria-label="Modes">
    <span class="mode-btn active" aria-current="page">Challenge</span>
  </nav>
</header>

<main class="wrap">
  <article class="card">
    <div class="kick">Twelve games · one track</div>
    <h1 class="title">The Challenge</h1>
    <div class="meters">
      <span>Score<b id="score">0</b></span>
      <span>Time<b id="clock">0:00</b></span>
      <span style="display:flex;align-items:center">Lives<span class="lives" id="lives"></span></span>
    </div>
    <div class="board" id="board"></div>
    <div class="legend"><span><i class="o"></i>Next</span><span><i class="d"></i>Won</span><span><i></i>Locked</span></div>
    <div class="cta"><button class="btn fill" id="go" type="button">Start</button><button class="btn" id="reset" type="button">Start again</button></div>
  </article>
</main>

<div class="scrim" id="scrim" hidden><div class="focus" id="focus" role="dialog" aria-modal="true" aria-labelledby="fTitle"></div></div>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const norm=s=>String(s).toLowerCase().replace(/[’']/g,"'").replace(/[.!?,]/g,'').replace(/\s+/g,' ').trim();

/* ══ THE TWELVE GAMES — one list, five kinds. Any topic mix can go here. ══ */
const GAMES=[
 {type:'choose', name:'Choose', topic:'Tenses', prompt:'By next June, I ___ here for ten years.',
  options:['will have worked','will work','am working','have worked'], answer:'will have worked',
  note:'A period that ends at a future point → future perfect: will have worked.'},
 {type:'gap', name:'Fill the gap', topic:'Conditionals', prompt:'If I ___ (know) about the party, I would have come.',
  answer:['had known'], note:'Third conditional: if + had + past participle.'},
 {type:'order', name:'Put it in order', topic:'Inversion', prompt:'Build the emphatic sentence.',
  words:['Never','have','I','seen','such','a','view.'], note:'Never at the front → the auxiliary comes before the subject: Never have I seen…'},
 {type:'odd', name:'Odd one out', topic:'Past modals', prompt:'Three are correct. Tap the one that isn’t.',
  options:['She must have forgotten.','He can’t have seen us.','They might have left early.','You should to have called.'], answer:'You should to have called.',
  note:'Should + have + past participle — never should to.'},
 {type:'sort', name:'Sort it', topic:'Gerunds & infinitives', prompt:'Which verbs take -ing, and which take to?',
  bins:['+ -ing','+ to'], items:[['enjoy',0],['decide',1],['avoid',0],['hope',1],['suggest',0],['promise',1]],
  note:'enjoy, avoid, suggest + -ing · decide, hope, promise + to.'},
 {type:'choose', name:'Choose', topic:'Passive voice', prompt:'They will announce the results tomorrow. → The results ___ tomorrow.',
  options:['will be announced','will announce','are announced','would be announced'], answer:'will be announced',
  note:'Will + be + past participle.'},
 {type:'gap', name:'Fill the gap', topic:'Reported speech', prompt:'“I’m tired,” she said. → She said she ___ tired.',
  answer:['was'], note:'The present moves back: am → was.'},
 {type:'order', name:'Put it in order', topic:'Passive voice', prompt:'Build the passive sentence.',
  words:['The','bridge','was','built','in','1998.'], note:'Subject + was + past participle + time.'},
 {type:'odd', name:'Odd one out', topic:'Linking words', prompt:'Three are correct. Tap the one that isn’t.',
  options:['Although it rained, we went out.','Despite the rain, we went out.','In spite of it rained, we went out.','Even though it rained, we went out.'],
  answer:'In spite of it rained, we went out.', note:'In spite of / despite + noun or -ing, never a full clause.'},
 {type:'sort', name:'Sort it', topic:'Comparatives', prompt:'Which words can go before “better”?',
  bins:['✓ before better','✗ not with better'], items:[['much',0],['far',0],['a lot',0],['very',1],['even',0],['so',1]],
  note:'much, far, a lot, even + comparative · never very or so.'},
 {type:'choose', name:'Choose', topic:'Gerunds & infinitives', prompt:'She suggested ___ a taxi.',
  options:['taking','to take','take','took'], answer:'taking', note:'Suggest + -ing.'},
 {type:'gap', name:'Fill the gap', topic:'Inversion', prompt:'Hardly ___ (we / arrive) when it started to rain.',
  answer:['had we arrived'], note:'Hardly + had + subject + past participle… when.'},
];
const N=GAMES.length;          /* tiles 1…N are games; 0 is START, N+1 is FINISH */

/* ══ THE TRACK — the sketch as one band, cut into cells ══
   Every cell is the same path, dashed to show only its own stretch, so the
   cells meet edge to edge like the segments in the drawing. Cross-lines are
   drawn at each join, square to the band. START and FINISH are longer cells. */
const PATH='M 80 26 L 80 248 Q 80 318 150 318 L 197 318 Q 267 318 267 248 L 267 124 Q 267 48 350 48 Q 434 48 434 124 L 434 336';
const W=65;                    /* the band's width in viewBox units (+20%) */
let cells=[];
function drawBoard(){
  const ns='http://www.w3.org/2000/svg';
  /* the ring's proportions scaled to the band: core diameter .7044, sage .0929, bezel .0549 */
  const D=W/.7044, SG=D*.0929, BZ=D*.0549;
  $('board').innerHTML=`<svg viewBox="22 -18 474 400" role="group" aria-label="The track"
      style="--bw:${W}px;--bw-a:${W+2*(SG+BZ)}px;--bw-b:${W+2*SG}px">
    <defs>
      <linearGradient id="bezelShade" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="360" y2="370">
        <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E4DDD1"/></linearGradient>
      <filter id="raise" x="-10%" y="-10%" width="120%" height="120%">
        <feDropShadow dx="-${(D*.0417).toFixed(1)}" dy="-${(D*.0417).toFixed(1)}" stdDeviation="${(D*.0469).toFixed(1)}" flood-color="#FFFFFF" flood-opacity=".9"/>
        <feDropShadow dx="${(D*.052).toFixed(1)}" dy="${(D*.052).toFixed(1)}" stdDeviation="${(D*.0677).toFixed(1)}" flood-color="#2B2129" flood-opacity=".16"/>
      </filter>
    </defs>
    <g id="capsB"></g><path class="bezel" d="${PATH}"/><g id="capsS"></g><path class="sage" d="${PATH}"/>
    <g id="cells"></g><g id="cuts"></g><g id="nums"></g></svg>`;
  const svg=$('board').querySelector('svg'), probe=svg.querySelector('.sage'), L=probe.getTotalLength();
  /* cell lengths: START and FINISH count 1.5, the games 1 */
  const w=[]; for(let i=0;i<=N+1;i++) w.push(i===0||i===N+1?1.5:1);
  const unit=L/w.reduce((a,b)=>a+b,0);
  let at0=0; cells=[];
  w.forEach((wi,i)=>{ const a=at0, b=at0+wi*unit; cells.push([a,b]); at0=b; });
  const gc=$('cells'), gk=$('cuts'), gn=$('nums');
  cells.forEach(([a,b],i)=>{
    const c=document.createElementNS(ns,'path'), end=i===0||i===N+1;
    c.setAttribute('d',PATH); c.setAttribute('class','cell'+(end?' end':''));
    c.style.strokeDasharray=`${b-a} ${L}`; c.style.strokeDashoffset=String(-a);
    c.dataset.i=i; c.setAttribute('role','button');
    c.setAttribute('aria-label', i===0?'01 · Start':i===N+1?'14 · Finish':'Tile '+String(i+1).padStart(2,'0'));
    c.addEventListener('click',()=>tap(i)); c.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); tap(i); } });
    gc.appendChild(c);
    const m=probe.getPointAtLength((a+b)/2), t=document.createElementNS(ns,'text');
    t.setAttribute('x',m.x); t.setAttribute('y',m.y); t.setAttribute('class','num'+(end?' end':'')); t.dataset.i=i;
    t.textContent=String(i+1).padStart(2,'0'); gn.appendChild(t);
    if(end){ t.setAttribute('y',m.y-5);
      const c2=document.createElementNS(ns,'text'); c2.setAttribute('x',m.x); c2.setAttribute('y',m.y+15);
      c2.setAttribute('class','cap-txt'); c2.dataset.i=i; c2.textContent=i===0?'START':'FINISH'; gn.appendChild(c2); }
    if(i>0){ /* the cut at the join, square to the band */
      const p0=probe.getPointAtLength(Math.max(0,a-.5)), p1=probe.getPointAtLength(Math.min(L,a+.5));
      const dx=p1.x-p0.x, dy=p1.y-p0.y, n=Math.hypot(dx,dy)||1, nx=-dy/n*(W/2+1.5), ny=dx/n*(W/2+1.5), q=probe.getPointAtLength(a);
      const k=document.createElementNS(ns,'line'); k.setAttribute('x1',q.x-nx); k.setAttribute('y1',q.y-ny); k.setAttribute('x2',q.x+nx); k.setAttribute('y2',q.y+ny);
      k.setAttribute('class','cut'); gk.appendChild(k); }
  });
  /* the two ends stay open: like a strip of film, the two rims run
     unbroken from START to FINISH and simply stop */
  paint();
}

/* ══ STATE ══ */
let at=0, lives=3, score=0, playing=false, t0=0, tick=null, tries=0;
function paint(){
  document.querySelectorAll('.cell,.num,.cap-txt').forEach(t=>{
    const i=+t.dataset.i, done=(i>0&&i<=at)||(i===0&&playing), open=playing&&i===at+1;
    t.classList.toggle('done',done); t.classList.toggle('open',open);
    if(t.classList.contains('cell')) t.setAttribute('tabindex',open||(!playing&&i===0)?'0':'-1');
    if(t.classList.contains('cell')) t.style.cursor=(open||(!playing&&i===0))?'pointer':''; });
  $('score').textContent=score;
  $('lives').innerHTML=[0,1,2].map(i=>`<svg viewBox="0 0 24 24" class="${i<lives?'':'gone'}"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4.5 6.7 4.5c2.1 0 3.6 1.2 4.3 2.4.7-1.2 2.2-2.4 4.3-2.4 3.7 0 5.8 3.8 4.3 7.2C19.5 16.4 12 21 12 21z"/></svg>`).join('');
  $('go').textContent=playing?'Continue':'Start'; $('go').disabled=playing&&at>=N+1;
}
function start(){ at=0; lives=3; score=0; playing=true; t0=performance.now(); clearInterval(tick);
  tick=setInterval(()=>{ const s=Math.floor((performance.now()-t0)/1000); $('clock').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); },500);
  paint(); }
function tap(i){
  if(!playing){ if(i===0){ start(); openGame(1); } return; }   /* START: begin the run, straight into the first game */
  if(i!==at+1) return; if(i===N+1){ finish(true); return; } openGame(i); }

/* ══ THE FOCUS CARD — one card, five kinds of game ══ */
let cur=null, done=false;
function openCard(html){ $('focus').innerHTML='<button class="x" type="button" aria-label="Close" id="fx">✕</button>'+html;
  const s=$('scrim'); s.hidden=false; requestAnimationFrame(()=>s.classList.add('on')); $('fx').onclick=closeCard; }
function closeCard(){ const s=$('scrim'); s.classList.remove('on'); setTimeout(()=>{ s.hidden=true; },250); }
function head(g,i){ return `<div class="kick">Tile ${String(i+1).padStart(2,'0')} of 14 · ${esc(g.topic)}</div><h2 id="fTitle">${esc(g.name)}</h2>`; }
function openGame(i){
  const g=GAMES[i-1]; cur={g,i}; done=false; tries=0;
  let body='';
  if(g.type==='choose'||g.type==='odd'){
    const L='ABCD';
    body=(g.type==='choose'?`<p class="gapline">${esc(g.prompt).replace('___','<span class="blank">&nbsp;</span>')}</p>`:`<p class="prompt">${esc(g.prompt)}</p>`)+
      `<div class="opts" id="opts">${shuffle(g.options).map((o,k)=>`<button class="opt" type="button" data-o="${esc(o)}"><span class="l">${L[k]}</span><span>${esc(o)}</span></button>`).join('')}</div>`;
  }
  if(g.type==='gap') body=`<p class="gapline">${esc(g.prompt).replace('___','<span class="blank" id="blank">&nbsp;</span>')}</p>
    <div class="field"><input id="gapIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type the missing words"><button class="btn fill" id="check" type="button">Check</button></div>`;
  if(g.type==='order') body=`<p class="prompt">${esc(g.prompt)} Tap the words in order.</p><div class="built" id="built"></div>
    <div class="chips" id="pool">${shuffle(g.words.map((w,k)=>({w,k}))).map(o=>`<button class="chip" type="button" data-k="${o.k}">${esc(o.w)}</button>`).join('')}</div>
    <div class="cta" style="justify-content:flex-start;margin-top:.7rem"><button class="btn" id="undo" type="button">Undo</button><button class="btn fill" id="check" type="button">Check</button></div>`;
  if(g.type==='sort') body=`<p class="prompt">${esc(g.prompt)} Tap a word, then its box. Tap a placed word to take it back.</p>
    <div class="chips" id="pool">${shuffle(g.items).map(([w,b])=>`<button class="chip" type="button" data-w="${esc(w)}" data-b="${b}">${esc(w)}</button>`).join('')}</div>
    <div class="bins">${g.bins.map((b,k)=>`<div class="bin" data-bin="${k}"><h4>${esc(b)}</h4></div>`).join('')}</div>
    <div class="cta" style="justify-content:flex-start;margin-top:.7rem"><button class="btn fill" id="check" type="button" disabled>Check</button></div>`;
  openCard(head(g,i)+body+'<p class="feedback" id="fb" aria-live="polite"></p><div class="cta" id="next" hidden><button class="btn fill" type="button" id="nextBtn">Continue</button></div>');
  wire(g);
}
function wire(g){
  if(g.type==='choose'||g.type==='odd'){
    document.querySelectorAll('#opts .opt').forEach(b=>b.onclick=()=>{ if(done) return;
      if(b.dataset.o===g.answer){ b.classList.add('ok'); if(g.type==='choose'){ const bl=document.querySelector('.blank'); if(bl) bl.textContent=g.answer; } win(); }
      else { b.classList.add('no'); b.disabled=true; lose(); } });
  }
  if(g.type==='gap'){
    const go=()=>{ if(done) return; const v=norm($('gapIn').value); if(!v) return;
      if(g.answer.map(norm).includes(v)){ $('blank').textContent=g.answer[0]; win(); } else { $('gapIn').classList.add('shake'); setTimeout(()=>$('gapIn').classList.remove('shake'),450); lose(); } };
    $('check').onclick=go; $('gapIn').addEventListener('keydown',e=>{ if(e.key==='Enter') go(); }); setTimeout(()=>$('gapIn').focus(),300);
  }
  if(g.type==='order'){
    const seq=[];
    const draw=()=>{ $('built').innerHTML=seq.map(k=>`<span class="chip">${esc(g.words[k])}</span>`).join(''); };
    document.querySelectorAll('#pool .chip').forEach(c=>c.onclick=()=>{ if(done) return; seq.push(+c.dataset.k); c.classList.add('used'); draw(); });
    $('undo').onclick=()=>{ if(done||!seq.length) return; const k=seq.pop(); document.querySelector(`#pool .chip[data-k="${k}"]`).classList.remove('used'); draw(); };
    $('check').onclick=()=>{ if(done||seq.length<g.words.length) return;
      if(seq.map(k=>g.words[k]).join(' ')===g.words.join(' ')) win();
      else { $('built').classList.add('shake'); setTimeout(()=>$('built').classList.remove('shake'),450); lose();
        seq.splice(0).forEach(k=>document.querySelector(`#pool .chip[data-k="${k}"]`).classList.remove('used')); draw(); } };
  }
  if(g.type==='sort'){
    let pick=null;
    const ready=()=>document.querySelectorAll('.bin').forEach(b=>b.classList.toggle('ready',!!pick));
    const canCheck=()=>{ $('check').disabled=document.querySelectorAll('#pool .chip').length>0; };
    /* a word in the pool is picked up; a word already in a box goes back to the pool */
    document.querySelectorAll('#pool .chip').forEach(c=>c.onclick=e=>{ if(done) return;
      if(c.parentElement.id!=='pool'){
        if(pick) return;                       /* a word is selected: the tap belongs to the box */
        e.stopPropagation(); c.classList.remove('ok','no','sel'); delete c.dataset.in; $('pool').appendChild(c); ready(); canCheck(); return; }
      e.stopPropagation();
      document.querySelectorAll('.chip.sel').forEach(x=>x.classList.remove('sel')); pick=c; c.classList.add('sel'); ready(); });
    document.querySelectorAll('.bin').forEach(b=>b.onclick=()=>{ if(done||!pick) return; pick.classList.remove('sel'); b.appendChild(pick); pick.dataset.in=b.dataset.bin; pick=null; ready(); canCheck(); });
    $('check').onclick=()=>{ if(done) return; let bad=0;
      document.querySelectorAll('.bin .chip').forEach(c=>{ const ok=c.dataset.in===c.dataset.b; c.classList.toggle('ok',ok); c.classList.toggle('no',!ok); if(!ok) bad++; });
      if(!bad) win(); else { lose(); setTimeout(()=>{ if(done) return; document.querySelectorAll('.bin .chip.no').forEach(c=>{ c.classList.remove('no'); $('pool').appendChild(c); delete c.dataset.in; }); canCheck(); },900); } };
  }
}
function win(){
  done=true; const pts=tries?50:100; score+=pts;
  $('fb').innerHTML='<b>Right · +'+pts+'.</b> '+esc(cur.g.note);
  $('next').hidden=false; $('nextBtn').onclick=()=>{ closeCard(); at=cur.i; paint(); if(at===N) setTimeout(()=>toast(),300); };
  $('nextBtn').focus();
}
function lose(){
  tries++; lives--; paint();
  if(lives<=0){ done=true; $('fb').innerHTML='<b>No lives left.</b> '+esc(cur.g.note); $('next').hidden=false;
    $('nextBtn').textContent='See your result'; $('nextBtn').onclick=()=>{ finish(false); }; return; }
  $('fb').innerHTML='Not quite — <b>'+lives+'</b> '+(lives===1?'life':'lives')+' left. Try again.';
}
function toast(){ /* the last game won: FINISH is open */ const f=document.querySelector('.cell.end.open'); if(f) f.focus(); }
function finish(won){
  playing=false; clearInterval(tick); if(won) at=N+1; paint();
  const t=$('clock').textContent;
  openCard(`<div class="kick">${won?'Challenge complete':'Challenge over'}</div><h2 id="fTitle">${won?'Finish.':'So close.'}</h2>
    <div class="big">${score}</div><p class="prompt">${won?`All ${N} games in <b>${t}</b>, with <b>${lives}</b> ${lives===1?'life':'lives'} to spare.`:`You reached tile <b>${at}</b> of ${N} in <b>${t}</b>.`}</p>
    <div class="cta"><button class="btn fill" type="button" id="again">Try again</button></div>`);
  $('again').onclick=()=>{ closeCard(); start(); };
}
$('go').onclick=()=>{ if(!playing) start(); const t=document.querySelector('.cell.open'); if(t) tap(+t.dataset.i); };
$('reset').onclick=()=>{ playing=false; at=0; lives=3; score=0; clearInterval(tick); $('clock').textContent='0:00'; paint(); };
$('scrim').addEventListener('click',e=>{ if(e.target.id==='scrim' && done) closeCard(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && !$('scrim').hidden) closeCard(); });
drawBoard();
})();
</script>
</body>
</html>
