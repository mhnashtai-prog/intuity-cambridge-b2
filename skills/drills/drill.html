<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Be2FIRST — Drill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..900&family=Geist+Mono:wght@400..600&family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=20261018">
<script src="/tools/be2-brand.js?v=20261012c"></script>
<style>
/* ═══ DRILLS — Samara thinks aloud ═══════════════════════════════════════
   One page for every drill: drill.html?d=<id> reads data/drills/<id>.json.
   Samara muses about a photo; each phrase she uses arrives as a card, the
   moment she says it, and the cards build into a phrase-bank map round the
   photo. Her recordings live in audio/drills/<id>/ with timings.json
   (made by tools/drill-studio.html); until they exist the browser's voice
   reads the same lines. When her video exists, data's "video" field puts it
   in the frame and the cards follow the video's clock instead. */
:root{--paper2:#F8F6F1;--ink2:#14110E;--faint2:rgba(20,17,14,.5);--car:#B0865C}
body{background:#ECE9E3}
.wrapd{max-width:1240px;margin:0 auto;padding:.6rem 1.2rem 2.5rem}
.stage{display:grid;grid-template-columns:1fr minmax(320px,440px) 1fr;gap:1.4rem;align-items:center}
.col{display:flex;flex-direction:column;gap:1rem}
.centre{display:flex;flex-direction:column;gap:.75rem}
.samara{position:relative;aspect-ratio:16/10;background:radial-gradient(ellipse at 50% 35%,#4a423a 0,#2a2521 60%,#1a1714 100%);overflow:hidden}
.samara video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sil{position:absolute;left:35%;bottom:0;width:30%;height:78%;background:#0f0d0b;border-radius:48% 48% 8% 8%/30% 30% 8% 8%;opacity:.85}
.sil::before{content:'';position:absolute;left:28%;top:-26%;width:44%;height:40%;border-radius:50%;background:#0f0d0b}
.samara.has-video .sil{display:none}
.name{position:absolute;left:.8rem;top:.7rem;font:500 11px 'Geist Mono',monospace;letter-spacing:.2em;color:rgba(255,255,255,.75)}
.sub{position:absolute;left:0;right:0;bottom:0;padding:1.6rem .9rem .7rem;background:linear-gradient(transparent,rgba(0,0,0,.78));color:#fff;
  font-size:15px;line-height:1.4;text-align:center;opacity:0;transition:opacity .3s}
.sub.on{opacity:1}
.sub i{font-style:normal;font-weight:700}
.q{font:500 11px 'Geist Mono',monospace;letter-spacing:.18em;color:var(--faint2);text-align:center;text-transform:uppercase}
.photo{width:100%;aspect-ratio:3/2;object-fit:cover;display:block;box-shadow:0 1px 3px rgba(0,0,0,.12);background:#ddd}
.credit{font:400 10px 'Geist Mono',monospace;color:var(--faint2);text-align:right;margin-top:-.45rem}
.credit a{color:inherit}
.ask{font-family:Anton,Impact,sans-serif;font-size:24px;line-height:1.1;text-align:center;color:var(--ink2)}
.watch{align-self:center;border:0;border-radius:999px;background:var(--ink2);color:#F6F3EE;font:600 13px 'Geist',sans-serif;padding:.6rem 1.25rem;cursor:pointer}
.card{background:var(--paper2);padding:.8rem 1rem .85rem;box-shadow:0 1px 3px rgba(0,0,0,.1);opacity:0;transform:translateX(var(--from,0)) scale(.85);
  transition:transform .8s cubic-bezier(.2,.9,.3,1),opacity .5s,box-shadow .3s}
.col.l .card{--from:60px}.col.r .card{--from:-60px}
.card.in{opacity:1;transform:none}.card.now{box-shadow:0 0 0 2px var(--ink2),0 10px 24px rgba(0,0,0,.12)}
.ck{display:flex;align-items:center;gap:8px;font:500 11px 'Geist Mono',monospace;letter-spacing:.18em;color:var(--faint2);text-transform:uppercase}
.ck i{width:22px;height:9px;background:var(--car)}
.ph{font-weight:700;font-size:16px;margin:.4rem 0 .15rem;color:var(--ink2)}
.ex{font-size:13px;color:rgba(20,17,14,.62);line-height:1.35}
@media(max-width:860px){
  .stage{grid-template-columns:1fr;gap:.9rem}
  .centre{order:-1}
  .col{display:grid;grid-template-columns:1fr 1fr;gap:.55rem}
  .card{padding:.6rem .7rem;--from:0!important;transform:translateY(14px)}
  .ph{font-size:14px}.ex{font-size:12px}
}
@media (prefers-reduced-motion:reduce){ .card{transition:opacity .2s;transform:none} }
</style>
</head>
<body>
<header class="header header--flow">
  <div class="header-top">
    <a class="back-link" href="/index.html?openModal=speaking" target="_top">← Speaking</a>
    <div class="header-title"><div class="app-title">INTUITY</div><div class="app-subtitle" id="sub2">Drill</div></div>
    <span class="header-spacer">Level <b>B2</b></span>
  </div>
</header>
<main class="wrapd">
  <div class="stage">
    <div class="col l" id="L"></div>
    <div class="centre">
      <div class="samara" id="frame"><div class="sil"></div><span class="name" id="who">SAMARA</span><div class="sub" id="cap"></div></div>
      <div class="q" id="wonder">Samara is wondering…</div>
      <img class="photo" id="photo" alt="">
      <div class="credit" id="credit"></div>
      <div class="ask" id="ask"></div>
      <button class="watch" id="watch" type="button">▶ Watch Samara</button>
    </div>
    <div class="col r" id="R"></div>
  </div>
</main>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const ID = (new URLSearchParams(location.search).get('d') || 'speculating').replace(/[^a-z0-9-]/g,'');
  const strip = h => String(h).replace(/<[^>]+>/g,'');
  let D = null, T = null, cards = [], run = 0;

  function show(k){ cards.forEach((c,i)=>{ if(i<=k) c.classList.add('in'); c.classList.toggle('now', i===k); }); }
  function caption(h){ $('cap').innerHTML = h; $('cap').classList.add('on'); }
  const wait = ms => new Promise(r => setTimeout(r, ms));

  /* the browser's voice: the stand-in until Samara is recorded */
  function speak(text, onPhrase){
    return new Promise(res => {
      if(!('speechSynthesis' in window)){ setTimeout(res, 2500); return; }
      const u = new SpeechSynthesisUtterance(strip(text)); u.rate = .93;
      const vs = speechSynthesis.getVoices();
      const v = vs.find(v=>/en-GB/.test(v.lang)&&/female|Serena|Kate|Libby|Sonia|Martha|Hazel/i.test(v.name)) || vs.find(v=>/en-GB/.test(v.lang)); if(v) u.voice = v;
      const at = strip(text.split('<i>')[0]).length;
      let fired = false;
      u.onboundary = e => { if(!fired && e.charIndex >= at){ fired = true; onPhrase && onPhrase(); } };
      u.onstart = () => setTimeout(()=>{ if(!fired){ fired = true; onPhrase && onPhrase(); } }, 900);
      u.onend = res; u.onerror = res; speechSynthesis.speak(u); setTimeout(res, 15000);
    });
  }
  /* Samara's own recording: the card arrives at the second her phrase starts */
  function playLine(line, onPhrase){
    return new Promise(res => {
      const t = T.lines[line.id]; if(!t){ res(); return; }
      const a = new Audio('/audio/drills/' + ID + '/' + line.id + '.mp3');
      let fired = false;
      a.ontimeupdate = () => { if(!fired && a.currentTime >= (t.phrase || 0)){ fired = true; onPhrase && onPhrase(); } };
      a.onended = res; a.onerror = res;
      a.play().catch(res);
    });
  }

  async function watch(){
    const me = ++run; if('speechSynthesis' in window) speechSynthesis.cancel();
    cards.forEach(c=>c.classList.remove('in','now'));
    if(D.video){ const v = $('frame').querySelector('video'); v.currentTime = 0; v.play(); return; }
    let k = -1;
    for(const line of D.lines){
      if(me !== run) return;
      const isCard = !!line.card; if(isCard) k++;
      const kk = k;
      caption(line.text);
      const onPhrase = isCard ? () => show(kk) : null;
      if(T) await playLine(line, onPhrase); else await speak(line.text, onPhrase);
      await wait(T ? 350 : 250);
    }
    cards.forEach(c=>c.classList.remove('now'));
  }

  Promise.all([
    fetch('/data/drills/' + ID + '.json', { cache:'no-cache' }).then(r => r.json()),
    fetch('/audio/drills/' + ID + '/timings.json', { cache:'no-cache' }).then(r => r.ok ? r.json() : null).catch(() => null)
  ]).then(([d, t]) => {
    D = d; T = t && t.lines ? t : null;
    document.title = 'Be2FIRST — Drill · ' + d.title;
    $('sub2').textContent = 'Drill · ' + d.title;
    $('who').textContent = (d.presenter || 'Samara').toUpperCase();
    $('wonder').textContent = (d.presenter || 'Samara') + ' is wondering…';
    $('watch').textContent = '▶ Watch ' + (d.presenter || 'Samara');
    $('photo').src = d.photo.src; $('photo').alt = d.photo.alt || '';
    $('credit').innerHTML = d.photo.link ? '<a href="' + d.photo.link + '" target="_blank" rel="noopener">' + d.photo.credit + '</a>' : (d.photo.credit || '');
    $('ask').textContent = d.question;
    const cs = d.lines.filter(l => l.card);
    cs.forEach((l,i) => (i < Math.ceil(cs.length/2) ? $('L') : $('R')).insertAdjacentHTML('beforeend',
      '<div class="card"><div class="ck"><i></i>' + (i+1) + ' · ' + (d.kicker || 'Phrase') + '</div><div class="ph">' + l.card + '</div><div class="ex">… ' + l.rest + '</div></div>'));
    cards = [...document.querySelectorAll('.card')];
    if(d.video){
      const v = document.createElement('video'); v.src = d.video; v.playsInline = true; v.controls = false;
      $('frame').prepend(v); $('frame').classList.add('has-video');
      /* the video's clock: each card at its line's offset in the video */
      const at = (d.videoAt || []);
      v.addEventListener('timeupdate', () => { let k = -1; at.forEach((s,i) => { if(v.currentTime >= s) k = i; }); if(k >= 0) show(k); });
      v.addEventListener('ended', () => cards.forEach(c=>c.classList.remove('now')));
    }
    $('watch').onclick = watch;
    if(location.hash === '#all') show(cards.length - 1);
  }).catch(e => { $('ask').textContent = 'This drill did not load.'; });
})();
</script>
</body>
</html>
