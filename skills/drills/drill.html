<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Be2FIRST — Drill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..900&family=Geist+Mono:wght@400..600&family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=20261018">
<script src="/tools/be2-brand.js?v=20261012c"></script>
<style>
/* ═══ DRILLS — a voice, and the words doing the work ═════════════════════
   One page for every drill: drill.html?d=<id> reads data/drills/<id>.json.
   No face on screen: a face pulls the eye from the language. The presenter
   is a voice and a small sound-wave; the language is the performer.
     · each line she says appears big in the SPOTLIGHT under the photo, its
       words arriving in step with her voice;
     · the line's phrase lands in bold the moment she says it;
     · when she finishes, the card shrinks and flies out to its place in
       the map round the photo, and the spotlight clears for the next.
   Her recordings: audio/drills/<id>/ + timings.json (tools/drill-studio.html).
   Without them the browser's voice reads the same lines. */
:root{--paper2:#F8F6F1;--ink2:#14110E;--faint2:rgba(20,17,14,.5);--car:#B0865C}
body{background:#ECE9E3}
.wrapd{max-width:1240px;margin:0 auto;padding:.6rem 1.2rem 2.5rem}
.stage{display:grid;grid-template-columns:1fr minmax(320px,460px) 1fr;gap:1.4rem;align-items:center}
.col{display:flex;flex-direction:column;gap:1rem}
.centre{display:flex;flex-direction:column;gap:.75rem}

/* the voice: a name and a sound-wave that moves only while she speaks */
.voice{display:flex;align-items:center;justify-content:center;gap:.7rem;font:500 11px 'Geist Mono',monospace;letter-spacing:.2em;color:var(--faint2);text-transform:uppercase}
.wave{display:flex;align-items:center;gap:3px;height:18px}
.wave i{display:block;width:3px;height:4px;border-radius:2px;background:var(--ink2);opacity:.35;transition:height .2s}
.speaking .wave i{opacity:.9;animation:wv .9s ease-in-out infinite}
.speaking .wave i:nth-child(2){animation-delay:.12s}.speaking .wave i:nth-child(3){animation-delay:.24s}
.speaking .wave i:nth-child(4){animation-delay:.36s}.speaking .wave i:nth-child(5){animation-delay:.48s}
@keyframes wv{0%,100%{height:4px}50%{height:17px}}

.photo{width:100%;aspect-ratio:3/2;object-fit:cover;display:block;box-shadow:0 1px 3px rgba(0,0,0,.12);background:#ddd}
.credit{font:400 10px 'Geist Mono',monospace;color:var(--faint2);text-align:right;margin-top:-.45rem}
.credit a{color:inherit}
.ask{font-family:Anton,Impact,sans-serif;font-size:24px;line-height:1.1;text-align:center;color:var(--ink2)}

/* the spotlight: the line she is saying, big, word by word */
.spot{min-height:7.2rem;background:var(--paper2);box-shadow:0 1px 3px rgba(0,0,0,.1);padding:1rem 1.15rem;position:relative}
.spot .ck{margin-bottom:.45rem;opacity:0;transition:opacity .3s}
.spot.card-line .ck{opacity:1}
.spot .say{font-size:clamp(17px,2vw,21px);line-height:1.42;color:rgba(20,17,14,.8)}
.spot .w{opacity:0;display:inline-block;transform:translateY(6px);transition:opacity .28s,transform .28s}
.spot .w.on{opacity:1;transform:none}
.spot .w.pw{font-weight:750;color:var(--ink2)}
.spot .w.pw.on{animation:land .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes land{0%{transform:translateY(10px) scale(.92)}60%{transform:translateY(-2px) scale(1.06)}100%{transform:none}}
.spot.leaving{opacity:0;transition:opacity .25s}
.spot .hint{font-size:14px;color:var(--faint2);line-height:1.45}

.watch{align-self:center;border:0;border-radius:999px;background:var(--ink2);color:#F6F3EE;font:600 13px 'Geist',sans-serif;padding:.6rem 1.25rem;cursor:pointer}

/* the map: the cards she has used */
.card{background:var(--paper2);padding:.8rem 1rem .85rem;box-shadow:0 1px 3px rgba(0,0,0,.1);opacity:0;transition:opacity .35s,box-shadow .3s}
.card.in{opacity:1}
.card.now{box-shadow:0 0 0 2px var(--ink2),0 10px 24px rgba(0,0,0,.12)}
.ck{display:flex;align-items:center;gap:8px;font:500 11px 'Geist Mono',monospace;letter-spacing:.18em;color:var(--faint2);text-transform:uppercase}
.ck i{width:22px;height:9px;background:var(--car)}
.ph{font-weight:700;font-size:16px;margin:.4rem 0 .15rem;color:var(--ink2)}
.ex{font-size:13px;color:rgba(20,17,14,.62);line-height:1.35}
/* the card in flight from the spotlight to its place */
.fly{position:fixed;z-index:50;margin:0;pointer-events:none;transition:transform .75s cubic-bezier(.2,.9,.3,1),opacity .75s}

@media(max-width:860px){
  /* one grid for all six cards, in order, two to a row */
  .stage{grid-template-columns:1fr 1fr;gap:.55rem;align-items:stretch}
  .centre{grid-column:1/-1;margin-bottom:.35rem}
  .col,.col.l,.col.r{display:contents}
  .photo{max-height:30vh}
  .ask{font-size:17px}
  .centre{gap:.55rem}
  .spot{padding:.75rem .9rem}
  .spot .say{font-size:16px}
  .centre{order:-1}
  .card{padding:.6rem .7rem}.ph{font-size:14px}.ex{font-size:12px}
  .col .ck{letter-spacing:.08em;font-size:10px;white-space:nowrap}
  .spot{min-height:6.4rem}
}
@media (prefers-reduced-motion:reduce){ .spot .w,.fly{transition:none} .spot .w.pw.on{animation:none} .speaking .wave i{animation:none;height:10px} }
</style>
</head>
<body>
<header class="header header--flow">
  <div class="header-top">
    <a class="back-link" href="/skills/speaking/part2-turn.html">← Part 2</a>
    <div class="header-title"><div class="app-title">INTUITY</div><div class="app-subtitle" id="sub2">Drill</div></div>
    <span class="header-spacer">Level <b>B2</b></span>
  </div>
</header>
<main class="wrapd">
  <div class="stage">
    <div class="col l" id="L"></div>
    <div class="centre">
      <div class="voice" id="voice"><span class="wave"><i></i><i></i><i></i><i></i><i></i></span><span id="who">Maya</span></div>
      <img class="photo" id="photo" alt="">
      <div class="credit" id="credit"></div>
      <div class="ask" id="ask"></div>
      <div class="spot" id="spot"><div class="ck" id="spotK"><i></i><span></span></div><div class="say" id="say"><span class="hint" id="hint"></span></div></div>
      <button class="watch" id="watch" type="button">▶ Listen to Maya</button>
    </div>
    <div class="col r" id="R"></div>
  </div>
</main>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const ID = (new URLSearchParams(location.search).get('d') || 'speculating').replace(/[^a-z0-9-]/g,'');
  const strip = h => String(h).replace(/<[^>]+>/g,'');
  const RM = matchMedia('(prefers-reduced-motion:reduce)').matches;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  let D = null, T = null, cards = [], run = 0;

  /* a line as words; the words inside <i>…</i> are the phrase */
  function words(html){
    const out = []; let inP = false;
    html.split(/(<i>|<\/i>)/).forEach(seg => {
      if(seg === '<i>'){ inP = true; return; } if(seg === '</i>'){ inP = false; return; }
      seg.split(/(\s+)/).forEach(w => { if(w) out.push({ w, ph: inP, sp: /^\s+$/.test(w) }); });
    });
    return out;
  }
  /* put the line in the spotlight, hidden, ready to arrive */
  function stage(line, k){
    const sp = $('spot'); sp.classList.remove('leaving');
    sp.classList.toggle('card-line', !!line.card);
    $('spotK').querySelector('span').textContent = line.card ? (k + 1) + ' · ' + (D.kicker || 'Phrase') : '';
    const ws = words(line.text);
    $('say').innerHTML = ws.map(x => x.sp ? x.w : '<span class="w' + (x.ph ? ' pw' : '') + '">' + x.w.replace(/</g,'&lt;') + '</span>').join('');
    return [...$('say').querySelectorAll('.w')];
  }
  /* the words arrive across the line: before the phrase they share the time
     up to it; the phrase lands at its second; the rest share what is left */
  function schedule(els, phraseAt, length){
    const first = els.findIndex(e => e.classList.contains('pw'));
    const timers = [];
    const pre = first < 0 ? els.length : first;
    const tPhrase = first < 0 ? 0 : phraseAt;
    for(let i = 0; i < pre; i++){
      const t = first < 0 ? (i / Math.max(1, els.length)) * length * .9 : (i / Math.max(1, pre)) * Math.max(0, tPhrase - .05);
      timers.push(setTimeout(() => els[i].classList.add('on'), t * 1000));
    }
    if(first >= 0){
      let last = first; while(last + 1 < els.length && els[last + 1].classList.contains('pw')) last++;
      timers.push(setTimeout(() => { for(let i = first; i <= last; i++) els[i].classList.add('on'); }, tPhrase * 1000));
      const rest = els.length - last - 1, span = Math.max(.4, length * .92 - tPhrase - .35);
      for(let i = last + 1; i < els.length; i++){
        const t = tPhrase + .35 + ((i - last - 1) / Math.max(1, rest)) * span;
        timers.push(setTimeout(() => els[i].classList.add('on'), t * 1000));
      }
    }
    return () => { timers.forEach(clearTimeout); els.forEach(e => e.classList.add('on')); };
  }
  /* the spotlight's line flies out to its card in the map */
  async function flyTo(k){
    const target = cards[k], sp = $('spot'); if(!target) return;
    if(RM){ target.classList.add('in'); return; }
    const a = sp.getBoundingClientRect(), b = target.getBoundingClientRect();
    const f = target.cloneNode(true); f.classList.add('in','fly');
    Object.assign(f.style, { left: a.left + 'px', top: a.top + 'px', width: a.width + 'px', height: a.height + 'px', boxSizing: 'border-box' });
    document.body.appendChild(f); sp.classList.add('leaving');
    await wait(20);
    f.style.transformOrigin = '0 0';
    f.style.transform = 'translate(' + (b.left - a.left) + 'px,' + (b.top - a.top) + 'px) scale(' + (b.width / a.width) + ',' + (b.height / a.height) + ')';
    await wait(760);
    target.classList.add('in'); f.remove();
  }
  function now(k){ cards.forEach((c,i) => c.classList.toggle('now', i === k)); }

  /* the voice: her recording, or the browser's while there is none */
  function voiceOn(on){ $('voice').classList.toggle('speaking', on); }
  function playRec(line){
    return new Promise(res => {
      const a = new Audio('/audio/drills/' + ID + '/' + line.id + '.mp3');
      a.onplaying = () => voiceOn(true); a.onended = () => { voiceOn(false); res(); }; a.onerror = () => { voiceOn(false); res(); };
      a.play().catch(() => res());
    });
  }
  function playTTS(line){
    return new Promise(res => {
      if(!('speechSynthesis' in window)){ setTimeout(res, 3000); return; }
      const u = new SpeechSynthesisUtterance(strip(line.text)); u.rate = .93;
      const vs = speechSynthesis.getVoices(), v = vs.find(v=>/en-GB/.test(v.lang)&&/female|Serena|Kate|Libby|Sonia|Martha|Hazel/i.test(v.name)) || vs.find(v=>/en-GB/.test(v.lang)); if(v) u.voice = v;
      u.onstart = () => voiceOn(true); u.onend = () => { voiceOn(false); res(); }; u.onerror = () => { voiceOn(false); res(); };
      speechSynthesis.speak(u); setTimeout(res, 15000);
    });
  }

  /* ONE TRACK. A phone only lets a page start sound from a tap, so the
     lines are one recording (full.mp3), started by the tap, and everything
     — words, phrases, flights — follows that one clock. */
  let A = null;
  function listenTrack(){
    const me = ++run, F = T.full, ids = D.lines.map(l => l.id);
    cards.forEach(c => c.classList.remove('in','now')); $('watch').textContent = '↻ Listen again';
    if(!A){ A = new Audio('/audio/drills/' + ID + '/' + F.file); A.preload = 'auto';
      A.addEventListener('playing', () => voiceOn(true)); A.addEventListener('pause', () => voiceOn(false)); A.addEventListener('ended', () => voiceOn(false)); }
    A.pause(); A.currentTime = 0;
    let cur = -1, k = -1, flown = -1;
    const kOf = i => D.lines.slice(0, i + 1).filter(l => l.card).length - 1;
    const enter = i => {
      const line = D.lines[i], els = stage(line, kOf(i)), t = T.lines[line.id] || {};
      const t0 = F.starts[line.id];
      const ph = first => els.forEach(e => { if(e.classList.contains('pw')) e.classList.add('on'); });
      /* words follow the track: each frame shows what has been said by now */
      const pre = els.findIndex(e => e.classList.contains('pw'));
      return { line, els, t0, phrase: t0 + (t.phrase || 0), end: t0 + (t.length || 3), pre };
    };
    let L = null;
    const tick = () => {
      if(me !== run) return;
      const now = A.currentTime;
      let i = -1; ids.forEach((id, n) => { if(now >= F.starts[id] - .05) i = n; });
      /* the previous card flies once its line is over */
      if(L && L.line.card && now >= L.end && flown < kOf(cur)){ flown = kOf(cur); flyTo(flown); }
      if(i !== cur && i >= 0){ cur = i; L = enter(i); if(L.line.card) now_(-1); }
      if(L){
        const n = L.els.length, pre = L.pre < 0 ? n : L.pre;
        L.els.forEach((e, j) => {
          let at;
          if(L.pre < 0) at = L.t0 + (j / n) * (L.end - L.t0) * .9;
          else if(j < pre) at = L.t0 + (j / Math.max(1, pre)) * Math.max(0, L.phrase - L.t0 - .05);
          else if(e.classList.contains('pw')) at = L.phrase;
          else { const last = L.els.length - 1, firstAfter = L.els.findIndex((x, m) => m > pre && !x.classList.contains('pw'));
                 const span = Math.max(.4, (L.end - L.phrase) * .92 - .35), r = j - firstAfter, tot = Math.max(1, last - firstAfter + 1);
                 at = L.phrase + .35 + (r / tot) * span; }
          if(now >= at) e.classList.add('on');
        });
      }
      if(!A.ended) requestAnimationFrame(tick);
      else { if(L) L.els.forEach(e => e.classList.add('on')); now_(-1); }
    };
    const go = A.play(); if(go && go.catch) go.catch(() => {});
    requestAnimationFrame(tick);
  }
  function now_(k){ now(k); }

  async function listen(){
    if(T && T.full){ listenTrack(); return; }
    const me = ++run; if('speechSynthesis' in window) speechSynthesis.cancel();
    cards.forEach(c => c.classList.remove('in','now')); $('watch').textContent = '↻ Listen again';
    let k = -1;
    for(const line of D.lines){
      if(me !== run) return;
      if(line.card) k++;
      const els = stage(line, k);
      const t = T && T.lines[line.id];
      /* timings: the recording's, or an estimate for the browser voice */
      const length = t ? t.length : strip(line.text).length * .068;
      const phraseAt = t ? (t.phrase || 0) : strip(line.text.split('<i>')[0]).length * .068;
      const finish = schedule(els, phraseAt, length);
      if(line.card) now(-1);
      await (T ? playRec(line) : playTTS(line));
      finish();
      if(me !== run) return;
      if(line.card){ await wait(250); await flyTo(k); now(k); }
      else await wait(300);
    }
    now(-1);
  }

  Promise.all([
    fetch('/data/drills/' + ID + '.json', { cache:'no-cache' }).then(r => r.json()),
    fetch('/audio/drills/' + ID + '/timings.json', { cache:'no-cache' }).then(r => r.ok ? r.json() : null).catch(() => null)
  ]).then(([d, t]) => {
    D = d; T = t && t.lines ? t : null;
    const who = d.presenter || 'Maya';
    document.title = 'Be2FIRST — Drill · ' + d.title;
    $('sub2').textContent = 'Drill · ' + d.title;
    $('who').textContent = who;
    $('watch').textContent = '▶ Listen to ' + who;
    $('hint').textContent = 'Press play and listen: ' + who + ' wonders about the photo, and every phrase she uses takes its place around it.';
    $('photo').src = d.photo.src; $('photo').alt = d.photo.alt || '';
    $('credit').innerHTML = d.photo.link ? '<a href="' + d.photo.link + '" target="_blank" rel="noopener">' + d.photo.credit + '</a>' : (d.photo.credit || '');
    $('ask').textContent = d.question;
    const cs = d.lines.filter(l => l.card);
    cs.forEach((l,i) => (i < Math.ceil(cs.length/2) ? $('L') : $('R')).insertAdjacentHTML('beforeend',
      '<div class="card"><div class="ck"><i></i>' + (i+1) + ' · ' + (d.kicker || 'Phrase') + '</div><div class="ph">' + l.card + '</div><div class="ex">… ' + l.rest + '</div></div>'));
    cards = [...document.querySelectorAll('.card')];
    $('watch').onclick = listen;
    if(location.hash === '#all') cards.forEach(c => c.classList.add('in'));
    if(location.hash === '#mid'){ cards.slice(0,3).forEach(c=>c.classList.add('in')); const L = d.lines.find(l=>l.id==='c4'); stage(L,3).forEach((e,i)=>{ if(i<9) e.classList.add('on'); }); $('voice').classList.add('speaking'); }
  }).catch(() => { $('ask').textContent = 'This drill did not load.'; });
})();
</script>
</body>
</html>
