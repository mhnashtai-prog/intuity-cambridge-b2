<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F3F1ED">
<title>INTUITY — Full test · Reading and Use of English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500&family=Anton&display=swap" rel="stylesheet">

<style>
/* ═══════════════════════════════════════════════════════════════════════
   INTUITY — FULL TEST
   The real paper: Reading and Use of English, seven parts, 52 questions,
   one clock of 75 minutes. Nothing is marked until the end, because
   feedback is what makes practice work and what makes a test worthless.
   All the reward lives either side of the paper: the gate before it, the
   reveal after it. The paper itself is quiet.
   ═══════════════════════════════════════════════════════════════════════ */
body{color:var(--ink,#14110E);background:var(--screen,#F3F1ED);margin:0}
.wrap{max-width:var(--w-sheet,60rem);margin:0 auto;padding:calc(var(--header-h,140px) + 1rem) var(--gutter,1rem) 7rem}
.hidden{display:none !important}

/* the clock sits where the level badge sits on every other page */
.clock{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.72rem;letter-spacing:.08em;
  color:var(--poster-ink);background:var(--tile-bg);padding:.3rem .65rem;border-radius:999px;justify-self:end}
.clock.low{background:#F3D9D2;color:#8a2f22}
.vtab .pct{font-family:var(--f-mono);font-size:.82em;opacity:.65;margin-left:.3rem;font-variant-numeric:tabular-nums}
.vtab.full .pct{opacity:1;color:var(--sage-ink,#527065)}
.vtab .due{margin-left:.25rem}

/* ── THE SHEET ───────────────────────────────────────────────────────── */
.paper{background:var(--card);border:1px solid var(--poster-rule);padding:1.6rem 1.5rem 1.8rem;margin:0 auto;max-width:var(--w-read,45rem)}
.paper.wide{max-width:var(--w-sheet,60rem)}
.kick{display:flex;align-items:center;gap:.55rem;font:500 .6rem/1.2 var(--f-mono);letter-spacing:.16em;
  text-transform:uppercase;color:var(--poster-faint);margin:0 0 .9rem}
.kick::before{content:'';width:26px;height:10px;background:var(--caramel);flex:none}
.kick .r{margin-left:auto}
h1.big{font-family:'Anton',Impact,sans-serif;font-weight:400;font-size:clamp(2.2rem,7vw,3.4rem);line-height:.95;
  letter-spacing:.005em;margin:0 0 .6rem;color:var(--poster-ink)}
h2.ptitle{font-family:var(--f-display);font-size:1.25rem;font-weight:700;margin:0 0 .35rem;letter-spacing:-.01em}
.rubric{font-size:.88rem;color:var(--poster-body);margin:0 0 1.3rem;line-height:1.5}
.ttl{text-align:center;font-weight:700;font-size:1.05rem;margin:.4rem 0 .2rem}
.sub{text-align:center;font-size:.85rem;color:var(--poster-body);margin:0 0 1rem;font-style:italic}
.txt{font-size:1rem;line-height:2.15;color:var(--poster-ink)}
.txt p{margin:0 0 .9rem}
.read{font-size:.98rem;line-height:1.7;color:var(--poster-ink)} .read p{margin:0 0 .85rem}

/* gaps: one pill shape for every kind of answer */
.n{font:500 .62rem/1 var(--f-mono);color:var(--poster-faint);margin:0 .2rem 0 .1rem;vertical-align:.15em}
.fld,.sel{font:600 .9rem/1.2 var(--f-display);color:var(--poster-ink);background:rgba(20,17,14,.07);border:none;
  border-radius:999px;height:1.85rem;padding:0 .8rem;vertical-align:middle;outline:none;-webkit-appearance:none;appearance:none}
.fld{width:8.5em} .fld.w{width:15em;max-width:100%}
.sel{padding-right:1.6rem;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:right .75rem center,right .5rem center;background-size:4px 4px,4px 4px;background-repeat:no-repeat}
.fld:focus,.sel:focus{box-shadow:0 0 0 1.5px var(--poster-ink)}
.fld.has,.sel.has{background-color:rgba(20,17,14,.13)}
.ex{font-weight:700;border-bottom:2px solid var(--caramel);padding:0 .15em}
.cap{font:600 .7rem/1 var(--f-mono);letter-spacing:.08em;color:var(--accent-ink,#9A5A2C);margin-left:.35rem}
.done-word{color:var(--poster-body)}

/* flags */
.flag{border:none;background:none;cursor:pointer;font:500 .62rem/1 var(--f-mono);letter-spacing:.06em;
  color:var(--poster-faint);padding:.3rem .45rem;border-radius:999px;vertical-align:middle}
.flag::before{content:'\2691';margin-right:.25rem;font-size:.85rem}
.flag.on{color:#8a2f22;background:#F3D9D2}
.flags-row{display:flex;flex-wrap:wrap;gap:.3rem .35rem;margin-top:1rem;padding-top:.8rem;border-top:1px solid var(--poster-rule)}
.flags-row .lbl{font:500 .6rem/1.8 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--poster-faint);margin-right:.3rem}

/* Part 4 */
.t4{padding:1.1rem 0;border-top:1px solid var(--poster-rule)} .t4:first-of-type{border-top:none;padding-top:0}
.t4 .src{margin:0 0 .5rem;line-height:1.5}
.kw{display:inline-block;font:700 .78rem/1 var(--f-display);letter-spacing:.1em;background:var(--poster-ink);color:var(--card);
  padding:.35rem .7rem;border-radius:999px;margin:0 0 .55rem}
.t4 .line{line-height:2.2}
.hint{font:500 .6rem/1 var(--f-mono);letter-spacing:.08em;color:var(--poster-faint);text-transform:uppercase;margin-top:.3rem}

/* Parts 5 and 7: text and questions side by side when there is room */
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:1.6rem;align-items:start}
.split .side{position:sticky;top:calc(var(--header-h,140px) + .8rem);max-height:calc(100vh - var(--header-h,140px) - 7rem);overflow:auto;padding-right:.3rem}
@media(max-width:820px){.split{grid-template-columns:1fr}.split .side{position:static;max-height:none;overflow:visible}}
.q5{padding:.9rem 0;border-top:1px solid var(--poster-rule)} .q5:first-child{border-top:none;padding-top:0}
.q5 .stem{font-weight:600;margin:0 0 .5rem;line-height:1.45}
.ch{display:flex;gap:.6rem;align-items:baseline;width:100%;text-align:left;border:none;background:none;cursor:pointer;
  padding:.5rem .6rem;border-radius:0;font:inherit;font-size:.92rem;line-height:1.4;color:var(--poster-ink)}
.ch b{font:500 .62rem/1 var(--f-mono);color:var(--poster-faint);flex:none}
.ch:hover{background:rgba(20,17,14,.05)}
.ch.on{background:var(--poster-ink);color:var(--card)} .ch.on b{color:var(--mark-ink,#E5D1B8)}
.sec{margin:0 0 1rem} .sec h3{font:700 .8rem/1 var(--f-mono);letter-spacing:.12em;margin:0 0 .35rem;color:var(--accent-ink)}
.q7{display:flex;gap:.8rem;align-items:center;justify-content:space-between;padding:.55rem 0;border-top:1px solid var(--poster-rule)}
.q7:first-child{border-top:none}
.q7 .stem{flex:1;font-size:.9rem;line-height:1.4}
.lets{display:flex;gap:.25rem;flex:none}
.let{width:1.9rem;height:1.9rem;border:none;border-radius:50%;background:rgba(20,17,14,.07);font:600 .8rem/1 var(--f-display);cursor:pointer;color:var(--poster-ink)}
.let.on{background:var(--poster-ink);color:var(--card)}

/* Part 6 */
.opts6{margin-top:1.4rem;padding-top:1rem;border-top:1px solid var(--poster-rule)}
.opts6 p{margin:0 0 .55rem;display:flex;gap:.7rem;line-height:1.5;font-size:.93rem}
.opts6 p b{font:700 .8rem/1.6 var(--f-mono);flex:none;color:var(--accent-ink)}
.opts6 p.used{opacity:.45}

/* review marks */
.ok{background:#D2E3D6 !important;color:#24382B !important}
.no{background:#F3D9D2 !important;color:#7a2a1c !important}
.fix{font:600 .82rem/1 var(--f-display);color:#24382B;background:#D2E3D6;padding:.2rem .5rem;border-radius:999px;margin-left:.3rem;vertical-align:middle}
.why{font-size:.84rem;color:var(--poster-body);margin:.3rem 0 0;line-height:1.45}
.ch.right{box-shadow:inset 3px 0 0 #4A6B5C}
.mk{font:600 .62rem/1 var(--f-mono);margin-left:.4rem;color:var(--poster-faint)}

/* ── THE BAR ─────────────────────────────────────────────────────────── */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(243,241,237,.96);backdrop-filter:blur(6px);
  border-top:1px solid var(--poster-rule);padding:.7rem var(--gutter,1rem) calc(.7rem + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:var(--w-sheet,60rem);margin:0 auto;display:flex;align-items:center;gap:.5rem}
.bar .grow{flex:1}
.pill{border:none;cursor:pointer;font:600 .8rem/1.2 var(--f-display);padding:.5rem 1rem;border-radius:999px;
  background:rgba(20,17,14,.09);color:var(--poster-ink)}
.pill[disabled]{opacity:.35;cursor:default}
.pill.dark{background:var(--poster-ink);color:var(--card)}
.pill:active:not([disabled]){transform:scale(.96)}
.left{font:500 .62rem/1.2 var(--f-mono);letter-spacing:.06em;color:var(--poster-faint)}

/* ── THE GATE ────────────────────────────────────────────────────────── */
.facts{display:flex;gap:1.6rem;flex-wrap:wrap;margin:.4rem 0 1.4rem}
.facts div{font:500 .62rem/1.3 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--poster-faint)}
.facts b{display:block;font:700 1.6rem/1.1 var(--f-display);letter-spacing:-.02em;color:var(--poster-ink);text-transform:none}
.ptable{width:100%;border-collapse:collapse;font-size:.88rem;margin:0 0 1.3rem}
.ptable td{padding:.5rem .3rem;border-top:1px solid var(--poster-rule);vertical-align:top}
.ptable td:first-child{font:600 .7rem/1.6 var(--f-mono);color:var(--poster-faint);white-space:nowrap}
.ptable td:last-child{text-align:right;font:500 .7rem/1.6 var(--f-mono);color:var(--poster-faint);white-space:nowrap}
.tag{white-space:nowrap;display:inline-block;font:600 .55rem/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;padding:.2rem .4rem;border-radius:999px;margin-left:.4rem;vertical-align:.1em}
.tag.r{background:#E7EEEA;color:#3d5a4e} .tag.u{background:#F1E6DA;color:#7d4e28}
.rules{list-style:none;padding:0;margin:0 0 1.5rem;display:grid;gap:.4rem}
.rules li{font-size:.9rem;line-height:1.45;padding-left:1.2rem;position:relative;color:var(--poster-body)}
.rules li::before{content:'';position:absolute;left:0;top:.55em;width:.5rem;height:.5rem;background:var(--caramel)}
.best{font-size:.88rem;color:var(--poster-body);margin:0 0 1.2rem;padding:.7rem .9rem;background:rgba(20,17,14,.05)}
.go-row{display:flex;gap:.6rem;flex-wrap:wrap}

/* ── THE REVEAL ──────────────────────────────────────────────────────── */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin:.6rem 0 1.4rem}
@media(max-width:560px){.duo{grid-template-columns:1fr}}
.score{text-align:center;padding:1.2rem .6rem 1rem;border:1px solid var(--poster-rule);background:var(--card)}
.disc{--p:0;--d:9.5rem;width:var(--d);height:var(--d);border-radius:50%;margin:0 auto .8rem;display:grid;place-items:center;
  background:conic-gradient(var(--mark-sweep,#708A81) calc(var(--p)*1%),rgba(20,17,14,.08) 0);position:relative}
.disc::after{content:'';position:absolute;inset:11%;border-radius:50%;background:var(--mark-core,#201E1C)}
.disc span{position:relative;z-index:1;font:400 2.6rem/1 'Anton',Impact,sans-serif;color:var(--mark-ink,#E5D1B8);font-variant-numeric:tabular-nums}
.score .lab{font:500 .62rem/1.2 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--poster-faint)}
.score .grade{font-family:'Anton',Impact,sans-serif;font-size:1.6rem;line-height:1.1;margin:.35rem 0 .1rem;opacity:0;transition:opacity .4s}
.score .raw{font:500 .7rem/1.2 var(--f-mono);color:var(--poster-faint)}
.score.shown .grade{opacity:1}
.scale{position:relative;height:2.6rem;margin:.2rem .4rem 2.2rem}
.scale .track{position:absolute;left:0;right:0;top:1.1rem;height:6px;background:linear-gradient(90deg,
  rgba(20,17,14,.12) 0 26.5%, #C9D8CF 26.5% 55.9%, #8FB0A1 55.9% 85.3%, #5E8575 85.3% 100%)}
.scale .tick{position:absolute;top:1.6rem;transform:translateX(-50%);font:500 .58rem/1 var(--f-mono);color:var(--poster-faint)}
.scale .tick::before{content:'';position:absolute;left:50%;top:-.6rem;width:1px;height:.45rem;background:var(--poster-faint)}
.scale .dot{position:absolute;top:.15rem;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;transition:left 1.1s cubic-bezier(.2,.8,.2,1)}
.scale .dot i{width:.8rem;height:.8rem;border-radius:50%;background:var(--poster-ink);border:2px solid var(--card);margin-top:.55rem}
.scale .dot b{font:600 .58rem/1 var(--f-mono);letter-spacing:.06em;position:absolute;top:-.55rem;white-space:nowrap}
.scale .band{position:absolute;top:-.25rem;font:500 .55rem/1 var(--f-mono);letter-spacing:.1em;color:var(--poster-faint);transform:translateX(-50%)}
.estimate{font-size:.9rem;line-height:1.55;color:var(--poster-body);margin:0 0 1.4rem;padding:.8rem 1rem;background:rgba(20,17,14,.05)}
.estimate b{color:var(--poster-ink)}
.pb{display:inline-block;background:var(--poster-ink);color:var(--mark-ink,#E5D1B8);border-radius:999px;padding:.3rem .9rem;font:700 .78rem/1.2 var(--f-display);margin:0 0 1rem}
.parts{margin:0 0 1.4rem}
.prow{display:grid;grid-template-columns:7.5rem minmax(0,1fr) 3.4rem;gap:.7rem;align-items:center;padding:.45rem 0;border-top:1px solid var(--poster-rule);font-size:.85rem}
.prow .nm{font-weight:600} .prow .nm small{display:block;font:500 .58rem/1.3 var(--f-mono);letter-spacing:.08em;color:var(--poster-faint);text-transform:uppercase}
.prow .tr{height:8px;background:rgba(20,17,14,.08);position:relative}
.prow .tr i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--mark-sweep,#708A81);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.prow.weak .tr i{background:var(--clay,#B4653A)}
.prow .sc{font:600 .75rem/1 var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.lesson{font-size:.92rem;line-height:1.55;margin:0 0 1.4rem}
.lesson a{color:var(--poster-ink);font-weight:700}
.hist{display:flex;gap:.35rem;flex-wrap:wrap;margin:0 0 1.2rem}
.hist span{font:500 .62rem/1 var(--f-mono);padding:.35rem .55rem;background:rgba(20,17,14,.06);border-radius:999px;color:var(--poster-body)}

/* the confirm sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(20,17,14,.45);display:grid;place-items:center;padding:1rem}
.scrim .paper{max-width:26rem;width:100%}
@media(prefers-reduced-motion:reduce){.scale .dot,.prow .tr i,.score .grade{transition:none}}
</style>

<body>
<header class="header">
  <div class="header-top">
    <a class="back-link" id="back" href="/index.html?openModal=english" target="_top">&larr; Use of English</a>
    <div class="header-title">
      <div class="app-title">INTUITY</div>
      <div class="app-subtitle" id="sub">Full test &middot; Reading and Use of English</div>
    </div>
    <span class="clock" id="clock">75:00</span>
  </div>
  <!-- Part 1 … Part 7, each with how many answered. Built when the clock
       starts; intuity-overflow.js gives the row its pill and arrows. -->
  <div class="set-tabs" id="tabs" role="tablist" aria-label="Parts"></div>
</header>

<main class="wrap" id="main"><div class="paper"><p class="kick">Loading the paper…</p></div></main>

<div class="bar hidden" id="bar"><div class="in">
  <button class="pill" type="button" id="prev">&lsaquo; Part</button>
  <button class="pill" type="button" id="next">Part &rsaquo;</button>
  <span class="grow"></span>
  <span class="left" id="left"></span>
  <button class="pill dark" type="button" id="finish">Finish</button>
</div></div>

<script src="/tools/intuity-log.js?v=1"></script>
<script src="/tools/intuity-ring.js?v=1"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P=new URLSearchParams(location.search);
const TEST_ID=+(P.get('test')||1);
const FROM=P.get('from')==='reading'?'reading':'english';
const KEY='intuity.fulltest.'+TEST_ID, HIST='intuity.fulltest.history';
const LET='ABCDEFGH';
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))||d;}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};

$('back').innerHTML=FROM==='reading'?'&larr; Reading':'&larr; Use of English';
$('back').href='/index.html?openModal='+FROM;

/* ── THE PAPER, BUILT FROM THE MANIFEST ──────────────────────────────── */
const PART_INFO={
  1:{name:'Multiple-choice cloze',skill:'r',per:1,rubric:'For questions 1–8, read the text below and decide which answer (A, B, C or D) best fits each gap. There is an example at the beginning (0).',practice:'/skills/use-of-english/multiple-choice/master-part1.html'},
  2:{name:'Open cloze',skill:'u',per:1,rubric:'For questions 9–16, read the text below and think of the word which best fits each gap. Use only one word in each gap. There is an example at the beginning (0).',practice:'/skills/use-of-english/gap-fill/master-part2.html'},
  3:{name:'Word formation',skill:'u',per:1,rubric:'For questions 17–24, read the text below. Use the word given in capitals to form a word that fits in the gap in the same line. There is an example at the beginning (0).',practice:'/skills/use-of-english/word-formation/word-families.html'},
  4:{name:'Key word transformation',skill:'u',per:2,rubric:'For questions 25–30, complete the second sentence so that it has a similar meaning to the first sentence, using the word given. Do not change the word given. You must use between two and five words, including the word given.',practice:'/skills/use-of-english/word-transformation/master-part4.html'},
  5:{name:'Multiple choice',skill:'r',per:2,rubric:'You are going to read an article. For questions 31–36, choose the answer (A, B, C or D) which you think fits best according to the text.',practice:'/skills/reading/multiple-choice-menu/reading-part5.html'},
  6:{name:'Gapped text',skill:'r',per:2,rubric:'You are going to read an article. Six sentences have been removed from it. Choose from the sentences A–H the one which fits each gap (37–42). There is one extra sentence which you do not need to use.',practice:'/skills/reading/gapped-texts-menu/reading-part6.html'},
  7:{name:'Multiple matching',skill:'r',per:1,rubric:'You are going to read an article in four sections. For questions 43–52, choose from the sections (A–D). The sections may be chosen more than once.',practice:'/skills/reading/multiple-matching-menu/reading-part7.html'}
};
let M=null, T=null, PARTS=[], S=null, cur=1, tick=null, reviewing=false;

async function load(){
  M=await (await fetch('/data/full-test/full-tests.json',{cache:'no-store'})).json();
  T=M.tests.find(t=>t.id===TEST_ID)||M.tests[0];
  const src={}; await Promise.all(Object.entries(T.parts).map(async([n,p])=>{ src[n]=await (await fetch(p.src,{cache:'no-store'})).json(); }));
  PARTS=[1,2,3,4,5,6,7].map(n=>build(n,T.parts[n],src[n]));
  $('sub').textContent=innerWidth<560?'Full '+T.title.toLowerCase():'Full '+T.title.toLowerCase()+' · Reading and Use of English';
  document.title='INTUITY — Full '+T.title.toLowerCase();
  S=store.get(KEY,null);
  /* the clock kept running while the page was closed: hand the paper in
     at 75:00, as an invigilator would, rather than lose the attempt */
  if(S&&!S.done&&S.start&&Date.now()-S.start>=M.minutes*60000){ submit(true); return; }
  if(S&&S.done){ results(false); } else gate();
}

/* Every part becomes {n, qs:[{num,...}], body} with question numbers 1–52. */
function build(n,cfg,d){
  const info=PART_INFO[n], part={n,info,qs:[]};
  if(n===1){
    const t=d.tests.find(x=>x.testNumber===cfg.test);
    part.title=t.title; part.example=t.example;
    part.text=t.text;
    t.questions.forEach(q=>part.qs.push({num:q.number,options:q.options,correct:q.correct,why:q.why}));
  }
  if(n===2){
    const e=d.exercises[cfg.index]; part.title=e.title;
    part.paras=e.text.split(/\n\s*\n/);
    Object.entries(e.gaps).forEach(([k,g])=>{ if(g.isExample) part.example={k,answer:g.answer}; else part.qs.push({num:8+(+k),k,answers:String(g.answer).split('/').map(s=>s.trim())}); });
  }
  if(n===3){
    const e=d.exercises[cfg.index]; part.title=e.title; part.raw=e.text; part.gaps=e.gaps; part.use=cfg.use;
    cfg.use.forEach((k,i)=>part.qs.push({num:17+i,k,prompt:e.gaps[k].prompt,answers:String(e.gaps[k].answer).split('/').map(s=>s.trim())}));
  }
  if(n===4){
    cfg.ids.forEach((id,i)=>{ const it=d.items.find(x=>x.id===id); part.qs.push({num:25+i,id,s:it.s,k:it.k,b:it.b,e:it.e,a:it.a,why:it.why}); });
  }
  if(n===5){
    part.title=d.title; part.subtitle=d.subtitle;
    if(d.questions){ part.paras=d.text; d.questions.slice(0,6).forEach((q,i)=>part.qs.push({num:31+i,stem:q.stem,choices:q.options,correct:q.answer,why:q.why})); }
    else { part.paras=d.cards.map(c=>c.text);
      cfg.questions.forEach((ci,i)=>{ const c=d.cards[ci]; part.qs.push({num:31+i,stem:c.question,choices:c.choices,correct:c.answer,why:c.why||''}); }); }
  }
  if(n===6){
    part.title=d.title; part.subtitle=d.subtitle; part.paras=d.text; part.sentences=d.sentences;
    part.exLetter=d.example?d.example.letter:null;
    part.rubric=PART_INFO[6].rubric.replace('A–H','A–'+LET[d.sentences.length-1]);
    d.answers.forEach((si,i)=>part.qs.push({num:37+i,correct:LET[si],why:d.why?d.why[i]:''}));
  }
  if(n===7){
    part.title=d.title; part.subtitle=d.subtitle; part.sections=d.sections;
    part.letters=Object.keys(d.sections);
    /* the shared opening of every statement ("Which person…", "In which section does the writer mention…")
       is printed once above the list, as the paper does */
    const LEAD=/^(In which section does the \w+ mention|Which (?:person|graduate|athlete|fan|writer|speaker|reviewer|student))\s+/i;
    const m0=d.questions[0]&&LEAD.exec(d.questions[0].question);
    part.lead=m0&&d.questions.every(q=>LEAD.test(q.question))?m0[1]:'';
    d.questions.forEach((q,i)=>part.qs.push({num:43+i,stem:part.lead?q.question.replace(LEAD,'').replace(/\?$/,''):q.question,correct:q.answer,why:q.why||''}));
  }
  return part;
}

/* ── MARKING ─────────────────────────────────────────────────────────── */
function norm(s){
  return String(s||'').toLowerCase().replace(/[‘’]/g,"'").replace(/can't/g,'cannot').replace(/won't/g,'will not')
    .replace(/n't/g,' not').replace(/'ve/g,' have').replace(/'re/g,' are').replace(/'m\b/g,' am').replace(/'ll/g,' will')
    .replace(/[.,!?;:"]/g,' ').replace(/\s+/g,' ').trim();
}
function mark4(q,ans){
  const a=norm(ans); if(!a) return 0;
  const words=a.replace(/cannot/g,'can not').split(' ');
  if(words.length<2||words.length>5) return 0;
  if(!a.split(' ').some(w=>w.replace(/'s$/,'')===q.k.toLowerCase()) && !(q.k.toLowerCase()==='cannot'&&/cannot/.test(a))) return 0;
  let best=0;
  q.a.forEach(x=>{ const [h1,h2]=x.split('|').map(norm); const full=(h1+' '+h2).trim();
    if(a===full) best=2;
    else if(best<1 && ((' '+a+' ').startsWith(' '+h1+' ') || (' '+a+' ').endsWith(' '+h2+' '))) best=1; });
  return best;
}
function markQ(p,q){
  const a=S.a[q.num];
  if(a==null||a==='') return 0;
  if(p.n===1) return +a===q.correct?1:0;
  if(p.n===2||p.n===3) return q.answers.map(norm).includes(norm(a))?1:0;
  if(p.n===4) return mark4(q,a);
  if(p.n===5) return +a===q.correct?2:0;
  if(p.n===6) return a===q.correct?2:0;
  if(p.n===7) return a===q.correct?1:0;
}
const answered=p=>p.qs.filter(q=>S.a[q.num]!=null&&S.a[q.num]!=='').length;

/* ── THE TEST SCROLLER ───────────────────────────────────────────────
   Before and after a paper the header row lists the papers (Test 1, Test 2…),
   each with your best average on it, the same pattern as the set tabs on every
   practice page. Once the clock starts, the same row becomes Part 1 … Part 7. */
const testUrl=id=>{ const q=new URLSearchParams(location.search); q.set('test',id); return '?'+q.toString(); };
function bestOf(id){
  const h=store.get(HIST,[]).filter(x=>x.test===id); if(!h.length) return null;
  return Math.max(...h.map(x=>Math.round(((x.r||0)+(x.u||0))/2)));
}
function testTabs(){

const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');

/* ── ONE PART ────────────────────────────────────────────────────────── */
function show(n){

    <p class="kick">Part ${n} · ${esc(p.info.name)}<span class="r">${p.info.skill==='r'?'Reading':'Use of English'} · ${p.qs.length*p.info.per} marks</span></p>

const lock=()=>reviewing?' disabled':'';
function cls(p,q){ if(!reviewing) return (S.a[q.num]!=null&&S.a[q.num]!=='')?' has':''; return markQ(p,q)===p.info.per?' ok':' no'; }
function sel(p,q,opts){ const v=S.a[q.num];
  return `<span class="n">${q.num}</span><select class="sel${cls(p,q)}" data-q="${q.num}" aria-label="Question ${q.num}"${lock()}><option value="">${reviewing?'—':'&nbsp;'}</option>${opts.map((o,i)=>`<option value="${o[0]}"${String(v)===String(o[0])?' selected':''}>${esc(o[1])}</option>`).join('')}</select>`; }
function fld(p,q,wide){ return `<span class="n">${q.num}</span><input class="fld${wide?' w':''}${cls(p,q)}" data-q="${q.num}" value="${esc(S.a[q.num]||'')}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Question ${q.num}"${lock()}>`; }
const fix=t=>`<span class="fix">${esc(t)}</span>`;

function p1(p){
  const html=p.text.map(par=>'<p>'+esc(par).replace(/\{(\d+)\}/g,(m,k)=>{
    k=+k; if(k===0) return `<span class="n">0</span><span class="ex">${esc(p.example.options[p.example.correct])}</span>`;
    const q=p.qs.find(x=>x.num===k);

    if(reviewing&&markQ(p,q)===0) h+=fix(q.options[q.correct]);
    return h; })+'</p>').join('');
  const why=reviewing?`<div class="flags-row" style="display:block">${p.qs.map(q=>`<p class="why"><b>${q.num}</b> ${esc(q.options[q.correct])}: ${esc(q.why||'')}</p>`).join('')}</div>`:'';
  return `<p class="ttl">${esc(p.title)}</p><div class="txt">${html}</div>${why}`;

function p2(p){
  return `<p class="ttl">${esc(p.title)}</p><div class="txt">${p.paras.map(par=>'<p>'+esc(par).replace(/\{\{(\d+)\}\}/g,(m,k)=>{

}
function p3(p){
  let t=esc(p.raw).replace(/\((\d+)\)\s+([A-Z][A-Za-z'-]*)\s+(\.{3,}|[a-z][a-z'-]*)/g,(m,k,word,ans)=>{

}
function p4(p){
  return p.qs.map(q=>{ const m=reviewing?markQ(p,q):0;
    const ans=q.a[0].split('|').join(' ');
    return `<div class="t4"><p class="src"><span class="n">${q.num}</span>${esc(q.s)}</p><span class="kw">${esc(q.k)}</span>
      <div class="line">${esc(q.b)} ${fld(p,q,true).replace('<span class="n">'+q.num+'</span>','')} ${esc(q.e)}${reviewing?`<span class="mk">${m}/2</span>`:''}</div>
      ${reviewing?(m<2?`<p class="why">${fix(ans)} ${esc(q.why||'')}</p>`:`<p class="why">${esc(q.why||'')}</p>`):`<p class="hint">2–5 words, including ${esc(q.k)}</p>`}</div>`; }).join('');

function choices(p,q,list){
  return list.map((c,i)=>{ const on=String(S.a[q.num])===String(i);
    let k=on?' on':''; if(reviewing){ if(i===q.correct) k+=' right'; if(on) k+=i===q.correct?' ok':' no'; }
    return `<button type="button" class="ch${k}" data-q="${q.num}" data-v="${i}"${lock()}><b>${LET[i]}</b><span>${esc(c)}</span></button>`; }).join('');
}
function p5(p){
  return `<div class="split"><div><p class="ttl">${esc(p.title)}</p><p class="sub">${esc(p.subtitle||'')}</p><div class="read">${p.paras.map(x=>'<p>'+esc(x)+'</p>').join('')}</div></div>
    <div class="side">${p.qs.map(q=>`<div class="q5"><p class="stem"><span class="n">${q.num}</span>${esc(q.stem)}</p>${choices(p,q,q.choices)}${reviewing&&q.why?`<p class="why">${esc(q.why)}</p>`:''}</div>`).join('')}</div></div>`;
}
function p6(p){
  const used=reviewing?[]:p.qs.map(q=>S.a[q.num]).filter(Boolean);
  const opts=p.sentences.map((s,i)=>[LET[i],LET[i]]).filter(o=>o[0]!==p.exLetter);
  const body=p.paras.map(par=>'<p>'+esc(par).replace(/\{(\d+)\}/g,(m,k)=>{
    k=+k; if(k===0) return `<span class="n">0</span><span class="ex">${p.exLetter}</span>`;
    const q=p.qs[k-1]; let h=sel(p,q,opts); if(reviewing&&markQ(p,q)===0) h+=fix(q.correct); return h; })+'</p>').join('');
  const list=p.sentences.map((s,i)=>`<p class="${LET[i]===p.exLetter||used.includes(LET[i])?'used':''}"><b>${LET[i]}</b><span>${esc(s)}</span></p>`).join('');
  const why=reviewing&&p.qs.some(q=>q.why)?`<div class="opts6">${p.qs.map(q=>`<p class="why"><b>${q.num}</b>&nbsp; ${q.correct} · ${esc(q.why)}</p>`).join('')}</div>`:'';
  return `<p class="ttl">${esc(p.title)}</p><p class="sub">${esc(p.subtitle||'')}</p><div class="read">${body}</div><div class="opts6">${list}</div>${why}`;
}
function p7(p){
  const secs=Object.entries(p.sections).map(([k,v])=>`<div class="sec"><h3>${k}</h3><div class="read"><p>${esc(v)}</p></div></div>`).join('');
  const qs=p.qs.map(q=>`<div class="q7"><span class="stem"><span class="n">${q.num}</span>${esc(q.stem)}</span><span class="lets">${p.letters.map(L=>{
      const on=S.a[q.num]===L; let k=on?' on':''; if(reviewing){ if(on) k+=L===q.correct?' ok':' no'; else if(L===q.correct) k+=' ok'; }
      return `<button type="button" class="let${k}" data-q="${q.num}" data-v="${L}"${lock()} aria-label="Section ${L}">${L}</button>`; }).join('')}</span></div>${reviewing&&q.why?`<p class="why" style="margin:-.2rem 0 .5rem">${esc(q.why)}</p>`:''}`).join('');
  return `<div class="split"><div><p class="ttl">${esc(p.title)}</p><p class="sub">${esc(p.subtitle||'')}</p>${secs}</div>
    <div class="side">${p.lead?`<p class="why" style="margin:0 0 .4rem"><b>${esc(p.lead)}…</b></p>`:''}${qs}</div></div>`;
}

/* ── MARKING THE PAPER ───────────────────────────────────────────────── */
function scale(raw,pts){
  if(raw<pts[0][0]) return null;
  for(let i=1;i<pts.length;i++){ const [x0,y0]=pts[i-1],[x1,y1]=pts[i];
    if(raw<=x1) return Math.round(y0+(raw-x0)*(y1-y0)/(x1-x0)); }
  return pts[pts.length-1][1];
}
const grade=s=>M.scale.grades.find(g=>s!=null&&s>=g[0])||M.scale.grades[M.scale.grades.length-1];
function tally(){
  const parts=PARTS.map(p=>({n:p.n,got:p.qs.reduce((s,q)=>s+markQ(p,q),0),max:p.qs.length*p.info.per,skill:p.info.skill}));
  const rr=parts.filter(x=>x.skill==='r').reduce((s,x)=>s+x.got,0), ur=parts.filter(x=>x.skill==='u').reduce((s,x)=>s+x.got,0);
  return {parts,rr,ur,r:scale(rr,M.scale.reading),u:scale(ur,M.scale.useOfEnglish)};
}
function submit(timeUp){
  stop(); S.done=true; S.end=Math.min(Date.now(),S.start+M.minutes*60000); S.timeUp=!!timeUp; store.set(KEY,S);
  const t=tally();
  const hist=store.get(HIST,[]); const prev=hist.filter(h=>h.test===TEST_ID);
  const pb=prev.length?Math.max(...prev.map(h=>(h.r||0)+(h.u||0))):null;
  hist.push({test:TEST_ID,date:new Date().toISOString().slice(0,10),rr:t.rr,ur:t.ur,r:t.r||0,u:t.u||0,mins:Math.round((S.end-S.start)/60000)});
  store.set(HIST,hist); S.pb=pb!=null&&(t.r||0)+(t.u||0)>pb; store.set(KEY,S);
  /* the paper feeds practice: Part 4 items share ids with Master Part 4, so a
     miss here is "to fix" there tomorrow; every answer is logged for the report */
  try{ PARTS.forEach(p=>p.qs.forEach(q=>{ const ok=markQ(p,q)===p.info.per;
    if(p.n===4){ if(window.IntuityRing){ ok?IntuityRing.right(q.id):IntuityRing.miss(q.id,{topic:'master-part4',part:'UoE4'}); }
      if(window.INTUITY) INTUITY.log('master-part4',q.id,ok,{game:'full-test'}); }
    else if(window.INTUITY) INTUITY.log('full-test','t'+TEST_ID+'-q'+q.num,ok,{game:'full-test',part:p.n}); })); }catch(e){}
  results(true);
}

/* ── THE REVEAL ──────────────────────────────────────────────────────── */
function results(animate){
  stop(); reviewing=false; $('bar').classList.add('hidden');
  const t=tally(); $('clock').textContent='Done'; $('clock').classList.remove('low');
  testTabs();
  const gR=grade(t.r), gU=grade(t.u);
  const avg=(t.r&&t.u)?Math.round((t.r+t.u)/2):null, gA=grade(avg);
  const pos=s=>s==null?0:Math.max(0,Math.min(100,(s-122)/(190-122)*100));
  const weak=t.parts.map(x=>({...x,lost:x.max-x.got})).sort((a,b)=>b.lost-a.lost||b.max-a.max)[0];
  const hist=store.get(HIST,[]).filter(h=>h.test===TEST_ID);
  const label=s=>s==null?'<122':s;
  $('main').innerHTML=`<div class="paper wide">
    <p class="kick">${esc(T.title)} · Results<span class="r">${S.timeUp?'Time ran out':((m=>m+(m===1?' minute':' minutes'))(Math.max(1,Math.round(((S.end||Date.now())-S.start)/60000))))}</span></p>
    ${S.pb?'<span class="pb">New personal best</span>':''}
    <div class="duo">
      <div class="score" id="sR"><div class="disc" id="dR"><span id="nR">122</span></div><div class="lab">Reading · Parts 1, 5, 6, 7</div><div class="grade">${esc(gR[1])}</div><div class="raw">${t.rr} / 42 marks${gR[2]?' · '+gR[2]:''}</div></div>
      <div class="score" id="sU"><div class="disc" id="dU"><span id="nU">122</span></div><div class="lab">Use of English · Parts 2, 3, 4</div><div class="grade">${esc(gU[1])}</div><div class="raw">${t.ur} / 28 marks${gU[2]?' · '+gU[2]:''}</div></div>
    </div>
    <div class="scale" aria-hidden="true"><div class="track"></div>
      ${[[140,'B1'],[160,'B2'],[180,'C1']].map(([v,l])=>`<span class="band" style="left:${pos(v)+ (v===180?7:10)}%">${l}</span>`).join('')}
      ${[122,140,160,173,180,190].map(v=>`<span class="tick" style="left:${pos(v)}%">${v}</span>`).join('')}
      <span class="dot" id="pR" style="left:0"><b>R</b><i></i></span><span class="dot" id="pU" style="left:0"><b>U</b><i></i></span></div>
    <p class="estimate">${avg?`Across this paper you average <b>${avg}</b>, which is <b>${esc(gA[1])}</b>${gA[2]?' ('+gA[2]+')':''}. `:''}This is an estimate. Cambridge's final grade averages five skills (Reading, Use of English, Writing, Listening and Speaking), and this paper measures two of them.</p>
    <div class="parts">${t.parts.map(x=>`<div class="prow${x.n===weak.n&&weak.lost>0?' weak':''}"><span class="nm">Part ${x.n}<small>${esc(PART_INFO[x.n].name)}</small></span><span class="tr"><i data-w="${x.max?x.got/x.max*100:0}"></i></span><span class="sc">${x.got}/${x.max}</span></div>`).join('')}</div>
    ${weak.lost>0?`<p class="lesson">Part ${weak.n} cost you the most: <b>${weak.lost} ${weak.lost===1?'mark':'marks'}</b>. <a href="${PART_INFO[weak.n].practice}">Practise ${esc(PART_INFO[weak.n].name.toLowerCase())}</a>${weak.n===4?'. The transformations you missed are waiting there under <b>to fix</b>.':'.'}</p>`:'<p class="lesson"><b>Full marks.</b> Every part, every question.</p>'}
    ${hist.length>1?`<div class="hist">${hist.slice(-8).map((h,i)=>`<span>${h.date} · R ${h.r||'<122'} · U ${h.u||'<122'}</span>`).join('')}</div>`:''}
    <div class="go-row"><button class="pill dark" type="button" id="rev">Review my answers</button><button class="pill" type="button" id="again">Take it again</button>${(n=>n?`<a class="pill" href="${testUrl(n.id)}">Try ${esc(n.title)} &rsaquo;</a>`:'')(M.tests[M.tests.indexOf(T)+1])}<a class="pill" href="/index.html?openModal=${FROM}">Back to ${FROM==='reading'?'Reading':'Use of English'}</a></div>
  </div>`;
  $('rev').onclick=()=>{ reviewing=true; $('bar').classList.remove('hidden'); $('finish').textContent='Scores'; show(1); };
  $('again').onclick=()=>{ S=null; store.set(KEY,null); gate(); };
  const fill=()=>{ document.querySelectorAll('.prow .tr i').forEach(i=>i.style.width=i.dataset.w+'%');
    $('pR').style.left=pos(t.r)+'%'; $('pU').style.left=pos(t.u)+'%'; };
  const count=(el,disc,box,to,delay,done)=>{
    const end=to||122, p=v=>disc.style.setProperty('--p',pos(v));
    if(!animate||reduce){ el.textContent=label(to); p(end); box.classList.add('shown'); done&&done(); return; }
    setTimeout(()=>{ const t0=performance.now(), dur=1300;
      const f=now=>{ const k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,3), v=Math.round(122+(end-122)*e);
        el.textContent=k<1?v:label(to); p(v); if(k<1) requestAnimationFrame(f); else { box.classList.add('shown'); done&&done(); } };
      requestAnimationFrame(f); },delay);
  };
  count($('nR'),$('dR'),$('sR'),t.r,250); count($('nU'),$('dU'),$('sU'),t.u,900,()=>setTimeout(fill,100));
  if(!animate||reduce) fill();
  if(animate&&window.SFX&&SFX.fanfare) setTimeout(()=>{ try{SFX.fanfare();}catch(e){} },2300);
}

/* header height, as on every shell page */
function syncHeader(){ const h=document.querySelector('.header'); if(h) document.documentElement.style.setProperty('--header-h',h.offsetHeight+'px'); }
addEventListener('resize',syncHeader); if(window.ResizeObserver) new ResizeObserver(syncHeader).observe(document.querySelector('.header'));
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(syncHeader); syncHeader();

load().catch(e=>{ $('main').innerHTML=`<div class="paper"><p class="kick">The paper didn't load</p><p class="rubric">${esc(e.message)}. Reload to try again.</p></div>`; });
})();
</script>
</body>
