<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FAF7F2">
  <title>INTUITY — Collocations Practice</title>

  <!-- Framed pages are separate documents and inherit nothing from the host,
       so they load the fonts and the shell themselves. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=4">

  <style>
/* ═══════════════════════════════════════════════════════════════════════
   COLLOCATIONS PRACTICE — multiple choice.

   Was 998 lines on the old dark theme: #0d0d0d, a #C9A961 gold accent, its
   own tokens, and Tailwind's #10b981 / #ef4444 — two colours from no palette
   in this product. Everything above the exercise itself is now the same code
   the conditionals page runs, character for character, so the two cannot
   drift apart again. Only the block marked THE GAP IS A SLOT and below is
   particular to this topic.
   ═══════════════════════════════════════════════════════════════════════ */

html{height:100%}
body{
  font-family:var(--f-body);
  background:var(--screen);
  color:var(--sentence);
  /* The frame is the scroller. min-height:100vh inside an iframe measures the
     WINDOW, not the frame, so the body was taller than its own viewport
     before a single sentence was added — which is why a flick died on the
     first drag. height:100% measures the frame. */
  height:100%;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  padding:0 .5rem 1rem;
}
.container{max-width:720px;margin:0 auto;padding:0 1rem}
/* No panel. The quiz has none, and a rounded card around the whole page was
   the loudest difference between the two framed modes. */
.content-container{background:none;border:none;border-radius:0;padding:0 0 2.5rem}

/* ── TEST TABS ───────────────────────────────────────────────────────────
   Hidden when the host draws them in its header, shown when this page is
   opened directly. Same .vtab chips either way, so the two look identical. */
.test-selector{position:sticky;top:0;z-index:20;background:var(--screen);
  display:flex;gap:.3rem;justify-content:center;flex-wrap:wrap;
  padding-top:.9rem;padding-bottom:.8rem;margin-bottom:1rem;
  border-bottom:1px solid var(--rule)}
.test-btn{font-family:var(--f-display);font-size:.58rem;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;padding:.26rem .62rem;
  border:none;border-radius:var(--r-chip);background:none;color:var(--faint);
  white-space:nowrap;cursor:pointer;transition:color .2s,background .15s}
.test-btn:hover{color:var(--sentence);background:rgba(43,33,41,.04)}
.test-btn.active{color:var(--tile-ink);font-weight:700;background:var(--tile-bg)}

/* ── PROGRESS ROW ── matched to the quiz, so the two read as one register */
.practice-strip{display:flex;align-items:center;justify-content:space-between;
  gap:1rem;margin-bottom:.95rem;padding-bottom:.45rem;
  border-bottom:1px solid var(--rule)}
.practice-instruction{font-family:var(--f-display);font-size:.58rem;
  font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.practice-tally{font-family:var(--f-mono);font-variant-numeric:tabular-nums;
  font-size:.7rem;color:var(--faint);margin-left:.55rem}
.practice-dots{display:flex;gap:.42rem;align-items:center}
.practice-dot{width:.62rem;height:.62rem;border-radius:50%;background:none;
  box-shadow:inset 0 0 0 1.5px var(--rule);transition:background .3s,box-shadow .3s}
.practice-dot.answered{background:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}

/* ── ITEMS ── space separates them; a panel around each was furniture */
.question-card{background:none;border:none;border-radius:0;padding:0;margin-bottom:1.5rem}
.q-row{display:flex;align-items:flex-start;gap:.62rem}
.q-body{flex:1;min-width:0}
/* Marks POSITION and never changes state — the strip's dots carry progress,
   so each does one job. Whole pixels, not rem: 1.15rem = 18.4px landed on a
   fractional boundary and the numeral smeared across two device pixels. */
.q-number{flex-shrink:0;width:20px;height:20px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;margin-top:2px;
  background:var(--tile-bg);color:var(--tile-ink);
  font-family:var(--f-mono);font-size:11px;font-weight:500;
  font-variant-numeric:tabular-nums;line-height:20px;text-align:center;
  -webkit-font-smoothing:antialiased}

/* The key word is the grammar being taught — brick, as everywhere else. It
   was #60a5fa, a blue from no palette in this product. */
.keyword{display:block;color:var(--target);font-family:var(--f-display);
  font-size:.875rem;font-weight:700;letter-spacing:.05em;text-align:left;
  margin:.55rem 0 .4rem}

/* The source sentence is READ, not filled in. It used to have the same tinted
   box as the input below it, so both said "here is a field". A left rule
   marks it as quoted, matching Explore. */
.sentence1{color:var(--sentence);font-size:.9rem;line-height:1.55;
  margin-bottom:.55rem;padding:.1rem 0 .1rem .75rem;
  background:none;border-radius:0;border-left:1px solid var(--rule)}
.sentence2{color:var(--sentence);font-size:.9rem;line-height:1.9;
  display:block}
.sentence2-part{display:inline}

/* ── FEEDBACK ── a line of text, not a panel. A right answer is left alone;
   the absence of a mark is the feedback, exactly as it is on paper. */
.feedback{display:none;margin-top:.45rem;padding:.1rem 0 .1rem .75rem;
  border-left:1px solid var(--wrong);font-size:.82rem}
.feedback.show{display:block}
.feedback.correct{display:none !important}
.feedback-label{font-family:var(--f-display);font-weight:700;font-size:.66rem;
  text-transform:uppercase;letter-spacing:.06em;color:var(--wrong);margin-bottom:.15rem}
.feedback-answer{color:var(--sentence);font-style:italic;font-size:.84rem}

/* ── ACTION BAR ── */
.action-bar{position:sticky;bottom:0;z-index:30;background:var(--screen);
  border-top:1px solid var(--rule);padding:.75rem;
  display:flex;justify-content:center;gap:.625rem}
.action-btn{font-family:var(--f-display);font-size:.78rem;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;
  padding:.62rem 1.3rem;border:none;border-radius:var(--r-chip);
  cursor:pointer;box-shadow:none;
  transition:transform .1s cubic-bezier(.2,.8,.2,1),background .15s}
.action-btn:active:not(:disabled){transform:scale(.96)}
.action-btn.secondary{background:var(--tile-bg);color:var(--dim)}
.action-btn.secondary:hover{background:var(--tile-bg-press)}
.action-btn.primary{background:var(--accent);color:#FFFFFF}
.action-btn.primary:hover{background:#DB5524}
.action-btn:disabled{opacity:.32;cursor:default}

/* ── SCORE ── a rule and a number, not a tinted box */
.score-banner{background:none;border:none;border-bottom:1px solid var(--rule);
  border-radius:0;padding:.4rem .75rem 1rem;margin-bottom:1.1rem;text-align:center}
.score-text{font-family:var(--f-display);font-size:1.9rem;font-weight:900;
  font-variant-numeric:tabular-nums;color:var(--accent);margin-bottom:.25rem}
.score-label{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;
  text-transform:uppercase;color:var(--faint)}

.loading{text-align:center;padding:2.5rem;color:var(--faint);
  font-family:var(--f-mono);font-size:.82rem}
.error{text-align:center;padding:2.5rem;color:var(--wrong);
  font-size:.9rem;line-height:1.6}

/* 16px is the threshold below which iOS zooms the page on input focus. It is
   the one value here that must not be in rem. */
@media (max-width:640px){
  body{padding:0 .375rem 1rem}
  .container{padding:0 .25rem}
  .sentence1,.sentence2{font-size:.875rem}
  .slot{font-size:16px}
  .opt{font-size:15px}
  .action-btn{padding:.55rem 1.1rem;font-size:.72rem}
}

/* A phone is read at about 30cm, a projected whiteboard at six metres. */
@media (min-width:900px){
  .sentence1,.sentence2{font-size:1rem;line-height:1.9}
  .slot,.opt{font-size:1rem}
  .keyword{font-size:.95rem}
  .practice-instruction{font-size:.66rem}
  .test-btn{font-size:.66rem}
  .feedback{font-size:.9rem}
}

/* ── THE GAP IS A SLOT, NOT A BLANK ──────────────────────────────────────
   The data writes the gap as a run of underscores. Left as underscores it
   reads as a printed worksheet: a place where nothing can happen. Rendered as
   the same capsule the transformation pages use for their input, it reads as
   a container — and once an option is chosen the word lands INSIDE the
   sentence, so the student checks the collocation by reading the whole line
   rather than by matching a word to a letter.

   This is the one decision that makes the multiple choice feel like the rest
   of the product rather than like a quiz bolted on: --slot-bg is deeper than
   --tile-bg everywhere in this shell, so an empty slot reads as a hollow and
   a filled one as an object sitting in it. */
.slot{display:inline-block;min-width:6.5em;box-sizing:border-box;
  padding:.22em .9em;margin:0 .16rem;vertical-align:baseline;
  border-radius:var(--r-chip);background:var(--slot-bg);color:var(--tile-ink);
  font-family:var(--f-display);font-weight:600;font-size:.9rem;
  text-align:center;transition:background .15s,color .15s}
.slot:empty::before{content:'\00a0'}
.slot.filled{background:var(--tile-bg)}
/* Marking follows the classroom, as on every other page here: a right answer
   is left alone and only what is WRONG is marked loudly. */
.slot.correct{background:var(--tile-ok-bg);color:var(--tile-ok-ink)}
.slot.incorrect{background:var(--tile-no-bg);color:var(--tile-no-ink);
  text-decoration:line-through;text-decoration-thickness:1px}

/* ── THE FOUR OPTIONS ────────────────────────────────────────────────────
   A grid, not a wrapping row. These are near-synonyms — immensely, extremely,
   greatly, highly — and a ragged row makes the eye compare word LENGTHS
   before it compares words. Two even columns put them in a block the student
   reads down, which is what discriminating a collocation actually asks for.
   Four short items on a wide screen fit one row; the auto-fit handles it
   without a second breakpoint.

   Hollow until chosen. A field of four filled tiles would be four things
   already selected — the fill has to mean the choice, or it means nothing. */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(8.5rem,1fr));
  gap:.4rem;margin-top:.7rem}
.opt{font-family:var(--f-display);font-size:.86rem;font-weight:600;
  padding:.5rem .8rem;border:none;border-radius:var(--r-chip);
  background:none;box-shadow:inset 0 0 0 1px var(--rule);color:var(--dim);
  cursor:pointer;text-align:center;
  transition:background .15s,color .15s,box-shadow .15s,transform .1s cubic-bezier(.2,.8,.2,1)}
.opt:hover:not(:disabled){background:rgba(43,33,41,.04);color:var(--sentence)}
.opt:active:not(:disabled){transform:scale(.97)}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt.chosen{background:var(--tile-bg);box-shadow:none;color:var(--tile-ink)}
.opt:disabled{cursor:default}
/* After Check, the RIGHT word is always shown — including on the items the
   student got right, where nothing else changes. Seeing the correct chip lit
   in a row of three greys is the answer key, and it costs no extra tap. */
.opt.is-answer{background:var(--tile-ok-bg);box-shadow:none;color:var(--tile-ok-ink)}
.opt.is-wrong{background:var(--tile-no-bg);box-shadow:none;color:var(--tile-no-ink);
  text-decoration:line-through;text-decoration-thickness:1px}
.opt:disabled:not(.is-answer):not(.is-wrong){opacity:.45}

/* The theme of a set — "Adverb + Adjective: Intensifiers" — is the one piece
   of teaching the old page threw away. It sits where the instruction sits on
   the transformation pages, in the same register, so the strip does the same
   job on both. */
.set-theme{font-family:var(--f-display);font-size:.58rem;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
  </style>
</head>
<body>
  <div class="container">
    <div class="content-container">
      <div class="test-selector" id="testSelector"></div>
      <!-- The strip carries the SET'S OWN theme rather than one fixed
           instruction. "Rewrite using the key word" is true of every set on a
           transformation page; here each list teaches a different pattern —
           intensifiers, verb + preposition, adjective + noun — and naming it
           is the difference between eight exercises and one exercise done
           eight times. -->
      <div class="practice-strip" id="practiceStrip" style="display:none">
        <span><span class="set-theme" id="setTheme"></span><span class="practice-tally" id="practiceTally"></span></span>
        <div class="practice-dots" id="practiceDots"></div>
      </div>
      <div id="contentContainer"><div class="loading">Loading exercises…</div></div>
    </div>
  </div>

  <div class="action-bar" id="actionBar" style="display:none">
    <button class="action-btn secondary" id="clearBtn" type="button">Clear</button>
    <button class="action-btn primary" id="checkBtn" type="button">Check</button>
  </div>

<script>
/* ══════════════════════════════════════════════════════════════════════
   COLLOCATIONS PRACTICE — multiple choice.

   Every other topic's Practice page is a key-word transformation and shares
   one engine. This topic is not: collocations-practice.json holds
   questions[] with options[] and a `correct` index, because discriminating
   `highly suspicious` from `greatly suspicious` is a CHOICE between four
   near-synonyms, not something a student can be asked to produce from a
   blank. Forcing it into the transformation template would have meant
   rewriting eight sets of data into an exercise that teaches something else.

   So the exercise type is different and the surface is identical: same
   shell tokens, same tabs, same progress strip, same action bar, same
   marking convention, same score banner. Everything below the CSS is a
   different renderer wearing the same clothes — which is the point. A
   student moving from Conditionals to Collocations should not notice they
   have crossed into another kind of page.
   ══════════════════════════════════════════════════════════════════════ */

const DATA_URL = new URLSearchParams(location.search).get('json')
              || '../../data/grammar-rules/collocations-practice.json';
/* The old file keyed its scores 'adverb_collocations_practice_scores'. Kept,
   rather than renamed to match the filename: a rename is silent data loss —
   every student's history for this topic would simply stop existing, with
   nothing on screen to say why. */
const SCORE_KEY = 'adverb_collocations_practice_scores';

let allTests = [], currentTest = 0, isChecked = false, testScores = {};
/* answers[i] is the INDEX of the chosen option, or undefined. Not the word:
   two options are never identical, but an index is what `correct` is stated
   in, so comparing indices means nothing has to be normalised or matched. */
const answers = {};
const $ = id => document.getElementById(id);
const esc = v => String(v).replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ── WHO DRAWS THE TABS ──
   The host keeps every navigation control in one header, so when it says it
   will draw them we hide ours. It must ANNOUNCE that: an older host that
   never listens would otherwise leave the student with no way to change set
   at all. Default is to keep our own. */
const EMBEDDED = window.parent !== window;
let hostDrawsTabs = false;

/* THE FRAME IS THE SCROLLER, NOT THE WINDOW. */
function scrollTop(){
  const el = document.scrollingElement || document.body;
  try{ el.scrollTo({ top:0, behavior:'smooth' }); }catch(e){ el.scrollTop = 0; }
}

function publishTests(){
  if(!EMBEDDED) return;
  parent.postMessage({ intuity:'tests', mode:'practice',
    titles: allTests.map((t, i) => {
      const s = testScores['test' + i];
      return s ? t.title + ' (' + s.percentage + '%)' : t.title;
    }),
    active: currentTest }, '*');
}
window.addEventListener('message', e => {
  if(!e.data) return;
  if(e.data.intuity === 'setTest') loadTest(e.data.index);
  if(e.data.intuity === 'hostTabs' && !hostDrawsTabs){
    hostDrawsTabs = true;
    renderTestSelector();
  }
});

/* ── scores ── */
function loadScores(){ try{ testScores = JSON.parse(localStorage.getItem(SCORE_KEY)||'{}'); }catch(e){ testScores = {}; } }
function saveScores(){ try{ localStorage.setItem(SCORE_KEY, JSON.stringify(testScores)); }catch(e){} }

async function loadData(){
  try{
    const res = await fetch(DATA_URL, { cache:'no-store' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    /* collocations-practice.json is a bare array of sets, written before the
       wrapper convention; the topic file may one day carry them under a
       `practice` key like conditionals does. Accept both. */
    const raw = await res.json();
    const sets = Array.isArray(raw) ? raw : (raw.practice || raw.tests);
    if(!sets || !sets.length) throw new Error('no practice sets in the data file');
    allTests = sets.map(s => ({
      title: s.title,
      theme: s.theme || '',
      questions: s.questions || s.examples || []
    }));
    loadScores();
    renderTestSelector();
    loadTest(0);
  }catch(err){
    $('contentContainer').innerHTML =
      '<div class="error">The exercises did not load.<br>' + esc(err.message) + '</div>';
  }
}

function renderTestSelector(){
  publishTests();
  const sel = $('testSelector');
  if(!sel) return;
  if(EMBEDDED && hostDrawsTabs){ sel.style.display = 'none'; return; }
  sel.style.display = '';
  sel.innerHTML = '';
  allTests.forEach((t,i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'test-btn' + (i === currentTest ? ' active' : '');
    const sc = testScores['test' + i];
    b.textContent = t.title + (sc ? ' (' + sc.percentage + '%)' : '');
    b.onclick = () => loadTest(i);
    sel.appendChild(b);
  });
}

/* ── the board ── */
function loadTest(index){
  if(index == null || index < 0 || index >= allTests.length) return;
  currentTest = index;
  isChecked = false;
  Object.keys(answers).forEach(k => delete answers[k]);
  renderTestSelector();
  renderTest();
  updateStrip();
  $('actionBar').style.display = 'flex';
  resetActions();
  scrollTop();
}

/* The gap is written as a run of underscores. Split on it and keep the
   surrounding spaces: the slot sits inline between the two halves, so
   " suspicious of the old vicar." must keep its leading space or the chosen
   word welds itself to the next one. */
function sentenceHTML(q, i){
  const s = String(q.sentence || '');
  const m = s.match(/_{2,}/);
  const before = m ? s.slice(0, m.index) : s;
  const after  = m ? s.slice(m.index + m[0].length) : '';
  return esc(before) +
    '<span class="slot" id="slot-' + i + '"></span>' +
    esc(after);
}

function renderTest(){
  const test = allTests[currentTest];
  $('contentContainer').innerHTML = test.questions.map((q,i) =>
    '<div class="question-card"><div class="q-row">' +
      '<div class="q-number">' + (i+1) + '</div>' +
      '<div class="q-body">' +
        '<div class="sentence2">' + sentenceHTML(q, i) + '</div>' +
        /* radiogroup, not a list of buttons: a screen reader then announces
           "1 of 4" and arrow keys move between them, which is what a set of
           mutually exclusive choices is. */
        '<div class="opts" role="radiogroup" aria-label="Question ' + (i+1) + '">' +
          (q.options||[]).map((o,j) =>
            '<button type="button" class="opt" role="radio" aria-checked="false" ' +
              'id="opt-' + i + '-' + j + '" data-q="' + i + '" data-o="' + j + '">' +
              esc(o) + '</button>').join('') +
        '</div>' +
        '<div class="feedback" id="fb-' + i + '">' +
          '<div class="feedback-label"></div><div class="feedback-answer"></div>' +
        '</div>' +
      '</div></div></div>').join('');

  $('contentContainer').querySelectorAll('.opt').forEach(b =>
    b.addEventListener('click', () => choose(+b.dataset.q, +b.dataset.o)));
  $('practiceStrip').style.display = 'flex';
  $('setTheme').textContent = test.theme || 'Choose the natural collocation';
}

function choose(qi, oi){
  if(isChecked) return;
  answers[qi] = oi;
  const q = allTests[currentTest].questions[qi];
  document.querySelectorAll('.opt[data-q="' + qi + '"]').forEach(b => {
    const on = +b.dataset.o === oi;
    b.classList.toggle('chosen', on);
    b.setAttribute('aria-checked', on ? 'true' : 'false');
  });
  const slot = $('slot-' + qi);
  slot.textContent = (q.options||[])[oi] || '';
  slot.classList.add('filled');
  updateStrip();
}

function updateStrip(){
  const test = allTests[currentTest];
  const done = test.questions.filter((_,i) => answers[i] != null).length;
  $('practiceTally').textContent = done + '/' + test.questions.length;
  $('practiceDots').innerHTML = test.questions.map((_,i) =>
    '<div class="practice-dot' + (answers[i] != null ? ' answered' : '') + '"></div>').join('');
}

/* ── marking ── */
function markRow(qi, revealOnly){
  const q = allTests[currentTest].questions[qi];
  const right = q.correct;
  const given = answers[qi];
  const ok = given === right;
  document.querySelectorAll('.opt[data-q="' + qi + '"]').forEach(b => {
    const j = +b.dataset.o;
    b.disabled = true;
    b.classList.remove('chosen');
    if(j === right) b.classList.add('is-answer');
    else if(j === given) b.classList.add('is-wrong');
  });
  const slot = $('slot-' + qi);
  /* On a right answer, and on every answer once "Show answers" is pressed,
     the slot holds the correct word — so the sentence on screen is always a
     sentence the student can read back as true English. A wrong choice left
     sitting in the gap would be the one thing on the page teaching the
     collocation that isn't. */
  if(ok || revealOnly){
    slot.textContent = q.options[right];
    slot.classList.remove('incorrect');
    slot.classList.add('filled','correct');
  }else{
    slot.classList.add('incorrect');
  }
  const fb = $('fb-' + qi);
  if(!ok && !revealOnly && q.explanation){
    fb.classList.add('show');
    fb.querySelector('.feedback-label').textContent = 'Why';
    fb.querySelector('.feedback-answer').textContent = q.explanation;
  }else if(revealOnly){
    fb.classList.remove('show');
  }
  return ok;
}

function checkAnswers(){
  const test = allTests[currentTest];
  let correct = 0;
  test.questions.forEach((_,i) => { if(markRow(i, false)) correct++; });

  isChecked = true;
  const total = test.questions.length;
  const percentage = Math.round(correct / total * 100);
  testScores['test' + currentTest] = { correct, total, percentage, at: new Date().toISOString() };
  saveScores();
  renderTestSelector();

  $('contentContainer').insertAdjacentHTML('afterbegin',
    '<div class="score-banner"><div class="score-text">' + correct + '/' + total + '</div>' +
    '<div class="score-label">' + percentage + '% correct</div></div>');

  $('clearBtn').textContent = 'Try again';
  $('checkBtn').textContent = 'Show answers';
  $('checkBtn').onclick = showAnswers;
  scrollTop();
}

function showAnswers(){
  allTests[currentTest].questions.forEach((_,i) => markRow(i, true));
  $('checkBtn').disabled = true;
}

function clearAnswers(){
  const banner = document.querySelector('.score-banner');
  if(banner) banner.remove();
  Object.keys(answers).forEach(k => delete answers[k]);
  isChecked = false;
  renderTest();
  resetActions();
  updateStrip();
  scrollTop();
}

function resetActions(){
  $('clearBtn').textContent = 'Clear';
  $('checkBtn').textContent = 'Check';
  $('checkBtn').disabled = false;
  $('checkBtn').onclick = checkAnswers;
}
/* Bound ONCE, via onclick, because resetActions() reassigns checkBtn.onclick
   to showAnswers after marking. */
$('clearBtn').onclick = clearAnswers;

loadData();
</script>
</body>
</html>
