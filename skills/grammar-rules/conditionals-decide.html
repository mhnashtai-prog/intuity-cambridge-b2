<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FAF7F2">
<title>INTUITY — Conditionals Decide</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=4">

<style>
/* ═══ WHAT ONLY THIS PAGE OWNS ═══
   Tokens, header, tabs, tile family, close control, sheets and the pendulum
   all come from the shell. What follows is this game's own object: the ring
   row, the two capsules, and the picker.

   THE DESIGN IN ONE LINE
   The lit ring hands the student the MEANING, so the only question left is
   FORM. That is a deliberate scaffold — a student who cannot yet tell a dream
   from a regret still scores here, because the ring told them. The harder
   half, choosing the ring for yourself, is the second game. */

:root{
  /* this game's mark: sage rim, black core — the gate pendulum */
  --mark-sweep:#708A81; --mark-rest:#4A433D; --mark-core:#201E1C;
  --mark-ink:#E5D1B8; --mark-pct:100%;
  --hud-h:40px; --ring-h:214px; --you-h:34px;
}
html,body{width:100%;height:100%;overflow:hidden}
body{user-select:none;-webkit-user-select:none;touch-action:manipulation}

/* ══ HUD ══ */
.hud{position:fixed;top:var(--header-h);left:0;right:0;height:var(--hud-h);z-index:25;
  display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:0 1rem;
  font-family:var(--f-mono);font-size:.72rem;color:var(--faint)}
.score-n{font-family:var(--f-display);font-weight:900;font-size:1.05rem;
  color:var(--paper);font-variant-numeric:tabular-nums}
.streak{font-family:var(--f-display);font-weight:900;font-size:1rem;color:var(--faint);
  font-variant-numeric:tabular-nums;transition:color .15s,transform .15s}
.streak.live{color:var(--accent)}
.streak.pop{transform:scale(1.3)}
.modes{display:flex;gap:.18rem}
.mbtn{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;
  padding:.14rem .5rem;border-radius:var(--r-chip);border:none;color:rgba(43,33,41,.34)}
.mbtn.on{color:var(--accent);background:rgba(var(--accent-rgb),.1)}
.mutebtn{font-size:.95rem;opacity:.55}
@media(max-width:600px){.modes{display:none}}

/* ══ THE RING ROW ══
   Four dials in the Forge style — outer edge catching light, a coloured rim,
   a dark core — one lit and three dimmed. The dim is opacity AND scale AND
   grayscale, never colour alone, so a colour-blind student still sees which
   one is live.

   The rim colours are not decorative: they run cool to hot along the reality
   scale. Sage for the real possibility, caramel for the dream, brick for the
   regret, orange for the crossed pair. A student who plays this a dozen times
   learns the order without being told it.

   The lit ring's rim IS the countdown — the same conic sweep as Forge's dial.
   That removes the separate progress bar: the object you are looking at is
   the object counting down. */
.rings{position:fixed;top:calc(var(--header-h) + var(--hud-h));left:0;right:0;
  height:var(--ring-h);z-index:20;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:.55rem;padding:0 .5rem}
/* A 2x2 grid, not a row of four. Four across forces each ring down to 58px on
   a phone before the gaps are counted; two-by-two lets them stay big enough to
   read, and the block reads as one object rather than a strip. */
.ring-row{display:grid;grid-template-columns:repeat(2,auto);
  gap:.55rem .8rem;justify-items:center;align-items:center}

.ring{width:76px;height:76px;border-radius:50%;position:relative;flex:none;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,#FFFFFF,#E4DDD1);
  box-shadow:-4px -4px 9px rgba(255,255,255,.9),5px 5px 13px rgba(43,33,41,.16);
  opacity:.26;transform:scale(.86);filter:grayscale(1);
  transition:opacity .32s,transform .32s,filter .32s}
.ring::before{content:'';position:absolute;inset:7%;border-radius:50%;
  background:conic-gradient(var(--rim) calc(var(--pct,100) * 1%), #201E1C 0)}
.ring::after{content:'';position:absolute;inset:19%;border-radius:50%;
  background:radial-gradient(circle at 38% 32%,#3A3A38,#201E1C 72%);
  box-shadow:inset 0 2px 5px rgba(0,0,0,.5)}
.ring .rlabel{position:relative;z-index:2;font-family:var(--f-display);
  font-weight:900;font-size:.82rem;letter-spacing:.02em;color:#E5D1B8;
  text-shadow:0 1px 2px rgba(0,0,0,.5)}
.ring.lit{opacity:1;transform:scale(1);filter:none}
.ring.lit.low::before{background:conic-gradient(var(--wrong) calc(var(--pct,100) * 1%), #201E1C 0)}

/* One caption, under the row, for the lit ring only. Four captions at once is
   a paragraph rather than a row. */
.ring-cap{font-family:var(--f-display);font-weight:700;font-size:.72rem;
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink);
  text-align:center;min-height:1.2em}
.ring-cap .sub{font-family:var(--f-body);font-weight:400;font-size:.78rem;
  letter-spacing:0;text-transform:none;color:var(--faint);margin-left:.45rem}

/* ══ THE PERFORMANCE BAR ══
   Forge's composure meter, in the place the sketch puts it: a rule between
   the rings and the sentence that is also the fail condition. It divides the
   two halves of the screen AND says how the round is going, which is one
   element doing the work of two. */
.you{position:fixed;top:calc(var(--header-h) + var(--hud-h) + var(--ring-h));
  left:0;right:0;height:var(--you-h);z-index:20;
  display:flex;align-items:center;gap:.6rem;padding:0 1rem;
  border-bottom:1px solid var(--rule)}
.you-label{font-family:var(--f-display);font-size:.66rem;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.you-track{flex:1;height:8px;border-radius:999px;background:var(--slot-bg);overflow:hidden}
.you-fill{height:100%;width:100%;border-radius:999px;
  background:linear-gradient(90deg,#4A6B5C,#708A81 60%,#BCB1A0);
  transition:width .3s,background .3s}
.you-fill.low{background:linear-gradient(90deg,#AC5A3E,var(--wrong))}
.you-num{font-family:var(--f-mono);font-size:.7rem;color:var(--faint);min-width:3.4rem;text-align:right}

/* ══ THE SENTENCE ══ */
.pad{position:fixed;top:calc(var(--header-h) + var(--hud-h) + var(--ring-h) + var(--you-h));
  left:0;right:0;bottom:0;z-index:10;overflow-y:auto;overscroll-behavior:contain;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  gap:1.1rem;padding:1.6rem 1.1rem 2rem}
.sentence{font-size:clamp(1.05rem,4vw,1.4rem);font-weight:500;line-height:2.1;
  text-align:center;color:var(--sentence);max-width:34rem}

/* The capsule shows its infinitive until it holds an answer — the label that
   tells you what belongs in it, and then gets out of the way. */
.cap-slot{display:inline-flex;align-items:center;justify-content:center;
  min-width:6.5em;height:2.1em;padding:0 1em;margin:0 .2em;vertical-align:middle;
  border:none;border-radius:var(--r-chip);box-shadow:none;
  background:var(--slot-bg);color:var(--faint);
  font-family:var(--f-display);font-weight:600;font-size:.86em;
  cursor:pointer;transition:background .15s,transform .1s,color .15s}
.cap-slot:active{transform:scale(.96)}
.cap-slot.filled{background:var(--tile-bg);color:var(--tile-ink);font-weight:700}
.cap-slot.open{box-shadow:0 0 0 2px rgba(var(--accent-rgb),.6)}
.cap-slot.right{background:var(--tile-ok-bg);color:var(--tile-ok-ink)}
.cap-slot.wrong{background:var(--tile-no-bg);color:var(--tile-no-ink)}
.cap-slot.locked{pointer-events:none}

.fbnote{min-height:2.6em;font-size:.86rem;line-height:1.5;color:var(--dim);
  text-align:center;max-width:32rem;opacity:0;transition:opacity .2s}
.fbnote.show{opacity:1}
.fbnote b{color:var(--ok);font-weight:700}
.fbnote.bad b{color:var(--wrong)}
.tapstart{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--faint);transition:opacity .4s}
.tapstart.gone{opacity:0}

/* ══ THE PICKER ══
   A tooltip beside the gap that was tapped, not a sheet at the bottom. The
   sentence is the thing being decided about, so it must stay in place and in
   view — and a popover pointing AT the gap says which of the two it belongs
   to without a label. The catcher behind it is transparent: it exists only to
   take the tap that dismisses, so the sentence is never dimmed.

   Position is set in JS from the gap's own rectangle, flipped above when
   there is no room below and clamped to the viewport. */
.picker{position:fixed;inset:0;z-index:75;display:none;background:transparent}
.picker.open{display:block}
.pop{position:fixed;z-index:76;display:flex;flex-direction:column;gap:.3rem;
  padding:.4rem;min-width:9.5rem;max-width:min(15rem,86vw);
  border-radius:1rem;background:var(--card);
  box-shadow:0 10px 34px rgba(43,33,41,.2);
  transform-origin:top center;animation:popIn .16s cubic-bezier(.2,1,.4,1)}
@keyframes popIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
/* the pointer — a rotated square tucked under the card's edge */
.pop::after{content:'';position:absolute;left:var(--ax,50%);width:12px;height:12px;
  margin-left:-6px;background:var(--card);transform:rotate(45deg)}
.pop.below::after{top:-5px}
.pop.above::after{bottom:-5px}
.picker-list{display:flex;flex-direction:column;gap:.3rem}
.pop-head{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--faint);text-align:center;padding:.25rem 0 .1rem}
.pick{width:100%;padding:.6rem .8rem;border:none;border-radius:var(--r-chip);
  background:var(--tile-bg);color:var(--tile-ink);white-space:nowrap;
  font-family:var(--f-display);font-weight:600;font-size:.92rem;
  transition:transform .1s cubic-bezier(.2,.8,.2,1),background .15s}
.pick:active{transform:scale(.96);background:var(--tile-bg-press)}

/* ══ FOCUS MODE ══ same contract as Defuse and Forge */
body.playing .header,
body.playing .hud,
body.playing .set-tabs{display:none !important}
body.playing{height:100dvh;overflow:hidden}
body.playing .rings{top:calc(env(safe-area-inset-top,0px) + .4rem)}
body.playing .you{top:calc(env(safe-area-inset-top,0px) + .4rem + var(--ring-h))}
body.playing .pad{top:calc(env(safe-area-inset-top,0px) + .4rem + var(--ring-h) + var(--you-h))}

/* ══ IDLE + GATE ══ */
.idle{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:.2rem;text-align:center;padding:1rem 1.5rem;
  top:calc(var(--header-h) + var(--hud-h))}
.idle-mark{width:104px;height:104px;margin-bottom:1rem}
.idle-mark .pend-dial span{font-size:1.5rem}
.idle-msg{font-family:var(--f-display);font-weight:700;
  font-size:clamp(1.1rem,3.8vw,1.4rem);color:var(--ink);max-width:22rem}
.idle-sub{margin-top:.6rem;font-size:.86rem;color:var(--faint);max-width:22rem;line-height:1.5}
.go{display:inline-flex;align-items:center;justify-content:center;margin-top:1.2rem;
  min-width:168px;padding:.85rem 1.7rem;border:none;border-radius:var(--r-chip);
  font-family:var(--f-display);font-weight:800;font-size:.92rem;
  letter-spacing:.06em;text-transform:uppercase;color:#FFFFFF;background:var(--accent);
  transition:transform .12s,background .15s}
.go:active{transform:scale(.96);background:#DB5524}
.gate{position:fixed;inset:0;z-index:65;display:none;align-items:center;
  justify-content:center;padding:1.2rem;background:var(--scrim)}
.gate.show{display:flex}
.gate-card{width:min(360px,100%);text-align:center}
.gate-mark{width:118px;height:118px;margin:0 auto 1.2rem}
.gate-mark .pend-dial span{font-size:1.4rem}
.gate-set{font-family:var(--f-display);font-weight:900;
  font-size:clamp(1.6rem,7vw,2.2rem);color:var(--ink);line-height:1}
.gate-mode{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--faint);margin:.5rem 0 1.4rem}

/* ══ SUMMARY ══ */
.over{position:fixed;inset:0;z-index:50;display:none;align-items:center;
  justify-content:center;padding:1.2rem;background:rgba(43,33,41,.14)}
.over.show{display:flex}
.over-card{position:relative;width:100%;max-width:23rem;max-height:min(82vh,34rem);
  overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:.35rem;
  text-align:center;padding:1.6rem 1.5rem 1.4rem;border-radius:var(--r-sheet);
  background:var(--card);box-shadow:0 20px 55px rgba(43,33,41,.16);
  animation:sheetIn .28s cubic-bezier(.2,1,.4,1) both}
.over .closex{position:absolute;top:.7rem;right:.7rem}
.outcome{font-family:var(--f-display);font-weight:900;font-size:.75rem;
  letter-spacing:.16em;text-transform:uppercase;padding:.25rem .8rem;
  border-radius:var(--r-chip);border:1px solid currentColor}
.outcome.win{color:var(--ok)} .outcome.loss{color:var(--wrong)}
.score{font-family:var(--f-display);font-weight:900;margin-top:.3rem;
  font-size:clamp(2rem,7vw,2.8rem);font-variant-numeric:tabular-nums}
.score .gr{font-size:.5em;margin-left:.3rem;vertical-align:.35em}
.g-a{color:#F26430} .g-b{color:var(--ok)} .g-c{color:#708A81} .g-d{color:var(--wrong)} .g-p{color:var(--dim)}
.setname{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.16em;
  text-transform:uppercase;color:var(--dim)}
.note{margin-top:.6rem;font-size:.88rem;color:var(--dim)}
.note b{color:var(--paper)}

/* The report a teacher actually wants: grouped by conditional, so a glance
   says WHICH one is shaky rather than how many were missed overall. */
.bytype{width:100%;margin-top:1rem;display:flex;flex-direction:column;gap:.4rem}
.tline{display:flex;align-items:center;gap:.6rem;font-size:.82rem}
.tline .nm{font-family:var(--f-display);font-weight:700;font-size:.68rem;
  letter-spacing:.1em;text-transform:uppercase;color:var(--dim);min-width:4.4rem;text-align:left}
.tbar{flex:1;height:7px;border-radius:999px;background:var(--slot-bg);overflow:hidden}
.tbar span{display:block;height:100%;border-radius:999px;background:var(--ok)}
.tnum{font-family:var(--f-mono);font-size:.72rem;color:var(--faint);min-width:2.6rem;text-align:right}

.reviewpill{display:inline-flex;align-items:center;justify-content:center;
  font-family:var(--f-display);font-size:.72rem;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--tile-ink);
  background:var(--tile-bg);border:none;border-radius:var(--r-chip);
  padding:.55rem 1.1rem;margin:.9rem 0 .4rem;cursor:pointer}
.reviewpill .cnt{margin-left:.45rem;color:var(--wrong)}
.review{text-align:left;width:100%;margin-bottom:.6rem}
.rv{display:flex;gap:.5rem;align-items:flex-start;padding:.45rem 0;
  border-bottom:1px solid var(--rule);font-size:.85rem;line-height:1.5;color:var(--sentence)}
.rv:last-child{border-bottom:none}
.rv-mark{flex:none;width:1.1em;font-weight:700;color:var(--ok)}
.rv.bad .rv-mark{color:var(--wrong)}
.rv b{font-weight:700}
.rv.bad b{color:var(--wrong)}
.rv-chose{display:block;font-size:.76rem;color:var(--faint);margin-top:.1rem}
.rv-head{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint);margin:.7rem 0 .2rem}
.acts{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;margin-top:1rem}
.quiet{padding:.7rem 1.4rem;border-radius:var(--r-chip);color:var(--dim);
  background:var(--tile-bg);font-family:var(--f-display);font-weight:700;
  font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}
.prime{padding:.7rem 1.6rem;border-radius:var(--r-chip);background:var(--accent);
  color:#FFFFFF;font-family:var(--f-display);font-weight:700;font-size:.78rem;
  letter-spacing:.08em;text-transform:uppercase}
.away{margin-top:.9rem;font-size:.76rem;color:var(--faint)}

.loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:var(--screen);z-index:99;font-family:var(--f-mono);font-size:.82rem;color:var(--faint)}
.err{color:var(--wrong);font-size:.9rem;line-height:1.6;max-width:26rem;text-align:center;padding:2rem}

@media(max-width:600px){
  :root{--ring-h:196px}
  .ring{width:70px;height:70px}
  .ring .rlabel{font-size:.74rem}
  .sentence{line-height:2.2}
}
@media(max-width:360px){
  :root{--ring-h:180px}
  .ring{width:62px;height:62px}
  .ring-row{gap:.45rem .6rem}
}
@media(min-width:900px){
  :root{--ring-h:250px}
  .ring{width:104px;height:104px}
  .ring .rlabel{font-size:1rem}
  .ring-cap{font-size:.82rem}
  .sentence{font-size:1.5rem}
  .pick{font-size:1.1rem}
}
@media(prefers-reduced-motion:reduce){
  .ring,.cap-slot,.picker-card{transition:none!important}
}
</style>
</head>
<body>

<header class="header">
  <div class="header-top">
    <a class="back-link" href="/?openModal=grammar" target="_top">← Grammar</a>
    <div class="header-title">
      <div class="app-title">INTUITY</div>
      <div class="app-subtitle">B2 First Conditionals</div>
    </div>
    <span class="header-spacer">Level <b>B2–C1</b></span>
  </div>
  <div class="mode-selector">
    <a class="mode-btn" href="/skills/grammar-rules/conditionals-rules">Explore</a>
    <a class="mode-btn" href="/skills/grammar-rules/conditionals-rules?mode=practice">Practice</a>
    <a class="mode-btn" href="/skills/grammar-rules/conditionals-rules?mode=quiz">Quiz</a>
    <span class="mode-btn active">Decide</span>
  </div>
  <div class="set-tabs" id="setTabs"></div>
</header>

<div class="hud">
  <span>score <span class="score-n" id="score">0</span></span>
  <span class="streak" id="streak">×1</span>
  <span class="modes" id="modes">
    <button class="mbtn" data-m="90">90s</button>
    <button class="mbtn" data-m="120">120s</button>
    <button class="mbtn" data-m="practice">Practice</button>
  </span>
  <button class="mutebtn" id="muteBtn" title="Sound on or off">🔊</button>
</div>

<button class="close-btn close-fixed" id="exitBtn" aria-label="Leave and choose another set">
  <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
       stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
</button>

<div class="idle" id="idle">
  <div class="idle-mark pend-hang"><div class="pend-dial"><span>?</span></div></div>
  <div class="idle-msg">Pick a set above to start deciding</div>
  <div class="idle-sub">A ring lights up and names the conditional. Your job is the two verbs.</div>
  <button class="go" id="idleStart">Start</button>
</div>

<div class="rings" id="rings" style="display:none">
  <div class="ring-row" id="ringRow"></div>
  <div class="ring-cap" id="ringCap"></div>
</div>

<div class="you" id="you" style="display:none">
  <span class="you-label">You</span>
  <div class="you-track"><div class="you-fill" id="youFill"></div></div>
  <span class="you-num" id="youNum">1000</span>
</div>

<div class="pad" id="pad" style="display:none">
  <div class="sentence" id="sentence" aria-live="polite"></div>
  <div class="fbnote" id="fbNote" aria-live="polite"></div>
  <div class="tapstart" id="tapStart">Tap a gap to choose the form</div>
</div>

<div class="gate" id="gate">
  <div class="gate-card">
    <div class="gate-mark pend-hang"><div class="pend-dial"><span id="gateSecs">90</span></div></div>
    <div class="gate-set" id="gateSet">SET</div>
    <div class="gate-mode" id="gateMode">90 seconds</div>
    <button class="go" id="gateGo" style="margin-top:0">Start</button>
  </div>
</div>

<div class="picker" id="picker">
  <div class="pop" id="pop">
    <div class="pop-head" id="pickerHead"></div>
    <div class="picker-list" id="pickerList"></div>
  </div>
</div>

<div class="over" id="over">
  <div class="over-card">
    <button class="close-btn closex" id="closeX" aria-label="Close">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
           stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="outcome" id="ovOutcome"></div>
    <div class="score" id="ovScore"></div>
    <div class="setname" id="ovSet"></div>
    <div class="note" id="ovNote"></div>
    <div class="bytype" id="ovByType"></div>
    <button class="reviewpill" id="reviewBtn">Check your answers</button>
    <div class="review" id="ovReview" hidden></div>
    <div class="acts">
      <button class="quiet" id="againBtn">↻ Play again</button>
      <button class="prime" id="nextBtn">Next set →</button>
    </div>
    <button class="quiet away" id="hubBtn">Back to grammar</button>
  </div>
</div>

<div class="loading" id="loading">Loading…</div>

<script>
/* ══════════════════════════════════════════════════════════════════════
   CONDITIONALS — DECIDE

   A ring lights and names the conditional; the student supplies the two
   verbs from a three-option picker at each gap.

   WHY TWO INDEPENDENT PICKERS AND NOT FOUR WHOLE-SENTENCE OPTIONS
   Whole-sentence options weld the halves together: pick the right card and
   you get both, pick the wrong one and you miss both. The student never has
   to MAKE the halves agree. Two pickers let them produce "drove" +
   "would have avoided" — a real mismatch, and the one B2 students actually
   make. It also stops MIXED being a fourth rule: it is column 3 on the left
   and column 2 on the right, which is visible in the pickers themselves.

   Scoring is per GAP, not per item, so "you had the if-clause and missed the
   result" is reportable instead of being flattened into one wrong.
   ══════════════════════════════════════════════════════════════════════ */

const DATA_URL = new URLSearchParams(location.search).get('data')
              || '../../data/grammar-rules/conditionals-game-data.json';

/* ZERO is deliberately absent. It is covered in Explore and the Quiz, and it
   is the one conditional B2 students rarely get wrong — four rings keep each
   one wide enough to read on a phone. */
const TYPES = ['first','second','third','mixed'];
const CAPTION = { first:'a possibility', second:'a dream',
                  third:'a regret', mixed:'a different outcome' };
/* Cool to hot along the reality scale, so the colour carries the order. */
const RIM   = { first:'#708A81', second:'#C2956E', third:'#AC5A3E', mixed:'#F26430' };
/* Inside a 66px core, "SECOND" is unreadable. The ordinal is not. */
const SHORT = { first:'1st', second:'2nd', third:'3rd', mixed:'MIX' };

const $  = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const shuffle = a => { const b=[...a]; for(let i=b.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[b[i],b[j]]=[b[j],b[i]];} return b; };
const clamp = (n,lo,hi) => Math.max(lo,Math.min(hi,n));

let SETS = [], setIdx = -1, pool = [], curItem = null;
let running = false, started = false, rafId = null, resolved = false;
let picked = [null,null], openGap = -1;
let score = 0, streak = 0, bestStreak = 0;
/* Forge's composure meter: a wrong verb costs, and an empty bar ends the
   round. It is also the rule dividing the rings from the sentence, so one
   element carries the division and the stake together. */
const YOU_MAX = 1000, YOU_HIT = 90;
let youHP = YOU_MAX;
let gapsRight = 0, gapsWrong = 0;
const byType = {}, answerLog = [];

/* ── WHAT COMES BACK, AND WHEN ──
   The same expanding interval as Defuse and Forge: a missed item returns
   soon, one answered right returns after a long gap, one answered right
   twice is retired for the round. Re-testing something answered confidently
   spends a slot a shaky item could have used. */
const REPEAT_EVERY = 4, GAP_AFTER_MISS = 2, GAP_AFTER_ONE = 8, RETIRE_AT = 2;
let seen = [], missed = [], qCount = 0, correctCount = {}, dueAt = {}, fresh = [];

const MODES = ['90','120','practice'];
let mode = localStorage.getItem('intuity-decide-mode');
if (MODES.indexOf(mode) === -1) { mode = '90'; localStorage.setItem('intuity-decide-mode', mode); }
let roundEnd = 0, roundMs = 0;

const MEM_KEY = 'intuity-conditionals-mem';
function loadMem(){ try{ return JSON.parse(localStorage.getItem(MEM_KEY)||'{}'); }catch(e){ return {}; } }
function saveMem(m){ try{ localStorage.setItem(MEM_KEY,JSON.stringify(m)); }catch(e){} }
function noteResult(it, ok){
  const m = loadMem(), e = m[it.id] || {miss:0,seen:0};
  e.seen++; if (ok) e.miss = Math.max(0,e.miss-1); else e.miss++;
  m[it.id] = e; saveMem(m);
}

/* ── AUDIO ── */
let ac=null, master=null, sound = localStorage.getItem('intuity-decide-sound') !== 'off';
function audio(){
  if(!ac){ ac = new (window.AudioContext||window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value=.5; master.connect(ac.destination); }
  if(ac.state==='suspended') ac.resume();
}
function tone(f,d,ty,v,when,glide){
  if(!sound||!ac) return;
  const t0 = when||ac.currentTime, o=ac.createOscillator(), g=ac.createGain();
  o.type=ty||'sine'; o.frequency.setValueAtTime(f,t0);
  if(glide) o.frequency.exponentialRampToValueAtTime(glide,t0+d);
  g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(v||.14,t0+.008);
  g.gain.exponentialRampToValueAtTime(.0008,t0+d);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0+d+.02);
}
const sfxTap  = () => tone(700,.05,'square',.06);
const sfxGood = () => { const t=ac&&ac.currentTime; [523,659,784].forEach((f,i)=>tone(f,.22,'triangle',.15,t+i*.06)); };
const sfxBad  = () => tone(150,.3,'sawtooth',.15,ac&&ac.currentTime,75);
const sfxWin  = () => { const t=ac&&ac.currentTime; [523,659,784,1047].forEach((f,i)=>tone(f,.4,'triangle',.16,t+i*.11)); };
const sfxLose = () => { const t=ac&&ac.currentTime; [392,349,293,220].forEach((f,i)=>tone(f,.5,'sawtooth',.14,t+i*.14,f*.7)); };
const vibrate = p => { try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} };

/* ── ITEM SELECTION ── */
function refill(){
  const mem = loadMem();
  const idx = shuffle(pool.map((_,i)=>i));
  /* anything missed before, in any past session, comes up early */
  idx.sort((a,b)=>((mem[pool[b].id]?.miss)||0)-((mem[pool[a].id]?.miss)||0));
  fresh = idx;
}
function pickNext(){
  if(!fresh.length) refill();
  let i = null;
  for(let n=0;n<fresh.length;n++){
    const c = fresh[n];
    if((correctCount[c]||0) >= RETIRE_AT) continue;
    if(dueAt[c] !== undefined && qCount < dueAt[c]) continue;
    i = c; fresh.splice(n,1); break;
  }
  if(i === null){
    refill();
    const open = fresh.filter(x => (correctCount[x]||0) < RETIRE_AT);
    i = open.length ? open[(Math.random()*open.length)|0] : fresh[0];
    const at = fresh.indexOf(i); if(at>=0) fresh.splice(at,1);
  }
  return i;
}
function pickRepeat(){
  const last = seen[seen.length-1];
  const p = missed.filter(i => i !== last && qCount >= (dueAt[i]||0) && (correctCount[i]||0) < RETIRE_AT);
  return p.length ? p[(Math.random()*p.length)|0] : null;
}
const setCleared = () => pool.length && pool.every((_,i)=>(correctCount[i]||0) >= RETIRE_AT);

/* ── RENDER ── */
function paintYou(){
  const pct = clamp(youHP / YOU_MAX * 100, 0, 100);
  $('youFill').style.width = pct + '%';
  $('youFill').classList.toggle('low', pct < 30);
  $('youNum').textContent = Math.max(0, youHP);
}

function paintRings(active){
  $('ringRow').innerHTML = TYPES.map(t =>
    '<div class="ring' + (t===active?' lit':'') + '" data-t="' + t + '" ' +
      'style="--rim:' + RIM[t] + '">' +
      '<span class="rlabel">' + SHORT[t] + '</span></div>').join('');
  $('ringCap').innerHTML = active
    ? active.toUpperCase() + '<span class="sub">' + CAPTION[active] + '</span>' : '';
}

function paintSentence(){
  const it = curItem;
  let n = -1;
  const html = it.cue.replace(/_____/g, () => {
    n++;
    const g = it.gaps[n], v = picked[n];
    return '<button class="cap-slot' + (v?' filled':'') + '" data-g="' + n + '" type="button">' +
           esc(v || g.hint) + '</button>';
  });
  $('sentence').innerHTML = html;
  $('sentence').querySelectorAll('.cap-slot').forEach(b =>
    b.addEventListener('click', () => openPicker(+b.dataset.g)));
}

function openPicker(n){
  if(resolved) return;
  firstTouch();
  openGap = n;
  const g = curItem.gaps[n];
  $('pickerHead').textContent = (g.role === 'if' ? 'if-clause' : 'result') + ' · ' + g.hint;
  /* Options are shuffled per gap. Unshuffled they are always base / past /
     participle, and a student learns the POSITION rather than the form. */
  $('pickerList').innerHTML = shuffle(g.options).map(o =>
    '<button class="pick" type="button">' + esc(o) + '</button>').join('');
  $('pickerList').querySelectorAll('.pick').forEach(b =>
    b.addEventListener('click', () => choose(b.textContent)));
  const slot = $('sentence').querySelector('.cap-slot[data-g="' + n + '"]');
  $('sentence').querySelectorAll('.cap-slot').forEach(b =>
    b.classList.toggle('open', +b.dataset.g === n));
  $('picker').classList.add('open');
  placePop(slot);
}

/* Put the tooltip beside the gap it belongs to: below when there is room,
   flipped above when there is not, and clamped so it never runs off the side
   of a phone. The pointer stays over the gap even after the card is clamped,
   which is the whole reason a student can tell WHICH gap it is for. */
function placePop(slot){
  const pop = $('pop');
  if(!slot || !pop) return;
  pop.classList.remove('above','below');
  pop.style.visibility = 'hidden';
  pop.style.left = '0px'; pop.style.top = '0px';
  requestAnimationFrame(() => {
    const r = slot.getBoundingClientRect();
    const p = pop.getBoundingClientRect();
    const M = 8;                                   /* margin from the edges */
    const below = r.bottom + 10 + p.height <= window.innerHeight - M;
    const top = below ? r.bottom + 10 : r.top - 10 - p.height;
    let left = r.left + r.width / 2 - p.width / 2;
    left = clamp(left, M, Math.max(M, window.innerWidth - p.width - M));
    pop.style.top = Math.max(M, top) + 'px';
    pop.style.left = left + 'px';
    /* the arrow follows the GAP, not the card */
    pop.style.setProperty('--ax', clamp(r.left + r.width/2 - left, 14, p.width - 14) + 'px');
    pop.classList.add(below ? 'below' : 'above');
    pop.style.visibility = '';
  });
}
function closePicker(){
  $('picker').classList.remove('open');
  $('sentence').querySelectorAll('.cap-slot').forEach(b => b.classList.remove('open'));
  openGap = -1;
}
function choose(value){
  picked[openGap] = value;
  sfxTap(); vibrate(12);
  closePicker();
  paintSentence();
  /* Both gaps filled resolves itself — but not instantly. A student who fills
     the second and immediately sees the first is wrong needs a moment to
     change it, so any tap inside the window cancels. */
  if(picked[0] && picked[1] && !resolved){
    clearTimeout(autoT);
    autoT = setTimeout(() => { if(!resolved) resolve(); }, 900);
  }
}
let autoT = null;

/* ── ROUND ── */
function startRun(){
  const s = SETS[setIdx];
  pool = s.items;
  score=0; streak=0; bestStreak=0; gapsRight=0; gapsWrong=0; youHP=YOU_MAX;
  seen=[]; missed=[]; qCount=0; correctCount={}; dueAt={}; fresh=[];
  answerLog.length = 0;
  TYPES.forEach(t => byType[t] = {right:0,wrong:0});
  roundEnd=0; roundMs=0;
  $('score').textContent='0'; setStreak(0);
  $('idle').style.display='none';
  $('rings').style.display='flex';
  $('you').style.display='flex';
  $('pad').style.display='flex';
  paintYou();
  $('over').classList.remove('show');
  showGate(s);
}
function showGate(s){
  $('gateSet').textContent = s.label;
  $('gateMode').textContent = mode==='practice' ? 'No clock' : mode + ' seconds';
  $('gateSecs').textContent = mode==='practice' ? '∞' : mode;
  $('gate').classList.add('show');
  document.body.classList.add('gated');
}
function beginRound(){
  $('gate').classList.remove('show');
  document.body.classList.remove('gated');
  running = true;
  document.body.classList.add('playing');
  if(mode !== 'practice'){
    const secs = parseInt(mode,10);
    roundMs = isFinite(secs) ? secs*1000 : 90000;
    roundEnd = performance.now() + roundMs;
  }
  nextItem();
  if(rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(loop);
}
function nextItem(){
  qCount++;
  clearTimeout(autoT);
  let i = null;
  if(qCount % REPEAT_EVERY === 0 && seen.length >= 2) i = pickRepeat();
  if(i === null){ i = pickNext(); seen.push(i); }
  curItem = pool[i]; curItem._i = i;
  picked = [null,null];
  resolved = false;
  paintRings(curItem.type);
  paintSentence();
  $('fbNote').textContent=''; $('fbNote').className='fbnote';
}

function loop(now){
  if(!running) return;
  if(mode !== 'practice'){
    const left = Math.max(0, roundEnd - now);
    const pct = roundMs ? clamp(left/roundMs,0,1) : 0;
    /* The sweep lives on the LIT ring — the object being looked at is the one
       counting down, which is what Forge's dial does. */
    const lit = $('ringRow').querySelector('.ring.lit');
    if(lit){
      lit.style.setProperty('--pct', (pct*100).toFixed(1));
      lit.classList.toggle('low', left <= 10000);
    }
    if(left <= 0){ finish(gapsRight > gapsWrong ? 'win':'loss'); return; }
  }
  rafId = requestAnimationFrame(loop);
}

function resolve(){
  if(resolved || !curItem) return;
  resolved = true;
  clearTimeout(autoT);
  const it = curItem, i = it._i;
  const slots = $('sentence').querySelectorAll('.cap-slot');
  let right = 0;

  it.gaps.forEach((g,n) => {
    const ok = picked[n] === g.answer;
    if(ok) right++;
    slots[n].classList.add('locked', ok ? 'right' : 'wrong');
    slots[n].textContent = g.answer;   /* the correct form, always shown */
  });
  gapsRight += right; gapsWrong += (2 - right);
  youHP = clamp(youHP - (2 - right) * YOU_HIT, 0, YOU_MAX);
  paintYou();
  byType[it.type].right += right; byType[it.type].wrong += (2 - right);

  const both = right === 2;
  noteResult(it, both);
  try{ if(window.INTUITY) INTUITY.log('conditionals', it.id, both, {game:'decide'}); }catch(e){}

  answerLog.push({ ok:both, type:it.type, cue:it.cue,
                   answers:it.gaps.map(g=>g.answer), chose:picked.slice() });

  if(both){
    streak++; bestStreak = Math.max(bestStreak,streak);
    const mult = streak>=15?2.2:streak>=10?1.7:streak>=5?1.3:1;
    score += Math.round(100*mult);
    const mi = missed.indexOf(i); if(mi>=0) missed.splice(mi,1);
    correctCount[i] = (correctCount[i]||0)+1;
    dueAt[i] = qCount + (correctCount[i]>=RETIRE_AT ? 9999 : GAP_AFTER_ONE);
    sfxGood(); vibrate(20);
  }else{
    streak = 0;
    if(!missed.includes(i)) missed.push(i);
    correctCount[i] = 0; dueAt[i] = qCount + GAP_AFTER_MISS;
    sfxBad(); vibrate([50,40,60]);
    /* half right is worth saying: it is the commonest B2 error and the
       student cannot see it from two colours alone */
    if(right === 1) score += 30;
  }
  showNote(it, right);
  setStreak(streak); $('score').textContent = score;
  $('tapStart').classList.add('gone');

  if(youHP <= 0){ setTimeout(()=>finish('loss'), 900); return; }
  if(setCleared()){ setTimeout(()=>finish('win'), 800); return; }
  setTimeout(()=>{ if(running) nextItem(); }, both ? 900 : 1900);
}

/* Corrective feedback while the sentence is still in mind. When a form is
   wrong, name the conditional the student actually produced — "you wrote the
   second" is far more use than "wrong". */
function whichColumn(gap, value){
  const n = gap.options.indexOf(value);
  if(n < 0) return '';
  return gap.role === 'if'  ? ['present','past','past perfect'][n]
                            : ['will','would','would have'][n];
}
function showNote(it, right){
  const el = $('fbNote');
  if(right === 2){
    el.innerHTML = '<b>' + esc(it.gaps.map(g=>g.answer).join(' … ')) + '</b>';
    el.className = 'fbnote show';
    return;
  }
  const bits = it.gaps.map((g,n) => {
    if(picked[n] === g.answer) return null;
    const got = whichColumn(g, picked[n]);
    return (g.role==='if'?'if-clause':'result') + ': you chose ' +
           (got ? got : esc(picked[n]||'nothing'));
  }).filter(Boolean);
  el.innerHTML = '<b>' + esc(it.gaps.map(g=>g.answer).join(' … ')) + '</b> — ' + bits.join(', ');
  el.className = 'fbnote show bad';
}

function setStreak(n){
  const el = $('streak');
  el.textContent = '×' + (1+Math.floor(n/5)) + (n?'  '+n:'');
  el.classList.toggle('live', n>=5);
  el.classList.add('pop'); setTimeout(()=>el.classList.remove('pop'),150);
}

/* ── SUMMARY ── */
const SECONDS_PER_Q = 11;   /* two taps and two picker opens per item */
function expected(){
  if(mode==='practice') return 0;
  const s = parseInt(mode,10);
  return isFinite(s) ? Math.max(3, Math.round(s/SECONDS_PER_Q)) : 0;
}
function scale(acc){
  const A=[[0,140],[.60,160],[.72,173],[.80,180],[1,190]];
  for(let i=1;i<A.length;i++){ const [a0,s0]=A[i-1],[a1,s1]=A[i];
    if(acc<=a1) return Math.round(s0+(acc-a0)/(a1-a0)*(s1-s0)); }
  return 190;
}
const grade = s => s>=180?['A','Excellent']:s>=173?['B','Very good']:s>=160?['C','Pass']:['D','Try again'];

function finish(outcome){
  running = false; cancelAnimationFrame(rafId); clearTimeout(autoT);
  document.body.classList.remove('playing');
  try{ if(window.INTUITY) INTUITY.session('conditionals','decide',
        {right:gapsRight,wrong:gapsWrong,best:bestStreak,score,outcome}); }catch(e){}
  outcome==='win' ? sfxWin() : sfxLose();

  const total = gapsRight + gapsWrong, acc = total ? gapsRight/total : 0;
  const items = Math.round(total/2);
  const cov = expected() ? Math.min(1, items/expected()) : 1;
  const practice = mode==='practice';
  const sc = scale(acc*cov), [letter,word] = grade(sc);

  $('ovOutcome').className = 'outcome ' + (outcome==='win'?'win':'loss');
  $('ovOutcome').textContent = outcome==='win' ? 'Round cleared' : 'Time up';
  if(practice){
    $('ovScore').className='score g-p';
    $('ovScore').innerHTML = Math.round(acc*100) + '<span class="gr">%</span>';
    $('ovSet').textContent = 'Practice · ' + SETS[setIdx].label;
  }else{
    $('ovScore').className='score g-'+letter.toLowerCase();
    $('ovScore').innerHTML = sc + '<span class="gr">'+letter+'</span>';
    $('ovSet').textContent = word + ' · ' + SETS[setIdx].label;
  }
  $('ovNote').innerHTML = '<b>'+gapsRight+'</b> of <b>'+total+'</b> verbs right · ' +
    '<b>'+items+'</b> sentences · best streak <b>'+bestStreak+'</b>' +
    ' · composure <b>'+Math.max(0,youHP)+'</b>' +
    (!practice && expected() && items < expected()
      ? ' · a fuller round scores higher' : '');

  /* grouped by conditional — the line a teacher reads before a lesson */
  $('ovByType').innerHTML = TYPES.map(t => {
    const b = byType[t], n = b.right + b.wrong;
    if(!n) return '';
    const pct = Math.round(b.right/n*100);
    return '<div class="tline"><span class="nm">'+t+'</span>' +
           '<span class="tbar"><span style="width:'+pct+'%"></span></span>' +
           '<span class="tnum">'+b.right+'/'+n+'</span></div>';
  }).join('');

  $('ovReview').hidden = true;
  setReviewLabel(false);
  buildTabs();
  $('over').classList.add('show');
}

function setReviewLabel(open){
  const n = answerLog.filter(a=>!a.ok).length;
  $('reviewBtn').innerHTML = (open?'Hide answers':'Check your answers') +
    (!open && n ? '<span class="cnt">'+n+' wrong</span>' : '');
}
function renderReview(){
  const box = $('ovReview');
  if(!answerLog.length){ box.innerHTML = '<div class="rv">Nothing answered.</div>'; return; }
  const bad = answerLog.filter(a=>!a.ok), good = answerLog.filter(a=>a.ok);
  const row = a => {
    let n = -1;
    const s = a.cue.replace(/_____/g, () => { n++; return '<b>'+esc(a.answers[n])+'</b>'; });
    const chose = a.ok ? '' :
      '<span class="rv-chose">you chose ' + a.chose.map(c=>esc(c||'—')).join(' … ') + '</span>';
    return '<div class="rv'+(a.ok?'':' bad')+'"><span class="rv-mark">'+(a.ok?'✓':'✕')+
           '</span><span>'+s+chose+'</span></div>';
  };
  box.innerHTML =
    (bad.length  ? '<div class="rv-head">Got wrong ('+bad.length+')</div>'+bad.map(row).join('') : '') +
    (good.length ? '<div class="rv-head">Got right ('+good.length+')</div>'+good.map(row).join('') : '');
}

/* ── TABS ── */
function buildTabs(){
  const mem = loadMem(), wrap = $('setTabs');
  wrap.innerHTML = '';
  SETS.forEach((s,i) => {
    const due = s.items.some(it => (mem[it.id]?.miss||0) > 0);
    const played = s.items.some(it => mem[it.id]);
    const b = document.createElement('button');
    b.className = 'vtab' + (i===setIdx?' active':'') + (due?' has-due':'') +
                  (played && !due ? ' cleared':'');
    b.innerHTML = esc(s.label) + '<span class="due"></span>';
    b.onclick = () => { if(i===setIdx) return; switchSet(i); };
    wrap.appendChild(b);
  });
  syncHeader();
}
function switchSet(i){
  setIdx = i;
  buildTabs();
  const u = new URL(location.href); u.searchParams.set('set', SETS[i].id);
  history.replaceState(null,'',u);
  startRun();
}

/* ── EVENTS ── */
function firstTouch(){ if(started) return; started = true; audio(); }
function exitToEntry(){
  running = false; if(rafId) cancelAnimationFrame(rafId); clearTimeout(autoT);
  document.body.classList.remove('playing','gated');
  $('over').classList.remove('show');
  $('gate').classList.remove('show');
  closePicker();
  setIdx = -1;
  const u = new URL(location.href); u.searchParams.delete('set');
  history.replaceState(null,'',u);
  buildTabs();
  $('idle').style.display='flex';
  $('rings').style.display='none';
  $('you').style.display='none';
  $('pad').style.display='none';
}
$('exitBtn').addEventListener('click', exitToEntry);
$('closeX').addEventListener('click', exitToEntry);
$('over').addEventListener('click', e => { if(e.target===$('over')) exitToEntry(); });
$('picker').addEventListener('click', e => { if(e.target===$('picker')) closePicker(); });
document.addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  if($('picker').classList.contains('open')){ closePicker(); return; }
  exitToEntry();
});
$('gateGo').addEventListener('click', () => { firstTouch(); beginRound(); });
$('idleStart').addEventListener('click', () => { if(SETS.length){ firstTouch(); switchSet(0); } });
$('againBtn').addEventListener('click', () => { $('over').classList.remove('show'); startRun(); });
$('nextBtn').addEventListener('click', () => switchSet((setIdx+1)%SETS.length));
$('reviewBtn').addEventListener('click', () => {
  const box = $('ovReview'), open = !box.hidden;
  if(!open) renderReview();
  box.hidden = open;
  setReviewLabel(!open);
  if(!open) requestAnimationFrame(() => {
    const card = box.closest('.over-card');
    if(card) card.scrollTo({top: box.offsetTop - 56, behavior:'smooth'});
  });
});
$('hubBtn').addEventListener('click', () => { (window.top||window).location.href='/?openModal=grammar'; });
$('modes').querySelectorAll('.mbtn').forEach(b => b.addEventListener('click', () => {
  mode = b.dataset.m; localStorage.setItem('intuity-decide-mode', mode);
  document.querySelectorAll('.mbtn').forEach(x => x.classList.toggle('on', x.dataset.m===mode));
  if(SETS.length && setIdx >= 0) startRun();
}));
document.querySelectorAll('.mbtn').forEach(b => b.classList.toggle('on', b.dataset.m===mode));
$('muteBtn').addEventListener('click', () => {
  sound = !sound; localStorage.setItem('intuity-decide-sound', sound?'on':'off');
  $('muteBtn').textContent = sound ? '🔊' : '🔈';
});
$('muteBtn').textContent = sound ? '🔊' : '🔈';

function syncHeader(){
  const h = document.querySelector('.header');
  if(h) document.documentElement.style.setProperty('--header-h', h.offsetHeight+'px');
}
window.addEventListener('resize', () => { syncHeader(); if(openGap >= 0) closePicker(); });
window.addEventListener('scroll', () => { if(openGap >= 0) closePicker(); }, true);
window.addEventListener('orientationchange', ()=>setTimeout(syncHeader,120));
if(document.fonts && document.fonts.ready) document.fonts.ready.then(syncHeader);
if(window.ResizeObserver){ const h=document.querySelector('.header');
  if(h) new ResizeObserver(syncHeader).observe(h); }

/* ── BOOT ── */
async function boot(){
  let data;
  try{
    const res = await fetch(DATA_URL, { cache:'no-store' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    data = await res.json();
  }catch(e){
    $('loading').innerHTML = '<p class="err">Couldn\'t load <b>'+DATA_URL+'</b> ('+
      esc(String(e.message||e))+').<br>Run build_conditionals_game.py to produce it.</p>';
    return;
  }
  const sets = (data.sets||[]).filter(s => TYPES.indexOf(s.id) >= 0 && s.items && s.items.length);
  if(!sets.length){
    $('loading').innerHTML = '<p class="err">No usable sets — expected ids ' + TYPES.join(', ') + '.</p>';
    return;
  }
  /* ALL comes first: mixing the four types is the point, and practising one
     in isolation is the fallback for a student who is shaky on it. */
  SETS = [{ id:'all', label:'All four',
            items: sets.reduce((a,s)=>a.concat(s.items), []) }].concat(sets);

  const want = (new URLSearchParams(location.search).get('set')||'').toLowerCase();
  const found = want ? SETS.findIndex(s => s.id.toLowerCase()===want) : -1;
  buildTabs();
  syncHeader();
  $('loading').style.display='none';
  if(found >= 0){ setIdx = found; buildTabs(); startRun(); }
}
boot();
</script>
