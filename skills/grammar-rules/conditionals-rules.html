<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INTUITY - Conditionals</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #0d0d0d;
      background-image: radial-gradient(circle at 20% 50%, rgba(201, 169, 97, 0.04) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(201, 169, 97, 0.03) 0%, transparent 50%);
      color: #e5e5e5;
      min-height: 100vh;
      padding: 1rem;
      overflow-x: hidden;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      position: relative;
    }

    /* TOP NAVIGATION */
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 0;
      margin-bottom: 1rem;
      gap: 1rem;
      opacity: 0;
      animation: fadeInDown 0.8s ease forwards;
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      min-width: 100px;
    }

    .nav-link {
      color: #8e8e93;
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      transition: color 0.3s ease;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 0.375rem;
    }

    .nav-link:hover {
      color: #C9A961;
    }

    .nav-center {
      flex: 1;
      text-align: center;
    }

    .nav-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      color: #C9A961;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #C9A961 0%, rgba(201, 169, 97, 0.7) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .nav-right {
      min-width: 100px;
    }

    /* HEADER */
    /* Compact header, after tenses-rules.html. The page previously spent
       ~380px before the first sentence; the content is the point, so the
       chrome gives way to it. */
    header {
      text-align: center;
      margin-bottom: 0.6rem;
      padding: 0.15rem 0;
      opacity: 0;
      animation: fadeIn 0.8s ease 0.2s forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .subtitle {
      font-size: 0.62rem;
      color: #8e8e93;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 0.2rem;
    }

    /* MODE SELECTOR */
    .mode-selector-container {
      display: flex;
      justify-content: center;
      margin-bottom: 0.55rem;
      opacity: 0;
      animation: fadeIn 0.8s ease 0.4s forwards;
    }

    .mode-selector {
      display: flex;
      background: rgba(28, 28, 30, 0.6);
      backdrop-filter: blur(40px);
      border-radius: 999px;
      border: 1px solid rgba(201, 169, 97, 0.2);
      overflow: hidden;
    }

    .mode-option {
      padding: 0.625rem 1.25rem;
      background: transparent;
      border: none;
      color: #636366;
      cursor: pointer;
      font-size: 0.8125rem;
      font-weight: 600;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border-right: 1px solid rgba(84, 84, 88, 0.2);
    }

    .mode-option:last-child {
      border-right: none;
    }

    .mode-option:hover {
      color: #9ca3af;
      background: rgba(201, 169, 97, 0.1);
    }

    .mode-option.active {
      color: #C9A961;
      background: rgba(201, 169, 97, 0.15);
    }

    /* VIEW MODE TOGGLE */
    .view-mode-container {
      display: flex;
      justify-content: center;
      margin-bottom: 1.5rem;
      opacity: 0;
      animation: fadeIn 0.8s ease 0.6s forwards;
    }

    .view-mode-container.hidden {
      display: none;
    }

    .toggle-container {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: rgba(28, 28, 30, 0.6);
      backdrop-filter: blur(40px);
      padding: 0.75rem 1.5rem;
      border-radius: 999px;
      border: 1px solid rgba(201, 169, 97, 0.2);
    }

    .toggle-label {
      font-size: 0.875rem;
      color: #636366;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: color 0.3s;
    }

    .toggle-label.active {
      color: #C9A961;
    }

    .toggle-switch {
      position: relative;
      width: 56px;
      height: 30px;
      background: rgba(28, 28, 30, 0.8);
      border: 1px solid rgba(84, 84, 88, 0.3);
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .toggle-switch:hover {
      border-color: rgba(201, 169, 97, 0.4);
    }

    .toggle-slider {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 22px;
      height: 22px;
      background: #C9A961;
      border-radius: 50%;
      transition: all 0.3s ease;
      box-shadow: 0 2px 8px rgba(201, 169, 97, 0.4);
    }

    .toggle-switch.active .toggle-slider {
      transform: translateX(26px);
    }

    /* TABS CONTAINER */
    .tabs-container {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 0.9rem;
      opacity: 0;
      animation: fadeIn 0.8s ease 0.8s forwards;
    }

    .tabs-container.hidden {
      display: none;
    }

    .tab {
      padding: 0.375rem 0.625rem;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      border-radius: 0;
      color: #636366;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 500;
      transition: all 0.2s ease;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .tab:hover {
      color: #C9A961;
      border-bottom-color: rgba(201, 169, 97, 0.3);
    }

    .tab.active {
      color: #C9A961;
      border-bottom-color: #C9A961;
      font-weight: 600;
    }

    /* CONTENT AREAS */
    .content-area {
      display: none;
    }

    .content-area.active {
      display: block;
    }

    /* WATCH MODE */
    /* .watch-mode retired with the WATCH panel. */

    .modal-card {
      background: #000;
      border: 1px solid rgba(201, 169, 97, 0.3);
      border-radius: 1.5rem;
      padding: 3.5rem 3rem;
      min-height: 550px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8),
                  0 0 40px rgba(201, 169, 97, 0.1);
      opacity: 0;
      transform: scale(0.95);
      animation: cardAppear 0.8s ease 1.2s forwards;
    }

    @keyframes cardAppear {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    /* SOUND ICON */
    .sound-icon {
      position: absolute;
      top: 2rem;
      right: 2rem;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(28, 28, 30, 0.6);
      border: 1px solid rgba(201, 169, 97, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 1.25rem;
      z-index: 10;
    }

    .sound-icon:hover {
      background: rgba(201, 169, 97, 0.2);
      border-color: rgba(201, 169, 97, 0.5);
      transform: scale(1.05);
    }

    .sound-icon.active {
      color: #C9A961;
      border-color: rgba(201, 169, 97, 0.5);
    }

    .sound-icon.muted {
      color: #636366;
      opacity: 0.6;
    }

    .card-content {
      text-align: center;
      width: 100%;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .card-content.show {
      opacity: 1;
    }

    .expression {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.375rem;
      color: #C9A961;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 2.5rem;
      font-weight: 600;
      padding: 0.75rem 1.5rem;
      background: rgba(201, 169, 97, 0.1);
      border-radius: 0.625rem;
      display: inline-block;
    }

    .examples-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
      max-width: 800px;
    }

    .example-item-watch {
      font-size: 1.5rem;
      line-height: 1.6;
      color: #e5e5e7;
      font-weight: 400;
      text-align: left;
      padding: 0.75rem 1rem;
      background: rgba(60, 60, 64, 0.2);
      border-radius: 0.5rem;
      border-left: 3px solid rgba(96, 165, 250, 0.3);
    }

    .sentence-container {
      margin-bottom: 2rem;
    }

    .sentence-label {
      font-size: 0.875rem;
      color: #636366;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 1rem;
      font-weight: 600;
      font-family: 'Space Grotesk', sans-serif;
    }

    .sentence {
      font-size: 1.75rem;
      line-height: 1.6;
      color: #e5e5e7;
      font-weight: 400;
      margin-bottom: 2rem;
    }

    /* Marked words, not boxes. A chip per verb turned every sentence into
       a row of buttons; weight and colour are enough to pick them out and
       the sentence stays a sentence. */
    .highlight {
      color: #60a5fa;
      font-weight: 600;
      background: none;
      padding: 0;
      border-radius: 0;
    }

    .arrow {
      font-size: 2rem;
      color: #C9A961;
      margin: 1.5rem 0;
      opacity: 0.6;
    }

    /* CONTROLS */
    .controls {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-top: 3rem;
    }

    .control-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(28, 28, 30, 0.6);
      border: 1px solid rgba(201, 169, 97, 0.3);
      color: #C9A961;
      font-size: 1.25rem;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      backdrop-filter: blur(20px);
    }

    .control-btn:hover:not(:disabled) {
      background: rgba(201, 169, 97, 0.2);
      transform: scale(1.05);
      box-shadow: 0 4px 16px rgba(201, 169, 97, 0.3);
      border-color: rgba(201, 169, 97, 0.5);
    }

    .control-btn:active {
      transform: scale(0.95);
    }

    .control-btn:disabled {
      opacity: 0.2;
      cursor: not-allowed;
    }

    .control-btn.play {
      width: 72px;
      height: 72px;
      background: rgba(201, 169, 97, 0.15);
      border: 2px solid rgba(201, 169, 97, 0.4);
    }

    /* PROGRESS */
    .progress {
      position: absolute;
      bottom: 2rem;
      left: 2rem;
      font-size: 1rem;
      color: #636366;
      font-weight: 600;
    }

    .progress .current {
      color: #C9A961;
      font-size: 1.375rem;
    }

    /* LIST MODE */
    .list-mode {
      display: none;
    }

    .list-mode.show {
      display: block;
      opacity: 0;
      animation: fadeIn 0.8s ease 1.2s forwards;
    }

    .list-container {
      display: flex;
      flex-direction: column;
      gap: 2rem;
      padding-bottom: 2rem;
    }

    .list-item {
      background: rgba(28, 28, 30, 0.6);
      backdrop-filter: blur(40px);
      border: 1px solid rgba(201, 169, 97, 0.2);
      border-radius: 1.25rem;
      padding: 2rem;
      transition: all 0.3s ease;
    }

    .list-item:hover {
      border-color: rgba(201, 169, 97, 0.4);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    /* No filled bar: tenses sets the section title as plain gold text, so
       the EXPLORE badge sits beside type rather than beside a block. */
    .list-expression {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.02rem;
      color: #C9A961;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0;
      font-weight: 600;
      padding: 0;
      background: none;
      border-radius: 0.5rem;
      display: inline-block;
    }

    .list-sentences {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .list-example {
      font-size: 1.125rem;
      line-height: 1.6;
      color: #e5e5e7;
      font-weight: 400;
      padding: 0.75rem;
      background: rgba(60, 60, 64, 0.2);
      border-radius: 0.5rem;
      border-left: 2px solid rgba(96, 165, 250, 0.3);
    }

    /* IFRAME CONTAINER */
    .iframe-container {
      width: 100%;
      min-height: calc(100vh - 250px);
      border: none;
      border-radius: 1.5rem;
      overflow: hidden;
    }

    .iframe-container iframe {
      width: 100%;
      height: 100%;
      min-height: calc(100vh - 250px);
      border: none;
    }

    /* MOBILE RESPONSIVE */
    @media (max-width: 768px) {
      body { padding: 0.75rem; }
      .nav-title { font-size: 1.25rem; }
      .subtitle { font-size: 0.75rem; }
      .mode-option { font-size: 0.7rem; padding: 0.5rem 0.875rem; }
      .tab { font-size: 0.65rem; padding: 0.25rem 0.5rem; }
      .modal-card { padding: 2rem 1.5rem; min-height: 450px; }
      .sound-icon { top: 1rem; right: 1rem; width: 44px; height: 44px; font-size: 1.125rem; }
      .expression { font-size: 1rem; padding: 0.5rem 1rem; margin-bottom: 1.5rem; }
      .example-item-watch { font-size: 1.125rem; }
      .control-btn { width: 48px; height: 48px; font-size: 1.125rem; }
      .control-btn.play { width: 64px; height: 64px; }
      .progress { left: 1rem; bottom: 1rem; font-size: 0.875rem; }
      .progress .current { font-size: 1.125rem; }
      .list-item { padding: 1.5rem; }
      .list-expression { font-size: 0.9375rem; }
      .list-example { font-size: 1rem; }
    }

    @media (max-width: 480px) {
      body { padding: 0.5rem; }
      .nav-title { font-size: 1rem; }
      .subtitle { font-size: 0.65rem; }
      .mode-option { font-size: 0.625rem; padding: 0.4rem 0.75rem; }
      .tab { font-size: 0.6rem; padding: 0.2rem 0.4rem; }
      .modal-card { padding: 1.5rem 1rem; min-height: 380px; }
      .sound-icon { top: 0.75rem; right: 0.75rem; width: 40px; height: 40px; font-size: 1rem; }
      .expression { font-size: 0.875rem; padding: 0.375rem 0.75rem; }
      .example-item-watch { font-size: 1rem; }
      .control-btn { width: 44px; height: 44px; font-size: 1rem; }
      .control-btn.play { width: 56px; height: 56px; }
      .progress { left: 0.75rem; bottom: 0.75rem; font-size: 0.75rem; }
      .progress .current { font-size: 1rem; }
      .list-example { font-size: 0.9375rem; }
    }
  
/* ---------- map overlay (ported from tenses-rules.html) ---------- */
.map-modal{position:fixed;inset:0;z-index:60;background:rgba(8,8,9,.86);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;padding:1.25rem}
.map-modal.open{display:flex}
.map-shell{position:relative;width:min(760px,100%);height:100%;border-radius:1.1rem;overflow:hidden;
  background:#D7BAC4;box-shadow:0 24px 70px rgba(0,0,0,.6)}
.map-shell iframe{width:100%;height:100%;border:none;display:block}
.map-closex{position:absolute;top:.6rem;right:.6rem;z-index:5;width:34px;height:34px;border-radius:50%;
  border:none;cursor:pointer;background:rgba(0,0,0,.1);color:#000;font-size:1.1rem;line-height:1;
  display:flex;align-items:center;justify-content:center}
.map-closex:hover{background:rgba(0,0,0,.2)}
@media(max-width:768px){.map-modal{padding:0}.map-shell{border-radius:0}}

/* section head + EXPLORE pill, ported from tenses-rules.html so both
   topics offer the map the same way */
.list-head{display:flex;align-items:center;gap:.8rem;margin-bottom:.9rem}
.list-head .list-expression{margin-bottom:0;flex:1}
.explore-btn{flex:none;display:inline-flex;align-items:center;gap:.4rem;border:none;cursor:pointer;
  font-family:'Space Grotesk',sans-serif;font-size:.64rem;font-weight:800;letter-spacing:.05em;
  text-transform:uppercase;padding:.5rem .7rem .5rem 1rem;border-radius:999px;
  color:#12100a;background:linear-gradient(135deg,#ecd08e,#C9A961);
  box-shadow:0 3px 10px rgba(201,169,97,.35),inset 0 1px 0 rgba(255,255,255,.4);
  transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .25s}
.explore-btn:hover{transform:translateY(-2px) scale(1.05);
  box-shadow:0 6px 16px rgba(201,169,97,.5),inset 0 1px 0 rgba(255,255,255,.45)}
.explore-btn:active{transform:scale(.93)}
.explore-btn .icon-badge{display:inline-flex;align-items:center;justify-content:center;
  transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.explore-btn:hover .icon-badge{transform:rotate(18deg) scale(1.12)}
.list-mode{display:none}
.list-mode.show{display:block}
</style>
</head>
<body>
  <div class="container">
    
    <!-- TOP NAVIGATION -->
    <div class="top-nav">
      <div class="nav-left">
        <a href="../../index.html?openModal=grammar" class="nav-link">← Grammar</a>
      </div>
      <div class="nav-center">
        <div class="nav-title">INTUITY</div>
      </div>
      <div class="nav-right"></div>
    </div>

    <!-- HEADER -->
    <header>
      <p class="subtitle">B2 First Conditionals · Interactive Grammar System</p>
    </header>

    <!-- MODE SELECTOR -->
    <div class="mode-selector-container">
      <div class="mode-selector">
        <button class="mode-option active" data-mode="explore">
          🗺️ <span>EXPLORE</span>
        </button>
        <button class="mode-option" data-mode="practice">
          ✍️ <span>PRACTICE</span>
        </button>
        <button class="mode-option" data-mode="quiz">
          📝 <span>QUIZ</span>
        </button>
      </div>
    </div>

    <!-- VIEW MODE TOGGLE (Only visible in EXPLORE) -->
    <!-- WATCH/LIST toggle removed: the page is LIST-first, and each section
         carries its own EXPLORE pill into the map. Matches tenses-rules.html. -->

    <div class="tabs-container" id="tabsContainer"></div>

    <!-- EXPLORE MODE CONTENT -->
    <div class="content-area active" id="exploreArea">
      <!-- WATCH MODE -->
      <!-- WATCH panel removed. It was previously hidden via the `hidden`
           attribute, but .watch-mode{display:block} in the stylesheet
           overrode it — `hidden` is only a UA default and loses to any
           real CSS display rule. Deleting the markup is unambiguous. -->

      <div class="list-mode show" id="listMode">
        <div class="list-container" id="listContainer"></div>
      </div>
    </div>

    <!-- PRACTICE MODE CONTENT -->
    <div class="content-area" id="practiceArea">
      <div class="iframe-container">
        <iframe id="practiceIframe" src=""></iframe>
      </div>
    </div>

    <!-- QUIZ MODE CONTENT -->
    <div class="content-area" id="quizArea">
      <div class="iframe-container">
        <iframe id="quizIframe" src=""></iframe>
      </div>
    </div>

  </div>

<!-- Map overlay: same shell as tenses-rules.html so both topics open the
     map the same way. The ground colour is the map's own; this is only
     the frame around it. -->
<div class="map-modal" id="mapModal">
  <div class="map-shell">
    <button class="map-closex" id="mapCloseX" type="button" aria-label="Close">&times;</button>
    <iframe id="mapFrame" src="" title="Conditionals map"></iframe>
  </div>
</div>

  <script>
    /* ── map wiring, matching tenses-rules.html ──
       PLAY is the map page; JSON_URL is overridable so a page can be
       pointed at a different data file without editing this file. */
    const PLAY = 'conditionals-play.html';
    const DEF_JSON = '../../data/grammar-rules/conditionals-data.json';
    const QP = new URLSearchParams(location.search);
    const JSON_URL = QP.get('json') || DEF_JSON;

    /* before/after here are two orderings of the SAME sentence, not a
       transformation. 'before' is the canonical if-first form. This single
       constant drives BOTH the list below and the map, so the two surfaces
       can never disagree — flip it to 'after' to show result-first. */
    const PRIMARY = 'before';

    // The map holds six nodes, so a set longer than that becomes several
    // sections there. Section indices must account for that or a long set
    // would open the wrong page.
    const MAX_PER_SECTION = 6;
    function sectionIndexOf(tab, setIdx){
      let n = 0;
      for(let i = 0; i < setIdx; i++){
        const len = (tab.sets[i].examples || []).length;
        n += Math.max(1, Math.ceil(len / MAX_PER_SECTION));
      }
      return n;
    }

    // DATA STRUCTURE - Organized by tabs
    let rulesData = []; // Array of {title, sets: [{setTitle, examples}]}
    let currentTabData = []; // Current tab's examples flattened for slides

    // STATE
    let currentIndex = 0;
    let isPlaying = false;
    let playInterval = null;
    let viewMode = 'list';   // the only view now
    /* Speech synthesis was removed: it behaved unpredictably across school
   devices, and the students it was meant to help did not use it. */
    let soundEnabled = false;
    let currentUtterance = null;
    let speechFinished = true;
    let currentMainMode = 'explore';
    let currentTab = 0;

    // LOAD DATA
    /* The site launcher builds data URLs as <topic>-rules.json, which is
       right for tenses but wrong here: this topic's file is
       conditionals-data.json. Rather than depend on every caller getting
       the name right, try the requested file and fall back to the known
       good one. RESOLVED_JSON records which actually worked, so the map
       gets handed a URL that loads. */
    let RESOLVED_JSON = JSON_URL;

    async function fetchFirstAvailable(urls){
      let lastErr = null;
      for(const url of urls){
        try{
          const res = await fetch(url, { cache: 'no-store' });
          if(res.ok){ RESOLVED_JSON = url; return await res.json(); }
          lastErr = new Error(`HTTP ${res.status}`);
        }catch(e){ lastErr = e; }
      }
      throw lastErr || new Error('no data source responded');
    }

    async function loadData() {
      try {
        // requested first, then the canonical name, then the legacy one
        const candidates = [...new Set([JSON_URL, DEF_JSON,
                            '../../data/grammar-rules/conditionals.json'])];
        const payload = await fetchFirstAvailable(candidates);

        /* One file per topic now: the rules sections live under `rules`. */
        rulesData = payload.rules;
        if(!rulesData || !rulesData.length) throw new Error('no rules in data file');

        init();
        
      } catch (error) {
        console.error('Error loading data:', error);
        // The WATCH card is gone, so errors surface in the list instead.
        const errTarget = document.getElementById('listContainer');
        if (errTarget) errTarget.innerHTML = `
          <div style="color: #fb923c; text-align: center; padding: 2rem;">
            <div style="font-size: 2rem; margin-bottom: 1rem;">⚠️</div>
            <div>Failed to load conditionals</div>
            <div style="font-size:.8rem;opacity:.7;margin-top:.6rem">${error.message}</div>
          </div>
        `;
      }
    }

    // FLATTEN TAB DATA INTO SLIDES (one slide per SET)
    function flattenTabData(tabIndex) {
      const tab = rulesData[tabIndex];
      const slides = [];
      
      tab.sets.forEach(set => {
        // Collect all examples for this set
        const examples = [];
        set.examples.forEach(example => {
          const sentence = example.after.replace(/\*\*(.*?)\*\*/g, '$1').replace(/<<(.*?)>>/g, '<span class="highlight">$1</span>');
          examples.push(sentence);
        });
        
        slides.push({
          title: set.setTitle,
          examples: examples
        });
      });
      
      return slides;
    }

    // MAIN MODE SWITCHING
    function switchMainMode(mode) {
      if (mode === currentMainMode) return;
      
      currentMainMode = mode;
      
      if (isPlaying) pause();
      
      document.querySelectorAll('.mode-option').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === mode);
      });
      
      document.querySelectorAll('.content-area').forEach(area => {
        area.classList.remove('active');
      });
      
      // viewModeContainer was the WATCH/LIST switch; it no longer exists.
      const tabsContainer = document.getElementById('tabsContainer');

      if (mode === 'explore') {
        tabsContainer.classList.remove('hidden');
        document.getElementById('exploreArea').classList.add('active');
      } else {
        tabsContainer.classList.add('hidden');
        
        if (mode === 'practice') {
          document.getElementById('practiceArea').classList.add('active');
          const iframe = document.getElementById('practiceIframe');
          if (!iframe.src || !iframe.src.includes('conditionals-practice.html')) {
            iframe.src = 'conditionals-practice.html';
          }
        } else if (mode === 'quiz') {
          document.getElementById('quizArea').classList.add('active');
          const iframe = document.getElementById('quizIframe');
          if (!iframe.src || !iframe.src.includes('conditionals-gapfill.html')) {
            iframe.src = 'conditionals-gapfill.html';
          }
        }
      }
    }

    // SWITCH TAB
    function switchTab(tabIndex) {
      if (tabIndex === currentTab) return;
      
      currentTab = tabIndex;
      currentIndex = 0; // Reset to first slide
      
      if (isPlaying) pause();
      
      // Update tab styling
      document.querySelectorAll('.tab').forEach((tab, i) => {
        tab.classList.toggle('active', i === tabIndex);
      });
      
      // Load new tab data
      currentTabData = flattenTabData(currentTab);
      
      // Re-render
      buildListMode();
    }

    // INITIALIZE
    function init() {
      setupToggle();
      setupModeButtons();
      renderTabs();
      
      // Load first tab by default
      currentTabData = flattenTabData(0);
      
      buildListMode();
    }

    // RENDER TABS
    function renderTabs() {
      const container = document.getElementById('tabsContainer');
      container.innerHTML = '';
      
      rulesData.forEach((rule, index) => {
        const tab = document.createElement('div');
        tab.className = `tab ${index === currentTab ? 'active' : ''}`;
        tab.textContent = rule.title;
        tab.onclick = () => switchTab(index);
        container.appendChild(tab);
      });
    }

    // SETUP MODE BUTTONS
    function setupModeButtons() {
      document.querySelectorAll('.mode-option').forEach(btn => {
        btn.addEventListener('click', () => {
          switchMainMode(btn.dataset.mode);
        });
      });
    }

    /* setupToggle() removed along with the WATCH/LIST switch. Kept as a
       no-op so any existing call site stays safe. */
    function setupToggle(){}

    /* toggleSound() removed with the speech it controlled. */

    // BUILD LIST MODE (only current tab)
    function buildListMode() {
      const container = document.getElementById('listContainer');
      container.innerHTML = '';
      
      // Group by setTitle within current tab
      const tab = rulesData[currentTab];
      
      tab.sets.forEach((set, setIdx) => {
        const item = document.createElement('div');
        item.className = 'list-item';

        let html = `<div class="list-head">` +
                     `<div class="list-expression">${set.setTitle}</div>` +
                     `<button class="explore-btn" type="button">Explore<span class="icon-badge">\u{1F9ED}</span></button>` +
                   `</div>` +
                   `<div class="list-sentences">`;
        set.examples.forEach(example => {
          const raw = example[PRIMARY] != null ? example[PRIMARY] : example.after;
          const sentence = String(raw)
            .replace(/\*\*(.*?)\*\*/g, '$1')
            .replace(/<<(.*?)>>/g, '<span class="highlight">$1</span>');
          html += `<div class="list-example">${sentence}</div>`;
        });
        html += `</div>`;

        item.innerHTML = html;
        item.querySelector('.explore-btn')
            .addEventListener('click', () => openMap(sectionIndexOf(tab, setIdx)));
        container.appendChild(item);
      });
    }

    /* ── map open/close ──
       The rule id comes from the current tab, so the map opens on the same
       conditional the student is reading. section= is the set they tapped.
       primary= keeps the map's sentence ordering identical to the list. */
    function openMap(section){
      const tab = rulesData[currentTab] || {};
      const id  = tab.id || String(currentTab);
      document.getElementById('mapFrame').setAttribute('src',
        PLAY + '?rule=' + encodeURIComponent(id) +
        '&section=' + section +
        '&primary=' + PRIMARY +
        '&json=' + encodeURIComponent(RESOLVED_JSON));
      document.getElementById('mapModal').classList.add('open');
    }
    function closeMap(){
      document.getElementById('mapModal').classList.remove('open');
      document.getElementById('mapFrame').setAttribute('src','');
    }

    // RENDER WATCH SLIDE (only current tab, one SET per slide)
    /* WATCH mode is retired. The markup stays (hidden) so nothing that
       still references it can throw, but rendering is a no-op — otherwise
       the hidden slideshow keeps advancing and swallowing arrow keys. */
    function renderWatchSlide(){ /* WATCH panel removed; nothing to render. */ }
    /* renderWatchSlideImpl() deleted along with the WATCH panel it drew
       into. It referenced #expression, #current and #total, none of which
       exist any more — leaving it in place would have been a trap for
       whoever next called it. */


    // SPEAK (narrates title + all examples with pauses)
    /* Speech synthesis was removed: it behaved unpredictably across school
   devices, and the students it was meant to help did not use it. */
    function speak() {
      /* `speechFinished` must still be set, or watch mode waits forever
         for an utterance that will never arrive. */
      speechFinished = true;
    }

    // CONTROLS
    function repeatSlide() {
      if (isPlaying) pause();
      renderWatchSlide();
    }

    function togglePlay() {
      if (isPlaying) {
        pause();
      } else {
        play();
      }
    }

    function play() {
      isPlaying = true;
      const pb = document.getElementById('playBtn'), qb = document.getElementById('pauseBtn');
      if (pb) pb.textContent = '■';
      if (qb) qb.disabled = false;
      
      playInterval = setInterval(() => {
        if (soundEnabled && !speechFinished) {
          return;
        }
        
        if (!soundEnabled) {
          clearInterval(playInterval);
          setTimeout(() => {
            if (isPlaying) {
              advanceSlide();
              if (isPlaying) play();
            }
          }, 6000);
          return;
        }
        
        advanceSlide();
      }, 500);
    }

    function advanceSlide() {
      if (currentIndex < currentTabData.length - 1) {
        currentIndex++;
        renderWatchSlide();
      } else {
        pause();
        currentIndex = 0;
        renderWatchSlide();
      }
    }

    function pause() {
      isPlaying = false;
      const pb2 = document.getElementById('playBtn'), qb2 = document.getElementById('pauseBtn');
      if (pb2) pb2.textContent = '▶';
      if (qb2) qb2.disabled = true;
      
      if (playInterval) {
        clearInterval(playInterval);
        playInterval = null;
      }
      
      speechFinished = true;
    }

    // EVENT LISTENERS
    /* The WATCH transport (repeat/play/pause) was removed with the panel.
       These are bound only if the buttons exist — unguarded, they threw at
       top level and stopped the whole script before the list ever built. */
    ['repeatBtn','playBtn','pauseBtn'].forEach((id, i) => {
      const btn = document.getElementById(id);
      if (btn) btn.addEventListener('click', [repeatSlide, togglePlay, pause][i]);
    });

    document.addEventListener('keydown', (e) => {
      if (viewMode === 'watch' && currentMainMode === 'explore') {
        if (e.key === ' ') {
          e.preventDefault();
          togglePlay();
        }
        if (e.key === 'r' || e.key === 'R') {
          repeatSlide();
        }
        if (e.key === 'ArrowRight' && currentIndex < currentTabData.length - 1) {
          if (isPlaying) pause();
          currentIndex++;
          renderWatchSlide();
        }
        if (e.key === 'ArrowLeft' && currentIndex > 0) {
          if (isPlaying) pause();
          currentIndex--;
          renderWatchSlide();
        }
      }
    });


    // Initialize speech on first user interaction (iOS fix)
    let speechInitialized = false;
    function initializeSpeech() { /* speech removed */ }

    // START
    loadData();
    
    // Initialize speech on first click anywhere
    document.addEventListener('click', initializeSpeech, { once: true });

    /* ── map overlay listeners ──
       Backdrop, X, Escape, and the map's own "back to list" message: the
       map posts intuity:showList when its Back button is pressed, which is
       how the overlay closes from inside the iframe. Same contract as
       tenses-rules.html, so both topics behave identically. */
    document.getElementById('mapCloseX').addEventListener('click', closeMap);
    document.getElementById('mapModal').addEventListener('click', e => {
      if(e.target === document.getElementById('mapModal')) closeMap();
    });
    document.addEventListener('keydown', e => {
      if(e.key === 'Escape' && document.getElementById('mapModal').classList.contains('open')) closeMap();
    });
    window.addEventListener('message', e => {
      if(e.data && e.data.intuity === 'showList') closeMap();
    });
  </script>
</body>
</html>
