<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FAF7F2">
<title>INTUITY — Conditionals</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=2">

<style>
/* ═══ WHAT ONLY THIS PAGE OWNS ═══
   Everything shared — tokens, header, mode row, tabs, tile family, close
   control, sheets — comes from the shell. This page was previously ~1000
   lines of its own dark theme on #0d0d0d with a #C9A961 gold accent: the
   generation BEFORE the tenses rework, kept alive by copy-paste. It now
   carries only its reading surface.

   Roughly 40% of the old file was also dead: play(), pause(), advanceSlide(),
   playInterval, speak(), soundEnabled, speechFinished and an arrow-key
   handler, all driving a WATCH panel whose markup had already been deleted,
   plus a `viewMode` that could never be anything but 'list'. None of it is
   carried over. */

html,body{width:100%;height:100%;overflow:hidden}

.inner{max-width:720px;margin:0 auto;padding:.9rem 1rem 2.5rem;
  display:flex;flex-direction:column;gap:1.1rem}
.cards{display:flex;flex-direction:column;gap:1.1rem}
.card{background:none;border:none;border-radius:0;padding:.3rem 0 1.3rem}
.cards .card:first-child{padding-top:.6rem}

.card-head{display:flex;align-items:center;gap:.8rem;
  padding-bottom:.75rem;margin-bottom:.95rem;border-bottom:1px solid var(--rule)}
.uc-title{font-family:var(--f-display);font-weight:500;font-size:.96rem;
  line-height:1.3;color:#71827A;text-transform:uppercase;
  letter-spacing:.2em;margin-bottom:0;flex:1}

.explore-btn{flex:none;display:inline-flex;align-items:center;
  font-family:var(--f-display);font-size:.64rem;font-weight:800;
  letter-spacing:.06em;text-transform:uppercase;
  padding:.5rem 1rem;border-radius:var(--r-chip);
  color:#FFFFFF;background:var(--accent-ink);border:none;
  transition:transform .12s cubic-bezier(.2,.8,.2,1),background .2s}
.explore-btn:hover{background:#8F4E38}
.explore-btn:active{transform:scale(.94)}

.exs{display:flex;flex-direction:column;gap:.6rem}
.ex{font-size:1.02rem;line-height:1.55;color:var(--sentence);
  padding:.5rem 0 .5rem .9rem;border-left:1px solid var(--rule)}
/* The grammar being taught — brick, exactly as in Explore and the quiz. The
   old page used #60a5fa, a blue from no palette in this product. */
.ex .marker-inline{color:var(--target);font-weight:700}

.subtitle-line{font-size:.8rem;color:var(--faint);margin:-.4rem 0 .2rem}
.msg{padding:3rem 1.5rem;text-align:center;color:var(--faint);
  line-height:1.7;font-size:.9rem}
.msg small{display:block;color:var(--faint);margin-top:.5rem;font-size:.72rem}

/* the map opens as a sheet, like everything else */
.slides-card{position:relative;width:min(760px,100%);height:100%;
  border-radius:var(--r-sheet);overflow:hidden;background:var(--card);
  box-shadow:0 24px 70px rgba(43,33,41,.18)}
.slides-card iframe{width:100%;height:100%;border:none;display:block}
@media(max-width:768px){.sheet.slides{padding:0}.slides-card{border-radius:0}}

@media(max-width:600px){
  :root{--header-h:150px}
  .inner{padding:.9rem .75rem 2rem}
  .ex{font-size:.95rem}
}
@media (min-width:900px){
  .ex{font-size:1.16rem;line-height:1.6}
  .uc-title{font-size:1.08rem}
  .vtab{font-size:.66rem}
  .mode-btn{font-size:.76rem}
}
</style>
</head>
<body>

<header class="header">
  <div class="header-top">
    <a class="back-link" href="/?openModal=grammar" target="_top">← Grammar</a>
    <div class="header-title">
      <div class="app-title">INTUITY</div>
      <div class="app-subtitle">B2 First Conditionals</div>
    </div>
    <span class="header-spacer">Level <b>B2–C1</b></span>
  </div>

  <div class="mode-selector">
    <button class="mode-btn active" data-mode="explore">Explore</button>
    <button class="mode-btn" data-mode="practice">Practice</button>
    <button class="mode-btn" data-mode="quiz">Quiz</button>
  </div>

  <div class="set-tabs" id="ruleTabs"></div>
</header>

<div class="area active" id="exploreArea">
  <div class="inner"><div class="cards" id="list"></div></div>
</div>

<div class="area sheet-mode" id="practiceArea">
  <div class="sheet-full">
    <div class="sheet-bar">
      <span class="sheet-title">Practice</span>
      <button class="close-btn" data-close type="button" aria-label="Close Practice">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
             stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="frame"><iframe id="practiceFrame" title="Practice"></iframe></div>
  </div>
</div>

<div class="area sheet-mode" id="quizArea">
  <div class="sheet-full">
    <div class="sheet-bar">
      <span class="sheet-title">Quiz</span>
      <button class="close-btn" data-close type="button" aria-label="Close Quiz">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
             stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="frame"><iframe id="quizFrame" title="Quiz"></iframe></div>
  </div>
</div>

<div class="sheet slides" id="slides">
  <div class="slides-card">
    <button class="close-btn" id="closeX" type="button" aria-label="Close"
            style="position:absolute;top:.6rem;right:.6rem;z-index:5">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
           stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <iframe id="slidesFrame" title="Conditionals map"></iframe>
  </div>
</div>

<div class="loading" id="loading" style="position:fixed;inset:0;display:flex;
     align-items:center;justify-content:center;background:var(--screen);z-index:99;
     font-family:var(--f-mono);font-size:.82rem;color:var(--faint)">Loading…</div>

<script>
/* ══════════════════════════════════════════════════════════════════════
   CONDITIONALS — Explore, with Practice and Quiz presented as sheets.

   Data shape differs from tenses and that is fine: this page reads
   rules[] → sets[] → examples[{before, after}], with signal words wrapped
   in <<…>>. Tenses reads useCases[] with a separate timeMarkers list. One
   renderer for both is the next step; tonight they stay separate so the
   change is testable one topic at a time.
   ══════════════════════════════════════════════════════════════════════ */

const PLAY  = 'explore-map.html';        // ONE renderer for every topic
const BUILD = '2026-08-27a';             // bump when a framed page changes
const DEF   = '../../data/grammar-rules/conditionals-data.json';
const P     = new URLSearchParams(location.search);

/* before/after are two orderings of the SAME sentence, not a transformation.
   'before' is the canonical if-first form. This one constant drives BOTH the
   list and the map, so the two surfaces can never disagree. */
const PRIMARY = 'before';

/* The map holds six nodes, so a set longer than that becomes several sections
   there. Section indices must account for it or a long set opens the wrong
   page. */
const MAX_PER_SECTION = 6;

let rules = [], rule = 0, view = 'list', mainMode = 'explore';
let RESOLVED_JSON = P.get('json') || DEF;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* <<word>> marks a signal word; **word** was a bold convention that is no
   longer used but still appears in the data, so it is stripped rather than
   rendered as literal asterisks. */
function render(text){
  return esc(text)
    .replace(/\*\*(.*?)\*\*/g, '$1')
    .replace(/&lt;&lt;(.*?)&gt;&gt;/g, '<span class="marker-inline">$1</span>');
}

function sectionIndexOf(r, setIdx){
  let n = 0;
  for(let i = 0; i < setIdx; i++){
    const len = (r.sets[i].examples || []).length;
    n += Math.max(1, Math.ceil(len / MAX_PER_SECTION));
  }
  return n;
}

/* The launcher builds data URLs as <topic>-rules.json, which is right for
   tenses and wrong here — this topic's file is conditionals-data.json. Try
   what was asked for, then the known-good names, and remember which worked so
   the map is handed a URL that loads. */
async function fetchFirstAvailable(urls){
  let lastErr = null;
  for(const url of urls){
    try{
      const res = await fetch(url, { cache:'no-store' });
      if(res.ok){ RESOLVED_JSON = url; return await res.json(); }
      lastErr = new Error('HTTP ' + res.status);
    }catch(e){ lastErr = e; }
  }
  throw lastErr || new Error('no data source responded');
}

function mountFrames(){
  const f1 = $('practiceFrame'), f2 = $('quizFrame');
  if(f1 && !f1.getAttribute('src')) f1.setAttribute('src','conditionals-practice.html?v='+BUILD);
  if(f2 && !f2.getAttribute('src')) f2.setAttribute('src','conditionals-gapfill.html?v='+BUILD);
}
function idle(fn){
  if(window.requestIdleCallback) requestIdleCallback(fn,{timeout:1500}); else setTimeout(fn,400);
}

async function boot(){
  try{
    const payload = await fetchFirstAvailable([...new Set([
      P.get('json') || DEF, DEF, '../../data/grammar-rules/conditionals.json'])]);
    rules = payload.rules || [];
    if(!rules.length) throw new Error('no rules in the data file');
  }catch(e){
    $('list').innerHTML = '<div class="msg">Couldn\'t load the conditionals.' +
      '<small>' + esc(String(e.message||e)) + '</small></div>';
    $('loading').style.display = 'none';
    syncHeader();
    return;
  }
  buildTabs();
  paintList();
  syncHeader();
  $('loading').style.display = 'none';
  idle(mountFrames);

  const wanted = P.get('mode');
  if(wanted && wanted !== 'explore' && document.querySelector('.mode-btn[data-mode="'+wanted+'"]')){
    mountFrames();
    switchMode(wanted);
  }
}

/* ── tabs ── */
function buildTabs(){
  const wrap = $('ruleTabs');
  wrap.innerHTML = '';
  rules.forEach((r,i)=>{
    const b = document.createElement('button');
    b.className = 'vtab' + (i===rule ? ' active' : '');
    b.textContent = r.title;
    b.title = r.subtitle || '';
    b.onclick = () => { if(i===rule) return; rule = i; buildTabs(); paintList(); closeMap(); };
    wrap.appendChild(b);
  });
  syncHeader();
}

/* ── list ── */
function paintList(){
  const r = rules[rule], wrap = $('list');
  if(!r || !r.sets || !r.sets.length){
    wrap.innerHTML = '<div class="msg">No sets for this conditional yet.</div>';
    return;
  }
  const sub = r.subtitle ? '<div class="subtitle-line">' + esc(r.subtitle) + '</div>' : '';
  wrap.innerHTML = sub + r.sets.map((set,i)=>{
    const exs = (set.examples||[]).map(e => {
      const raw = e[PRIMARY] != null ? e[PRIMARY] : e.after;
      return '<div class="ex">' + render(raw) + '</div>';
    }).join('');
    return '<div class="card"><div class="card-head">' +
             '<div class="uc-title">' + esc(set.setTitle) + '</div>' +
             '<button class="explore-btn" type="button" data-sec="' + i + '">Explore</button>' +
           '</div><div class="exs">' + exs + '</div></div>';
  }).join('');
  wrap.querySelectorAll('.explore-btn').forEach(b =>
    b.addEventListener('click', () => openMap(sectionIndexOf(r, +b.dataset.sec))));
}

/* ── modes ── */
function applyMode(mode){
  mainMode = mode;
  document.querySelectorAll('.mode-btn[data-mode]').forEach(b =>
    b.classList.toggle('active', b.dataset.mode === mode));
  document.querySelectorAll('.area').forEach(a => a.classList.remove('active'));
  /* Explore stays active underneath, so closing a sheet reveals the page
     exactly where the student left it. */
  $('exploreArea').classList.add('active');
  if(mode === 'practice'){ mountFrames(); $('practiceArea').classList.add('active'); }
  if(mode === 'quiz'){     mountFrames(); $('quizArea').classList.add('active'); }
  document.body.style.overflow = mode === 'explore' ? '' : 'hidden';
  syncHeader();
}
function switchMode(mode){
  if(mode === mainMode) return;
  const u = new URL(location.href);
  if(mode === 'explore') u.searchParams.delete('mode'); else u.searchParams.set('mode', mode);
  history.replaceState(null,'',u);
  if(document.startViewTransition && !matchMedia('(prefers-reduced-motion: reduce)').matches){
    document.startViewTransition(() => applyMode(mode));
  }else{
    applyMode(mode);
  }
}
document.querySelectorAll('.mode-btn[data-mode]').forEach(b =>
  b.addEventListener('click', () => switchMode(b.dataset.mode)));
document.querySelectorAll('[data-close]').forEach(b =>
  b.addEventListener('click', () => switchMode('explore')));

/* ── the map ── */
function openMap(section){
  view = 'slides';
  const r = rules[rule] || {};
  $('slidesFrame').setAttribute('src',
    PLAY + '?topic=conditionals' +
    '&rule=' + encodeURIComponent(r.id || String(rule)) +
    '&section=' + section +
    '&primary=' + PRIMARY +
    '&json=' + encodeURIComponent(RESOLVED_JSON));
  $('slides').classList.add('open');
}
function closeMap(){
  if(view !== 'slides') return;
  view = 'list';
  $('slides').classList.remove('open');
  $('slidesFrame').setAttribute('src','');
}
$('closeX').addEventListener('click', closeMap);
$('slides').addEventListener('click', e => { if(e.target === $('slides')) closeMap(); });
window.addEventListener('message', e => { if(e.data && e.data.intuity === 'showList') closeMap(); });

/* One Escape handler, innermost surface first: the map sits above a sheet,
   so it must be the thing that closes while it is open. */
document.addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  if(view === 'slides'){ closeMap(); return; }
  if(mainMode !== 'explore') switchMode('explore');
});

/* ── layout sync ──
   Measures the real header rather than trusting the CSS guess: five rule tabs
   plus a three-item mode row wrap to different heights at every width, and a
   stale --header-h lets the header sit on top of the first sentence. */
function syncHeader(){
  const h = document.querySelector('.header');
  if(h) document.documentElement.style.setProperty('--header-h', h.offsetHeight+'px');
}
window.addEventListener('resize', syncHeader);
window.addEventListener('orientationchange', () => setTimeout(syncHeader,120));
window.addEventListener('pageshow', e => { syncHeader(); if(e.persisted) requestAnimationFrame(syncHeader); });
if(document.fonts && document.fonts.ready) document.fonts.ready.then(syncHeader);
if(window.ResizeObserver){
  const h = document.querySelector('.header');
  if(h) new ResizeObserver(syncHeader).observe(h);
}else{
  [0,60,200,500].forEach(ms => setTimeout(syncHeader, ms));
}

boot();
</script>
</body>
</html>
