<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FAF7F2">
<title>INTUITY — The Board</title>
<meta name="intuity-build" content="2026-09-01-board-light2-sortcard">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@500;700;900&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script>
  if (window.self !== window.top) document.documentElement.classList.add('embedded');
</script>
<style>
/* ═══ THE BOARD ═══
   Thirty-six holes, face down. The child chooses which to turn — that choice
   is the difference between this and Sort, where the next card is handed to
   them. A board can be worked at from the easy corners inward, and being
   allowed to pick is most of what makes a board feel like a game rather than
   a test.

   THE MODAL CARD NOW WEARS SORT'S POSTER, NOT THE OLD NOTCHED PANEL.
   The card used to be a dark-theme-descended slab: rounded corners, a notch
   cut into the top with a radial mask, a heavy multi-layer drop-shadow filter
   standing it up off a darker veil. Sort settled what "the thing that states
   a rule" looks like across this product — flat paper, square corners, real
   ink, a mono kicker with a solid colour block, a minimal shadow — and this
   card now uses exactly that material, at exactly Sort's proportions
   (16/10, capped at 7cm on phone / 11cm on desktop), so opening a hole here
   and opening a card in Sort read as the same object.

   THE FORMS ROW NOW MATCHES SORT'S PILLS. Each answer used to sit in a
   stretched three-column grid, forcing every egg to the same width no matter
   how short its word. It's now a flex row that hugs each word's own width,
   with the same flat caramel-then-state-colour egg Sort uses.

   DEPTH ON THE BOARD ITSELF IS UNCHANGED. This file's actual point — a
   circle face down is pressed, a circle turned is raised — still lives in
   `.circle` below and is untouched by this pass. Only the pop-up modal
   (`.veil` / `.panel` / `.forms`) has been rebuilt to match Sort. */

*,*::before,*::after{ margin:0; padding:0; box-sizing:border-box; }

:root{
  --ground:#DFE3E3;
  --band:#FAF7F2;
  --ink:#17171A;
  --dim:#5C6366;
  --faint:#8A9093;
  --rule:#C2956E;
  --caramel:#B0865C;
  --tick:#6B3FA0;
  --cross:#E8632A;
  --egg-right:#A3B26A;
  --bad:#B8402A;
  --hot:#B44A22;
  --shade:40,50,54;

  /* THE LADDER. Five marks, and the ramp is the board's own pigments warming
     toward the top rather than a dark-theme ember palette borrowed wholesale.
     Crown is violet because violet is what this set means by "right" — the
     last mark is the same colour as the tick you earned to get there. */
  --m0:#C2956E; --m1:#B0865C; --m2:#B44A22; --m3:#E8632A; --m4:#6B3FA0;

  --header-h:104px; --bar-h:46px;
  --spring:cubic-bezier(.2,1.4,.4,1);

  /* Sort's poster palette, carried over verbatim so the modal card here
     reads as the same object as Sort's card. Kept separate from the board's
     own --ink/--faint tokens (those are tuned for the emboss and read too
     flat on flat paper). */
  --poster:#ECE9E3;
  --poster-ink:#14110E;
  --poster-soft:rgba(20,17,14,.6);
  --poster-faint:rgba(20,17,14,.5);
  --poster-rule:rgba(20,17,14,.2);
  --f-mono2:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}

html,body{ width:100%; height:100%; overflow:hidden; }
body{
  background:var(--ground); color:var(--ink);
  font-family:'DM Sans',system-ui,sans-serif; -webkit-font-smoothing:antialiased;
  user-select:none; -webkit-user-select:none; touch-action:manipulation;
}
button{ font:inherit; border:none; background:none; cursor:pointer; color:inherit; }
:focus-visible{ outline:2px solid var(--hot); outline-offset:3px; }

html.embedded .htop{ display:none; }
html.embedded .header{ height:auto; padding:.35rem 1rem .4rem; gap:.3rem; }

/* ══ HEADER ══ */
.header{
  position:fixed; top:0; left:0; right:0; z-index:20; height:var(--header-h);
  display:flex; flex-direction:column; justify-content:center; gap:.5rem;
  padding:.6rem 1rem; background:var(--band); border-bottom:1px solid var(--rule);
}
.htop{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; }
.back{
  justify-self:start; text-decoration:none;
  font-family:'Space Grotesk',sans-serif; font-size:.6rem; font-weight:700;
  letter-spacing:.08em; text-transform:uppercase; color:var(--faint); transition:color .2s;
}
.back:hover{ color:var(--ink); }
.title{ display:flex; flex-direction:column; align-items:center; line-height:1.1; }
.title b{
  font-family:'Space Grotesk',sans-serif; font-size:1rem; font-weight:900;
  letter-spacing:.2em; color:var(--ink);
}
.title span{
  font-size:.56rem; font-weight:600; letter-spacing:.16em;
  text-transform:uppercase; color:var(--faint); margin-top:.15rem;
}
.mute{ justify-self:end; font-size:.95rem; opacity:.5; transition:opacity .2s; }
.mute:hover{ opacity:1; }

/* ── THE LADDER ──
   The five marks, per board. A dot is pressed until it is won and raised
   afterwards — the same grammar as the circles below it, so the ladder is
   legible as "these are things you turn over" without a legend. */
.ladder{ display:flex; align-items:center; justify-content:center; gap:.42rem; }
.mark{ display:flex; flex-direction:column; align-items:center; gap:.2rem; width:40px; }
.mark .dot{
  width:15px; height:15px; border-radius:50%; background:var(--ground);
  box-shadow:inset 2px 2px 4px rgba(var(--shade),.24),
             inset -2px -2px 4px rgba(255,255,255,.9);
  transition:background .3s, box-shadow .3s, transform .3s var(--spring);
}
.mark.done .dot{
  background:var(--mc,var(--caramel)); transform:scale(1.1);
  box-shadow:-2px -2px 4px rgba(255,255,255,.9), 2px 3px 6px rgba(var(--shade),.24);
}
.mark .lbl{
  font-family:'DM Mono',monospace; font-size:.44rem; letter-spacing:.09em;
  text-transform:uppercase; color:var(--faint); transition:color .3s;
}
.mark.done .lbl{ color:var(--dim); }
.link{ width:13px; height:2px; border-radius:2px; background:rgba(var(--shade),.16); transition:background .3s; }
.link.done{ background:var(--caramel); }

/* ══ THE BOARD ══ */
.stage{
  position:fixed; top:var(--header-h); left:0; right:0; bottom:var(--bar-h);
  padding:.9rem; display:flex; align-items:center; justify-content:center;
}
html.embedded .stage{ top:66px; padding:.6rem; }
/* The columns are worked out in JS from the space actually available. Left to
   wrap on its own the grid ran to four rows in a frame two rows tall, and the
   circles below the fold could never be reached — a board you cannot finish
   is worse than a smaller board. */
.board{
  position:relative; width:100%; height:100%;
  display:grid; gap:var(--gap,.6rem);
  align-content:center; justify-content:center; justify-items:center;
}

/* ── A CIRCLE ──
   Face down it is a hole: pressed into the ground, showing only its number.
   The number is set small and faint because it is an address, not content.
   This is untouched by the Sort-card pass — the board's own depth grammar
   (pressed vs. raised) stays exactly as it was. */
.circle{
  position:relative; width:var(--size,72px); height:var(--size,72px);
  border-radius:50%; cursor:pointer; background:var(--ground);
  display:flex; align-items:center; justify-content:center; text-align:center;
  box-shadow:inset 3px 4px 8px rgba(var(--shade),.22),
             inset -3px -3px 7px rgba(255,255,255,.9);
  transition:box-shadow .2s, transform .25s var(--spring), filter .25s;
  font-family:'DM Mono',monospace; font-size:calc(var(--size,72px) * .19);
  color:var(--faint);
}
.circle:hover{ box-shadow:inset 4px 5px 10px rgba(var(--shade),.27),
                          inset -3px -3px 7px rgba(255,255,255,.9); color:var(--dim); }
.circle:active{ transform:scale(.96); }

/* Turned: the circle comes UP out of the ground and keeps the word. Filter
   rather than box-shadow, because a raised object on this material is drawn
   by the shadow of its silhouette and not of its box — the same technique
   Pegs uses for a tile that has been dealt with. */
.circle.done{
  cursor:default; box-shadow:none;
  filter:drop-shadow(-3px -3px 5px rgba(255,255,255,.95))
         drop-shadow(3px 4px 7px rgba(var(--shade),.22));
}
.circle.done:hover{ transform:none; }
.circle.done:active{ transform:none; }
/* THE WORD IS FITTED, NOT BROKEN. `word-break:break-word` split "understand"
   into "understa / nd" — a nonsense fragment inside a circle a child is
   reading for meaning. Breaking is now allowed only at a space, and the size
   is set per circle from the longest token it has to hold (see fitWord), so a
   long answer shrinks rather than fracturing. The box is also held clear of
   the bottom-right corner where the tick sits. */
.circle .word{
  font-family:'Space Grotesk',sans-serif; font-weight:700;
  font-size:var(--w,var(--word,.8rem)); color:var(--tick);
  max-width:84%; padding:0 .1rem; line-height:1.14;
  overflow-wrap:normal; word-break:normal; hyphens:none;
}
/* WON AT THE SECOND ATTEMPT. The word is kept, but in olive rather than
   violet, so first-time knowledge and eventual knowledge look different on
   the board without either being marked as failure. */
.circle.done.second .word{ color:#6E7A46; }
.circle.flip{ animation:flip .5s; }
@keyframes flip{ 50%{ transform:rotateY(88deg) scale(.92) } 100%{ transform:none } }

/* A circle that was missed keeps a small cross. The turn can be taken again —
   nothing is locked — but the board stops being able to lie: a child who
   guessed their way to thirty can see that they did, and so can anyone
   looking over their shoulder. */
.mk{
  position:absolute; opacity:0; transform:scale(.5); transform-origin:50% 50%;
  transition:opacity .2s, transform .3s var(--spring); pointer-events:none; z-index:2;
}
.mk.tick{ width:21%; right:9%; bottom:9%; }
.mk.cross{ width:22%; right:12%; top:11%; }
.circle.missed:not(.done) .mk.cross{ opacity:.9; transform:scale(1); }
.circle.done:not(.second) .mk.tick{ opacity:1; transform:scale(1); }

.circle.failed{ animation:fail .45s; }
@keyframes fail{ 0%,100%{ transform:none } 25%{ transform:translateX(-7px) rotate(-4deg) }
                 50%{ transform:translateX(6px) rotate(3deg) } 75%{ transform:translateX(-3px) } }

/* ══ THE CARD (POP-UP MODAL) ══
   Rebuilt to be Sort's card, verbatim: a light veil (not a dark one), a flat
   paper poster underneath it with square corners and a fixed 16/10 shape, a
   mono kicker with a solid colour block, Anton for the trigger, and pills
   below that hug their own word instead of stretching to fill a column. */
.veil{
  position:fixed; inset:0; z-index:30; display:none; align-items:center; justify-content:center;
  background:rgba(250,247,242,.78);
  -webkit-backdrop-filter:blur(10px) saturate(1.05);
  backdrop-filter:blur(10px) saturate(1.05);
  padding:1.1rem;
  transition:opacity .28s ease;
}
.veil.show{ display:flex; }

/* THE PANEL IS NOW SORT'S CARD. Same background, same square corners, same
   minimal shadow, same fixed 16/10 aspect ratio at the same width caps. No
   notch, no dark-theme drop-shadow filter — see the top-of-file note. */
.panel{
  position:relative; text-align:left;
  width:min(8.4cm,90vw);
  aspect-ratio:16/10;
  padding:clamp(1.5rem,5vw,2.3rem) clamp(1.3rem,4.6vw,2rem);
  background:var(--poster);
  border-radius:0;
  box-shadow:0 2px 4px rgba(0,0,0,.12);
  min-width:0; min-height:0; overflow:hidden;
  transition:transform .28s cubic-bezier(.2,.9,.3,1), opacity .28s;
  animation:rise .26s var(--spring);
}
@media (min-width:760px){
  .panel{
    width:min(11cm,55vw);
  }
}
@keyframes rise{ from{ opacity:0; transform:translateY(14px) scale(.97) } }
.panel.bad{ animation:bad .5s; }
@keyframes bad{ 0%,100%{ transform:none } 15%{ transform:translateX(-13px) }
                32%{ transform:translateX(11px) } 50%{ transform:translateX(-7px) }
                70%{ transform:translateX(4px) } }

/* The kicker, exactly as Sort's: a mono label with a solid caramel block. */
.panel .kick{
  display:flex; align-items:center; gap:9px;
  font-family:var(--f-mono2); font-size:.56rem; letter-spacing:.22em;
  text-transform:uppercase; color:var(--poster-faint); margin-bottom:1.1rem;
}
.panel .kick i{ display:block; width:26px; height:10px; flex:none; background:var(--caramel); }

.sentence{
  font-family:'DM Sans',sans-serif; font-weight:400; line-height:1.4;
  font-size:clamp(.85rem,3vw,1.05rem); color:var(--poster-soft);
}
.sentence b{
  font-family:'Anton',Impact,sans-serif; font-weight:400;
  letter-spacing:.02em; color:var(--poster-ink);
}
.sentence i{
  font-style:normal; letter-spacing:.14em; color:var(--poster-faint); padding:0 .12em;
}

/* ── THE FORMS ROW (Sort's piles, ported) ──
   A flex row, not a stretched grid: each pill takes only the width its word
   needs, exactly like Sort. */
.forms{
  display:flex; justify-content:flex-start; align-items:flex-start;
  gap:.6rem; margin-top:1.15rem;
}
.form{ flex:0 0 auto; position:relative; display:flex; flex-direction:column; align-items:center; gap:.3rem; }

.form .egg{
  border-radius:999px; background:#BFBFC2;
  padding:.35rem .8em .4rem;
  display:flex; align-items:center; justify-content:center;
  transition:background .18s ease;
}
.form .egg span{
  font-family:'Space Grotesk',sans-serif; font-weight:700;
  font-size:clamp(.7rem,2.6vw,.85rem); letter-spacing:.015em;
  color:#17171A; line-height:1.15; white-space:nowrap;
}
.form:hover .egg{ background:var(--hot); }
.form:hover .egg span{ color:#FFF7F3; }
.form.tell .egg{ background:var(--egg-right); }
.form .k{
  font-family:'DM Mono',monospace; font-size:.5rem; letter-spacing:.13em;
  text-transform:uppercase; color:var(--dim); text-align:center;
}

/* The correction, in Sort's own voice: a mono chip stating the rule, not a
   bold red warning line. Information, not an alarm. */
.rule{
  margin-top:.9rem; min-height:1.2rem;
  font-family:var(--f-mono2); font-weight:500; font-size:.78rem; color:var(--poster-ink);
  background:rgba(20,17,14,.09); border-radius:3px; padding:.42em .7em;
  display:inline-block; opacity:0; transition:opacity .2s;
}
.rule.show{ opacity:1; }

body.two-forms .forms{ }
body.two-forms #fm-bare{ display:none; }

/* ── THE MIX CHOOSER ──
   Raised chips, as Pegs' bank uses for the piece in your hand: the thing you
   are about to pick up sits proud of the ground. Left as the board's own
   material — this lives on the gate/over screens, not on the card. */
.mixrow{ display:flex; flex-wrap:wrap; justify-content:center; gap:.45rem; margin:.2rem 0 .7rem; }
.mixchip{
  display:flex; flex-direction:column; align-items:center; gap:.1rem;
  padding:.45rem .95rem .5rem; border-radius:999px; background:var(--ground);
  filter:drop-shadow(-2px -2px 4px rgba(255,255,255,.9))
         drop-shadow(2px 3px 6px rgba(var(--shade),.2));
  transition:transform .12s var(--spring), filter .15s;
}
.mixchip:active{ transform:scale(.95); }
.mixchip .mn{
  font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:.74rem;
  letter-spacing:.03em; color:var(--dim);
}
.mixchip .ms{
  font-family:'DM Mono',monospace; font-size:.53rem; letter-spacing:.09em;
  text-transform:uppercase; color:var(--faint);
}
.mixchip.sel{ background:var(--hot); filter:drop-shadow(2px 4px 9px rgba(180,74,34,.32)); }
.mixchip.sel .mn{ color:#FFF7F3; }
.mixchip.sel .ms{ color:rgba(255,247,243,.72); }
.mixblurb{
  font-size:.78rem; color:var(--dim); line-height:1.5;
  max-width:23rem; margin:0 auto .2rem;
}

/* ══ THE BAR ══ */
.bar{
  position:fixed; bottom:0; left:0; right:0; height:var(--bar-h); z-index:15;
  display:flex; align-items:center; gap:.8rem;
  padding:0 1rem calc(env(safe-area-inset-bottom,0px) * .5);
  background:var(--band); border-top:1px solid rgba(var(--shade),.14);
  font-family:'DM Mono',monospace; font-size:.6rem; letter-spacing:.1em;
  text-transform:uppercase; color:var(--faint);
}
.track{
  position:relative; flex:1; height:7px; border-radius:999px; overflow:hidden;
  box-shadow:inset 2px 2px 4px rgba(var(--shade),.2),
             inset -2px -2px 4px rgba(255,255,255,.9);
}
.fill{
  position:relative; height:100%; width:0; border-radius:999px; overflow:hidden;
  background:var(--caramel);
  transition:width .45s cubic-bezier(.2,.9,.3,1), background .3s;
}
.fill::after{
  content:''; position:absolute; inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent);
  transform:translateX(-100%); opacity:0;
}
.fill.gain::after{ animation:sweep .55s ease-out; }
@keyframes sweep{ 0%{ transform:translateX(-100%); opacity:1 } 100%{ transform:translateX(220%); opacity:0 } }
.track.knock{ animation:knock .4s; }
@keyframes knock{ 0%,100%{ transform:none } 25%{ transform:translateX(-5px) } 60%{ transform:translateX(4px) } }
.fill.sting{ background:var(--bad); }
.bar .n{ font-variant-numeric:tabular-nums; color:var(--dim); }

/* ── A MARK FALLS ──
   A pill on the band's paper rather than a giant glowing word. On a light
   ground a 3rem text-shadow reads as a smudge; a raised chip reads as an
   award, and it is the same object as everything else on the screen. */
.banner{
  position:fixed; left:50%; top:calc(var(--header-h) + 14px); z-index:40;
  transform:translateX(-50%) translateY(-8px) scale(.9); pointer-events:none;
  display:flex; align-items:center; gap:.5rem;
  font-family:'Space Grotesk',sans-serif; font-weight:900; font-size:.82rem;
  letter-spacing:.14em; text-transform:uppercase; color:var(--ink);
  background:var(--band); border-radius:999px; padding:.5rem 1.15rem;
  box-shadow:0 6px 16px rgba(var(--shade),.2);
  opacity:0; transition:opacity .28s, transform .45s var(--spring);
}
.banner.show{ opacity:1; transform:translateX(-50%) translateY(0) scale(1); }
.banner .pip{ width:10px; height:10px; border-radius:50%; background:currentColor; }

/* ══ FX ══ */
.fx{ position:fixed; inset:0; z-index:35; pointer-events:none; overflow:hidden; }
.spark{ position:absolute; width:5px; height:5px; border-radius:50%; pointer-events:none; }
.fw-flash{
  width:64px; height:64px; border-radius:50%;
  background:radial-gradient(circle,#fff 0%,rgba(194,149,110,.75) 38%,rgba(194,149,110,0) 70%);
}
.fw-ring{ width:56px; height:56px; border-radius:50%; border:3px solid rgba(107,63,160,.55); }
.fw-crackle{ width:3px; height:3px; border-radius:50%; background:var(--tick); box-shadow:0 0 7px rgba(107,63,160,.7); }

/* ══ THE PENDULUM ══ (see Sort for the note on why the string is a border) */
.pend{
  position:relative; width:104px; height:104px; margin:0 auto .95rem;
  transform-origin:50% -40px; animation:pendSwing 2.7s ease-in-out infinite;
}
.pend::before{
  content:''; position:absolute; left:50%; top:-40px; width:2px; height:40px;
  border-left:1.5px solid var(--caramel); transform:translateX(-50%);
}
.pend::after{
  content:''; position:absolute; left:50%; top:-43px; width:7px; height:7px;
  border-radius:50%; background:var(--caramel); transform:translateX(-50%);
}
.pend-dial{
  position:relative; width:100%; height:100%; border-radius:50%;
  background:linear-gradient(145deg,#FFFFFF,var(--ground));
  box-shadow:5px 5px 13px rgba(var(--shade),.2);
  display:flex; align-items:center; justify-content:center;
}
.pend-dial::before{ content:''; position:absolute; inset:0; border-radius:50%; background:var(--caramel); }
.pend-dial::after{ content:''; position:absolute; inset:8.5%; border-radius:50%; background:var(--ink); }
.pend-dial span{
  position:relative; z-index:2; font-family:'Space Grotesk',sans-serif;
  font-weight:900; font-size:1rem; color:#E5D1B8;
}
@keyframes pendSwing{ 0%,100%{ transform:rotate(-11deg) } 50%{ transform:rotate(11deg) } }

/* ══ THE ENTRY GATE ══ (one element, mounted once — see Sort) */
.gate{
  position:fixed; inset:0; z-index:50; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:.15rem;
  padding:2rem 1.5rem; text-align:center; background:var(--ground);
}
.gate .gate-loading{ font-size:.86rem; color:var(--faint); }
.gate .kicker{
  font-family:'DM Mono',monospace; font-size:.62rem; letter-spacing:.2em;
  text-transform:uppercase; color:var(--faint); margin-bottom:.5rem;
}
.gate .msg{
  font-family:'Space Grotesk',sans-serif; font-weight:700;
  font-size:clamp(1rem,3.8vw,1.3rem); line-height:1.35; color:var(--ink);
  max-width:22rem; margin:0 auto;
}
.gate .sub{ margin-top:.55rem; font-size:.82rem; color:var(--dim); max-width:21rem; line-height:1.55; }
.gate .go{ margin-top:1.2rem; }
body.started .gate{ display:none; }
body:not(.started) .stage,
body:not(.started) .bar{ display:none; }

/* ══ END OF BOARD ══ */
.over{
  position:fixed; inset:0; z-index:45; display:none;
  flex-direction:column; align-items:center; justify-content:center;
  gap:.55rem; padding:2rem 1.5rem; text-align:center; background:var(--ground);
}
.over.show{ display:flex; }
.over .big{
  font-family:'Anton',Impact,sans-serif; font-weight:400;
  font-size:clamp(2.6rem,13vw,4rem); letter-spacing:.02em;
  text-transform:uppercase; color:var(--ink); line-height:1;
}
.over .sub{ font-size:.86rem; color:var(--dim); max-width:23rem; line-height:1.6; }
.acts{ display:flex; flex-wrap:wrap; gap:.6rem; justify-content:center; margin-top:1.1rem; }
.go{
  font-family:'Space Grotesk',sans-serif; font-size:.7rem; font-weight:700;
  letter-spacing:.06em; padding:.6rem 1.4rem; border-radius:999px;

<!-- The burst lives here, not in the board. Sparks are absolutely positioned,

<script src="intuity-log.js"></script>
<script src="intuity-sound.js"></script>
<script>
/* ======================================================================
   THE BOARD

   Open a hole and the sentence comes up as a card. Right, and the circle
   rises out of the ground and keeps the word: the board fills with the
   answers you have earned, so progress is the picture in front of you and
   not a number in a corner. Wrong, and the hole stays a hole — nothing is
   lost but the turn, and the same circle can be tried again later.
====================================================================== */

const DATA_URL = '../../data/grammar-rules/gerunds-infinitives-complete.json';
const SLOTS = 36;
const GOAL  = 30;

/* The same five marks the phrasal game climbs, spaced across the goal so the
   first arrives early enough to be believed in. */
const MARKS = [
  { at:5,  label:'Spark', col:'var(--m0)' },
  { at:10, label:'Ember', col:'var(--m1)' },
  { at:16, label:'Flame', col:'var(--m2)' },
  { at:23, label:'Blaze', col:'var(--m3)' },
  { at:30, label:'Crown', col:'var(--m4)' },
];

let DECK = [], slots = [], open = null, mark = -1;
let done = 0, clean = 0, tries = 0, locked = false, started = false;

const $  = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const shuffle = a => { const b=[...a]; for(let i=b.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[b[i],b[j]]=[b[j],b[i]];} return b; };
const slug = p => p.replace('-','');
const sfx = (name) => { try { if (window.SFX && SFX[name]) SFX[name](); } catch(e){} };

const TICK = '<svg class="mk tick" viewBox="0 0 24 24" fill="none" stroke="var(--tick)" ' +
  'stroke-width="5.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
  '<path d="M3 13.5c2.6 1.4 4.4 3.2 5.8 5.4C11.4 13 15.2 8 21 4.2"/></svg>';
const CROSS = '<svg class="mk cross" viewBox="0 0 24 24" fill="none" stroke="var(--cross)" ' +
  'stroke-width="5.8" stroke-linecap="round" aria-hidden="true">' +
  '<path d="M5.4 5c4.2 4.2 8.6 9.2 13.4 14.2M18.6 5.4C14.2 9.4 9.6 14.6 5.2 19"/></svg>';


/* ══════════════════════════════════════════════════════════════════════
   THE MIXES — WHY THE DECK IS BUILT AND NOT SLICED

   THE BUG THIS REPLACES. The deck in the JSON is grouped by pile: forty-nine
   gerunds, then twenty infinitives, then the four bare ones. `DECK.slice(0,40)`
   therefore dealt forty gerunds and nothing else, and the shuffle that followed
   only reordered them — it shuffled WITHIN a block that was already uniform. A
   student could tap the left pile forty times, score a hundred per cent, and
   never once have read the trigger. The screen was testing endurance.

   WHY BLOCKS ARE WRONG HERE. This is a discrimination task: the whole skill is
   telling `avoid` from `refuse`. A run of same-answer items produces a response
   set — after four or five the hand stops waiting for the eye, and the learner
   is no longer deciding, they are repeating. Interleaving feels harder and
   scores lower in the session, and that is the point: the retrieval difficulty
   is what builds the discrimination. Blocked practice flatters the session and
   loses the learning.

   WHY A LADDER AND NOT JUST SHUFFLE. Straight interleaving from a standing
   start is too much: a learner who does not yet have the gerund set cannot
   contrast it with anything. So the mixes go easy to hard by widening the
   CHOICE, not by changing the verbs. Mix 1 is the binary contrast. Mix 2 adds
   the third form. Mix 3 stops helping.

   WHY MIX 3 IS SEPARATE FROM MIX 2. Mix 2 samples evenly, which pushes the four
   bare items to about one card in seven — roughly three times their real rate —
   because four cards spread across a whole deck would otherwise be met once and
   forgotten. That is a deliberate distortion for learning. Mix 3 undoes it and
   samples as the language actually falls, so the last rung is the only one where
   the odds are honest. A student who can only pass Mix 2 has learned the forms
   with a thumb on the scale, and should be able to see that.

   Note the eight dual-form triggers (forget, mean, regret, remember, stop, try…)
   are held back in the data for the contrast game, where the SAME trigger takes
   both forms with different meanings. Nothing here reaches for them: sorting
   them into one pile would teach the opposite of what that game teaches. */
const MIXES = [
  { id:'m1', name:'Mix 1', sub:'two forms',   n:24,
    piles:['-ing','to'],         mode:'balanced',
    blurb:'Gerund or infinitive, evenly split. The core contrast, and nothing else on screen.' },
  { id:'m2', name:'Mix 2', sub:'three forms', n:30,
    piles:['-ing','to','bare'],  mode:'balanced',
    blurb:'The bare infinitive joins. There are only four of them, so they come up far more often here than in real English — which is the only way to actually meet them.' },
  { id:'m3', name:'Mix 3', sub:'true odds',   n:36,
    piles:['-ing','to','bare'],  mode:'natural',
    blurb:'Sampled at the rate the language really uses: mostly gerunds. No help from the odds.' },
];
let currentMix = MIXES[0];

/* Round-robin across the piles, shuffled within each. Scarcity handles itself:
   the four bare cards run out after four passes and the remaining places fill
   from the piles that still have stock, rather than the sampler failing or
   repeating a card to hit its quota. */
function sample(pool, n, piles, mode, maxRun){
  const usable = pool.filter(c => piles.indexOf(c.pile) !== -1);

  /* ── NATURAL MODE IS ALLOCATED, NOT DRAWN ──
     `shuffle(pool).slice(0,n)` was the obvious way to sample at the real
     frequencies and it is wrong twice over. It is noisy — one deal comes out
     22 gerunds, the next 28 — so "true odds" varied by a third from round to
     round and could not be compared. Worse, a heavy draw makes an evenly
     spaced deck IMPOSSIBLE: twenty-eight gerunds among eight others cannot be
     broken into runs of two whatever the shuffler does, so the interleaver hit
     its fallback and the round ended in a wall of one answer. The audit caught
     tails of eighteen.

     So the quota per pile is computed from its true share of the pool by the
     largest-remainder method, and the biggest pile is then clamped to what a
     run cap of `maxRun` can actually space out — r*(n+1)/(r+1) — with the
     surplus handed to the others. At this deck size the clamp and the true
     rate happen to land on the same number, so nothing is distorted to get it;
     the clamp is there so a change to the data or the deck length cannot
     quietly reintroduce the wall. */
  if (mode === 'natural'){
    const by = new Map();
    usable.forEach(c => { if (!by.has(c.pile)) by.set(c.pile, []); by.get(c.pile).push(c); });
    by.forEach((v, k) => by.set(k, shuffle(v)));
    const keys = [...by.keys()];
    const share = k => by.get(k).length / usable.length;

    const quota = {}; let placed = 0;
    keys.forEach(k => { quota[k] = Math.min(by.get(k).length, Math.floor(share(k) * n)); placed += quota[k]; });
    /* largest remainder, so the rounding loss goes where it is most deserved */
    keys.slice().sort((a,b) => (share(b)*n - Math.floor(share(b)*n)) - (share(a)*n - Math.floor(share(a)*n)))
        .forEach(k => { while (placed < n && quota[k] < by.get(k).length){ quota[k]++; placed++; } });

    const cap = Math.floor(maxRun * (n + 1) / (maxRun + 1));
    let surplus = 0;
    keys.forEach(k => { if (quota[k] > cap){ surplus += quota[k] - cap; quota[k] = cap; } });
    keys.forEach(k => { while (surplus > 0 && quota[k] < Math.min(cap, by.get(k).length)){ quota[k]++; surplus--; } });

    const out = [];
    keys.forEach(k => { for (let i = 0; i < quota[k]; i++) out.push(by.get(k).pop()); });
    return out;
  }

  const by = new Map();
  usable.forEach(c => { if (!by.has(c.pile)) by.set(c.pile, []); by.get(c.pile).push(c); });
  by.forEach((v, k) => by.set(k, shuffle(v)));
  const keys = [...by.keys()], out = [];
  while (out.length < n){
    let moved = false;
    for (const k of keys){
      const b = by.get(k);
      if (b && b.length){ out.push(b.pop()); moved = true; if (out.length >= n) break; }
    }
    if (!moved) break;   /* the pool is exhausted; a short deck beats a padded one */
  }
  return out;
}

/* SHUFFLING IS NOT ENOUGH, AND NOR IS GREEDY REPAIR.
   A fair shuffle of a balanced deck still deals five gerunds in a row now and
   again, and five in a row is all it takes to start a response set. But the
   obvious fix — always take from the pile with the most cards left, subject to
   a run cap — trades one pattern for a worse one. It is deterministic, so a
   balanced deck came out `gt gt gt gt` and a two-to-one deck came out
   `ggt ggt ggt`: a rigid period the learner can lock onto within about six
   cards, at which point they are answering the rhythm instead of the verb.
   That is the same failure as the block, arriving with better manners.

   It failed a second way. Greedy selection drains the small piles at a
   constant rate while the big one is still deep, so on a naturally-skewed
   sample the minority ran out early and the deck ended in a long tail — one
   audit deal finished on eighteen consecutive gerunds.

   So the pile is drawn at random, weighted by how many cards it has LEFT, and
   only then filtered by the run cap. Weighting by the remainder is the part
   that matters: it is self-correcting, because a pile consumed faster than its
   share immediately becomes less likely to be picked. The ratio therefore
   holds roughly steady from the first card to the last, no pile empties early,
   and the order is unpredictable at every step while still never running the
   same answer more than `maxRun` times. */
function interleave(cards, maxRun){
  const by = new Map();
  cards.forEach(c => { if (!by.has(c.pile)) by.set(c.pile, []); by.get(c.pile).push(c); });
  by.forEach((v, k) => by.set(k, shuffle(v)));

  /* THE FEASIBILITY GUARD. Weighting by the remainder holds the ratio steady
     on AVERAGE, which is not the same as holding it. On a two-to-one deck the
     spare separators are few — thirty-six cards at twenty-four gerunds leaves
     exactly twelve others, and pairs of gerunds need eleven of them — so a
     couple of unlucky draws early spend slack that cannot be earned back, the
     minority runs dry, and the deck ends in a wall of one answer. The audit
     found deals finishing on twenty-three consecutive gerunds.

     So before a pile is taken, the state it would leave behind is checked: a
     sequence with a run cap of r exists only while the biggest pile is no
     larger than r * (everything else + 1). Piles that would break that are not
     offered. Early in a deck almost everything passes and the order is free;
     late, when the slack is gone, the majority is forced — which is correct,
     because by then there is only one arrangement left that works. */
  const feasible = (counts, maxKey) => {
    const total = Object.values(counts).reduce((a,x) => a + x, 0);
    const mx = Object.values(counts).reduce((a,x) => Math.max(a,x), 0);
    return mx <= maxRun * (total - mx + 1);
  };

  const out = []; let last = null, run = 0;
  while (out.length < cards.length){
    const live = [...by.keys()].filter(k => by.get(k).length);
    if (!live.length) break;
    /* If the only pile with cards left is the one already running, there is no
       legal move — take it rather than drop cards on the floor. */
    let legal = live.filter(k => !(k === last && run >= maxRun));
    if (!legal.length) legal = live;

    const counts = {}; live.forEach(k => counts[k] = by.get(k).length);
    let safe = legal.filter(k => {
      const after = Object.assign({}, counts);
      if (--after[k] === 0) delete after[k];
      return feasible(after);
    });
    /* Nothing safe means the deck was already tight before this step; fall
       back to the biggest pile, which is the move that relieves the pressure. */
    if (!safe.length) safe = [legal.reduce((m,k) => by.get(k).length > by.get(m).length ? k : m, legal[0])];

    const weight = safe.reduce((t,k) => t + by.get(k).length, 0);
    let r = Math.random() * weight, pick = safe[safe.length - 1];
    for (const k of safe){ r -= by.get(k).length; if (r <= 0){ pick = k; break; } }

    if (pick === last) run++; else { last = pick; run = 1; }
    out.push(by.get(pick).pop());
  }
  return out;
}

const MAX_RUN = 2;
const buildDeck = mix => interleave(sample(DECK, mix.n, mix.piles, mix.mode, MAX_RUN), MAX_RUN);

/* The pile a mix does not use is REMOVED, not greyed. Leaving a third pile on
   screen that is never the answer teaches a learner to stop looking at it —
   a habit that costs them the moment Mix 2 makes it live again. */
function applyMix(){
  document.body.classList.toggle('two-forms', currentMix.piles.length === 2);
}

function drawMixChips(){
  document.querySelectorAll('.mixrow').forEach(row => {
    row.innerHTML = '';
    MIXES.forEach(m => {
      const b = document.createElement('button');
      b.className = 'mixchip' + (m.id === currentMix.id ? ' sel' : '');
      b.innerHTML = '<span class="mn">' + m.name + '</span><span class="ms">' + m.sub + '</span>';
      b.onclick = () => { currentMix = m; applyMix(); drawMixChips(); };
      row.appendChild(b);
    });
  });
  document.querySelectorAll('.mixblurb').forEach(el => el.textContent = currentMix.blurb);
}

async function boot(){
  paintMute();
  drawLadder();
  try{
    const res = await fetch(DATA_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const d = await res.json();
    DECK = (d.sorting && d.sorting.cards) || d.cards || [];
    if (!DECK.length) throw new Error('no cards in the data');
    applyMix(); drawMixChips();
    $('gateLoading').style.display = 'none';
    $('gateReady').style.display = '';
    $('gateStart').focus();
  }catch(e){
    $('gateLoading').innerHTML = '<p class="err">Could not load <b>' + esc(DATA_URL) + '</b>.<br>' +
      'Open this from the site rather than as a local file — browsers block file:// requests.</p>';
  }
}

$('gateStart').onclick = () => { sfx('unlock'); start(); };

function start(){
  /* The board is always thirty-six holes, so a mix changes WHAT is under them
     rather than how many. Interleaved as well as sampled: a learner working
     along a row would otherwise hit a run of one form and start answering by
     habit, which is the same trap the deck game had, arriving spatially. */
  applyMix();
  const picked = interleave(sample(DECK, SLOTS, currentMix.piles, currentMix.mode, MAX_RUN), MAX_RUN);
  slots = picked.map(card => ({ card, done:false, missed:false }));
  mark = -1; done = 0; clean = 0; tries = 0; locked = false; open = null;
  started = true;
  document.body.classList.add('started');
  $('over').classList.remove('show');
  $('veil').classList.remove('show');
  drawLadder(); drawBoard(); paint();
}

/* Every circle must be reachable, so the layout is solved rather than left to
   wrap: find the column count that makes the circles largest while still
   fitting the height, then set the size from whichever dimension binds. */
function layout(){
  const b = $('board');
  const w = b.clientWidth, h = b.clientHeight;
  if (!w || !h) return;
  /* MAXIMISING SIZE ALONE DEALT A RAGGED BOARD. Five columns across thirty-six
     holes is seven full rows and one orphan sitting alone at the bottom left —
     which is what the solver picked on a phone, because five columns did make
     each circle a few pixels larger than six. A board is a rectangle before it
     is a set of circles, so divisors of the count are tried first and a ragged
     count is only accepted if it beats the best clean one by a real margin. */
  const clean = [], ragged = [];
  for (let cols = 2; cols <= SLOTS; cols++){
    const rows = Math.ceil(SLOTS / cols);
    const gap  = 8;
    const size = Math.min((w - gap*(cols-1)) / cols, (h - gap*(rows-1)) / rows);
    (SLOTS % cols === 0 ? clean : ragged).push({ size, cols });
  }
  const pick = a => a.reduce((m,x) => x.size > m.size ? x : m, { size:0, cols:1 });
  const bestClean = pick(clean), bestRagged = pick(ragged);
  const best = bestRagged.size > bestClean.size * 1.18 ? bestRagged : bestClean;
  const size = Math.max(34, Math.min(96, Math.floor(best.size) - 2));
  b.style.setProperty('--size', size + 'px');
  b.style.setProperty('--gap', Math.max(5, Math.round(size * 0.14)) + 'px');
  b.style.gridTemplateColumns = 'repeat(' + best.cols + ', ' + size + 'px)';
  /* The word has to fit inside the circle, whatever size it ended up. */
  b.style.setProperty('--word', Math.max(8, Math.round(size * 0.19)) + 'px');
}
window.addEventListener('resize', () => {
  layout();
  /* --word changed, so every word already placed has to be re-fitted or the
     board keeps sizes computed against the old circle. */
  slots.forEach((s, i) => {
    if (!s.done) return;
    const el = $('c' + i); if (el) fitWord(el, s.card.forms[s.card.pile]);
  });
});

/* The base size is a share of the circle; a token longer than about eight
   characters cannot fit at that size, so the size is scaled by the ratio of
   the fitting length to the real one and floored so it never goes illegible. */
function fitWord(el, text){
  const base = parseFloat(getComputedStyle($('board')).getPropertyValue('--word')) || 14;
  const longest = String(text).split(/\s+/).reduce((m,t) => Math.max(m, t.length), 0);
  const scale = longest > 8 ? Math.max(.66, 8 / longest) : 1;
  el.style.setProperty('--w', (base * scale).toFixed(1) + 'px');
}

function drawBoard(){
  const b = $('board'); b.innerHTML = '';
  slots.forEach((s, i) => {
    const el = document.createElement('button');
    el.className = 'circle';
    el.id = 'c' + i;
    el.setAttribute('aria-label', 'Hole ' + (i+1));
    el.innerHTML = '<span class="n">' + (i+1) + '</span>' + TICK + CROSS;
    el.onclick = () => openCircle(i);
    b.appendChild(el);
  });
  layout();
}

function drawLadder(){
  const l = $('ladder'); l.innerHTML = '';
  MARKS.forEach((m, i) => {
    if (i){
      const k = document.createElement('div');
      k.className = 'link' + (i <= mark ? ' done' : '');
      l.appendChild(k);
    }
    const el = document.createElement('div');
    el.className = 'mark' + (i <= mark ? ' done' : '');
    el.style.setProperty('--mc', m.col);
    el.innerHTML = '<div class="dot"></div><div class="lbl">' + m.label + '</div>';
    l.appendChild(el);
  });
}

function openCircle(i){
  if (!started || locked || slots[i].done) return;
  open = i;
  const c = slots[i].card;
  const stem = c.stem || c.trigger || '', trig = c.trigger || '';
  const words = stem.split(/\s+/);
  const n = Math.min(trig.split(/\s+/).length, words.length);
  $('sentence').innerHTML =
    esc(words.slice(0, words.length - n).join(' ')) + ' <b>' +
    esc(words.slice(words.length - n).join(' ')) + '</b> <i>_____</i> ' + esc(c.tail || '');

  const F = c.forms || {};
  $('w-ing').textContent  = F['-ing'] || '-ing';
  $('w-to').textContent   = F['to']   || 'to …';
  $('w-bare').textContent = F['bare'] || 'bare';

  ['ing','to','bare'].forEach(p => $('fm-' + p).classList.remove('tell'));
  $('rule').textContent = ''; $('rule').classList.remove('show');
  $('veil').classList.add('show');
  sfx('tick');
}

function answer(pile){
  if (open === null || locked) return;
  if (currentMix.piles.indexOf(pile) === -1) return;
  locked = true;
  tries++;
  const slot = slots[open], c = slot.card, el = $('c' + open);
  const ok = pile === c.pile;

  /* One line per answer, so October can be measured rather than remembered. */
  if (window.INTUITY) INTUITY.log('gerunds-infinitives', c.trigger, ok,
    { game:'board', mix:currentMix.id });

  if (ok){
    slot.done = true; done++;
    if (!slot.missed) clean++;
    el.className = 'circle done flip' + (slot.missed ? ' second' : '');
    el.innerHTML = '<span class="word">' + esc(c.forms[c.pile]) + '</span>' + TICK;
    fitWord(el, c.forms[c.pile]);
    el.setAttribute('aria-label', 'Turned: ' + c.forms[c.pile]);
    $('veil').classList.remove('show');
    $('fill').classList.add('gain');
    sfx('correct');
    setTimeout(() => burst(el), 60);
    checkMark();
    open = null; locked = false;
    paint();
    if (done >= GOAL) setTimeout(finish, 950);
  } else {
    /* Frightful, but brief. The rule appears, the right egg lights, the panel
       recoils, and the hole stays a hole — the turn is spent, nothing else. */
    const p = $('panel');
    p.classList.remove('bad'); void p.offsetWidth; p.classList.add('bad');
    $('rule').textContent = c.rule || '';
    $('rule').classList.add('show');
    $('fm-' + slug(c.pile)).classList.add('tell');
    slot.missed = true;
    el.classList.add('missed');
    el.classList.remove('failed'); void el.offsetWidth; el.classList.add('failed');
    $('track').classList.remove('knock'); void $('track').offsetWidth;
    $('track').classList.add('knock');
    $('fill').classList.add('sting');
    sfx('wrong');
    setTimeout(() => {
      $('veil').classList.remove('show');
      p.classList.remove('bad');
      $('fill').classList.remove('sting');
      open = null; locked = false;
      paint();
    }, 1800);
  }
}

function checkMark(){
  let m = -1;
  MARKS.forEach((x, i) => { if (done >= x.at) m = i; });
  if (m <= mark) return;
  mark = m;
  drawLadder();
  const b = $('banner');
  $('bannerText').textContent = MARKS[m].label;
  b.style.color = MARKS[m].col;
  b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
  sfx(m === MARKS.length - 1 ? 'fanfare' : 'pop');
  setTimeout(() => b.classList.remove('show'), 1500);
}

function paint(){
  /* Both numbers, always: how many are turned, and how many were turned
     without a stumble. The second is the one that means something. */
  $('tally').textContent = clean + ' first time';
  $('goal').title = currentMix.name;
  $('goal').textContent  = done + ' of ' + GOAL;
  const f = $('fill');
  f.style.width = Math.min(100, done / GOAL * 100) + '%';
  setTimeout(() => f.classList.remove('gain'), 600);
}

function finish(){
  if (window.INTUITY) INTUITY.session('gerunds-infinitives', 'board',
    { mix: currentMix.id, turned: done, clean: clean, tries: tries });
  $('overBig').textContent = done;
  const acc = done ? Math.round(clean / done * 100) : 0;
  $('overSub').textContent = currentMix.name.toLowerCase() + ' · ' + clean +
    ' first time · ' + acc + '% clean';
  drawMixChips();
  sfx('fanfare');
  $('over').classList.add('show');
}

/* ── THE BURST, FIRED AT THE CIRCLE THAT WAS WON ── */
function burst(el){
  if (matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const fx = $('fx');
  const r  = el.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  /* The old seven belonged to the dark theme — acid yellow, gold, mint and a
     sky blue that appears nowhere else. These are the board's own. */
  const COLS = ['#6B3FA0','#E8632A','#C2956E','#A3B26A','#FFFFFF','#B44A22'];

  const flash = document.createElement('div');
  flash.className = 'spark fw-flash';
  flash.style.left = cx + 'px'; flash.style.top = cy + 'px';
  fx.appendChild(flash);
  flash.animate([{ transform:'translate(-50%,-50%) scale(.15)', opacity:1 },
                 { transform:'translate(-50%,-50%) scale(3.4)', opacity:0 }],
                { duration:440, easing:'cubic-bezier(.1,.8,.2,1)' });
  setTimeout(() => flash.remove(), 460);

  [0,120].forEach((delay,k) => setTimeout(() => {
    const ring = document.createElement('div');
    ring.className = 'spark fw-ring';
    ring.style.left = cx + 'px'; ring.style.top = cy + 'px';
    fx.appendChild(ring);
    ring.animate([{ transform:'translate(-50%,-50%) scale(.12)', opacity:.9 },
                  { transform:'translate(-50%,-50%) scale(' + (2.4 + k) + ')', opacity:0 }],
                 { duration:640 + k*170, easing:'cubic-bezier(.1,.7,.2,1)' });
    setTimeout(() => ring.remove(), 840 + k*170);
  }, delay));

  shell(fx, cx, cy, 20, 34, 100, 480, ['#FFFFFF','#C2956E']);
  setTimeout(() => shell(fx, cx, cy, 38, 70, 220, 1000, COLS), 90);

  setTimeout(() => {
    for (let i = 0; i < 16; i++){
      const c = document.createElement('div');
      c.className = 'spark fw-crackle';
      const a = Math.random()*Math.PI*2, d = 26 + Math.random()*120;
      c.style.left = (cx + Math.cos(a)*d*.55) + 'px';
      c.style.top  = (cy + Math.sin(a)*d*.55) + 'px';
      fx.appendChild(c);
      c.animate([{ opacity:0, transform:'translate(-50%,-50%) scale(.3)' },
                 { opacity:1, transform:'translate(-50%,-50%) scale(1.4)', offset:.22 },
                 { opacity:0, transform:'translate(-50%,-50%) scale(.3)' }],
                { duration:300 + Math.random()*260, easing:'ease-out' });
      setTimeout(() => c.remove(), 600);
    }
  }, 260);
}

function shell(fx, cx, cy, n, near, far, life, cols){
  for (let i = 0; i < n; i++){
    const p = document.createElement('div');
    p.className = 'spark';
    const col = cols[(Math.random()*cols.length)|0];
    const size = 3 + Math.random()*4.5;
    p.style.cssText += 'left:'+cx+'px; top:'+cy+'px; width:'+size+'px; height:'+size+
      'px; background:'+col+'; box-shadow:0 0 '+(size*2.6)+'px '+col+';';
    fx.appendChild(p);
    const a = Math.random()*Math.PI*2, d = near + Math.random()*(far-near);
    const dx = Math.cos(a)*d, dy = Math.sin(a)*d;
    const fall = 50 + Math.random()*100, dur = life * (.75 + Math.random()*.5);
    p.animate([
      { transform:'translate(-50%,-50%) translate(0,0) scale(1.3)', opacity:1 },
      { transform:'translate(-50%,-50%) translate('+(dx*.6).toFixed(0)+'px,'+(dy*.6-14).toFixed(0)+'px) scale(1)', opacity:1, offset:.4 },
      { transform:'translate(-50%,-50%) translate('+dx.toFixed(0)+'px,'+(dy+fall).toFixed(0)+'px) scale(.2)', opacity:0 }
    ], { duration:dur, easing:'cubic-bezier(.1,.75,.3,1)' });
    setTimeout(() => p.remove(), dur + 40);
  }
}

/* ── SOUND ── */
function paintMute(){
  const on = !window.SFX || SFX.isOn();
  $('mute').textContent = on ? '🔊' : '🔇';
  $('mute').setAttribute('aria-label', on ? 'Sound on' : 'Sound off');
}
$('mute').onclick = () => { if (window.SFX) SFX.toggle(); paintMute(); };

/* Tapping the ground closes the card without spending the turn. */
$('veil').addEventListener('click', e => {
  if (e.target === $('veil') && !locked){ $('veil').classList.remove('show'); open = null; }
});

document.addEventListener('keydown', e => {
  if (!started){ if (e.key === 'Enter' || e.key === ' ') $('gateStart').click(); return; }
  if (open === null) return;
  if (e.key === 'Escape' && !locked){ $('veil').classList.remove('show'); open = null; }
  if (e.key === '1' || e.key === 'ArrowLeft')  answer('-ing');
  if (e.key === '2' || e.key === 'ArrowUp')    answer('to');
  if (e.key === '3' || e.key === 'ArrowRight') answer('bare');
});

boot();
</script>
