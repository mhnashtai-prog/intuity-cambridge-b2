<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FAF7F2">
<title>INTUITY — Gerunds & Infinitives</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=2">

<style>
/* ═══ WHAT ONLY THIS PAGE OWNS ═══
   Ported off the old standalone dark theme (#0d0d0d, gold #C9A961, its own
   header/mode-row/tab CSS, a click-opens-a-modal example viewer). All of
   that now comes from the shell; this page keeps only the tile-colour
   variants for the four verb categories and the tooltip that replaced the
   modal. */

html,body{width:100%;height:100%;overflow:hidden}

.inner{max-width:720px;margin:0 auto;padding:.9rem 1rem 2.5rem;
  display:flex;flex-direction:column;gap:1.1rem}

.cards{display:flex;flex-direction:column;gap:1.1rem}
.card{background:none;border:none;border-radius:0;padding:.3rem 0 1.3rem}
.cards .card:first-child{padding-top:.6rem}

.card-head{padding-bottom:.6rem;margin-bottom:.85rem;border-bottom:1px solid var(--rule)}
.cat-title{font-family:var(--f-display);font-weight:900;font-size:1.02rem;
  letter-spacing:-.005em;color:var(--ink)}
.cat-subtitle{font-size:.8rem;color:var(--faint);margin-top:.2rem;line-height:1.4}

.sec-label{font-family:var(--f-mono);font-size:.58rem;letter-spacing:.16em;
  text-transform:uppercase;color:var(--faint);margin:1rem 0 .5rem}
.cards .card > .sec-label:first-of-type{margin-top:0}

/* ── THE TILE, FOUR WAYS ──
   Same object the shell already uses everywhere else (.tile) — a fill and a
   radius, no rim. Colour is the only thing this page adds, and only to say
   which side of the gerund/infinitive line a word sits on. Kept as light
   tints of the shell's own ok/no/accent hues rather than new colours, so
   the page still reads as part of one product instead of bringing back the
   green/blue/gold/orange system the old dark theme used. */
.gi-grid{display:flex;flex-wrap:wrap;gap:.5rem}
.gi-tile{cursor:pointer}
.gi-tile.gerund{background:#E6E1D8;color:var(--tile-ink)}
.gi-tile.infinitive{background:#DCE3EF;color:#2B3E63}
.gi-tile.both{background:var(--tile-bg);color:var(--tile-ink)}
.gi-tile.warning{background:var(--tile-no-bg);color:var(--tile-no-ink)}
.gi-tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.gi-hint{font-size:.72rem;color:var(--faint);margin:-.3rem 0 .3rem;font-style:italic}

/* ── THE TOOLTIP, REPLACING THE MODAL ──
   Same idea as the recap tooltips in the games — appears near the tile that
   was tapped or hovered, dismisses on a second tap or a tap elsewhere — but
   styled with the same weight the old click-through modal used: a big bold
   headword, a short underline, then the sentence. Dominant enough to be the
   only thing worth reading for a moment, without taking over the screen the
   way a full modal did. */
.gi-tip{position:fixed;z-index:80;display:none;pointer-events:none;
  max-width:min(24rem,90vw);padding:1.5rem 1.6rem 1.4rem;border-radius:1.1rem;
  background:var(--card);box-shadow:0 24px 60px rgba(43,33,41,.26);
  text-align:left}
.gi-tip .tip-eyebrow{font-family:var(--f-mono);font-size:.62rem;
  letter-spacing:.18em;text-transform:uppercase;color:var(--faint);
  margin-bottom:.35rem}
.gi-tip .tip-word{font-family:var(--f-display);font-weight:900;
  font-size:clamp(1.7rem,7vw,2.3rem);line-height:1;letter-spacing:-.01em;
  text-transform:uppercase;color:var(--ink);margin-bottom:.6rem;
  word-break:break-word}
.gi-tip .tip-rule{width:44px;height:3px;border-radius:2px;
  background:var(--ink);margin-bottom:.8rem}
.gi-tip .tip-ex{font-family:var(--f-body);font-size:1rem;line-height:1.5;
  color:var(--sentence);margin-bottom:.4rem}
.gi-tip .tip-ex.no{color:var(--wrong)}
.gi-tip .tip-ex.no::before{content:'\2717  ';font-weight:700}
.gi-tip .tip-divider{border-top:1px solid var(--rule);margin:.9rem 0 .8rem}
.gi-tip .tip-note{font-size:.82rem;line-height:1.55;color:var(--dim)}
.gi-tip .tip-pattern{font-family:var(--f-mono);font-size:.7rem;
  color:var(--faint);margin-bottom:.7rem}

@media(min-width:900px){
  .cat-title{font-size:1.15rem}
  .vtab{font-size:.66rem}
  .mode-btn{font-size:.76rem}
}
</style>
</head>
<body>

<header class="header">
  <div class="header-top">
    <a class="back-link" href="/?openModal=grammar" target="_top">← Grammar</a>
    <div class="header-title">
      <div class="app-title">INTUITY</div>
      <div class="app-subtitle">Gerunds &amp; Infinitives</div>
    </div>
    <span class="header-spacer">Level <b>B2</b></span>
  </div>

  <div class="mode-selector">
    <button class="mode-btn active" data-mode="explore">Explore</button>
    <button class="mode-btn" data-mode="practice">Practice</button>
    <button class="mode-btn" data-mode="quiz">Quiz</button>
    <button class="mode-btn" data-mode="sort">Sort</button>
    <button class="mode-btn" data-mode="board">Board</button>
  </div>

  <div class="set-tabs" id="catTabs"></div>
  <div class="set-tabs hidden" id="frameTabs"></div>
</header>

<div class="area active" id="exploreArea">
  <div class="inner"><div class="cards" id="list"></div></div>
</div>

<div class="area sheet-mode" id="practiceArea">
  <div class="sheet-full">
    <button class="close-btn sheet-close" data-close type="button" aria-label="Close Practice">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
           stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="sheet-gate" id="practiceGate">
      <div class="gate-mark pend-hang"><div class="pend-dial"><span>?</span></div></div>
      <div class="gate-head">Pick a category above to start practising</div>
      <div class="gate-sub">Each category is a different group of verbs — choose one from the tabs above.</div>
    </div>
    <div class="frame"><iframe id="practiceFrame" title="Practice"></iframe></div>
  </div>
</div>

<div class="area sheet-mode" id="quizArea">
  <div class="sheet-full">
    <button class="close-btn sheet-close" data-close type="button" aria-label="Close Quiz">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
           stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="sheet-gate" id="quizGate">
      <div class="gate-mark pend-hang"><div class="pend-dial"><span>?</span></div></div>
      <div class="gate-head">Pick a category above to start the quiz</div>
      <div class="gate-sub">Each category is a different group of verbs — choose one from the tabs above.</div>
    </div>
    <div class="frame"><iframe id="quizFrame" title="Quiz"></iframe></div>
  </div>
</div>

<!-- Sort and Board work over the whole verb list rather than one category
     at a time, so unlike Practice/Quiz they open straight into the frame —
     no gate, nothing to choose first. -->
<div class="area sheet-mode" id="sortArea">
  <div class="sheet-full">
    <button class="close-btn sheet-close" data-close type="button" aria-label="Close Sort">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
           stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="frame"><iframe id="sortFrame" title="Sort"></iframe></div>
  </div>
</div>

<div class="area sheet-mode" id="boardArea">
  <div class="sheet-full">
    <button class="close-btn sheet-close" data-close type="button" aria-label="Close Board">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
           stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="frame"><iframe id="boardFrame" title="Board"></iframe></div>
  </div>
</div>

<div class="gi-tip" id="giTip"></div>

<div class="loading" id="loading" style="position:fixed;inset:0;display:flex;
     align-items:center;justify-content:center;background:var(--screen);z-index:99;
     font-family:var(--f-mono);font-size:.82rem;color:var(--faint)">Loading…</div>

<script>
/* ══════════════════════════════════════════════════════════════════════
   GERUNDS & INFINITIVES — Explore, with Practice/Quiz/Sort/Board as sheets.

   Same shape the old file read: rules.categories[] → {verbs, phrases,
   prepositions, adjectives, purpose, patterns}. Each entry carries either
   a flat example set (example / examples[] / example1+example2 / negative
   / meaning / note) or, for meaning-change verbs, a {gerund,infinitive}
   pair. That extraction logic is unchanged from the old page — only how
   the result gets on screen (a tile + tooltip, not a pill + modal) is new.
   ══════════════════════════════════════════════════════════════════════ */

const DEF   = '../../data/grammar-rules/gerunds-infinitives-complete.json';
const BUILD = '2026-09-01a';
const P     = new URLSearchParams(location.search);

let cats = [], cat = 0, mainMode = 'explore';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function styleClassFor(c){
  if(c.id === 'gerund-only') return 'gerund';
  if(c.id === 'infinitive-only') return 'infinitive';
  if(c.id === 'both-different') return 'warning';
  return 'both';
}

async function boot(){
  try{
    const res = await fetch(P.get('json') || DEF, { cache:'no-store' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    cats = data.rules.categories;
    if(!cats.length) throw new Error('no categories in the data file');
  }catch(e){
    $('list').innerHTML = '<div class="msg">Couldn\'t load gerunds &amp; infinitives.' +
      '<small>' + esc(String(e.message||e)) + '</small></div>';
    $('loading').style.display = 'none';
    syncHeader();
    return;
  }
  buildTabs();
  paintList();
  syncHeader();
  $('loading').style.display = 'none';
  idle(mountFrames);

  const wanted = P.get('mode');
  if(wanted && wanted !== 'explore' && document.querySelector('.mode-btn[data-mode="'+wanted+'"]')){
    mountFrames();
    switchMode(wanted);
  }
}
function idle(fn){
  if(window.requestIdleCallback) requestIdleCallback(fn,{timeout:1500}); else setTimeout(fn,400);
}
function mountFrames(){
  const map = {
    practiceFrame:'gerunds-infinitives-practice.html',
    quizFrame:'gerunds-infinitives-gapfill.html',
    sortFrame:'gerunds-sort.html',
    boardFrame:'gerunds-board.html'
  };
  Object.entries(map).forEach(([id,src]) => {
    const f = $(id);
    if(f && !f.getAttribute('src')) f.setAttribute('src', src + '?v=' + BUILD);
  });
}

/* ── tabs ── */
function buildTabs(){
  const wrap = $('catTabs');
  wrap.innerHTML = '';
  cats.forEach((c,i) => {
    const b = document.createElement('button');
    b.className = 'vtab' + (i===cat ? ' active' : '');
    b.textContent = c.title;
    b.title = c.subtitle || '';
    b.onclick = () => { if(i===cat) return; cat = i; buildTabs(); paintList(); hideTip(); };
    wrap.appendChild(b);
  });
  syncHeader();
}

/* ── list ──
   The section order is fixed rather than driven by whatever keys happen to
   exist, so a category's tiles line up under the same headings every time
   a student switches to it. */
const SECTIONS = [
  ['verbs','Verbs','verb'],
  ['phrases','Phrases','phrase'],
  ['prepositions','Prepositions + Gerund','pattern'],
  ['adjectives','Adjectives + Infinitive','pattern'],
  ['purpose','Purpose (Infinitive)','pattern'],
  ['patterns','Special Patterns','pattern']
];

function labelFor(item, key){
  if(key === 'pattern') return item.pattern.split(' +')[0];
  return item[key];
}

function paintList(){
  const c = cats[cat], wrap = $('list');
  if(!c){ wrap.innerHTML = '<div class="msg">No category selected.</div>'; return; }
  const cls = styleClassFor(c);

  let html = '<div class="card">' +
    '<div class="card-head"><div class="cat-title">' + esc(c.title) + '</div>' +
    (c.subtitle ? '<div class="cat-subtitle">' + esc(c.subtitle) + '</div>' : '') +
    '</div>' +
    '<div class="gi-hint">Tap or hover a word to see how it\u2019s used</div>';

  SECTIONS.forEach(([key,label,textKey]) => {
    const items = c[key];
    if(!items || !items.length) return;
    html += '<div class="sec-label">' + esc(label) + '</div><div class="gi-grid">';
    items.forEach((item,i) => {
      const text = labelFor(item, textKey);
      html += '<button type="button" class="tile gi-tile ' + cls + '" ' +
        'data-key="' + key + '" data-cat="' + cat + '" data-i="' + i + '">' +
        esc(text) + '</button>';
    });
    html += '</div>';
  });

  html += '</div>';
  wrap.innerHTML = html;

  wrap.querySelectorAll('.gi-tile').forEach(el => {
    const item = c[el.dataset.key][+el.dataset.i];
    el.addEventListener('mouseenter', () => showTip(el, item));
    el.addEventListener('mouseleave', hideTip);
    el.addEventListener('focus', () => showTip(el, item));
    el.addEventListener('blur', hideTip);
    el.addEventListener('click', e => {
      e.stopPropagation();
      if(tipOwner === el) hideTip(); else showTip(el, item);
    });
  });
}

/* ── the tooltip ──
   Content built with the same field-checking the old modal used
   (gerund/infinitive pair vs. flat example set), just formatted for a
   tighter card instead of a full-width panel. */
let tipOwner = null;

function tipHTML(item, cls){
  const eyebrow = { gerund:'Gerund only', infinitive:'Infinitive only',
                     both:'Verb pattern', warning:'Meaning changes' }[cls] || 'Verb pattern';

  if(item.gerund && item.infinitive){
    return '<div class="tip-eyebrow">' + esc(eyebrow) + '</div>' +
      '<div class="tip-word">' + esc(item.verb) + '</div>' +
      '<div class="tip-rule"></div>' +
      '<div class="tip-pattern">Gerund \u00b7 ' + esc(item.gerund.form) + '</div>' +
      '<div class="tip-ex">' + esc(item.gerund.example) + '</div>' +
      '<div class="tip-note">' + esc(item.gerund.meaning) + '</div>' +
      '<div class="tip-divider"></div>' +
      '<div class="tip-pattern">Infinitive \u00b7 ' + esc(item.infinitive.form) + '</div>' +
      '<div class="tip-ex">' + esc(item.infinitive.example) + '</div>' +
      '<div class="tip-note">' + esc(item.infinitive.meaning) + '</div>';
  }

  let h = '<div class="tip-eyebrow">' + esc(eyebrow) + '</div>' +
    '<div class="tip-word">' + esc(item.verb || item.phrase || item.pattern) + '</div>' +
    '<div class="tip-rule"></div>';
  if(item.pattern) h += '<div class="tip-pattern">' + esc(item.pattern) + '</div>';

  if(item.example) h += '<div class="tip-ex">' + esc(item.example) + '</div>';
  if(item.example1 && item.example2){
    h += '<div class="tip-ex">' + esc(item.example1) + '</div>' +
         '<div class="tip-ex">' + esc(item.example2) + '</div>';
  }
  if(item.examples && Array.isArray(item.examples)){
    item.examples.forEach(ex => { h += '<div class="tip-ex">' + esc(ex) + '</div>'; });
  }
  if(item.negative) h += '<div class="tip-ex no">' + esc(item.negative) + '</div>';
  if(item.meaning || item.note){
    h += '<div class="tip-divider"></div><div class="tip-note">' + esc(item.meaning || item.note) + '</div>';
  }
  return h;
}

function showTip(el, item){
  tipOwner = el;
  const tip = $('giTip');
  tip.innerHTML = tipHTML(item, el.dataset.cls);
  tip.style.display = 'block';
  const r = el.getBoundingClientRect();
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let left = r.left + r.width/2 - tw/2;
  left = Math.max(8, Math.min(left, window.innerWidth - tw - 8));
  let top = r.top - th - 10;
  if(top < 4) top = r.bottom + 10;
  tip.style.left = left + 'px';
  tip.style.top = top + 'px';
}
function hideTip(){
  tipOwner = null;
  $('giTip').style.display = 'none';
}
document.addEventListener('click', e => {
  if(tipOwner && !e.target.closest('.gi-tile')) hideTip();
});
window.addEventListener('scroll', hideTip, true);

/* ── modes ── */
const gateFor = { practice:{gate:'practiceGate', frame:'practiceFrame'},
                  quiz:    {gate:'quizGate',     frame:'quizFrame'} };
const testLists = { practice:null, quiz:null };
let frameActive = { practice:null, quiz:null };

function applyMode(mode){
  mainMode = mode;
  hideTip();
  document.querySelectorAll('.mode-btn[data-mode]').forEach(b =>
    b.classList.toggle('active', b.dataset.mode === mode));
  document.querySelectorAll('.area').forEach(a => a.classList.remove('active'));
  $('exploreArea').classList.add('active');
  $('catTabs').classList.toggle('hidden', mode !== 'explore');
  if(mode === 'practice'){ mountFrames(); $('practiceArea').classList.add('active'); openGate('practice'); }
  if(mode === 'quiz'){     mountFrames(); $('quizArea').classList.add('active'); openGate('quiz'); }
  if(mode === 'sort'){     mountFrames(); $('sortArea').classList.add('active'); }
  if(mode === 'board'){    mountFrames(); $('boardArea').classList.add('active'); }
  document.body.style.overflow = mode === 'explore' ? '' : 'hidden';
  paintFrameTabs();
  syncHeader();
}
function switchMode(mode){
  if(mode === mainMode) return;
  const u = new URL(location.href);
  if(mode === 'explore') u.searchParams.delete('mode'); else u.searchParams.set('mode', mode);
  history.replaceState(null,'',u);
  if(document.startViewTransition && !matchMedia('(prefers-reduced-motion: reduce)').matches){
    document.startViewTransition(() => applyMode(mode));
  }else{
    applyMode(mode);
  }
}
document.querySelectorAll('.mode-btn[data-mode]').forEach(b =>
  b.addEventListener('click', () => switchMode(b.dataset.mode)));

function closeSheet(){
  if(mainMode === 'explore') return;
  const cfg = gateFor[mainMode];
  if(cfg){
    const g = $(cfg.gate);
    if(g && !g.classList.contains('open')){ openGate(mainMode); return; }
  }
  switchMode('explore');
}
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeSheet));

document.addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  if(mainMode !== 'explore') switchMode('explore');
});

/* ── layout sync ── */
function syncHeader(){
  const h = document.querySelector('.header');
  if(h) document.documentElement.style.setProperty('--header-h', h.offsetHeight+'px');
}
window.addEventListener('resize', syncHeader);
window.addEventListener('orientationchange', () => setTimeout(syncHeader,120));
window.addEventListener('pageshow', e => { syncHeader(); if(e.persisted) requestAnimationFrame(syncHeader); });
if(document.fonts && document.fonts.ready) document.fonts.ready.then(syncHeader);
if(window.ResizeObserver){
  const h = document.querySelector('.header');
  if(h) new ResizeObserver(syncHeader).observe(h);
}else{
  [0,60,200,500].forEach(ms => setTimeout(syncHeader, ms));
}

/* ── set navigation for Practice/Quiz, same contract as Conditionals ── */
window.addEventListener('message', e => {
  if(!e.data || e.data.intuity !== 'tests') return;
  const from = e.data.mode;
  if(from !== 'practice' && from !== 'quiz') return;
  testLists[from] = e.data.titles || [];
  if(frameActive[from] !== null) frameActive[from] = e.data.active || 0;
  if(from === mainMode) paintFrameTabs();
});

function paintFrameTabs(){
  const wrap = $('frameTabs');
  if(!wrap) return;
  const titles = testLists[mainMode];
  const on = (mainMode === 'practice' || mainMode === 'quiz') && titles && titles.length;
  wrap.classList.toggle('hidden', !on);
  if(!on){ wrap.innerHTML = ''; syncHeader(); return; }
  wrap.innerHTML = titles.map((t,i) =>
    '<button class="vtab' + (i === frameActive[mainMode] ? ' active' : '') +
    '" type="button" data-i="' + i + '">' + esc(t) + '</button>').join('');
  wrap.querySelectorAll('.vtab').forEach(b =>
    b.addEventListener('click', () => chooseSet(mainMode, +b.dataset.i)));
  syncHeader();
}

function chooseSet(mode, index){
  frameActive[mode] = index;
  const f = $(gateFor[mode].frame);
  if(f && f.contentWindow) f.contentWindow.postMessage({ intuity:'setTest', index:index }, '*');
  const g = $(gateFor[mode].gate);
  if(g) g.classList.remove('open');
  paintFrameTabs();
}

function openGate(mode){
  if(gateFor[mode]) frameActive[mode] = null;
  const g = $(gateFor[mode] && gateFor[mode].gate);
  if(g) g.classList.add('open');
  paintFrameTabs();
  setTimeout(() => {
    if(mainMode === mode && (!testLists[mode] || !testLists[mode].length) && g)
      g.classList.remove('open');
  }, 1400);
}

function announceHost(){
  ['practiceFrame','quizFrame'].forEach(id => {
    const f = $(id);
    if(f && f.contentWindow){ try{ f.contentWindow.postMessage({intuity:'hostTabs'},'*'); }catch(e){} }
  });
}
['practiceFrame','quizFrame'].forEach(id => {
  const f = document.getElementById(id);
  if(f) f.addEventListener('load', announceHost);
});

boot();
</script>
</body>
</html>
