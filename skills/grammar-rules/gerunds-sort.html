<!DOCTYPE html>
<html lang="en">

<script>
  /* Set on the ROOT, in the head, before first paint. The old file added a
     class to <body> at the very end of its script, which meant an embedded
     copy painted its full 104px header once and then threw it away — a
     visible jolt on every open. The frame can be known before any pixel. */
  if (window.self !== window.top) document.documentElement.classList.add('embedded');
</script>
<style>
/* ═══ SORT ═══
   A sentence, a gap, and three forms it could take. Same material as Rack,
   Pegs and Pulse: one ground colour, tiles made of light, Anton for the
   headline, caramel for the form, a drawn violet tick or orange cross.

   THE CARD NOW WEARS THE EXPLORE-MAP POSTER, NOT THE PILE'S NEUMORPHISM.
   Sort's card used to be cut from the same cloth as the piles below it —
   an embossed slab on the ground colour, notched at the head. That made
   sense as long as "card vs. pile" was the only contrast on screen. But the
   card is also the one place in this game that quotes a sentence and states
   a rule, which across the rest of the product (Explore's map, its poster
   modal) is a different material entirely: flat paper, real ink, a mono
   structure chip, a kick line with a solid colour block. Borrowing that
   material here means a student who has opened a poster in Explore already
   knows how to read this card — bold is the trigger, the small grey block
   under the kicker is the rule, mono means "this is the grammar itself".
   The card's corners are square, not rounded — paper cut straight, not a
   tile with worn edges — which keeps it visually distinct from every
   rounded surface around it.

   THE PILES NOW MATCH PULSE'S PARTICLE BUTTONS. The embossed, notched pile
   — a hole pressed into the ground colour, borrowed from Pegs — has been
   replaced with the flat raised capsule Pulse uses for its particle choices
   ("out", "up", "for", "around"): one flat fill, a soft drop-shadow instead
   of an inset emboss, no notch cut into the top. A student who has played
   Pulse already knows what these are, and the two games now read as the
   same family of "tap one of these" control rather than two different
   materials doing the same job.

   THREE HUES BECAME ONE. The old piles were mint, sky and amber — three
   colours whose only job was to say "this is pile one, this is pile two".
   Pulse settled that question for the set: the lane is identified by its
   position and its key, both of which are already on it. So all three forms
   are set in ink, and the colour budget is spent where it earns something —
   violet means right, orange means wrong, and nothing else is coloured at
   all. A student now has two colours to learn instead of five.

   THE BAR EARNED ITS KEEP. It was a rule at the bottom that only ever grew.
   It now runs a light along itself when you are right and takes a knock when
   you are wrong, so the round's feeling lives somewhere other than a number. */

*,*::before,*::after{ margin:0; padding:0; box-sizing:border-box; }

:root{
  --ground:#E4E0E0;
  --band:#FAF7F2;
  --ink:#17171A;
  --dim:#5C6366;
  --faint:#8A9093;
  --rule:#C2956E;
  --caramel:#B0865C;
  --tick:#6B3FA0;
  --cross:#E8632A;
  --egg-right:#6B7A3A;
  --bad:#B8402A;
  --hot:#B44A22;
  --shade:40,50,54;
  --header-h:96px; --bar-h:46px;
  --spring:cubic-bezier(.2,1.4,.4,1);
  /* the poster's own palette, borrowed from explore-map.html's modal card —
     kept separate from the ground tokens above rather than reusing --ink /
     --faint, because those are tuned for the emboss and read too flat on
     flat paper */
  --poster:#ECE9E3;
  --poster-ink:#14110E;
  --poster-soft:rgba(20,17,14,.6);
  --poster-faint:rgba(20,17,14,.5);
  --poster-rule:rgba(20,17,14,.2);
  --f-mono2:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}

html,body{ width:100%; height:100%; overflow:hidden; }
body{
  background:var(--ground); color:var(--ink);
  font-family:'DM Sans',system-ui,sans-serif; -webkit-font-smoothing:antialiased;
  user-select:none; -webkit-user-select:none; touch-action:manipulation;
}
button{ font:inherit; border:none; background:none; cursor:pointer; color:inherit; }
:focus-visible{ outline:2px solid var(--hot); outline-offset:3px; border-radius:6px; }

/* ── EMBEDDED ──
   Opened inside the rules page the title, subtitle and back link are already
   on screen directly above. Repeating them costs about seventy pixels of a
   frame that has barely two hundred to give. */
html.embedded .htop{ display:none; }
html.embedded .header{ height:auto; padding:.35rem 1rem .3rem; gap:0; }

/* ══ HEADER ══ */
.header{
  position:fixed; top:0; left:0; right:0; z-index:20; height:var(--header-h);
  display:flex; flex-direction:column; justify-content:center; gap:.5rem;
  padding:.6rem 1rem; background:var(--band); border-bottom:1px solid var(--rule);
}
.htop{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; }
.back{
  justify-self:start; text-decoration:none;
  font-family:'Space Grotesk',sans-serif; font-size:.6rem; font-weight:700;
  letter-spacing:.08em; text-transform:uppercase; color:var(--faint);
  transition:color .2s; white-space:nowrap;
}
.back:hover{ color:var(--ink); }
.title{ display:flex; flex-direction:column; align-items:center; line-height:1.1; }
.title b{
  font-family:'Space Grotesk',sans-serif; font-size:1rem; font-weight:900;
  letter-spacing:.2em; color:var(--ink);
}
.title span{
  font-size:.56rem; font-weight:600; letter-spacing:.16em;
  text-transform:uppercase; color:var(--faint); margin-top:.15rem;
}
.mute{ justify-self:end; font-size:.95rem; opacity:.5; transition:opacity .2s; }
.mute:hover{ opacity:1; }

.hud{
  display:flex; justify-content:center; flex-wrap:wrap; gap:.9rem;
  font-family:'DM Mono',monospace; font-size:.66rem; color:var(--faint);
}
.hud b{ color:var(--dim); font-weight:500; font-variant-numeric:tabular-nums; }
.hud .streak b{ transition:color .15s, transform .2s var(--spring); display:inline-block; }
.hud .streak.live b{ color:var(--hot); }
.hud .streak.pop b{ transform:scale(1.35); }

/* ══ STAGE ══ */
.stage{
  position:fixed; top:var(--header-h); left:0; right:0; bottom:var(--bar-h);
  display:flex; flex-direction:column; justify-content:center;
  gap:clamp(1.1rem,4vh,2.2rem); padding:1rem .9rem 1.1rem;
}
html.embedded .stage{ top:44px; padding:.7rem .7rem .8rem; }

/* ── THE CARD ──
   Flat paper, not an embossed tile. See the top-of-file note: this is the
   one deliberate material break from the rest of the game, borrowed whole
   from explore-map.html's poster modal so a student reads it the same way.
   Corners are square — paper cut straight — rather than rounded like every
   pill and tile around it, which keeps the one "this states a rule" surface
   visually singular on screen. */
.cardwrap{
  flex:0 1 auto; display:flex; align-items:center; justify-content:center;
  min-height:0; position:relative;
  margin-top:-15%;   /* shifts the card upward, piles stay put */
}
.card{
  position:relative; text-align:left;
  padding:clamp(1.5rem,5vw,2.3rem) clamp(1.3rem,4.6vw,2rem);
  background:var(--poster); border-radius:0;
box-shadow:0 1px 3px rgba(0,0,0,.10);
  transition:transform .28s cubic-bezier(.2,.9,.3,1), opacity .28s;

  width:min(7cm,90vw);
  aspect-ratio:16/10;
  min-width:0;
  min-height:0;
  overflow:hidden;
}
@media (min-width:760px){
  .card{
    width:min(11cm,55vw);
    aspect-ratio:16/10;   /* ← add this line, PC-only override */
  }
}
.card .kick{
  display:flex; align-items:center; gap:9px;
  font-family:var(--f-mono2); font-size:.56rem; letter-spacing:.22em;
  text-transform:uppercase; color:var(--poster-faint); margin-bottom:1.1rem;
}
.card .kick i{ display:block; width:26px; height:10px; flex:none; background:var(--caramel); }

/* THE WHOLE SENTENCE, NOT JUST THE TRIGGER. A student meeting "insist on" in
   isolation is learning a list; meeting it in "He insisted on _____ the bill"
   is meeting the language. */
.card .sentence{
  font-family:'DM Sans',sans-serif; font-weight:400; line-height:1.4;
  font-size:clamp(.85rem,3vw,1.05rem); color:var(--poster-soft);
}
/* The trigger is set in Anton — the set's headline face — at reading size. */
.card .sentence b{
  font-family:'Anton',Impact,sans-serif; font-weight:400;
  letter-spacing:.02em; color:var(--poster-ink);
  font-size:3em;
}
/* The gap is the one thing that must not look like a word. */
.card .sentence i{
  font-style:normal; letter-spacing:.14em; color:var(--poster-faint); padding:0 .12em;
}

/* ONE MESSAGE SLOT, ALWAYS THE SAME HEIGHT.
   Holds the "seen before" kicker, or the correction, or nothing, and
   reserves the tallest of the three so the card's height is fixed for the
   whole round. */
.card .note{
  margin-top:.9rem; min-height:3.5em;
  display:flex; flex-direction:column; align-items:flex-start; justify-content:center;
  gap:.3rem;
}
.card .note .kick{
  font-family:'DM Mono',monospace; font-size:.58rem; letter-spacing:.14em;
  text-transform:uppercase; color:var(--hot); margin-bottom:0;
}
/* The rule, as the poster states its grammar: a mono chip, not a red
   warning line — the correction is information, not an alarm. */
.card .note .r{
  font-family:var(--f-mono2); font-weight:500; font-size:.78rem; color:var(--poster-ink);
  background:rgba(20,17,14,.09); border-radius:3px; padding:.42em .7em; display:inline-block;
}
.card .note .eg{ font-size:.82rem; color:var(--poster-soft); font-style:italic; line-height:1.5; }

.card.gone-ing{ transform:translateX(-46vw) rotate(-11deg); opacity:0; }
.card.gone-to{ transform:translateY(-36vh) scale(.82); opacity:0; }
.card.gone-bare{ transform:translateX(46vw) rotate(11deg); opacity:0; }
.card.shake{ animation:shake .42s; }
@keyframes shake{
  0%,100%{ transform:none } 20%{ transform:translateX(-11px) }
  40%{ transform:translateX(9px) } 60%{ transform:translateX(-6px) }
  80%{ transform:translateX(4px) }
}

/* ── THE PILES ──
   A flat raised capsule, the same material Pulse uses for its particle
   choices — one flat fill, a soft drop-shadow standing it off the ground
   colour, no notch, no inset emboss. Position and key identify which pile
   is which, so nothing here needs to be a different colour or a different
   shape to be told apart. */
.piles{
  flex:0 0 auto; display:flex; justify-content:center; align-items:flex-start;
  gap:clamp(.5rem,2.4vw,.9rem); width:100%; max-width:34rem; margin:0 auto;
}
.pile{ flex:0 0 auto; }   /* was: position:relative; display:block; — add flex:0 0 auto so it doesn't grow to fill space */
  
.pile .face{
  position:relative; border-radius:999px; background:#BFBFC2;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:.25rem; padding:.35rem .8em .4rem;   /* was: .30rem .3rem .3rem */
  transition:background .15s, transform .12s var(--spring);
  overflow:visible;
}
.pile:active .face{ transform:scale(.96); }

/* The form itself, set plainly — no pill behind it, just weight and colour
   doing the work, the way Pulse sets its particle word directly on the
   capsule. */
.egg{
  padding:0; display:flex; align-items:center; justify-content:center;
}
.egg span{
  font-family:'Space Grotesk',sans-serif; font-weight:700;
  font-size:clamp(.7rem,2.6vw,.85rem); letter-spacing:.015em;
  color:var(--ink); line-height:1.15; white-space:nowrap; transition:color .18s ease;
}
.pile:hover .egg span{ color:var(--hot); }
.pile.hit .egg span{ color:var(--egg-right); }
.pile.tell .egg span{ color:var(--egg-right); }
.pile.hit{ animation:pop .38s var(--spring); }
@keyframes pop{ 40%{ transform:translateY(-5px) scale(1.04) } 100%{ transform:none } }

.pile .name{
  font-family:'DM Mono',monospace; font-size:.6rem; letter-spacing:.2em;
  text-transform:uppercase; color:var(--dim); text-align:center;
}
.pile .tally{
  font-family:'DM Mono',monospace; font-size:.62rem; color:var(--dim);
  font-variant-numeric:tabular-nums;
}
/* The key, for anyone on a laptop. Position and key identify the pile — which
   is precisely why the three no longer need three colours between them. */
.pile .key{
  position:absolute; z-index:2; top:.42rem; left:.5rem; font-family:'DM Mono',monospace;
  font-size:.55rem; color:var(--faint); opacity:.75; pointer-events:none;
}
@media (max-width:560px){ .pile .key{ display:none; } }

/* The drawn marks, on the face rather than beside it. */
.mk{
  position:absolute; right:7%; bottom:7%; z-index:2;
  opacity:0; transform:scale(.6); transform-origin:70% 70%;
  transition:opacity .2s, transform .3s var(--spring); pointer-events:none;
}
.mk.tick{ width:22%; }
.mk.cross{ width:20%; }
.pile.hit .mk.tick{ opacity:1; transform:scale(1); }
.pile.miss .mk.cross{ opacity:1; transform:scale(1); }

/* ── THE MIX CHOOSER ──
   Raised chips, as Pegs' bank uses for the piece in your hand: the thing you
   are about to pick up sits proud of the ground. */
.mixrow{ display:flex; flex-wrap:wrap; justify-content:center; gap:.45rem; margin:.2rem 0 .7rem; }
.mixchip{
  display:flex; flex-direction:column; align-items:center; gap:.1rem;
  padding:.45rem .95rem .5rem; border-radius:999px; background:#E4E4E6;
  transition:transform .12s var(--spring), background .15s;
}
.mixchip:active{ transform:scale(.95); background:#D8D8DA; }
.mixchip .mn{
  font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:.74rem;
  letter-spacing:.03em; color:var(--dim);
}
.mixchip .ms{
  font-family:'DM Mono',monospace; font-size:.53rem; letter-spacing:.09em;
  text-transform:uppercase; color:var(--faint);
}
.mixchip.sel{ background:var(--hot); filter:drop-shadow(2px 4px 9px rgba(180,74,34,.32)); }
.mixchip.sel .mn{ color:#FFF7F3; }
.mixchip.sel .ms{ color:rgba(255,247,243,.72); }
.mixblurb{
  font-size:.78rem; color:var(--dim); line-height:1.5;
  max-width:23rem; margin:0 auto .2rem;
}

/* In a two-form mix the third pile is gone and the two that remain widen to
   fill the row, so the board does not look like it is missing a piece. */
body.two-forms .piles{ max-width:24rem; }
body.two-forms #p-bare{ display:none; }

/* ══ THE BAR ══
   Progress through the deck, but it is also where the round's feeling lives:
   a right answer runs a light along it, a wrong one knocks it sideways. */
.bar{
  position:fixed; left:0; right:0; bottom:0; height:var(--bar-h); z-index:15;
  display:flex; align-items:center; gap:.8rem;
  padding:0 1rem calc(env(safe-area-inset-bottom,0px) * .5);
  background:var(--band); border-top:1px solid rgba(var(--shade),.14);
  font-family:'DM Mono',monospace; font-size:.6rem; letter-spacing:.1em;
  text-transform:uppercase; color:var(--faint);
}
.track{
  position:relative; flex:1; height:7px; border-radius:999px; overflow:hidden;
  background:#D8D8DA;
}
.fill{
  position:relative; height:100%; width:0; border-radius:999px;
  background:var(--caramel); overflow:hidden;
  transition:width .45s cubic-bezier(.2,.9,.3,1), background .3s;
}
.fill::after{
  content:''; position:absolute; inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent);
  transform:translateX(-100%); opacity:0;
}
.fill.gain::after{ animation:sweep .55s ease-out; }
@keyframes sweep{
  0%{ transform:translateX(-100%); opacity:1 }
  100%{ transform:translateX(220%); opacity:0 }
}
.track.knock{ animation:knock .4s; }
@keyframes knock{
  0%,100%{ transform:none } 25%{ transform:translateX(-5px) }
  60%{ transform:translateX(4px) }
}
.fill.sting{ background:var(--bad); }
.bar .n{ font-variant-numeric:tabular-nums; color:var(--dim); }

/* ══ THE BURST ══
   On its own fixed layer. Sparks are absolutely positioned, and an absolutely
   positioned descendant still counts toward a scrolling container's overflow
   — inside the stage every celebration would briefly grow the scroll area and
   reflow the board underneath it. */
.fx{ position:fixed; inset:0; z-index:35; pointer-events:none; overflow:hidden; }
.spark{ position:absolute; width:5px; height:5px; border-radius:50%; pointer-events:none; }
.fw-flash{
  width:64px; height:64px; border-radius:50%;
  background:radial-gradient(circle,#fff 0%,rgba(194,149,110,.75) 38%,rgba(194,149,110,0) 70%);
}
.fw-ring{
  width:56px; height:56px; border-radius:50%;
  border:3px solid rgba(107,63,160,.55);
}
.fw-crackle{
  width:3px; height:3px; border-radius:50%; background:var(--tick);
  box-shadow:0 0 7px rgba(107,63,160,.7);
}

/* ══ THE LOADING PENDULUM ══ */
.pend{
  position:relative; width:104px; height:104px; margin:0 auto .95rem;
  transform-origin:50% -40px; animation:pendSwing 2.7s ease-in-out infinite;
}
.pend::before{
  content:''; position:absolute; left:50%; top:-40px; width:2px; height:40px;
  border-left:1.5px solid var(--caramel); transform:translateX(-50%);
}
.pend::after{
  content:''; position:absolute; left:50%; top:-43px; width:7px; height:7px;
  border-radius:50%; background:var(--caramel); transform:translateX(-50%);
}
.pend-dial{
  position:relative; width:100%; height:100%; border-radius:50%;
  background:#E4E4E6;
  display:flex; align-items:center; justify-content:center;
}
.pend-dial::before{ content:''; position:absolute; inset:0; border-radius:50%; background:var(--caramel); }
.pend-dial::after{ content:''; position:absolute; inset:8.5%; border-radius:50%; background:var(--ink); }
.pend-dial span{
  position:relative; z-index:2; font-family:'Space Grotesk',sans-serif;
  font-weight:900; font-size:1rem; color:#E5D1B8;
}
@keyframes pendSwing{ 0%,100%{ transform:rotate(-11deg) } 50%{ transform:rotate(11deg) } }

/* ══ THE ENTRY GATE ══ */
.gate{
  position:fixed; inset:0; z-index:50; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:.15rem;
  padding:2rem 1.5rem; text-align:center; background:var(--ground);
}
.gate .gate-loading{ font-size:.86rem; color:var(--faint); }
.gate .kicker{
  font-family:'DM Mono',monospace; font-size:.62rem; letter-spacing:.2em;
  text-transform:uppercase; color:var(--faint); margin-bottom:.5rem;
}
.gate .msg{
  font-family:'Space Grotesk',sans-serif; font-weight:700;
  font-size:clamp(1rem,3.8vw,1.3rem); line-height:1.35; color:var(--ink);
  max-width:22rem; margin:0 auto;
}
.gate .sub{ margin-top:.55rem; font-size:.82rem; color:var(--dim); max-width:21rem; line-height:1.55; }
.gate .go{ margin-top:1.2rem; }
body.started .gate{ display:none; }
body:not(.started) .stage,
body:not(.started) .bar{ display:none; }

/* ══ END OF ROUND ══ */
.over{
  position:fixed; inset:0; z-index:40; display:none;
  flex-direction:column; align-items:center; justify-content:center;
  gap:.55rem; padding:2rem 1.5rem; text-align:center; background:var(--ground);
}
.over.show{ display:flex; }
.over .big{
  font-family:'Anton',Impact,sans-serif; font-weight:400;
  font-size:clamp(2.6rem,13vw,4rem); letter-spacing:.02em;
  text-transform:uppercase; color:var(--ink); line-height:1;
}
.over .sub{ font-size:.86rem; color:var(--dim); max-width:22rem; line-height:1.6; }
.over .list{
  margin-top:1rem; max-width:30rem; font-size:.8rem; color:var(--dim); line-height:1.95;
}
.over .list b{ color:var(--ink); font-weight:600; }
.acts{ display:flex; flex-wrap:wrap; gap:.6rem; justify-content:center; margin-top:1.1rem; }
.go{
  font-family:'Space Grotesk',sans-serif; font-size:.7rem; font-weight:700;
  letter-spacing:.06em; padding:.6rem 1.4rem; border-radius:999px;
  background:var(--hot); color:#FFF7F3; transition:transform .1s var(--spring);
}
.go:active{ transform:scale(.95); }
.quiet{
  font-family:'Space Grotesk',sans-serif; font-size:.7rem; font-weight:700;
  letter-spacing:.06em; padding:.6rem 1.2rem; border-radius:999px;
  background:rgba(var(--shade),.08); color:var(--dim);
  transition:transform .1s var(--spring);
}
.quiet:active{ transform:scale(.95); }
html.embedded .away{ display:none; }
.away{ margin-top:1.3rem; }

.err{ color:var(--bad); line-height:1.7; text-align:center; max-width:30rem; }

@media (prefers-reduced-motion:reduce){
  *{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
  .pend{ animation:none; }
}
</style>
</head>
<body>

<header class="header">
  <div class="htop">
    <a class="back" href="/?openModal=grammar" target="_top">← Grammar</a>
    <div class="title"><b>INTUITY</b><span>Gerunds &amp; Infinitives</span></div>
    <button class="mute" id="mute" aria-label="Sound">🔊</button>
  </div>
  <div class="hud">
    <span><b id="right">0</b> right</span>
    <span><b id="wrong">0</b> wrong</span>
    <span class="streak" id="streakWrap">streak <b id="streak">0</b></span>
    <span><b id="left">0</b> to go</span>
  </div>
</header>

<div class="stage">
  <div class="cardwrap">
    <div class="card" id="card">
      <div class="kick"><i></i>Gerunds &amp; Infinitives</div>
      <div class="sentence" id="sentence">…</div>
      <div class="note" id="note" aria-live="polite"></div>
    </div>
  </div>

  <div class="piles">
    <button class="pile" id="p-ing" onclick="choose('-ing')">
      <span class="key">←</span>
      <span class="face">
        <span class="egg"><span id="f-ing">…</span></span>
        <span class="name">gerund</span>
      </span>
    </button>
    <button class="pile" id="p-to" onclick="choose('to')">
      <span class="key">↑</span>
      <span class="face">
        <span class="egg"><span id="f-to">…</span></span>
        <span class="name">infinitive</span>
      </span>
    </button>
   <button class="pile" id="p-bare" onclick="choose('bare')">
  <span class="key">→</span>
  <span class="face">
    <span class="egg"><span id="f-bare">…</span></span>
    <span class="name">no &ldquo;to&rdquo;</span>
    <span class="tally" id="t-bare">0</span>   ← delete this line
  </span>
</button>
  </div>
</div>

<div class="bar">
  <span class="n" id="sortedLabel">0 / 0</span>
  <div class="track" id="track"><div class="fill" id="fill"></div></div>
  <span id="deckLabel">sorted</span>
</div>

<div class="fx" id="fx" aria-hidden="true"></div>

<!-- THE GATE. One element, mounted once, for the whole span from "fetching"
     to "waiting for Start" — see the comment on .gate in <style>. -->
<div class="gate" id="gate">
  <div class="pend" aria-hidden="true"><div class="pend-dial"><span>?</span></div></div>
  <div class="gate-loading" id="gateLoading">Loading the deck…</div>
  <div id="gateReady" style="display:none">
    <div class="kicker">Sort</div>
    <div class="msg">Read the sentence, choose the form</div>
    <div class="mixrow"></div>
    <div class="mixblurb"></div>
    <div class="sub">Get one wrong and it comes back four cards later, while the correction is still warm. The round ends when the deck is empty.</div>
    <button class="go" id="gateStart">Start</button>
  </div>
</div>

<div class="over" id="over">
  <div class="big" id="overBig">0%</div>
  <div class="sub" id="overSub"></div>
  <div class="list" id="overList"></div>
  <div class="mixrow"></div>
  <div class="acts">
    <button class="quiet" id="againMissed" onclick="start('missed')">↻ Just the ones I missed</button>
    <button class="go" onclick="start('fresh')">New deck →</button>
  </div>
  <button class="quiet away" onclick="(window.top||window).location.href='/?openModal=grammar'">Back to grammar</button>
</div>

<script src="intuity-log.js"></script>
<script src="intuity-sound.js"></script>
<script>
/* ======================================================================
   SORT THE VERBS

   The gap-fill asks a student to WRITE "considering" when the only thing
   being tested is whether `consider` takes -ing. All the effort goes into
   the spelling, which is not the thing being learned.

   Here the sentence is on the card and the three forms are on the piles.
   The decision is the whole exercise, so a student makes thirty or forty of
   them in the time the gap-fill allowed ten — and this part of the topic is
   memory, which needs encounters rather than explanations.

   A card answered right leaves the deck. A card answered wrong goes back in,
   four places down, and returns while the correction is still warm. A round
   ends when the deck is empty, so it ends in mastery rather than when a
   clock runs out.
====================================================================== */

const DATA_URL = '../../data/grammar-rules/gerunds-infinitives-complete.json';

let DECK = [], queue = [], current = null;
let right = 0, wrong = 0, streak = 0, best = 0, total = 0;
let missed = new Map(), lastMissed = [], locked = false, started = false;

const $  = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const shuffle = a => { const b=[...a]; for(let i=b.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[b[i],b[j]]=[b[j],b[i]];} return b; };
const slug = p => p.replace('-','');
const PILE_OF = { ing:'-ing', to:'to', bare:'bare' };
const sfx = (name) => { try { if (window.SFX && SFX[name]) SFX[name](); } catch(e){} };

const TICK = '<svg class="mk tick" viewBox="0 0 24 24" fill="none" stroke="var(--tick)" ' +
  'stroke-width="5.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
  '<path d="M3 13.5c2.6 1.4 4.4 3.2 5.8 5.4C11.4 13 15.2 8 21 4.2"/></svg>';
const CROSS = '<svg class="mk cross" viewBox="0 0 24 24" fill="none" stroke="var(--cross)" ' +
  'stroke-width="5.8" stroke-linecap="round" aria-hidden="true">' +
  '<path d="M5.4 5c4.2 4.2 8.6 9.2 13.4 14.2M18.6 5.4C14.2 9.4 9.6 14.6 5.2 19"/></svg>';

const MIXES = [
  { id:'m1', name:'Mix 1', sub:'two forms',   n:24,
    piles:['-ing','to'],         mode:'balanced',
    blurb:'Gerund or infinitive, evenly split. The core contrast, and nothing else on screen.' },
  { id:'m2', name:'Mix 2', sub:'three forms', n:30,
    piles:['-ing','to','bare'],  mode:'balanced',
    blurb:'The bare infinitive joins. There are only four of them, so they come up far more often here than in real English — which is the only way to actually meet them.' },
  { id:'m3', name:'Mix 3', sub:'true odds',   n:36,
    piles:['-ing','to','bare'],  mode:'natural',
    blurb:'Sampled at the rate the language really uses: mostly gerunds. No help from the odds.' },
];
let currentMix = MIXES[0];

function sample(pool, n, piles, mode, maxRun){
  const usable = pool.filter(c => piles.indexOf(c.pile) !== -1);

  if (mode === 'natural'){
    const by = new Map();
    usable.forEach(c => { if (!by.has(c.pile)) by.set(c.pile, []); by.get(c.pile).push(c); });
    by.forEach((v, k) => by.set(k, shuffle(v)));
    const keys = [...by.keys()];
    const share = k => by.get(k).length / usable.length;

    const quota = {}; let placed = 0;
    keys.forEach(k => { quota[k] = Math.min(by.get(k).length, Math.floor(share(k) * n)); placed += quota[k]; });
    keys.slice().sort((a,b) => (share(b)*n - Math.floor(share(b)*n)) - (share(a)*n - Math.floor(share(a)*n)))
        .forEach(k => { while (placed < n && quota[k] < by.get(k).length){ quota[k]++; placed++; } });

    const cap = Math.floor(maxRun * (n + 1) / (maxRun + 1));
    let surplus = 0;
    keys.forEach(k => { if (quota[k] > cap){ surplus += quota[k] - cap; quota[k] = cap; } });
    keys.forEach(k => { while (surplus > 0 && quota[k] < Math.min(cap, by.get(k).length)){ quota[k]++; surplus--; } });

    const out = [];
    keys.forEach(k => { for (let i = 0; i < quota[k]; i++) out.push(by.get(k).pop()); });
    return out;
  }

  const by = new Map();
  usable.forEach(c => { if (!by.has(c.pile)) by.set(c.pile, []); by.get(c.pile).push(c); });
  by.forEach((v, k) => by.set(k, shuffle(v)));
  const keys = [...by.keys()], out = [];
  while (out.length < n){
    let moved = false;
    for (const k of keys){
      const b = by.get(k);
      if (b && b.length){ out.push(b.pop()); moved = true; if (out.length >= n) break; }
    }
    if (!moved) break;
  }
  return out;
}

function interleave(cards, maxRun){
  const by = new Map();
  cards.forEach(c => { if (!by.has(c.pile)) by.set(c.pile, []); by.get(c.pile).push(c); });
  by.forEach((v, k) => by.set(k, shuffle(v)));

  const feasible = (counts) => {
    const total = Object.values(counts).reduce((a,x) => a + x, 0);
    const mx = Object.values(counts).reduce((a,x) => Math.max(a,x), 0);
    return mx <= maxRun * (total - mx + 1);
  };

  const out = []; let last = null, run = 0;
  while (out.length < cards.length){
    const live = [...by.keys()].filter(k => by.get(k).length);
    if (!live.length) break;
    let legal = live.filter(k => !(k === last && run >= maxRun));
    if (!legal.length) legal = live;

    const counts = {}; live.forEach(k => counts[k] = by.get(k).length);
    let safe = legal.filter(k => {
      const after = Object.assign({}, counts);
      if (--after[k] === 0) delete after[k];
      return feasible(after);
    });
    if (!safe.length) safe = [legal.reduce((m,k) => by.get(k).length > by.get(m).length ? k : m, legal[0])];

    const weight = safe.reduce((t,k) => t + by.get(k).length, 0);
    let r = Math.random() * weight, pick = safe[safe.length - 1];
    for (const k of safe){ r -= by.get(k).length; if (r <= 0){ pick = k; break; } }

    if (pick === last) run++; else { last = pick; run = 1; }
    out.push(by.get(pick).pop());
  }
  return out;
}

const MAX_RUN = 2;
const buildDeck = mix => interleave(sample(DECK, mix.n, mix.piles, mix.mode, MAX_RUN), MAX_RUN);

function applyMix(){
  document.body.classList.toggle('two-forms', currentMix.piles.length === 2);
}

function drawMixChips(){
  document.querySelectorAll('.mixrow').forEach(row => {
    row.innerHTML = '';
    MIXES.forEach(m => {
      const b = document.createElement('button');
      b.className = 'mixchip' + (m.id === currentMix.id ? ' sel' : '');
      b.innerHTML = '<span class="mn">' + m.name + '</span><span class="ms">' + m.sub + '</span>';
      b.onclick = () => { currentMix = m; applyMix(); drawMixChips(); };
      row.appendChild(b);
    });
  });
  document.querySelectorAll('.mixblurb').forEach(el => el.textContent = currentMix.blurb);
}

async function boot(){
  ['ing','to','bare'].forEach(p => {
    const f = $('p-' + p).querySelector('.face');
    f.insertAdjacentHTML('beforeend', TICK + CROSS);
  });
  paintMute();

  try{
    const res = await fetch(DATA_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const d = await res.json();
    DECK = (d.sorting && d.sorting.cards) || d.cards || [];
    if (!DECK.length) throw new Error('no cards in the deck');
    applyMix(); drawMixChips();
    $('gateLoading').style.display = 'none';
    $('gateReady').style.display = '';
    $('gateStart').focus();
  }catch(e){
    $('gateLoading').innerHTML = '<p class="err">Could not load <b>' + esc(DATA_URL) + '</b>.<br>' +
      'Open this from the site rather than as a local file — browsers block file:// requests.</p>';
  }
}

$('gateStart').onclick = () => { sfx('unlock'); start('fresh'); };

function start(mode){
  applyMix();
  queue = (mode === 'missed' && lastMissed.length)
    ? interleave(lastMissed, 2)
    : buildDeck(currentMix);
  total = queue.length;
  right = wrong = streak = best = 0;
  missed = new Map();
 ['ing','to','bare'].forEach(p => { const el = $('t-' + p); if (el) el.textContent = '0'; });
  $('over').classList.remove('show');
  $('fill').classList.remove('sting');
  document.body.classList.add('started');
  started = true;
  paint();
  next();
}

function next(){
  hideWhy();
  clearPiles();
  if (!queue.length) return finish();
  current = queue.shift();

  const card = $('card');
  card.className = 'card';

  const stem = current.stem || current.trigger || '';
  const trig = current.trigger || '';
  const words = stem.split(/\s+/);
  const n = Math.min(trig.split(/\s+/).length, words.length);
  const lit = n
    ? esc(words.slice(0, words.length - n).join(' ')) + ' <b>' +
      esc(words.slice(words.length - n).join(' ')) + '</b>'
    : esc(stem);
  $('sentence').innerHTML = lit + ' <i>_____</i> ' + esc(current.tail || '');

  const F = current.forms || {};
  $('f-ing').textContent  = F['-ing'] || '-ing';
  $('f-to').textContent   = F['to']   || 'to …';
  $('f-bare').textContent = F['bare'] || 'bare';

  const again = missed.has(current.trigger);
  $('note').innerHTML = again ? '<div class="kick">seen before — think again</div>' : '';

  paint();
  locked = false;
}

const clearPiles = () =>
  ['ing','to','bare'].forEach(p => $('p-' + p).classList.remove('hit','miss','tell'));

function choose(pile){
  if (!started || locked || !current) return;
  if (currentMix.piles.indexOf(pile) === -1) return;
  locked = true;

  const el = $('p-' + slug(pile));
  const ok = pile === current.pile;

  if (window.INTUITY) INTUITY.log('gerunds-infinitives', current.trigger, ok,
    { game:'sort', mix:currentMix.id });

  if (ok){
    right++; streak++; best = Math.max(best, streak);
  const t = $('t-' + slug(pile));
if (t) t.textContent = (+t.textContent) + 1;
    el.classList.add('hit');
    sfx('correct');
    burst(el);
    $('fill').classList.add('gain');
    $('card').classList.add('gone-' + slug(pile));
    setTimeout(next, 300);
  } else {
    wrong++; streak = 0;
    missed.set(current.trigger, current);
    el.classList.add('miss');
    $('p-' + slug(current.pile)).classList.add('tell');
    $('card').classList.add('shake');
    $('track').classList.remove('knock'); void $('track').offsetWidth;
    $('track').classList.add('knock');
    $('fill').classList.add('sting');
    sfx('wrong');
    showWhy(current);
    queue.splice(Math.min(4, queue.length), 0, current);
    setTimeout(() => { $('fill').classList.remove('sting'); next(); }, 2100);
  }
  paint();
}

function showWhy(c){
  const form = c.forms ? c.forms[c.pile] : '';
  const full = ((c.stem||'') + ' ' + form + ' ' + (c.tail||'')).replace(/\s+/g,' ').trim();
  $('note').innerHTML = '<div class="r">' + esc(c.rule || '') + '</div>' +
                        (form ? '<div class="eg">' + esc(full) + '</div>' : '');
}
const hideWhy = () => { $('note').innerHTML = ''; };

function paint(){
  $('right').textContent  = right;
  $('wrong').textContent  = wrong;
  $('left').textContent   = queue.length;
  $('streak').textContent = streak;

  const sw = $('streakWrap');
  sw.classList.toggle('live', streak >= 3);
  if (streak){ sw.classList.remove('pop'); void sw.offsetWidth; sw.classList.add('pop'); }

  $('sortedLabel').textContent = right + ' / ' + total;
  $('deckLabel').textContent   = currentMix.name.toLowerCase() + ' · sorted';
  const f = $('fill');
  f.style.width = total ? Math.round(right / total * 100) + '%' : '0%';
  setTimeout(() => f.classList.remove('gain'), 600);
}

function finish(){
  const seen = right + wrong;
  const pct = seen ? right / seen : 0;
  lastMissed = [...missed.values()];

  if (window.INTUITY) INTUITY.session('gerunds-infinitives', 'sort',
    { mix: currentMix.id, sorted: right, wrong: wrong, best: best, missed: lastMissed.length });

  $('overBig').textContent = Math.round(pct * 100) + '%';
  $('overSub').textContent = right + ' sorted · best streak ' + best;
  $('overList').innerHTML = lastMissed.length
    ? 'Worth another look: ' + lastMissed.map(c =>
        '<b>' + esc(c.trigger) + '</b> + ' + esc(c.forms ? c.forms[c.pile] : c.pile)).join(' · ')
    : 'Nothing missed — the whole deck, first time.';
  $('againMissed').style.display = lastMissed.length ? '' : 'none';
  drawMixChips();
  sfx('fanfare');
  $('over').classList.add('show');
}

function burst(el){
  if (matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const fx = $('fx');
  const r  = el.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const COLS = ['#6B3FA0','#E8632A','#C2956E','#A3B26A','#FFFFFF','#B44A22'];

  const flash = document.createElement('div');
  flash.className = 'spark fw-flash';
  flash.style.left = cx + 'px'; flash.style.top = cy + 'px';
  fx.appendChild(flash);
  flash.animate([{ transform:'translate(-50%,-50%) scale(.15)', opacity:1 },
                 { transform:'translate(-50%,-50%) scale(3.6)', opacity:0 }],
                { duration:440, easing:'cubic-bezier(.1,.8,.2,1)' });
  setTimeout(() => flash.remove(), 460);

  [0,120].forEach((delay,k) => setTimeout(() => {
    const ring = document.createElement('div');
    ring.className = 'spark fw-ring';
    ring.style.left = cx + 'px'; ring.style.top = cy + 'px';
    fx.appendChild(ring);
    ring.animate([{ transform:'translate(-50%,-50%) scale(.12)', opacity:.9 },
                  { transform:'translate(-50%,-50%) scale(' + (2.6 + k) + ')', opacity:0 }],
                 { duration:660 + k*170, easing:'cubic-bezier(.1,.7,.2,1)' });
    setTimeout(() => ring.remove(), 860 + k*170);
  }, delay));

  shell(fx, cx, cy, 22, 36, 110, 500, ['#FFFFFF','#C2956E']);
  setTimeout(() => shell(fx, cx, cy, 40, 80, 240, 1050, COLS), 90);

  setTimeout(() => {
    for (let i = 0; i < 18; i++){
      const c = document.createElement('div');
      c.className = 'spark fw-crackle';
      const a = Math.random()*Math.PI*2, d = 28 + Math.random()*130;
      c.style.left = (cx + Math.cos(a)*d*.55) + 'px';
      c.style.top  = (cy + Math.sin(a)*d*.55) + 'px';
      fx.appendChild(c);
      c.animate([{ opacity:0, transform:'translate(-50%,-50%) scale(.3)' },
                 { opacity:1, transform:'translate(-50%,-50%) scale(1.4)', offset:.22 },
                 { opacity:0, transform:'translate(-50%,-50%) scale(.3)' }],
                { duration:300 + Math.random()*280, easing:'ease-out' });
      setTimeout(() => c.remove(), 620);
    }
  }, 280);
}

function shell(fx, cx, cy, n, near, far, life, cols){
  for (let i = 0; i < n; i++){
    const p = document.createElement('div');
    p.className = 'spark';
    const col = cols[(Math.random()*cols.length)|0];
    const size = 3 + Math.random()*4.5;
    p.style.cssText += 'left:'+cx+'px; top:'+cy+'px; width:'+size+'px; height:'+size+
      'px; background:'+col+'; box-shadow:0 0 '+(size*2.6)+'px '+col+';';
    fx.appendChild(p);
    const a = Math.random()*Math.PI*2, d = near + Math.random()*(far-near);
    const dx = Math.cos(a)*d, dy = Math.sin(a)*d;
    const fall = 50 + Math.random()*100, dur = life * (.75 + Math.random()*.5);
    p.animate([
      { transform:'translate(-50%,-50%) translate(0,0) scale(1.3)', opacity:1 },
      { transform:'translate(-50%,-50%) translate('+(dx*.6).toFixed(0)+'px,'+(dy*.6-14).toFixed(0)+'px) scale(1)', opacity:1, offset:.4 },
      { transform:'translate(-50%,-50%) translate('+dx.toFixed(0)+'px,'+(dy+fall).toFixed(0)+'px) scale(.2)', opacity:0 }
    ], { duration:dur, easing:'cubic-bezier(.1,.75,.3,1)' });
    setTimeout(() => p.remove(), dur + 40);
  }
}

function paintMute(){
  const on = !window.SFX || SFX.isOn();
  $('mute').textContent = on ? '🔊' : '🔇';
  $('mute').setAttribute('aria-label', on ? 'Sound on' : 'Sound off');
}
$('mute').onclick = () => { if (window.SFX) SFX.toggle(); paintMute(); };

document.addEventListener('keydown', e => {
  if (!started) { if (e.key === 'Enter' || e.key === ' ') $('gateStart').click(); return; }
  if (e.key === 'ArrowLeft'  || e.key === '1') choose('-ing');
  if (e.key === 'ArrowUp'    || e.key === '2') choose('to');
  if (e.key === 'ArrowRight' || e.key === '3') choose('bare');
});

boot();
</script>
