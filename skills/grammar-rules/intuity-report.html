<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTUITY — What happened</title>
<style>
  *,*::before,*::after{ margin:0; padding:0; box-sizing:border-box; }
  :root{ --gold:#C9A961; --ok:#5ED39B; --bad:#E86A5C; --amber:#f0a23c;
         --paper:#e5e5e7; --dim:rgba(229,229,231,.55); --faint:rgba(229,229,231,.26); }
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:#0d0d0d;
    background-image:radial-gradient(circle at 20% 40%, rgba(201,169,97,.05) 0%, transparent 50%);
    min-height:100vh; color:var(--paper); padding:1.5rem 1rem 4rem;
  }
  .wrap{ max-width:56rem; margin:0 auto; }
  h1{ font-size:.78rem; font-weight:600; letter-spacing:.18em; text-transform:uppercase;
      color:var(--gold); text-align:center; }
  .lede{ text-align:center; font-size:.8125rem; color:var(--dim); margin:.5rem 0 1.5rem; line-height:1.6; }
  .bar{ display:flex; justify-content:center; gap:.6rem; flex-wrap:wrap; margin-bottom:1.5rem; }
  button{
    font:inherit; font-size:.78rem; font-weight:600; cursor:pointer;
    padding:.6rem 1.2rem; border-radius:.7rem;
    background:rgba(201,169,97,.2); color:var(--gold); border:1px solid rgba(201,169,97,.38);
  }
  button:hover{ background:rgba(201,169,97,.32); }
  button.quiet{ background:none; color:var(--dim); border-color:rgba(255,255,255,.14); }

  .cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(11rem,1fr)); gap:.7rem; margin-bottom:1.6rem; }
  .stat{ padding:.9rem 1rem; border-radius:.7rem; border:1px solid rgba(255,255,255,.09);
         background:rgba(255,255,255,.025); }
  .stat .n{ font-size:1.7rem; font-weight:700; color:var(--gold); font-variant-numeric:tabular-nums; }
  .stat .k{ font-size:.62rem; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); margin-top:.15rem; }

  h2{ font-size:.65rem; letter-spacing:.14em; text-transform:uppercase; color:var(--faint);
      margin:1.6rem 0 .6rem; }
  table{ width:100%; border-collapse:collapse; font-size:.8125rem; }
  th{ text-align:left; font-size:.6rem; letter-spacing:.1em; text-transform:uppercase;
      color:var(--faint); font-weight:600; padding:.45rem .5rem; border-bottom:1px solid rgba(201,169,97,.18); }
  td{ padding:.5rem; border-bottom:1px solid rgba(84,84,88,.2); }
  .num{ text-align:right; font-variant-numeric:tabular-nums; }
  .trail{ font-family:ui-monospace,monospace; letter-spacing:.12em; }
  .trail .r{ color:var(--ok); } .trail .w{ color:var(--bad); }
  .rate-hi{ color:var(--bad); } .rate-mid{ color:var(--amber); } .rate-lo{ color:var(--ok); }
  .empty{ text-align:center; color:var(--dim); padding:2.5rem 0; font-size:.8125rem; line-height:1.7; }
  .note{ margin-top:2rem; font-size:.72rem; color:var(--faint); line-height:1.8; text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>What happened</h1>
  <p class="lede">
    Every answer given on this device, item by item.<br>
    Nothing leaves the tablet until you export it.
  </p>

  <div class="bar">
    <button onclick="render()">Refresh</button>
    <button onclick="grab('csv')">Export CSV</button>
    <button onclick="grab('json')">Export everything</button>
    <button class="quiet" onclick="wipe()">Clear this device</button>
  </div>

  <div id="out"></div>

  <p class="note">
    The trail reads oldest to newest: <span class="trail"><span class="w">w</span><span class="w">w</span><span class="r">r</span><span class="r">r</span><span class="r">r</span></span>
    is someone who has learned it,
    <span class="trail"><span class="r">r</span><span class="w">w</span><span class="w">w</span><span class="r">r</span><span class="w">w</span></span> is someone still guessing.<br>
    Export from each tablet and open the CSVs together in a spreadsheet.
  </p>
</div>

<script src="intuity-log.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function trail(t){
  return '<span class="trail">' + [...(t||'')].map(c =>
    '<span class="' + c + '">' + c + '</span>').join('') + '</span>';
}

function render(){
  const items = INTUITY.items();
  const sessions = INTUITY.sessions();
  const topics = Object.keys(items);

  if (!topics.length){
    $('out').innerHTML = '<p class="empty">Nothing recorded yet on this device.<br>' +
      'Play a round of Board, Pairs or Rack and refresh.</p>';
    return;
  }

  let answers = 0, right = 0, tracked = 0;
  topics.forEach(t => Object.values(items[t]).forEach(r => {
    answers += r.seen; right += r.right; tracked++;
  }));
  const p = INTUITY.progress();

  let html = '<div class="cards">' +
    stat(answers, 'answers given') +
    stat(Math.round(right / answers * 100) + '%', 'right overall') +
    stat(tracked, 'items met') +
    stat(sessions.length, 'sittings') +
    (p.early !== null && p.late !== null
      ? stat(Math.round(p.early*100) + '→' + Math.round(p.late*100) + '%', 'first half → second')
      : '') +
    '</div>';

  /* The list a teacher actually wants: not a score, but what to reteach. */
  const trouble = INTUITY.trouble(null, 15);
  html += '<h2>Worth reteaching</h2>';
  html += trouble.length
    ? table(['Item','Topic','Missed','Seen','Trail'], trouble.map(r => [
        esc(r.item), esc(r.topic),
        '<span class="' + (r.rate>=.5?'rate-hi':r.rate>=.25?'rate-mid':'rate-lo') + '">' +
          Math.round(r.rate*100) + '%</span>',
        r.seen, trail(r.trail)
      ]), [0,0,1,1,0])
    : '<p class="empty">No item has been met twice yet — that is where patterns start.</p>';

  /* Which game the answers came through, so a trial can compare them. */
  const byGame = {};
  topics.forEach(t => Object.values(items[t]).forEach(r =>
    Object.keys(r.games || {}).forEach(g => {
      const b = byGame[g] = byGame[g] || { seen:0, right:0 };
      b.seen += r.games[g].seen; b.right += r.games[g].right;
    })));
  const games = Object.keys(byGame);
  if (games.length){
    html += '<h2>By game</h2>';
    html += table(['Game','Answers','Right'], games.map(g => [
      esc(g), byGame[g].seen, Math.round(byGame[g].right / byGame[g].seen * 100) + '%'
    ]), [0,1,1]);
  }

  $('out').innerHTML = html;
}

const stat = (n,k) => '<div class="stat"><div class="n">' + n + '</div><div class="k">' + k + '</div></div>';

function table(heads, rows, nums){
  let h = '<table><thead><tr>' + heads.map((x,i) =>
    '<th class="' + (nums[i]?'num':'') + '">' + x + '</th>').join('') + '</tr></thead><tbody>';
  rows.forEach(r => {
    h += '<tr>' + r.map((c,i) => '<td class="' + (nums[i]?'num':'') + '">' + c + '</td>').join('') + '</tr>';
  });
  return h + '</tbody></table>';
}

function grab(kind){
  const data = kind === 'csv' ? INTUITY.csv() : INTUITY.dump();
  const blob = new Blob([data], { type: kind === 'csv' ? 'text/csv' : 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'intuity-' + INTUITY.device() + '-' + new Date().toISOString().slice(0,10) + '.' + kind;
  a.click();
  URL.revokeObjectURL(a.href);
}

function wipe(){
  if (!confirm('Clear everything recorded on this device? Export first if you need it.')) return;
  INTUITY.clear(); render();
}

render();
</script>
</body>
</html>
