<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F3F1ED">
  <title>Be2FIRST — Linking Words Rewrite</title>

  <!-- Framed pages are separate documents and inherit nothing from the host,
       so they load the fonts and the shell themselves. Two parallel links,
       never an @import: an import cannot begin downloading until the file
       containing it has arrived, so the tokens land a round trip late and the
       page flashes unstyled. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..900&family=Geist+Mono:wght@400..600&family=Space+Grotesk:wght@700&family=Anton&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=20261012">
  <link rel="stylesheet" href="/tools/practice.css?v=20261012">
     <link rel="stylesheet" href="/tools/practice.css?v=20261012">
   <link rel="stylesheet" href="/data/grammar-rules/intuity-pills.css?v=20261012">
<script src="/tools/be2-brand.js?v=20261012c"></script>
</head>
<body>
  <div class="container">
    <div class="content-container">
      <!-- Tabs and progress pin together as ONE sticky block. Pinning them
           separately meant guessing the selector's height for the strip's
           offset, and the selector wraps to two rows on some topics. -->
      <div class="pinned">
        <div class="test-selector" id="testSelector"></div>
        <div class="practice-strip" id="practiceStrip" style="display:none">
          <span><span class="practice-instruction" id="setDescriptor"></span><span class="practice-tally" id="practiceTally"></span></span>
          <div class="practice-dots" id="practiceDots"></div>
        </div>
      </div>
      <div id="contentContainer"><div class="loading">Loading exercises…</div></div>
    </div>
  </div>

  <div class="action-bar" id="actionBar" style="display:none">
    <button class="action-btn secondary" id="clearBtn" type="button">Clear</button>
    <button class="action-btn primary" id="checkBtn" type="button">Check</button>
  </div>

  <script>
    window.PRACTICE = {
      data:     'linking-words-data',
      scoreKey: 'linking_words_rewrite_scores',
      mode:     'transform'
    };
  </script>
  <script src="/tools/practice.js?v=3"></script>
</body>
</html>
