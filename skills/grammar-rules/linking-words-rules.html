<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FAF7F2">
<title>INTUITY — Linking Words</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Geist:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=2">

<style>
/* ═══ WHAT ONLY THIS PAGE OWNS ═══
   Everything shared — tokens, header, mode row, tabs, tile family, close
   control, sheets — comes from the shell. This page was previously ~1000
   lines of its own dark theme on #0d0d0d with a #C9A961 gold accent: the
   generation BEFORE the tenses rework, kept alive by copy-paste. It now
   carries only its reading surface.

   Roughly 40% of the old file was also dead: play(), pause(), advanceSlide(),
   playInterval, speak(), soundEnabled, speechFinished and an arrow-key
   handler, all driving a WATCH panel whose markup had already been deleted,
   plus a `viewMode` that could never be anything but 'list'. None of it is
   carried over. */

html,body{width:100%;height:100%;overflow:hidden}

.inner{max-width:720px;margin:0 auto;padding:.9rem 1rem 2.5rem;
  display:flex;flex-direction:column;gap:1.1rem}
/* ── THE MAP SHEET ───────────────────────────────────────────────────────
   This page had .slides-card in its markup and no rule for it anywhere — not
   here, not in the shell — so the iframe had no width or height and the map
   rendered as a small squashed box in the middle of the scrim.

   No shadow: the card is filled edge to edge by the map, so there is nothing
   for a lift to separate it from, and a spread under it dims the ground the
   map's own pills are lifted against. The pills keep their shadows. */
.slides-card{position:relative;width:min(760px,100%);height:100%;
  border-radius:var(--r-sheet);overflow:hidden;background:var(--card);
  box-shadow:none}
.slides-card iframe{width:100%;height:100%;border:none;display:block}
@media(max-width:768px){
  .sheet.slides{padding:0}
  .slides-card{border-radius:0}
}

/* ── THE STRIP ──
   Same treatment as the tenses time-marker strip: a quiet mono label over a
   brick row. Brick is --target, the colour reserved for the thing being
   taught, so it carries the linking words and nothing else does. */
.markers{margin-bottom:1.1rem}
.markers-t{font-family:var(--f-mono);font-size:.56rem;color:var(--dim);
  text-transform:uppercase;letter-spacing:.12em;margin-bottom:.55rem}
.markers-l{display:flex;flex-wrap:wrap;gap:.4rem .9rem}
.marker{color:var(--target);font-size:.86rem;font-weight:600}

.cards{display:flex;flex-direction:column;gap:1.1rem}
.card{background:none;border:none;border-radius:0;padding:.3rem 0 1.3rem}
.cards .card:first-child{padding-top:.6rem}

.card-head{display:flex;align-items:center;gap:.8rem;
  padding-bottom:.75rem;margin-bottom:.95rem;border-bottom:1px solid var(--rule)}
.uc-title{font-family:var(--f-display);font-weight:500;font-size:.96rem;
  line-height:1.3;color:var(--sage);text-transform:uppercase;
  letter-spacing:.2em;margin-bottom:0;flex:1}

.explore-btn{flex:none;display:inline-flex;align-items:center;
  font-family:var(--f-display);font-size:.78rem;font-weight:600;
  letter-spacing:0;
  padding:.34rem 1rem;border-radius:var(--r-chip);
  color:#FFFFFF;background:var(--sage-deep);border:none;cursor:pointer;
  transition:transform .12s cubic-bezier(.2,.8,.2,1),filter .2s}
.explore-btn:hover{filter:brightness(.92)}
.explore-btn:active{transform:scale(.94);filter:brightness(.86)}
.explore-btn:focus-visible{outline:2px solid var(--sage-deep);outline-offset:2px}


.exs{display:flex;flex-direction:column;gap:.6rem}
/* ── TOKENS THIS PAGE OWNS ── (identical to tenses-rules.html) */
:root{
  --verb:#EEE8E0;                 /* one step lighter than --tile-bg, so a
                                     read-only box is never mistaken for a
                                     Practice tile */
  --verb-ink:var(--tile-ink);
  --verb-rule:rgba(43,33,41,.10);
  --f-verb:'Geist',system-ui,sans-serif;
  --f-read:'Newsreader',Georgia,serif;
  /* Sage, as in tenses. Brick is --target: it means "this is the grammar
     being taught", and spending it on a navigation button made it mean two
     things on one screen. #60747C is deep enough to carry a white label at
     4.9:1, where the lighter --sage could only take an ink one. */
  --sage:#708A81;
  --sage-deep:#60747C;
}

/* ── THE VERB COLUMN ─────────────────────────────────────────────────────
   One grid owns the whole set, so every example shares two measured columns:
   the opening is as wide as the longest opening, the mark column as wide as
   the longest marked item. That is what makes the grey a straight edge —
   nothing is hard-coded, so editing an example cannot put the column out of
   true.

   Once the marks share a left edge the set can be read DOWN as well as
   across, and the pattern the set exists to teach becomes visible before
   anyone states it. */
.exs{display:grid;
  grid-template-columns:max-content max-content minmax(0,1fr);
  row-gap:0;margin-bottom:1rem;
  font-family:var(--f-read);font-size:11pt;line-height:1.35;color:var(--sentence)}
.ex{display:contents}

.ex-pre,.ex-post{padding-block:.34rem;align-self:center}
/* ── A STRAIGHT EDGE AT THE COLUMN ───────────────────────────────────────
   In tenses the openings are one or two words, so left-aligning them still
   leaves a tidy edge where they meet the grey. Here they run from "She
   speaks French" to "The course includes grammar. It", and left-aligned they
   produce a ragged inner edge with the column pushed far right — the mess.

   Right-aligned, every opening ENDS flush against the grey field. The ragged
   edge moves to the outside, where nothing has to line up, and the column
   gets the clean vertical run it has in tenses. The eye reads down the
   linking words with a straight rule either side of them. */
.ex-pre{padding-right:.8em;text-align:right}
/* An example that fronts the linking word — "Apart from English, she
   speaks…" — has no opening at all. Close the gap rather than leaving a
   hole in the run. */
.ex-pre:empty{padding-right:0}
.ex-post{padding-left:.8em}

/* Flat fill, no rim, no shadow — a rim would read as an input the student is
   meant to type into, and Explore is read. Body font stays serif; the mark
   takes the grotesk, so the two are told apart by voice rather than colour. */
.ex-vb{font-family:var(--f-verb);font-size:12pt;font-weight:600;
  letter-spacing:-.008em;line-height:1.25;color:var(--verb-ink);
  background:var(--verb);padding:.3rem .85rem;text-align:center;
  white-space:nowrap;align-self:center}
.ex:not(:last-child) .ex-vb{box-shadow:inset 0 -1px 0 var(--verb-rule)}
.ex:first-child .ex-vb{border-radius:.6rem .6rem 0 0}
.ex:last-child  .ex-vb{border-radius:0 0 .6rem .6rem}

/* A second marked item keeps the tint but stays in the line. */
.ex .vb{display:inline-block;background:var(--verb);color:var(--verb-ink);
  font-family:var(--f-verb);font-weight:600;border-radius:.42rem;
  padding:.04em .42em}

/* An example with no mark degrades to a plain line rather than guessing. */
.ex.plain{grid-column:1/-1;display:block;padding:.42rem 0 .42rem .9rem;
  border-left:1px solid var(--rule)}
.ex .marker-inline{color:var(--target);font-weight:700}

/* ── PHONE ──
   Three cells fit a phone as long as the opening is short, which the audit
   confirmed for every set in these topics. Only the padding tightens. */
@media(max-width:640px){
  .exs{font-size:10.5pt}
  .ex-pre{padding-right:.55em}
  .ex-post{padding-left:.55em}
  .ex-vb{padding-inline:.6rem}
}

@media (min-width:900px){
  .exs{font-size:14pt}
  .uc-title{font-size:1.08rem}
  .vtab{font-size:.66rem}
  .mode-btn{font-size:.76rem}
}
</style>
</head>
<body>

<header class="header">
  <div class="header-top">
    <a class="back-link" href="/?openModal=grammar" target="_top">← Grammar</a>
    <div class="header-title">
      <div class="app-title">INTUITY</div>
      <div class="app-subtitle">B2 First Linking Words</div>
    </div>
    <span class="header-spacer">Level <b>B2–C1</b></span>
  </div>

  <div class="mode-selector">
    <button class="mode-btn active" data-mode="explore">Explore</button>
    <button class="mode-btn" data-mode="practice">Practice</button>
    <button class="mode-btn" data-mode="quiz">Quiz</button>
    <!-- Decide is a separate document, like Defuse and Forge on tenses: it
         takes the whole screen and drops the chrome during a round, which a
         sheet inside this page cannot do. The cross-document view transition
         in the shell is what makes the move feel like the in-page ones. -->
    <span class="mode-btn mode-soon" aria-disabled="true" title="Game coming for this topic">Game</span>
  </div>

  <div class="set-tabs" id="ruleTabs"></div>
  <!-- Practice and Quiz report their set list upward and it is drawn HERE,
       beside Explore's own tabs, so a student changes set the same way
       they change rule. -->
  <div class="set-tabs hidden" id="frameTabs"></div>
</header>

<div class="area active" id="exploreArea">
  <div class="inner"><div class="cards" id="list"></div></div>
</div>

<div class="area sheet-mode" id="practiceArea">
  <div class="sheet-full">
    <button class="close-btn sheet-close" data-close type="button"
            aria-label="Close Practice">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
             stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="sheet-gate" id="practiceGate">
      <div class="gate-mark pend-hang"><div class="pend-dial"><span>?</span></div></div>
      <div class="gate-head">Pick a set above to start practising</div>
      <div class="gate-sub">Each set is a different group of sentences — choose one from the tabs above.</div>
    </div>
    <div class="frame"><iframe id="practiceFrame" title="Practice"></iframe></div>
  </div>
</div>

<div class="area sheet-mode" id="quizArea">
  <div class="sheet-full">
    <button class="close-btn sheet-close" data-close type="button"
            aria-label="Close Quiz">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
             stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="sheet-gate" id="quizGate">
      <div class="gate-mark pend-hang"><div class="pend-dial"><span>?</span></div></div>
      <div class="gate-head">Pick a set above to start the quiz</div>
      <div class="gate-sub">Each set is a different group of sentences — choose one from the tabs above.</div>
    </div>
    <div class="frame"><iframe id="quizFrame" title="Quiz"></iframe></div>
  </div>
</div>

<div class="sheet slides" id="slides">
  <div class="slides-card">
    <button class="close-btn" id="closeX" type="button" aria-label="Close"
            style="position:absolute;top:.6rem;right:.6rem;z-index:5">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
           stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <iframe id="slidesFrame" title="Linking Words map"></iframe>
  </div>
</div>

<div class="loading" id="loading" style="position:fixed;inset:0;display:flex;
     align-items:center;justify-content:center;background:var(--screen);z-index:99;
     font-family:var(--f-mono);font-size:.82rem;color:var(--faint)">Loading…</div>

<script>
/* ══════════════════════════════════════════════════════════════════════
   CONDITIONALS — Explore, with Practice and Quiz presented as sheets.

   Data shape differs from tenses and that is fine: this page reads
   rules[] → sets[] → examples[{before, after}], with signal words wrapped
   in <<…>>. Tenses reads useCases[] with a separate timeMarkers list. One
   renderer for both is the next step; tonight they stay separate so the
   change is testable one topic at a time.
   ══════════════════════════════════════════════════════════════════════ */

const PLAY  = 'explore-map.html';        // ONE renderer for every topic
const BUILD = '2026-08-27a';             // bump when a framed page changes
const DEF   = '../../data/grammar-rules/linking-words-data.json';
const P     = new URLSearchParams(location.search);

/* before/after are two orderings of the SAME sentence, not a transformation.
   'before' is the canonical if-first form. This one constant drives BOTH the
   list and the map, so the two surfaces can never disagree. */
/* ── WHICH HALF IS THE LESSON ────────────────────────────────────────────
   Every example carries both: `before` is the plain version joined with
   "and", `after` is the same idea written with the linking word the set is
   teaching. The page was rendering `before`, so a set titled "Also, As Well
   As, Apart From" showed a column of five identical `and`s — the one word
   the set exists to move students away from.

   `after` is the lesson. `before` is the starting point, and it is still
   shown, quietly, under each example so the transformation is visible. */
const PRIMARY = 'after';

/* The map holds six nodes, so a set longer than that becomes several sections
   there. Section indices must account for it or a long set opens the wrong
   page. */
const MAX_PER_SECTION = 6;

let rules = [], rule = 0, view = 'list', mainMode = 'explore';
let RESOLVED_JSON = P.get('json') || DEF;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* <<word>> marks a signal word; **word** was a bold convention that is no
   longer used but still appears in the data, so it is stripped rather than
   rendered as literal asterisks. */
function render(text){
  return esc(text)
    .replace(/\*\*(.*?)\*\*/g, '$1')
    .replace(/&lt;&lt;(.*?)&gt;&gt;/g, '<span class="marker-inline">$1</span>');
}

function sectionIndexOf(r, setIdx){
  let n = 0;
  for(let i = 0; i < setIdx; i++){
    const len = (r.sets[i].examples || []).length;
    n += Math.max(1, Math.ceil(len / MAX_PER_SECTION));
  }
  return n;
}

/* The launcher builds data URLs as <topic>-rules.json, which is right for
   tenses and wrong here — this topic's file is conditionals-data.json. Try
   what was asked for, then the known-good names, and remember which worked so
   the map is handed a URL that loads. */
async function fetchFirstAvailable(urls){
  let lastErr = null;
  for(const url of urls){
    try{
      const res = await fetch(url, { cache:'no-store' });
      if(res.ok){ RESOLVED_JSON = url; return await res.json(); }
      lastErr = new Error('HTTP ' + res.status);
    }catch(e){ lastErr = e; }
  }
  throw lastErr || new Error('no data source responded');
}

function mountFrames(){
  const f1 = $('practiceFrame'), f2 = $('quizFrame');
  if(f1 && !f1.getAttribute('src')) f1.setAttribute('src','linking-words-practice.html?v='+BUILD);
  if(f2 && !f2.getAttribute('src')) f2.setAttribute('src','linking-words-gapfill.html?v='+BUILD);
}
function idle(fn){
  if(window.requestIdleCallback) requestIdleCallback(fn,{timeout:1500}); else setTimeout(fn,400);
}

async function boot(){
  try{
    const payload = await fetchFirstAvailable([...new Set([
      P.get('json') || DEF, DEF, '../../data/grammar-rules/linking-words.json'])]);
    /* Two shapes exist across the topics. Most files are
       {title, level, rules:[…]}; collocations is the bare array, written
       before the wrapper convention. Reading .rules from an array gives
       undefined and the page renders nothing at all — not an error, an empty
       screen — so accept both rather than making ten data files agree. */
    rules = Array.isArray(payload) ? payload : (payload.rules || []);
    if(!rules.length) throw new Error('no rules in the data file');
  }catch(e){
    $('list').innerHTML = '<div class="msg">Couldn\'t load the linking words.' +
      '<small>' + esc(String(e.message||e)) + '</small></div>';
    $('loading').style.display = 'none';
    syncHeader();
    return;
  }
  buildTabs();
  paintList();
  syncHeader();
  $('loading').style.display = 'none';
  idle(mountFrames);

  const wanted = P.get('mode');
  if(wanted && wanted !== 'explore' && document.querySelector('.mode-btn[data-mode="'+wanted+'"]')){
    mountFrames();
    switchMode(wanted);
  }
}

/* ── tabs ── */
function buildTabs(){
  const wrap = $('ruleTabs');
  wrap.innerHTML = '';
  rules.forEach((r,i)=>{
    const b = document.createElement('button');
    b.className = 'vtab' + (i===rule ? ' active' : '');
    b.textContent = r.title;
    b.title = r.subtitle || '';
    b.onclick = () => { if(i===rule) return; rule = i; buildTabs(); paintList(); closeMap(); };
    wrap.appendChild(b);
  });
  syncHeader();
}

/* ── list ── */
/* ── ONE SENTENCE ────────────────────────────────────────────────────────
   The data marks the item being taught in <<…>>. The first mark takes the
   column; any later one keeps the tint but stays in the line. An unmarked
   example falls back to a plain line, so a set can be edited without the
   layout breaking. */
function renderExample(raw){
  const parts = String(raw).split(/<<([^>]+)>>/);
  if(parts.length < 2) return '<div class="ex plain">' + render(raw) + '</div>';
  const tail = parts.slice(2).map((seg, i) =>
    i % 2 ? '<span class="vb">' + esc(seg) + '</span>' : render(seg)).join('');
  return '<div class="ex">' +
    '<span class="ex-pre">' + render(parts[0]) + '</span>' +
    '<span class="ex-vb">'  + esc(parts[1])    + '</span>' +
    '<span class="ex-post">'+ tail             + '</span>' +
  '</div>';
}

/* ── WHAT THIS SET OFFERS ────────────────────────────────────────────────
   The linking words actually used in a set, collected from its own examples
   and de-duplicated. Derived rather than authored, so it can never disagree
   with the sentences underneath it — and a set whose examples change gets a
   corrected strip for free. */
function linkersIn(set){
  const seen = [];
  (set.examples || []).forEach(e => {
    const raw = e[PRIMARY] != null ? e[PRIMARY] : e.after;
    String(raw).replace(/<<([^>]+)>>/g, (_, w) => {
      const k = w.trim();
      if(k && !seen.some(s => s.toLowerCase() === k.toLowerCase())) seen.push(k);
      return '';
    });
  });
  return seen;
}

function paintList(){
  const r = rules[rule], wrap = $('list');
  if(!r || !r.sets || !r.sets.length){
    wrap.innerHTML = '<div class="msg">No sets for this conditional yet.</div>';
    return;
  }
  const sub = r.subtitle ? '<div class="subtitle-line">' + esc(r.subtitle) + '</div>' : '';
  wrap.innerHTML = sub + r.sets.map((set,i)=>{
    const exs = (set.examples||[]).map(e => {
      const raw = e[PRIMARY] != null ? e[PRIMARY] : e.after;
      /* Some examples offer two ways to say the same thing, separated by
         " / " — "She also speaks Spanish. / She speaks French as well as
         Spanish." Two ways is two rows: each gets its own line in the
         column, so the alternatives can be compared rather than read as one
         run-on sentence. */
      /* ONE ROW PER EXAMPLE.
         Two changes, both subtractions. Alternatives after " / " were each
         given a row, which doubled the block and made the same idea appear
         twice in slightly different words — five examples became ten rows of
         near-repetition. The first phrasing is enough; the strip above
         already names every alternative in the set.

         And the "and" version underneath is gone. At B2 a student knows what
         "She speaks French and Spanish" means; showing it under every row
         spent a line explaining the thing they already have and broke the
         column into fragments separated by grey text. What they need is the
         linking word, in context, once. */
      return renderExample(String(raw).split(' / ')[0]);
    }).join('');
    /* The strip names what the set teaches, in brick, above the sentences
       that show it in use — the same relationship tenses has between its
       time markers and its examples. Brick for the item taught, grey for the
       form it takes in a sentence. */
    const linkers = linkersIn(set);
    const strip = linkers.length
      ? '<div class="markers"><div class="markers-t">Ways to say it</div>' +
        '<div class="markers-l">' +
        linkers.map(w => '<span class="marker">' + esc(w) + '</span>').join('') +
        '</div></div>'
      : '';
    return '<div class="card"><div class="card-head">' +
             '<div class="uc-title">' + esc(set.setTitle) + '</div>' +
             '<button class="explore-btn" type="button" data-sec="' + i + '">Explore</button>' +
           '</div>' + strip + '<div class="exs">' + exs + '</div></div>';
  }).join('');
  wrap.querySelectorAll('.explore-btn').forEach(b =>
    b.addEventListener('click', () => openMap(sectionIndexOf(r, +b.dataset.sec))));
}

/* ── modes ── */
function applyMode(mode){
  mainMode = mode;
  document.querySelectorAll('.mode-btn[data-mode]').forEach(b =>
    b.classList.toggle('active', b.dataset.mode === mode));
  document.querySelectorAll('.area').forEach(a => a.classList.remove('active'));
  /* Explore stays active underneath, so closing a sheet reveals the page
     exactly where the student left it. */
  $('exploreArea').classList.add('active');
  $('ruleTabs').classList.toggle('hidden', mode !== 'explore');
  if(mode === 'practice'){ mountFrames(); $('practiceArea').classList.add('active'); openGate('practice'); }
  if(mode === 'quiz'){     mountFrames(); $('quizArea').classList.add('active'); openGate('quiz'); }
  document.body.style.overflow = mode === 'explore' ? '' : 'hidden';
  paintFrameTabs();
  syncHeader();
}
function switchMode(mode){
  if(mode === mainMode) return;
  const u = new URL(location.href);
  if(mode === 'explore') u.searchParams.delete('mode'); else u.searchParams.set('mode', mode);
  history.replaceState(null,'',u);
  if(document.startViewTransition && !matchMedia('(prefers-reduced-motion: reduce)').matches){
    document.startViewTransition(() => applyMode(mode));
  }else{
    applyMode(mode);
  }
}
document.querySelectorAll('.mode-btn[data-mode]').forEach(b =>
  b.addEventListener('click', () => switchMode(b.dataset.mode)));
/* ── CLOSING IS TWO STEPS, NOT ONE ───────────────────────────────────────
   Leaving an exercise dropped the student all the way back to Explore, so
   picking a different set meant Practice → gate → set again. Closing now
   returns to the gate it came from; only a second close leaves the mode. */
function closeSheet(){
  if(mainMode === 'explore') return;
  const g = $(gateFor[mainMode] && gateFor[mainMode].gate);
  if(g && !g.classList.contains('open')){ openGate(mainMode); return; }
  switchMode('explore');
}
document.querySelectorAll('[data-close]').forEach(b =>
  b.addEventListener('click', closeSheet));

/* ── the map ── */
function openMap(section){
  view = 'slides';
  const r = rules[rule] || {};
  $('slidesFrame').setAttribute('src',
    PLAY + '?topic=linking-words' +
    '&rule=' + encodeURIComponent(r.id || String(rule)) +
    '&section=' + section +
    '&primary=' + PRIMARY +
    '&json=' + encodeURIComponent(RESOLVED_JSON));
  $('slides').classList.add('open');
}
function closeMap(){
  if(view !== 'slides') return;
  view = 'list';
  $('slides').classList.remove('open');
  $('slidesFrame').setAttribute('src','');
}
$('closeX').addEventListener('click', closeMap);
$('slides').addEventListener('click', e => { if(e.target === $('slides')) closeMap(); });
window.addEventListener('message', e => { if(e.data && e.data.intuity === 'showList') closeMap(); });

/* One Escape handler, innermost surface first: the map sits above a sheet,
   so it must be the thing that closes while it is open. */
document.addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  if(view === 'slides'){ closeMap(); return; }
  if(mainMode !== 'explore') switchMode('explore');
});

/* ── layout sync ──
   Measures the real header rather than trusting the CSS guess: five rule tabs
   plus a three-item mode row wrap to different heights at every width, and a
   stale --header-h lets the header sit on top of the first sentence. */
function syncHeader(){
  const h = document.querySelector('.header');
  if(h) document.documentElement.style.setProperty('--header-h', h.offsetHeight+'px');
}
window.addEventListener('resize', syncHeader);
window.addEventListener('orientationchange', () => setTimeout(syncHeader,120));
window.addEventListener('pageshow', e => { syncHeader(); if(e.persisted) requestAnimationFrame(syncHeader); });
if(document.fonts && document.fonts.ready) document.fonts.ready.then(syncHeader);
if(window.ResizeObserver){
  const h = document.querySelector('.header');
  if(h) new ResizeObserver(syncHeader).observe(h);
}else{
  [0,60,200,500].forEach(ms => setTimeout(syncHeader, ms));
}

/* ── SET NAVIGATION LIVES IN THE HEADER ──────────────────────────────────
   The gate used to list every set as a tile inside the sheet. That put the
   same choice in two places and, worse, made the sheet the thing you chose
   from — so a student who wanted a different set had to reopen the sheet
   rather than just tap the header.

   Navigation belongs in one place for every mode: Explore's tense tabs and
   Practice/Quiz's set tabs are drawn in the same row, in the same header, in
   the same chips. The gate only points at it. */
const gateFor = { practice:{gate:'practiceGate', frame:'practiceFrame'},
                  quiz:    {gate:'quizGate',     frame:'quizFrame'} };
const testLists = { practice:null, quiz:null };
/* null, not 0. The gate says "pick a set above" while a tab sits highlighted
   — so the page contradicted itself, and a student who took the highlight at
   face value pressed the tab that was already lit and saw nothing happen.
   Nothing is chosen until the student chooses it. */
let frameActive = { practice:null, quiz:null };

window.addEventListener('message', e => {
  if(!e.data || e.data.intuity !== 'tests') return;
  const from = e.data.mode;
  if(from !== 'practice' && from !== 'quiz') return;
  testLists[from] = e.data.titles || [];
  /* The frame reports which test it has loaded, which is 0 before anyone has
     picked. Adopting that would re-light the first tab behind the gate and
     put the contradiction straight back. Only take it once a choice exists. */
  if(frameActive[from] !== null) frameActive[from] = e.data.active || 0;
  if(from === mainMode) paintFrameTabs();
});

function paintFrameTabs(){
  const wrap = $('frameTabs');
  if(!wrap) return;
  const titles = testLists[mainMode];
  const on = mainMode !== 'explore' && titles && titles.length;
  wrap.classList.toggle('hidden', !on);
  if(!on){ wrap.innerHTML = ''; syncHeader(); return; }
  wrap.innerHTML = titles.map((t,i) =>
    '<button class="vtab' + (i === frameActive[mainMode] ? ' active' : '') +
    '" type="button" data-i="' + i + '">' + esc(t) + '</button>').join('');
  wrap.querySelectorAll('.vtab').forEach(b =>
    b.addEventListener('click', () => chooseSet(mainMode, +b.dataset.i)));
  syncHeader();
}

function chooseSet(mode, index){
  frameActive[mode] = index;
  const f = $(gateFor[mode].frame);
  /* The frame owns its content, so it is TOLD which set to load rather than
     reloaded — it is already parsed, so the switch is instant. */
  if(f && f.contentWindow) f.contentWindow.postMessage({ intuity:'setTest', index:index }, '*');
  const g = $(gateFor[mode].gate);
  if(g) g.classList.remove('open');   /* the gate's job is done once a set is picked */
  paintFrameTabs();
}

/* The gate returns every time the sheet opens: nothing is chosen for the
   student, and nothing is remembered from last time either. */
function openGate(mode){
  /* back at the gate, nothing is selected again — including after a close,
     so a student returning to pick a different set sees no stale highlight */
  if(gateFor[mode]) frameActive[mode] = null;
  const g = $(gateFor[mode] && gateFor[mode].gate);
  if(g) g.classList.add('open');
  paintFrameTabs();
  /* A framed page that never announces its sets — the older topic pages do
     not — would leave the gate pointing at an empty header row. After a
     moment, step out of the way and show the exercises. */
  setTimeout(() => {
    if(mainMode === mode && (!testLists[mode] || !testLists[mode].length) && g)
      g.classList.remove('open');
  }, 1400);
}

/* Tell the framed pages that this host draws the tabs, so they hide their own
   and the row is not shown twice. A page that never hears this keeps its own,
   which is exactly what a standalone visit needs. */
function announceHost(){
  ['practiceFrame','quizFrame'].forEach(id => {
    const f = $(id);
    if(f && f.contentWindow) { try{ f.contentWindow.postMessage({intuity:'hostTabs'},'*'); }catch(e){} }
  });
}
['practiceFrame','quizFrame'].forEach(id => {
  const f = document.getElementById(id);
  if(f) f.addEventListener('load', announceHost);
});

boot();
</script>
</body>
</html>
