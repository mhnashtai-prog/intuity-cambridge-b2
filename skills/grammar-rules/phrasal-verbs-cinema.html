<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTUITY — Phrasal Verbs Cinema</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  :root{
    --gold:#C9A961; --blue:#60a5fa;
    --paper:#e5e5e7; --paper-dim:rgba(229,229,231,.55); --paper-faint:rgba(229,229,231,.28);
    --header-h:116px; --bar-h:34px;
  }
  html, body{ width:100%; height:100%; overflow:hidden; background:#0d0d0d; }
  body{ font-family:'DM Sans',sans-serif; color:var(--paper); user-select:none; -webkit-user-select:none; }
  button{ font:inherit; color:inherit; background:none; border:none; cursor:pointer; }

  /* ── HEADER — the shell every phrasal page wears ── */
  .header{
    position:fixed; top:0; left:0; right:0; z-index:100; height:var(--header-h);
    display:flex; flex-direction:column; gap:.4rem; padding:.5rem 1.25rem .4rem;
    background:rgba(13,13,13,.88); backdrop-filter:blur(20px);
    border-bottom:1px solid rgba(255,255,255,.06);
  }
  .header-top{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; }
  .header-title{ display:flex; flex-direction:column; align-items:center; line-height:1.1; }
  .app-title{ font-family:'Space Grotesk',sans-serif; font-size:1rem; font-weight:900; letter-spacing:.22em; color:var(--gold); }
  .app-subtitle{ font-size:.58rem; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:rgba(255,255,255,.32); margin-top:.1rem; }
  .back-link{
    justify-self:start; text-decoration:none; font-family:'Space Grotesk',sans-serif;
    font-size:.6rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    color:rgba(255,255,255,.3); white-space:nowrap;
  }
  .back-link:hover{ color:rgba(255,255,255,.7); }

  .mode-selector{
    display:flex; justify-content:center; align-self:center;
    background:rgba(28,28,30,.6); backdrop-filter:blur(40px);
    border-radius:999px; border:1px solid rgba(201,169,97,.2); overflow:hidden;
  }
  .mode-btn{
    display:flex; align-items:center; gap:.4rem;
    font-family:'Space Grotesk',sans-serif; font-size:.66rem; font-weight:600;
    letter-spacing:.04em; text-transform:uppercase;
    padding:.5rem 1.05rem; border-right:1px solid rgba(84,84,88,.2); color:#636366;
  }
  .mode-btn:last-child{ border-right:none; }
  .mode-btn:hover{ color:#9ca3af; background:rgba(201,169,97,.1); }
  .mode-btn.active{ background:rgba(201,169,97,.15); color:var(--gold); }
  @media(max-width:760px){ .mode-btn .mode-label{ display:none; } .mode-btn{ padding:.5rem .6rem; } }

  .verb-tabs{ display:flex; align-items:center; justify-content:center; gap:.28rem; overflow-x:auto; padding:0 .5rem; scrollbar-width:none; }
  .verb-tabs::-webkit-scrollbar{ display:none; }
  .vtab{
    font-family:'Space Grotesk',sans-serif; font-size:.56rem; font-weight:700;
    letter-spacing:.08em; text-transform:uppercase;
    padding:.28rem .72rem; border-radius:999px; border:1px solid transparent;
    color:rgba(255,255,255,.3); white-space:nowrap; flex-shrink:0; transition:all .2s;
  }
  .vtab:hover{ color:rgba(255,255,255,.7); border-color:rgba(255,255,255,.15); }
  .vtab.active{ color:var(--vc,var(--gold)); border-color:var(--vc,var(--gold)); background:rgba(255,255,255,.06); }

  /* ── STAGE ── */
  .stage{ position:fixed; top:var(--header-h); left:0; right:0; bottom:var(--bar-h); display:flex; padding:.5rem; }
  .card{
    position:relative; flex:1; overflow:hidden; border-radius:1.25rem;
    background:linear-gradient(145deg, rgba(28,28,30,.97), rgba(18,18,20,.99));
    border:1px solid rgba(201,169,97,.22);
    box-shadow:0 24px 70px rgba(0,0,0,.8);
    display:flex; flex-direction:column;
  }

  /* ── THE WHEEL ──
     Same mechanism as the game, turned to a different purpose. Nothing is
     asked of the reader: the phrase and its meaning ride down together,
     held side by side long enough to be read once without hurry. This is
     rehearsal, not testing — the mode you want with a plate on your knee. */
  .reel{ position:relative; flex:1; overflow:hidden; }
  .reel::before{
    content:''; position:absolute; inset:0; z-index:5; pointer-events:none;
    background:linear-gradient(to bottom, #101011 0%, rgba(16,16,17,.6) 12%,
               transparent 34%, transparent 66%, rgba(16,16,17,.6) 88%, #101011 100%);
  }

  .step{
    position:absolute; left:50%; top:0; will-change:transform,opacity;
    display:flex; align-items:baseline; gap:1rem;
    padding:.85rem 1.4rem; border-radius:.6rem;
    background:linear-gradient(180deg, rgba(62,60,56,.5), rgba(38,37,35,.5));
    border:1px solid rgba(201,169,97,.18); border-top-color:rgba(255,255,255,.07);
    box-shadow:0 8px 22px rgba(0,0,0,.45);
    cursor:pointer;
  }
  /* The phrase in blue, the meaning in reading grey beside it — the same
     pairing the gap-fill quizzes use for a cue and its sentence, so the
     colour already means "this is the thing to notice". */
  .step .ph{
    font-family:'Space Grotesk',sans-serif; font-weight:700; letter-spacing:.02em;
    color:var(--blue); white-space:nowrap; flex-shrink:0;
  }
  .step .mn{ font-size:.86em; line-height:1.35; color:var(--paper-dim); }
  .step.held{ border-color:var(--gold); box-shadow:0 8px 30px rgba(201,169,97,.25); }
  .step.held .mn{ color:var(--paper); }

  /* ── BOTTOM BAR ── */
  .bottom-bar{
    position:fixed; bottom:0; left:0; right:0; height:var(--bar-h); padding:.3rem 1rem;
    display:flex; align-items:center; justify-content:space-between; gap:1rem;
    background:rgba(13,13,13,.88); backdrop-filter:blur(20px);
    border-top:1px solid rgba(255,255,255,.06);
    font-family:'DM Mono',monospace; font-size:.66rem; color:var(--paper-faint);
  }
  .ctl{ display:flex; align-items:center; gap:.9rem; }
  .ctl button{ letter-spacing:.1em; text-transform:uppercase; font-size:.6rem; color:var(--paper-dim); }
  .ctl button:hover{ color:var(--gold); }
  .ctl button.on{ color:var(--gold); }
  .count{ font-variant-numeric:tabular-nums; }

  .loading{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--paper-dim); font-size:.8rem; }
  .loaderr{ color:#E86A5C; max-width:32rem; text-align:center; line-height:1.6; padding:2rem; }

  @media(max-width:640px){
    :root{ --header-h:100px; }
    .step{ flex-direction:column; align-items:flex-start; gap:.2rem; padding:.7rem 1rem; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-top">
    <a class="back-link" href="/?openModal=grammar">← Grammar</a>
    <div class="header-title">
      <div class="app-title">INTUITY</div>
      <div class="app-subtitle">Phrasal Verbs</div>
    </div>
    <div></div>
  </div>
  <div class="mode-selector">
    <button class="mode-btn active"><span class="mode-icon">🎞</span><span class="mode-label">Cinema</span></button>
    <button class="mode-btn" data-href="phrasal-verbs-quiz.html"><span class="mode-icon">⚡</span><span class="mode-label">Quiz</span></button>
    <button class="mode-btn" data-href="phrasal-verbs-quiz.html"><span class="mode-icon">✍</span><span class="mode-label">Practice</span></button>
    <button class="mode-btn" data-href="phrasal-verbs-game.html"><span class="mode-icon">🎯</span><span class="mode-label">Play</span></button>
  </div>
  <div class="verb-tabs" id="verbTabs"></div>
</header>

<div class="stage">
  <div class="card">
    <div class="reel" id="reel"><div class="loading" id="loading">Loading…</div></div>
  </div>
</div>

<div class="bottom-bar">
  <div class="ctl">
    <button id="playBtn" class="on">❚❚ pause</button>
    <button id="slowBtn">slower</button>
    <button id="fastBtn">faster</button>
  </div>
  <div class="count" id="count">—</div>
</div>

<script>
/* ======================================================================
   CINEMA — the wheel with nothing asked of you.

   The game's wheel tests recall: a definition, and the phrase must be
   caught before it goes. This is the same mechanism inverted — phrase and
   meaning descend together, already paired, and the reader simply watches.
   No clock, no score, no wrong answers. Rehearsal for the times a learner
   wants exposure rather than examination.

   Reads the same phrasal-verbs-data.json as every other page.
====================================================================== */

const DATA_URL = '../../data/grammar-rules/phrasal-verbs-data.json';

const STEPS = 4;            // fewer than the game: a meaning takes longer to read
let   CYCLE = 15000;        // ms for one full turn — slow enough to read twice
const MIN_CYCLE = 8000, MAX_CYCLE = 26000;

let GROUPS = [], queue = [], live = [], group = null;
let raf = null, playing = true, shownCount = 0, held = null;
let lastSpawn = 0;

const $ = id => document.getElementById(id);

async function boot(){
  try{
    const res = await fetch(DATA_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    GROUPS = (data.groups || []).map(g => ({
      id:g.id, label:g.label, color:g.color,
      items:(g.items||[]).filter(it => it.meaning && it.particle).map(it => ({
        phrase: ((it.verb || g.id) + ' ' + it.particle).toUpperCase(),
        meaning: it.meaning
      }))
    })).filter(g => g.items.length);
    if (!GROUPS.length) throw new Error('no phrases in the data');
    buildTabs();
    $('loading').remove();
    load(GROUPS[0]);
  }catch(e){
    $('reel').innerHTML = `<div class="loading"><p class="loaderr">Couldn't load <b>${DATA_URL}</b>.<br>` +
      `Open this from the site rather than as a local file — browsers block file:// data requests.</p></div>`;
  }
}

function buildTabs(){
  const wrap = $('verbTabs'); wrap.innerHTML = '';
  GROUPS.forEach(g => {
    const b = document.createElement('button');
    b.className = 'vtab' + (group && g.id === group.id ? ' active' : '');
    b.textContent = g.label;
    b.style.setProperty('--vc', g.color);
    b.onclick = () => load(g);
    wrap.appendChild(b);
  });
}

function load(g){
  group = g;
  buildTabs();
  live.forEach(r => r.el.remove());
  live = [];
  /* Every phrase in the set, in order, once per turn of the reel — a reader
     who sits through one full pass has seen the whole set. */
  queue = [...g.items];
  shownCount = 0;
  held = null;
  lastSpawn = 0;
  if (!raf) raf = requestAnimationFrame(frame);
  updateCount();
}

function nextItem(){
  if (!queue.length){ queue = [...group.items]; }   // round again, indefinitely
  shownCount++;
  updateCount();
  return queue.shift();
}

function updateCount(){
  const n = group ? group.items.length : 0;
  const pos = n ? ((shownCount - 1) % n) + 1 : 0;
  $('count').textContent = group ? `${group.label} · ${Math.max(1,pos)} of ${n}` : '—';
}

function spawn(){
  const item = nextItem();
  const el = document.createElement('div');
  el.className = 'step';
  el.innerHTML = `<span class="ph"></span><span class="mn"></span>`;
  el.querySelector('.ph').textContent = item.phrase;
  el.querySelector('.mn').textContent = item.meaning;
  /* Tapping holds a step still — the one interaction, and it exists because
     a reader who wants longer with a phrase should not have to chase it. */
  el.onclick = () => {
    held = (held === rec) ? null : rec;
    document.querySelectorAll('.step').forEach(n => n.classList.remove('held'));
    if (held) el.classList.add('held');
  };
  $('reel').appendChild(el);
  const rec = { el, born: performance.now(), item };
  live.push(rec);
}

function frame(now){
  const reel = $('reel'), H = reel.clientHeight, W = reel.clientWidth;

  if (playing && now - lastSpawn >= CYCLE / STEPS){ lastSpawn = now; spawn(); }

  for (let i = live.length - 1; i >= 0; i--){
    const r = live[i];
    /* A frozen step has its clock pushed forward each frame, so it never
       advances. Pausing freezes everything; holding freezes one step while
       the rest of the reel turns past it. */
    if (!playing || held === r){ r.born += (now - (r.last || now)); }
    r.last = now;

    const t = (now - r.born) / CYCLE;
    if (t >= 1){ r.el.remove(); live.splice(i,1); continue; }

    const y = t * (H + 120) - 60;
    const p = Math.max(0, Math.min(1, y / H));

    /* The same staircase as the game: narrow and tilted at the crown,
       wide and square on by the foot, so the pairing is most legible in
       the moment before it goes. */
    const scale = 0.86 * Math.pow(1.05, p * (STEPS - 1));
    const tilt  = (1 - p) * 12;
    const width = 52 + 36 * p;

    r.el.style.width = width + '%';
    r.el.style.transform =
      `translate(-50%,-50%) translate(0px, ${y.toFixed(1)}px)` +
      ` rotateX(${tilt.toFixed(1)}deg) scale(${scale.toFixed(3)})`;
    r.el.style.opacity = (0.5 + 0.5 * p).toFixed(2);
    r.el.style.fontSize = 'clamp(.85rem, ' + (1.5 + p * 0.6).toFixed(2) + 'vw + .4rem, 1.5rem)';
    r.el.style.zIndex = Math.round(p * 10);
  }
  raf = requestAnimationFrame(frame);
}

/* ---------- controls ---------- */
$('playBtn').onclick = () => {
  playing = !playing;
  $('playBtn').textContent = playing ? '❚❚ pause' : '▶ play';
  $('playBtn').classList.toggle('on', playing);
  /* Pausing freezes the whole reel, not just the spawning: the frame loop
     reads `playing` directly, so every step's clock stalls together. */
  live.forEach(r => r.last = performance.now());
};
$('slowBtn').onclick = () => { CYCLE = Math.min(MAX_CYCLE, CYCLE + 3000); };
$('fastBtn').onclick = () => { CYCLE = Math.max(MIN_CYCLE, CYCLE - 3000); };

document.querySelectorAll('.mode-btn').forEach(b => {
  b.addEventListener('click', () => { if (b.dataset.href) location.href = b.dataset.href; });
});

/* Nothing is at stake here, so a hidden tab simply stops rather than
   losing the reader's place. */
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ cancelAnimationFrame(raf); raf = null; }
  else if (!raf){ live.forEach(r => r.last = performance.now()); lastSpawn = performance.now(); raf = requestAnimationFrame(frame); }
});

boot();
</script>
</body>
</html>
