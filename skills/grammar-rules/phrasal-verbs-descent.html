<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTUITY — The Descent</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@500;700;900&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{ margin:0; padding:0; box-sizing:border-box; }
  :root{
    --gold:#6E5B2C; --accent:#C9A961;
    --ink:#17171a; --card:#d5cfbb; --card-edge:#b3ac95;
    --egg-free:#61b5ed; --egg-right:#abc32f; --egg-lost:#ff9248; --egg-word:#2f3540;
    --paper:#26251F; --dim:rgba(38,37,31,.62); --faint:rgba(38,37,31,.40);
    --s0:#cdbf8e; --s1:#e8935a; --s2:#ff7a45; --s3:#ff4d4d; --s4:#ffd94a;
    --header-h:96px; --bar-h:34px;
    /* circle chrome, matched to the dark stage rather than the light icon page */
    /* The disc: white slab, floor one step down, hairline rim. No gloss,
       no gradient across a face — all the depth is at the rim. */
    --disc:#EDE6D3; --disc-floor:#DFD8C2; --disc-edge:rgba(255,255,255,.85);
    --ink:#26251F;
    /* inverted badge scheme: pale tint fill, bold saturated ink for text —
       colour lives in the letterforms now, not the background block */
    --egg-free-bg:#DCEEFB;  --egg-free-ink:#1E68B8;
    --egg-right-bg:#E6F1D3; --egg-right-ink:#4C7A12;
    --egg-lost-bg:#FBE2D3;  --egg-lost-ink:#B0491F;
    --verb-blue:#17171A;
    --shade:62,58,50;
    /* stage chrome — swapped wholesale by the theme picker below */
    --bg-rgb: 255,255,255;                 /* ← the ground: white */
    --hairline: rgba(62,58,50,.16);
    --dot-idle: rgba(38,37,31,.18);
    --divider: rgba(38,37,31,.16);
  }

  /* ============ THEME VARIANTS — for A/B testing with kids ============
     Each variant only swaps the palette tokens above; every rule below
     still reads from --paper/--dim/--faint/--bg-rgb/--disc-*, so a theme
     switch never touches layout, just color. */
  /* The swatches now pick a ground rather than a whole theme: one variable
     changes, everything else is already written against it. */
  .swatch{ width:15px; height:15px; border-radius:50%; padding:0; border:1px solid rgba(62,58,50,.28); }
  .swatch.active{ box-shadow:0 0 0 2px var(--gold); }
  .swatch-stone{ background:#FFFFFF; }
  .swatch-sage{ background:#BDC8C4; }
  .swatch-slate{ background:#C0CAD2; }
  .swatch-linen{ background:#DCD5CD; }
  .swatch-lichen{ background:#B8B8AA; }

  html,body{ width:100%; height:100%; overflow:hidden; background:rgb(var(--bg-rgb)); transition:background .3s; }
  body{ font-family:'DM Sans',sans-serif; color:var(--paper); user-select:none; -webkit-user-select:none; }
  button{ font:inherit; color:inherit; background:none; border:none; cursor:pointer; }

  .header{
    position:fixed; top:0; left:0; right:0; z-index:20; height:var(--header-h);
    display:flex; flex-direction:column; gap:.35rem; padding:.45rem 1.25rem .35rem;
    background:rgba(var(--bg-rgb),.9); backdrop-filter:blur(20px);
    border-bottom:1px solid var(--hairline);
    transition:background .3s, border-color .3s;
  }
  .htop{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; }
  .back{ justify-self:start; text-decoration:none; font-family:'Space Grotesk',sans-serif;
         font-size:.6rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); }
  .title{ display:flex; flex-direction:column; align-items:center; line-height:1.1; }
  .title b{ font-family:'Space Grotesk',sans-serif; font-size:1rem; font-weight:900; letter-spacing:.22em; color:var(--gold); }
  .title span{ font-size:.56rem; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); margin-top:.1rem; }

  /* the five marks, climbed within a single round */
  .ladder{ display:flex; align-items:center; justify-content:center; gap:.45rem; }
  .mark{ display:flex; flex-direction:column; align-items:center; gap:.12rem; width:36px; }
  .mark .dot{ width:14px; height:14px; border-radius:50%; background:var(--dot-idle); transition:all .3s; }
  .mark .lbl{ font-family:'DM Mono',monospace; font-size:.4rem; letter-spacing:.08em;
              text-transform:uppercase; color:var(--faint); }
  .mark.done .dot{ box-shadow:0 0 12px currentColor; }
  .mark.done .lbl{ color:var(--dim); }
  .link{ width:12px; height:1px; background:var(--divider); }
  .link.done{ background:var(--gold); }

  .stage{ position:fixed; top:var(--header-h); left:0; right:0; bottom:var(--bar-h); overflow:hidden; }
  .field{ position:absolute; inset:0; perspective:1000px; }

  /* ── a row: one meaning, three candidates ── */
  .row{
    position:absolute; left:0; right:0; display:flex; align-items:flex-start; justify-content:center;
    gap:clamp(.55rem,1.6vw,1.05rem); padding:0 .7rem; will-change:transform,opacity;
  }

  /* ── the clue, rebuilt as a neumorphic disc — same raised-ring /
     recessed-well pairing as the candidate cards below, just larger, so all
     four objects in the row read as one family of shapes rather than a
     plaque next to three coins. Text sits on the recessed well and clamps
     to a handful of lines rather than overflowing the circle. This is the
     definition box — it always sits first (left-most) in the row, before
     the three verb candidates. ── */
  .clue{
    position:relative;
    flex:0 0 clamp(112px, 18vw, 168px);
    aspect-ratio:1;
    display:flex; align-items:center; justify-content:center;
    border-radius:22px;
    padding:1.15rem;
    background:var(--disc);
    box-shadow:4px 6px 13px rgba(var(--shade),.30);
    font-family:'Space Grotesk',sans-serif; font-weight:600;
    font-size:clamp(.6rem,1.5vw,.78rem); line-height:1.28; color:var(--ink); text-align:center;
    transition:opacity .2s;
  }
  .clue .clue-text{
    position:relative; z-index:1;
    overflow:hidden; display:-webkit-box;
    -webkit-line-clamp:5; -webkit-box-orient:vertical;
  }
  /* the definition's own main verb (e.g. "imply" in "to imply or mean
     something") — called out bigger, bolder, and blue so it reads as the
     word the child should be matching against the candidate cards */
  .clue .clue-text .mv{
    font-weight:800; font-size:1.18em; color:var(--verb-blue);
  }

  /* ── the candidates, rebuilt as the raised/recessed discs from the icon
     row: a light neumorphic pair (outer ring + inset well) redone in the
     stage's own dark palette so it reads as one surface, not a borrowed one.
     Sized to match the clue disc exactly, with the thinnest possible rim
     between the outer edge and the recessed floor. ── */
  .cards{ display:flex; align-items:center; gap:clamp(.55rem,1.8vw,1.1rem); padding-bottom:16px; }
  .card{
    position:relative;
    flex:0 0 clamp(112px, 18vw, 168px);
    aspect-ratio:1;
    border-radius:22px;
    display:grid; place-items:center;
    cursor:pointer;
    background:var(--disc);
    border:1px solid var(--disc-edge);
    box-shadow:4px 6px 13px rgba(var(--shade),.32);
    transition: transform .14s cubic-bezier(.2,1.4,.4,1), box-shadow .14s;
  }
  .card .pv{
    /* the main verb of the sentence — blue fill, bigger, and a lighter,
       more modern weight than the old black Archivo Black slab */
    position:relative; z-index:1;
    font-family:'Space Grotesk',sans-serif; font-weight:700; color:var(--verb-blue);
    font-size:clamp(1.3rem,3.8vw,1.95rem); letter-spacing:-.01em; line-height:1.02;
    text-align:center; padding:0 .15rem;
    transform:translateY(-.9rem);
  }
  .card .egg{
    /* Inside the disc now, under the verb — the silhouette is the whole tap
       target, so a thumb can never land on state colour outside the card. */
    position:absolute; z-index:2; left:50%; bottom:22%; transform:translateX(-50%);
    border-radius:999px; padding:.16rem .5rem .18rem; white-space:nowrap;
    background:var(--egg-free-bg); color:var(--egg-free-ink);
    font-family:'Space Grotesk',sans-serif; font-weight:800;
    font-size:clamp(.62rem,1.8vw,.85rem); letter-spacing:.02em; line-height:1;
    max-width:82%; overflow:hidden; text-overflow:ellipsis;
    transition:background .2s, color .2s;
  }

  /* Only the row at the reading line can be answered. The others are on
     their way and are shown as such — a child reads one meaning at a time,
     which is the whole point of letting them descend slowly. */
  .row.waiting .card{ pointer-events:none; }
  .row.live .card:hover{ transform:translateY(-3px); box-shadow:5px 8px 16px rgba(var(--shade),.36); }
  .row.live .card:active{ transform:translateY(2px) scale(.97); }

  /* The card stays white; the egg carries the outcome. Green for the one
     that was right, pumpkin for the two that were not — both revealed, so
     the row teaches on the way past rather than only when it is missed. */
  .card.right .egg{ background:var(--egg-right-bg); color:var(--egg-right-ink); }
  .card.wrong .egg{ background:var(--egg-lost-bg);  color:var(--egg-lost-ink); }
  .card.wrong{ animation:nudge .4s; }
  @keyframes nudge{ 0%,100%{transform:none} 30%{transform:translateX(-6px)} 65%{transform:translateX(5px)} }
  .row.done .card{ pointer-events:none; }
  .row.done .card:not(.right):not(.wrong){ opacity:.58; }

  .bottom{
    position:fixed; bottom:0; left:0; right:0; height:var(--bar-h); padding:.3rem 1rem;
    display:flex; align-items:center; justify-content:space-between; gap:.8rem;
    background:rgba(var(--bg-rgb),.92); border-top:1px solid var(--hairline);
    font-family:'DM Mono',monospace; font-size:.66rem; color:var(--faint);
    transition:background .3s, border-color .3s;
  }
  .bottom b{ color:var(--paper); font-variant-numeric:tabular-nums; }
  .hit b{ color:var(--egg-right); } .miss b{ color:var(--egg-lost); }
  .clock{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:.9rem;
          color:var(--paper); font-variant-numeric:tabular-nums; }
  .clock.low{ color:var(--egg-lost); animation:beat 1s ease-in-out infinite; }
  @keyframes beat{ 0%,100%{transform:scale(1)} 14%{transform:scale(1.13)} 30%{transform:scale(1)} }

  .banner{
    position:fixed; left:50%; top:42%; z-index:40; pointer-events:none;
    font-family:'Space Grotesk',sans-serif; font-weight:900;
    font-size:clamp(1.4rem,5vw,2.6rem); letter-spacing:.14em; text-transform:uppercase;
    opacity:0; transform:translate(-50%,-50%) scale(.8);
    transition:opacity .2s, transform .4s cubic-bezier(.2,1.6,.4,1); text-shadow:0 0 24px currentColor;
  }
  .banner.show{ opacity:1; transform:translate(-50%,-50%) scale(1); }

  .spark{ position:absolute; width:5px; height:5px; border-radius:50%; pointer-events:none; z-index:30; }
  .fw-flash{ width:64px; height:64px; border-radius:50%;
             background:radial-gradient(circle,#fff 0%,#C9A961 35%,rgba(201,169,97,0) 70%); }
  .fw-crackle{ width:3px; height:3px; border-radius:50%; background:#fff; box-shadow:0 0 8px #fff; }

  .over{
    position:fixed; inset:0; z-index:50; display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:.35rem; text-align:center; padding:2rem;
    background:rgb(var(--bg-rgb));
  }
  .over.show{ display:flex; }
  .over .score{ font-family:'Space Grotesk',sans-serif; font-weight:900;
                font-size:clamp(2.6rem,10vw,4rem); font-variant-numeric:tabular-nums; }
  .over .score .gr{ font-size:.5em; margin-left:.3rem; vertical-align:.35em; }
  .g-a{ color:var(--s4); } .g-b{ color:var(--egg-right); } .g-c{ color:#7dd3fc; } .g-d{ color:var(--egg-lost); }
  .over .word{ font-family:'DM Mono',monospace; font-size:.72rem; letter-spacing:.16em;
               text-transform:uppercase; color:var(--dim); }
  .over .note{ margin-top:.7rem; font-size:.8rem; color:var(--dim); }
  .over .note b{ color:var(--paper); }
  .acts{ display:flex; gap:.6rem; flex-wrap:wrap; justify-content:center; margin-top:1.3rem; }
  .over .go{ padding:.7rem 1.7rem; border-radius:99px; background:var(--disc); color:var(--ink);
             box-shadow:3px 5px 11px rgba(var(--shade),.30);
             font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:.74rem;
             letter-spacing:.1em; text-transform:uppercase; }
  .over .quiet{ padding:.7rem 1.5rem; border-radius:99px; color:var(--dim);
                border:1px solid rgba(var(--shade),.28); font-size:.72rem;
                letter-spacing:.08em; text-transform:uppercase; }

  .loading{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; color:var(--dim); font-size:.8rem; }
  .err{ color:var(--egg-lost); text-align:center; max-width:30rem; line-height:1.7; padding:2rem; }

  body.embedded{ --header-h:58px; }
  body.embedded .htop{ display:none; }
  body.embedded .header{ padding:.3rem 1rem .25rem; justify-content:center; }
</style>
</head>
<body>

<header class="header">
  <div class="htop">
    <a class="back" href="/?openModal=grammar" target="_top">← Grammar</a>
    <div class="title"><b>INTUITY</b><span>Phrasal Verbs</span></div>
    <div class="theme-picker" id="themePicker">
      <button class="swatch swatch-stone active" data-ground="255,255,255" data-shade="30,30,30" title="White" aria-label="White ground"></button>
      <button class="swatch swatch-sage" data-ground="189,200,196" data-shade="56,70,64" title="Sage" aria-label="Sage ground"></button>
      <button class="swatch swatch-slate" data-ground="192,202,210" data-shade="60,72,84" title="Slate" aria-label="Slate ground"></button>
      <button class="swatch swatch-linen" data-ground="220,213,205" data-shade="88,78,64" title="Linen" aria-label="Linen ground"></button>
      <button class="swatch swatch-lichen" data-ground="184,184,170" data-shade="58,58,50" title="Lichen" aria-label="Lichen ground"></button>
    </div>
  </div>
  <div class="ladder" id="ladder"></div>
</header>

<div class="stage">
  <div class="field" id="field"></div>
</div>

<div class="bottom">
  <span class="hit"><b id="hits">0</b> right</span>
  <span class="miss"><b id="misses">0</b> missed</span>
  <span>streak <b id="streak">0</b></span>
  <span class="clock" id="clock">2:00</span>
</div>

<div class="banner" id="banner"></div>

<div class="over" id="over">
  <div class="score" id="score"></div>
  <div class="word" id="word"></div>
  <div class="note" id="note"></div>
  <div class="acts">
    <button class="go" onclick="start()">Go again</button>
    <button class="quiet" onclick="location.href='phrasal-verbs-play.html'">Back to phrasal verbs</button>
  </div>
</div>

<div class="loading" id="loading">Loading…</div>

<script src="intuity-log.js"></script>
<script>
/* ======================================================================
   THE DESCENT

   One meaning and three cards descend together as a row. Only the row at
   the reading line can be answered; the rows above are on their way and
   are dimmed, so a child reads one meaning at a time rather than choosing
   which of three questions to attempt.

   The clue and the candidates are all discs now — the same raised-ring /
   recessed-well pairing, all the same size — so the whole row reads as
   one family of shapes instead of a plaque next to three coins. The
   particle rides as a small badge on each candidate's rim rather than
   stacked text inside a rectangle. Rows fall on a shorter, tighter cadence
   than before: more of them are on screen at once and the gaps between
   them read as a continuous stream rather than a few widely spaced
   questions, which is what was making the page feel sparse and
   disconnected on a large screen.
====================================================================== */

const DATA_URL = '../../data/grammar-rules/phrasal-verbs-data.json';
const ROUND    = 120;      // seconds
const FALL     = 18000;    // ms for a row to cross the field — slower, so
                            // a row is on screen long enough to actually
                            // read and decide, not just glance and guess
const MIN_GAP  = 2600;     // floor on time between spawns, even for a
                            // one-line definition
const ROW_BREATH_PX = 34;  // minimum clear pixels between one row's bottom
                            // and the next row's top
/* Rows no longer spawn on a fixed timer alone. A two-line definition
   renders taller than a one-line one, and a fixed timer spaced every row
   the same regardless — which is exactly what was causing rows to
   overlap. Instead, after each row is placed we measure how tall it
   actually rendered and compute how much time must pass, at the current
   fall speed, before the next row can spawn without crowding it. Short
   rows come a little sooner, tall rows a little later, and nothing ever
   overlaps regardless of how the definition text wraps. */
let currentGap = MIN_GAP;

/* Roughly 30-35 rows enter the field over two minutes at this pace —
   fewer than a purely time-packed stream, because each is on screen
   longer and spacing now varies with content. Marks are set against that. */
const MARKS    = [3, 8, 14, 21, 29];
const NAMES    = ['Spark','Ember','Flame','Blaze','Crown'];

let POOL = [], rows = [], raf = null, timer = null;
let hits = 0, misses = 0, streak = 0, best = 0, mark = -1, left = ROUND;
let lastSpawn = 0, running = false, seq = 0;

const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const shuffle = a => { const b=[...a]; for(let i=b.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[b[i],b[j]]=[b[j],b[i]];} return b; };
const firstSense = m => String(m).split(';')[0].trim();

/* Definitions read as "to VERB ...", e.g. "to imply or mean something" —
   the word right after "to" is the sentence's main verb. Escape first,
   then wrap just that word so it renders bold, larger, and blue while the
   rest of the definition stays as plain body text. Definitions that don't
   start with "to" are left untouched. */
const markVerb = text => esc(text).replace(/^(to\s+)(\w+)/i, (m, lead, verb) => lead + '<b class="mv">' + verb + '</b>');

/* ── celebratory jingle ──
   A tiny Web Audio synth rather than a sound file, so there's nothing to
   fetch and nothing that can 404. Each note pairs a triangle-wave core
   with a soft sine overtone, kept at gentle levels so the "ta-da" reads
   as a light, pleasant chime rather than a loud arcade blast. Browsers
   require a user gesture before audio can play, which a card tap already
   is, so the context is created lazily on first use. */
let _actx = null;
function audioCtx(){
  if (!_actx) _actx = new (window.AudioContext || window.webkitAudioContext)();
  if (_actx.state === 'suspended') _actx.resume();
  return _actx;
}
function note(ctx, master, freq, t0, dur, level){
  const osc1 = ctx.createOscillator();
  osc1.type = 'triangle'; osc1.frequency.setValueAtTime(freq, t0);
  const osc2 = ctx.createOscillator();
  osc2.type = 'sine'; osc2.frequency.setValueAtTime(freq * 2, t0);
  const g1 = ctx.createGain(), g2 = ctx.createGain();
  g1.gain.setValueAtTime(0, t0);
  g1.gain.linearRampToValueAtTime(level * 0.65, t0 + 0.02);
  g1.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  g2.gain.setValueAtTime(0, t0);
  g2.gain.linearRampToValueAtTime(level * 0.28, t0 + 0.02);
  g2.gain.exponentialRampToValueAtTime(0.001, t0 + dur * 0.7);
  osc1.connect(g1); g1.connect(master);
  osc2.connect(g2); g2.connect(master);
  osc1.start(t0); osc1.stop(t0 + dur + 0.03);
  osc2.start(t0); osc2.stop(t0 + dur + 0.03);
}
function chime(notes, big){
  try{
    const ctx = audioCtx();
    const master = ctx.createGain();
    master.gain.value = big ? 0.32 : 0.22;
    const comp = ctx.createDynamicsCompressor();
    master.connect(comp); comp.connect(ctx.destination);
    const start = ctx.currentTime;
    const step = big ? 0.11 : 0.095;
    const dur  = big ? 0.42 : 0.32;
    notes.forEach((freq, i) => note(ctx, master, freq, start + i * step, dur, 0.7));
    /* a soft unison "shimmer" on the final note ties it off like a gentle
       fanfare instead of just stopping */
    const last = start + (notes.length - 1) * step;
    note(ctx, master, notes[notes.length - 1] * 2, last + 0.03, dur * 0.8, big ? 0.3 : 0.18);
  }catch(e){ /* audio isn't essential — fail silently */ }
}
/* a full ascending major run for every hit, and a slightly bigger, still
   gentle fanfare with a high tonic to top it off on a streak of 5+ */
const winChime = () => chime([523.25, 659.25, 783.99, 1046.5], false);
const bigChime = () => chime([392.00, 493.88, 587.33, 698.46, 880.00, 1174.66], true);

async function boot(){
  try{
    const res = await fetch(DATA_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const d = await res.json();
    (d.groups || []).forEach(g => (g.items || []).forEach(it => {
      if (it.particle && it.meaning)
        POOL.push({ verb:(it.verb || g.label || g.id).toUpperCase(),
                    particle: it.particle.toLowerCase(),
                    meaning: firstSense(it.meaning) });
    }));
    if (POOL.length < 12) throw new Error('not enough phrases');
    $('loading').remove();
    start();
  }catch(e){
    $('loading').innerHTML = '<p class="err">Could not load <b>' + DATA_URL + '</b>.<br>' +
      'Open this from the site rather than as a local file — browsers block file:// requests.</p>';
  }
}

function start(){
  rows.forEach(r => r.el.remove());
  rows = []; hits = misses = streak = best = 0; mark = -1; left = ROUND; seq = 0;
  $('over').classList.remove('show');
  drawLadder(); paint();
  running = true; lastSpawn = 0; currentGap = MIN_GAP;
  clearInterval(timer);
  timer = setInterval(tick, 1000);
  if (raf) cancelAnimationFrame(raf);
  raf = requestAnimationFrame(frame);
}

/* The reading line sits low: a row spends most of its fall arriving, and is
   answered in the last third, which is when it is largest and closest. */
const readLine = () => $('field').clientHeight * 0.62;

function drawLadder(){
  const l = $('ladder'); l.innerHTML = '';
  NAMES.forEach((n, i) => {
    if (i){ const k = document.createElement('div'); k.className = 'link' + (i <= mark ? ' done' : ''); l.appendChild(k); }
    const el = document.createElement('div');
    el.className = 'mark' + (i <= mark ? ' done' : '');
    el.innerHTML = '<div class="dot" style="' + (i <= mark ? 'background:var(--s'+i+');color:var(--s'+i+')' : '') +
                   '"></div><div class="lbl">' + n + '</div>';
    l.appendChild(el);
  });
}

/* Two distractors from the same verb wherever possible: the choice is then
   purely between particles, which is the thing being learned. Falling back
   to a different verb would make the row answerable without reading. */
function buildRow(){
  const target = POOL[(Math.random() * POOL.length) | 0];
  const kin = POOL.filter(p => p.verb === target.verb && p.particle !== target.particle);
  const others = shuffle(kin).slice(0, 2);
  while (others.length < 2){
    const p = POOL[(Math.random() * POOL.length) | 0];
    if (p.particle !== target.particle && !others.some(o => o.particle === p.particle)) others.push(p);
  }
  return { target, cards: shuffle([target, ...others]) };
}

function spawn(now){
  const { target, cards } = buildRow();
  const el = document.createElement('div');
  el.className = 'row waiting';
  /* the definitions box is always first (left-most) in the row, ahead of
     the three verb candidates */
  el.innerHTML = '<div class="clue"><span class="clue-text">' + markVerb(target.meaning) + '</span></div><div class="cards">' +
    cards.map((c, i) =>
      '<div class="card" data-i="' + i + '"><span class="pv">' + esc(c.verb) + '</span>' +
      '<span class="egg">' + esc(c.particle) + '</span></div>').join('') + '</div>';
  $('field').appendChild(el);

  const rec = { el, target, cards, born: now, id: ++seq, answered: false, live: false };
  el.querySelectorAll('.card').forEach((cardEl, i) => {
    cardEl.onclick = () => answer(rec, i, cardEl);
  });
  rows.push(rec);

  /* how tall did this one actually render? convert that, plus the
     breathing room we want, into a time gap at the current fall speed */
  const H = $('field').clientHeight;
  const speed = (H + 140) / FALL;             // px per ms
  const rowH = el.offsetHeight || 100;
  currentGap = Math.max(MIN_GAP, (rowH + ROW_BREATH_PX) / speed);
}

function frame(now){
  const field = $('field');
  const H = field.clientHeight;
  const line = readLine();

  if (running && now - lastSpawn >= currentGap){ lastSpawn = now; spawn(now); }

  /* the lowest unanswered row is the one being asked */
  let liveId = null, lowest = -1;
  rows.forEach(r => {
    if (r.answered) return;
    const t = (now - r.born) / FALL;
    const y = t * (H + 140) - 70;
    if (y <= line + 40 && y > lowest){ lowest = y; liveId = r.id; }
  });

  for (let i = rows.length - 1; i >= 0; i--){
    const r = rows[i];
    const t = (now - r.born) / FALL;
    const y = t * (H + 140) - 70;

    if (t >= 1){
      /* a row that leaves unanswered counts against you — that is the only
         pressure in the game, and it is a slow one */
      if (!r.answered) expire(r);
      r.el.remove(); rows.splice(i, 1); continue;
    }

    r.el.style.transform = 'translateY(' + y.toFixed(1) + 'px)';
    const live = r.id === liveId && !r.answered;
    if (live !== r.live){
      r.live = live;
      r.el.classList.toggle('live', live);
      r.el.classList.toggle('waiting', !live);
    }
    if (r.answered) r.el.classList.add('done');
  }

  raf = requestAnimationFrame(frame);
}

function answer(rec, i, cardEl){
  if (rec.answered || !rec.live) return;
  rec.answered = true;
  const chosen = rec.cards[i];
  const right = chosen.particle === rec.target.particle;

  if (window.INTUITY)
    INTUITY.log('phrasal-verbs', rec.target.verb + ' ' + rec.target.particle, right, { game:'descent' });

  if (right){
    hits++; streak++; best = Math.max(best, streak);
    cardEl.classList.add('right');
    rec.el.querySelectorAll('.card').forEach((el, k) => {
      if (rec.cards[k].particle !== rec.target.particle) el.classList.add('wrong');
    });
    const big = streak >= 5;
    burst(cardEl, big);
    big ? bigChime() : winChime();
    checkMark();
  } else {
    misses++; streak = 0;
    cardEl.classList.add('wrong');
    /* show which one it was: a row that closes without an answer teaches
       nothing, and this is the moment the child is still looking */
    rec.el.querySelectorAll('.card').forEach((el, k) => {
      if (rec.cards[k].particle === rec.target.particle) el.classList.add('right');
      else el.classList.add('wrong');
    });
  }
  paint();
}

function expire(rec){
  misses++; streak = 0;
  if (window.INTUITY)
    INTUITY.log('phrasal-verbs', rec.target.verb + ' ' + rec.target.particle, false, { game:'descent' });
  paint();
}

function tick(){
  left--;
  $('clock').textContent = Math.floor(left/60) + ':' + String(left%60).padStart(2,'0');
  $('clock').classList.toggle('low', left <= 15);
  if (left <= 0) finish();
}

function checkMark(){
  let m = -1;
  MARKS.forEach((n, i) => { if (hits >= n) m = i; });
  if (m <= mark) return;
  mark = m;
  drawLadder();
  flash(NAMES[m], 'var(--s' + m + ')');
}

function paint(){
  $('hits').textContent = hits;
  $('misses').textContent = misses;
  $('streak').textContent = streak;
}

/* the Cambridge scale, as everywhere else in the app */
function scale(acc){
  const A = [[0,140],[0.60,160],[0.72,173],[0.80,180],[1,190]];
  for (let i=1;i<A.length;i++){
    const [a0,s0]=A[i-1],[a1,s1]=A[i];
    if (acc<=a1) return Math.round(s0+(acc-a0)/(a1-a0)*(s1-s0));
  }
  return 190;
}
const grade = s => s>=180?['A','Excellent']:s>=173?['B','Very good']:s>=160?['C','Pass']:['D','Try again'];

function finish(){
  running = false;
  clearInterval(timer); cancelAnimationFrame(raf);
  rows.forEach(r => r.el.remove()); rows = [];
  const total = hits + misses;
  const acc = total ? hits/total : 0;
  const sc = scale(acc), [letter, word] = grade(sc);

  if (window.INTUITY) INTUITY.session('phrasal-verbs', 'descent', { hits, misses, best });

  $('score').className = 'score g-' + letter.toLowerCase();
  $('score').innerHTML = sc + '<span class="gr">' + letter + '</span>';
  $('word').textContent = word + (mark >= 0 ? ' · ' + NAMES[mark] : '');
  const next = sc < 160 ? 160 : sc < 173 ? 173 : sc < 180 ? 180 : null;
  $('note').innerHTML = next
    ? '<b>' + (next - sc) + '</b> from <b>' + next + '</b> · ' + hits + ' right, ' + misses + ' missed'
    : hits + ' right, ' + misses + ' missed · best streak ' + best;
  $('over').classList.add('show');
}

function flash(text, col){
  const b = $('banner');
  b.textContent = text; b.style.color = col;
  b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
  setTimeout(() => b.classList.remove('show'), 1200);
}

/* ── the firework ──
   A real firework has two beats: a rocket rises on a thin trail, then it
   bursts into a ring of streaking stars that arc outward and are pulled
   back down by gravity as they fade — not a uniform cloud of dots. This
   version launches a small trailing spark upward from the card, and only
   once it reaches its peak does it burst into an evenly spaced radial
   shell of short streak-particles (rotated to their direction of travel,
   tapered like a real spark trail) that decelerate, sag under gravity,
   and fade out, with a soft flash at the core and a scatter of lingering
   glitter afterward. A streak of 5+ launches several shells in quick
   succession for a proper finale. */
const FW_COLS = ['#FFD94A','#FF6B4A','#7FB519','#61B5ED','#FF4D6A','#B983FF','#ffffff','#FF9F1C'];

function launch(field, x, fromY, toY, big){
  const rocket = document.createElement('div');
  rocket.style.cssText = 'position:absolute; z-index:30; pointer-events:none; left:'+x+'px; top:'+fromY+
    'px; width:4px; height:4px; border-radius:50%; background:#FFEFC2; ' +
    'box-shadow:0 0 6px #FFEFC2, 0 12px 16px -3px rgba(255,220,150,.85);';
  field.appendChild(rocket);
  const dur = big ? 380 : 300;
  const anim = rocket.animate([
    { transform:'translate(-50%,-50%) translateY(0)', opacity:1 },
    { transform:'translate(-50%,-50%) translateY(' + (toY - fromY) + 'px)', opacity:1 }
  ], { duration:dur, easing:'cubic-bezier(.25,.4,.3,1)' });
  anim.onfinish = () => { rocket.remove(); shell(field, x, toY, big); };
  setTimeout(() => rocket.remove(), dur + 60);
}

function shell(field, cx, cy, big){
  const shellCol = FW_COLS[(Math.random()*FW_COLS.length)|0];

  /* soft core flash at the moment of burst */
  const flash = document.createElement('div');
  flash.className = 'spark fw-flash';
  flash.style.left = cx+'px'; flash.style.top = cy+'px';
  field.appendChild(flash);
  flash.animate([{transform:'translate(-50%,-50%) scale(.15)',opacity:1},
                 {transform:'translate(-50%,-50%) scale('+(big?3.2:2.3)+')',opacity:0}],
                {duration:big?280:220,easing:'cubic-bezier(.1,.8,.2,1)'});
  setTimeout(()=>flash.remove(), 300);

  /* the shell: evenly spaced radial streaks (a real firework's stars are
     spaced round the shell, not scattered randomly), each a short tapered
     line rotated to its own direction of travel, decelerating outward and
     sagging under gravity as it fades */
  const n = big ? 46 : 28;
  const baseSpeed = big ? 130 : 95;
  for (let i=0;i<n;i++){
    const angle = (Math.PI*2*i)/n + (Math.random()*.3 - .15);
    const speed = baseSpeed + Math.random()*baseSpeed*0.5;
    const col = Math.random() < 0.7 ? shellCol : FW_COLS[(Math.random()*FW_COLS.length)|0];
    const deg = angle*180/Math.PI;

    const p = document.createElement('div');
    p.style.cssText = 'position:absolute; z-index:30; pointer-events:none; left:'+cx+'px; top:'+cy+
      'px; width:11px; height:2.4px; border-radius:2px; ' +
      'background:linear-gradient(90deg,'+col+',rgba(255,255,255,0)); box-shadow:0 0 5px '+col+'; ' +
      'transform:translate(-50%,-50%) rotate('+deg+'deg);';
    field.appendChild(p);

    const dx = Math.cos(angle), dy = Math.sin(angle);
    const dur = (big?1000:760) + Math.random()*300;
    const steps = []; const STEP_N = 6;
    for (let k=0;k<=STEP_N;k++){
      const t = k/STEP_N;
      const dist = speed * t * (1 - t*0.28);      // decelerates, like real burnt powder
      const gravity = 55 * t * t * (big?1.15:1);  // gravity pulls the trail down over time
      const x = dx*dist, y = dy*dist + gravity;
      const fade = t < 0.55 ? 1 : Math.max(0, 1 - (t-0.55)/0.45);
      steps.push({ transform:'translate(-50%,-50%) translate('+x.toFixed(1)+'px,'+y.toFixed(1)+'px) rotate('+deg+'deg)', opacity: fade });
    }
    p.animate(steps, { duration:dur, easing:'linear' });
    setTimeout(()=>p.remove(), dur+50);
  }

  /* a scatter of lingering embers that twinkle and fade below the burst */
  const glitterCount = big ? 34 : 18;
  for (let i=0;i<glitterCount;i++){
    const gDelay = 150 + Math.random()*(big?500:320);
    setTimeout(() => {
      const gl = document.createElement('div');
      gl.className = 'spark fw-crackle';
      const a = Math.random()*Math.PI*2, d = Math.random()*(big?150:100);
      const gx = cx + Math.cos(a)*d, gy = cy + Math.sin(a)*d + 20 + Math.random()*30;
      gl.style.left = gx+'px'; gl.style.top = gy+'px';
      const col = FW_COLS[(Math.random()*FW_COLS.length)|0];
      gl.style.background = col; gl.style.boxShadow = '0 0 8px '+col;
      field.appendChild(gl);
      const dur = 450 + Math.random()*350;
      gl.animate([{opacity:0,transform:'translate(-50%,-50%) scale(.3)'},
                  {opacity:1,transform:'translate(-50%,-50%) scale(1.3)',offset:.3},
                  {opacity:0,transform:'translate(-50%,-50%) scale(.2)'}], {duration:dur, easing:'ease-in-out'});
      setTimeout(()=>gl.remove(), dur+40);
    }, gDelay);
  }
}

function burst(el, big){
  const field = $('field');
  const f = field.getBoundingClientRect(), r = el.getBoundingClientRect();
  const cx = r.left - f.left + r.width/2, cy = r.top - f.top + r.height/2;

  const shellCount = big ? 3 : 1;
  for (let s=0; s<shellCount; s++){
    setTimeout(() => {
      const jx = cx + (Math.random()*2-1)*(big?45:14);
      const burstY = cy - (55 + Math.random()*35);
      launch(field, jx, cy, burstY, big);
    }, s * 170);
  }
}

/* A hidden tab should stop rather than run the clock down unseen. */
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ clearInterval(timer); cancelAnimationFrame(raf); }
  else if (running){
    const now = performance.now();
    rows.forEach(r => r.born = now - 1);   // resume without a jump
    lastSpawn = now;
    timer = setInterval(tick, 1000);
    raf = requestAnimationFrame(frame);
  }
});

/* Hide this page's own back-link/title/theme-picker whenever it's loaded
   inside the wrapper (the only way users normally reach it). Opt out with
   ?standalone=1 for testing this file on its own with full chrome. */
const __params = new URLSearchParams(location.search);
if (__params.get('standalone') !== '1') document.body.classList.add('embedded');

/* ground picker — sets the two variables everything else is written
   against, so nothing here knows which colour it is. */
document.querySelectorAll('.swatch').forEach(btn => {
  btn.addEventListener('click', () => {
    document.documentElement.style.setProperty('--bg-rgb', btn.dataset.ground);
    document.documentElement.style.setProperty('--shade', btn.dataset.shade);
    document.querySelectorAll('.swatch').forEach(b => b.classList.toggle('active', b === btn));
  });
});

boot();
</script>
