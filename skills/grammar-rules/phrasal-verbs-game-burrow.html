<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTUITY — Incoming</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800;900&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Fraunces:ital,wght@0,600;1,600&family=Bungee&family=Caveat:wght@700&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  /* ── SHELL TOKENS — identical set to phrasal-verbs-quiz.html ───────────
     Same two bar heights, same gold, same accent. The game's own palette
     (the proximity ladder) sits below and is additive. */
  :root{
    --gold:#C9A961; --gold-glow:rgba(201,169,97,.4);
    --mode-accent:#FFD94A; --mode-accent-rgb:255,217,74;
    --header-h:116px;
    --bar-h:34px;

    --clear:#5ED39B; --wrong:#E86A5C;
    /* The same stock and the same three eggs as Rack and Pegs. This page has
       the best architecture of any game here — ten sets, revision drawn from
       every verb, a trial built from a child's own misses — and it was the
       only one still dressed in the old dark plates. */
    --ink:#17171a;
    --card:#d5cfbb; --card-edge:#b3ac95;
    --egg-free:#61b5ed; --egg-right:#abc32f; --egg-lost:#ff9248;
    --egg-word:#2f3540;
    --paper:#e5e5e7; --paper-dim:rgba(229,229,231,.55); --paper-faint:rgba(229,229,231,.24);
    --line:rgba(255,255,255,.08);

    /* stage ladder — cool ember to hot gold */
    --s0:#cdbf8e; --s0-glow:rgba(205,191,142,.5);
    --s1:#e8935a; --s1-glow:rgba(232,147,90,.55);
    --s2:#ff7a45; --s2-glow:rgba(255,122,69,.6);
    --s3:#ff4d4d; --s3-glow:rgba(255,77,77,.65);
    --s4:#ffd94a; --s4-glow:rgba(255,217,74,.8);
  }
  html, body { width:100%; height:100%; overflow:hidden; background:#0d0d0d; }
  body{
    font-family:'DM Sans', sans-serif; color:var(--paper);
    user-select:none; -webkit-user-select:none;
  }
  button{ font:inherit; color:inherit; background:none; border:none; cursor:pointer; }

  /* ── HEADER — same construction as the quiz page ── */
  .header{
    position:fixed; top:0; left:0; right:0; z-index:100;
    display:flex; flex-direction:column; align-items:stretch; gap:.4rem;
    padding:.5rem 1.25rem .4rem;
    background:rgba(13,13,13,.88); backdrop-filter:blur(20px);
    border-bottom:1px solid rgba(255,255,255,.06); height:var(--header-h);
  }
  .header-top{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; }
  .header-title{ display:flex; flex-direction:column; align-items:center; line-height:1.1; }
  .app-title{ font-family:'Space Grotesk',sans-serif; font-size:1rem; font-weight:900; letter-spacing:.22em; color:var(--gold); }
  .app-subtitle{ font-size:.58rem; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:rgba(255,255,255,.32); margin-top:.1rem; }
  .back-link{
    justify-self:start; text-decoration:none; font-family:'Space Grotesk',sans-serif;
    font-size:.6rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    color:rgba(255,255,255,.3); transition:color .2s; white-space:nowrap;
  }
  .back-link:hover{ color:rgba(255,255,255,.7); }
  .header-spacer{ justify-self:end; }

  .mode-selector{
    display:flex; justify-content:center; align-self:center;
    background:rgba(28,28,30,.6); backdrop-filter:blur(40px);
    border-radius:999px; border:1px solid rgba(201,169,97,.2); overflow:hidden;
  }
  .mode-btn{
    display:flex; align-items:center; gap:.4rem;
    font-family:'Space Grotesk',sans-serif; font-size:.66rem; font-weight:600;
    letter-spacing:.04em; text-transform:uppercase;
    padding:.5rem 1.05rem; border-right:1px solid rgba(84,84,88,.2);
    color:#636366; transition:background .2s ease, color .2s ease;
  }
  .mode-btn:last-child{ border-right:none; }
  .mode-btn:hover{ color:#9ca3af; background:rgba(201,169,97,.1); }
  .mode-btn.active{ background:rgba(201,169,97,.15); color:var(--gold); }
  .mode-icon{ font-size:.82rem; line-height:1; opacity:.55; }
  .mode-btn.active .mode-icon{ opacity:.9; }
  .mode-badge{ font-size:.58rem; font-weight:600; color:rgba(255,255,255,.28); font-variant-numeric:tabular-nums; }
  .mode-btn.active .mode-badge{ color:rgba(201,169,97,.6); }
  @media(max-width:760px){
    .mode-btn .mode-label{ display:none; }
    .mode-btn{ padding:.5rem .6rem .5rem .5rem; }
  }

  /* ── SET TABS — the quiz page's verb strip, same construction.
     These replace the grid of cards that used to sit inside the card: the
     sets are navigation, so they belong in the header with the other
     navigation, and the card is left for the thing being played. */
  .verb-tabs{
    display:flex; align-items:center; justify-content:center;
    gap:.28rem; overflow-x:auto; padding:0 .5rem; scrollbar-width:none;
  }
  .verb-tabs::-webkit-scrollbar{ display:none; }
  .vtab{
    font-family:'Space Grotesk',sans-serif; font-size:.56rem; font-weight:700;
    letter-spacing:.08em; text-transform:uppercase;
    padding:.28rem .72rem; border-radius:999px; border:1px solid transparent;
    color:rgba(255,255,255,.3); transition:all .2s; white-space:nowrap; flex-shrink:0;
  }
  .vtab:hover{ color:rgba(255,255,255,.7); border-color:rgba(255,255,255,.15); }
  .vtab.active{
    color:var(--vc, var(--gold)); border-color:var(--vc, var(--gold));
    background:rgba(255,255,255,.06);
  }
  .vtab::after{
    content:''; display:inline-block; width:5px; height:5px; border-radius:50%;
    margin-left:.4rem; vertical-align:middle; opacity:0; transition:opacity .3s;
  }
  .vtab.score-perfect::after{ background:var(--clear); opacity:1; box-shadow:0 0 6px rgba(94,211,155,.6); }
  .vtab.score-great::after  { background:#7dd3fc; opacity:1; }
  .vtab.score-ok::after     { background:#fb923c; opacity:1; }
  .vtab.score-poor::after   { background:var(--wrong); opacity:1; }
  /* Practice sets draw from everything, so they read as a different kind of
     thing: no set colour, a quieter face, and a rule before them. */
  .vtab.practice{ font-family:'DM Mono',monospace; font-weight:400; letter-spacing:.1em; }
  .vtab.practice.active{ color:var(--mode-accent); border-color:var(--mode-accent); }
  .tabdiv{ width:1px; height:14px; background:rgba(255,255,255,.14); margin:0 .35rem; flex-shrink:0; }

  /* ── STAGE + CARD — same frame the quiz uses ── */
  .stage{
    position:fixed; top:var(--header-h); left:0; right:0; bottom:var(--bar-h);
    display:flex; flex-direction:column; align-items:center; justify-content:center; padding:.5rem;
  }
  .slide-card{
    position:relative; width:100%; max-width:min(94vw,1200px); flex:1;
    background:linear-gradient(145deg, rgba(28,28,30,.97), rgba(18,18,20,.99));
    border-radius:1.25rem; border:1px solid rgba(201,169,97,.22); overflow:hidden;
    box-shadow:0 24px 70px rgba(0,0,0,.8), 0 0 80px rgba(201,169,97,.07);
    display:flex; flex-direction:column; min-height:0;
  }
  .slide-card::before{
    content:''; position:absolute; top:0; left:0; right:0; height:3px;
    background:var(--screen-accent, var(--gold)); opacity:.7; transition:background .4s; z-index:6;
  }

  /* ── BOTTOM BAR ── */
  .bottom-bar{
    position:fixed; bottom:0; left:0; right:0; height:var(--bar-h); padding:.3rem 1rem;
    display:flex; align-items:center; justify-content:space-between; gap:1rem;
    background:rgba(13,13,13,.88); backdrop-filter:blur(20px);
    border-top:1px solid rgba(255,255,255,.06);
  }
  .barleft, .barright{ display:flex; align-items:center; gap:.85rem; font-size:.7rem; font-weight:700; color:rgba(229,229,231,.35); }
  .score-item{ display:flex; align-items:center; gap:.35rem; }
  .score-dot{ width:7px; height:7px; border-radius:50%; }
  .score-dot.ok{ background:var(--clear); } .score-dot.bad{ background:var(--wrong); }
  .score-num{ font-variant-numeric:tabular-nums; }
  .barstage{ font-family:'Space Grotesk',sans-serif; font-size:.55rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.3); }
  .barstage b{ color:var(--gold); font-weight:700; }

  /* ── LOADING ── */
  .loading-screen{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#0d0d0d; z-index:999; transition:opacity .6s; }
  .loading-screen.fade{ opacity:0; pointer-events:none; }
  .ld{ width:7px; height:7px; border-radius:50%; background:var(--gold); animation:ld 1.2s ease-in-out infinite; }
  @keyframes ld{ 0%,100%{opacity:.2; transform:scale(.7)} 50%{opacity:1; transform:scale(1.3)} }
  .loaderr{ font-size:.8rem; color:var(--wrong); max-width:30rem; text-align:center; line-height:1.6; }

  /* ══════════════════════════ GAME INTERIOR ══════════════════════════
     Everything below is the game's own. The menu is deliberately NOT a tab
     strip: the verb grid with its mastery states is the map, and it says
     more than tabs can. */
  /* The ladder is not part of any screen — it sits above them all, so the
     five marks are on view in the menu, mid-round and on the summary. */
  .screens{ position:relative; flex:1; min-height:0; }
  .screen{ position:absolute; inset:0; display:none; flex-direction:column; min-height:0; }
  .screen.active{ display:flex; }

  /* ---------- MENU ---------- */
  #menu{ overflow-y:auto; padding:.5rem 1.4rem 1.8rem; position:relative; }

  /* Phrases drifting behind the ladder and tabs — quiet motion so the menu
     doesn't sit dead while a learner decides what to play. Purely
     decorative: z-index behind everything that's actually clickable. */

  #menu > *:not(.menu-bg){ position:relative; z-index:1; }

  /* Small enough to live above the field for a whole round. */
  .stagebar{
    display:flex; align-items:flex-start; justify-content:center;
    gap:clamp(.3rem,1.6vw,.85rem); padding:.5rem 0 .45rem; flex-shrink:0;
    border-bottom:1px solid rgba(255,255,255,.05);
  }
  .stagenode{ display:flex; flex-direction:column; align-items:center; gap:.2rem; width:46px; }
  .stagenode .dot{ position:relative; width:22px; height:22px; }

  /* A green ring fills round the stage you're on as sets are cleared, so the
     ladder shows not just where you are but how far through you've got. */
  .stagenode.current .dot::before{
    content:''; position:absolute; inset:-5px; border-radius:50%;
    background:conic-gradient(var(--clear) calc(var(--p,0) * 1%), rgba(255,255,255,.09) 0);
    -webkit-mask:radial-gradient(circle, transparent 57%, #000 60%);
            mask:radial-gradient(circle, transparent 57%, #000 60%);
    transition:background .5s;
  }
  /* Every catch inflates the mark you're on and throws a ring of light. */
  .stagenode.pop svg{ animation:stagePop .5s cubic-bezier(.3,1.6,.5,1); }
  @keyframes stagePop{ 0%{transform:scale(1)} 35%{transform:scale(1.7)} 100%{transform:scale(1)} }
  .stagenode.pop .dot::after{
    content:''; position:absolute; inset:-6px; border-radius:50%;
    border:2px solid var(--clear); animation:stageRay .55s ease-out forwards;
  }
  @keyframes stageRay{ from{opacity:.9; transform:scale(.6)} to{opacity:0; transform:scale(2.3)} }
  /* Unreached stages keep their shape and are merely unlit — five milestones
     on a road, not four missing ones. */
  .stagenode:not(.done):not(.current) svg{ opacity:.45; }
  .stagenode svg{ width:100%; height:100%; }
  .stagenode .lbl{ font-family:'DM Mono',monospace; font-size:.45rem; letter-spacing:.08em; text-transform:uppercase; color:var(--paper-faint); }
  .stagenode.done .lbl{ color:var(--paper-dim); }
  .stagenode.current .lbl{ color:var(--mode-accent); font-weight:500; }
  .stagelink{ width:clamp(8px,2.4vw,20px); height:1px; background:var(--line); margin-top:11px; flex-shrink:0; }
  .stagelink.done{ background:var(--gold); }

  .stagecaption{ text-align:center; font-family:'DM Mono',monospace; font-size:.66rem; color:var(--paper-dim); margin-bottom:1.1rem; }
  .stagecaption b{ color:var(--mode-accent); }

  .sectiontitle{
    font-family:'DM Mono',monospace; font-size:.58rem; letter-spacing:.2em; text-transform:uppercase;
    color:rgba(229,229,231,.4); margin:.7rem 0 .55rem;
  }
  .mixgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); gap:.6rem; }
  .mixcard{
    cursor:pointer; text-align:left; border:1px solid var(--line); border-radius:10px; padding:.7rem .8rem .6rem;
    background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0));
    display:flex; flex-direction:column; gap:.3rem; min-height:80px; transition:transform .12s, border-color .12s;
  }
  .mixcard:hover{ transform:translateY(-2px); border-color:rgba(255,217,74,.35); }
  .mixcard .num{ font-family:'DM Mono',monospace; font-size:.58rem; color:var(--paper-faint); letter-spacing:.1em; }
  .mixcard .name{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:.85rem; }
  .mixcard .stars{ font-size:.75rem; letter-spacing:.12em; color:var(--mode-accent); min-height:1em; }
  .mixcard .pct{ font-family:'DM Mono',monospace; font-size:.58rem; color:var(--paper-dim); }

  .trialcard{
    margin-top:.4rem; border:1px solid rgba(255,217,74,.35); border-radius:12px; padding:1rem 1.1rem;
    background:radial-gradient(ellipse at 30% 0%, rgba(255,217,74,.08), transparent 70%);
    display:flex; align-items:center; gap:.9rem; cursor:pointer; transition:transform .12s;
  }
  .trialcard:hover{ transform:translateY(-2px); }
  .trialcard.locked{ opacity:.4; cursor:default; pointer-events:none; }
  .trialcard .icon{ width:34px; height:34px; flex-shrink:0; }
  .trialcard .tt{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:.95rem; color:var(--mode-accent); }
  .trialcard .td{ font-size:.72rem; color:var(--paper-dim); margin-top:.1rem; }

  /* ---------- PLAY ---------- */
  .hud{ display:flex; align-items:center; gap:1rem; padding:.7rem 1rem .4rem; font-family:'DM Mono',monospace; font-size:.68rem; flex-shrink:0; }
  .hud .spacer{ flex:1; }
  .hit{ color:var(--clear); } .miss{ color:var(--wrong); } .streak{ color:var(--gold); }
  .streak.hot{ color:var(--mode-accent); }
  /* The clock gains weight as it empties: steady, then amber in the last
     thirty, then red and beating once a second under fifteen. */
  .clock{
    font-family:'Space Grotesk',sans-serif; font-weight:700;
    font-size:1.05rem; padding:.1rem .55rem .15rem; border-radius:7px;
    background:rgba(255,255,255,.05); font-variant-numeric:tabular-nums;
    transition:color .3s, background .3s, font-size .3s;
  }
  .clock.warn{ color:#f0a23c; background:rgba(240,162,60,.12); }
  .clock.low{
    color:var(--wrong); background:rgba(232,106,92,.16); font-size:1.2rem;
    animation:clockBeat 1s ease-in-out infinite;
  }
  @keyframes clockBeat{ 0%,100%{transform:scale(1)} 12%{transform:scale(1.14)} 26%{transform:scale(1)} }
  .backbtn{ font-family:'DM Mono',monospace; font-size:.62rem; color:var(--paper-faint); letter-spacing:.05em; }
  .backbtn:hover{ color:var(--paper); }

  /* ── ROUND BAR ──
     Answers the question the round could not: am I winning? The fill is
     accuracy, the notch is the line you must cross to clear the set, and the
     colour says which side of it you are on. */
  .roundbar{
    position:relative; height:5px; margin:.1rem 1rem .2rem; border-radius:99px;
    background:rgba(255,255,255,.07); flex-shrink:0;
  }
  .roundfill{
    height:100%; width:0; border-radius:99px; background:var(--wrong);
    transition:width .35s cubic-bezier(.22,1,.36,1), background .35s, box-shadow .35s;
  }
  .roundfill.clearing{ background:var(--clear); box-shadow:0 0 12px rgba(94,211,155,.65); }
  .roundnotch{ position:absolute; top:-4px; width:2px; height:13px; border-radius:2px; background:rgba(255,255,255,.5); }
  .roundnotch::after{
    content:'CLEAR'; position:absolute; left:50%; top:-12px; transform:translateX(-50%);
    font-family:'DM Mono',monospace; font-size:.44rem; letter-spacing:.14em; color:rgba(255,255,255,.4);
  }

  /* ── PLAY BAR ──
     The definition lives along the bottom of the card, centred, with the
     numbers pushed to the flanks. Ambient by position: quiet without being
     lost, and the whole field above it belongs to the words. */
  .playbar{
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:1rem;
    padding:.6rem 1rem .7rem; border-top:1px solid rgba(255,217,74,.16);
    background:rgba(255,217,74,.04); flex-shrink:0; min-height:56px;
  }
  .pb-left, .pb-right{ display:flex; align-items:center; gap:.9rem; font-family:'DM Mono',monospace; font-size:.66rem; }
  .pb-right{ justify-content:flex-end; }
  .pb-def{ text-align:center; min-width:0; }
  .pb-deflabel{
  font-family:'Space Grotesk',sans-serif; font-size:.72rem; font-weight:800;
  letter-spacing:.04em; text-transform:none; color:var(--mode-accent); margin-bottom:.25rem;
}
  .pb-deftext{
    font-family:'DM Sans',sans-serif; font-weight:500; font-size:clamp(.85rem,2.1vw,1.05rem);
    line-height:1.3; color:var(--paper);
  }

  /* ── START CARD ──
     Shown once, ever. It explains the game and points at the strip where the
     definition will live, so when it goes the eye already knows where to
     look. The clock does not start until the button is pressed. */
  #startcard{
    position:absolute; inset:0; z-index:14; display:none; align-items:center; justify-content:center;
    background:rgba(8,8,9,.82); backdrop-filter:blur(3px);
  }
  #startcard.show{ display:flex; animation:scIn .32s ease both; }
  @keyframes scIn{ from{ opacity:0 } to{ opacity:1 } }

  /* Chalk on slate. Handwriting says "someone wrote this for you" in a way
     no UI label can, and the soft white glow is what chalk dust does under
     a light — it reads as written, not printed. */
  .sc-note{
    position:relative; max-width:min(90%,500px); text-align:center;
    background:linear-gradient(160deg,#1e2422,#141917);
    border:1px solid rgba(255,255,255,.16); border-radius:12px;
    padding:1.5rem 1.7rem 1.6rem; box-shadow:0 22px 60px rgba(0,0,0,.75), inset 0 0 60px rgba(255,255,255,.02);
    animation:chalkIn .45s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes chalkIn{ from{ transform:translateY(10px) rotate(-.6deg); opacity:0 } to{ transform:none; opacity:1 } }
  .sc-note p{
    font-family:'Caveat',cursive; font-size:clamp(1.6rem,4.2vw,2.15rem); line-height:1.3;
    color:#f4f2ec; text-shadow:0 0 12px rgba(255,255,255,.28), 0 1px 0 rgba(0,0,0,.4);
  }
  .sc-note p b{
    color:var(--mode-accent); font-weight:700;
    text-shadow:0 0 16px rgba(255,217,74,.55);
  }
  .sc-go{
    margin-top:1.1rem; font-family:'Caveat',cursive; font-size:clamp(1.4rem,3.4vw,1.75rem);
    padding:.3rem 2rem .4rem; border-radius:999px;
    border:2px solid var(--mode-accent); color:var(--mode-accent);
    text-shadow:0 0 14px rgba(255,217,74,.45);
    animation:chalkPulse 1.9s ease-in-out infinite;
    transition:background .15s, color .15s;
  }
  .sc-go:hover{ background:var(--mode-accent); color:#12100a; text-shadow:none; animation:none; }
  @keyframes chalkPulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(255,217,74,0) }
    50%    { box-shadow:0 0 0 7px rgba(255,217,74,.10) }
  }
  /* the arrow reaches down out of the note towards the definition strip */
  .sc-arrow{ position:absolute; left:50%; top:100%; width:64px; height:70px; transform:translateX(-50%); pointer-events:none; }
  .sc-arrow path{
    fill:none; stroke:var(--mode-accent); stroke-width:2.4; stroke-linecap:round;
    filter:drop-shadow(0 0 6px rgba(255,217,74,.5));
    stroke-dasharray:120; stroke-dashoffset:120; animation:drawArrow .7s ease .25s forwards;
  }
  @keyframes drawArrow{ to{ stroke-dashoffset:0 } }

  /* ── MENU NUDGE ──
     Same hand as the round card, quieter. Pinned in the empty top-right
     corner because the tabs are two centimetres away: the arrow is a flick
     rather than a journey, and it sits clear of the stage ladder. Shown
     only until the first round is ever played. */
  /* ── MENU BADGE ──
     Centred rather than pinned to a corner: at 400px there is no corner to
     pin to, and this is the reading line the eye lands on after the ladder.
     Shown until a set is chosen, every visit — it costs a returning learner
     nothing, since it goes the moment they do the thing it asks. */
  /* ── PINNED NOTE ──
     Cream paper, one red pin, handwriting. Nothing else in the app looks
     remotely like this, which is the whole point: the eye reads it as a
     person leaving a message rather than as another piece of interface.
     It hangs from the single pin, so it swings about that point — slow
     enough to read as weight rather than as animation. */
  .note{
    position:relative; align-self:center; margin:1rem auto 1.4rem;
    width:min(76%,360px); padding:2rem 1.6rem 1.7rem;
    background:linear-gradient(178deg,#fbf7ec 0%,#f4efe0 100%);
    border-radius:3px; pointer-events:none;
    box-shadow:0 14px 34px rgba(0,0,0,.55), 0 2px 0 rgba(0,0,0,.25);
    transform-origin:50% 8px;                 /* the pin, not the middle */
    animation:noteDrop .55s cubic-bezier(.3,1.2,.5,1) both,
              noteSwing 4.6s ease-in-out 1s infinite;
  }
  .note[hidden]{ display:none; }
  /* torn-looking bottom edge, very slight */
  .note::after{
    content:''; position:absolute; left:0; right:0; bottom:-3px; height:4px;
    background:linear-gradient(90deg,#f4efe0 60%,transparent 60%) repeat-x;
    background-size:9px 4px; opacity:.75;
  }
  .note-pin{
    position:absolute; top:-7px; left:50%; transform:translateX(-50%);

  /* re-open the note from the HUD */
  .helpbtn{ font-family:'DM Mono',monospace; font-size:.66rem; color:var(--paper-faint); }
  .helpbtn:hover{ color:var(--mode-accent); }

  /* sound toggle, same family as the help button beside it */
  .soundbtn{
    font-family:'DM Mono',monospace; font-size:.66rem; color:var(--paper-faint);
    display:flex; align-items:center; gap:.3rem;
  }
  .soundbtn:hover{ color:var(--mode-accent); }
  .soundbtn .sw{
    width:9px; height:9px; border-radius:50%; border:1px solid rgba(255,255,255,.3);
    transition:background .15s, border-color .15s;
  }
  .soundbtn.on .sw{ background:var(--mode-accent); border-color:var(--mode-accent); box-shadow:0 0 5px rgba(255,217,74,.7); }

  .field{ position:relative; flex:1; min-height:0; margin:.6rem .6rem 1rem; overflow:hidden; }
  /* A softer vignette: pale cards no longer need to be rescued from the
     background, and a heavy one only dims the words at the edges. */
  .field::before{
    content:''; position:absolute; inset:0; pointer-events:none; z-index:5;
    background:radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(13,13,15,.75) 100%);
  }
  /* ── FRENZY ──
     The last fifteen seconds of a round get their own visible state: a
     pulsing red edge round the whole field, timed to match the clock's own
     beat, so the pressure the numbers describe is also something the eye
     can see without reading a number at all. */
  .field.frenzy::after{
    content:''; position:absolute; inset:0; pointer-events:none; z-index:1;
    box-shadow:inset 0 0 0 2px rgba(232,106,92,.5), inset 0 0 44px rgba(232,106,92,.14);
    animation:frenzyPulse 1s ease-in-out infinite;
  }
  @keyframes frenzyPulse{ 0%,100%{ opacity:.45; } 50%{ opacity:1; } }
  /* ── BURROWS ──
     A field of holes, and a phrase rises out of one, waits, and drops back.
     Nothing travels, so nothing can collide, and a word is fully readable
     for the whole time it is up — the reader's job is to spot it, which is
     a truer version of the scanning the falling-words game asked for.

     Being still also means a word can be large. */
  .word{
    position:absolute; left:0; top:0; cursor:pointer; white-space:nowrap;
    will-change:transform,clip-path,opacity;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:.18rem; padding:.4rem .9rem .45rem; border-radius:.4rem;
    background:linear-gradient(178deg, var(--card) 0%, #c4bda6 100%);
    border:1px solid var(--card-edge);
    box-shadow:0 .28rem .55rem rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.55);
  }
  /* the verb in ink, the particle on its egg — the same two-part object the
     whole app uses for a phrasal verb */
    .word .pv{
    font-family:'Space Grotesk',sans-serif; font-weight:900; color:var(--ink);
    font-size:clamp(.95rem,2.6vw,1.45rem); line-height:1; letter-spacing:.01em;
    text-shadow: 0.015em 0 0 currentColor, -0.015em 0 0 currentColor;
  }
  .word .egg{
    border-radius:999px; padding:.16rem .7rem .2rem;
    background:var(--egg-free); color:var(--egg-word);
    font-family:'Space Grotesk',sans-serif; font-weight:900;
    font-size:clamp(.78rem,2.1vw,1.05rem); line-height:1;
    box-shadow:0 1px 3px rgba(0,0,0,.3);
  }
  /* caught: the egg turns before the card goes */
  .word.caught .egg{ background:var(--egg-right); color:#000; }
  .word.caught{ border-color:var(--egg-right); }

  /* The lip of the burrow: drawn over the card, so the phrase appears to
     come up out of the ground rather than to slide over it. */
  /* The lip has to read against pale card now, not dark plate: a firmer
     line, with the ground shadow deeper beneath it. */
  .burrow{
    position:absolute; left:0; top:0; z-index:6; pointer-events:none;
    height:2px; border-radius:1px; transform:translate(-50%,-50%);
    background:linear-gradient(90deg, transparent, rgba(201,169,97,.65) 22%,
               rgba(201,169,97,.65) 78%, transparent);
    box-shadow:0 1px 4px rgba(0,0,0,.5);
  }
  .burrow::after{
    content:''; position:absolute; left:18%; right:18%; top:2px; height:6px;
    background:linear-gradient(to bottom, rgba(0,0,0,.5), transparent);
    border-radius:0 0 50% 50%;
  }

  .word.wrong .egg{ background:var(--egg-lost); color:#000; }
  .word.wrong{ border-color:var(--egg-lost); }

  /* ── THE GOLDEN WORD ──
     Rare, unrelated to the definition on screen, and worth chasing for its
     own sake — the one catch in a round that isn't graded. It never touches
     accuracy or the scale score, so a miss costs nothing and a catch is
     pure flair: sound, a bigger burst, a banner of its own. */
  .word.golden{
    background:linear-gradient(178deg, #FFE9A8 0%, #F5C542 100%);
    border-color:#e0aa1f; box-shadow:0 0 0 2px rgba(255,217,74,.4), 0 .3rem .8rem rgba(255,217,74,.4);
    animation:goldenGlow 1s ease-in-out infinite;
  }
  @keyframes goldenGlow{ 0%,100%{ filter:brightness(1); } 50%{ filter:brightness(1.2); } }

  .word.golden .pv{ color:#3a2a00; }
  .spark{ position:absolute; width:5px; height:5px; border-radius:50%; pointer-events:none; z-index:8; }

    width:70px; height:70px; border-radius:50%; z-index:9;
    background:radial-gradient(circle, #fff 0%, #FFD94A 35%, rgba(255,217,74,0) 70%);

 @keyframes defPulse{
  0%   { opacity:0; transform:translateY(3px); }
  100% { opacity:1; transform:translateY(0); }
}
.pb-deftext.pulse{ animation:defPulse .3s ease both; }
  .fw-ring{

  /* The toast used to sit at the foot of the field, directly over the

  .toast{

<script>
/* ======================================================================
   INCOMING — words rise out of the dark and grow as they close in.

   Reads the SAME phrasal-verbs-data.json the quiz page uses. There is no
   embedded copy: a correction to the data lands here automatically, and the
   two pages can never drift apart. Groups in that file — including the MIX
   sets — are the practice unit, so the game's map matches the quiz's tabs.
====================================================================== */

const DATA_URL = '../../data/grammar-rules/phrasal-verbs-data.json';

/* ---------- tuning ---------- */
const EXPOSURE_CAP    = 3;    // times a phrase can be the target before resting
const REST_SPAWNS     = 20;   // spawns before a rested phrase returns
const ROUND_SECONDS   = 120;
const CLEAR_THRESHOLD = 0.60;
const TRIAL_THRESHOLD = 0.80;   // grade A on the scale — what the Crown costs

/* ── THE CAMBRIDGE SCALE ──
   A percentage tells a learner how much they got wrong. A scale score tells
   them where they stand, and the difference matters most to the ones doing
   badly: 47% reads as failure, 156 reads as four points short of a pass.
   Every round is reported this way, per set, so a weak set is a number to
   move rather than a verdict to accept.

   Anchored to B2 First: 160 is the pass (grade C), 173 grade B, 180 grade A.
   Below 160 is not a fail, it is the band beneath — worth another go. */
const SCALE = [ [0,140], [0.60,160], [0.72,173], [0.80,180], [1,190] ];

function scaleScore(accuracy){
  const a = Math.max(0, Math.min(1, accuracy));
  for (let i = 1; i < SCALE.length; i++){
    const [a0,s0] = SCALE[i-1], [a1,s1] = SCALE[i];
    if (a <= a1) return Math.round(s0 + (a - a0) / (a1 - a0) * (s1 - s0));
  }
  return 190;
}

/* The grade bands as Cambridge reports them. `D` is our own label for the
   band below the pass: the exam calls it Level B1, which is no use to a
   fifteen-year-old playing a phrasal verb game. */
function gradeOf(score){
  if (score >= 180) return { letter:'A', word:'Excellent',  cls:'g-a' };
  if (score >= 173) return { letter:'B', word:'Very good',  cls:'g-b' };
  if (score >= 160) return { letter:'C', word:'Pass',       cls:'g-c' };
  return               { letter:'D', word:'Try again', cls:'g-d' };
}
const N_PRACTICE      = 4;

/* ── THE FIVE MARKS, PER ROUND ──
   These used to measure the whole account: clear two sets and you were Ember
   for good. That is a record, not a game — nothing happened while you played,
   and a mark you earned last week cannot make this round exciting.

   Now every round climbs the ladder from cold. The thresholds are catches,
   not accuracy, so the way to rise is to keep finding phrases: a child who
   is behind can still burn upward in the last thirty seconds, which is the
   whole point of having a ladder at all.

   The long journey has not gone — it lives in the set scores on the tabs and
   in the Crown, which still costs every set and a grade A trial. */
const ROUND_TIERS = [3, 7, 12, 18, 25];

const STAGES = [
  { key:'spark', label:'Spark', color:'var(--s0)', glow:'var(--s0-glow)', desc:'You can spot a phrasal verb when you see one. First sets cleared.' },
  { key:'ember', label:'Ember', color:'var(--s1)', glow:'var(--s1-glow)', desc:'The patterns are starting to stick. Keep clearing sets.' },
  { key:'flame', label:'Flame', color:'var(--s2)', glow:'var(--s2-glow)', desc:'Recall is getting fast. Halfway through the full course.' },
  { key:'blaze', label:'Blaze', color:'var(--s3)', glow:'var(--s3-glow)', desc:'Nearly every set is in play. One push to the trial.' },
  { key:'crown', label:'Crown', color:'var(--s4)', glow:'var(--s4-glow)', desc:'Every set cleared and the Final Trial passed. Full mastery.' },
];

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const rand = (a,b) => a + Math.random()*(b-a);
const randInt = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = a => a[(Math.random()*a.length)|0];
const shuffle = a => { const b=[...a]; for(let i=b.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[b[i],b[j]]=[b[j],b[i]];} return b; };

/* ---------- sound engine ----------
   Synthesised with Web Audio, so there are no sound files to ship and no
   load to wait on. Every catch, miss, wrong tap and stage-up gets its own
   short chime; the golden word gets a little fanfare of its own. */
let actx = null, soundOn = true;
function ensureAudio(){
  if (!soundOn) return;
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
}
function tone(freq, dur, {type='sine', vol=0.18, delay=0, slideTo=null} = {}){
  if (!soundOn || !actx) return;
  const t0 = actx.currentTime + delay;
  const osc = actx.createOscillator(), gain = actx.createGain();
  osc.type = type; osc.frequency.setValueAtTime(freq, t0);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(vol, t0 + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(gain).connect(actx.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.02);
}
const playCatch  = () => { tone(560,.09,{type:'triangle',vol:.16}); tone(840,.14,{type:'triangle',vol:.14,delay:.05}); };
const playMiss   = () => tone(180,.22,{type:'sawtooth',vol:.12,slideTo:90});
const playWrong  = () => { tone(220,.12,{type:'square',vol:.09}); tone(160,.16,{type:'square',vol:.08,delay:.05}); };
const playGolden = () => [660,880,1100,1320].forEach((f,i)=>tone(f,.16,{type:'triangle',vol:.15,delay:i*.06}));
const playTier   = () => [440,660,880].forEach((f,i)=>tone(f,.22,{type:'sine',vol:.16,delay:i*.08}));
const playTick   = () => tone(1000,.05,{type:'square',vol:.06});
const playFrenzyIn = () => tone(300,.5,{type:'sawtooth',vol:.09,slideTo:900});

function setSound(on){
  soundOn = on;
  const b = $('soundBtn');
  if (b){ b.classList.toggle('on', on); b.lastChild.textContent = on ? 'sound' : 'muted'; }
  if (on) ensureAudio();
}

/* ---------- menu drift ----------
   A handful of phrases drift slowly behind the ladder — filled once the
   data loads, since the pool doesn't exist before then. */

/* ---------- state filled on load ---------- */
let GROUPS = [], FULL_POOL = [], PRACTICE_SETS = [], THRESH = [], N_GROUPS = 0;

/* ======================================================================
   LOAD
====================================================================== */
async function boot(){
  let data;
  try {
    const res = await fetch(DATA_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    data = await res.json();
  } catch (e) {
    /* Opened from the file system, fetch is blocked by the browser. Say so
       plainly rather than showing a dead spinner. */
    $('loadingScreen').innerHTML =
      `<p class="loaderr">Couldn't load <b>${DATA_URL}</b>.<br>` +
      `Open this page from the site rather than as a local file — browsers block file:// data requests.</p>`;
    console.error(e);
    return;
  }

  /* `groups` is the exercise-group list. The reference list of which
     particles each verb takes is `data.verbs` — a different thing that
     used to share this name. */
  GROUPS = data.groups.map(g => ({
    id: g.id, label: g.label, color: g.color, mixed: !!g.mixed,
    items: g.items.map(it => {
      /* Items in a MIX group carry their own `verb`; `form` is the inflected
         verb the example sentence needs. The phrase label always uses the
         citation form, the sentence always uses the inflected one. */
      const base = it.verb || g.id;
      const infl = it.form || base;
      return {
        v: base.toUpperCase(),
        pt: it.particle.toLowerCase(),
        p: (base + ' ' + it.particle).toUpperCase(),
        m: it.meaning,
        s: it.example.replace(/_+/, (infl + ' ' + it.particle).toLowerCase()),
        group: g.id, color: g.color
      };
    })
  }));

  GROUPS.forEach(g => g.items.forEach(it => FULL_POOL.push(it)));
  N_GROUPS = GROUPS.length;

  /* Revision draws from every set, in proportion to its size.

     It used to interleave by row — item 0 of each group, then item 1, and so
     on — which looks even but is not: RUN runs out at ten items, PUT at
     thirteen, while the MIX sets carry twenty-five. Once the short groups
     were exhausted the later rows came only from the long ones, so Practice 4
     ended up almost entirely MIX and COME, with no LOOK, PUT or RUN at all.

     Instead each group is cut into N_PRACTICE slices and Practice n takes
     slice n from every group. Still deterministic, so "Practice 3" is always
     the same phrases — but now every revision set touches every verb. */
  for (let k = 0; k < N_PRACTICE; k++) PRACTICE_SETS.push([]);
  GROUPS.forEach(g => {
    const n = g.items.length;
    for (let k = 0; k < N_PRACTICE; k++) {
      const lo = Math.floor(n * k / N_PRACTICE), hi = Math.floor(n * (k + 1) / N_PRACTICE);
      for (let j = lo; j < hi; j++) PRACTICE_SETS[k].push(g.items[j]);
    }
  });

  const s2 = Math.max(1, Math.ceil(N_GROUPS*0.2));
  const s3 = Math.max(s2+1, Math.ceil(N_GROUPS*0.45));
  const s4 = Math.max(s3+1, Math.ceil(N_GROUPS*0.75));
  THRESH = [0, s2, s3, s4, N_GROUPS];

  $('loadingScreen').classList.add('fade');
  setTimeout(() => $('loadingScreen').style.display = 'none', 600);
  renderMenu();
}

/* ======================================================================
   PROGRESS
====================================================================== */
function makeStore(key){
  let mem = null, usable = true;
  try { localStorage.setItem('__probe__','1'); localStorage.removeItem('__probe__'); } catch(e){ usable = false; }
  return {
    read(){ if(!usable) return mem; try{ const r = localStorage.getItem(key); return r ? JSON.parse(r) : null; }catch(e){ return null; } },
    write(d){ mem = d; if(!usable) return; try{ localStorage.setItem(key, JSON.stringify(d)); }catch(e){ usable = false; } }
  };
}
const store = makeStore('incoming.progress.v3');
let progress = store.read() || { groupResults:{}, practiceResults:{}, phraseStats:{}, trialPassed:false, trialBest:0 };
progress.groupResults = progress.groupResults || {};
progress.practiceResults   = progress.practiceResults   || {};
progress.phraseStats  = progress.phraseStats  || {};
const save = () => store.write(progress);
const pstat = p => (progress.phraseStats[p] = progress.phraseStats[p] || { hits:0, misses:0 });
const clearedCount = () => Object.values(progress.groupResults).filter(r => r.cleared).length;
function currentStageIndex(){
  const c = clearedCount();
  if (c >= THRESH[4] && progress.trialPassed) return 4;
  if (c >= THRESH[3]) return 3;
  if (c >= THRESH[2]) return 2;
  if (c >= THRESH[1]) return 1;
  return 0;
}
const groupMastered = g => g.items.every(it => (progress.phraseStats[it.p]?.hits || 0) > 0);

/* ---------- icons ---------- */
const FLAME = "M12 2c.4 2.6-1 4-2.4 5.6C8.2 9.3 7 11 7 13.2A5 5 0 0 0 12 18a5 5 0 0 0 5-4.8c0-1.6-.7-2.7-1.6-3.7.2 1.4-.3 2.3-1 2.9.3-2.6-1-4-1.6-5.5C12.4 5.6 12.3 3.7 12 2z";
const CROWN = "M2 18l3-11 5 4 4-7 4 7 5-4 3 11H2z";
function svgIcon(i, col){
  const c = col || `var(--s${i})`;
  if (i === 0) return `<circle cx="12" cy="12" r="4.5" fill="${c}"/>`;
  if (i === 1) return `<circle cx="12" cy="12" r="5" fill="${c}"/><circle cx="12" cy="12" r="8" fill="none" stroke="${c}" stroke-opacity=".35"/>`;
  if (i === 4) return `<path d="${CROWN}" fill="${c}"/><circle cx="6" cy="9" r="1" fill="${c}"/><circle cx="18" cy="9" r="1" fill="${c}"/><circle cx="12" cy="6" r="1" fill="${c}"/>`;
  return `<path d="${FLAME}" fill="${c}"/>`;
}

/* ======================================================================
   MENU
====================================================================== */
/* The ladder is permanent, so it belongs to no screen: redrawn on every
   menu render and at the start of every round. */
/* While a round is live the ladder belongs to that round; on the menu it
   shows the journey through the sets, as before. */
function roundTier(hits){
  let t = -1;
  for (let i = 0; i < ROUND_TIERS.length; i++) if (hits >= ROUND_TIERS[i]) t = i;
  return t;
}

function renderRoundBar(){
  const t = round.tier;
  const next = ROUND_TIERS[t + 1];
  const from = t < 0 ? 0 : ROUND_TIERS[t];
  const pct = next ? Math.max(0, Math.min(100, Math.round((round.hits - from) / (next - from) * 100))) : 100;

  const bar = $('stagebar'); bar.innerHTML = '';
  STAGES.forEach((st, i) => {
    if (i > 0){
      const link = document.createElement('div');
      link.className = 'stagelink' + (i <= t ? ' done' : '');
      bar.appendChild(link);
    }
    const node = document.createElement('div');
    node.className = 'stagenode' + (i < t ? ' done' : '') + (i === t + 1 ? ' current' : '') + (i === t ? ' done current' : '');
    if (i === t + 1) node.style.setProperty('--p', pct);
    node.innerHTML = '<div class="dot"><svg viewBox="0 0 24 24">' +
      svgIcon(i, i <= t ? 'var(--s' + i + ')' : 'rgba(229,229,231,.30)') +
      '</svg></div><div class="lbl">' + STAGES[i].label + '</div>';
    bar.appendChild(node);
  });

  /* the bottom bar keeps the long journey, so both are visible at once */
  const cleared = clearedCount();
  $('barStage').innerHTML = '<b>' + (t >= 0 ? STAGES[t].label : '—') + '</b> · this round &nbsp;|&nbsp; ' +
    cleared + '/' + N_GROUPS + ' sets';
}

function renderStageBar(){
  if (round && round.running) return renderRoundBar();
  const idx = currentStageIndex();
  const cleared = clearedCount();
  const from = THRESH[idx], to = THRESH[Math.min(4, idx+1)];
  const pct = to > from ? Math.max(0, Math.min(100, Math.round((cleared-from)/(to-from)*100))) : 100;

  const bar = $('stagebar'); bar.innerHTML = '';
  STAGES.forEach((st,i) => {
    if (i > 0){
      const link = document.createElement('div');
      link.className = 'stagelink' + (i <= idx ? ' done' : '');
      bar.appendChild(link);
    }
    const node = document.createElement('div');
    node.className = 'stagenode' + (i < idx ? ' done' : '') + (i === idx ? ' current' : '');
    if (i === idx) node.style.setProperty('--p', pct);
    node.innerHTML = `<div class="dot"><svg viewBox="0 0 24 24">${
      svgIcon(i, i <= idx ? `var(--s${i})` : 'rgba(229,229,231,.35)')}</svg></div><div class="lbl">${st.label}</div>`;
    bar.appendChild(node);
  });
  $('barStage').innerHTML = `<b>${STAGES[idx].label}</b> · ${cleared}/${N_GROUPS}`;
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
}

function renderMenu(){
  showScreen('menu');
  document.documentElement.style.setProperty('--screen-accent', 'var(--gold)');
  const stageIdx = currentStageIndex();
  const cleared = clearedCount();

  /* Say what to do and what it takes. "Clear a set" means nothing to a
     fifteen-year-old until you tell them the number. */
  const pct = 160;   // the pass on the scale, not a percentage
  const cap = $('stagecaption');
  if (stageIdx < 4) {
    const remain = Math.max(0, THRESH[stageIdx+1] - cleared);
    const sets = `<b>${remain}</b> more set${remain===1?'':'s'}`;
    cap.innerHTML = stageIdx === 3
      ? (cleared >= N_GROUPS
          ? `Every set done — the <b>Final Trial</b> is open below.`
          : `Score <b>${pct}</b> or better in ${sets} to open the Final Trial.`)
      : `Score <b>${pct}</b> or better in ${sets} to light up <b>${STAGES[stageIdx+1].label}</b>.`;
  } else {
    cap.innerHTML = `<b>Crown</b> — every set done and the trial passed.`;
  }
  renderStageBar();
  $('barHit').textContent = 0; $('barMiss').textContent = 0;

  /* Visible until a set is chosen in this visit. */
  $('menuNudge').hidden = !!lastSetKey;

  buildTabs();

  const all = cleared >= N_GROUPS;
  const tc = $('trialcard');
  tc.classList.toggle('locked', !all);
  $('trialIconPath').setAttribute('fill', all ? (progress.trialPassed ? 'var(--s4)' : 'var(--gold)') : '#5a5a52');
  const left = Math.max(0, N_GROUPS - cleared);
  $('trialTitle').textContent = progress.trialPassed
    ? 'You have the Crown'
    : (all ? 'The Crown is open — take it' : `${left} set${left===1?'':'s'} to go, then the Crown`);
  $('trialDesc').textContent = progress.trialPassed
    ? `Your best is ${scaleScore(progress.trialBest)}. Go again any time.`
    : (all ? `Your worst phrases from every set, all at once. Score 180 — grade A — and it's yours.`
           : `Win ${left} more set${left===1?'':'s'} and the last one opens up.`);
  tc.onclick = all ? startTrial : null;
}

/* ---------- set tabs ----------
   The dot carries what the cards used to spell out: every phrase met at
   least once shows green, otherwise the best accuracy so far. */
let activeGroupId = null;

/* The dot on a tab is the grade, so the whole course reads at a glance in
   the same currency as the exam. A set never attempted has no dot; a set
   below the pass gets one too, because "attempted and 154" is information a
   learner can act on, and an absent mark is not. */
const bestScoreOf = res => res ? (res.bestScore || scaleScore(res.bestAccuracy || 0)) : null;

function bandClass(score){
  if (score === null) return '';
  if (score >= 180) return ' score-perfect';
  if (score >= 173) return ' score-great';
  if (score >= 160) return ' score-ok';
  return ' score-poor';
}
const tabStateClass    = g => bandClass(bestScoreOf(progress.groupResults[g.id]));
const practiceStateClass = i => bandClass(bestScoreOf(progress.practiceResults[i]));

/* One row: the taught sets, a hairline, then the mixed practice sets. The
   whole course is visible at a glance without opening anything. */
function buildTabs(){
  const wrap = $('verbTabs');
  wrap.innerHTML = '';

  GROUPS.forEach(g => {
    const btn = document.createElement('button');
    btn.className = 'vtab' + tabStateClass(g) + (g.id === activeGroupId ? ' active' : '');
    btn.textContent = g.label;
    btn.style.setProperty('--vc', g.color);
    const sc = bestScoreOf(progress.groupResults[g.id]);
    btn.title = sc
      ? `Best ${sc} — grade ${gradeOf(sc).letter} · ${g.items.length} phrases`
      : `${g.items.length} phrase${g.items.length===1?'':'s'} — not yet played`;
    btn.onclick = () => { stopRound(); startGroup(g.id); };
    wrap.appendChild(btn);
  });

  const div = document.createElement('span');
  div.className = 'tabdiv';
  wrap.appendChild(div);

  PRACTICE_SETS.forEach((set, i) => {
    const btn = document.createElement('button');
    btn.className = 'vtab practice' + practiceStateClass(i) + (activeGroupId === 'p'+i ? ' active' : '');
    btn.textContent = 'PRACTICE ' + (i+1);
    const sc = bestScoreOf(progress.practiceResults[i]);
    btn.title = sc
      ? `Best ${sc} — grade ${gradeOf(sc).letter} · ${set.length} phrases from every set`
      : `${set.length} phrases, drawn from every set`;
    btn.onclick = () => { stopRound(); startPractice(i); };
    wrap.appendChild(btn);
  });

  const on = wrap.querySelector('.vtab.active');
  if (on) on.scrollIntoView({ inline:'center', block:'nearest' });
}

/* ======================================================================
   ROUND
====================================================================== */
let round = null;
let lastSetKey = null;   // reset on every page load, so the note returns

function startGroup(id){
  const g = GROUPS.find(x => x.id === id);
  activeGroupId = id;
  buildTabs();
  beginRound({ mode:'group', index:id, pool:g.items, label:g.label, accent:g.color });
}
function startPractice(i){
  activeGroupId = 'p' + i;
  buildTabs();
  beginRound({ mode:'practice', index:i, pool:PRACTICE_SETS[i], label:`PRACTICE ${i+1}`, accent:'var(--gold)' });
}
function startTrial(){
  /* Weighted toward phrases this learner has actually missed — the trial is
     their own error history, not a random sample. */
  const bag = [];
  FULL_POOL.forEach(it => {
    const st = progress.phraseStats[it.p];
    const total = st ? st.hits + st.misses : 0;
    const missRatio = total ? st.misses/total : 0.5;
    const w = Math.max(1, Math.round((1 + missRatio*4) * 2));
    for (let k=0;k<w;k++) bag.push(it);
  });
  const pool = [...new Set(shuffle(bag))].slice(0, 24);
  beginRound({ mode:'trial', index:null, pool: pool.length ? pool : shuffle(FULL_POOL).slice(0,24),
               label:'FINAL TRIAL', accent:'var(--s4)' });
}

function beginRound(cfg){
  ensureAudio();
  round = {
    mode:cfg.mode, index:cfg.index, poolItems:cfg.pool, active:[...cfg.pool], resting:[],
    exposure:{}, weight:{}, coverage:new Set(),
    target:null, targetSpawned:false, forceIn:0, targetLifeBonus:1,
    hits:0, misses:0, streak:0, timeLeft:ROUND_SECONDS, tier:-1,
    goldenCount:0, frenzy:false, frenzyToken:0,
    live:new Set(), spawnTimer:null, goldenTimer:null, clockTimer:null, rafId:null, running:false
  };
  cfg.pool.forEach(it => { round.exposure[it.p] = 0; round.weight[it.p] = 1; });

  document.documentElement.style.setProperty('--screen-accent', cfg.accent);
  $('setLabel').textContent = cfg.label;
  $('hitVal').textContent = 0; $('missVal').textContent = 0; $('streakVal').textContent = 0;
  $('barHit').textContent = 0; $('barMiss').textContent = 0;
  $('streakLabel').classList.remove('hot');
  $('clockVal').textContent = fmtClock(round.timeLeft);
  $('clockVal').classList.remove('low','warn');
  $('roundFill').style.width = '0%';
  $('roundFill').classList.remove('clearing');
  $('roundNotch').style.left = Math.round(CLEAR_THRESHOLD*100) + '%';
    /* Clear the words, not the field: the toast lives in here now and must
     survive a fresh round. */
  $('field').querySelectorAll('.word, .spark').forEach(n => n.remove());
  $('field').classList.remove('frenzy');
  hideToast();

  renderStageBar();
  showScreen('play');
  /* Burrows are measured off the field's own rendered size, so they must be
     drawn only after the screen is visible — a display:none field reports
     zero width and every hole collapses to (0,0). */
  drawBurrows();
  newTarget();                       // the definition is already in the strip,
                                     // visible behind the note, so the eye
                                     // learns where it lives before it's needed                     // the definition is already in the strip,
                                     // visible behind the note, so the eye
                                     // learns where it lives before it's needed
  /* The note is not a one-time tutorial: it comes back whenever the learner
     arrives somewhere new — a fresh page load, or a different set. Replaying
     the same set straight away skips it, since nothing has changed. */
  const key = cfg.mode + ':' + cfg.index;
  if (key === lastSetKey) startPlaying();
  else { lastSetKey = key; showStartCard(); }
}

/* The clock does not run behind the note: a slow reader must not lose
   fifteen seconds of a two-minute round. */
function showStartCard(){
  $('startcard').classList.add('show');
}
function dismissStartCard(){
  $('startcard').classList.remove('show');
  if (round && !round.running) startPlaying();
}
function startPlaying(){
  if (!round || round.running) return;
  round.running = true;
  round.rafId = requestAnimationFrame(frame);
  spawnLoop();
  round.clockTimer = setInterval(tickClock, 1000);
  scheduleGolden();
}

const fmtClock = s => Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');

/* ── ESCALATING SPAWN RHYTHM ──
   A fixed interval feels the same in second two as it does in second one
   hundred. The gap between words tightens as the round runs down — a
   little in the middle stretch, sharply once the last fifteen seconds
   (frenzy) begin — so the pace itself carries the pressure the clock is
   also showing. A hot streak tightens it a touch further still. */
const FRENZY_AT = 15;
function currentSpawnDelay(){
  const base = WHEEL.cycle / WHEEL.steps;
  const elapsed = ROUND_SECONDS - round.timeLeft;
  const progress = Math.min(1, elapsed / (ROUND_SECONDS - FRENZY_AT));
  let delay = base - progress * base * 0.35;
  if (round.frenzy) delay = base * 0.5;
  delay -= Math.min(base*0.15, round.streak * 8);
  return Math.max(base * 0.4, delay);
}
function spawnLoop(){
  if (!round || !round.running) return;
  spawnWord();
  round.spawnTimer = setTimeout(spawnLoop, currentSpawnDelay());
}

function tickClock(){
  round.timeLeft--;
  $('clockVal').textContent = fmtClock(Math.max(0, round.timeLeft));
  $('clockVal').classList.toggle('warn', round.timeLeft <= 30 && round.timeLeft > FRENZY_AT);
  $('clockVal').classList.toggle('low', round.timeLeft <= FRENZY_AT);

  if (round.timeLeft <= FRENZY_AT && !round.frenzy){
    round.frenzy = true;
    $('field').classList.add('frenzy');
    playFrenzyIn();
  }
  if (round.timeLeft <= 5 && round.timeLeft > 0) playTick();
  if (round.timeLeft <= 0) endRound();
}

function weightedPick(){
  const bag = [];
  round.active.forEach(it => { for(let i=0;i<round.weight[it.p];i++) bag.push(it); });
  return bag.length ? bag[(Math.random()*bag.length)|0] : (round.active[0] || round.poolItems[0]);
}

function newTarget(){
  if (!round.active.length) refillFromResting();
  round.target = weightedPick();
  const pt = $('promptText');
  pt.textContent = round.target.m;
  pt.classList.remove('pulse'); void pt.offsetWidth; pt.classList.add('pulse');
  round.targetSpawned = false;
  /* The answer rides the third or fourth step, always. Waiting longer than
     that is dead time: the reader has understood the definition and is
     simply watching words that cannot be right.

     A dense gloss still earns more thinking time, but it buys it by
     staying on the wheel longer rather than by arriving later — time to
     decide, not time to wait. */
  const complexity = (round.target.m.match(/;/g)||[]).length + (round.target.m.match(/\bor\b/g)||[]).length;
  round.forceIn = randInt(3,4);
  round.targetLifeBonus = 1 + Math.min(complexity, 3) * 0.30;
}

function refillFromResting(){
  if (!round.resting.length) return;
  round.resting.sort((a,b) => a.left - b.left);
  const rec = round.resting.shift();
  round.exposure[rec.item.p] = 0; round.weight[rec.item.p] = 1;
  round.active.push(rec.item);
}
function tickRestCounters(){
  for (let i = round.resting.length-1; i >= 0; i--){
    if (--round.resting[i].left <= 0){
      const rec = round.resting.splice(i,1)[0];
      round.exposure[rec.item.p] = 0; round.weight[rec.item.p] = 1;
      round.active.push(rec.item);
    }
  }
}

/* ---------- field ---------- */
/* The five display faces that used to vary per word are gone. On a wheel the
   phrase is the only thing to read, so one face carries all of them. */

function decoyItem(){
  /* Two thirds of the time pull something from the target's own set: a
     half-match on verb or particle is the real confusion, and a random word
     from elsewhere is no test at all. Never a phrase already live on the
     field — a phrase can repeat across spawns (that's the point, it aids
     recall), but two identical cards up at once is just noise. */
  const liveNow = new Set([...round.live].filter(r => !r.dead).map(r => r.phrase));

  if (Math.random() < 0.65) {
    const same = round.active.filter(it =>
      it.group === round.target.group && it.p !== round.target.p && !liveNow.has(it.p));
    if (same.length) return pick(same);
  }
  const universe = round.active.concat(round.resting.map(r => r.item))
    .filter(it => it.p !== round.target.p && !liveNow.has(it.p));
  return universe.length ? pick(universe) : round.target;
}

/* ── THE FIELD ──
   Nine burrows in a loose grid. Only a few hold a phrase at any moment, so
   the reader has to look for the one that has come up — and because the
   holes never move, they learn the field rather than chase it.

   A word's life is: rise, wait, sink. The waiting is most of it. */
const WHEEL = { steps: 4, cycle: 6400 };      // concurrent phrases, and a phrase's life
const RISE = 0.14, SINK = 0.14;               // fractions of that life spent moving

const BURROW_COLS = [0.19, 0.50, 0.81];
const BURROW_ROWS = [0.26, 0.58, 0.90];

function burrowAt(i, fw, fh){
  return { x: fw * BURROW_COLS[i % 3], y: fh * BURROW_ROWS[Math.floor(i / 3)] };
}

/* Never the hole a phrase is already in, and never the one just vacated —
   two phrases rising in the same place reads as a glitch rather than a
   field. */
let lastBurrow = -1;
function freeBurrow(){
  const taken = new Set([...round.live].filter(r => !r.dead).map(r => r.burrow));
  const free = [];
  for (let i = 0; i < 9; i++) if (!taken.has(i) && i !== lastBurrow) free.push(i);
  const pool = free.length ? free : [...Array(9).keys()].filter(i => !taken.has(i));
  const pick = pool.length ? pool[(Math.random() * pool.length) | 0] : 0;
  lastBurrow = pick;
  return pick;
}

/* The holes are part of the scenery, drawn once and left alone — a reader
   should be able to see where a phrase might appear before it does. */
function drawBurrows(){
  const field = $('field');
  field.querySelectorAll('.burrow').forEach(n => n.remove());
  const fw = field.clientWidth, fh = field.clientHeight;
  for (let i = 0; i < 9; i++){
    const b = burrowAt(i, fw, fh);
    const el = document.createElement('div');
    el.className = 'burrow';
    el.style.left = b.x.toFixed(1) + 'px';
    el.style.top  = b.y.toFixed(1) + 'px';
  el.style.width = Math.min(160, fw * 0.16) + 'px';
    field.appendChild(el);
  }
}

function spawnWord(){
  if (!round) return;
  tickRestCounters();

  let item;
  if (!round.targetSpawned){ item = (--round.forceIn <= 0) ? round.target : decoyItem(); }
  else item = decoyItem();
  if (item.p === round.target.p) round.targetSpawned = true;

  const field = $('field');
  const el = document.createElement('div');
  el.className = 'word';
  /* Built from the two halves rather than one string, so the particle can
     carry its egg — and so the verb always comes first, which a phrasal verb
     requires and a single label cannot guarantee. */
  el.innerHTML = '<span class="pv"></span><span class="egg"></span>';
  el.querySelector('.pv').textContent  = item.v  || item.p;
  el.querySelector('.egg').textContent = item.pt || '';
  el.style.color = item.color;

  /* One turn of the wheel is a word's whole life, and every word gets the
     same turn — otherwise a longer-lived phrase drifts into the step below
     it and the two collide. A streak still quickens the wheel slightly, but
     never enough to outrun a reader. */
  const pace = Math.max(0.82, 1 - round.streak * 0.015);
  const life = WHEEL.cycle * pace;

  field.appendChild(el);
  const rec = { el, burrow: freeBurrow(), born: performance.now(), life,
                phrase: item.p, item, dead: false };
  round.live.add(rec);
  el.onclick = () => hit(rec);
}

/* ── THE GOLDEN WORD ──
   Independent of the definition on screen, on its own random schedule, and
   worth nothing toward accuracy or the scale score — it exists purely so
   not every second of a round asks for the same kind of attention. Reuses
   the same burrow field and the same rise/wait/sink physics in frame(), so
   it costs nothing extra to draw. */
function scheduleGolden(){
  if (!round) return;
  clearTimeout(round.goldenTimer);
  round.goldenTimer = setTimeout(() => {
    if (round && round.running && round.timeLeft > 6) spawnGolden();
    scheduleGolden();
  }, randInt(11000, 17000));
}

function spawnGolden(){
  if (!round) return;
  const liveNow = new Set([...round.live].filter(r => !r.dead).map(r => r.phrase));
  const candidates = (round.poolItems.length ? round.poolItems : FULL_POOL).filter(it => !liveNow.has(it.p));
  const item = pick(candidates.length ? candidates : (round.poolItems.length ? round.poolItems : FULL_POOL));
  const field = $('field');
  const el = document.createElement('div');
  el.className = 'word golden';
  el.innerHTML = '<span class="pv"></span><span class="egg"></span>';
  el.querySelector('.pv').textContent  = item.v  || item.p;
  el.querySelector('.egg').textContent = item.pt || '';

  const life = WHEEL.cycle * 0.8;
  field.appendChild(el);
  const rec = { el, burrow: freeBurrow(), born: performance.now(), life,
                phrase: item.p, item, dead:false, golden:true };
  round.live.add(rec);
  el.onclick = () => hit(rec);
}

function frame(now){
  if (!round) return;
  const field = $('field'), fw = field.clientWidth, fh = field.clientHeight;

  round.live.forEach(r => {
    if (r.dead) return;
    const t = (now - r.born) / r.life;
    if (t >= 1){ expire(r); return; }

    /* rise, wait, sink — and the waiting is most of it */
    const up = t < RISE        ? t / RISE
             : t > 1 - SINK    ? (1 - t) / SINK
             : 1;
    /* eased at both ends so a phrase does not jerk out of the ground */
    r.up = up * up * (3 - 2 * up);
    const b = burrowAt(r.burrow, fw, fh);
    r.x = b.x; r.y = b.y;
    r.scale = 1;
    r.blur = 0;
    r.opacity = 1;
  });

  [...round.live].filter(r => !r.dead).forEach(r => {
    /* The card sits with its foot on the lip of the burrow and is clipped
       to whatever has risen above it — so it emerges top first, the way a
       head comes up out of a hole. Both values are percentages of the
       card's own height, so this holds at any size. */
    const hidden = (1 - r.up) * 100;
    r.el.style.transform =
      'translate(-50%,-100%) translateY(' + hidden.toFixed(1) + '%)';
    r.el.style.clipPath = 'inset(0 0 ' + hidden.toFixed(1) + '% 0)';
    r.el.style.left = r.x.toFixed(1) + 'px';
    r.el.style.top  = r.y.toFixed(1) + 'px';
    r.el.style.zIndex = 4;
  });

  round.rafId = requestAnimationFrame(frame);
}

const removeRec = r => { r.dead = true; round.live.delete(r); r.el.remove(); };

function expire(rec){
  if (rec.dead || !round) return;
  removeRec(rec);
  /* The golden word carries no penalty for being missed — it was never
     part of the test, only a bonus to notice. */
  if (rec.golden) return;
  /* A decoy drifting off unclicked is normal traffic, not a failure — it was
     never a word to catch. Only the target expiring counts against you. */
  if (rec.phrase !== round.target.p) return;
  round.misses++; round.streak = 0;
  playMiss();
  syncCounters();
  /* It got away — bring it back on the very next step but one, while the
     definition is still in mind. */
  round.targetSpawned = false; round.forceIn = randInt(1,2);
  round.weight[round.target.p] = Math.min(5, (round.weight[round.target.p]||1) + 2);
  pstat(round.target.p).misses++;
}

function hit(rec){
  if (rec.dead || !round) return;

  /* Caught before the target logic — a golden catch never touches hits,
     misses, streak or accuracy. It is pure flair: its own sound, its own
     burst, its own banner, and a count that only ever shows up on the
     summary screen, kept well away from the Cambridge scale. */
  if (rec.golden){
    rec.el.classList.add('caught');
    burst(rec); removeRec(rec);
    round.goldenCount++;
    playGolden();
    flashGoldenBanner();
    return;
  }

  if (rec.phrase === round.target.p){
    rec.el.classList.add('caught');
    burst(rec); removeRec(rec);
    round.hits++; round.streak++;
    playCatch();

    /* No toast on a right answer. The example sentence used to appear here,
       but it arrived after the learner had already proved they knew the
       phrase, split their attention while the wheel kept turning, and made
       the strip ambient — a thing that is always on is a thing nobody
       reads. The toast now fires only when something went wrong, so its
       appearance is itself the signal. The spark, the streak and the stage
       pop carry the congratulation. Examples belong in Learn, where a
       reader can dwell on them. */
    syncCounters(); popStage(); hideToast(); checkTier();
    round.coverage.add(round.target.p);
    pstat(round.target.p).hits++; save();

    round.exposure[round.target.p]++;
    round.weight[round.target.p] = Math.max(1, round.weight[round.target.p] - 1);
    if (round.exposure[round.target.p] >= EXPOSURE_CAP){
      round.active = round.active.filter(it => it.p !== round.target.p);
      round.resting.push({ item: round.target, left: REST_SPAWNS });
    }
    newTarget();
  } else {
    rec.el.classList.add('wrong');
    setTimeout(() => rec.el.classList.remove('wrong'), 240);
    round.misses++; round.streak = 0;
    playWrong();
    syncCounters();
    round.weight[round.target.p] = Math.min(5, (round.weight[round.target.p]||1) + 2);
    pstat(round.target.p).misses++; save();
    /* Name what the wrong word actually means. The error becomes input
       rather than a counter ticking up. */
    showToast(`<b>${rec.phrase}</b><span> = ${rec.item.m}</span>`);
  }
}

function syncCounters(){
  $('hitVal').textContent = round.hits;   $('barHit').textContent = round.hits;
  $('missVal').textContent = round.misses; $('barMiss').textContent = round.misses;
  $('streakVal').textContent = round.streak;
  $('streakLabel').classList.toggle('hot', round.streak >= 5);

  const attempts = round.hits + round.misses;
  const acc = attempts ? round.hits/attempts : 0;
  const fill = $('roundFill');
  fill.style.width = Math.round(acc*100) + '%';
  fill.classList.toggle('clearing', attempts > 0 && acc >= CLEAR_THRESHOLD);
}

/* Every catch inflates the stage mark you're on and throws a ring of light. */
/* Something has to happen when a mark falls, or the ladder is decoration.
   The whole card takes the new colour for a moment, the mark swells, and the
   name of the stage crosses the field. It never blocks: the round keeps
   running underneath, because stopping the game to congratulate someone is
   how you make a reward feel like an interruption. */
function checkTier(){
  const t = roundTier(round.hits);
  if (t <= round.tier) return;
  round.tier = t;
  const st = STAGES[t];
  playTier();

  renderRoundBar();
  document.documentElement.style.setProperty('--screen-accent', st.color);

  const card = $('card');
  card.classList.remove('tierflash'); void card.offsetWidth; card.classList.add('tierflash');
  card.style.setProperty('--tiercol', st.glow);

  const b = $('tierBanner');
  b.innerHTML = '<svg viewBox="0 0 24 24">' + svgIcon(t, st.color) + '</svg><span>' + st.label + '</span>';
  b.style.color = st.color;
  b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
  setTimeout(() => b.classList.remove('show'), 1500);

  /* a spray of light from the middle of the field */
  const field = $('field');
  for (let i = 0; i < 26; i++){
    const p = document.createElement('div');
    p.className = 'spark';
    p.style.left = (field.clientWidth / 2) + 'px';
    p.style.top  = (field.clientHeight / 2) + 'px';
    p.style.background = i % 3 ? st.color : '#fff';
    p.style.transition = 'transform .8s cubic-bezier(.2,.7,.3,1), opacity .8s ease-out';
    field.appendChild(p);
    const a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 190;
    requestAnimationFrame(() => {
      p.style.transform = 'translate(' + (Math.cos(a)*d) + 'px,' + (Math.sin(a)*d) + 'px) scale(' + (0.6 + Math.random()) + ')';
      p.style.opacity = '0';
    });
    setTimeout(() => p.remove(), 820);
  }
}

/* A quick flash in the same banner the stage marks use, in gold rather
   than whichever stage colour is current — distinct enough not to be
   mistaken for a stage-up, brief enough not to block the round. */
function flashGoldenBanner(){
  const b = $('tierBanner');
  b.innerHTML = '<span>✦ GOLDEN ✦</span>';
  b.style.color = '#FFD94A';
  b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
  setTimeout(() => b.classList.remove('show'), 1100);
}

function popStage(){
  const now = $('stagebar').querySelector('.stagenode.current');
  if (!now) return;
  now.classList.remove('pop');
  void now.offsetWidth;
  now.classList.add('pop');
  setTimeout(() => now.classList.remove('pop'), 560);
}

let toastTimer;
function showToast(html){
  const t = $('toast'); t.innerHTML = html; t.classList.add('show'); t.classList.remove('good');
  clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, 2000);
}
const hideToast = () => $('toast').classList.remove('show');

/* ── THE BURST ──
   A shell, not a sputter. Three things happen at once and a fourth follows:
   a flash of light at the point of the catch, a spray of stars thrown out on
   trails that arc and fall under gravity, and a ring that expands and thins —
   then, a quarter of a second later, the crackle.

   Children who grow up watching the Funchal New Year know what a firework
   looks like, and a polite little puff of dots does not read as one. */
function burst(rec){
  const field = $('field');
  const r = rec.el.getBoundingClientRect(), f = field.getBoundingClientRect();
  const cx = r.left - f.left + r.width / 2;
  const cy = r.top  - f.top  + r.height / 2;

  rec.el.animate(
    [{ transform: rec.el.style.transform, opacity:1 },
     { transform: rec.el.style.transform + ' scale(1.5)', opacity:0 }],
    { duration:300, easing:'ease-out' });

  const COLS = ['#FFD94A','#C9A961','#5ED39B','#ff7a45','#ffffff','#7dd3fc'];

  /* the flash — everything for one frame, gone by the next */
  const flash = document.createElement('div');
  flash.className = 'spark fw-flash';
  flash.style.left = cx + 'px'; flash.style.top = cy + 'px';
  field.appendChild(flash);
  flash.animate([{ transform:'translate(-50%,-50%) scale(.2)', opacity:1 },
                 { transform:'translate(-50%,-50%) scale(3.4)', opacity:0 }],
                { duration:420, easing:'cubic-bezier(.1,.8,.2,1)' });
  setTimeout(() => flash.remove(), 440);

  /* the ring */
  const ring = document.createElement('div');
  ring.className = 'spark fw-ring';
  ring.style.left = cx + 'px'; ring.style.top = cy + 'px';
  field.appendChild(ring);
  ring.animate([{ transform:'translate(-50%,-50%) scale(.15)', opacity:.9, borderWidth:'3px' },
                { transform:'translate(-50%,-50%) scale(2.6)', opacity:0,  borderWidth:'1px' }],
               { duration:640, easing:'cubic-bezier(.1,.7,.2,1)' });
  setTimeout(() => ring.remove(), 660);

  /* the stars: thrown out fast, slowing as they climb, then falling */
  const N = 46;
  for (let i = 0; i < N; i++){
    const p = document.createElement('div');
    p.className = 'spark fw-star';
    const col = COLS[(Math.random() * COLS.length) | 0];
    const size = 3 + Math.random() * 4;
    p.style.cssText += 'left:' + cx + 'px; top:' + cy + 'px; width:' + size + 'px; height:' + size +
      'px; background:' + col + '; box-shadow:0 0 ' + (size * 2.5) + 'px ' + col + ';';
    field.appendChild(p);

    const ang = Math.random() * Math.PI * 2;
    const dist = 70 + Math.random() * 190;
    const dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist;
    const fall = 60 + Math.random() * 90;          // gravity, once the throw is spent
    const dur  = 780 + Math.random() * 520;

    p.animate([
      { transform:'translate(-50%,-50%) translate(0,0) scale(1.15)', opacity:1 },
      { transform:'translate(-50%,-50%) translate(' + (dx*0.62).toFixed(0) + 'px,' +
                  (dy*0.62 - 12).toFixed(0) + 'px) scale(1)', opacity:1, offset:0.42 },
      { transform:'translate(-50%,-50%) translate(' + dx.toFixed(0) + 'px,' +
                  (dy + fall).toFixed(0) + 'px) scale(.25)', opacity:0 }
    ], { duration:dur, easing:'cubic-bezier(.12,.75,.3,1)' });
    setTimeout(() => p.remove(), dur + 30);
  }

  /* the crackle, a beat later — the part that makes people look up twice */
  setTimeout(() => {
    for (let i = 0; i < 18; i++){
      const c = document.createElement('div');
      c.className = 'spark fw-crackle';
      const ang = Math.random() * Math.PI * 2, d = 30 + Math.random() * 120;
      c.style.cssText += 'left:' + (cx + Math.cos(ang) * d * 0.5) + 'px; top:' +
                         (cy + Math.sin(ang) * d * 0.5) + 'px;';
      field.appendChild(c);
      c.animate([{ opacity:0, transform:'translate(-50%,-50%) scale(.4)' },
                 { opacity:1, transform:'translate(-50%,-50%) scale(1.3)', offset:0.25 },
                 { opacity:0, transform:'translate(-50%,-50%) scale(.3)' }],
                { duration:320 + Math.random() * 260, easing:'ease-out' });
      setTimeout(() => c.remove(), 620);
    }
  }, 230);
}

/* ======================================================================
   END → SUMMARY
====================================================================== */
function stopRound(){
  if (!round) return;
  round.running = false;
  clearTimeout(round.spawnTimer); clearTimeout(round.goldenTimer);
  clearInterval(round.clockTimer); cancelAnimationFrame(round.rafId);
  round.live.forEach(r => r.el.remove()); round.live.clear();
  $('startcard').classList.remove('show');
}

function endRound(){
  stopRound();
  const attempts = round.hits + round.misses;
  const accuracy = attempts ? round.hits/attempts : 0;
  const coverage = round.poolItems.length ? round.coverage.size/round.poolItems.length : 0;
  const before = currentStageIndex();
  let cleared = false;

  if (round.mode === 'group'){
    cleared = accuracy >= CLEAR_THRESHOLD;
    const prev = progress.groupResults[round.index];
    progress.groupResults[round.index] = {
      cleared: cleared || !!(prev && prev.cleared),
      bestAccuracy: Math.max(accuracy, prev ? prev.bestAccuracy : 0),
      bestScore: Math.max(scaleScore(accuracy), prev ? (prev.bestScore||0) : 0), coverage };
  } else if (round.mode === 'practice'){
    /* Revision feeds phraseStats — so mastery marks and the trial's weighting
       see the practice — but does not move the stage ladder. The Crown stays
       tied to clearing the sets themselves. */
    cleared = accuracy >= CLEAR_THRESHOLD;
    const prev = progress.practiceResults[round.index];
    progress.practiceResults[round.index] = {
      cleared: cleared || !!(prev && prev.cleared),
      bestAccuracy: Math.max(accuracy, prev ? prev.bestAccuracy : 0),
      bestScore: Math.max(scaleScore(accuracy), prev ? (prev.bestScore||0) : 0), coverage };
  } else {
    cleared = accuracy >= TRIAL_THRESHOLD;
    progress.trialBest = Math.max(accuracy, progress.trialBest || 0);
    if (cleared) progress.trialPassed = true;
  }
  save();

  renderSummary({ accuracy, cleared, coverage });
  const after = currentStageIndex();
  if (after > before) setTimeout(() => showStageUp(after), 550);
}

function renderSummary(res){
  showScreen('summary');
  const g = round.mode === 'group' ? GROUPS.find(x => x.id === round.index) : null;
  $('sumEyebrow').textContent = round.mode === 'trial' ? 'FINAL TRIAL'
    : round.mode === 'practice' ? `PRACTICE ${round.index+1}` : g.label;

  /* The score leads, not the verdict. A learner who reads "156" knows they
     were four points short; one who reads "Keep training" only knows they
     failed, and that is the reading that makes them stop. */
  const score = scaleScore(res.accuracy);
  const grade = gradeOf(score);
  const v = $('sumVerdict');
  v.innerHTML = round.mode === 'trial'
    ? (res.cleared ? 'Crown earned' : `${score} <span class="gr">${grade.letter}</span>`)
    : `${score} <span class="gr">${grade.letter}</span>`;
  v.className = 'sumverdict ' + grade.cls;

  const reached = round.tier >= 0 ? STAGES[round.tier].label : null;
  $('sumStars').innerHTML = round.mode === 'trial' && res.cleared
    ? '' : `<span class="gradeword">${grade.word}</span>` +
           (reached ? ` <span class="gradeword" style="color:${STAGES[round.tier].color}">· ${reached}</span>` : '');
  $('sumHits').textContent = round.hits;
  $('sumMiss').textContent = round.misses;
  $('sumAcc').textContent = Math.round(res.accuracy*100) + '%';
  $('sumGold').textContent = round.goldenCount;

  /* Always name the next rung and what it costs — never just the shortfall. */
  const next = score < 160 ? 160 : score < 173 ? 173 : score < 180 ? 180 : null;
  const gap  = next ? next - score : 0;
  $('sumNote').innerHTML = round.mode === 'trial'
    ? (res.cleared
        ? 'Every set, held under time pressure. That is the whole job.'
        : `The Crown needs <b>180</b> — grade A. You are <b>${180 - score}</b> away.`)
    : (next
        ? `<b>${gap}</b> point${gap === 1 ? '' : 's'} from <b>${next}</b>` +
          ` — grade ${gradeOf(next).letter}. You met ${Math.round(res.coverage*100)}% of this set.`
        : `Top band. You met ${Math.round(res.coverage*100)}% of this set's phrases.`);

  $('sumRetry').onclick = () => {
    if (round.mode === 'trial') startTrial();
    else if (round.mode === 'practice') startPractice(round.index);
    else startGroup(round.index);
  };
  $('sumNext').onclick = renderMenu;
}

function showStageUp(i){
  const s = STAGES[i], el = $('stageup');
  el.style.setProperty('--glowcol', s.glow);
  $('stageupIcon').innerHTML = svgIcon(i, s.color);
  $('stageupName').textContent = s.label;
  $('stageupDesc').textContent = s.desc;
  el.classList.add('show');
  el.onclick = () => { el.classList.remove('show'); renderMenu(); };
}

/* ======================================================================
   EVENTS
====================================================================== */
$('backBtn').onclick = () => { stopRound(); round = null; renderMenu(); };

/* The note can be re-opened from the HUD — once it's gone there would
   otherwise be no way to read the instruction again. Re-opening pauses. */
$('helpBtn').onclick = () => {
  if (!round) return;
  clearTimeout(round.spawnTimer); clearTimeout(round.goldenTimer);
  clearInterval(round.clockTimer); cancelAnimationFrame(round.rafId);
  round.running = false;
  $('startcard').classList.add('show');
};
$('scGo').onclick = () => { ensureAudio(); dismissStartCard(); };
$('soundBtn').onclick = () => setSound(!soundOn);

document.querySelectorAll('.mode-btn').forEach(b => {
  b.addEventListener('click', () => {
    /* The other four modes live on the quiz page. Leaving mid-round would
       lose it silently, so stop the clock first. */
    if (!b.dataset.href) return;
    stopRound();
    location.href = b.dataset.href;
  });
});

/* Pause cleanly when the tab is hidden — otherwise the clock runs down while
   the animation frame is frozen. */
document.addEventListener('visibilitychange', () => {
  if (!round || !$('play').classList.contains('active')) return;
  if (document.hidden){
    clearTimeout(round.spawnTimer); clearTimeout(round.goldenTimer);
    clearInterval(round.clockTimer); cancelAnimationFrame(round.rafId);
  } else if (round.running) {
    /* words carry an absolute birth time, so shift them forward by the gap */
    spawnLoop();
    round.clockTimer = setInterval(tickClock, 1000);
    round.rafId = requestAnimationFrame(frame);
    scheduleGolden();
  }
});
 
/* Rotating the phone changes the field's actual size, but the burrow
   holes were drawn using the old size — without this they stay pinned
   to stale coordinates and the round looks frozen after a rotation. */
window.addEventListener('resize', () => {
  if (round && $('play').classList.contains('active')) {
    drawBurrows();
  }
});

boot();
</script>
</body>
</html>
