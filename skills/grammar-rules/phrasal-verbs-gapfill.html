<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INTUITY - Phrasal Verbs Interactive Quiz</title>
 <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=4">
   <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    /* ══ EMBEDDED ═══════════════════════════════════════════════════════
       When phrasal-verbs-play.html frames this page, its own shared header
       already shows the mode row AND the verb-family tabs. This page no
       longer draws a second, differently-styled copy of either — see the
       new .verb-selector rules below. Standalone, the old top-nav/header/
       mode-toggle are still hidden the same way they always were. */
    html.embedded .top-nav,
    html.embedded header,
    html.embedded footer { display: none !important; }

    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 0;
      margin-bottom: 0.5rem;
      gap: 1rem;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .nav-link {
      color: var(--faint);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      transition: color 0.3s ease;
      white-space: nowrap;
    }

    .nav-link:hover {
      color: var(--accent-ink);
    }

    .nav-center {
      flex: 1;
      text-align: center;
    }

    .nav-title {
      font-family: var(--f-display);
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--ink);
      letter-spacing: -0.02em;
      text-transform: uppercase;
    }

    /* HEADER (standalone only) */
    header {
      text-align: center;
      margin-bottom: 0.5rem;
      padding: 0.5rem 0 0.25rem;
    }

    .subtitle {
      font-size: 0.75rem;
      color: var(--faint);
      margin-bottom: 0.25rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .author {
      font-size: 0.625rem;
      color: var(--dim);
      font-weight: 400;
      letter-spacing: 0.02em;
    }

    /* MODE TOGGLE (standalone only) — restyled to match the shared
       mode-selector: text buttons with an underline on the active item,
       no filled background pill. */
    .mode-toggle-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      margin: 1rem 0;
      padding: 0.5rem;
    }

    .mode-toggle {
      display: inline-flex;
      gap: 1.5rem;
    }

    .mode-btn {
      border: none;
      background: transparent;
      color: var(--faint);
      font-size: 0.68rem;
      padding: 0.3rem 0.1rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: color 0.15s;
      font-weight: 600;
      font-family: var(--f-display);
      border-bottom: 2px solid transparent;
    }

    .mode-btn.active {
      color: var(--ink);
      border-bottom-color: var(--accent);
      font-weight: 700;
    }

    .mode-btn:hover:not(.active) {
      color: var(--ink);
    }

    html { height: 100%; }
    body {
      font-family: var(--f-body);
      background: var(--screen);
      /* WAS min-height:100vh. Inside an iframe that measures the WINDOW, not
         the frame, so the body is taller than its own viewport before a
         single sentence is added — and position:sticky then has no scrolling
         ancestor to stick to, which is half of why the bank scrolled away.
         height:100% measures the frame. Same fix as gapfill.css and
         practice.css already carry. */
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      color: var(--ink);
      padding: 0 var(--gutter) 1rem;
    }

    .content-container {
      background: var(--card);
      border-radius: var(--r-sheet);
      border: none;
      padding: 2rem;
      box-shadow: 0 8px 30px rgba(43,33,41,.08);
    }

    /* ── VERB SELECTOR, NOW A PLAIN SET-TABS ROW ───────────────────────
       This used to be its own component: filled beige pills, a hard
       border-bottom rule, and an orange, scaled-up active state — a
       second, louder version of the tabs the shared header already
       draws above the iframe. It now uses the same restrained language
       as Explore's set tabs: text buttons, an accent underline on the
       active one, and no dividing line to the content below it. */
    .verb-selector {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
      justify-content: center;
    }

    .verb-btn {
      padding: 0.3rem 0.1rem;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--faint);
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 600;
      font-family: var(--f-display);
      transition: color 0.15s ease, border-color 0.15s ease;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .verb-btn:hover {
      color: var(--ink);
    }

    .verb-btn.active {
      color: var(--ink);
      border-bottom-color: var(--accent);
      font-weight: 700;
    }

    /* ── PROGRESS, NOW A PLAIN CAPTION LINE ────────────────────────────
       No longer its own row of filled dots; a single quiet mono line,
       the way Explore's own progress counter ("1 / 16") reads. */
    /* ── THE PINNED BLOCK ─────────────────────────────────────────────
       The tally and the particle bank pin TOGETHER, as one object, for the
       reason already written into gapfill.css: pinning them separately
       means guessing the first one's height to offset the second, and this
       bank wraps to one, two or three rows depending on the family and the
       screen. One wrapper, one top:0, nothing to keep in sync.

       Opaque background is not decoration — sentences scroll UNDER this,
       and without it they show through the gaps between the chips. */
    .pinned {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--screen);
      padding-top: 1rem;
      margin-bottom: 1.25rem;
    }

    .progress-info {
      text-align: center;
      font-size: 0.75rem;
      color: var(--faint);
      margin-bottom: 1rem;
      font-family: var(--f-mono);
      letter-spacing: 0.04em;
    }

    .progress-dots { display: none; }

    /* ── REFERENCE BANK, NO LONGER A BOXED CARD-ON-A-CARD ──────────────
       Dropped the beige background/border-radius container: the chips
       carry their own identity already (tile-bg pills), so the outer box
       was a highlight around a highlight. A thin rule now separates it
       from the sentences instead of a filled panel. */
  /* ── THE BANK STAYS ON SCREEN ────────────────────────────────────────
     It scrolled with the sentences, so by item six the sixteen particles a
     student is choosing FROM were above the fold — they were being asked to
     pick from a list they could not see. It is not a heading; it is the
     working set, and it has to behave like one.

     max-height, not just sticky: MIX 1 carries 25 particles, which is four
     wrapped rows, and a bank that tall would leave almost no sentence
     visible on a phone. Capped at a third of the frame and scrollable
     inside itself — the cap only ever bites on the long families. */
  .reference-bank {
  padding-bottom: .85rem;
  border-bottom: 1px solid var(--rule);
  max-height: 34vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}

    /* Sticky INSIDE the bank, so the label survives the bank's own scroll
       on the 25-particle families. */
    .bank-title {
      position: sticky;
      top: 0;
      background: var(--screen);
      padding-bottom: .35rem;
      font-size: 0.6875rem;
      color: var(--faint);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0.75rem;
      font-family: var(--f-mono);
    }

    .particle-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

.particle-chip {
  background: none;
  color: var(--dim);
  padding: 0.3rem 0.6rem;
  border-radius: 0;
  font-size: 0.85rem;
  font-weight: 600;
  font-family: var(--f-display);
  border: none;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  transition: color .15s, border-color .15s;
}
.particle-chip:hover:not(.used):not(:disabled) {
  color: var(--ink);
  border-bottom-color: var(--rule);
  transform: none;
}
.particle-chip.selected {
  background: none;
  color: var(--ink);
  border-bottom-color: var(--accent);
  transform: none;
}
.particle-chip.used {
  background: none;
  color: var(--faint);
  text-decoration: line-through;
  opacity: .45;
}

    .sentences {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .sentence-row {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
    }

    .question-number {
      flex-shrink: 0;
      width: 1.6rem;
      height: 1.6rem;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 600;
      font-family: var(--f-mono);
      background: var(--slot-bg);

    }

    .sentence-text {
      flex: 1;
      padding-top: 0.15rem;
      color: var(--ink);
      line-height: 1.6;
      font-size: 0.9rem;
    }

    .verb-part {
      font-weight: 900;
      color: var(--target);
    }

    .blank {
      display: inline-block;
      min-width: 80px;
      padding: 0.35rem 0.75rem;
      margin: 0 0.25rem;
      background: var(--slot-bg);
      border: none;

      color: var(--dim);

    .footer {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      margin-top: 2rem;
      padding-top: 1.5rem;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s ease;
    }

    .footer.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .footer button {
      padding: 0.7rem 1.5rem;
      border-radius: var(--r-chip);
      font-size: 0.82rem;
      font-weight: 700;
      font-family: var(--f-display);

      transition: all 0.15s cubic-bezier(.2,.8,.2,1);
      border: none;

    .modal-overlay {
      display: none;

      inset: 0;
      background: var(--scrim);
      z-index: 1000;
      align-items: center;
      justify-content: center;

    .modal-overlay.active {

    .modal {

      border: none;
      border-radius: var(--r-sheet);
      padding: 2.5rem;
      max-width: 520px;

      box-shadow: 0 20px 55px rgba(43,33,41,.14);

    .modal-header {
      text-align: center;

    }

    .modal-title {
      font-family: var(--f-display);
      font-size: 1.75rem;
      font-weight: 900;
      color: var(--ink);
      margin-bottom: 0.5rem;
    }

    .modal-subtitle {
      font-size: 0.9375rem;
      color: var(--faint);
    }

    .score-display {
      text-align: center;
      padding: 2rem 1rem;
      background: var(--slot-bg);
      border-radius: var(--r-sheet);
      margin-bottom: 1.5rem;
    }

    .score-number {
      font-family: var(--f-display);
      font-size: 3.5rem;
      font-weight: 900;
      color: var(--accent-ink);
      margin-bottom: 0.5rem;
    }

    .score-label {
      font-size: 0.875rem;
      color: var(--faint);
    }

    .modal-footer {
      display: flex;
      gap: 1rem;
    }

    .modal-btn {
      flex: 1;
      padding: 0.85rem;
      border: none;
      border-radius: var(--r-chip);
      font-size: 0.9rem;
      font-weight: 700;

      cursor: pointer;
      transition: all 0.15s ease;
    }

    .modal-btn-secondary {
      background: var(--tile-bg);

    }

    .modal-btn-secondary:hover {

    }

    /* MOBILE OPTIMIZATIONS */
    @media (max-width: 768px) {
      .mode-btn { font-size: 0.62rem; }

   @media (max-width: 640px) {
  body { padding: 0.5rem; }

<body>
  <div class="container">
    
    <!-- TOP NAVIGATION (standalone only) -->
    <div class="top-nav">
      <div class="nav-left">
        <a href="../../index.html?openModal=grammar" class="nav-link">← Back</a>
      </div>
      <div class="nav-center">
        <div class="nav-title">INTUITY</div>
      </div>
    </div>

    <!-- HEADER (standalone only) -->
    <header>
      <p class="subtitle">Interactive Grammar System</p>
      <p class="author">Majid Nashtai · B2 First Phrasal Verbs</p>
      
 <div class="mode-toggle-container">
  <div class="mode-toggle">
    <button class="mode-btn" data-mode="explore">Explore</button>
    <button class="mode-btn" data-mode="practice">Practice</button>
    <button class="mode-btn active" data-mode="gapfill">Quiz</button>
  </div>
</div>
    </header>

    <div class="content-container">
      <!-- Embedded, this row IS the family picker (the shared header hides
           its own set-tabs while Quiz is open, so there's still only one
           row of tabs on screen — just styled to match the rest now). -->
      
      <!-- The bank is rendered into #bankHost rather than into the content,
           so it can pin with the tally. It is the only part of the quiz that
           is not a sentence, and the only part the student needs continuously
           rather than once. -->
      <div class="pinned">
        <div class="progress-info" id="progressInfo" style="display: none;">
          <span id="progressText"></span>
          <div class="progress-dots" id="progressDots"></div>
        </div>
        <div id="bankHost"></div>
      </div>

      <div id="contentContainer">
        <div class="loading">Loading quiz...</div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="scoreModal">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title">Test Results</h2>
        <div class="modal-subtitle" id="modalSubtitle"></div>
      </div>
      <div class="score-display">
        <div class="score-number" id="scoreNumber">0/0</div>
        <div class="score-label" id="scoreLabel"></div>
      </div>
      <div class="modal-footer">
        <button class="modal-btn modal-btn-secondary" onclick="closeModal()">Close</button>
        <button class="modal-btn modal-btn-primary" id="nextTestBtn" onclick="nextTest()">Next Test</button>
      </div>
    </div>
  </div>

  <script>
    let quizData = null;
    let currentTest = null;
    let selectedParticle = null;
    let answers = {};
    let showingResults = false;
    let testScores = {};

/* ══ THE HOST DRAWS THE SET TABS ═════════════════════════════════════════
   This page never had a set picker at all. Its ten tests are the ten verb
   families, and the only way to reach the second one was to finish the first
   and press "Next Test" in the score modal — so a student who wanted PUT had
   to sit nine quizzes or reload the page.

   The families were on screen the whole time, in the host's header band, but
   that band drove the board games and Explore's slideshow and said nothing to
   this frame. Speaking the same protocol every other topic's quiz speaks
   (`intuity:'tests'` up, `intuity:'setTest'` down) is what connects the row
   that was already there to the page it was already naming. */
const EMBEDDED = window.parent !== window;

function publishTests(){
  if(!EMBEDDED || !quizData) return;
  parent.postMessage({ intuity:'tests', mode:'quiz',
    /* A finished family carries its percentage, exactly as Practice's do, so
       the band doubles as the record of what has been done. */
    titles: quizData.tests.map((t, i) => {
      const sc = testScores['test' + i];
      return sc ? t.title + ' (' + sc.percentage + '%)' : t.title;
    }),
    active: currentTest === null ? 0 : currentTest }, '*');
}

window.addEventListener('message', e => {
  if(!e.data) return;
  /* The host may announce itself before the fetch has landed, so a set asked
     for too early is remembered rather than dropped. */
  if(e.data.intuity === 'setTest'){
    if(quizData) loadTest(e.data.index); else pendingTest = e.data.index;
  }
});
let pendingTest = null;

async function loadData() {
  try {
    const response = await fetch('../../data/grammar-rules/phrasal-verbs-data.json');
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    
    const raw = await response.json();

    quizData = {
      tests: (raw.groups || []).map(group => {
        const verbs = [...new Set(group.items.map(it => it.verb || group.id))];
        return {
          title: group.label,
          verb: verbs.length === 1 ? verbs[0] : undefined,
          verbs: verbs.length > 1 ? verbs : undefined,
          particles: group.items.map(it => it.particle),
          sentences: group.items.map(it => ({
            text: it.example,
            answer: it.particle
          }))
        };
      })
    };
        const saved = localStorage.getItem('phrasal_verbs_progress');
        if (saved) {
          testScores = JSON.parse(saved);
        }
        
        loadTest(pendingTest == null ? 0 : pendingTest);
        pendingTest = null;
        publishTests();
        
      } catch (error) {
        console.error('Error loading data:', error);
        document.getElementById('contentContainer').innerHTML = `
          <div class="error">
            <div style="font-size: 2rem; margin-bottom: 1rem;">⚠️</div>
            <div>Failed to load quiz</div>
            <div style="font-size: 0.75rem; margin-top: 0.5rem;">${error.message}</div>
          </div>
        `;
      }
    }

    /* Called on every save, so a percentage appears in the host's band the
       moment a family is finished — not on the next reload. */
    function saveProgress() {
      publishTests();
      try {
        localStorage.setItem('phrasal_verbs_progress', JSON.stringify(testScores));
      } catch (e) {
        console.error('Error saving progress:', e);
      }
    }
   
    function shuffleArray(array) {
      const shuffled = [...array];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    function loadTest(testIdx) {
      if (!quizData || testIdx < 0 || testIdx >= quizData.tests.length) return;
      
      currentTest = testIdx;
      selectedParticle = null;
      answers = {};
      showingResults = false;
      
      const testData = quizData.tests[testIdx];
      testData.shuffledParticles = shuffleArray(testData.particles);
      testData.shuffledSentences = shuffleArray(testData.sentences.map((s, originalIdx) => ({
        ...s,
        originalIdx
      })));
      
    renderTest();
    updateProgressInfo();
    /* "Next Test" in the score modal moves the frame on its own; without this
       the host band would still be lighting the family the student left. */
    publishTests();
    }

    function updateProgressInfo() {
      if (!quizData || currentTest === null) return;
      
      const testData = quizData.tests[currentTest];
      const sentencesToDisplay = testData.shuffledSentences || testData.sentences.map((s, i) => ({...s, originalIdx: i}));
      const answered = sentencesToDisplay.filter(s => answers[s.originalIdx] !== undefined).length;
      const total = sentencesToDisplay.length;
      
      document.getElementById('progressInfo').style.display = 'block';
      document.getElementById('progressText').textContent = `${answered} / ${total} answered`;
    }

    function renderTest() {
      if (!quizData || currentTest === null) return;
      
      const testData = quizData.tests[currentTest];
      const container = document.getElementById('contentContainer');
      
      renderBank(testData);

      let html = '';

      // Sentences with shuffled order
      html += '<div class="sentences">';
      const sentencesToDisplay = testData.shuffledSentences || testData.sentences.map((s, i) => ({...s, originalIdx: i}));
      
      sentencesToDisplay.forEach((sentenceData, displayIdx) => {
        const sentence = sentenceData;
        const idx = sentenceData.originalIdx !== undefined ? sentenceData.originalIdx : displayIdx;
        const userAnswer = answers[idx];
        const correctAnswer = sentence.answer;
        const isCorrect = userAnswer === correctAnswer;
        
        const numClass = userAnswer ? 'question-number answered' : 'question-number';
        
        html += `<div class="sentence-row">`;
        html += `<div class="${numClass}">${displayIdx + 1}</div>`;
        html += `<div class="sentence-text">`;
        
        const parts = sentence.text.split('_____');
        
        const beforeBlank = parts[0];
        const mainVerb = testData.verb || testData.verbs;
        
        const verbForms = {
          'take': ['take', 'takes', 'took', 'taken', 'taking'],
          'go': ['go', 'goes', 'went', 'gone', 'going'],
          'look': ['look', 'looks', 'looked', 'looking'],
          'get': ['get', 'gets', 'got', 'gotten', 'getting'],
          'keep': ['keep', 'keeps', 'kept', 'keeping'],
          'put': ['put', 'puts', 'putting'],
          'turn': ['turn', 'turns', 'turned', 'turning'],
          'run': ['run', 'runs', 'ran', 'running'],
          'come': ['come', 'comes', 'came', 'coming'],
          'bring': ['bring', 'brings', 'brought', 'bringing'],
          'break': ['break', 'breaks', 'broke', 'broken', 'breaking'],
          'set': ['set', 'sets', 'setting'],
          'carry': ['carry', 'carries', 'carried', 'carrying'],
          'work': ['work', 'works', 'worked', 'working'],
          'figure': ['figure', 'figures', 'figured', 'figuring'],
          'point': ['point', 'points', 'pointed', 'pointing'],
          'fill': ['fill', 'fills', 'filled', 'filling'],
          'call': ['call', 'calls', 'called', 'calling'],
          'give': ['give', 'gives', 'gave', 'given', 'giving'],
          'pick': ['pick', 'picks', 'picked', 'picking'],
          'drop': ['drop', 'drops', 'dropped', 'dropping'],
          'hold': ['hold', 'holds', 'held', 'holding']
        };
        
        let formsToMatch = [];
        if (typeof mainVerb === 'string') {
          formsToMatch = verbForms[mainVerb] || [mainVerb];
        } else if (Array.isArray(mainVerb)) {
          mainVerb.forEach(v => {
            if (verbForms[v]) {
              formsToMatch = formsToMatch.concat(verbForms[v]);
            }
          });
        }
        
        let highlighted = beforeBlank;
        formsToMatch.forEach(form => {
          const regex = new RegExp(`\\b(${form})\\b`, 'gi');
          highlighted = highlighted.replace(regex, '<span class="verb-part">$1</span>');
        });
        
        html += highlighted;
        
        if (showingResults) {
          if (userAnswer && !isCorrect) {
            html += `<span class="blank incorrect">${userAnswer}</span>`;
          }
          html += `<span class="blank correct">${correctAnswer}</span>`;
        } else if (userAnswer) {
          html += `<span class="blank filled" onclick="handleBlankClick(${idx})">${userAnswer}</span>`;
        } else {
          html += `<span class="blank" onclick="handleBlankClick(${idx})">_____</span>`;
        }
        
        html += parts[1] || '';
        html += `</div>`;
        html += `</div>`;
      });
      html += '</div>';
      
      const answered = Object.keys(answers).length;
      if (answered === testData.sentences.length) {
        html += '<div class="footer visible">';
        html += '<button class="secondary" onclick="clearAnswers()" ' + (showingResults ? 'disabled' : '') + '>Clear</button>';
        if (!showingResults) {
          html += '<button class="primary" onclick="submitAndScore()">Submit</button>';
        } else {
          html += '<button class="results" onclick="showModal()">View Results</button>';
        }
        html += '</div>';
      }
      
      container.innerHTML = html;
    }

    /* Drawn into the pinned host, and redrawn on its own whenever a particle
       is used or freed — so striking one through never rebuilds the sentence
       list underneath it. */
    function renderBank(testData) {
      const host = document.getElementById('bankHost');
      if (!host) return;
      const allParticles = testData.shuffledParticles || testData.particles;
      host.innerHTML =
        '<div class="reference-bank">' +
          '<div class="bank-title">Particles</div>' +
          '<div class="particle-list">' +
            allParticles.map(particle => {
              const isUsed = isParticleUsed(particle);
              const isSelected = selectedParticle === particle;
              const classes = `particle-chip ${isUsed ? 'used' : ''} ${isSelected ? 'selected' : ''}`;
              const disabled = isUsed || showingResults ? 'disabled' : '';
              return `<button class="${classes}" onclick="handleParticleClick('${particle}')" ${disabled}>${particle}</button>`;
            }).join('') +
          '</div>' +
        '</div>';
    }

    function handleParticleClick(particle) {
      if (showingResults || isParticleUsed(particle)) return;
      selectedParticle = selectedParticle === particle ? null : particle;
      /* Only the bank changes — no sentence is touched by choosing a
         particle. Rebuilding the whole test here reset the scroll position,
         so on item nine a student tapped a particle and was thrown back to
         item one. Redraw the chips and leave the page where it is. */
      renderBank(quizData.tests[currentTest]);
    }

    function handleBlankClick(sentenceIdx) {
      if (showingResults) return;

      if (answers[sentenceIdx]) {
        delete answers[sentenceIdx];
        renderTest();
        updateProgressInfo();
        return;
      }

      if (selectedParticle) {
        answers[sentenceIdx] = selectedParticle;
        selectedParticle = null;
        renderTest();
        updateProgressInfo();
      }
    }

    function isParticleUsed(particle) {
      return Object.values(answers).some(ans => ans === particle);
    }

    function clearAnswers() {
      if (showingResults) return;
      if (confirm('Clear all answers?')) {
        answers = {};
        selectedParticle = null;
        renderTest();
        updateProgressInfo();
      }
    }

    function submitAndScore() {
      if (!quizData || currentTest === null) return;
      
      const testData = quizData.tests[currentTest];
      let correct = 0;
      let total = testData.sentences.length;
      
      testData.sentences.forEach((sentence, idx) => {
        const userAnswer = answers[idx];
        const correctAnswer = sentence.answer;
        if (userAnswer && userAnswer === correctAnswer) {
          correct++;
        }
      });
      
      const percentage = Math.round((correct / total) * 100);
      
      testScores[`test${currentTest}`] = {
        correct,
        total,
        percentage,
        timestamp: new Date().toISOString()
      };
      
      saveProgress();
      
      showingResults = true;
      renderTest();
      
      showModal();
    }

    function showModal() {
      if (currentTest === null || !testScores[`test${currentTest}`]) return;
      
      const score = testScores[`test${currentTest}`];
      const testData = quizData.tests[currentTest];
      
      document.getElementById('modalSubtitle').textContent = testData.title;
      document.getElementById('scoreNumber').textContent = `${score.correct}/${score.total}`;
      document.getElementById('scoreLabel').textContent = `${score.percentage}% Correct`;
      
      const nextBtn = document.getElementById('nextTestBtn');
      if (currentTest < quizData.tests.length - 1) {
        nextBtn.style.display = 'block';
      } else {
        nextBtn.style.display = 'none';
      }
      
      document.getElementById('scoreModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('scoreModal').classList.remove('active');
    }

    function nextTest() {
      closeModal();
      if (currentTest < quizData.tests.length - 1) {
        loadTest(currentTest + 1);
      }
    }

    // MODE NAVIGATION
    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const mode = btn.dataset.mode;
        
        if (mode === 'gapfill') {
          return;
        }
        
        if (window.parent !== window) {
          window.parent.postMessage({ action: 'switchMode', mode: mode }, '*');
        } else {
          window.location.href = `phrasal-verbs-rules.html?mode=${mode}`;
        }
      });
    });

    document.getElementById('scoreModal').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });

    window.addEventListener('load', loadData);
  </script>
</body>
</html>
