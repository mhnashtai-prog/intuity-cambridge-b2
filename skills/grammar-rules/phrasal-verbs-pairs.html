<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTUITY — Pairs</title>
<meta name="theme-color" content="#FAF7F2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@500;700;900&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
  if (window.self !== window.top) document.documentElement.classList.add('embedded');
</script>
  <style>
  /* ═══ PAIRS ═══
     Turn a card, type the missing half. Same material as Rack and Pegs: the
     tile is the same colour as the ground and exists only as light.

     WHAT THE FLIP MEANS HERE. Face down the tile is PRESSED into the board;
     turning it lifts it out. So the depth is not decoration on top of the
     flip — it is the flip. A board mid-game reads as a set of holes with a
     few tiles standing in it, and the number of holes left is the number of
     cards left, with no counter needed.

     The notch is the tile's silhouette on both faces, so a card is the same
     object whichever side is up. */

  *,*::before,*::after{ margin:0; padding:0; box-sizing:border-box; }

  :root{
    --ground:#DFE3E3;
   --tile:114px; --tile-gap:1.5rem;
    --ink:#17171A;
    --dim:#5C6366;
    --faint:#8A9093;
    --rule:#C2956E;
    --caramel:#B0865C;
    --tick:#6B3FA0;
    --cross:#E8632A;
    --ok:#4A6B5C;
    --bad:#B8402A;
    --hot:#B44A22;
    --shade:40,50,54;
    --r:19px;
    --header-h:88px; --foot-h:126px;
    --spring:cubic-bezier(.2,1.4,.4,1);
    --poster:#ECE9E3;
    --poster-ink:#14110E;
    --poster-soft:rgba(20,17,14,.6);
    --poster-faint:rgba(20,17,14,.5);
    --poster-rule:rgba(20,17,14,.2);
    --f-mono2:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  }

  html,body{ height:100%; }
  body{
    background:var(--ground); color:var(--ink);
    font-family:'DM Sans',system-ui,sans-serif; -webkit-font-smoothing:antialiased;
  }
  button{ font:inherit; border:none; background:none; cursor:pointer; color:inherit; }

  html.embedded .top{ display:none; }
  html.embedded .stage{ top:0; }

  /* ── TOP ── */
  .top{
    position:fixed; top:0; left:0; right:0; z-index:20; min-height:var(--header-h);
    display:flex; align-items:center; justify-content:center; gap:1rem;
    padding:.7rem 1rem; background:#FAF7F2;
    border-bottom:1px solid var(--rule);
  }
  .top a{
    position:absolute; left:1rem; text-decoration:none;
    font-family:'Space Grotesk',sans-serif; font-size:.6rem; font-weight:700;
    letter-spacing:.08em; text-transform:uppercase; color:var(--faint);
  }
  .top a:hover{ color:var(--ink); }
  .tally{
    font-family:'DM Mono',monospace; font-size:.7rem; color:var(--faint);
  }
  .tally b{ color:var(--dim); font-weight:500; }

  /* ── THE BOARD ──
     Capped, not stretched: every pixel the screen gains goes into the space
     BETWEEN the tiles rather than into the tiles. */
.stage{
  position:fixed; top:var(--header-h); left:0; right:0; bottom:var(--foot-h);
  display:flex; align-items:center; justify-content:center; padding:1.4rem 1.1rem;
  overflow-y:auto;
}
.board{
  display:grid; grid-template-columns:repeat(3,minmax(0,var(--tile,114px)));
  justify-content:center; align-content:center;
  gap:var(--tile-gap,1.5rem); width:100%; margin:0 auto;
}

  /* ── THE TILE ── */
  .cue{
    position:relative; container-type:inline-size; aspect-ratio:1;
    background:none; padding:0; border:none; perspective:900px;
    transition:transform .14s var(--spring);
  }
  .cue:not(.done):active{ transform:scale(.95); }
  .cue:focus-visible{ outline:2px solid var(--rule); outline-offset:5px; border-radius:var(--r); }

  .inner{
    position:absolute; inset:0; transform-style:preserve-3d;
    transition:transform .55s cubic-bezier(.3,1.1,.35,1);
  }
  .cue.flipped .inner{ transform:rotateY(180deg); }

  /* Face down is pressed in; face up is lifted out. The drop-shadow lives on
     the card rather than the face because a box-shadow would be clipped away
     with the notch, while a chained drop-shadow traces the alpha shape. */
  .back, .front{
    position:absolute; inset:0; border-radius:var(--r); background:var(--ground);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    -webkit-backface-visibility:hidden; backface-visibility:hidden;
    -webkit-mask:radial-gradient(ellipse 14% 14% at 50% 0, transparent 97%, #000 100%);
            mask:radial-gradient(ellipse 14% 14% at 50% 0, transparent 97%, #000 100%);
  }
  .back{
    gap:.2rem; padding-top:7%;
    box-shadow:inset 3px 4px 8px rgba(var(--shade),.22),
               inset -3px -3px 7px rgba(255,255,255,.9);
  }
  .front{ transform:rotateY(180deg); gap:.22rem; padding:14% 9% 10%; }

  /* THE RAISE IS A LAYER BEHIND THE CARD, NOT A FILTER ON IT.
     Two goes at this were wrong. A filter on .cue.flipped flattened the 3D
     mid-turn. Moving it to a .raised class added after the flip flattened it
     afterwards instead — and a flattened preserve-3d with backface-visibility
     on both faces stops painting the face backgrounds, which is why an
     answered card lost its plate completely and left the words lying on the
     board with no tile under them.

     So nothing filters the card. A pseudo-element sits BEHIND the faces with
     the same notch and the same fill, and carries the shadow on its own. It
     is invisible in its own right — the faces cover it exactly — and all you
     see is the shadow it throws. The 3D above it is never touched. */
  .cue::after{
    content:''; position:absolute; inset:0; z-index:0; pointer-events:none;
    border-radius:var(--r); background:var(--ground);
    -webkit-mask:radial-gradient(ellipse 14% 14% at 50% 0, transparent 97%, #000 100%);
            mask:radial-gradient(ellipse 14% 14% at 50% 0, transparent 97%, #000 100%);
    filter:drop-shadow(-3px -3px 5px rgba(255,255,255,.9))
           drop-shadow(3px 4px 7px rgba(var(--shade),.21));
    opacity:0; transition:opacity .2s;
  }
  .cue.raised::after{ opacity:1; }
  .cue.raised .back{ box-shadow:none; }
  .inner{ z-index:1; }

  /* The back carries only its number — a blank plate IS a face-down card,
     and it needs nothing else to say so. The arrow the old back carried was
     an instruction the shape now gives for free. */
  /* The number is what a child sees on nine of nine tiles when the board
     opens, so it is the board's headline — not a label on it. Rack's verbs
     are Anton in ink at this size; a face-down card should read with the
     same weight, or the opening screen looks switched off. */
  .num{
    font-family:'Anton',Impact,sans-serif; font-weight:400;
    font-size:clamp(1.5rem,7vw,2.1rem); letter-spacing:.055em; color:var(--ink);
  }
  .arrow{ display:none; }

  /* ── THE FACE UP SIDE ── */
  .def{
    font-family:'DM Sans',sans-serif; font-size:clamp(.58rem,2.2vw,.68rem);
    line-height:1.3; color:var(--dim); text-align:center;
  }
  .phrase{
    display:flex; flex-direction:column; align-items:center; gap:.06rem;
    text-align:center;
  }
  .phrase .verb{
    font-family:'Anton',Impact,sans-serif; font-weight:400;
    font-size:clamp(.92rem,4.2vw,1.2rem); letter-spacing:.055em; line-height:.98;
    text-transform:uppercase; color:var(--ink);
  }
  .phrase .egg{
    font-family:'Space Grotesk',sans-serif; font-weight:700;
    font-size:clamp(.66rem,2.7vw,.8rem); letter-spacing:.015em; color:var(--caramel);
    border:none; background:none; padding:0;
  }
  .said{
    font-family:'DM Mono',monospace; font-size:.58rem; color:var(--bad);
  }
  .stamp{ display:none; }

  .cue.right .phrase .verb, .cue.lost .phrase .verb{ color:#5A6469; }
  .cue.helped .phrase .egg{ color:var(--faint); }

  /* ── THE MARK ── */
  .mk{
    position:absolute; right:9%; bottom:8%; z-index:2;
    opacity:0; transform:scale(.6); transform-origin:70% 70%;
    transition:opacity .2s .3s, transform .28s .3s var(--spring); pointer-events:none;
  }
  .mk.tick{ width:19%; }
  .mk.cross{ width:17%; }
  .cue.right .mk.tick, .cue.lost .mk.cross{ opacity:1; transform:scale(1); }

  /* ── FOOT ── */
  .foot{
    position:fixed; bottom:0; left:0; right:0; min-height:var(--foot-h);
    display:flex; align-items:center; justify-content:center;
    padding:.9rem 1rem calc(env(safe-area-inset-bottom,0px) + 1.15rem);
    background:var(--ground); border-top:1px solid rgba(var(--shade),.14);
  }
  /* The instruction was a near-black #312C22 box. It is a plain line now —
     the board is quiet enough that it does not need a container to be found. */
  .box{ display:flex; flex-direction:column; gap:.25rem; text-align:center; max-width:26rem; }
  .lab{
    font-family:'DM Mono',monospace; font-size:.56rem; letter-spacing:.14em;
    text-transform:uppercase; color:var(--faint);
  }
  .say{ font-size:.92rem; line-height:1.4; color:var(--dim); }
  .say b{ color:var(--ink); font-weight:700; }

  /* ── THE ANSWER PANEL ──
     Now the poster/paper material shared with Board and Sort: flat cream
     paper, square corners, ink/caramel/mono tokens — not the old rounded
     white dialogue box. */
  .veil{
    position:fixed; inset:0; z-index:40; display:none;
    align-items:center; justify-content:center; padding:1.2rem;
    background:var(--poster);
  }
  .veil.show{ display:flex; }

  .panel{
    position:relative; text-align:left;
    width:min(23rem,92vw); max-height:88vh; overflow-y:auto;
    padding:clamp(1.5rem,5vw,2.3rem) clamp(1.3rem,4.6vw,2rem);
    background:var(--poster); border-radius:0;
    display:flex; flex-direction:column; align-items:stretch; gap:.55rem;
    box-shadow:0 3px 10px rgba(0,0,0,.14);
  }

  /* The kicker: mono, wide-tracked, a solid caramel dash before it — same
     shape as Board's and Sort's .kick. */
  .panel .lab{
    display:flex; align-items:center; gap:9px;
    font-family:var(--f-mono2); font-size:.56rem; letter-spacing:.22em;
    text-transform:uppercase; color:var(--poster-faint); margin-bottom:1.1rem;
  }
  .panel .lab::before{ content:''; display:block; width:26px; height:10px; flex:none; background:var(--caramel); }

  /* The short rule under the headline, as under EVERY DAY. */
  .prule{ width:2.6rem; height:3px; background:var(--poster-ink); border-radius:0;
          margin:.5rem 0 .8rem; }
  #pdef{
    font-size:.78rem; line-height:1.65; color:var(--poster-faint);
    padding-top:.9rem; border-top:1px solid var(--poster-rule);
  }
  /* The panel reuses .phrase, so every tile rule reaches in here too — and
     the tile's type is sized for a 114px square. Each one has to be restated
     at panel size or the answer line renders at board scale inside a sheet
     four times its width. */
  #pphrase{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:flex-start;
    gap:.55rem; flex-direction:row;
  }
  /* Poster scale, as EVERY DAY is. The answer is the thing this sheet is
     about, so it takes the room. */
  #pphrase .verb{
    font-family:'Anton',Impact,sans-serif; font-size:clamp(2rem,9vw,2.8rem);
    letter-spacing:.045em; line-height:.95; text-transform:uppercase; color:var(--poster-ink);
  }
  #pphrase .egg{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:1.3rem;
    letter-spacing:.015em; text-transform:none; color:var(--caramel);
  }
  /* The blank the student is filling: an egg-shaped hollow when it is the
     particle, a plain rule when it is the verb — the same two shapes the
     board uses, so the panel is recognisably the tile enlarged. */
  #pphrase .gap{
    display:inline-block; min-width:3.2em; height:2rem;
    border-bottom:3px dashed var(--poster-rule);
  }
  #pphrase .egg-gap{
    height:1.7rem; min-width:3.2rem; border:none;
    border-radius:50%/38%; background:rgba(176,134,92,.32);
  }
  .gap{
    display:inline-block; min-width:3.2em;
    border-bottom:2px dashed var(--poster-rule);
  }
  .slot{
    font-family:'Anton',Impact,sans-serif; font-size:clamp(1.6rem,7vw,2.2rem);
    letter-spacing:.045em; text-transform:uppercase;
    text-align:left; padding:.1rem .5rem; border:none; border-radius:3px;
    background:rgba(20,17,14,.09); color:var(--poster-ink); outline:none;
    width:8ch; max-width:100%;
  }
  /* The particle is a Space Grotesk word, not a poster verb — the input has
     to match whichever half it is standing in for. */
  .slot.as-egg{
    font-family:'Space Grotesk',sans-serif; font-weight:700; text-transform:none;
    font-size:1.3rem; letter-spacing:.015em; color:var(--caramel); width:7ch;
  }
  .slot:focus{ box-shadow:0 0 0 2px var(--hot); }
  .slot::placeholder{ color:var(--poster-faint); font-weight:500; }

  .pclose{
    position:absolute; top:.6rem; right:.6rem; width:28px; height:28px;
    display:flex; align-items:center; justify-content:center; border-radius:50%;
    background:rgba(20,17,14,.09); color:var(--poster-faint);
    transition:background .15s, transform .1s var(--spring);
  }
  .pclose:hover{ background:rgba(20,17,14,.16); color:var(--poster-ink); }
  .pclose:active{ transform:scale(.92); }

  .hint{
    font-family:'Space Grotesk',sans-serif; font-size:.6rem; font-weight:700;
    letter-spacing:.1em; text-transform:uppercase; color:var(--poster-faint);
    align-self:flex-start; padding:.35rem 0; border-radius:999px; margin-top:.15rem;
  }
  .hint:hover{ color:var(--poster-ink); }
  .hint.gone{ display:none; }
  .letter{ font-family:'DM Mono',monospace; color:var(--hot); }
  .go{
    align-self:flex-start; margin-top:.9rem;
    font-family:'Space Grotesk',sans-serif; font-size:.72rem; font-weight:700;
    padding:.65rem 1.7rem; border-radius:999px; background:var(--hot); color:#FFF7F3;
    transition:transform .1s var(--spring);
  }
  .go:active{ transform:scale(.95); }

  /* ── END ── */
  .over{
    position:fixed; inset:0; z-index:50; display:none;
    flex-direction:column; align-items:center; justify-content:center;
    gap:.6rem; padding:2rem; text-align:center; background:var(--ground);
    overflow-y:auto;
  }
  .over.show{ display:flex; }
  .big{
    font-family:'Anton',Impact,sans-serif; font-weight:400;
    font-size:clamp(2.4rem,12vw,3.6rem); letter-spacing:.03em;
    text-transform:uppercase; color:var(--ink);
  }
  .sub{ font-size:.88rem; color:var(--dim); max-width:22rem; line-height:1.6; }
  .list{
    display:flex; flex-direction:column; gap:.3rem; margin-top:.6rem;
    font-size:.8rem; color:var(--dim); max-width:24rem;
  }
  /* The end screen offered "Deal again" and nothing else — a child who had
     finished a family had no way back to the band without the browser's own
     back button. Rack and Pegs both carry a way out here; this did not. */
  .acts{ display:flex; flex-wrap:wrap; gap:.6rem; justify-content:center; margin-top:1.2rem; }
  .acts .go{ align-self:auto; margin-top:0; }
  .quiet{
    font-family:'Space Grotesk',sans-serif; font-size:.7rem; font-weight:700;
    padding:.65rem 1.3rem; border-radius:999px;
    background:rgba(var(--shade),.08); color:var(--dim);
    transition:transform .1s var(--spring);
  }
  .quiet:hover{ color:var(--ink); }
  .quiet:active{ transform:scale(.95); }
  /* THE WAY OUT, WHEN THERE IS ONE.
     This button did location.href = 'phrasal-verbs-play.html' — from inside
     the host's own iframe, which loaded the host INSIDE ITSELF: two headers
     stacked on one screen, and a landing on Explore because that is the
     host's default mode. Framed, the band above the frame is already the way
     back, so the button has no job and is hidden. Opened on its own it
     navigates the top window, which is what it always meant to do. */
  html.embedded .away{ display:none; }
  .load{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:var(--ground); color:var(--faint); font-size:.86rem; z-index:60;
    text-align:center; line-height:1.7; padding:2rem;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
    .inner{ transition:none; }
  }
</style>
</head>
<body>

<div class="top">
 <a class="back-link" href="#" onclick="history.back();return false;" target="_top">← Grammar</a>
  <span class="tally"><span id="score">0/9</span><span class="sub" id="sub"></span></span>
</div>

<div class="stage"><div class="board" id="board"></div></div>

<div class="foot">
  <div class="box">
    <div class="lab" id="footLab">how to play</div>
    <div class="say" id="footSay">Turn a card, then type the missing <b>verb</b> or <b>particle</b>.</div>
  </div>
</div>

<div class="veil" id="veil">
  <div class="panel" id="panel">
    <!-- The close came first in reading order and the hint sat above the
         question, which read as the panel offering help before it had asked
         anything. Both are corner controls now; the question leads. -->
    <button class="pclose" id="pclose" type="button" aria-label="Close">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
           stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <!-- The rules modal's order, which is the order a reader wants: a quiet
         kicker, the thing itself at full size, a short rule under it, then
         the explanation in small type. It ran kicker, explanation, answer —
         so the definition arrived before there was anything to attach it
         to, and the answer line came last as a footnote. -->
    <div class="lab" id="lab"></div>
    <div class="phrase" id="pphrase"></div>
    <div class="prule" aria-hidden="true"></div>
    <div class="def" id="pdef"></div>
    <div id="help"></div>
    <button class="go" id="check">Check</button>
    <button class="hint" id="hint">hint</button>
  </div>
</div>

<div class="over" id="over">
  <div class="big" id="overBig"></div>
  <div class="sub" id="overSub"></div>
  <div class="list" id="overList"></div>
  <div class="acts">
    <button class="go" onclick="start()">Deal again</button>
    <button class="quiet away" onclick="(window.top || window).location.href='phrasal-verbs-play.html'">Back to phrasal verbs</button>
  </div>
</div>

<script src="intuity-log.js"></script>
<script src="intuity-sound.js"></script>
<script>
/* ======================================================================
   PAIRS — production, not recognition.

   Every other mode puts the answer on screen and asks the child to point
   at it. Here there is nothing to point at: they read a meaning and type
   the missing half from memory.

   Twelve cards, six missing a verb and six missing a particle. Asking
   only for particles would let a child guess from a closed set of about
   a dozen; alternating means they have to hold the whole phrase.

   The blank keeps the shape of what is missing — a dashed slab for a
   verb, a dashed pill for a particle — so nothing needs explaining.
====================================================================== */

const DATA  = 'phrasal-verbs-data.json';
/* Nine, not twelve. At twelve the phone board was two columns and five
   rows, so half of it lived below the fold and a child scrolled a wall of
   identical blanks. Nine is 3x3, one screen, no scrolling.

   Five hide the verb rather than four: a 3x3 checkerboard has five squares
   of one colour and four of the other, so five is what the pattern actually
   asks for. */
const SIZE  = 9;
const VERBS = 5;

/* The face-down mark: a card waiting to be turned. */
/* ARROW retired: the notch says 'turn me' without an icon. */
const ARROW = '';

const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const firstSense = m => String(m).split(';')[0].trim();

/* One way out of the panel, used by the corner close, a tap on the veil and
   Escape — three routes that were each closing it by hand before. */
function shutPanel(){
  $('veil').classList.remove('show');
  open = null;
}
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; };

/* Sound and logging are decoration. Neither is ever allowed to throw and
   take the game down with it — a 404 on a sound file once froze the Rack
   mid-answer, and that must not be possible twice. */
function sfx(cue){ try{ if (window.SFX && typeof SFX[cue] === 'function') SFX[cue](); }catch(e){} }
function log(item, ok, extra){ try{ if (window.INTUITY) INTUITY.log('phrasal-verbs', item, ok, extra); }catch(e){} }

/* Typed input needs forgiving comparison: phones make smart quotes,
   children add spaces and full stops, and case is never the point. */
function norm(s){
  return String(s||'')
    .replace(/[\u2018\u2019\u02BC]/g, "'")
    .toLowerCase().trim()
    .replace(/[.,!?]+$/, '')
    .replace(/\s+/g, ' ');
}

let POOL = [], cards = [], open = null, locked = false, cols = 2;
let right = 0, wrong = 0, helped = 0, missed = [];
let level = 0;              /* 0 none, 1 first letter, 2 the whole list */
let VERB_LIST = [], PART_LIST = [];

/* ── THE SET THE HOST CHOSE ──
   The band above this frame lists the verb families; a tap there reloads
   this page with ?verb=<group id>. Without one we take the whole pool, so
   opening the file directly still works. */
const WANT = new URLSearchParams(location.search).get('verb');
  
  function fitBoard(){
  const stage = document.querySelector('.stage');
  if (!stage) return;
  const cs = getComputedStyle(stage);
  const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
  const padY = parseFloat(cs.paddingTop)  + parseFloat(cs.paddingBottom);
  const availW = stage.clientWidth  - padX;
  const availH = stage.clientHeight - padY;
  const gapPx = 24;
 const maxW = (availW - gapPx*2) / 3;
const maxH = (availH - gapPx*2 - 8) / 3;   // 8px cushion so row 3 never grazes the foot
  let tile = Math.floor(Math.min(maxW, maxH));
  tile = Math.max(95, Math.min(500, tile));
  document.documentElement.style.setProperty('--tile', tile + 'px');
}
window.addEventListener('resize', fitBoard);
window.addEventListener('orientationchange', () => setTimeout(fitBoard, 150));

async function boot(){
  try{
    const res = await fetch(DATA);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const d = await res.json();
    (d.groups||[]).filter(g => !WANT || g.id === WANT)
      .forEach(g => (g.items||[]).forEach(it => {
      if (!it.particle || !it.meaning) return;
      POOL.push({
        verb: String(it.verb || g.id).toLowerCase(),
        particle: String(it.particle).toLowerCase(),
        meaning: it.meaning,
        example: it.example || ''
      });
    }));
    /* A family can be smaller than a board — fall back to the whole pool
       rather than showing an error the child cannot act on. */
    if (POOL.length < SIZE && WANT){
      POOL = [];
      (d.groups||[]).forEach(g => (g.items||[]).forEach(it => {
        if (!it.particle || !it.meaning) return;
        POOL.push({ verb:String(it.verb || g.id).toLowerCase(),
                    particle:String(it.particle).toLowerCase(),
                    meaning:it.meaning, example:it.example || '' });
      }));
    }
    if (POOL.length < SIZE) throw new Error('not enough phrases');
    /* The closed sets behind the game: 21 verbs, 37 particles. Built from
       the data rather than typed out, so they cannot fall out of step. */
    VERB_LIST = [...new Set(POOL.map(p => p.verb))].sort();
    PART_LIST = [...new Set(POOL.map(p => p.particle))].sort();
    start();
  }catch(e){
    $('board').innerHTML = '<p class="load">Could not load <b>' + esc(DATA) + '</b>.<br>' +
      'Open this from the site — browsers block file:// requests.</p>';
  }
}

/* A phrase can be spelled by more than one item. Accept any of them, so a
   right answer is never marked wrong on a technicality. */
function accepted(c){
  const out = new Set();
  POOL.forEach(p => {
    if (c.askVerb){ if (p.particle === c.particle && norm(p.meaning) === norm(c.meaning)) out.add(p.verb); }
    else          { if (p.verb === c.verb && norm(p.meaning) === norm(c.meaning)) out.add(p.particle); }
  });
  out.add(c.askVerb ? c.verb : c.particle);
  return out;
}

function start(){
  const seen = new Set(), picked = [];
  for (const p of shuffle(POOL)){
    if (picked.length === SIZE) break;
    const k = p.verb + ' ' + p.particle;
    if (seen.has(k)) continue;
    seen.add(k); picked.push(p);
  }
  /* The two kinds sit in a fixed checkerboard: a row runs verb, particle,
     verb, particle, and the next row starts on the other foot. The column
     count is decided once per deal and pinned, or the pattern would break
     the moment a phone is turned sideways. */
  cols = 3;                       /* the board is 3x3 at every width */
  const board = $('board');

  const order = shuffle(picked);
  const wantVerb = [];
  for (let i = 0; i < SIZE; i++){
    const row = Math.floor(i / cols), col = i % cols;
    wantVerb.push((row + col) % 2 === 0);
  }
  /* Six of each, so hand the verb slots to the first six and the particle
     slots to the rest — the checkerboard decides position, not proportion. */
  const verbSlots = wantVerb.filter(Boolean).length;
  let vLeft = Math.min(VERBS, verbSlots), pLeft = SIZE - Math.min(VERBS, verbSlots);
  cards = wantVerb.map((wants, i) => {
    let askVerb;
    if (wants && vLeft > 0){ askVerb = true; vLeft--; }
    else if (!wants && pLeft > 0){ askVerb = false; pLeft--; }
    else if (vLeft > 0){ askVerb = true; vLeft--; }
    else { askVerb = false; pLeft--; }
    return { ...order[i], askVerb: askVerb, done:false, got:false };
  });
  right = 0; wrong = 0; helped = 0; missed = []; open = null; locked = false;
  $('over').classList.remove('show');
  $('veil').classList.remove('show');
 fitBoard(); draw(); tally(); say();
requestAnimationFrame(fitBoard);
}

function draw(){
  const b = $('board'); b.innerHTML = '';
  cards.forEach((c, i) => {
    const el = document.createElement('button');
    el.className = 'cue'; el.id = 'c' + i;
    /* Face down, so the label says nothing about what is on it. */
    el.setAttribute('aria-label', 'Card ' + (i + 1) + ', face down');
    /* The marks sit OUTSIDE .inner: inside they would rotate with the face
       and read mirrored on the way round. Both are built in and revealed by
       class, so nothing is constructed at the moment of answering. */
    el.innerHTML =
      '<span class="inner">' +
        '<span class="back"><span class="num">' + (i + 1) + '</span></span>' +
        '<span class="front" id="f' + i + '"></span>' +
      '</span>' + '<svg class="mk tick" viewBox="0 0 24 24" fill="none" stroke="var(--tick)" stroke-width="5.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13.5c2.6 1.4 4.4 3.2 5.8 5.4C11.4 13 15.2 8 21 4.2"/></svg>' + '<svg class="mk cross" viewBox="0 0 24 24" fill="none" stroke="var(--cross)" stroke-width="5.8" stroke-linecap="round"><path d="M5.4 5c4.2 4.2 8.6 9.2 13.4 14.2M18.6 5.4C14.2 9.4 9.6 14.6 5.2 19"/></svg>';
    el.onclick = () => openCard(i);
    b.appendChild(el);
  });
}

/* The card's footer: the half that is there, and a blank shaped like the
   half that is not. */
/* A card is either waiting — with a blank shaped like the half that is
   missing — or turned, in which case it shows the true phrase: black verb,
   egg beneath. The egg's colour comes from the card's state, not from
   which half was typed. */
function face(c, filled){
  const verb = (!c.askVerb || filled)
    ? '<span class="verb">' + esc(c.verb) + '</span>'
    : '<span class="gap"></span>';
  const part = (c.askVerb || filled)
    ? '<span class="egg">' + esc(c.particle) + '</span>'
    : '<span class="gap egg-gap"></span>';
  return verb + part;
}

function tally(){
  $('score').textContent = right + '/' + SIZE;
  say();
  const bits = [];
  if (helped) bits.push(helped + ' helped');
  if (wrong)  bits.push(wrong + ' missed');
  $('sub').textContent = bits.length ? '  ·  ' + bits.join(' · ') : '';
}

/* The box says what to do until something has happened, then what has. */
function say(){
  const done = cards.filter(c => c.done).length;
  const lab = $('footLab'), txt = $('footSay');
  if (!lab || !txt) return;
  if (!done){
    lab.textContent = 'how to play';
    txt.innerHTML = 'Turn a card, then type the missing <b>verb</b> or <b>particle</b>.';
    return;
  }
  const left = SIZE - done;
  lab.textContent = left ? 'keep going' : 'that is the board';
  txt.innerHTML = left
    ? '<b>' + right + '</b> from memory · <b>' + left + '</b> card' + (left === 1 ? '' : 's') + ' left'
    : '<b>' + right + '</b> of ' + SIZE + ' typed from memory';
}

function openCard(i){
  if (locked || cards[i].done) return;
  open = i;
  const c = cards[i];
  $('lab').textContent = c.askVerb ? 'which verb' : 'which particle';
  $('pdef').textContent = firstSense(c.meaning);
  $('pphrase').innerHTML = c.askVerb
    ? '<input class="slot as-verb" id="in" placeholder="" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Type the verb">' +
      '<span class="egg">' + esc(c.particle) + '</span>'
    : '<span class="verb">' + esc(c.verb) + '</span>' +
      '<input class="slot as-egg" id="in" placeholder="" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Type the particle">';
  $('panel').classList.remove('bad');
  level = 0;
  $('help').innerHTML = '';
  $('hint').classList.remove('gone');
  $('hint').textContent = 'hint';
  $('veil').classList.add('show');
  const box = $('in');
  box.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); check(); } });
  box.addEventListener('input', () => box.classList.toggle('typed', box.value.length > 0));
  /* Focused straight away, inside the tap, so a phone keyboard is allowed
     to open — then again on the next frame, since the panel is still
     animating in and some browsers drop a focus set mid-animation. */
  box.focus();
  requestAnimationFrame(() => { if (open === i) box.focus(); });
}

function check(){
  if (open === null || locked) return;
  const c = cards[open], i = open, box = $('in');
  const typed = norm(box.value);
  if (!typed){ box.focus(); return; }
  locked = true;

  const ok = accepted(c).has(typed);
  const want = c.askVerb ? c.verb : c.particle;
  /* helped is logged separately from right/wrong, so October has three
     buckets rather than two: found it, found it with the list, missed it. */
  log(c.verb + ' ' + c.particle, ok,
      { game:'pairs', asked: c.askVerb ? 'verb' : 'particle', helped: !!c.helped, level: level });

  c.done = true; c.got = ok;
  const el = $('c' + i);
  /* Fill the front, then turn the card. It sits face up from here on. */
  $('f' + i).innerHTML =
    '<span class="def">' + esc(firstSense(c.meaning)) + '</span>' +
    '<span class="phrase">' + face(c, true) + '</span>' +
    (ok ? '' : '<span class="said">' + esc(typed) + '</span>' +
                '<span class="stamp">OK</span>');
  el.setAttribute('aria-label', c.verb + ' ' + c.particle + ', ' + (ok ? 'right' : 'missed'));
  el.classList.add('done', 'flipped');
  /* 560ms is the flip's own duration; the raise lands as it settles. */
  setTimeout(() => el.classList.add('raised'), 560);
  el.classList.add(ok ? 'right' : 'lost');
  if (c.helped) el.classList.add('helped');

  if (ok){
    /* Right either way, but a helped card costs the green egg and the
       score — the firework too, since that celebrates something earned. */
    if (c.helped) helped++; else right++;
    sfx('correct');
    $('veil').classList.remove('show');
    open = null; locked = false;
    tally();
    if (!c.helped) setTimeout(() => burst(el), 50);
    if (cards.every(x => x.done)) setTimeout(over, 900);
  } else {
    /* Brief and plain: the wrong sound, the answer in pumpkin, and the
       sentence underneath so the card teaches on its way out. */
    wrong++; missed.push(c);
    sfx('wrong');
    const p = $('panel');
    p.classList.remove('bad'); void p.offsetWidth; p.classList.add('bad');
    $('lab').textContent = 'it was';
    $('pphrase').innerHTML = '<span class="verb">' + esc(c.verb) + '</span>' +
      '<span class="egg">' + esc(c.particle) + '</span>';
    $('pdef').innerHTML = c.example
      ? esc(c.example).replace(/_+/, '<b>' + esc(c.verb + ' ' + c.particle) + '</b>')
      : esc(firstSense(c.meaning));
    el.classList.add('shake');
    setTimeout(() => el.classList.remove('shake'), 460);
    tally();
    setTimeout(() => {
      $('veil').classList.remove('show');
      open = null; locked = false;
      if (cards.every(x => x.done)) setTimeout(over, 500);
    }, 1700);
  }
}

/* A letter, then the list. Either one marks the card as helped: it will
   still be right, still chime, but it will not go green and it will not
   score. Retrieval with a narrowed set is still retrieval — being handed
   the answer is not — so it counts for something, just not for everything. */
function hint(){
  if (open === null || locked) return;
  const c = cards[open];
  c.helped = true;
  level++;
  const want = c.askVerb ? c.verb : c.particle;

  if (level === 1){
    $('help').innerHTML = '<div class="letter">' + esc(want[0]) + '</div>';
    $('hint').textContent = 'list';
    $('in').focus();
    return;
  }

  const words = c.askVerb ? VERB_LIST : PART_LIST;
  const box = document.createElement('div');
  box.className = 'list';
  words.forEach(w => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = w;
    /* Choosing from the list commits: it fills the blank and answers, so
       the list cannot be walked through one word at a time. */
    b.onclick = () => { $('in').value = w; check(); };
    box.appendChild(b);
  });
  $('help').innerHTML = '';
  $('help').appendChild(box);
  $('hint').classList.add('gone');
}
$('hint').addEventListener('click', hint);

$('panel').addEventListener('click', e => {
  const box = $('in');
  if (box && e.target !== box && e.target.id !== 'check' && e.target.id !== 'hint' && e.target.tagName !== 'BUTTON') box.focus();
});
$('check').addEventListener('click', check);
$('veil').addEventListener('click', e => {
  if (e.target === $('veil') && !locked){ shutPanel(); }
});
document.getElementById('pclose').addEventListener('click', () => { if (!locked) shutPanel(); });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !locked){ shutPanel(); }
});

/* ── the firework ─────────────────────────────────────────────────────── */
/* The board's own colours: the two marks, the caramel rule, and the
   palette's sage. The old five were the dark theme's gold and lime. */
const FW = ['#6B3FA0','#E8632A','#C2956E','#4A6B5C','#FFFFFF'];
function burst(el){
  if (!el || !el.getBoundingClientRect) return;
  const r = el.getBoundingClientRect();
  const cx = r.left + r.width/2, cy = r.top + r.height/2;
  for (let i = 0; i < 34; i++){
    const d = document.createElement('div');
    d.className = 'fw';
    const size = 4 + Math.random()*4;
    d.style.cssText = 'background:' + FW[(Math.random()*FW.length)|0] +
      ';left:' + cx + 'px;top:' + cy + 'px;width:' + size + 'px;height:' + size + 'px';
    document.body.appendChild(d);
    const a = Math.random()*Math.PI*2, dist = 45 + Math.random()*120;
    d.animate(
      [{ transform:'translate(-50%,-50%) scale(1)', opacity:1 },
       { transform:'translate(calc(-50% + ' + (Math.cos(a)*dist).toFixed(1) + 'px), calc(-50% + ' + (Math.sin(a)*dist + 40).toFixed(1) + 'px)) scale(.2)', opacity:0 }],
      { duration: 620 + Math.random()*320, easing:'cubic-bezier(.1,.7,.2,1)' }
    ).onfinish = () => d.remove();
  }
}

function over(){
  try{ if (window.INTUITY) INTUITY.session('phrasal-verbs','pairs',{ right:right, wrong:wrong }); }catch(e){}
  $('overBig').textContent = (wrong === 0 && helped === 0) ? 'clean' : right + '/' + SIZE;
  $('overSub').textContent = (wrong === 0 && helped === 0)
    ? 'twelve phrases typed from memory, first time'
    : right + ' from memory' +
      (helped ? ' · ' + helped + ' with help' : '') +
      (wrong ? ' · ' + wrong + ' missed' : '');
  const seen = new Set(), lines = [];
  missed.forEach(c => {
    const k = c.verb + ' ' + c.particle;
    if (seen.has(k)) return;
    seen.add(k);
    lines.push('<b>' + esc(k) + '</b> — ' + esc(firstSense(c.meaning)));
  });
  $('overList').innerHTML = lines.slice(0,6).join('<br>');
  $('over').classList.add('show');
}

if (window.self !== window.top) document.body.classList.add('embedded');
boot();
 
</script>
</body>
