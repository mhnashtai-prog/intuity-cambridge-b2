<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTUITY — Pairs</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@500;600;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{ margin:0; padding:0; box-sizing:border-box; }

  :root{
    /* ── the two lines for the page tone ───────────────────────────────
       --ground is the page, --card is the cue card sitting on it.
       --shade is the card colour darkened heavily, as r,g,b, and tints
       every shadow so the cards sit in the scene rather than on it. */
    --ground:#F0EFEA;
    --card:#EDD5C1;
    --shade:120,96,74;

    --ink:#241F19;
    --ink-soft:rgba(36,31,25,.58);
    --hair:rgba(36,31,25,.14);

    --egg:#61B5ED;        --egg-ink:#0A2438;
    --egg-right:#7FB519;  --egg-right-ink:#16250A;
    --egg-lost:#D96A44;   --egg-lost-ink:#3D1207;

    --cue:#312C22;        /* the active mode tab, composited */
    --gold:#C9A961;
    --r:18px;
    --spring:cubic-bezier(.2,1.4,.4,1);
  }

  body{
    min-height:100vh; background:var(--ground); color:var(--ink);
    font-family:'Space Grotesk',sans-serif;
    padding:.6rem .7rem 1.4rem;
    display:flex; flex-direction:column; align-items:center; gap:.7rem;
    -webkit-text-size-adjust:100%;
  }
  button{ font:inherit; color:inherit; background:none; border:none; cursor:pointer; }

  .top{
    width:100%; max-width:60rem; display:flex; align-items:center;
    justify-content:space-between; font-size:.82rem; color:var(--ink-soft);
  }
  .top a{ color:inherit; text-decoration:none; padding:.2rem .4rem; }
  .tally{ font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums; }
  .tally .sub{ color:var(--ink-soft); font-weight:600; }

  /* ── the board: twelve cue cards ────────────────────────────────────── */
  .board{
    width:100%; max-width:60rem;
    display:grid; grid-template-columns:repeat(2,1fr); gap:.55rem;
  }
  @media(min-width:34rem){ .board{ grid-template-columns:repeat(3,1fr); gap:.7rem; } }
  @media(min-width:52rem){ .board{ grid-template-columns:repeat(4,1fr); } }

  .cue{
    position:relative;
    background:var(--card); border-radius:var(--r);
    box-shadow:3px 5px 12px rgba(var(--shade),.30);
    padding:.7rem .65rem .6rem;
    display:flex; flex-direction:column; gap:.5rem;
    min-height:7.2rem; text-align:left;
    transition:transform .14s var(--spring), box-shadow .14s, opacity .3s;
  }
  .cue:hover:not(.done){ transform:translateY(-3px); box-shadow:4px 7px 16px rgba(var(--shade),.34); }
  .cue:active:not(.done){ transform:translateY(2px) scale(.98); box-shadow:2px 3px 7px rgba(var(--shade),.30); }
  .cue:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }

  .cue .def{
    flex:1; font-size:clamp(.66rem,2.5vw,.78rem); line-height:1.35;
    color:var(--ink); font-weight:500;
  }

  /* the footer: the phrase, with one half missing */
  .cue .phrase{
    display:flex; align-items:center; justify-content:center;
    gap:.35rem; flex-wrap:wrap;
    border-top:1px solid var(--hair); padding-top:.5rem;
  }
  .verb{
    font-family:'Archivo Black',system-ui,sans-serif;
    font-size:clamp(.8rem,3.4vw,1rem); letter-spacing:-.03em;
    color:#000; text-transform:uppercase; line-height:1;
  }
  .egg{
    background:var(--egg); color:var(--egg-ink);
    font-weight:700; font-size:clamp(.6rem,2.4vw,.72rem); line-height:1;
    border-radius:999px; padding:.22rem .6rem .25rem; white-space:nowrap;
  }
  /* the blank keeps the shape of whatever is missing */
  .gap{
    border-bottom:2px dashed rgba(36,31,25,.38);
    min-width:3.1rem; height:1.05rem;
  }
  .gap.egg-gap{
    border:2px dashed rgba(10,36,56,.34); border-radius:999px;
    min-width:3.4rem; height:1.25rem;
  }

  .cue.done{ cursor:default; opacity:.9; }
  .cue.right .fill{ background:var(--egg-right); color:var(--egg-right-ink); }
  .cue.right .fill.as-verb{ background:none; color:#3E5A0C; }
  .cue.lost  .fill{ background:var(--egg-lost); color:var(--egg-lost-ink); }
  .cue.lost  .fill.as-verb{ background:none; color:var(--egg-lost); }
  .cue.shake{ animation:shake .42s; }
  @keyframes shake{ 25%{transform:translateX(-8px)} 60%{transform:translateX(6px)} }

  /* ── the modal ──────────────────────────────────────────────────────── */
  .veil{
    position:fixed; inset:0; z-index:20; display:none;
    align-items:center; justify-content:center; padding:1.2rem;
    background:rgba(36,31,25,.42);
  }
  .veil.show{ display:flex; }
  .panel{
    width:min(22rem,92vw); background:var(--card); border-radius:22px;
    box-shadow:6px 10px 26px rgba(0,0,0,.35);
    padding:1.1rem 1.1rem 1.2rem;
    display:flex; flex-direction:column; align-items:center; gap:.85rem;
    animation:pop .26s var(--spring);
  }
  @keyframes pop{ from{ transform:scale(.92); opacity:0 } to{ transform:none; opacity:1 } }
  .panel.bad{ animation:shake .42s; }

  .panel .lab{
    font-family:'DM Mono',monospace; font-size:.54rem; letter-spacing:.16em;
    text-transform:uppercase; color:var(--gold);
    background:var(--cue); border-radius:999px; padding:.3rem .8rem .32rem;
  }
  .panel .def{ font-size:.92rem; line-height:1.4; text-align:center; font-weight:500; }
  .panel .phrase{ display:flex; align-items:center; gap:.5rem; flex-wrap:wrap; justify-content:center; }
  .panel .verb{ font-size:1.6rem; }
  .panel .egg{ font-size:.95rem; padding:.34rem .9rem .38rem; }

  input.slot{
    font:inherit; text-align:center; border:none; outline:none;
    background:rgba(36,31,25,.09); color:var(--ink); caret-color:var(--egg);
    box-shadow:inset 0 -2px 0 rgba(36,31,25,.3);
  }
  input.slot::placeholder{ color:rgba(36,31,25,.25); }
  input.slot:focus{ background:rgba(97,181,237,.2); box-shadow:inset 0 -2px 0 var(--egg); }
  input.as-verb{
    font-family:'Archivo Black',system-ui,sans-serif; font-size:1.5rem;
    letter-spacing:-.03em; text-transform:uppercase;
    border-radius:.45rem; padding:.1rem .5rem .15rem; width:8rem;
  }
  input.as-egg{
    font-weight:700; font-size:.95rem; border-radius:999px;
    padding:.34rem .8rem .38rem; width:7rem;
  }

  .go{
    background:var(--ground); color:var(--ink); border-radius:999px;
    padding:.55rem 1.7rem; font-weight:700; font-size:.85rem;
    box-shadow:2px 4px 9px rgba(var(--shade),.3);
  }
  .go:active{ transform:translateY(2px) scale(.97); }

  /* ── the end ────────────────────────────────────────────────────────── */
  .over{
    position:fixed; inset:0; z-index:30; display:none;
    flex-direction:column; align-items:center; justify-content:center; gap:.5rem;
    background:var(--ground); padding:2rem; text-align:center;
  }
  .over.show{ display:flex; }
  .over .big{ font-family:'Archivo Black',system-ui; font-size:clamp(2rem,11vw,3rem); }
  .over .sub{ font-size:.9rem; color:var(--ink-soft); max-width:22rem; line-height:1.6; }
  .over .list{ font-size:.82rem; color:var(--ink-soft); line-height:1.95; margin-top:.5rem; }
  .over .list b{ color:var(--ink); font-weight:700; }

  .fw{ position:fixed; border-radius:50%; pointer-events:none; z-index:25; }
  .load{ margin:auto; color:var(--ink-soft); font-size:.86rem; text-align:center; line-height:1.7; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
  }
</style>
</head>
<body>

<div class="top">
  <a href="/?openModal=grammar" aria-label="Back to grammar">&larr;</a>
  <span class="tally"><span id="score">0/12</span><span class="sub" id="sub"></span></span>
</div>

<div class="board" id="board"></div>

<div class="veil" id="veil">
  <div class="panel" id="panel">
    <div class="lab" id="lab"></div>
    <div class="def" id="pdef"></div>
    <div class="phrase" id="pphrase"></div>
    <button class="go" id="check">Check</button>
  </div>
</div>

<div class="over" id="over">
  <div class="big" id="overBig"></div>
  <div class="sub" id="overSub"></div>
  <div class="list" id="overList"></div>
  <button class="go" style="margin-top:1.2rem" onclick="start()">Deal again</button>
</div>

<script src="intuity-log.js"></script>
<script src="intuity-sound.js"></script>
<script>
/* ======================================================================
   PAIRS — production, not recognition.

   Every other mode puts the answer on screen and asks the child to point
   at it. Here there is nothing to point at: they read a meaning and type
   the missing half from memory.

   Twelve cards, six missing a verb and six missing a particle. Asking
   only for particles would let a child guess from a closed set of about
   a dozen; alternating means they have to hold the whole phrase.

   The blank keeps the shape of what is missing — a dashed slab for a
   verb, a dashed pill for a particle — so nothing needs explaining.
====================================================================== */

const DATA  = 'phrasal-verbs-data.json';
const SIZE  = 12;
const VERBS = 6;          /* of the twelve, this many hide the verb */

const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const firstSense = m => String(m).split(';')[0].trim();
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; };

/* Sound and logging are decoration. Neither is ever allowed to throw and
   take the game down with it — a 404 on a sound file once froze the Rack
   mid-answer, and that must not be possible twice. */
function sfx(cue){ try{ if (window.SFX && typeof SFX[cue] === 'function') SFX[cue](); }catch(e){} }
function log(item, ok, extra){ try{ if (window.INTUITY) INTUITY.log('phrasal-verbs', item, ok, extra); }catch(e){} }

/* Typed input needs forgiving comparison: phones make smart quotes,
   children add spaces and full stops, and case is never the point. */
function norm(s){
  return String(s||'')
    .replace(/[\u2018\u2019\u02BC]/g, "'")
    .toLowerCase().trim()
    .replace(/[.,!?]+$/, '')
    .replace(/\s+/g, ' ');
}

let POOL = [], cards = [], open = null, locked = false;
let right = 0, wrong = 0, missed = [];

async function boot(){
  try{
    const res = await fetch(DATA);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const d = await res.json();
    (d.groups||[]).forEach(g => (g.items||[]).forEach(it => {
      if (!it.particle || !it.meaning) return;
      POOL.push({
        verb: String(it.verb || g.id).toLowerCase(),
        particle: String(it.particle).toLowerCase(),
        meaning: it.meaning,
        example: it.example || ''
      });
    }));
    if (POOL.length < SIZE) throw new Error('not enough phrases');
    start();
  }catch(e){
    $('board').innerHTML = '<p class="load">Could not load <b>' + esc(DATA) + '</b>.<br>' +
      'Open this from the site — browsers block file:// requests.</p>';
  }
}

/* A phrase can be spelled by more than one item. Accept any of them, so a
   right answer is never marked wrong on a technicality. */
function accepted(c){
  const out = new Set();
  POOL.forEach(p => {
    if (c.askVerb){ if (p.particle === c.particle && norm(p.meaning) === norm(c.meaning)) out.add(p.verb); }
    else          { if (p.verb === c.verb && norm(p.meaning) === norm(c.meaning)) out.add(p.particle); }
  });
  out.add(c.askVerb ? c.verb : c.particle);
  return out;
}

function start(){
  const seen = new Set(), picked = [];
  for (const p of shuffle(POOL)){
    if (picked.length === SIZE) break;
    const k = p.verb + ' ' + p.particle;
    if (seen.has(k)) continue;
    seen.add(k); picked.push(p);
  }
  /* Exactly six of each, then shuffled, so the two kinds are mixed across
     the board rather than sitting in blocks. */
  cards = shuffle(picked.map((p, i) => ({ ...p, askVerb: i < VERBS, done:false, got:false })));
  right = 0; wrong = 0; missed = []; open = null; locked = false;
  $('over').classList.remove('show');
  $('veil').classList.remove('show');
  draw(); tally();
}

function draw(){
  const b = $('board'); b.innerHTML = '';
  cards.forEach((c, i) => {
    const el = document.createElement('button');
    el.className = 'cue'; el.id = 'c' + i;
    el.setAttribute('aria-label', firstSense(c.meaning) + ', type the missing ' + (c.askVerb ? 'verb' : 'particle'));
    el.innerHTML =
      '<span class="def">' + esc(firstSense(c.meaning)) + '</span>' +
      '<span class="phrase">' + face(c) + '</span>';
    el.onclick = () => openCard(i);
    b.appendChild(el);
  });
}

/* The card's footer: the half that is there, and a blank shaped like the
   half that is not. */
function face(c, filled){
  const verb = c.askVerb
    ? (filled ? '<span class="verb fill as-verb">' + esc(filled) + '</span>' : '<span class="gap"></span>')
    : '<span class="verb">' + esc(c.verb) + '</span>';
  const part = c.askVerb
    ? '<span class="egg">' + esc(c.particle) + '</span>'
    : (filled ? '<span class="egg fill">' + esc(filled) + '</span>' : '<span class="gap egg-gap"></span>');
  return verb + part;
}

function tally(){
  $('score').textContent = right + '/' + SIZE;
  $('sub').textContent = wrong ? '  ·  ' + wrong + ' missed' : '';
}

function openCard(i){
  if (locked || cards[i].done) return;
  open = i;
  const c = cards[i];
  $('lab').textContent = c.askVerb ? 'which verb' : 'which particle';
  $('pdef').textContent = firstSense(c.meaning);
  $('pphrase').innerHTML = c.askVerb
    ? '<input class="slot as-verb" id="in" placeholder="?" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Type the verb">' +
      '<span class="egg">' + esc(c.particle) + '</span>'
    : '<span class="verb">' + esc(c.verb) + '</span>' +
      '<input class="slot as-egg" id="in" placeholder="?" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Type the particle">';
  $('panel').classList.remove('bad');
  $('veil').classList.add('show');
  const box = $('in');
  box.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); check(); } });
  box.focus();
}

function check(){
  if (open === null || locked) return;
  const c = cards[open], i = open, box = $('in');
  const typed = norm(box.value);
  if (!typed){ box.focus(); return; }
  locked = true;

  const ok = accepted(c).has(typed);
  const want = c.askVerb ? c.verb : c.particle;
  log(c.verb + ' ' + c.particle, ok, { game:'pairs', asked: c.askVerb ? 'verb' : 'particle' });

  c.done = true; c.got = ok;
  const el = $('c' + i);
  el.innerHTML = '<span class="def">' + esc(firstSense(c.meaning)) + '</span>' +
                 '<span class="phrase">' + face(c, ok ? typed : want) + '</span>';
  el.classList.add('done');
  el.classList.add(ok ? 'right' : 'lost');

  if (ok){
    right++;
    sfx('correct');
    $('veil').classList.remove('show');
    open = null; locked = false;
    tally();
    setTimeout(() => burst(el), 50);
    if (cards.every(x => x.done)) setTimeout(over, 900);
  } else {
    /* Brief and plain: the wrong sound, the answer in pumpkin, and the
       sentence underneath so the card teaches on its way out. */
    wrong++; missed.push(c);
    sfx('wrong');
    const p = $('panel');
    p.classList.remove('bad'); void p.offsetWidth; p.classList.add('bad');
    $('lab').textContent = 'it was';
    $('pphrase').innerHTML = '<span class="verb">' + esc(c.verb) + '</span>' +
      '<span class="egg" style="background:var(--egg-lost);color:var(--egg-lost-ink)">' + esc(c.particle) + '</span>';
    $('pdef').innerHTML = c.example
      ? esc(c.example).replace(/_+/, '<b>' + esc(c.verb + ' ' + c.particle) + '</b>')
      : esc(firstSense(c.meaning));
    el.classList.add('shake');
    setTimeout(() => el.classList.remove('shake'), 460);
    tally();
    setTimeout(() => {
      $('veil').classList.remove('show');
      open = null; locked = false;
      if (cards.every(x => x.done)) setTimeout(over, 500);
    }, 1700);
  }
}

$('check').addEventListener('click', check);
$('veil').addEventListener('click', e => {
  if (e.target === $('veil') && !locked){ $('veil').classList.remove('show'); open = null; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !locked){ $('veil').classList.remove('show'); open = null; }
});

/* ── the firework ─────────────────────────────────────────────────────── */
const FW = ['#C9A961','#7FB519','#D96A44','#ffffff','#61B5ED'];
function burst(el){
  if (!el || !el.getBoundingClientRect) return;
  const r = el.getBoundingClientRect();
  const cx = r.left + r.width/2, cy = r.top + r.height/2;
  for (let i = 0; i < 34; i++){
    const d = document.createElement('div');
    d.className = 'fw';
    const size = 4 + Math.random()*4;
    d.style.cssText = 'background:' + FW[(Math.random()*FW.length)|0] +
      ';left:' + cx + 'px;top:' + cy + 'px;width:' + size + 'px;height:' + size + 'px';
    document.body.appendChild(d);
    const a = Math.random()*Math.PI*2, dist = 45 + Math.random()*120;
    d.animate(
      [{ transform:'translate(-50%,-50%) scale(1)', opacity:1 },
       { transform:'translate(calc(-50% + ' + (Math.cos(a)*dist).toFixed(1) + 'px), calc(-50% + ' + (Math.sin(a)*dist + 40).toFixed(1) + 'px)) scale(.2)', opacity:0 }],
      { duration: 620 + Math.random()*320, easing:'cubic-bezier(.1,.7,.2,1)' }
    ).onfinish = () => d.remove();
  }
}

function over(){
  try{ if (window.INTUITY) INTUITY.session('phrasal-verbs','pairs',{ right:right, wrong:wrong }); }catch(e){}
  $('overBig').textContent = wrong === 0 ? 'clean' : right + '/' + SIZE;
  $('overSub').textContent = wrong === 0
    ? 'twelve phrases typed from memory, first time'
    : right + ' typed from memory · ' + wrong + ' missed';
  const seen = new Set(), lines = [];
  missed.forEach(c => {
    const k = c.verb + ' ' + c.particle;
    if (seen.has(k)) return;
    seen.add(k);
    lines.push('<b>' + esc(k) + '</b> — ' + esc(firstSense(c.meaning)));
  });
  $('overList').innerHTML = lines.slice(0,6).join('<br>');
  $('over').classList.add('show');
}

boot();
</script>
</body>
</html>
