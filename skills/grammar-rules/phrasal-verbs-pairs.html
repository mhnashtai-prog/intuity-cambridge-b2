<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTUITY — Pairs</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@500;600;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<meta name="theme-color" content="#FAF7F2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Archivo+Black&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=4">
<style>
  *,*::before,*::after{ margin:0; padding:0; box-sizing:border-box; }

  :root{
    /* ── THE CUE CARD, INVERTED ────────────────────────────────────────
       Was a slate card on a warm ground: one flat fill, and a mid-tone one,
       which is why every pill on it had to be taken dark before it could be
       read at all (see the note this replaces).

       It is the forge dial now, turned inside out. Dark on the OUTSIDE as a
       thin rim, a caramel hairline, and the sage filling the middle — so
       twelve of them read as sage on cream rather than twelve black holes,
       and the warm hairline finally separates the two values furthest apart
       in the palette instead of sitting between two neighbours.

       Same four layers and the same percentage insets as the 58px menu disc
       and the 150px forge dial, so this is a third size of one object, not a
       lookalike. Only the outer radius differs: a definition needs a
       rounded rectangle, not a circle. */
    --rim:#2B2129;        /* the outer edge */
    --glow:#C2956E;       /* the hairline between rim and face */
    --card:#9BB6B7;       /* lighter sage, tinted toward blue-grey */
    --panel:#FFFFFF;

    --ground:#FAF7F2;
    --shade:43,33,41;
    --header-h:92px;
    --ink:#2B2129;
    --ink-soft:rgba(43,33,41,.62);
    --hair:rgba(43,33,41,.22);

    /* The egg family survives the move. It was already taken dark for a
       mid-tone card, and sage is a mid-tone card — so the three hues and
       the three meanings carry across untouched. */
    --egg:#14496F;        --egg-ink:#EAF1F7;
    --egg-right:#3C6209;  --egg-right-ink:#EDF4E2;
    --egg-lost:#8A3417;   --egg-lost-ink:#FBEBE3;

    --cue:#2B2129;
    --word:#2B2129;       /* the verb, on sage: 5.1 against the face */
    /* Marigold measured 2.4 on sage and could not carry a 2px outline, so
       the warm note steps down to the palette's own burnt orange, which
       reads at 4.6. The bright warm is still on the card — it is the
       hairline, where it has nothing small to say. */
    --mark:#8A3417;
    --gold:#E5D1B8;
    --r:18px;
    --spring:cubic-bezier(.2,1.4,.4,1);
  }

  /* A fixed-height column, as in Rack and Pegs, rather than a flowing page.
     Nothing scrolls: the row at the top and the box at the foot take what
     they need and the board takes exactly what is left. */
  html,body{ height:100%; overflow:hidden; }
  body{
    background:var(--ground); color:var(--ink);
    font-family:'Space Grotesk',sans-serif;
    padding:.6rem .7rem .7rem;
    display:flex; flex-direction:column; align-items:center; gap:.6rem;
    -webkit-text-size-adjust:100%;
  }

  /* The board is square and centred in whatever height is left over, so a
     card is the same shape on a laptop as on a phone — it simply grows
     until it runs out of height or reaches the 34rem cap. */
  .stage{
  flex:1 1 auto; min-height:0; width:100%;
 margin-top:var(--header-h);
  display:flex; align-items:center; justify-content:center;
}
  button{ font:inherit; color:inherit; background:none; border:none; cursor:pointer; }

  /* Reserved to match the Rack's 92px header, less the gaps and padding
     this page has and that one does not. Between them, this and the 112px
     footer hand the board exactly the height the Rack's board gets, so a
     card is the same size in both games at any window height. */
 
 body.embedded{ --header-h:38px; }
.top{
  position:fixed; top:0; left:0; right:0; z-index:20;
  height:var(--header-h);
  background:var(--ground-deep);
  border-bottom:1px solid rgba(var(--shade),.14);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 .7rem;
  font-size:.82rem; color:var(--ink-soft);
}
  .top a{ color:inherit; text-decoration:none; padding:.2rem .4rem; }
  .tally{ font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums; }
  .tally .sub{ color:var(--ink-soft); font-weight:600; }

  /* ── the board: nine cue disks ──────────────────────────────────────
     Rounded rectangles read as filing cards — dense, edge to edge, closer
     to a form than a game. A disk is a single, whole object with air
     around it on every side, which is what a modern 3x3 board wants: nine
     things to choose between, not nine cells in a sheet.

     The gap widens to match — a card that touches its neighbour on a flat
     edge disappears into the row; a circle needs room to read as separate
     even at rest. */
  .board{
    width:100%;
    /* Copied from the Rack, declaration for declaration. The difference
       that matters is the order the browser resolves: width:100% is a
       definite width, so the board takes its size from the column and the
       ratio gives it its height, which max-height then caps. Driving it
       from the height instead is what let it grow wider than the column
       on a tall phone and push the third card off the edge. */
    display:grid; gap:1.35rem 1.15rem; width:100%; max-width:34rem; height:100%;
    grid-template-columns:repeat(3, 1fr); grid-auto-rows:1fr;
    max-height:100%; aspect-ratio:1; margin:0 auto;
    place-items:center;
  }
  @media(max-width:900px){ .board{ gap:1rem .85rem; } }

  /* ── PHONE: THE SHADOW HAS TO FIT THREE COLUMNS TOO ──────────────────
     The disk shrank and the gap widened for breathing room, but the cast
     shadow did not shrink with it — a 54px blur on a ~118px disk is fine
     with a laptop's width to spare, and is most of the gap between columns
     on a 360px phone. Two neighbours' shadows were overlapping in the
     middle and spilling past the outer columns at the screen edge, which
     is the "flowing over" — not a layout overflow, a shadow one.

     Everything here scales down together: a smaller disk, a tighter (but
     still real) gap, and a shadow stack with the same four-layer falloff
     at roughly two-thirds the spread, so a disk still reads as resting on
     something without its edge reaching its neighbour. */
  @media(max-width:480px){
    .board{ gap:.65rem .5rem; }
    .cue{
      width:min(100%, 5.4rem);
      box-shadow:
        0 1px 2px   rgba(43,33,41,.1),
        0 4px 8px   rgba(43,33,41,.11),
        0 9px 17px  rgba(43,33,41,.12),
        0 16px 28px rgba(43,33,41,.1);
    }
    .cue:hover:not(.done){
      box-shadow:
        0 2px 3px   rgba(43,33,41,.11),
        0 5px 10px  rgba(43,33,41,.12),
        0 11px 20px rgba(43,33,41,.13),
        0 19px 32px rgba(43,33,41,.11);
    }
    .back, .front{
      box-shadow:
        inset 0 2px 0    rgba(255,255,255,.45),
        inset 0 -2px 3px rgba(43,33,41,.22);
    }
  }

  /* A card has two faces and turns between them. Face down it shows only
     an arrow, so a child cannot read twelve definitions and answer by
     elimination — the board becomes a set of choices, not a wall of text. */
  .cue{
    /* The cell still gives every disk equal width and height; the disk
       itself is then drawn as a circle inside that square with
       aspect-ratio:1, so it never has to fight the grid for its shape the
       way a full-bleed card did. */
    position:relative;
    width:min(100%, 7.4rem);
    aspect-ratio:1;
    container-type:inline-size;
    border-radius:50%;
    background:none; padding:0; border:none;
    perspective:900px;
    transition:transform .16s var(--spring), box-shadow .16s var(--spring);
    /* THE DISK'S OWN SHADOW, NOT THE RIM'S.
       A stack of four, each wider and fainter, the same falloff the panel
       uses — a coin resting on a table casts one soft shadow, not a hard
       ring underneath it. This replaces the rim/hairline construction
       entirely: nothing about depth here comes from a coloured edge.
       Deeper than the first pass on every layer, so a smaller disk still
       reads as sitting well off the page rather than merely outlined. */
    box-shadow:
      0 2px 3px   rgba(43,33,41,.11),
      0 6px 14px  rgba(43,33,41,.13),
      0 16px 30px rgba(43,33,41,.14),
      0 30px 54px rgba(43,33,41,.12);
  }
  .cue:hover:not(.done){ transform:translateY(-3px);
    box-shadow:
      0 3px 5px   rgba(43,33,41,.12),
      0 9px 18px  rgba(43,33,41,.14),
      0 20px 36px rgba(43,33,41,.15),
      0 36px 62px rgba(43,33,41,.13);
  }
  .cue:active:not(.done){ transform:translateY(2px) scale(.98); }
  .cue:focus-visible{ outline:2px solid var(--ink); outline-offset:4px; border-radius:50%; }

  .inner{
    position:absolute; inset:0;
    transform-style:preserve-3d;
    transition:transform .55s cubic-bezier(.3,.9,.3,1);
  }
  .cue.flipped .inner{ transform:rotateY(180deg); }

  /* The shadow belongs to the card, not to its two faces. Both faces
     carried one, and two shadows stacked in the same place read as a soft
     halo round every card — cloudy, and slightly inflated. One shadow, on
     the card itself, gives the same crisp edge the Rack has. */
  /* NO RIM. A flat disk, one fill, the same colour edge to edge — the
     layered rim/hairline/face construction is gone. What is left to say
     "this has a thickness" is a thin bright edge along the top and a thin
     dark edge along the bottom, both inset shadows a pixel or two wide:
     the lip of a coin, not a coloured band around it. Everything else
     about depth is the cast shadow on .cue, outside this element
     entirely, so it never flips with the card. */
  .back, .front{
    position:absolute; inset:0;
    border-radius:50%; background:var(--card);
    -webkit-backface-visibility:hidden; backface-visibility:hidden;
    overflow:hidden;
    box-shadow:
      inset 0 3px 0    rgba(255,255,255,.48),
      inset 0 -3px 4px rgba(43,33,41,.24);
  }
  .back > *, .front > *{ position:relative; z-index:2; }
  /* Face down: a big black numeral with the arrow beneath it. The number
     gives every card an identity before it is turned — a child can say
     "seven" rather than "the one in the middle at the bottom" — and it is
     what the board is counted in. */
   .back{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:6%;
  }
  .back .num{
    font-family:'Archivo Black',system-ui,sans-serif;
    font-size:clamp(1.3rem, 15cqi, 2rem); line-height:.86; letter-spacing:-.04em;
    color:var(--word);
  }
  .front{
    transform:rotateY(180deg);
    /* A circle's usable width narrows toward the top and bottom, so the
       front's content is centred both ways and given generous side room
       rather than the rectangle's corner-to-corner padding. */
    padding:18% 14%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:.4rem; text-align:center;
  }
  .cue:hover:not(.done) .inner{ filter:drop-shadow(0 8px 14px rgba(var(--shade),.18)); }

  /* Marigold, the one warm thing on a cool board. */
  .arrow{ width:24%; max-width:1.8rem; opacity:.9; }
  .cue:hover:not(.done) .arrow{ opacity:1; }
  .arrow path, .arrow circle{ stroke:var(--mark); fill:none; stroke-width:2.6;
    stroke-linecap:round; stroke-linejoin:round; }
  .arrow circle{ stroke-width:1.8; opacity:.75; }

  .front .def{
    flex:none; font-size:clamp(.56rem,9cqi,.68rem); line-height:1.28;
    color:var(--ink); font-weight:500;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical;
    overflow:hidden;
  }

  /* the footer: the phrase, with one half missing — inside a circle this
     sits directly under the definition rather than behind a top border,
     since a rule chord across a disk reads as a slice cut out of it. */
  .front .phrase{
    display:flex; align-items:center; justify-content:center;
    gap:.3rem; flex-wrap:wrap;
  }
    /* The verb takes the shell's tab colour, one step deeper. At the strip's
       own #636366 a verb on the slate card reads at 3.6 and looks washed;
       #55555A is the same family of grey and reads at 4.45, which a heavy
       face at this size carries. The type on the game screens and the type
       on the strip above it are now one voice. */
  .verb{
    font-family:'Archivo Black',system-ui,sans-serif;
    font-size:clamp(.62rem,9cqi,.82rem); letter-spacing:-.03em;
    color:var(--word); text-transform:uppercase; line-height:1;
  }
  /* Drawn, not filled — the arrow's own idea. A line ellipse with the word
     inside it in the same colour reads as a thing marked on the card rather
     than a label stuck to it, and it keeps a nine-card board quiet: on a
     slate ground the only ink is the black verb and one warm outline. */
  .egg{
    background:none; color:var(--mark);
    border:2px solid var(--mark);
    font-weight:700; font-size:clamp(.5rem,7.5cqi,.62rem); line-height:1;
    letter-spacing:.02em;
    border-radius:999px; padding:.18rem .5rem .2rem; white-space:nowrap;
  }
  /* the blank keeps the shape of whatever is missing */
  .gap{
    border-bottom:2px dashed rgba(43,33,41,.42);
    min-width:2.6rem; height:.9rem;
  }
  .gap.egg-gap{
    border:2px dashed rgba(43,33,41,.38); border-radius:999px;
    min-width:2.8rem; height:1.05rem;
  }

  .cue.done{ cursor:default; }

  /* A turned card is a reference from here on, so the phrase is always in
     its true dress — black verb, blue egg. Whether the child got it is a
     bar down the edge of the card, never a colour on the word. Pumpkin on
     the answer would say "not this", which is the opposite of the truth. */
  /* THE RIM CARRIES THE STATE; THE FACE NEVER MOVES.
     This was an inset bar down one edge — invisible now that the face is
     laid inside a rim rather than filling the card. It is the rim itself
     that changes colour, which is the dial's own logic: sage sweeps, the
     core sits still. Read across a board, a green-rimmed card and a
     brick-rimmed one are legible at a glance in a way an edge bar never was. */
  .cue.right  .front{ background:var(--egg-right); }
  .cue.lost   .front{ background:var(--egg-lost); }
  /* Helped: settled, correct, but not earned. A quiet bar, not a colour of
     its own — green is for what they found themselves. */
  .cue.helped .front{ background:#55555A; }
  /* Green is the card, not the half the child happened to type. Marking
     only the typed half meant a verb-blank card kept a blue egg while a
     particle-blank card went green — two different pictures for the same
     result. The egg is the state, as everywhere else in the suite. */
  /* Right: the same outline in green. Colour carries the state; the shape
     never changes, so a turned card is always the same object. */
  .cue.right:not(.helped) .egg{ border-color:var(--egg-right); color:var(--egg-right); }

  /* What they typed, kept under the phrase and struck through: a child
     should be able to see the gap between what they wrote and what was
     wanted, not just be told the answer. */
  .said{
    font-size:.54rem; color:var(--egg-lost); text-align:center;
    text-decoration:line-through; opacity:.85; margin-top:-.18rem;
  }

  /* Only on a card they missed. Its job is to say "the phrase printed here
     is the right one" — which a card they got themselves does not need to
     be told. Lands as the flip finishes. Moved from a corner (which a
     circle does not really have) to sit just under the struck-through
     answer, still stamped at an angle. */
  .stamp{
    font-family:'DM Mono',monospace; font-size:.5rem; font-weight:500;
    letter-spacing:.1em;
    color:rgba(43,33,41,.6);
    border:1.5px solid rgba(43,33,41,.4);
    border-radius:.35rem; padding:.06rem .28rem .08rem;
    transform:rotate(-7deg);
    animation:stampIn .34s cubic-bezier(.2,1.6,.4,1) .42s backwards;
  }
  @keyframes stampIn{
    from{ transform:rotate(-22deg) scale(1.9); opacity:0 }
    60%{  transform:rotate(-4deg) scale(.94); opacity:1 }
    to{   transform:rotate(-7deg) scale(1); opacity:1 }
  }
  .cue.shake{ animation:shake .42s; }
  @keyframes shake{ 25%{transform:translateX(-8px)} 60%{transform:translateX(6px)} }

  /* ── the modal ──────────────────────────────────────────────────────── */
  .veil{
    position:fixed; inset:0; z-index:20; display:none;
    align-items:center; justify-content:center; padding:1.2rem;
    background:var(--scrim);
  }
  .veil.show{ display:flex; }
  .panel{
    position:relative;
    width:min(22rem,92vw); background:var(--panel); border-radius:var(--r-sheet);
    box-shadow:0 20px 55px rgba(43,33,41,.16);
    padding:1.1rem 1.1rem 1.2rem;
    display:flex; flex-direction:column; align-items:center; gap:.85rem;
    animation:pop .26s var(--spring);
  }
  @keyframes pop{ from{ transform:scale(.92); opacity:0 } to{ transform:none; opacity:1 } }
  .panel.bad{ animation:shake .42s; }

  /* ── the hint badge ───────────────────────────────────────────────────
     Offered only inside a card the child has already opened, never on the
     board: help should arrive when they are stuck on something specific.
     Graded — a letter first, the whole list only if that is not enough. */
  .hint{
    position:absolute; top:.6rem; right:.7rem;
    font-family:'DM Mono',monospace; font-size:.56rem; letter-spacing:.12em;
    text-transform:uppercase; color:var(--faint);
    border:1.5px solid rgba(43,33,41,.24); border-radius:.4rem;
    padding:.18rem .42rem .2rem;
  }
  .hint:hover{ color:var(--ink); border-color:rgba(43,33,41,.5); }
  .hint.gone{ display:none; }

  .letter{
    font-family:'Archivo Black',system-ui,sans-serif; font-size:1.1rem;
    color:var(--ink); letter-spacing:.3em; text-transform:uppercase;
    opacity:.75;
  }
  .list{
    display:flex; flex-wrap:wrap; gap:.3rem; justify-content:center;
    max-height:8.4rem; overflow-y:auto; padding:.15rem;
  }
  .list button{
    font-size:.72rem; font-weight:700; border-radius:999px;
    padding:.24rem .6rem .28rem;
    background:var(--tile-bg); color:var(--tile-ink);
  }
  .list button:hover{ background:none; color:var(--mark); box-shadow:inset 0 0 0 2px var(--mark); }
  .list button:active{ transform:scale(.94); }

  .panel .lab{
    font-family:'DM Mono',monospace; font-size:.54rem; letter-spacing:.16em;
    text-transform:uppercase; color:var(--gold);
    background:var(--cue); border-radius:999px; padding:.3rem .8rem .32rem;
  }
  .panel .def{ font-size:.92rem; line-height:1.4; text-align:center; font-weight:500; }
  .panel .phrase{ display:flex; align-items:center; gap:.5rem; flex-wrap:wrap; justify-content:center; }
  .panel .verb{ font-size:1.6rem; }
  .panel .egg{ font-size:.95rem; padding:.32rem .92rem .36rem; border-width:2.4px; }

  input.slot{
    font:inherit; text-align:center; border:none; outline:none;
    background:var(--slot-bg); color:var(--typed); caret-color:var(--accent);
    box-shadow:inset 0 -2px 0 rgba(43,33,41,.3);
  }
  input.slot::placeholder{ color:var(--faint); }
  input.slot:focus{ background:rgba(97,181,237,.2); box-shadow:inset 0 -2px 0 var(--egg); }

  /* The field is focused the moment the panel opens, but a native caret in
     an empty box reads as a form sitting still. While it is empty the rule
     under it blinks, so the blank itself says "type here". The blink stops
     on the first keystroke, when it has done its job. */
  input.slot:focus:not(.typed){ animation:caret 1.06s steps(1) infinite; }
  @keyframes caret{
    0%,49%  { box-shadow:inset 0 -3px 0 var(--egg); }
    50%,100%{ box-shadow:inset 0 -3px 0 rgba(97,181,237,.12); }
  }
  input.as-verb{
    font-family:'Archivo Black',system-ui,sans-serif; font-size:1.5rem;
    letter-spacing:-.03em; text-transform:uppercase;
    border-radius:.45rem; padding:.1rem .5rem .15rem; width:8rem;
  }
  input.as-egg{
    font-weight:700; font-size:.95rem; border-radius:999px;
    padding:.32rem .8rem .36rem; width:7rem;
    box-shadow:inset 0 0 0 2px rgba(43,33,41,.24);
  }
  input.as-egg:focus{ box-shadow:inset 0 0 0 2px var(--mark); background:rgba(228,97,28,.10); }

  .go{
    background:var(--accent); color:#FFF7F3; border-radius:var(--r-chip);
    padding:.55rem 1.7rem; font-weight:700; font-size:.85rem;
  }
  .go:active{ transform:translateY(2px) scale(.97); }

  /* ── the end ────────────────────────────────────────────────────────── */
  .over{
    position:fixed; inset:0; z-index:30; display:none;
    flex-direction:column; align-items:center; justify-content:center; gap:.5rem;
    background:var(--screen); padding:2rem; text-align:center;
  }
  .over.show{ display:flex; }
  .over .big{ font-family:'Archivo Black',system-ui; font-size:clamp(2rem,11vw,3rem); }
  .over .sub{ font-size:.9rem; color:var(--ink-soft); max-width:22rem; line-height:1.6; }
  .over .list{ font-size:.82rem; color:var(--ink-soft); line-height:1.95; margin-top:.5rem; }
  .over .list b{ color:var(--ink); font-weight:700; }

  /* ── the footer box ──────────────────────────────────────────────────
     Borrowed from the Rack, and for the same reason: it is the mode tab's
     own colour, so the button a child pressed and the thing it tells them
     are visibly one object. On the Rack it carries the definition; here
     there is no definition until a card is opened, so it carries the
     instruction — and then reports where the round stands. */
  /* The same height the Rack reserves for its own footer — 112px, which
     there holds the definition box AND the Skip button. Pairs' box is only
     about 52px, so the board was handed 60px more height to fill; both
     boards are capped at the same 34rem width, so every one of that 60px
     went into the card rows. Same width, more height: the cards looked
     inflated next to the Rack's even though nothing about them differed. */
  .foot{
    flex:none; width:100%; max-width:34rem; margin:0 auto;
    min-height:112px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:.5rem;
  }
  /* NO BOX. The dark card was the rim's own colour carried into the
     footer, which made sense when the board itself was dark-rimmed cards —
     now that the board is flat sage disks, a black slab underneath reads
     as a leftover, not a match. This is plain text on the page's own
     ground, the way Explore states a phrase: quiet label above, a normal
     sentence below.

     What still needs marking is which word is the point — "verb" or
     "particle" in the instructions, the phrase itself once a card is
     scored. Explore's own answer is a pale grey egg behind the word rather
     than a colour on it: the mark is a shape, not a change of ink, so the
     sentence stays legible as one voice throughout. */
  .box{
    background:none; box-shadow:none; border:none;
    padding:0; display:flex; flex-direction:column; align-items:center;
    gap:.3rem; text-align:center;
  }
  .box .lab{
    font-family:'DM Mono',monospace; font-size:.58rem; letter-spacing:.16em;
    text-transform:uppercase; color:var(--ink-soft);
  }
  .box .say{ font-size:clamp(.88rem,3.4vw,1.02rem); line-height:1.4; color:var(--ink); font-weight:500; }
  .box .say b{
    background:#ECE6D9; color:var(--ink); font-weight:700;
    border-radius:999px; padding:.14rem .55rem .17rem; white-space:nowrap;
  }

  .fw{ position:fixed; border-radius:50%; pointer-events:none; z-index:25; }
  .load{ margin:auto; color:var(--ink-soft); font-size:.86rem; text-align:center; line-height:1.7; }
 
   @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
  }

  /* Matches Rack: when the shell embeds this page in its own iframe, the
     shell already shows the INTUITY title and the mode tabs, so this
     page's own back-arrow and tally row shrink down to just their
     content height instead of claiming a full header's worth of space. */
  body.embedded .top{ min-height:1.6rem; }
  body.embedded .top a{ display:none; }
</style>
</head>
<body>

<div class="top">
  <a href="/?openModal=grammar" aria-label="Back to grammar">&larr;</a>
  <span class="tally"><span id="score">0/12</span><span class="sub" id="sub"></span></span>
</div>

<div class="stage"><div class="board" id="board"></div></div>

<div class="foot">
  <div class="box">
    <div class="lab" id="footLab">how to play</div>
    <div class="say" id="footSay">Turn a card, then type the missing <b>verb</b> or <b>particle</b>.</div>
  </div>
</div>

<div class="veil" id="veil">
  <div class="panel" id="panel">
    <button class="hint" id="hint">hint</button>
    <div class="lab" id="lab"></div>
    <div class="def" id="pdef"></div>
    <div class="phrase" id="pphrase"></div>
    <div id="help"></div>
    <button class="go" id="check">Check</button>
  </div>
</div>

<div class="over" id="over">
  <div class="big" id="overBig"></div>
  <div class="sub" id="overSub"></div>
  <div class="list" id="overList"></div>
  <button class="go" style="margin-top:1.2rem" onclick="start()">Deal again</button>
</div>

<script src="intuity-log.js"></script>
<script src="intuity-sound.js"></script>
<script>
/* ======================================================================
   PAIRS — production, not recognition.

   Every other mode puts the answer on screen and asks the child to point
   at it. Here there is nothing to point at: they read a meaning and type
   the missing half from memory.

   Twelve cards, six missing a verb and six missing a particle. Asking
   only for particles would let a child guess from a closed set of about
   a dozen; alternating means they have to hold the whole phrase.

   The blank keeps the shape of what is missing — a dashed slab for a
   verb, a dashed pill for a particle — so nothing needs explaining.
====================================================================== */

const DATA  = 'phrasal-verbs-data.json';
/* Nine, not twelve. At twelve the phone board was two columns and five
   rows, so half of it lived below the fold and a child scrolled a wall of
   identical blanks. Nine is 3x3, one screen, no scrolling.

   Five hide the verb rather than four: a 3x3 checkerboard has five squares
   of one colour and four of the other, so five is what the pattern actually
   asks for. */
const SIZE  = 9;
const VERBS = 5;

/* The face-down mark: a card waiting to be turned. */
const ARROW =
  '<svg class="arrow" viewBox="0 0 48 48" aria-hidden="true">' +
    '<circle cx="24" cy="24" r="20"></circle>' +
    '<path d="M16 24h16"></path>' +
    '<path d="M25 17l7 7-7 7"></path>' +
  '</svg>';

const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const firstSense = m => String(m).split(';')[0].trim();
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; };

/* Sound and logging are decoration. Neither is ever allowed to throw and
   take the game down with it — a 404 on a sound file once froze the Rack
   mid-answer, and that must not be possible twice. */
function sfx(cue){ try{ if (window.SFX && typeof SFX[cue] === 'function') SFX[cue](); }catch(e){} }
function log(item, ok, extra){ try{ if (window.INTUITY) INTUITY.log('phrasal-verbs', item, ok, extra); }catch(e){} }

/* Typed input needs forgiving comparison: phones make smart quotes,
   children add spaces and full stops, and case is never the point. */
function norm(s){
  return String(s||'')
    .replace(/[\u2018\u2019\u02BC]/g, "'")
    .toLowerCase().trim()
    .replace(/[.,!?]+$/, '')
    .replace(/\s+/g, ' ');
}

let POOL = [], cards = [], open = null, locked = false, cols = 2;
let right = 0, wrong = 0, helped = 0, missed = [];
let level = 0;              /* 0 none, 1 first letter, 2 the whole list */
let VERB_LIST = [], PART_LIST = [];

async function boot(){
  try{
    const res = await fetch(DATA);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const d = await res.json();
    (d.groups||[]).forEach(g => (g.items||[]).forEach(it => {
      if (!it.particle || !it.meaning) return;
      POOL.push({
        verb: String(it.verb || g.id).toLowerCase(),
        particle: String(it.particle).toLowerCase(),
        meaning: it.meaning,
        example: it.example || ''
      });
    }));
    if (POOL.length < SIZE) throw new Error('not enough phrases');
    /* The closed sets behind the game: 21 verbs, 37 particles. Built from
       the data rather than typed out, so they cannot fall out of step. */
    VERB_LIST = [...new Set(POOL.map(p => p.verb))].sort();
    PART_LIST = [...new Set(POOL.map(p => p.particle))].sort();
    start();
  }catch(e){
    $('board').innerHTML = '<p class="load">Could not load <b>' + esc(DATA) + '</b>.<br>' +
      'Open this from the site — browsers block file:// requests.</p>';
  }
}

/* A phrase can be spelled by more than one item. Accept any of them, so a
   right answer is never marked wrong on a technicality. */
function accepted(c){
  const out = new Set();
  POOL.forEach(p => {
    if (c.askVerb){ if (p.particle === c.particle && norm(p.meaning) === norm(c.meaning)) out.add(p.verb); }
    else          { if (p.verb === c.verb && norm(p.meaning) === norm(c.meaning)) out.add(p.particle); }
  });
  out.add(c.askVerb ? c.verb : c.particle);
  return out;
}

function start(){
  const seen = new Set(), picked = [];
  for (const p of shuffle(POOL)){
    if (picked.length === SIZE) break;
    const k = p.verb + ' ' + p.particle;
    if (seen.has(k)) continue;
    seen.add(k); picked.push(p);
  }
  /* The two kinds sit in a fixed checkerboard: a row runs verb, particle,
     verb, particle, and the next row starts on the other foot. The column
     count is decided once per deal and pinned, or the pattern would break
     the moment a phone is turned sideways. */
  cols = 3;                       /* the board is 3x3 at every width */
  const board = $('board');
  board.style.gridTemplateColumns = 'repeat(' + cols + ',1fr)';

  const order = shuffle(picked);
  const wantVerb = [];
  for (let i = 0; i < SIZE; i++){
    const row = Math.floor(i / cols), col = i % cols;
    wantVerb.push((row + col) % 2 === 0);
  }
  /* Six of each, so hand the verb slots to the first six and the particle
     slots to the rest — the checkerboard decides position, not proportion. */
  const verbSlots = wantVerb.filter(Boolean).length;
  let vLeft = Math.min(VERBS, verbSlots), pLeft = SIZE - Math.min(VERBS, verbSlots);
  cards = wantVerb.map((wants, i) => {
    let askVerb;
    if (wants && vLeft > 0){ askVerb = true; vLeft--; }
    else if (!wants && pLeft > 0){ askVerb = false; pLeft--; }
    else if (vLeft > 0){ askVerb = true; vLeft--; }
    else { askVerb = false; pLeft--; }
    return { ...order[i], askVerb: askVerb, done:false, got:false };
  });
  right = 0; wrong = 0; helped = 0; missed = []; open = null; locked = false;
  $('over').classList.remove('show');
  $('veil').classList.remove('show');
  draw(); tally(); say();
}

function draw(){
  const b = $('board'); b.innerHTML = '';
  cards.forEach((c, i) => {
    const el = document.createElement('button');
    el.className = 'cue'; el.id = 'c' + i;
    /* Face down, so the label says nothing about what is on it. */
    el.setAttribute('aria-label', 'Card ' + (i + 1) + ', face down');
    el.innerHTML =
      '<span class="inner">' +
        '<span class="back"><span class="num">' + (i + 1) + '</span>' + ARROW + '</span>' +
        '<span class="front" id="f' + i + '"></span>' +
      '</span>';
    el.onclick = () => openCard(i);
    b.appendChild(el);
  });
}

/* The card's footer: the half that is there, and a blank shaped like the
   half that is not. */
/* A card is either waiting — with a blank shaped like the half that is
   missing — or turned, in which case it shows the true phrase: black verb,
   egg beneath. The egg's colour comes from the card's state, not from
   which half was typed. */
function face(c, filled){
  const verb = (!c.askVerb || filled)
    ? '<span class="verb">' + esc(c.verb) + '</span>'
    : '<span class="gap"></span>';
  const part = (c.askVerb || filled)
    ? '<span class="egg">' + esc(c.particle) + '</span>'
    : '<span class="gap egg-gap"></span>';
  return verb + part;
}

function tally(){
  $('score').textContent = right + '/' + SIZE;
  say();
  const bits = [];
  if (helped) bits.push(helped + ' helped');
  if (wrong)  bits.push(wrong + ' missed');
  $('sub').textContent = bits.length ? '  ·  ' + bits.join(' · ') : '';
}

/* The box says what to do until something has happened, then what has. */
function say(){
  const done = cards.filter(c => c.done).length;
  const lab = $('footLab'), txt = $('footSay');
  if (!lab || !txt) return;
  if (!done){
    lab.textContent = 'how to play';
    txt.innerHTML = 'Turn a card, then type the missing <b>verb</b> or <b>particle</b>.';
    return;
  }
  const left = SIZE - done;
  lab.textContent = left ? 'keep going' : 'that is the board';
  txt.innerHTML = left
    ? '<b>' + right + '</b> from memory · <b>' + left + '</b> card' + (left === 1 ? '' : 's') + ' left'
    : '<b>' + right + '</b> of ' + SIZE + ' typed from memory';
}

function openCard(i){
  if (locked || cards[i].done) return;
  open = i;
  const c = cards[i];
  $('lab').textContent = c.askVerb ? 'which verb' : 'which particle';
  $('pdef').textContent = firstSense(c.meaning);
  $('pphrase').innerHTML = c.askVerb
    ? '<input class="slot as-verb" id="in" placeholder="" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Type the verb">' +
      '<span class="egg">' + esc(c.particle) + '</span>'
    : '<span class="verb">' + esc(c.verb) + '</span>' +
      '<input class="slot as-egg" id="in" placeholder="" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Type the particle">';
  $('panel').classList.remove('bad');
  level = 0;
  $('help').innerHTML = '';
  $('hint').classList.remove('gone');
  $('hint').textContent = 'hint';
  $('veil').classList.add('show');
  const box = $('in');
  box.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); check(); } });
  box.addEventListener('input', () => box.classList.toggle('typed', box.value.length > 0));
  /* Focused straight away, inside the tap, so a phone keyboard is allowed
     to open — then again on the next frame, since the panel is still
     animating in and some browsers drop a focus set mid-animation. */
  box.focus();
  requestAnimationFrame(() => { if (open === i) box.focus(); });
}

function check(){
  if (open === null || locked) return;
  const c = cards[open], i = open, box = $('in');
  const typed = norm(box.value);
  if (!typed){ box.focus(); return; }
  locked = true;

  const ok = accepted(c).has(typed);
  const want = c.askVerb ? c.verb : c.particle;
  /* helped is logged separately from right/wrong, so October has three
     buckets rather than two: found it, found it with the list, missed it. */
  log(c.verb + ' ' + c.particle, ok,
      { game:'pairs', asked: c.askVerb ? 'verb' : 'particle', helped: !!c.helped, level: level });

  c.done = true; c.got = ok;
  const el = $('c' + i);
  /* Fill the front, then turn the card. It sits face up from here on. */
  $('f' + i).innerHTML =
    '<span class="def">' + esc(firstSense(c.meaning)) + '</span>' +
    '<span class="phrase">' + face(c, true) + '</span>' +
    (ok ? '' : '<span class="said">' + esc(typed) + '</span>' +
                '<span class="stamp">OK</span>');
  el.setAttribute('aria-label', c.verb + ' ' + c.particle + ', ' + (ok ? 'right' : 'missed'));
  el.classList.add('done', 'flipped');
  el.classList.add(ok ? 'right' : 'lost');
  if (c.helped) el.classList.add('helped');

  if (ok){
    /* Right either way, but a helped card costs the green egg and the
       score — the firework too, since that celebrates something earned. */
    if (c.helped) helped++; else right++;
    sfx('correct');
    $('veil').classList.remove('show');
    open = null; locked = false;
    tally();
    if (!c.helped) setTimeout(() => burst(el), 50);
    if (cards.every(x => x.done)) setTimeout(over, 900);
  } else {
    /* Brief and plain: the wrong sound, the answer in pumpkin, and the
       sentence underneath so the card teaches on its way out. */
    wrong++; missed.push(c);
    sfx('wrong');
    const p = $('panel');
    p.classList.remove('bad'); void p.offsetWidth; p.classList.add('bad');
    $('lab').textContent = 'it was';
    $('pphrase').innerHTML = '<span class="verb">' + esc(c.verb) + '</span>' +
      '<span class="egg">' + esc(c.particle) + '</span>';
    $('pdef').innerHTML = c.example
      ? esc(c.example).replace(/_+/, '<b>' + esc(c.verb + ' ' + c.particle) + '</b>')
      : esc(firstSense(c.meaning));
    el.classList.add('shake');
    setTimeout(() => el.classList.remove('shake'), 460);
    tally();
    setTimeout(() => {
      $('veil').classList.remove('show');
      open = null; locked = false;
      if (cards.every(x => x.done)) setTimeout(over, 500);
    }, 1700);
  }
}

/* A letter, then the list. Either one marks the card as helped: it will
   still be right, still chime, but it will not go green and it will not
   score. Retrieval with a narrowed set is still retrieval — being handed
   the answer is not — so it counts for something, just not for everything. */
function hint(){
  if (open === null || locked) return;
  const c = cards[open];
  c.helped = true;
  level++;
  const want = c.askVerb ? c.verb : c.particle;

  if (level === 1){
    $('help').innerHTML = '<div class="letter">' + esc(want[0]) + '</div>';
    $('hint').textContent = 'list';
    $('in').focus();
    return;
  }

  const words = c.askVerb ? VERB_LIST : PART_LIST;
  const box = document.createElement('div');
  box.className = 'list';
  words.forEach(w => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = w;
    /* Choosing from the list commits: it fills the blank and answers, so
       the list cannot be walked through one word at a time. */
    b.onclick = () => { $('in').value = w; check(); };
    box.appendChild(b);
  });
  $('help').innerHTML = '';
  $('help').appendChild(box);
  $('hint').classList.add('gone');
}
$('hint').addEventListener('click', hint);

$('panel').addEventListener('click', e => {
  const box = $('in');
  if (box && e.target !== box && e.target.id !== 'check' && e.target.id !== 'hint' && e.target.tagName !== 'BUTTON') box.focus();
});
$('check').addEventListener('click', check);
$('veil').addEventListener('click', e => {
  if (e.target === $('veil') && !locked){ $('veil').classList.remove('show'); open = null; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !locked){ $('veil').classList.remove('show'); open = null; }
});

/* ── the firework ─────────────────────────────────────────────────────── */
const FW = ['#F26430','#708A81','#C2956E','#E5D1B8','#DD8E58'];
function burst(el){
  if (!el || !el.getBoundingClientRect) return;
  const r = el.getBoundingClientRect();
  const cx = r.left + r.width/2, cy = r.top + r.height/2;
  for (let i = 0; i < 34; i++){
    const d = document.createElement('div');
    d.className = 'fw';
    const size = 4 + Math.random()*4;
    d.style.cssText = 'background:' + FW[(Math.random()*FW.length)|0] +
      ';left:' + cx + 'px;top:' + cy + 'px;width:' + size + 'px;height:' + size + 'px';
    document.body.appendChild(d);
    const a = Math.random()*Math.PI*2, dist = 45 + Math.random()*120;
    d.animate(
      [{ transform:'translate(-50%,-50%) scale(1)', opacity:1 },
       { transform:'translate(calc(-50% + ' + (Math.cos(a)*dist).toFixed(1) + 'px), calc(-50% + ' + (Math.sin(a)*dist + 40).toFixed(1) + 'px)) scale(.2)', opacity:0 }],
      { duration: 620 + Math.random()*320, easing:'cubic-bezier(.1,.7,.2,1)' }
    ).onfinish = () => d.remove();
  }
}

function over(){
  try{ if (window.INTUITY) INTUITY.session('phrasal-verbs','pairs',{ right:right, wrong:wrong }); }catch(e){}
  $('overBig').textContent = (wrong === 0 && helped === 0) ? 'clean' : right + '/' + SIZE;
  $('overSub').textContent = (wrong === 0 && helped === 0)
    ? 'twelve phrases typed from memory, first time'
    : right + ' from memory' +
      (helped ? ' · ' + helped + ' with help' : '') +
      (wrong ? ' · ' + wrong + ' missed' : '');
  const seen = new Set(), lines = [];
  missed.forEach(c => {
    const k = c.verb + ' ' + c.particle;
    if (seen.has(k)) return;
    seen.add(k);
    lines.push('<b>' + esc(k) + '</b> — ' + esc(firstSense(c.meaning)));
  });
  $('overList').innerHTML = lines.slice(0,6).join('<br>');
  $('over').classList.add('show');
}

if (window.self !== window.top) document.body.classList.add('embedded');
boot();
 
</script>
</body>
</html>
