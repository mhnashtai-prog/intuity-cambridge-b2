<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTUITY — Pegs</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{ margin:0; padding:0; box-sizing:border-box; }
  :root{
    --gold:#C9A961; --accent:#FFD94A; --ok:#3f9d6d; --bad:#E86A5C;
    --ink:#26251F;
    --word:#55555A;          /* the verb: the shell's tab grey, deeper */
    --egg-free:#637372;      /* in the bank, waiting */
    --egg-right:#7FB519;     /* placed correctly — leaf */
    --egg-lost:#D96A44;      /* the card that could not be finished */
    --egg-word:rgba(0,0,0,.9);      /* the particle in the bank: near-black */
    --plate:#2c4a9e;
    /* the disc: stone, not oat — one step darker at the floor of the well,
       no rim, no gradient. The stage behind it is a 93% off-white, so the
       card is the coloured object and the page is the near-blank table it
       sits on, the inverse of the first pass. */
    --disc:#C0CAD2; --disc-floor:#B0BAC2;
    --shade:70,78,86;
    --bg:#EAE4E1;
    --paper:#e5e5e7; --dim:rgba(229,229,231,.55); --faint:rgba(229,229,231,.26);
    --header-h:96px; --bank-h:92px;
  }
  html,body{ width:100%; height:100%; overflow:hidden; background:var(--bg); }
  body{ font-family:'DM Sans',sans-serif; color:var(--paper); user-select:none; -webkit-user-select:none; }
  button{ font:inherit; color:inherit; background:none; border:none; cursor:pointer; }

  .header{
    position:fixed; top:0; left:0; right:0; z-index:20; height:var(--header-h);
    display:flex; flex-direction:column; gap:.35rem; padding:.5rem 1.25rem .4rem;
    background:rgba(13,13,13,.9); backdrop-filter:blur(20px);
    border-bottom:1px solid rgba(255,255,255,.06);
  }
  .htop{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; }
  .back{ justify-self:start; text-decoration:none; font-family:'Space Grotesk',sans-serif;
         font-size:.6rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:rgba(255,255,255,.3); }
  .title{ display:flex; flex-direction:column; align-items:center; line-height:1.1; }
  .title b{ font-family:'Space Grotesk',sans-serif; font-size:1rem; font-weight:900; letter-spacing:.22em; color:var(--gold); }
  .title span{ font-size:.56rem; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:rgba(255,255,255,.32); margin-top:.1rem; }
  .hud{ display:flex; justify-content:center; gap:1.3rem; font-family:'DM Mono',monospace; font-size:.66rem; color:var(--dim); }
  .hud b{ color:var(--paper); font-variant-numeric:tabular-nums; }

  .stage{
    position:fixed; top:var(--header-h); left:0; right:0; bottom:var(--bank-h);
    overflow:hidden; padding:.5rem .6rem;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg);
  }
  .poles{
    display:grid; grid-template-columns:repeat(3,1fr); grid-auto-rows:1fr;
    gap:.85rem; width:100%; max-width:46rem; height:100%;
  }

  /* ── a pole, now the same disc as Descent's candidate cards: a flat
     warm-oat slab, corners rounded 20px, no border, all the depth carried
     by a cast shadow rather than a gradient across the face. ── */
  .pole{
    position:relative; min-height:0; overflow:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    gap:0; padding:.6rem .6rem .55rem; border-radius:20px; text-align:center;
    background:var(--disc);
    box-shadow:4px 6px 13px rgba(var(--shade),.32);
    transition:transform .14s cubic-bezier(.2,1.4,.4,1), box-shadow .18s;
  }

  .pole.armed{ cursor:pointer;
    box-shadow:4px 6px 13px rgba(var(--shade),.32), 0 0 0 3px rgba(44,74,158,.45); }
  .pole.armed:hover{ transform:translateY(-4px) rotate(-.5deg);
    box-shadow:5px 9px 18px rgba(var(--shade),.4), 0 0 0 3px rgba(44,74,158,.5); }
  .pole.armed .spike::before{ background:var(--plate); height:4px; }
  /* The verb takes the shell's tab colour, one step deeper — the same
     grey as Rack and Pairs, so all three read in one voice. */
  .pole .verb{
    font-family:'Poppins',sans-serif; font-weight:800; color:var(--word);
    text-transform:uppercase; letter-spacing:.02em;
    font-size:clamp(.78rem,3vw,1.04rem); line-height:1.05;
  }
  /* the well, cut into the disc's own floor tone rather than a hole
     punched through it — one step darker, dashed, no drop shadow of
     its own so it reads as part of the same slab */
  .spike{
    position:relative; width:100%; min-height:1.1rem; margin:.08rem 0 .22rem;
    display:flex; align-items:center; justify-content:center;
  }
  .spike::before{
    content:''; width:38%; height:3px; border-radius:2px;
    background:rgba(38,37,31,.5);
    transition:background .18s;
  }
  .ring{
    position:relative; z-index:2; white-space:nowrap;
    display:inline-flex; align-items:center; justify-content:center;
    padding:.15rem .7rem .2rem; border-radius:999px;
    background:var(--egg-right); color:#16250A;
    font-family:'Space Grotesk',sans-serif; font-weight:900;
    font-size:clamp(.7rem,2.8vw,.94rem); letter-spacing:.01em; line-height:1;
    text-shadow:none;
  }
  .pole.pegged{ box-shadow:4px 6px 13px rgba(var(--shade),.32), 0 0 0 2px rgba(127,181,25,.5); }
  .pole.pegged .spike::before{ display:none; }
  .ring.drop{ animation:drop .34s cubic-bezier(.3,1.5,.5,1); }
  @keyframes drop{ from{ transform:translateY(-1.6rem) scale(.9); opacity:0; } }
  .pole.lost{ filter:grayscale(.4) brightness(.9);
    box-shadow:4px 6px 13px rgba(var(--shade),.32), 0 0 0 2px rgba(217,106,68,.55); }
  .pole.lost .ring{ background:var(--egg-lost); color:#3D1207; }
  .pole.lost .spike::before{ display:none; }

  .pole.reject{ animation:reject .45s; }
  @keyframes reject{ 0%,100%{transform:none} 20%{transform:translateX(-10px)} 45%{transform:translateX(9px)} 70%{transform:translateX(-4px)} }
  .meaning{
    font-size:clamp(.7rem,2.6vw,.88rem); line-height:1.24; color:rgba(38,37,31,.72);
    font-family:'DM Sans',sans-serif; font-weight:500;
    overflow:hidden; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical;
  }

  /* ── the bank ── */
  .bank{
    position:fixed; bottom:0; left:0; right:0; height:var(--bank-h);
    background-image:linear-gradient(180deg, rgba(201,169,97,.07), transparent 40%);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.35rem;
    padding:.4rem .6rem; background:rgba(13,13,13,.94); backdrop-filter:blur(20px);
    border-top:1px solid rgba(201,169,97,.22);
  }
  .banklabel{ font-family:'DM Mono',monospace; font-size:.54rem; letter-spacing:.16em;
              text-transform:uppercase; color:var(--faint); }
  .chips{ display:flex; flex-wrap:wrap; justify-content:center; gap:.35rem; max-width:60rem; }
  .chip{
    padding:.14rem .65rem .17rem; border-radius:999px; white-space:nowrap;
    font-family:'Space Grotesk',sans-serif; font-weight:900; font-size:clamp(.9rem,3vw,1.15rem);
    background:var(--egg-free); color:var(--egg-word);
    border:1px solid rgba(0,0,0,.12);
    box-shadow:0 2px 6px rgba(0,0,0,.45);
    transition:all .15s;
  }
  .chip:hover{ transform:translateY(-2px); }
  .chip.picked{
    transform:translateY(-5px) scale(1.08);
    border-color:var(--accent);
    box-shadow:0 0 0 2px var(--accent), 0 6px 16px rgba(255,217,74,.4);
  }
  .chip.spent{ display:none; }

  .deal{
    padding:.55rem 1.5rem; border-radius:99px; background:var(--accent); color:#12100a;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:.72rem;
    letter-spacing:.14em; text-transform:uppercase;
  }

  /* ── the burst ── */
  .spark{ position:absolute; width:5px; height:5px; border-radius:50%; pointer-events:none; z-index:30; }
  .fw-flash{ width:60px; height:60px; border-radius:50%;
             background:radial-gradient(circle,#fff 0%,#FFD94A 35%,rgba(255,217,74,0) 70%); }
  .fw-crackle{ width:3px; height:3px; border-radius:50%; background:#fff; box-shadow:0 0 8px #fff; }

  .banner{
    position:fixed; left:50%; top:44%; z-index:40; pointer-events:none;
    font-family:'Space Grotesk',sans-serif; font-weight:900;
    font-size:clamp(1.4rem,5vw,2.4rem); letter-spacing:.14em; text-transform:uppercase;
    opacity:0; transform:translate(-50%,-50%) scale(.8);
    transition:opacity .2s, transform .4s cubic-bezier(.2,1.6,.4,1); text-shadow:0 0 22px currentColor;
  }
  .banner.show{ opacity:1; transform:translate(-50%,-50%) scale(1); }
  .over{
    position:fixed; inset:0; z-index:50; display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:.4rem; text-align:center; padding:2rem;
    background:rgba(8,8,9,.94); backdrop-filter:blur(6px);
  }
  .over.show{ display:flex; }
  .over .big{ font-family:'Space Grotesk',sans-serif; font-weight:900;
              font-size:clamp(2rem,7vw,3.2rem); color:var(--accent); }
  .over .sub{ font-family:'DM Mono',monospace; font-size:.7rem; letter-spacing:.14em;
              text-transform:uppercase; color:var(--dim); }
  .over .lost{ margin-top:.9rem; max-width:32rem; font-size:.82rem; line-height:1.8; color:var(--dim); }
  .over .lost b{ color:var(--gold); font-weight:700; }
  .acts{ display:flex; gap:.6rem; flex-wrap:wrap; justify-content:center; margin-top:1.4rem; }
  .over .go{ padding:.7rem 1.7rem; border-radius:99px; background:var(--accent); color:#12100a;
             font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:.74rem;
             letter-spacing:.1em; text-transform:uppercase; }
  .over .quiet{ padding:.7rem 1.5rem; border-radius:99px; color:var(--dim);
                border:1px solid rgba(255,255,255,.16); font-size:.72rem;
                letter-spacing:.08em; text-transform:uppercase; }
  .over .quiet:hover{ color:var(--paper); }
  .over .quiet[disabled]{ opacity:.3; cursor:default; }
  .over .away{ margin-top:.9rem; font-size:.66rem; border:none; }

  .loading{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; color:var(--dim); font-size:.8rem; }
  .err{ color:var(--bad); text-align:center; max-width:30rem; line-height:1.7; padding:2rem; }

  @media (max-height:430px){
    .pole{ padding:.3rem .38rem; }
    .meaning{ -webkit-line-clamp:2; font-size:clamp(.7rem,2.5vw,.86rem); }
    .spike{ min-height:1rem; margin:.04rem 0 .14rem; }
  }

  body.embedded{ --header-h:40px; }
  body.embedded .htop{ display:none; }
  body.embedded .header{ padding:.3rem 1rem .25rem; justify-content:center; }
</style>
</head>
<body>

<header class="header">
  <div class="htop">
    <a class="back" href="/?openModal=grammar">← Grammar</a>
    <div class="title"><b>INTUITY</b><span>Phrasal Verbs</span></div>
    <div></div>
  </div>
  <div class="hud">
    <span><b id="pegged">0</b> pegged</span>
    <span><b id="dropped">0</b> dropped</span>
    <span>deal <b id="deals">1</b></span>
  </div>
</header>

<div class="stage"><div class="poles" id="poles"></div></div>

<div class="bank">
  <div class="banklabel" id="bankLabel">tap a particle, then the verb it belongs to</div>
  <div class="chips" id="chips"></div>
</div>

<div class="banner" id="banner"></div>

<div class="over" id="over">
  <div class="big" id="overBig"></div>
  <div class="sub" id="overSub"></div>
  <div class="lost" id="overLost"></div>
  <div class="acts">
    <button class="quiet" id="backBtn" onclick="backDeal()">← Before</button>
    <button class="quiet" onclick="repeatDeal()">↻ These nine again</button>
    <button class="go" onclick="nextDeal()">Next nine →</button>
  </div>
  <button class="quiet away" onclick="location.href='phrasal-verbs-play.html'">Back to phrasal verbs</button>
</div>
<div class="loading" id="loading">Loading…</div>

<script src="intuity-log.js"></script>
<script src="intuity-sound.js"></script>
<script>
const DATA_URL = '../../data/grammar-rules/phrasal-verbs-data.json';
const PER_DEAL = 9;

let POOL = [], round = [], bank = [], picked = null;
let pegged = 0, dropped = 0, deals = 1, locked = false;
let history = [], at = -1;

const $ = id => document.getElementById(id);
const firstSense = m => String(m).split(';')[0].trim();
const esc = t => String(t).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const shuffle = a => { const b=[...a]; for(let i=b.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[b[i],b[j]]=[b[j],b[i]];} return b; };

/* Sound and the item log both live in shared files, so a change reaches
   every game in the suite at once. Both calls are guarded — a missing or
   404'd file must never throw inside a click handler and freeze the
   board, which is exactly what happened once before sound was wrapped
   like this in Rack. */
function sfx(cue){ try{ if (window.SFX && typeof SFX[cue] === 'function') SFX[cue](); }catch(e){} }
function log(item, ok, extra){ try{ if (window.INTUITY) INTUITY.log('phrasal-verbs', item, ok, extra); }catch(e){} }

async function boot(){
  try{
    const res = await fetch(DATA_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const d = await res.json();
    (d.groups || []).forEach(g => (g.items || []).forEach(it => {
      if (it.particle && it.meaning)
        POOL.push({ verb: (it.verb || g.label || g.id).toUpperCase(),
                    particle: it.particle.toLowerCase(),
                    meaning: it.meaning });
    }));
    if (!POOL.length) throw new Error('no phrases in the data');
    $('loading').remove();
    deal();
  }catch(e){
    $('loading').innerHTML = '<p class="err">Could not load <b>' + DATA_URL + '</b>.<br>' +
      'Open this from the site rather than as a local file — browsers block file:// requests.</p>';
  }
}

function deal(){
  const set = shuffle(POOL).slice(0, PER_DEAL);
  history = history.slice(0, at + 1);
  history.push(set);
  at = history.length - 1;
  lay(set);
}

function lay(set){
  round = set.map(it => ({ ...it, done:false, lost:false }));
  bank = shuffle(round.map(r => r.particle)).map((p, i) => ({ p, id:i, spent:false }));
  picked = null; locked = false;
  drawPoles(); drawBank(); paint();
}

function drawPoles(){
  const box = $('poles'); box.innerHTML = '';
  round.forEach((r, i) => {
    const el = document.createElement('div');
    el.className = 'pole';
    el.id = 'p' + i;
    el.innerHTML = '<div class="verb">' + esc(r.verb) + '</div>' +
                   '<div class="spike" id="s' + i + '"></div>' +
                   '<div class="meaning">' + esc(firstSense(r.meaning)) + '</div>';
    el.onclick = () => peg(i);
    box.appendChild(el);
  });
}

function drawBank(){
  const box = $('chips'); box.innerHTML = '';
  bank.forEach(c => {
    const el = document.createElement('button');
    el.className = 'chip' + (c.spent ? ' spent' : '') + (picked === c.id ? ' picked' : '');
    el.textContent = c.p;
    el.onclick = e => { e.stopPropagation(); pick(c.id); };
    box.appendChild(el);
  });
  const left = bank.filter(c => !c.spent).length;
  $('bankLabel').textContent = left
    ? (picked === null ? 'tap a particle, then the verb it belongs to'
                       : 'now tap the verb it belongs to')
    : 'the bank is empty — deal again';
  if (!left){
    const b = document.createElement('button');
    b.className = 'deal'; b.textContent = 'Deal nine more';
    b.onclick = () => nextDeal();
    box.appendChild(b);
  }
}

function pick(id){
  const c = bank.find(x => x.id === id);
  if (!c || c.spent || locked) return;
  picked = (picked === id) ? null : id;
  drawBank();
}

function peg(i){
  if (locked || picked === null) return;
  const slot = round[i], chip = bank.find(x => x.id === picked);
  if (!slot || slot.done || slot.lost || !chip) return;

  if (chip.p === slot.particle){
    locked = true;
    slot.done = true; chip.spent = true; pegged++;
    log(slot.verb + ' ' + slot.particle, true, { game:'pegs' });
    sfx('correct');
    const pole = $('p' + i);
    pole.classList.add('pegged');
    pole.classList.remove('armed');
    $('s' + i).innerHTML = '<span class="ring drop">' + esc(chip.p) + '</span>';
    picked = null;
    drawBank(); paint();
    burst($('s' + i));
    setTimeout(() => {
      locked = false;
      if (round.every(r => r.done)) cleared();
      else if (round.every(r => r.done || r.lost)) endDeal();
    }, 320);
  } else {
    locked = true;
    chip.spent = true; dropped++;
    sfx('wrong');
    const pole = $('p' + i);
    pole.classList.remove('reject'); void pole.offsetWidth; pole.classList.add('reject');
    flash('lost: ' + chip.p, 'var(--bad)');
    picked = null;
    setTimeout(() => {
      const closed = closeStranded();
      if (closed) { sfx('crash'); flash(closed === 1 ? 'one verb lost' : closed + ' verbs lost', 'var(--bad)'); }
      locked = false; drawBank(); paint();
      if (round.every(r => r.done || r.lost)) setTimeout(endDeal, 1100);
    }, 520);
  }
}

function closeStranded(){
  const left = bank.filter(c => !c.spent).map(c => c.p);
  let closed = 0;
  round.forEach((r, i) => {
    if (r.done || r.lost) return;
    const at = left.indexOf(r.particle);
    if (at === -1){
      r.lost = true; closed++;
      log(r.verb + ' ' + r.particle, false, { game:'pegs' });
      const pole = $('p' + i);
      if (pole){
        pole.classList.add('lost');
        pole.classList.remove('armed');
        $('s' + i).innerHTML = '<span class="ring">' + esc(r.particle) + '</span>';
      }
    } else {
      left.splice(at, 1);
    }
  });
  return closed;
}

function paint(){
  $('pegged').textContent = pegged;
  $('dropped').textContent = dropped;
  $('deals').textContent = deals;
  round.forEach((r, i) => {
    const el = $('p' + i);
    if (el) el.classList.toggle('armed', !r.done && !r.lost && picked !== null);
  });
}

function cleared(){
  sfx('fanfare');
  flash('all nine', 'var(--ok)');
  setTimeout(() => finishDeal(true), 1100);
}

function endDeal(){
  setTimeout(() => finishDeal(false), 1400);
}

function finishDeal(clean){
  const lost = round.filter(r => r.lost);
  try{ if (window.INTUITY) INTUITY.session('phrasal-verbs', 'pegs', { pegged: pegged, dropped: dropped, lost: lost.length }); }catch(e){}
  $('overBig').textContent = (PER_DEAL - lost.length) + ' / ' + PER_DEAL;
  $('overSub').textContent = clean
    ? 'the whole board · deal ' + deals
    : lost.length + (lost.length === 1 ? ' card lost' : ' cards lost') + ' · deal ' + deals;
  $('overLost').innerHTML = lost.length
    ? 'Worth another look: ' + lost.map(r =>
        '<b>' + esc(r.verb) + ' ' + esc(r.particle) + '</b>').join(' · ')
    : '';
  $('backBtn').disabled = at <= 0;
  $('over').classList.add('show');
}

function nextDeal(){
  $('over').classList.remove('show');
  deals++;
  if (at < history.length - 1){ at++; lay(history[at]); }
  else deal();
}

function backDeal(){
  if (at <= 0) return;
  $('over').classList.remove('show');
  at--; deals++;
  lay(history[at]);
}

function repeatDeal(){
  $('over').classList.remove('show');
  deals++;
  lay(history[at]);
}

function flash(text, col){
  const b = $('banner');
  b.textContent = text; b.style.color = col;
  b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
  setTimeout(() => b.classList.remove('show'), 1000);
}

function burst(el){
  const stage = document.querySelector('.stage');
  const s = stage.getBoundingClientRect(), r = el.getBoundingClientRect();
  const cx = r.left - s.left + r.width / 2;
  const cy = r.top - s.top + r.height / 2 + stage.scrollTop;
  const COLS = ['#FFD94A','#C9A961','#5ED39B','#ff7a45','#ffffff','#7dd3fc','#ffb347'];

  const card = el.closest ? el.closest('.pole') : null;
  if (card) card.animate(
    [{ transform:'scale(1)' }, { transform:'scale(1.06)', offset:.25 }, { transform:'scale(1)' }],
    { duration:340, easing:'cubic-bezier(.2,1.6,.4,1)' });

  const f = document.createElement('div');
  f.className = 'spark fw-flash';
  f.style.left = cx+'px'; f.style.top = cy+'px';
  stage.appendChild(f);
  f.animate([{ transform:'translate(-50%,-50%) scale(.15)', opacity:1 },
             { transform:'translate(-50%,-50%) scale(4.2)', opacity:0 }],
            { duration:460, easing:'cubic-bezier(.1,.8,.2,1)' });
  setTimeout(() => f.remove(), 480);

  [0, 130].forEach((delay, k) => setTimeout(() => {
    const ring = document.createElement('div');
    ring.className = 'spark fw-ring';
    ring.style.left = cx+'px'; ring.style.top = cy+'px';
    stage.appendChild(ring);
    ring.animate([{ transform:'translate(-50%,-50%) scale(.12)', opacity:.95 },
                  { transform:'translate(-50%,-50%) scale(' + (3 + k) + ')', opacity:0 }],
                 { duration:700 + k*180, easing:'cubic-bezier(.1,.7,.2,1)' });
    setTimeout(() => ring.remove(), 900 + k*180);
  }, delay));

  shell(stage, cx, cy, 26, 40, 120, 520, ['#ffffff','#FFD94A']);
  setTimeout(() => shell(stage, cx, cy, 46, 90, 260, 1150, COLS), 90);

  setTimeout(() => {
    for (let i = 0; i < 22; i++){
      const c = document.createElement('div');
      c.className = 'spark fw-crackle';
      const a = Math.random()*Math.PI*2, d = 30 + Math.random()*150;
      c.style.left = (cx + Math.cos(a)*d*.55)+'px';
      c.style.top  = (cy + Math.sin(a)*d*.55)+'px';
      stage.appendChild(c);
      c.animate([{opacity:0,transform:'translate(-50%,-50%) scale(.3)'},
                 {opacity:1,transform:'translate(-50%,-50%) scale(1.5)',offset:.22},
                 {opacity:0,transform:'translate(-50%,-50%) scale(.3)'}],
                {duration:300+Math.random()*300, easing:'ease-out'});
      setTimeout(() => c.remove(), 640);
    }
  }, 300);
}

function shell(stage, cx, cy, n, near, far, life, cols){
  for (let i = 0; i < n; i++){
    const p = document.createElement('div');
    p.className = 'spark';
    const col = cols[(Math.random()*cols.length)|0];
    const size = 3 + Math.random()*4.5;
    p.style.cssText += 'left:'+cx+'px; top:'+cy+'px; width:'+size+'px; height:'+size+
      'px; background:'+col+'; box-shadow:0 0 '+(size*3)+'px '+col+';';
    stage.appendChild(p);
    const a = Math.random()*Math.PI*2, d = near + Math.random()*(far-near);
    const dx = Math.cos(a)*d, dy = Math.sin(a)*d;
    const fall = 50 + Math.random()*110, dur = life * (.75 + Math.random()*.5);
    p.animate([
      { transform:'translate(-50%,-50%) translate(0,0) scale(1.3)', opacity:1 },
      { transform:'translate(-50%,-50%) translate('+(dx*.6).toFixed(0)+'px,'+(dy*.6-14).toFixed(0)+'px) scale(1)', opacity:1, offset:.4 },
      { transform:'translate(-50%,-50%) translate('+dx.toFixed(0)+'px,'+(dy+fall).toFixed(0)+'px) scale(.2)', opacity:0 }
    ], { duration:dur, easing:'cubic-bezier(.1,.75,.3,1)' });
    setTimeout(() => p.remove(), dur + 40);
  }
}

if (window.self !== window.top) document.body.classList.add('embedded');
boot();
</script>
