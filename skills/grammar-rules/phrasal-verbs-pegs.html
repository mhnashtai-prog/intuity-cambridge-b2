<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTUITY — Pegs</title>
<meta name="theme-color" content="#FAF7F2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@500;700;900&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
  if (window.self !== window.top) document.documentElement.classList.add('embedded');
</script>
<style>
  /* ═══ PEGS ═══
     Nine verbs, a bank of particles, no spares. Same material as Rack: the
     tile is the same colour as the ground and exists only as light, pressed
     in until it is dealt with and risen afterwards. Anton for the verb,
     caramel for the particle, a drawn violet tick or orange cross.

     ONE THING PEGS DOES THAT RACK CANNOT. The notch is not decoration here
     — it is the peg hole. The particle you are holding seats INTO it, so
     the silhouette and the mechanic are the same object. That is why this
     game keeps its notch wide (18%) where Rack's is a 14% bite. */

  *,*::before,*::after{ margin:0; padding:0; box-sizing:border-box; }

  :root{
    --ground:#DFE3E3;
     --tile:114px; --tile-gap:1.5rem;
    --ink:#17171A;
    --dim:#5C6366;
    --faint:#8A9093;
    --rule:#C2956E;
    --caramel:#B0865C;
    --tick:#6B3FA0;
    --cross:#E8632A;
    --ok:#4A6B5C;
    --bad:#B8402A;
    --hot:#B44A22;
    /* The egg once a particle is in and right. #ADB77E measured a shade
       chalky against a cool stone ground — the ground's blue cast pulls the
       warmth out of a soft olive. Two points more saturation and a touch
       less lightness holds the same colour and keeps it alive on this
       screen; the black particle on it reads at about 7:1 either way. */
    --egg-right:#A3B26A;
    --shade:40,50,54;
    --header-h:96px; --bank-h:150px;
    --spring:cubic-bezier(.2,1.4,.4,1);
  }

  html,body{ height:100%; }
  body{
    background:var(--ground); color:var(--ink);
    font-family:'DM Sans',system-ui,sans-serif; -webkit-font-smoothing:antialiased;
  }
  button{ font:inherit; border:none; background:none; cursor:pointer; color:inherit; }

  html.embedded .header{ display:none; }
  html.embedded .stage{ top:0; }

  /* ── HEADER ── */
  .header{
    position:fixed; top:0; left:0; right:0; z-index:20; height:var(--header-h);
    display:flex; flex-direction:column; justify-content:center; gap:.5rem;
    padding:.6rem 1rem; background:#FAF7F2;
    border-bottom:1px solid var(--rule);
  }
  .htop{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; }
  .back{
    justify-self:start; text-decoration:none;
    font-family:'Space Grotesk',sans-serif; font-size:.6rem; font-weight:700;
    letter-spacing:.08em; text-transform:uppercase; color:var(--faint);
    transition:color .2s;
  }
  .back:hover{ color:var(--ink); }
  .title{ display:flex; flex-direction:column; align-items:center; line-height:1.1; }
  .title b{
    font-family:'Space Grotesk',sans-serif; font-size:1rem; font-weight:900;
    letter-spacing:.2em; color:var(--ink);
  }
  .title span{
    font-size:.56rem; font-weight:600; letter-spacing:.16em;
    text-transform:uppercase; color:var(--faint); margin-top:.15rem;
  }
  .hud{
    display:flex; justify-content:center; flex-wrap:wrap; gap:.9rem;
    font-family:'DM Mono',monospace; font-size:.66rem; color:var(--faint);
  }
  .hud b{ color:var(--dim); font-weight:500; }

  /* ── THE BOARD ── */
  .stage{
    position:fixed; top:var(--header-h); left:0; right:0; bottom:var(--bank-h);
    display:flex; align-items:center; justify-content:center;
    padding:1.4rem 1.1rem; overflow-y:auto; scrollbar-gutter:stable;
  }
  /* Capped, not stretched — every pixel the screen gains goes into the space
     BETWEEN the tiles rather than into the tiles. */
.poles{
  display:grid; grid-template-columns:repeat(3,minmax(0,var(--tile,114px)));
  grid-auto-rows:min-content;
  justify-content:center; gap:var(--tile-gap,1.5rem); width:100%; margin:auto;
}

  /* ── THE TILE ──
     Rack's architecture exactly: a square tile with the verb inside it and
     the definition as a caption underneath. It was a tall tile with the
     definition crammed in, which made this the one board in the set built
     differently from the other two for no reason a player would notice. */
  .pole{
    position:relative; display:flex; flex-direction:column; align-items:center;
    gap:.5rem; background:none; padding:0; cursor:default;
    transition:transform .14s var(--spring);
  }
  .pole.armed{ cursor:pointer; }
  .pole.armed:active{ transform:scale(.96); }

  .face{
    position:relative; width:100%; aspect-ratio:1; border-radius:19px;
    background:var(--ground);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:.3rem; padding:9% 7% 7%;
    box-shadow:inset 3px 4px 8px rgba(var(--shade),.22),
               inset -3px -3px 7px rgba(255,255,255,.9);
    -webkit-mask:radial-gradient(ellipse 14% 14% at 50% 0, transparent 97%, #000 100%);
            mask:radial-gradient(ellipse 14% 14% at 50% 0, transparent 97%, #000 100%);
    transition:box-shadow .18s;
  }

  .pole .verb{
    font-family:'Anton',Impact,sans-serif; font-weight:400;
    font-size:clamp(1rem,4.6vw,1.32rem); letter-spacing:.055em; line-height:.98;
    text-transform:uppercase; color:var(--ink); text-align:center;
  }

  /* THE DEFINITION IS A CAPTION. Under the square, as the verb pair is on
     Rack — so the tile stays pure material and the prose is free to be any
     length without squeezing the type inside. */
  /* THREE LINES, ALWAYS. The caption had no reserved height, so each row
     sized to its own text — and any change in available width tipped a
     definition from two lines to three, grew the row, and reflowed the whole
     board. Nine tiles appearing to retract mid-answer is that reflow, not an
     animation: narrower columns force more wrapping, and more wrapping makes
     the board look shrunken. A fixed box means the grid cannot move at all
     once it is drawn. */
.pole .meaning{
  font-family:'DM Sans',sans-serif; font-size:clamp(.6rem,2.3vw,.7rem);
  line-height:1.35; color:var(--dim); text-align:center;
  height:4.05em;
  display:-webkit-box; -webkit-line-clamp:3;
  -webkit-box-orient:vertical; overflow:hidden;
  margin:0 -0.55rem;              /* NEW: bleed into the gap on each side */
  width:calc(100% + 1.1rem);      /* NEW: matches the bleed */
}
  /* ── THE SLOT ──
     An egg — a caramel oval, taller than it is wide — with a bold black
     question mark in it. It is the ONE filled shape on a board made entirely
     of light, which is why it carries the whole "put something here" without
     needing a dashed rule, an outline or an instruction.

     Empty it asks; filled it holds the particle. The oval never changes size
     or leaves, so the tile does not reflow at the moment of pegging — only
     what is inside it changes. */
.spike{
  min-width:2.6em; height:1.33em; padding:0 .6em;
  display:flex; align-items:center; justify-content:center;
  border-radius:50%/38%;
  background:rgba(var(--shade),.08);
  transition:background .18s ease;
}
.spike::before{
  content:'?';
  font-family:'Space Grotesk',sans-serif; font-weight:900;
  font-size:clamp(.72rem,3vw,.88rem); line-height:1; color:var(--faint);
}
  /* Once a particle is in, the question is answered and the mark goes. */
  .spike:has(.ring)::before{ content:none; }
  /* :has is recent enough to want a fallback — the ring paints over the
     question mark on its own, so an older engine shows a filled egg with the
     particle on it rather than a broken one. */
  .ring{
    position:relative; z-index:1;
    font-family:'Space Grotesk',sans-serif; font-weight:700;
    font-size:clamp(.7rem,2.9vw,.86rem); letter-spacing:.015em;
    color:#17171A; background:var(--caramel); padding:0 .1em;
  }
  /* Armed: the egg warms and lifts a fraction, so the board shows where the
     piece in your hand can go without adding anything to the screen. */
  .pole.armed .spike{ background:var(--hot); }
  .pole.armed .spike::before{ color:#FFF7F3; }
  .pole.pegged .spike{ background:var(--egg-right); }
  .pole.lost .spike{ background:rgba(176,134,92,.4); }
  .pole.pegged .ring{ background:var(--egg-right); }
  .pole.lost .ring{ background:none; color:#5A6469; }
  .ring.drop{ animation:seat .3s var(--spring); }
  @keyframes seat{ 0%{ transform:translateY(-10px) scale(.7); opacity:0 } 100%{ transform:none; opacity:1 } }

  /* ── STATE: depth means dealt with, never right ── */
  .pole.pegged, .pole.lost{
    cursor:default;
    filter:drop-shadow(-3px -3px 5px rgba(255,255,255,.9))
           drop-shadow(3px 4px 7px rgba(var(--shade),.21));
  }
  .pole.pegged .face, .pole.lost .face{ box-shadow:none; }
  .pole.pegged .verb, .pole.lost .verb{ color:#5A6469; }
  .pole.pegged .meaning, .pole.lost .meaning{ color:var(--faint); }
  .pole.lost .ring{ color:rgba(176,134,92,.55); }

  /* Against the FACE, not the pole — the pole is now taller than the tile
     because of the caption, so a mark positioned on the pole would drift
     down into the definition. */
  .mk{
    position:absolute; right:9%; bottom:8%; z-index:2;
    opacity:0; transform:scale(.6); transform-origin:70% 70%;
    transition:opacity .2s, transform .28s var(--spring); pointer-events:none;
  }
  .mk.tick{ width:19%; }
  .mk.cross{ width:17%; }
  .pole.pegged .mk.tick, .pole.lost .mk.cross{ opacity:1; transform:scale(1); }
  .face{ overflow:visible; }

  .pole.reject{ animation:reject .45s; }
  @keyframes reject{ 0%,100%{ transform:none } 25%{ transform:translateX(-5px) } 60%{ transform:translateX(4px) } }

  /* ── THE BANK ── */
.bank{
  position:fixed; bottom:0; left:0; right:0; min-height:var(--bank-h);
  display:flex; align-items:center; justify-content:center;
  padding:1.3rem 1rem calc(env(safe-area-inset-bottom,0px) + 1.15rem);
  background:var(--ground); border-top:1px solid rgba(var(--shade),.14);
}
  .tray{ display:flex; flex-direction:column; align-items:center; gap:.7rem; width:100%; max-width:28rem; }
  /* Two lines' worth of height, always. The label swaps between "tap a
     particle, then the verb it belongs to" and "now tap the verb it belongs
     to" — on a narrow screen the first wraps to two lines and the second to
     one, so the bank changed height on every pick and the board jumped with
     it. Reserving the taller of the two costs one line of empty space and holds
     the layout still. */
  .banklabel{
    font-family:'DM Mono',monospace; font-size:.58rem; letter-spacing:.14em;
    text-transform:uppercase; color:var(--faint); text-align:center;
    min-height:2.1em; display:flex; align-items:center; justify-content:center;
  }
.chips{
  display:flex; flex-wrap:nowrap; justify-content:center;
  gap:.4rem; width:100%;
}
.chip{
  flex:0 1 auto;
  padding:.45rem .75rem;
  font-size:.72rem;
}
  .chip:active{ transform:scale(.94); }
  .chip.sel{
    color:#FFF7F3; background:var(--hot);
    filter:drop-shadow(2px 4px 9px rgba(180,74,34,.32));
  }
  .chip.used{ opacity:.3; cursor:default; filter:none; color:var(--faint); }

  /* ── BANNER & END ── */
  .banner{
    position:fixed; top:calc(var(--header-h) + 10px); left:50%;
    transform:translateX(-50%); z-index:30; pointer-events:none;
    font-family:'Space Grotesk',sans-serif; font-size:.74rem; font-weight:700;
    color:var(--ink); background:#FAF7F2; border-radius:999px;
    padding:.45rem 1.1rem; box-shadow:0 5px 14px rgba(var(--shade),.16);
    opacity:0; transition:opacity .3s; white-space:nowrap;
  }
  .banner.show{ opacity:1; }

  .over{
    position:fixed; inset:0; z-index:40; display:none;
    flex-direction:column; align-items:center; justify-content:center;
    gap:.6rem; padding:2rem; text-align:center; background:var(--ground);
  }
  .over.show{ display:flex; }
  .over .big{
    font-family:'Anton',Impact,sans-serif; font-weight:400;
    font-size:clamp(2.4rem,12vw,3.6rem); letter-spacing:.03em;
    text-transform:uppercase; color:var(--ink);
  }
  .over .sub{ font-size:.88rem; color:var(--dim); max-width:22rem; line-height:1.6; }
  .over .lost{ font-size:.8rem; color:var(--bad); max-width:22rem; line-height:1.7; }
  .acts{ display:flex; flex-wrap:wrap; gap:.6rem; justify-content:center; margin-top:.8rem; }
  .quiet{
    font-family:'Space Grotesk',sans-serif; font-size:.7rem; font-weight:700;
    padding:.6rem 1.2rem; border-radius:999px;
    background:rgba(var(--shade),.08); color:var(--dim);
    transition:transform .1s var(--spring);
  }
  .quiet:active{ transform:scale(.95); }
  .go{
    font-family:'Space Grotesk',sans-serif; font-size:.7rem; font-weight:700;
    padding:.6rem 1.4rem; border-radius:999px; background:var(--hot); color:#FFF7F3;
    transition:transform .1s var(--spring);
  }
  .go:active{ transform:scale(.95); }
  .away{ margin-top:1.4rem; }

  .fx{ position:fixed; inset:0; z-index:35; pointer-events:none; overflow:hidden; }

  /* THE WAY OUT, WHEN THERE IS ONE.
     This button did location.href = 'phrasal-verbs-play.html' — from inside
     the host's own iframe, which loaded the host INSIDE ITSELF: two headers
     stacked on one screen, and a landing on Explore because that is the
     host's default mode. Framed, the band above the frame is already the way
     back, so the button has no job and is hidden. Opened on its own it
     navigates the top window, which is what it always meant to do. */
  html.embedded .away{ display:none; }

  /* ── THE LOADING PENDULUM ──
     Ported from Word Forge's gate/idle pendulum (.pend / .pend-dial), same
     object and same architecture, re-skinned in Pegs' own tokens (caramel
     string and dial, violet sweep, ink core) instead of Forge's mark
     colours. A single tick face gently rocking says "something is
     happening" without borrowing Forge's combat framing.

     THE STRING FIX. Forge drew the string as a 1px-wide element filled with
     a background gradient (transparent → var(--edge)). At a fractional
     device-pixel-ratio — Windows display scaling at 125% or 150% is the
     common case, and it's a PC-only setting — a 1px CSS box can round down
     to 0 physical pixels and disappear entirely, while a phone's DPR is
     always an integer multiple (2x, 3x) and never lands on that rounding
     edge. That's the exact split reported: fine on the phone, gone on the
     PC. A border is hinted to the device pixel grid by the browser and
     survives fractional scaling where a filled box does not, so the string
     here is a border-left on a 2px-wide box rather than a 1px background
     fill — same silhouette, a rendering path that can't round itself away. */
  .pend{
    position:relative; width:104px; height:104px; margin:0 auto .95rem;
    transform-origin:50% -40px;
    animation:pendSwing 2.7s ease-in-out infinite;
  }
  .pend::before{
    content:''; position:absolute; left:50%; top:-40px; width:2px; height:40px;
    border-left:1.5px solid var(--caramel); transform:translateX(-50%);
  }
  .pend::after{
    content:''; position:absolute; left:50%; top:-43px; width:7px; height:7px;
    border-radius:50%; background:var(--caramel); transform:translateX(-50%);
  }
  .pend-dial{
    position:relative; width:100%; height:100%; border-radius:50%;
    background:linear-gradient(145deg,#FFFFFF,var(--ground));
    box-shadow:5px 5px 13px rgba(var(--shade),.2);
    display:flex; align-items:center; justify-content:center;
  }
  .pend-dial::before{
    content:''; position:absolute; inset:0; border-radius:50%;
    background:var(--caramel);
  }
  .pend-dial::after{
    content:''; position:absolute; inset:8.5%; border-radius:50%; background:var(--ink);
  }
  .pend-dial span{
    position:relative; z-index:2; font-family:'Space Grotesk',sans-serif;
    font-weight:900; font-size:1rem; color:#E5D1B8;
  }
  @keyframes pendSwing{ 0%,100%{ transform:rotate(-11deg) } 50%{ transform:rotate(11deg) } }
  @media (prefers-reduced-motion:reduce){
    .pend{ animation:none; }
  }

  .err{ color:var(--bad); line-height:1.7; text-align:center; }

  /* ── THE ENTRY GATE ──
     ONE element, mounted once, for the whole span from "fetching" through
     "waiting for Start". Loading and idle used to be two different DOM
     nodes — #loading with its own .pend, #idlePanel with a second .pend —
     and swapping from one to the other meant the first pendulum was
     destroyed mid-swing and the second was born at its animation's frame
     zero. A CSS animation always starts a new element at 0%, so that
     handoff was a visible snap back to the resting angle: the reported
     glitch. Here the pendulum itself never unmounts; only the loading text
     versus the message-and-Start-button beneath it toggle, so the swing is
     continuous from the moment the page opens to the moment Start is
     pressed. */
  .gate{
    position:fixed; inset:0; z-index:50; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:.15rem;
    padding:2rem 1.5rem; text-align:center; background:var(--ground);
  }
  .gate .gate-loading{ font-size:.86rem; color:var(--faint); }
  .gate .idle-kicker{
    font-family:'DM Mono',monospace; font-size:.62rem; letter-spacing:.2em;
    text-transform:uppercase; color:var(--faint); margin-bottom:.5rem;
  }
  .gate .idle-msg{
    font-family:'Space Grotesk',sans-serif; font-weight:700;
    font-size:clamp(1rem,3.8vw,1.3rem); line-height:1.35; color:var(--ink);
    max-width:22rem;
  }
  .gate .idle-sub{
    margin-top:.55rem; font-size:.82rem; color:var(--dim); max-width:21rem; line-height:1.55;
  }
  .gate .idle-go{ margin-top:1.2rem; }

  /* Once a deal has actually begun, the whole gate — pendulum included —
     goes away in one step; there is nothing left for it to hand off to. */
  body.started .gate{ display:none; }

  /* The board and the bank stay out of the DOM's visible flow until a deal
     has actually begun — otherwise an empty stage and an empty bank sit
     behind the gate for no reason, and a screen reader announces a board
     with nothing on it before announcing the gate on top of it. */
  body:not(.started) .stage,
  body:not(.started) .bank{ display:none; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="htop">
<a class="back-link" href="/?panel=vocabulary" target="_top">← Vocabulary</a>
    <div class="title"><b>INTUITY</b><span>Phrasal Verbs</span></div>
    <div></div>
  </div>
  <div class="hud">
    <span><b id="pegged">0</b> pegged</span>
    <span><b id="dropped">0</b> dropped</span>
    <span>deal <b id="deals">1</b></span>
  </div>
</header>

<div class="stage"><div class="poles" id="poles"></div></div>

<!-- The burst lives here, not in the board. Sparks are absolutely positioned,
     and an absolutely positioned descendant still counts toward a scrolling
     container's overflow — so every celebration briefly grew .stage's scroll
     area, brought up a scrollbar, took width off the grid, and rewrapped the
     captions. That is the retraction: it fires with the animation because the
     animation causes it. On its own fixed layer the burst cannot touch
     layout at all. -->
<div class="fx" id="fx" aria-hidden="true"></div>

<div class="bank">
  <div class="tray">
    <div class="banklabel" id="bankLabel">tap a particle, then the verb it belongs to</div>
    <div class="chips" id="chips"></div>
  </div>
</div>

<div class="banner" id="banner"></div>

<!-- THE GATE. One element, mounted once, for the whole span from "fetching"
     to "waiting for Start" — see the comment on .gate in <style> for why
     this used to be two elements and what that cost. -->
<div class="gate" id="gate">
  <div class="pend" aria-hidden="true"><div class="pend-dial"><span>?</span></div></div>
  <div class="gate-loading" id="gateLoading">Loading…</div>
  <div id="gateReady" style="display:none">
    <div class="idle-kicker">Pegs</div>
    <div class="idle-msg" id="idleMsg">Pick a verb above to deal your first nine</div>
    <div class="idle-sub">Each verb is its own set of phrasal verbs — nothing deals until you start.</div>
    <button class="go idle-go" id="idleStart">Start</button>
  </div>
</div>

<div class="over" id="over">
  <div class="big" id="overBig"></div>
  <div class="sub" id="overSub"></div>
  <div class="lost" id="overLost"></div>
  <div class="acts">
    <button class="quiet" id="backBtn" onclick="backDeal()">← Before</button>
    <button class="quiet" onclick="repeatDeal()">↻ These nine again</button>
    <button class="go" onclick="nextDeal()">Next nine →</button>
  </div>
  <button class="quiet away" onclick="(window.top || window).location.href='phrasal-verbs-play.html'">Back to phrasal verbs</button>
</div>

<script src="intuity-log.js"></script>
<script src="intuity-sound.js"></script>
<script>
const DATA_URL = '../../data/grammar-rules/phrasal-verbs-data.json';
const PER_DEAL = 9;

/* ── THE SET THE HOST CHOSE ──
   The band above this frame lists the verb families; a tap USED to reload
   this whole page with ?verb=<group id> — a real navigation, which is why
   the pendulum came back on every single tap: a fresh document always
   starts from its own loading state, there is no such thing as a "quiet"
   full reload. Fetching the same JSON a second time didn't help either;
   the file was already warm in cache, but the pendulum isn't gated on the
   fetch being slow, it's gated on the DOCUMENT existing at all.

   The fix is to stop reloading the document. The data is fetched ONCE, kept
   in RAW_DATA, and a set change afterwards is the host posting a message
   into this same still-running page — which re-filters RAW_DATA and deals
   again without ever touching location or re-running boot(). */
let RAW_DATA = null;
let currentVerb = new URLSearchParams(location.search).get('verb');
/* A message can arrive before RAW_DATA exists — the host's tap and this
   page's own fetch are racing. Queue it rather than drop it or fetch twice. */
let pendingVerb;

/* ── THE GATE STATE ──
   selectedVerb is "what will be dealt when Start is pressed" — it can be set
   either by the URL at load time or by a host message while the gate is up.
   gameStarted flips exactly once, the moment Start actually runs a deal;
   nothing before that point touches POOL/round/bank, so there is no way for
   a deal to happen before the learner (or the host, then the learner) has
   chosen to begin. */
let selectedVerb = currentVerb;
let gameStarted = false;

let POOL = [], round = [], bank = [], picked = null;
let pegged = 0, dropped = 0, deals = 1, locked = false;
let history = [], at = -1;

const $ = id => document.getElementById(id);
const firstSense = m => String(m).split(';')[0].trim();
const esc = t => String(t).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function buildAll(d){
  (d.groups || []).forEach(g => (g.items || []).forEach(it => {
    if (it.particle && it.meaning)
      POOL.push({ verb:(it.verb || g.label || g.id).toUpperCase(),
                  particle: it.particle.toLowerCase(), meaning: it.meaning });
  }));
}
/* Filters the already-fetched RAW_DATA into POOL for one verb id (or the
   whole pool when verbId is falsy) — the in-place equivalent of what boot()
   used to do straight off the network response. */
function buildPool(verbId){
  POOL = [];
  (RAW_DATA.groups || []).filter(g => !verbId || g.id === verbId)
    .forEach(g => (g.items || []).forEach(it => {
      if (it.particle && it.meaning)
        POOL.push({ verb: (it.verb || g.label || g.id).toUpperCase(),
                    particle: it.particle.toLowerCase(),
                    meaning: it.meaning });
    }));
  /* A family can be smaller than a deal — fall back to everything rather
     than showing an error the child cannot act on. */
  if (POOL.length < PER_DEAL && verbId) { POOL = []; buildAll(RAW_DATA); }
}
/* Switches the live board to a verb id (or the whole mix) using data already
   in memory — no fetch, no reload, no pendulum. Used once the game is
   running, for every set change after the first. */
function applyVerb(verbId){
  currentVerb = verbId;
  buildPool(verbId);
  if (!POOL.length) return false;
  pegged = 0; dropped = 0; deals = 1; locked = false;
  history = []; at = -1;
  deal();
  return true;
}
const shuffle = a => { const b=[...a]; for(let i=b.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[b[i],b[j]]=[b[j],b[i]];} return b; };

/* ── THE GATE ITSELF ──
   Names the verb once one has been chosen; falls back to the generic prompt
   otherwise. Called whenever selectedVerb changes while the gate is still up
   — the label is the only thing allowed to move before Start is pressed. */
function labelFor(verbId){
  if (!verbId || !RAW_DATA) return null;
  const g = (RAW_DATA.groups || []).find(x => x.id === verbId);
  return g ? g.label : null;
}
function paintGate(){
  const label = labelFor(selectedVerb);
  $('idleMsg').textContent = label
    ? 'Ready to deal ' + label
    : 'Pick a verb above to deal your first nine';
}
/* Swaps the gate from "Loading…" to the message-and-Start content, without
   touching the .pend element at all — it has been swinging since the page
   opened and keeps right on swinging through this. */
function showGate(){
  $('gateLoading').style.display = 'none';
  $('gateReady').style.display = 'block';
  paintGate();
}
/* The one and only place a deal is allowed to start. Runs once, on a tap of
   Start — never automatically, and never twice. Hiding the whole .gate here
   (via body.started) is fine: the pendulum's job is done, there's no further
   handoff for it to glitch across. */
function startGame(){
  if (gameStarted || !RAW_DATA) return;
  gameStarted = true;
  document.body.classList.add('started');
  applyVerb(selectedVerb);
}
$('idleStart').addEventListener('click', startGame);

/* THE HOST'S CHANNEL. Same-origin only — the host frames this page, so a
   stray message from anywhere else (a browser extension, another tab) is
   simply not from window.parent and gets ignored.

   Before Start has been pressed, a host message only UPDATES the gate — it
   names the chosen verb and waits, it does not deal. Once the game is
   already running, a host message behaves as it always did: an immediate
   live switch, no reload, no pendulum. */
window.addEventListener('message', e => {
  if (e.source !== window.parent) return;
  const msg = e.data;
  if (!msg || msg.type !== 'intuity:set-verb') return;
  if (!RAW_DATA) { pendingVerb = msg.verb || null; return; }
  selectedVerb = msg.verb || null;
  if (gameStarted) applyVerb(selectedVerb);
  else paintGate();
});

/* Sound and the item log both live in shared files, so a change reaches
   every game in the suite at once. Both calls are guarded — a missing or
   404'd file must never throw inside a click handler and freeze the
   board, which is exactly what happened once before sound was wrapped
   like this in Rack. */
function sfx(cue){ try{ if (window.SFX && typeof SFX[cue] === 'function') SFX[cue](); }catch(e){} }
function log(item, ok, extra){ try{ if (window.INTUITY) INTUITY.log('phrasal-verbs', item, ok, extra); }catch(e){} }

  function fitPoles(){
  const stage = document.querySelector('.stage');
  if (!stage) return;
  const cs = getComputedStyle(stage);
  const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
  const padY = parseFloat(cs.paddingTop)  + parseFloat(cs.paddingBottom);
  const availW = stage.clientWidth  - padX;
  const availH = stage.clientHeight - padY;
  const gapPx = 24;
  const captionH = 62;   // reserved caption (.meaning) + internal .5rem gap, per tile
  const maxW = (availW - gapPx*2) / 3;
  const maxH = (availH - gapPx*2 - captionH*3 - 8) / 3;
  let tile = Math.floor(Math.min(maxW, maxH));
  tile = Math.max(95, Math.min(500, tile));
  document.documentElement.style.setProperty('--tile', tile + 'px');
}
window.addEventListener('resize', fitPoles);
window.addEventListener('orientationchange', () => setTimeout(fitPoles, 150));

async function boot(){
  try{
    const res = await fetch(DATA_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    RAW_DATA = await res.json();
    /* If a set change arrived while this fetch was still in flight, honour
       THAT one rather than the URL's original ?verb= — it's the more
       recent instruction. */
    const first = (pendingVerb !== undefined) ? pendingVerb : currentVerb;
    pendingVerb = undefined;
    selectedVerb = first;
    /* Validate the data early so a bad/empty verb id fails loudly here
       rather than silently at Start — but this does NOT deal. buildPool
       only fills POOL in memory; nothing is drawn to the screen until
       startGame() runs. */
    buildPool(first);
    if (!POOL.length) throw new Error('no phrases in the data');
    currentVerb = first;
    /* The gate never gets torn down here — just its loading text swapped
       for the message and Start button, with the same pendulum running
       underneath the whole time. */
    showGate();
  }catch(e){
    $('gateReady').style.display = 'none';
    $('gateLoading').innerHTML = '<p class="err">Could not load <b>' + DATA_URL + '</b>.<br>' +
      'Open this from the site rather than as a local file — browsers block file:// requests.</p>';
  }
}

function deal(){
  const set = shuffle(POOL).slice(0, PER_DEAL);
  history = history.slice(0, at + 1);
  history.push(set);
  at = history.length - 1;
  lay(set);
}

function lay(set){
  fitPoles();
  round = set.map(it => ({ ...it, done:false, lost:false }));
  bank = shuffle(round.map(r => r.particle)).map((p, i) => ({ p, id:i, spent:false }));
  picked = null; locked = false;
  drawPoles(); drawBank(); paint();
}

/* The marks, written once. They live inside .face so they sit on the tile
   rather than beside the caption. */
const TICK = '<svg class="mk tick" viewBox="0 0 24 24" fill="none" stroke="var(--tick)" ' +
  'stroke-width="5.6" stroke-linecap="round" stroke-linejoin="round">' +
  '<path d="M3 13.5c2.6 1.4 4.4 3.2 5.8 5.4C11.4 13 15.2 8 21 4.2"/></svg>';
const CROSS = '<svg class="mk cross" viewBox="0 0 24 24" fill="none" stroke="var(--cross)" ' +
  'stroke-width="5.8" stroke-linecap="round">' +
  '<path d="M5.4 5c4.2 4.2 8.6 9.2 13.4 14.2M18.6 5.4C14.2 9.4 9.6 14.6 5.2 19"/></svg>';

function drawPoles(){
  const box = $('poles'); box.innerHTML = '';
  round.forEach((r, i) => {
    const el = document.createElement('div');
    el.className = 'pole';
    el.id = 'p' + i;
    const meaning = firstSense(r.meaning);
    const long = meaning.length > 95;   // rough threshold — tune if needed
    el.innerHTML = '<div class="face">' +
                     '<div class="verb">' + esc(r.verb) + '</div>' +
                     '<div class="spike" id="s' + i + '"></div>' +
                     TICK + CROSS +
                   '</div>' +
                   '<div class="meaning"' + (long ? ' title="' + esc(meaning) + '"' : '') + '>' +
                     esc(meaning) +
                   '</div>';
    el.onclick = () => peg(i);
    box.appendChild(el);
  });
}

function drawBank(){
  const box = $('chips'); box.innerHTML = '';
  bank.forEach(c => {
    const el = document.createElement('button');
    el.className = 'chip' + (c.spent ? ' used' : '') + (picked === c.id ? ' sel' : '');
    el.textContent = c.p;
    el.onclick = e => { e.stopPropagation(); pick(c.id); };
    box.appendChild(el);
  });
  const left = bank.filter(c => !c.spent).length;
  $('bankLabel').textContent = left
    ? (picked === null ? 'tap a particle, then the verb it belongs to'
                       : 'now tap the verb it belongs to')
    : 'the bank is empty — deal again';
  if (!left){
    const b = document.createElement('button');
    b.className = 'deal'; b.textContent = 'Deal nine more';
    b.onclick = () => nextDeal();
    box.appendChild(b);
  }
}

function pick(id){
  const c = bank.find(x => x.id === id);
  if (!c || c.spent || locked) return;
  picked = (picked === id) ? null : id;
  drawBank();
}

function peg(i){
  if (locked || picked === null) return;
  const slot = round[i], chip = bank.find(x => x.id === picked);
  if (!slot || slot.done || slot.lost || !chip) return;

  if (chip.p === slot.particle){
    locked = true;
    slot.done = true; chip.spent = true; pegged++;
    log(slot.verb + ' ' + slot.particle, true, { game:'pegs' });
    sfx('correct');
    const pole = $('p' + i);
    pole.classList.add('pegged');
    pole.classList.remove('armed');
    $('s' + i).innerHTML = '<span class="ring drop">' + esc(chip.p) + '</span>';
    picked = null;
    drawBank(); paint();
    burst($('s' + i));
    setTimeout(() => {
      locked = false;
      if (round.every(r => r.done)) cleared();
      else if (round.every(r => r.done || r.lost)) endDeal();
    }, 320);
  } else {
    locked = true;
    chip.spent = true; dropped++;
    sfx('wrong');
    const pole = $('p' + i);
    pole.classList.remove('reject'); void pole.offsetWidth; pole.classList.add('reject');
    flash('lost: ' + chip.p, 'var(--bad)');
    picked = null;
    setTimeout(() => {
      const closed = closeStranded();
      if (closed) { sfx('crash'); flash(closed === 1 ? 'one verb lost' : closed + ' verbs lost', 'var(--bad)'); }
      locked = false; drawBank(); paint();
      if (round.every(r => r.done || r.lost)) setTimeout(endDeal, 1100);
    }, 520);
  }
}

function closeStranded(){
  const left = bank.filter(c => !c.spent).map(c => c.p);
  let closed = 0;
  round.forEach((r, i) => {
    if (r.done || r.lost) return;
    const at = left.indexOf(r.particle);
    if (at === -1){
      r.lost = true; closed++;
      log(r.verb + ' ' + r.particle, false, { game:'pegs' });
      const pole = $('p' + i);
      if (pole){
        pole.classList.add('lost');
        pole.classList.remove('armed');
        $('s' + i).innerHTML = '<span class="ring">' + esc(r.particle) + '</span>';
      }
    } else {
      left.splice(at, 1);
    }
  });
  return closed;
}

function paint(){
  $('pegged').textContent = pegged;
  $('dropped').textContent = dropped;
  $('deals').textContent = deals;
  round.forEach((r, i) => {
    const el = $('p' + i);
    if (el) el.classList.toggle('armed', !r.done && !r.lost && picked !== null);
  });
}

function cleared(){
  sfx('fanfare');
  flash('all nine', 'var(--ok)');
  setTimeout(() => finishDeal(true), 1100);
}

function endDeal(){
  setTimeout(() => finishDeal(false), 1400);
}

function finishDeal(clean){
  const lost = round.filter(r => r.lost);
  try{ if (window.INTUITY) INTUITY.session('phrasal-verbs', 'pegs', { pegged: pegged, dropped: dropped, lost: lost.length }); }catch(e){}
  $('overBig').textContent = (PER_DEAL - lost.length) + ' / ' + PER_DEAL;
  $('overSub').textContent = clean
    ? 'the whole board · deal ' + deals
    : lost.length + (lost.length === 1 ? ' card lost' : ' cards lost') + ' · deal ' + deals;
  $('overLost').innerHTML = lost.length
    ? 'Worth another look: ' + lost.map(r =>
        '<b>' + esc(r.verb) + ' ' + esc(r.particle) + '</b>').join(' · ')
    : '';
  $('backBtn').disabled = at <= 0;
  $('over').classList.add('show');
}

function nextDeal(){
  $('over').classList.remove('show');
  deals++;
  if (at < history.length - 1){ at++; lay(history[at]); }
  else deal();
}

function backDeal(){
  if (at <= 0) return;
  $('over').classList.remove('show');
  at--; deals++;
  lay(history[at]);
}

function repeatDeal(){
  $('over').classList.remove('show');
  deals++;
  lay(history[at]);
}

function flash(text, col){
  const b = $('banner');
  b.textContent = text; b.style.color = col;
  b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
  setTimeout(() => b.classList.remove('show'), 1000);
}

function burst(el){
  /* Viewport coordinates, because the layer is fixed. The old maths was
     relative to .stage and had to add scrollTop to compensate — which is
     itself a sign the sparks were living inside a scroller. */
  const stage = document.getElementById('fx');
  const r = el.getBoundingClientRect();
  const cx = r.left + r.width / 2;
  const cy = r.top + r.height / 2;
  /* The old seven belonged to the dark theme — acid yellow, gold, mint and a
   sky blue that appears nowhere else. These are the board's own. */
  const COLS = ['#6B3FA0','#E8632A','#C2956E','#4A6B5C','#FFFFFF','#B44A22'];

  const card = el.closest ? el.closest('.pole') : null;
  if (card) card.animate(
    [{ transform:'scale(1)' }, { transform:'scale(1.06)', offset:.25 }, { transform:'scale(1)' }],
    { duration:340, easing:'cubic-bezier(.2,1.6,.4,1)' });

  const f = document.createElement('div');
  f.className = 'spark fw-flash';
  f.style.left = cx+'px'; f.style.top = cy+'px';
  stage.appendChild(f);
  f.animate([{ transform:'translate(-50%,-50%) scale(.15)', opacity:1 },
             { transform:'translate(-50%,-50%) scale(4.2)', opacity:0 }],
            { duration:460, easing:'cubic-bezier(.1,.8,.2,1)' });
  setTimeout(() => f.remove(), 480);

  [0, 130].forEach((delay, k) => setTimeout(() => {
    const ring = document.createElement('div');
    ring.className = 'spark fw-ring';
    ring.style.left = cx+'px'; ring.style.top = cy+'px';
    stage.appendChild(ring);
    ring.animate([{ transform:'translate(-50%,-50%) scale(.12)', opacity:.95 },
                  { transform:'translate(-50%,-50%) scale(' + (3 + k) + ')', opacity:0 }],
                 { duration:700 + k*180, easing:'cubic-bezier(.1,.7,.2,1)' });
    setTimeout(() => ring.remove(), 900 + k*180);
  }, delay));

  shell(stage, cx, cy, 26, 40, 120, 520, ['#ffffff','#FFD94A']);
  setTimeout(() => shell(stage, cx, cy, 46, 90, 260, 1150, COLS), 90);

  setTimeout(() => {
    for (let i = 0; i < 22; i++){
      const c = document.createElement('div');
      c.className = 'spark fw-crackle';
      const a = Math.random()*Math.PI*2, d = 30 + Math.random()*150;
      c.style.left = (cx + Math.cos(a)*d*.55)+'px';
      c.style.top  = (cy + Math.sin(a)*d*.55)+'px';
      stage.appendChild(c);
      c.animate([{opacity:0,transform:'translate(-50%,-50%) scale(.3)'},
                 {opacity:1,transform:'translate(-50%,-50%) scale(1.5)',offset:.22},
                 {opacity:0,transform:'translate(-50%,-50%) scale(.3)'}],
                {duration:300+Math.random()*300, easing:'ease-out'});
      setTimeout(() => c.remove(), 640);
    }
  }, 300);
}

function shell(stage, cx, cy, n, near, far, life, cols){
  for (let i = 0; i < n; i++){
    const p = document.createElement('div');
    p.className = 'spark';
    const col = cols[(Math.random()*cols.length)|0];
    const size = 3 + Math.random()*4.5;
    p.style.cssText += 'left:'+cx+'px; top:'+cy+'px; width:'+size+'px; height:'+size+
      'px; background:'+col+'; box-shadow:0 0 '+(size*3)+'px '+col+';';
    stage.appendChild(p);
    const a = Math.random()*Math.PI*2, d = near + Math.random()*(far-near);
    const dx = Math.cos(a)*d, dy = Math.sin(a)*d;
    const fall = 50 + Math.random()*110, dur = life * (.75 + Math.random()*.5);
    p.animate([
      { transform:'translate(-50%,-50%) translate(0,0) scale(1.3)', opacity:1 },
      { transform:'translate(-50%,-50%) translate('+(dx*.6).toFixed(0)+'px,'+(dy*.6-14).toFixed(0)+'px) scale(1)', opacity:1, offset:.4 },
      { transform:'translate(-50%,-50%) translate('+dx.toFixed(0)+'px,'+(dy+fall).toFixed(0)+'px) scale(.2)', opacity:0 }
    ], { duration:dur, easing:'cubic-bezier(.1,.75,.3,1)' });
    setTimeout(() => p.remove(), dur + 40);
  }
}

if (window.self !== window.top) document.body.classList.add('embedded');
boot();
</script>
</body>
</html>
