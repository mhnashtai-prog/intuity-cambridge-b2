<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTUITY — Pegs</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{ margin:0; padding:0; box-sizing:border-box; }
  :root{
    --gold:#C9A961; --accent:#FFD94A; --ok:#3f9d6d; --bad:#E86A5C;
    /* The table is dark; anything you pick up, place or lose is light. Pegs
       and Rack are the same game family and now share a material — what
       differs is the verb. Rack claims a finished card; here the card
       arrives incomplete and you build it. The blue plate is the particle,
       everywhere in the app. */
    --ink:#17171a; --plate:#2c4a9e;
    --card:#d5cfbb; --card-edge:#b3ac95;
    --paper:#e5e5e7; --dim:rgba(229,229,231,.55); --faint:rgba(229,229,231,.26);
    --header-h:96px; --bank-h:92px;
  }
  html,body{ width:100%; height:100%; overflow:hidden; background:#0d0d0d; }
  body{ font-family:'DM Sans',sans-serif; color:var(--paper); user-select:none; -webkit-user-select:none; }
  button{ font:inherit; color:inherit; background:none; border:none; cursor:pointer; }

  .header{
    position:fixed; top:0; left:0; right:0; z-index:20; height:var(--header-h);
    display:flex; flex-direction:column; gap:.35rem; padding:.5rem 1.25rem .4rem;
    background:rgba(13,13,13,.9); backdrop-filter:blur(20px);
    border-bottom:1px solid rgba(255,255,255,.06);
  }
  .htop{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; }
  .back{ justify-self:start; text-decoration:none; font-family:'Space Grotesk',sans-serif;
         font-size:.6rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:rgba(255,255,255,.3); }
  .title{ display:flex; flex-direction:column; align-items:center; line-height:1.1; }
  .title b{ font-family:'Space Grotesk',sans-serif; font-size:1rem; font-weight:900; letter-spacing:.22em; color:var(--gold); }
  .title span{ font-size:.56rem; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:rgba(255,255,255,.32); margin-top:.1rem; }
  .hud{ display:flex; justify-content:center; gap:1.3rem; font-family:'DM Mono',monospace; font-size:.66rem; color:var(--dim); }
  .hud b{ color:var(--paper); font-variant-numeric:tabular-nums; }

  /* Everything on one screen. It used to scroll, so a child saw four verbs
     at a time and dragged for the rest — which is a worksheet, not a board.
     Two columns of five fit the frame whole, and seeing the whole board is
     most of what makes a game feel like one. */
  .stage{
    position:fixed; top:var(--header-h); left:0; right:0; bottom:var(--bank-h);
    overflow:hidden; padding:.5rem .6rem;
    display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(201,169,97,.07), transparent 60%),
      radial-gradient(ellipse at 50% 100%, rgba(0,0,0,.5), transparent 55%);
  }
  /* Three by three at every size. On a phone this used to fall to a single
     column and ten stacked rows read as a worksheet — the layout was doing
     more to make it feel like an exercise than anything on the tiles. */
  .poles{
    display:grid; grid-template-columns:repeat(3,1fr); grid-auto-rows:1fr;
    gap:.45rem; width:100%; max-width:52rem; height:100%;
  }

  /* ── a pole ──
     The verb stands at the foot, the ring goes on the spike, the meaning is
     alongside. A row rather than a column, so ten fit on a phone. */
  /* The verb first, the ring after it: a phrasal verb is VERB + PARTICLE,
     and a board that shows "back take" forty times a session is teaching an
     order that does not exist. A game may bend a lot of things, but not the
     shape of the thing it is teaching. */
  /* A tile you could pick up, rather than a line in a list: the verb over
     the post, the meaning beneath, the whole thing square enough to read as
     a piece on a board. */
  .pole{
    position:relative; min-height:0; overflow:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:.15rem; padding:.4rem .45rem .35rem; border-radius:.4rem; text-align:center;
    background:linear-gradient(178deg, var(--card) 0%, #c4bda6 100%);
    border:1px solid var(--card-edge);
    box-shadow:0 .28rem .55rem rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.55);
    transition:border-color .18s, transform .14s cubic-bezier(.2,1.4,.4,1), box-shadow .18s;
  }

  /* When a ring is in hand every open pole lifts and glows: the board looks
     like it is waiting, which is the moment a game feels alive. */
  /* A card waiting for a plate: the well lights and the card lifts. */
  .pole.armed{ cursor:pointer; border-color:var(--plate);
    box-shadow:0 .4rem .9rem rgba(0,0,0,.6), 0 0 0 2px rgba(44,74,158,.35); }
  .pole.armed:hover{ transform:translateY(-4px) rotate(-.5deg); }
  .pole.armed .spike{ border-color:var(--plate); background:rgba(44,74,158,.13); }
  .pole .verb{
    font-family:'Space Grotesk',sans-serif; font-weight:900; color:var(--ink);
    font-size:clamp(.9rem,3.4vw,1.2rem); letter-spacing:.01em; line-height:1.05;
  }
  /* the spike, with a ring resting on it once pegged */
  /* The empty well, cut into the card where the plate belongs. A card with
     a hole in it says "unfinished" more plainly than any instruction. */
  .spike{
    position:relative; width:100%; min-height:1.35rem; margin-top:auto;
    display:flex; align-items:center; justify-content:center;
    border:1px dashed rgba(23,23,26,.3); border-radius:.15rem;
    background:rgba(23,23,26,.06);
    box-shadow:inset 0 1px 3px rgba(0,0,0,.18);
    transition:background .18s, border-color .18s;
  }
  /* The plate itself — the same blue name-plate a finished card carries in
     Rack, so completing one here produces exactly that card. */
  .ring{
    position:absolute; inset:-1px; z-index:2; border-radius:.15rem;
    display:flex; align-items:center; justify-content:center; white-space:nowrap;
    background:var(--plate); color:#fff;
    font-family:'Space Grotesk',sans-serif; font-weight:700;
    font-size:clamp(.66rem,2.5vw,.86rem); letter-spacing:.02em;
    box-shadow:0 1px 3px rgba(0,0,0,.4);
  }
  .pole.pegged{ border-color:var(--ok); }
  .pole.pegged .spike{ border-style:solid; border-color:transparent; }
  .pole.pegged .ring{ background:var(--ok); }
  .ring.drop{ animation:drop .34s cubic-bezier(.3,1.5,.5,1); }
  @keyframes drop{ from{ transform:translateY(-1.6rem) scale(.9); opacity:0; } }
  /* A pole whose ring was spent elsewhere. It cannot be finished, so it
     shows what it wanted and closes — the mistake still costs the verb, but
     the child is told which verb they lost and what it needed. Being
     stranded in front of an unanswerable pole teaches nothing. */
  .pole.lost{ border-color:var(--bad); filter:grayscale(.55) brightness(.82); }
  .pole.lost .ring{ background:var(--bad); }
  .pole.lost .spike{ border-color:transparent; }

  .pole.reject{ animation:reject .45s; border-color:var(--bad); }
  @keyframes reject{ 0%,100%{transform:none} 20%{transform:translateX(-10px)} 45%{transform:translateX(9px)} 70%{transform:translateX(-4px)} }
  /* One sense, one line. A three-clause gloss turns the board into reading
     matter; the full entry lives in Learn, where there is room for it. */
  .meaning{
    font-size:clamp(.6rem,2.2vw,.75rem); line-height:1.25; color:#3a382f;
    overflow:hidden; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical;
  }

  /* ── the bank ── */
  .bank{
    position:fixed; bottom:0; left:0; right:0; height:var(--bank-h);
    background-image:linear-gradient(180deg, rgba(201,169,97,.07), transparent 40%);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.35rem;
    padding:.4rem .6rem; background:rgba(13,13,13,.94); backdrop-filter:blur(20px);
    border-top:1px solid rgba(201,169,97,.22);
  }
  .banklabel{ font-family:'DM Mono',monospace; font-size:.54rem; letter-spacing:.16em;
              text-transform:uppercase; color:var(--faint); }
  .chips{ display:flex; flex-wrap:wrap; justify-content:center; gap:.35rem; max-width:60rem; }
  .chip{
    padding:.34rem .8rem .38rem; border-radius:.18rem; white-space:nowrap;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:clamp(.75rem,2.3vw,.95rem);
    background:var(--plate); color:#fff;
    border:1px solid rgba(255,255,255,.14); box-shadow:0 2px 6px rgba(0,0,0,.5);
    transition:all .15s;
  }
  .chip:hover{ transform:translateY(-2px); }
  .chip.picked{ background:var(--accent); color:#12100a; transform:translateY(-4px) scale(1.06);
                box-shadow:0 4px 12px rgba(255,217,74,.35); }
  .chip.spent{ display:none; }

  .deal{
    padding:.55rem 1.5rem; border-radius:99px; background:var(--accent); color:#12100a;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:.72rem;
    letter-spacing:.14em; text-transform:uppercase;
  }

  /* ── the burst ── */
  .spark{ position:absolute; width:5px; height:5px; border-radius:50%; pointer-events:none; z-index:30; }
  .fw-flash{ width:60px; height:60px; border-radius:50%;
             background:radial-gradient(circle,#fff 0%,#FFD94A 35%,rgba(255,217,74,0) 70%); }
  .fw-crackle{ width:3px; height:3px; border-radius:50%; background:#fff; box-shadow:0 0 8px #fff; }

  .banner{
    position:fixed; left:50%; top:44%; z-index:40; pointer-events:none;
    font-family:'Space Grotesk',sans-serif; font-weight:900;
    font-size:clamp(1.4rem,5vw,2.4rem); letter-spacing:.14em; text-transform:uppercase;
    opacity:0; transform:translate(-50%,-50%) scale(.8);
    transition:opacity .2s, transform .4s cubic-bezier(.2,1.6,.4,1); text-shadow:0 0 22px currentColor;
  }
  .banner.show{ opacity:1; transform:translate(-50%,-50%) scale(1); }
  .loading{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; color:var(--dim); font-size:.8rem; }
  .err{ color:var(--bad); text-align:center; max-width:30rem; line-height:1.7; padding:2rem; }

  /* In a short frame — the rules page iframe is about 290px tall — three
     lines of gloss and a full-height post do not both fit. The gloss gives
     up a line rather than clipping mid-word, and the post shortens. */
  @media (max-height:430px){
    .pole{ gap:0; padding:.25rem .35rem; }
    .meaning{ -webkit-line-clamp:2; }
    .spike{ height:1.5rem; }
    .spike::before{ height:.85rem; }
  }

  /* the rules page shows the title already */
  body.embedded{ --header-h:40px; }
  body.embedded .htop{ display:none; }
  body.embedded .header{ padding:.3rem 1rem .25rem; justify-content:center; }
</style>
</head>
<body>

<header class="header">
  <div class="htop">
    <a class="back" href="/?openModal=grammar">← Grammar</a>
    <div class="title"><b>INTUITY</b><span>Phrasal Verbs</span></div>
    <div></div>
  </div>
  <div class="hud">
    <span><b id="pegged">0</b> pegged</span>
    <span><b id="dropped">0</b> dropped</span>
    <span>deal <b id="deals">1</b></span>
  </div>
</header>

<div class="stage"><div class="poles" id="poles"></div></div>

<div class="bank">
  <div class="banklabel" id="bankLabel">tap a particle, then the verb it belongs to</div>
  <div class="chips" id="chips"></div>
</div>

<div class="banner" id="banner"></div>
<div class="loading" id="loading">Loading…</div>

<script>
/* ======================================================================
   PEGS

   Ten verbs stand waiting, each with its meaning beside it, and the
   particles sit in a bank along the bottom. Take a particle, put it on the
   verb it belongs to.

   The bank is consuming: each particle is there once for each verb that
   needs it, and no more. So a particle put on the wrong verb is not merely
   wrong — it is gone, and the verb that needed it can no longer be
   finished. That is the mechanic your phrasal quiz already had, and it is
   what stops a child working by elimination without ever reading a meaning.

   Deal again and the verbs and the particles are different.
====================================================================== */

const DATA_URL = '../../data/grammar-rules/phrasal-verbs-data.json';
/* Nine, not ten: three by three is a board, and ten is a list with a
   remainder. The shape of the grid does more for how this reads than any
   amount of styling on the tiles. */
const PER_DEAL = 9;

let POOL = [], round = [], bank = [], picked = null;
let pegged = 0, dropped = 0, deals = 1, locked = false;

const $ = id => document.getElementById(id);
/* Keep the first sense only. The board has to be readable at a glance, and
   "to hit with a vehicle; to exceed time limit" is two lessons in one line. */
const firstSense = m => String(m).split(';')[0].trim();
const esc = t => String(t).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const shuffle = a => { const b=[...a]; for(let i=b.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[b[i],b[j]]=[b[j],b[i]];} return b; };

async function boot(){
  try{
    const res = await fetch(DATA_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const d = await res.json();
    /* Items in a MIX group carry their own verb; the rest take the group's. */
    (d.groups || []).forEach(g => (g.items || []).forEach(it => {
      if (it.particle && it.meaning)
        POOL.push({ verb: (it.verb || g.label || g.id).toUpperCase(),
                    particle: it.particle.toLowerCase(),
                    meaning: it.meaning });
    }));
    if (!POOL.length) throw new Error('no phrases in the data');
    $('loading').remove();
    deal();
  }catch(e){
    $('loading').innerHTML = '<p class="err">Could not load <b>' + DATA_URL + '</b>.<br>' +
      'Open this from the site rather than as a local file — browsers block file:// requests.</p>';
  }
}

function deal(){
  /* A fresh ten every time, so the same verbs do not come round twice in a
     sitting unless the pool is small. */
  round = shuffle(POOL).slice(0, PER_DEAL).map(it => ({ ...it, done:false, lost:false }));
  /* One ring per verb that needs it — no spares, and no shortages. */
  bank = shuffle(round.map(r => r.particle)).map((p, i) => ({ p, id:i, spent:false }));
  picked = null; locked = false;
  drawPoles(); drawBank(); paint();
}

function drawPoles(){
  const box = $('poles'); box.innerHTML = '';
  round.forEach((r, i) => {
    const el = document.createElement('div');
    el.className = 'pole';
    el.id = 'p' + i;
    /* verb, then the post it takes, then what it means — the order the
       phrase is actually said in */
    el.innerHTML = '<div class="verb">' + esc(r.verb) + '</div>' +
                   '<div class="spike" id="s' + i + '"></div>' +
                   '<div class="meaning">' + esc(firstSense(r.meaning)) + '</div>';
    el.onclick = () => peg(i);
    box.appendChild(el);
  });
}

function drawBank(){
  const box = $('chips'); box.innerHTML = '';
  bank.forEach(c => {
    const el = document.createElement('button');
    el.className = 'chip' + (c.spent ? ' spent' : '') + (picked === c.id ? ' picked' : '');
    el.textContent = c.p;
    el.onclick = e => { e.stopPropagation(); pick(c.id); };
    box.appendChild(el);
  });
  const left = bank.filter(c => !c.spent).length;
  $('bankLabel').textContent = left
    ? (picked === null ? 'tap a particle, then the verb it belongs to'
                       : 'now tap the verb it belongs to')
    : 'the bank is empty — deal again';
  if (!left){
    const b = document.createElement('button');
    b.className = 'deal'; b.textContent = 'Deal ten more';
    b.onclick = () => { deals++; deal(); };
    box.appendChild(b);
  }
}

function pick(id){
  const c = bank.find(x => x.id === id);
  if (!c || c.spent || locked) return;
  picked = (picked === id) ? null : id;
  drawBank();
}

function peg(i){
  if (locked || picked === null) return;
  const slot = round[i], chip = bank.find(x => x.id === picked);
  if (!slot || slot.done || slot.lost || !chip) return;

  if (chip.p === slot.particle){
    locked = true;
    slot.done = true; chip.spent = true; pegged++;
    const pole = $('p' + i);
    pole.classList.add('pegged');
    pole.classList.remove('armed');
    $('s' + i).innerHTML = '<span class="ring drop">' + esc(chip.p) + '</span>';
    picked = null;
    drawBank(); paint();
    burst($('s' + i));
    setTimeout(() => {
      locked = false;
      if (round.every(r => r.done)) cleared();
      else if (round.every(r => r.done || r.lost)) endDeal();
    }, 320);
  } else {
    /* The horrible surprise: the ring is spent whether or not it fitted, so
       the verb that needed it can no longer be finished. The bank tells the
       truth about what is left. */
    locked = true;
    chip.spent = true; dropped++;
    const pole = $('p' + i);
    pole.classList.remove('reject'); void pole.offsetWidth; pole.classList.add('reject');
    flash('lost: ' + chip.p, 'var(--bad)');
    picked = null;
    setTimeout(() => {
      const closed = closeStranded();
      if (closed) flash(closed === 1 ? 'one verb lost' : closed + ' verbs lost', 'var(--bad)');
      locked = false; drawBank(); paint();
      if (round.every(r => r.done || r.lost)) setTimeout(endDeal, 1100);
    }, 520);
  }
}

/* After every peg, check that each unfinished pole can still be finished.
   The bank holds one ring per verb, so a ring spent on the wrong pole
   leaves another with nothing that fits. Rather than let the deal die in
   silence, those poles are closed at once and shown the particle they
   wanted. */
function closeStranded(){
  const left = bank.filter(c => !c.spent).map(c => c.p);
  let closed = 0;
  round.forEach((r, i) => {
    if (r.done || r.lost) return;
    const at = left.indexOf(r.particle);
    if (at === -1){
      r.lost = true; closed++;
      const pole = $('p' + i);
      if (pole){
        pole.classList.add('lost');
        pole.classList.remove('armed');
        $('s' + i).innerHTML = '<span class="ring">' + esc(r.particle) + '</span>';
      }
    } else {
      left.splice(at, 1);          // this ring is spoken for
    }
  });
  return closed;
}

function paint(){
  $('pegged').textContent = pegged;
  $('dropped').textContent = dropped;
  $('deals').textContent = deals;
  /* Poles a picked ring could still go on light up, so the choice is about
     meaning rather than about hunting for a live target. */
  round.forEach((r, i) => {
    const el = $('p' + i);
    if (el) el.classList.toggle('armed', !r.done && !r.lost && picked !== null);
  });
}

function cleared(){
  flash('all ten', 'var(--ok)');
  setTimeout(() => { deals++; deal(); }, 1200);
}

/* Nothing left to peg, but not a clean sweep: hold the board a moment so
   the lost verbs can be read, then move on. */
function endDeal(){
  const lost = round.filter(r => r.lost).length;
  flash(lost + (lost === 1 ? ' verb lost' : ' verbs lost') + ' — dealing again', 'var(--bad)');
  setTimeout(() => { deals++; deal(); }, 2600);
}

function flash(text, col){
  const b = $('banner');
  b.textContent = text; b.style.color = col;
  b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
  setTimeout(() => b.classList.remove('show'), 1000);
}

/* ── the burst, at the ring that just landed ── */
function burst(el){
  const stage = document.querySelector('.stage');
  const s = stage.getBoundingClientRect(), r = el.getBoundingClientRect();
  const cx = r.left - s.left + r.width/2, cy = r.top - s.top + r.height/2 + stage.scrollTop;
  const COLS = ['#FFD94A','#C9A961','#5ED39B','#ff7a45','#ffffff','#7dd3fc'];

  const f = document.createElement('div');
  f.className = 'spark fw-flash';
  f.style.left = cx+'px'; f.style.top = cy+'px';
  stage.appendChild(f);
  f.animate([{transform:'translate(-50%,-50%) scale(.2)',opacity:1},
             {transform:'translate(-50%,-50%) scale(3)',opacity:0}],
            {duration:380,easing:'cubic-bezier(.1,.8,.2,1)'});
  setTimeout(()=>f.remove(),400);

  for (let i=0;i<32;i++){
    const p = document.createElement('div');
    p.className = 'spark';
    const col = COLS[(Math.random()*COLS.length)|0], size = 3+Math.random()*3.5;
    p.style.cssText += 'left:'+cx+'px; top:'+cy+'px; width:'+size+'px; height:'+size+
      'px; background:'+col+'; box-shadow:0 0 '+(size*2.5)+'px '+col+';';
    stage.appendChild(p);
    const a = Math.random()*Math.PI*2, d = 50+Math.random()*140;
    const dx = Math.cos(a)*d, dy = Math.sin(a)*d, fall = 45+Math.random()*70;
    const dur = 700+Math.random()*420;
    p.animate([
      {transform:'translate(-50%,-50%) translate(0,0) scale(1.1)',opacity:1},
      {transform:'translate(-50%,-50%) translate('+(dx*.62).toFixed(0)+'px,'+(dy*.62-10).toFixed(0)+'px) scale(1)',opacity:1,offset:.42},
      {transform:'translate(-50%,-50%) translate('+dx.toFixed(0)+'px,'+(dy+fall).toFixed(0)+'px) scale(.25)',opacity:0}
    ],{duration:dur,easing:'cubic-bezier(.12,.75,.3,1)'});
    setTimeout(()=>p.remove(),dur+30);
  }

  setTimeout(()=>{
    for (let i=0;i<12;i++){
      const c = document.createElement('div');
      c.className = 'spark fw-crackle';
      const a = Math.random()*Math.PI*2, d = 22+Math.random()*80;
      c.style.left = (cx+Math.cos(a)*d*.5)+'px'; c.style.top = (cy+Math.sin(a)*d*.5)+'px';
      stage.appendChild(c);
      c.animate([{opacity:0,transform:'translate(-50%,-50%) scale(.4)'},
                 {opacity:1,transform:'translate(-50%,-50%) scale(1.3)',offset:.25},
                 {opacity:0,transform:'translate(-50%,-50%) scale(.3)'}],
                {duration:280+Math.random()*220,easing:'ease-out'});
      setTimeout(()=>c.remove(),560);
    }
  },200);
}

if (window.self !== window.top) document.body.classList.add('embedded');
boot();
</script>
</body>
</html>
