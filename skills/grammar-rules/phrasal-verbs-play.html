<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FAF7F2">
<title>INTUITY — Phrasal Verbs</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=4">

<style>
/* ═══ WHAT ONLY THIS PAGE OWNS ═══
   This is the phrasal-verbs host: Explore reads in the page, and Practice,
   Quiz, Pegs, Rack and Pairs are framed. Tokens, header, mode row, set tabs,
   the tile family and the sheet treatment come from the shell.

   Three things went with the dark theme:
     · the six emoji in the mode row — the words are the navigation
     · the per-family colour pushed onto :root from the JSON's `color`
       fields, which were chosen to glow on black
     · the hard-coded "calc(100vh - 250px)" the iframe used to guess its
       height with. The frames are shell sheets now and inherit the same
       geometry as every other framed mode in the product.
   ═══════════════════════════════════════════════════════════════════════ */

html,body{height:100%;overflow:hidden}

/* ── EXPLORE'S OWN CONTROL ROW ───────────────────────────────────────────
   The verb stepper and the WATCH/LIST switch belong to Explore, not to the
   product, so they sit inside Explore rather than in the header. The header
   holds only what is true in every mode. */
.explore-controls{display:flex;align-items:center;justify-content:center;
  flex-wrap:wrap;gap:.6rem 1.1rem;padding:.7rem .75rem .2rem;flex:none}

.verb-step{display:none;align-items:center;gap:.5rem}
.verb-step.show{display:flex}
.verb-step-btn{width:28px;height:28px;border-radius:50%;flex:none;
  display:flex;align-items:center;justify-content:center;
  background:var(--tile-bg);color:var(--tile-ink);border:none;cursor:pointer;
  font-family:var(--f-display);font-size:.9rem;font-weight:700;
  transition:background .15s,transform .1s}
.verb-step-btn:hover:not(:disabled){background:var(--tile-bg-press)}
.verb-step-btn:active:not(:disabled){transform:scale(.92)}
.verb-step-btn:disabled{opacity:.3;cursor:default}
.verb-step-now{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--faint);min-width:8rem;text-align:center}

/* Two states, so it is two buttons rather than a switch with two labels:
   the same shape as every other choice on the page. */
.view-mode-container{display:flex}
.view-mode-container.hidden{display:none}
.toggle-container{display:flex;align-items:center;gap:.25rem;padding:.15rem;
  border-radius:var(--r-chip);background:var(--slot-bg)}
.toggle-label{font-family:var(--f-display);font-size:.6rem;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;color:var(--faint);
  padding:.3rem .8rem;border-radius:var(--r-chip);cursor:pointer;
  transition:background .15s,color .15s}
.toggle-label.active{background:var(--card);color:var(--tile-ink);font-weight:700}
/* the switch itself is gone; the labels are the control */
.toggle-switch{display:none}

/* ── SET TABS ────────────────────────────────────────────────────────── */
#categorySelector{display:none}
#categorySelector.show{display:flex}

/* ── AREAS ───────────────────────────────────────────────────────────────
   Mirrors the shell's .area: fixed under the header, one of them visible. */
.content-area{position:fixed;top:var(--header-h);left:0;right:0;bottom:0;
  overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .22s ease,visibility 0s linear .22s}
.content-area.active{opacity:1;visibility:visible;pointer-events:auto;
  transition:opacity .22s ease,visibility 0s;
  display:flex;flex-direction:column}

/* Framed modes are presented as sheets, exactly as Practice and Quiz are on
   every other topic — same scrim, same radius, same shoulder. */
.content-area.framed{overflow:hidden;z-index:25;background:var(--scrim);
  padding:.9rem .75rem 0}
.content-area.framed.active{align-items:center}
.iframe-container{position:relative;display:flex;flex-direction:column;
  width:100%;max-width:min(94vw,1100px);flex:1;min-height:0;overflow:hidden;
  border-radius:var(--r-sheet) var(--r-sheet) 0 0;background:var(--screen);
  box-shadow:0 -6px 30px rgba(43,33,41,.14)}
.iframe-container iframe{width:100%;height:100%;flex:1;border:none;
  display:block;background:var(--screen)}
@media(min-width:761px){
  .content-area.framed{padding:1.1rem 1.1rem 0}
  .iframe-container{border-radius:var(--r-sheet);
    box-shadow:0 10px 44px rgba(43,33,41,.14)}
}

/* ── EXPLORE · WATCH ─────────────────────────────────────────────────────
   One card, one phrase. It had a rim, a 60px black shadow and a 40px gold
   glow; on cream a white fill and a radius carry it. */
.watch-mode{flex:1;min-height:0;display:flex;padding:.6rem}
.modal-card{position:relative;flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;overflow:hidden;
  width:100%;max-width:min(94vw,1100px);margin:0 auto;padding:2.6rem 2rem 3.4rem;
  border-radius:var(--r-sheet);background:var(--card);border:none;
  box-shadow:0 8px 30px rgba(43,33,41,.08);
  opacity:0;transform:scale(.98);animation:cardAppear .4s ease forwards}
.modal-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:var(--accent)}
@keyframes cardAppear{to{opacity:1;transform:scale(1)}}

.card-content{width:100%;text-align:center;opacity:0;transition:opacity .5s ease}
.card-content.show{opacity:1}

/* The citation form is the one place mono earns its keep: it is a label for
   a form, not a sentence to read. */
.expression{display:inline-block;font-family:var(--f-mono);font-size:.86rem;
  font-weight:500;letter-spacing:.1em;text-transform:uppercase;
  color:var(--tile-ink);background:var(--tile-bg);
  border-radius:var(--r-chip);padding:.45rem 1.1rem;margin-bottom:1.4rem}
.meaning{font-size:1rem;line-height:1.6;color:var(--faint);margin-bottom:2rem}

.sentence-container{margin-bottom:1.4rem}
.sentence-label{font-family:var(--f-mono);font-size:.58rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint);margin-bottom:.9rem}
.sentence{font-family:var(--f-display);font-weight:700;line-height:1.3;
  letter-spacing:-.02em;color:var(--ink)}
/* Same three steps as PV1's .phrase-text, chosen off the same word count, so
   a sentence is the same size in Explore as it is in Quiz. It was one fixed
   clamp capped at 1.9rem — half the size of the identical sentence next
   door, which is what showed up on a projector. */
.sentence.size-small{font-size:clamp(2rem,5vw,3.4rem)}
.sentence.size-medium{font-size:clamp(1.6rem,4vw,2.6rem)}
.sentence.size-large{font-size:clamp(1.25rem,3vw,2rem)}
/* --target is the shell's grammar-signal colour. It was #60a5fa on a blue
   wash here — a hue that appears nowhere else in the product. */
.highlight{color:var(--target);font-weight:900;background:none;padding:0}
.arrow{font-size:1.5rem;color:var(--rule);margin:1rem 0}

.controls{display:flex;gap:.7rem;justify-content:center;margin-top:2rem}
.control-btn{width:44px;height:44px;border-radius:50%;flex:none;
  display:flex;align-items:center;justify-content:center;
  background:var(--tile-bg);color:var(--tile-ink);border:none;cursor:pointer;
  font-family:var(--f-display);font-size:1rem;font-weight:700;
  transition:background .15s,transform .1s}
.control-btn:hover:not(:disabled){background:var(--tile-bg-press)}
.control-btn:active:not(:disabled){transform:scale(.92)}
.control-btn:disabled{opacity:.25;cursor:not-allowed}
.control-btn.play{width:54px;height:54px;background:var(--accent);color:#FFF7F3}
.control-btn.play:hover{background:var(--accent)}

.progress{position:absolute;bottom:1.4rem;left:1.6rem;
  font-family:var(--f-mono);font-size:.78rem;color:var(--faint);
  font-variant-numeric:tabular-nums}
.progress .current{color:var(--paper);font-weight:500}

/* ── EXPLORE · LIST ──────────────────────────────────────────────────── */
.list-mode{display:none}
.list-mode.show{display:block;animation:fadeIn .3s ease forwards}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.list-container{display:flex;flex-direction:column;gap:.8rem;
  width:100%;max-width:min(94vw,1100px);margin:0 auto;padding:.6rem .6rem 2rem}
.list-item{padding:1.4rem 1.5rem;border:none;border-radius:var(--r-sheet);
  background:var(--card);box-shadow:0 4px 18px rgba(43,33,41,.06);
  transition:transform .12s cubic-bezier(.2,.8,.2,1)}
.list-item:hover{transform:translateY(-2px)}
.list-expression{display:inline-block;font-family:var(--f-mono);font-size:.76rem;
  font-weight:500;letter-spacing:.1em;text-transform:uppercase;
  color:var(--tile-ink);background:var(--tile-bg);
  border-radius:var(--r-chip);padding:.35rem .85rem;margin-bottom:.85rem}
.list-meaning{font-size:.92rem;line-height:1.6;color:var(--faint);
  margin-bottom:1rem}
.list-sentences{display:flex;flex-direction:column;gap:1rem}
.list-sentence-row{display:flex;flex-direction:column;gap:.45rem}
.list-sentence-label{font-family:var(--f-mono);font-size:.56rem;
  letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.list-sentence{font-family:var(--f-display);font-weight:700;font-size:1.05rem;
  line-height:1.5;letter-spacing:-.015em;color:var(--ink)}
.list-arrow{font-size:1.1rem;color:var(--rule);text-align:center;margin:.3rem 0}

@media(max-width:600px){
  .watch-mode{padding:.3rem .6rem .9rem}
  .modal-card{padding:1.8rem 1.2rem 3rem}
  .list-container{padding:.3rem .6rem 2rem}
  .list-item{padding:1.2rem 1.1rem}
  .verb-step-now{min-width:6.5rem;font-size:.62rem}
}
</style>
</head>
<body>

<header class="header">
  <div class="header-top">
<a class="back-link" href="/?panel=vocabulary" target="_top">← Vocabulary</a>
    <div class="header-title">
      <div class="app-title">INTUITY</div>
      <div class="app-subtitle" id="subtitle">B2 First Phrasal Verbs</div>
    </div>
    <span class="header-spacer">Level <b>B2–C1</b></span>
  </div>

  <!-- Six emoji used to sit here: the loudest thing on a page whose whole
       palette is warm grey and one orange, each one saying what the word
       beside it already said. -->
  <div class="mode-selector">
    <button class="mode-btn active" data-mode="explore" onclick="switchMainMode('explore')">Explore</button>
    <button class="mode-btn" data-mode="practice" onclick="switchMainMode('practice')">Practice</button>
    <button class="mode-btn" data-mode="quiz" onclick="switchMainMode('quiz')">Quiz</button>
    <button class="mode-btn" data-mode="pegs" onclick="switchMainMode('pegs')">Pegs</button>
    <button class="mode-btn" data-mode="rack" onclick="switchMainMode('rack')">Rack</button>
    <button class="mode-btn" data-mode="pairs" onclick="switchMainMode('pairs')">Pairs</button>
  </div>

  <!-- The verb families are set tabs, drawn where every other topic draws
       them, so changing verb is the same gesture as changing rule. -->
  <div class="set-tabs" id="categorySelector"></div>
</header>

<!-- EXPLORE -->
<div class="content-area active" id="exploreArea">

  <div class="explore-controls">
    <div class="verb-step" id="verbStep">
      <button class="verb-step-btn" id="verbPrev" onclick="stepVerb(-1)" aria-label="Previous verb">&#8249;</button>
      <span class="verb-step-now" id="verbNow"></span>
      <button class="verb-step-btn" id="verbNext" onclick="stepVerb(1)" aria-label="Next verb">&#8250;</button>
    </div>
    <div class="view-mode-container" id="viewModeContainer">
      <div class="toggle-container">
        <span class="toggle-label active" id="watchLabel">Watch</span>
        <div class="toggle-switch" id="viewModeToggle"><div class="toggle-slider"></div></div>
        <span class="toggle-label" id="listLabel">List</span>
      </div>
    </div>
  </div>

  <div class="watch-mode" id="watchMode">
    <div class="modal-card">
      <div class="card-content" id="cardContent">
        <div class="expression" id="expression"></div>
        <div class="meaning" id="meaning"></div>

        <div class="sentence-container" id="normalContainer">
          <div class="sentence-label">NORMAL</div>
          <div class="sentence" id="normalSentence"></div>
        </div>

        <div class="arrow" id="arrow">↓</div>

        <div class="sentence-container" id="invertedContainer">
          <div class="sentence-label">EXAMPLE IN CONTEXT</div>
          <div class="sentence" id="invertedSentence"></div>
        </div>
      </div>

      <div class="controls">
        <button class="control-btn" id="prevBtn" aria-label="Previous">&#8249;</button>
        <button class="control-btn play" id="playBtn" aria-label="Play">&#9654;</button>
        <button class="control-btn" id="nextBtn" aria-label="Next">&#8250;</button>
      </div>

      <div class="progress">
        <span class="current" id="current">1</span> / <span id="total">0</span>
      </div>
    </div>
  </div>

  <div class="list-mode" id="listMode">
    <div class="list-container" id="listContainer"></div>
  </div>
</div>

<!-- The five framed modes. Each is a sheet: same scrim, same radius, same
     shoulder as Practice and Quiz on every other topic. -->
<div class="content-area framed" id="practiceArea">
  <div class="iframe-container"><iframe id="practiceIframe" src="" title="Practice"></iframe></div>
</div>

<div class="content-area framed" id="quizArea">
  <div class="iframe-container"><iframe id="quizIframe" src="" title="Quiz"></iframe></div>
</div>

<!-- PEGS: ten verbs, a bank of particles, and no spares -->
<div class="content-area framed" id="pegsArea">
  <div class="iframe-container"><iframe id="pegsIframe" src="" title="Pegs"></iframe></div>
</div>

<!-- RACK: sixteen cards, one chance each, and the wrong ones fall -->
<div class="content-area framed" id="rackArea">
  <div class="iframe-container"><iframe id="rackIframe" src="" title="Rack"></iframe></div>
</div>

<!-- PAIRS: concentration, and the only game here that takes two players -->
<div class="content-area framed" id="pairsArea">
  <div class="iframe-container"><iframe id="pairsIframe" src="" title="Pairs"></iframe></div>
</div>

  <script>
// ==================== STATE ====================
let grammarData = null;
let currentCategory = null;      // group id: 'take', 'mix1', … — EXPLORE'S OWN. Defaults
                                  // to the first family so the slideshow has something to
                                  // show the instant you land on Explore.
let gamesCategory = null;        // group id the BOARD GAMES use — stays null until the
                                  // learner actually taps a family tab. Kept apart from
                                  // currentCategory on purpose: Explore needing a starting
                                  // slide is not the same thing as Pegs/Rack/Pairs being
                                  // handed a verb nobody chose. While this is null, gameSrc()
                                  // omits ?verb= entirely and the game falls back to its own
                                  // full-pool mix — which is exactly what the MIX tabs already
                                  // represent, so an unpicked band reads as "playing the mix"
                                  // rather than as a blank or broken screen.
let currentIndex = 0;
let isPlaying = false;
let playInterval = null;
let viewMode = 'watch';
let slides = [];
let currentMainMode = 'explore';
let GROUPS = [];
let VERB_ORDER = [];

const JSON_FILE = '../../data/grammar-rules/phrasal-verbs-data.json';

const baseVerbOf = (item, group) => item.verb || group.id;
const formOf     = (item, group) => item.form || item.verb || group.id;

/* ── VERB THEME, RETIRED ──
   The families still exist — they are the set tabs — but they no longer
   repaint the page. The `color` / `colorRgb` fields in the JSON were picked
   to glow on #0d0d0d; on cream the same six read as highlighter, and the
   shell marks an active item by weight and fill, never by colour alone.
   Kept as a no-op so the call sites read like every other page's, and so
   this is one function to restore if the colour is wanted back. */
function applyVerbTheme(group) {}

/* --header-h is a default in the shell, not a measurement. This header wraps
   to two or three rows depending on width, so the page reads its own height
   back into the token — same call, same listener, as PV1. Everything fixed
   below the header (the areas, the sheets) keys off it. */
function syncHeaderHeight(){
  const h = document.querySelector('.header');
  if (!h) return;
  document.documentElement.style.setProperty('--header-h', h.offsetHeight + 'px');
}
window.addEventListener('resize', syncHeaderHeight);

/* ── SET TABS, SYNCED TO WHICHEVER CATEGORY IS "CURRENT" FOR THIS MODE ──
   The band is one shared row of buttons across six modes, but which
   category it should be highlighting is not the same variable in all of
   them: Explore always has a current slide (currentCategory), the three
   board games may have chosen nothing yet (gamesCategory, possibly null).
   Reading the right one here — instead of hardcoding "index 0" at build
   time — is what stops the tab row from claiming TAKE is selected before
   anyone has tapped it. */
function syncCategoryTabs(){
  const activeId = currentMainMode === 'explore' ? currentCategory : gamesCategory;
  document.querySelectorAll('.vtab').forEach(btn =>
    btn.classList.toggle('active', btn.dataset.group === activeId));
}

// ==================== MAIN MODE SWITCHING ====================
function switchMainMode(mode) {
  if (mode === currentMainMode) return;

  currentMainMode = mode;
  if (isPlaying) pause();

  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.mode === mode);
  });
  document.querySelectorAll('.content-area').forEach(area => {
    area.classList.remove('active');
  });

  const viewModeContainer = document.getElementById('viewModeContainer');
  const categorySelector = document.getElementById('categorySelector');

  /* THE BAND NEVER LEAVES. It used to be shown for Explore and stripped for
     everything else — so the moment a child reached Pegs, Rack or Pairs the
     ten verb families vanished and the game dealt from the whole pool on
     their behalf. Quiz and Practice got away with it because the framed page
     draws its own tabs inside the frame; the three board games have none, so
     they were the product deciding FOR the student.

     It stays up for them now and drives the frame: a tap reloads the iframe
     with ?verb=<id>, which each game reads on boot. Until that tap happens,
     gamesCategory is still null and the frame loads with no ?verb= at all —
     see the note by its declaration above. */
  const BANDED = ['explore', 'pegs', 'rack', 'pairs'];

  if (mode === 'explore') {
    viewModeContainer.classList.remove('hidden');
    categorySelector.classList.add('show');
    document.getElementById('exploreArea').classList.add('active');
  } else {
    viewModeContainer.classList.add('hidden');
    categorySelector.classList.toggle('show', BANDED.includes(mode));

    if (mode === 'practice') {
      document.getElementById('practiceArea').classList.add('active');
      const iframe = document.getElementById('practiceIframe');
      if (!iframe.src || !iframe.src.includes('phrasal-verbs-practice.html')) {
        iframe.src = 'phrasal-verbs-practice.html';
      }
    } else if (mode === 'pairs') {
      document.getElementById('pairsArea').classList.add('active');
      loadGame('pairsIframe', 'phrasal-verbs-pairs.html');
    } else if (mode === 'rack') {
      document.getElementById('rackArea').classList.add('active');
      loadGame('rackIframe', 'phrasal-verbs-rack.html');
    } else if (mode === 'pegs') {
      document.getElementById('pegsArea').classList.add('active');
      loadGame('pegsIframe', 'phrasal-verbs-pegs.html');
  } else if (mode === 'quiz') {
      document.getElementById('quizArea').classList.add('active');
      const iframe = document.getElementById('quizIframe');
      if (!iframe.src || !iframe.src.includes('phrasal-verbs-gapfill.html')) {
        iframe.src = 'phrasal-verbs-gapfill.html';
      }
    }
  syncVerbStep();
  syncCategoryTabs();
  syncHeaderHeight();
}

// ==================== INITIALIZE ====================
async function init() {
  try {
    const response = await fetch(JSON_FILE);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    grammarData = await response.json();

    GROUPS = grammarData.groups || [];
    if (!GROUPS.length) throw new Error('no verb groups in data');

    VERB_ORDER = GROUPS.map(g => g.id);
    buildCategorySelector();
    /* Explore's own default — gamesCategory is deliberately left untouched
       (still null) so the board games open unfiltered rather than inheriting
       Explore's first slide. */
    currentCategory = VERB_ORDER[0];
    loadCategory(currentCategory);
    syncCategoryTabs();
    syncHeaderHeight();

  } catch (error) {
    console.error('Error loading data:', JSON_FILE, error);
    document.getElementById('subtitle').textContent = 'Data unavailable — reload';
  }
}

// ==================== CATEGORY SELECTOR ====================
function buildCategorySelector() {
  const selector = document.getElementById('categorySelector');
  selector.innerHTML = '';
  selector.classList.add('show');

  /* No tab is marked active here. Which one (if any) should light up
     depends on the mode you're in, and at build time that hasn't been
     decided yet — syncCategoryTabs() sets it, right after this returns and
     again on every mode switch. */
  GROUPS.forEach((g) => {
    const btn = document.createElement('button');
    btn.className = 'vtab';
    btn.textContent = g.label;
    btn.dataset.group = g.id;
    btn.onclick = () => selectCategory(g.id);
    selector.appendChild(btn);
  });
  syncCategoryTabs();
}

/* One loader for the three board games.

   NAVIGATE ONCE, THEN TALK. loadGame() used to set iframe.src on every set
   change, which is a real page navigation — a brand-new document, starting
   from ITS OWN loading state every time. That's why the pendulum came back
   on every tap: it isn't slow, it's genuinely reloading from zero each time,
   fonts and all. A game's document is now navigated to exactly once, the
   first time its mode is opened at all (tracked in GAME_LOADED); every set
   change after that is a postMessage into the already-running document,
   which the game refilters its already-fetched data against and re-deals —
   no reload, no pendulum, same as the game's own note about the pendulum
   showing "once at entry, never again".

   Reads gamesCategory, not currentCategory: see the note on its
   declaration. While nobody has tapped a family tab this returns the bare
   filename, and each game's own boot() already falls back to its full,
   unfiltered pool when it finds no ?verb= param — so "nothing chosen yet"
   plays as the mix, not as TAKE. */
const GAME_LOADED = { pegs:false, rack:false, pairs:false };

function gameSrc(file){
  return gamesCategory ? file + '?verb=' + encodeURIComponent(gamesCategory) : file;
}
function loadGame(frameId, file){
  const key = frameId.replace('Iframe','');
  if (GAME_LOADED[key]) return;   /* already running — leave it alone */
  document.getElementById(frameId).src = gameSrc(file);
  GAME_LOADED[key] = true;
}
/* Called only when the band picks a NEW family (selectCategory), not on
   every mode switch — so opening a game you've already been in doesn't
   restart its round, and a family you pick while looking at one game is
   handed to the other two as well, so they don't show a stale mix the next
   time you switch to them. */
function updateGamesVerb(){
  Object.keys(GAME_FRAMES).forEach(key => {
    if (!GAME_LOADED[key]) return;   /* not open yet — it'll pick up
                                         gamesCategory on its first load */
    const iframe = document.getElementById(GAME_FRAMES[key][0]);
    if (iframe.contentWindow)
      iframe.contentWindow.postMessage({ type:'intuity:set-verb', verb: gamesCategory }, '*');
  });
}
const GAME_FRAMES = {
  pegs:  ['pegsIframe',  'phrasal-verbs-pegs.html'],
  rack:  ['rackIframe',  'phrasal-verbs-rack.html'],
  pairs: ['pairsIframe', 'phrasal-verbs-pairs.html']
};

function syncVerbStep() {
  const bar = document.getElementById('verbStep');
  if (!bar) return;
  const i = VERB_ORDER.indexOf(currentCategory);
  const on = currentMainMode === 'explore' && i >= 0 && VERB_ORDER.length > 1;
  bar.classList.toggle('show', on);
  if (!on) return;
  const label = GROUPS[i] ? GROUPS[i].label : currentCategory;
  document.getElementById('verbNow').textContent = `${label} · ${i + 1}/${VERB_ORDER.length}`;
  document.getElementById('verbPrev').disabled = i === 0;
  document.getElementById('verbNext').disabled = i === VERB_ORDER.length - 1;
}

function stepVerb(dir) {
  const i = VERB_ORDER.indexOf(currentCategory);
  const n = i + dir;
  if (i < 0 || n < 0 || n >= VERB_ORDER.length) return;
  selectCategory(VERB_ORDER[n]);
  const btn = document.querySelector(`.vtab[data-group="${VERB_ORDER[n]}"]`);
  if (btn) btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
}

function selectCategory(groupId) {
  if (isPlaying) pause();
  currentCategory = groupId;
  /* A tap on the band is an explicit choice, wherever it happens — so it
     narrows the games too, not just Explore's own slide. This is the ONLY
     place gamesCategory ever leaves null. */
  gamesCategory = groupId;
  currentIndex = 0;
  syncCategoryTabs();
  loadCategory(groupId);

  /* In a board game the band is the set picker, so a tap has to reach every
     game that's already running — not just the one on screen — or the
     others would show a stale mix the next time you switched to them.
     Explore repaints in place and needs nothing from this. A game that
     hasn't been opened yet needs nothing either: it reads gamesCategory
     itself the first time it loads. */
  if (GAME_FRAMES[currentMainMode]) updateGamesVerb();
}

// ==================== LOAD ====================
function loadCategory(groupId) {
  const group = GROUPS.find(g => g.id === groupId);
  slides = [];
  if (!group) return;

  applyVerbTheme(group);

  group.items.forEach(item => {
    const base = baseVerbOf(item, group);
    const phrase = `${base} ${item.particle}`;
    const inflected = `${formOf(item, group)} ${item.particle}`;

    const example = item.example.replace(/_+/,
      `<span class="highlight">${inflected}</span>`);

    const words = item.example.split(/\s+/).length;
    const size = words <= 8 ? 'size-small' : words <= 16 ? 'size-medium' : 'size-large';

    slides.push({ expression: phrase, meaning: item.meaning, example, size });
  });

  syncVerbStep();
  renderWatchSlide();
  buildListMode();
  syncStepBtns();
}

// ==================== VIEW MODE TOGGLE ====================
function toggleViewMode() {
  if (isPlaying) pause();
  viewMode = viewMode === 'watch' ? 'list' : 'watch';

  const toggle = document.getElementById('viewModeToggle');
  document.getElementById('watchLabel').classList.toggle('active', viewMode === 'watch');
  document.getElementById('listLabel').classList.toggle('active', viewMode === 'list');
  toggle.classList.toggle('active', viewMode === 'list');

  const watchMode = document.getElementById('watchMode');
  const listMode = document.getElementById('listMode');
  if (viewMode === 'watch') {
    watchMode.style.display = 'block';
    listMode.classList.remove('show');
  } else {
    watchMode.style.display = 'none';
    listMode.classList.add('show');
  }
}

function setupToggle() {
  document.getElementById('viewModeToggle').addEventListener('click', toggleViewMode);
  document.getElementById('watchLabel').addEventListener('click', () => {
    if (viewMode !== 'watch') toggleViewMode();
  });
  document.getElementById('listLabel').addEventListener('click', () => {
    if (viewMode !== 'list') toggleViewMode();
  });
}

// ==================== RENDER ====================
function buildListMode() {
  const container = document.getElementById('listContainer');
  container.innerHTML = slides.map(data => `
    <div class="list-item">
      <div class="list-expression">${data.expression}</div>
      <div class="list-meaning">${data.meaning}</div>
      <div class="list-sentences">
        <div class="list-sentence-row">
          <div class="list-sentence-label">EXAMPLE</div>
          <div class="list-sentence">${data.example}</div>
        </div>
      </div>
    </div>`).join('');
}

function renderWatchSlide() {
  if (!slides.length) return;

  const data = slides[currentIndex];
  const content = document.getElementById('cardContent');

  const first = !content.classList.contains('show');
  content.classList.remove('show');

  const paint = () => {
    document.getElementById('expression').textContent = data.expression;
    document.getElementById('meaning').textContent = data.meaning || '';
    document.getElementById('meaning').style.display = data.meaning ? 'block' : 'none';

    document.getElementById('normalContainer').style.display = 'none';
    document.getElementById('arrow').style.display = 'none';
    document.getElementById('invertedContainer').style.display = 'block';
    document.getElementById('invertedContainer').querySelector('.sentence-label')
      .textContent = 'EXAMPLE IN CONTEXT';
    const sent = document.getElementById('invertedSentence');
    sent.className = 'sentence ' + (data.size || 'size-medium');
    sent.innerHTML = data.example;

    document.getElementById('current').textContent = currentIndex + 1;
    document.getElementById('total').textContent = slides.length;
    content.classList.add('show');
  };

  if (first) paint(); else setTimeout(paint, 500);
}

function stepSlide(dir) {
  if (isPlaying) pause();
  const n = currentIndex + dir;
  if (n < 0 || n >= slides.length) return;
  currentIndex = n;
  renderWatchSlide();
  syncStepBtns();
}

function syncStepBtns() {
  const p = document.getElementById('prevBtn'), n = document.getElementById('nextBtn');
  if (p) p.disabled = currentIndex <= 0;
  if (n) n.disabled = currentIndex >= slides.length - 1;
}

function togglePlay() { isPlaying ? pause() : play(); }

function play() {
  isPlaying = true;
  document.getElementById('playBtn').textContent = '\u25A0';
  syncStepBtns();

  clearInterval(playInterval);
  playInterval = setInterval(() => {
    if (!isPlaying) { clearInterval(playInterval); return; }
    if (currentIndex >= slides.length - 1) { pause(); return; }
    currentIndex++;
    renderWatchSlide();
    syncStepBtns();
  }, 6000);
}

function pause() {
  isPlaying = false;
  document.getElementById('playBtn').textContent = '▶';
  syncStepBtns();
  if (playInterval) { clearInterval(playInterval); playInterval = null; }
}

// ==================== EVENT LISTENERS ====================
document.getElementById('prevBtn').addEventListener('click', () => stepSlide(-1));
document.getElementById('nextBtn').addEventListener('click', () => stepSlide(1));
document.getElementById('playBtn').addEventListener('click', togglePlay);

document.addEventListener('keydown', (e) => {
  if (viewMode !== 'watch' || currentMainMode !== 'explore') return;
  if (e.key === ' ')          { e.preventDefault(); togglePlay(); }
  if (e.key === 'ArrowRight') { e.preventDefault(); stepSlide(1); }
  if (e.key === 'ArrowLeft')  { e.preventDefault(); stepSlide(-1); }
});

// ==================== START ====================
setupToggle();
init();
  </script>
</body>
</html>
