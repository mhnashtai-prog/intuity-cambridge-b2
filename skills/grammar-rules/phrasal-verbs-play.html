<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INTUITY - Phrasal Verbs Grammar System</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #0d0d0d;
      background-image: radial-gradient(circle at 20% 50%, rgba(201, 169, 97, 0.04) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(201, 169, 97, 0.03) 0%, transparent 50%);
      color: #e5e5e5;
      min-height: 100vh;
      padding: 1rem;
      overflow-x: hidden;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      position: relative;
    }

    /* TOP NAVIGATION */
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 0;
      margin-bottom: 1rem;
      gap: 1rem;
      opacity: 0;
      animation: fadeInDown 0.8s ease forwards;
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      min-width: 100px;
    }

    .nav-link {
      color: #8e8e93;
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      transition: color 0.3s ease;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 0.375rem;
    }

    .nav-link:hover {
      color: #C9A961;
    }

    .nav-center {
      flex: 1;
      text-align: center;
    }

    .nav-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      color: #C9A961;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #C9A961 0%, rgba(201, 169, 97, 0.7) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .nav-right {
      min-width: 100px;
    }

    /* HEADER */
    header {
      text-align: center;
      margin-bottom: 1.5rem;
      padding: 0.5rem 0;
      opacity: 0;
      animation: fadeIn 0.8s ease 0.2s forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .subtitle {
      font-size: 0.875rem;
      color: #8e8e93;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    /* MODE TOGGLE SELECTOR */
    .mode-selector-container {
      display: flex;
      justify-content: center;
      margin-bottom: 1.5rem;
      opacity: 0;
      animation: fadeIn 0.8s ease 0.4s forwards;
    }

    .mode-selector {
      display: flex;
      background: rgba(28, 28, 30, 0.6);
      backdrop-filter: blur(40px);
      border-radius: 999px;
      border: 1px solid rgba(201, 169, 97, 0.2);
      overflow: hidden;
    }

    .mode-option {
      padding: 0.625rem 1.25rem;
      background: transparent;
      border: none;
      color: #636366;
      cursor: pointer;
      font-size: 0.8125rem;
      font-weight: 600;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border-right: 1px solid rgba(84, 84, 88, 0.2);
    }

    .mode-option:last-child {
      border-right: none;
    }

    .mode-option:hover {
      color: #9ca3af;
      background: rgba(201, 169, 97, 0.1);
    }

    .mode-option.active {
      color: #C9A961;
      background: rgba(201, 169, 97, 0.15);
    }

    /* VIEW MODE TOGGLE (WATCH/LIST for Explore+Rules) */
    .view-mode-container {
      display: flex;
      justify-content: center;
      margin-bottom: 2rem;
      opacity: 0;
      animation: fadeIn 0.8s ease 0.6s forwards;
    }

    .view-mode-container.hidden {
      display: none;
    }

    .toggle-container {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: rgba(28, 28, 30, 0.6);
      backdrop-filter: blur(40px);
      padding: 0.75rem 1.5rem;
      border-radius: 999px;
      border: 1px solid rgba(201, 169, 97, 0.2);
    }

    .toggle-label {
      font-size: 0.875rem;
      color: #636366;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: color 0.3s;
    }

    .toggle-label.active {
      color: #C9A961;
    }

    .toggle-switch {
      position: relative;
      width: 56px;
      height: 30px;
      background: rgba(28, 28, 30, 0.8);
      border: 1px solid rgba(84, 84, 88, 0.3);
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .toggle-switch:hover {
      border-color: rgba(201, 169, 97, 0.4);
    }

    .toggle-slider {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 22px;
      height: 22px;
      background: #C9A961;
      border-radius: 50%;
      transition: all 0.3s ease;
      box-shadow: 0 2px 8px rgba(201, 169, 97, 0.4);
    }

    .toggle-switch.active .toggle-slider {
      transform: translateX(26px);
    }

    /* NEXT / PREVIOUS VERB */
    .verb-step { display: none; align-items: center; justify-content: center;
      gap: 1rem; margin: 0 0 .6rem; }
    .verb-step.show { display: flex; }
    .verb-step-btn { width: 2.2rem; height: 2.2rem; border-radius: 50%;
      border: 1px solid rgba(201,169,97,.35); background: rgba(201,169,97,.12);
      color: #C9A961; font-size: 1.15rem; line-height: 1; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s, transform .12s; }
    .verb-step-btn:hover { background: rgba(201,169,97,.28); }
    .verb-step-btn:active { transform: scale(.92); }
    .verb-step-btn:disabled { opacity: .25; cursor: default; }
    .verb-step-now { font-family: 'Space Grotesk', sans-serif; font-size: .78rem;
      font-weight: 600; letter-spacing: .16em; text-transform: uppercase;
      color: rgba(229,229,229,.7); min-width: 7rem; text-align: center; }

    /* CATEGORY SELECTOR */
    .category-selector {
      display: none;
      flex-wrap: wrap;
      gap: 1.5rem;
      justify-content: center;
      margin-bottom: 2.5rem;
      padding: 0;
      opacity: 0;
      animation: fadeIn 0.8s ease 0.8s forwards;
    }

    .category-selector.show {
      display: flex;
    }

    .category-btn {
      padding: 0;
      background: transparent;
      border: none;
      color: #636366;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 500;
      transition: all 0.3s ease;
      text-transform: lowercase;
      letter-spacing: 0.02em;
      font-family: 'Inter', sans-serif;
      position: relative;
    }

    .category-btn:hover {
      color: #9ca3af;
    }

    .category-btn.active {
      color: #C9A961;
      font-weight: 600;
    }

    .category-btn.active::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      right: 0;
      height: 2px;
      background: #C9A961;
    }

    /* CONTENT AREAS */
    .content-area {
      display: none;
    }

    .content-area.active {
      display: block;
    }

    /* WATCH MODE */
    .watch-mode {
      display: block;
    }

    .modal-card {
      background: #000;
      border: 1px solid rgba(201, 169, 97, 0.3);
      border-radius: 1.5rem;
      padding: 3.5rem 3rem;
      min-height: 550px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8),
                  0 0 40px rgba(201, 169, 97, 0.1);
      /* was a 1s delay before an 0.8s fade — nearly two seconds of blank
         card on load, which read as "no data" rather than "arriving" */
      opacity: 0;
      transform: scale(0.95);
      animation: cardAppear 0.5s ease forwards;
    }

    @keyframes cardAppear {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    /* SOUND ICON */

    .card-content {
      text-align: center;
      width: 100%;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .card-content.show {
      opacity: 1;
    }

    .expression {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.375rem;
      color: #C9A961;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 2rem;
      font-weight: 600;
      padding: 0.75rem 1.5rem;
      background: rgba(201, 169, 97, 0.1);
      border-radius: 0.625rem;
      display: inline-block;
    }

    .meaning {
      font-size: 1.125rem;
      color: #9ca3af;
      font-style: italic;
      margin-bottom: 2.5rem;
      line-height: 1.5;
    }

    .sentence-container {
      margin-bottom: 2rem;
    }

    .sentence-label {
      font-size: 0.875rem;
      color: #636366;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 1rem;
      font-weight: 600;
      font-family: 'Space Grotesk', sans-serif;
    }

    .sentence {
      font-size: 1.75rem;
      line-height: 1.6;
      color: #e5e5e7;
      font-weight: 400;
      margin-bottom: 2rem;
    }

    .highlight {
      color: #60a5fa;
      font-weight: 600;
      background: rgba(96, 165, 250, 0.15);
      padding: 0.25rem 0.5rem;
      border-radius: 0.375rem;
    }

    .arrow {
      font-size: 2rem;
      color: #C9A961;
      margin: 1.5rem 0;
      opacity: 0.6;
    }

    /* CONTROLS */
    .controls {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-top: 3rem;
    }

    .control-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(28, 28, 30, 0.6);
      border: 1px solid rgba(201, 169, 97, 0.3);
      color: #C9A961;
      font-size: 1.25rem;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      backdrop-filter: blur(20px);
    }

    .control-btn:hover:not(:disabled) {
      background: rgba(201, 169, 97, 0.2);
      transform: scale(1.05);
      box-shadow: 0 4px 16px rgba(201, 169, 97, 0.3);
      border-color: rgba(201, 169, 97, 0.5);
    }

    .control-btn:active {
      transform: scale(0.95);
    }

    .control-btn:disabled {
      opacity: 0.2;
      cursor: not-allowed;
    }

    .control-btn.play {
      width: 72px;
      height: 72px;
      background: rgba(201, 169, 97, 0.15);
      border: 2px solid rgba(201, 169, 97, 0.4);
    }

    /* PROGRESS */
    .progress {
      position: absolute;
      bottom: 2rem;
      left: 2rem;
      font-size: 1rem;
      color: #636366;
      font-weight: 600;
    }

    .progress .current {
      color: #C9A961;
      font-size: 1.375rem;
    }

    /* LIST MODE */
    .list-mode {
      display: none;
    }

    /* was: opacity 0 with a 1s delay before an 0.8s fade — nearly two seconds
   of blank panel after the switch, indistinguishable from a freeze */
    .list-mode.show {
      display: block;
      opacity: 1;
      animation: fadeIn 0.3s ease forwards;
    }

    .list-container {
      display: flex;
      flex-direction: column;
      gap: 2rem;
      padding-bottom: 2rem;
    }

    .list-item {
      background: rgba(28, 28, 30, 0.6);
      backdrop-filter: blur(40px);
      border: 1px solid rgba(201, 169, 97, 0.2);
      border-radius: 1.25rem;
      padding: 2rem;
      transition: all 0.3s ease;
    }

    .list-item:hover {
      border-color: rgba(201, 169, 97, 0.4);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .list-expression {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.125rem;
      color: #C9A961;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 1rem;
      font-weight: 600;
      padding: 0.5rem 1rem;
      background: rgba(201, 169, 97, 0.1);
      border-radius: 0.5rem;
      display: inline-block;
    }

    .list-meaning {
      font-size: 1rem;
      color: #9ca3af;
      font-style: italic;
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }

    .list-sentences {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .list-sentence-row {
      display: flex;
      flex-direction: column;
      gap: 0.625rem;
    }

    .list-sentence-label {
      font-size: 0.75rem;
      color: #636366;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
      font-family: 'Space Grotesk', sans-serif;
    }

    .list-sentence {
      font-size: 1.25rem;
      line-height: 1.6;
      color: #e5e5e7;
      font-weight: 400;
    }

    .list-arrow {
      font-size: 1.5rem;
      color: #C9A961;
      opacity: 0.5;
      text-align: center;
      margin: 0.375rem 0;
    }

    /* IFRAME CONTAINER */
    .iframe-container {
      width: 100%;
      min-height: calc(100vh - 250px);
      border: none;
      border-radius: 1.5rem;
      overflow: hidden;
    }

    .iframe-container iframe {
      width: 100%;
      height: 100%;
      min-height: calc(100vh - 250px);
      border: none;
    }

    /* MOBILE RESPONSIVE */
    @media (max-width: 768px) {
      body {
        padding: 0.75rem;
      }

      .nav-title {
        font-size: 1.25rem;
      }

      .subtitle {
        font-size: 0.75rem;
      }

      .mode-option {
        font-size: 0.7rem;
        padding: 0.5rem 0.875rem;
      }

      .category-selector {
        padding: 0;
        gap: 1rem;
      }

      .category-btn {
        font-size: 0.8125rem;
      }

      .modal-card {
        padding: 2rem 1.5rem;
        min-height: 450px;
      }

      .expression {
        font-size: 1rem;
        padding: 0.5rem 1rem;
        margin-bottom: 1.5rem;
      }

      .meaning {
        font-size: 1rem;
        margin-bottom: 2rem;
      }

      .sentence {
        font-size: 1.375rem;
      }

      .control-btn {
        width: 48px;
        height: 48px;
        font-size: 1.125rem;
      }

      .control-btn.play {
        width: 64px;
        height: 64px;
      }

      .progress {
        left: 1rem;
        bottom: 1rem;
        font-size: 0.875rem;
      }

      .progress .current {
        font-size: 1.125rem;
      }

      .list-item {
        padding: 1.5rem;
      }

      .list-expression {
        font-size: 0.9375rem;
      }

      .list-sentence {
        font-size: 1.125rem;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 0.5rem;
      }

      .nav-title {
        font-size: 1rem;
      }

      .subtitle {
        font-size: 0.65rem;
      }

      .mode-option {
        font-size: 0.625rem;
        padding: 0.4rem 0.75rem;
      }

      .category-btn {
        font-size: 0.75rem;
      }

      .modal-card {
        padding: 1.5rem 1rem;
        min-height: 380px;
      }

      .expression {
        font-size: 0.875rem;
        padding: 0.375rem 0.75rem;
      }

      .meaning {
        font-size: 0.9375rem;
      }

      .sentence {
        font-size: 1.125rem;
      }

      .control-btn {
        width: 44px;
        height: 44px;
        font-size: 1rem;
      }

      .control-btn.play {
        width: 56px;
        height: 56px;
      }

      .progress {
        left: 0.75rem;
        bottom: 0.75rem;
        font-size: 0.75rem;
      }

      .progress .current {
        font-size: 1rem;
      }

      .list-sentence {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    
    <!-- TOP NAVIGATION -->
    <div class="top-nav">
      <div class="nav-left">
        <a class='nav-link' href='/?openModal=grammar'>← Grammar</a>
      </div>
      <div class="nav-center">
        <div class="nav-title">INTUITY</div>
      </div>
      <div class="nav-right"></div>
    </div>

    <!-- HEADER -->
    <header>
      <p class="subtitle" id="subtitle">B2 First Phrasal Verbs · Interactive Grammar System</p>
    </header>

    <!-- MODE SELECTOR -->
    <div class="mode-selector-container">
      <div class="mode-selector">
        <button class="mode-option active" data-mode="explore" onclick="switchMainMode('explore')">
          🗺️ <span>EXPLORE</span>
        </button>
        <button class="mode-option" data-mode="practice" onclick="switchMainMode('practice')">
          ✍️ <span>PRACTICE</span>
        </button>
        <button class="mode-option" data-mode="quiz" onclick="switchMainMode('quiz')">
          📝 <span>QUIZ</span>
        </button>
      </div>
    </div>

    <!-- VIEW MODE TOGGLE (WATCH/LIST - Only for Explore mode) -->
    <div class="view-mode-container" id="viewModeContainer">
      <div class="toggle-container">
        <span class="toggle-label active" id="watchLabel">WATCH</span>
        <div class="toggle-switch" id="viewModeToggle">
          <div class="toggle-slider"></div>
        </div>
        <span class="toggle-label" id="listLabel">LIST</span>
      </div>
    </div>

    <!-- CATEGORY SELECTOR (Explore mode only) -->
    <!-- the tabs alone meant reaching back to the top to change verb; these
         step through the same list so a student can stay with the card -->
    <div class="verb-step" id="verbStep">
      <button class="verb-step-btn" id="verbPrev" onclick="stepVerb(-1)" aria-label="Previous verb">&#8249;</button>
      <span class="verb-step-now" id="verbNow"></span>
      <button class="verb-step-btn" id="verbNext" onclick="stepVerb(1)" aria-label="Next verb">&#8250;</button>
    </div>
    <div class="category-selector" id="categorySelector"></div>

    <!-- EXPLORE MODE CONTENT -->
    <div class="content-area active" id="exploreArea">
      <!-- WATCH MODE -->
      <div class="watch-mode" id="watchMode">
        <div class="modal-card">
          
          <div class="card-content" id="cardContent">
            <div class="expression" id="expression"></div>
            <div class="meaning" id="meaning"></div>
            
            <div class="sentence-container" id="normalContainer">
              <div class="sentence-label">NORMAL</div>
              <div class="sentence" id="normalSentence"></div>
            </div>

            <div class="arrow" id="arrow">↓</div>

            <div class="sentence-container" id="invertedContainer">
              <div class="sentence-label">INVERTED</div>
              <div class="sentence" id="invertedSentence"></div>
            </div>
          </div>

          <!-- CONTROLS -->
          <!-- was: repeat / play / a pause button with no listener at all.
               Now: step back, play-stop, step forward. -->
          <div class="controls">
            <button class="control-btn" id="prevBtn" aria-label="Previous">&#8249;</button>
            <button class="control-btn play" id="playBtn" aria-label="Play">&#9654;</button>
            <button class="control-btn" id="nextBtn" aria-label="Next">&#8250;</button>
          </div>

          <!-- PROGRESS -->
          <div class="progress">
            <span class="current" id="current">1</span> / <span id="total">0</span>
          </div>
        </div>
      </div>

      <!-- LIST MODE -->
      <div class="list-mode" id="listMode">
        <div class="list-container" id="listContainer"></div>
      </div>
    </div>

    <!-- PRACTICE MODE CONTENT -->
    <div class="content-area" id="practiceArea">
      <div class="iframe-container">
        <iframe id="practiceIframe" src=""></iframe>
      </div>
    </div>

    <!-- QUIZ MODE CONTENT -->
    <div class="content-area" id="quizArea">
      <div class="iframe-container">
        <iframe id="quizIframe" src=""></iframe>
      </div>
    </div>

  </div>

  <script>
// ==================== STATE ====================
let grammarData = null;
let currentCategory = null;      // group id: 'take', 'mix1', …
let currentIndex = 0;
let isPlaying = false;
let playInterval = null;
let viewMode = 'watch';
let slides = [];
let currentMainMode = 'explore';
let GROUPS = [];
let VERB_ORDER = [];

/* One data file for the whole topic. The quiz page, the game and this page
   all read it, so a correction lands everywhere at once and the three can
   never drift apart. It sits beside this HTML, not in ../../data. */
const JSON_FILE = 'phrasal-verbs-data.json';

/* Items in a MIX group carry their own `verb`; `form` is the inflected verb
   the example sentence needs. The phrase label always uses the citation
   form, the sentence always uses the inflected one. */
const baseVerbOf = (item, group) => item.verb || group.id;
const formOf     = (item, group) => item.form || item.verb || group.id;

// ==================== MAIN MODE SWITCHING ====================
function switchMainMode(mode) {
  if (mode === currentMainMode) return;

  currentMainMode = mode;
  if (isPlaying) pause();

  document.querySelectorAll('.mode-option').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.mode === mode);
  });
  document.querySelectorAll('.content-area').forEach(area => {
    area.classList.remove('active');
  });

  const viewModeContainer = document.getElementById('viewModeContainer');
  const categorySelector = document.getElementById('categorySelector');

  if (mode === 'explore') {
    viewModeContainer.classList.remove('hidden');
    categorySelector.classList.add('show');
    document.getElementById('exploreArea').classList.add('active');
  } else {
    viewModeContainer.classList.add('hidden');
    categorySelector.classList.remove('show');

    if (mode === 'practice') {
      document.getElementById('practiceArea').classList.add('active');
      const iframe = document.getElementById('practiceIframe');
      if (!iframe.src || !iframe.src.includes('phrasal-verbs-practice.html')) {
        iframe.src = 'phrasal-verbs-practice.html';
      }
    } else if (mode === 'quiz') {
      document.getElementById('quizArea').classList.add('active');
      const iframe = document.getElementById('quizIframe');
      if (!iframe.src || !iframe.src.includes('phrasal-verbs-gapfill.html')) {
        iframe.src = 'phrasal-verbs-gapfill.html';
      }
    }
  }
  syncVerbStep();
}

// ==================== INITIALIZE ====================
async function init() {
  try {
    const response = await fetch(JSON_FILE);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    grammarData = await response.json();

    GROUPS = grammarData.verbs || [];
    if (!GROUPS.length) throw new Error('no verb groups in data');

    VERB_ORDER = GROUPS.map(g => g.id);
    buildCategorySelector();
    currentCategory = VERB_ORDER[0];
    loadCategory(currentCategory);

  } catch (error) {
    /* An alert() blocks the page and tells a student nothing they can act on.
       Fail visibly and quietly, and keep the detail in the console. */
    console.error('Error loading data:', JSON_FILE, error);
    document.getElementById('subtitle').textContent =
      'Could not load the phrasal verbs data — try reloading.';
  }
}

// ==================== CATEGORY SELECTOR ====================
/* Straight from the data: seven core verbs and three MIX sets. No filtering
   for "playable" any more — every pair in this file has both a meaning and
   a real example sentence, which is what the old page had to work around. */
function buildCategorySelector() {
  const selector = document.getElementById('categorySelector');
  selector.innerHTML = '';
  selector.classList.add('show');

  GROUPS.forEach((g, index) => {
    const btn = document.createElement('button');
    btn.className = 'category-btn' + (index === 0 ? ' active' : '');
    btn.textContent = g.label.toLowerCase();
    btn.dataset.group = g.id;
    btn.onclick = () => selectCategory(g.id);
    selector.appendChild(btn);
  });
}

function syncVerbStep() {
  const bar = document.getElementById('verbStep');
  if (!bar) return;
  const i = VERB_ORDER.indexOf(currentCategory);
  const on = currentMainMode === 'explore' && i >= 0 && VERB_ORDER.length > 1;
  bar.classList.toggle('show', on);
  if (!on) return;
  const label = GROUPS[i] ? GROUPS[i].label : currentCategory;
  document.getElementById('verbNow').textContent = `${label}  ${i + 1}/${VERB_ORDER.length}`;
  document.getElementById('verbPrev').disabled = i === 0;
  document.getElementById('verbNext').disabled = i === VERB_ORDER.length - 1;
}

function stepVerb(dir) {
  const i = VERB_ORDER.indexOf(currentCategory);
  const n = i + dir;
  if (i < 0 || n < 0 || n >= VERB_ORDER.length) return;
  selectCategory(VERB_ORDER[n]);
  const btn = document.querySelector(`.category-btn[data-group="${VERB_ORDER[n]}"]`);
  if (btn) btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
}

function selectCategory(groupId) {
  if (isPlaying) pause();
  currentCategory = groupId;
  currentIndex = 0;
  document.querySelectorAll('.category-btn').forEach(btn =>
    btn.classList.toggle('active', btn.dataset.group === groupId));
  loadCategory(groupId);
}

// ==================== LOAD ====================
function loadCategory(groupId) {
  const group = GROUPS.find(g => g.id === groupId);
  slides = [];
  if (!group) return;

  group.items.forEach(item => {
    const base = baseVerbOf(item, group);
    const phrase = `${base} ${item.particle}`;
    const inflected = `${formOf(item, group)} ${item.particle}`;

    /* The old page had a hard-coded table of about forty sentences inside the
       JavaScript, and invented one when a pair was missing. Every example now
       comes from the data, with the blank filled by the form the sentence
       actually needs — "I came across…", not "I come across…". */
    const example = item.example.replace(/_+/,
      `<span class="highlight">${inflected}</span>`);

    slides.push({ expression: phrase, meaning: item.meaning, example });
  });

  syncVerbStep();
  renderWatchSlide();
  buildListMode();
  syncStepBtns();
}

// ==================== VIEW MODE TOGGLE ====================
function toggleViewMode() {
  if (isPlaying) pause();
  viewMode = viewMode === 'watch' ? 'list' : 'watch';

  const toggle = document.getElementById('viewModeToggle');
  document.getElementById('watchLabel').classList.toggle('active', viewMode === 'watch');
  document.getElementById('listLabel').classList.toggle('active', viewMode === 'list');
  toggle.classList.toggle('active', viewMode === 'list');

  const watchMode = document.getElementById('watchMode');
  const listMode = document.getElementById('listMode');
  if (viewMode === 'watch') {
    watchMode.style.display = 'block';
    listMode.classList.remove('show');
  } else {
    watchMode.style.display = 'none';
    listMode.classList.add('show');
  }
}

function setupToggle() {
  document.getElementById('viewModeToggle').addEventListener('click', toggleViewMode);
}

// ==================== RENDER ====================
function buildListMode() {
  const container = document.getElementById('listContainer');
  container.innerHTML = slides.map(data => `
    <div class="list-item">
      <div class="list-expression">${data.expression}</div>
      <div class="list-meaning">${data.meaning}</div>
      <div class="list-sentences">
        <div class="list-sentence-row">
          <div class="list-sentence-label">EXAMPLE</div>
          <div class="list-sentence">${data.example}</div>
        </div>
      </div>
    </div>`).join('');
}

function renderWatchSlide() {
  if (!slides.length) return;

  const data = slides[currentIndex];
  const content = document.getElementById('cardContent');

  /* The fade was written for slide-to-slide transitions: strip `show`, wait
     500ms, repaint, add `show` back. On the FIRST render there is nothing to
     fade from, so the card sat empty until pressing play forced a second one.
     Paint immediately the first time, fade thereafter. */
  const first = !content.classList.contains('show');
  content.classList.remove('show');

  const paint = () => {
    document.getElementById('expression').textContent = data.expression;
    document.getElementById('meaning').textContent = data.meaning || '';
    document.getElementById('meaning').style.display = data.meaning ? 'block' : 'none';

    document.getElementById('normalContainer').style.display = 'none';
    document.getElementById('arrow').style.display = 'none';
    document.getElementById('invertedContainer').style.display = 'block';
    document.getElementById('invertedContainer').querySelector('.sentence-label')
      .textContent = 'EXAMPLE IN CONTEXT';
    document.getElementById('invertedSentence').innerHTML = data.example;

    document.getElementById('current').textContent = currentIndex + 1;
    document.getElementById('total').textContent = slides.length;
    content.classList.add('show');
  };

  if (first) paint(); else setTimeout(paint, 500);
}

function stepSlide(dir) {
  if (isPlaying) pause();
  const n = currentIndex + dir;
  if (n < 0 || n >= slides.length) return;
  currentIndex = n;
  renderWatchSlide();
  syncStepBtns();
}

function syncStepBtns() {
  const p = document.getElementById('prevBtn'), n = document.getElementById('nextBtn');
  if (p) p.disabled = currentIndex <= 0;
  if (n) n.disabled = currentIndex >= slides.length - 1;
}

function togglePlay() { isPlaying ? pause() : play(); }

function play() {
  isPlaying = true;
  document.getElementById('playBtn').textContent = '\u25A0';
  syncStepBtns();

  /* Six seconds a slide: long enough to read the meaning and the example,
     short enough that a teenager does not leave. */
  clearInterval(playInterval);
  playInterval = setInterval(() => {
    if (!isPlaying) { clearInterval(playInterval); return; }
    if (currentIndex >= slides.length - 1) { pause(); return; }
    currentIndex++;
    renderWatchSlide();
    syncStepBtns();
  }, 6000);
}

function pause() {
  isPlaying = false;
  document.getElementById('playBtn').textContent = '▶';
  syncStepBtns();
  if (playInterval) { clearInterval(playInterval); playInterval = null; }
}

// ==================== EVENT LISTENERS ====================
document.getElementById('prevBtn').addEventListener('click', () => stepSlide(-1));
document.getElementById('nextBtn').addEventListener('click', () => stepSlide(1));
document.getElementById('playBtn').addEventListener('click', togglePlay);

document.addEventListener('keydown', (e) => {
  if (viewMode !== 'watch' || currentMainMode !== 'explore') return;
  if (e.key === ' ')          { e.preventDefault(); togglePlay(); }
  if (e.key === 'ArrowRight') { e.preventDefault(); stepSlide(1); }
  if (e.key === 'ArrowLeft')  { e.preventDefault(); stepSlide(-1); }
});

// ==================== START ====================
/* Bound before the fetch — the switch used to be dead while data loaded. */
setupToggle();
init();
  </script>
</body>
</html>
