<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FAF7F2">
<title>INTUITY — Phrasal Verbs Practice</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@500;700;900&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<script>
  if (window.self !== window.top) document.documentElement.classList.add('embedded');
</script>

<style>
/* ═══ PHRASAL VERBS · PRACTICE ═══
   Rebuilt on Sort's own tokens rather than intuity-shell.css. The shell's
   internals aren't visible from here, and overriding variables blind risks
   a silent mismatch the next time the shell changes; defining the palette
   directly against Sort's actual values is the only way to guarantee this
   page is really the same material, not an approximation of it.

   TWO ENGINES, ONE DATA SET, ONE GRADING FUNCTION.
   Study is the page as it was: every question for a section on one card,
   typed at your own pace, graded together on Check. Arcade is Sort's own
   engine wearing this content: one transformation at a time, an immediate
   tick or cross, a streak that pays out, a bar that can slide backward.
   Both call the SAME gradeAnswer() for the actual right/wrong decision —
   word-count rule, exact-or-alternative match, all of it — so which style
   a learner picks changes how the exercise FEELS, never what counts as
   correct. */

*,*::before,*::after{ margin:0; padding:0; box-sizing:border-box; }

:root{
  --ground:#E4E0E0;
  --band:#FAF7F2;
  --ink:#17171A;
  --dim:#5C6366;
  --faint:#8A9093;
  --rule:#C2956E;
  --caramel:#B0865C;
  --tick:#6B3FA0;
  --cross:#E8632A;
  --egg-right:#6B7A3A;
  --bad:#B8402A;
  --hot:#B44A22;
  --shade:40,50,54;
  --header-h:96px;
  --spring:cubic-bezier(.2,1.4,.4,1);
  --poster:#ECE9E3;
  --poster-ink:#14110E;
  --poster-soft:rgba(20,17,14,.6);
  --poster-faint:rgba(20,17,14,.5);
  --poster-rule:rgba(20,17,14,.2);
  --f-mono2:'DM Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}

html{ -webkit-text-size-adjust:100%; }
body{
  background:var(--ground); color:var(--ink); min-height:100vh;
  font-family:'DM Sans',system-ui,sans-serif; -webkit-font-smoothing:antialiased;
}
button{ font:inherit; border:none; background:none; cursor:pointer; color:inherit; }
input{ font:inherit; }
:focus-visible{ outline:2px solid var(--hot); outline-offset:2px; border-radius:6px; }

html.embedded .htop{ display:none; }
html.embedded .header{ padding:.35rem 1rem .3rem; gap:.35rem; }
html.embedded .header{ height:auto; }

/* ══ HEADER — shared by both engines ══ */
.header{
  position:sticky; top:0; z-index:25; height:var(--header-h);
  display:flex; flex-direction:column; justify-content:center; gap:.45rem;
  padding:.6rem 1rem; background:var(--band); border-bottom:1px solid var(--rule);
}
.htop{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; }
.back{
  justify-self:start; text-decoration:none;
  font-family:'Space Grotesk',sans-serif; font-size:.6rem; font-weight:700;
  letter-spacing:.08em; text-transform:uppercase; color:var(--faint);
  transition:color .2s; white-space:nowrap;
}
.back:hover{ color:var(--ink); }
.title{ display:flex; flex-direction:column; align-items:center; line-height:1.1; }
.title b{
  font-family:'Space Grotesk',sans-serif; font-size:1rem; font-weight:900;
  letter-spacing:.2em; color:var(--ink);
}
.title span{
  font-size:.56rem; font-weight:600; letter-spacing:.16em;
  text-transform:uppercase; color:var(--faint); margin-top:.15rem;
}
.mute{ justify-self:end; font-size:.95rem; opacity:.5; transition:opacity .2s; }
.mute:hover{ opacity:1; }

.pagemodes{ display:flex; justify-content:center; gap:.25rem; flex-wrap:wrap; }
.pmchip{
  font-family:'Space Grotesk',sans-serif; font-size:.62rem; font-weight:700;
  letter-spacing:.06em; text-transform:uppercase; color:var(--faint);
  padding:.3rem .75rem; border-radius:999px; transition:color .15s,background .15s;
}
.pmchip:hover{ color:var(--ink); background:rgba(var(--shade),.06); }
.pmchip.active{ color:#FFF7F3; background:var(--hot); }

/* ══ SUBBAR — engine toggle + test selector ══ */
.subbar{
  position:sticky; top:var(--header-h); z-index:22;
  display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
  gap:.6rem; padding:.6rem .8rem; background:var(--ground);
  border-bottom:1px solid rgba(var(--shade),.14);
}
html.embedded .subbar{ top:0; }

.enginebox{ display:flex; align-items:center; gap:.5rem; }
.enginebox .lab{
  font-family:'DM Mono',monospace; font-size:.56rem; letter-spacing:.16em;
  text-transform:uppercase; color:var(--faint);
}
.engine-toggle{
  display:inline-flex; gap:.15rem; background:var(--band);
  border:1px solid var(--rule); border-radius:999px; padding:.18rem;
}
.engine-btn{
  font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:.64rem;
  letter-spacing:.06em; text-transform:uppercase; padding:.36rem .85rem;
  border-radius:999px; color:var(--dim); transition:background .15s,color .15s;
}
.engine-btn.active{ background:var(--hot); color:#FFF7F3; }

.testbar{
  display:flex; flex-wrap:wrap; justify-content:center; gap:.3rem; flex:1;
  min-width:0;
}
.testchip{
  font-family:'DM Mono',monospace; font-size:.6rem; letter-spacing:.06em;
  text-transform:uppercase; padding:.32rem .68rem; border-radius:999px;
  background:var(--band); color:var(--dim); white-space:nowrap;
  transition:background .15s,color .15s;
}
.testchip:hover{ color:var(--ink); }
.testchip.active{ background:var(--hot); color:#FFF7F3; font-weight:700; }
.testchip .sc{ margin-left:.4em; opacity:.8; }

/* ══ STUDY ENGINE — normal document scroll, one big card per section ══ */
body.arcade .study-wrap{ display:none; }
body:not(.arcade) .arcade-wrap{ display:none; }

.study-wrap{
  max-width:700px; margin:0 auto; padding:1.2rem .9rem 6.5rem;
}
.testcard{
  background:var(--poster); border-radius:0;
  box-shadow:0 1px 3px rgba(0,0,0,.10);
  padding:clamp(1.2rem,4vw,1.9rem) clamp(1.1rem,4vw,1.7rem);
}
.testcard .kick{
  display:flex; align-items:center; gap:9px;
  font-family:var(--f-mono2); font-size:.56rem; letter-spacing:.22em;
  text-transform:uppercase; color:var(--poster-faint); margin-bottom:1.2rem;
}
.testcard .kick i{ display:block; width:26px; height:10px; flex:none; background:var(--caramel); }

.qblock{ padding:1.05rem 0; border-bottom:1px solid var(--poster-rule); }
.qblock:first-child{ padding-top:0; }
.qblock:last-child{ border-bottom:none; padding-bottom:0; }
.q-number{
  font-family:var(--f-mono2); font-size:.56rem; letter-spacing:.14em;
  text-transform:uppercase; color:var(--poster-faint); margin-bottom:.6rem;
}
.sentence1{
  font-size:clamp(.86rem,2.6vw,.98rem); line-height:1.6; color:var(--poster-soft);
  padding-bottom:.85rem; margin-bottom:.85rem; border-bottom:1px solid var(--poster-rule);
}
.keyword{
  display:inline-block; font-family:'Space Grotesk',sans-serif; font-weight:700;
  font-size:.68rem; letter-spacing:.1em; text-transform:uppercase;
  color:var(--caramel); background:rgba(176,134,92,.15);
  border-radius:999px; padding:.32rem .85rem; margin-bottom:.65rem;
}
.sentence2{ font-size:clamp(.86rem,2.6vw,.98rem); line-height:2.15; color:var(--poster-soft); }
.sentence2-part{ white-space:pre-wrap; }

.answer-input{
  min-width:7rem; height:2.05em; padding:0 .8em; vertical-align:middle;
  border:none; border-radius:8px; background:rgba(20,17,14,.07);
  color:var(--poster-ink); font-family:'Space Grotesk',sans-serif; font-weight:600;
  font-size:.92rem; text-align:center; outline:none;
  transition:background .15s,color .15s,box-shadow .15s;
}
.answer-input::placeholder{ font-family:'DM Sans',sans-serif; font-weight:400; color:var(--poster-faint); }
.answer-input:focus{ background:#fff; box-shadow:0 0 0 2px var(--hot); }
.answer-input.correct{ background:rgba(107,63,160,.14); color:var(--tick); }
.answer-input.incorrect{ background:rgba(232,99,42,.14); color:var(--cross); }

.word-count{ font-family:var(--f-mono2); font-size:.6rem; color:var(--poster-faint); margin-top:.35rem; }
.word-count.warning{ color:var(--cross); }

.feedback{ display:none; margin-top:.7rem; padding:.55rem .8rem; border-radius:8px; }
.feedback.show{ display:block; }
.feedback.correct{ background:rgba(107,63,160,.10); }
.feedback.incorrect{ background:rgba(232,99,42,.10); }
.feedback-label{
  font-family:var(--f-mono2); font-size:.56rem; letter-spacing:.12em; text-transform:uppercase;
}
.feedback.correct .feedback-label{ color:var(--tick); }
.feedback.incorrect .feedback-label{ color:var(--cross); }
.feedback-answer{
  font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:.84rem;
  color:var(--poster-ink); margin-top:.15rem;
}

.score-banner{
  text-align:center; padding:1.3rem 1rem; margin-bottom:1rem;
  background:var(--band); box-shadow:0 1px 3px rgba(0,0,0,.08);
}
.score-text{
  font-family:'Anton',Impact,sans-serif; font-weight:400;
  font-size:2.3rem; letter-spacing:.02em; color:var(--ink); line-height:1;
}
.score-label{ font-family:var(--f-mono2); font-size:.7rem; color:var(--faint); margin-top:.3rem; }

.action-bar{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  display:flex; align-items:center; justify-content:center; gap:.6rem;
  padding:.7rem 1rem calc(env(safe-area-inset-bottom,0px) + .7rem);
  background:var(--band); border-top:1px solid var(--rule);
}
.action-btn{
  font-family:'Space Grotesk',sans-serif; font-size:.72rem; font-weight:700;
  letter-spacing:.06em; text-transform:uppercase; padding:.65rem 1.5rem;
  border-radius:999px; transition:transform .1s var(--spring);
}
.action-btn:active{ transform:scale(.95); }
.action-btn.primary{ background:var(--hot); color:#FFF7F3; }
.action-btn.secondary{ background:rgba(var(--shade),.08); color:var(--dim); }

.loading,.error-box{ padding:3.5rem 1rem; text-align:center; color:var(--faint); font-size:.9rem; line-height:1.7; }
.error-box{ color:var(--bad); }

/* ══ ARCADE ENGINE — Sort's own layout, fixed viewport, one card ══ */
body.arcade{ overflow:hidden; height:100vh; }
body.arcade .header{ position:fixed; }
body.arcade .subbar{ position:fixed; top:var(--header-h); left:0; right:0; }

.arcade-wrap{
  position:fixed; inset:0; top:calc(var(--header-h) + 56px);
  display:flex; flex-direction:column;
}
html.embedded .arcade-wrap{ top:56px; }

.ahud{
  display:flex; justify-content:center; flex-wrap:wrap; gap:.9rem;
  padding:.5rem 1rem; font-family:var(--f-mono2); font-size:.66rem; color:var(--faint);
  flex:none;
}
.ahud b{ color:var(--dim); font-weight:500; font-variant-numeric:tabular-nums; }
.ahud .streak b{ transition:color .15s,transform .2s var(--spring); display:inline-block; }
.ahud .streak.live b{ color:var(--hot); }
.ahud .streak.pop b{ transform:scale(1.35); }
.ahud .streak .mult{ color:var(--tick); font-weight:700; margin-left:.15em; }

.astage{
  flex:1; min-height:0; display:flex; flex-direction:column; justify-content:center;
  gap:clamp(1rem,4vh,2rem); padding:.6rem .9rem 1rem;
}
.acardwrap{ flex:1; display:flex; align-items:center; justify-content:center; min-height:0; }
.acard{
  position:relative; text-align:left;
  padding:clamp(1.4rem,5vw,2.2rem) clamp(1.2rem,4.6vw,1.9rem);
  background:var(--poster); border-radius:0; box-shadow:0 1px 3px rgba(0,0,0,.10);
  width:min(560px,92vw); max-height:80vh; overflow-y:auto;
  transition:transform .28s cubic-bezier(.2,.9,.3,1);
}
.acard.shake{ animation:ashake .42s; }
@keyframes ashake{
  0%,100%{ transform:none } 20%{ transform:translateX(-11px) }
  40%{ transform:translateX(9px) } 60%{ transform:translateX(-6px) } 80%{ transform:translateX(4px) }
}
.acard .kick{
  display:flex; align-items:center; gap:9px;
  font-family:var(--f-mono2); font-size:.56rem; letter-spacing:.22em;
  text-transform:uppercase; color:var(--poster-faint); margin-bottom:1.05rem;
}
.acard .kick i{ display:block; width:26px; height:10px; flex:none; background:var(--caramel); }
.acard .context{
  font-family:'DM Sans',sans-serif; font-style:italic; font-size:clamp(.82rem,2.8vw,.95rem);
  line-height:1.55; color:var(--poster-soft); padding-bottom:.85rem; margin-bottom:.9rem;
  border-bottom:1px solid var(--poster-rule);
}
.acard .keyword{ margin-bottom:.8rem; }
.acard .prompt{
  font-family:'DM Sans',sans-serif; font-size:clamp(.9rem,3vw,1.05rem);
  line-height:1.8; color:var(--poster-soft);
}
.acard .prompt .apart{ white-space:pre-wrap; }
.aInput{
  min-width:8rem; height:2.15em; padding:0 .8em; vertical-align:middle;
  border:none; border-radius:8px; background:rgba(20,17,14,.07);
  color:var(--poster-ink); font-family:'Space Grotesk',sans-serif; font-weight:700;
  font-size:1rem; text-align:center; outline:none;
  transition:background .15s,color .15s,box-shadow .15s;
}
.aInput::placeholder{ font-family:'DM Sans',sans-serif; font-weight:400; color:var(--poster-faint); }
.aInput:focus{ background:#fff; box-shadow:0 0 0 2px var(--hot); }
.aInput.correct{ background:rgba(107,63,160,.16); color:var(--tick); }
.aInput.incorrect{ background:rgba(232,99,42,.16); color:var(--cross); }
.acard .wc{ font-family:var(--f-mono2); font-size:.58rem; color:var(--poster-faint); margin-top:.4rem; }
.acard .wc.warning{ color:var(--cross); }

.acard .arow{ display:flex; align-items:center; gap:.6rem; margin-top:1.1rem; flex-wrap:wrap; }
.acheck{
  font-family:'Space Grotesk',sans-serif; font-size:.68rem; font-weight:700;
  letter-spacing:.06em; text-transform:uppercase; padding:.55rem 1.3rem;
  border-radius:999px; background:var(--hot); color:#FFF7F3;
  transition:transform .1s var(--spring),opacity .2s;
}
.acheck:active{ transform:scale(.95); }
.acheck[disabled]{ opacity:.35; pointer-events:none; }
.ahint{
  font-family:var(--f-mono2); font-size:.6rem; letter-spacing:.08em;
  text-transform:uppercase; color:var(--poster-faint);
}

.acard .anote{
  margin-top:1rem; min-height:2.6em;
  display:flex; flex-direction:column; align-items:flex-start; justify-content:center; gap:.3rem;
}
.acard .anote .r{
  font-family:var(--f-mono2); font-weight:500; font-size:.78rem; color:var(--poster-ink);
  background:rgba(20,17,14,.09); border-radius:3px; padding:.42em .7em; display:inline-block;
}
.acard .anote .eg{ font-size:.8rem; color:var(--poster-soft); font-style:italic; line-height:1.5; }

/* ── points bar, borrowed exactly from Sort ── */
.abar{
  flex:none; display:flex; align-items:center; gap:.8rem;
  padding:.6rem 1rem calc(env(safe-area-inset-bottom,0px) * .5);
  background:var(--band); border-top:1px solid rgba(var(--shade),.14);
  font-family:var(--f-mono2); font-size:.6rem; letter-spacing:.1em;
  text-transform:uppercase; color:var(--faint);
}
.atrack{ position:relative; flex:1; height:7px; border-radius:999px; overflow:hidden; background:#D8D8DA; }
.afill{
  position:relative; height:100%; width:0; border-radius:999px;
  background:var(--caramel); overflow:hidden; transition:width .45s cubic-bezier(.2,.9,.3,1),background .3s;
}
.afill::after{
  content:''; position:absolute; inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent);
  transform:translateX(-100%); opacity:0;
}
.afill.gain::after{ animation:asweep .55s ease-out; }
@keyframes asweep{ 0%{ transform:translateX(-100%); opacity:1 } 100%{ transform:translateX(220%); opacity:0 } }
.atrack.knock{ animation:aknock .4s; }
@keyframes aknock{ 0%,100%{ transform:none } 25%{ transform:translateX(-5px) } 60%{ transform:translateX(4px) } }
.afill.sting{ background:var(--bad); }
.abar .n{ font-variant-numeric:tabular-nums; color:var(--dim); }

.ptsfloat{
  position:fixed; z-index:36; pointer-events:none;
  font-family:var(--f-mono2); font-weight:700; font-size:.78rem; text-shadow:0 0 8px currentColor;
}
.ptsfloat.pos{ color:var(--tick); }
.ptsfloat.neg{ color:var(--cross); }

.fx{ position:fixed; inset:0; z-index:35; pointer-events:none; overflow:hidden; }
.spark{ position:absolute; width:5px; height:5px; border-radius:50%; pointer-events:none; }
.fw-flash{ width:64px; height:64px; border-radius:50%; background:radial-gradient(circle,#fff 0%,rgba(194,149,110,.75) 38%,rgba(194,149,110,0) 70%); }
.fw-ring{ width:56px; height:56px; border-radius:50%; border:3px solid rgba(107,63,160,.55); }
.fw-crackle{ width:3px; height:3px; border-radius:50%; background:var(--tick); box-shadow:0 0 7px rgba(107,63,160,.7); }

/* ── arcade end-of-section screen ── */
.aover{
  position:fixed; inset:0; z-index:40; display:none; flex-direction:column;
  align-items:center; justify-content:center; gap:.55rem; padding:2rem 1.5rem;
  text-align:center; background:var(--ground);
}
.aover.show{ display:flex; }
.aover .big{
  font-family:'Anton',Impact,sans-serif; font-weight:400;
  font-size:clamp(2.6rem,13vw,4rem); letter-spacing:.02em; text-transform:uppercase;
  color:var(--ink); line-height:1;
}
.aover .sub{ font-size:.86rem; color:var(--dim); max-width:22rem; line-height:1.6; }
.aover .list{ margin-top:1rem; max-width:30rem; font-size:.8rem; color:var(--dim); line-height:1.95; }
.aover .list b{ color:var(--ink); font-weight:600; }
.aacts{ display:flex; flex-wrap:wrap; gap:.6rem; justify-content:center; margin-top:1.1rem; }
.ago{
  font-family:'Space Grotesk',sans-serif; font-size:.7rem; font-weight:700; letter-spacing:.06em;
  padding:.6rem 1.4rem; border-radius:999px; background:var(--hot); color:#FFF7F3;
  transition:transform .1s var(--spring);
}
.ago:active{ transform:scale(.95); }
.aquiet{
  font-family:'Space Grotesk',sans-serif; font-size:.7rem; font-weight:700; letter-spacing:.06em;
  padding:.6rem 1.2rem; border-radius:999px; background:rgba(var(--shade),.08); color:var(--dim);
  transition:transform .1s var(--spring);
}
.aquiet:active{ transform:scale(.95); }

@media(max-width:600px){
  .testcard{ padding:1.1rem 1rem; }
  .answer-input{ min-width:6rem; font-size:.86rem; }
}
@media (prefers-reduced-motion:reduce){
  *{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
}
</style>
</head>
<body>

<header class="header">
  <div class="htop">
    <a class="back" href="#" onclick="history.back();return false;" target="_top">← Grammar</a>
    <div class="title"><b>INTUITY</b><span>Phrasal Verbs · Practice</span></div>
    <button class="mute" id="mute" aria-label="Sound">🔊</button>
  </div>
  <div class="pagemodes" id="pagemodes">
    <button class="pmchip" data-mode="explore">Explore</button>
    <button class="pmchip active" data-mode="practice">Practice</button>
    <button class="pmchip" data-mode="gapfill">Quiz</button>
  </div>
</header>

<div class="subbar">
  <div class="enginebox">
    <span class="lab">Style</span>
    <div class="engine-toggle" id="engineToggle">
      <button class="engine-btn active" data-engine="study">Study</button>
      <button class="engine-btn" data-engine="arcade">Arcade</button>
    </div>
  </div>
  <div class="testbar" id="testSelector"></div>
</div>

<!-- ══ STUDY ══ -->
<div class="study-wrap">
  <div id="studyContent"><div class="loading">Loading exercises…</div></div>
</div>
<div class="action-bar" id="actionBar" style="display:none">
  <button class="action-btn secondary" id="clearBtn">Clear</button>
  <button class="action-btn primary" id="checkBtn">Check</button>
</div>

<!-- ══ ARCADE ══ -->
<div class="arcade-wrap">
  <div class="ahud">
    <span><b id="aRight">0</b> right</span>
    <span><b id="aWrong">0</b> wrong</span>
    <span class="streak" id="aStreakWrap">streak <b id="aStreak">0</b></span>
    <span><b id="aLeft">0</b> to go</span>
  </div>
  <div class="astage">
    <div class="acardwrap">
      <div class="acard" id="acard">
        <div class="kick"><i></i><span id="aKick">Phrasal Verbs · Arcade</span></div>
        <div class="context" id="aContext"></div>
        <div class="keyword" id="aKeyword"></div>
        <div class="prompt" id="aPrompt"></div>
        <div class="wc" id="aWc"></div>
        <div class="arow">
          <button class="acheck" id="aCheckBtn">Check</button>
          <span class="ahint">Enter also checks</span>
        </div>
        <div class="anote" id="aNote"></div>
      </div>
    </div>
  </div>
  <div class="abar">
    <span class="n" id="aSortedLabel">0 / 0</span>
    <div class="atrack" id="aTrack"><div class="afill" id="aFill"></div></div>
    <span>through the test</span>
  </div>
</div>

<div class="fx" id="fx" aria-hidden="true"></div>

<div class="aover" id="aOver">
  <div class="big" id="aOverBig">0%</div>
  <div class="sub" id="aOverSub"></div>
  <div class="list" id="aOverList"></div>
  <div class="aacts">
    <button class="aquiet" id="aRetryBtn">↻ Retry this test</button>
    <button class="ago" id="aNextBtn">Next test →</button>
  </div>
  <button class="aquiet" id="aStudyBtn" style="margin-top:.4rem">Switch to Study</button>
</div>

<script src="intuity-log.js"></script>
<script src="intuity-sound.js"></script>
<script>
/* ======================================================================
   SHARED STATE + GRADING
   Both engines read the same `allTests` and score through the same
   gradeAnswer(). Neither engine is allowed to duplicate that decision —
   if the rule ever needs to change, it changes in exactly one place.
====================================================================== */
let allTests = [];
let currentTest = 0;
let engine = localStorage.getItem('phrasal_engine') === 'arcade' ? 'arcade' : 'study';
let testScores = {};

const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const sfx = name => { try { if (window.SFX && SFX[name]) SFX[name](); } catch(e){} };
const logIt = (item, ok, extra) => { try { if (window.INTUITY) INTUITY.log('phrasal-verbs', item.keyWord + ':' + item.answer, ok, extra); } catch(e){} };

function normalizeAnswer(answer){
  return String(answer||'').toLowerCase().trim().replace(/\s+/g, ' ');
}

/* THE ONE PLACE AN ANSWER IS JUDGED.
   Word-count rule first — 2 to 5 words, only checked if something was
   typed — then exact match or any listed alternative, both normalized.
   Identical to the original page's inline logic, just named and shared
   so Study's batch Check and Arcade's per-question Check can't drift
   into judging the same input two different ways. */
function gradeAnswer(item, rawValue){
  const val = String(rawValue || '').trim();
  if (!val) return { ok:false, reason:'empty', correct:item.answer };
  const wordCount = val.split(/\s+/).length;
  if (wordCount < 2 || wordCount > 5){
    return { ok:false, reason:'wordcount', correct:item.answer };
  }
  const userAnswer = normalizeAnswer(val);
  const correctAnswer = normalizeAnswer(item.answer);
  const alts = item.alternativeAnswers || [];
  const ok = userAnswer === correctAnswer || alts.some(a => normalizeAnswer(a) === userAnswer);
  return { ok, reason: ok ? 'correct' : 'incorrect', correct:item.answer };
}

function loadSavedScores(){
  try{ const s = localStorage.getItem('phrasal_verbs_practice_scores'); if (s) testScores = JSON.parse(s); }
  catch(e){}
}
function saveScores(){
  try{ localStorage.setItem('phrasal_verbs_practice_scores', JSON.stringify(testScores)); } catch(e){}
}
/* Both engines finishing a test write through here, so a test completed
   in Arcade updates the same badge Study shows on its chip, and vice
   versa — one scoreboard behind two front ends. */
function saveTestScore(index, correct, total){
  const percentage = total ? Math.round((correct/total)*100) : 0;
  testScores['test'+index] = { correct, total, percentage, timestamp:new Date().toISOString() };
  saveScores();
  renderTestSelector();
}

async function loadData(){
  try{
    const res = await fetch('../../data/grammar-rules/phrasal-verbs-data.json');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    allTests = data.practice;
    if (!allTests || !allTests.length) throw new Error('no tests in the data file');
    loadSavedScores();
    renderTestSelector();
    document.body.classList.toggle('arcade', engine === 'arcade');
    syncEngineButtons();
    goToTest(0);
  }catch(err){
    $('studyContent').innerHTML = '<div class="error-box">Could not load exercises.<br>' + esc(err.message) + '</div>';
  }
}

function renderTestSelector(){
  const wrap = $('testSelector');
  wrap.innerHTML = '';
  allTests.forEach((test, i) => {
    const btn = document.createElement('button');
    btn.className = 'testchip' + (i === currentTest ? ' active' : '');
    const sc = testScores['test'+i];
    btn.innerHTML = 'Test ' + (i+1) + (sc ? '<span class="sc">' + sc.percentage + '%</span>' : '');
    btn.title = test.title || '';
    btn.onclick = () => goToTest(i);
    wrap.appendChild(btn);
  });
}

function goToTest(i){
  currentTest = i;
  renderTestSelector();
  if (engine === 'study') loadTestStudy(i); else startArcade(i);
}

function syncEngineButtons(){
  document.querySelectorAll('.engine-btn').forEach(b => b.classList.toggle('active', b.dataset.engine === engine));
}

$('engineToggle').addEventListener('click', e => {
  const btn = e.target.closest('.engine-btn');
  if (!btn || btn.dataset.engine === engine) return;
  engine = btn.dataset.engine;
  localStorage.setItem('phrasal_engine', engine);
  document.body.classList.toggle('arcade', engine === 'arcade');
  syncEngineButtons();
  stopArcade();
  goToTest(currentTest);
});

/* ======================================================================
   STUDY ENGINE — one full poster card per section, every question on it,
   graded together when Check is pressed. Structurally the same page it
   always was; only the skin and the shared grading call changed.
====================================================================== */
function loadTestStudy(index){
  const test = allTests[index];
  let html = '<div class="testcard"><div class="kick"><i></i>' + esc(test.title || ('Test ' + (index+1))) + '</div>';
  test.transformations.forEach((item, idx) => {
    const parts = item.sentence2.split('_____');
    html +=
      '<div class="qblock">' +
        '<div class="q-number">Question ' + (idx+1) + '</div>' +
        '<div class="sentence1">' + esc(item.sentence1) + '</div>' +
        '<div class="keyword">' + esc(item.keyWord) + '</div>' +
        '<div class="sentence2">' +
          '<span class="sentence2-part">' + esc(parts[0]) + '</span>' +
          '<input type="text" class="answer-input" id="input-' + idx + '" placeholder="…" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">' +
          '<span class="sentence2-part">' + esc(parts[1] || '') + '</span>' +
        '</div>' +
        '<div class="word-count" id="wordcount-' + idx + '"></div>' +
        '<div class="feedback" id="feedback-' + idx + '"><div class="feedback-label"></div><div class="feedback-answer"></div></div>' +
      '</div>';
  });
  html += '</div>';
  $('studyContent').innerHTML = html;
  test.transformations.forEach((item, idx) => {
    $('input-' + idx).addEventListener('input', () => updateWordCount(idx));
  });
  $('actionBar').style.display = 'flex';
  resetActionBar();
}

function updateWordCount(idx){
  const input = $('input-' + idx), out = $('wordcount-' + idx);
  const value = input.value.trim();
  input.style.width = value ? Math.min(Math.max(value.length*9+20, 80), 220) + 'px' : '';
  if (!value){ out.textContent = ''; out.classList.remove('warning'); return; }
  const n = value.split(/\s+/).length;
  out.textContent = n + ' word' + (n !== 1 ? 's' : '');
  out.classList.toggle('warning', n < 2 || n > 5);
}

function checkAnswersStudy(){
  const test = allTests[currentTest];
  let correct = 0;
  test.transformations.forEach((item, idx) => {
    const input = $('input-' + idx), feedback = $('feedback-' + idx);
    const g = gradeAnswer(item, input.value);
    feedback.classList.add('show');
    if (g.reason === 'wordcount'){
      input.classList.add('incorrect');
      feedback.classList.add('incorrect');
      feedback.querySelector('.feedback-label').textContent = '✗ Word count';
      feedback.querySelector('.feedback-answer').textContent = 'Use 2-5 words. Answer: "' + g.correct + '"';
    } else if (g.ok){
      input.classList.add('correct');
      feedback.classList.add('correct');
      feedback.querySelector('.feedback-label').textContent = '✓ Correct';
      correct++;
    } else {
      input.classList.add('incorrect');
      feedback.classList.add('incorrect');
      feedback.querySelector('.feedback-label').textContent = '✗ Incorrect';
      feedback.querySelector('.feedback-answer').textContent = 'Answer: "' + g.correct + '"';
    }
    input.readOnly = true;
    logIt(item, g.ok, { engine:'study', test:currentTest });
  });

  const total = test.transformations.length;
  saveTestScore(currentTest, correct, total);
  const pct = Math.round((correct/total)*100);

  $('studyContent').querySelector('.testcard').insertAdjacentHTML('beforebegin',
    '<div class="score-banner"><div class="score-text">' + correct + '/' + total + '</div>' +
     '<div class="score-label">' + pct + '% correct</div></div>');

  $('actionBar').innerHTML = '';
  const retry = document.createElement('button');
  retry.className = 'action-btn secondary'; retry.textContent = 'Retry';
  retry.onclick = () => loadTestStudy(currentTest);
  const answers = document.createElement('button');
  answers.className = 'action-btn primary'; answers.textContent = 'Answers';
  answers.onclick = showAnswersStudy;
  $('actionBar').append(retry, answers);

  window.scrollTo({ top:0, behavior:'smooth' });
}

function showAnswersStudy(){
  const test = allTests[currentTest];
  test.transformations.forEach((item, idx) => {
    const input = $('input-' + idx), feedback = $('feedback-' + idx);
    if (input.classList.contains('incorrect')){
      input.value = item.answer;
      input.classList.remove('incorrect'); input.classList.add('correct');
      feedback.classList.remove('incorrect'); feedback.classList.add('correct');
      feedback.querySelector('.feedback-label').textContent = '✓ Answer';
      feedback.querySelector('.feedback-answer').textContent = '';
    }
  });
}

function resetActionBar(){
  $('actionBar').innerHTML =
    '<button class="action-btn secondary" id="clearBtn">Clear</button>' +
    '<button class="action-btn primary" id="checkBtn">Check</button>';
  $('clearBtn').onclick = clearAnswersStudy;
  $('checkBtn').onclick = checkAnswersStudy;
}

function clearAnswersStudy(){
  const banner = document.querySelector('.score-banner');
  if (banner) banner.remove();
  const test = allTests[currentTest];
  test.transformations.forEach((item, idx) => {
    const input = $('input-' + idx), feedback = $('feedback-' + idx), wc = $('wordcount-' + idx);
    input.value = ''; input.style.width = ''; input.readOnly = false;
    input.classList.remove('correct','incorrect');
    feedback.classList.remove('show','correct','incorrect');
    wc.textContent = ''; wc.classList.remove('warning');
  });
  resetActionBar();
  window.scrollTo({ top:0, behavior:'smooth' });
}

/* ======================================================================
   ARCADE ENGINE — Sort's own machinery (points, streak multiplier, the
   receding bar, the burst, the floating numbers) applied to this page's
   transformation questions instead of Sort's gerund/infinitive piles.
   Order is kept as the test's original sequence rather than shuffled —
   these are built as a structured progression, not a drawn pool, so
   randomizing them would undercut the sequencing the test was written
   with. Grading is gradeAnswer(), the exact function Study uses.
====================================================================== */
let aQueue = [], aCurrent = null, aIdx = 0, aTotal = 0;
let aRight = 0, aWrong = 0, aStreak = 0, aBest = 0, aMissed = [], aLocked = false, aRunning = false;
let aPoints = 0, aMaxPoints = 0;
const BASE_GAIN = 10, BASE_LOSS = 15;
const multiplierFor = n => n >= 15 ? 2.2 : n >= 10 ? 1.7 : n >= 5 ? 1.3 : 1;

function stopArcade(){ aRunning = false; $('aOver').classList.remove('show'); }

function startArcade(index){
  currentTest = index;
  const test = allTests[index];
  aQueue = test.transformations.map((item, i) => ({ item, i }));
  aTotal = aQueue.length;
  aIdx = 0; aRight = 0; aWrong = 0; aStreak = 0; aBest = 0; aMissed = [];
  aPoints = 0; aMaxPoints = Math.max(1, aTotal * BASE_GAIN);
  aRunning = true;
  $('aOver').classList.remove('show');
  $('aKick').textContent = 'Test ' + (index+1) + ' · Arcade — ' + (test.title || '');
  aPaint();
  aNext();
}

function aNext(){
  $('aNote').innerHTML = '';
  if (!aQueue.length) return aFinish();
  const next = aQueue.shift();
  aCurrent = next.item; aIdx = next.i;
  aLocked = false;

  $('acard').className = 'acard';
  $('aContext').textContent = aCurrent.sentence1;
  $('aKeyword').textContent = aCurrent.keyWord;

  const parts = aCurrent.sentence2.split('_____');
  $('aPrompt').innerHTML =
    '<span class="apart">' + esc(parts[0]) + '</span>' +
    '<input type="text" class="aInput" id="aInput" placeholder="…" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">' +
    '<span class="apart">' + esc(parts[1] || '') + '</span>';
  $('aWc').textContent = '';
  $('aWc').classList.remove('warning');
  $('aCheckBtn').disabled = false;

  const input = $('aInput');
  input.addEventListener('input', () => {
    const v = input.value.trim();
    if (!v){ $('aWc').textContent = ''; $('aWc').classList.remove('warning'); return; }
    const n = v.split(/\s+/).length;
    $('aWc').textContent = n + ' word' + (n !== 1 ? 's' : '');
    $('aWc').classList.toggle('warning', n < 2 || n > 5);
  });
  input.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); aCheck(); } });
  input.focus();

  aPaint();
}

function spawnFloat(text, cls){
  if (matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const track = $('aTrack');
  const r = track.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'ptsfloat ' + cls;
  el.textContent = text;
  el.style.left = (r.left + r.width * (0.2 + Math.random()*0.6)) + 'px';
  el.style.top  = (r.top - 18) + 'px';
  document.body.appendChild(el);
  el.animate([{ transform:'translateY(0)', opacity:1 },{ transform:'translateY(-26px)', opacity:0 }],
    { duration:650, easing:'cubic-bezier(.1,.8,.2,1)' });
  setTimeout(() => el.remove(), 680);
}

$('aCheckBtn').addEventListener('click', aCheck);

function aCheck(){
  if (!aRunning || aLocked || !aCurrent) return;
  const input = $('aInput');
  const g = gradeAnswer(aCurrent, input.value);
  aLocked = true;
  $('aCheckBtn').disabled = true;
  logIt(aCurrent, g.ok, { engine:'arcade', test:currentTest });

  if (g.ok){
    const mult = multiplierFor(aStreak);
    aRight++; aStreak++; aBest = Math.max(aBest, aStreak);
    const gain = Math.round(BASE_GAIN * mult);
    aPoints = Math.min(aMaxPoints, aPoints + gain);
    input.classList.add('correct');
    sfx('correct');
    aBurst(input);
    $('aFill').classList.add('gain');
    spawnFloat('+' + gain, 'pos');
    $('aNote').innerHTML = '<div class="r">✓ correct</div>';
    aPaint();
    setTimeout(aNext, 950);
  } else {
    const mult = multiplierFor(aStreak);
    const loss = Math.round(BASE_LOSS * mult);
    aPoints = Math.max(0, aPoints - loss);
    aWrong++; aStreak = 0;
    aMissed.push(aCurrent);
    input.classList.add('incorrect');
    $('acard').classList.add('shake');
    $('aTrack').classList.remove('knock'); void $('aTrack').offsetWidth; $('aTrack').classList.add('knock');
    $('aFill').classList.add('sting');
    sfx('wrong');
    spawnFloat('−' + loss, 'neg');
    const why = g.reason === 'wordcount'
      ? 'Use 2–5 words. Answer: "' + esc(g.correct) + '"'
      : 'Answer: "' + esc(g.correct) + '"';
    $('aNote').innerHTML = '<div class="r">✗ ' + why + '</div>';
    aPaint();
    setTimeout(() => { $('aFill').classList.remove('sting'); aNext(); }, 2100);
  }
}

function aPaint(){
  $('aRight').textContent = aRight;
  $('aWrong').textContent = aWrong;
  $('aLeft').textContent = aQueue.length;
  const mult = multiplierFor(aStreak);
  $('aStreak').innerHTML = aStreak + (mult > 1 ? ' <span class="mult">×' + mult.toFixed(1).replace(/\.0$/,'') + '</span>' : '');
  const sw = $('aStreakWrap');
  sw.classList.toggle('live', aStreak >= 3);
  if (aStreak){ sw.classList.remove('pop'); void sw.offsetWidth; sw.classList.add('pop'); }
  $('aSortedLabel').textContent = aRight + ' / ' + aTotal;
  $('aFill').style.width = aMaxPoints ? Math.round(aPoints/aMaxPoints*100) + '%' : '0%';
  setTimeout(() => $('aFill').classList.remove('gain'), 600);
}

function aFinish(){
  aRunning = false;
  const seen = aRight + aWrong;
  const pct = seen ? Math.round(aRight/seen*100) : 0;
  saveTestScore(currentTest, aRight, aTotal);

  $('aOverBig').textContent = pct + '%';
  const bestMult = multiplierFor(aBest);
  $('aOverSub').textContent = aRight + '/' + aTotal + ' right · best streak ' + aBest +
    (bestMult > 1 ? ' (×' + bestMult.toFixed(1).replace(/\.0$/,'') + ')' : '');
  $('aOverList').innerHTML = aMissed.length
    ? 'Worth another look: ' + aMissed.map(m => '<b>' + esc(m.keyWord) + '</b> → ' + esc(m.answer)).join(' · ')
    : 'Nothing missed — the whole test, first time.';
  sfx('fanfare');
  $('aOver').classList.add('show');
}

$('aRetryBtn').addEventListener('click', () => startArcade(currentTest));
$('aNextBtn').addEventListener('click', () => { const n = (currentTest+1) % allTests.length; goToTest(n); });
$('aStudyBtn').addEventListener('click', () => {
  engine = 'study'; localStorage.setItem('phrasal_engine','study');
  document.body.classList.remove('arcade'); syncEngineButtons();
  $('aOver').classList.remove('show');
  loadTestStudy(currentTest);
});

/* fireworks — identical shape to Sort's burst()/shell(), reused verbatim
   so a correct answer feels like the same payoff in both places */
function aBurst(el){
  if (matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const fx = $('fx');
  const r = el.getBoundingClientRect();
  const cx = r.left + r.width/2, cy = r.top + r.height/2;
  const COLS = ['#6B3FA0','#E8632A','#C2956E','#A3B26A','#FFFFFF','#B44A22'];

  const flash = document.createElement('div');
  flash.className = 'spark fw-flash';
  flash.style.left = cx+'px'; flash.style.top = cy+'px';
  fx.appendChild(flash);
  flash.animate([{ transform:'translate(-50%,-50%) scale(.15)', opacity:1 },{ transform:'translate(-50%,-50%) scale(3.6)', opacity:0 }],
    { duration:440, easing:'cubic-bezier(.1,.8,.2,1)' });
  setTimeout(() => flash.remove(), 460);

  [0,120].forEach((delay,k) => setTimeout(() => {
    const ring = document.createElement('div');
    ring.className = 'spark fw-ring';
    ring.style.left = cx+'px'; ring.style.top = cy+'px';
    fx.appendChild(ring);
    ring.animate([{ transform:'translate(-50%,-50%) scale(.12)', opacity:.9 },{ transform:'translate(-50%,-50%) scale(' + (2.6+k) + ')', opacity:0 }],
      { duration:660+k*170, easing:'cubic-bezier(.1,.7,.2,1)' });
    setTimeout(() => ring.remove(), 860+k*170);
  }, delay));

  aShell(fx, cx, cy, 22, 36, 110, 500, ['#FFFFFF','#C2956E']);
  setTimeout(() => aShell(fx, cx, cy, 40, 80, 240, 1050, COLS), 90);
}
function aShell(fx, cx, cy, n, near, far, life, cols){
  for (let i = 0; i < n; i++){
    const p = document.createElement('div');
    p.className = 'spark';
    const col = cols[(Math.random()*cols.length)|0];
    const size = 3 + Math.random()*4.5;
    p.style.cssText += 'left:'+cx+'px; top:'+cy+'px; width:'+size+'px; height:'+size+'px; background:'+col+'; box-shadow:0 0 '+(size*2.6)+'px '+col+';';
    fx.appendChild(p);
    const a = Math.random()*Math.PI*2, d = near + Math.random()*(far-near);
    const dx = Math.cos(a)*d, dy = Math.sin(a)*d;
    const fall = 50 + Math.random()*100, dur = life * (.75 + Math.random()*.5);
    p.animate([
      { transform:'translate(-50%,-50%) translate(0,0) scale(1.3)', opacity:1 },
      { transform:'translate(-50%,-50%) translate('+(dx*.6).toFixed(0)+'px,'+(dy*.6-14).toFixed(0)+'px) scale(1)', opacity:1, offset:.4 },
      { transform:'translate(-50%,-50%) translate('+dx.toFixed(0)+'px,'+(dy+fall).toFixed(0)+'px) scale(.2)', opacity:0 }
    ], { duration:dur, easing:'cubic-bezier(.1,.75,.3,1)' });
    setTimeout(() => p.remove(), dur+40);
  }
}

/* ══ mute + page-mode nav — same postMessage/redirect contract as before ══ */
function paintMute(){
  const on = !window.SFX || SFX.isOn();
  $('mute').textContent = on ? '🔊' : '🔇';
  $('mute').setAttribute('aria-label', on ? 'Sound on' : 'Sound off');
}
$('mute').onclick = () => { if (window.SFX) SFX.toggle(); paintMute(); };
paintMute();

document.querySelectorAll('.pmchip').forEach(btn => {
  btn.addEventListener('click', () => {
    const mode = btn.dataset.mode;
    if (mode === 'practice') return;
    if (window.parent !== window) window.parent.postMessage({ action:'switchMode', mode }, '*');
    else window.location.href = 'phrasal-verbs-rules.html?mode=' + mode;
  });
});

window.addEventListener('load', loadData);
</script>
