<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTUITY — Pulse</title>
<meta name="theme-color" content="#FAF7F2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@500;700;900&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ═══ PULSE ═══
   A card falls, four particles wait at the bottom, you tap before it lands.
   Same material as Rack, Pegs and Pairs: one ground colour, tiles made of
   light, Anton for the verb, caramel for the particle, a drawn violet tick
   or orange cross for the verdict.

   THE FALLING CARD IS THE TILE. It was a dark slab with a gold rim on a
   vignetted black field; it is the notched tile now, raised because it is in
   play — which is the same rule the boards use, arriving from a different
   direction: on a board a tile rises when it has been dealt with, here it is
   raised the whole time it is falling and settles into the surface when it
   lands.

   THE FOUR LANES ARE EGGS. Pegs put the particle in a caramel egg; this is
   the same object at the bottom of a screen instead of inside a square, so a
   child who has played Pegs already knows what these are. Four hues would
   have been four more colours to learn — the lane is identified by its
   position and its key, both of which are already on it. */

*,*::before,*::after{ margin:0; padding:0; box-sizing:border-box; }

:root{
  --ground:#DFE3E3;
  --card-fill:#F1EEE6;
  --ink:#17171A;
  --dim:#5C6366;
  --faint:#8A9093;
  --rule:#C2956E;
  --caramel:#B0865C;
  --tick:#6B3FA0;
  --cross:#E8632A;
  --ok:#A3B26A;
  --bad:#B8402A;
  --hot:#B44A22;
  --shade:40,50,54;
  --header-h:132px; --lane-h:112px; --hud-h:42px;
  --spring:cubic-bezier(.2,1.4,.4,1);
}

html,body{ height:100%; overflow:hidden; }
body{
  background:var(--ground); color:var(--ink);
  font-family:'DM Sans',system-ui,sans-serif; -webkit-font-smoothing:antialiased;
  user-select:none; -webkit-user-select:none;
}
button{ font:inherit; border:none; background:none; cursor:pointer; color:inherit; }

/* ══ HEADER — the shell's, so the band never leaves ══ */
.header{
  position:fixed; top:0; left:0; right:0; z-index:100;
  display:flex; flex-direction:column; gap:.45rem; padding:.55rem 1rem .5rem;
  background:#FAF7F2; border-bottom:1px solid var(--rule);
}
.header-top{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; }
.back-link{
  justify-self:start; text-decoration:none;
  font-family:'Space Grotesk',sans-serif; font-size:.6rem; font-weight:700;
  letter-spacing:.08em; text-transform:uppercase; color:var(--faint);
  transition:color .2s; white-space:nowrap;
}
.back-link:hover{ color:var(--ink); }
.header-title{ display:flex; flex-direction:column; align-items:center; line-height:1.1; }
.app-title{
  font-family:'Space Grotesk',sans-serif; font-size:1rem; font-weight:900;
  letter-spacing:.2em; color:var(--ink);
}
.app-subtitle{
  font-size:.56rem; font-weight:600; letter-spacing:.16em;
  text-transform:uppercase; color:var(--faint); margin-top:.15rem;
}
.mode-selector{ display:flex; flex-wrap:wrap; justify-content:center; gap:.1rem; }
.mode-btn{
  position:relative; display:flex; align-items:center; gap:.3rem;
  font-family:'Space Grotesk',sans-serif; font-size:.66rem; font-weight:600;
  letter-spacing:.05em; text-transform:uppercase;
  padding:.34rem .7rem .4rem; border-radius:999px; color:var(--faint);
  transition:color .2s, background .15s;
}
.mode-btn:hover{ color:var(--dim); background:rgba(var(--shade),.05); }
.mode-btn.active{ color:var(--ink); font-weight:700; }
.mode-btn.active::after{
  content:''; position:absolute; left:.7rem; right:.7rem; bottom:0; height:2px;
  border-radius:2px; background:var(--hot);
}
/* The seven emoji went with the dark theme, as they did on the hub. */
.mode-icon{ display:none; }
.mode-badge{
  font-family:'DM Mono',monospace; font-size:.56rem; color:var(--faint);
}
.mode-btn.active .mode-badge{ color:var(--hot); }

.verb-tabs{ display:flex; flex-wrap:wrap; justify-content:center; gap:.28rem; }
.vtab{
  font-family:'Space Grotesk',sans-serif; font-size:.6rem; font-weight:600;
  letter-spacing:.08em; text-transform:uppercase; padding:.3rem .7rem;
  border-radius:999px; color:var(--faint); white-space:nowrap;
  transition:color .2s, background .15s;
}
.vtab:hover{ color:var(--dim); background:rgba(var(--shade),.05); }
.vtab.active{ color:var(--ink); font-weight:700; background:rgba(var(--shade),.08); }
.vtab .due{
  display:inline-block; width:5px; height:5px; border-radius:50%;
  margin-left:.35rem; background:var(--hot); opacity:0; transition:opacity .3s;
}
.vtab.has-due .due{ opacity:1; }

/* ══ HUD ══ */
.hud{
  position:fixed; top:var(--header-h); left:0; right:0; height:var(--hud-h); z-index:30;
  display:flex; align-items:center; justify-content:center; gap:.9rem; padding:0 1rem;
  font-family:'DM Mono',monospace; font-size:.66rem; color:var(--faint);
  background:var(--ground); border-bottom:1px solid rgba(var(--shade),.1);
}
.score-n{ color:var(--ink); font-weight:500; }
.combo{ color:var(--hot); font-weight:500; }
.clock{ color:var(--ink); font-variant-numeric:tabular-nums; }
.speeds{ display:flex; gap:.2rem; }
.spd{
  font-family:'Space Grotesk',sans-serif; font-size:.58rem; font-weight:700;
  letter-spacing:.06em; text-transform:uppercase; padding:.24rem .6rem;
  border-radius:999px; color:var(--faint);
}
.spd.on{ background:rgba(var(--shade),.09); color:var(--ink); }
.mutebtn{ font-size:.8rem; opacity:.7; }
.mutebtn.off{ opacity:.28; }
@media(max-width:600px){ .speeds{ display:none } }

/* ══ FIELD ══
   No vignette. The old field faded to near-black at the edges to make the
   card glow; on a light ground the fall reads on its own and a gradient
   would just be a grey smear. */
.field{
  position:fixed; top:calc(var(--header-h) + var(--hud-h)); left:0; right:0;
  bottom:var(--lane-h); overflow:hidden; background:var(--ground);
}
.guides{ position:absolute; inset:0; display:grid; grid-template-columns:repeat(4,1fr); pointer-events:none; }
.guide{ border-right:1px solid rgba(var(--shade),.07); }
.guide:last-child{ border-right:none; }
/* The strike line is where the card lands — the one caramel rule on the
   field, matching the one under the header. */
.strike{
  position:absolute; left:0; right:0; bottom:0; height:2px; z-index:5;
  background:linear-gradient(90deg,transparent,var(--rule),transparent);
  transition:opacity .12s;
}
.strike.beat{ opacity:.55; }

/* ── THE FALLING CARD ── */
.card{
  position:absolute; z-index:3; left:50%; top:0; width:min(86%,460px);
  transform:translate(-50%,-100%);
  display:flex; flex-direction:column; align-items:center; gap:.7rem;
  padding:1.15rem 1.1rem 1rem; border-radius:0;
  background:var(--card-fill); border:none;
  filter:drop-shadow(-3px -3px 6px rgba(255,255,255,.9))
         drop-shadow(3px 5px 10px rgba(var(--shade),.22));
}
/* Verb stays the dominant black read; the "?" beside it is the second
   read — the missing particle the falling card is asking about. */
.card .verb-row{ display:flex; align-items:baseline; gap:.5rem; }
.card .verb{
  font-family:'Anton',Impact,sans-serif; font-weight:400;
  font-size:clamp(1.15rem,5vw,1.5rem); letter-spacing:.055em; line-height:1;
  text-transform:uppercase; color:var(--ink);
}
.card .qmark{
  font-family:'Anton',Impact,sans-serif; font-weight:400;
  font-size:clamp(1.15rem,5vw,1.5rem); line-height:1; color:var(--caramel);
}
.card .def-box{
  width:100%; border-radius:8px; padding:.6rem .8rem;
  background:rgba(var(--shade),.06);
}
.card .def{
  font-size:.85rem; font-weight:400; line-height:1.35; text-align:center; color:var(--ink);
}
.card.hit .qmark{ color:var(--ok); }
.card.miss .qmark{ color:var(--bad); }

.tapstart{
  position:absolute; left:50%; bottom:1.2rem; transform:translateX(-50%); z-index:9;
  font-family:'DM Mono',monospace; font-size:.6rem; letter-spacing:.12em;
  text-transform:uppercase; color:var(--faint);
  pointer-events:none; transition:opacity .4s; white-space:nowrap;
}
.tapstart.gone{ opacity:0; }

/* ══ LANES — shrink-to-fit pills ══
   The performance bar (a live gradient rule) sits where the hairline
   border used to be — it is the divider between the field and the lanes,
   not a separate element. */
.lanes{
  position:fixed; bottom:0; left:0; right:0; height:var(--lane-h); z-index:20;
  display:flex; align-items:center; justify-content:space-around; gap:.5rem;
  padding:1rem .9rem calc(env(safe-area-inset-bottom,0px) + .8rem);
  background:var(--ground); border-top:none;
}
.lanes::before{
  content:''; position:absolute; top:0; left:0; right:0; height:3px;
  border-radius:2px;
  background:linear-gradient(90deg,#F5E7C8 0%,#E8A85C 55%,#B44A22 100%);
}
.lane{
  position:relative; display:inline-flex; flex-direction:column;
  align-items:center; justify-content:center; gap:.1rem;
  border:none; border-radius:999px; background:rgba(var(--shade),.16);
  padding:.45rem 1rem; transition:transform .09s, background .12s;
}
.lane .p{
  font-family:'Space Grotesk',sans-serif; font-weight:700;
  font-size:clamp(.82rem,3.6vw,1.05rem); color:var(--ink); line-height:1;
  padding:0; text-align:center; word-break:break-word;
}
.lane .k{ font-family:'DM Mono',monospace; font-size:.5rem; color:rgba(23,23,26,.42); }
.lane:active, .lane.tap{ transform:translateY(3px); background:var(--hot); }
.lane:active .p, .lane.tap .p{ color:#FFF7F3; }
.lane.correct{ background:var(--ok); }
.lane.wrongtap{ background:var(--bad); }
.lane.wrongtap .p, .lane.wrongtap .k{ color:#FFF3EF; }
.lanes.swapping .lane{ opacity:.3; transform:scale(.96); }

/* ══ FX — on its own layer, never inside a scroller ══ */
.spark{ position:absolute; width:5px; height:5px; border-radius:50%; pointer-events:none; z-index:8; }
.flash{
  position:absolute; width:70px; height:70px; border-radius:50%; pointer-events:none; z-index:8;
  background:radial-gradient(circle,#FFFFFF 0%,var(--rule) 38%,rgba(194,149,110,0) 70%);
}
.banner{
  position:fixed; left:50%; top:38%; transform:translate(-50%,-50%) scale(.85); z-index:35;
  font-family:'Anton',Impact,sans-serif; font-size:clamp(1.4rem,7vw,2.6rem);
  letter-spacing:.05em; text-transform:uppercase; color:var(--ink);
  opacity:0; pointer-events:none; text-align:center;
  transition:opacity .18s, transform .35s var(--spring);
}
.banner.show{ opacity:1; transform:translate(-50%,-50%) scale(1); }
.tier{
  position:fixed; left:50%; bottom:calc(var(--lane-h) + .6rem); transform:translateX(-50%); z-index:26;
  font-family:'DM Mono',monospace; font-size:.6rem; letter-spacing:.14em;
  text-transform:uppercase; color:var(--hot); opacity:0; transition:opacity .3s;
  pointer-events:none; white-space:nowrap;
}
.tier.show{ opacity:1; }

/* ══ SUMMARY ══ */
.over{
  position:fixed; inset:0; z-index:50; display:none;
  align-items:center; justify-content:center; padding:1.2rem;
  background:rgba(43,33,41,.26); backdrop-filter:blur(3px);
}
.over.show{ display:flex; }
.over-card{
  position:relative; width:100%; max-width:22rem; max-height:min(78vh,32rem); overflow-y:auto;
  display:flex; flex-direction:column; align-items:center; gap:.35rem; text-align:center;
  padding:1.9rem 1.6rem 1.5rem; border-radius:22px;
  background:#FFFFFF; border:none;
  box-shadow:0 24px 60px rgba(var(--shade),.22);
  animation:cardIn .28s cubic-bezier(.2,1,.4,1) both;
}
@keyframes cardIn{ from{ opacity:0; transform:translateY(10px) scale(.97) } to{ opacity:1; transform:none } }
.over .closex{
  position:absolute; top:.6rem; right:.6rem; width:28px; height:28px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; font-size:1rem; line-height:1;
  color:var(--dim); background:rgba(var(--shade),.07); transition:background .15s, transform .1s;
}
.over .closex:hover{ background:rgba(var(--shade),.13); color:var(--ink); }
.over .closex:active{ transform:scale(.92); }
.over .score{
  font-family:'Anton',Impact,sans-serif; font-size:clamp(2.2rem,8vw,3rem);
  letter-spacing:.03em; color:var(--ink); font-variant-numeric:tabular-nums;
}
.over .score .gr{ font-size:.5em; margin-left:.3rem; vertical-align:.35em; }
.g-a{ color:var(--ok) } .g-b{ color:var(--ok) } .g-c{ color:var(--rule) } .g-d{ color:var(--bad) }
.over .word{
  font-family:'DM Mono',monospace; font-size:.68rem; letter-spacing:.16em;
  text-transform:uppercase; color:var(--faint);
}
.over .note{ margin-top:.6rem; font-size:.8rem; color:var(--dim); }
.over .note b{ color:var(--ink); }
.over .missed{ margin-top:.7rem; font-size:.78rem; line-height:1.7; color:var(--dim); }
.over .missed b{ color:var(--caramel); font-weight:700; }
.acts{ display:flex; gap:.6rem; flex-wrap:wrap; justify-content:center; margin-top:1.2rem; }
.over .go{
  padding:.7rem 1.6rem; border-radius:999px; background:var(--hot); color:#FFF7F3;
  font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:.72rem;
  transition:transform .1s var(--spring);
}
.over .go:active{ transform:scale(.95); }
.over .quiet{
  padding:.7rem 1.4rem; border-radius:999px; color:var(--dim);
  background:rgba(var(--shade),.08); font-size:.7rem;
  font-family:'Space Grotesk',sans-serif; font-weight:700;
  transition:transform .1s var(--spring);
}
.over .quiet:hover{ color:var(--ink); }
.over .quiet:active{ transform:scale(.95); }
.over .away{ margin-top:.9rem; font-size:.66rem; background:none; padding:.3rem; }

.recap{ width:100%; margin-top:.9rem; padding-top:.8rem; border-top:1px solid rgba(var(--shade),.12); }
.recapLabel{
  font-family:'DM Mono',monospace; font-size:.58rem; letter-spacing:.14em;
  text-transform:uppercase; color:var(--faint); margin-bottom:.5rem;
}
.recapRow{ display:flex; flex-wrap:wrap; gap:.4rem; justify-content:center; }
.recap-chip{
  position:relative; display:inline-flex; align-items:center; gap:.3rem;
  padding:.34rem .7rem; border-radius:999px;
  font-family:'Space Grotesk',sans-serif; font-size:.68rem; font-weight:600;
  background:rgba(var(--shade),.07); color:var(--dim);
  transition:background .2s, color .2s, transform .15s;
}
.recap-chip:hover,.recap-chip:focus-visible{ transform:translateY(-1px); color:var(--ink); outline:none; }
.recap-chip.done{ background:var(--ok); color:#17171A; }
.recap-chip.done::before{ content:'✓'; font-size:.62em; opacity:.85; }
.recap-tip{
  position:fixed; z-index:60; display:none; pointer-events:none;
  max-width:14rem; padding:.5rem .7rem; border-radius:.6rem;
  background:#FFFFFF; border:none; box-shadow:0 12px 30px rgba(var(--shade),.22);
  color:var(--dim); font-family:'DM Sans',sans-serif; font-size:.7rem; line-height:1.45;
  text-align:left; text-transform:none; letter-spacing:normal;
}
.recap-tip b{
  display:block; color:var(--ink); font-family:'Anton',Impact,sans-serif;
  letter-spacing:.05em; text-transform:uppercase; font-size:.72rem; margin-bottom:.2rem;
}

.codebox{
  width:100%; margin-top:.9rem; padding:.6rem .7rem; border-radius:.7rem;
  background:rgba(var(--shade),.06); border:none;
}
.codelabel{
  font-family:'DM Mono',monospace; font-size:.54rem; letter-spacing:.14em;
  text-transform:uppercase; color:var(--faint);
}
.code{
  font-family:'DM Mono',monospace; font-size:.68rem; color:var(--hot);
  word-break:break-all; margin-top:.25rem; line-height:1.45;
  user-select:all; -webkit-user-select:all;
}
.pastewrap{ display:flex; gap:.4rem; width:100%; margin-top:.5rem; }
.pastewrap input{
  flex:1; min-width:0; background:rgba(var(--shade),.07); border:none;
  border-radius:.5rem; padding:.5rem .6rem; color:var(--ink);
  font-family:'DM Mono',monospace; font-size:.66rem;
}
.pastewrap input:focus{ outline:none; box-shadow:0 0 0 2px var(--hot); }
.pastewrap .quiet{ padding:.5rem .9rem; margin:0; }

.resume{
  position:fixed; left:50%; bottom:calc(var(--lane-h) + 1rem); transform:translateX(-50%); z-index:40;
  display:none; gap:.5rem; align-items:center;
}
.resume.show{ display:flex; }
.resume button{
  font-family:'Space Grotesk',sans-serif; font-size:.68rem; font-weight:700;
  padding:.6rem 1.3rem; border-radius:999px;
  background:var(--hot); color:#FFF7F3;
}

  /* THE WAY OUT, WHEN THERE IS ONE.
     This button did location.href = 'phrasal-verbs-play.html' — from inside
     the host's own iframe, which loaded the host INSIDE ITSELF: two headers
     stacked on one screen, and a landing on Explore because that is the
     host's default mode. Framed, the band above the frame is already the way
     back, so the button has no job and is hidden. Opened on its own it
     navigates the top window, which is what it always meant to do. */
  html.embedded .away{ display:none; }
.loading{
  position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
  background:var(--ground); z-index:99;
  font-family:'DM Mono',monospace; font-size:.7rem; color:var(--faint);
}
.err{ color:var(--bad); font-size:.8rem; line-height:1.6; max-width:26rem; text-align:center; padding:2rem; }

@media(max-width:600px){
  :root{ --lane-h:104px }
  .card{ width:92%; padding:1rem .9rem .9rem }
  .card .def{ font-size:.85rem }
  .hud{ font-size:.6rem; gap:.55rem; padding:0 .7rem }
}
@media(prefers-reduced-motion:reduce){ .card,.lane,.combo,.banner{ transition:none!important } }
</style>
</head>
<body>

<header class="header">
  <div class="header-top">
    <a class="back-link" href="/?openModal=grammar" target="_top">← Grammar</a>
    <div class="header-title"><div class="app-title">INTUITY</div><div class="app-subtitle">Phrasal Verbs</div></div>
    <div class="header-spacer" aria-hidden="true"></div>
  </div>
  <div class="mode-selector">
    <button class="mode-btn" data-href="phrasal-verbs-quiz.html" data-mode="learn"><span class="mode-label">Learn</span></button>
    <button class="mode-btn" data-href="phrasal-verbs-quiz.html" data-mode="quiz"><span class="mode-label">Quiz</span></button>
    <button class="mode-btn" data-href="phrasal-verbs-quiz.html" data-mode="gap"><span class="mode-label">Practice</span></button>
    <button class="mode-btn" data-href="phrasal-verbs-quiz.html" data-mode="match"><span class="mode-label">Match</span></button>
    <button class="mode-btn active"><span class="mode-label">Pulse</span><span class="mode-badge">1m</span></button>
    <button class="mode-btn" data-href="phrasal-verbs-game.html?standalone=1"><span class="mode-label">Stars</span><span class="mode-badge">2m</span></button>
    <button class="mode-btn" data-href="phrasal-verbs-game-burrow.html"><span class="mode-label">Burrow</span><span class="mode-badge">2m</span></button>
  </div>
  <div class="verb-tabs" id="verbTabs"></div>
</header>

<div class="hud">
  <span>score <span class="score-n" id="score">0</span></span>
  <span class="speeds" id="speeds">
    <button class="spd" data-s="relaxed">Relaxed</button>
    <button class="spd" data-s="steady">Steady</button>
    <button class="spd" data-s="quick">Quick</button>
  </span>
  <span class="combo" id="combo">×1</span>
  <button class="mutebtn" id="muteBtn" title="Sound on/off">🔊</button>
  <span class="clock" id="clock">1:00</span>
</div>

<div class="field" id="field">
  <div class="guides"><div class="guide"></div><div class="guide"></div><div class="guide"></div><div class="guide"></div></div>
  <div class="strike" id="strike"></div>
  <div class="tapstart" id="tapStart">Tap the particle · keys 1–4</div>
</div>

<div class="lanes" id="lanes"></div>
<div class="tier" id="tier"></div>
<div class="banner" id="banner"></div>

<div class="resume" id="resume"><button id="resumeBtn">↺ Play again</button></div>

<!-- SUMMARY — Hunt's card -->
<div class="over" id="over">
  <div class="over-card">
    <button class="closex" id="closeX" aria-label="Close">×</button>
    <div class="score" id="ovScore"></div>
    <div class="word" id="ovWord"></div>
    <div class="note" id="ovNote"></div>
    <div class="missed" id="ovMissed"></div>
    <div class="recap" id="recap">
      <div class="recapLabel" id="recapLabel">All particles for this set</div>
      <div class="recapRow" id="recapRow"></div>
    </div>
    <div class="codebox">
      <div class="codelabel">Send this to a friend — they get your exact round</div>
      <div class="code" id="ovCode">—</div>
    </div>
    <div class="pastewrap">
      <input id="codeIn" placeholder="paste a friend's code" autocomplete="off" spellcheck="false">
      <button class="quiet" id="raceBtn">Race</button>
    </div>
    <div class="acts">
      <button class="quiet" id="againBtn">↻ Same set again</button>
      <button class="go" id="nextBtn">Next set →</button>
    </div>
    <button class="quiet away" id="hubBtn">Back to phrasal verbs</button>
  </div>
</div>

<div class="loading" id="loading">Loading…</div>

<script src="intuity-log.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════════════
   PULSE — phrasal verbs on a beat.

   Shares the shell with Quiz, Stars and Burrow: same header, same gold,
   same phrasal-verbs-data.json, ?verb= carried in and out, INTUITY.log()
   on every attempt, and Hunt's summary card at the end.

   No start page. The set from ?verb= (or the first set) opens straight
   into a Relaxed round — the speed control lives in the HUD, so choosing
   a different pace never costs a screen.

   Design: the four particles on screen all come from the SAME set and
   hold their positions, so the learner builds a contrast set rather than
   solving each item cold. A set of 16 particles is worked four at a time.

   Audio is not content: no play button, nothing to wait for. The loop is
   the clock, and its layers are unlocked by the combo, so a broken streak
   is something the player HEARS go away.
   ══════════════════════════════════════════════════════════════════════ */

window.addEventListener('error', e => {
  const l = document.getElementById('loading');
  if (l && l.style.display !== 'none') l.innerHTML =
    '<p class="err"><b>Pulse hit an error.</b><br>' + String(e.message||e).replace(/[<>]/g,'') +
    '<br><span style="opacity:.6">' + ((e.filename||'').split('/').pop()+':'+(e.lineno||'?')) + '</span></p>';
});

const DATA_URLS = [
  '../../data/grammar-rules/phrasal-verbs-data.json',
  './phrasal-verbs-data.json'
];

const BPM = 92, BEAT = 60000/BPM, ROUND_MS = 60000, LANE_N = 4;
/* The four lanes were --lane1..4: sky, violet, mint and orange, one hue each.
   They are all the caramel egg now — a lane is told apart by where it sits
   and the key printed on it, both of which were already there. Kept as a
   constant so nothing downstream has to change. */
const LANE_COLORS = ['--caramel','--caramel','--caramel','--caramel'];
const KEYS = ['1','2','3','4'];
const FALL_BEATS = 5, PER_10_CHARS = .42, FALL_MAX = 9, GAP_BEATS = 1.2;
const SPEEDS = { relaxed:1.45, steady:1.0, quick:.72 };
/* Relaxed by default: better a learner speeds it up than misses items they
   knew because the definition had not finished being read. */
let speed = localStorage.getItem('intuity-pulse-speed') || 'relaxed';

const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const firstSense = m => String(m).split(';')[0].trim();
const B36 = '0123456789abcdefghijklmnopqrstuvwxyz';
const shuffle = a => { const b=[...a]; for(let i=b.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[b[i],b[j]]=[b[j],b[i]];} return b; };

let GROUPS = [], groupIdx = 0;
let running = false, startedAt = 0, rafId = null, started = false;
let seq = [], seqAt = 0, live = [], lanes = [];
let score = 0, combo = 0, bestCombo = 0, hits = 0, misses = 0, missLog = [], caught = new Set();
let ghost = null, checkpoints = [], nextSpawnAt = 0, lastBeat = -1;

/* ── MEMORY: the invisible scheduler ── */
const MEM_KEY = 'intuity-pulse-mem';
function loadMem(){ try{ return JSON.parse(localStorage.getItem(MEM_KEY)||'{}'); }catch(e){ return {}; } }
function saveMem(m){ try{ localStorage.setItem(MEM_KEY,JSON.stringify(m)); }catch(e){} }
const memKey = it => it.verb + ' ' + it.particle;
function noteResult(it, ok){
  const m = loadMem(), k = memKey(it), e = m[k] || {miss:0,seen:0};
  e.seen++; if (ok) e.miss = Math.max(0,e.miss-1); else e.miss++;
  m[k] = e; saveMem(m);
}
function weightOf(it, mem){
  const e = mem[memKey(it)];
  return e ? 1 + Math.min(6, e.miss*3) : 2;
}

/* ── AUDIO ── */
let ac = null, master = null, musicOn = localStorage.getItem('intuity-pulse-sound') !== 'off';
function audio(){
  if (!ac){
    ac = new (window.AudioContext||window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = .5; master.connect(ac.destination);
  }
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
function tone(f,d,ty,v,when,glide){
  if (!musicOn || !ac) return;
  const c = ac, t0 = when || c.currentTime;
  const o = c.createOscillator(), g = c.createGain();
  o.type = ty||'sine'; o.frequency.setValueAtTime(f,t0);
  if (glide) o.frequency.exponentialRampToValueAtTime(glide,t0+d);
  g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(v||.14,t0+.008);
  g.gain.exponentialRampToValueAtTime(.0008,t0+d);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0+d+.02);
}
function noise(d,v,when){
  if (!musicOn || !ac) return;
  const c = ac, t0 = when||c.currentTime, n = Math.floor(c.sampleRate*d);
  const buf = c.createBuffer(1,n,c.sampleRate), dd = buf.getChannelData(0);
  for (let i=0;i<n;i++) dd[i]=(Math.random()*2-1)*(1-i/n);
  const s = c.createBufferSource(); s.buffer = buf;
  const g = c.createGain(); g.gain.value = v||.06;
  const fl = c.createBiquadFilter(); fl.type='highpass'; fl.frequency.value=6000;
  s.connect(fl); fl.connect(g); g.connect(master); s.start(t0);
}
const BASS = [55,55,73.42,65.41], ARP = [440,554.37,659.25,554.37];
function playBeat(b){
  if (!ac) return;
  const t = ac.currentTime;
  tone(58,.11,'sine',.3,t,34);
  if (combo>=5)  tone(BASS[(b>>1)%4],.3,'triangle',.1,t);
  if (combo>=10) noise(.05, combo>=15?.05:.035, t);
  if (combo>=15) tone(ARP[b%4]*2,.12,'square',.035,t);
}
function sfxHit(m){ if(!ac)return; const t=ac.currentTime,b=523.25*Math.pow(1.0595,Math.min(12,m));
  tone(b,.1,'triangle',.16,t); tone(b*1.5,.14,'triangle',.12,t+.05); }
function sfxMiss(){ if(!ac)return; tone(180,.22,'sawtooth',.13,ac.currentTime,90); }
function sfxSwap(){ if(!ac)return; const t=ac.currentTime;
  [261,329,392,523,659].forEach((f,i)=>tone(f,.45,'triangle',.12,t+i*.06)); }

/* ── ITEMS & LANE BLOCKS ── */
function itemsOf(g){
  return (g.items||[]).filter(it=>it.particle&&it.meaning).map(it=>({
    verb:(it.verb||g.label||g.id).toUpperCase(), particle:it.particle, meaning:firstSense(it.meaning)
  }));
}
/* A set like TAKE has 16 particles; four fit on screen. Chop the set into
   blocks of four and work through one at a time, so every distractor is a
   particle the same verb genuinely takes — the discrimination the exam
   asks for — while the whole set is still met over a round. */
function buildBlocks(items){
  const seen = [];
  items.forEach(it=>{ if(!seen.includes(it.particle)) seen.push(it.particle); });
  const order = shuffle(seen), blocks = [];
  for (let i=0;i<order.length;i+=LANE_N){
    const b = order.slice(i,i+LANE_N);
    if (b.length < LANE_N) for (const p of order){ if(b.length>=LANE_N) break; if(!b.includes(p)) b.push(p); }
    blocks.push(b);
  }
  return blocks;
}
function buildSequence(items){
  const mem = loadMem(), out = [];
  shuffle(buildBlocks(items)).forEach(block=>{
    const bag = items.filter(it=>block.includes(it.particle)).map(it=>({it,w:weightOf(it,mem)}));
    while (bag.length){
      let total = bag.reduce((s,x)=>s+x.w,0), r = Math.random()*total, c = 0, j = 0;
      for (;j<bag.length;j++){ c += bag[j].w; if (r<=c) break; }
      j = Math.min(j,bag.length-1);
      out.push({ item:bag[j].it, block }); bag.splice(j,1);
    }
  });
  return out;
}
function fallMsFor(item){
  const beats = Math.min(FALL_MAX, FALL_BEATS + (String(item.meaning).length/10)*PER_10_CHARS);
  return beats * BEAT * (SPEEDS[speed]||1);
}

function paintLanes(set, announce){
  lanes = set;
  const el = $('lanes');
  el.innerHTML = set.map((p,i)=>
    `<button class="lane" data-i="${i}" style="--lc:var(${LANE_COLORS[i]})">
       <span class="p">${esc(p)}</span><span class="k">${KEYS[i]}</span></button>`).join('');
  el.querySelectorAll('.lane').forEach(b=>{
    b.addEventListener('pointerdown', e=>{ e.preventDefault(); firstTouch(); tapLane(+b.dataset.i); });
  });
  if (announce){
    el.classList.add('swapping'); setTimeout(()=>el.classList.remove('swapping'),260);
    sfxSwap(); banner('New four','var(--ink)');
  }
}

/* The round is already running when the page opens; the first input only
   wakes the audio context, which browsers require a gesture for. */
function firstTouch(){
  if (started) return;
  started = true; audio();
  $('tapStart').classList.add('gone');
}

/* ── ROUND ── */
function startRound(fromIdx){
  const g = GROUPS[groupIdx];
  const items = itemsOf(g);
  seq = fromIdx
    ? fromIdx.map(i=>items[i]).filter(Boolean).map(it=>({item:it,block:null}))
    : buildSequence(items);
  if (fromIdx){
    const blocks = buildBlocks(items);
    seq.forEach(s=>{ s.block = blocks.find(b=>b.includes(s.item.particle)) || blocks[0]; });
  }
  seq.idx = seq.map(s=>items.findIndex(x=>x.verb===s.item.verb&&x.particle===s.item.particle&&x.meaning===s.item.meaning));

  seqAt = 0; live = []; caught = new Set();
  score = 0; combo = 0; bestCombo = 0; hits = 0; misses = 0; missLog = []; checkpoints = [];
  $('score').textContent = '0'; setCombo(0);
  paintLanes(seq[0].block,false);
  $('field').querySelectorAll('.card').forEach(n=>n.remove());
  $('over').classList.remove('show');
  $('resume').classList.remove('show');
  hideTip();

  running = true; startedAt = performance.now(); nextSpawnAt = 0; lastBeat = -1;
  rafId = requestAnimationFrame(loop);
}

function loop(now){
  if (!running) return;
  const t = now - startedAt;

  const b = Math.floor(t/BEAT);
  if (b !== lastBeat){
    lastBeat = b; playBeat(b);
    const s = $('strike'); s.classList.add('beat'); setTimeout(()=>s.classList.remove('beat'),90);
  }

  if (t >= nextSpawnAt && seqAt < seq.length){
    const e = seq[seqAt++];
    if (e.block && e.block.join('|') !== lanes.join('|')) paintLanes(e.block,true);
    spawn(e.item,t);
    nextSpawnAt = t + fallMsFor(e.item) + GAP_BEATS*BEAT;
  }

  const fh = $('field').clientHeight;
  for (let i=live.length-1;i>=0;i--){
    const c = live[i];
    if (c.done){
      c.el.style.transform = `translate(-50%,${c.restY}px) scale(.94)`;
      if (t-c.doneAt > 420){ c.el.remove(); live.splice(i,1); }
      continue;
    }
    const p = (t-c.born)/c.fallMs;
    c.el.style.transform = `translate(-50%,${p*(fh+40)-40}px)`;
    if (p >= 1) resolveCard(c,null,t);
  }

  const leftMs = Math.max(0, ROUND_MS - t);
  $('clock').textContent = '0:' + String(Math.ceil(leftMs/1000)).padStart(2,'0');
  $('clock').classList.toggle('low', leftMs <= 10000);
  const cp = Math.floor(t/5000);
  if (cp > checkpoints.length-1 && cp < 12) checkpoints[cp] = score;

  if (t >= ROUND_MS || (seqAt >= seq.length && live.length === 0)){ finish(); return; }
  rafId = requestAnimationFrame(loop);
}

function spawn(item,t){
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = `<div class="verb-row"><span class="verb">${esc(item.verb)}</span><span class="qmark">?</span></div>
                  <div class="def-box"><div class="def">${esc(item.meaning)}</div></div>`;
  $('field').appendChild(el);
  /* The very first card of a round gets extra time: the player has not
     touched the screen yet and is still reading the lanes. */
  const bonus = seqAt === 1 ? 2*BEAT : 0;
  live.push({ el, item, born:t, done:false, fallMs: fallMsFor(item)+bonus });
}

function tapLane(i){
  if (!running) return;
  const el = $('lanes').querySelectorAll('.lane')[i];
  if (el){ el.classList.add('tap'); setTimeout(()=>el.classList.remove('tap'),110); }
  const open = live.filter(c=>!c.done);
  if (!open.length) return;
  open.sort((a,b)=>b.born-a.born);
  resolveCard(open[open.length-1], lanes[i], performance.now()-startedAt);
}

function resolveCard(c, chosen, t){
  c.done = true; c.doneAt = t;
  const fh = $('field').clientHeight;
  c.restY = Math.min(fh-10, ((t-c.born)/c.fallMs)*(fh+40)-40);
  const ok = chosen === c.item.particle;
  const laneEl = $('lanes').querySelectorAll('.lane')[lanes.indexOf(c.item.particle)];

  noteResult(c.item, ok);
  try{ if (window.INTUITY) INTUITY.log('phrasal-verbs', c.item.verb+' '+c.item.particle, ok, {game:'pulse'}); }catch(e){}

  /* Answered before it landed → bring the next one forward. Reading time is
     protected; knowing it early is still rewarded. */
  const soonest = t + (ok ? 900 : 1500);
  if (nextSpawnAt > soonest) nextSpawnAt = soonest;

  const slot = c.el.querySelector('.qmark');
  slot.textContent = c.item.particle;

  if (ok){
    hits++; combo++; bestCombo = Math.max(bestCombo,combo);
    caught.add(c.item.particle);
    score += 100 * (1 + Math.floor(combo/5));
    c.el.classList.add('hit');
    if (laneEl){ laneEl.classList.add('correct'); setTimeout(()=>laneEl.classList.remove('correct'),240); }
    sfxHit(combo); burst(c.el, combo>=10); setCombo(combo);
    if (combo===5)  { banner('Bass','var(--rule)');  tierNote('bass unlocked'); }
    if (combo===10) { banner('Drive','var(--ok)'); tierNote('drums unlocked'); }
    if (combo===15) { banner('Full','var(--hot)'); tierNote('full track — hold it'); }
  } else {
    misses++; combo = 0; setCombo(0); missLog.push(c.item);
    c.el.classList.add('miss');
    /* Correction on the spot: the right lane lights even on a miss. */
    if (laneEl){ laneEl.classList.add('correct'); setTimeout(()=>laneEl.classList.remove('correct'),420); }
    if (chosen){
      const we = $('lanes').querySelectorAll('.lane')[lanes.indexOf(chosen)];
      if (we){ we.classList.add('wrongtap'); setTimeout(()=>we.classList.remove('wrongtap'),300); }
    }
    sfxMiss();
  }
  $('score').textContent = score;
}

function setCombo(n){
  const el = $('combo');
  el.textContent = '×' + (1+Math.floor(n/5)) + (n ? '  '+n : '');
  el.classList.toggle('live', n>=5);
  el.classList.add('pop'); setTimeout(()=>el.classList.remove('pop'),150);
}
function banner(txt,col){
  const b = $('banner'); b.textContent = txt; b.style.color = col;
  b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
  setTimeout(()=>b.classList.remove('show'),750);
}
function tierNote(txt){
  const t = $('tier'); t.textContent = txt;
  t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1600);
}
function burst(cardEl,big){
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const field = $('field'), fr = field.getBoundingClientRect(), r = cardEl.getBoundingClientRect();
  const cx = r.left+r.width/2-fr.left, cy = r.top+r.height/2-fr.top;
  const f = document.createElement('div'); f.className='flash';
  f.style.cssText += `left:${cx}px;top:${cy}px;transform:translate(-50%,-50%)`;
  field.appendChild(f);
  f.animate([{transform:'translate(-50%,-50%) scale(.2)',opacity:1},
             {transform:`translate(-50%,-50%) scale(${big?3:2})`,opacity:0}],
            {duration:big?420:300,easing:'cubic-bezier(.1,.8,.2,1)'});
  setTimeout(()=>f.remove(),440);
  const COLS = ['#6B3FA0','#E8632A','#C2956E','#A3B26A','#FFFFFF','#B44A22'];
  for (let i=0;i<(big?26:12);i++){
    const p = document.createElement('div'); p.className='spark';
    const col = COLS[(Math.random()*COLS.length)|0], sz = 3+Math.random()*3;
    p.style.cssText += `left:${cx}px;top:${cy}px;width:${sz}px;height:${sz}px;background:${col};box-shadow:0 0 ${sz*2.5}px ${col}`;
    field.appendChild(p);
    const a = Math.random()*Math.PI*2, d = 40+Math.random()*(big?140:80), dur = 600+Math.random()*350;
    p.animate([{transform:'translate(-50%,-50%) scale(1.1)',opacity:1},
      {transform:`translate(-50%,-50%) translate(${Math.cos(a)*d}px,${Math.sin(a)*d+50}px) scale(.2)`,opacity:0}],
      {duration:dur,easing:'cubic-bezier(.12,.75,.3,1)'});
    setTimeout(()=>p.remove(),dur+30);
  }
}

/* ── SUMMARY — Hunt's card, its grade scale and its recap chips ── */
function scale(acc){
  const A = [[0,140],[.60,160],[.72,173],[.80,180],[1,190]];
  for (let i=1;i<A.length;i++){
    const [a0,s0]=A[i-1],[a1,s1]=A[i];
    if (acc<=a1) return Math.round(s0+(acc-a0)/(a1-a0)*(s1-s0));
  }
  return 190;
}
const grade = s => s>=180?['A','Excellent']:s>=173?['B','Very good']:s>=160?['C','Pass']:['D','Try again'];

let tipEl = null, tipOwner = null;
function initTip(){
  tipEl = document.createElement('div'); tipEl.className = 'recap-tip';
  document.body.appendChild(tipEl);
  document.addEventListener('click', e => { if (tipOwner && !e.target.closest('.recap-chip')) hideTip(); });
  window.addEventListener('scroll', hideTip, true);
}
function showTip(chip){
  tipOwner = chip;
  tipEl.innerHTML = '<b>'+esc(chip.dataset.verb)+'</b>'+esc(chip.dataset.def);
  tipEl.style.display = 'block';
  const r = chip.getBoundingClientRect(), tw = tipEl.offsetWidth, th = tipEl.offsetHeight;
  let left = Math.max(8, Math.min(r.left+r.width/2-tw/2, window.innerWidth-tw-8));
  let top = r.top-th-9; if (top < 4) top = r.bottom+9;
  tipEl.style.left = left+'px'; tipEl.style.top = top+'px';
}
function hideTip(){ tipOwner = null; if (tipEl) tipEl.style.display = 'none'; }

function renderRecap(){
  const row = $('recapRow'); row.innerHTML = '';
  const g = GROUPS[groupIdx], items = itemsOf(g);
  const seen = new Map();
  items.forEach(it=>{ if(!seen.has(it.particle)) seen.set(it.particle, it); });
  if (!seen.size){ $('recap').style.display='none'; return; }
  $('recap').style.display = '';
  $('recapLabel').textContent = 'All ' + esc(g.label) + ' particles';
  seen.forEach((it,p)=>{
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'recap-chip' + (caught.has(p) ? ' done' : '');
    chip.textContent = p;
    chip.dataset.verb = it.verb + ' ' + p;
    chip.dataset.def = it.meaning;
    chip.setAttribute('aria-label', it.verb+' '+p+': '+it.meaning);
    chip.addEventListener('mouseenter',()=>showTip(chip));
    chip.addEventListener('mouseleave',hideTip);
    chip.addEventListener('focus',()=>showTip(chip));
    chip.addEventListener('blur',hideTip);
    chip.addEventListener('click',e=>{ e.stopPropagation(); tipOwner===chip?hideTip():showTip(chip); });
    row.appendChild(chip);
  });
}

function finish(){
  running = false; cancelAnimationFrame(rafId);
  live.forEach(c=>c.el.remove()); live = [];
  try{ if (window.INTUITY) INTUITY.session('phrasal-verbs','pulse',{hits,misses,best:bestCombo,score}); }catch(e){}

  const total = hits+misses, acc = total ? hits/total : 0;
  const sc = scale(acc), [letter,word] = grade(sc);
  $('ovScore').className = 'score g-'+letter.toLowerCase();
  $('ovScore').innerHTML = sc + '<span class="gr">'+letter+'</span>';
  $('ovWord').textContent = word + ' · ' + GROUPS[groupIdx].label;

  const items = itemsOf(GROUPS[groupIdx]);
  const distinct = new Set(items.map(i=>i.particle)).size;
  $('ovNote').innerHTML = '<b>'+hits+'</b> caught, <b>'+misses+'</b> missed · best combo <b>'+
    bestCombo+'</b> · score <b>'+score+'</b><br><b>'+caught.size+'</b> of <b>'+distinct+
    '</b> particles cleared this round';

  const seen = new Map();
  missLog.forEach(m=>{ const k=m.verb+' '+m.particle; seen.set(k,(seen.get(k)||0)+1); });
  $('ovMissed').innerHTML = seen.size
    ? 'Worth another look: ' + [...seen].map(([k,n])=>'<b>'+esc(k)+'</b>'+(n>1?' ×'+n:'')).join(' · ')
    : '';

  renderRecap();
  while (checkpoints.length < 12) checkpoints.push(score);
  $('ovCode').textContent = ['PULSE', GROUPS[groupIdx].id.toUpperCase(),
    seq.idx.map(i=>B36[i]||'0').join(''), score.toString(36),
    checkpoints.slice(0,12).map(c=>Math.round(c/100).toString(36)).join('')].join('-');

  $('over').classList.add('show');
}

/* Closing keeps the field and header in place and offers the round back. */
function closeOver(){
  $('over').classList.remove('show');
  hideTip();
  $('resume').classList.add('show');
}

function applyCode(raw){
  const p = String(raw).trim().toUpperCase().split('-');
  if (p.length < 5 || p[0] !== 'PULSE') return null;
  const gi = GROUPS.findIndex(g=>g.id.toUpperCase()===p[1]);
  if (gi < 0) return null;
  return { groupIdx:gi, idx:[...p[2].toLowerCase()].map(c=>B36.indexOf(c)).filter(i=>i>=0) };
}

/* ── TABS ── */
function buildTabs(){
  const mem = loadMem(), wrap = $('verbTabs');
  wrap.innerHTML = ''; let divDone = false;
  GROUPS.forEach((g,i)=>{
    if (g.mixed && !divDone){ divDone = true;
      const d = document.createElement('span'); d.className='tabdiv'; wrap.appendChild(d); }
    const due = itemsOf(g).some(it=>{ const e = mem[memKey(it)]; return e && e.miss>0; });
    const b = document.createElement('button');
    b.className = 'vtab' + (i===groupIdx?' active':'') + (due?' has-due':'');
    b.style.setProperty('--vc', g.color);
    b.innerHTML = esc(g.label) + '<span class="due"></span>';
    b.title = itemsOf(g).length + ' phrases';
    b.addEventListener('click', ()=>{ switchGroup(i); });
    wrap.appendChild(b);
  });
}
function switchGroup(i){
  groupIdx = i; ghost = null;
  applyGroupColor(); buildTabs(); syncHeader();
  const u = new URL(location.href); u.searchParams.set('verb', GROUPS[i].id);
  history.replaceState(null,'',u);
  startRound(null);
}
function applyGroupColor(){
  const g = GROUPS[groupIdx]; if (!g) return;
  document.documentElement.style.setProperty('--verb-color', g.color);
  document.documentElement.style.setProperty('--verb-rgb', g.colorRgb);
}

/* ── EVENTS ── */
document.addEventListener('keydown', e=>{
  if (e.key === 'Escape' && $('over').classList.contains('show')){ closeOver(); return; }
  const i = KEYS.indexOf(e.key);
  if (i>=0){ e.preventDefault(); firstTouch(); tapLane(i); }
  if (e.key==='m'||e.key==='M') toggleMute();
});
$('over').addEventListener('click', e => { if (e.target === $('over')) closeOver(); });
$('closeX').addEventListener('click', closeOver);
$('againBtn').addEventListener('click', ()=>{ firstTouch(); startRound(ghost?ghost.idx:null); });
$('nextBtn').addEventListener('click', ()=>{
  ghost = null;
  switchGroup((groupIdx+1) % GROUPS.length);
});
$('resumeBtn').addEventListener('click', ()=>{ firstTouch(); $('resume').classList.remove('show'); startRound(null); });
$('hubBtn').addEventListener('click', ()=>{
  const u = new URL('phrasal-verbs-quiz.html', location.href);
  if (GROUPS[groupIdx]) u.searchParams.set('verb', GROUPS[groupIdx].id);
  (window.top || window).location.href = u.toString();
});
$('raceBtn').addEventListener('click', ()=>{
  const c = applyCode($('codeIn').value);
  if (!c){ $('codeIn').value=''; $('codeIn').placeholder='that code did not read — check it'; return; }
  groupIdx = c.groupIdx; applyGroupColor(); buildTabs(); syncHeader();
  ghost = { idx:c.idx }; firstTouch(); startRound(c.idx);
});
function toggleMute(){
  musicOn = !musicOn;
  try{ localStorage.setItem('intuity-pulse-sound', musicOn?'on':'off'); }catch(e){}
  $('muteBtn').textContent = musicOn ? '🔊' : '🔇';
  $('muteBtn').classList.toggle('off', !musicOn);
  tierNote(musicOn ? 'sound on' : 'sound off');
}
$('muteBtn').addEventListener('click', ()=>{ firstTouch(); toggleMute(); });
function paintSpeed(){ document.querySelectorAll('.spd').forEach(b=>b.classList.toggle('on', b.dataset.s===speed)); }
document.querySelectorAll('.spd').forEach(b=>b.addEventListener('click', ()=>{
  speed = b.dataset.s;
  try{ localStorage.setItem('intuity-pulse-speed', speed); }catch(e){}
  paintSpeed(); tierNote(speed + ' pace');
}));
$('field').addEventListener('pointerdown', firstTouch);

function initModeNav(){
  document.querySelectorAll('.mode-btn').forEach(b=>{
    b.addEventListener('click', ()=>{
      if (!b.dataset.href) return;
      running = false; cancelAnimationFrame(rafId);
      const u = new URL(b.dataset.href, location.href);
      if (b.dataset.mode) u.searchParams.set('mode', b.dataset.mode);
      if (GROUPS[groupIdx]) u.searchParams.set('verb', GROUPS[groupIdx].id);
      (window.top||window).location.href = u.toString();
    });
  });
}

/* ── BOOT ── */
function syncHeader(){
  const h = document.querySelector('.header');
  if (h) document.documentElement.style.setProperty('--header-h', h.offsetHeight+'px');
}
window.addEventListener('resize', syncHeader);
window.addEventListener('orientationchange', ()=>setTimeout(syncHeader,120));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(syncHeader);
if (window.ResizeObserver){
  const ro = new ResizeObserver(()=>syncHeader());
  document.addEventListener('DOMContentLoaded', ()=>{
    const h = document.querySelector('.header'); if (h) ro.observe(h);
  });
}

async function boot(){
  let d = null, tried = [];
  for (const u of DATA_URLS){
    try{
      const res = await fetch(u);
      if (!res.ok) throw new Error('HTTP '+res.status);
      d = await res.json(); break;
    }catch(e){ tried.push(u+' → '+(e.message||e)); }
  }
  if (!d){
    $('loading').innerHTML = '<p class="err"><b>Could not load the phrasal verb data.</b><br>'+
      tried.map(t=>t.replace(/[<>]/g,'')).join('<br>')+'</p>';
    return;
  }
  GROUPS = (d.groups||[]).filter(g => (g.items||[]).length >= LANE_N);
  if (!GROUPS.length){ $('loading').innerHTML = '<p class="err">No usable verb sets in the data.</p>'; return; }

  const q = new URLSearchParams(location.search).get('verb');
  const qi = GROUPS.findIndex(g=>g.id===q); if (qi>=0) groupIdx = qi;

  applyGroupColor(); buildTabs(); initModeNav(); initTip(); paintSpeed();
  $('muteBtn').textContent = musicOn ? '🔊' : '🔇';
  $('muteBtn').classList.toggle('off', !musicOn);
  syncHeader();
  $('loading').style.display = 'none';

  /* Straight into the default set at Relaxed — no start page. */
  startRound(null);
  setTimeout(()=>{ if (!started) $('tapStart').classList.add('gone'); }, 6000);
}
boot();
</script>
</body>
</html>
