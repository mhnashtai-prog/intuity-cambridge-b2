<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTUITY — Pulse</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --gold:#C9A961; --accent:#FFD94A;
  --ok:#abc32f; --wrong:#E86A5C;
  --paper:#e5e5e7; --dim:rgba(229,229,231,.55); --faint:rgba(229,229,231,.26);
  --lane1:#61b5ed; --lane2:#c084fc; --lane3:#5ED39B; --lane4:#fb923c;
  --header-h:96px; --lane-h:104px; --hud-h:40px;
  --beat:666ms;
}
html,body{width:100%;height:100%;overflow:hidden;background:#0b0b0d;overscroll-behavior:none}
body{font-family:'DM Sans',sans-serif;color:var(--paper);user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* ── HEADER ── */
.header{position:fixed;top:0;left:0;right:0;z-index:30;
  display:flex;flex-direction:column;gap:.35rem;padding:.5rem 1rem .4rem;
  background:rgba(11,11,13,.92);backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(255,255,255,.06)}
.header-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.back-link{justify-self:start;text-decoration:none;font-family:'Space Grotesk',sans-serif;
  font-size:.6rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.3)}
.back-link:hover{color:rgba(255,255,255,.7)}
.title-wrap{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.app-title{font-family:'Space Grotesk',sans-serif;font-size:1rem;font-weight:900;letter-spacing:.22em;color:var(--gold)}
.app-sub{font-size:.56rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.32);margin-top:.1rem}
.verb-tabs{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.28rem;padding:0 .4rem}
.vtab{font-family:'Space Grotesk',sans-serif;font-size:.56rem;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;padding:.28rem .72rem;border-radius:999px;border:1px solid transparent;
  color:rgba(255,255,255,.3);transition:all .18s}
.vtab:hover{color:rgba(255,255,255,.75);border-color:rgba(255,255,255,.15)}
.vtab.active{color:var(--vc,var(--gold));border-color:var(--vc,var(--gold));background:rgba(255,255,255,.06)}
.vtab .due{display:inline-block;width:5px;height:5px;border-radius:50%;margin-left:.35rem;
  vertical-align:middle;background:var(--wrong);opacity:0}
.vtab.has-due .due{opacity:1}

/* ── HUD ── */
.hud{position:fixed;top:var(--header-h);left:0;right:0;height:var(--hud-h);z-index:25;
  display:flex;align-items:center;justify-content:space-between;gap:.8rem;padding:0 1rem;
  font-family:'DM Mono',monospace;font-size:.66rem;color:var(--faint);
  border-bottom:1px solid rgba(255,255,255,.05)}
.score-n{font-family:'Space Grotesk',sans-serif;font-weight:900;font-size:1.05rem;
  color:var(--paper);font-variant-numeric:tabular-nums}
.combo{font-family:'Space Grotesk',sans-serif;font-weight:900;font-size:1rem;color:var(--faint);
  transition:color .15s,transform .15s;font-variant-numeric:tabular-nums}
.combo.live{color:var(--accent)}
.combo.pop{transform:scale(1.35)}
.clock{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:.95rem;color:var(--paper);font-variant-numeric:tabular-nums}
.clock.low{color:var(--wrong)}

/* ── FIELD ── */
.field{position:fixed;top:calc(var(--header-h) + var(--hud-h));left:0;right:0;bottom:var(--lane-h);
  overflow:hidden;
  background:radial-gradient(ellipse at 50% 110%,rgba(201,169,97,.10),transparent 62%)}
.field::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:4;
  background:radial-gradient(ellipse at 50% 40%,transparent 60%,rgba(9,9,11,.7) 100%)}

/* the four vertical guides — the contrast set, made spatial */
.guides{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);pointer-events:none}
.guide{border-right:1px solid rgba(255,255,255,.045)}
.guide:last-child{border-right:none}
.guide.flash{background:rgba(255,255,255,.05)}

/* strike line: where the decision is due */
.strike{position:absolute;left:0;right:0;bottom:0;height:2px;z-index:5;
  background:linear-gradient(90deg,transparent,rgba(255,217,74,.75),transparent)}
.strike.beat{box-shadow:0 0 16px 2px rgba(255,217,74,.5)}

/* ── FALLING CARD ── */
.card{position:absolute;z-index:3;left:50%;top:0;width:min(86%,520px);
  transform:translate(-50%,-100%);
  display:flex;flex-direction:column;align-items:center;gap:.3rem;
  padding:.7rem 1rem .8rem;border-radius:.7rem;
  background:linear-gradient(178deg,rgba(38,38,44,.97),rgba(22,22,26,.99));
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 .5rem 1.4rem rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.09)}
.card .verb{font-family:'Space Grotesk',sans-serif;font-weight:900;font-size:1.15rem;
  letter-spacing:.05em;color:var(--gold);line-height:1}
.card .verb .slot{display:inline-block;min-width:2.6em;margin-left:.35em;
  border-bottom:2px dashed rgba(255,217,74,.5);vertical-align:baseline}
.card .def{font-size:.95rem;font-weight:600;line-height:1.3;text-align:center;color:var(--paper)}
.card.hit{border-color:var(--ok);background:linear-gradient(178deg,rgba(80,110,30,.9),rgba(40,60,15,.95))}
.card.miss{border-color:var(--wrong);background:linear-gradient(178deg,rgba(120,45,40,.9),rgba(60,22,20,.95))}

/* ── LANES ── */
.lanes{position:fixed;bottom:0;left:0;right:0;height:var(--lane-h);z-index:20;
  display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;padding:.5rem .5rem .7rem;
  background:rgba(11,11,13,.96);border-top:1px solid rgba(255,255,255,.08)}
.lane{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;
  border-radius:.6rem;border:1.5px solid var(--lc);background:color-mix(in srgb,var(--lc) 12%,transparent);
  font-family:'Space Grotesk',sans-serif;font-weight:900;
  transition:transform .09s,background .12s,box-shadow .12s}
.lane .p{font-size:clamp(.95rem,4.2vw,1.35rem);color:var(--lc);letter-spacing:.01em;line-height:1;
  padding:0 .2rem;text-align:center;word-break:break-word}
.lane .k{font-family:'DM Mono',monospace;font-size:.5rem;font-weight:400;color:rgba(255,255,255,.24);letter-spacing:.06em}
.lane:active,.lane.tap{transform:translateY(3px);background:color-mix(in srgb,var(--lc) 32%,transparent);
  box-shadow:0 0 22px color-mix(in srgb,var(--lc) 45%,transparent)}
.lane.correct{background:rgba(171,195,47,.4);border-color:var(--ok);box-shadow:0 0 26px rgba(171,195,47,.5)}
.lane.wrongtap{background:rgba(232,106,92,.32);border-color:var(--wrong)}

/* ── FX ── */
.spark{position:absolute;width:5px;height:5px;border-radius:50%;pointer-events:none;z-index:8}
.flash{position:absolute;width:70px;height:70px;border-radius:50%;pointer-events:none;z-index:8;
  background:radial-gradient(circle,#fff 0%,var(--accent) 35%,rgba(255,217,74,0) 70%)}
.banner{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.8);z-index:35;
  font-family:'Space Grotesk',sans-serif;font-weight:900;font-size:clamp(1.3rem,6vw,2.4rem);
  letter-spacing:.1em;text-transform:uppercase;opacity:0;pointer-events:none;text-align:center;
  text-shadow:0 0 26px currentColor;transition:opacity .18s,transform .35s cubic-bezier(.2,1.6,.4,1)}
.banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.tier{position:fixed;left:50%;bottom:calc(var(--lane-h) + .6rem);transform:translateX(-50%);z-index:26;
  font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.tier.show{opacity:.9}

/* ghost racer marker */
.ghost{position:fixed;right:.6rem;top:calc(var(--header-h) + var(--hud-h) + .4rem);z-index:26;
  font-family:'DM Mono',monospace;font-size:.6rem;color:var(--faint);text-align:right;line-height:1.5;
  pointer-events:none}
.ghost b{color:var(--paper);font-variant-numeric:tabular-nums}
.ghost.ahead b{color:var(--wrong)}
.ghost.behind b{color:var(--ok)}

/* ── OVERLAY ── */
.over{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:1rem;
  background:rgba(8,8,10,.9);backdrop-filter:blur(6px);overflow-y:auto}
.over.show{display:flex}
.card-over{width:100%;max-width:24rem;display:flex;flex-direction:column;align-items:center;gap:.4rem;
  text-align:center;padding:1.5rem 1.3rem 1.3rem;border-radius:1rem;
  background:linear-gradient(165deg,rgba(28,28,32,.99),rgba(15,15,18,.99));
  border:1px solid rgba(201,169,97,.28);box-shadow:0 20px 55px rgba(0,0,0,.7)}
.big{font-family:'Space Grotesk',sans-serif;font-weight:900;font-size:clamp(2.2rem,9vw,3.2rem);
  font-variant-numeric:tabular-nums;line-height:1;color:var(--accent)}
.sub{font-family:'DM Mono',monospace;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.rowstat{display:flex;gap:1.2rem;margin-top:.5rem;font-family:'DM Mono',monospace;font-size:.66rem;color:var(--dim)}
.rowstat b{color:var(--paper);font-variant-numeric:tabular-nums}
.missed{width:100%;margin-top:.8rem;padding-top:.7rem;border-top:1px dashed rgba(255,255,255,.13);
  font-size:.76rem;line-height:1.8;color:var(--dim);text-align:left;max-height:9rem;overflow-y:auto}
.missed .mi{display:flex;justify-content:space-between;gap:.6rem;padding:.15rem 0}
.missed .mp{font-family:'Space Grotesk',sans-serif;font-weight:700;color:var(--wrong);white-space:nowrap;font-size:.72rem}
.missed .mm{color:var(--faint);text-align:right;font-size:.7rem}
.codebox{width:100%;margin-top:.9rem;padding:.6rem;border-radius:.6rem;
  background:rgba(255,217,74,.07);border:1px solid rgba(255,217,74,.3)}
.codelabel{font-family:'DM Mono',monospace;font-size:.55rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.code{font-family:'DM Mono',monospace;font-size:.72rem;color:var(--accent);word-break:break-all;
  margin-top:.25rem;line-height:1.45;user-select:all;-webkit-user-select:all}
.acts{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center;margin-top:1rem}
.btn{padding:.65rem 1.4rem;border-radius:99px;font-family:'Space Grotesk',sans-serif;font-weight:700;
  font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;transition:all .15s}
.btn.go{background:var(--accent);color:#12100a}
.btn.go:hover{filter:brightness(1.1)}
.btn.quiet{color:var(--dim);border:1px solid rgba(255,255,255,.18)}
.btn.quiet:hover{color:var(--paper);border-color:rgba(255,255,255,.4)}
.pastewrap{display:flex;gap:.4rem;width:100%;margin-top:.5rem}
.pastewrap input{flex:1;min-width:0;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.16);
  border-radius:.5rem;padding:.5rem .6rem;color:var(--paper);font-family:'DM Mono',monospace;font-size:.68rem}
.pastewrap input:focus{outline:none;border-color:var(--accent)}

/* ── START ── */
.start{position:fixed;inset:0;z-index:55;display:flex;align-items:center;justify-content:center;padding:1rem;
  background:rgba(9,9,11,.94);backdrop-filter:blur(4px)}
.start.gone{display:none}
.start-in{max-width:24rem;text-align:center;display:flex;flex-direction:column;align-items:center;gap:.6rem}
.start-in h1{font-family:'Space Grotesk',sans-serif;font-weight:900;font-size:clamp(2.4rem,11vw,3.6rem);
  letter-spacing:.16em;color:var(--accent);line-height:1}
.start-in p{font-size:.86rem;line-height:1.65;color:var(--dim)}
.start-in p b{color:var(--paper);font-weight:700}
.loading{font-family:'DM Mono',monospace;font-size:.7rem;color:var(--faint)}
.err{color:var(--wrong);font-size:.8rem;line-height:1.6;max-width:24rem;text-align:center}

@media(max-width:600px){
  :root{--lane-h:96px}
  .card{width:92%;padding:.6rem .8rem .7rem}
  .card .def{font-size:.88rem}
  .card .verb{font-size:1.02rem}
  .hud{font-size:.6rem;gap:.5rem;padding:0 .7rem}
}
@media(prefers-reduced-motion:reduce){
  .card,.lane,.combo,.banner{transition:none!important}
}
</style>
</head>
<body>

<header class="header">
  <div class="header-top">
    <a class="back-link" href="/?openModal=grammar">← Grammar</a>
    <div class="title-wrap"><div class="app-title">INTUITY</div><div class="app-sub">Pulse</div></div>
    <div></div>
  </div>
  <div class="verb-tabs" id="verbTabs"></div>
</header>

<div class="hud">
  <span>score <span class="score-n" id="score">0</span></span>
  <span class="combo" id="combo">×1</span>
  <span class="clock" id="clock">0:60</span>
</div>

<div class="field" id="field">
  <div class="guides" id="guides">
    <div class="guide"></div><div class="guide"></div><div class="guide"></div><div class="guide"></div>
  </div>
  <div class="strike" id="strike"></div>
</div>

<div class="lanes" id="lanes"></div>
<div class="tier" id="tier"></div>
<div class="ghost" id="ghost" style="display:none"></div>
<div class="banner" id="banner"></div>

<div class="start" id="start">
  <div class="start-in" id="startIn">
    <div class="loading">Loading…</div>
  </div>
</div>

<div class="over" id="over">
  <div class="card-over">
    <div class="big" id="ovScore">0</div>
    <div class="sub" id="ovGrade"></div>
    <div class="rowstat">
      <span>hit <b id="ovHit">0</b></span>
      <span>missed <b id="ovMiss">0</b></span>
      <span>best combo <b id="ovBest">0</b></span>
    </div>
    <div class="missed" id="ovMissed"></div>
    <div class="codebox">
      <div class="codelabel">Send this to a friend — they get your exact round</div>
      <div class="code" id="ovCode">—</div>
    </div>
    <div class="pastewrap">
      <input id="codeIn" placeholder="paste a friend's code" autocomplete="off" spellcheck="false">
      <button class="btn quiet" id="raceBtn">Race</button>
    </div>
    <div class="acts">
      <button class="btn go" id="againBtn">Play again</button>
      <button class="btn quiet" id="newBtn">New set</button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════
   PULSE — phrasal verbs on a beat.

   The design argument, in one line: the four particles hold the same four
   screen positions for the whole round, so the learner stops solving each
   item cold and starts building a contrast set — which is how phrasal verbs
   actually consolidate, and what the B2 paper tests.

   Audio is not content here. There is no speaker icon and nothing to wait
   for: the loop IS the clock, so it cannot be skipped the way a pronounce
   button can. Layers unlock with the combo, so a broken streak is something
   the player HEARS go away.
   ══════════════════════════════════════════════════════════════════════ */

/* A silent failure is the worst outcome for a page a teacher opens in
   front of a class: put whatever went wrong on screen where it can be read
   and reported. */
window.addEventListener('error', e => {
  const box = document.getElementById('startIn');
  if (box) box.innerHTML = '<p class="err"><b>Pulse hit an error.</b><br>' +
    String(e.message || e).replace(/[<>]/g,'') + '<br><span style="opacity:.6">' +
    ((e.filename||'').split('/').pop() + ':' + (e.lineno||'?')) + '</span></p>';
});

/* Two places the data can live in this repo: the shared /data folder the
   other games use, and a sibling copy in this same folder. Try both, so a
   publishing gap in one does not blank the page. */
const DATA_URLS = [
  '../../data/grammar-rules/phrasal-verbs-data.json',
  './phrasal-verbs-data.json'
];
const BPM        = 92;
const BEAT       = 60000 / BPM;        // ms
const FALL_BEATS = 3;                  // beats a card takes to reach the strike line
const GAP_BEATS  = 3;                  // beats between spawns
const ROUND_MS   = 60000;
const FLIP_AT    = 30000;              // the MIX flip: half way, the ground moves
const LANE_COLORS = ['--lane1','--lane2','--lane3','--lane4'];
const KEYS = ['1','2','3','4'];

const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const firstSense = m => String(m).split(';')[0].trim();
const B36 = '0123456789abcdefghijklmnopqrstuvwxyz';

/* ── STATE ── */
let GROUPS = [], MIXPOOL = [], groupIdx = 0;
let running = false, startedAt = 0, rafId = null;
let seq = [], seqAt = 0, live = [], lanes = [], flipped = false;
let score = 0, combo = 0, bestCombo = 0, hits = 0, misses = 0, missLog = [];
let ghost = null;                       // {code, marks:[{t,score}], score}
let checkpoints = [];                   // this run's score every 5s, for the share code
let nextSpawnAt = 0, lastBeat = -1;

/* ── MEMORY: the invisible scheduler ──
   No review screen, no "6 cards due" list — that format is exactly what
   bores a fourteen-year-old. A fumbled particle simply shows up more often
   inside the game they already chose to play. */
const MEM_KEY = 'intuity-pulse-mem';
function loadMem(){ try{ return JSON.parse(localStorage.getItem(MEM_KEY)||'{}'); }catch(e){ return {}; } }
function saveMem(m){ try{ localStorage.setItem(MEM_KEY,JSON.stringify(m)); }catch(e){} }
function memKey(it){ return (it.verb||'') + ' ' + it.particle; }
function noteResult(it, ok){
  const m = loadMem(), k = memKey(it);
  const e = m[k] || {miss:0, seen:0};
  e.seen++;
  if (ok) e.miss = Math.max(0, e.miss - 1); else e.miss++;
  m[k] = e; saveMem(m);
}
function weightOf(it, mem){
  const e = mem[memKey(it)];
  if (!e) return 2;                     // unseen: worth showing
  return 1 + Math.min(6, e.miss * 3);   // fumbled: up to 7× the tickets
}

/* ── AUDIO ── */
let ac = null, master = null, musicOn = true;
function audio(){
  if (!ac){
    ac = new (window.AudioContext||window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = .5; master.connect(ac.destination);
  }
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
function tone(freq, dur, type, vol, when, glide){
  if (!musicOn) return;
  const c = audio(), t0 = when || c.currentTime;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type||'sine'; o.frequency.setValueAtTime(freq,t0);
  if (glide) o.frequency.exponentialRampToValueAtTime(glide, t0+dur);
  g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(vol||.14, t0+.008);
  g.gain.exponentialRampToValueAtTime(.0008, t0+dur);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0+dur+.02);
}
function noise(dur, vol, when){
  if (!musicOn) return;
  const c = audio(), t0 = when || c.currentTime;
  const n = Math.floor(c.sampleRate*dur);
  const buf = c.createBuffer(1,n,c.sampleRate), d = buf.getChannelData(0);
  for (let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
  const s = c.createBufferSource(); s.buffer = buf;
  const g = c.createGain(); g.gain.value = vol||.06;
  const f = c.createBiquadFilter(); f.type='highpass'; f.frequency.value=6000;
  s.connect(f); f.connect(g); g.connect(master); s.start(t0);
}
/* Four layers. Each one is earned, and each one is lost the instant the
   combo breaks — the reward and the punishment are both audible. */
const BASS = [55, 55, 73.42, 65.41];    // A1 A1 D2 E2 — a four-bar loop
const ARP  = [440, 554.37, 659.25, 554.37];
function playBeat(b){
  const t = audio().currentTime;
  tone(58, .11, 'sine', .3, t, 34);                       // kick, always
  if (combo >= 5)  tone(BASS[(b>>1)%4], .3, 'triangle', .1, t);
  if (combo >= 10 && b%1===0) noise(.05, combo>=15?.05:.035, t);
  if (combo >= 15) tone(ARP[b%4]*2, .12, 'square', .035, t);
}
function sfxHit(mult){
  const t = audio().currentTime;
  const base = 523.25 * Math.pow(1.0595, Math.min(12, mult));
  tone(base, .1, 'triangle', .16, t);
  tone(base*1.5, .14, 'triangle', .12, t+.05);
}
function sfxMiss(){ const t=audio().currentTime; tone(180,.22,'sawtooth',.13,t,90); }
function sfxFlip(){ const t=audio().currentTime;
  [261,329,392,523,659].forEach((f,i)=>tone(f,.5,'triangle',.13,t+i*.07)); }

/* ── SEEDED SEQUENCE + SHARE CODE ──
   The code carries the item sequence itself, so a friend gets the identical
   round with no server, no account, and nothing stored about either child. */
function encodeSeq(list){ return list.map(i => B36[i] || '0').join(''); }
function decodeSeq(s){ return [...s].map(c => B36.indexOf(c)).filter(i => i >= 0); }

function buildSequence(){
  const mem = loadMem();
  const g = GROUPS[groupIdx];
  const pick = (pool, n, used) => {
    const out = [];
    const bag = pool.map((it,i)=>({i, w: weightOf(it, mem)}));
    for (let k=0;k<n && bag.length;k++){
      let total = bag.reduce((s,x)=>s+x.w,0), r = Math.random()*total, c = 0, j = 0;
      for (;j<bag.length;j++){ c += bag[j].w; if (r <= c) break; }
      j = Math.min(j, bag.length-1);
      out.push(bag[j].i); bag.splice(j,1);
    }
    return out;
  };
  const a = pick(g.items, 12);
  const b = pick(MIXPOOL, 14);
  return { a, b };
}

/* ── LANES ──
   Four particles from the SAME verb, held in place for the whole phase.
   The distractors are kin, so the round is a discrimination task rather
   than a guess from context. */
function laneSetFor(items, targets){
  const wanted = [...new Set(targets.map(t=>t.particle))];
  const all    = [...new Set(items.map(i=>i.particle))];
  const set = wanted.slice(0,4);
  for (const p of all){ if (set.length>=4) break; if (!set.includes(p)) set.push(p); }
  return set.slice(0,4);
}
function paintLanes(set){
  lanes = set;
  $('lanes').innerHTML = set.map((p,i)=>
    `<button class="lane" data-i="${i}" style="--lc:var(${LANE_COLORS[i]})">
       <span class="p">${esc(p)}</span><span class="k">${KEYS[i]}</span>
     </button>`).join('');
  $('lanes').querySelectorAll('.lane').forEach(el=>{
    el.addEventListener('pointerdown', e=>{ e.preventDefault(); tapLane(+el.dataset.i); });
  });
}

/* ── ROUND ── */
function startRound(fromCode){
  const g = GROUPS[groupIdx];
  let a, b;
  if (fromCode){ a = fromCode.a; b = fromCode.b; }
  else { const s = buildSequence(); a = s.a; b = s.b; }

  const phaseA = a.map(i=>g.items[i]).filter(Boolean).map(it=>({
    verb: (it.verb || g.label || g.id).toUpperCase(),
    particle: it.particle, meaning: firstSense(it.meaning), mix:false
  }));
  const phaseB = b.map(i=>MIXPOOL[i]).filter(Boolean).map(it=>({
    verb: it.verb.toUpperCase(), particle: it.particle, meaning: it.meaning, mix:true
  }));

  seq = phaseA.concat(phaseB);
  seq.idxA = a; seq.idxB = b;
  seqAt = 0; live = []; flipped = false;
  score = 0; combo = 0; bestCombo = 0; hits = 0; misses = 0; missLog = [];
  checkpoints = [];
  $('score').textContent = '0';
  setCombo(0);
  paintLanes(laneSetFor(g.items, phaseA));
  $('field').querySelectorAll('.card').forEach(n=>n.remove());
  $('over').classList.remove('show');
  $('start').classList.add('gone');

  audio();
  running = true; startedAt = performance.now();
  nextSpawnAt = 0; lastBeat = -1;
  rafId = requestAnimationFrame(loop);
  banner('Go', 'var(--accent)');
}

function loop(now){
  if (!running) return;
  const t = now - startedAt;

  // beat clock — drives the music and the strike-line pulse
  const b = Math.floor(t / BEAT);
  if (b !== lastBeat){
    lastBeat = b;
    playBeat(b);
    const s = $('strike'); s.classList.add('beat');
    setTimeout(()=>s.classList.remove('beat'), 90);
  }

  // the flip: the ground moves under them at the halfway mark
  if (!flipped && t >= FLIP_AT){
    flipped = true;
    const upcoming = seq.slice(seqAt, seqAt+8).filter(x=>x.mix);
    if (upcoming.length){
      paintLanes(laneSetFor(MIXPOOL, upcoming));
      sfxFlip(); banner('Mix', 'var(--lane2)');
    }
  }

  // spawn on the beat grid
  if (t >= nextSpawnAt && seqAt < seq.length){
    spawn(seq[seqAt++], t);
    nextSpawnAt = t + GAP_BEATS * BEAT;
  }

  // advance every live card
  const fh = $('field').clientHeight;
  for (let i = live.length - 1; i >= 0; i--){
    const c = live[i];
    const p = (t - c.born) / (FALL_BEATS * BEAT);
    if (c.done){
      c.el.style.transform = `translate(-50%,${(c.restY)}px) scale(.94)`;
      if (t - c.doneAt > 420){ c.el.remove(); live.splice(i,1); }
      continue;
    }
    const y = p * (fh + 40) - 40;
    c.el.style.transform = `translate(-50%,${y}px)`;
    if (p >= 1){ resolveCard(c, null, t); }
  }

  // clock + checkpoints for the ghost trace
  const leftMs = Math.max(0, ROUND_MS - t);
  const secs = Math.ceil(leftMs/1000);
  $('clock').textContent = '0:' + String(secs).padStart(2,'0');
  $('clock').classList.toggle('low', secs <= 10);
  const cp = Math.floor(t/5000);
  if (cp > checkpoints.length - 1 && cp < 12) checkpoints[cp] = score;
  if (ghost) paintGhost(t);

  if (t >= ROUND_MS || (seqAt >= seq.length && live.length === 0)){ finish(); return; }
  rafId = requestAnimationFrame(loop);
}

function spawn(item, t){
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = `<div class="verb">${esc(item.verb)}<span class="slot"></span></div>
                  <div class="def">${esc(item.meaning)}</div>`;
  $('field').appendChild(el);
  live.push({ el, item, born: t, done:false });
}

function tapLane(i){
  if (!running) return;
  const el = $('lanes').querySelectorAll('.lane')[i];
  if (el){ el.classList.add('tap'); setTimeout(()=>el.classList.remove('tap'),110); }
  // the lowest live card is the one being answered
  const open = live.filter(c=>!c.done);
  if (!open.length) return;
  open.sort((a,b)=>b.born - a.born);
  const c = open[open.length-1];
  resolveCard(c, lanes[i], performance.now() - startedAt);
}

function resolveCard(c, chosen, t){
  c.done = true; c.doneAt = t;
  const fh = $('field').clientHeight;
  c.restY = Math.min(fh - 10, ((t - c.born)/(FALL_BEATS*BEAT)) * (fh+40) - 40);
  const ok = chosen === c.item.particle;
  const laneI = lanes.indexOf(c.item.particle);
  const laneEl = $('lanes').querySelectorAll('.lane')[laneI];

  noteResult(c.item, ok);
  if (window.INTUITY) INTUITY.log('phrasal-verbs', c.item.verb+' '+c.item.particle, ok, {game:'pulse'});

  if (ok){
    hits++; combo++; bestCombo = Math.max(bestCombo, combo);
    const mult = 1 + Math.floor(combo/5);
    score += 100 * mult;
    c.el.classList.add('hit');
    c.el.querySelector('.slot').textContent = c.item.particle;
    c.el.querySelector('.slot').style.borderBottom = 'none';
    if (laneEl){ laneEl.classList.add('correct'); setTimeout(()=>laneEl.classList.remove('correct'),240); }
    sfxHit(combo);
    burst(c.el, combo >= 10);
    setCombo(combo);
    if (combo === 5)  { banner('Bass',  'var(--lane1)'); tierNote('bass unlocked'); }
    if (combo === 10) { banner('Drive', 'var(--lane3)'); tierNote('drums unlocked'); }
    if (combo === 15) { banner('Full',  'var(--accent)'); tierNote('full track — hold it'); }
  } else {
    misses++; combo = 0; setCombo(0);
    missLog.push(c.item);
    c.el.classList.add('miss');
    c.el.querySelector('.slot').textContent = c.item.particle;
    c.el.querySelector('.slot').style.borderBottom = 'none';
    /* Correction on the spot: the right lane lights even on a miss, so the
       answer lands somewhere the eye is already looking. */
    if (laneEl){ laneEl.classList.add('correct'); setTimeout(()=>laneEl.classList.remove('correct'),420); }
    if (chosen){
      const wi = lanes.indexOf(chosen), we = $('lanes').querySelectorAll('.lane')[wi];
      if (we){ we.classList.add('wrongtap'); setTimeout(()=>we.classList.remove('wrongtap'),300); }
    }
    sfxMiss();
  }
  $('score').textContent = score;
}

function setCombo(n){
  const el = $('combo');
  const mult = 1 + Math.floor(n/5);
  el.textContent = '×' + mult + (n ? '  ' + n : '');
  el.classList.toggle('live', n >= 5);
  el.classList.add('pop'); setTimeout(()=>el.classList.remove('pop'), 150);
}

function banner(txt, col){
  const b = $('banner');
  b.textContent = txt; b.style.color = col;
  b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
  setTimeout(()=>b.classList.remove('show'), 750);
}
function tierNote(txt){
  const t = $('tier'); t.textContent = txt;
  t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 1600);
}

function burst(cardEl, big){
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const field = $('field'), fr = field.getBoundingClientRect(), r = cardEl.getBoundingClientRect();
  const cx = r.left + r.width/2 - fr.left, cy = r.top + r.height/2 - fr.top;
  const f = document.createElement('div'); f.className='flash';
  f.style.cssText += `left:${cx}px;top:${cy}px;transform:translate(-50%,-50%)`;
  field.appendChild(f);
  f.animate([{transform:'translate(-50%,-50%) scale(.2)',opacity:1},
             {transform:`translate(-50%,-50%) scale(${big?3:2})`,opacity:0}],
            {duration:big?420:300,easing:'cubic-bezier(.1,.8,.2,1)'});
  setTimeout(()=>f.remove(), 440);
  const COLS = ['#FFD94A','#C9A961','#5ED39B','#61b5ed','#ffffff','#c084fc'];
  const n = big ? 26 : 12;
  for (let i=0;i<n;i++){
    const p = document.createElement('div'); p.className='spark';
    const col = COLS[(Math.random()*COLS.length)|0], sz = 3+Math.random()*3;
    p.style.cssText += `left:${cx}px;top:${cy}px;width:${sz}px;height:${sz}px;background:${col};box-shadow:0 0 ${sz*2.5}px ${col}`;
    field.appendChild(p);
    const a = Math.random()*Math.PI*2, d = 40+Math.random()*(big?140:80), dur = 600+Math.random()*350;
    p.animate([
      {transform:'translate(-50%,-50%) scale(1.1)',opacity:1},
      {transform:`translate(-50%,-50%) translate(${Math.cos(a)*d}px,${Math.sin(a)*d+50}px) scale(.2)`,opacity:0}
    ],{duration:dur,easing:'cubic-bezier(.12,.75,.3,1)'});
    setTimeout(()=>p.remove(), dur+30);
  }
}

/* ── GHOST RACER ── */
function paintGhost(t){
  const i = Math.min(11, Math.floor(t/5000));
  const theirs = ghost.marks[i] != null ? ghost.marks[i] : ghost.marks[ghost.marks.length-1] || 0;
  const g = $('ghost'); g.style.display = 'block';
  const d = score - theirs;
  g.className = 'ghost ' + (d < 0 ? 'ahead' : d > 0 ? 'behind' : '');
  g.innerHTML = `${esc(ghost.name)}<br><b>${theirs}</b><br>${d>=0?'+':''}${d}`;
}

/* ── FINISH ── */
function finish(){
  running = false;
  cancelAnimationFrame(rafId);
  live.forEach(c=>c.el.remove()); live = [];
  const total = hits + misses;
  const acc = total ? hits/total : 0;
  const grade = acc>=.9?'Flawless':acc>=.75?'Sharp':acc>=.55?'Getting there':'Back to the set';

  $('ovScore').textContent = score;
  $('ovGrade').textContent = grade + ' · ' + Math.round(acc*100) + '% clean';
  $('ovHit').textContent = hits; $('ovMiss').textContent = misses; $('ovBest').textContent = bestCombo;

  const seen = new Map();
  missLog.forEach(m=>{ const k=m.verb+' '+m.particle; if(!seen.has(k)) seen.set(k,m.meaning); });
  $('ovMissed').innerHTML = seen.size
    ? [...seen].map(([k,m])=>`<div class="mi"><span class="mp">${esc(k)}</span><span class="mm">${esc(m)}</span></div>`).join('')
    : '<div class="mm" style="text-align:center">Nothing missed. These will come back less often.</div>';

  while (checkpoints.length < 12) checkpoints.push(score);
  const code = [
    'PULSE', GROUPS[groupIdx].id.toUpperCase(),
    encodeSeq(seq.idxA) + '.' + encodeSeq(seq.idxB),
    score.toString(36),
    checkpoints.slice(0,12).map(c=>Math.round(c/100).toString(36)).join('')
  ].join('-');
  $('ovCode').textContent = code;
  $('over').classList.add('show');
}

/* ── RACE A FRIEND'S CODE ── */
function applyCode(raw){
  const parts = String(raw).trim().toUpperCase().split('-');
  if (parts.length < 5 || parts[0] !== 'PULSE') return null;
  const gi = GROUPS.findIndex(g => g.id.toUpperCase() === parts[1]);
  if (gi < 0) return null;
  const [sa, sb] = parts[2].toLowerCase().split('.');
  if (!sa || !sb) return null;
  return {
    groupIdx: gi,
    a: decodeSeq(sa), b: decodeSeq(sb),
    score: parseInt(parts[3].toLowerCase(), 36) || 0,
    marks: [...parts[4].toLowerCase()].map(c => (B36.indexOf(c) < 0 ? 0 : B36.indexOf(c) * 100))
  };
}

/* ── TABS ── */
function buildTabs(){
  const mem = loadMem();
  $('verbTabs').innerHTML = GROUPS.map((g,i)=>{
    const due = g.items.some(it => { const e = mem[(it.verb||g.id) + ' ' + it.particle]; return e && e.miss > 0; });
    return `<button class="vtab${i===groupIdx?' active':''}${due?' has-due':''}"
      data-i="${i}" style="--vc:${g.color}">${esc(g.label)}<span class="due"></span></button>`;
  }).join('');
  $('verbTabs').querySelectorAll('.vtab').forEach(b=>{
    b.addEventListener('click', ()=>{
      groupIdx = +b.dataset.i; ghost = null; $('ghost').style.display='none';
      buildTabs(); startRound(null);
    });
  });
}

/* ── INPUT ── */
document.addEventListener('keydown', e=>{
  const i = KEYS.indexOf(e.key);
  if (i >= 0){ e.preventDefault(); tapLane(i); }
  if (e.key === 'm' || e.key === 'M'){ musicOn = !musicOn; tierNote(musicOn?'sound on':'sound off'); }
});
$('againBtn').addEventListener('click', ()=> startRound(ghost ? {a:ghost.a,b:ghost.b} : null));
$('newBtn').addEventListener('click', ()=>{ ghost=null; $('ghost').style.display='none'; startRound(null); });
$('raceBtn').addEventListener('click', ()=>{
  const c = applyCode($('codeIn').value);
  if (!c){ $('codeIn').value=''; $('codeIn').placeholder='that code did not read — check it and paste again'; return; }
  groupIdx = c.groupIdx; buildTabs();
  ghost = { name:'their run', marks:c.marks, score:c.score, a:c.a, b:c.b };
  startRound({a:c.a, b:c.b});
});

/* ── BOOT ── */
function syncHeader(){
  const h = document.querySelector('.header');
  if (h) document.documentElement.style.setProperty('--header-h', h.offsetHeight+'px');
}
window.addEventListener('resize', syncHeader);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(syncHeader);

async function boot(){
  let d = null, tried = [];
  for (const u of DATA_URLS){
    try{
      const res = await fetch(u);
      if (!res.ok) throw new Error('HTTP '+res.status);
      d = await res.json();
      break;
    }catch(e){ tried.push(u + ' → ' + (e.message||e)); }
  }
  if (!d){
    $('startIn').innerHTML = '<p class="err"><b>Could not load the phrasal verb data.</b><br>'+
      tried.map(t=>t.replace(/[<>]/g,'')).join('<br>')+'</p>';
    return;
  }
  GROUPS = (d.groups||[]).filter(g=>!g.mixed);
  (d.groups||[]).filter(g=>g.mixed).forEach(g=>{
    g.items.forEach(it=>{ if (it.verb && it.particle)
      MIXPOOL.push({verb:it.verb, particle:it.particle, meaning:firstSense(it.meaning)}); });
  });
  if (!GROUPS.length){ $('startIn').innerHTML = '<p class="err">No verb sets in the data.</p>'; return; }

  const q = new URLSearchParams(location.search).get('verb');
  const qi = GROUPS.findIndex(g=>g.id===q); if (qi>=0) groupIdx = qi;

  buildTabs(); syncHeader();
  $('startIn').innerHTML = `
    <h1>PULSE</h1>
    <p>A definition drops. Hit the <b>particle</b> that finishes the verb before it reaches the line.</p>
    <p>Five in a row and the bass comes in. Ten and the drums. Fifteen and you get the whole track —
       <b>miss once and it all drops out.</b></p>
    <p style="font-size:.72rem;color:var(--faint)">Sixty seconds. Tap the lanes, or use keys 1–4. M mutes.</p>
    <button class="btn go" id="beginBtn" style="margin-top:.5rem">Start</button>`;
  $('beginBtn').addEventListener('click', ()=>{ audio(); startRound(null); });
}
boot();
</script>
</body>
