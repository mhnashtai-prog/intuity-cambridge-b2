<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FAF7F2">
<title>INTUITY — Phrasal Verbs</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=4">

<style>
/* ═══ WHAT ONLY THIS PAGE OWNS ═══
   This is the phrasal-verbs host: Explore reads in the page, and Practice,
   Quiz, Pegs, Rack and Pairs are framed. Tokens, header, mode row, set tabs,
   the tile family and the sheet treatment come from the shell.

   Three things went with the dark theme:
     · the six emoji in the mode row — the words are the navigation
     · the per-family colour pushed onto :root from the JSON's `color`
       fields, which were chosen to glow on black
     · the hard-coded "calc(100vh - 250px)" the iframe used to guess its
       height with. The frames are shell sheets now and inherit the same
       geometry as every other framed mode in the product.
   ═══════════════════════════════════════════════════════════════════════ */

:root{
  --bar-h:38px;
  --verb-color:var(--accent-ink);
  --verb-rgb:172,90,62;
  --mode-accent:var(--accent-ink);
  --mode-accent-rgb:172,90,62;
}

html,body{width:100%;height:100%;overflow:hidden}
body{user-select:none;-webkit-user-select:none}

/* ── EXPLORE'S OWN CONTROL ROW ───────────────────────────────────────────
   The verb stepper and the WATCH/LIST switch belong to Explore, not to the
   product, so they sit inside Explore rather than in the header. The header
   holds only what is true in every mode. */
.explore-controls{display:flex;align-items:center;justify-content:center;
  flex-wrap:wrap;gap:.6rem 1.1rem;padding:.7rem .75rem .2rem;flex:none}

.verb-step{display:none;align-items:center;gap:.5rem}
.verb-step.show{display:flex}
.verb-step-btn{width:28px;height:28px;border-radius:50%;flex:none;
  display:flex;align-items:center;justify-content:center;
  background:var(--tile-bg);color:var(--tile-ink);border:none;cursor:pointer;
  font-family:var(--f-display);font-size:.9rem;font-weight:700;
  transition:background .15s,transform .1s}
.verb-step-btn:hover:not(:disabled){background:var(--tile-bg-press)}
.verb-step-btn:active:not(:disabled){transform:scale(.92)}
.verb-step-btn:disabled{opacity:.3;cursor:default}
.verb-step-now{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--faint);min-width:8rem;text-align:center}

/* Two states, so it is two buttons rather than a switch with two labels:
   the same shape as every other choice on the page. */
.view-mode-container{display:flex}
.view-mode-container.hidden{display:none}
.toggle-container{display:flex;align-items:center;gap:.25rem;padding:.15rem;
  border-radius:var(--r-chip);background:var(--slot-bg)}
.toggle-label{font-family:var(--f-display);font-size:.6rem;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;color:var(--faint);
  padding:.3rem .8rem;border-radius:var(--r-chip);cursor:pointer;
  transition:background .15s,color .15s}
.toggle-label.active{background:var(--card);color:var(--tile-ink);font-weight:700}
/* the switch itself is gone; the labels are the control */
.toggle-switch{display:none}

/* ── SET TABS ────────────────────────────────────────────────────────── */
#categorySelector{display:none}
#categorySelector.show{display:flex}

/* ── AREAS ───────────────────────────────────────────────────────────────
   Mirrors the shell's .area: fixed under the header, one of them visible. */
.content-area{position:fixed;top:var(--header-h);left:0;right:0;bottom:0;
  overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .22s ease,visibility 0s linear .22s}
.content-area.active{opacity:1;visibility:visible;pointer-events:auto;
  transition:opacity .22s ease,visibility 0s;
  display:flex;flex-direction:column}

/* Framed modes are presented as sheets, exactly as Practice and Quiz are on
   every other topic — same scrim, same radius, same shoulder. */
.content-area.framed{overflow:hidden;z-index:25;background:var(--scrim);
  padding:.9rem .75rem 0}
.content-area.framed.active{align-items:center}
.iframe-container{position:relative;display:flex;flex-direction:column;
  width:100%;max-width:min(94vw,1100px);flex:1;min-height:0;overflow:hidden;
  border-radius:var(--r-sheet) var(--r-sheet) 0 0;background:var(--screen);
  box-shadow:0 -6px 30px rgba(43,33,41,.14)}
.iframe-container iframe{width:100%;height:100%;flex:1;border:none;
  display:block;background:var(--screen)}
@media(min-width:761px){
  .content-area.framed{padding:1.1rem 1.1rem 0}
  .iframe-container{border-radius:var(--r-sheet);
    box-shadow:0 10px 44px rgba(43,33,41,.14)}
}

/* ── EXPLORE · WATCH ─────────────────────────────────────────────────────
   One card, one phrase. It had a rim, a 60px black shadow and a 40px gold
   glow; on cream a white fill and a radius carry it. */
.watch-mode{flex:1;min-height:0;display:flex;padding:.6rem}
.modal-card{position:relative;flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;overflow:hidden;
  width:100%;max-width:min(94vw,1100px);margin:0 auto;padding:2.6rem 2rem 3.4rem;
  border-radius:var(--r-sheet);background:var(--card);border:none;
  box-shadow:0 8px 30px rgba(43,33,41,.08);
  opacity:0;transform:scale(.98);animation:cardAppear .4s ease forwards}
.modal-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:var(--accent)}
@keyframes cardAppear{to{opacity:1;transform:scale(1)}}

.card-content{width:100%;text-align:center;opacity:0;transition:opacity .5s ease}
.card-content.show{opacity:1}

/* The citation form is the one place mono earns its keep: it is a label for
   a form, not a sentence to read. */
.expression{display:inline-block;font-family:var(--f-mono);font-size:.86rem;
  font-weight:500;letter-spacing:.1em;text-transform:uppercase;
  color:var(--tile-ink);background:var(--tile-bg);
  border-radius:var(--r-chip);padding:.45rem 1.1rem;margin-bottom:1.4rem}
.meaning{font-size:1rem;line-height:1.6;color:var(--faint);margin-bottom:2rem}

.sentence-container{margin-bottom:1.4rem}
.sentence-label{font-family:var(--f-mono);font-size:.58rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint);margin-bottom:.9rem}
.sentence{font-family:var(--f-display);font-weight:700;line-height:1.3;
  letter-spacing:-.02em;color:var(--ink)}
/* Same three steps as PV1's .phrase-text, chosen off the same word count, so
   a sentence is the same size in Explore as it is in Quiz. It was one fixed
   clamp capped at 1.9rem — half the size of the identical sentence next
   door, which is what showed up on a projector. */
.sentence.size-small{font-size:clamp(2rem,5vw,3.4rem)}
.sentence.size-medium{font-size:clamp(1.6rem,4vw,2.6rem)}
.sentence.size-large{font-size:clamp(1.25rem,3vw,2rem)}
/* --target is the shell's grammar-signal colour. It was #60a5fa on a blue
   wash here — a hue that appears nowhere else in the product. */
.highlight{color:var(--target);font-weight:900;background:none;padding:0}
.arrow{font-size:1.5rem;color:var(--rule);margin:1rem 0}

.controls{display:flex;gap:.7rem;justify-content:center;margin-top:2rem}
.control-btn{width:44px;height:44px;border-radius:50%;flex:none;
  display:flex;align-items:center;justify-content:center;
  background:var(--tile-bg);color:var(--tile-ink);border:none;cursor:pointer;
  font-family:var(--f-display);font-size:1rem;font-weight:700;
  transition:background .15s,transform .1s}
.control-btn:hover:not(:disabled){background:var(--tile-bg-press)}
.control-btn:active:not(:disabled){transform:scale(.92)}
.control-btn:disabled{opacity:.25;cursor:not-allowed}
.control-btn.play{width:54px;height:54px;background:var(--accent);color:#FFF7F3}
.control-btn.play:hover{background:var(--accent)}

.progress{position:absolute;bottom:1.4rem;left:1.6rem;
  font-family:var(--f-mono);font-size:.78rem;color:var(--faint);
  font-variant-numeric:tabular-nums}
.progress .current{color:var(--paper);font-weight:500}

/* ── EXPLORE · LIST ──────────────────────────────────────────────────── */
.list-mode{display:none}
.list-mode.show{display:block;animation:fadeIn .3s ease forwards}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.list-container{display:flex;flex-direction:column;gap:.8rem;
  width:100%;max-width:min(94vw,1100px);margin:0 auto;padding:.6rem .6rem 2rem}
.list-item{padding:1.4rem 1.5rem;border:none;border-radius:var(--r-sheet);
  background:var(--card);box-shadow:0 4px 18px rgba(43,33,41,.06);
  transition:transform .12s cubic-bezier(.2,.8,.2,1)}
.list-item:hover{transform:translateY(-2px)}
.list-expression{display:inline-block;font-family:var(--f-mono);font-size:.76rem;
  font-weight:500;letter-spacing:.1em;text-transform:uppercase;
  color:var(--tile-ink);background:var(--tile-bg);
  border-radius:var(--r-chip);padding:.35rem .85rem;margin-bottom:.85rem}
.list-meaning{font-size:.92rem;line-height:1.6;color:var(--faint);
  margin-bottom:1rem}
.list-sentences{display:flex;flex-direction:column;gap:1rem}
.list-sentence-row{display:flex;flex-direction:column;gap:.45rem}
.list-sentence-label{font-family:var(--f-mono);font-size:.56rem;
  letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.list-sentence{font-family:var(--f-display);font-weight:700;font-size:1.05rem;
  line-height:1.5;letter-spacing:-.015em;color:var(--ink)}
.list-arrow{font-size:1.1rem;color:var(--rule);text-align:center;margin:.3rem 0}

@media(max-width:600px){
  .watch-mode{padding:.3rem .6rem .9rem}
  .modal-card{padding:1.8rem 1.2rem 3rem}
  .list-container{padding:.3rem .6rem 2rem}
  .list-item{padding:1.2rem 1.1rem}
  .verb-step-now{min-width:6.5rem;font-size:.62rem}
}

/* ── HEADER ADDITIONS ────────────────────────────────────────────────────
   Only what the shell has no opinion about: the per-mode count beside each
   mode name, and the round strip that replaces the verb tabs in Match. */
.mode-badge{font-family:var(--f-mono);font-size:.58rem;font-weight:500;
  margin-left:.4rem;color:var(--faint);font-variant-numeric:tabular-nums;
  transition:color .2s}
.mode-btn.active .mode-badge{color:var(--accent-ink)}

/* The score dot on a verb tab is the student's own history, so it uses the
   shell's ok/wrong pair rather than a fourth and fifth colour. */
.vtab::after{content:'';display:inline-block;width:5px;height:5px;
  border-radius:50%;margin-left:.35rem;vertical-align:middle;opacity:0;
  transition:opacity .3s}
.vtab.score-perfect::after,
.vtab.score-great::after{background:var(--ok);opacity:1}
.vtab.score-ok::after{background:var(--edge);opacity:1}
.vtab.score-poor::after{background:var(--wrong);opacity:1}

.tabs-row{display:flex;align-items:center;justify-content:center;gap:.5rem;
  padding:0 .4rem}
.tabs-row .set-tabs{flex:1;min-width:0}
.rtabs{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;
  gap:.34rem;padding:0 .5rem;max-width:720px;margin:0 auto;flex:1}
.rtab{width:10px;height:10px;border-radius:50%;background:var(--rule);
  border:none;padding:0;cursor:pointer;flex-shrink:0;
  transition:transform .2s,background .2s}
.rtab:hover{background:var(--edge)}
.rtab.active{background:var(--accent);transform:scale(1.45)}
.rtab.perfect{background:var(--ok)}
.rtab.ok{background:var(--edge)}
.rtab.poor{background:var(--wrong)}

.rarrow{flex:none;width:28px;height:28px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--tile-bg);color:var(--tile-ink);border:none;
  font-family:var(--f-display);font-size:.85rem;font-weight:700;
  cursor:pointer;transition:background .15s,transform .1s}
.rarrow:hover:not(:disabled){background:var(--tile-bg-press)}
.rarrow:active:not(:disabled){transform:scale(.92)}
.rarrow:disabled{opacity:.3;cursor:not-allowed}
.rarrow.hidden{display:none}

/* ── STAGE ───────────────────────────────────────────────────────────── */
.stage{position:fixed;top:var(--header-h);left:0;right:0;bottom:var(--bar-h);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:.6rem}

/* ── THE SLIDE CARD ──────────────────────────────────────────────────────
   A card on cream needs no rim, no glow and no 70px black shadow: a white
   fill and a radius are the whole affordance, same as every tile. */
.slide-card{position:relative;width:100%;max-width:min(94vw,1100px);flex:1;
  background:var(--card);border:none;border-radius:var(--r-sheet);
  overflow:hidden;box-shadow:0 8px 30px rgba(43,33,41,.08)}
.slide-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:var(--accent);z-index:5}

.slides-container{position:relative;width:100%;height:calc(100% - 52px);
  overflow:hidden}

.slide{position:absolute;top:0;left:0;width:100%;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:2.4rem 3rem;gap:1.1rem;opacity:0;transform:translateX(60px);
  transition:opacity .42s cubic-bezier(.4,0,.2,1),transform .42s cubic-bezier(.4,0,.2,1);
  pointer-events:none}
.slide.active{opacity:1;transform:translateX(0);pointer-events:auto;z-index:10}
.slide.exit-left{opacity:0;transform:translateX(-60px);pointer-events:none}

.slide-card.match-mode{max-height:none}
.slide-card.match-mode .dot-nav{display:none}
.slide-card.match-mode .slides-container{height:100%}
.slide-card.match-mode .slide{position:relative;top:auto;left:auto;height:auto;
  transform:none;opacity:1;pointer-events:auto}

/* ── THE SENTENCE ────────────────────────────────────────────────────────
   The old poster was uppercase at 900 weight — a shout that also strips the
   capitalisation cues a B2 reader uses to parse a sentence. Sentence case at
   700 reads as language rather than signage; the verb and its particle still
   stand out because they are the only coloured words on the card. */
.phrase-text{font-family:var(--f-display);font-weight:700;line-height:1.3;
  text-align:center;color:var(--ink);letter-spacing:-.02em;width:100%}
.phrase-text.size-small{font-size:clamp(2rem,5vw,3.4rem)}
.phrase-text.size-medium{font-size:clamp(1.6rem,4vw,2.6rem)}
.phrase-text.size-large{font-size:clamp(1.25rem,3vw,2rem)}
.phrase-text .hl,
.phrase-text .verb-word{font-weight:900;color:var(--target)}
.phrase-text .particle{font-weight:900;color:var(--target);
  text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:2px}

.meaning-text{font-size:clamp(.86rem,1.7vw,1rem);line-height:1.65;
  color:var(--faint);text-align:center;max-width:34rem}

/* Informational only: no pointer events, nothing to tap by mistake. */
.item-strip{position:absolute;top:1.2rem;left:1.4rem;right:1.4rem;
  display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;
  gap:.2rem .5rem;pointer-events:none;user-select:none;z-index:4}
.item-strip-verb{font-family:var(--f-display);font-size:.56rem;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;color:var(--faint);
  margin-right:.25rem}
.item-chip{font-size:.58rem;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--rule);white-space:nowrap;
  transition:color .3s}
.item-chip.seen{color:var(--faint)}
.item-chip.current{color:var(--accent-ink);
  border-bottom:1px solid var(--accent-ink);padding-bottom:1px}

/* ── QUIZ ────────────────────────────────────────────────────────────── */
.quiz-blank{display:inline-block;min-width:2.4em;padding:0 .18em;
  border-bottom:2px solid var(--accent);color:var(--accent-ink);
  font-weight:900;text-align:center;transition:color .3s,border-color .3s}
.quiz-blank.revealed{border-bottom-color:transparent}

.quiz-opts{display:flex;flex-wrap:wrap;justify-content:center;gap:.45rem;
  width:100%;max-width:34rem}
/* .qopt is a member of the tile family — same fill, same radius, same press
   as the match chips and the gate picks. It was the odd one out before. */
.qopt{display:inline-flex;align-items:center;justify-content:center;
  min-height:2.2em;padding:0 1em;border:none;border-radius:var(--r-chip);
  background:var(--tile-bg);color:var(--tile-ink);
  font-family:var(--f-display);font-size:.82rem;font-weight:600;
  letter-spacing:-.01em;white-space:nowrap;cursor:pointer;
  transition:transform .1s cubic-bezier(.2,.8,.2,1),background .12s,color .12s}
.qopt:hover:not(.locked){background:var(--tile-bg-press)}
.qopt:active:not(.locked){transform:scale(.95)}
.qopt.locked{cursor:default}
.qopt.correct{background:var(--tile-ok-bg);color:var(--tile-ok-ink);
  animation:optPop .28s ease}
.qopt.wrong{background:var(--tile-no-bg);color:var(--tile-no-ink);
  text-decoration:line-through;animation:optShake .35s ease}
.qopt.reveal{background:var(--tile-ok-bg);color:var(--tile-ok-ink);opacity:.7}
@keyframes optPop{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes optShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}60%{transform:translateX(6px)}}

/* ── PRACTICE (typed particle) ───────────────────────────────────────── */
.gap-blank-marker{color:var(--accent-ink);font-weight:900}
.gap-input-wrap{display:flex;flex-direction:column;align-items:center;gap:.6rem}
/* --typed is the shell token for what the student wrote and nothing else,
   so the input answers to it rather than to the mode accent. */
.gap-input{font-family:var(--f-display);font-size:1.5rem;font-weight:700;
  letter-spacing:.02em;background:transparent;border:none;
  border-bottom:2px solid var(--rule);color:var(--typed);text-align:center;
  width:11rem;outline:none;padding:.35rem 0;caret-color:var(--accent);
  transition:border-color .2s,color .2s}
.gap-input:focus{border-bottom-color:var(--accent)}
.gap-input::placeholder{font-family:var(--f-body);font-size:.86rem;
  font-weight:400;letter-spacing:0;color:var(--faint)}
.gap-input.correct{border-bottom-color:var(--ok);color:var(--ok)}
.gap-input.wrong{border-bottom-color:var(--wrong);color:var(--wrong);
  animation:optShake .35s ease}
.gap-hint{font-size:.76rem;font-weight:500;letter-spacing:.04em;
  color:var(--faint);min-height:1.2rem;text-align:center}
.gap-hint.show-answer{color:var(--ok);font-weight:600}

/* ── FEEDBACK BAR ────────────────────────────────────────────────────── */
.fb-bar{position:absolute;bottom:52px;left:0;right:0;height:0;overflow:hidden;
  display:flex;align-items:center;gap:.55rem;padding:0 1.2rem;
  font-size:.86rem;color:var(--paper);border-top:none;
  transition:height .22s cubic-bezier(.22,1,.36,1)}
.fb-bar.show{height:40px;border-top:1px solid var(--rule)}
.fb-icon{font-size:.9rem;flex-shrink:0}
.fb-text strong{color:var(--ink);font-weight:700}

.section-label{position:absolute;top:.8rem;left:50%;transform:translateX(-50%);
  font-family:var(--f-mono);font-size:.56rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint);opacity:0;
  transition:opacity .3s;pointer-events:none;white-space:nowrap;z-index:20}
.section-label.visible{opacity:1}

.hold-hint{position:absolute;bottom:3.6rem;left:50%;transform:translateX(-50%);
  font-size:.55rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--rule);pointer-events:none;transition:opacity .8s;
  white-space:nowrap;z-index:5}
.hold-hint.hidden{opacity:0}

/* ── NAV ─────────────────────────────────────────────────────────────── */
.nav-arrows{position:absolute;top:50%;left:0;right:0;transform:translateY(-50%);
  display:flex;justify-content:space-between;padding:0 .6rem;
  pointer-events:none;z-index:20}
.arrow-btn{pointer-events:all;width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--tile-bg);color:var(--tile-ink);border:none;
  font-family:var(--f-display);font-size:1rem;font-weight:700;cursor:pointer;
  transition:background .15s,transform .1s}
.arrow-btn:hover:not(:disabled){background:var(--tile-bg-press)}
.arrow-btn:active:not(:disabled){transform:scale(.92)}
.arrow-btn:disabled{opacity:.25;cursor:not-allowed}

.dot-nav{height:52px;display:flex;align-items:center;justify-content:center;
  flex-wrap:wrap;gap:.5rem;padding:0 1rem;border-top:1px solid var(--rule)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--rule);border:none;
  cursor:pointer;flex-shrink:0;transition:transform .3s,background .3s}
.dot.active{background:var(--accent);transform:scale(1.45)}
.dot.ok{background:var(--ok)}
.dot.err{background:var(--wrong)}
.dot:hover:not(.active){background:var(--edge)}

/* ── BOTTOM BAR ──────────────────────────────────────────────────────── */
.bottom-bar{position:fixed;bottom:0;left:0;right:0;min-height:var(--bar-h);
  padding:.35rem 1rem calc(env(safe-area-inset-bottom,0px) + .35rem);
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
  background:var(--screen);border-top:1px solid var(--rule);z-index:20}
.score-row{display:flex;align-items:center;gap:.8rem;flex-shrink:0}
.score-item{display:flex;align-items:center;gap:.35rem;font-size:.72rem;
  font-weight:700;color:var(--faint)}
.score-dot{width:7px;height:7px;border-radius:50%}
.score-dot.ok{background:var(--ok)}
.score-dot.bad{background:var(--wrong)}
.score-num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;
  color:var(--paper)}

.check-btn{display:none;font-family:var(--f-display);font-size:.72rem;
  font-weight:700;letter-spacing:.02em;padding:.5rem 1.4rem;
  border:none;border-radius:var(--r-chip);
  background:var(--accent);color:#FFF7F3;cursor:pointer;
  transition:transform .1s cubic-bezier(.2,.8,.2,1),opacity .15s}
.check-btn:active{transform:scale(.95)}
.check-btn:disabled{opacity:.35;cursor:not-allowed}

.auto-row{display:flex;align-items:center;gap:.5rem;cursor:pointer;flex-shrink:0}
.auto-label{font-family:var(--f-display);font-size:.58rem;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--faint);
  transition:color .3s}
.auto-row.on .auto-label{color:var(--accent-ink)}
.switch{width:36px;height:20px;border-radius:999px;background:var(--slot-bg);
  border:none;position:relative;transition:background .3s}
.auto-row.on .switch{background:var(--accent)}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;
  border-radius:50%;background:var(--card);
  transition:transform .3s}
.auto-row.on .switch::after{transform:translateX(16px)}

.progress{position:fixed;bottom:var(--bar-h);left:0;right:0;height:2px;
  background:transparent;z-index:50}
.progress-fill{height:100%;width:0%;background:var(--accent)}

/* ── THE ENTRY GATE ──
   Ported from Word Forge / Pegs (.pend / .pend-dial): one pendulum, mounted
   once, that swings continuously from "Loading…" through to a Start button.
   This page used to fade a plain pulsing dot straight into Quiz mode the
   instant the data arrived — no pendulum, no instruction, no moment where
   the learner actually chose to begin. Fixed the same way as Pegs: the page
   still initialises itself completely as soon as the data is ready (tabs
   built, first mode painted) — that work doesn't change at all — but the
   RESULT stays hidden behind this gate until Start is tapped. Tapping a
   verb tab or a mode button while the gate is up still works exactly as it
   always did (switchVerb/setMode run normally); it's simply not visible
   until the gate lifts, which is harmless and means no other function in
   this file needed to change.

   THE HANDOFF. Phase one (fetching) covers the full screen, header
   included — there's nothing to choose yet. The instant buildTabs() has
   run, the SAME element (never re-created, so the pendulum never restarts)
   slides its top down to var(--header-h): the header and its now-populated
   verb tabs are revealed above it, and the gate itself narrows to just the
   stage below, which is exactly the Forge/Pegs relationship between the
   band and the arena. */
.loading-screen{position:fixed;inset:0;z-index:999;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:.15rem;
  background:var(--screen);text-align:center;padding:2rem 1.5rem;
  transition:opacity .3s,top .3s ease}
.loading-screen.ready{top:var(--header-h)}
.loading-screen.fade{opacity:0;pointer-events:none}

.loading-screen .pend{
  position:relative;width:104px;height:104px;margin:0 auto .95rem;
  transform-origin:50% -40px;animation:pendSwing 2.7s ease-in-out infinite}
.loading-screen .pend::before{
  content:'';position:absolute;left:50%;top:-40px;width:2px;height:40px;
  border-left:1.5px solid var(--rule);transform:translateX(-50%)}
.loading-screen .pend::after{
  content:'';position:absolute;left:50%;top:-43px;width:7px;height:7px;
  border-radius:50%;background:var(--rule);transform:translateX(-50%)}
.loading-screen .pend-dial{
  position:relative;width:100%;height:100%;border-radius:50%;
  background:linear-gradient(145deg,#FFFFFF,var(--screen));
  box-shadow:5px 5px 13px rgba(43,33,41,.2);
  display:flex;align-items:center;justify-content:center}
.loading-screen .pend-dial::before{
  content:'';position:absolute;inset:0;border-radius:50%;background:var(--accent)}
.loading-screen .pend-dial::after{
  content:'';position:absolute;inset:8.5%;border-radius:50%;background:var(--ink)}
.loading-screen .pend-dial span{
  position:relative;z-index:2;font-family:var(--f-display);
  font-weight:900;font-size:1rem;color:#E5D1B8}
@keyframes pendSwing{0%,100%{transform:rotate(-11deg)}50%{transform:rotate(11deg)}}
@media(prefers-reduced-motion:reduce){.loading-screen .pend{animation:none}}

.loading-screen .gate-loading{font-size:.86rem;color:var(--faint)}
.loading-screen .idle-kicker{
  font-family:var(--f-mono);font-size:.62rem;letter-spacing:.2em;
  text-transform:uppercase;color:var(--faint);margin-bottom:.5rem}
.loading-screen .idle-msg{
  font-family:var(--f-display);font-weight:700;
  font-size:clamp(1rem,3.8vw,1.3rem);line-height:1.35;color:var(--ink);
  max-width:22rem}
.loading-screen .idle-sub{
  margin-top:.55rem;font-size:.82rem;color:var(--dim);max-width:21rem;
  line-height:1.55}
.loading-screen .idle-go{margin-top:1.2rem}

@media(max-width:600px){
  .stage{padding:.35rem}
  .slide{padding:1.8rem 1.4rem}
  .match-slide{padding:1.1rem .9rem .5rem}
  .match-chip{font-size:.86rem}
  .match-meaning{font-size:.98rem}
  .match-blank{font-size:.88rem}
  .qopt{font-size:.8rem;padding:0 .85em}
  .bottom-bar{flex-wrap:wrap;gap:.5rem}
  .rarrow{width:26px;height:26px}
}

/* ── RESULTS ─────────────────────────────────────────────────────────────
   The old overlay was rgba(8,8,8,.97) with a 28px blur — the near-black
   surface the shell exists to remove. It is the page's own colour now, so
   finishing a set reads as the page stepping back, not as another app. */
.overlay{position:fixed;inset:0;z-index:200;background:var(--scrim);
  display:flex;align-items:center;justify-content:center;overflow-y:auto;
  opacity:0;pointer-events:none;transition:opacity .35s}
.overlay.show{opacity:1;pointer-events:all}
.ov-inner{position:relative;z-index:1;display:flex;flex-direction:column;
  align-items:center;gap:.7rem;width:100%;max-width:27rem;
  padding:1.7rem 1.4rem 2rem;border-radius:var(--r-sheet);background:var(--card);
  box-shadow:0 20px 55px rgba(43,33,41,.14);
  animation:sheetIn .28s cubic-bezier(.2,1,.4,1) both}
.ov-perfect{display:none;font-family:var(--f-display);font-size:.6rem;
  font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:var(--accent-ink);background:var(--tile-bg);
  border-radius:var(--r-chip);padding:.35rem 1rem}
.ov-perfect.show{display:block}
.ov-title{font-family:var(--f-display);font-size:clamp(2.4rem,10vw,3.6rem);
  font-weight:900;letter-spacing:-.03em;color:var(--ink);line-height:1}
.overlay.show .ov-title{animation:popIn .45s cubic-bezier(.34,1.56,.64,1) both}
@keyframes popIn{0%{transform:scale(.8);opacity:0}70%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
.ov-score{font-family:var(--f-mono);font-size:.92rem;color:var(--faint)}
.ov-stars{display:flex;gap:6px;font-size:26px;color:var(--accent)}
.ov-star{opacity:0}
@keyframes starPop{0%{transform:scale(0) rotate(-20deg);opacity:0}70%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
.overlay.show .ov-star:nth-child(1){animation:starPop .4s cubic-bezier(.34,1.56,.64,1) .15s forwards}
.overlay.show .ov-star:nth-child(2){animation:starPop .4s cubic-bezier(.34,1.56,.64,1) .3s forwards}
.overlay.show .ov-star:nth-child(3){animation:starPop .4s cubic-bezier(.34,1.56,.64,1) .45s forwards}
.ov-bars{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;max-width:19rem}
.ov-bar{flex:1;min-width:14px;max-width:26px;height:32px;border-radius:5px}
.ov-msg{max-width:20rem;text-align:center;font-size:.84rem;line-height:1.6;
  color:var(--faint)}
.ov-answers{width:100%;max-height:13rem;overflow-y:auto;padding:.3rem;
  border-radius:var(--r-sheet);background:var(--screen);
  scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
.ov-answers::-webkit-scrollbar{width:4px}
.ov-answers::-webkit-scrollbar-thumb{background:var(--rule);border-radius:4px}
.ov-answer-item{display:flex;align-items:center;justify-content:space-between;
  gap:.5rem;padding:.45rem .7rem;margin-bottom:.22rem;
  border-radius:var(--r-chip);opacity:0;transform:translateX(-8px);
  animation:slideInA .35s ease forwards}
.ov-answer-item:last-child{margin-bottom:0}
@keyframes slideInA{to{opacity:1;transform:translateX(0)}}
.ov-answer-item.ok{background:var(--tile-ok-bg)}
.ov-answer-item.err{background:var(--tile-no-bg)}
.ov-answer-verb{font-family:var(--f-display);font-size:.72rem;font-weight:700;
  letter-spacing:.02em}
.ov-answer-item.ok .ov-answer-verb{color:var(--tile-ok-ink)}
.ov-answer-item.err .ov-answer-verb{color:var(--tile-no-ink)}
.ov-answer-meaning{max-width:56%;text-align:right;font-size:.7rem;
  line-height:1.4;color:var(--dim)}
.ov-answer-given{max-width:56%;text-align:right;font-family:var(--f-mono);
  font-size:.64rem;color:var(--wrong)}
.ov-answer-tick{font-size:.8rem;color:var(--dim)}
.ov-btns{display:flex;gap:.6rem;margin-top:.3rem}
.ov-btn{font-family:var(--f-display);font-size:.72rem;font-weight:700;
  letter-spacing:.02em;padding:.7rem 1.5rem;border:none;
  border-radius:var(--r-chip);cursor:pointer;
  transition:transform .1s cubic-bezier(.2,.8,.2,1),background .15s}
.ov-btn:active{transform:scale(.95)}
.ov-btn.primary{background:var(--accent);color:#FFF7F3}
.ov-btn.ghost{background:var(--tile-bg);color:var(--tile-ink)}
.ov-btn.ghost:hover{background:var(--tile-bg-press)}

.award-popup{position:fixed;inset:0;z-index:300;display:flex;
  align-items:center;justify-content:center;pointer-events:none;opacity:0;
  transition:opacity .3s}
.award-popup.show{opacity:1}
.award-inner{font-size:clamp(70px,20vw,140px);line-height:1}
@keyframes zoomFade{0%{transform:scale(.4);opacity:0}40%{transform:scale(1.1);opacity:1}70%{transform:scale(1);opacity:1}100%{transform:scale(1.2);opacity:0}}
.award-popup.show .award-inner{animation:zoomFade 2s cubic-bezier(.22,1,.36,1) forwards}

.streak-flash{position:fixed;top:calc(var(--header-h) + 8px);left:50%;
  transform:translateX(-50%);z-index:100;pointer-events:none;
  font-family:var(--f-display);font-size:.7rem;font-weight:700;
  letter-spacing:.04em;color:var(--tile-ink);background:var(--tile-bg);
  border-radius:var(--r-chip);padding:.42rem 1.1rem;white-space:nowrap;
  opacity:0;transition:opacity .3s;
  box-shadow:0 6px 18px rgba(43,33,41,.12)}
.streak-flash.show{opacity:1}

/* ── MATCH ───────────────────────────────────────────────────────────────
   Bank chips are tiles, the blanks are slots. That is the whole vocabulary:
   a hollow reads as deeper than a tile, which is the only cue left once the
   rim and the inset shadow are gone. */
.match-slide{padding:1rem 1.3rem .6rem;gap:0;align-items:stretch}
.match-bank{display:flex;flex-wrap:wrap;justify-content:center;gap:.35rem .4rem;
  padding-bottom:.7rem;margin-bottom:.7rem;border-bottom:1px solid var(--rule);
  flex-shrink:0}
.match-chip{display:inline-flex;align-items:center;justify-content:center;
  min-height:2.2em;padding:0 .95em;border:none;border-radius:var(--r-chip);
  background:var(--tile-bg);color:var(--tile-ink);
  font-family:var(--f-display);font-size:.8rem;font-weight:600;
  letter-spacing:-.01em;white-space:nowrap;cursor:pointer;
  transition:transform .1s cubic-bezier(.2,.8,.2,1),background .12s,opacity .12s}
.match-chip:hover:not(.used):not(.selected){background:var(--tile-bg-press)}
.match-chip:active:not(.used){transform:scale(.95)}
.match-chip.selected{background:var(--accent);color:#FFF7F3}
.match-chip.used{opacity:.35;text-decoration:line-through;cursor:default;
  background:var(--slot-bg);color:var(--faint)}
.match-chip.wrong-shake{animation:optShake .35s ease}

.match-rows{display:flex;flex-direction:column;gap:.3rem}
.match-row{display:flex;align-items:flex-start;gap:.7rem;padding:.28rem .4rem;
  border-radius:.7rem}
.match-row:nth-child(even){background:rgba(43,33,41,.025)}
.match-row.wrong-flash{background:var(--tile-no-bg)}
.match-row-num{flex:none;width:1.6em;height:1.6em;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--f-mono);font-size:.72rem;font-weight:500;
  background:var(--slot-bg);color:var(--dim)}
.match-row-num.filled{background:var(--tile-bg);color:var(--tile-ink);font-weight:600}
.match-meaning{flex:1;padding-top:.12rem;font-size:.9rem;line-height:1.5;
  color:var(--sentence)}
.match-blank{display:inline-flex;flex-direction:column;align-items:center;
  justify-content:center;min-width:4.2em;min-height:1.9em;padding:.1rem .8em;
  vertical-align:middle;border:none;border-radius:var(--r-chip);
  background:var(--slot-bg);color:var(--dim);
  font-family:var(--f-display);font-size:.8rem;font-weight:600;
  cursor:pointer;transition:background .15s,color .15s}
.match-blank:hover:not(.filled){background:var(--tile-bg-press)}
.match-blank.filled{background:var(--tile-bg);color:var(--tile-ink);
  font-weight:700;cursor:default}
.match-blank .particle{font-weight:900;text-decoration:underline;
  text-underline-offset:3px}
.match-blank.result-ok{background:var(--tile-ok-bg);color:var(--tile-ok-ink)}
.match-blank.result-err{background:var(--tile-no-bg);color:var(--tile-no-ink)}
.match-blank .reveal-answer{display:block;font-family:var(--f-mono);
  font-size:.6rem;font-weight:500;letter-spacing:.02em;
  color:var(--tile-ok-ink);text-decoration:none;margin-top:.05rem}

.match-round-label{position:absolute;top:.8rem;right:1rem;z-index:6;
  font-family:var(--f-mono);font-size:.56rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--faint);pointer-events:none}

/* Match is the one mode taller than the screen, so the page scrolls under a
   fixed header instead of the card scrolling inside a fixed page. */
html.match-scroll,body.match-scroll{overflow-y:auto;height:auto}
body.match-scroll .stage{position:relative;top:auto;bottom:auto;height:auto;
  min-height:calc(100vh - var(--header-h) - var(--bar-h));
  padding:.4rem 1rem 1rem;margin-top:var(--header-h);margin-bottom:var(--bar-h)}
body.match-scroll .slide-card.match-mode{height:auto;max-height:none}
body.match-scroll .slides-container{height:auto;overflow:visible}
</style>
</head>
<body>

<div class="loading-screen" id="loadingScreen">
  <div class="pend" aria-hidden="true"><div class="pend-dial"><span>?</span></div></div>
  <div class="gate-loading" id="gateLoading">Loading…</div>
  <div id="gateReady" style="display:none">
    <div class="idle-kicker">Phrasal Verbs</div>
    <div class="idle-msg" id="idleMsg">Pick a verb above, then press Start</div>
    <div class="idle-sub">You can switch verbs any time before you begin.</div>
    <button class="ov-btn primary idle-go" id="idleStart">Start</button>
  </div>
</div>

<header class="header">
  <div class="header-top">
    <a class="back-link" href="/?openModal=grammar" target="_top">← Grammar</a>
    <div class="header-title">
      <div class="app-title">INTUITY</div>
      <div class="app-subtitle">B2 First Phrasal Verbs</div>
    </div>
    <span class="header-spacer">Level <b>B2–C1</b></span>
  </div>

  <!-- The words are the navigation. The seven emoji that used to sit here
       were the loudest thing on the page and said nothing the word beside
       them did not already say; the count stays, because "3/8" is the one
       piece of information a student cannot read off the label. -->
  <div class="mode-selector">
    <button class="mode-btn" data-mode="learn">Learn<span class="mode-badge" id="badge-learn">–</span></button>
    <button class="mode-btn active" data-mode="quiz">Quiz<span class="mode-badge" id="badge-quiz">–</span></button>
    <button class="mode-btn" data-mode="gap">Practice<span class="mode-badge" id="badge-gap">–</span></button>
    <button class="mode-btn" data-mode="match">Match<span class="mode-badge" id="badge-match">–</span></button>
    <button class="mode-btn" data-href="phrasal-verbs-pulse.html">Pulse<span class="mode-badge">1m</span></button>
    <button class="mode-btn" data-href="phrasal-verbs-game.html?standalone=1">Stars<span class="mode-badge">2m</span></button>
    <button class="mode-btn" data-href="phrasal-verbs-game-burrow.html">Burrow<span class="mode-badge">2m</span></button>
  </div>

  <div class="tabs-row" id="tabsRow">
    <button class="rarrow hidden" id="roundPrev" aria-label="Previous round">←</button>
    <div class="set-tabs" id="verbTabs"></div>
    <button class="rarrow hidden" id="roundNext" aria-label="Next round">→</button>

</header>

<div class="stage" id="stage">
  <div class="slide-card" id="slideCard">
    <div class="section-label" id="sectionLabel"></div>
    <div class="slides-container" id="slidesContainer"></div>

      <button class="arrow-btn" id="prevBtn">←</button>

</div>

<div class="bottom-bar">

    <div class="score-item"><div class="score-dot ok"></div><span class="score-num" id="scoreOk">0</span></div>
    <div class="score-item"><div class="score-dot bad"></div><span class="score-num" id="scoreErr">0</span></div>
  </div>
  <button class="check-btn" id="checkBtn" onclick="handleCheck()">Check</button>
  <div class="auto-row" id="autoRow">
    <span class="auto-label">Auto</span>
    <div class="switch"></div>
  </div>
</div>

<!-- RESULTS OVERLAY -->
<div class="overlay" id="overlay">
  <canvas id="confettiCanvas" style="position:fixed;inset:0;pointer-events:none;z-index:0;"></canvas>
  <div class="ov-inner">
    <div class="ov-perfect" id="ovPerfect">✦ Perfect Score ✦</div>
    <div class="ov-title" id="ovTitle">Done</div>
    <div class="ov-score" id="ovScore"></div>

    <div class="ov-answers" id="ovAnswers"></div>

      <button class="ov-btn primary" onclick="restart()">↺ Retry</button>

    </div>
