<!-- Award popup for perfect score -->
<div class="award-popup" id="awardPopup">
  <div class="award-inner">🏆</div>
</div>

<div class="streak-flash" id="streakFlash"></div>

<script>
const DATA_URL = '../../data/grammar-rules/phrasal-verbs-data.json';
const GAME_DATA_URL = '../../data/grammar-rules/phrasal-verbs-data.json';
const AUTO_MS  = 5500;

/* ── carrying state across pages ──
   Hunt is a separate file, not a panel inside this single-page app, so
   the round trip only works if both sides read/write the same query
   params: `?mode=` and `?verb=`. Landing here from Hunt's mode-selector
   (or a browser refresh) restores whichever mode/verb sent you here. */
const urlParams = new URLSearchParams(location.search);

/* ── STATE ── */
let verbs     = [];          // all verb groups from JSON
let verbIdx   = 0;           // active verb index
let slides    = [];          // built slide list for active verb + mode
let current   = 0;
let prev      = -1;
let mode      = 'quiz';      // opens in Quiz mode — more engaging on first visit
let autoOn    = false;
let autoTimer = null;
let xray      = false;
let xrayDone  = false;
let longTimer = null;
let busy      = false;
let results   = {};          // key: `verbIdx_itemIndex` → 'ok'|'err'
let scoreOk   = 0;
let scoreErr  = 0;
let streak    = 0;
let answered  = false;
let gapChecked = false;
let reviewMode = false;

/* ── THE GATE ──
   started stays false from first paint until the learner taps Start on the
   gate. Nothing else in this file checks it or branches on it — the page
   builds itself exactly as it always did, the gate just sits on top of the
   result until dismissed. See the CSS note by .loading-screen for why. */
let started = false;

/* ── HELPERS ──
   Every slide in a set is built into the DOM at once by paint(), and
   renderQuiz/renderGap give each slide's blank/input/feedback elements the
   same id ("blankSpan", "gapInput", "fbBar" …). getElementById only ever
   returns the FIRST match in the document, so any lookup by that id always
   hit slide 0's copy — meaning the reveal, the feedback banner, and the
   1/2/3/4 keyboard shortcuts silently acted on a hidden slide for anyone
   not currently on the first item. Scoping every lookup to the one slide
   carrying .active fixes all of that at once. */
function activeSlideEl(){ return document.querySelector('.slide.active'); }
function esc(t){ return String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ── LOCAL PERSISTENCE ──
   Everything a student has answered — and, critically, what they actually
   typed or picked — lives here, keyed per verb and per mode so Quiz and
   Practice keep independent progress the way their separate badges already
   imply. Guarded throughout: private browsing, a blocked iframe, or a full
   storage quota must fail silently rather than break the page. */
const LS_KEY = 'intuity-pv-results';
function loadStore(){
  try { return JSON.parse(localStorage.getItem(LS_KEY) || '{}'); } catch(e){ return {}; }
}
function saveStore(all){
  try { localStorage.setItem(LS_KEY, JSON.stringify(all)); } catch(e){ /* ignore */ }
}
function storeSlot(vIdx, m){ return (verbs[vIdx] ? verbs[vIdx].id : vIdx) + ':' + m; }
function persistResults(){
  const all = loadStore();
  all[storeSlot(verbIdx, mode)] = results;
  saveStore(all);
}
function restoreResults(){
  const all = loadStore();
  results = all[storeSlot(verbIdx, mode)] || {};
}
function clearStoredResults(){
  const all = loadStore();
  delete all[storeSlot(verbIdx, mode)];
  saveStore(all);
}
 
/* ── MATCH MODE STATE ── */
let gameRounds  = [];
let gameLoaded  = false;
let roundIdx    = 0;
let roundResults = {};   // roundIdx -> 'perfect'
let matchSelectedId = null;   // id of the currently-selected chip in this round
let matchAnswers = {};        // slotId -> chipId placed there (this round, pre-check)
let matchChecked = false;     // has this round been checked/scored

/* ── THE GATE ──
   Updates the gate's message to name whichever verb is currently selected —
   called once right before the gate is revealed, and again from switchVerb()
   below whenever the learner changes verb while the gate is still up. A
   no-op once started is true, since the gate no longer has anything left to
   say by then. */
function paintGate(){
  if (started) return;
  const el = document.getElementById('idleMsg');
  if (!el) return;
  const label = verbs[verbIdx] ? verbs[verbIdx].label : null;
  el.textContent = label ? ('Ready to start with ' + label) : 'Pick a verb above, then press Start';
}

/* ── LOAD ── */
async function loadAll() {
  let data;
  try {
    const res = await fetch(DATA_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    data = await res.json();
  } catch (e) {
    /* Previously an unguarded fetch: a failed load left the spinner
       running forever with nothing to tell the student what happened.
       The pendulum stays put; only the loading text becomes the error, the
       same pattern as every other game's gate. */
    document.getElementById('gateReady').style.display = 'none';
    document.getElementById('gateLoading').innerHTML =
      '<p style="max-width:22rem;color:var(--wrong);line-height:1.7">' +
      'Could not load the phrasal verb data.<br>' +
      '<span style="color:var(--faint);font-size:.85rem">Check the connection and reload the page.</span></p>';
    return;
  }
  /* `groups` is the exercise-group list; the reference list of which
     particles each verb takes is `data.verbs`, a different thing. */
  verbs = data.groups;

  /* Arriving from Hunt (or a refresh) can specify which verb and mode to
     open on — read them before anything else builds off verbIdx/mode. */
  const qVerb = urlParams.get('verb');
  const qMode = urlParams.get('mode');
  if (qVerb) {
    const idx = verbs.findIndex(v => v.id === qVerb);
    if (idx >= 0) verbIdx = idx;
  }
  const initialMode = (qMode && ['learn', 'quiz', 'gap', 'match'].includes(qMode)) ? qMode : mode;
 
  buildTabs();
  applyVerbTheme();
  syncHeaderHeight();

  /* The page still fully builds itself here, exactly as before — Quiz mode
     for the first (or requested) verb is rendered right now. It's just
     hidden behind the gate until Start is tapped, so nothing downstream of
     this line needed to change. */
  await setMode(initialMode);

  /* Hand the pendulum off from "Loading…" to "ready" without ever
     recreating it: the element's top slides from 0 to var(--header-h),
     revealing the header and the now-built verb tabs above it, and the
     text/button beneath the SAME swinging dial change to match. */
  const ls = document.getElementById('loadingScreen');
  ls.classList.add('ready');
  document.getElementById('gateLoading').style.display = 'none';
  document.getElementById('gateReady').style.display = 'block';
  paintGate();
}

document.getElementById('idleStart').addEventListener('click', () => {
  if (started) return;
  started = true;
  const ls = document.getElementById('loadingScreen');
  ls.classList.add('fade');
  setTimeout(() => { ls.style.display = 'none'; }, 320);
});

/* ── STABLE ITEM KEY ── (index-based, not particle text — avoids collisions
   when two items in the same group share a particle, which is normal in a
   MIX group, and survives shuffles) */
function itemKey(vIdx, item) {
  return vIdx + '_' + verbs[vIdx].items.indexOf(item);
}

/* ── THE VERB FOR ONE ITEM ──
   Single-verb tabs take the verb from the group. Items in a MIX group carry
   their own `verb`, and any item needing an inflected form carries `form`,
   which wins over both. Everything that names the verb of a specific item
   goes through here. */
function verbOf(item) {
  return (item && (item.form || item.verb)) || verbs[verbIdx].id;
}

/* The citation form — base verb, no inflection. Used in summaries and labels
   where "COME ACROSS" reads better than "CAME ACROSS". */
function baseVerbOf(item) {
  return (item && item.verb) || verbs[verbIdx].id;
}

/* ── TABS ── */
function buildTabs() {
  const wrap = document.getElementById('verbTabs');
  wrap.innerHTML = '';
  verbs.forEach((v, i) => {
    const btn = document.createElement('button');
    btn.className = 'vtab' + (i === verbIdx ? ' active' : '');
    btn.textContent = v.label;
    btn.addEventListener('click', e => { e.stopPropagation(); switchVerb(i); });
    wrap.appendChild(btn);
  });
}

/* The verb families still exist — they are the tabs — but they no longer
   repaint the page. See the note at the top of the stylesheet: identity is
   carried by the tab, signal by the one accent. Kept as a no-op rather than
   deleted so the call sites read the same as every other page's. */
function applyVerbTheme() {}

function switchVerb(i) {
  verbIdx = i;
  current = 0; prev = -1; answered = false; gapChecked = false;
  reviewMode = false; streak = 0;
  restoreResults(); recalcScore();
  document.querySelectorAll('.vtab').forEach((b, j) => b.classList.toggle('active', j === i));
  applyVerbTheme();
  syncHeaderHeight();
  build(); paint(); show(0, 'none'); resetAuto();
  updateCheckBtn(); updateModeBadges();
  /* While the gate is still up, this rebuild happened out of sight — keep
     the gate's own message in step with whichever verb is now selected. */
  paintGate();
}
 
function syncHeaderHeight(){
  const h = document.querySelector('.header');
  if (!h) return;
  document.documentElement.style.setProperty('--header-h', h.offsetHeight + 'px');
}
window.addEventListener('resize', syncHeaderHeight);
 
/* ── BUILD ── */
function build() {
  const verb = verbs[verbIdx];
  slides = [];
  if (mode === 'learn') {
    verb.items.forEach((item, idx) => slides.push({ type: 'learn', idx, item }));
  } else if (mode === 'quiz') {
    shuffled(verb.items).forEach((item, idx) => slides.push({ type: 'quiz', idx, item }));
  } else {
    shuffled(verb.items).forEach((item, idx) => slides.push({ type: 'gap', idx, item }));
  }
  current = 0; prev = -1; answered = false; gapChecked = false;
}

/* ── PAINT DOM ── */
function paint() {
  const container = document.getElementById('slidesContainer');
  const dotNav    = document.getElementById('dotNav');

  container.innerHTML = slides.map((s, i) => {
    return `<div class="slide" data-idx="${i}">${renderSlideInner(s)}</div>`;
  }).join('');

  dotNav.innerHTML = slides.map((s, i) => {
    const key = itemKey(verbIdx, s.item);
    const r = results[key];
    let cls = 'dot';
    if (r && r.ok)  cls += ' ok';
    if (r && !r.ok) cls += ' err';
    return `<div class="${cls}" data-dot="${i}"></div>`;
  }).join('');

  dotNav.querySelectorAll('.dot').forEach(d =>
    d.addEventListener('click', e => { e.stopPropagation(); jump(+d.dataset.dot); })
  );

  attachLearnMaskHandlers();
}

function renderSlideInner(s) {
  const { item } = s;
  if (s.type === 'learn') {
    return renderLearn(item);
  } else if (s.type === 'quiz') {
    return renderQuiz(item);
  } else {
    return renderGap(item);
  }
}

/* ── LEARN ── */
function renderLearn(item) {
  const particleWord = item.particle;
  const verbWord = verbOf(item);
  const posterHtml = item.example
    .replace('_____', `<span class="verb-word">${verbWord}</span> <span class="particle" data-particle-toggle>${particleWord}</span>`);

  const wordCount = item.example.split(/\s+/).length;
  const size = wordCount <= 8 ? 'size-small' : wordCount <= 16 ? 'size-medium' : 'size-large';

  return `
    ${renderItemStrip(item)}
    <div class="phrase-text ${size}">${posterHtml}</div>
    <div class="meaning-text">${item.meaning}</div>`;
}

/* Every phrase in the current set, with the one on screen picked out. Learn
   mode only: in Quiz and Practice this strip would hand over the answer,
   which matters most in a MIX group where the distractors come from the same
   verb as the target. */
function renderItemStrip(currentItem) {
  const group = verbs[verbIdx];
  const lead = group.mixed ? '' : `<span class="item-strip-verb">${group.id}</span>`;
  const chips = group.items.map(it => {
    const label = group.mixed ? (baseVerbOf(it) + ' ' + it.particle) : it.particle;
    const cls = it === currentItem ? 'item-chip current' : 'item-chip';
    return `<span class="${cls}">${label}</span>`;
  }).join('');
  return `<div class="item-strip">${lead}${chips}</div>`;
}

function attachLearnMaskHandlers() {}

/* ── QUIZ ── */
function renderQuiz(item) {
  const opts = shuffled([...item.options]);
  const wordCount = item.example.split(/\s+/).length;
  const size = wordCount <= 8 ? 'size-small' : wordCount <= 16 ? 'size-medium' : 'size-large';
  const verbWord = verbOf(item);
  const sentHtml = item.example.replace('_____',
    `<span class="verb-word">${verbWord}</span> <span class="quiz-blank" id="blankSpan">?</span>`);
  return `
    <div class="phrase-text ${size}">${sentHtml}</div>
    <div class="quiz-opts">
      ${opts.map((o) => `
        <button class="qopt" data-opt="${o}" onclick="chooseOpt('${o.replace(/'/g,"\\'")}','${item.particle.replace(/'/g,"\\'")}',this)">
          ${o}
        </button>`).join('')}
    </div>
    <div class="fb-bar" id="fbBar">
      <span class="fb-icon" id="fbIcon"></span>
      <span id="fbText" class="fb-text"></span>
    </div>`;
}

/* ── GAP ── */
function renderGap(item) {
  const wordCount = item.example.split(/\s+/).length;
  const size = wordCount <= 8 ? 'size-small' : wordCount <= 16 ? 'size-medium' : 'size-large';
  const verbWord = verbOf(item);
  const sentHtml = item.example.replace('_____',
    `<span class="verb-word">${verbWord}</span> <span class="gap-blank-marker">_____</span>`);
  return `
    <div class="phrase-text ${size}">${sentHtml}</div>
    <div class="gap-input-wrap">
      <input class="gap-input" id="gapInput" type="text" placeholder="type the particle…"
        autocomplete="off" autocorrect="off" spellcheck="false"
        onkeydown="if(event.key==='Enter')handleCheck()">
      <div class="gap-hint" id="gapHint">type the missing particle — press Check below</div>
    </div>
    <div class="fb-bar" id="fbBar">
      <span class="fb-icon" id="fbIcon"></span>
      <span id="fbText" class="fb-text"></span>
    </div>`;
}

/* ── SHOW ── */
function show(idx, dir) {
  if (!slides.length) return;
  const els  = document.querySelectorAll('.slide');
  const dots = document.querySelectorAll('.dot');
  const s = slides[idx];
  const key = s ? itemKey(verbIdx, s.item) : null;
  const saved = key ? results[key] : null;

  if (prev >= 0 && prev !== idx && els[prev]) {
    els[prev].classList.remove('active');
    if (dir !== 'none') {
      els[prev].classList.add('exit-left');
      setTimeout(() => els[prev]?.classList.remove('exit-left'), 480);
    }
  }
  if (els[idx]) {
    if (!reviewMode && saved) {
      /* Already answered this one — show it exactly as it was left, not
         blank. This is the actual fix for "I typed a word, went back, and
         it was gone": the slide used to be unconditionally reset here. */
      if (s.type === 'quiz') {
        const correct = s.item.particle;
        els[idx].querySelectorAll('.qopt').forEach(b => {
          b.classList.add('locked');
          const opt = b.dataset.opt;
          if (opt === saved.given && !saved.ok) b.classList.add('wrong');
          else if (opt === correct) b.classList.add(saved.ok ? 'correct' : 'reveal');
        });
        const blank = els[idx].querySelector('.quiz-blank');
        if (blank) {
          blank.textContent = correct;
          blank.classList.add('revealed');
          if (!saved.ok) blank.style.color = 'var(--ok)';
        }
      } else if (s.type === 'gap') {
        const inp = els[idx].querySelector('.gap-input');
        if (inp) { inp.value = saved.given || ''; inp.classList.add(saved.ok ? 'correct' : 'wrong'); inp.disabled = true; }
        const hint = els[idx].querySelector('.gap-hint');
        if (!saved.ok && hint) {
          hint.textContent = 'Answer: ' + s.item.particle;
          hint.classList.add('show-answer');
        }
        const gapBlank = els[idx].querySelector('.gap-blank-marker');
        if (gapBlank) {
          gapBlank.textContent = s.item.particle;
          gapBlank.style.color = saved.ok ? 'var(--ok)' : 'var(--wrong)';
        }
      }
      const bar = els[idx].querySelector('.fb-bar');
      if (bar) {
        bar.classList.add('show');
        const icon = els[idx].querySelector('.fb-icon');
        const text = els[idx].querySelector('.fb-text');
        if (icon) { icon.textContent = saved.ok ? '✓' : '✗'; icon.style.color = saved.ok ? 'var(--ok)' : 'var(--wrong)'; }
        if (text) text.innerHTML = feedbackHTML(saved.ok, s.item.particle, s.item);
      }
    } else if (!reviewMode) {
      els[idx].querySelectorAll('.qopt').forEach(b => {
        b.classList.remove('correct', 'wrong', 'reveal', 'locked');
      });
      const incomingBlank = els[idx].querySelector('.quiz-blank');
      if (incomingBlank) { incomingBlank.textContent = '?'; incomingBlank.classList.remove('revealed'); incomingBlank.style.color = ''; }
      const incomingFb = els[idx].querySelector('.fb-bar');
      if (incomingFb) incomingFb.classList.remove('show');
      const incomingInput = els[idx].querySelector('.gap-input');
      if (incomingInput) { incomingInput.classList.remove('correct','wrong'); incomingInput.disabled = false; incomingInput.value = ''; }
      const incomingHint = els[idx].querySelector('.gap-hint');
      if (incomingHint) { incomingHint.textContent = 'type the missing particle — press Check below'; incomingHint.classList.remove('show-answer'); }
      const incomingGapBlank = els[idx].querySelector('.gap-blank-marker');
      if (incomingGapBlank) { incomingGapBlank.textContent = '_____'; incomingGapBlank.style.color = ''; }
    }

    if (dir === 'forward')  els[idx].style.cssText = 'transform:translateX(60px);opacity:0';
    else if (dir === 'back') els[idx].style.cssText = 'transform:translateX(-60px);opacity:0';
    else                     els[idx].style.cssText = '';
    requestAnimationFrame(() => requestAnimationFrame(() => {
      els[idx].classList.add('active');
      els[idx].style.cssText = '';
      if (mode === 'gap') {
        const inp = els[idx].querySelector('.gap-input');
        if (inp && !inp.disabled) setTimeout(() => inp.focus(), 80);
      }
    }));
  }

  dots.forEach((d, i) => d.classList.toggle('active', i === idx));
  document.getElementById('prevBtn').disabled = idx === 0;
  document.getElementById('nextBtn').disabled = idx === slides.length - 1;

  document.getElementById('sectionLabel').textContent =
    s ? (baseVerbOf(s.item) + ' ' + s.item.particle).toUpperCase() : '';

  /* A restored slide is already decided — lock the guards that would
     otherwise let a stray tap or Enter re-trigger scoring on it. */
  if (s && s.type === 'quiz') answered   = !reviewMode && !!saved;
  else if (s && s.type === 'gap') gapChecked = !reviewMode && !!saved;

  updateProgress();
  updateCheckBtn();
  prev = idx; current = idx;
}

/* ── QUIZ ANSWER ── */
function chooseOpt(chosen, correct, btn) {
  if (answered) return;
  answered = true;
  const isOk = chosen === correct;
  const slideEl = activeSlideEl();
  const blank = slideEl ? slideEl.querySelector('.quiz-blank') : null;
  (slideEl ? slideEl.querySelectorAll('.qopt') : []).forEach(b => {
    b.classList.add('locked');
    const opt = b.dataset.opt;
    if (opt === chosen && !isOk) b.classList.add('wrong');
    else if (opt === correct) b.classList.add(isOk ? 'correct' : 'reveal');
  });
  /* Fill the blank either way. A learner who guessed wrong needs to read the
     sentence with the right particle in it — that is the correction. */
  if (blank) {
    blank.textContent = correct;
    blank.classList.add('revealed');
    if (!isOk) blank.style.color = 'var(--ok)';
  }
  recordResult(isOk, chosen);
  showFeedback(isOk, correct);
  /* Longer pause on a miss: the wrong answer is the moment there is most to
     read, and the old timing gave it less time than a correct one. */
  setTimeout(() => next(), isOk ? 1300 : 2600);
}

/* ── GAP CHECK ── */
function handleCheck() {
  if (mode !== 'gap' || gapChecked) return;
  const slideEl = activeSlideEl();
  const inp = slideEl ? slideEl.querySelector('.gap-input') : null;
  if (!inp) return;
  const given = inp.value.trim();
  const val = given.toLowerCase();
  const correct = slides[current].item.particle.toLowerCase();
  const isOk = val === correct;
  gapChecked = true;
  inp.classList.add(isOk ? 'correct' : 'wrong');
  inp.disabled = true;
  const hint = slideEl ? slideEl.querySelector('.gap-hint') : null;
  if (!isOk && hint) {
    hint.textContent = 'Answer: ' + slides[current].item.particle;
    hint.classList.add('show-answer');
  }
  /* Fill the blank in the sentence itself, mirroring how Quiz mode reveals
     the answer in place rather than only below in the hint/feedback bar. */
  const gapBlank = slideEl ? slideEl.querySelector('.gap-blank-marker') : null;
  if (gapBlank) {
    gapBlank.textContent = slides[current].item.particle;
    gapBlank.style.color = isOk ? 'var(--ok)' : 'var(--wrong)';
  }
  recordResult(isOk, given);
  showFeedback(isOk, slides[current].item.particle);
  document.getElementById('checkBtn').style.display = 'none';
  setTimeout(() => next(), isOk ? 1300 : 2600);
}

/* ── RESULTS & FEEDBACK ── */
function recordResult(isOk, given) {
  const key = itemKey(verbIdx, slides[current].item);
  results[key] = { ok: isOk, given: given || '' };   // was a bare 'ok'/'err' string — now remembers the answer itself
  persistResults();
  recalcScore();
  refreshDots();
  updateProgress();
  updateModeBadges();
  if (isOk) { streak++; if (streak > 0 && streak % 3 === 0) showStreak(); }
  else streak = 0;
}

function recalcScore() {
  scoreOk = 0; scoreErr = 0;
  Object.values(results).forEach(r => { if (r && r.ok) scoreOk++; else if (r) scoreErr++; });
  document.getElementById('scoreOk').textContent  = scoreOk;
  document.getElementById('scoreErr').textContent = scoreErr;
}

function feedbackHTML(isOk, particle, item) {
  const meaning = item?.meaning || '';
  const full = (baseVerbOf(item) + ' ' + particle).toUpperCase();
  if (isOk) return `<strong>${full}</strong>${meaning ? ' — ' + meaning : ''}`;
  /* State the form and its meaning rather than deferring to the end screen.
     An error the learner cannot resolve on the spot teaches nothing, and a
     B2 learner whose L1 has no phrasal verbs has no intuition to fall back
     on. */
  return '<span style="color:var(--faint);font-size:.8rem">Answer: </span>' +
    `<strong>${full}</strong>` +
    (meaning ? `<span style="color:var(--dim)"> — ${meaning}</span>` : '');
}

function showFeedback(isOk, particle) {
  const slideEl = activeSlideEl();
  const bar  = slideEl ? slideEl.querySelector('.fb-bar')  : null;
  const icon = slideEl ? slideEl.querySelector('.fb-icon') : null;
  const text = slideEl ? slideEl.querySelector('.fb-text') : null;
  if (!bar) return;
  bar.classList.add('show');
  icon.textContent = isOk ? '✓' : '✗';
  icon.style.color = isOk ? 'var(--ok)' : 'var(--wrong)';
  text.innerHTML = feedbackHTML(isOk, particle, slides[current]?.item);
}

function showStreak() {
  const el = document.getElementById('streakFlash');
  const msgs = ['🔥 ' + streak + ' in a row!', '⚡ ' + streak + ' streak!', '✨ ' + streak + ' correct!'];
  el.textContent = msgs[Math.floor(Math.random() * msgs.length)];
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

/* Reuses the streak flash to explain the jump back; without a word of
   explanation the learner just sees the app throw them somewhere. */
function showSkipNotice() {
  const el = document.getElementById('streakFlash');
  const left = slides.filter(s => !results[itemKey(verbIdx, s.item)]).length;
  el.textContent = left === 1 ? '1 left to answer' : left + ' left to answer';
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1800);
}

/* ── NAV ── */
function next() {
  if (mode === 'match') {
    if (roundIdx < gameRounds.length - 1) switchRound(roundIdx + 1);
    return;
  }
  if (busy) return;
  if (current >= slides.length - 1) {
    if (mode !== 'learn') {
      const firstUnanswered = slides.findIndex(s => !results[itemKey(verbIdx, s.item)]);
      /* Everything attempted → results. Otherwise send the learner back to the
         first item they skipped rather than leaving them stuck on a last slide
         that does nothing. */
      if (firstUnanswered === -1) { showResults(); return; }
      busy = true; answered = false; gapChecked = false;
      show(firstUnanswered, 'forward');
      showSkipNotice();
      setTimeout(() => busy = false, 480);
      resetAuto(); updateCheckBtn();
    }
    return;
  }
  busy = true; answered = false; gapChecked = false;
  show(current + 1, 'forward');
  setTimeout(() => busy = false, 480);
  resetAuto(); updateCheckBtn();
}
function back() {
  if (mode === 'match') {
    if (roundIdx > 0) switchRound(roundIdx - 1);
    return;
  }
  if (busy || current <= 0) return;
  busy = true; answered = false; gapChecked = false;
  show(current - 1, 'back');
  setTimeout(() => busy = false, 480);
  resetAuto(); updateCheckBtn();
}
function jump(idx) {
  if (busy) return;
  busy = true; answered = false; gapChecked = false;
  show(idx, idx > current ? 'forward' : 'back');
  setTimeout(() => busy = false, 480);
  resetAuto(); updateCheckBtn();
}

/* ── RESULTS OVERLAY (learn/quiz/gap) ── */
function showResults() {
  const verb = verbs[verbIdx];
  const total = verb.items.length;
  let ok = 0;
  verb.items.forEach(item => {
    const r = results[itemKey(verbIdx, item)];
    if (r && r.ok) ok++;
  });
  const pct = Math.round(ok / total * 100);
  const perfect = pct === 100;

  document.getElementById('ovTitle').textContent = perfect ? 'Perfect!' : pct >= 80 ? 'Brilliant' : pct >= 60 ? 'Good' : 'Keep Going';
  document.getElementById('ovScore').textContent  = ok + ' / ' + total + ' · ' + pct + '%';
  document.getElementById('ovPerfect').classList.toggle('show', perfect);

  const stars = pct >= 90 ? 3 : pct >= 70 ? 2 : pct >= 50 ? 1 : 0;
  document.getElementById('ovStars').innerHTML = Array.from({length:3},(_,i) =>
    `<span class="ov-star">${i < stars ? '★' : '☆'}</span>`).join('');

  document.getElementById('ovBars').innerHTML = verb.items.map(item => {
    const r = results[itemKey(verbIdx, item)];
    const bg = !r ? 'var(--slot-bg)' : r.ok ? 'var(--ok)' : 'var(--wrong)';
    return `<div class="ov-bar" style="background:${bg}"></div>`;
  }).join('');

  document.getElementById('ovMsg').textContent = perfect
    ? "Absolutely flawless. You've mastered this set!"
    : pct >= 80 ? 'Excellent. Review the red ones and try again.'
    : pct >= 60 ? 'Solid work. Try Learn mode on the missed ones.'
    : 'Go back to Learn mode to build the pattern first.';

  document.getElementById('ovAnswers').innerHTML = verb.items.map((item, i) => {
    const r = results[itemKey(verbIdx, item)];
    const cls = r && r.ok ? 'ok' : 'err';
    const tick = r && r.ok ? '✓' : '✗';
    const given = r && !r.ok && r.given
      ? `<span class="ov-answer-given">you wrote &ldquo;${esc(r.given)}&rdquo;</span>` : '';
    const delay = i * 40;
    return `<div class="ov-answer-item ${cls}" style="animation-delay:${delay}ms">
      <span class="ov-answer-verb">${baseVerbOf(item).toUpperCase()} ${item.particle.toUpperCase()}</span>
      <span class="ov-answer-meaning">${item.meaning}</span>${given}
      <span class="ov-answer-tick">${tick}</span>
    </div>`;
  }).join('');

  updateTabScore(verbIdx, pct);

  document.getElementById('overlay').classList.add('show');

  if (perfect) {
    triggerConfetti();
    setTimeout(() => showAwardPopup(), 300);
  }
}

function updateTabScore(idx, pct) {
  const tabs = document.querySelectorAll('.vtab');
  if (!tabs[idx]) return;
  tabs[idx].classList.remove('score-perfect','score-great','score-ok','score-poor');
  if (pct === 100)      tabs[idx].classList.add('score-perfect');
  else if (pct >= 80)   tabs[idx].classList.add('score-great');
  else if (pct >= 50)   tabs[idx].classList.add('score-ok');
  else                  tabs[idx].classList.add('score-poor');
}

function showAwardPopup() {
  const popup = document.getElementById('awardPopup');
  popup.classList.add('show');
  setTimeout(() => popup.classList.remove('show'), 2200);
}

/* ── CONFETTI ── */
let confettiAnim = null;
let confettiParticles = [];

function triggerConfetti() {
  const canvas = document.getElementById('confettiCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  confettiParticles = Array.from({length: 120}, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height - canvas.height,
    r: Math.random() * 6 + 3,
    d: Math.random() * 6 + 2,
    color: ['#F26430','#AC5A3E','#4A6B5C','#708A81','#C2956E','#BCB1A0'][Math.floor(Math.random()*6)],
    tilt: Math.random() * 10 - 10,
    tiltAngle: 0,
    tiltAngleInc: Math.random() * 0.07 + 0.05
  }));
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    confettiParticles.forEach(p => {
      p.tiltAngle += p.tiltAngleInc; p.y += p.d; p.tilt = Math.sin(p.tiltAngle) * 15;
      if (p.y > canvas.height) { p.y = -20; p.x = Math.random() * canvas.width; }
      ctx.beginPath(); ctx.lineWidth = p.r / 2; ctx.strokeStyle = p.color;
      ctx.moveTo(p.x + p.tilt + p.r/4, p.y);
      ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r/4); ctx.stroke();
    });
    confettiAnim = requestAnimationFrame(draw);
  }
  draw();
  setTimeout(stopConfetti, 5000);
}

function stopConfetti() {
  if (confettiAnim) { cancelAnimationFrame(confettiAnim); confettiAnim = null; }
  const canvas = document.getElementById('confettiCanvas');
  canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
}

function restart() {
  document.getElementById('overlay').classList.remove('show');
  stopConfetti();

   if (mode === 'match') {
    roundResults = {};
    matchChecked = false; matchAnswers = {}; matchSelectedId = null;
    buildRoundTabs();
    renderMatchRound();
    syncHeaderHeight();
    updateModeBadges();
    return;
  }

  reviewMode = false;
  clearStoredResults();
  results = {}; scoreOk = 0; scoreErr = 0; streak = 0;
  document.getElementById('scoreOk').textContent = 0;
  document.getElementById('scoreErr').textContent = 0;
  build(); paint(); show(0, 'none'); resetAuto(); updateCheckBtn(); updateModeBadges();
}

function closeOverlay() {
  document.getElementById('overlay').classList.remove('show');
  stopConfetti();
  if (mode === 'match') return; // match round already shows its checked state inline
  reviewMode = true;
  paintReview();
  show(0, 'none');
  updateCheckBtn();
}

function paintReview() {
  const container = document.getElementById('slidesContainer');
  container.innerHTML = slides.map((s, i) => {
    return `<div class="slide" data-idx="${i}">${renderReview(s)}</div>`;
  }).join('');
  document.querySelectorAll('.dot').forEach(d =>
    d.addEventListener('click', e => { e.stopPropagation(); jump(+d.dataset.dot); })
  );
}

function renderReview(s) {
  const { item } = s;
  const key = itemKey(verbIdx, item);
  const r = results[key];
  const isOk = !!(r && r.ok);
  const wordCount = item.example.split(/\s+/).length;
  const size = wordCount <= 8 ? 'size-small' : wordCount <= 16 ? 'size-medium' : 'size-large';
  const resultColor = isOk ? 'var(--ok)' : 'var(--wrong)';
  const tick = isOk ? '✓' : '✗';

  const verbWord = verbOf(item);
  const sentHtml = item.example.replace('_____',
    `<span class="verb-word" style="color:${resultColor}">${verbWord}</span> <span style="color:${resultColor};font-weight:900;text-decoration:underline;text-underline-offset:5px">${item.particle}</span>`);

  /* The review screen used to show only the correct particle plus a
     tick/cross — never what the student actually chose or typed, so
     there was nothing here to actually review. */
  const givenHtml = (!isOk && r && r.given)
    ? `<div style="font-family:var(--f-mono);font-size:.7rem;color:var(--wrong);margin-top:.15rem">you wrote &ldquo;${esc(r.given)}&rdquo;</div>`
    : '';

  return `
    <div class="phrase-text ${size}" style="opacity:.9">${sentHtml}</div>
    <div style="display:flex;align-items:center;gap:.6rem;margin-top:.2rem">
      <span style="font-size:1.1rem;color:${resultColor}">${tick}</span>
      <span style="font-size:.85rem;color:var(--faint);line-height:1.5">${item.meaning}</span>
    </div>
    ${givenHtml}`;
}

/* ── CHECK BTN (learn/quiz/gap bottom bar) ── */
function updateCheckBtn() {
  const btn = document.getElementById('checkBtn');
  if (mode === 'gap' && !gapChecked) {
    btn.style.display = 'inline-flex';
  } else {
    btn.style.display = 'none';
  }
}

/* ── AUTO ── */
function startAuto() {
  stopAuto();
  const fill = document.getElementById('progressFill');
  fill.style.transition = 'none'; fill.style.width = '0%';
  requestAnimationFrame(() => {
    fill.style.transition = `width ${AUTO_MS}ms linear`;
    fill.style.width = '100%';
  });
  autoTimer = setTimeout(() => {
    if (current < slides.length - 1) {
      next();
    } else {
      const allAttempted = mode === 'learn' || slides.every(s => results[itemKey(verbIdx, s.item)]);
      if (mode !== 'learn' && allAttempted) {
        showResults();
        autoOn = false;
        document.getElementById('autoRow').classList.remove('on');
        stopAuto();
        return;
      }
      build(); paint(); show(0, 'none');
    }
    if (autoOn) startAuto();
  }, AUTO_MS);
}
function stopAuto() {
  clearTimeout(autoTimer);
  const fill = document.getElementById('progressFill');
  fill.style.transition = 'none'; fill.style.width = '0%';
}
function resetAuto() { if (autoOn) startAuto(); }
function toggleAuto() {
  if (mode === 'match') return;
  autoOn = !autoOn;
  document.getElementById('autoRow').classList.toggle('on', autoOn);
  autoOn ? startAuto() : stopAuto();
}

/* ── X-RAY ── */
function showXray() {
  xray = true;
  document.getElementById('sectionLabel').classList.add('visible');
  if (!xrayDone) { xrayDone = true; document.getElementById('holdHint').classList.add('hidden'); }
}
function hideXray() {
  xray = false;
  document.getElementById('sectionLabel').classList.remove('visible');
}

/* ── MODE ── */
/* Was four accents, one per mode — four hues doing the job the mode row's
   own underline already does. The accent is the accent. */

function applyModeAccent() {}

async function setMode(m) {
  const leavingMatch = (mode === 'match' && m !== 'match');
  mode = m;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
  reviewMode = false; streak = 0;
  if (m === 'match') { results = {}; scoreOk = 0; scoreErr = 0; document.getElementById('scoreOk').textContent = 0; document.getElementById('scoreErr').textContent = 0; }
  else { restoreResults(); recalcScore(); }   // pick up whatever was already answered in this mode, rather than wiping it
  document.getElementById('checkBtn').style.display = 'none';
  stopAuto(); autoOn = false;
  document.getElementById('autoRow').classList.remove('on');

  if (m === 'match') {
    document.getElementById('holdHint').classList.add('hidden');
    document.documentElement.classList.add('match-scroll');
    document.body.classList.add('match-scroll');
    document.getElementById('slideCard').classList.add('match-mode');
    document.getElementById('sectionLabel').classList.remove('visible');
    document.getElementById('dotNav').innerHTML = '';
    document.getElementById('progressFill').style.width = '0%';

    applyModeAccent();
    const gotData = await ensureGameData();
    if (!gotData) {
      document.getElementById('slidesContainer').innerHTML =
        '<div style="max-width:22rem;text-align:center;margin:3rem auto;' +
        'color:var(--wrong);line-height:1.7">' +
        'Could not load the match data.<br>' +
        '<span style="color:var(--faint);font-size:.85rem">Check the connection and try again.</span></div>';
      updateModeBadges();
      return;
    }
      roundIdx = 0; roundResults = {};
    matchChecked = false; matchAnswers = {}; matchSelectedId = null;
    buildRoundTabs();
    renderMatchRound();
    syncHeaderHeight();
    updateModeBadges();
    return;
  }

  if (leavingMatch) {
    document.getElementById('slideCard').classList.remove('match-mode');
    document.documentElement.classList.remove('match-scroll');
    document.body.classList.remove('match-scroll');
    document.getElementById('verbTabs').className = 'set-tabs';
    buildTabs();
    document.querySelectorAll('.vtab').forEach((b, j) => b.classList.toggle('active', j === verbIdx));
    applyVerbTheme();
  }
  applyModeAccent();
  syncHeaderHeight();
  build(); paint(); show(0, 'none'); resetAuto(); updateCheckBtn(); updateModeBadges();
}

/* ── MODE BADGES ── */
function updateModeBadges() {
  const matchBadge = document.getElementById('badge-match');
  if (matchBadge) {
    matchBadge.textContent = gameLoaded ? (mode === 'match' ? (roundIdx + 1) + '/' + gameRounds.length : gameRounds.length) : '–';
    matchBadge.classList.toggle('live', mode === 'match');
  }
  if (!verbs.length) return;
  const verb = verbs[verbIdx];
  const total = verb.items.length;
  ['learn', 'quiz', 'gap'].forEach(m => {
    const el = document.getElementById('badge-' + m);
    if (!el) return;
    if (m === mode) {
      const done = verb.items.filter(item => results[itemKey(verbIdx, item)]).length;
      el.textContent = done + '/' + total;
      el.classList.add('live');
    } else {
      el.textContent = total;
      el.classList.remove('live');
    }
  });
}

/* ── DOTS ── */
function refreshDots() {
  document.querySelectorAll('.dot').forEach((d, i) => {
    const s = slides[i];
    if (!s) return;
    const key = itemKey(verbIdx, s.item);
    const r = results[key];
    d.className = 'dot';
    if (i === current) d.classList.add('active');
    else if (r && r.ok) d.classList.add('ok');
    else if (r && !r.ok) d.classList.add('err');
  });
}

/* ── PROGRESS ── */
function updateProgress() {
  if (autoOn) return;
  const verb = verbs[verbIdx];
  const done = verb.items.filter(item => results[itemKey(verbIdx, item)]).length;
  document.getElementById('progressFill').style.width = (done / verb.items.length * 100) + '%';
}

/* ── UTILS ── */
function shuffled(a) {
  const b = [...a];
  for (let i = b.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [b[i], b[j]] = [b[j], b[i]];
  }
  return b;
}

/* ── EVENTS ── */
document.getElementById('prevBtn').addEventListener('click', e => { e.stopPropagation(); back(); });
document.getElementById('nextBtn').addEventListener('click', e => { e.stopPropagation(); next(); });

const card = document.getElementById('slideCard');
let tx = 0;
card.addEventListener('touchstart', e => {
  if (mode === 'match') return;
  tx = e.touches[0].clientX;
  longTimer = setTimeout(showXray, 400);
}, {passive: true});
card.addEventListener('touchend', e => {
  if (mode === 'match') return;
  clearTimeout(longTimer); hideXray();
  const dx = e.changedTouches[0].clientX - tx;
  if (Math.abs(dx) > 50) { if (dx < 0) next(); else back(); }
}, {passive: true});
card.addEventListener('mousedown', () => { if (mode !== 'match') longTimer = setTimeout(showXray, 400); });
card.addEventListener('mouseup', () => { clearTimeout(longTimer); hideXray(); });

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); back(); }
  if (e.key === 'a' || e.key === 'A') toggleAuto();
  if (e.key === 'Enter' && mode === 'gap') handleCheck();
  if (mode === 'quiz') {
    if (e.key === '1') clickOpt(0);
    if (e.key === '2') clickOpt(1);
    if (e.key === '3') clickOpt(2);
    if (e.key === '4') clickOpt(3);
  }
});

function clickOpt(i) {
  const slideEl = activeSlideEl();
  const opts = slideEl ? slideEl.querySelectorAll('.qopt') : [];
  if (opts[i] && !opts[i].classList.contains('locked')) opts[i].click();
}

document.querySelectorAll('.mode-btn').forEach(b =>
  b.addEventListener('click', e => {
    e.stopPropagation();
    /* Buttons carrying data-href leave the page rather than switching mode.
       The active verb rides along in the URL so Hunt opens on the same
       word set instead of resetting to whichever one is first. */
    if (b.dataset.href) {
      const url = new URL(b.dataset.href, location.href);
      if (verbs[verbIdx]) url.searchParams.set('verb', verbs[verbIdx].id);
      location.href = url.toString();
      return;
    }
    setMode(b.dataset.mode);
  })
);
document.getElementById('autoRow').addEventListener('click', e => { e.stopPropagation(); toggleAuto(); });


/* ══════════════════════════════ MATCH MODE ══════════════════════════════
   Click-to-fill, scored on Check (mirrors the word-choice quiz pattern):
   1. Tap a phrase chip in the word bank → it's "selected"
   2. Tap a blank in Column A → the phrase is placed there (pre-check state,
      shown in the mode accent colour, not yet marked right/wrong)
   3. Tapping a filled blank again releases that chip back to the bank
   4. Once every blank has a chip, Check scores the whole round at once and
      shows the results overlay (reusing the existing overlay UI)
   Colour: each phrase chip carries its verb-family colour from game-data.json
   from the start (a grouping cue). Column B (the definition) stays plain
   throughout — colour only lands on Column A once an answer is placed/checked,
   so the definition itself must still be read to make the match. */

async function ensureGameData() {
  if (gameLoaded) return true;
  try {
    const res = await fetch(GAME_DATA_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    gameRounds = data.game;
    gameLoaded = true;
    return true;
  } catch (e) {
    return false;
  }
}

/* Round tabs reuse the .vtab strip that normally lists verbs */
function buildRoundTabs() {
  const wrap = document.getElementById('verbTabs');
  wrap.className = 'rtabs';
  wrap.innerHTML = '';
  gameRounds.forEach((r, i) => {
    const dot = document.createElement('button');
    let cls = 'rtab';
    if (i === roundIdx) cls += ' active';
    if (roundResults[i] === 'perfect') cls += ' perfect';
    else if (roundResults[i] === 'ok') cls += ' ok';
    else if (roundResults[i] === 'poor') cls += ' poor';
    dot.className = cls;
    dot.setAttribute('aria-label', 'Round ' + (i + 1));
    dot.addEventListener('click', e => { e.stopPropagation(); switchRound(i); });
    wrap.appendChild(dot);
  });
  wrap.querySelectorAll('.rtab')[roundIdx]?.scrollIntoView({ inline: 'center', block: 'nearest' });
  updateRoundArrows();
}

 function switchRound(i) {
  roundIdx = i;
  matchChecked = false; matchAnswers = {}; matchSelectedId = null;
  document.querySelectorAll('#verbTabs .rtab').forEach((b, j) => b.classList.toggle('active', j === i));
  renderMatchRound();
  updateModeBadges();
  updateRoundArrows();
}

function updateRoundArrows(){
  const p = document.getElementById('roundPrev'), n = document.getElementById('roundNext');
  if (!p || !n) return;
  const on = (mode === 'match');
  p.classList.toggle('hidden', !on);
  n.classList.toggle('hidden', !on);
  if (!on) return;
  p.disabled = roundIdx === 0;
  n.disabled = roundIdx === gameRounds.length - 1;
}
document.getElementById('roundPrev').addEventListener('click', e => {
  e.stopPropagation();
  if (roundIdx > 0) switchRound(roundIdx - 1);
});
document.getElementById('roundNext').addEventListener('click', e => {
  e.stopPropagation();
  if (roundIdx < gameRounds.length - 1) switchRound(roundIdx + 1);
});

function renderMatchRound() {
  const round = gameRounds[roundIdx];
  const container = document.getElementById('slidesContainer');

  // Chips: one per pair, colour-coded to its verb family, shuffled.
  const chips = shuffled(round.pairs);
  // Rows: meanings in a different shuffled order than the chips so position
  // never gives the answer away.
  const rows = shuffled(round.pairs);

  const chipsHtml = chips.map(p => `
    <button type="button" class="match-chip" data-id="${p.id}"
      onclick="onChipClick(${p.id}, this)">${p.phrase}</button>`
  ).join('');

  const rowsHtml = rows.map((p, i) => `
    <div class="match-row" data-row-id="${p.id}">
      <div class="match-row-num">${i + 1}</div>
      <div class="match-meaning">${p.meaning} — <span class="match-blank" data-row-id="${p.id}" onclick="onBlankClick(${p.id})"><span class="blank-content">&nbsp;</span></span></div>
    </div>`).join('');

  container.innerHTML = `
    <div class="slide active match-slide">
      <div class="match-round-label">ROUND ${roundIdx + 1} / ${gameRounds.length}</div>
      <div class="match-bank">${chipsHtml}</div>
      <div class="match-rows">${rowsHtml}</div>
    </div>`;

  document.getElementById('prevBtn').disabled = roundIdx === 0;
  document.getElementById('nextBtn').disabled = roundIdx === gameRounds.length - 1;
  document.getElementById('sectionLabel').textContent = 'MATCH ROUND ' + (roundIdx + 1);

  updateMatchProgress();
}

function currentPairs() {
  return gameRounds[roundIdx].pairs;
}

function onChipClick(id, btn) {
  if (matchChecked) return;
  if (btn.classList.contains('used')) return;

  if (matchSelectedId === id) {
    // tapping the already-selected chip deselects it
    matchSelectedId = null;
    btn.classList.remove('selected');
    return;
  }

  document.querySelectorAll('.match-chip.selected').forEach(c => c.classList.remove('selected'));
  matchSelectedId = id;
  btn.classList.add('selected');
}

function onBlankClick(rowId) {
  if (matchChecked) return;
  const blank = document.querySelector(`.match-blank[data-row-id="${rowId}"]`);
  if (!blank) return;

  // Blank already filled → release it back to the bank
  if (matchAnswers[rowId] !== undefined) {
    const releasedId = matchAnswers[rowId];
    delete matchAnswers[rowId];
    const chip = document.querySelector(`.match-chip[data-id="${releasedId}"]`);
    if (chip) chip.classList.remove('used');
    blank.classList.remove('filled');
    blank.querySelector('.blank-content').innerHTML = '_____';
    updateMatchProgress();
    return;
  }

  // No chip selected — nothing to place
  if (matchSelectedId === null) return;

  const chip = document.querySelector(`.match-chip[data-id="${matchSelectedId}"]`);
  const pair = currentPairs().find(p => p.id === matchSelectedId);
  if (!chip || !pair) return;

  matchAnswers[rowId] = matchSelectedId;
  chip.classList.remove('selected');
  chip.classList.add('used');
  matchSelectedId = null;

  blank.classList.add('filled');
  blank.querySelector('.blank-content').textContent = pair.phrase;

  updateMatchProgress();
  if (Object.keys(matchAnswers).length === currentPairs().length) {
    setTimeout(checkMatchRound, 250);
  }
}

function updateMatchProgress() {
  const total = currentPairs().length;
  const filled = Object.keys(matchAnswers).length;
  document.getElementById('progressFill').style.width = (filled / total * 100) + '%';
}

/* ── SCORE THE WHOLE ROUND AT ONCE ── */
function checkMatchRound() {
  if (matchChecked) return;
  const pairs = currentPairs();
  const total = pairs.length;
  if (Object.keys(matchAnswers).length < total) return;

  matchChecked = true;
  let ok = 0;

  pairs.forEach(p => {
    const blank = document.querySelector(`.match-blank[data-row-id="${p.id}"]`);
    const placedId = matchAnswers[p.id];
    const isOk = placedId === p.id;
    if (isOk) ok++;
    blank.classList.add(isOk ? 'result-ok' : 'result-err');
    if (!isOk) {
      const placedPair = pairs.find(x => x.id === placedId);
      blank.innerHTML = `<span class="blank-content">${placedPair ? placedPair.phrase : '?'}</span><span class="reveal-answer">${p.phrase}</span>`;
    }
  });

  document.querySelectorAll('.match-chip').forEach(c => c.classList.add('used'));

  scoreOk = ok; scoreErr = total - ok;
  document.getElementById('scoreOk').textContent = scoreOk;
  document.getElementById('scoreErr').textContent = scoreErr;

  const pct = Math.round(ok / total * 100);
  roundResults[roundIdx] = pct === 100 ? 'perfect' : (pct >= 50 ? 'ok' : 'poor');
  buildRoundTabs();

  showMatchResults(ok, total, pct, pairs);
}

function showMatchResults(ok, total, pct, pairs) {
  const perfect = pct === 100;

  document.getElementById('ovTitle').textContent = perfect ? 'Perfect!' : pct >= 80 ? 'Brilliant' : pct >= 60 ? 'Good' : 'Keep Going';
  document.getElementById('ovScore').textContent  = ok + ' / ' + total + ' · ' + pct + '%';
  document.getElementById('ovPerfect').classList.toggle('show', perfect);

  const stars = pct >= 90 ? 3 : pct >= 70 ? 2 : pct >= 50 ? 1 : 0;
  document.getElementById('ovStars').innerHTML = Array.from({length:3},(_,i) =>
    `<span class="ov-star">${i < stars ? '★' : '☆'}</span>`).join('');

  document.getElementById('ovBars').innerHTML = pairs.map(p => {
    const isOk = matchAnswers[p.id] === p.id;
    return `<div class="ov-bar" style="background:${isOk ? 'var(--ok)' : 'var(--wrong)'}"></div>`;
  }).join('');

  document.getElementById('ovMsg').textContent = perfect
    ? "Absolutely flawless. You've mastered this round!"
    : pct >= 80 ? 'Excellent. Review the red ones and try again.'
    : pct >= 60 ? 'Solid work — a few mixed up.'
    : 'Worth another pass on this round.';

  document.getElementById('ovAnswers').innerHTML = pairs.map((p, i) => {
    const isOk = matchAnswers[p.id] === p.id;
    const cls = isOk ? 'ok' : 'err';
    const tick = isOk ? '✓' : '✗';
    const delay = i * 40;
    return `<div class="ov-answer-item ${cls}" style="animation-delay:${delay}ms">
      <span class="ov-answer-verb">${p.phrase}</span>
      <span class="ov-answer-meaning">${p.meaning}</span>
      <span class="ov-answer-tick">${tick}</span>
    </div>`;
  }).join('');

  document.getElementById('overlay').classList.add('show');

  if (perfect) {
    triggerConfetti();
    setTimeout(() => showAwardPopup(), 300);
  }
}

loadAll();
