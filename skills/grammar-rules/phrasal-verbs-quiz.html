<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INTUITY — Phrasal Verbs</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --gold: #C9A961; --gold-glow: rgba(201,169,97,0.4); --mode-accent: #FFD94A; --mode-accent-rgb: 255,217,74; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0d0d0d; }
    body { font-family: 'DM Sans', sans-serif; color: #e5e5e7; user-select: none; -webkit-user-select: none; }

    /* ── HEADER ── */
.header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; flex-direction: column; align-items: stretch; gap: .4rem;
  padding: .5rem 1.25rem .4rem;
  background: rgba(13,13,13,.88); backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(255,255,255,.06); height: 116px;
}

    /* Row 1 — back link · INTUITY title · balancing spacer */
    .header-top {
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    }
    .header-title { display: flex; flex-direction: column; align-items: center; line-height: 1.1; }
    .app-title {
      font-family: 'Space Grotesk', sans-serif; font-size: 1rem; font-weight: 900;
      letter-spacing: .22em; color: var(--gold);
    }
    .app-subtitle {
      font-family: 'DM Sans', sans-serif; font-size: .58rem; font-weight: 600;
      letter-spacing: .16em; text-transform: uppercase; color: rgba(255,255,255,.32);
      margin-top: .1rem;
    }
    .back-link { justify-self: start; }
    .header-spacer { justify-self: end; }

    .back-link {
      text-decoration: none; font-family: 'Space Grotesk', sans-serif;
      font-size: .6rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
      color: rgba(255,255,255,.3); transition: color .2s; white-space: nowrap; flex-shrink: 0;
    }
    .back-link:hover { color: rgba(255,255,255,.7); }

    /* Row 3 — verb tabs, its own scrollable strip below the mode row */
    .verb-tabs {
      display: flex; align-items: center; justify-content: center;
      gap: .28rem; overflow-x: auto; padding: 0 .5rem; scrollbar-width: none;
    }
    .verb-tabs::-webkit-scrollbar { display: none; }
    .vtab {
      font-family: 'Space Grotesk', sans-serif; font-size: .56rem; font-weight: 700;
      letter-spacing: .08em; text-transform: uppercase;
      padding: .28rem .72rem; border-radius: 999px; border: 1px solid transparent;
      background: transparent; color: rgba(255,255,255,.3); cursor: pointer;
      transition: all .2s; white-space: nowrap; flex-shrink: 0;
    }
    .vtab:hover { color: rgba(255,255,255,.7); border-color: rgba(255,255,255,.15); }
    .vtab.active {
      color: var(--verb-color, var(--gold));
      border-color: var(--verb-color, var(--gold));
      background: rgba(var(--verb-rgb, 201,169,97), .12);
    }
    /* Score indicator dots on verb tabs */
    .vtab::after {
      content: ''; display: inline-block; width: 5px; height: 5px;
      border-radius: 50%; margin-left: .4rem; vertical-align: middle;
      opacity: 0; transition: opacity .3s;
    }
    .vtab.score-perfect::after { background: #4DC98A; opacity: 1; box-shadow: 0 0 6px rgba(77,201,138,.6); }
    .vtab.score-great::after   { background: #7dd3fc; opacity: 1; }
    .vtab.score-ok::after      { background: #fb923c; opacity: 1; }
    .vtab.score-poor::after    { background: #E05555; opacity: 1; }

    /* Row 2 — mode selector: minimal, single-tone segmented control */
    .mode-selector {
      display: flex; justify-content: center; align-self: center;
      background: rgba(28,28,30,.6); backdrop-filter: blur(40px);
      border-radius: 999px; border: 1px solid rgba(201,169,97,.2); overflow: hidden;
    }
    .mode-btn {
      position: relative;
      display: flex; align-items: center; gap: .4rem;
      font-family: 'Space Grotesk', sans-serif; font-size: .66rem; font-weight: 600;
      letter-spacing: .04em; text-transform: uppercase;
      padding: .5rem 1.05rem; border-radius: 0; border: none;
      border-right: 1px solid rgba(84,84,88,.2);
      background: transparent; color: #636366; cursor: pointer;
      transition: background .2s ease, color .2s ease;
    }
    .mode-btn:last-child { border-right: none; }
    .mode-btn:hover { color: #9ca3af; background: rgba(201,169,97,.1); }
    .mode-icon {
      font-size: .82rem; line-height: 1; display: inline-flex;
      opacity: .55; transition: opacity .2s ease; flex-shrink: 0;
    }
    .mode-badge {
      font-size: .58rem; font-weight: 600;
      color: rgba(255,255,255,.28);
      font-variant-numeric: tabular-nums; transition: color .2s ease;
    }

    .mode-btn.active {
      background: rgba(201,169,97,.15);
      color: #C9A961;
    }
    .mode-btn.active .mode-icon { opacity: .9; }
    .mode-btn.active .mode-badge { color: rgba(201,169,97,.6); }

    .mode-btn[data-mode="gap"] .mode-icon { color: inherit; }

    @media(max-width: 760px){
      .mode-btn .mode-label { display: none; }
      .mode-btn { padding: .5rem .6rem .5rem .5rem; gap: .4rem; }
    }

    /* ── STAGE ── */
    .stage {
   position: fixed; top: 148px; left: 0; right: 0; bottom: 80px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
     padding: .5rem;
    }

    /* ── SLIDE CARD ── */
 .slide-card {
position: relative; width: 100%; max-width: min(94vw, 1200px);
  flex: 1;
  background: linear-gradient(145deg, rgba(28,28,30,.97), rgba(18,18,20,.99));
  border-radius: 1.25rem; border: 1px solid rgba(201,169,97,.22); overflow: hidden;
  box-shadow: 0 24px 70px rgba(0,0,0,.8), 0 0 80px rgba(201,169,97,.07);
  transition: border-color .4s;
}

       .slide-card.match-mode .dot-nav { display: none; }
        .slide-card.match-mode .slides-container { height: 100%; }
        .slide-card.match-mode { max-height: none; }
    .slide-card.match-mode .slide {
  position: relative;
  top: auto; left: auto;
  height: auto;
  transform: none;
  opacity: 1;
  pointer-events: auto;
}
    
    /* Top shadow accent — matches verb colour */
    .slide-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: var(--verb-color, var(--gold)); opacity: .7; transition: background .4s; z-index: 5;
    }

    .slides-container { position: relative; width: 100%; height: calc(100% - 54px); overflow: hidden; }

    /* ── SLIDE ── */
    .slide {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 2.5rem 3.5rem; gap: 1.2rem;
      opacity: 0; transform: translateX(60px);
      transition: opacity .42s cubic-bezier(.4,0,.2,1), transform .42s cubic-bezier(.4,0,.2,1);
      pointer-events: none;
    }
    .slide.active  { opacity: 1; transform: translateX(0); pointer-events: auto; z-index: 10; }
    .slide.exit-left { opacity: 0; transform: translateX(-60px); pointer-events: none; }

    /* ── LEARN MODE ── */
    .phrase-text {
      font-family: 'Space Grotesk', sans-serif; font-weight: 800;
      line-height: 1.25; text-align: center; color: #e5e5e7;
      text-transform: uppercase; letter-spacing: -.025em;
      width: 100%;
    }
 .phrase-text.size-small  { font-size: clamp(2.6rem, 6.5vw, 4.8rem); }
.phrase-text.size-medium { font-size: clamp(1.9rem, 5vw, 3.4rem); }
.phrase-text.size-large  { font-size: clamp(1.4rem, 3.6vw, 2.5rem); }

    .phrase-text .hl {
      background: linear-gradient(135deg, #C9A961 0%, #FFD700 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; font-weight: 900;
    }
    .phrase-text .verb-word {
      font-weight: 900;
      color: var(--verb-color, var(--gold));
      -webkit-text-fill-color: var(--verb-color, var(--gold));
    }
    .phrase-text .particle {
      font-weight: 900; text-decoration: underline;
      text-underline-offset: 4px; text-decoration-thickness: 2px;
      color: var(--verb-color, var(--gold));
      -webkit-text-fill-color: var(--verb-color, var(--gold));
      transition: filter .25s, opacity .25s;
    }

    .meaning-text {
      font-family: 'DM Sans', sans-serif; font-size: clamp(.82rem, 1.7vw, .98rem);
      line-height: 1.75; color: rgba(229,229,231,.55); text-align: center; max-width: 560px;
    }

    /* quiz uses .phrase-text + size classes */
    .quiz-blank {
      display: inline-block; min-width: 80px; border-bottom: 2px solid var(--mode-accent);
      color: var(--mode-accent); font-weight: 900;
      text-align: center; padding: 0 6px; transition: all .3s;
    }
    .quiz-blank.revealed { border-bottom-color: transparent; }

    .quiz-opts {
      display: flex; flex-wrap: wrap; justify-content: center;
      gap: .4rem; width: 100%; max-width: 520px;
    }
    .qopt {
      font-family: 'Space Grotesk', sans-serif; font-size: .6rem;
      font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
      padding: .38rem .9rem; border-radius: 999px;
      background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.1);
      color: rgba(229,229,231,.5); cursor: pointer; transition: all .18s; text-align: center;
      white-space: nowrap;
    }
    .qopt:hover:not(.locked) {
      background: rgba(var(--mode-accent-rgb), .1);
      border-color: rgba(var(--mode-accent-rgb), .4);
      color: var(--mode-accent);
    }
    .qopt.locked { cursor: default; }
    .qopt.correct {
      background: rgba(77,201,138,.15); border-color: rgba(77,201,138,.5);
      color: #4DC98A; animation: optPop .28s ease;
    }
    .qopt.wrong {
      background: rgba(224,85,85,.1); border-color: rgba(224,85,85,.3);
      color: rgba(224,85,85,.5); text-decoration: line-through;
      animation: optShake .35s ease;
    }
    .qopt.reveal {
      background: rgba(77,201,138,.08); border-color: rgba(77,201,138,.3);
      color: rgba(77,201,138,.7);
    }
    @keyframes optPop   { 0%{transform:scale(1)} 40%{transform:scale(1.04)} 100%{transform:scale(1)} }
    @keyframes optShake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 60%{transform:translateX(6px)} }

    /* gap uses .phrase-text + size classes */
    .gap-blank-marker {
      color: var(--mode-accent); font-weight: 900;
    }
    .gap-input-wrap { display: flex; flex-direction: column; align-items: center; gap: .65rem; }
    .gap-input {
      font-family: 'Space Grotesk', sans-serif; font-size: 1.6rem; font-weight: 900;
      letter-spacing: .06em; text-transform: uppercase;
      background: transparent; border: none; border-bottom: 2px solid var(--mode-accent);
      color: var(--mode-accent); text-align: center; width: 200px; outline: none;
      padding: .35rem 0; caret-color: var(--mode-accent);
      transition: border-color .2s, color .2s;
    }
    .gap-input::placeholder {
      color: rgba(229,229,231,.2); font-size: .9rem; text-transform: none;
      font-family: 'DM Sans', sans-serif; font-weight: 400; letter-spacing: 0;
    }
    .gap-input.correct { border-bottom-color: #4DC98A; color: #4DC98A; }
    .gap-input.wrong   { border-bottom-color: #E05555; color: #E05555; animation: optShake .35s ease; }
    .gap-hint {
      font-family: 'DM Sans', sans-serif; font-size: .78rem; font-weight: 600;
      letter-spacing: .1em; text-transform: uppercase; color: rgba(229,229,231,.25);
      min-height: 1.2rem; transition: color .2s;
    }
    .gap-hint.show-answer { color: var(--mode-accent); }

    /* Feedback bar — shared by quiz & gap */
    .fb-bar {
      height: 0; overflow: hidden; display: flex; align-items: center;
      gap: .6rem; padding: 0 1.2rem;
      transition: height .22s cubic-bezier(.22,1,.36,1);
      border-top: none; font-size: .88rem; color: rgba(229,229,231,.7);
      position: absolute; bottom: 54px; left: 0; right: 0;
    }
    .fb-bar.show { height: 40px; border-top: 1px solid rgba(255,255,255,.06); }
    .fb-icon { font-size: .9rem; flex-shrink: 0; }
    .fb-text strong { color: #e5e5e7; font-weight: 700; }

    /* Section label (x-ray) */
    .section-label {
      position: absolute; top: .85rem; left: 50%; transform: translateX(-50%);
      font-family: 'DM Sans', sans-serif; font-size: .54rem; font-weight: 700;
      letter-spacing: .18em; text-transform: uppercase; color: var(--gold);
      opacity: 0; transition: opacity .3s; pointer-events: none; white-space: nowrap; z-index: 20;
    }
    .section-label.visible { opacity: .75; }

    .hold-hint {
      position: absolute; bottom: 3.8rem; left: 50%; transform: translateX(-50%);
      font-family: 'DM Sans', sans-serif; font-size: .5rem; font-weight: 600;
      letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.13);
      pointer-events: none; transition: opacity .8s; white-space: nowrap; z-index: 5;
    }
    .hold-hint.hidden { opacity: 0; }

    /* Nav arrows */
    .nav-arrows {
      position: absolute; top: 50%; left: 0; right: 0; transform: translateY(-50%);
      display: flex; justify-content: space-between; padding: 0 .7rem;
      pointer-events: none; z-index: 20;
    }
    .arrow-btn {
      pointer-events: all; width: 42px; height: 42px; border-radius: 50%;
      background: rgba(201,169,97,.18); border: 1px solid rgba(201,169,97,.35);
      color: var(--gold); font-size: 1.1rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all .25s;
    }
    .arrow-btn:hover:not(:disabled) { background: rgba(201,169,97,.32); transform: scale(1.12); }
    .arrow-btn:disabled { opacity: .18; cursor: not-allowed; }

    /* Dot nav */
    .dot-nav {
      height: 54px; display: flex; align-items: center; justify-content: center;
      gap: .5rem; background: rgba(0,0,0,.22); border-top: 1px solid rgba(255,255,255,.04);
      flex-wrap: wrap; padding: 0 1rem;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: rgba(99,99,102,.32); cursor: pointer; transition: all .3s; flex-shrink: 0;
      border: none;
    }
    .dot.active {
      background: var(--verb-color, var(--gold)); transform: scale(1.45);
      box-shadow: 0 0 10px rgba(var(--verb-rgb, 201,169,97), .5);
    }
    .dot.ok  { background: #4DC98A; opacity: .75; }
    .dot.err { background: #E05555; opacity: .65; }
    .dot:hover:not(.active) { background: rgba(var(--verb-rgb, 201,169,97), .45); }

    /* ── BOTTOM BAR ── */
    .bottom-bar {
      position: fixed; bottom: 0; left: 0; right: 0; height: 80px;
      padding: .65rem 1.25rem .85rem;
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
      background: rgba(13,13,13,.88); backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255,255,255,.06);
    }
    .bottom-bar { height: 34px; padding: .3rem 1rem; }
  .score-row { display: flex; align-items: center; gap: .85rem; flex-shrink: 0; }
    .score-item {
      font-family: 'DM Sans', sans-serif; font-size: .7rem; font-weight: 700;
      display: flex; align-items: center; gap: .35rem; color: rgba(229,229,231,.35);
    }
    .score-dot { width: 7px; height: 7px; border-radius: 50%; }
    .score-dot.ok  { background: #4DC98A; }
    .score-dot.bad { background: #E05555; }
    .score-num { font-variant-numeric: tabular-nums; }

    .check-btn {
      font-family: 'Space Grotesk', sans-serif; font-size: .58rem; font-weight: 700;
      letter-spacing: .12em; text-transform: uppercase;
      padding: .5rem 1.4rem; border-radius: 999px;
      background: rgba(var(--mode-accent-rgb), .1);
      border: 1px solid rgba(var(--mode-accent-rgb), .35);
      color: var(--mode-accent); cursor: pointer; transition: all .18s;
      display: none;
    }
    .check-btn:hover { background: rgba(var(--mode-accent-rgb), .25); }
    .check-btn:disabled { opacity: .3; cursor: not-allowed; }

    .auto-row { display: flex; align-items: center; gap: .5rem; cursor: pointer; flex-shrink: 0; }
    .auto-label {
      font-family: 'Space Grotesk', sans-serif; font-size: .52rem; font-weight: 700;
      letter-spacing: .1em; text-transform: uppercase; color: rgba(255,255,255,.26); transition: color .3s;
    }
    .auto-row.on .auto-label { color: rgba(255,255,255,.7); }
    .switch {
      width: 38px; height: 21px; border-radius: 999px;
      background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1);
      position: relative; transition: all .3s;
    }
    .auto-row.on .switch { background: rgba(201,169,97,.22); border-color: var(--gold); }
    .switch::after {
      content: ''; position: absolute; top: 2px; left: 2px;
      width: 15px; height: 15px; border-radius: 50%;
      background: rgba(255,255,255,.32); transition: transform .3s, background .3s;
    }
    .auto-row.on .switch::after { transform: translateX(17px); background: var(--gold); }

    /* Progress bar */
    .progress { position: fixed; bottom: 80px; left: 0; right: 0; height: 2px; background: rgba(255,255,255,.04); z-index: 50; }
    .progress-fill { height: 100%; background: var(--verb-color, var(--gold)); width: 0%; transition: background .4s; }

    /* Loading */
    .loading-screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #0d0d0d; z-index: 999; transition: opacity .6s; }
    .loading-screen.fade { opacity: 0; pointer-events: none; }
    .ld { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); animation: ld 1.2s ease-in-out infinite; }
    @keyframes ld { 0%,100%{opacity:.2;transform:scale(.7)} 50%{opacity:1;transform:scale(1.3)} }

    /* ── RESULTS OVERLAY ── */
    .overlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(8,8,8,.97); backdrop-filter: blur(28px);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity .45s; overflow-y: auto;
    }
    .overlay.show { opacity: 1; pointer-events: all; }
    .ov-inner {
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      padding: 28px 20px 32px; max-width: 460px; width: 100%; position: relative; z-index: 1;
    }
    .ov-perfect {
      font-family: 'Space Grotesk', sans-serif; font-size: .62rem; font-weight: 700;
      letter-spacing: .22em; text-transform: uppercase; color: var(--gold);
      background: rgba(201,169,97,.12); border: 1px solid rgba(201,169,97,.4);
      padding: .38rem 1.1rem; border-radius: 999px; display: none;
    }
    .ov-perfect.show { display: block; animation: pulseBadge 1.8s ease-in-out infinite; }
    @keyframes pulseBadge { 0%,100%{box-shadow:0 0 0 0 rgba(201,169,97,.4)} 50%{box-shadow:0 0 0 10px rgba(201,169,97,0)} }
    .ov-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(48px,13vw,84px); font-weight: 900; letter-spacing: -.03em;
      color: var(--verb-color, var(--gold)); line-height: 1;
    }
    .overlay.show .ov-title { animation: popIn .5s cubic-bezier(.34,1.56,.64,1) forwards; }
    @keyframes popIn { 0%{transform:scale(.7);opacity:0} 70%{transform:scale(1.06)} 100%{transform:scale(1);opacity:1} }
    .ov-score { font-family: 'DM Sans', sans-serif; font-size: 1rem; letter-spacing: .05em; color: rgba(229,229,231,.6); }
    .ov-stars { display: flex; gap: 6px; font-size: 28px; }
    @keyframes starPop { 0%{transform:scale(0) rotate(-20deg);opacity:0} 70%{transform:scale(1.25) rotate(5deg)} 100%{transform:scale(1) rotate(0deg);opacity:1} }
    .ov-star { opacity: 0; }
    .overlay.show .ov-star:nth-child(1) { animation: starPop .4s cubic-bezier(.34,1.56,.64,1) .2s forwards; }
    .overlay.show .ov-star:nth-child(2) { animation: starPop .4s cubic-bezier(.34,1.56,.64,1) .35s forwards; }
    .overlay.show .ov-star:nth-child(3) { animation: starPop .4s cubic-bezier(.34,1.56,.64,1) .5s forwards; }
    .ov-bars { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; max-width: 300px; }
    .ov-bar { flex: 1; min-width: 14px; max-width: 28px; height: 36px; border-radius: 5px; }
    .ov-msg { font-size: .85rem; color: rgba(229,229,231,.4); max-width: 300px; text-align: center; line-height: 1.75; }
    .ov-answers {
      width: 100%; max-height: 220px; overflow-y: auto;
      background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.07);
      border-radius: .85rem; padding: .5rem;
      scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.1) transparent;
    }
    .ov-answers::-webkit-scrollbar { width: 4px; }
    .ov-answers::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 4px; }
    .ov-answer-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: .45rem .75rem; border-radius: .5rem; margin-bottom: .22rem;
      border-left: 3px solid transparent;
      opacity: 0; transform: translateX(-8px);
      animation: slideInA .35s ease forwards;
    }
    .ov-answer-item:last-child { margin-bottom: 0; }
    @keyframes slideInA { to { opacity: 1; transform: translateX(0); } }
    .ov-answer-item.ok  { background: rgba(77,201,138,.07); border-left-color: #4DC98A; }
    .ov-answer-item.err { background: rgba(224,85,85,.07);  border-left-color: #E05555; }
    .ov-answer-verb {
      font-family: 'Space Grotesk', sans-serif; font-size: .7rem; font-weight: 700;
      letter-spacing: .06em; text-transform: uppercase;
    }
    .ov-answer-item.ok  .ov-answer-verb { color: #4DC98A; }
    .ov-answer-item.err .ov-answer-verb { color: #E05555; }
    .ov-answer-meaning {

<body>

<div class="loading-screen" id="loadingScreen"><div class="ld"></div></div>

<header class="header">
  <div class="header-top">
    <a class='back-link' href='/?openModal=grammar'>← Grammar</a>
    <div class="header-title">
      <div class="app-title">INTUITY</div>
      <div class="app-subtitle">Phrasal Verbs</div>
    </div>
    <div class="header-spacer" aria-hidden="true"></div>
  </div>
  <div class="mode-selector">
    <button class="mode-btn" data-mode="learn">
      <span class="mode-icon">✎</span><span class="mode-label">Learn</span><span class="mode-badge" id="badge-learn">–</span>
    </button>
    <button class="mode-btn active" data-mode="quiz">
      <span class="mode-icon">⚡</span><span class="mode-label">Quiz</span><span class="mode-badge" id="badge-quiz">–</span>
    </button>
    <button class="mode-btn" data-mode="gap">
      <span class="mode-icon">✍</span><span class="mode-label">Practice</span><span class="mode-badge" id="badge-gap">–</span>
    </button>
    <button class="mode-btn" data-mode="match">
      <span class="mode-icon">🔗</span><span class="mode-label">Match</span><span class="mode-badge" id="badge-match">–</span>
    </button>
  </div>
  <div class="verb-tabs" id="verbTabs"></div>
</header>

<div class="stage" id="stage">
  <div class="slide-card" id="slideCard">
    <div class="section-label" id="sectionLabel"></div>
    <div class="slides-container" id="slidesContainer"></div>
    <div class="nav-arrows">
      <button class="arrow-btn" id="prevBtn">←</button>
      <button class="arrow-btn" id="nextBtn">→</button>
    </div>
    <div class="hold-hint" id="holdHint">Hold for verb ID</div>
    <div class="dot-nav" id="dotNav"></div>
  </div>
</div>

<div class="progress"><div class="progress-fill" id="progressFill"></div></div>

<div class="bottom-bar">
  <div class="score-row">
    <div class="score-item"><div class="score-dot ok"></div><span class="score-num" id="scoreOk">0</span></div>
    <div class="score-item"><div class="score-dot bad"></div><span class="score-num" id="scoreErr">0</span></div>
  </div>
  <button class="check-btn" id="checkBtn" onclick="handleCheck()">Check</button>
  <div class="auto-row" id="autoRow">
    <span class="auto-label">Auto</span>
    <div class="switch"></div>
  </div>
</div>

<!-- RESULTS OVERLAY -->
<div class="overlay" id="overlay">
  <canvas id="confettiCanvas" style="position:fixed;inset:0;pointer-events:none;z-index:0;"></canvas>
  <div class="ov-inner">
    <div class="ov-perfect" id="ovPerfect">✦ Perfect Score ✦</div>
    <div class="ov-title" id="ovTitle">Done</div>
    <div class="ov-score" id="ovScore"></div>
    <div class="ov-stars" id="ovStars"></div>
    <div class="ov-bars" id="ovBars"></div>
    <div class="ov-msg" id="ovMsg"></div>
    <!-- Answer list -->
    <div class="ov-answers" id="ovAnswers"></div>
    <div class="ov-btns">
      <button class="ov-btn primary" onclick="restart()">↺ Retry</button>
      <button class="ov-btn ghost" onclick="closeOverlay()">Review</button>
    </div>
  </div>
</div>

<!-- Award popup for perfect score -->
<div class="award-popup" id="awardPopup">
  <div class="award-inner">🏆</div>
</div>

<div class="streak-flash" id="streakFlash"></div>

<script>
const DATA_URL = 'phrasal-verbs-data.json';
const GAME_DATA_URL = 'game-data.json';
const AUTO_MS  = 5500;

/* ── STATE ── */
let verbs     = [];          // all verb groups from JSON
let verbIdx   = 0;           // active verb index
let slides    = [];          // built slide list for active verb + mode
let current   = 0;
let prev      = -1;
let mode      = 'quiz';      // opens in Quiz mode — more engaging on first visit
let autoOn    = false;
let autoTimer = null;
let xray      = false;
let xrayDone  = false;
let longTimer = null;
let busy      = false;
let results   = {};          // key: `verbIdx_itemIndex` → 'ok'|'err'
let scoreOk   = 0;
let scoreErr  = 0;
let streak    = 0;
let answered  = false;
let gapChecked = false;
let reviewMode = false;

/* ── MATCH MODE STATE ── */
let gameRounds  = [];
let gameLoaded  = false;
let roundIdx    = 0;
let roundResults = {};   // roundIdx -> 'perfect'
let matchSelectedId = null;   // id of the currently-selected chip in this round
let matchAnswers = {};        // slotId -> chipId placed there (this round, pre-check)
let matchChecked = false;     // has this round been checked/scored

/* ── LOAD ── */
async function loadAll() {
  const data = await fetch(DATA_URL).then(r => r.json());
  verbs = data.verbs;
  buildTabs();
  applyVerbTheme();
  applyModeAccent();
  build();
  document.getElementById('loadingScreen').classList.add('fade');
  setTimeout(() => {
    document.getElementById('loadingScreen').style.display = 'none';
    paint();
    show(0, 'none');
    updateModeBadges();
  }, 600);
}

/* ── STABLE ITEM KEY ── (index-based, not particle text — avoids collisions
   when two items in the same verb share a particle, and survives shuffles) */
function itemKey(vIdx, item) {
  return vIdx + '_' + verbs[vIdx].items.indexOf(item);
}

/* ── TABS ── */
function buildTabs() {
  const wrap = document.getElementById('verbTabs');
  wrap.innerHTML = '';
  verbs.forEach((v, i) => {
    const btn = document.createElement('button');
    btn.className = 'vtab' + (i === verbIdx ? ' active' : '');
    btn.textContent = v.label;
    btn.style.setProperty('--verb-color', v.color);
    btn.style.setProperty('--verb-rgb', v.colorRgb);
    btn.addEventListener('click', e => { e.stopPropagation(); switchVerb(i); });
    wrap.appendChild(btn);
  });
}

function applyVerbTheme() {
  const v = verbs[verbIdx];
  document.documentElement.style.setProperty('--verb-color', v.color);
  document.documentElement.style.setProperty('--verb-rgb', v.colorRgb);
}

function switchVerb(i) {
  verbIdx = i;
  current = 0; prev = -1; answered = false; gapChecked = false;
  // Clear per-verb results so previous runs never bleed into new session
  reviewMode = false;
  results = {}; scoreOk = 0; scoreErr = 0; streak = 0;
  document.getElementById('scoreOk').textContent  = 0;
  document.getElementById('scoreErr').textContent = 0;
  document.querySelectorAll('.vtab').forEach((b, j) => b.classList.toggle('active', j === i));
  applyVerbTheme();
  build(); paint(); show(0, 'none'); resetAuto();
  updateCheckBtn(); updateModeBadges();
}

/* ── BUILD ── */
function build() {
  const verb = verbs[verbIdx];
  slides = [];
  if (mode === 'learn') {
    verb.items.forEach((item, idx) => slides.push({ type: 'learn', idx, item }));
  } else if (mode === 'quiz') {
    shuffled(verb.items).forEach((item, idx) => slides.push({ type: 'quiz', idx, item }));
  } else {
    shuffled(verb.items).forEach((item, idx) => slides.push({ type: 'gap', idx, item }));
  }
  current = 0; prev = -1; answered = false; gapChecked = false;
}

/* ── PAINT DOM ── */
function paint() {
  const container = document.getElementById('slidesContainer');
  const dotNav    = document.getElementById('dotNav');

  container.innerHTML = slides.map((s, i) => {
    return `<div class="slide" data-idx="${i}">${renderSlideInner(s)}</div>`;
  }).join('');

  dotNav.innerHTML = slides.map((s, i) => {
    const key = itemKey(verbIdx, s.item);
    const r = results[key];
    let cls = 'dot';
    if (r === 'ok')  cls += ' ok';
    if (r === 'err') cls += ' err';
    return `<div class="${cls}" data-dot="${i}"></div>`;
  }).join('');

  dotNav.querySelectorAll('.dot').forEach(d =>
    d.addEventListener('click', e => { e.stopPropagation(); jump(+d.dataset.dot); })
  );

  attachLearnMaskHandlers();
}

function renderSlideInner(s) {
  const { item } = s;
  if (s.type === 'learn') {
    return renderLearn(item);
  } else if (s.type === 'quiz') {
    return renderQuiz(item);
  } else {
    return renderGap(item);
  }
}

/* ── LEARN ── */
function renderLearn(item) {
  const particleUpper = item.particle.toUpperCase();
  const verbWord = verbs[verbIdx].id.toUpperCase();
  const posterHtml = item.example
    .toUpperCase()
    .replace('_____', `<span class="verb-word">${verbWord}</span> <span class="particle" data-particle-toggle>${particleUpper}</span>`);

  const wordCount = item.example.split(/\s+/).length;
  const size = wordCount <= 8 ? 'size-small' : wordCount <= 16 ? 'size-medium' : 'size-large';

  return `
    <div class="phrase-text ${size}">${posterHtml}</div>
    <div class="meaning-text">${item.meaning}</div>`;
}

function attachLearnMaskHandlers() {}

/* ── QUIZ ── */
function renderQuiz(item) {
  const opts = shuffled([...item.options]);
  const wordCount = item.example.split(/\s+/).length;
  const size = wordCount <= 8 ? 'size-small' : wordCount <= 16 ? 'size-medium' : 'size-large';
  const verbWord = verbs[verbIdx].id.toUpperCase();
  const sentHtml = item.example.toUpperCase().replace('_____',
    `<span class="verb-word">${verbWord}</span> <span class="quiz-blank" id="blankSpan">?</span>`);
  return `
    <div class="phrase-text ${size}">${sentHtml}</div>
    <div class="quiz-opts">
      ${opts.map((o) => `
        <button class="qopt" data-opt="${o}" onclick="chooseOpt('${o.replace(/'/g,"\\'")}','${item.particle.replace(/'/g,"\\'")}',this)">
          ${o.toUpperCase()}
        </button>`).join('')}
    </div>
    <div class="fb-bar" id="fbBar">
      <span class="fb-icon" id="fbIcon"></span>
      <span id="fbText" class="fb-text"></span>
    </div>`;
}

/* ── GAP ── */
function renderGap(item) {
  const wordCount = item.example.split(/\s+/).length;
  const size = wordCount <= 8 ? 'size-small' : wordCount <= 16 ? 'size-medium' : 'size-large';
  const verbWord = verbs[verbIdx].id.toUpperCase();
  const sentHtml = item.example.toUpperCase().replace('_____',
    `<span class="verb-word">${verbWord}</span> <span class="gap-blank-marker">_____</span>`);
  return `
    <div class="phrase-text ${size}">${sentHtml}</div>
    <div class="gap-input-wrap">
      <input class="gap-input" id="gapInput" type="text" placeholder="type the particle…"
        autocomplete="off" autocorrect="off" spellcheck="false"
        onkeydown="if(event.key==='Enter')handleCheck()">
      <div class="gap-hint" id="gapHint">type the missing particle — press Check below</div>
    </div>
    <div class="fb-bar" id="fbBar">
      <span class="fb-icon" id="fbIcon"></span>
      <span id="fbText" class="fb-text"></span>
    </div>`;
}

/* ── SHOW ── */
function show(idx, dir) {
  if (!slides.length) return;
  const els  = document.querySelectorAll('.slide');
  const dots = document.querySelectorAll('.dot');

  if (prev >= 0 && prev !== idx && els[prev]) {
    els[prev].classList.remove('active');
    if (dir !== 'none') {
      els[prev].classList.add('exit-left');
      setTimeout(() => els[prev]?.classList.remove('exit-left'), 480);
    }
  }
  if (els[idx]) {
    if (!reviewMode) {
      els[idx].querySelectorAll('.qopt').forEach(b => {
        b.classList.remove('correct', 'wrong', 'reveal', 'locked');
      });
      const incomingBlank = els[idx].querySelector('.quiz-blank');
      if (incomingBlank) { incomingBlank.textContent = '?'; incomingBlank.classList.remove('revealed'); }
      const incomingFb = els[idx].querySelector('.fb-bar');
      if (incomingFb) incomingFb.classList.remove('show');
      const incomingInput = els[idx].querySelector('.gap-input');
      if (incomingInput) { incomingInput.classList.remove('correct','wrong'); incomingInput.disabled = false; incomingInput.value = ''; }
      const incomingHint = els[idx].querySelector('.gap-hint');
      if (incomingHint) { incomingHint.textContent = 'type the missing particle — press Check below'; incomingHint.classList.remove('show-answer'); }
    }

    if (dir === 'forward')  els[idx].style.cssText = 'transform:translateX(60px);opacity:0';
    else if (dir === 'back') els[idx].style.cssText = 'transform:translateX(-60px);opacity:0';
    else                     els[idx].style.cssText = '';
    requestAnimationFrame(() => requestAnimationFrame(() => {
      els[idx].classList.add('active');
      els[idx].style.cssText = '';
      if (mode === 'gap') {
        const inp = els[idx].querySelector('.gap-input');
        if (inp) setTimeout(() => inp.focus(), 80);
      }
    }));
  }

  dots.forEach((d, i) => d.classList.toggle('active', i === idx));
  document.getElementById('prevBtn').disabled = idx === 0;
  document.getElementById('nextBtn').disabled = idx === slides.length - 1;

  const s = slides[idx];
  document.getElementById('sectionLabel').textContent =
    s ? (verbs[verbIdx].id + ' ' + s.item.particle).toUpperCase() : '';

  updateProgress();
  updateCheckBtn();
  prev = idx; current = idx;
}

/* ── QUIZ ANSWER ── */
function chooseOpt(chosen, correct, btn) {
  if (answered) return;
  answered = true;
  const isOk = chosen === correct;
  const blank = document.getElementById('blankSpan');
  document.querySelectorAll('.qopt').forEach(b => {
    b.classList.add('locked');
    const opt = b.dataset.opt;
    if (isOk && opt === chosen) b.classList.add('correct');
    else if (opt === chosen && !isOk) b.classList.add('wrong');
  });
  if (blank) {
    if (isOk) { blank.textContent = correct.toUpperCase(); blank.classList.add('revealed'); }
  }
  recordResult(isOk);
  showFeedback(isOk, correct);
  if (isOk) setTimeout(() => next(), 1300);
  else setTimeout(() => next(), 1000);
}

/* ── GAP CHECK ── */
function handleCheck() {
  if (mode !== 'gap' || gapChecked) return;
  const inp = document.getElementById('gapInput');
  if (!inp) return;
  const val = inp.value.trim().toLowerCase();
  const correct = slides[current].item.particle.toLowerCase();
  const isOk = val === correct;
  gapChecked = true;
  inp.classList.add(isOk ? 'correct' : 'wrong');
  inp.disabled = true;
  const hint = document.getElementById('gapHint');
  if (!isOk && hint) { hint.textContent = 'Not quite — check the results at the end'; hint.classList.remove('show-answer'); }
  recordResult(isOk);
  showFeedback(isOk, slides[current].item.particle);
  document.getElementById('checkBtn').style.display = 'none';
  if (isOk) setTimeout(() => next(), 1300);
  else setTimeout(() => next(), 1000);
}

/* ── RESULTS & FEEDBACK ── */
function recordResult(isOk) {
  const key = itemKey(verbIdx, slides[current].item);
  results[key] = isOk ? 'ok' : 'err';
  recalcScore();
  refreshDots();
  updateProgress();
  updateModeBadges();
  if (isOk) { streak++; if (streak > 0 && streak % 3 === 0) showStreak(); }
  else streak = 0;
}

function recalcScore() {
  scoreOk = 0; scoreErr = 0;
  Object.values(results).forEach(r => { if (r === 'ok') scoreOk++; else if (r === 'err') scoreErr++; });
  document.getElementById('scoreOk').textContent  = scoreOk;
  document.getElementById('scoreErr').textContent = scoreErr;
}

function showFeedback(isOk, particle) {
  const bar  = document.getElementById('fbBar');
  const icon = document.getElementById('fbIcon');
  const text = document.getElementById('fbText');
  if (!bar) return;
  bar.classList.add('show');
  icon.textContent = isOk ? '✓' : '✗';
  icon.style.color = isOk ? '#4DC98A' : '#E05555';
  if (isOk) {
    const verb = verbs[verbIdx];
    const full = verb.id + ' ' + particle;
    const meaning = slides[current]?.item?.meaning || '';
    text.innerHTML = `<strong>${full.toUpperCase()}</strong>${meaning ? ' — ' + meaning : ''}`;
  } else {
    text.innerHTML = '<span style="color:rgba(229,229,231,.35);font-size:.82rem">Keep going — review at the end</span>';
  }
}

function showStreak() {
  const el = document.getElementById('streakFlash');
  const msgs = ['🔥 ' + streak + ' in a row!', '⚡ ' + streak + ' streak!', '✨ ' + streak + ' correct!'];
  el.textContent = msgs[Math.floor(Math.random() * msgs.length)];
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

/* ── NAV ── */
function next() {
  if (mode === 'match') {
    if (roundIdx < gameRounds.length - 1) switchRound(roundIdx + 1);
    return;
  }
  if (busy) return;
  if (current >= slides.length - 1) {
    if (mode !== 'learn') {
      const allAttempted = slides.every(s => results[itemKey(verbIdx, s.item)]);
      if (allAttempted) { showResults(); return; }
    }
    return;
  }
  busy = true; answered = false; gapChecked = false;
  show(current + 1, 'forward');
  setTimeout(() => busy = false, 480);
  resetAuto(); updateCheckBtn();
}
function back() {
  if (mode === 'match') {
    if (roundIdx > 0) switchRound(roundIdx - 1);
    return;
  }
  if (busy || current <= 0) return;
  busy = true; answered = false; gapChecked = false;
  show(current - 1, 'back');
  setTimeout(() => busy = false, 480);
  resetAuto(); updateCheckBtn();
}
function jump(idx) {
  if (busy) return;
  busy = true; answered = false; gapChecked = false;
  show(idx, idx > current ? 'forward' : 'back');
  setTimeout(() => busy = false, 480);
  resetAuto(); updateCheckBtn();
}

/* ── RESULTS OVERLAY (learn/quiz/gap) ── */
function showResults() {
  const verb = verbs[verbIdx];
  const total = verb.items.length;
  let ok = 0;
  verb.items.forEach(item => {
    if (results[itemKey(verbIdx, item)] === 'ok') ok++;
  });
  const pct = Math.round(ok / total * 100);
  const perfect = pct === 100;

  document.getElementById('ovTitle').textContent = perfect ? 'Perfect!' : pct >= 80 ? 'Brilliant' : pct >= 60 ? 'Good' : 'Keep Going';
  document.getElementById('ovScore').textContent  = ok + ' / ' + total + ' · ' + pct + '%';
  document.getElementById('ovPerfect').classList.toggle('show', perfect);

  const stars = pct >= 90 ? 3 : pct >= 70 ? 2 : pct >= 50 ? 1 : 0;
  document.getElementById('ovStars').innerHTML = Array.from({length:3},(_,i) =>
    `<span class="ov-star">${i < stars ? '★' : '☆'}</span>`).join('');

  document.getElementById('ovBars').innerHTML = verb.items.map(item => {
    const r = results[itemKey(verbIdx, item)];
    const bg = r === 'ok' ? '#4DC98A' : r === 'err' ? '#E05555' : 'rgba(255,255,255,.1)';
    return `<div class="ov-bar" style="background:${bg}"></div>`;
  }).join('');

  document.getElementById('ovMsg').textContent = perfect
    ? "Absolutely flawless. You've mastered this set!"
    : pct >= 80 ? 'Excellent. Review the red ones and try again.'
    : pct >= 60 ? 'Solid work. Try Learn mode on the missed ones.'
    : 'Go back to Learn mode to build the pattern first.';

  document.getElementById('ovAnswers').innerHTML = verb.items.map((item, i) => {
    const r = results[itemKey(verbIdx, item)] || 'unanswered';
    const cls = r === 'ok' ? 'ok' : 'err';
    const tick = r === 'ok' ? '✓' : '✗';
    const delay = i * 40;
    return `<div class="ov-answer-item ${cls}" style="animation-delay:${delay}ms">
      <span class="ov-answer-verb">${verb.id.toUpperCase()} ${item.particle.toUpperCase()}</span>
      <span class="ov-answer-meaning">${item.meaning}</span>
      <span class="ov-answer-tick">${tick}</span>
    </div>`;
  }).join('');

  updateTabScore(verbIdx, pct);

  document.getElementById('overlay').classList.add('show');

  if (perfect) {
    triggerConfetti();
    setTimeout(() => showAwardPopup(), 300);
  }
}

function updateTabScore(idx, pct) {
  const tabs = document.querySelectorAll('.vtab');
  if (!tabs[idx]) return;
  tabs[idx].classList.remove('score-perfect','score-great','score-ok','score-poor');
  if (pct === 100)      tabs[idx].classList.add('score-perfect');
  else if (pct >= 80)   tabs[idx].classList.add('score-great');
  else if (pct >= 50)   tabs[idx].classList.add('score-ok');
  else                  tabs[idx].classList.add('score-poor');
}

function showAwardPopup() {
  const popup = document.getElementById('awardPopup');
  popup.classList.add('show');
  setTimeout(() => popup.classList.remove('show'), 2200);
}

/* ── CONFETTI ── */
let confettiAnim = null;
let confettiParticles = [];

function triggerConfetti() {
  const canvas = document.getElementById('confettiCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  confettiParticles = Array.from({length: 120}, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height - canvas.height,
    r: Math.random() * 6 + 3,
    d: Math.random() * 6 + 2,
    color: ['#C9A961','#FFD060','#4DC98A','#5B9BD5','#c94f6d','#fff'][Math.floor(Math.random()*6)],
    tilt: Math.random() * 10 - 10,
    tiltAngle: 0,
    tiltAngleInc: Math.random() * 0.07 + 0.05
  }));
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    confettiParticles.forEach(p => {
      p.tiltAngle += p.tiltAngleInc; p.y += p.d; p.tilt = Math.sin(p.tiltAngle) * 15;
      if (p.y > canvas.height) { p.y = -20; p.x = Math.random() * canvas.width; }
      ctx.beginPath(); ctx.lineWidth = p.r / 2; ctx.strokeStyle = p.color;
      ctx.moveTo(p.x + p.tilt + p.r/4, p.y);
      ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r/4); ctx.stroke();
    });
    confettiAnim = requestAnimationFrame(draw);
  }
  draw();
  setTimeout(stopConfetti, 5000);
}

function stopConfetti() {
  if (confettiAnim) { cancelAnimationFrame(confettiAnim); confettiAnim = null; }
  const canvas = document.getElementById('confettiCanvas');
  canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
}

function restart() {
  document.getElementById('overlay').classList.remove('show');
  stopConfetti();

  if (mode === 'match') {
    roundResults = {};
    matchChecked = false; matchAnswers = {}; matchSelectedId = null;
    buildRoundTabs();
    renderMatchRound();
    updateModeBadges();
    return;
  }

  reviewMode = false;
  results = {}; scoreOk = 0; scoreErr = 0; streak = 0;
  document.getElementById('scoreOk').textContent = 0;
  document.getElementById('scoreErr').textContent = 0;
  build(); paint(); show(0, 'none'); resetAuto(); updateCheckBtn(); updateModeBadges();
}

function closeOverlay() {
  document.getElementById('overlay').classList.remove('show');
  stopConfetti();
  if (mode === 'match') return; // match round already shows its checked state inline
  reviewMode = true;
  paintReview();
  show(0, 'none');
  updateCheckBtn();
}

function paintReview() {
  const container = document.getElementById('slidesContainer');
  container.innerHTML = slides.map((s, i) => {
    return `<div class="slide" data-idx="${i}">${renderReview(s)}</div>`;
  }).join('');
  document.querySelectorAll('.dot').forEach(d =>
    d.addEventListener('click', e => { e.stopPropagation(); jump(+d.dataset.dot); })
  );
}

function renderReview(s) {
  const { item } = s;
  const key = itemKey(verbIdx, item);
  const r = results[key];
  const wordCount = item.example.split(/\s+/).length;
  const size = wordCount <= 8 ? 'size-small' : wordCount <= 16 ? 'size-medium' : 'size-large';
  const resultColor = r === 'ok' ? '#4DC98A' : '#E05555';
  const tick = r === 'ok' ? '✓' : '✗';

  const verbWord = verbs[verbIdx].id.toUpperCase();
  const sentHtml = item.example.toUpperCase().replace('_____',
    `<span class="verb-word" style="color:${resultColor}">${verbWord}</span> <span style="color:${resultColor};font-weight:900;text-decoration:underline;text-underline-offset:4px">${item.particle.toUpperCase()}</span>`);

  return `
    <div class="phrase-text ${size}" style="opacity:.9">${sentHtml}</div>
    <div style="display:flex;align-items:center;gap:.6rem;margin-top:.2rem">
      <span style="font-size:1.1rem;color:${resultColor}">${tick}</span>
      <span style="font-family:'DM Sans',sans-serif;font-size:.82rem;color:rgba(229,229,231,.45);line-height:1.5">${item.meaning}</span>
    </div>`;
}

/* ── CHECK BTN (learn/quiz/gap bottom bar) ── */
function updateCheckBtn() {
  const btn = document.getElementById('checkBtn');
  if (mode === 'gap' && !gapChecked) {
    btn.style.display = '';
  } else {
    btn.style.display = 'none';
  }
}

/* ── AUTO ── */
function startAuto() {
  stopAuto();
  const fill = document.getElementById('progressFill');
  fill.style.transition = 'none'; fill.style.width = '0%';
  requestAnimationFrame(() => {
    fill.style.transition = `width ${AUTO_MS}ms linear`;
    fill.style.width = '100%';
  });
  autoTimer = setTimeout(() => {
    if (current < slides.length - 1) {
      next();
    } else {
      const allAttempted = mode === 'learn' || slides.every(s => results[itemKey(verbIdx, s.item)]);
      if (mode !== 'learn' && allAttempted) {
        showResults();
        autoOn = false;
        document.getElementById('autoRow').classList.remove('on');
        stopAuto();
        return;
      }
      build(); paint(); show(0, 'none');
    }
    if (autoOn) startAuto();
  }, AUTO_MS);
}
function stopAuto() {
  clearTimeout(autoTimer);
  const fill = document.getElementById('progressFill');
  fill.style.transition = 'none'; fill.style.width = '0%';
}
function resetAuto() { if (autoOn) startAuto(); }
function toggleAuto() {
  if (mode === 'match') return;
  autoOn = !autoOn;
  document.getElementById('autoRow').classList.toggle('on', autoOn);
  autoOn ? startAuto() : stopAuto();
}

/* ── X-RAY ── */
function showXray() {

  document.getElementById('sectionLabel').classList.add('visible');

/* ── MODE ── */
const MODE_ACCENTS = {
  learn: { color: null, rgb: null },
  quiz:  { color: '#FFD94A', rgb: '255,217,74' },
  gap:   { color: '#A8E063', rgb: '168,224,99' },
  match: { color: '#FFD94A', rgb: '255,217,74' }
};

function applyModeAccent() {
  const a = MODE_ACCENTS[mode];
  const root = document.documentElement;
  if (a.color) {
    root.style.setProperty('--mode-accent',     a.color);
    root.style.setProperty('--mode-accent-rgb', a.rgb);
  } else {
    const v = verbs[verbIdx];
    root.style.setProperty('--mode-accent',     v.color);
    root.style.setProperty('--mode-accent-rgb', v.colorRgb);

async function setMode(m) {
  const leavingMatch = (mode === 'match' && m !== 'match');
  mode = m;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
  reviewMode = false;
  results = {}; scoreOk = 0; scoreErr = 0; streak = 0;
  document.getElementById('scoreOk').textContent  = 0;
  document.getElementById('scoreErr').textContent = 0;
  document.getElementById('checkBtn').style.display = 'none';
  stopAuto(); autoOn = false;
  document.getElementById('autoRow').classList.remove('on');

  if (m === 'match') {
    document.getElementById('holdHint').classList.add('hidden');
    document.documentElement.classList.add('match-scroll');
    document.body.classList.add('match-scroll');
    document.getElementById('slideCard').classList.add('match-mode');
    document.getElementById('sectionLabel').classList.remove('visible');
    document.getElementById('dotNav').innerHTML = '';
    document.getElementById('progressFill').style.width = '0%';
    document.documentElement.style.setProperty('--verb-color', '#FFD94A');
    document.documentElement.style.setProperty('--verb-rgb', '255,217,74');
    applyModeAccent();
    await ensureGameData();
    roundIdx = 0; roundResults = {};
    matchChecked = false; matchAnswers = {}; matchSelectedId = null;
    buildRoundTabs();

    document.getElementById('slideCard').classList.remove('match-mode')
    document.documentElement.classList.remove('match-scroll');

    buildTabs();
    document.querySelectorAll('.vtab').forEach((b, j) => b.classList.toggle('active', j === verbIdx));
    applyVerbTheme();
  }
  applyModeAccent();
  build(); paint(); show(0, 'none'); resetAuto(); updateCheckBtn(); updateModeBadges();
}

/* ── MODE BADGES ── */
function updateModeBadges() {
  const matchBadge = document.getElementById('badge-match');
  if (matchBadge) {
    matchBadge.textContent = gameLoaded ? (mode === 'match' ? (roundIdx + 1) + '/' + gameRounds.length : gameRounds.length) : '–';
    matchBadge.classList.toggle('live', mode === 'match');
  }
  if (!verbs.length) return;
  const verb = verbs[verbIdx];
  const total = verb.items.length;
  ['learn', 'quiz', 'gap'].forEach(m => {
    const el = document.getElementById('badge-' + m);
    if (!el) return;
    if (m === mode) {
      const done = verb.items.filter(item => results[itemKey(verbIdx, item)]).length;
      el.textContent = done + '/' + total;
      el.classList.add('live');
    } else {
      el.textContent = total;
      el.classList.remove('live');
    }
  });
}

/* ── DOTS ── */
function refreshDots() {
  document.querySelectorAll('.dot').forEach((d, i) => {
    const s = slides[i];
    if (!s) return;
    const key = itemKey(verbIdx, s.item);
    const r = results[key];
    d.className = 'dot';
    if (i === current) d.classList.add('active');
    else if (r === 'ok') d.classList.add('ok');
    else if (r === 'err') d.classList.add('err');
  });
}

/* ── PROGRESS ── */
function updateProgress() {
  if (autoOn) return;
  const verb = verbs[verbIdx];
  const done = verb.items.filter(item => results[itemKey(verbIdx, item)]).length;
  document.getElementById('progressFill').style.width = (done / verb.items.length * 100) + '%';
}

/* ── UTILS ── */
function shuffled(a) {
  const b = [...a];
  for (let i = b.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [b[i], b[j]] = [b[j], b[i]];
  }
  return b;
}

function hexToRgb(hex) {
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  return m ? `${parseInt(m[1],16)},${parseInt(m[2],16)},${parseInt(m[3],16)}` : '255,217,74';
}

/* ── EVENTS ── */
document.getElementById('prevBtn').addEventListener('click', e => { e.stopPropagation(); back(); });
document.getElementById('nextBtn').addEventListener('click', e => { e.stopPropagation(); next(); });

const card = document.getElementById('slideCard');
let tx = 0;
card.addEventListener('touchstart', e => {
  if (mode === 'match') return;
  tx = e.touches[0].clientX;
  longTimer = setTimeout(showXray, 400);
}, {passive: true});
card.addEventListener('touchend', e => {
  if (mode === 'match') return;
  clearTimeout(longTimer); hideXray();
  const dx = e.changedTouches[0].clientX - tx;
  if (Math.abs(dx) > 50) { if (dx < 0) next(); else back(); }
}, {passive: true});
card.addEventListener('mousedown', () => { if (mode !== 'match') longTimer = setTimeout(showXray, 400); });
card.addEventListener('mouseup', () => { clearTimeout(longTimer); hideXray(); });

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); back(); }
  if (e.key === 'a' || e.key === 'A') toggleAuto();
  if (e.key === 'Enter' && mode === 'gap') handleCheck();
  if (mode === 'quiz') {
    if (e.key === '1') clickOpt(0);
    if (e.key === '2') clickOpt(1);
    if (e.key === '3') clickOpt(2);
    if (e.key === '4') clickOpt(3);
  }
});

function clickOpt(i) {
  const opts = document.querySelectorAll('.qopt');
  if (opts[i] && !opts[i].classList.contains('locked')) opts[i].click();
}

document.querySelectorAll('.mode-btn').forEach(b =>
  b.addEventListener('click', e => { e.stopPropagation(); setMode(b.dataset.mode); })
);
document.getElementById('autoRow').addEventListener('click', e => { e.stopPropagation(); toggleAuto(); });


/* ══════════════════════════════ MATCH MODE ══════════════════════════════
   Click-to-fill, scored on Check (mirrors the word-choice quiz pattern):
   1. Tap a phrase chip in the word bank → it's "selected"
   2. Tap a blank in Column A → the phrase is placed there (pre-check state,
      shown in the mode accent colour, not yet marked right/wrong)
   3. Tapping a filled blank again releases that chip back to the bank
   4. Once every blank has a chip, Check scores the whole round at once and
      shows the results overlay (reusing the existing overlay UI)
   Colour: each phrase chip carries its verb-family colour from game-data.json
   from the start (a grouping cue). Column B (the definition) stays plain
   throughout — colour only lands on Column A once an answer is placed/checked,
   so the definition itself must still be read to make the match. */

async function ensureGameData() {
  if (gameLoaded) return;
  const data = await fetch(GAME_DATA_URL).then(r => r.json());
  gameRounds = data.rounds;
  gameLoaded = true;
}

/* Round tabs reuse the .vtab strip that normally lists verbs */
function buildRoundTabs() {
  const wrap = document.getElementById('verbTabs');
  wrap.innerHTML = '';
  gameRounds.forEach((r, i) => {
    const btn = document.createElement('button');
    btn.className = 'vtab' + (i === roundIdx ? ' active' : '') + (roundResults[i] === 'perfect' ? ' score-perfect' : '');
    btn.textContent = 'R' + (i + 1);
    btn.style.setProperty('--verb-color', '#FFD94A');
    btn.style.setProperty('--verb-rgb', '255,217,74');
    btn.addEventListener('click', e => { e.stopPropagation(); switchRound(i); });
    wrap.appendChild(btn);
  });
  wrap.querySelectorAll('.vtab')[roundIdx]?.scrollIntoView({ inline: 'center', block: 'nearest' });
}

function switchRound(i) {
  roundIdx = i;
  matchChecked = false; matchAnswers = {}; matchSelectedId = null;
  document.querySelectorAll('#verbTabs .vtab').forEach((b, j) => b.classList.toggle('active', j === i));
  renderMatchRound();
  updateModeBadges();
}

function renderMatchRound() {
  const round = gameRounds[roundIdx];
  const container = document.getElementById('slidesContainer');

  // Chips: one per pair, colour-coded to its verb family, shuffled.
  const chips = shuffled(round.pairs);
  // Rows: meanings in a different shuffled order than the chips so position
  // never gives the answer away.
  const rows = shuffled(round.pairs);

  const chipsHtml = chips.map(p => `
    <button type="button" class="match-chip" data-id="${p.id}"
      onclick="onChipClick(${p.id}, this)">${p.phrase}</button>`
  ).join('');

const rowsHtml = rows.map((p, i) => `
    <div class="match-row" data-row-id="${p.id}">
      <div class="match-row-num">${i + 1}</div>
 <div class="match-meaning">${p.meaning} — <span class="match-blank" data-row-id="${p.id}" onclick="onBlankClick(${p.id})"><span class="blank-content">&nbsp;</span></span></div>
    </div>`).join('');

  container.innerHTML = `
    <div class="slide active match-slide"> 
      <div class="match-round-label">ROUND ${roundIdx + 1} / ${gameRounds.length}</div>
      <div class="match-bank">${chipsHtml}</div>
      <div class="match-rows">${rowsHtml}</div>
    </div>`;

  document.getElementById('prevBtn').disabled = roundIdx === 0;
  document.getElementById('nextBtn').disabled = roundIdx === gameRounds.length - 1;
  document.getElementById('sectionLabel').textContent = 'MATCH ROUND ' + (roundIdx + 1);

  updateMatchProgress();
}

function currentPairs() {
  return gameRounds[roundIdx].pairs;
}

function onChipClick(id, btn) {
  if (matchChecked) return;
  if (btn.classList.contains('used')) return;

  if (matchSelectedId === id) {
    // tapping the already-selected chip deselects it
    matchSelectedId = null;
    btn.classList.remove('selected');
    return;
  }

  document.querySelectorAll('.match-chip.selected').forEach(c => c.classList.remove('selected'));
  matchSelectedId = id;
  btn.classList.add('selected');
}

function onBlankClick(rowId) {
  if (matchChecked) return;
  const blank = document.querySelector(`.match-blank[data-row-id="${rowId}"]`);
  if (!blank) return;

  // Blank already filled → release it back to the bank
  if (matchAnswers[rowId] !== undefined) {
    const releasedId = matchAnswers[rowId];
    delete matchAnswers[rowId];
    const chip = document.querySelector(`.match-chip[data-id="${releasedId}"]`);
    if (chip) chip.classList.remove('used');
    blank.classList.remove('filled');
    blank.style.removeProperty('--row-color');
    blank.querySelector('.blank-content').innerHTML = '_____';
    updateMatchProgress();
    updateMatchCheckBtn();
    return;
  }

  // No chip selected — nudge, nothing to place
  if (matchSelectedId === null) return;

  const chip = document.querySelector(`.match-chip[data-id="${matchSelectedId}"]`);
  const pair = currentPairs().find(p => p.id === matchSelectedId);
  if (!chip || !pair) return;

  matchAnswers[rowId] = matchSelectedId;
  chip.classList.remove('selected');
  chip.classList.add('used');
  matchSelectedId = null;

  blank.classList.add('filled');
  blank.querySelector('.blank-content').textContent = pair.phrase;

  updateMatchProgress();
  if (Object.keys(matchAnswers).length === currentPairs().length) {
    setTimeout(checkMatchRound, 250);
  }
}

function updateMatchCheckBtn() {
  const btn = document.getElementById('matchCheckBtn');
  if (!btn) return;
  const total = currentPairs().length;
  const filled = Object.keys(matchAnswers).length;
  btn.disabled = filled < total || matchChecked;
}

function updateMatchProgress() {
  const total = currentPairs().length;
  const filled = Object.keys(matchAnswers).length;
  document.getElementById('progressFill').style.width = (filled / total * 100) + '%';
}

/* ── SCORE THE WHOLE ROUND AT ONCE ── */
function checkMatchRound() {
  if (matchChecked) return;
  const pairs = currentPairs();
  const total = pairs.length;
  if (Object.keys(matchAnswers).length < total) return;

  matchChecked = true;
  let ok = 0;

  pairs.forEach(p => {
    const blank = document.querySelector(`.match-blank[data-row-id="${p.id}"]`);
    const placedId = matchAnswers[p.id];
    const isOk = placedId === p.id;
    if (isOk) ok++;
    blank.classList.add(isOk ? 'result-ok' : 'result-err');
    if (!isOk) {
      const placedPair = pairs.find(x => x.id === placedId);
      blank.innerHTML = `<span class="blank-content">${placedPair ? placedPair.phrase : '?'}</span><span class="reveal-answer">${p.phrase}</span>`;
    }
  });

  document.querySelectorAll('.match-chip').forEach(c => c.classList.add('used'));

  scoreOk = ok; scoreErr = total - ok;
  document.getElementById('scoreOk').textContent = scoreOk;
  document.getElementById('scoreErr').textContent = scoreErr;

  const pct = Math.round(ok / total * 100);
  roundResults[roundIdx] = pct === 100 ? 'perfect' : (pct >= 50 ? 'ok' : 'poor');
  buildRoundTabs();

  showMatchResults(ok, total, pct, pairs);
}

function showMatchResults(ok, total, pct, pairs) {
  const perfect = pct === 100;

  document.getElementById('ovTitle').textContent = perfect ? 'Perfect!' : pct >= 80 ? 'Brilliant' : pct >= 60 ? 'Good' : 'Keep Going';
  document.getElementById('ovScore').textContent  = ok + ' / ' + total + ' · ' + pct + '%';
  document.getElementById('ovPerfect').classList.toggle('show', perfect);

  const stars = pct >= 90 ? 3 : pct >= 70 ? 2 : pct >= 50 ? 1 : 0;
  document.getElementById('ovStars').innerHTML = Array.from({length:3},(_,i) =>
    `<span class="ov-star">${i < stars ? '★' : '☆'}</span>`).join('');

  document.getElementById('ovBars').innerHTML = pairs.map(p => {
    const isOk = matchAnswers[p.id] === p.id;
    return `<div class="ov-bar" style="background:${isOk ? '#4DC98A' : '#E05555'}"></div>`;
  }).join('');

  document.getElementById('ovMsg').textContent = perfect
    ? "Absolutely flawless. You've mastered this round!"
    : pct >= 80 ? 'Excellent. Review the red ones and try again.'
    : pct >= 60 ? 'Solid work — a few mixed up.'
    : 'Worth another pass on this round.';

  document.getElementById('ovAnswers').innerHTML = pairs.map((p, i) => {
    const isOk = matchAnswers[p.id] === p.id;
    const cls = isOk ? 'ok' : 'err';
    const tick = isOk ? '✓' : '✗';
    const delay = i * 40;
    return `<div class="ov-answer-item ${cls}" style="animation-delay:${delay}ms">
      <span class="ov-answer-verb">${p.phrase}</span>
      <span class="ov-answer-meaning">${p.meaning}</span>
      <span class="ov-answer-tick">${tick}</span>
    </div>`;
  }).join('');

  document.getElementById('overlay').classList.add('show');

  if (perfect) {
    triggerConfetti();
    setTimeout(() => showAwardPopup(), 300);
  }
}

loadAll();
</script>
