<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>INTUITY - Portuguese Verbs Trainer</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'DM Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
      background: #0d0d0d;
      color: white;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
      min-height: 100vh;
      position: relative;
    }

    .background {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 30% 20%, rgba(201, 169, 97, 0.18) 0%, transparent 40%),
                  radial-gradient(circle at 70% 80%, rgba(201, 169, 97, 0.16) 0%, transparent 38%),
                  radial-gradient(circle at 20% 70%, rgba(201, 169, 97, 0.12) 0%, transparent 45%),
                  radial-gradient(circle at 85% 15%, rgba(201, 169, 97, 0.14) 0%, transparent 35%),
                  #0d0d0d;
      z-index: 0;
      overflow: hidden;
    }

    .elegant-curves {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }

    .curve-elegant {
      position: absolute;
      border-radius: 50%;
      filter: blur(2px);
    }

    .curve-elegant-1 {
      width: 500px;
      height: 900px;
      top: -300px;
      right: -150px;
      border: 3px solid rgba(201, 169, 97, 0.35);
      background: linear-gradient(135deg, 
        rgba(201, 169, 97, 0.15) 0%, 
        rgba(201, 169, 97, 0.08) 50%, 
        transparent 100%);
      transform: rotate(25deg);
      animation: floatElegant 12s ease-in-out infinite;
      box-shadow: 
        inset 0 0 60px rgba(201, 169, 97, 0.1),
        0 0 80px rgba(201, 169, 97, 0.15);
    }

    .curve-elegant-2 {
      width: 600px;
      height: 1100px;
      bottom: -400px;
      left: -200px;
      border: 2.5px solid rgba(201, 169, 97, 0.32);
      background: linear-gradient(135deg, 
        rgba(201, 169, 97, 0.12) 0%, 
        rgba(201, 169, 97, 0.06) 40%,
        transparent 80%);
      transform: rotate(-20deg);
      animation: floatElegant 15s ease-in-out infinite reverse;
      box-shadow: 
        inset 0 0 50px rgba(201, 169, 97, 0.08),
        0 0 70px rgba(201, 169, 97, 0.12);
    }

    @keyframes floatElegant {
      0%, 100% { 
        transform: translateY(0) rotate(var(--base-rotation, 0deg));
        opacity: 1;
      }
      50% { 
        transform: translateY(-30px) rotate(calc(var(--base-rotation, 0deg) + 3deg));
        opacity: 0.85;
      }
    }

    .curve-elegant-1 { --base-rotation: 25deg; }
    .curve-elegant-2 { --base-rotation: -20deg; }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' /%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.01'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 1;
    }

    .container { 
      max-width: 500px; 
      margin: 0 auto; 
      position: relative;
      z-index: 2;
      padding: 0 1rem;
    }

    .header { 
      text-align: center; 
      margin-bottom: 1.5rem;
      padding: 1rem 0 0.75rem;
    }

    .header h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2rem; 
      font-weight: 700; 
      color: #C9A961;
      margin-bottom: 0.375rem; 
      letter-spacing: -0.04em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #C9A961 0%, rgba(201, 169, 97, 0.8) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header .subtitle { 
      font-size: 0.75rem; 
      color: #8e8e93; 
      margin-bottom: 0.25rem; 
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .header .author {
      font-size: 0.6875rem;
      color: #636366;
      margin-bottom: 0.5rem;
      font-weight: 400;
      letter-spacing: 0.02em;
    }

    /* --- Direction toggle --- */
    .direction-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.625rem;
      margin-top: 0.75rem;
    }

    .toggle-label {
      font-size: 0.6875rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #636366;
      transition: color 0.25s ease;
      cursor: pointer;
      user-select: none;
    }

    .toggle-label.active {
      color: #C9A961;
      text-shadow: 0 0 12px rgba(201, 169, 97, 0.4);
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .switch .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(28, 28, 30, 0.8);
      border: 1px solid rgba(84, 84, 88, 0.35);
      border-radius: 999px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    .switch .slider::before {
      content: '';
      position: absolute;
      height: 18px;
      width: 18px;
      left: 2px;
      bottom: 2px;
      background: #e5e5e7;
      border-radius: 50%;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    }

    .switch input:checked + .slider {
      background: rgba(201, 169, 97, 0.35);
      border-color: rgba(201, 169, 97, 0.6);
    }

    .switch input:checked + .slider::before {
      transform: translateX(20px);
      background: #C9A961;
      box-shadow: 0 2px 8px rgba(201, 169, 97, 0.6);
    }

    .switch:hover .slider {
      border-color: rgba(201, 169, 97, 0.5);
    }
    /* --- end direction toggle --- */

    .progress-indicator {
      text-align: center;
      font-size: 0.75rem;
      color: #636366;
      margin-bottom: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    .peek-icon, .conjugation-icon, .reset-icon {
      font-size: 1rem;
      color: #8e8e93;
      cursor: pointer;
      transition: all 0.3s ease;
      user-select: none;
    }

    .peek-icon:hover {
      color: #C9A961;
      transform: scale(1.15);
    }

    .conjugation-icon:hover {
      color: #60a5fa;
      transform: scale(1.15);
    }

    .reset-icon:hover {
      color: #fb923c;
      transform: scale(1.15) rotate(-45deg);
    }

    .peek-icon:active, .conjugation-icon:active, .reset-icon:active {
      transform: scale(0.95);
    }

    .icons-row {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.375rem;
    }

    .verbs-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.875rem;
      padding: 0 0.5rem;
      margin-bottom: 1.75rem;
    }

    .verb-card {
      background: #000000;
      backdrop-filter: blur(40px) saturate(150%);
      -webkit-backdrop-filter: blur(40px) saturate(150%);
      border-radius: 1.25rem;
      padding: 1.25rem 0.875rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.625rem;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 2px 8px rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(84, 84, 88, 0.25);
      position: relative;
      min-height: 145px;
    }

    .verb-card.correct {
      border-color: rgba(52, 199, 89, 0.5);
      box-shadow: 0 8px 32px rgba(52, 199, 89, 0.3);
      cursor: help;
    }

    .verb-card.correct:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 36px rgba(52, 199, 89, 0.35);
      border-color: rgba(52, 199, 89, 0.6);
    }

    .verb-card:hover:not(.correct) {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(201, 169, 97, 0.2),
                  0 0 0 1px rgba(201, 169, 97, 0.3);
      border-color: rgba(201, 169, 97, 0.4);
    }

    .english-word {
      font-size: 0.8125rem;
      font-weight: 600;
      color: #C9A961;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .letter-boxes {
      display: flex;
      gap: 0.25rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .letter-box {
      width: 26px;
      height: 36px;
      background: rgba(28, 28, 30, 0.6);
      border: 1.5px solid rgba(84, 84, 88, 0.3);
      border-radius: 0.375rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.0625rem;
      font-weight: 600;
      color: #e5e5e7;
      text-transform: lowercase;
      transition: all 0.2s ease;
      position: relative;
    }

    .letter-box.active-cursor {
      border-color: rgba(201, 169, 97, 0.6);
      background: rgba(201, 169, 97, 0.15);
    }

    .letter-box.active-cursor::after {
      content: '';
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      width: 2px;
      height: 18px;
      background: #C9A961;
      animation: cursorBlink 1s step-end infinite;
    }

    @keyframes cursorBlink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    .letter-box.filled::before {
      content: '';
      position: absolute;
      bottom: -3px;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      height: 3px;
      background: linear-gradient(90deg, transparent, #C9A961, transparent);
      border-radius: 2px;
      box-shadow: 0 0 8px rgba(201, 169, 97, 0.6),
                  0 0 12px rgba(201, 169, 97, 0.4);
      animation: glowPulse 1.5s ease-in-out infinite;
    }

    @keyframes glowPulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    .letter-box.just-inserted {
      animation: letterPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes letterPop {
      0% {
        transform: scale(0.8) translateY(-5px);
        opacity: 0;
      }
      50% {
        transform: scale(1.15);
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .letter-box.peeking {
      background: rgba(201, 169, 97, 0.3);
      border-color: rgba(201, 169, 97, 0.6);
      color: #C9A961;
      animation: peekPulse 0.3s ease;
    }

    @keyframes peekPulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    .letter-box.filled {
      background: rgba(201, 169, 97, 0.2);
      border-color: rgba(201, 169, 97, 0.5);
      color: #C9A961;
    }

    .letter-box.correct {
      background: rgba(52, 199, 89, 0.2);
      border-color: rgba(52, 199, 89, 0.6);
      color: #34c759;
    }

    .check-mark {
      position: absolute;
      top: 0.625rem;
      right: 0.625rem;
      font-size: 1.375rem;
      opacity: 0;
      transform: scale(0);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .verb-card.correct .check-mark {
      opacity: 1;
      transform: scale(1);
    }

    .hidden-input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .navigation {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 0.5rem;
      margin-top: 1.5rem;
      gap: 0.75rem;
    }

    .nav-button {
      background: #000000;
      backdrop-filter: blur(40px);
      border: 1px solid rgba(84, 84, 88, 0.25);
      border-radius: 0.875rem;
      padding: 0.75rem 1.5rem;
      color: #8e8e93;
      font-weight: 600;
      font-size: 0.8125rem;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }

    .nav-button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(201, 169, 97, 0.3);
      border-color: rgba(201, 169, 97, 0.4);
      color: #C9A961;
    }

    .nav-button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .dots-container {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(84, 84, 88, 0.4);
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .dot:hover {
      background: rgba(201, 169, 97, 0.6);
      transform: scale(1.2);
    }

    .dot.active {
      background: #C9A961;
      box-shadow: 0 0 12px rgba(201, 169, 97, 0.6);
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      z-index: 999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .modal-overlay.show {
      display: flex;
      animation: fadeIn 0.2s ease;
    }

    .cheat-modal {
      background: rgba(28, 28, 30, 0.98);
      backdrop-filter: blur(60px);
      border: 2px solid rgba(201, 169, 97, 0.4);
      border-radius: 1.5rem;
      padding: 2rem;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
      animation: scaleIn 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .cheat-modal .verb-infinitive {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2.5rem;
      font-weight: 700;
      color: #C9A961;
      text-transform: lowercase;
      letter-spacing: -0.02em;
    }

    .conjugation-modal {
      background: rgba(28, 28, 30, 0.98);
      backdrop-filter: blur(60px);
      border: 2px solid rgba(96, 165, 250, 0.4);
      border-radius: 1.5rem;
      padding: 2rem;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
      animation: scaleIn 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
    }

    /* --- Expanded card modal --- */
    .card-modal-overlay {
      align-items: flex-end;
      height: 100vh;
      height: 100dvh;
      background: rgba(13, 11, 8, 0.72);
      backdrop-filter: blur(16px) saturate(140%);
      -webkit-backdrop-filter: blur(16px) saturate(140%);
    }

    @media (min-width: 560px) {
      .card-modal-overlay {
        align-items: center;
      }
    }

    .card-modal {
      background: radial-gradient(circle at 25% -10%, rgba(201, 169, 97, 0.14) 0%, transparent 55%),
                  radial-gradient(circle at 90% 110%, rgba(201, 169, 97, 0.08) 0%, transparent 50%),
                  #0d0d0d;
      backdrop-filter: blur(60px) saturate(150%);
      -webkit-backdrop-filter: blur(60px) saturate(150%);
      border: 1px solid rgba(201, 169, 97, 0.22);
      border-radius: 1.5rem 1.5rem 0 0;
      padding: 2.25rem 1.5rem calc(2.5rem + env(safe-area-inset-bottom));
      width: 100%;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 -10px 60px rgba(0, 0, 0, 0.6);
      position: relative;
      transform: translateY(30px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .card-modal-overlay.show .card-modal {
      transform: translateY(0);
      opacity: 1;
    }

    @media (min-width: 560px) {
      .card-modal {
        border-radius: 1.5rem;
        padding: 2.5rem 2rem;
      }
    }

    .card-modal.correct {
      border-color: rgba(52, 199, 89, 0.5);
      box-shadow: 0 -10px 60px rgba(52, 199, 89, 0.25), 0 0 0 1px rgba(52, 199, 89, 0.3);
    }

    .card-modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      width: 2.25rem;
      height: 2.25rem;
      border-radius: 50%;
      background: rgba(99, 99, 102, 0.25);
      border: 1px solid rgba(99, 99, 102, 0.2);
      color: #8e8e93;
      font-size: 1.375rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      line-height: 1;
    }

    .card-modal-close:hover {
      background: rgba(99, 99, 102, 0.35);
      color: #e5e5e7;
      transform: rotate(90deg);
    }

    .card-modal-drag-handle {
      width: 36px;
      height: 4px;
      border-radius: 999px;
      background: rgba(142, 142, 147, 0.4);
      margin: 0 auto 1.5rem;
    }

    @media (min-width: 560px) {
      .card-modal-drag-handle {
        display: none;
      }
    }

    .card-modal .modal-check-mark {
      font-size: 2.5rem;
      opacity: 0;
      transform: scale(0);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      margin-bottom: 0.5rem;
      height: 0;
    }

    .card-modal.correct .modal-check-mark {
      opacity: 1;
      transform: scale(1);
      height: auto;
      margin-bottom: 0.75rem;
    }

    .card-modal .modal-prompt-word {
      font-size: 1.125rem;
      font-weight: 700;
      color: #C9A961;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 1.75rem;
    }

    .card-modal .modal-letter-boxes {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 1.75rem;
      min-height: 64px;
    }

    .card-modal .letter-box {
      width: 42px;
      height: 56px;
      font-size: 1.625rem;
      border-radius: 0.625rem;
    }

    @media (max-width: 380px) {
      .card-modal .letter-box {
        width: 36px;
        height: 50px;
        font-size: 1.375rem;
      }
    }

    .card-modal .icons-row {
      justify-content: center;
      gap: 1.5rem;
    }

    .card-modal .peek-icon,
    .card-modal .conjugation-icon,
    .card-modal .reset-icon {
      font-size: 1.375rem;
      padding: 0.5rem;
    }
    .modal-input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      opacity: 0;
      border: 0;
      background: transparent;
      cursor: text;
      caret-color: transparent;
      font-size: 16px; /* prevents iOS auto-zoom on focus */
    }

    .card-modal-close {
      z-index: 2;
    }

    .card-modal .icons-row {
      position: relative;
      z-index: 2;
    }
    /* --- end expanded card modal --- */

    #conjugationOverlay {
      z-index: 1000;
    }

    .conjugation-modal .modal-header {
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .conjugation-modal .infinitive {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      color: #60a5fa;
      text-transform: lowercase;
      letter-spacing: -0.02em;
      margin-bottom: 0.25rem;
    }

    .conjugation-modal .english-translation {
      font-size: 0.875rem;
      color: #8e8e93;
      text-transform: lowercase;
    }

    .conjugation-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .conjugation-row {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 1rem;
      align-items: center;
      padding: 0.75rem;
      background: rgba(48, 48, 51, 0.4);
      border-radius: 0.75rem;
      border: 1px solid rgba(84, 84, 88, 0.2);
      transition: all 0.2s ease;
    }

    .conjugation-row:hover {
      background: rgba(48, 48, 51, 0.6);
      border-color: rgba(96, 165, 250, 0.3);
    }

    .pronoun {
      font-size: 0.8125rem;
      color: #8e8e93;
      font-weight: 600;
      text-align: right;
    }

    .conjugated-form {
      font-size: 1rem;
      color: #60a5fa;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .close-conjugation {
      position: absolute;
      top: 1rem;
      right: 1rem;
      width: 2rem;
      height: 2rem;
      border-radius: 50%;
      background: rgba(99, 99, 102, 0.25);
      border: 1px solid rgba(99, 99, 102, 0.2);
      color: #8e8e93;
      font-size: 1.25rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      line-height: 1;
    }

    .close-conjugation:hover {
      background: rgba(99, 99, 102, 0.35);
      color: #e5e5e7;
      transform: rotate(90deg);
    }

    .loading-screen {
      text-align: center;
      padding: 3rem;
      color: #8e8e93;
    }

    .error-screen {
      text-align: center;
      padding: 3rem;
      color: #fb923c;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes scaleIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @media (max-width: 480px) {
      .header h1 {
        font-size: 1.75rem;
      }

      .header .subtitle {
        font-size: 0.6875rem;
      }

      .header .author {
        font-size: 0.625rem;
      }

      .container {
        padding: 0 0.75rem;
      }

      .verbs-grid {
        gap: 0.75rem;
        padding: 0 0.25rem;
        margin-bottom: 1.5rem;
      }
      
      .verb-card {
        padding: 1rem 0.75rem;
        min-height: 130px;
        border-radius: 1rem;
      }

      .english-word {
        font-size: 0.75rem;
      }

      .letter-boxes {
        gap: 0.2rem;
      }

      .letter-box {
        width: 24px;
        height: 34px;
        font-size: 1rem;
      }

      .peek-icon, .conjugation-icon {
        font-size: 0.9375rem;
      }

      .check-mark {
        font-size: 1.25rem;
        top: 0.5rem;
        right: 0.5rem;
      }

      .navigation {
        margin-top: 1.25rem;
        padding: 0 0.25rem;
        gap: 0.5rem;
      }

      .nav-button {
        padding: 0.625rem 1.25rem;
        font-size: 0.75rem;
        border-radius: 0.75rem;
      }

      .dots-container {
        gap: 0.375rem;
      }

      .dot {
        width: 7px;
        height: 7px;
      }

      .progress-indicator {
        font-size: 0.6875rem;
        margin-bottom: 1rem;
      }

      .conjugation-modal {
        padding: 1.5rem;
      }
      
      .conjugation-modal .infinitive {
        font-size: 1.75rem;
      }
      
      .conjugation-row {
        grid-template-columns: 100px 1fr;
        gap: 0.75rem;
        padding: 0.625rem;
      }
      
      .pronoun {
        font-size: 0.75rem;
      }
      
      .conjugated-form {
        font-size: 0.9375rem;
      }
    }

    @media (max-width: 380px) {
      .header h1 {
        font-size: 1.5rem;
      }

      .verb-card {
        min-height: 120px;
        padding: 0.875rem 0.625rem;
      }

      .letter-box {
        width: 22px;
        height: 32px;
        font-size: 0.9375rem;
      }

      .nav-button {
        padding: 0.5rem 1rem;
        font-size: 0.6875rem;
      }
    }
  </style>
</head>
<body>
  <div class="background">
    <div class="elegant-curves">
      <div class="curve-elegant curve-elegant-1"></div>
      <div class="curve-elegant curve-elegant-2"></div>
    </div>
  </div>

  <div class="modal-overlay" id="cheatOverlay">
    <div class="cheat-modal">
      <div class="verb-infinitive" id="cheatVerb"></div>
    </div>
  </div>

  <div class="modal-overlay" id="conjugationOverlay">
    <div class="conjugation-modal">
      <button class="close-conjugation" onclick="closeConjugationModal()">×</button>
      <div class="modal-header">
        <div class="infinitive" id="conjugationInfinitive"></div>
        <div class="english-translation" id="conjugationEnglish"></div>
      </div>
      <div class="conjugation-list" id="conjugationList"></div>
    </div>
  </div>

  <div class="modal-overlay card-modal-overlay" id="cardModalOverlay">
    <div class="card-modal" id="cardModal" onclick="focusModalInput()">
      <button class="card-modal-close" onclick="event.stopPropagation(); closeCardModal()">×</button>
      <div class="card-modal-drag-handle"></div>
      <div class="modal-check-mark" id="modalCheckMark">✓</div>
      <div class="modal-prompt-word" id="modalPromptWord"></div>
      <div class="modal-letter-boxes" id="modalLetterBoxes"></div>
      <div class="icons-row" id="modalIconsRow">
        <div class="peek-icon" onclick="peekModal(event)">👁</div>
        <div class="conjugation-icon" onclick="showConjugation(event, activeModalCard.setIdx, activeModalCard.verbIdx)">📖</div>
        <div class="reset-icon" onclick="resetModalAttempt(event)">↺</div>
      </div>
      <input type="text" class="modal-input" id="modalInput"
             autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
             inputmode="text" enterkeyhint="done"
             oninput="handleModalInput(event)">
    </div>
  </div>

  <div class="container">
    <div class="header">
      <h1>INTUITY</h1>
      <p class="subtitle">Intuitive & Immersive Learning</p>
      <p class="author">Majid Nashtai</p>
      <p class="subtitle">Portuguese Verbs Trainer</p>

      <div class="direction-toggle">
        <span class="toggle-label active" id="labelLeft" onclick="setDirection('en-pt')">EN → PT</span>
        <label class="switch">
          <input type="checkbox" id="directionSwitch" onchange="handleSwitchChange(event)">
          <span class="slider"></span>
        </label>
        <span class="toggle-label" id="labelRight" onclick="setDirection('pt-en')">PT → EN</span>
      </div>
    </div>

    <div class="progress-indicator">
      SET <span id="currentSet">1</span> OF <span id="totalSets">17</span>
    </div>

    <div class="verbs-grid" id="verbsGrid">
      <div class="loading-screen">Loading verbs...</div>
    </div>

    <div class="navigation">
      <button class="nav-button" id="prevBtn" onclick="previousSet()">← Previous</button>
      <div class="dots-container" id="dotsContainer"></div>
      <button class="nav-button" id="nextBtn" onclick="nextSet()">Next →</button>
    </div>
  </div>

  <script>
    let verbsData = [];
    let currentSetIndex = 0;
    let userAnswers = {};
    let currentFocusedInput = null;
    let direction = 'en-pt'; // 'en-pt' = see English, type Portuguese. 'pt-en' = see Portuguese, type English.
    let activeModalCard = null; // { setIdx, verbIdx }
    const DATA_VERSION = '3'; // bump this whenever portuguese-verbs.json changes, to bust the browser/CDN cache

    async function loadVerbsData() {
      try {
        const response = await fetch(`portuguese-verbs.json?v=${DATA_VERSION}`, { cache: 'no-cache' });
        
        if (!response.ok) {
          throw new Error(`Failed to load data: ${response.status}`);
        }
        
        const data = await response.json();
        verbsData = data.sets;
        initApp();
      } catch (error) {
        console.error('Error loading verbs data:', error);
        document.getElementById('verbsGrid').innerHTML = `
          <div class="error-screen">
            <div style="font-size: 2rem; margin-bottom: 1rem;">⚠️</div>
            <div>Failed to load Portuguese verbs</div>
            <div style="font-size: 0.75rem; margin-top: 0.5rem;">${error.message}</div>
          </div>
        `;
      }
    }

    function initApp() {
      document.getElementById('totalSets').textContent = verbsData.length;
      createDots();
      renderSet();
    }

    // --- direction toggle helpers ---
    function getPrompt(verb) {
      return direction === 'en-pt' ? verb.english : verb.infinitive;
    }

    function getAnswer(verb) {
      return direction === 'en-pt' ? verb.infinitive : verb.english;
    }

    function setDirection(newDirection) {
      if (direction === newDirection) return;
      direction = newDirection;
      document.getElementById('directionSwitch').checked = (direction === 'pt-en');
      updateToggleLabels();
      currentFocusedInput = null;
      renderSet();
    }

    function handleSwitchChange(e) {
      direction = e.target.checked ? 'pt-en' : 'en-pt';
      updateToggleLabels();
      currentFocusedInput = null;
      renderSet();
    }

    function updateToggleLabels() {
      document.getElementById('labelLeft').classList.toggle('active', direction === 'en-pt');
      document.getElementById('labelRight').classList.toggle('active', direction === 'pt-en');
    }
    // --- end direction toggle helpers ---

    function createDots() {
      const container = document.getElementById('dotsContainer');
      container.innerHTML = '';
      for (let i = 0; i < verbsData.length; i++) {
        const dot = document.createElement('div');
        dot.className = 'dot';
        if (i === currentSetIndex) dot.classList.add('active');
        dot.onclick = () => goToSet(i);
        container.appendChild(dot);
      }
    }

    function renderSet() {
      const grid = document.getElementById('verbsGrid');
      grid.innerHTML = '';
      
      const currentSet = verbsData[currentSetIndex].verbs;
      
      currentSet.forEach((verb, idx) => {
        const card = document.createElement('div');
        card.className = 'verb-card';
        card.id = `card-${currentSetIndex}-${idx}`;
        
        const key = `${direction}-${currentSetIndex}-${idx}`;
        const userAnswer = userAnswers[key] || '';
        const promptWord = getPrompt(verb);
        const answerWord = getAnswer(verb);
        const isCorrect = userAnswer.toLowerCase() === answerWord.toLowerCase();
        
        if (isCorrect) {
          card.classList.add('correct');
        }
        
        card.innerHTML = `
          <span class="check-mark">✓</span>
          <div class="english-word">${promptWord}</div>
          <div class="letter-boxes" id="letters-${currentSetIndex}-${idx}">
            ${generateLetterBoxes(answerWord, userAnswer, isCorrect, -1, false)}
          </div>
          <div class="icons-row">
            <div class="peek-icon" onclick="peekCard(event, ${currentSetIndex}, ${idx})">👁</div>
            <div class="conjugation-icon" onclick="showConjugation(event, ${currentSetIndex}, ${idx})">📖</div>
            <div class="reset-icon" onclick="resetCard(event, ${currentSetIndex}, ${idx})">↺</div>
          </div>
          <input type="text" class="hidden-input" id="input-${currentSetIndex}-${idx}" 
                 maxlength="${answerWord.length}" 
                 value="${userAnswer}"
                 data-idx="${idx}"
                 oninput="handleInputInline(event, ${currentSetIndex}, ${idx})"
                 onfocus="handleFocusInline(${currentSetIndex}, ${idx})"
                 onblur="handleBlurInline(${currentSetIndex}, ${idx})">
        `;
        
        card.onclick = (e) => {
          if (!isCorrect) {
            openCardModal(currentSetIndex, idx);
          } else {
            showCheat(answerWord);
          }
        };
        
        grid.appendChild(card);
      });
      
      document.getElementById('currentSet').textContent = currentSetIndex + 1;
      updateNavButtons();
      updateDots();
    }

    function handleInputInline(e, setIdx, verbIdx) {
      const verb = verbsData[setIdx].verbs[verbIdx];
      handleInput(e, setIdx, verbIdx, getAnswer(verb));
    }

    function handleFocusInline(setIdx, verbIdx) {
      setFocusedCard(setIdx, verbIdx);
    }

    function handleBlurInline(setIdx, verbIdx) {
      removeFocusedCard(setIdx, verbIdx);
    }

    function setFocusedCard(setIdx, verbIdx) {
      currentFocusedInput = `input-${setIdx}-${verbIdx}`;
      
      const currentSet = verbsData[currentSetIndex].verbs;
      currentSet.forEach((verb, idx) => {
        const key = `${direction}-${currentSetIndex}-${idx}`;
        const userAnswer = userAnswers[key] || '';
        const answerWord = getAnswer(verb);
        const isCorrect = userAnswer.toLowerCase() === answerWord.toLowerCase();
        const isFocused = currentFocusedInput === `input-${currentSetIndex}-${idx}`;
        
        const letterBoxes = document.getElementById(`letters-${currentSetIndex}-${idx}`);
        if (letterBoxes) {
          letterBoxes.innerHTML = generateLetterBoxes(answerWord, userAnswer, isCorrect, -1, isFocused);
        }
      });
    }

    function removeFocusedCard(setIdx, verbIdx) {
      currentFocusedInput = null;
      
      const currentSet = verbsData[currentSetIndex].verbs;
      currentSet.forEach((verb, idx) => {
        const key = `${direction}-${currentSetIndex}-${idx}`;
        const userAnswer = userAnswers[key] || '';
        const answerWord = getAnswer(verb);
        const isCorrect = userAnswer.toLowerCase() === answerWord.toLowerCase();
        
        const letterBoxes = document.getElementById(`letters-${currentSetIndex}-${idx}`);
        if (letterBoxes) {
          letterBoxes.innerHTML = generateLetterBoxes(answerWord, userAnswer, isCorrect, -1, false);
        }
      });
    }

    function generateLetterBoxes(word, userAnswer, isCorrect, lastInsertedIndex = -1, isFocused = false) {
      const currentPosition = userAnswer.length;
      
      return word.split('').map((letter, i) => {
        const userLetter = userAnswer[i] || '';
        let classes = isCorrect ? 'letter-box correct' : (userLetter ? 'letter-box filled' : 'letter-box');
        
        if (i === lastInsertedIndex) {
          classes += ' just-inserted';
        }
        
        if (isFocused && !isCorrect && !userLetter && i === currentPosition) {
          classes += ' active-cursor';
        }
        
        return `<div class="${classes}" data-letter="${letter}">${userLetter}</div>`;
      }).join('');
    }

    function resetCard(event, setIdx, verbIdx) {
      event.stopPropagation();

      const key = `${direction}-${setIdx}-${verbIdx}`;
      delete userAnswers[key];

      const card = document.getElementById(`card-${setIdx}-${verbIdx}`);
      if (card) card.classList.remove('correct');

      const verb = verbsData[setIdx].verbs[verbIdx];
      const answerWord = getAnswer(verb);
      const letterBoxes = document.getElementById(`letters-${setIdx}-${verbIdx}`);
      if (letterBoxes) {
        letterBoxes.innerHTML = generateLetterBoxes(answerWord, '', false, -1, false);
      }

      const input = document.getElementById(`input-${setIdx}-${verbIdx}`);
      if (input) input.value = '';
    }

    function peekCard(event, setIdx, verbIdx) {
      event.stopPropagation();
      
      const verb = verbsData[setIdx].verbs[verbIdx];
      const correctAnswer = getAnswer(verb);
      
      const letterBoxes = document.querySelectorAll(`#letters-${setIdx}-${verbIdx} .letter-box`);
      const peekIcon = event.target;
      
      letterBoxes.forEach((box, i) => {
        const letter = correctAnswer[i];
        box.textContent = letter;
        box.classList.add('peeking');
      });
      
      peekIcon.style.opacity = '0';
      
      setTimeout(() => {
        const key = `${direction}-${setIdx}-${verbIdx}`;
        const userAnswer = userAnswers[key] || '';
        
        letterBoxes.forEach((box, i) => {
          const userLetter = userAnswer[i] || '';
          box.textContent = userLetter;
          box.classList.remove('peeking');
        });
        
        peekIcon.style.opacity = '1';
      }, 1500);
    }

    function showConjugation(event, setIdx, verbIdx) {
      event.stopPropagation();
      
      const verb = verbsData[setIdx].verbs[verbIdx];
      
      document.getElementById('conjugationInfinitive').textContent =
        direction === 'en-pt' ? verb.infinitive : verb.english;
      document.getElementById('conjugationEnglish').textContent =
        direction === 'en-pt' ? `to ${verb.english}` : `pt: ${verb.infinitive}`;
      
      const listContainer = document.getElementById('conjugationList');
      listContainer.innerHTML = '';
      
      const pronounOrder = ['eu', 'tu', 'ele/ela', 'nós', 'vocês/eles/elas'];
      const pronounLabelsEn = {
        'eu': 'I',
        'tu': 'you',
        'ele/ela': 'he/she',
        'nós': 'we',
        'vocês/eles/elas': 'they'
      };
      const conjugationSet = direction === 'en-pt' ? verb.conjugations : verb.conjugations_en;
      
      pronounOrder.forEach(pronoun => {
        if (conjugationSet && conjugationSet[pronoun]) {
          const label = direction === 'en-pt' ? pronoun : pronounLabelsEn[pronoun];
          const row = document.createElement('div');
          row.className = 'conjugation-row';
          row.innerHTML = `
            <div class="pronoun">${label}</div>
            <div class="conjugated-form">${conjugationSet[pronoun]}</div>
          `;
          listContainer.appendChild(row);
        }
      });
      
      document.getElementById('conjugationOverlay').classList.add('show');
    }

    function closeConjugationModal() {
      document.getElementById('conjugationOverlay').classList.remove('show');
    }

    function handleInput(e, setIdx, verbIdx, correctAnswer) {
      const value = e.target.value.toLowerCase();
      const key = `${direction}-${setIdx}-${verbIdx}`;
      const previousValue = userAnswers[key] || '';
      userAnswers[key] = value;
      
      let lastInsertedIndex = -1;
      if (value.length > previousValue.length) {
        lastInsertedIndex = value.length - 1;
      }
      
      const isCorrect = value === correctAnswer.toLowerCase();
      const isFocused = currentFocusedInput === `input-${setIdx}-${verbIdx}`;
      
      const letterBoxes = document.getElementById(`letters-${setIdx}-${verbIdx}`);
      if (letterBoxes) {
        letterBoxes.innerHTML = generateLetterBoxes(correctAnswer, value, isCorrect, lastInsertedIndex, isFocused);
      }
      
      if (isCorrect) {
        const card = document.getElementById(`card-${setIdx}-${verbIdx}`);
        card.classList.add('correct');
        currentFocusedInput = null;
        setTimeout(() => {
          e.target.blur();
        }, 300);
      }
    }

    // --- Expanded card modal ---
    function syncCardModalViewport() {
      const overlay = document.getElementById('cardModalOverlay');
      if (!overlay) return;
      if (window.visualViewport) {
        const vv = window.visualViewport;
        overlay.style.top = vv.offsetTop + 'px';
        overlay.style.height = vv.height + 'px';
      }
    }

    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', syncCardModalViewport);
      window.visualViewport.addEventListener('scroll', syncCardModalViewport);
    }

    function openCardModal(setIdx, verbIdx) {
      activeModalCard = { setIdx, verbIdx };
      renderModalContent();

      const overlay = document.getElementById('cardModalOverlay');
      overlay.classList.add('show');
      syncCardModalViewport();

      // Focus synchronously (not in a timeout) — mobile browsers only open the
      // virtual keyboard when .focus() runs inside the original tap's call stack.
      const input = document.getElementById('modalInput');
      input.focus({ preventScroll: true });

      // The keyboard animates in over the next few hundred ms on iOS, shrinking
      // visualViewport in steps — keep re-syncing while that settles.
      let syncCount = 0;
      const settleInterval = setInterval(() => {
        syncCardModalViewport();
        syncCount++;
        if (syncCount > 10) clearInterval(settleInterval);
      }, 50);
    }

    function focusModalInput() {
      if (!activeModalCard) return;
      const { setIdx, verbIdx } = activeModalCard;
      const verb = verbsData[setIdx].verbs[verbIdx];
      const answerWord = getAnswer(verb);
      const key = `${direction}-${setIdx}-${verbIdx}`;
      const userAnswer = userAnswers[key] || '';
      const isCorrect = userAnswer.toLowerCase() === answerWord.toLowerCase();
      if (isCorrect) return; // don't pop the keyboard back up once they're done — let them review

      const input = document.getElementById('modalInput');
      if (input) input.focus({ preventScroll: true });
    }

    function closeCardModal() {
      const overlay = document.getElementById('cardModalOverlay');
      overlay.classList.remove('show');
      overlay.style.top = '';
      overlay.style.height = '';
      document.getElementById('modalInput').blur();
      activeModalCard = null;
      currentFocusedInput = null;
      renderSet();
    }

    function renderModalContent() {
      if (!activeModalCard) return;
      const { setIdx, verbIdx } = activeModalCard;
      const verb = verbsData[setIdx].verbs[verbIdx];
      const key = `${direction}-${setIdx}-${verbIdx}`;
      const userAnswer = userAnswers[key] || '';
      const promptWord = getPrompt(verb);
      const answerWord = getAnswer(verb);
      const isCorrect = userAnswer.toLowerCase() === answerWord.toLowerCase();

      document.getElementById('modalPromptWord').textContent = promptWord;
      document.getElementById('modalLetterBoxes').innerHTML =
        generateLetterBoxes(answerWord, userAnswer, isCorrect, -1, true);
      document.getElementById('cardModal').classList.toggle('correct', isCorrect);

      const input = document.getElementById('modalInput');
      input.maxLength = answerWord.length;
      input.value = userAnswer;
    }

    function handleModalInput(e) {
      if (!activeModalCard) return;
      const { setIdx, verbIdx } = activeModalCard;
      const verb = verbsData[setIdx].verbs[verbIdx];
      const answerWord = getAnswer(verb);
      const key = `${direction}-${setIdx}-${verbIdx}`;

      const value = e.target.value.toLowerCase();
      const previousValue = userAnswers[key] || '';
      userAnswers[key] = value;

      let lastInsertedIndex = -1;
      if (value.length > previousValue.length) {
        lastInsertedIndex = value.length - 1;
      }

      const isCorrect = value === answerWord.toLowerCase();

      document.getElementById('modalLetterBoxes').innerHTML =
        generateLetterBoxes(answerWord, value, isCorrect, lastInsertedIndex, true);
      document.getElementById('cardModal').classList.toggle('correct', isCorrect);

      if (isCorrect) {
        e.target.blur();
      }
    }

    function peekModal(event) {
      event.stopPropagation();
      if (!activeModalCard) return;
      const { setIdx, verbIdx } = activeModalCard;
      const verb = verbsData[setIdx].verbs[verbIdx];
      const answerWord = getAnswer(verb);
      const key = `${direction}-${setIdx}-${verbIdx}`;

      const letterBoxes = document.querySelectorAll('#modalLetterBoxes .letter-box');
      const peekIcon = event.target;

      letterBoxes.forEach((box, i) => {
        box.textContent = answerWord[i];
        box.classList.add('peeking');
      });

      peekIcon.style.opacity = '0';

      setTimeout(() => {
        const userAnswer = userAnswers[key] || '';
        letterBoxes.forEach((box, i) => {
          box.textContent = userAnswer[i] || '';
          box.classList.remove('peeking');
        });
        peekIcon.style.opacity = '1';
      }, 1500);
    }

    function resetModalAttempt(event) {
      event.stopPropagation();
      if (!activeModalCard) return;
      const { setIdx, verbIdx } = activeModalCard;
      const key = `${direction}-${setIdx}-${verbIdx}`;
      delete userAnswers[key];

      const verb = verbsData[setIdx].verbs[verbIdx];
      const answerWord = getAnswer(verb);

      document.getElementById('modalLetterBoxes').innerHTML =
        generateLetterBoxes(answerWord, '', false, -1, true);
      document.getElementById('cardModal').classList.remove('correct');

      const input = document.getElementById('modalInput');
      input.value = '';
      input.focus({ preventScroll: true });
    }
    // --- end expanded card modal ---

    function showCheat(verb) {
      document.getElementById('cheatVerb').textContent = verb;
      document.getElementById('cheatOverlay').classList.add('show');
      
      setTimeout(() => {
        document.getElementById('cheatOverlay').classList.remove('show');
      }, 2000);
    }

    function nextSet() {
      if (currentSetIndex < verbsData.length - 1) {
        currentSetIndex++;
        renderSet();
      }
    }

    function previousSet() {
      if (currentSetIndex > 0) {
        currentSetIndex--;
        renderSet();
      }
    }

    function goToSet(idx) {
      currentSetIndex = idx;
      renderSet();
    }

    function updateNavButtons() {
      document.getElementById('prevBtn').disabled = currentSetIndex === 0;
      document.getElementById('nextBtn').disabled = currentSetIndex === verbsData.length - 1;
    }

    function updateDots() {
      const dots = document.querySelectorAll('.dot');
      dots.forEach((dot, i) => {
        if (i === currentSetIndex) {
          dot.classList.add('active');
        } else {
          dot.classList.remove('active');
        }
      });
    }

    document.getElementById('cheatOverlay').addEventListener('click', () => {
      document.getElementById('cheatOverlay').classList.remove('show');
    });

    document.getElementById('conjugationOverlay').addEventListener('click', (e) => {
      if (e.target === document.getElementById('conjugationOverlay')) {
        closeConjugationModal();
      }
    });

    document.getElementById('cardModalOverlay').addEventListener('click', (e) => {
      if (e.target === document.getElementById('cardModalOverlay')) {
        closeCardModal();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeConjugationModal();
        document.getElementById('cheatOverlay').classList.remove('show');
        if (activeModalCard) closeCardModal();
        return;
      }

      if (currentFocusedInput || activeModalCard) return;
      
      if (e.key === 'ArrowRight' && currentSetIndex < verbsData.length - 1) {
        nextSet();
      } else if (e.key === 'ArrowLeft' && currentSetIndex > 0) {
        previousSet();
      }
    });

    window.addEventListener('load', loadVerbsData);
  </script>
</body>
</html>
