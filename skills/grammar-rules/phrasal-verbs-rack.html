<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTUITY — The Rack</title>
<meta name="theme-color" content="#FAF7F2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@500;700;900&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
  if (window.self !== window.top) document.documentElement.classList.add('embedded');
</script>
<style>
  /* ═══ RACK ═══
     Nine phrasal verbs, one chance at each. What this replaces was the
     slate-card generation: #C0CAD2 faces on an #EAE4E1 ground, a marigold
     outline pill for the particle, a dark #312C22 cue box, and a baked
     noise texture on every card.

     The board is one material now. The tile is the same colour as the
     ground and exists only as light — pressed in when untouched, risen
     when dealt with. Depth means answered; it never means right or wrong.
     The verdict is a drawn mark in the corner, violet or orange, and the
     words sit UNDER the tile the way a label sits under an app icon,
     which is what lets the tile shrink and the ground breathe. */

  *,*::before,*::after{ margin:0; padding:0; box-sizing:border-box; }

  :root{
    /* A tone darker than the first cool stone (#E8EAEA). The lighter one
       gave the inset shadow too little to bite into, so a pressed tile read
       shallow; at this value the relief holds without the ground turning
       grey. Tile and ground are one colour, so this moves both. */
    --ground:#DFE3E3;          /* cool stone, one tone down */
    --ink:#17171A;            /* the modal's black, not a grey */
    --dim:#5C6366;
    --faint:#8A9093;
    --rule:#C2956E;            /* the caramel line under the header */
    --tick:#6B3FA0;
    --cross:#E8632A;
    --ok:#4A6B5C;
    --bad:#B8402A;
    --hot:#B44A22;             /* the one in hand */
    --shade:40,50,54;
    --header-h:96px; --foot-h:132px;
    --spring:cubic-bezier(.2,1.4,.4,1);
  }

  html,body{ height:100%; }
  body{
    background:var(--ground); color:var(--ink);
    font-family:'DM Sans',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button{ font:inherit; border:none; background:none; cursor:pointer; color:inherit; }

  /* Inside phrasal-verbs-play the host header already carries all of this. */
  html.embedded .header{ display:none; }
  html.embedded .stage{ top:0; }

  /* ── HEADER ── */
  .header{
    position:fixed; top:0; left:0; right:0; z-index:20; height:var(--header-h);
    display:flex; flex-direction:column; justify-content:center; gap:.5rem;
    padding:.6rem 1rem; background:#FAF7F2;
    /* The caramel rule. It belongs to the header, not the board: the header
       is fixed and the board scrolls under it, so drawn on the board it
       would scroll away and stop dividing anything. */
    border-bottom:1px solid var(--rule);
  }
  .htop{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; }
  .back{
    justify-self:start; text-decoration:none;
    font-family:'Space Grotesk',sans-serif; font-size:.6rem; font-weight:700;
    letter-spacing:.08em; text-transform:uppercase; color:var(--faint);
    transition:color .2s;
  }
  .back:hover{ color:var(--ink); }
  .title{ display:flex; flex-direction:column; align-items:center; line-height:1.1; }
  .title b{
    font-family:'Space Grotesk',sans-serif; font-size:1rem; font-weight:900;
    letter-spacing:.2em; color:var(--ink);
  }
  .title span{
    font-size:.56rem; font-weight:600; letter-spacing:.16em;
    text-transform:uppercase; color:var(--faint); margin-top:.15rem;
  }
  .hud{
    display:flex; justify-content:center; flex-wrap:wrap; gap:.9rem;
    font-family:'DM Mono',monospace; font-size:.66rem; color:var(--faint);
  }
  .hud b{ color:var(--dim); font-weight:500; }
  .hud .kept b{ color:var(--ok); }
  .hud .fell b{ color:var(--bad); }
  .streak{ transition:opacity .3s; }
  .streak.off{ opacity:0; }

  /* ── THE BOARD ──
     A wallpaper with icons on it, not a grid of buttons filling the frame.
     The tiles are small and the gaps are wide, so the ground is the
     dominant surface and each tile reads as an object placed on it. */
  .stage{
    position:fixed; top:var(--header-h); left:0; right:0; bottom:var(--foot-h);
    display:flex; align-items:center; justify-content:center; padding:1.4rem 1.1rem;
  }
  /* THE TILE IS CAPPED, NOT THE GRID. With repeat(3,1fr) inside a 23rem
     box the tiles stretched to fill whatever was left and the gap could
     never grow — on a 390px phone that inflated them to ~105px and the
     board closed up. Capping each column at 88px and centring the set
     means every pixel the screen gains goes into the space BETWEEN the
     tiles rather than into the tiles, which is what the wallpaper needs. */
  .rack{
    display:grid; grid-template-columns:repeat(3,minmax(0,114px));
    justify-content:center; gap:2.1rem 1.6rem; width:100%; margin:0 auto;
  }
  @media(max-height:720px){ .rack{ grid-template-columns:repeat(3,minmax(0,101px)); gap:1.6rem 1.3rem; } }
  @media(min-width:520px){ .rack{ grid-template-columns:repeat(3,minmax(0,135px)); gap:2.6rem 2.1rem; } }

  /* The card is now a container, not a surface: the tile and its label. */
  .card{
    position:relative; background:none; padding:0; cursor:pointer;
    transition:transform .14s var(--spring);
  }
  .card:active:not(.kept):not(.fell){ transform:scale(.94); }
  .card:focus-visible{ outline:2px solid var(--rule); outline-offset:5px; border-radius:14px; }

  /* ── THE TILE ──
     Same colour as the ground; the notch is cut with a mask, so the drop
     shadow has to live on the card (a box-shadow would be clipped away
     with the notch, and chained drop-shadows trace the alpha shape). */
  .face{
    position:relative; width:100%; aspect-ratio:1; border-radius:19px;
    background:var(--ground);
    box-shadow:inset 3px 4px 8px rgba(var(--shade),.22),
               inset -3px -3px 7px rgba(255,255,255,.9);
    -webkit-mask:radial-gradient(ellipse 14% 14% at 50% 0, transparent 97%, #000 100%);
            mask:radial-gradient(ellipse 14% 14% at 50% 0, transparent 97%, #000 100%);
    transition:box-shadow .18s;
  }

  /* Answered or in hand: the tile comes OUT of the surface. One axis, no
     exceptions — depth says "dealt with", never "right". */
  .card.kept, .card.fell, .card.answer{
    filter:drop-shadow(-3px -3px 5px rgba(255,255,255,.9))
           drop-shadow(3px 4px 7px rgba(var(--shade),.21));
  }
  .card.kept .face, .card.fell .face, .card.answer .face{ box-shadow:none; }
  .card.answer{
    filter:drop-shadow(-3px -3px 5px rgba(255,255,255,.95))
           drop-shadow(3px 5px 9px rgba(232,99,42,.28));
  }
  .card.kept, .card.fell{ cursor:default; }

  /* ── THE MARK ──
     Drawn, not seated: no disc, no badge. Both live in the DOM from the
     start and fade in, so nothing has to be built at the moment of
     answering. The cross is smaller than the tick because two crossing
     strokes carry more weight than one angle. */
  .mk{
    position:absolute; right:9%; bottom:8%; z-index:2;
    opacity:0; transform:scale(.6); transform-origin:70% 70%;
    transition:opacity .2s, transform .28s var(--spring);
    pointer-events:none;
  }
  .mk.tick{ width:19%; }
  .mk.cross{ width:17%; }
  .card.kept .mk.tick,
  .card.fell .mk.cross{ opacity:1; transform:scale(1); }

  /* ── THE WORDS, INSIDE THE TILE ──
     They sat under it as an app-icon caption for one build. Back inside,
     with a clear hierarchy rather than two lines of equal weight: the verb
     is the object of study, so it takes the ink and the size, and the
     particle answers to it below in caramel — the same #C2956E as the rule
     under the header and the ring on the menu discs. Two voices, one loud,
     and the caramel ties the board to the mark. */
  .lbl{
    position:absolute; inset:0; z-index:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:.14rem; padding:9% 5% 6%; text-align:center; pointer-events:none;
  }
  /* THE VERB IS THE POSTER. It was Space Grotesk 900 at 1rem in a grey —
     a heavy weight of a normal-width face, which reads as bold text rather
     than as a headline. Anton is the face the rules modal uses for EVERY
     DAY and the one the wordmark is set in: ultra-condensed, so it can be
     half again as large in the same square and still fit a long verb, and
     genuinely black rather than dark grey. The particle stepped down to
     grow with it, but by less: the verb went up about 60% and the particle
     about 19%, so the gap between them widens even as both get bigger. That
     ratio is the hierarchy — matching their growth would have flattened it
     straight back. */
  .lbl b{
    font-family:'Anton',Impact,sans-serif; font-weight:400;
    font-size:clamp(1.15rem,5.6vw,1.6rem); letter-spacing:.005em; line-height:.92;
    text-transform:uppercase; color:var(--ink);
  }
  .lbl span{
    font-family:'Space Grotesk',sans-serif; font-weight:600;
    font-size:clamp(.72rem,3vw,.88rem); letter-spacing:.015em; line-height:1.1;
    color:var(--rule);
  }
  .card.kept .lbl b, .card.fell .lbl b{ color:var(--faint); }
  .card.kept .lbl span, .card.fell .lbl span{ color:rgba(194,149,110,.6); }
  .card.answer .lbl b{ color:var(--hot); }
  .card.answer .lbl span{ color:var(--hot); }

  .card.wobble{ animation:wobble .5s; }
  @keyframes wobble{ 0%,100%{ transform:none } 25%{ transform:rotate(-3deg) } 60%{ transform:rotate(2deg) } }

  /* ── FOOT ── */
  /* The foot was a fixed 112px with the definition free to be as tall as it
     liked inside it, so a two-line clue on a narrow phone pushed the Deal
     button past the bottom edge — and on iOS past the home indicator as
     well. It sizes to its content now, with the board's bottom keyed to the
     same variable, so a long definition takes room from the board rather
     than from the screen. */
  .foot{
    position:fixed; bottom:0; left:0; right:0; min-height:var(--foot-h);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:.55rem; padding:.8rem 1rem calc(env(safe-area-inset-bottom,0px) + .9rem);
    text-align:center; background:var(--ground);
    border-top:1px solid rgba(var(--shade),.14);
  }
  @media(max-width:430px){
    :root{ --foot-h:148px; }
    .clue{ font-size:.92rem; line-height:1.3; }
    .foot{ gap:.45rem; }
  }
  /* The prompt was a dark #312C22 box — the last near-black surface on this
     screen. It is a plain line on the board now; the board is quiet enough
     that it does not need a container to be found. */
  .cue{ display:flex; flex-direction:column; gap:.2rem; max-width:26rem; }
  .ask{
    font-family:'DM Mono',monospace; font-size:.58rem; letter-spacing:.14em;
    text-transform:uppercase; color:var(--faint);
  }
  .clue{
    font-family:'Space Grotesk',sans-serif; font-size:1rem; font-weight:500;
    color:var(--ink); line-height:1.35;
  }
  .clue.waiting{ font-family:'DM Sans',sans-serif; font-weight:400; color:var(--dim); font-size:.86rem; }
  .cue.live .ask{ color:var(--rule); }

  .deal{
    font-family:'Space Grotesk',sans-serif; font-size:.72rem; font-weight:700;
    letter-spacing:.02em; padding:.65rem 1.7rem; border-radius:999px;
    background:var(--hot); color:#FFF7F3;
    transition:transform .1s var(--spring), opacity .15s;
  }
  .deal:active{ transform:scale(.95); }
  .deal:disabled{ opacity:.3; cursor:not-allowed; }

  /* ── BANNER & END ── */
  .banner{
    position:fixed; top:calc(var(--header-h) + 10px); left:50%;
    transform:translateX(-50%); z-index:30; pointer-events:none;
    font-family:'Space Grotesk',sans-serif; font-size:.74rem; font-weight:700;
    letter-spacing:.03em; color:var(--ink);
    background:#FAF7F2; border-radius:999px; padding:.45rem 1.1rem;
    box-shadow:0 5px 14px rgba(var(--shade),.16);
    opacity:0; transition:opacity .3s; white-space:nowrap;
  }
  .banner.show{ opacity:1; }

  .over{
    position:fixed; inset:0; z-index:40; display:none;
    flex-direction:column; align-items:center; justify-content:center;
    gap:.6rem; padding:2rem; text-align:center; background:var(--ground);
  }
  .over.show{ display:flex; }
  .over .big{
    font-family:'Space Grotesk',sans-serif; font-weight:900;
    font-size:clamp(2.6rem,13vw,4rem); letter-spacing:-.03em; color:var(--ink);
  }
  .over .praise{ font-family:'Space Grotesk',sans-serif; font-size:1.05rem; font-weight:500; }
  .over .sub{ font-size:.88rem; color:var(--dim); max-width:22rem; line-height:1.6; }
  .acts{ display:flex; flex-wrap:wrap; gap:.6rem; justify-content:center; margin-top:.8rem; }
  .quiet{
    font-family:'Space Grotesk',sans-serif; font-size:.7rem; font-weight:700;
    padding:.6rem 1.2rem; border-radius:999px;
    background:rgba(var(--shade),.08); color:var(--dim);
    transition:transform .1s var(--spring);
  }
  .quiet:active{ transform:scale(.95); }
  .go{
    font-family:'Space Grotesk',sans-serif; font-size:.7rem; font-weight:700;
    padding:.6rem 1.4rem; border-radius:999px;
    background:var(--hot); color:#FFF7F3;
    transition:transform .1s var(--spring);
  }
  .go:active{ transform:scale(.95); }
  .away{ margin-top:1.4rem; }

  /* ── THE BURST ──
     Kept from the old build, retinted. The flash was a white-to-acid-yellow
     radial; on a cool stone ground it now blooms caramel, and the crackle
     and ring lose their white glow for the board's own ink — a glow needs
     a dark ground to read as light, and there isn't one here any more. */
  .spark{ position:absolute; width:5px; height:5px; border-radius:50%; pointer-events:none; z-index:30; }
  .fw-flash{ width:64px; height:64px; border-radius:50%;
             background:radial-gradient(circle,#FFFFFF 0%,#C2956E 38%,rgba(194,149,110,0) 70%); }
  .fw-crackle{ width:3px; height:3px; border-radius:50%; background:#C2956E; }
  .fw-ring{ width:16px; height:16px; border-radius:50%; border:2.5px solid var(--hot);
            background:transparent; }

  .loading{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:var(--ground); color:var(--faint); font-size:.86rem; z-index:50;
  }
  .loading.gone{ display:none; }
  .err{ color:var(--bad); line-height:1.7; text-align:center; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="htop">
    <a class="back" href="/?openModal=grammar">← Grammar</a>
    <div class="title"><b>INTUITY</b><span>Phrasal Verbs</span></div>
    <div></div>
  </div>
  <div class="hud">
    <span class="kept"><b id="kept">0</b> kept</span>
    <span class="fell"><b id="fell">0</b> fallen</span>
    <span><b id="standing">9</b> standing</span>
    <span class="streak" id="streakWrap">🔥 <b id="streakN">0</b> streak</span>
  </div>
</header>

<div class="stage"><div class="rack" id="rack"></div></div>

<div class="foot">
  <div class="cue" id="cue">
    <div class="ask" id="ask">press deal</div>
    <div class="clue waiting" id="clue" aria-live="polite">nine phrasal verbs — one chance at each</div>
  </div>
  <button class="deal" id="dealBtn" onclick="deal()">Deal</button>
</div>

<div class="banner" id="banner"></div>
<div class="over" id="over">
  <div class="big" id="overBig">0</div>
  <div class="praise" id="overPraise"></div>
  <div class="sub" id="overSub"></div>
  <div class="acts">
    <button class="quiet" id="backBtn" onclick="backRack()">← Before</button>
    <button class="quiet" onclick="repeatRack()">↻ These nine again</button>
    <button class="go" onclick="nextRack()">Next nine →</button>
  </div>
  <button class="quiet away" onclick="location.href='phrasal-verbs-play.html'">Back to phrasal verbs</button>
</div>
<div class="loading" id="loading">Loading…</div>

<script src="intuity-log.js"></script>
<script src="intuity-sound.js"></script>
<script>
const DATA_URL = '../../data/grammar-rules/phrasal-verbs-data.json';
/* Nine, not sixteen. On a phone a sixteen-card rack is four columns of
   72px cards whose verbs sit at about 10px — the board fits, but nothing on
   it is comfortably readable or comfortably tappable. Nine is 3x3 on every
   screen, which roughly doubles the card and needs no scrolling anywhere. */
const SIZE = 9;
const REDUCE_MOTION = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

let POOL = [], cards = [], target = null, locked = false;
let kept = 0, fell = 0, streak = 0, best = 0;
const RETRY_GAP = 4;     /* turns before a missed card is asked again */
let autoDealTimer = null;

let order = [], orderPos = -1;

let history = [], at = -1, racks = 1;

const RIGHT_LINES = ['Nice catch!', 'Exactly right!', 'Straight to it!', 'Sharp eyes!', 'Right in one!', 'Got it!'];
const WRONG_LINES = ['So close — onward!', 'Good guess — next one!', 'Worth remembering!', 'Keep going!'];

let actx = null;
/* Sound lives in intuity-sound.js, so every page in the suite plays the same
   cues and a change reaches all of them.

   Wrapped, and deliberately so: when that file 404'd, SFX was undefined and
   the exception took down choose() halfway through — a correct answer scored
   nothing and the board froze. Nothing decorative should ever be able to stop
   the game, so every cue goes through here and a missing file costs silence
   and nothing else. */
function sfx(cue){
  try{ if (window.SFX && typeof SFX[cue] === 'function') SFX[cue](); }
  catch(e){ /* sound is never worth an exception */ }
}
function playCorrectSound(){ sfx('correct'); }
function playIncorrectSound(){ sfx('wrong'); }
function playStreakSound(){ sfx('fanfare'); }

const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const shuffle = a => { const b=[...a]; for(let i=b.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[b[i],b[j]]=[b[j],b[i]];} return b; };
const pick = arr => arr[(Math.random()*arr.length)|0];
const firstSense = m => String(m).split(';')[0].trim();

async function boot(){
  try{
    const res = await fetch(DATA_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const d = await res.json();
    (d.groups || []).forEach(g => (g.items || []).forEach(it => {
      if (it.particle && it.meaning)
        POOL.push({ verb:(it.verb || g.label || g.id).toUpperCase(),
                    particle: it.particle.toLowerCase(),
                    meaning: it.meaning });
    }));
    if (POOL.length < SIZE) throw new Error('not enough phrases');
    $('loading').remove();
    start();
  }catch(e){
    $('loading').innerHTML = '<p class="err">Could not load <b>' + DATA_URL + '</b>.<br>' +
      'Open this from the site rather than as a local file — browsers block file:// requests.</p>';
  }
}

function start(){
  const seen = new Set(), picked = [];
  for (const p of shuffle(POOL)){
    if (picked.length === SIZE) break;
    if (seen.has(p.verb)) continue;
    seen.add(p.verb); picked.push(p);
  }
  while (picked.length < SIZE) picked.push(shuffle(POOL)[0]);

  history = history.slice(0, at + 1);
  history.push(picked);
  at = history.length - 1;
  lay(picked);
}

function lay(picked){
  cards = picked.map(p => ({ ...p, state:'up' }));
  kept = fell = 0; streak = 0; target = null; locked = false;
  order = shuffle(cards.map((_, i) => i));
  orderPos = -1;
  $('over').classList.remove('show');
  drawRack(); paint();
  $('ask').textContent = 'getting ready';
  $('clue').textContent = 'nine phrasal verbs — one chance at each';
  $('clue').classList.add('waiting');
  $('dealBtn').textContent = 'Skip wait';
  $('dealBtn').classList.add('quiet');
  clearTimeout(autoDealTimer);
  autoDealTimer = setTimeout(deal, 500);
}

function drawRack(){
  const r = $('rack'); r.innerHTML = '';
  cards.forEach((c, i) => {
    const el = document.createElement('div');
    el.className = 'card'; el.id = 'k' + i;
    el.tabIndex = 0;
    el.setAttribute('role', 'button');
    el.setAttribute('aria-label', c.verb + ' ' + c.particle);
    /* The tile and its label are separate elements now: the tile is pure
       material and the words sit under it, which is what lets the tile
       shrink without squeezing the type. Both marks are built in and
       revealed by class — nothing is constructed at the moment of
       answering, so the reveal cannot stutter. */
    el.innerHTML = '<div class="face">' +
                     '<svg class="mk tick" viewBox="0 0 24 24" fill="none" stroke="var(--tick)" stroke-width="5.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13.5c2.6 1.4 4.4 3.2 5.8 5.4C11.4 13 15.2 8 21 4.2"/></svg>' + '<svg class="mk cross" viewBox="0 0 24 24" fill="none" stroke="var(--cross)" stroke-width="5.8" stroke-linecap="round"><path d="M5.4 5c4.2 4.2 8.6 9.2 13.4 14.2M18.6 5.4C14.2 9.4 9.6 14.6 5.2 19"/></svg>' +
                   '</div>' +
                   '<div class="lbl"><b>' + esc(c.verb) + '</b>' +
                   '<span>' + esc(c.particle) + '</span></div>';
    el.onclick = () => choose(i);
    el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); choose(i); } };
    r.appendChild(el);
  });
}

function deal(){
  if (locked) return;
  clearTimeout(autoDealTimer);
  if (target !== null) order.push(order[orderPos]);   /* skipped: ask it again later */
  orderPos++;
  while (orderPos < order.length && cards[order[orderPos]].state !== 'up') orderPos++;
  if (orderPos >= order.length) return over();

  target = order[orderPos];
  $('ask').textContent = 'which card means';
  $('clue').textContent = firstSense(cards[target].meaning);
  $('clue').classList.remove('waiting');
  $('cue').classList.add('live');
  wobble();
  $('dealBtn').textContent = 'Skip';
  $('dealBtn').classList.add('quiet');
}

/* Restart the animation on every new definition: removing the class and
   reading offsetWidth forces the reflow that lets it play again. */
function wobble(){
  const c = $('cue');
  if (!c) return;
  c.classList.remove('wob'); void c.offsetWidth; c.classList.add('wob');
}

function choose(i){
  if (locked || target === null) return;
  const c = cards[i];
  if (c.state !== 'up') return;
  locked = true;
  const el = $('k' + i);
  const asked = cards[target];
  if (window.INTUITY) INTUITY.log('phrasal-verbs',
    asked.verb + ' ' + asked.particle, i === target, { game:'rack' });

  if (i === target){
    c.state = 'kept'; kept++; streak++;
    el.classList.add('kept');
    el.tabIndex = -1;
    el.setAttribute('aria-label', c.verb + ' ' + c.particle + ', kept');
    /* One event, one sound. A streak milestone is still a correct answer,
       just a bigger one — so it gets the fanfare instead of the chime rather
       than both at once, which is what made the doubled jingle. */
    if (streak >= 3 && streak % 3 === 0) playStreakSound(); else playCorrectSound();
    burst(el);
    flash(pick(RIGHT_LINES), 'var(--ok)');
    updateStreak();
    target = null;
    setTimeout(() => { locked = false; paint(); nextOrEnd(true); }, 700);
  } else {
    /* The card the child touched wobbles, turns pumpkin and is out for the
       rest of the round. The card that was asked about is not lost with it —
       it comes back a few turns later, so the one phrase they got wrong is
       the one phrase they meet twice. Attrition is guaranteed either way,
       since every miss takes a card off the rack, so the round always ends. */
    streak = 0;
    const t = target;
    c.state = 'fell'; fell++;
    el.tabIndex = -1;
    el.setAttribute('aria-label', c.verb + ' ' + c.particle + ', out');

    playIncorrectSound();
    updateStreak();
    if (REDUCE_MOTION){
      el.classList.add('fell');
    } else {
      el.classList.add('wobble');
      setTimeout(() => { el.classList.remove('wobble'); el.classList.add('fell'); }, 420);
    }

    /* The right card is shown in the cue's own brown, never in pumpkin —
       pumpkin means lost, and this is the opposite of lost. */
    flash(esc(asked.verb + ' ' + asked.particle), 'var(--bad)');
    $('k' + t).classList.add('answer');
    order.splice(Math.min(orderPos + RETRY_GAP, order.length), 0, t);

    target = null;
    setTimeout(() => {
      $('k' + t).classList.remove('answer');
      locked = false; paint(); nextOrEnd(false);
    }, 1100);
  }
}

function updateStreak(){
  best = Math.max(best, streak);
  const wrap = $('streakWrap');
  $('streakN').textContent = streak;
  wrap.classList.toggle('show', streak >= 2);
}

function nextOrEnd(wasCorrect){
  const live = cards.filter(c => c.state === 'up').length;
  if (!live) return over();
  const line = wasCorrect === null ? '' : (wasCorrect ? pick(RIGHT_LINES) : pick(WRONG_LINES));
  $('cue').classList.remove('live');
  $('ask').textContent = 'next up';
  $('clue').textContent = (line ? line + ' · ' : '') + live + ' still standing';
  $('clue').classList.add('waiting');
  $('dealBtn').textContent = 'Skip wait';
  $('dealBtn').classList.add('quiet');
  clearTimeout(autoDealTimer);
  autoDealTimer = setTimeout(deal, 900);
}

function paint(){
  $('kept').textContent = kept;
  $('fell').textContent = fell;
  $('standing').textContent = cards.filter(c => c.state === 'up').length;
}

function praiseFor(k){
  const frac = k / SIZE;
  if (frac === 1) return 'Perfect rack — every one kept.';
  if (frac >= .75) return 'Great run — barely any got away.';
  if (frac >= .5)  return 'Solid work. A few worth another look.';
  return 'A tricky set — good ones to come back to.';
}

function over(){
  if ($('over').classList.contains('show')) return;
  if (window.INTUITY) INTUITY.session('phrasal-verbs', 'rack', { kept: kept, fell: fell });
  $('overBig').textContent = kept + ' / ' + SIZE;
  $('overPraise').textContent = praiseFor(kept);
  $('overSub').textContent = (fell ? fell + (fell === 1 ? ' card lost' : ' cards lost')
                                   : 'the whole rack') + ' · rack ' + racks +
                                   (best >= 3 ? ' · best streak ' + best : '');
  $('backBtn').disabled = at <= 0;
  $('over').classList.add('show');
}

function nextRack(){
  $('over').classList.remove('show'); racks++;
  if (at < history.length - 1){ at++; lay(history[at]); }
  else start();
}

function backRack(){
  if (at <= 0) return;
  $('over').classList.remove('show'); at--; racks++;
  lay(history[at]);
}

function repeatRack(){
  $('over').classList.remove('show'); racks++;
  lay(history[at]);
}

function flash(text, col){
  const b = $('banner');
  b.textContent = text; b.style.color = col;
  b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
  setTimeout(() => b.classList.remove('show'), 1100);
}

/* The old six were the dark theme's: acid yellow, gold, lime, and a blue
   that appears nowhere else. These are the board's own — the two marks, the
   caramel rule, and the palette's sage and ink. */
const FW_COLS = ['#6B3FA0','#E8632A','#C2956E','#4A6B5C','#FFFFFF','#B44A22'];

function pop(stage, cx, cy, scale){
  scale = scale || 1;

  const f = document.createElement('div');
  f.className = 'spark fw-flash';
  f.style.left = cx+'px'; f.style.top = cy+'px';
  f.style.width = (64*scale)+'px'; f.style.height = (64*scale)+'px';
  stage.appendChild(f);
  f.animate([{transform:'translate(-50%,-50%) scale(.2)',opacity:1},
             {transform:'translate(-50%,-50%) scale(3)',opacity:0}],
            {duration:420,easing:'cubic-bezier(.1,.8,.2,1)'});
  setTimeout(()=>f.remove(),440);

  const ring = document.createElement('div');
  ring.className = 'spark fw-ring';
  ring.style.left = cx+'px'; ring.style.top = cy+'px';
  stage.appendChild(ring);
  ring.animate([
    {transform:'translate(-50%,-50%) scale(.5)', opacity:.9},
    {transform:'translate(-50%,-50%) scale('+(13*scale)+')', opacity:0}
  ],{duration:560,easing:'cubic-bezier(.1,.7,.3,1)'});
  setTimeout(()=>ring.remove(),580);

  const count = Math.round(78*scale);
  for (let i=0;i<count;i++){
    const p = document.createElement('div');
    p.className = 'spark';
    const col = FW_COLS[(Math.random()*FW_COLS.length)|0], size = (4+Math.random()*5)*Math.max(scale,.8);
    p.style.cssText += 'left:'+cx+'px; top:'+cy+'px; width:'+size+'px; height:'+size+
      'px; background:'+col+'; box-shadow:0 0 '+(size*2.6)+'px '+col+';';
    stage.appendChild(p);
    const a = Math.random()*Math.PI*2, d = (95+Math.random()*290)*scale;
    const dx = Math.cos(a)*d, dy = Math.sin(a)*d, fall = 55+Math.random()*95;
    const dur = 780+Math.random()*520;
    p.animate([
      {transform:'translate(-50%,-50%) translate(0,0) scale(1.15)',opacity:1},
      {transform:'translate(-50%,-50%) translate('+(dx*.62).toFixed(0)+'px,'+(dy*.62-10).toFixed(0)+'px) scale(1)',opacity:1,offset:.4},
      {transform:'translate(-50%,-50%) translate('+dx.toFixed(0)+'px,'+(dy+fall).toFixed(0)+'px) scale(.25)',opacity:0}
    ],{duration:dur,easing:'cubic-bezier(.12,.75,.3,1)'});
    setTimeout(()=>p.remove(),dur+30);
  }

  setTimeout(()=>{
    const crackles = Math.round(30*scale);
    for (let i=0;i<crackles;i++){
      const c = document.createElement('div');
      c.className = 'spark fw-crackle';
      const a = Math.random()*Math.PI*2, d = (26+Math.random()*100)*scale;
      c.style.left = (cx+Math.cos(a)*d*.5)+'px'; c.style.top = (cy+Math.sin(a)*d*.5)+'px';
      stage.appendChild(c);
      c.animate([{opacity:0,transform:'translate(-50%,-50%) scale(.4)'},
                 {opacity:1,transform:'translate(-50%,-50%) scale(1.4)',offset:.25},
                 {opacity:0,transform:'translate(-50%,-50%) scale(.3)'}],
                {duration:300+Math.random()*240,easing:'ease-out'});
      setTimeout(()=>c.remove(),600);
    }
  },220);
}

function burst(el){
  if (REDUCE_MOTION) return;
  const stage = document.querySelector('.stage');
  const s = stage.getBoundingClientRect(), r = el.getBoundingClientRect();
  const cx = r.left - s.left + r.width/2, cy = r.top - s.top + r.height/2;

  pop(stage, cx, cy, 1.75);
  setTimeout(() => {
    const ox = cx + (Math.random()*180-90), oy = cy + (Math.random()*120-90);
    pop(stage, ox, oy, 1.0);
  }, 150 + Math.random()*90);
  setTimeout(() => {
    const ox = cx + (Math.random()*240-120), oy = cy + (Math.random()*150-100);
    pop(stage, ox, oy, .62);
  }, 330 + Math.random()*110);
}

if (window.self !== window.top) document.body.classList.add('embedded');
boot();
</script>
