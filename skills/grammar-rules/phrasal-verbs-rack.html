<style>
  *,*::before,*::after{ margin:0; padding:0; box-sizing:border-box; }

    --ink:#17171a;
    --egg-free:#61b5ed;
    --egg-right:#abc32f;
    --egg-lost:#ff9248;
    --egg-word:#2f3540;
  --card:#ffffff; --card-edge:#e4e2da;
--card-kept-1:#f4f9e8; --card-kept-2:#e9f2d2;
    --card-fell-1:#6b2a22; --card-fell-2:#43160f; --crack:#ff5a3c;

  html,body{ width:100%; height:100%; overflow:hidden; background:#0d0d0d; }
  body{ font-family:'DM Sans',sans-serif; color:var(--paper); user-select:none; -webkit-user-select:none; }
  button{ font:inherit; color:inherit; background:none; border:none; cursor:pointer; }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; scroll-behavior:auto !important; }
  }

  .header{
    position:fixed; top:0; left:0; right:0; z-index:20; height:var(--header-h);
    display:flex; flex-direction:column; gap:.35rem; padding:.5rem 1.25rem .4rem;
    background:rgba(13,13,13,.9); backdrop-filter:blur(20px);
    border-bottom:1px solid rgba(255,255,255,.06);
  }
  .htop{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; }
  .back{ justify-self:start; text-decoration:none; font-family:'Space Grotesk',sans-serif;
         font-size:.6rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:rgba(255,255,255,.3); }
  .back:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; border-radius:2px; }
  .title{ display:flex; flex-direction:column; align-items:center; line-height:1.1; }
  .title b{ font-family:'Space Grotesk',sans-serif; font-size:1rem; font-weight:900; letter-spacing:.22em; color:var(--gold); }
  .title span{ font-size:.56rem; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:rgba(255,255,255,.32); margin-top:.1rem; }
  .hud{ display:flex; justify-content:center; align-items:center; gap:1.3rem; font-family:'DM Mono',monospace; font-size:.66rem; color:var(--dim); }
  .hud b{ color:var(--paper); font-variant-numeric:tabular-nums; }
  .hud .kept b{ color:var(--ok); } .hud .fell b{ color:var(--bad); }
  .streak{
    display:flex; align-items:center; gap:.28rem; padding:.12rem .5rem .14rem; border-radius:99px;
    background:rgba(255,217,74,.14); border:1px solid rgba(255,217,74,.4); color:var(--accent);
    font-weight:600; opacity:0; transform:scale(.85); transition:opacity .2s, transform .25s cubic-bezier(.2,1.6,.4,1);
  }
  .streak.show{ opacity:1; transform:scale(1); }

  .stage{
    position:fixed; top:var(--header-h); left:0; right:0; bottom:var(--foot-h);
    display:flex; align-items:center; justify-content:center; padding:.5rem .7rem;
    background:
      radial-gradient(ellipse at 50% 10%, rgba(201,169,97,.08), transparent 60%),
      radial-gradient(ellipse at 50% 100%, rgba(0,0,0,.55), transparent 60%);
  }
  .rack{
    display:grid; gap:.45rem; width:100%; max-width:62rem; height:100%;
    grid-template-columns:repeat(8, 1fr); grid-auto-rows:1fr;
    perspective:900px;
  }
  @media(max-width:900px){ .rack{ grid-template-columns:repeat(4, 1fr); } }

 .card{
  position:relative; border-radius:.4rem; cursor:pointer;
  background:radial-gradient(120% 140% at 50% 0%, #ffffff 0%, #f1f1f0 55%, #e8e7e5 100%);
  border:1px solid var(--card-edge);
  box-shadow:
    0 .3rem .6rem rgba(0,0,0,.35),
    0 .06rem .12rem rgba(0,0,0,.25),
    inset 0 1px 0 rgba(255,255,255,.9),
    inset 0 -1px 0 rgba(0,0,0,.12),
    inset 1px 0 0 rgba(255,255,255,.4),
    inset -1px 0 0 rgba(0,0,0,.06);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:.25rem .2rem .05rem;
  transform-origin:50% 100%;
  transition:transform .16s cubic-bezier(.2,1.4,.4,1), box-shadow .16s, filter .3s;
}
.card:hover{ transform:translateY(-4px) rotate(-.6deg); box-shadow:0 .5rem 1rem rgba(0,0,0,.4); }
.card:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

.card .verb{
  font-family:'Archivo Black',sans-serif; font-weight:400; color:var(--ink);
  font-size:clamp(1.05rem,4vw,1.4rem); letter-spacing:-.02em; line-height:.92;
  text-align:center; margin-bottom:.28rem;
}
  .card .plate{
    margin-top:auto; border-radius:999px; align-self:center;
    background:var(--egg-free); color:var(--egg-word);
    font-family:'Space Grotesk',sans-serif; font-weight:700;
    font-size:clamp(.6rem,2.1vw,.72rem); letter-spacing:.04em; line-height:1;
    padding:.16rem .58rem .19rem; text-align:center; white-space:nowrap;
    max-width:100%; overflow:hidden; text-overflow:ellipsis;
    box-shadow:0 1px 3px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.4), inset 0 -2px 3px rgba(0,0,0,.1);
  }

  .card.kept{
  cursor:default; border-color:var(--ok);
  background:radial-gradient(120% 140% at 50% 0%, var(--card-kept-1) 0%, var(--card-kept-2) 100%);
  box-shadow:0 .3rem .6rem rgba(0,0,0,.3), inset 0 0 0 1.5px var(--ok), inset 0 1px 0 rgba(255,255,255,.7);
}
  .card.kept::after{
    content:'✓'; position:absolute; top:.1rem; right:.22rem;
    font-size:.72rem; font-weight:900; color:#3b5405;
  }
  .card.kept:hover{ transform:none; }
  .card.kept .plate{ background:var(--egg-right); color:#1c2607; }

  .card.fell{
  position:relative; cursor:default; pointer-events:none;
  background:radial-gradient(120% 140% at 50% 0%, var(--card-fell-1) 0%, var(--card-fell-2) 100%);
  border-color:var(--crack);
  transform:rotate(-2deg);
  box-shadow:0 .22rem .5rem rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.12), inset 0 -1px 0 rgba(0,0,0,.3), inset 0 0 0 1.5px rgba(255,90,60,.6);
}
  .card.fell::before{
    content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background:
      linear-gradient(106deg, transparent 45%, rgba(255,255,255,.4) 47%, transparent 49%),
      linear-gradient(58deg, transparent 61%, rgba(255,255,255,.24) 63%, transparent 65%),
      linear-gradient(151deg, transparent 29%, rgba(255,255,255,.18) 31%, transparent 33%);
    mix-blend-mode:overlay;
  }
  .card.fell::after{
    content:'✕'; position:absolute; top:.1rem; right:.22rem;
    font-size:.72rem; font-weight:900; color:var(--crack);
  }
  .card.fell .verb{ color:#ffcfc3; }
  .card.fell .foil{ background:linear-gradient(90deg, transparent, #ff8a6e 20%, #ffd0c2 50%, #ff8a6e 80%, transparent); opacity:.45; }
  .card.fell .plate{ background:var(--egg-lost); color:#2a0e08; }
  .card.wobble{ animation:wobble .5s; }
  @keyframes wobble{ 0%,100%{ transform:none } 25%{ transform:rotate(-4deg) } 60%{ transform:rotate(3deg) } }

  .card.current{
    box-shadow:0 0 0 2px var(--accent), 0 .28rem .55rem rgba(0,0,0,.55);
    animation:breathe 1.8s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{ box-shadow:0 0 0 2px var(--accent), 0 .28rem .55rem rgba(0,0,0,.55); }
    50%{ box-shadow:0 0 0 2px var(--accent), 0 0 .9rem rgba(255,217,74,.55); }
  }

  .foot{
    position:fixed; bottom:0; left:0; right:0; height:var(--foot-h);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.4rem;
    padding:.5rem 1rem; text-align:center;
    background:rgba(13,13,13,.94); backdrop-filter:blur(20px);
    border-top:1px solid rgba(201,169,97,.22);
    background-image:linear-gradient(180deg, rgba(201,169,97,.07), transparent 45%);
  }
  .ask{ font-family:'DM Mono',monospace; font-size:.54rem; letter-spacing:.16em;
        text-transform:uppercase; color:var(--gold); }
  .clue{ font-size:clamp(.9rem,2.8vw,1.15rem); line-height:1.35; max-width:46rem; color:var(--paper); min-height:1.5em; }
  .clue.waiting{ color:var(--faint); }
  .deal{
    padding:.5rem 1.6rem; border-radius:99px; background:var(--accent); color:#12100a;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:.7rem;
    letter-spacing:.14em; text-transform:uppercase;
  }
  .deal:focus-visible{ outline:2px solid var(--paper); outline-offset:3px; }
  .deal.quiet{ background:none; color:var(--dim); border:1px solid rgba(255,255,255,.16); }

  .banner{
    position:fixed; left:50%; top:42%; z-index:40; pointer-events:none;
    font-family:'Space Grotesk',sans-serif; font-weight:900;
    font-size:clamp(1.3rem,4.5vw,2.2rem); letter-spacing:.14em; text-transform:uppercase;
    opacity:0; transform:translate(-50%,-50%) scale(.8);
    transition:opacity .2s, transform .4s cubic-bezier(.2,1.6,.4,1); text-shadow:0 0 22px currentColor;
  }
  .banner.show{ opacity:1; transform:translate(-50%,-50%) scale(1); }

  .spark{ position:absolute; width:5px; height:5px; border-radius:50%; pointer-events:none; z-index:30; }
  .fw-flash{ width:64px; height:64px; border-radius:50%;
             background:radial-gradient(circle,#fff 0%,#FFD94A 35%,rgba(255,217,74,0) 70%); }
  .fw-crackle{ width:3px; height:3px; border-radius:50%; background:#fff; box-shadow:0 0 8px #fff; }
  .fw-ring{ width:16px; height:16px; border-radius:50%; border:2.5px solid #fff;
            box-shadow:0 0 10px rgba(255,255,255,.6); background:transparent; }

  .over{
    position:fixed; inset:0; z-index:50; display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:.4rem; text-align:center; padding:2rem;
    background:rgba(8,8,9,.95); backdrop-filter:blur(6px);
  }
  .over.show{ display:flex; }
  .over .big{ font-family:'Space Grotesk',sans-serif; font-weight:900;
              font-size:clamp(2.2rem,8vw,3.4rem); color:var(--accent); }
  .over .praise{ font-family:'Fraunces',serif; font-style:italic; font-weight:500;
                 font-size:clamp(1rem,3vw,1.3rem); color:var(--paper); margin-top:.1rem; }
  .over .sub{ font-family:'DM Mono',monospace; font-size:.7rem; letter-spacing:.14em;
              text-transform:uppercase; color:var(--dim); margin-top:.3rem; }
  .acts{ display:flex; gap:.6rem; flex-wrap:wrap; justify-content:center; margin-top:1.3rem; }
  .over .go{ padding:.7rem 1.7rem; border-radius:99px; background:var(--accent); color:#12100a;
             font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:.74rem;
             letter-spacing:.1em; text-transform:uppercase; }
  .over .quiet{ padding:.7rem 1.5rem; border-radius:99px; color:var(--dim);
                border:1px solid rgba(255,255,255,.16); font-size:.72rem;
                letter-spacing:.08em; text-transform:uppercase; }
  .over .quiet:hover{ color:var(--paper); }
  .over .quiet[disabled]{ opacity:.3; cursor:default; }
  .over .away{ margin-top:.9rem; font-size:.66rem; border:none; }
  .over button:focus-visible{ outline:2px solid var(--paper); outline-offset:3px; }

  .loading{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; color:var(--dim); font-size:.8rem; }
  .err{ color:var(--bad); text-align:center; max-width:30rem; line-height:1.7; padding:2rem; }

  body.embedded{ --header-h:38px; }
  body.embedded .htop{ display:none; }
  body.embedded .header{ padding:.28rem 1rem .22rem; justify-content:center; }
</style>

<body>

<header class="header">
  <div class="htop">
    <a class="back" href="/?openModal=grammar">← Grammar</a>
    <div class="title"><b>INTUITY</b><span>Phrasal Verbs</span></div>
    <div></div>
  </div>
  <div class="hud">
    <span class="kept"><b id="kept">0</b> kept</span>
    <span class="fell"><b id="fell">0</b> fallen</span>
    <span><b id="standing">16</b> standing</span>
    <span class="streak" id="streakWrap">🔥 <b id="streakN">0</b> streak</span>
  </div>
</header>

<div class="stage"><div class="rack" id="rack"></div></div>

<div class="foot">
  <div class="ask" id="ask">press deal</div>
  <div class="clue waiting" id="clue" aria-live="polite">sixteen phrasal verbs — one chance at each</div>
  <button class="deal" id="dealBtn" onclick="deal()">Deal</button>
</div>

<div class="banner" id="banner"></div>
<div class="over" id="over">
  <div class="big" id="overBig">0</div>
  <div class="praise" id="overPraise"></div>
  <div class="sub" id="overSub"></div>
  <div class="acts">
    <button class="quiet" id="backBtn" onclick="backRack()">← Before</button>
    <button class="quiet" onclick="repeatRack()">↻ These sixteen again</button>
    <button class="go" onclick="nextRack()">Next sixteen →</button>
  </div>
  <button class="quiet away" onclick="location.href='phrasal-verbs-play.html'">Back to phrasal verbs</button>
</div>
<div class="loading" id="loading">Loading…</div>

<script src="intuity-log.js"></script>
<script>
const DATA_URL = '../../data/grammar-rules/phrasal-verbs-data.json';
const SIZE = 16;
const REDUCE_MOTION = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

let POOL = [], cards = [], target = null, locked = false;
let kept = 0, fell = 0, streak = 0, best = 0;
let autoDealTimer = null;

let order = [], orderPos = -1;

let history = [], at = -1, racks = 1;

const RIGHT_LINES = ['Nice catch!', 'Exactly right!', 'Straight to it!', 'Sharp eyes!', 'Right in one!', 'Got it!'];
const WRONG_LINES = ['So close — onward!', 'Good guess — next one!', 'Worth remembering!', 'Keep going!'];

let actx = null;
function ensureAudio(){
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function chime(ctx, freq, startAt, dur, peak, type){
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type = type || 'sine'; osc.frequency.value = freq;
  osc.connect(gain); gain.connect(ctx.destination);
  const t0 = ctx.currentTime + startAt;
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(peak, t0 + .018);
  gain.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  osc.start(t0); osc.stop(t0 + dur + .03);
}
function playCorrectSound(){
  try{
    const ctx = ensureAudio();
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) =>
      chime(ctx, f, i * .075, .55, .1, 'triangle'));
  }catch(e){}
}
function playIncorrectSound(){
  try{
    const ctx = ensureAudio();
    chime(ctx, 392.00, 0,   .42, .055, 'sine');
    chime(ctx, 329.63, .11, .5,  .05,  'sine');
  }catch(e){}
}
function playStreakSound(n){
  try{
    const ctx = ensureAudio();
    [1318.5, 1567.98].forEach((f, i) => chime(ctx, f, .28 + i*.09, .4, .07, 'triangle'));
  }catch(e){}
}

const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const shuffle = a => { const b=[...a]; for(let i=b.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[b[i],b[j]]=[b[j],b[i]];} return b; };
const pick = arr => arr[(Math.random()*arr.length)|0];
const firstSense = m => String(m).split(';')[0].trim();

async function boot(){
  try{
    const res = await fetch(DATA_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const d = await res.json();
    (d.groups || []).forEach(g => (g.items || []).forEach(it => {
      if (it.particle && it.meaning)
        POOL.push({ verb:(it.verb || g.label || g.id).toUpperCase(),
                    particle: it.particle.toLowerCase(),
                    meaning: it.meaning });
    }));
    if (POOL.length < SIZE) throw new Error('not enough phrases');
    $('loading').remove();
    start();
  }catch(e){
    $('loading').innerHTML = '<p class="err">Could not load <b>' + DATA_URL + '</b>.<br>' +
      'Open this from the site rather than as a local file — browsers block file:// requests.</p>';
  }
}

function start(){
  const seen = new Set(), picked = [];
  for (const p of shuffle(POOL)){
    if (picked.length === SIZE) break;
    if (seen.has(p.verb)) continue;
    seen.add(p.verb); picked.push(p);
  }
  while (picked.length < SIZE) picked.push(shuffle(POOL)[0]);

  history = history.slice(0, at + 1);
  history.push(picked);
  at = history.length - 1;
  lay(picked);
}

function lay(picked){
  cards = picked.map(p => ({ ...p, state:'up' }));
  kept = fell = 0; streak = 0; target = null; locked = false;
  order = shuffle(cards.map((_, i) => i));
  orderPos = -1;
  $('over').classList.remove('show');
  drawRack(); paint();
  $('ask').textContent = 'getting ready';
  $('clue').textContent = 'sixteen phrasal verbs — one chance at each';
  $('clue').classList.add('waiting');
  $('dealBtn').textContent = 'Skip wait';
  $('dealBtn').classList.add('quiet');
  clearTimeout(autoDealTimer);
  autoDealTimer = setTimeout(deal, 500);
}

function drawRack(){
  const r = $('rack'); r.innerHTML = '';
  cards.forEach((c, i) => {
    const el = document.createElement('div');
    el.className = 'card'; el.id = 'k' + i;
    el.tabIndex = 0;
    el.setAttribute('role', 'button');
    el.setAttribute('aria-label', c.verb + ' ' + c.particle);
    el.innerHTML = '<div class="verb">' + esc(c.verb) + '</div>' +
                   '<div class="foil"></div>' +
                   '<div class="plate">' + esc(c.particle) + '</div>';
    el.onclick = () => choose(i);
    el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); choose(i); } };
    r.appendChild(el);
  });
}

function deal(){
  if (locked) return;
  clearTimeout(autoDealTimer);
  if (target !== null){
    $('k' + target).classList.remove('current');
    order.push(order[orderPos]);
  }
  orderPos++;
  while (orderPos < order.length && cards[order[orderPos]].state !== 'up') orderPos++;
  if (orderPos >= order.length) return over();

  target = order[orderPos];
  $('k' + target).classList.add('current');
  $('ask').textContent = 'which card means';
  $('clue').textContent = firstSense(cards[target].meaning);
  $('clue').classList.remove('waiting');
  $('dealBtn').textContent = 'Skip';
  $('dealBtn').classList.add('quiet');
}

function choose(i){
  if (locked || target === null) return;
  const c = cards[i];
  if (c.state !== 'up') return;
  locked = true;
  const el = $('k' + i);
  $('k' + target).classList.remove('current');
  const asked = cards[target];
  if (window.INTUITY) INTUITY.log('phrasal-verbs',
    asked.verb + ' ' + asked.particle, i === target, { game:'rack' });

  if (i === target){
    c.state = 'kept'; kept++; streak++;
    el.classList.add('kept');
    el.tabIndex = -1;
    el.setAttribute('aria-label', c.verb + ' ' + c.particle + ', kept');
    playCorrectSound();
    if (streak >= 3 && streak % 3 === 0) playStreakSound(streak);
    burst(el);
    flash(pick(RIGHT_LINES), 'var(--ok)');
    updateStreak();
    target = null;
    setTimeout(() => { locked = false; paint(); nextOrEnd(true); }, 700);
  } else {
    c.state = 'fell'; fell++; streak = 0;
    el.tabIndex = -1;
    el.setAttribute('aria-label', c.verb + ' ' + c.particle + ', already used');
    playIncorrectSound();
    updateStreak();
    if (REDUCE_MOTION){
      el.classList.add('fell');
    } else {
      el.classList.add('wobble');
      setTimeout(() => { el.classList.remove('wobble'); el.classList.add('fell'); }, 260);
    }
    flash(esc(cards[target].verb + ' ' + cards[target].particle), 'var(--bad)');
    target = null;
    setTimeout(() => { locked = false; paint(); nextOrEnd(false); }, 1500);
  }
}

function updateStreak(){
  best = Math.max(best, streak);
  const wrap = $('streakWrap');
  $('streakN').textContent = streak;
  wrap.classList.toggle('show', streak >= 2);
}

function nextOrEnd(wasCorrect){
  const live = cards.filter(c => c.state === 'up').length;
  if (!live) return over();
  const line = wasCorrect === null ? '' : (wasCorrect ? pick(RIGHT_LINES) : pick(WRONG_LINES));
  $('ask').textContent = 'next up';
  $('clue').textContent = (line ? line + ' · ' : '') + live + ' still standing';
  $('clue').classList.add('waiting');
  $('dealBtn').textContent = 'Skip wait';
  $('dealBtn').classList.add('quiet');
  clearTimeout(autoDealTimer);
  autoDealTimer = setTimeout(deal, 900);
}

function paint(){
  $('kept').textContent = kept;
  $('fell').textContent = fell;
  $('standing').textContent = cards.filter(c => c.state === 'up').length;
}

function praiseFor(k){
  const frac = k / SIZE;
  if (frac === 1) return 'Perfect rack — every one kept.';
  if (frac >= .75) return 'Great run — barely any got away.';
  if (frac >= .5)  return 'Solid work. A few worth another look.';
  return 'A tricky set — good ones to come back to.';
}

function over(){
  if ($('over').classList.contains('show')) return;
  if (window.INTUITY) INTUITY.session('phrasal-verbs', 'rack', { kept: kept, fell: fell });
  $('overBig').textContent = kept + ' / ' + SIZE;
  $('overPraise').textContent = praiseFor(kept);
  $('overSub').textContent = (fell ? fell + (fell === 1 ? ' card lost' : ' cards lost')
                                   : 'the whole rack') + ' · rack ' + racks +
                                   (best >= 3 ? ' · best streak ' + best : '');
  $('backBtn').disabled = at <= 0;
  $('over').classList.add('show');
}

function nextRack(){
  $('over').classList.remove('show'); racks++;
  if (at < history.length - 1){ at++; lay(history[at]); }
  else start();
}

function backRack(){
  if (at <= 0) return;
  $('over').classList.remove('show'); at--; racks++;
  lay(history[at]);
}

function repeatRack(){
  $('over').classList.remove('show'); racks++;
  lay(history[at]);
}

function flash(text, col){
  const b = $('banner');
  b.textContent = text; b.style.color = col;
  b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
  setTimeout(() => b.classList.remove('show'), 1100);
}

const FW_COLS = ['#FFD94A','#C9A961','#5ED39B','#ff7a45','#ffffff','#7dd3fc','#ff8fd4'];

function pop(stage, cx, cy, scale){
  scale = scale || 1;

  const f = document.createElement('div');
  f.className = 'spark fw-flash';
  f.style.left = cx+'px'; f.style.top = cy+'px';
  f.style.width = (64*scale)+'px'; f.style.height = (64*scale)+'px';
  stage.appendChild(f);
  f.animate([{transform:'translate(-50%,-50%) scale(.2)',opacity:1},
             {transform:'translate(-50%,-50%) scale(3)',opacity:0}],
            {duration:420,easing:'cubic-bezier(.1,.8,.2,1)'});
  setTimeout(()=>f.remove(),440);

  const ring = document.createElement('div');
  ring.className = 'spark fw-ring';
  ring.style.left = cx+'px'; ring.style.top = cy+'px';
  stage.appendChild(ring);
  ring.animate([
    {transform:'translate(-50%,-50%) scale(.5)', opacity:.9},
    {transform:'translate(-50%,-50%) scale('+(9*scale)+')', opacity:0}
  ],{duration:560,easing:'cubic-bezier(.1,.7,.3,1)'});
  setTimeout(()=>ring.remove(),580);

  const count = Math.round(46*scale);
  for (let i=0;i<count;i++){
    const p = document.createElement('div');
    p.className = 'spark';
    const col = FW_COLS[(Math.random()*FW_COLS.length)|0], size = (3+Math.random()*4)*Math.max(scale,.8);
    p.style.cssText += 'left:'+cx+'px; top:'+cy+'px; width:'+size+'px; height:'+size+
      'px; background:'+col+'; box-shadow:0 0 '+(size*2.6)+'px '+col+';';
    stage.appendChild(p);
    const a = Math.random()*Math.PI*2, d = (65+Math.random()*200)*scale;
    const dx = Math.cos(a)*d, dy = Math.sin(a)*d, fall = 55+Math.random()*95;
    const dur = 780+Math.random()*520;
    p.animate([
      {transform:'translate(-50%,-50%) translate(0,0) scale(1.15)',opacity:1},
      {transform:'translate(-50%,-50%) translate('+(dx*.62).toFixed(0)+'px,'+(dy*.62-10).toFixed(0)+'px) scale(1)',opacity:1,offset:.4},
      {transform:'translate(-50%,-50%) translate('+dx.toFixed(0)+'px,'+(dy+fall).toFixed(0)+'px) scale(.25)',opacity:0}
    ],{duration:dur,easing:'cubic-bezier(.12,.75,.3,1)'});
    setTimeout(()=>p.remove(),dur+30);
  }

  setTimeout(()=>{
    const crackles = Math.round(18*scale);
    for (let i=0;i<crackles;i++){
      const c = document.createElement('div');
      c.className = 'spark fw-crackle';
      const a = Math.random()*Math.PI*2, d = (26+Math.random()*100)*scale;
      c.style.left = (cx+Math.cos(a)*d*.5)+'px'; c.style.top = (cy+Math.sin(a)*d*.5)+'px';
      stage.appendChild(c);
      c.animate([{opacity:0,transform:'translate(-50%,-50%) scale(.4)'},
                 {opacity:1,transform:'translate(-50%,-50%) scale(1.4)',offset:.25},
                 {opacity:0,transform:'translate(-50%,-50%) scale(.3)'}],
                {duration:300+Math.random()*240,easing:'ease-out'});
      setTimeout(()=>c.remove(),600);
    }
  },220);
}

function burst(el){
  if (REDUCE_MOTION) return;
  const stage = document.querySelector('.stage');
  const s = stage.getBoundingClientRect(), r = el.getBoundingClientRect();
  const cx = r.left - s.left + r.width/2, cy = r.top - s.top + r.height/2;

  pop(stage, cx, cy, 1.35);
  setTimeout(() => {
    const ox = cx + (Math.random()*140-70), oy = cy + (Math.random()*90-70);
    pop(stage, ox, oy, .7);
  }, 160 + Math.random()*90);
}

if (window.self !== window.top) document.body.classList.add('embedded');
boot();
</script>
