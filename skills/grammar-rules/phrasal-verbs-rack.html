<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTUITY — The Rack</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{ margin:0; padding:0; box-sizing:border-box; }

  :root{
    /* ── the one line to change the page tone ──────────────────────────
       Swap --ground for any ground in AESTHETIC.md, and set --shade to
       that ground darkened heavily, as r,g,b. See the note at the end. */
    --ground:#BDC8C4;  --shade:56,70,64;

    --disc:#F8F6F2;  --disc-floor:#E7E4DC;
    --ink:#26251F;   --ink-soft:#4C5854;

    --egg-rest:#61B5ED;   --egg-rest-ink:#0C2B42;
    --egg-right:#8FAE33;  --egg-right-ink:#18220A;
    --egg-lost:#C9A961;   --egg-lost-ink:#3A2E11;

    --square:20px;
    --spring:cubic-bezier(.2,1.4,.4,1);
  }

  html,body{ height:100%; }
  body{
    background:var(--ground); color:var(--ink);
    font-family:'Space Grotesk',sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding:.5rem .7rem 1rem; gap:.5rem;
    user-select:none; -webkit-user-select:none;
    overflow:hidden;
  }
  button{ font:inherit; color:inherit; background:none; border:none; cursor:pointer; }

  /* ── chrome: a back control and a number. Nothing else. ─────────────── */
  .top{
    width:100%; max-width:30rem; flex:none;
    display:flex; align-items:center; justify-content:space-between;
    font-size:.82rem; color:var(--ink-soft);
  }
  .top a{ color:inherit; text-decoration:none; padding:.2rem .35rem; }
  .top a:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; border-radius:4px; }
  .tally{ font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums; }
  .tally .miss{ color:var(--ink-soft); font-weight:600; }

  /* ── the prompt: pressed, one per screen, never tappable ─────────────── */
  .prompt{
    flex:none;
    width:clamp(9rem,42vw,11.5rem); aspect-ratio:1;
    border-radius:50%; padding:2.5%;
    background:var(--disc);
    box-shadow:4px 6px 13px rgba(var(--shade),.30);
  }
  .floor{
    width:100%; height:100%; border-radius:50%;
    background:var(--disc-floor);
    box-shadow:inset 5px 6px 11px rgba(72,68,56,.28),
               inset -3px -3px 7px rgba(255,255,255,.75);
    display:flex; align-items:center; justify-content:center;
    padding:13%; text-align:center;
    font-weight:600; font-size:clamp(.78rem,3.2vw,.95rem); line-height:1.3;
    color:var(--ink);
    transition:color .2s;
  }
  .floor.reveal{ font-family:'Archivo Black',system-ui; font-weight:400; font-size:clamp(1rem,4.4vw,1.3rem); }

  /* ── the rack: rimless squares, tight ───────────────────────────────── */
  .rack{
    width:100%; max-width:30rem; flex:1 1 auto; min-height:0;
    display:grid; grid-template-columns:repeat(4,1fr); gap:5px;
    align-content:center;
  }
  @media(min-width:34rem){ .rack{ grid-template-columns:repeat(6,1fr); } }

  .card{
    aspect-ratio:1; border-radius:var(--square);
    background:var(--disc);
    box-shadow:3px 5px 11px rgba(var(--shade),.34);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:.2rem;
    padding:.2rem;
    transition:transform .12s var(--spring), box-shadow .12s, opacity .3s;
  }
  .card:active:not(.done){ transform:translateY(2px) scale(.96); box-shadow:2px 3px 6px rgba(var(--shade),.34); }
  .card:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }

  .verb{
    font-family:'Archivo Black',system-ui,sans-serif;
    font-size:clamp(.62rem,3.1vw,.9rem); letter-spacing:-.03em; line-height:.95;
    color:var(--ink); text-align:center;
  }
  .egg{
    background:var(--egg-rest); color:var(--egg-rest-ink);
    font-weight:700; font-size:clamp(.5rem,2.1vw,.62rem); line-height:1;
    border-radius:999px; padding:.16rem .45rem .18rem;
    max-width:92%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  .card.done{ opacity:.55; cursor:default; }
  .card.done .egg{ background:var(--egg-right); color:var(--egg-right-ink); }
  .card.answer .egg{ background:var(--egg-lost); color:var(--egg-lost-ink); }
  .card.lost{ opacity:.55; cursor:default; }
  .card.lost .egg{ background:var(--egg-lost); color:var(--egg-lost-ink); }
  .card.wrong{ animation:wobble .42s; }
  @keyframes wobble{ 25%{ transform:rotate(-3deg) } 60%{ transform:rotate(2.5deg) } }

  .foot{ flex:none; height:1.1rem; font-size:.76rem; color:var(--ink-soft); }

  /* ── the end ─────────────────────────────────────────────────────────── */
  .over{
    position:absolute; inset:0; z-index:9; display:none;
    flex-direction:column; align-items:center; justify-content:center; gap:.5rem;
    background:var(--ground); padding:2rem; text-align:center;
  }
  .over.show{ display:flex; }
  .over .big{ font-family:'Archivo Black',system-ui; font-size:clamp(2rem,11vw,3rem); color:var(--ink); }
  .over .sub{ font-size:.85rem; color:var(--ink-soft); max-width:20rem; line-height:1.5; }
  .over .again{
    margin-top:1rem; background:var(--disc); border-radius:999px;
    padding:.7rem 1.8rem; font-weight:700; font-size:.85rem;
    box-shadow:3px 5px 11px rgba(var(--shade),.34);
  }
  .over .again:active{ transform:translateY(2px) scale(.97); }

  .load{ margin:auto; color:var(--ink-soft); font-size:.85rem; text-align:center; line-height:1.6; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
  }
</style>
</head>
<body>

<div class="top">
  <a href="/?openModal=grammar" aria-label="Back to grammar">&larr;</a>
  <span class="tally"><span id="kept">0</span><span class="miss" id="miss"></span></span>
</div>

<div class="prompt"><div class="floor" id="floor">…</div></div>

<div class="rack" id="rack" role="group" aria-label="Phrasal verb cards"></div>

<div class="foot" id="foot"></div>

<div class="over" id="over">
  <div class="big" id="overBig"></div>
  <div class="sub" id="overSub"></div>
  <button class="again" onclick="start()">Deal again</button>
</div>

<script src="intuity-log.js"></script>
<script>
const DATA = 'phrasal-verbs-data.json';
const SIZE = 12;          /* 4 x 3 on a phone. See the note on deck size. */
const RETRY_GAP = 4;      /* a missed card comes back this many turns later */
const MAX_MISS  = 2;      /* after this many attempts it closes as lost */

const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const firstSense = m => String(m).split(';')[0].trim();
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.random()*(i+1)|0; [a[i],a[j]] = [a[j],a[i]]; } return a; };

let POOL = [], cards = [], queue = [], at = 0, target = null;
let kept = 0, lost = 0, missed = 0, locked = true;

async function boot(){
  try{
    const res = await fetch(DATA);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const d = await res.json();
    (d.groups || []).forEach(g => (g.items || []).forEach(it => {
      if (it.particle && it.meaning)
        POOL.push({ verb:(it.verb || g.label || g.id).toUpperCase(),
                    particle: it.particle.toLowerCase(),
                    meaning: it.meaning });
    }));
    if (POOL.length < SIZE) throw new Error('not enough phrases');
    start();
  }catch(e){
    $('rack').innerHTML = '<p class="load">Could not load <b>' + esc(DATA) + '</b>.<br>' +
      'Open this from the site — browsers block file:// requests.</p>';
  }
}

/* One card per verb where possible, so two cards never share a slab. */
function deal(){
  const seen = new Set(), picked = [];
  for (const p of shuffle(POOL)){
    if (picked.length === SIZE) break;
    if (seen.has(p.verb)) continue;
    seen.add(p.verb); picked.push(p);
  }
  while (picked.length < SIZE) picked.push(shuffle(POOL)[0]);
  return picked;
}

function start(){
  cards = deal().map(p => ({ ...p, done:false, misses:0 }));
  queue = shuffle(cards.map((_, i) => i));
  at = -1; kept = 0; lost = 0; missed = 0; target = null;
  $('over').classList.remove('show');
  draw(); tally(); next();
}

function draw(){
  const r = $('rack'); r.innerHTML = '';
  cards.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'card'; b.id = 'c' + i;
    b.setAttribute('aria-label', c.verb + ' ' + c.particle);
    b.innerHTML = '<span class="verb">' + esc(c.verb) + '</span>' +
                  '<span class="egg">' + esc(c.particle) + '</span>';
    b.onclick = () => choose(i);
    r.appendChild(b);
  });
}

function tally(){
  $('kept').textContent = kept + '/' + SIZE;
  $('miss').textContent = lost ? '  ·  ' + lost + ' lost' : '';
}

/* Ask the next live card. Nothing on the board marks which one it is —
   the prompt is the only cue. */
function next(){
  at++;
  while (at < queue.length && cards[queue[at]].done) at++;
  if (at >= queue.length) return over();
  target = queue[at];
  $('floor').className = 'floor';
  $('floor').textContent = firstSense(cards[target].meaning);
  $('foot').textContent = (SIZE - kept - lost) + ' still standing';
  locked = false;
}

function choose(i){
  if (locked || target === null) return;
  const c = cards[i];
  if (c.done) return;
  locked = true;

  const asked = cards[target];
  const right = i === target;
  if (window.INTUITY) INTUITY.log('phrasal-verbs',
    asked.verb + ' ' + asked.particle, right, { game:'rack' });

  if (right){
    c.done = true; kept++;
    $('c' + i).classList.add('done');
    tally();
    target = null;
    setTimeout(next, 600);
    return;
  }

  /* A miss costs the card its place in the round, not its existence: the
     asked card is shown, then goes back into the queue a few turns later.
     The one thing a child got wrong is the one thing worth meeting twice.

     After MAX_MISS attempts it closes as lost rather than circling for ever
     — a dead end teaches nothing, but neither does an unwinnable loop. The
     round always ends with kept + lost equal to the deck. */
  missed++;
  asked.misses++;
  const conceded = asked.misses >= MAX_MISS;
  const t = target;

  $('c' + i).classList.add('wrong');
  $('c' + t).classList.add('answer');
  $('floor').className = 'floor reveal';
  $('floor').textContent = asked.verb.toLowerCase() + ' ' + asked.particle;

  if (conceded){ asked.done = true; lost++; }
  else queue.splice(Math.min(at + RETRY_GAP, queue.length), 0, t);
  tally();
  target = null;

  setTimeout(() => {
    $('c' + i).classList.remove('wrong');
    if (conceded) $('c' + t).classList.add('lost');
    else $('c' + t).classList.remove('answer');
    next();
  }, 1100);
}

function over(){
  if (window.INTUITY) INTUITY.session('phrasal-verbs', 'rack', { kept: kept, lost: lost, missed: missed });
  $('overBig').textContent = missed === 0 ? 'clean' : kept + '/' + SIZE;
  $('overSub').textContent = missed === 0
    ? 'every card, first time'
    : lost === 0 ? 'every card in the end · ' + missed + (missed === 1 ? ' second look' : ' second looks')
    : lost === 1 ? 'one card got away' : lost + ' cards got away';
  $('over').classList.add('show');
}

boot();
</script>
</body>
</html>
