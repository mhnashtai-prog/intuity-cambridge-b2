<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>INTUITY — Blast</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --stage:#D9CFC2;
    --bar:#B8AC95;
    --paper:#FEFCF9;
    --ink:#000000;
    --soft:#5f5852;
    --rule:#BCAF9E;
    --hot:#C85A2B;
    --cool:#1D4E89;
    --good:#3F7D4E;
    --spring:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--stage);color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none;
  }
  .display{font-family:'Anton',Impact,sans-serif;font-weight:400;text-transform:uppercase;line-height:.94;letter-spacing:-.005em;}

  /* ---- bar ---- */
  .bar{
    background:var(--bar);flex:none;
    padding:10px 14px calc(10px + env(safe-area-inset-top,0px));
    display:flex;align-items:center;gap:12px;
  }
  .bar .name{
    font-size:.62rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;
  }
  .icon{
    border:none;background:rgba(0,0,0,.08);color:var(--ink);
    width:34px;height:34px;border-radius:50%;cursor:pointer;flex:none;
    font-size:.95rem;line-height:1;display:flex;align-items:center;justify-content:center;
  }
  .icon:hover{background:rgba(0,0,0,.18);}

  /* ---- ladder pips ---- */
  .ladder{display:flex;gap:4px;padding:9px 14px 0;flex:none;}
  .pip{flex:1;height:5px;border-radius:3px;background:rgba(0,0,0,.11);transition:background .45s var(--spring);}
  .pip.b1{background:var(--hot);}
  .pip.b2{background:#D9903F;}
  .pip.b3{background:var(--good);}

  /* ---- combo ---- */
  .combo{
    padding:8px 14px 0;flex:none;display:flex;align-items:baseline;gap:8px;height:36px;
  }
  .combo .n{font-family:'Anton',sans-serif;font-size:1.5rem;color:var(--hot);opacity:0;transition:opacity .25s,transform .25s var(--spring);transform:translateY(4px);}
  .combo .n.on{opacity:1;transform:none;}
  .combo .lbl{font-size:.58rem;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);opacity:0;transition:opacity .25s;}
  .combo .lbl.on{opacity:1;}

  /* ---- play area ---- */
  .wrap{flex:1;min-height:0;display:flex;flex-direction:column;padding:6px 14px calc(14px + env(safe-area-inset-bottom,0px));gap:12px;position:relative;}

  .timer{height:3px;background:rgba(0,0,0,.09);border-radius:2px;overflow:hidden;flex:none;}
  .timer i{display:block;height:100%;width:100%;background:var(--cool);transform-origin:left;}

  .prompt{
    background:var(--paper);border-radius:14px;padding:20px 18px;
    flex:none;transition:transform .3s var(--spring);
  }
  .prompt.shake{animation:shake .38s;}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-9px)}40%{transform:translateX(8px)}
    60%{transform:translateX(-5px)}80%{transform:translateX(3px)}
  }
  .prompt.launch{transform:translateY(-16px) scale(.97);opacity:0;}

  .kick{font-size:.58rem;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);margin-bottom:9px;}
  .stem{font-size:1.3rem;line-height:1.4;font-weight:400;letter-spacing:-.012em;}
  .stem .gap{
    display:inline-block;min-width:78px;border-bottom:3px solid var(--hot);
    height:1.15em;vertical-align:-.18em;margin:0 3px;
  }
  .stem .gap.filled{border-bottom-color:var(--good);}
  .stem b{font-weight:700;color:var(--hot);}

  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:9px;flex:none;margin-top:auto;}
  .tile{
    background:var(--paper);border:none;border-radius:12px;
    padding:16px 12px;min-height:62px;cursor:pointer;
    font-family:'Anton',Impact,sans-serif;text-transform:uppercase;
    font-size:1.02rem;line-height:1.1;color:var(--ink);
    display:flex;align-items:center;justify-content:center;text-align:center;
    transition:transform .18s var(--spring),background .18s,color .18s,opacity .25s;
    animation:drop .34s var(--spring) backwards;
  }
  @keyframes drop{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
  .tile:active{transform:scale(.95);}
  .tile.right{background:var(--good);color:#fff;}
  .tile.wrong{background:var(--hot);color:#fff;}
  .tile.mute{opacity:.35;}
  .tile.small{font-family:'Inter',sans-serif;text-transform:none;font-weight:500;font-size:.88rem;line-height:1.3;}

  .why{
    background:rgba(0,0,0,.05);border-radius:11px;padding:12px 14px;
    font-size:.82rem;line-height:1.5;color:var(--soft);flex:none;
    display:none;
  }
  .why.on{display:block;animation:drop .3s var(--spring);}
  .why b{color:var(--ink);font-weight:700;}

  /* ---- particles ---- */
  .spark{position:fixed;width:9px;height:9px;border-radius:2px;pointer-events:none;z-index:60;}

  /* ---- end ---- */
  .end{
    position:absolute;inset:0;background:var(--stage);
    display:none;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;gap:14px;z-index:40;
  }
  .end.on{display:flex;animation:drop .4s var(--spring);}
  .end h1{font-size:clamp(2.4rem,14vw,4.4rem);}
  .end .stat{font-size:.95rem;color:var(--soft);line-height:1.6;}
  .end .stat b{color:var(--ink);font-weight:700;}
  .end .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px;}
  .btn{
    border:none;background:var(--ink);color:var(--paper);
    font-family:'Inter',sans-serif;font-size:.7rem;font-weight:700;
    letter-spacing:.16em;text-transform:uppercase;
    padding:14px 20px;border-radius:999px;cursor:pointer;
  }
  .btn.ghost{background:rgba(0,0,0,.09);color:var(--ink);}

  .msg{margin:auto;text-align:center;color:var(--soft);font-size:.92rem;line-height:1.55;padding:24px;}

  @media (min-width:620px){
    .wrap{max-width:620px;width:100%;margin:0 auto;}
    .ladder,.combo,.bar{max-width:620px;width:100%;margin-left:auto;margin-right:auto;}
    .stem{font-size:1.5rem;}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important;}
  }
</style>
</head>
<body>

<div class="bar">
  <span class="name" id="name">&nbsp;</span>
  <button class="icon" id="sound" type="button" aria-label="Sound on or off">&#9834;</button>
  <button class="icon" id="quit" type="button" aria-label="Back to list">&times;</button>
</div>

<div class="ladder" id="ladder"></div>

<div class="combo">
  <span class="n display" id="comboN">0</span>
  <span class="lbl" id="comboL">in a row</span>
</div>

<div class="wrap" id="wrap">
  <div class="timer"><i id="timerBar"></i></div>
  <div id="stage"></div>
  <div class="end" id="end"></div>
</div>

<script>
/* ============================================================
   BLAST — retrieval practice on a Leitner ladder.
   Each use case must be answered correctly three times, at
   widening intervals, before it is retired. A miss sends it
   back to the bottom and it returns almost immediately.
   ============================================================ */

const P        = new URLSearchParams(location.search);
const CATEGORY = P.get('category') || 'present';
const TENSE    = P.get('tense')    || 'simple';
const JSON_URL = P.get('json')     || '../../data/grammar-rules/tenses-rules.json';

const GAPS   = [0, 2, 5, 11];     // items to wait before a card returns, per box
const TARGET = 3;                 // box needed to retire a card
const CLOCK  = 15000;

let useCases = [], items = [], tick = 0, cur = null;
let combo = 0, best = 0, hits = 0, misses = 0, locked = false;
let timerId = null, sound = true;

/* ---------------- audio ---------------- */
let ac = null;
function ctx(){
  if(!ac){ try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  return ac;
}
function tone(freq, start, dur, type, vol){
  const a = ctx(); if(!a || !sound) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, a.currentTime + start);
  g.gain.setValueAtTime(0.0001, a.currentTime + start);
  g.gain.exponentialRampToValueAtTime(vol || .18, a.currentTime + start + .015);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + start + dur);
  o.connect(g); g.connect(a.destination);
  o.start(a.currentTime + start); o.stop(a.currentTime + start + dur + .05);
}
/* Pitch climbs with the streak — a pentatonic ladder, so it never sours. */
const PENT = [0,2,4,7,9,12,14,16,19,21,24];
function sRight(streak){
  const step = PENT[Math.min(streak, PENT.length-1)];
  const f = 440 * Math.pow(2, step/12);
  tone(f, 0, .16, 'triangle', .2);
  tone(f*1.5, .07, .2, 'sine', .12);
}
function sWrong(){
  tone(150, 0, .16, 'sawtooth', .14);
  tone(96, .05, .26, 'square', .1);
}
function sRetire(){
  [523.25, 659.25, 783.99].forEach((f,i) => tone(f, i*.07, .34, 'triangle', .16));
}
function sDone(){
  [523.25, 659.25, 783.99, 1046.5].forEach((f,i) => tone(f, i*.11, .5, 'triangle', .18));
}

/* ---------------- particles ---------------- */
function burst(el, colour, n){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const r = el.getBoundingClientRect();
  const cx = r.left + r.width/2, cy = r.top + r.height/2;
  for(let i=0;i<(n||18);i++){
    const s = document.createElement('div');
    s.className = 'spark';
    s.style.background = colour;
    s.style.left = cx+'px'; s.style.top = cy+'px';
    document.body.appendChild(s);
    const ang = Math.random()*Math.PI*2, dist = 55 + Math.random()*130;
    s.animate([
      { transform:'translate(-50%,-50%) scale(1)', opacity:1 },
      { transform:'translate('+(Math.cos(ang)*dist-8)+'px,'+(Math.sin(ang)*dist-8)+'px) scale(0) rotate('+(Math.random()*540)+'deg)', opacity:0 }
    ], { duration: 480 + Math.random()*380, easing:'cubic-bezier(.2,.8,.3,1)' })
     .onfinish = () => s.remove();
  }
}

/* ---------------- data ---------------- */
async function load(){
  try{
    const res = await fetch(JSON_URL);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const raw  = await res.json();
    const list = Array.isArray(raw) ? raw : (raw.rules || Object.values(raw));
    const t = (Array.isArray(list)?list:Object.values(list))
                .find(x => x.id === CATEGORY+'-'+TENSE);
    if(!t) throw new Error('tense not found');
    useCases = t.useCases || [];
    document.getElementById('name').textContent = (t.name||'') + ' · Blast';
  }catch(e){
    console.error(e);
    document.getElementById('stage').innerHTML =
      '<div class="msg">Couldn\'t load the tense data.<br>Looked for '+JSON_URL+'</div>';
    return;
  }
  if(!useCases.length){
    document.getElementById('stage').innerHTML = '<div class="msg">No use cases in this tense.</div>';
    return;
  }
  start();
}

function start(){
  items = useCases.map((uc,i) => ({ i, box:0, due:0, seen:0 }));
  tick = 0; combo = 0; best = 0; hits = 0; misses = 0;
  document.getElementById('end').classList.remove('on');
  buildLadder();
  next();
}

function buildLadder(){
  const l = document.getElementById('ladder');
  l.innerHTML = items.map(it => '<div class="pip" data-i="'+it.i+'"></div>').join('');
  paintLadder();
}
function paintLadder(){
  items.forEach(it => {
    const pip = document.querySelector('.pip[data-i="'+it.i+'"]');
    if(pip) pip.className = 'pip' + (it.box ? ' b'+Math.min(it.box,3) : '');
  });
}

/* ---------------- question building ---------------- */
function esc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

function sentencesOf(uc){ return [uc.mainExample].concat(uc.moreExamples||[]); }

function markerIn(sentence, markers){
  if(!markers) return null;
  for(const m of markers.slice().sort((a,b)=>b.length-a.length)){
    if(new RegExp('\\b'+esc(m)+'\\b','i').test(sentence)) return m;
  }
  return null;
}

/* Distractors come from the OTHER use cases of the same tense, because
   telling this tense's uses apart is the actual B2 difficulty. */
function otherMarkers(exclude, n){
  const pool = [];
  useCases.forEach((uc,i) => {
    if(i === exclude) return;
    (uc.timeMarkers||[]).forEach(m => { if(!pool.includes(m)) pool.push(m); });
  });
  return shuffle(pool).slice(0,n);
}
function otherTitles(exclude, n){
  return shuffle(useCases.map((uc,i)=>({t:uc.title,i}))
    .filter(o => o.i !== exclude)).slice(0,n).map(o => o.t);
}
function shuffle(a){
  a = a.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function makeQuestion(it){
  const uc = useCases[it.i];
  const all = sentencesOf(uc);
  const sentence = all[it.seen % all.length];      // a fresh example each pass
  const marker = markerIn(sentence, uc.timeMarkers);

  // Boxes 0-1: knock out the signal word. Box 2: name the use. Harder, and
  // it forces the rule rather than the keyword.
  if(marker && it.box < 2){
    const wrongs = otherMarkers(it.i, 3);
    if(wrongs.length >= 2){
      return {
        kind:'gap',
        kick:'Which word fits?',
        stem: sentence.replace(new RegExp('\\b('+esc(marker)+')\\b','i'), '<span class="gap"></span>'),
        answer: marker,
        options: shuffle([marker].concat(wrongs.slice(0,3))),
        note: uc.note, title: uc.title, full: sentence
      };
    }
  }
  const wrongT = otherTitles(it.i, 3);
  return {
    kind:'use',
    kick:'What is this use?',
    stem: sentence,
    answer: uc.title,
    options: shuffle([uc.title].concat(wrongT)),
    note: uc.note, title: uc.title, full: sentence,
    small: true
  };
}

/* ---------------- flow ---------------- */
function next(){
  const live = items.filter(it => it.box < TARGET);
  if(!live.length){ finish(); return; }

  live.sort((a,b) => a.due - b.due || a.box - b.box);
  const ready = live.filter(it => it.due <= tick);
  const it = ready.length ? ready[0] : live[0];

  cur = { it, q: makeQuestion(it) };
  locked = false;
  paint();
}

function paint(){
  const q = cur.q;
  const stage = document.getElementById('stage');
  stage.innerHTML =
    '<div class="prompt" id="prompt">'+
      '<div class="kick">'+q.kick+'</div>'+
      '<div class="stem">'+q.stem+'</div>'+
    '</div>'+
    '<div class="tiles" id="tiles">'+
      q.options.map((o,i) =>
        '<button class="tile'+(q.small?' small':'')+'" data-o="'+encodeURIComponent(o)+'" '+
        'style="animation-delay:'+(i*55)+'ms" type="button">'+o+'</button>').join('')+
    '</div>'+
    '<div class="why" id="why"></div>';

  stage.querySelectorAll('.tile').forEach(b => {
    b.onclick = () => answer(decodeURIComponent(b.dataset.o), b);
  });
  runClock();
}

function runClock(){
  const bar = document.getElementById('timerBar');
  bar.getAnimations().forEach(a => a.cancel());
  bar.style.transform = 'scaleX(1)';
  const anim = bar.animate(
    [{ transform:'scaleX(1)' },{ transform:'scaleX(0)' }],
    { duration: CLOCK, easing:'linear', fill:'forwards' }
  );
  clearTimeout(timerId);
  timerId = setTimeout(() => { if(!locked) answer(null, null); }, CLOCK);
}

function answer(choice, btn){
  if(locked) return;
  locked = true;
  clearTimeout(timerId);
  document.getElementById('timerBar').getAnimations().forEach(a => a.pause());

  const q = cur.q, it = cur.it;
  const ok = choice === q.answer;
  it.seen++;
  tick++;

  document.querySelectorAll('.tile').forEach(b => {
    const v = decodeURIComponent(b.dataset.o);
    if(v === q.answer) b.classList.add('right');
    else if(b === btn) b.classList.add('wrong');
    else b.classList.add('mute');
    b.onclick = null;
  });

  if(ok){
    hits++; combo++; best = Math.max(best, combo);
    sRight(combo);
    if(btn) burst(btn, '#C85A2B', 20);
    const gap = document.querySelector('.gap');
    if(gap){ gap.classList.add('filled'); gap.textContent = q.answer; }
    it.box++;
    it.due = tick + GAPS[Math.min(it.box, GAPS.length-1)];
    if(it.box >= TARGET){
      sRetire();
      const pip = document.querySelector('.pip[data-i="'+it.i+'"]');
      if(pip) burst(pip, '#3F7D4E', 14);
    }
    setComboUI();
    paintLadder();
    setTimeout(() => {
      const pr = document.getElementById('prompt');
      if(pr) pr.classList.add('launch');
      setTimeout(next, 260);
    }, 620);
  }else{
    misses++; combo = 0;
    sWrong();
    const pr = document.getElementById('prompt');
    if(pr) pr.classList.add('shake');
    it.box = 0;
    it.due = tick + GAPS[1];
    setComboUI();
    paintLadder();
    const why = document.getElementById('why');
    why.innerHTML = '<b>'+q.title+'</b> — ' + (q.note || q.full);
    why.classList.add('on');
    const go = document.createElement('button');
    go.className = 'btn'; go.style.marginTop = '12px';
    go.textContent = 'Got it';
    go.onclick = () => { const p = document.getElementById('prompt'); if(p) p.classList.add('launch'); setTimeout(next, 240); };
    why.appendChild(go);
  }
}

function setComboUI(){
  const n = document.getElementById('comboN'), l = document.getElementById('comboL');
  n.textContent = combo;
  n.classList.toggle('on', combo > 1);
  l.classList.toggle('on', combo > 1);
}

function finish(){
  sDone();
  const total = hits + misses;
  const pct = total ? Math.round(hits/total*100) : 0;
  const end = document.getElementById('end');
  end.innerHTML =
    '<h1 class="display">Cleared</h1>'+
    '<div class="stat">All <b>'+items.length+'</b> uses retired.<br>'+
      '<b>'+hits+'</b> right, <b>'+misses+'</b> missed &middot; <b>'+pct+'%</b><br>'+
      'Best streak <b>'+best+'</b></div>'+
    '<div class="row">'+
      '<button class="btn" id="again" type="button">Run it again</button>'+
      '<button class="btn ghost" id="toList" type="button">See all uses</button>'+
    '</div>';
  end.classList.add('on');
  end.querySelector('#again').onclick = start;
  end.querySelector('#toList').onclick = goList;
  setTimeout(() => burst(end.querySelector('h1'), '#C85A2B', 40), 120);
}

/* ---------------- chrome ---------------- */
function goList(){
  if(window.parent !== window) parent.postMessage({ intuity:'showList' }, '*');
  else location.href = 'tenses-rules.html';
}
document.getElementById('quit').onclick = goList;

document.getElementById('sound').onclick = function(){
  sound = !sound;
  this.innerHTML = sound ? '&#9834;' : '&#9788;';
  this.style.opacity = sound ? 1 : .45;
  if(sound) ctx();
};

document.addEventListener('pointerdown', () => ctx(), { once:true });

document.addEventListener('keydown', e => {
  if(/^[1-4]$/.test(e.key)){
    const t = document.querySelectorAll('.tile')[+e.key - 1];
    if(t) t.click();
  }
});

load();
</script>
</body>
</html>
