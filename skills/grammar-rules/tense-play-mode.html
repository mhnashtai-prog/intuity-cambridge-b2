<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>INTUITY — Tenses Street</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:        #0a0f1c;
    --road:      #232c40;
    --road-dash: #1c2434;
    --point:     #e8c968;
    --card:      #131a2c;
    --ink:       #d5d9e5;
    --ink-dim:   #8b93a8;
    --active-border: #d6a53f;

    --sig-simple:  #1f7a6c;
    --sig-cont:    #c1571f;
    --sig-perfect: #6a4c93;
    --sig-pcont:   #b23a63;

    --spring: cubic-bezier(.2,1.4,.4,1);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    background: var(--bg);
    color: var(--ink);
    font-family:'Space Grotesk', sans-serif;
    min-height:100vh;
    overflow-x:hidden;
  }

  .chrome{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 18px 22px;
  }
  .back{
    font-size:.85rem;
    font-weight:500;
    color: var(--ink-dim);
    text-decoration:none;
  }
  .progress{
    font-family:'Archivo Black', sans-serif;
    font-size:.95rem;
    color: var(--ink);
  }
  .progress span{ color: var(--ink-dim); font-family:'Space Grotesk',sans-serif; font-weight:500; }

  .stage{
    position:relative;
    width: min(480px, 96vw);
    height: 78vh;
    min-height: 520px;
    margin: 0 auto;
  }

  .road-svg{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .road-line{ stroke: var(--road); stroke-width:1.5; }
  .road-dash{ stroke: var(--road-dash); stroke-width:1; stroke-dasharray:4 6; }
  .road-point{ fill: var(--point); }

  /* ============ LAMP CARDS on the street ============ */
  .lamp{
    position:absolute;
    cursor:pointer;
    user-select:none;
    transition: all .55s var(--spring);
  }
  .lamp .tag{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    border-radius: 5px;
    white-space: nowrap;
  }
  .lamp .body{
    background: var(--card);
    color: var(--ink);
    border-radius: 0 6px 6px 0;
    font-weight:500;
    line-height:1.4;
  }
  .lamp.side-right .tag{ text-align:right; }
  .lamp.side-right .body{ border-radius:6px 0 0 6px; }
  .lamp:active{ transform: scale(.93) !important; }
  .lamp .body b{ font-weight:700; }

  /* ============ CENTER — active card, full detail ============ */
  .active-card{
    position:absolute;
    left:50%; bottom: 10px;
    transform: translateX(-50%);
    width: min(320px, 84vw);
    background: var(--card);
    border: 1px solid var(--active-border);
    border-radius: 16px;
    padding: 20px 20px 18px;
    cursor:pointer;
    transition: opacity .35s ease, transform .35s var(--spring);
    z-index: 10;
  }
  .active-card.entering{ opacity:0; transform: translateX(-50%) scale(.94) translateY(8px); }

  .eyebrow{
    font-size:.68rem;
    font-weight:600;
    letter-spacing:.06em;
    text-transform:uppercase;
    color: var(--active-border);
    margin-bottom: 6px;
  }
  .title{
    font-family:'Archivo Black', sans-serif;
    font-size: 1.15rem;
    color:#f4f6fb;
    margin-bottom: 10px;
  }
  .markers{ display:flex; flex-wrap:wrap; gap:5px; margin-bottom: 12px; }
  .marker{
    font-size:.68rem;
    font-weight:600;
    color:#fff;
    padding: 3px 9px;
    border-radius: 999px;
  }
  .examples{ display:flex; flex-direction:column; gap:8px; margin-bottom: 10px; }
  .example{ font-size:.9rem; color: var(--ink); line-height:1.5; }
  .example b{ font-weight:700; }
  .note{
    font-size:.75rem;
    color: var(--ink-dim);
    line-height:1.5;
    padding-top: 10px;
    border-top: 1px solid #232c40;
  }
  .tap-hint{
    text-align:center;
    font-size:.62rem;
    letter-spacing:.06em;
    text-transform:uppercase;
    color: var(--ink-dim);
    margin-top: 12px;
  }

  @media (max-width: 480px){
    .chrome{ padding: 14px 16px; }
    .active-card{ padding: 16px 16px 14px; }
    .title{ font-size:1rem; }
  }
</style>
</head>
<body>

  <div class="chrome">
    <a class="back" href="tenses-rules.html">&larr; Back</a>
    <div class="progress"><span id="curNum">0</span><span> / <span id="totNum">8</span></span></div>
  </div>

  <div class="stage" id="stage">
    <svg class="road-svg" viewBox="0 0 360 460" preserveAspectRatio="xMidYMid meet">
      <line class="road-line" x1="4"   y1="450" x2="180" y2="130" />
      <line class="road-line" x1="356" y1="450" x2="180" y2="130" />
      <line class="road-dash" x1="180" y1="450" x2="180" y2="130" />
      <circle class="road-point" cx="180" cy="130" r="4" />
    </svg>
    <div id="lampLayer"></div>
    <div id="activeLayer"></div>
  </div>

<script>
  const params   = new URLSearchParams(location.search);
  const category = params.get('category') || 'present';
  const tenseKey = params.get('tense')    || 'simple';

  const SIG_COLOR = {
    simple:               'var(--sig-simple)',
    continuous:            'var(--sig-cont)',
    perfect:               'var(--sig-perfect)',
    'perfect-continuous':  'var(--sig-pcont)'
  };
  const sigColor = SIG_COLOR[tenseKey] || 'var(--sig-simple)';

  /* depth slots — matched to the road geometry above (viewBox 360x460,
     vanishing point at 180,130). Exactly 4 per side, which is exactly
     half of every tense's 8 use-cases. */
  const SLOTS = [
    { x: 8,   y: 318, w: 112, h: 96, tagSize: 10,  bodySize: 10,   lines: 1 },
    { x: 34,  y: 240, w: 86,  h: 66, tagSize: 9,   bodySize: 8.5,  lines: 1 },
    { x: 90,  y: 184, w: 54,  h: 40, tagSize: 7.5, bodySize: 7,    lines: 1 },
    { x: 130, y: 144, w: 34,  h: 26, tagSize: 6.5, bodySize: 0,    lines: 0 }
  ];

  let useCases   = [];
  let placedOrder = [];      // indices, oldest first
  let activeIndex = null;    // index shown centre, or null

  async function load(){
    try{
      const res  = await fetch('../../data/grammar-rules/tenses-data.json');
      const data = await res.json();
      const list = Array.isArray(data) ? data : (data.rules || Object.values(data));
      const tense = list.find(t => t.id === `${category}-${tenseKey}`);
      useCases = (tense && tense.useCases) ? tense.useCases : [];
    }catch(e){
      console.error('Could not load tenses data', e);
      useCases = [];
    }
    document.getElementById('totNum').textContent = useCases.length;
    activeIndex = useCases.length ? 0 : null;
    render();
  }

  function escapeRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

  function highlight(sentence, markers){
    if(!markers || !markers.length) return sentence;
    let out = sentence;
    markers.slice().sort((a,b)=>b.length-a.length).forEach(m=>{
      const re = new RegExp(`\\b(${escapeRe(m)})\\b`, 'i');
      out = out.replace(re, '<b>$1</b>');
    });
    return out;
  }

  function primaryTag(uc){
    return (uc.timeMarkers && uc.timeMarkers[0]) ? uc.timeMarkers[0] : uc.title.toLowerCase();
  }

  function tapCenter(){
    if(activeIndex === null) return;
    if(!placedOrder.includes(activeIndex)){
      placedOrder.push(activeIndex);
      const next = useCases.findIndex((_, i) => !placedOrder.includes(i));
      activeIndex = next === -1 ? null : next;
    } else {
      activeIndex = null;
    }
    render();
  }

  function tapSide(i){
    if(activeIndex !== null && !placedOrder.includes(activeIndex)){
      placedOrder.push(activeIndex);
    }
    activeIndex = i;
    render();
  }

  function render(){
    document.getElementById('curNum').textContent = placedOrder.length;

    renderLamps();
    renderActive();
  }

  function renderLamps(){
    const layer = document.getElementById('lampLayer');
    layer.innerHTML = '';

    const visible = placedOrder.filter(i => i !== activeIndex);
    // newest placement = nearest to viewer (depth 0)
    const ordered = visible.slice().reverse();

    ordered.forEach((i, pos) => {
      const depth = Math.min(pos, SLOTS.length - 1);
      const side  = placedOrder.indexOf(i) % 2 === 0 ? -1 : 1;
      const slot  = SLOTS[depth];
      const uc    = useCases[i];

      const el = document.createElement('div');
      el.className = 'lamp ' + (side === -1 ? 'side-left' : 'side-right');
      el.style.top = slot.y + 'px';

      if(side === -1){
        el.style.left = slot.x + 'px';
      } else {
        el.style.right = slot.x + 'px';
      }

      const tagStyle = `background:${sigColor}; padding:3px 8px; font-size:${slot.tagSize}px; color:#fff;`;
      let bodyHTML = '';
      if(slot.lines > 0){
        bodyHTML = `<div class="body" style="width:${slot.w}px; padding:6px 8px; border-${side===-1?'left':'right'}:3px solid ${sigColor}; font-size:${slot.bodySize}px;">
          ${highlight(uc.mainExample, uc.timeMarkers)}
        </div>`;
      }

      el.innerHTML = `
        <div class="tag" style="${tagStyle} margin-bottom:6px;">${primaryTag(uc)}</div>
        ${bodyHTML}
      `;
      el.onclick = () => tapSide(i);
      layer.appendChild(el);
    });
  }

  function renderActive(){
    const layer = document.getElementById('activeLayer');
    layer.innerHTML = '';

    if(activeIndex === null || !useCases.length) return;

    const uc = useCases[activeIndex];
    const card = document.createElement('div');
    card.className = 'active-card entering';
    card.innerHTML = `
      <div class="eyebrow">${category} &middot; ${tenseKey.replace('-', ' ')}</div>
      <div class="title">${uc.title}</div>
      ${uc.timeMarkers && uc.timeMarkers.length ? `
        <div class="markers">
          ${uc.timeMarkers.map(m=>`<span class="marker" style="background:${sigColor}">${m}</span>`).join('')}
        </div>` : ''}
      <div class="examples">
        <div class="example">${highlight(uc.mainExample, uc.timeMarkers)}</div>
        ${(uc.moreExamples||[]).slice(0,4).map(e=>
          `<div class="example">${highlight(e, uc.timeMarkers)}</div>`).join('')}
      </div>
      ${uc.note ? `<div class="note">${uc.note}</div>` : ''}
      <div class="tap-hint">tap to send down the street</div>
    `;
    card.onclick = tapCenter;
    layer.appendChild(card);
    requestAnimationFrame(()=> card.classList.remove('entering'));
  }

  load();
</script>
</body>
</html>
