<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTUITY — Tense Mill</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

/* ── INTUITY SHELL TOKENS — same as Pulse/Stars/Burrow/Quiz ── */
:root{
  --gold:#C9A961; --gold-glow:rgba(201,169,97,.4);
  --accent:#FFD94A; --accent-rgb:255,217,74;
  --ok:#abc32f; --wrong:#E86A5C;
  --paper:#e5e5e7; --dim:rgba(229,229,231,.55); --faint:rgba(229,229,231,.26);
  --line:rgba(255,255,255,.08);
  --lane1:#61b5ed; --lane2:#c084fc; --lane3:#5ED39B; --lane4:#fb923c;
  --header-h:150px; --lane-h:104px; --hud-h:40px;
  --set-color:#C9A961; --set-rgb:201,169,97;
}
html,body{width:100%;height:100%;overflow:hidden;background:#0d0d0d;overscroll-behavior:none}
body{font-family:'DM Sans',sans-serif;color:var(--paper);user-select:none;-webkit-user-select:none;touch-action:manipulation}
button,a{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-decoration:none}

/* ══ HEADER — identical construction to the rest of the shell ══ */
.header{
  position:fixed;top:0;left:0;right:0;z-index:30;
  display:flex;flex-direction:column;gap:.4rem;padding:.5rem 1.25rem .4rem;
  background:rgba(13,13,13,.88);backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(255,255,255,.06);
}
.header-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.back-link{justify-self:start;font-family:'Space Grotesk',sans-serif;
  font-size:.6rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:rgba(255,255,255,.3);transition:color .2s;white-space:nowrap}
.back-link:hover{color:rgba(255,255,255,.7)}
.header-title{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.app-title{font-family:'Space Grotesk',sans-serif;font-size:1rem;font-weight:900;letter-spacing:.22em;color:var(--gold)}
.app-subtitle{font-size:.58rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.32);margin-top:.1rem}
.header-spacer{justify-self:end;font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--faint);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:.3rem .65rem}
.header-spacer b{color:var(--gold)}

.mode-selector{
  display:flex;flex-wrap:wrap;justify-content:center;align-self:center;
  background:rgba(28,28,30,.6);backdrop-filter:blur(40px);
  border-radius:999px;border:1px solid rgba(201,169,97,.2);overflow:hidden;
}
.mode-btn{
  display:flex;align-items:center;gap:.4rem;
  font-family:'Space Grotesk',sans-serif;font-size:.66rem;font-weight:600;
  letter-spacing:.04em;text-transform:uppercase;
  padding:.5rem 1.05rem;border-right:1px solid rgba(84,84,88,.2);
  color:#636366;transition:background .2s ease,color .2s ease;
}
.mode-btn:last-child{border-right:none}
.mode-btn:hover{color:#9ca3af;background:rgba(201,169,97,.1)}
.mode-btn.active{background:rgba(201,169,97,.15);color:var(--gold)}
@media(max-width:760px){.mode-btn{padding:.42rem .62rem;font-size:.6rem;gap:.3rem}}

.set-tabs{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.28rem;padding:0 .5rem}
.vtab{
  font-family:'Space Grotesk',sans-serif;font-size:.56rem;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;
  padding:.28rem .72rem;border-radius:999px;border:1px solid transparent;
  color:rgba(255,255,255,.3);white-space:nowrap;transition:all .2s;
}
.vtab:hover{color:rgba(255,255,255,.75);border-color:rgba(255,255,255,.15)}
.vtab.active{color:var(--vc,var(--gold));border-color:var(--vc,var(--gold));background:rgba(255,255,255,.06)}
.vtab .due{display:inline-block;width:5px;height:5px;border-radius:50%;
  margin-left:.35rem;vertical-align:middle;background:var(--wrong);opacity:0}
.vtab.has-due .due{opacity:1}

/* ══ HUD ══ */
.hud{position:fixed;top:var(--header-h);left:0;right:0;height:var(--hud-h);z-index:25;
  display:flex;align-items:center;justify-content:space-between;gap:.7rem;padding:0 1rem;
  font-family:'DM Mono',monospace;font-size:.66rem;color:var(--faint);
  border-bottom:1px solid rgba(255,255,255,.05)}
.score-n{font-family:'Space Grotesk',sans-serif;font-weight:900;font-size:1.05rem;
  color:var(--paper);font-variant-numeric:tabular-nums}
.combo{font-family:'Space Grotesk',sans-serif;font-weight:900;font-size:1rem;color:var(--faint);
  transition:color .15s,transform .15s;font-variant-numeric:tabular-nums}
.combo.live{color:var(--accent)}
.combo.pop{transform:scale(1.35)}
.clock{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:.95rem;
  color:var(--paper);font-variant-numeric:tabular-nums}
.clock.low{color:var(--wrong)}
.speeds{display:flex;gap:.18rem}
.spd{font-family:'DM Mono',monospace;font-size:.54rem;letter-spacing:.08em;text-transform:uppercase;
  padding:.14rem .42rem;border-radius:99px;border:1px solid transparent;color:rgba(255,255,255,.24)}
.spd:hover{color:rgba(255,255,255,.6)}
.spd.on{color:var(--accent);border-color:rgba(var(--accent-rgb),.45);background:rgba(var(--accent-rgb),.1)}
.mutebtn{font-size:.8rem;opacity:.55}
.mutebtn:hover{opacity:1}
@media(max-width:600px){ .speeds{display:none} }

/* ══ FIELD ══ */
.field{position:fixed;top:calc(var(--header-h) + var(--hud-h));left:0;right:0;bottom:var(--lane-h);
  overflow:hidden;
  background:radial-gradient(ellipse at 50% 110%,rgba(var(--set-rgb),.10),transparent 62%)}
.field::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:4;
  background:radial-gradient(ellipse at 50% 40%,transparent 60%,rgba(11,11,13,.72) 100%)}
.guides{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);pointer-events:none}
.guide{border-right:1px solid rgba(255,255,255,.045)}
.guide:last-child{border-right:none}
.strike{position:absolute;left:0;right:0;bottom:0;height:2px;z-index:5;
  background:linear-gradient(90deg,transparent,rgba(var(--accent-rgb),.75),transparent)}
.strike.beat{box-shadow:0 0 16px 2px rgba(var(--accent-rgb),.5)}

.card{position:absolute;z-index:3;left:50%;top:0;width:min(90%,560px);
  transform:translate(-50%,-100%);
  display:flex;flex-direction:column;align-items:center;gap:.3rem;
  padding:.7rem 1.1rem .8rem;border-radius:.7rem;
  background:linear-gradient(178deg,rgba(28,28,30,.97),rgba(18,18,20,.99));
  border:1px solid rgba(201,169,97,.22);
  box-shadow:0 .5rem 1.4rem rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06)}
.card .sentence{font-size:clamp(.92rem,3vw,1.15rem);font-weight:600;line-height:1.4;text-align:center;color:var(--paper)}
.card .sentence mark{background:none;color:var(--set-color,var(--gold));font-weight:700;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:.16em}
.card .slot{display:inline-block;min-width:2.6em;margin:0 .15em;
  border-bottom:2px dashed rgba(var(--accent-rgb),.5);color:var(--accent);font-weight:800}
.card.hit{border-color:var(--ok);background:linear-gradient(178deg,rgba(80,110,30,.9),rgba(40,60,15,.95))}
.card.miss{border-color:var(--wrong);background:linear-gradient(178deg,rgba(120,45,40,.9),rgba(60,22,20,.95))}

.tapstart{position:absolute;left:50%;bottom:1.2rem;transform:translateX(-50%);z-index:9;
  font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);background:rgba(12,12,12,.8);border:1px solid rgba(var(--accent-rgb),.35);
  border-radius:999px;padding:.4rem 1rem;pointer-events:none;transition:opacity .4s;white-space:nowrap}
.tapstart.gone{opacity:0}

/* ══ LANES ══ */
.lanes{position:fixed;bottom:0;left:0;right:0;height:var(--lane-h);z-index:20;
  display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;padding:.5rem .5rem .7rem;
  background:rgba(13,13,13,.96);border-top:1px solid rgba(255,255,255,.08)}
.lane{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;
  border-radius:.6rem;border:1.5px solid var(--lc);background:color-mix(in srgb,var(--lc) 12%,transparent);
  font-family:'Space Grotesk',sans-serif;font-weight:700;
  transition:transform .09s,background .12s,box-shadow .12s,opacity .2s}
.lane .p{font-size:clamp(.72rem,2.6vw,.98rem);color:var(--lc);line-height:1.2;padding:0 .2rem;text-align:center;word-break:break-word}
.lane .k{font-family:'DM Mono',monospace;font-size:.5rem;font-weight:400;color:rgba(255,255,255,.24)}
.lane:active,.lane.tap{transform:translateY(3px);background:color-mix(in srgb,var(--lc) 32%,transparent);
  box-shadow:0 0 22px color-mix(in srgb,var(--lc) 45%,transparent)}
.lane.correct{background:rgba(171,195,47,.4);border-color:var(--ok);box-shadow:0 0 26px rgba(171,195,47,.5)}
.lane.wrongtap{background:rgba(232,106,92,.32);border-color:var(--wrong)}

/* ══ FX ══ */
.spark{position:absolute;width:5px;height:5px;border-radius:50%;pointer-events:none;z-index:8}
.flash{position:absolute;width:70px;height:70px;border-radius:50%;pointer-events:none;z-index:8;
  background:radial-gradient(circle,#fff 0%,var(--accent) 35%,rgba(var(--accent-rgb),0) 70%)}
.banner{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.8);z-index:35;
  font-family:'Space Grotesk',sans-serif;font-weight:900;font-size:clamp(1.3rem,6vw,2.4rem);
  letter-spacing:.1em;text-transform:uppercase;opacity:0;pointer-events:none;text-align:center;
  text-shadow:0 0 26px currentColor;transition:opacity .18s,transform .35s cubic-bezier(.2,1.6,.4,1)}
.banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.tier{position:fixed;left:50%;bottom:calc(var(--lane-h) + .6rem);transform:translateX(-50%);z-index:26;
  font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.tier.show{opacity:.9}

/* ══ SUMMARY ══ */
.over{position:fixed;inset:0;z-index:50;display:none;
  align-items:center;justify-content:center;padding:1.2rem;
  background:rgba(8,8,9,.35);backdrop-filter:blur(2px)}
.over.show{display:flex}
.over-card{position:relative;
  width:100%;max-width:23rem;max-height:min(78vh,32rem);overflow-y:auto;
  display:flex;flex-direction:column;align-items:center;gap:.35rem;text-align:center;
  padding:1.6rem 1.5rem 1.4rem;border-radius:1.1rem;
  background:linear-gradient(165deg,rgba(28,28,30,.98),rgba(15,15,17,.99));
  border:1px solid rgba(201,169,97,.25);
  box-shadow:0 20px 55px rgba(0,0,0,.6),0 0 40px rgba(201,169,97,.06);
  animation:cardIn .28s cubic-bezier(.2,1,.4,1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.over .closex{position:absolute;top:.55rem;right:.7rem;width:26px;height:26px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:1rem;line-height:1;
  color:var(--faint);border:1px solid rgba(255,255,255,.12);transition:all .15s}
.over .closex:hover{color:var(--paper);border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.06)}
.over .score{font-family:'Space Grotesk',sans-serif;font-weight:900;
  font-size:clamp(2rem,7vw,2.8rem);font-variant-numeric:tabular-nums}
.over .score .gr{font-size:.5em;margin-left:.3rem;vertical-align:.35em}
.g-a{color:#ffd94a} .g-b{color:var(--ok)} .g-c{color:#7dd3fc} .g-d{color:var(--wrong)}
.over .setname{font-family:'DM Mono',monospace;font-size:.7rem;letter-spacing:.16em;
  text-transform:uppercase;color:var(--dim)}
.over .note{margin-top:.6rem;font-size:.8rem;color:var(--dim)}
.over .note b{color:var(--paper)}
.over .missed{margin-top:.7rem;font-size:.78rem;line-height:1.85;color:var(--dim);text-align:left}
.over .missed .mline{margin-bottom:.35rem}
.over .missed b{color:var(--gold);font-weight:700}
.over .missed .mnote{display:block;color:var(--faint);font-size:.72rem;margin-top:.05rem}
.acts{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;margin-top:1.1rem}
.over .go{padding:.7rem 1.7rem;border-radius:99px;background:var(--accent);color:#12100a;
  font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:.74rem;
  letter-spacing:.1em;text-transform:uppercase}
.over .quiet{padding:.7rem 1.5rem;border-radius:99px;color:var(--dim);
  border:1px solid rgba(255,255,255,.16);font-size:.72rem;
  letter-spacing:.08em;text-transform:uppercase;font-family:'Space Grotesk',sans-serif;font-weight:700}
.over .quiet:hover{color:var(--paper)}
.over .away{margin-top:.9rem;font-size:.66rem;border:none;padding:.3rem}

.resume{position:fixed;left:50%;bottom:calc(var(--lane-h) + 1rem);transform:translateX(-50%);z-index:40;
  display:none;gap:.5rem;align-items:center}
.resume.show{display:flex}
.resume button{font-family:'Space Grotesk',sans-serif;font-size:.62rem;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;padding:.55rem 1.3rem;border-radius:99px;
  background:rgba(var(--accent-rgb),.14);border:1px solid rgba(var(--accent-rgb),.45);color:var(--accent)}
.resume button:hover{background:rgba(var(--accent-rgb),.28)}

.loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:#0d0d0d;z-index:99;font-family:'DM Mono',monospace;font-size:.7rem;color:var(--faint)}
.err{color:var(--wrong);font-size:.8rem;line-height:1.6;max-width:26rem;text-align:center;padding:2rem}

@media(max-width:600px){
  :root{--lane-h:96px;--header-h:168px}
  .card{width:94%;padding:.6rem .8rem .7rem}
  .hud{font-size:.6rem;gap:.5rem;padding:0 .7rem}
}
@media(prefers-reduced-motion:reduce){ .card,.lane,.combo,.banner{transition:none!important} }
</style>
</head>
<body>

<header class="header">
  <div class="header-top">
    <a class="back-link" href="/?openModal=grammar" target="_top">← Grammar</a>
    <div class="header-title"><div class="app-title">INTUITY</div><div class="app-subtitle">Tense Mill</div></div>
    <span class="header-spacer">Level <b>B2–C1</b></span>
  </div>
  <div class="mode-selector">
    <a class="mode-btn" href="tenses-rules.html">🗺️ Explore</a>
    <a class="mode-btn" href="tenses-rules.html?mode=practice">✍️ Practice</a>
    <a class="mode-btn" href="tenses-rules.html?mode=quiz">📝 Quiz</a>
    <a class="mode-btn" href="tenses-rush.html">🎵 Rush</a>
    <span class="mode-btn active">🌀 Mill</span>
  </div>
  <div class="set-tabs" id="setTabs"></div>
</header>

<div class="hud">
  <span>score <span class="score-n" id="score">0</span></span>
  <span class="speeds" id="speeds">
    <button class="spd" data-s="relaxed">Relaxed</button>
    <button class="spd" data-s="steady">Steady</button>
    <button class="spd" data-s="quick">Quick</button>
  </span>
  <span class="combo" id="combo">×1</span>
  <button class="mutebtn" id="muteBtn" title="Sound on/off">🔊</button>
  <span class="clock" id="clock">1:15</span>
</div>

<div class="field" id="field">
  <div class="guides"><div class="guide"></div><div class="guide"></div><div class="guide"></div><div class="guide"></div></div>
  <div class="strike" id="strike"></div>
  <div class="tapstart" id="tapStart">Tap the correct form · keys 1–4</div>
</div>

<div class="lanes" id="lanes"></div>
<div class="tier" id="tier"></div>
<div class="banner" id="banner"></div>

<div class="resume" id="resume"><button id="resumeBtn">↺ Play again</button></div>

<div class="over" id="over">
  <div class="over-card">
    <button class="closex" id="closeX" aria-label="Close">×</button>
    <div class="score" id="ovScore"></div>
    <div class="setname" id="ovSet"></div>
    <div class="note" id="ovNote"></div>
    <div class="missed" id="ovMissed"></div>
    <div class="acts">
      <button class="quiet" id="againBtn">↻ Same set again</button>
      <button class="go" id="nextBtn">Next set →</button>
    </div>
    <button class="quiet away" id="hubBtn">Back to grammar</button>
  </div>
</div>

<div class="loading" id="loading">Loading…</div>

<script>
/* ══════════════════════════════════════════════════════════════════════
   TENSE MILL — beat-driven, same engine as Phrasal Verbs Pulse.

   Reads the SAME tense-rush-data.json Rush and the old Mill used
   (cue / after / mark / answer / options / note). No embedded copy: a
   correction to the data lands here automatically.

   Sentences fall from the top of the field on a 92bpm pulse; the four
   options for THAT sentence sit in the lanes below. Tap (or press 1–4)
   the lane matching the correct form before the card reaches the strike
   line. Streak unlocks music layers exactly as in Pulse — bass at 5,
   drums at 10, full track at 15 — and a broken streak is heard as much
   as seen.
   ══════════════════════════════════════════════════════════════════════ */

window.addEventListener('error', e => {
  const l = document.getElementById('loading');
  if (l && l.style.display !== 'none') l.innerHTML =
    '<p class="err"><b>Mill hit an error.</b><br>' + String(e.message||e).replace(/[<>]/g,'') +
    '<br><span style="opacity:.6">' + ((e.filename||'').split('/').pop()+':'+(e.lineno||'?')) + '</span></p>';
});

const DATA_URL = new URLSearchParams(location.search).get('data') || '../../data/grammar-rules/tense-rush-data.json';

const BPM = 92, BEAT = 60000/BPM, ROUND_MS = 75000, LANE_N = 4;
const LANE_COLORS = ['--lane1','--lane2','--lane3','--lane4'];
const KEYS = ['1','2','3','4'];
const FALL_BEATS = 5, PER_10_CHARS = .42, FALL_MAX = 10, GAP_BEATS = 1.3;
const SPEEDS = { relaxed:1.45, steady:1.0, quick:.72 };
let speed = localStorage.getItem('intuity-mill-speed') || 'relaxed';

const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const shuffle = a => { const b=[...a]; for(let i=b.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[b[i],b[j]]=[b[j],b[i]];} return b; };

let GROUPS = [], groupIdx = 0;
let running = false, startedAt = 0, rafId = null, started = false;
let seq = [], seqAt = 0, live = [], lanes = [];
let score = 0, combo = 0, bestCombo = 0, hits = 0, misses = 0, missLog = [];

/* ── MEMORY: same invisible scheduler as Pulse — misses come back sooner ── */
const MEM_KEY = 'intuity-mill-mem';
function loadMem(){ try{ return JSON.parse(localStorage.getItem(MEM_KEY)||'{}'); }catch(e){ return {}; } }
function saveMem(m){ try{ localStorage.setItem(MEM_KEY,JSON.stringify(m)); }catch(e){} }
const memKey = it => it.group + ':' + it.idx;
function noteResult(it, ok){
  const m = loadMem(), k = memKey(it), e = m[k] || {miss:0,seen:0};
  e.seen++; if (ok) e.miss = Math.max(0,e.miss-1); else e.miss++;
  m[k] = e; saveMem(m);
}
function weightOf(it, mem){
  const e = mem[memKey(it)];
  return e ? 1 + Math.min(6, e.miss*3) : 2;
}

/* ── AUDIO — identical engine to Pulse: same tones, same tier unlocks ── */
let ac = null, master = null, musicOn = localStorage.getItem('intuity-mill-sound') !== 'off';
function audio(){
  if (!ac){
    ac = new (window.AudioContext||window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = .5; master.connect(ac.destination);
  }
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
function tone(f,d,ty,v,when,glide){
  if (!musicOn || !ac) return;
  const c = ac, t0 = when || c.currentTime;
  const o = c.createOscillator(), g = c.createGain();
  o.type = ty||'sine'; o.frequency.setValueAtTime(f,t0);
  if (glide) o.frequency.exponentialRampToValueAtTime(glide,t0+d);
  g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(v||.14,t0+.008);
  g.gain.exponentialRampToValueAtTime(.0008,t0+d);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0+d+.02);
}
function noise(d,v,when){
  if (!musicOn || !ac) return;
  const c = ac, t0 = when||c.currentTime, n = Math.floor(c.sampleRate*d);
  const buf = c.createBuffer(1,n,c.sampleRate), dd = buf.getChannelData(0);
  for (let i=0;i<n;i++) dd[i]=(Math.random()*2-1)*(1-i/n);
  const s = c.createBufferSource(); s.buffer = buf;
  const g = c.createGain(); g.gain.value = v||.06;
  const fl = c.createBiquadFilter(); fl.type='highpass'; fl.frequency.value=6000;
  s.connect(fl); fl.connect(g); g.connect(master); s.start(t0);
}
const BASS = [55,55,73.42,65.41], ARP = [440,554.37,659.25,554.37];
function playBeat(b){
  if (!ac) return;
  const t = ac.currentTime;
  tone(58,.11,'sine',.3,t,34);
  if (combo>=5)  tone(BASS[(b>>1)%4],.3,'triangle',.1,t);
  if (combo>=10) noise(.05, combo>=15?.05:.035, t);
  if (combo>=15) tone(ARP[b%4]*2,.12,'square',.035,t);
}
function sfxHit(m){ if(!ac)return; const t=ac.currentTime,b=523.25*Math.pow(1.0595,Math.min(12,m));
  tone(b,.1,'triangle',.16,t); tone(b*1.5,.14,'triangle',.12,t+.05); }
function sfxMiss(){ if(!ac)return; tone(180,.22,'sawtooth',.13,ac.currentTime,90); }
function sfxSwap(){ if(!ac)return; const t=ac.currentTime;
  [261,329,392,523,659].forEach((f,i)=>tone(f,.45,'triangle',.12,t+i*.06)); }

/* ── DATA ── */
function itemsOf(g){
  return (g.items||[]).map((it,idx)=>({
    cue: it.cue||'', after: it.after||'', mark: it.mark||[],
    answer: it.answer, options: it.options && it.options.length===LANE_N ? it.options : null,
    note: it.note||'', group: g.id, color: g.color, idx
  })).filter(it => it.options && it.options.includes(it.answer));
}
function buildSequence(items){
  const mem = loadMem();
  const bag = items.map(it=>({it,w:weightOf(it,mem)}));
  const out = [];
  while (bag.length){
    let total = bag.reduce((s,x)=>s+x.w,0), r = Math.random()*total, c = 0, j = 0;
    for (;j<bag.length;j++){ c += bag[j].w; if (r<=c) break; }
    j = Math.min(j,bag.length-1);
    out.push(bag[j].it); bag.splice(j,1);
  }
  return out;
}
function fallMsFor(item){
  const len = item.cue.length + item.after.length;
  const beats = Math.min(FALL_MAX, FALL_BEATS + (len/10)*PER_10_CHARS);
  return beats * BEAT * (SPEEDS[speed]||1);
}
function sentenceHTML(item, slotContent){
  let s = esc(item.cue) + (item.cue ? ' ' : '') +
          '<span class="slot">' + (slotContent ? esc(slotContent) : '____') + '</span> ' +
          esc(item.after);
  (item.mark||[]).forEach(w=>{
    const re = new RegExp('\\b'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i');
    s = s.replace(re, m => '<mark>'+m+'</mark>');
  });
  return s;
}

/* ── LANES ── */
function paintLanes(item){
  lanes = shuffle(item.options);
  document.documentElement.style.setProperty('--set-color', item.color);
  const el = $('lanes');
  el.innerHTML = lanes.map((p,i)=>
    `<button class="lane" data-i="${i}" style="--lc:var(${LANE_COLORS[i]})">
       <span class="p">${esc(p)}</span><span class="k">${KEYS[i]}</span></button>`).join('');
  el.querySelectorAll('.lane').forEach(b=>{
    b.addEventListener('pointerdown', e=>{ e.preventDefault(); firstTouch(); tapLane(+b.dataset.i); });
  });
}

function firstTouch(){
  if (started) return;
  started = true; audio();
  $('tapStart').classList.add('gone');
}

/* ── ROUND ── */
function startRound(){
  const g = GROUPS[groupIdx];
  const items = itemsOf(g);
  seq = buildSequence(items);
  seqAt = 0; live = [];
  score = 0; combo = 0; bestCombo = 0; hits = 0; misses = 0; missLog = [];
  $('score').textContent = '0'; setCombo(0);
  paintLanes(seq[0]);
  $('field').querySelectorAll('.card').forEach(n=>n.remove());
  $('over').classList.remove('show');
  $('resume').classList.remove('show');

  running = true; startedAt = performance.now(); nextSpawnAt = 0; lastBeat = -1;
  rafId = requestAnimationFrame(loop);
}
let nextSpawnAt = 0, lastBeat = -1;

function loop(now){
  if (!running) return;
  const t = now - startedAt;

  const b = Math.floor(t/BEAT);
  if (b !== lastBeat){
    lastBeat = b; playBeat(b);
    const s = $('strike'); s.classList.add('beat'); setTimeout(()=>s.classList.remove('beat'),90);
  }

  if (t >= nextSpawnAt && seqAt < seq.length){
    const it = seq[seqAt++];
    paintLanes(it);
    spawn(it,t);
    nextSpawnAt = t + fallMsFor(it) + GAP_BEATS*BEAT;
  }

  const fh = $('field').clientHeight;
  for (let i=live.length-1;i>=0;i--){
    const c = live[i];
    if (c.done){
      c.el.style.transform = `translate(-50%,${c.restY}px) scale(.94)`;
      if (t-c.doneAt > 420){ c.el.remove(); live.splice(i,1); }
      continue;
    }
    const p = (t-c.born)/c.fallMs;
    c.el.style.transform = `translate(-50%,${p*(fh+40)-40}px)`;
    if (p >= 1) resolveCard(c,null,t);
  }

  const leftMs = Math.max(0, ROUND_MS - t);
  $('clock').textContent = Math.floor(leftMs/60000) + ':' + String(Math.ceil((leftMs%60000)/1000)).padStart(2,'0');
  $('clock').classList.toggle('low', leftMs <= 10000);

  if (t >= ROUND_MS || (seqAt >= seq.length && live.length === 0)){ finish(); return; }
  rafId = requestAnimationFrame(loop);
}

function spawn(item,t){
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = `<div class="sentence">${sentenceHTML(item)}</div>`;
  $('field').appendChild(el);
  const bonus = seqAt === 1 ? 2*BEAT : 0;
  live.push({ el, item, born:t, done:false, fallMs: fallMsFor(item)+bonus });
}

function tapLane(i){
  if (!running) return;
  const el = $('lanes').querySelectorAll('.lane')[i];
  if (el){ el.classList.add('tap'); setTimeout(()=>el.classList.remove('tap'),110); }
  const open = live.filter(c=>!c.done);
  if (!open.length) return;
  open.sort((a,b)=>b.born-a.born);
  resolveCard(open[open.length-1], lanes[i], performance.now()-startedAt);
}

function resolveCard(c, chosen, t){
  c.done = true; c.doneAt = t;
  const fh = $('field').clientHeight;
  c.restY = Math.min(fh-10, ((t-c.born)/c.fallMs)*(fh+40)-40);
  const ok = chosen === c.item.answer;
  const laneEl = $('lanes').querySelectorAll('.lane')[lanes.indexOf(c.item.answer)];

  noteResult(c.item, ok);
  try{ if (window.INTUITY) INTUITY.log('tenses', c.item.group+':'+c.item.idx, ok, {game:'mill'}); }catch(e){}

  const soonest = t + (ok ? 900 : 1500);
  if (nextSpawnAt > soonest) nextSpawnAt = soonest;

  c.el.querySelector('.sentence').innerHTML = sentenceHTML(c.item, c.item.answer);

  if (ok){
    hits++; combo++; bestCombo = Math.max(bestCombo,combo);
    score += 100 * (1 + Math.floor(combo/5));
    c.el.classList.add('hit');
    if (laneEl){ laneEl.classList.add('correct'); setTimeout(()=>laneEl.classList.remove('correct'),240); }
    sfxHit(combo); burst(c.el, combo>=10); setCombo(combo);
    if (combo===5)  { banner('Bass','var(--lane1)');  tierNote('bass unlocked'); }
    if (combo===10) { banner('Drive','var(--lane3)'); tierNote('drums unlocked'); }
    if (combo===15) { banner('Full','var(--accent)'); tierNote('full track — hold it'); }
  } else {
    misses++; combo = 0; setCombo(0); missLog.push(c.item);
    c.el.classList.add('miss');
    if (laneEl){ laneEl.classList.add('correct'); setTimeout(()=>laneEl.classList.remove('correct'),420); }
    if (chosen){
      const we = $('lanes').querySelectorAll('.lane')[lanes.indexOf(chosen)];
      if (we){ we.classList.add('wrongtap'); setTimeout(()=>we.classList.remove('wrongtap'),300); }
    }
    sfxMiss();
  }
  $('score').textContent = score;
}

function setCombo(n){
  const el = $('combo');
  el.textContent = '×' + (1+Math.floor(n/5)) + (n ? '  '+n : '');
  el.classList.toggle('live', n>=5);
  el.classList.add('pop'); setTimeout(()=>el.classList.remove('pop'),150);
}
function banner(txt,col){
  const b = $('banner'); b.textContent = txt; b.style.color = col;
  b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
  setTimeout(()=>b.classList.remove('show'),750);
}
function tierNote(txt){
  const t = $('tier'); t.textContent = txt;
  t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1600);
}
function burst(cardEl,big){
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const field = $('field'), fr = field.getBoundingClientRect(), r = cardEl.getBoundingClientRect();
  const cx = r.left+r.width/2-fr.left, cy = r.top+r.height/2-fr.top;
  const f = document.createElement('div'); f.className='flash';
  f.style.cssText += `left:${cx}px;top:${cy}px;transform:translate(-50%,-50%)`;
  field.appendChild(f);
  f.animate([{transform:'translate(-50%,-50%) scale(.2)',opacity:1},
             {transform:`translate(-50%,-50%) scale(${big?3:2})`,opacity:0}],
            {duration:big?420:300,easing:'cubic-bezier(.1,.8,.2,1)'});
  setTimeout(()=>f.remove(),440);
  const COLS = ['#FFD94A','#C9A961','#5ED39B','#61b5ed','#ffffff','#c084fc'];
  for (let i=0;i<(big?26:12);i++){
    const p = document.createElement('div'); p.className='spark';
    const col = COLS[(Math.random()*COLS.length)|0], sz = 3+Math.random()*3;
    p.style.cssText += `left:${cx}px;top:${cy}px;width:${sz}px;height:${sz}px;background:${col};box-shadow:0 0 ${sz*2.5}px ${col}`;
    field.appendChild(p);
    const a = Math.random()*Math.PI*2, d = 40+Math.random()*(big?140:80), dur = 600+Math.random()*350;
    p.animate([{transform:'translate(-50%,-50%) scale(1.1)',opacity:1},
      {transform:`translate(-50%,-50%) translate(${Math.cos(a)*d}px,${Math.sin(a)*d+50}px) scale(.2)`,opacity:0}],
      {duration:dur,easing:'cubic-bezier(.12,.75,.3,1)'});
    setTimeout(()=>p.remove(),dur+30);
  }
}

/* ── SUMMARY ── */
function scale(acc){
  const A = [[0,140],[.60,160],[.72,173],[.80,180],[1,190]];
  for (let i=1;i<A.length;i++){
    const [a0,s0]=A[i-1],[a1,s1]=A[i];
    if (acc<=a1) return Math.round(s0+(acc-a0)/(a1-a0)*(s1-s0));
  }
  return 190;
}
const grade = s => s>=180?['A','Excellent']:s>=173?['B','Very good']:s>=160?['C','Pass']:['D','Try again'];

function finish(){
  running = false; cancelAnimationFrame(rafId);
  live.forEach(c=>c.el.remove()); live = [];
  try{ if (window.INTUITY) INTUITY.session('tenses','mill',{hits,misses,best:bestCombo,score}); }catch(e){}

  const total = hits+misses, acc = total ? hits/total : 0;
  const sc = scale(acc), [letter,word] = grade(sc);
  $('ovScore').className = 'score g-'+letter.toLowerCase();
  $('ovScore').innerHTML = sc + '<span class="gr">'+letter+'</span>';
  $('ovSet').textContent = word + ' · ' + GROUPS[groupIdx].label;
  $('ovNote').innerHTML = '<b>'+hits+'</b> caught, <b>'+misses+'</b> missed · best combo <b>'+
    bestCombo+'</b> · score <b>'+score+'</b>';

  const seen = new Map();
  missLog.forEach(m=>{ const k = m.group+':'+m.idx; if(!seen.has(k)) seen.set(k, m); });
  $('ovMissed').innerHTML = seen.size
    ? '<div style="font-family:\'DM Mono\',monospace;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:.4rem">Worth another look</div>' +
      [...seen.values()].map(m =>
        '<div class="mline"><b>' + esc(m.answer) + '</b>' +
        (m.note ? '<span class="mnote">' + esc(m.note) + '</span>' : '') + '</div>').join('')
    : '';

  $('over').classList.add('show');
}

function closeOver(){
  $('over').classList.remove('show');
  $('resume').classList.add('show');
}

/* ── TABS ── */
function buildTabs(){
  const mem = loadMem(), wrap = $('setTabs');
  wrap.innerHTML = '';
  GROUPS.forEach((g,i)=>{
    const due = itemsOf(g).some(it => (mem[memKey(it)]?.miss||0) > 0);
    const btn = document.createElement('button');
    btn.className = 'vtab' + (i===groupIdx?' active':'') + (due?' has-due':'');
    btn.style.setProperty('--vc', g.color);
    btn.innerHTML = esc(g.label) + '<span class="due"></span>';
    btn.title = g.desc || '';
    btn.onclick = () => { if (i===groupIdx) return; switchGroup(i); };
    wrap.appendChild(btn);
  });
}
function switchGroup(i){
  groupIdx = i;
  stopRound();
  buildTabs();
  const u = new URL(location.href); u.searchParams.set('set', GROUPS[i].id);
  history.replaceState(null,'',u);
  startRound();
}
function stopRound(){
  running = false; cancelAnimationFrame(rafId);
  live.forEach(c=>c.el.remove()); live = [];
  $('over').classList.remove('show'); $('resume').classList.remove('show');
}

/* ── SPEED / MUTE ── */
function setSpeed(s){
  speed = s; localStorage.setItem('intuity-mill-speed', s);
  document.querySelectorAll('.spd').forEach(b=>b.classList.toggle('on', b.dataset.s===s));
}
$('speeds').querySelectorAll('.spd').forEach(b=>b.addEventListener('click', ()=>setSpeed(b.dataset.s)));
setSpeed(speed);

function setMute(on){
  musicOn = on; localStorage.setItem('intuity-mill-sound', on?'on':'off');
  $('muteBtn').textContent = on ? '🔊' : '🔈';
  $('muteBtn').classList.toggle('off', !on);
}
$('muteBtn').addEventListener('click', ()=> setMute(!musicOn));
setMute(musicOn);

/* ── EVENTS ── */
document.addEventListener('keydown', e => {
  const i = KEYS.indexOf(e.key);
  if (i >= 0){ firstTouch(); tapLane(i); }
  if (e.key === 'Escape') closeOver();
});
$('closeX').addEventListener('click', closeOver);
$('over').addEventListener('click', e => { if (e.target === $('over')) closeOver(); });
$('resumeBtn').addEventListener('click', () => { $('resume').classList.remove('show'); startRound(); });
$('againBtn').addEventListener('click', () => { $('over').classList.remove('show'); startRound(); });
$('nextBtn').addEventListener('click', () => { const n=(groupIdx+1)%GROUPS.length; switchGroup(n); });
$('hubBtn').addEventListener('click', () => { (window.top||window).location.href = '/?openModal=grammar'; });

/* ── BOOT ── */
async function boot(){
  let data;
  try {
    const res = await fetch(DATA_URL, { cache:'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    data = await res.json();
  } catch (e) {
    $('loading').innerHTML =
      `<p class="err">Couldn't load <b>${DATA_URL}</b> (${String(e.message||e).replace(/[<>]/g,'')}).<br>` +
      `If you opened this file directly (file://), your browser blocks local JSON fetches — serve it over http:// instead.</p>`;
    return;
  }
  GROUPS = data.map(g => ({ id:g.id, label:g.label, color:g.color, desc:g.desc, items:g.items }))
               .filter(g => itemsOf(g).length >= LANE_N);
  if (!GROUPS.length){
    $('loading').innerHTML = '<p class="err">No set in the data file has items with a 4-option `options` array including the `answer`.</p>';
    return;
  }
  const want = (new URLSearchParams(location.search).get('set') || '').toLowerCase();
  groupIdx = Math.max(0, GROUPS.findIndex(g => g.id.toLowerCase() === want));
  buildTabs();
  $('loading').style.display = 'none';
  startRound();
}
boot();
</script>
