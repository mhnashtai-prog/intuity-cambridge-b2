<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTUITY — Bomb Defusal</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

/* ── INTUITY SHELL TOKENS — same as Forge/Duel ── */
:root{
  --gold:#C9A961; --gold-glow:rgba(201,169,97,.4);
  --accent:#FFD94A; --accent-rgb:255,217,74;
  --ok:#abc32f; --wrong:#E86A5C; --wrong-rgb:232,106,92;
  --paper:#e5e5e7; --dim:rgba(229,229,231,.55); --faint:rgba(229,229,231,.26);
  --line:rgba(255,255,255,.08);
  --w1:#61b5ed; --w2:#c084fc; --w3:#5ED39B; --w4:#fb923c;
  --header-h:150px; --wire-h:126px; --player-h:36px;
  --set-color:#C9A961; --set-rgb:201,169,97;
  --phase-color:#C9A961; --phase-rgb:201,169,97;
}
html,body{width:100%;height:100%;overflow:hidden;background:#0d0d0d;overscroll-behavior:none}
body{font-family:'DM Sans',sans-serif;color:var(--paper);user-select:none;-webkit-user-select:none;touch-action:manipulation}
button,a{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-decoration:none}

/* ══ HEADER ══ */
.header{
  position:fixed;top:0;left:0;right:0;z-index:30;
  display:flex;flex-direction:column;gap:.4rem;padding:.5rem 1.25rem .4rem;
  background:rgba(13,13,13,.88);backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(255,255,255,.06);
}
.header-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.back-link{justify-self:start;font-family:'Space Grotesk',sans-serif;
  font-size:.6rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:rgba(255,255,255,.3);transition:color .2s;white-space:nowrap}
.back-link:hover{color:rgba(255,255,255,.7)}
.header-title{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.app-title{font-family:'Space Grotesk',sans-serif;font-size:1rem;font-weight:900;letter-spacing:.22em;color:var(--gold)}
.app-subtitle{font-size:.58rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.32);margin-top:.1rem}
.header-spacer{justify-self:end;font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--faint);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:.3rem .65rem}
.header-spacer b{color:var(--gold)}

.mode-selector{
  display:flex;flex-wrap:wrap;justify-content:center;align-self:center;
  background:rgba(28,28,30,.6);backdrop-filter:blur(40px);
  border-radius:999px;border:1px solid rgba(201,169,97,.2);overflow:hidden;
}
.mode-btn{
  display:flex;align-items:center;gap:.4rem;
  font-family:'Space Grotesk',sans-serif;font-size:.66rem;font-weight:600;
  letter-spacing:.04em;text-transform:uppercase;
  padding:.5rem 1.05rem;border-right:1px solid rgba(84,84,88,.2);
  color:#636366;transition:background .2s ease,color .2s ease;
}
.mode-btn:last-child{border-right:none}
.mode-btn:hover{color:#9ca3af;background:rgba(201,169,97,.1)}
.mode-btn.active{background:rgba(201,169,97,.15);color:var(--gold)}
@media(max-width:760px){.mode-btn{padding:.42rem .62rem;font-size:.6rem;gap:.3rem}}

.set-tabs{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.28rem;padding:0 .5rem}
.vtab{
  font-family:'Space Grotesk',sans-serif;font-size:.56rem;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;
  padding:.28rem .72rem;border-radius:999px;border:1px solid transparent;
  color:rgba(255,255,255,.3);white-space:nowrap;transition:all .2s;
}
.vtab:hover{color:rgba(255,255,255,.75);border-color:rgba(255,255,255,.15)}
.vtab.active{color:var(--vc,var(--gold));border-color:var(--vc,var(--gold));background:rgba(255,255,255,.06)}
.vtab .due{display:inline-block;width:5px;height:5px;border-radius:50%;
  margin-left:.35rem;vertical-align:middle;background:var(--wrong);opacity:0}
.vtab.has-due .due{opacity:1}

/* ══ HUD ══ */
.hud{position:fixed;top:var(--header-h);left:0;right:0;height:40px;z-index:25;
  display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:0 1rem;
  font-family:'DM Mono',monospace;font-size:.62rem;color:var(--faint);
  border-bottom:1px solid rgba(255,255,255,.05);flex-wrap:wrap}
.hud .grp{display:flex;align-items:center;gap:.55rem}
.score-n{font-family:'Space Grotesk',sans-serif;font-weight:900;font-size:1.05rem;
  color:var(--paper);font-variant-numeric:tabular-nums}
.streak{font-family:'Space Grotesk',sans-serif;font-weight:900;font-size:1rem;color:var(--faint);
  transition:color .15s,transform .15s;font-variant-numeric:tabular-nums}
.streak.live{color:var(--accent)}
.streak.pop{transform:scale(1.3)}
.modes{display:flex;gap:.18rem}
.mbtn{font-family:'DM Mono',monospace;font-size:.54rem;letter-spacing:.08em;text-transform:uppercase;
  padding:.14rem .5rem;border-radius:99px;border:1px solid transparent;color:rgba(255,255,255,.24)}
.mbtn:hover{color:rgba(255,255,255,.6)}
.mbtn.on{color:var(--accent);border-color:rgba(var(--accent-rgb),.45);background:rgba(var(--accent-rgb),.1)}
.threat-tag{font-family:'DM Mono',monospace;font-size:.56rem;letter-spacing:.12em;text-transform:uppercase;
  padding:.2rem .6rem;border-radius:999px;border:1px solid var(--phase-color);color:var(--phase-color);
  transition:color .3s,border-color .3s;white-space:nowrap}
.mutebtn{font-size:.8rem;opacity:.55}
.mutebtn:hover{opacity:1}
@media(max-width:600px){.modes{display:none}}

/* ══ ARENA ══ */
.arena{position:fixed;top:calc(var(--header-h) + 40px);left:0;right:0;bottom:calc(var(--wire-h) + var(--player-h));
  overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.9rem;
  background:radial-gradient(ellipse at 50% 40%,rgba(var(--phase-rgb),.10),transparent 65%)}
.arena.shakeit{animation:bigshake .4s}
@keyframes bigshake{0%,100%{transform:translate(0,0)}15%{transform:translate(-9px,3px) rotate(-.4deg)}30%{transform:translate(7px,-4px) rotate(.4deg)}45%{transform:translate(-6px,4px)}60%{transform:translate(5px,-3px)}75%{transform:translate(-3px,2px)}90%{transform:translate(2px,-1px)}}

/* threat panel — replaces the old flat "bombs cleared" progress line.
   Same visual language as Duel's boss-panel: a named bar that drains as
   the player succeeds, so the whole building's danger is legible at a
   glance instead of being a bare fraction. */
.threat-panel{width:100%;display:flex;flex-direction:column;align-items:center;gap:.35rem}
.threat-name{font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--phase-color);transition:color .3s}
.threat-bar-track{width:min(72%,340px);height:9px;border-radius:999px;background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.12);overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.5)}
.threat-bar-fill{height:100%;border-radius:999px;
  background:linear-gradient(90deg,var(--phase-color),color-mix(in srgb,var(--phase-color) 55%,white));
  box-shadow:0 0 12px rgba(var(--phase-rgb),.55);transition:width .35s cubic-bezier(.2,.8,.2,1),background .3s}
.threat-meta{font-family:'DM Mono',monospace;font-size:.58rem;color:var(--faint)}

.device{width:min(94%,420px);display:flex;flex-direction:column;align-items:center;gap:.55rem;
  padding:1.1rem 1.1rem 1.2rem;border-radius:1rem;position:relative;
  background:linear-gradient(178deg,rgba(24,24,26,.97),rgba(14,14,16,.99));
  border:1.5px solid rgba(201,169,97,.22);
  box-shadow:0 .6rem 2rem rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.06);
  transition:border-color .2s,background .2s}
.device.correctflash{border-color:var(--ok);background:linear-gradient(178deg,rgba(60,85,20,.9),rgba(30,45,10,.97))}
.device.wrongflash{border-color:var(--wrong);background:linear-gradient(178deg,rgba(110,40,35,.9),rgba(55,20,18,.97))}

.status-row{display:flex;align-items:center;gap:.4rem;font-family:'DM Mono',monospace;
  font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--phase-color);box-shadow:0 0 8px var(--phase-color)}
.status-dot.pulse{animation:dotpulse 1s infinite}
@keyframes dotpulse{0%,100%{opacity:1}50%{opacity:.25}}

.bombring{width:132px;height:132px;border-radius:50%;position:relative;
  background:conic-gradient(var(--phase-color) calc(var(--pct,100)*1%), rgba(255,255,255,.07) 0);
  box-shadow:0 0 26px rgba(var(--phase-rgb),.35);transition:background .12s linear}
.bombring::before{content:'';position:absolute;inset:9px;border-radius:50%;background:#0c0c0d;box-shadow:inset 0 0 18px rgba(0,0,0,.65)}
.bombring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:2;
  font-family:'DM Mono',monospace;font-weight:700;font-size:1.9rem;color:var(--paper);letter-spacing:-.02em;
  font-variant-numeric:tabular-nums}
.bombring.critical{animation:ringpulse .5s infinite}
.bombring.critical .num{color:var(--wrong)}
@keyframes ringpulse{0%,100%{box-shadow:0 0 26px rgba(var(--wrong-rgb),.35)}50%{box-shadow:0 0 42px rgba(var(--wrong-rgb),.75)}}
.bombring.practice .num{font-size:1.5rem;color:var(--dim)}

.sentence{font-size:clamp(.92rem,2.7vw,1.12rem);font-weight:600;line-height:1.5;text-align:center;color:var(--paper)}
.sentence mark{background:none;color:var(--set-color,var(--gold));font-weight:700;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:.16em}
.sentence .slot{display:inline-block;min-width:2.6em;margin:0 .15em;
  border-bottom:2px dashed rgba(var(--accent-rgb),.5);color:var(--accent);font-weight:800}

.tapstart{font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);background:rgba(12,12,12,.8);border:1px solid rgba(var(--accent-rgb),.35);
  border-radius:999px;padding:.4rem 1rem;pointer-events:none;transition:opacity .4s;white-space:nowrap}
.tapstart.gone{opacity:0;position:absolute}

.log-feed{position:fixed;top:calc(var(--header-h) + 48px);right:.8rem;width:190px;display:flex;flex-direction:column;gap:.28rem;z-index:6;pointer-events:none}
.log-line{font-family:'DM Mono',monospace;font-size:.6rem;line-height:1.3;color:var(--dim);
  background:rgba(15,15,17,.65);border-left:2px solid var(--faint);padding:.22rem .5rem;border-radius:.2rem;
  opacity:0;transform:translateX(8px);animation:logIn .25s forwards}
.log-line.hit{border-color:var(--ok);color:var(--ok)}
.log-line.miss{border-color:var(--wrong);color:var(--wrong)}
.log-line.spec{border-color:var(--accent);color:var(--accent);font-weight:700}
@keyframes logIn{to{opacity:1;transform:none}}
@media(max-width:820px){.log-feed{display:none}}

.dmg-num{position:fixed;z-index:36;font-family:'Space Grotesk',sans-serif;font-weight:900;
  font-size:1.05rem;pointer-events:none;text-shadow:0 0 12px currentColor}
.dmg-num.pos{color:var(--ok)}
.dmg-num.neg{color:var(--wrong)}
.dmg-num.overdrive{color:var(--accent);font-size:1.4rem}

/* explosion overlay */
.boom{position:fixed;inset:0;z-index:41;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 46%,rgba(255,130,60,.85),rgba(120,20,10,.35) 42%,transparent 72%)}
.boom.show{animation:boomFlash .5s ease-out forwards}
@keyframes boomFlash{0%{opacity:0}12%{opacity:1}100%{opacity:0}}

/* ══ PLAYER BAR — imported from Duel: a visible composure meter that is
   the sole fail condition now, replacing the old fixed "3 lives" cap. ══ */
.player-wrap{position:fixed;bottom:var(--wire-h);left:0;right:0;height:var(--player-h);z-index:21;
  display:flex;align-items:center;gap:.6rem;padding:0 1rem;
  background:rgba(13,13,13,.94);border-top:1px solid rgba(255,255,255,.06)}
.player-label{font-family:'Space Grotesk',sans-serif;font-size:.6rem;font-weight:700;letter-spacing:.1em;
  color:var(--dim);text-transform:uppercase;white-space:nowrap}
.player-bar-track{flex:1;height:9px;border-radius:999px;background:rgba(255,255,255,.06);
  overflow:hidden;border:1px solid rgba(255,255,255,.1)}
.player-bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#61b5ed,#5ED39B);
  box-shadow:0 0 10px rgba(93,211,155,.5);transition:width .3s,background .3s;width:100%}
.player-bar-fill.low{background:linear-gradient(90deg,var(--wrong),#ff9d8f);box-shadow:0 0 10px rgba(232,106,92,.6)}
.player-hp-text{font-family:'DM Mono',monospace;font-size:.58rem;color:var(--faint);min-width:2.8rem;text-align:right}

/* ══ WIRE PANEL ══ */
.wires-wrap{position:fixed;bottom:0;left:0;right:0;height:var(--wire-h);z-index:20;
  display:flex;flex-direction:column;gap:.35rem;padding:.5rem .6rem .65rem;
  background:rgba(13,13,13,.96);border-top:1px solid rgba(255,255,255,.08)}
.wires-label{font-family:'DM Mono',monospace;font-size:.56rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);text-align:center}
.wires{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem}
.wire{position:relative;border-radius:.6rem;padding:.5rem .3rem;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:.4rem;border:1.5px solid var(--wc);
  background:color-mix(in srgb,var(--wc) 13%,transparent);transition:transform .08s,background .12s,box-shadow .12s,opacity .2s}
.wire:active{transform:translateY(3px)}
.wire .stripe-row{display:flex;align-items:center;width:80%;height:6px;position:relative}
.stripe-half{flex:1;height:6px;border-radius:3px;background:var(--wc);box-shadow:0 0 8px color-mix(in srgb,var(--wc) 65%,transparent);
  transition:transform .18s ease,opacity .18s}
.wire .label{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(.62rem,2.3vw,.8rem);
  color:var(--wc);text-align:center;line-height:1.15;padding:0 .1rem;word-break:break-word}
.wire .k{font-family:'DM Mono',monospace;font-size:.48rem;color:rgba(255,255,255,.24)}
.wire.snip .stripe-half.l{transform:translate(-7px,-2px) rotate(-14deg)}
.wire.snip .stripe-half.r{transform:translate(7px,2px) rotate(14deg)}
.wire.correctcut{background:rgba(171,195,47,.4);border-color:var(--ok);box-shadow:0 0 24px rgba(171,195,47,.5)}
.wire.wrongcut{background:rgba(232,106,92,.34);border-color:var(--wrong);box-shadow:0 0 24px rgba(232,106,92,.5)}
.wire.locked{opacity:.3;pointer-events:none}

/* ══ FX ══ */
.banner{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%) scale(.8);z-index:35;
  font-family:'Space Grotesk',sans-serif;font-weight:900;font-size:clamp(1.2rem,5.6vw,2.3rem);
  letter-spacing:.1em;text-transform:uppercase;opacity:0;pointer-events:none;text-align:center;
  text-shadow:0 0 26px currentColor;transition:opacity .18s,transform .35s cubic-bezier(.2,1.6,.4,1)}
.banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* ══ SUMMARY ══ */
.over{position:fixed;inset:0;z-index:50;display:none;
  align-items:center;justify-content:center;padding:1.2rem;
  background:rgba(8,8,9,.35);backdrop-filter:blur(2px)}
.over.show{display:flex}
.over-card{position:relative;
  width:100%;max-width:23rem;max-height:min(78vh,32rem);overflow-y:auto;
  display:flex;flex-direction:column;align-items:center;gap:.35rem;text-align:center;
  padding:1.6rem 1.5rem 1.4rem;border-radius:1.1rem;
  background:linear-gradient(165deg,rgba(28,28,30,.98),rgba(15,15,17,.99));
  border:1px solid rgba(201,169,97,.25);
  box-shadow:0 20px 55px rgba(0,0,0,.6),0 0 40px rgba(201,169,97,.06);
  animation:cardIn .28s cubic-bezier(.2,1,.4,1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.over .closex{position:absolute;top:.55rem;right:.7rem;width:26px;height:26px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:1rem;line-height:1;
  color:var(--faint);border:1px solid rgba(255,255,255,.12);transition:all .15s}
.over .closex:hover{color:var(--paper);border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.06)}
.over .outcome{font-family:'Space Grotesk',sans-serif;font-weight:900;font-size:.72rem;
  letter-spacing:.16em;text-transform:uppercase;padding:.25rem .8rem;border-radius:999px;border:1px solid currentColor}
.over .outcome.win{color:var(--ok)}
.over .outcome.loss{color:var(--wrong)}
.over .score{font-family:'Space Grotesk',sans-serif;font-weight:900;margin-top:.3rem;
  font-size:clamp(2rem,7vw,2.8rem);font-variant-numeric:tabular-nums}
.over .score .gr{font-size:.5em;margin-left:.3rem;vertical-align:.35em}
.g-a{color:#ffd94a} .g-b{color:var(--ok)} .g-c{color:#7dd3fc} .g-d{color:var(--wrong)}
.over .setname{font-family:'DM Mono',monospace;font-size:.7rem;letter-spacing:.16em;
  text-transform:uppercase;color:var(--dim)}
.over .note{margin-top:.6rem;font-size:.8rem;color:var(--dim)}
.over .note b{color:var(--paper)}
.over .missed{margin-top:.7rem;font-size:.78rem;line-height:1.85;color:var(--dim);text-align:left}
.over .missed .mline{margin-bottom:.35rem}
.over .missed b{color:var(--gold);font-weight:700}
.over .missed .mnote{display:block;color:var(--faint);font-size:.72rem;margin-top:.05rem}
.acts{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;margin-top:1.1rem}
.over .go{padding:.7rem 1.7rem;border-radius:99px;background:var(--accent);color:#12100a;
  font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:.74rem;
  letter-spacing:.1em;text-transform:uppercase}
.over .quiet{padding:.7rem 1.5rem;border-radius:99px;color:var(--dim);
  border:1px solid rgba(255,255,255,.16);font-size:.72rem;
  letter-spacing:.08em;text-transform:uppercase;font-family:'Space Grotesk',sans-serif;font-weight:700}
.over .quiet:hover{color:var(--paper)}
.over .away{margin-top:.9rem;font-size:.66rem;border:none;padding:.3rem}

.loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:#0d0d0d;z-index:99;font-family:'DM Mono',monospace;font-size:.7rem;color:var(--faint)}
.err{color:var(--wrong);font-size:.8rem;line-height:1.6;max-width:26rem;text-align:center;padding:2rem}

@media(max-width:600px){
  :root{--header-h:168px;--wire-h:132px;--player-h:32px}
  .device{padding:.9rem .9rem 1rem}
  .bombring{width:112px;height:112px}
  .bombring .num{font-size:1.6rem}
}
@media(prefers-reduced-motion:reduce){ .device,.wire,.streak,.banner,.threat-bar-fill,.player-bar-fill,.bombring{transition:none!important} .arena.shakeit,.bombring.critical{animation:none} }
</style>
</head>
<body>

<header class="header">
  <div class="header-top">
    <a class="back-link" href="/?openModal=grammar" target="_top">← Grammar</a>
    <div class="header-title"><div class="app-title">INTUITY</div><div class="app-subtitle">Bomb Defusal</div></div>
    <span class="header-spacer">Level <b>B2–C1</b></span>
  </div>
  <div class="mode-selector">
    <a class="mode-btn" href="tenses-rules.html">🗺️ Explore</a>
    <a class="mode-btn" href="tenses-rules.html?mode=practice">✍️ Practice</a>
    <a class="mode-btn" href="tenses-rules.html?mode=quiz">📝 Quiz</a>
    <span class="mode-btn active">💣 Defuse</span>
    <a class="mode-btn" href="tenses-forge.html">🔨 Forge</a>
    
  </div>
  <div class="set-tabs" id="setTabs"></div>
</header>

<div class="hud">
  <span class="grp"><span>score <span class="score-n" id="score">0</span></span></span>
  <span class="grp">
    <span class="streak" id="streak">×1</span>
  </span>
  <span class="modes" id="modes">
    <button class="mbtn" data-m="timed">Timed</button>
    <button class="mbtn" data-m="practice">Practice</button>
  </span>
  <span class="grp">
    <span class="threat-tag" id="threatTag">steady</span>
    <button class="mutebtn" id="muteBtn" title="Sound on/off">🔊</button>
  </span>
</div>

<div class="log-feed" id="logFeed"></div>
<div class="boom" id="boom"></div>
<div class="banner" id="banner"></div>

<div class="arena" id="arena">
  <div class="threat-panel">
    <div class="threat-name" id="threatName">BUILDING THREAT</div>
    <div class="threat-bar-track"><div class="threat-bar-fill" id="threatFill" style="width:100%"></div></div>
    <div class="threat-meta"><span id="threatHpText">1000 / 1000</span></div>
  </div>

  <div class="device" id="device">
    <div class="status-row"><span class="status-dot pulse" id="statusDot"></span><span id="statusText">ARMED</span></div>
    <div class="bombring" id="bombring"><span class="num" id="ringNum">--</span></div>
    <div class="sentence" id="sentence">Loading…</div>
    <div class="tapstart" id="tapStart">Cut the correct wire · keys 1–4</div>
  </div>
</div>

<div class="player-wrap">
  <span class="player-label">You</span>
  <div class="player-bar-track"><div class="player-bar-fill" id="playerFill" style="width:100%"></div></div>
  <span class="player-hp-text" id="playerHpText">1000 / 1000</span>
</div>

<div class="wires-wrap">
  <div class="wires-label">select a wire to cut</div>
  <div class="wires" id="wires"></div>
</div>

<div class="over" id="over">
  <div class="over-card">
    <button class="closex" id="closeX" aria-label="Close">×</button>
    <div class="outcome" id="ovOutcome"></div>
    <div class="score" id="ovScore"></div>
    <div class="setname" id="ovSet"></div>
    <div class="note" id="ovNote"></div>
    <div class="missed" id="ovMissed"></div>
    <div class="acts">
      <button class="quiet" id="againBtn">↻ Rematch</button>
      <button class="go" id="nextBtn">Next floor →</button>
    </div>
    <button class="quiet away" id="hubBtn">Back to grammar</button>
  </div>
</div>

<div class="loading" id="loading">Loading…</div>

<script>
/* ══════════════════════════════════════════════════════════════════════
   BOMB DEFUSAL — one sentence, one ticking clock, four wires.

   Reads the SAME tense-rush-data.json Duel/Rush/Mill/Forge use (cue /
   after / mark / answer / options / note). No embedded copy: a correction
   to the data lands here automatically.

   MERGED WITH DUEL'S CONTEST MODEL (this was a deliberate follow-up: the
   countdown ring was Defusal's strongest tension cue, but the old win/lose
   frame — clear 10 bombs, don't burn through 3 fixed lives — gave a
   correct answer almost no visible payoff and could end an otherwise-good
   run on one unlucky early miss). Now it plays like Duel: a THREAT bar
   (the building) drains with every successful defusal, a composure bar
   (the player) drains with every wrong wire, and the run ends when either
   bar empties. Combo, the streak multiplier, and the "Steady Hands"
   overdrive spike are unchanged from before — only the win/lose frame and
   the on-screen payoff for a correct answer changed. Threat escalation
   (steady → tense → critical) is now driven by how much of the building's
   threat is left, so difficulty responds to how well the player is doing,
   not to a fixed bomb count. A Practice toggle still removes the clock
   entirely for learners who need the untimed rep before facing the timer.
   ══════════════════════════════════════════════════════════════════════ */

window.addEventListener('error', e => {
  const l = document.getElementById('loading');
  if (l && l.style.display !== 'none') l.innerHTML =
    '<p class="err"><b>Defusal hit an error.</b><br>' + String(e.message||e).replace(/[<>]/g,'') +
    '<br><span style="opacity:.6">' + ((e.filename||'').split('/').pop()+':'+(e.lineno||'?')) + '</span></p>';
});

const DATA_URL = new URLSearchParams(location.search).get('data') || '../../data/grammar-rules/tense-rush-data.json';

const WIRE_N = 4;
const WIRE_VARS = ['--w1','--w2','--w3','--w4'];
const KEYS = ['1','2','3','4'];

const THREAT_MAX = 1000, PLAYER_MAX = 1000;
const BASE_THREAT_DMG = 78, BASE_PLAYER_DMG = 95;
const TIMER_BASE_MS = 6400, TIMER_PER_CHAR = 46, TIMER_MIN = 3000, TIMER_MAX = 11000;

const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const shuffle = a => { const b=[...a]; for(let i=b.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[b[i],b[j]]=[b[j],b[i]];} return b; };
const clamp = (n,lo,hi) => Math.max(lo,Math.min(hi,n));

let GROUPS = [], groupIdx = 0;
let running = false, started = false, rafId = null;
let wires = [], curItem = null, resolved = false;
const NO_REPEAT = 4;
let recentIdx = [];
let score = 0, streak = 0, bestStreak = 0, hits = 0, misses = 0, missLog = [];
let threatHP = THREAT_MAX, playerHP = PLAYER_MAX, overdriveReady = false, overdriveMark = 0;
let qStart = 0, qDur = 0, lastTickSecond = -1;
let mode = localStorage.getItem('intuity-defuse-mode') || 'timed';

/* ── MEMORY ── */
const MEM_KEY = 'intuity-defuse-mem';
function loadMem(){ try{ return JSON.parse(localStorage.getItem(MEM_KEY)||'{}'); }catch(e){ return {}; } }
function saveMem(m){ try{ localStorage.setItem(MEM_KEY,JSON.stringify(m)); }catch(e){} }
const memKey = it => it.group + ':' + it.idx;
function noteResult(it, ok){
  const m = loadMem(), k = memKey(it), e = m[k] || {miss:0,seen:0};
  e.seen++; if (ok) e.miss = Math.max(0,e.miss-1); else e.miss++;
  m[k] = e; saveMem(m);
}
function weightOf(it, mem){
  const e = mem[memKey(it)];
  return e ? 1 + Math.min(6, e.miss*3) : 2;
}

/* ── AUDIO ── */
let ac = null, master = null, musicOn = localStorage.getItem('intuity-defuse-sound') !== 'off';
function audio(){
  if (!ac){
    ac = new (window.AudioContext||window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = .5; master.connect(ac.destination);
  }
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
function tone(f,d,ty,v,when,glide){
  if (!musicOn || !ac) return;
  const c = ac, t0 = when || c.currentTime;
  const o = c.createOscillator(), g = c.createGain();
  o.type = ty||'sine'; o.frequency.setValueAtTime(f,t0);
  if (glide) o.frequency.exponentialRampToValueAtTime(glide,t0+d);
  g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(v||.14,t0+.008);
  g.gain.exponentialRampToValueAtTime(.0008,t0+d);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0+d+.02);
}
function noise(d,v,when,hp){
  if (!musicOn || !ac) return;
  const c = ac, t0 = when||c.currentTime, n = Math.floor(c.sampleRate*d);
  const buf = c.createBuffer(1,n,c.sampleRate), dd = buf.getChannelData(0);
  for (let i=0;i<n;i++) dd[i]=(Math.random()*2-1)*(1-i/n);
  const s = c.createBufferSource(); s.buffer = buf;
  const g = c.createGain(); g.gain.value = v||.06;
  const fl = c.createBiquadFilter(); fl.type = hp?'highpass':'lowpass'; fl.frequency.value = hp?6000:900;
  s.connect(fl); fl.connect(g); g.connect(master); s.start(t0);
}
function sfxTick(urgency){ if(!ac)return; const t=ac.currentTime;
  tone(880 + urgency*260, .045, 'square', .05 + urgency*.05, t); }
function sfxSnip(){ if(!ac)return; const t=ac.currentTime; noise(.06,.08,t,true); tone(1400,.04,'square',.05,t+.02); }
function sfxDefuse(){ if(!ac)return; const t=ac.currentTime;
  [523,659,784].forEach((f,i)=>tone(f,.22,'triangle',.15,t+i*.06)); }
function sfxBoom(){ if(!ac)return; const t=ac.currentTime;
  tone(90,.5,'sawtooth',.22,t,35); noise(.4,.16,t,false); }
function sfxSteady(){ if(!ac)return; const t=ac.currentTime;
  [392,494,587,659].forEach((f,i)=>tone(f,.35,'triangle',.13,t+i*.05)); noise(.25,.08,t,true); }
/* sfxVictory / sfxDefeat were referenced by finish() but never defined in
   the original file — that threw a ReferenceError on every win or loss,
   which aborted finish() before it reached $('over').classList.add('show'),
   so the summary modal never appeared. Fixed by defining them (ported
   from Duel/Forge, which already had this right). */
function sfxVictory(){ if(!ac)return; const t=ac.currentTime;
  [523,659,784,1047].forEach((f,i)=>tone(f,.4,'triangle',.16,t+i*.11)); }
function sfxDefeat(){ if(!ac)return; const t=ac.currentTime;
  [392,349,293,220].forEach((f,i)=>tone(f,.5,'sawtooth',.14,t+i*.14,f*.7)); }

/* ── DATA ── */
function itemsOf(g){
  return (g.items||[]).map((it,idx)=>({
    cue: it.cue||'', after: it.after||'', mark: it.mark||[],
    answer: it.answer, options: it.options && it.options.length===WIRE_N ? it.options : null,
    note: it.note||'', group: g.id, color: g.color, idx
  })).filter(it => it.options && it.options.includes(it.answer));
}
function pickNext(items){
  const mem = loadMem();
  for (let back = Math.min(NO_REPEAT, recentIdx.length); back >= 0; back--){
    const barred = new Set(recentIdx.slice(recentIdx.length - back));
    const bag = [];
    items.forEach((it,i) => { if (barred.has(i)) return; const w = weightOf(it,mem); for (let k=0;k<w;k++) bag.push(i); });
    if (bag.length){
      const idx = bag[(Math.random()*bag.length)|0];
      recentIdx.push(idx); if (recentIdx.length > NO_REPEAT) recentIdx.shift();
      return items[idx];
    }
  }
  const idx = (Math.random()*items.length)|0;
  recentIdx.push(idx); if (recentIdx.length > NO_REPEAT) recentIdx.shift();
  return items[idx];
}
function sentenceHTML(item, slotContent){
  let s = esc(item.cue) + (item.cue ? ' ' : '') +
          '<span class="slot">' + (slotContent ? esc(slotContent) : '????') + '</span> ' +
          esc(item.after);
  (item.mark||[]).forEach(w=>{
    const re = new RegExp('\\b'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i');
    s = s.replace(re, m => '<mark>'+m+'</mark>');
  });
  return s;
}

/* ── THREAT (escalates as the building's threat bar drops, mirroring
   Duel's phaseOf(bossHP) — difficulty now responds to how well the
   player is doing, not to a fixed bomb count) ── */
function threatOf(hp){
  const f = hp / THREAT_MAX;
  if (f > .66) return { name:'steady',   color:'#C9A961', dmgMult:1,   timeMult:1   };
  if (f > .33) return { name:'tense',    color:'#fb923c', dmgMult:1.3, timeMult:.82 };
  return              { name:'critical', color:'#E86A5C', dmgMult:1.6, timeMult:.65 };
}
function applyThreat(){
  const t = threatOf(threatHP);
  document.documentElement.style.setProperty('--phase-color', t.color);
  const rgb = t.color==='#C9A961'?'201,169,97':t.color==='#fb923c'?'251,146,60':'232,106,92';
  document.documentElement.style.setProperty('--phase-rgb', rgb);
  $('threatTag').textContent = t.name;
  return t;
}

/* ── WIRES ── */
function paintWires(item){
  wires = shuffle(item.options);
  document.documentElement.style.setProperty('--set-color', item.color);
  const el = $('wires');
  el.innerHTML = wires.map((p,i)=>
    `<button class="wire" data-i="${i}" style="--wc:var(${WIRE_VARS[i]})">
       <span class="stripe-row"><span class="stripe-half l"></span><span class="stripe-half r"></span></span>
       <span class="label">${esc(p)}</span><span class="k">${KEYS[i]}</span></button>`).join('');
  el.querySelectorAll('.wire').forEach(b=>{
    b.addEventListener('pointerdown', e=>{ e.preventDefault(); firstTouch(); cutWire(+b.dataset.i); });
  });
}
function lockWires(){ $('wires').querySelectorAll('.wire').forEach(b=>b.classList.add('locked')); }

function firstTouch(){
  if (started) return;
  started = true; audio();
  $('tapStart').classList.add('gone');
}

/* ── RUN / ROUND ── */
function startRun(){
  const g = GROUPS[groupIdx];
  const items = itemsOf(g);
  score = 0; streak = 0; bestStreak = 0; hits = 0; misses = 0; missLog = [];
  threatHP = THREAT_MAX; playerHP = PLAYER_MAX; overdriveReady = false; overdriveMark = 0; recentIdx = [];
  curItems = items;
  $('score').textContent = '0'; setStreak(0);
  $('threatName').textContent = g.label.toUpperCase();
  $('logFeed').innerHTML = '';
  updateBars();
  applyThreat();
  $('over').classList.remove('show');
  running = true;
  nextBomb();
  if (rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(loop);
}
let curItems = null;
function nextBomb(){
  curItem = pickNext(curItems);
  resolved = false;
  $('device').className = 'device';
  $('sentence').innerHTML = sentenceHTML(curItem);
  paintWires(curItem);
  $('statusText').textContent = 'ARMED';
  $('statusDot').classList.add('pulse');

  const ring = $('bombring');
  const threat = applyThreat();
  if (mode === 'practice'){
    ring.classList.add('practice'); ring.classList.remove('critical');
    ring.style.setProperty('--pct', 100);
    $('ringNum').textContent = '∞';
    qDur = 0;
  } else {
    ring.classList.remove('practice');
    const len = curItem.cue.length + curItem.after.length;
    qDur = clamp(TIMER_BASE_MS + len*TIMER_PER_CHAR, TIMER_MIN, TIMER_MAX) * threat.timeMult;
    qStart = performance.now();
    lastTickSecond = Math.ceil(qDur/1000);
  }
}

function loop(now){
  if (!running) return;
  if (mode === 'timed' && curItem && !resolved){
    const t = now - qStart;
    const pct = clamp(1 - t/qDur, 0, 1);
    const ring = $('bombring');
    ring.style.setProperty('--pct', pct*100);
    $('ringNum').textContent = Math.ceil(pct*qDur/1000);
    const critical = pct < .25;
    ring.classList.toggle('critical', critical);
    const secLeft = Math.ceil((qDur - t)/1000);
    if (secLeft !== lastTickSecond && secLeft >= 0){
      lastTickSecond = secLeft;
      sfxTick(critical ? 1 : (pct<.5?.4:0));
    }
    if (pct <= 0) resolveWire(null, true);
  }
  rafId = requestAnimationFrame(loop);
}

function cutWire(i){
  if (!running || !curItem || resolved) return;
  const el = $('wires').querySelectorAll('.wire')[i];
  if (el) el.classList.add('snip');
  sfxSnip();
  setTimeout(()=> resolveWire(wires[i], false), 90);
}

function resolveWire(chosen, timedOut){
  if (!running || !curItem || resolved) return;
  resolved = true;
  const item = curItem;
  lockWires();
  const ok = chosen === item.answer;
  const wireEls = $('wires').querySelectorAll('.wire');
  const correctEl = wireEls[wires.indexOf(item.answer)];

  noteResult(item, ok);
  try{ if (window.INTUITY) INTUITY.log('tenses', item.group+':'+item.idx, ok, {game:'defuse'}); }catch(e){}

  const threat = applyThreat();

  if (ok){
    hits++; streak++; bestStreak = Math.max(bestStreak,streak);
    let mult = streak>=15 ? 2.2 : streak>=10 ? 1.7 : streak>=5 ? 1.3 : 1;
    let isOverdrive = false;
    if (overdriveReady){ mult *= 1.9; isOverdrive = true; overdriveReady = false; }
    const timeBonus = mode==='timed' ? Math.round(clamp(1 - (performance.now()-qStart)/qDur,0,1) * 140) : 0;
    const gain = Math.round(90*mult) + timeBonus;
    score += gain;
    const dmg = Math.round(BASE_THREAT_DMG * mult);
    threatHP = clamp(threatHP - dmg, 0, THREAT_MAX);

    $('device').classList.add('correctflash');
    $('statusText').textContent = 'DEFUSED';
    $('statusDot').classList.remove('pulse');
    if (correctEl) correctEl.classList.add('correctcut');
    sfxDefuse();
    spawnDamage(dmg, 'pos', isOverdrive);
    pushLog((isOverdrive?'⚡ STEADY HANDS — ':'✂ ') + 'defused "' + item.answer + '" · threat −' + dmg, 'hit');
    if (streak>0 && streak % 15 === 0 && streak !== overdriveMark){
      overdriveMark = streak; overdriveReady = true;
      banner('Steady Hands Armed','var(--accent)'); sfxSteady();
      pushLog('⚡ Next defusal pays double', 'spec');
    }
    setStreak(streak); $('score').textContent = score; updateBars(); applyThreat();

    if (threatHP <= 0){ setTimeout(()=>finish('win'), 650); return; }
    setTimeout(()=>{ if (running) nextBomb(); }, 620);

  } else {
    misses++; streak = 0; missLog.push(item);
    const dmg = Math.round(BASE_PLAYER_DMG * threat.dmgMult);
    playerHP = clamp(playerHP - dmg, 0, PLAYER_MAX);
    $('device').classList.add('wrongflash');
    $('statusText').textContent = timedOut ? 'TIME UP' : 'WRONG WIRE';
    $('statusDot').classList.remove('pulse');
    if (correctEl) correctEl.classList.add('correctcut');
    if (chosen){
      const wi = wires.indexOf(chosen);
      const we = wi>=0 ? wireEls[wi] : null;
      if (we) we.classList.add('wrongcut');
    }
    sfxBoom();
    triggerBoom();
    spawnDamage(dmg, 'neg', false);
    pushLog((timedOut ? '⏱ time ran out — ' : '✕ wrong wire — ') + 'correct: "' + item.answer + '" · you take ' + dmg, 'miss');
    setStreak(0); updateBars(); applyThreat();

    if (playerHP <= 0){ setTimeout(()=>finish('loss'), 750); return; }
    setTimeout(()=>{ if (running) nextBomb(); }, 950);
  }
}

function updateBars(){
  $('threatFill').style.width = clamp(threatHP/THREAT_MAX*100,0,100) + '%';
  $('threatHpText').textContent = Math.max(0,threatHP) + ' / ' + THREAT_MAX;
  $('playerFill').style.width = clamp(playerHP/PLAYER_MAX*100,0,100) + '%';
  $('playerFill').classList.toggle('low', playerHP/PLAYER_MAX < .3);
  $('playerHpText').textContent = Math.max(0,playerHP) + ' / ' + PLAYER_MAX;
}
function triggerBoom(){
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const b = $('boom'); b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
  const a = $('arena'); a.classList.remove('shakeit'); void a.offsetWidth; a.classList.add('shakeit');
  setTimeout(()=>{ b.classList.remove('show'); a.classList.remove('shakeit'); }, 520);
}
function pushLog(text, cls){
  const feed = $('logFeed');
  const line = document.createElement('div');
  line.className = 'log-line ' + cls;
  line.textContent = text;
  feed.insertBefore(line, feed.firstChild);
  while (feed.children.length > 4) feed.removeChild(feed.lastChild);
}
/* spawnDamage now anchors to the threat bar (successes) or the player bar
   (misses) instead of the device card — same treatment as Duel's boss/
   player damage numbers, so a correct answer visibly "hits" the building
   and a wrong one visibly "hits" the player, not just a status label. */
function spawnDamage(amount, cls, overdrive){
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const anchor = cls === 'pos' ? $('threatFill') : $('playerFill');
  const r = anchor.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'dmg-num ' + cls + (overdrive ? ' overdrive' : '');
  el.textContent = (cls === 'pos' ? '−' : '−') + amount;
  el.style.left = (r.left + r.width * Math.random()*.8 + r.width*.1) + 'px';
  el.style.top = (r.top - 6) + 'px';
  document.body.appendChild(el);
  el.animate([{transform:'translateY(0)',opacity:1},{transform:'translateY(-34px)',opacity:0}],
    {duration:700,easing:'cubic-bezier(.1,.8,.2,1)'});
  setTimeout(()=>el.remove(),720);
}
function setStreak(n){
  const el = $('streak');
  el.textContent = '×' + (1+Math.floor(n/5)) + (n ? '  '+n : '');
  el.classList.toggle('live', n>=5);
  el.classList.add('pop'); setTimeout(()=>el.classList.remove('pop'),150);
}
function banner(txt,col){
  const b = $('banner'); b.textContent = txt; b.style.color = col;
  b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
  setTimeout(()=>b.classList.remove('show'),850);
}

/* ── SUMMARY ── */
function scale(acc){
  const A = [[0,140],[.60,160],[.72,173],[.80,180],[1,190]];
  for (let i=1;i<A.length;i++){
    const [a0,s0]=A[i-1],[a1,s1]=A[i];
    if (acc<=a1) return Math.round(s0+(acc-a0)/(a1-a0)*(s1-s0));
  }
  return 190;
}
const grade = s => s>=180?['A','Excellent']:s>=173?['B','Very good']:s>=160?['C','Pass']:['D','Try again'];

function finish(outcome){
  running = false; cancelAnimationFrame(rafId);
  try{ if (window.INTUITY) INTUITY.session('tenses','defuse',{hits,misses,best:bestStreak,score,outcome}); }catch(e){}

  if (outcome === 'win'){ banner('Floor Cleared','var(--ok)'); sfxVictory(); }
  else { banner('Mission Failed','var(--wrong)'); sfxDefeat(); }

  const total = hits+misses, acc = total ? hits/total : 0;
  const sc = scale(acc), [letter,word] = grade(sc);
  $('ovOutcome').className = 'outcome ' + (outcome==='win'?'win':'loss');
  $('ovOutcome').textContent = outcome==='win' ? 'Building secured' : 'Bomb detonated';
  $('ovScore').className = 'score g-'+letter.toLowerCase();
  $('ovScore').innerHTML = sc + '<span class="gr">'+letter+'</span>';
  $('ovSet').textContent = word + ' · ' + GROUPS[groupIdx].label + (mode==='practice' ? ' · practice' : '');
  $('ovNote').innerHTML = '<b>'+hits+'</b> defused, <b>'+misses+'</b> wrong · best streak <b>'+
    bestStreak+'</b> · your composure <b>'+Math.max(0,playerHP)+'</b> · score <b>'+score+'</b>';

  const seen = new Map();
  missLog.forEach(m=>{ const k = m.group+':'+m.idx; if(!seen.has(k)) seen.set(k, m); });
  $('ovMissed').innerHTML = seen.size
    ? '<div style="font-family:\'DM Mono\',monospace;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:.4rem">Worth another look</div>' +
      [...seen.values()].map(m =>
        '<div class="mline"><b>' + esc(m.answer) + '</b>' +
        (m.note ? '<span class="mnote">' + esc(m.note) + '</span>' : '') + '</div>').join('')
    : '';

  $('over').classList.add('show');
}

/* ── TABS ── */
function buildTabs(){
  const mem = loadMem(), wrap = $('setTabs');
  wrap.innerHTML = '';
  GROUPS.forEach((g,i)=>{
    const due = itemsOf(g).some(it => (mem[memKey(it)]?.miss||0) > 0);
    const btn = document.createElement('button');
    btn.className = 'vtab' + (i===groupIdx?' active':'') + (due?' has-due':'');
    btn.style.setProperty('--vc', g.color);
    btn.innerHTML = esc(g.label) + '<span class="due"></span>';
    btn.title = g.desc || '';
    btn.onclick = () => { if (i===groupIdx) return; switchGroup(i); };
    wrap.appendChild(btn);
  });
}
function switchGroup(i){
  groupIdx = i;
  buildTabs();
  const u = new URL(location.href); u.searchParams.set('set', GROUPS[i].id);
  history.replaceState(null,'',u);
  startRun();
}

/* ── MODE / MUTE ── */
function setMode(m){
  mode = m; localStorage.setItem('intuity-defuse-mode', m);
  document.querySelectorAll('.mbtn').forEach(b=>b.classList.toggle('on', b.dataset.m===m));
  if (GROUPS.length) startRun();
}
$('modes').querySelectorAll('.mbtn').forEach(b=>b.addEventListener('click', ()=>setMode(b.dataset.m)));
document.querySelectorAll('.mbtn').forEach(b=>b.classList.toggle('on', b.dataset.m===mode));

function setMute(on){
  musicOn = on; localStorage.setItem('intuity-defuse-sound', on?'on':'off');
  $('muteBtn').textContent = on ? '🔊' : '🔈';
}
$('muteBtn').addEventListener('click', ()=> setMute(!musicOn));
setMute(musicOn);

/* ── EVENTS ── */
document.addEventListener('keydown', e => {
  const i = KEYS.indexOf(e.key);
  if (i >= 0){ firstTouch(); cutWire(i); }
  if (e.key === 'Escape') $('over').classList.remove('show');
});
$('closeX').addEventListener('click', () => $('over').classList.remove('show'));
$('over').addEventListener('click', e => { if (e.target === $('over')) $('over').classList.remove('show'); });
$('againBtn').addEventListener('click', () => { $('over').classList.remove('show'); startRun(); });
$('nextBtn').addEventListener('click', () => { const n=(groupIdx+1)%GROUPS.length; switchGroup(n); });
$('hubBtn').addEventListener('click', () => { (window.top||window).location.href = '/?openModal=grammar'; });

/* ── BOOT ── */
async function boot(){
  let data;
  try {
    const res = await fetch(DATA_URL, { cache:'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    data = await res.json();
  } catch (e) {
    $('loading').innerHTML =
      `<p class="err">Couldn't load <b>${DATA_URL}</b> (${String(e.message||e).replace(/[<>]/g,'')}).<br>` +
      `If you opened this file directly (file://), your browser blocks local JSON fetches — serve it over http:// instead.</p>`;
    return;
  }
  GROUPS = data.map(g => ({ id:g.id, label:g.label, color:g.color, desc:g.desc, items:g.items }))
               .filter(g => itemsOf(g).length >= WIRE_N);
  if (!GROUPS.length){
    $('loading').innerHTML = '<p class="err">No set in the data file has items with a 4-option `options` array including the `answer`.</p>';
    return;
  }
  const want = (new URLSearchParams(location.search).get('set') || '').toLowerCase();
  groupIdx = Math.max(0, GROUPS.findIndex(g => g.id.toLowerCase() === want));
  buildTabs();
  $('loading').style.display = 'none';
  startRun();
}
boot();
</script>
</body>
</html>
