<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTUITY — Bomb Defusal</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

/* ── INTUITY SHELL TOKENS — same as Forge/Duel ── */
:root{
  /* ── INTUITY light scheme ──
     Same tokens as Explore, Practice and Quiz. The games were the last dark
     pages; off-white is the standard everywhere now. */
  --screen:#FAF7F2; --card:#FFFFFF;
  --paper:#4A433D;                    /* body text — warm dark, 9.1:1 */
  --sentence:#4A433D;                 /* the shared header expects this name */
  --accent-ink:#AC5A3E;               /* brick that carries text, 4.6:1 */
  --ink:#232C31;                      /* titles — cool dark */
  --dim:#5C5852; --faint:#7A6F73;
  --rule:#BCB1A0; --edge:#786E5F;
  --gold:#AC5A3E; --gold-glow:rgba(172,90,62,.28);
  --accent:#F26430; --accent-rgb:242,100,48;   /* vivid — this is the game's signal colour */
  --ok:#4A6B5C; --wrong:#A23B2C; --wrong-rgb:162,59,44;
  --line:var(--rule);
  --set-color:#F26430; --set-rgb:242,100,48;
  --phase-color:#F26430; --phase-rgb:242,100,48;
  /* The four answers are GREY. Orange belongs to the dial; four coloured
     wires plus an orange bezel left the page with no focal point. They are
     told apart by their number key, not by hue. */
  --w1:#4A433D; --w2:#4A433D; --w3:#4A433D; --w4:#4A433D;
  --header-h:150px; --wire-h:140px; --player-h:34px; --hud-h:40px;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--screen);overscroll-behavior:none}
body{font-family:'DM Sans',sans-serif;color:var(--paper);user-select:none;-webkit-user-select:none;touch-action:manipulation}
button,a{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-decoration:none}

/* ══ HEADER ══ */













.mode-btn:last-child{border-right:none}


@media(max-width:760px){.mode-btn{padding:.42rem .62rem;font-size:0.836rem;gap:.3rem}}





.vtab .due{display:inline-block;width:5px;height:5px;border-radius:50%;
  margin-left:.35rem;vertical-align:middle;background:var(--wrong);opacity:0}
.vtab.has-due .due{opacity:1}

/* ══ HUD ══ */
.hud{position:fixed;top:var(--header-h);left:0;right:0;height:var(--hud-h);z-index:25;
  display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:0 1rem;
  font-family:'DM Mono',monospace;font-size:0.848rem;color:var(--faint);
  border-bottom:1px solid rgba(43,33,41,.05);flex-wrap:wrap}
.hud .grp{display:flex;align-items:center;gap:.55rem}
.score-n{font-family:'Space Grotesk',sans-serif;font-weight:900;font-size:1.05rem;
  color:var(--paper);font-variant-numeric:tabular-nums}
.streak{font-family:'Space Grotesk',sans-serif;font-weight:900;font-size:1rem;color:var(--faint);
  transition:color .15s,transform .15s;font-variant-numeric:tabular-nums}
.streak.live{color:var(--accent)}
.streak.pop{transform:scale(1.3)}
.modes{display:flex;gap:.18rem}
.mbtn{font-family:'DM Mono',monospace;font-size:0.799rem;letter-spacing:.08em;text-transform:uppercase;
  padding:.14rem .5rem;border-radius:99px;border:1px solid transparent;color:rgba(43,33,41,.24)}
.mbtn:hover{color:rgba(43,33,41,.6)}
.mbtn.on{color:var(--accent);border-color:rgba(var(--accent-rgb),.45);background:rgba(var(--accent-rgb),.1)}
.threat-tag{font-family:'DM Mono',monospace;font-size:0.811rem;letter-spacing:.12em;text-transform:uppercase;
  padding:.2rem .6rem;border-radius:999px;border:1px solid var(--phase-color);color:var(--phase-color);
  transition:color .3s,border-color .3s;white-space:nowrap}
.mutebtn{font-size:0.958rem;opacity:.55}
.mutebtn:hover{opacity:1}
@media(max-width:600px){.modes{display:none}}

/* ══ ARENA ══ */
.arena{position:fixed;top:calc(var(--header-h) + var(--hud-h));left:0;right:0;bottom:calc(var(--wire-h) + var(--player-h));
  overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.35rem;
  padding-bottom:.4rem;
  /* the tint is gone: a coloured wash under a grey sentence is the same
     colour-coding by another route */
  background:none}
.arena.shakeit{animation:bigshake .4s}
@keyframes bigshake{0%,100%{transform:translate(0,0)}15%{transform:translate(-9px,3px) rotate(-.4deg)}30%{transform:translate(7px,-4px) rotate(.4deg)}45%{transform:translate(-6px,4px)}60%{transform:translate(5px,-3px)}75%{transform:translate(-3px,2px)}90%{transform:translate(2px,-1px)}}

/* threat panel — replaces the old flat "bombs cleared" progress line.
   Same visual language as Duel's boss-panel: a named bar that drains as
   the player succeeds, so the whole building's danger is legible at a
   glance instead of being a bare fraction. */
.threat-panel{width:100%;display:flex;flex-direction:column;align-items:center;gap:.35rem}
.threat-name{font-family:'DM Mono',monospace;font-size:0.823rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--phase-color);transition:color .3s}
.threat-bar-track{width:min(72%,340px);height:9px;border-radius:999px;background:rgba(43,33,41,.13);
  border:1px solid rgba(43,33,41,.12);overflow:hidden;box-shadow:inset 0 1px 3px rgba(43,33,41,.08)}
.threat-bar-fill{height:100%;border-radius:999px;
  background:linear-gradient(90deg,var(--phase-color),color-mix(in srgb,var(--phase-color) 55%,white));
  box-shadow:0 0 12px rgba(var(--phase-rgb),.55);transition:width .35s cubic-bezier(.2,.8,.2,1),background .3s}
.threat-meta{font-family:'DM Mono',monospace;font-size:0.823rem;color:var(--faint)}

.device{width:min(94%,420px);display:flex;flex-direction:column;align-items:center;gap:.55rem;
  /* No panel. The watch is the object; a card behind it made two objects and
     the eye had to choose. It sits directly on the page. */
  padding:.6rem .8rem 1rem;border-radius:0;position:relative;
  background:none;border:none;box-shadow:none;
  transition:border-color .2s,background .2s}
.device.correctflash{background:none}
.device.wrongflash{background:none}

.status-row{display:flex;align-items:center;gap:.4rem;font-family:'DM Mono',monospace;
  font-size:0.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--phase-color)}
.status-dot.pulse{animation:dotpulse 1s infinite}
@keyframes dotpulse{0%,100%{opacity:1}50%{opacity:.25}}

/* ══ THE DIAL ══
   A watch resting on paper, not a dark panel: three concentric layers —
   outer edge, orange bezel, black dial. The dial can be black because it is
   an OBJECT on the page rather than an interface; the page stays off-white.
   Neumorphic means light from one direction only (top-left here), so every
   layer shares the same highlight and shadow angle or the illusion breaks. */
.bombring{
  width:210px;height:210px;border-radius:50%;position:relative;
  /* layer 1 — the outer edge, catching light at the top */
  background:linear-gradient(145deg,#FFFFFF,#E4DDD1);
  box-shadow:
    -5px -5px 12px rgba(255,255,255,.9),      /* light source: top-left */
     7px  7px 18px rgba(43,33,41,.16),
     inset 0 0 0 1px rgba(43,33,41,.04);
  display:flex;align-items:center;justify-content:center;
  transition:box-shadow .2s}

/* layer 2 — the bezel, carrying the countdown as a sweep */
.bombring::before{
  content:'';position:absolute;inset:10px;border-radius:50%;
  background:conic-gradient(var(--phase-color) calc(var(--pct,100)*1%),
                            #201E1C 0);
  box-shadow:inset 0 1px 2px rgba(255,255,255,.5),
             0 2px 6px rgba(43,33,41,.14);
  transition:background .12s linear}

/* layer 3 — the dial itself */
.bombring::after{
  content:'';position:absolute;inset:19px;border-radius:50%;
  background:radial-gradient(circle at 38% 32%,#4A433D,#201E1C 72%);
  box-shadow:inset 0 2px 5px rgba(0,0,0,.55),
             inset 0 -1px 0 rgba(255,255,255,.06),
             0 1px 0 rgba(255,255,255,.7)}

.bombring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:2;
  font-family:'DM Mono',monospace;font-weight:700;font-size:3.2rem;
  color:#F4EFE6;letter-spacing:-.02em;font-variant-numeric:tabular-nums;
  text-shadow:0 1px 2px rgba(0,0,0,.6)}

.bombring.critical{animation:ringpulse .5s infinite}
.bombring.critical .num{color:var(--accent)}
@keyframes ringpulse{
  0%,100%{box-shadow:-5px -5px 12px rgba(255,255,255,.9),7px 7px 18px rgba(43,33,41,.16),0 0 0 0 rgba(var(--wrong-rgb),.35)}
  50%    {box-shadow:-5px -5px 12px rgba(255,255,255,.9),7px 7px 18px rgba(43,33,41,.16),0 0 0 9px rgba(var(--wrong-rgb),.14)}}
.bombring.practice .num{font-size:1.6rem;color:#A79B88}

/* ══ THE REVIEW ══
   A plain grey list: right answers unmarked but for a tick, wrong ones
   carrying the cross and what was chosen. Same classroom logic as the quiz. */
.reviewpill{display:inline-flex;align-items:center;justify-content:center;
  font-family:'Space Grotesk',sans-serif;font-size:.72rem;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--sentence);
  background:none;border:1px solid var(--edge);border-radius:999px;
  padding:.42rem 1rem;margin:.2rem 0 .6rem;cursor:pointer;transition:background .15s}
.reviewpill:hover{background:#F4EFE6}
.review{max-height:38vh;overflow-y:auto;text-align:left;width:100%;
  margin-bottom:.6rem;padding-right:.2rem}
.rv{display:flex;gap:.5rem;align-items:flex-start;padding:.42rem 0;
  border-bottom:1px solid var(--rule);font-size:.86rem;line-height:1.45;color:var(--sentence)}
.rv:last-child{border-bottom:none}
.rv-mark{flex:none;width:1.1em;font-weight:700;color:#4A6B5C}
.rv.bad .rv-mark{color:#A23B2C}
.rv-body{flex:1;min-width:0}
.rv-sent b{font-weight:700}
.rv.bad .rv-sent b{color:#A23B2C}
.rv-chose{display:block;font-size:.76rem;color:var(--faint);margin-top:.1rem}
.rv-empty{color:var(--faint);font-size:.86rem;padding:.5rem 0}

/* ══ THE QUESTION ══
   Grey and plain. This is a game, not a grammar lesson: the sentence is the
   thing to READ, and marking it up in three colours turned every reading into
   a decoding exercise. Weight does what colour was doing. */
.sentence{font-size:clamp(1rem,3vw,1.3rem);font-weight:500;line-height:1.55;
  text-align:center;color:var(--sentence);letter-spacing:-.005em}
.sentence mark{background:none;color:var(--sentence);font-weight:700;
  text-decoration:none}
.sentence .slot{display:inline-block;min-width:2.8em;margin:0 .2em;
  border-bottom:1px solid var(--edge);color:var(--faint);font-weight:500}

.tapstart{font-family:'DM Mono',monospace;font-size:0.836rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);background:rgba(250,247,242,.94);border:1px solid rgba(var(--accent-rgb),.35);
  border-radius:999px;padding:.4rem 1rem;pointer-events:none;transition:opacity .4s;white-space:nowrap}
.tapstart.gone{opacity:0;position:absolute}

.log-feed{display:none;position:fixed;top:calc(var(--header-h) + 48px);right:.8rem;width:190px;display:flex;flex-direction:column;gap:.28rem;z-index:6;pointer-events:none}
.log-line{font-family:'DM Mono',monospace;font-size:0.836rem;line-height:1.3;color:var(--dim);
  background:rgba(43,33,41,.16);border-left:2px solid var(--faint);padding:.22rem .5rem;border-radius:.2rem;
  opacity:0;transform:translateX(8px);animation:logIn .25s forwards}
.log-line.hit{border-color:var(--ok);color:var(--ok)}
.log-line.miss{border-color:var(--wrong);color:var(--wrong)}
.log-line.spec{border-color:var(--accent);color:var(--accent);font-weight:700}
@keyframes logIn{to{opacity:1;transform:none}}
@media(max-width:820px){.log-feed{display:none}}

.dmg-num{position:fixed;z-index:36;font-family:'Space Grotesk',sans-serif;font-weight:900;
  font-size:1.05rem;pointer-events:none;text-shadow:0 0 12px currentColor}
.dmg-num.pos{color:var(--ok)}
.dmg-num.neg{color:var(--wrong)}
.dmg-num.overdrive{color:var(--accent);font-size:1.4rem}

/* explosion overlay */
.boom{position:fixed;inset:0;z-index:41;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 46%,rgba(221,142,88,.55),rgba(172,90,62,.15) 42%,transparent 72%)}
.boom.show{animation:boomFlash .5s ease-out forwards}
@keyframes boomFlash{0%{opacity:0}12%{opacity:1}100%{opacity:0}}

/* ══ PLAYER BAR — imported from Duel: a visible composure meter that is
   the sole fail condition now, replacing the old fixed "3 lives" cap. ══ */
.player-wrap{position:fixed;bottom:var(--wire-h);left:0;right:0;height:var(--player-h);z-index:21;
  display:flex;align-items:center;gap:.6rem;padding:0 1rem;
  background:rgba(250,247,242,.96);border-top:1px solid rgba(43,33,41,.12)}
.player-label{font-family:'Space Grotesk',sans-serif;font-size:0.836rem;font-weight:700;letter-spacing:.1em;
  color:var(--dim);text-transform:uppercase;white-space:nowrap}
.player-bar-track{flex:1;height:9px;border-radius:999px;background:rgba(43,33,41,.12);
  overflow:hidden;border:1px solid rgba(43,33,41,.1)}
/* Three colours across the run, so the bar says WHERE you are, not only how
   much is left: sage while healthy, oat through the middle, terracotta as it
   empties. A single hue only gets shorter — three tell a story. */
/* The bar is deliberately COOL — teal to slate. The orange belongs to the
   watch and the answer keys; a bar in the same family competed with them. */
.player-bar-fill{height:100%;border-radius:999px;
  background:linear-gradient(90deg,#4A6B5C 0%,#708A81 55%,#BCB1A0 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45);
  transition:width .3s,background .3s;width:100%}
.player-bar-fill.low{background:linear-gradient(90deg,#AC5A3E,var(--wrong));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.player-hp-text{font-family:'DM Mono',monospace;font-size:0.823rem;color:var(--faint);min-width:2.8rem;text-align:right}

/* ══ WIRE PANEL ══ */
.wires-wrap{position:fixed;bottom:0;left:0;right:0;height:var(--wire-h);z-index:20;
  display:flex;flex-direction:column;gap:.2rem;padding:.35rem .5rem .4rem;
  background:rgba(255,255,255,.97);border-top:1px solid rgba(43,33,41,.05)}
.wires-label{font-family:'DM Mono',monospace;font-size:0.774rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--faint);text-align:center;opacity:.7}
.wires{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem}
/* footer is deliberately quiet now — the bomb ring in the arena is the
   one glowing element on screen; wires get a thin border and a near-flat
   fill, no ambient box-shadow, so attention stays centered. */
.wire{position:relative;border-radius:.5rem;padding:.5rem .35rem;display:flex;flex-direction:column;
  /* Medium grey with a darker edge. White cards on an off-white page were two
     near-whites doing nothing for each other; grey gives the black label
     something to sit on and lets the red key read as the accent it is. */
  align-items:center;justify-content:center;gap:.28rem;
  border:1px solid #4F473C;
  background:#C4BBA9;
  box-shadow:0 1px 2px rgba(43,33,41,.10);
  transition:transform .08s,background .12s,border-color .12s,opacity .2s}
.wire:active{transform:translateY(2px);background:#B4AA96;border-color:#3E362D}
.wire.tap{transform:translateY(2px);background:#B4AA96;border-color:#3E362D}
/* The wire sits in a dark channel. The vibrant orange is 1.66:1 on the grey
   card — invisible — but 5.25:1 on near-black, which is exactly why the bezel
   works. Same colour, same trick, and it reads as a wire in its housing. */
.wire .stripe-row{display:flex;align-items:center;width:74%;height:8px;position:relative;
  background:#201E1C;border-radius:999px;padding:0 2px;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
.stripe-half{flex:1;height:4px;border-radius:2px;background:#F26430;opacity:1;
  transition:transform .18s ease,opacity .18s}
/* 2.2vw resolved to 8.6px on a 390px phone — unreadable under a countdown,
   which is the one place text must be taken in at a glance. The floor is now
   13px and the answers get the room to sit on one or two lines. */
.wire .label{font-family:'Space Grotesk',sans-serif;font-weight:600;
  font-size:clamp(.82rem,3.6vw,1rem);
  color:#201E1C;text-align:center;line-height:1.2;padding:0 .15rem;
  word-break:normal;overflow-wrap:break-word;hyphens:none}
.wire .k{font-family:'DM Mono',monospace;font-size:.86rem;font-weight:700;color:#7A2618}
.wire.snip .stripe-half.l{transform:translate(-6px,-2px) rotate(-14deg)}
.wire.snip .stripe-half.r{transform:translate(6px,2px) rotate(14deg)}
.wire.correctcut{background:rgba(74,107,92,.18);border-color:var(--ok)}
.wire.wrongcut{background:rgba(232,106,92,.2);border-color:var(--wrong)}
.wire.locked{opacity:.3;pointer-events:none}

/* ══ FX ══ */
.banner{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%) scale(.8);z-index:35;
  font-family:'Space Grotesk',sans-serif;font-weight:900;font-size:clamp(1.2rem,5.6vw,2.3rem);
  letter-spacing:.1em;text-transform:uppercase;opacity:0;pointer-events:none;text-align:center;
  text-shadow:0 0 26px currentColor;transition:opacity .18s,transform .35s cubic-bezier(.2,1.6,.4,1)}
.banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* ══ SUMMARY ══ */
.over{position:fixed;inset:0;z-index:50;display:none;
  align-items:center;justify-content:center;padding:1.2rem;
  background:rgba(43,33,41,.12)}
.over.show{display:flex}
.over-card{position:relative;
  width:100%;max-width:23rem;max-height:min(78vh,32rem);overflow-y:auto;
  display:flex;flex-direction:column;align-items:center;gap:.35rem;text-align:center;
  padding:1.6rem 1.5rem 1.4rem;border-radius:1.1rem;
  background:linear-gradient(165deg,#FFFFFF,#F6F1E8);
  border:1px solid rgba(201,169,97,.25);
  box-shadow:0 20px 55px rgba(43,33,41,.16),0 0 40px rgba(201,169,97,.06);
  animation:cardIn .28s cubic-bezier(.2,1,.4,1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.over .closex{position:absolute;top:.55rem;right:.7rem;width:26px;height:26px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:1rem;line-height:1;
  color:var(--faint);border:1px solid rgba(43,33,41,.12);transition:all .15s}
.over .closex:hover{color:var(--paper);border-color:rgba(43,33,41,.4);background:rgba(43,33,41,.12)}
.over .outcome{font-family:'Space Grotesk',sans-serif;font-weight:900;font-size:0.909rem;
  letter-spacing:.16em;text-transform:uppercase;padding:.25rem .8rem;border-radius:999px;border:1px solid currentColor}
.over .outcome.win{color:var(--ok)}
.over .outcome.loss{color:var(--wrong)}
.over .score{font-family:'Space Grotesk',sans-serif;font-weight:900;margin-top:.3rem;
  font-size:clamp(2rem,7vw,2.8rem);font-variant-numeric:tabular-nums}
.over .score .gr{font-size:.5em;margin-left:.3rem;vertical-align:.35em}
.g-a{color:#F26430} .g-b{color:var(--ok)} .g-c{color:#708A81} .g-d{color:var(--wrong)}
.over .setname{font-family:'DM Mono',monospace;font-size:0.897rem;letter-spacing:.16em;
  text-transform:uppercase;color:var(--dim)}
.over .note{margin-top:.6rem;font-size:0.958rem;color:var(--dim)}
.over .note b{color:var(--paper)}
.over .missed{margin-top:.7rem;font-size:0.946rem;line-height:1.85;color:var(--dim);text-align:left}
.over .missed .mline{margin-bottom:.35rem}
.over .missed b{color:var(--gold);font-weight:700}
.over .missed .mnote{display:block;color:var(--faint);font-size:0.909rem;margin-top:.05rem}
.acts{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;margin-top:1.1rem}
.over .go{padding:.7rem 1.7rem;border-radius:99px;background:var(--accent);color:#201E1C;
  font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:0.921rem;
  letter-spacing:.1em;text-transform:uppercase}
.over .quiet{padding:.7rem 1.5rem;border-radius:99px;color:var(--dim);
  border:1px solid rgba(43,33,41,.16);font-size:0.909rem;
  letter-spacing:.08em;text-transform:uppercase;font-family:'Space Grotesk',sans-serif;font-weight:700}
.over .quiet:hover{color:var(--paper)}
.over .away{margin-top:.9rem;font-size:0.872rem;border:none;padding:.3rem}

.loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:var(--screen);z-index:99;font-family:'DM Mono',monospace;font-size:0.897rem;color:var(--faint)}
.err{color:var(--wrong);font-size:0.958rem;line-height:1.6;max-width:26rem;text-align:center;padding:2rem}

@media(max-width:600px){
  :root{--header-h:168px;--wire-h:150px;--player-h:30px}
  .device{padding:.5rem .6rem .8rem}
  .bombring{width:172px;height:172px}
  .bombring::before{inset:8px}
  .bombring::after{inset:22px}
  .bombring .num{font-size:2.6rem}
  .bombring .num{font-size:1.6rem}
}
@media(prefers-reduced-motion:reduce){ .device,.wire,.streak,.banner,.threat-bar-fill,.player-bar-fill,.bombring{transition:none!important} .arena.shakeit,.bombring.critical{animation:none} }

/* ══ SHARED HEADER — identical to tenses-rules.html ══
   Lifted verbatim so the five pages cannot drift apart: same colours, same
   faces, same sizes, same spacing. Edit it there and copy, never here. */
.header{
  position:fixed;top:0;left:0;right:0;z-index:30;
  display:flex;flex-direction:column;gap:.3rem;padding:.4rem 1.25rem .5rem;
  background:var(--screen);
  /* Rule 2 of 3: the bottom of the fixed chrome, held to the 720px column so
     it lines up with the sentences rather than cutting the window across. */
  border-bottom:none;
}
.header::after{content:'';position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  width:min(720px,calc(100% - 2rem));height:1px;background:var(--rule)}
/* The header now carries a tab row in every mode — tense tabs for Explore,
   the framed page's tests for Practice and Quiz — so its bottom rule always
   has a row above it and never doubles with the mode-row rule. */
.header-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.back-link{justify-self:start;font-family:'Space Grotesk',sans-serif;font-size:.6rem;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--faint);transition:color .2s;white-space:nowrap}
.back-link:hover{color:var(--accent-ink)}
.header-title{display:flex;flex-direction:column;align-items:center;line-height:1.1}
/* A hair more presence: the wordmark sat at the same size as the mode words
   beneath it, so on a phone it read as one label among several rather than
   as the name of the app. */
.app-title{font-family:'Space Grotesk',sans-serif;font-size:1.09rem;font-weight:900;letter-spacing:.2em;color:var(--ink)}
.app-subtitle{font-size:.58rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim);margin-top:.1rem}
.header-spacer{justify-self:end;font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--faint);border:1px solid var(--rule);border-radius:999px;padding:.3rem .65rem}
.header-spacer b{color:var(--sentence)}

/* Modes are words, not a segmented pill. The active one is marked by weight
   and a rule beneath it — never by colour alone, so it still reads for a
   colour-blind student. */
/* Rule 1 of 3: under the mode row, at the row's own width — it separates the
   five modes from the tense tabs beneath them. */
.mode-selector{display:flex;flex-wrap:wrap;justify-content:center;align-self:center;gap:.2rem;
  padding-bottom:.35rem;border-bottom:1px solid var(--rule)}
.mode-btn{display:flex;align-items:center;gap:.4rem;font-family:'Space Grotesk',sans-serif;
  font-size:.68rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  padding:.3rem .8rem;color:var(--faint);
  border-bottom:2px solid transparent;
  transition:color .2s,border-color .2s}
.mode-btn:hover{color:var(--sentence)}
.mode-btn.active{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
@media(max-width:760px){.mode-btn{padding:.42rem .62rem;font-size:.6rem;gap:.3rem}}

/* Held to the reading column so long test titles WRAP onto a second row
   instead of stretching edge to edge. Explore's tense tabs sit in the same
   width, which is what makes the two headers read alike. */
/* row-gap matches the header's own .3rem gap between Explore's two tab
   ELEMENTS, so a single row that wraps onto two lines is spaced identically
   to two separate rows. Without this the framed pages looked crammed while
   Explore looked relaxed — same tabs, different spacing mechanism. */
.set-tabs{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
  column-gap:.4rem;row-gap:.3rem;padding:0 .5rem;max-width:720px;margin:0 auto}

/* frameTabs is ONE element wrapping to two lines, where Explore uses two
   separate elements. Matching the numbers is not enough: rows inside a single
   wrapping box read tighter than two boxes with a gap between them, because
   there is no element boundary for the eye to rest on. So this row gets more
   than parity — and a narrower column, so the break lands mid-list rather
   than leaving one stray tab on the second line. */
#frameTabs{row-gap:.55rem;max-width:660px}
.set-tabs.hidden{display:none}
.vtab{font-family:'Space Grotesk',sans-serif;font-size:.58rem;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;padding:.24rem .6rem;border:none;border-bottom:2px solid transparent;
  color:var(--faint);white-space:nowrap;transition:color .2s,border-color .2s}
.vtab:hover{color:var(--sentence)}
.vtab.active{color:var(--ink);font-weight:700;border-bottom-color:var(--vc,var(--accent))}
</style>

    <!-- The review is behind a pill: a wall of sentences the moment a round
         ends buries the score. Tap to open it. -->

    <div class="review" id="ovReview" hidden></div>
    <div class="acts">
      <button class="quiet" id="prevBtn">← Previous</button>

    </div>
    <button class="quiet away" id="hubBtn">Back to grammar</button>
  </div>

<div class="loading" id="loading">Loading…</div>

<script>
/* ══════════════════════════════════════════════════════════════════════
   BOMB DEFUSAL — one sentence, one ticking clock, four wires.

   Reads the SAME tense-rush-data.json Duel/Rush/Mill/Forge use (cue /
   after / mark / answer / options / note). No embedded copy: a correction
   to the data lands here automatically.

   MERGED WITH DUEL'S CONTEST MODEL (this was a deliberate follow-up: the
   countdown ring was Defusal's strongest tension cue, but the old win/lose
   frame — clear 10 bombs, don't burn through 3 fixed lives — gave a
   correct answer almost no visible payoff and could end an otherwise-good
   run on one unlucky early miss). Now it plays like Duel: a THREAT bar
   (the building) drains with every successful defusal, a composure bar
   (the player) drains with every wrong wire, and the run ends when either
   bar empties. Combo, the streak multiplier, and the "Steady Hands"
   overdrive spike are unchanged from before — only the win/lose frame and
   the on-screen payoff for a correct answer changed. Threat escalation
   (steady → tense → critical) is now driven by how much of the building's
   threat is left, so difficulty responds to how well the player is doing,
   not to a fixed bomb count. A Practice toggle still removes the clock
   entirely for learners who need the untimed rep before facing the timer.
   ══════════════════════════════════════════════════════════════════════ */

window.addEventListener('error', e => {
  const l = document.getElementById('loading');
  if (l && l.style.display !== 'none') l.innerHTML =
    '<p class="err"><b>Defusal hit an error.</b><br>' + String(e.message||e).replace(/[<>]/g,'') +
    '<br><span style="opacity:.6">' + ((e.filename||'').split('/').pop()+':'+(e.lineno||'?')) + '</span></p>';
});

/* Defusal is a game mode, not a teaching mode — it should draw from the
   blind "Mix" sets (see build_mix_sets.py) so the set-tabs don't leak the
   correct tense before the learner reads the sentence. Explore/Practice/
   Quiz keep pointing at the original tense-labeled file, where knowing
   the category up front is appropriate scaffolding. Override with
   ?data=... if you need to point at a specific file for testing. */
const DATA_URL = new URLSearchParams(location.search).get('data') || '../../data/grammar-rules/tense-mix-data.json';

const WIRE_N = 4;
const WIRE_VARS = ['--w1','--w2','--w3','--w4'];
const KEYS = ['1','2','3','4'];

const THREAT_MAX = 1000, PLAYER_MAX = 1000;
const BASE_THREAT_DMG = 78, BASE_PLAYER_DMG = 95;
const TIMER_BASE_MS = 6400, TIMER_PER_CHAR = 46, TIMER_MIN = 3000, TIMER_MAX = 11000;

const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const shuffle = a => { const b=[...a]; for(let i=b.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[b[i],b[j]]=[b[j],b[i]];} return b; };
const clamp = (n,lo,hi) => Math.max(lo,Math.min(hi,n));

let GROUPS = [], groupIdx = 0;
let running = false, started = false, rafId = null;
let wires = [], curItem = null, resolved = false;
const NO_REPEAT = 4;
let recentIdx = [];
/* Retrieval-practice tracking, reset every run. seenThisRun records the
   array-position (within curItems) of every item served so far, in order.
   missedThisRun records positions the learner got wrong, and a position
   is retired from it the moment they answer that item correctly — once
   it's no longer shaky, forcing it back every 4th question stops helping
   and starts feeling repetitive. */
const REPEAT_EVERY = 4;
let seenThisRun = [], missedThisRun = [], qCount = 0;
let score = 0, streak = 0, bestStreak = 0, hits = 0, misses = 0, missLog = [];
let threatHP = THREAT_MAX, playerHP = PLAYER_MAX, overdriveReady = false, overdriveMark = 0;
let qStart = 0, qDur = 0, lastTickSecond = -1;
/* Anyone who played the old version has 'timed' saved here. parseInt('timed')
   is NaN, so roundEnd became NaN, the clock never reached zero and the game
   looked frozen. Only accept values this build understands. */
const MODES = ['90','120','practice'];
let mode = localStorage.getItem('intuity-defuse-mode');
if (MODES.indexOf(mode) === -1) { mode = '90'; localStorage.setItem('intuity-defuse-mode', mode); }
/* ── ONE clock ──
   The game used a per-question timer (3–11s by sentence length) and had no
   round limit — a round ended when threat or composure ran out, so its length
   was unpredictable. A chosen round length makes a game a fixed unit, which is
   what makes "next" and "previous" mean anything. The dial now shows the round.
   'practice' keeps no clock at all. */
let roundEnd = 0, roundMs = 0;
const answerLog = [];        /* every sentence attempted, for the review */

/* ── MEMORY ── */
const MEM_KEY = 'intuity-defuse-mem';
function loadMem(){ try{ return JSON.parse(localStorage.getItem(MEM_KEY)||'{}'); }catch(e){ return {}; } }
function saveMem(m){ try{ localStorage.setItem(MEM_KEY,JSON.stringify(m)); }catch(e){} }
const memKey = it => it.group + ':' + it.idx;
function noteResult(it, ok){
  const m = loadMem(), k = memKey(it), e = m[k] || {miss:0,seen:0};
  e.seen++; if (ok) e.miss = Math.max(0,e.miss-1); else e.miss++;
  m[k] = e; saveMem(m);
}
function weightOf(it, mem){
  const e = mem[memKey(it)];
  return e ? 1 + Math.min(6, e.miss*3) : 2;
}

/* ── AUDIO ── */
let ac = null, master = null, musicOn = localStorage.getItem('intuity-defuse-sound') !== 'off';
function audio(){
  if (!ac){
    ac = new (window.AudioContext||window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = .5; master.connect(ac.destination);
  }
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
function tone(f,d,ty,v,when,glide){
  if (!musicOn || !ac) return;
  const c = ac, t0 = when || c.currentTime;
  const o = c.createOscillator(), g = c.createGain();
  o.type = ty||'sine'; o.frequency.setValueAtTime(f,t0);
  if (glide) o.frequency.exponentialRampToValueAtTime(glide,t0+d);
  g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(v||.14,t0+.008);
  g.gain.exponentialRampToValueAtTime(.0008,t0+d);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0+d+.02);
}
function noise(d,v,when,hp){
  if (!musicOn || !ac) return;
  const c = ac, t0 = when||c.currentTime, n = Math.floor(c.sampleRate*d);
  const buf = c.createBuffer(1,n,c.sampleRate), dd = buf.getChannelData(0);
  for (let i=0;i<n;i++) dd[i]=(Math.random()*2-1)*(1-i/n);
  const s = c.createBufferSource(); s.buffer = buf;
  const g = c.createGain(); g.gain.value = v||.06;
  const fl = c.createBiquadFilter(); fl.type = hp?'highpass':'lowpass'; fl.frequency.value = hp?6000:900;
  s.connect(fl); fl.connect(g); g.connect(master); s.start(t0);
}
function sfxTick(urgency){ if(!ac)return; const t=ac.currentTime;
  tone(880 + urgency*260, .045, 'square', .05 + urgency*.05, t); }
function sfxSnip(){ if(!ac)return; const t=ac.currentTime; noise(.06,.08,t,true); tone(1400,.04,'square',.05,t+.02); }
function sfxDefuse(){ if(!ac)return; const t=ac.currentTime;
  [523,659,784].forEach((f,i)=>tone(f,.22,'triangle',.15,t+i*.06)); }
function sfxBoom(){ if(!ac)return; const t=ac.currentTime;
  tone(90,.5,'sawtooth',.22,t,35); noise(.4,.16,t,false); }
function sfxSteady(){ if(!ac)return; const t=ac.currentTime;
  [392,494,587,659].forEach((f,i)=>tone(f,.35,'triangle',.13,t+i*.05)); noise(.25,.08,t,true); }
/* sfxVictory / sfxDefeat were referenced by finish() but never defined in
   the original file — that threw a ReferenceError on every win or loss,
   which aborted finish() before it reached $('over').classList.add('show'),
   so the summary modal never appeared. Fixed by defining them (ported
   from Duel/Forge, which already had this right). */
function sfxVictory(){ if(!ac)return; const t=ac.currentTime;
  [523,659,784,1047].forEach((f,i)=>tone(f,.4,'triangle',.16,t+i*.11)); }
function sfxDefeat(){ if(!ac)return; const t=ac.currentTime;
  [392,349,293,220].forEach((f,i)=>tone(f,.5,'sawtooth',.14,t+i*.14,f*.7)); }

/* ── DATA ── */
function itemsOf(g){
  return (g.items||[]).map((it,idx)=>({
    cue: it.cue||'', after: it.after||'', mark: it.mark||[],
    answer: it.answer, options: it.options && it.options.length===WIRE_N ? it.options : null,
    note: it.note||'', group: g.id, color: g.color, idx
  })).filter(it => it.options && it.options.includes(it.answer));
}
function pickNext(items){
  const mem = loadMem();
  for (let back = Math.min(NO_REPEAT, recentIdx.length); back >= 0; back--){
    const barred = new Set(recentIdx.slice(recentIdx.length - back));
    const bag = [];
    items.forEach((it,i) => { if (barred.has(i)) return; const w = weightOf(it,mem); for (let k=0;k<w;k++) bag.push(i); });
    if (bag.length){
      const idx = bag[(Math.random()*bag.length)|0];
      recentIdx.push(idx); if (recentIdx.length > NO_REPEAT) recentIdx.shift();
      return items[idx];
    }
  }
  const idx = (Math.random()*items.length)|0;
  recentIdx.push(idx); if (recentIdx.length > NO_REPEAT) recentIdx.shift();
  return items[idx];
}
/* Every REPEAT_EVERY-th question, resurface something already met this run
   instead of drawing fresh. Prefers a still-shaky item (one the learner
   got wrong and hasn't since corrected); falls back to any earlier item
   if nothing is currently missed. The item is served exactly as it was
   the first time — same cue, same 4 options, no "you've seen this" tag —
   so answering it is genuine unaided recall, not UI memory. */
function pickRepeat(items){
  const last = seenThisRun[seenThisRun.length - 1];
  const pool = missedThisRun.length ? missedThisRun : seenThisRun;
  const candidates = pool.filter(i => i !== last);
  const chosen = candidates.length
    ? candidates[(Math.random()*candidates.length)|0]
    : pool[(Math.random()*pool.length)|0];
  return items[chosen];
}
function sentenceHTML(item, slotContent){
  let s = esc(item.cue) + (item.cue ? ' ' : '') +
          '<span class="slot">' + (slotContent ? esc(slotContent) : '????') + '</span> ' +
          esc(item.after);
  (item.mark||[]).forEach(w=>{
    const re = new RegExp('\\b'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i');
    s = s.replace(re, m => '<mark>'+m+'</mark>');
  });
  return s;
}

/* ── THREAT (escalates as the building's threat bar drops, mirroring
   Duel's phaseOf(bossHP) — difficulty now responds to how well the
   player is doing, not to a fixed bomb count) ── */
function threatOf(hp){
  const f = hp / THREAT_MAX;
  if (f > .66) return { name:'steady',   color:'#AC5A3E', dmgMult:1,   timeMult:1   };
  if (f > .33) return { name:'tense',    color:'#F26430', dmgMult:1.3, timeMult:.82 };
  return              { name:'critical', color:'#A23B2C', dmgMult:1.6, timeMult:.65 };
}
function applyThreat(){
  const t = threatOf(threatHP);
  document.documentElement.style.setProperty('--phase-color', t.color);
  const rgb = t.color==='#AC5A3E'?'172,90,62':t.color==='#F26430'?'221,116,80':'162,59,44';
  document.documentElement.style.setProperty('--phase-rgb', rgb);
  $('threatTag').textContent = t.name;
  return t;
}

/* ── WIRES ── */
function paintWires(item){
  wires = shuffle(item.options);
  document.documentElement.style.setProperty('--set-color', item.color);
  const el = $('wires');
  el.innerHTML = wires.map((p,i)=>
    `<button class="wire" data-i="${i}" style="--wc:var(${WIRE_VARS[i]})">
       <span class="stripe-row"><span class="stripe-half l"></span><span class="stripe-half r"></span></span>
       <span class="label">${esc(p)}</span><span class="k">${KEYS[i]}</span></button>`).join('');
  el.querySelectorAll('.wire').forEach(b=>{
    b.addEventListener('pointerdown', e=>{ e.preventDefault(); firstTouch(); cutWire(+b.dataset.i); });
  });
}
function lockWires(){ $('wires').querySelectorAll('.wire').forEach(b=>b.classList.add('locked')); }

function firstTouch(){
  if (started) return;
  started = true; audio();
  $('tapStart').classList.add('gone');
}

/* ── RUN / ROUND ── */
function startRun(){
  const g = GROUPS[groupIdx];
  const items = itemsOf(g);
  score = 0; streak = 0; bestStreak = 0; hits = 0; misses = 0; missLog = [];
  roundEnd = 0; roundMs = 0; answerLog.length = 0;
  threatHP = THREAT_MAX; playerHP = PLAYER_MAX; overdriveReady = false; overdriveMark = 0; recentIdx = [];
  seenThisRun = []; missedThisRun = []; qCount = 0;
  curItems = items;
  $('score').textContent = '0'; setStreak(0);
  $('threatName').textContent = g.label.toUpperCase();
  $('logFeed').innerHTML = '';
  updateBars();
  applyThreat();
  $('over').classList.remove('show');
  running = true;
  nextBomb();
  if (rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(loop);
}
let curItems = null;
function nextBomb(){
  qCount++;
  if (qCount % REPEAT_EVERY === 0 && seenThisRun.length >= 2){
    curItem = pickRepeat(curItems);
  } else {
    curItem = pickNext(curItems);
    seenThisRun.push(curItems.indexOf(curItem));
  }
  resolved = false;
  $('device').className = 'device';
  $('sentence').innerHTML = sentenceHTML(curItem);
  paintWires(curItem);
  $('statusText').textContent = 'ARMED';
  $('statusDot').classList.add('pulse');

  const ring = $('bombring');
  const threat = applyThreat();
  if (mode === 'practice'){
    ring.classList.add('practice'); ring.classList.remove('critical');
    ring.style.setProperty('--pct', 100);
    $('ringNum').textContent = '∞';
    qDur = 0;
  } else {
    ring.classList.remove('practice');
    const len = curItem.cue.length + curItem.after.length;
    qStart = performance.now();
    qDur = clamp(TIMER_BASE_MS + len*TIMER_PER_CHAR, TIMER_MIN, TIMER_MAX) * threat.timeMult;
    if (!roundEnd){                       /* first question starts the round */
      const secs = parseInt(mode,10);
      roundMs  = (mode === 'practice' || !isFinite(secs)) ? 0 : secs * 1000;
      roundEnd = performance.now() + (roundMs || 90000);
      lastTickSecond = Math.ceil(roundMs/1000);
    }
  }
}

function loop(now){
  if (!running) return;
  if (mode !== 'practice'){
    const left = Math.max(0, roundEnd - now);
    const pct  = roundMs ? clamp(left/roundMs, 0, 1) : 0;
    const ring = $('bombring');
    ring.style.setProperty('--pct', pct*100);
    $('ringNum').textContent = Math.ceil(left/1000);
    const critical = left <= 10000;
    ring.classList.toggle('critical', critical);
    const secLeft = Math.ceil(left/1000);
    if (secLeft !== lastTickSecond && secLeft >= 0){
      lastTickSecond = secLeft;
      if (critical) sfxTick(1);
    }
    if (left <= 0){ finish(hits > misses ? 'win' : 'loss'); return; }
  }
  rafId = requestAnimationFrame(loop);
}

function cutWire(i){
  if (!running || !curItem || resolved) return;
  const el = $('wires').querySelectorAll('.wire')[i];
  if (el) el.classList.add('snip');
  sfxSnip();
  setTimeout(()=> resolveWire(wires[i], false), 90);
}

function resolveWire(chosen, timedOut){
  if (!running || !curItem || resolved) return;
  resolved = true;
  const item = curItem;
  const pos = curItems.indexOf(item);
  lockWires();
  const ok = chosen === item.answer;
  const wireEls = $('wires').querySelectorAll('.wire');
  const correctEl = wireEls[wires.indexOf(item.answer)];

  noteResult(item, ok);
  try{ if (window.INTUITY) INTUITY.log('tenses', item.group+':'+item.idx, ok, {game:'defuse'}); }catch(e){}

  const threat = applyThreat();

  if (ok){
    hits++; streak++; bestStreak = Math.max(bestStreak,streak);
    const mi = missedThisRun.indexOf(pos);
    if (mi >= 0) missedThisRun.splice(mi,1);
    let mult = streak>=15 ? 2.2 : streak>=10 ? 1.7 : streak>=5 ? 1.3 : 1;
    let isOverdrive = false;
    if (overdriveReady){ mult *= 1.9; isOverdrive = true; overdriveReady = false; }
    const timeBonus = mode==='timed' ? Math.round(clamp(1 - (performance.now()-qStart)/qDur,0,1) * 140) : 0;
    const gain = Math.round(90*mult) + timeBonus;
    score += gain;
    const dmg = Math.round(BASE_THREAT_DMG * mult);
    threatHP = clamp(threatHP - dmg, 0, THREAT_MAX);

    $('device').classList.add('correctflash');
    $('statusText').textContent = 'DEFUSED';
    $('statusDot').classList.remove('pulse');
    if (correctEl) correctEl.classList.add('correctcut');
    sfxDefuse();
    spawnDamage(dmg, 'pos', isOverdrive);
    pushLog((isOverdrive?'⚡ STEADY HANDS — ':'✂ ') + 'defused "' + item.answer + '" · threat −' + dmg, 'hit');
    if (streak>0 && streak % 15 === 0 && streak !== overdriveMark){
      overdriveMark = streak; overdriveReady = true;
      banner('Steady Hands Armed','#F26430'); sfxSteady();
      pushLog('⚡ Next defusal pays double', 'spec');
    }
    setStreak(streak); $('score').textContent = score; updateBars(); applyThreat();

    answerLog.push({ ok:true, cue:item.cue, answer:item.answer, after:item.after, note:item.note });
    if (threatHP <= 0){ setTimeout(()=>finish('win'), 650); return; }
    setTimeout(()=>{ if (running) nextBomb(); }, 620);

  } else {
    misses++; streak = 0; missLog.push(item);
    answerLog.push({ ok:false, cue:item.cue, answer:item.answer, after:item.after,
                     note:item.note, chose: chosen ? chosen.label : (timedOut?'—':'') });
    if (pos >= 0 && !missedThisRun.includes(pos)) missedThisRun.push(pos);
    const dmg = Math.round(BASE_PLAYER_DMG * threat.dmgMult);
    playerHP = clamp(playerHP - dmg, 0, PLAYER_MAX);
    $('device').classList.add('wrongflash');
    $('statusText').textContent = timedOut ? 'TIME UP' : 'WRONG WIRE';
    $('statusDot').classList.remove('pulse');
    if (correctEl) correctEl.classList.add('correctcut');
    if (chosen){
      const wi = wires.indexOf(chosen);
      const we = wi>=0 ? wireEls[wi] : null;
      if (we) we.classList.add('wrongcut');
    }
    sfxBoom();
    triggerBoom();
    spawnDamage(dmg, 'neg', false);
    pushLog((timedOut ? '⏱ time ran out — ' : '✕ wrong wire — ') + 'correct: "' + item.answer + '" · you take ' + dmg, 'miss');
    setStreak(0); updateBars(); applyThreat();

    if (playerHP <= 0){ setTimeout(()=>finish('loss'), 750); return; }
    setTimeout(()=>{ if (running) nextBomb(); }, 950);
  }
}

function updateBars(){
  $('threatFill').style.width = clamp(threatHP/THREAT_MAX*100,0,100) + '%';
  $('threatHpText').textContent = Math.max(0,threatHP) + ' / ' + THREAT_MAX;
  $('playerFill').style.width = clamp(playerHP/PLAYER_MAX*100,0,100) + '%';
  $('playerFill').classList.toggle('low', playerHP/PLAYER_MAX < .3);
  $('playerHpText').textContent = Math.max(0,playerHP) + ' / ' + PLAYER_MAX;
}
function triggerBoom(){
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const b = $('boom'); b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
  const a = $('arena'); a.classList.remove('shakeit'); void a.offsetWidth; a.classList.add('shakeit');
  setTimeout(()=>{ b.classList.remove('show'); a.classList.remove('shakeit'); }, 520);
}
function pushLog(text, cls){
  /* The live feed was removed — every attempt is kept in answerLog and shown
     in the end-of-round review instead. Guarded so callers need no change. */
  const feed = $('logFeed');
  if (!feed) return;
  const line = document.createElement('div');
  line.className = 'log-line ' + cls;
  line.textContent = text;
  feed.insertBefore(line, feed.firstChild);
  while (feed.children.length > 4) feed.removeChild(feed.lastChild);
}
/* spawnDamage now anchors to the threat bar (successes) or the player bar
   (misses) instead of the device card — same treatment as Duel's boss/
   player damage numbers, so a correct answer visibly "hits" the building
   and a wrong one visibly "hits" the player, not just a status label. */
function spawnDamage(amount, cls, overdrive){
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const anchor = cls === 'pos' ? $('threatFill') : $('playerFill');
  const r = anchor.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'dmg-num ' + cls + (overdrive ? ' overdrive' : '');
  el.textContent = (cls === 'pos' ? '−' : '−') + amount;
  el.style.left = (r.left + r.width * Math.random()*.8 + r.width*.1) + 'px';
  el.style.top = (r.top - 6) + 'px';
  document.body.appendChild(el);
  el.animate([{transform:'translateY(0)',opacity:1},{transform:'translateY(-34px)',opacity:0}],
    {duration:700,easing:'cubic-bezier(.1,.8,.2,1)'});
  setTimeout(()=>el.remove(),720);
}
function setStreak(n){
  const el = $('streak');
  el.textContent = '×' + (1+Math.floor(n/5)) + (n ? '  '+n : '');
  el.classList.toggle('live', n>=5);
  el.classList.add('pop'); setTimeout(()=>el.classList.remove('pop'),150);
}
function banner(txt,col){
  const b = $('banner'); b.textContent = txt; b.style.color = col;
  b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
  setTimeout(()=>b.classList.remove('show'),850);
}

/* ── SUMMARY ── */
function scale(acc){
  const A = [[0,140],[.60,160],[.72,173],[.80,180],[1,190]];
  for (let i=1;i<A.length;i++){
    const [a0,s0]=A[i-1],[a1,s1]=A[i];
    if (acc<=a1) return Math.round(s0+(acc-a0)/(a1-a0)*(s1-s0));
  }
  return 190;
}
const grade = s => s>=180?['A','Excellent']:s>=173?['B','Very good']:s>=160?['C','Pass']:['D','Try again'];

function finish(outcome){
  running = false; cancelAnimationFrame(rafId);
  try{ if (window.INTUITY) INTUITY.session('tenses','defuse',{hits,misses,best:bestStreak,score,outcome}); }catch(e){}

  if (outcome === 'win'){ banner('Floor Cleared','#4A6B5C'); sfxVictory(); }
  else { banner('Mission Failed','#A23B2C'); sfxDefeat(); }

  const total = hits+misses, acc = total ? hits/total : 0;
  const sc = scale(acc), [letter,word] = grade(sc);
  $('ovOutcome').className = 'outcome ' + (outcome==='win'?'win':'loss');
  $('ovOutcome').textContent = outcome==='win' ? 'Building secured' : 'Bomb detonated';
  $('ovScore').className = 'score g-'+letter.toLowerCase();
  $('ovScore').innerHTML = sc + '<span class="gr">'+letter+'</span>';
  $('ovSet').textContent = word + ' · ' + GROUPS[groupIdx].label + (mode==='practice' ? ' · practice' : '');
  $('ovNote').innerHTML = '<b>'+hits+'</b> defused, <b>'+misses+'</b> wrong · best streak <b>'+
    bestStreak+'</b> · your composure <b>'+Math.max(0,playerHP)+'</b> · score <b>'+score+'</b>';

  const seen = new Map();
  missLog.forEach(m=>{ const k = m.group+':'+m.idx; if(!seen.has(k)) seen.set(k, m); });
  $('ovMissed').innerHTML = seen.size
    ? '<div style="font-family:\'DM Mono\',monospace;font-size:0.836rem;letter-spacing:.14em;text-transform:uppercase;color:#7A6F73;margin-bottom:.4rem">Worth another look</div>' +
      [...seen.values()].map(m =>
        '<div class="mline"><b>' + esc(m.answer) + '</b>' +
        (m.note ? '<span class="mnote">' + esc(m.note) + '</span>' : '') + '</div>').join('')
    : '';

  $('over').classList.add('show');
}

/* ── REVIEW ── */
function renderReview(){
  const box = $('ovReview');
  if (!answerLog.length){ box.innerHTML = '<div class="rv-empty">No answers yet.</div>'; return; }
  box.innerHTML = answerLog.map(a =>
    '<div class="rv' + (a.ok ? '' : ' bad') + '">' +
      '<span class="rv-mark">' + (a.ok ? '✓' : '✕') + '</span>' +
      '<span class="rv-body">' +
        '<span class="rv-sent">' + esc(a.cue) + ' <b>' + esc(a.answer) + '</b> ' + esc(a.after) + '</span>' +
        (!a.ok && a.chose ? '<span class="rv-chose">you chose ' + esc(a.chose) + '</span>' : '') +
      '</span>' +
    '</div>').join('');
}

/* ── TABS ── */
function buildTabs(){
  const mem = loadMem(), wrap = $('setTabs');
  wrap.innerHTML = '';
  GROUPS.forEach((g,i)=>{
    const due = itemsOf(g).some(it => (mem[memKey(it)]?.miss||0) > 0);
    const btn = document.createElement('button');
    btn.className = 'vtab' + (i===groupIdx?' active':'') + (due?' has-due':'');
    btn.style.setProperty('--vc', g.color);
    btn.innerHTML = esc(g.label) + '<span class="due"></span>';
    btn.title = g.desc || '';
    btn.onclick = () => { if (i===groupIdx) return; switchGroup(i); };
    wrap.appendChild(btn);
  });
}
function switchGroup(i){
  groupIdx = i;
  buildTabs();
  syncHeader();
  const u = new URL(location.href); u.searchParams.set('set', GROUPS[i].id);
  history.replaceState(null,'',u);
  startRun();
}

/* ── MODE / MUTE ── */
function setMode(m){
  mode = m; localStorage.setItem('intuity-defuse-mode', m);
  document.querySelectorAll('.mbtn').forEach(b=>b.classList.toggle('on', b.dataset.m===m));
  if (GROUPS.length) startRun();
}
$('modes').querySelectorAll('.mbtn').forEach(b=>b.addEventListener('click', ()=>setMode(b.dataset.m)));
document.querySelectorAll('.mbtn').forEach(b=>b.classList.toggle('on', b.dataset.m===mode));

function setMute(on){
  musicOn = on; localStorage.setItem('intuity-defuse-sound', on?'on':'off');
  $('muteBtn').textContent = on ? '🔊' : '🔈';
}
$('muteBtn').addEventListener('click', ()=> setMute(!musicOn));
setMute(musicOn);

/* ── EVENTS ── */
document.addEventListener('keydown', e => {
  const i = KEYS.indexOf(e.key);
  if (i >= 0){ firstTouch(); cutWire(i); }
  if (e.key === 'Escape') $('over').classList.remove('show');
});
$('closeX').addEventListener('click', () => $('over').classList.remove('show'));
$('over').addEventListener('click', e => { if (e.target === $('over')) $('over').classList.remove('show'); });
$('againBtn').addEventListener('click', () => { $('over').classList.remove('show'); startRun(); });
$('nextBtn').addEventListener('click', () => { const n=(groupIdx+1)%GROUPS.length; switchGroup(n); });
/* previous wraps the other way, so the two buttons walk the same list */
$('prevBtn').addEventListener('click', () => { const p=(groupIdx-1+GROUPS.length)%GROUPS.length; switchGroup(p); });
$('reviewBtn').addEventListener('click', () => {
  const box = $('ovReview'), open = !box.hidden;
  if (!open) renderReview();
  box.hidden = open;
  $('reviewBtn').textContent = open ? 'Check your answers' : 'Hide answers';
});
$('hubBtn').addEventListener('click', () => { (window.top||window).location.href = '/?openModal=grammar'; });

/* ── LAYOUT SYNC — measures the real header/hud height instead of trusting
   the CSS guess. Needed because the set-tabs row can wrap to 2–3 lines on
   a narrow phone (8 tense sets), and a stale --header-h would let the
   header overlap the top of the device card. Same fix already used in
   tenses-rush.html; Defusal was missing it. ── */
function syncHeader(){
  const h = document.querySelector('.header'), hu = document.querySelector('.hud');
  if (h) document.documentElement.style.setProperty('--header-h', h.offsetHeight+'px');
  if (hu) document.documentElement.style.setProperty('--hud-h', hu.offsetHeight+'px');
}
window.addEventListener('resize', syncHeader);
window.addEventListener('orientationchange', ()=>setTimeout(syncHeader,120));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(syncHeader);

/* ── BOOT ── */
async function boot(){
  let data;
  try {
    const res = await fetch(DATA_URL, { cache:'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    data = await res.json();
  } catch (e) {
    $('loading').innerHTML =
      `<p class="err">Couldn't load <b>${DATA_URL}</b> (${String(e.message||e).replace(/[<>]/g,'')}).<br>` +
      `If you opened this file directly (file://), your browser blocks local JSON fetches — serve it over http:// instead.</p>`;
    return;
  }
  GROUPS = data.map(g => ({ id:g.id, label:g.label, color:g.color, desc:g.desc, items:g.items }))
               .filter(g => itemsOf(g).length >= WIRE_N);
  if (!GROUPS.length){
    $('loading').innerHTML = '<p class="err">No set in the data file has items with a 4-option `options` array including the `answer`.</p>';
    return;
  }
  const want = (new URLSearchParams(location.search).get('set') || '').toLowerCase();
  groupIdx = Math.max(0, GROUPS.findIndex(g => g.id.toLowerCase() === want));
  buildTabs();
  syncHeader();
  $('loading').style.display = 'none';
  startRun();
}
boot();
</script>
