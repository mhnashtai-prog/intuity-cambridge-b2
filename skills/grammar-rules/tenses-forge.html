<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTUITY — Word Forge</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

/* ── INTUITY SHELL TOKENS — same as Pulse/Stars/Burrow/Quiz/Mill/Duel ── */
:root{
  --gold:#C9A961; --gold-glow:rgba(201,169,97,.4);
  --accent:#FFD94A; --accent-rgb:255,217,74;
  --ok:#abc32f; --wrong:#E86A5C;
  --paper:#e5e5e7; --dim:rgba(229,229,231,.55); --faint:rgba(229,229,231,.26);
  --line:rgba(255,255,255,.08);
  --header-h:150px; --bank-h:150px; --player-h:36px;
  --set-color:#C9A961; --set-rgb:201,169,97;
  --phase-color:#C9A961; --phase-rgb:201,169,97;
}
html,body{width:100%;height:100%;overflow:hidden;background:#0d0d0d;overscroll-behavior:none}
body{font-family:'DM Sans',sans-serif;color:var(--paper);user-select:none;-webkit-user-select:none;touch-action:manipulation}
button,a{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-decoration:none}

/* ══ HEADER ══ */
.header{
  position:fixed;top:0;left:0;right:0;z-index:30;
  display:flex;flex-direction:column;gap:.4rem;padding:.5rem 1.25rem .4rem;
  background:rgba(13,13,13,.88);backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(255,255,255,.06);
}
.header-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.back-link{justify-self:start;font-family:'Space Grotesk',sans-serif;
  font-size:.6rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:rgba(255,255,255,.3);transition:color .2s;white-space:nowrap}
.back-link:hover{color:rgba(255,255,255,.7)}
.header-title{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.app-title{font-family:'Space Grotesk',sans-serif;font-size:1rem;font-weight:900;letter-spacing:.22em;color:var(--gold)}
.app-subtitle{font-size:.58rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.32);margin-top:.1rem}
.header-spacer{justify-self:end;font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--faint);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:.3rem .65rem}
.header-spacer b{color:var(--gold)}

.mode-selector{
  display:flex;flex-wrap:wrap;justify-content:center;align-self:center;
  background:rgba(28,28,30,.6);backdrop-filter:blur(40px);
  border-radius:999px;border:1px solid rgba(201,169,97,.2);overflow:hidden;
}
.mode-btn{
  display:flex;align-items:center;gap:.4rem;
  font-family:'Space Grotesk',sans-serif;font-size:.66rem;font-weight:600;
  letter-spacing:.04em;text-transform:uppercase;
  padding:.5rem 1.05rem;border-right:1px solid rgba(84,84,88,.2);
  color:#636366;transition:background .2s ease,color .2s ease;
}
.mode-btn:last-child{border-right:none}
.mode-btn:hover{color:#9ca3af;background:rgba(201,169,97,.1)}
.mode-btn.active{background:rgba(201,169,97,.15);color:var(--gold)}
@media(max-width:760px){.mode-btn{padding:.42rem .62rem;font-size:.6rem;gap:.3rem}}

.set-tabs{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.28rem;padding:0 .5rem}
.vtab{
  font-family:'Space Grotesk',sans-serif;font-size:.56rem;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;
  padding:.28rem .72rem;border-radius:999px;border:1px solid transparent;
  color:rgba(255,255,255,.3);white-space:nowrap;transition:all .2s;
}
.vtab:hover{color:rgba(255,255,255,.75);border-color:rgba(255,255,255,.15)}
.vtab.active{color:var(--vc,var(--gold));border-color:var(--vc,var(--gold));background:rgba(255,255,255,.06)}
.vtab .due{display:inline-block;width:5px;height:5px;border-radius:50%;
  margin-left:.35rem;vertical-align:middle;background:var(--wrong);opacity:0}
.vtab.has-due .due{opacity:1}

/* ══ HUD ══ */
.hud{position:fixed;top:var(--header-h);left:0;right:0;height:40px;z-index:25;
  display:flex;align-items:center;justify-content:space-between;gap:.7rem;padding:0 1rem;
  font-family:'DM Mono',monospace;font-size:.66rem;color:var(--faint);
  border-bottom:1px solid rgba(255,255,255,.05)}
.score-n{font-family:'Space Grotesk',sans-serif;font-weight:900;font-size:1.05rem;
  color:var(--paper);font-variant-numeric:tabular-nums}
.combo{font-family:'Space Grotesk',sans-serif;font-weight:900;font-size:1rem;color:var(--faint);
  transition:color .15s,transform .15s;font-variant-numeric:tabular-nums}
.combo.live{color:var(--accent)}
.combo.pop{transform:scale(1.35)}
.phase-tag{font-family:'DM Mono',monospace;font-size:.56rem;letter-spacing:.12em;text-transform:uppercase;
  padding:.2rem .6rem;border-radius:999px;border:1px solid var(--phase-color);color:var(--phase-color);
  transition:color .3s,border-color .3s;white-space:nowrap}
.mutebtn{font-size:.8rem;opacity:.55}
.mutebtn:hover{opacity:1}

/* ══ ARENA ══ */
.arena{position:fixed;top:calc(var(--header-h) + 40px);left:0;right:0;bottom:calc(var(--bank-h) + var(--player-h));
  overflow:hidden;display:flex;flex-direction:column;
  background:radial-gradient(ellipse at 50% -10%,rgba(var(--phase-rgb),.14),transparent 60%)}
.arena::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(ellipse at 50% 40%,transparent 60%,rgba(11,11,13,.68) 100%)}

.boss-panel{position:relative;z-index:3;flex:0 0 auto;padding:.85rem 1rem .3rem;
  display:flex;flex-direction:column;align-items:center;gap:.4rem}
.boss-name{font-family:'Space Grotesk',sans-serif;font-weight:900;font-size:.85rem;
  letter-spacing:.16em;text-transform:uppercase;color:var(--phase-color);transition:color .3s;
  text-shadow:0 0 18px rgba(var(--phase-rgb),.4)}
.boss-bar-track{width:min(92%,620px);height:13px;border-radius:999px;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.5)}
.boss-bar-fill{height:100%;border-radius:999px;
  background:linear-gradient(90deg,var(--phase-color),color-mix(in srgb,var(--phase-color) 55%,white));
  box-shadow:0 0 14px rgba(var(--phase-rgb),.6);transition:width .35s cubic-bezier(.2,.8,.2,1),background .3s}
.boss-meta{display:flex;align-items:center;gap:.5rem;font-family:'DM Mono',monospace;font-size:.58rem;color:var(--faint)}

.center-stack{position:relative;z-index:3;flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:.65rem;padding:0 1rem}

.card{width:min(94%,620px);display:flex;flex-direction:column;align-items:center;gap:.3rem;
  padding:1rem 1.3rem 1.1rem;border-radius:.8rem;
  background:linear-gradient(178deg,rgba(28,28,30,.97),rgba(18,18,20,.99));
  border:1px solid rgba(201,169,97,.22);
  box-shadow:0 .5rem 1.6rem rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);
  transition:border-color .2s,background .2s}
.card.hit{border-color:var(--ok);background:linear-gradient(178deg,rgba(70,95,25,.92),rgba(35,52,13,.97))}
.card.miss{border-color:var(--wrong);background:linear-gradient(178deg,rgba(120,45,40,.92),rgba(60,22,20,.97))}
.card.shake{animation:shake .32s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

.sentence{font-size:clamp(.95rem,2.6vw,1.18rem);font-weight:600;line-height:2.1;text-align:center;color:var(--paper)}
.sentence mark{background:none;color:var(--set-color,var(--gold));font-weight:700;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:.16em}

/* the assembled blank sits inline in the sentence flow */
.slotrow{display:inline-flex;gap:.3rem;vertical-align:middle;margin:0 .2em;flex-wrap:wrap;justify-content:center}
.slotbox{
  display:inline-flex;align-items:center;justify-content:center;min-width:3.4em;height:1.9em;
  padding:0 .5em;border-radius:.4rem;border:2px dashed rgba(var(--accent-rgb),.4);
  font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:.92em;color:var(--accent);
  background:rgba(var(--accent-rgb),.05);transition:background .15s,border-color .15s,transform .1s;
}
.slotbox.filled{border-style:solid;border-color:rgba(var(--accent-rgb),.55);background:rgba(var(--accent-rgb),.12);cursor:grab}
.slotbox.target-hover{border-color:var(--accent);background:rgba(var(--accent-rgb),.28);transform:scale(1.06)}
.slotbox.right{border-color:var(--ok);background:rgba(171,195,47,.22);color:#d5f26a}
.slotbox.wrong{border-color:var(--wrong);background:rgba(232,106,92,.22);color:#ffb3a8}

.qtimer-track{width:min(84%,480px);height:6px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden}
.qtimer-fill{height:100%;border-radius:999px;background:var(--accent);width:100%}
.qtimer-fill.warn{background:var(--wrong)}

.tapstart{position:relative;z-index:3;margin-top:.1rem;
  font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);background:rgba(12,12,12,.8);border:1px solid rgba(var(--accent-rgb),.35);
  border-radius:999px;padding:.4rem 1rem;pointer-events:none;transition:opacity .4s;white-space:nowrap;text-align:center}
.tapstart.gone{opacity:0}

.log-feed{position:absolute;top:.6rem;right:.8rem;width:190px;display:flex;flex-direction:column;gap:.28rem;z-index:6;pointer-events:none}
.log-line{font-family:'DM Mono',monospace;font-size:.6rem;line-height:1.3;color:var(--dim);
  background:rgba(15,15,17,.65);border-left:2px solid var(--faint);padding:.22rem .5rem;border-radius:.2rem;
  opacity:0;transform:translateX(8px);animation:logIn .25s forwards}
.log-line.hit{border-color:var(--ok);color:var(--ok)}
.log-line.miss{border-color:var(--wrong);color:var(--wrong)}
@keyframes logIn{to{opacity:1;transform:none}}
@media(max-width:760px){.log-feed{display:none}}

.dmg-num{position:fixed;z-index:36;font-family:'Space Grotesk',sans-serif;font-weight:900;
  font-size:1.15rem;pointer-events:none;text-shadow:0 0 12px currentColor}
.dmg-num.you{color:var(--ok)}
.dmg-num.boss{color:var(--wrong)}
.dmg-num.overdrive{color:var(--accent);font-size:1.5rem}

/* ══ PLAYER BAR ══ */
.player-wrap{position:fixed;bottom:var(--bank-h);left:0;right:0;height:var(--player-h);z-index:21;
  display:flex;align-items:center;gap:.6rem;padding:0 1rem;
  background:rgba(13,13,13,.94);border-top:1px solid rgba(255,255,255,.06)}
.player-label{font-family:'Space Grotesk',sans-serif;font-size:.6rem;font-weight:700;letter-spacing:.1em;
  color:var(--dim);text-transform:uppercase;white-space:nowrap}
.player-bar-track{flex:1;height:9px;border-radius:999px;background:rgba(255,255,255,.06);
  overflow:hidden;border:1px solid rgba(255,255,255,.1)}
.player-bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#61b5ed,#5ED39B);
  box-shadow:0 0 10px rgba(93,211,155,.5);transition:width .3s,background .3s;width:100%}
.player-bar-fill.low{background:linear-gradient(90deg,var(--wrong),#ff9d8f);box-shadow:0 0 10px rgba(232,106,92,.6)}
.player-hp-text{font-family:'DM Mono',monospace;font-size:.58rem;color:var(--faint);min-width:2.8rem;text-align:right}

/* ══ BANK — tile tray replaces the lane grid ══ */
.bank-wrap{position:fixed;bottom:0;left:0;right:0;height:var(--bank-h);z-index:20;
  display:flex;flex-direction:column;gap:.4rem;padding:.5rem .7rem .6rem;
  background:rgba(13,13,13,.96);border-top:1px solid rgba(255,255,255,.08)}
.bank-tray{flex:1;min-height:0;overflow-y:auto;display:flex;flex-wrap:wrap;align-content:flex-start;
  gap:.4rem;padding:.15rem .1rem}
.tile{
  touch-action:none;user-select:none;-webkit-user-select:none;
  display:inline-flex;align-items:center;justify-content:center;min-width:2.6em;height:2.1em;
  padding:0 .75em;border-radius:.5rem;border:1.5px solid rgba(97,181,237,.5);
  background:rgba(97,181,237,.12);color:#a8d8fb;
  font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:.82rem;
  cursor:grab;transition:transform .1s,box-shadow .12s,opacity .15s;
}
.tile:active{cursor:grabbing}
.tile.dragging-src{opacity:.3}
.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ghost-tile{
  position:fixed;z-index:60;pointer-events:none;
  display:inline-flex;align-items:center;justify-content:center;min-width:2.6em;height:2.1em;
  padding:0 .75em;border-radius:.5rem;border:1.5px solid var(--accent);
  background:rgba(var(--accent-rgb),.24);color:#fff;
  font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:.82rem;
  box-shadow:0 8px 20px rgba(0,0,0,.5);transform:translate(-50%,-50%) scale(1.08);
}
.bank-actions{display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-shrink:0}
.bank-hint{font-family:'DM Mono',monospace;font-size:.56rem;letter-spacing:.06em;color:var(--faint)}
.clearbtn{font-family:'Space Grotesk',sans-serif;font-size:.62rem;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;padding:.5rem 1rem;border-radius:999px;color:var(--dim);
  border:1px solid rgba(255,255,255,.16)}
.clearbtn:hover{color:var(--paper);border-color:rgba(255,255,255,.35)}
.checkbtn{font-family:'Space Grotesk',sans-serif;font-size:.68rem;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;padding:.55rem 1.4rem;border-radius:999px;background:var(--accent);color:#12100a;
  transition:opacity .15s,transform .1s}
.checkbtn:disabled{opacity:.32;cursor:default}
.checkbtn:not(:disabled):active{transform:scale(.96)}

/* ══ FX ══ */
.banner{position:fixed;left:50%;top:36%;transform:translate(-50%,-50%) scale(.8);z-index:35;
  font-family:'Space Grotesk',sans-serif;font-weight:900;font-size:clamp(1.3rem,6vw,2.6rem);
  letter-spacing:.1em;text-transform:uppercase;opacity:0;pointer-events:none;text-align:center;
  text-shadow:0 0 26px currentColor;transition:opacity .18s,transform .35s cubic-bezier(.2,1.6,.4,1)}
.banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.spark{position:fixed;width:5px;height:5px;border-radius:50%;pointer-events:none;z-index:37}

/* ══ SUMMARY ══ */
.over{position:fixed;inset:0;z-index:50;display:none;
  align-items:center;justify-content:center;padding:1.2rem;
  background:rgba(8,8,9,.35);backdrop-filter:blur(2px)}
.over.show{display:flex}
.over-card{position:relative;
  width:100%;max-width:23rem;max-height:min(78vh,32rem);overflow-y:auto;
  display:flex;flex-direction:column;align-items:center;gap:.35rem;text-align:center;
  padding:1.6rem 1.5rem 1.4rem;border-radius:1.1rem;
  background:linear-gradient(165deg,rgba(28,28,30,.98),rgba(15,15,17,.99));
  border:1px solid rgba(201,169,97,.25);
  box-shadow:0 20px 55px rgba(0,0,0,.6),0 0 40px rgba(201,169,97,.06);
  animation:cardIn .28s cubic-bezier(.2,1,.4,1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.over .closex{position:absolute;top:.55rem;right:.7rem;width:26px;height:26px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:1rem;line-height:1;
  color:var(--faint);border:1px solid rgba(255,255,255,.12);transition:all .15s}
.over .closex:hover{color:var(--paper);border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.06)}
.over .outcome{font-family:'Space Grotesk',sans-serif;font-weight:900;font-size:.72rem;
  letter-spacing:.16em;text-transform:uppercase;padding:.25rem .8rem;border-radius:999px;border:1px solid currentColor}
.over .outcome.win{color:var(--ok)}
.over .outcome.loss{color:var(--wrong)}
.over .score{font-family:'Space Grotesk',sans-serif;font-weight:900;margin-top:.3rem;
  font-size:clamp(2rem,7vw,2.8rem);font-variant-numeric:tabular-nums}
.over .score .gr{font-size:.5em;margin-left:.3rem;vertical-align:.35em}
.g-a{color:#ffd94a} .g-b{color:var(--ok)} .g-c{color:#7dd3fc} .g-d{color:var(--wrong)}
.over .setname{font-family:'DM Mono',monospace;font-size:.7rem;letter-spacing:.16em;
  text-transform:uppercase;color:var(--dim)}
.over .note{margin-top:.6rem;font-size:.8rem;color:var(--dim)}
.over .note b{color:var(--paper)}
.over .missed{margin-top:.7rem;font-size:.78rem;line-height:1.85;color:var(--dim);text-align:left}
.over .missed .mline{margin-bottom:.35rem}
.over .missed b{color:var(--gold);font-weight:700}
.over .missed .mnote{display:block;color:var(--faint);font-size:.72rem;margin-top:.05rem}
.acts{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;margin-top:1.1rem}
.over .go{padding:.7rem 1.7rem;border-radius:99px;background:var(--accent);color:#12100a;
  font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:.74rem;
  letter-spacing:.1em;text-transform:uppercase}
.over .quiet{padding:.7rem 1.5rem;border-radius:99px;color:var(--dim);
  border:1px solid rgba(255,255,255,.16);font-size:.72rem;
  letter-spacing:.08em;text-transform:uppercase;font-family:'Space Grotesk',sans-serif;font-weight:700}
.over .quiet:hover{color:var(--paper)}
.over .away{margin-top:.9rem;font-size:.66rem;border:none;padding:.3rem}

.loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:#0d0d0d;z-index:99;font-family:'DM Mono',monospace;font-size:.7rem;color:var(--faint)}
.err{color:var(--wrong);font-size:.8rem;line-height:1.6;max-width:26rem;text-align:center;padding:2rem}

@media(max-width:600px){
  :root{--header-h:168px;--bank-h:172px;--player-h:32px}
  .card{padding:.8rem .9rem .9rem}
}
@media(prefers-reduced-motion:reduce){ .card,.combo,.banner,.boss-bar-fill,.player-bar-fill,.tile{transition:none!important} .card.shake{animation:none} }
</style>
</head>
<body>

<header class="header">
  <div class="header-top">
    <a class="back-link" href="/?openModal=grammar" target="_top">← Grammar</a>
    <div class="header-title"><div class="app-title">INTUITY</div><div class="app-subtitle">Word Forge</div></div>
    <span class="header-spacer">Level <b>B2–C1</b></span>
  </div>
  <div class="mode-selector">
    <a class='mode-btn' href='/skills/grammar-rules/tenses-rules'>🗺️ Explore</a>
    <a class='mode-btn' href='/skills/grammar-rules/tenses-rules?mode=practice'>✍️ Practice</a>
    <a class='mode-btn' href='/skills/grammar-rules/tenses-rules?mode=quiz'>📝 Quiz</a>
    <a class='mode-btn' href='/skills/grammar-rules/tenses-rush'>🎵 Rush</a>
    <a class='mode-btn' href='/skills/grammar-rules/tenses-duel'>⚔️ Duel</a>
    <span class="mode-btn active">🔨 Forge</span>
  </div>
  <div class="set-tabs" id="setTabs"></div>
</header>

<div class="hud">
  <span>score <span class="score-n" id="score">0</span></span>
  <span class="combo" id="combo">×1</span>
  <span class="phase-tag" id="phaseTag">calm</span>
  <button class="mutebtn" id="muteBtn" title="Sound on/off">🔊</button>
</div>

<div class="arena" id="arena">
  <div class="boss-panel">
    <div class="boss-name" id="bossName">BOSS</div>
    <div class="boss-bar-track"><div class="boss-bar-fill" id="bossFill" style="width:100%"></div></div>
    <div class="boss-meta"><span id="bossHpText">1000 / 1000</span></div>
  </div>
  <div class="log-feed" id="logFeed"></div>
  <div class="center-stack">
    <div class="card" id="card">
      <div class="sentence" id="sentenceWrap">
        <span id="cueText"></span><span class="slotrow" id="slotRow"></span><span id="afterText"></span>
      </div>
    </div>
    <div class="qtimer-track"><div class="qtimer-fill" id="qtimerFill"></div></div>
    <div class="tapstart" id="tapStart">Drag or tap tiles into the blank, then Check</div>
  </div>
</div>

<div class="player-wrap">
  <span class="player-label">You</span>
  <div class="player-bar-track"><div class="player-bar-fill" id="playerFill" style="width:100%"></div></div>
  <span class="player-hp-text" id="playerHpText">1000 / 1000</span>
</div>

<div class="bank-wrap">
  <div class="bank-tray" id="bankTray"></div>
  <div class="bank-actions">
    <button class="clearbtn" id="clearBtn">↺ Clear</button>
    <span class="bank-hint">drag or tap · reorder any time before checking</span>
    <button class="checkbtn" id="checkBtn" disabled>Check</button>
  </div>
</div>

<div class="banner" id="banner"></div>

<div class="over" id="over">
  <div class="over-card">
    <button class="closex" id="closeX" aria-label="Close">×</button>
    <div class="outcome" id="ovOutcome"></div>
    <div class="score" id="ovScore"></div>
    <div class="setname" id="ovSet"></div>
    <div class="note" id="ovNote"></div>
    <div class="missed" id="ovMissed"></div>
    <div class="acts">
      <button class="quiet" id="againBtn">↻ Rematch</button>
      <button class="go" id="nextBtn">Next boss →</button>
    </div>
    <button class="quiet away" id="hubBtn">Back to grammar</button>
  </div>
</div>

<div class="loading" id="loading">Loading…</div>

<script>
/* ══════════════════════════════════════════════════════════════════════
   WORD FORGE — same boss-duel shell and combat model as Duel, but the
   answer is built, not picked. Every question gives a word bank (the
   right words plus decoys); the student drags — or taps, which is just a
   zero-distance drag — tiles into an ordered blank inside the sentence,
   can rearrange freely, then presses Check to resolve.

   Reads its own tense-forge-data.json (NOT the same file as Rush/Mill/
   Duel — those give four whole-phrase options; this needs a per-item word
   bank and an ordered multi-word answer, which is a different shape).
   Expected item shape:
     { "cue": "HE", "after": "all morning.",
       "mark": ["yet"],
       "answer": ["has","been","driving"],
       "bank": ["has","have","had","will","be","been","drive","drove","driving"],
       "note": "present perfect continuous — action still going" }
   `answer` may also be given as a single space-separated string.
   ══════════════════════════════════════════════════════════════════════ */

window.addEventListener('error', e => {
  const l = document.getElementById('loading');
  if (l && l.style.display !== 'none') l.innerHTML =
    '<p class="err"><b>Forge hit an error.</b><br>' + String(e.message||e).replace(/[<>]/g,'') +
    '<br><span style="opacity:.6">' + ((e.filename||'').split('/').pop()+':'+(e.lineno||'?')) + '</span></p>';
});

const DATA_URL = new URLSearchParams(location.search).get('data') || '../../data/grammar-rules/tense-forge-data.json';

const BOSS_MAX = 1000, PLAYER_MAX = 1000;
const BASE_DMG = 78, BASE_BOSS_DMG = 95;
const TIMER_BASE_MS = 4200, PER_SLOT_MS = 1650, PER_TILE_MS = 230;
const TIMER_MIN = 5200, TIMER_MAX = 17000;
const CLICK_THRESHOLD = 7; /* px of pointer travel below which a drag counts as a tap */

const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>]/g,c=>({'&':'&lt;','>':'&gt;','&':'&amp;'}[c]||c));
const shuffle = a => { const b=[...a]; for(let i=b.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[b[i],b[j]]=[b[j],b[i]];} return b; };
const clamp = (n,lo,hi) => Math.max(lo,Math.min(hi,n));

let GROUPS = [], groupIdx = 0;
let running = false, started = false, rafId = null;
let score = 0, combo = 0, bestCombo = 0, hits = 0, misses = 0, missLog = [];
let bossHP = BOSS_MAX, playerHP = PLAYER_MAX, overdriveReady = false, overdriveMark = 0;
let qStart = 0, qDur = 0;
let curItems = null, curItem = null;

/* board state for the active question */
let bank = [], slots = [], usedIdx = new Set(), resolved = false;

const NO_REPEAT = 4;
let recentIdx = [];

/* ── MEMORY: own namespace, misses come back sooner ── */
const MEM_KEY = 'intuity-forge-mem';
function loadMem(){ try{ return JSON.parse(localStorage.getItem(MEM_KEY)||'{}'); }catch(e){ return {}; } }
function saveMem(m){ try{ localStorage.setItem(MEM_KEY,JSON.stringify(m)); }catch(e){} }
const memKey = it => it.group + ':' + it.idx;
function noteResult(it, ok){
  const m = loadMem(), k = memKey(it), e = m[k] || {miss:0,seen:0};
  e.seen++; if (ok) e.miss = Math.max(0,e.miss-1); else e.miss++;
  m[k] = e; saveMem(m);
}
function weightOf(it, mem){
  const e = mem[memKey(it)];
  return e ? 1 + Math.min(6, e.miss*3) : 2;
}

/* ── AUDIO ── */
let ac = null, master = null, musicOn = localStorage.getItem('intuity-forge-sound') !== 'off';
function audio(){
  if (!ac){
    ac = new (window.AudioContext||window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = .5; master.connect(ac.destination);
  }
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
function tone(f,d,ty,v,when,glide){
  if (!musicOn || !ac) return;
  const c = ac, t0 = when || c.currentTime;
  const o = c.createOscillator(), g = c.createGain();
  o.type = ty||'sine'; o.frequency.setValueAtTime(f,t0);
  if (glide) o.frequency.exponentialRampToValueAtTime(glide,t0+d);
  g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(v||.14,t0+.008);
  g.gain.exponentialRampToValueAtTime(.0008,t0+d);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0+d+.02);
}
function noise(d,v,when,hp){
  if (!musicOn || !ac) return;
  const c = ac, t0 = when||c.currentTime, n = Math.floor(c.sampleRate*d);
  const buf = c.createBuffer(1,n,c.sampleRate), dd = buf.getChannelData(0);
  for (let i=0;i<n;i++) dd[i]=(Math.random()*2-1)*(1-i/n);
  const s = c.createBufferSource(); s.buffer = buf;
  const g = c.createGain(); g.gain.value = v||.06;
  const fl = c.createBiquadFilter(); fl.type = hp?'highpass':'lowpass'; fl.frequency.value = hp?6000:900;
  s.connect(fl); fl.connect(g); g.connect(master); s.start(t0);
}
function sfxClick(){ if(!ac)return; tone(700,.05,'square',.06,ac.currentTime); }
function sfxHit(m){ if(!ac)return; const t=ac.currentTime,b=523.25*Math.pow(1.0595,Math.min(14,m));
  tone(b,.1,'triangle',.17,t); tone(b*1.5,.15,'triangle',.12,t+.05); noise(.05,.05,t,true); }
function sfxMiss(){ if(!ac)return; const t=ac.currentTime;
  tone(140,.28,'sawtooth',.15,t,70); noise(.18,.09,t,false); }
function sfxOverdrive(){ if(!ac)return; const t=ac.currentTime;
  [261,329,392,523,659,784].forEach((f,i)=>tone(f,.5,'triangle',.13,t+i*.045)); noise(.3,.1,t,true); }
function sfxVictory(){ if(!ac)return; const t=ac.currentTime;
  [523,659,784,1047].forEach((f,i)=>tone(f,.4,'triangle',.16,t+i*.11)); }
function sfxDefeat(){ if(!ac)return; const t=ac.currentTime;
  [392,349,293,220].forEach((f,i)=>tone(f,.5,'sawtooth',.14,t+i*.14,f*.7)); }

/* ── DATA ── */
function bankSatisfies(bankArr, answerArr){
  const have = {}; bankArr.forEach(w=>{ const k=w.toLowerCase(); have[k]=(have[k]||0)+1; });
  const need = {}; answerArr.forEach(w=>{ const k=w.toLowerCase(); need[k]=(need[k]||0)+1; });
  return Object.keys(need).every(k => (have[k]||0) >= need[k]);
}
function itemsOf(g){
  return (g.items||[]).map((it,idx)=>{
    const answer = Array.isArray(it.answer) ? it.answer.slice() : String(it.answer||'').trim().split(/\s+/).filter(Boolean);
    const bank = Array.isArray(it.bank) ? it.bank.slice() : [];
    return { cue: it.cue||'', after: it.after||'', mark: it.mark||[], answer, bank,
             note: it.note||'', group: g.id, color: g.color, idx };
  }).filter(it => it.answer.length && it.bank.length >= it.answer.length && bankSatisfies(it.bank, it.answer));
}
function pickNext(items){
  const mem = loadMem();
  for (let back = Math.min(NO_REPEAT, recentIdx.length); back >= 0; back--){
    const barred = new Set(recentIdx.slice(recentIdx.length - back));
    const bag = [];
    items.forEach((it,i) => { if (barred.has(i)) return; const w = weightOf(it,mem); for (let k=0;k<w;k++) bag.push(i); });
    if (bag.length){
      const idx = bag[(Math.random()*bag.length)|0];
      recentIdx.push(idx); if (recentIdx.length > NO_REPEAT) recentIdx.shift();
      return items[idx];
    }
  }
  const idx = (Math.random()*items.length)|0;
  recentIdx.push(idx); if (recentIdx.length > NO_REPEAT) recentIdx.shift();
  return items[idx];
}
function markHTML(text, marks){
  let s = esc(text);
  (marks||[]).forEach(w=>{
    const re = new RegExp('\\b'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i');
    s = s.replace(re, m => '<mark>'+m+'</mark>');
  });
  return s;
}

/* ── PHASE ── */
function phaseOf(hp){
  const f = hp / BOSS_MAX;
  if (f > .66) return { name:'calm',      color:'#C9A961', dmgMult:1,   timeMult:1   };
  if (f > .33) return { name:'aggressive',color:'#fb923c', dmgMult:1.3, timeMult:.88 };
  return              { name:'desperate', color:'#E86A5C', dmgMult:1.6, timeMult:.78 };
}
function applyPhase(){
  const p = phaseOf(bossHP);
  document.documentElement.style.setProperty('--phase-color', p.color);
  const rgb = p.color==='#C9A961'?'201,169,97':p.color==='#fb923c'?'251,146,60':'232,106,92';
  document.documentElement.style.setProperty('--phase-rgb', rgb);
  $('phaseTag').textContent = p.name;
  return p;
}

function firstTouch(){
  if (started) return;
  started = true; audio();
  $('tapStart').classList.add('gone');
}

/* ══════════════════════════ BOARD (bank + slots) ══════════════════════════ */
function renderSentence(item){
  $('cueText').innerHTML = markHTML(item.cue, item.mark) + (item.cue ? ' ' : '');
  $('afterText').innerHTML = ' ' + markHTML(item.after, item.mark);
}
function renderSlots(){
  const row = $('slotRow'); row.innerHTML = '';
  slots.forEach((s,i)=>{
    const box = document.createElement('span');
    box.className = 'slotbox' + (s ? ' filled' : '');
    box.dataset.slot = i;
    box.textContent = s ? s.word : '';
    row.appendChild(box);
  });
}
function renderTray(){
  const tray = $('bankTray'); tray.innerHTML = '';
  bank.forEach((w,i)=>{
    if (usedIdx.has(i)) return;
    const t = document.createElement('div');
    t.className = 'tile'; t.dataset.bank = i; t.textContent = w;
    t.tabIndex = 0; t.setAttribute('role','button'); t.setAttribute('aria-label','place '+w);
    tray.appendChild(t);
  });
}
function updateCheckState(){
  $('checkBtn').disabled = resolved || slots.some(s => !s);
}
function firstEmptySlot(){ return slots.findIndex(s=>!s); }

function placeTile(bankIdx, slotIdx){
  slots[slotIdx] = { bankIdx, word: bank[bankIdx] };
  usedIdx.add(bankIdx);
}
function unplaceSlot(slotIdx){
  const s = slots[slotIdx]; if (!s) return;
  usedIdx.delete(s.bankIdx);
  slots[slotIdx] = null;
}
function refreshBoard(){ renderTray(); renderSlots(); updateCheckState(); }

/* ---------- pointer-based drag, doubles as tap when movement is tiny ---------- */
let drag = null; /* {source:'bank'|'slot', bankIdx?, slotIdx?, word, ghost, startX, startY, pointerId} */

function beginDrag(e, source, idx, word, srcEl){
  if (resolved) return;
  firstTouch();
  e.preventDefault();
  const ghost = document.createElement('div');
  ghost.className = 'ghost-tile';
  ghost.textContent = word;
  ghost.style.left = e.clientX + 'px'; ghost.style.top = e.clientY + 'px';
  document.body.appendChild(ghost);
  drag = { source, bankIdx: source==='bank'?idx:null, slotIdx: source==='slot'?idx:null,
           word, ghost, startX:e.clientX, startY:e.clientY, moved:false, pointerId:e.pointerId, srcEl };
  if (srcEl) srcEl.classList.add('dragging-src');
  try{ srcEl && srcEl.setPointerCapture && srcEl.setPointerCapture(e.pointerId); }catch(err){}
  window.addEventListener('pointermove', onDragMove);
  window.addEventListener('pointerup', onDragEnd);
}
function onDragMove(e){
  if (!drag) return;
  drag.ghost.style.left = e.clientX + 'px'; drag.ghost.style.top = e.clientY + 'px';
  const dist = Math.hypot(e.clientX-drag.startX, e.clientY-drag.startY);
  if (dist > CLICK_THRESHOLD) drag.moved = true;
  document.querySelectorAll('.slotbox.target-hover').forEach(el=>el.classList.remove('target-hover'));
  if (drag.moved){
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const box = el && el.closest ? el.closest('.slotbox') : null;
    if (box) box.classList.add('target-hover');
  }
}
function onDragEnd(e){
  window.removeEventListener('pointermove', onDragMove);
  window.removeEventListener('pointerup', onDragEnd);
  if (!drag) return;
  const d = drag; drag = null;
  d.ghost.remove();
  if (d.srcEl) d.srcEl.classList.remove('dragging-src');
  document.querySelectorAll('.slotbox.target-hover').forEach(el=>el.classList.remove('target-hover'));
  if (resolved) return;

  if (!d.moved){
    /* tap gesture */
    sfxClick();
    if (d.source === 'bank'){
      const idx = firstEmptySlot();
      if (idx >= 0) placeTile(d.bankIdx, idx);
    } else {
      unplaceSlot(d.slotIdx);
    }
    refreshBoard();
    return;
  }

  /* drag gesture: resolve by final drop point */
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const box = el && el.closest ? el.closest('.slotbox') : null;
  const inTray = el && el.closest ? el.closest('.bank-tray') : null;
  sfxClick();

  if (box){
    const targetIdx = +box.dataset.slot;
    if (d.source === 'bank'){
      if (slots[targetIdx]) unplaceSlot(targetIdx);      // bump occupant back to bank
      placeTile(d.bankIdx, targetIdx);
    } else if (d.source === 'slot' && targetIdx !== d.slotIdx){
      const moving = slots[d.slotIdx];
      const occupant = slots[targetIdx];
      slots[targetIdx] = moving;
      slots[d.slotIdx] = occupant || null;
    }
  } else if (inTray && d.source === 'slot'){
    unplaceSlot(d.slotIdx);
  }
  /* dropped anywhere else invalid: state unchanged */
  refreshBoard();
}

$('bankTray').addEventListener('pointerdown', e=>{
  const tile = e.target.closest('.tile'); if (!tile) return;
  beginDrag(e, 'bank', +tile.dataset.bank, tile.textContent, tile);
});
$('slotRow').addEventListener('pointerdown', e=>{
  const box = e.target.closest('.slotbox.filled'); if (!box) return;
  beginDrag(e, 'slot', +box.dataset.slot, box.textContent, box);
});
/* keyboard fallback: Enter/Space on a focused tile or filled slot = tap */
$('bankTray').addEventListener('keydown', e=>{
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const tile = e.target.closest('.tile'); if (!tile || resolved) return;
  e.preventDefault(); firstTouch(); sfxClick();
  const idx = firstEmptySlot();
  if (idx >= 0) placeTile(+tile.dataset.bank, idx);
  refreshBoard();
});
$('slotRow').addEventListener('keydown', e=>{
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const box = e.target.closest('.slotbox.filled'); if (!box || resolved) return;
  e.preventDefault(); sfxClick();
  unplaceSlot(+box.dataset.slot);
  refreshBoard();
});
$('clearBtn').addEventListener('click', ()=>{
  if (resolved) return;
  slots = slots.map(()=>null); usedIdx = new Set();
  refreshBoard();
});
$('checkBtn').addEventListener('click', ()=>{ if (!resolved) submitAnswer(false); });

/* ══════════════════════════ ROUND ══════════════════════════ */
function startRound(){
  const g = GROUPS[groupIdx];
  const items = itemsOf(g);
  score = 0; combo = 0; bestCombo = 0; hits = 0; misses = 0; missLog = [];
  bossHP = BOSS_MAX; playerHP = PLAYER_MAX; overdriveReady = false; overdriveMark = 0; recentIdx = [];
  curItems = items;
  $('score').textContent = '0'; setCombo(0);
  $('bossName').textContent = g.label.toUpperCase();
  $('logFeed').innerHTML = '';
  updateBars();
  applyPhase();
  $('over').classList.remove('show');
  running = true;
  nextQuestion();
  if (rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(loop);
}

function nextQuestion(){
  curItem = pickNext(curItems);
  document.documentElement.style.setProperty('--set-color', curItem.color);
  bank = shuffle(curItem.bank.slice());
  slots = new Array(curItem.answer.length).fill(null);
  usedIdx = new Set(); resolved = false;
  $('card').className = 'card';
  renderSentence(curItem);
  refreshBoard();

  const phase = phaseOf(bossHP);
  qDur = clamp(TIMER_BASE_MS + curItem.answer.length*PER_SLOT_MS + curItem.bank.length*PER_TILE_MS,
               TIMER_MIN, TIMER_MAX) * phase.timeMult;
  qStart = performance.now();
}

function loop(now){
  if (!running) return;
  const t = now - qStart;
  const pct = clamp(1 - t/qDur, 0, 1);
  const fill = $('qtimerFill');
  fill.style.width = (pct*100) + '%';
  fill.classList.toggle('warn', pct < .28);
  if (pct <= 0 && !resolved) submitAnswer(true);
  rafId = requestAnimationFrame(loop);
}

function submitAnswer(timedOut){
  if (resolved || !curItem) return;
  resolved = true;
  $('checkBtn').disabled = true;
  document.querySelectorAll('.tile').forEach(t=>t.style.pointerEvents='none');

  const item = curItem;
  const given = slots.map(s => s ? s.word.toLowerCase() : null);
  const want = item.answer.map(w => w.toLowerCase());
  const ok = given.length === want.length && given.every((w,i) => w === want[i]);

  noteResult(item, ok);
  try{ if (window.INTUITY) INTUITY.log('tenses', item.group+':'+item.idx, ok, {game:'forge'}); }catch(e){}

  /* mark each slot right/wrong against the correct sequence, and fill any
     empty slot with what should have been there */
  const row = $('slotRow'); row.innerHTML = '';
  item.answer.forEach((w,i)=>{
    const box = document.createElement('span');
    const gotIt = given[i] === want[i];
    box.className = 'slotbox filled ' + (gotIt ? 'right' : 'wrong');
    box.textContent = w;
    row.appendChild(box);
  });

  $('card').classList.add(ok ? 'hit' : 'miss');
  if (!ok) $('card').classList.add('shake');

  const phase = phaseOf(bossHP);

  if (ok){
    hits++; combo++; bestCombo = Math.max(bestCombo,combo);
    let mult = combo>=15 ? 2.2 : combo>=10 ? 1.7 : combo>=5 ? 1.3 : 1;
    let isOverdrive = false;
    if (overdriveReady){ mult *= 1.9; isOverdrive = true; overdriveReady = false; }
    const dmg = Math.round(BASE_DMG * mult);
    bossHP = clamp(bossHP - dmg, 0, BOSS_MAX);
    score += 120 * (1 + Math.floor(combo/5));
    sfxHit(combo);
    spawnDamage(dmg, 'boss', isOverdrive);
    fireworks();
    pushLog((isOverdrive?'⚡ OVERDRIVE — ':'⚒ ') + 'you forge "' + item.answer.join(' ') + '" · boss takes ' + dmg, 'hit');
    if (combo>0 && combo % 15 === 0 && combo !== overdriveMark){
      overdriveMark = combo; overdriveReady = true;
      banner('Overdrive Armed','var(--accent)'); sfxOverdrive();
    }
  } else {
    misses++; combo = 0; missLog.push(item);
    const dmg = Math.round(BASE_BOSS_DMG * phase.dmgMult);
    playerHP = clamp(playerHP - dmg, 0, PLAYER_MAX);
    sfxMiss();
    spawnDamage(dmg, 'you', false);
    pushLog((timedOut ? '⏱ ran out of time — ' : '✕ wrong order — ') + 'boss hits you for ' + dmg, 'miss');
  }
  setCombo(combo);
  $('score').textContent = score;
  updateBars();
  applyPhase();

  if (bossHP <= 0){ setTimeout(()=>finish('win'), 700); return; }
  if (playerHP <= 0){ setTimeout(()=>finish('loss'), 700); return; }

  setTimeout(()=>{ if (running) nextQuestion(); }, ok ? 750 : 1050);
}

function updateBars(){
  $('bossFill').style.width = (bossHP/BOSS_MAX*100) + '%';
  $('bossHpText').textContent = Math.max(0,bossHP) + ' / ' + BOSS_MAX;
  $('playerFill').style.width = (playerHP/PLAYER_MAX*100) + '%';
  $('playerFill').classList.toggle('low', playerHP/PLAYER_MAX < .3);
  $('playerHpText').textContent = Math.max(0,playerHP) + ' / ' + PLAYER_MAX;
}
function pushLog(text, cls){
  const feed = $('logFeed');
  const line = document.createElement('div');
  line.className = 'log-line ' + cls;
  line.textContent = text;
  feed.insertBefore(line, feed.firstChild);
  while (feed.children.length > 4) feed.removeChild(feed.lastChild);
}
function spawnDamage(amount, side, overdrive){
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const anchor = side === 'boss' ? $('bossFill') : $('playerFill');
  const r = anchor.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'dmg-num ' + side + (overdrive ? ' overdrive' : '');
  el.textContent = '-' + amount;
  el.style.left = (r.left + r.width * Math.random()*.8 + r.width*.1) + 'px';
  el.style.top = (r.top - 6) + 'px';
  document.body.appendChild(el);
  el.animate([{transform:'translateY(0)',opacity:1},{transform:'translateY(-34px)',opacity:0}],
    {duration:700,easing:'cubic-bezier(.1,.8,.2,1)'});
  setTimeout(()=>el.remove(),720);
}
function setCombo(n){
  const el = $('combo');
  el.textContent = '×' + (1+Math.floor(n/5)) + (n ? '  '+n : '');
  el.classList.toggle('live', n>=5);
  el.classList.add('pop'); setTimeout(()=>el.classList.remove('pop'),150);
}
function banner(txt,col){
  const b = $('banner'); b.textContent = txt; b.style.color = col;
  b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
  setTimeout(()=>b.classList.remove('show'),850);
}

/* fireworks on a correct build — bigger and rowdier than a normal hit spark */
const FW_COLS = ['#FFD94A','#C9A961','#5ED39B','#61b5ed','#ffffff','#c084fc'];
function fireworks(){
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const card = $('card').getBoundingClientRect();
  const bursts = 3;
  for (let b=0;b<bursts;b++){
    setTimeout(()=>{
      const cx = card.left + card.width*(0.25+Math.random()*0.5);
      const cy = card.top + card.height*(0.25+Math.random()*0.5);
      for (let i=0;i<22;i++){
        const p = document.createElement('div');
        p.className = 'spark';
        const col = FW_COLS[(Math.random()*FW_COLS.length)|0], sz = 3+Math.random()*3;
        p.style.left = cx+'px'; p.style.top = cy+'px';
        p.style.width = sz+'px'; p.style.height = sz+'px';
        p.style.background = col; p.style.boxShadow = '0 0 '+(sz*2.5)+'px '+col;
        document.body.appendChild(p);
        const a = Math.random()*Math.PI*2, d = 40+Math.random()*100, dur = 550+Math.random()*350;
        p.animate([{transform:'translate(-50%,-50%) scale(1.1)',opacity:1},
          {transform:'translate(-50%,-50%) translate('+(Math.cos(a)*d)+'px,'+(Math.sin(a)*d+40)+'px) scale(.2)',opacity:0}],
          {duration:dur,easing:'cubic-bezier(.12,.75,.3,1)'});
        setTimeout(()=>p.remove(),dur+30);
      }
    }, b*110);
  }
}

/* ── SUMMARY ── */
function scale(acc){
  const A = [[0,140],[.60,160],[.72,173],[.80,180],[1,190]];
  for (let i=1;i<A.length;i++){
    const [a0,s0]=A[i-1],[a1,s1]=A[i];
    if (acc<=a1) return Math.round(s0+(acc-a0)/(a1-a0)*(s1-s0));
  }
  return 190;
}
const grade = s => s>=180?['A','Excellent']:s>=173?['B','Very good']:s>=160?['C','Pass']:['D','Try again'];

function finish(outcome){
  running = false; cancelAnimationFrame(rafId);
  try{ if (window.INTUITY) INTUITY.session('tenses','forge',{hits,misses,best:bestCombo,score,outcome}); }catch(e){}

  if (outcome === 'win'){ banner('Victory','var(--ok)'); sfxVictory(); }
  else { banner('Defeated','var(--wrong)'); sfxDefeat(); }

  const total = hits+misses, acc = total ? hits/total : 0;
  const sc = scale(acc), [letter,word] = grade(sc);
  $('ovOutcome').className = 'outcome ' + (outcome==='win'?'win':'loss');
  $('ovOutcome').textContent = outcome==='win' ? 'Boss defeated' : 'You went down';
  $('ovScore').className = 'score g-'+letter.toLowerCase();
  $('ovScore').innerHTML = sc + '<span class="gr">'+letter+'</span>';
  $('ovSet').textContent = word + ' · ' + GROUPS[groupIdx].label;
  $('ovNote').innerHTML = '<b>'+hits+'</b> built, <b>'+misses+'</b> wrong · best combo <b>'+
    bestCombo+'</b> · boss left at <b>'+Math.max(0,bossHP)+'</b> · score <b>'+score+'</b>';

  const seen = new Map();
  missLog.forEach(m=>{ const k = m.group+':'+m.idx; if(!seen.has(k)) seen.set(k, m); });
  $('ovMissed').innerHTML = seen.size
    ? '<div style="font-family:\'DM Mono\',monospace;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:.4rem">Worth another look</div>' +
      [...seen.values()].map(m =>
        '<div class="mline"><b>' + esc(m.answer.join(' ')) + '</b>' +
        (m.note ? '<span class="mnote">' + esc(m.note) + '</span>' : '') + '</div>').join('')
    : '';

  $('over').classList.add('show');
}

/* ── TABS ── */
function buildTabs(){
  const mem = loadMem(), wrap = $('setTabs');
  wrap.innerHTML = '';
  GROUPS.forEach((g,i)=>{
    const due = itemsOf(g).some(it => (mem[memKey(it)]?.miss||0) > 0);
    const btn = document.createElement('button');
    btn.className = 'vtab' + (i===groupIdx?' active':'') + (due?' has-due':'');
    btn.style.setProperty('--vc', g.color);
    btn.innerHTML = esc(g.label) + '<span class="due"></span>';
    btn.title = g.desc || '';
    btn.onclick = () => { if (i===groupIdx) return; switchGroup(i); };
    wrap.appendChild(btn);
  });
}
function switchGroup(i){
  groupIdx = i;
  buildTabs();
  const u = new URL(location.href); u.searchParams.set('set', GROUPS[i].id);
  history.replaceState(null,'',u);
  startRound();
}

/* ── MUTE ── */
function setMute(on){
  musicOn = on; localStorage.setItem('intuity-forge-sound', on?'on':'off');
  $('muteBtn').textContent = on ? '🔊' : '🔈';
}
$('muteBtn').addEventListener('click', ()=> setMute(!musicOn));
setMute(musicOn);

/* ── EVENTS ── */
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('over').classList.remove('show'); });
$('closeX').addEventListener('click', () => $('over').classList.remove('show'));
$('over').addEventListener('click', e => { if (e.target === $('over')) $('over').classList.remove('show'); });
$('againBtn').addEventListener('click', () => { $('over').classList.remove('show'); startRound(); });
$('nextBtn').addEventListener('click', () => { const n=(groupIdx+1)%GROUPS.length; switchGroup(n); });
$('hubBtn').addEventListener('click', () => { (window.top||window).location.href = '/?openModal=grammar'; });

/* ── BOOT ── */
async function boot(){
  let data;
  try {
    const res = await fetch(DATA_URL, { cache:'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    data = await res.json();
  } catch (e) {
    $('loading').innerHTML =
      `<p class="err">Couldn't load <b>${DATA_URL}</b> (${String(e.message||e).replace(/[<>]/g,'')}).<br>` +
      `Forge needs its own data file — a <b>bank</b> array of tiles and an ordered <b>answer</b> array per item — ` +
      `it's a different shape from Rush/Mill/Duel's four-option format.<br>` +
      `If you opened this file directly (file://), your browser blocks local JSON fetches — serve it over http:// instead.</p>`;
    return;
  }
  GROUPS = data.map(g => ({ id:g.id, label:g.label, color:g.color, desc:g.desc, items:g.items }))
               .filter(g => itemsOf(g).length > 0);
  if (!GROUPS.length){
    $('loading').innerHTML = '<p class="err">No set in the data file has items with a valid `bank` and `answer` (every answer word must be available in that item\'s bank).</p>';
    return;
  }
  const want = (new URLSearchParams(location.search).get('set') || '').toLowerCase();
  groupIdx = Math.max(0, GROUPS.findIndex(g => g.id.toLowerCase() === want));
  buildTabs();
  $('loading').style.display = 'none';
  startRound();
}
boot();
</script>
