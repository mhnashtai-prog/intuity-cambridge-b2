<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INTUITY - Tenses Quiz</title>
  <link rel="stylesheet" href="../../data/grammar-rules/gapfill.css?v=17">
</head>
<body>
  <div class="container">
    <div class="content-container">
      <!-- Selector and strip pin together as ONE sticky block. Pinning them
           separately meant guessing the selector's height for the strip's
           offset, and the selector wraps to two rows on this topic — so the
           strip sat too high and slid under it while scrolling. -->
      <div class="pinned">
        <div class="test-selector" id="testSelector"></div>

        <div class="progress-info" id="progressInfo" style="display: none;">
          <span id="progressText"></span>
          <div class="progress-dots" id="progressDots"></div>
        </div>
      </div>

      <div id="contentContainer">
        <div class="loading">Loading quiz...</div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="scoreModal">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title">Test Results</h2>
        <div class="modal-subtitle" id="modalSubtitle"></div>
      </div>
      <div class="score-display">
        <div class="score-number" id="scoreNumber">0/0</div>
        <div class="score-label" id="scoreLabel"></div>
      </div>
      <div class="modal-footer">
        <button class="modal-btn modal-btn-secondary" onclick="closeModal()">Close</button>
        <button class="modal-btn modal-btn-primary" id="nextTestBtn" onclick="nextTest()">Next Test</button>
      </div>
    </div>
  </div>

  <script>window.QUIZ_DATA = 'tenses-data';</script>
  <script src="../../data/grammar-rules/gapfill.js?v=17"></script>
</body>
</html>
