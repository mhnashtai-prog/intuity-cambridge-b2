<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTUITY — Tense Mill</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800;900&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════════════
   TENSE MILL — one verb, six forms, wound into a continuous vertical
   path that never stops turning (the "mill"). A strike zone sits fixed
   near the middle of the track; the player taps whichever form is inside
   it. Because the path loops rather than falling once, there is no
   penalty for waiting a lap to be sure — low pressure by design, built
   for thinking through the six-way contrast rather than reflex speed.

   The sentence that motivates the choice, and the rule that explains it
   once caught, both live in the footer — the track is for recognising
   the form, the footer is for the reasoning behind it.
   ══════════════════════════════════════════════════════════════════════ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --gold:#C9A961; --ink:#0b0b0d;
  --accent:#FFD94A; --accent-rgb:255,217,74;
  --ok:#abc32f; --wrong:#E86A5C;
  --paper:#e9e9eb; --dim:rgba(233,233,235,.55); --faint:rgba(233,233,235,.26);
  --header-h:132px; --footer-h:150px;
}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0c;overscroll-behavior:none}
body{font-family:'DM Sans',sans-serif;color:var(--paper);user-select:none;-webkit-user-select:none;touch-action:manipulation}
button,a{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-decoration:none}

/* ══ HEADER (shared visual language with Explore / Rush) ══ */
.header{
  position:fixed;top:0;left:0;right:0;z-index:30;
  display:flex;flex-direction:column;gap:.5rem;padding:.7rem 1.25rem .55rem;
  background:rgba(10,10,12,.9);backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(255,255,255,.06);
}
.htop{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.backlink{
  font-family:'DM Sans',sans-serif;font-size:.875rem;font-weight:500;
  color:#8e8e93;white-space:nowrap;transition:color .3s ease;
}
.backlink:hover{color:var(--gold)}
.brand{display:flex;flex-direction:column;align-items:center;line-height:1.05}
.brand b{
  font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.4rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--gold);
  background:linear-gradient(135deg,var(--gold) 0%,rgba(201,169,97,.7) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.brand span{font-size:.62rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:#8e8e93;margin-top:.25rem}
.tag{justify-self:end;font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:.3rem .65rem}
.tag b{color:var(--gold)}

.modeRow{display:flex;justify-content:center}
.modeRow-inner{
  display:flex;background:rgba(28,28,30,.6);backdrop-filter:blur(40px);
  border-radius:999px;border:1px solid rgba(201,169,97,.2);overflow:hidden;
}
.modePill{
  font-family:'DM Sans',sans-serif;font-size:.72rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  padding:.5rem 1rem;color:#636366;transition:all .15s;white-space:nowrap;
  border-right:1px solid rgba(84,84,88,.2);display:flex;align-items:center;gap:.4rem;
}
.modePill:last-child{border-right:none}
.modePill:hover{color:#9ca3af;background:rgba(201,169,97,.1)}
.modePill.active{color:var(--gold);background:rgba(201,169,97,.15)}

.hstats{display:flex;align-items:center;justify-content:center;gap:1.2rem;
  font-family:'DM Mono',monospace;font-size:.64rem;color:var(--faint)}
.hstats b{font-family:'Space Grotesk',sans-serif;font-weight:900;font-size:.95rem;color:var(--paper)}

/* ══ TRACK ══ */
.track{
  position:fixed;top:var(--header-h);left:0;right:0;bottom:var(--footer-h);
  overflow:hidden;
  background:radial-gradient(ellipse at 50% 50%,rgba(201,169,97,.06),transparent 65%);
}
.track::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:3;
  background:linear-gradient(180deg,#0a0a0c 0%,transparent 16%,transparent 84%,#0a0a0c 100%)}
.spine{position:absolute;left:50%;top:0;bottom:0;width:2px;transform:translateX(-50%);
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.08) 0,rgba(255,255,255,.08) 6px,transparent 6px,transparent 14px)}

.strikezone{
  position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:104px;z-index:4;
  border-top:1.5px dashed rgba(var(--accent-rgb),.55);border-bottom:1.5px dashed rgba(var(--accent-rgb),.55);
  background:rgba(var(--accent-rgb),.05);pointer-events:none;
}
.strikezone.pulse{animation:szpulse .5s ease}
@keyframes szpulse{0%{background:rgba(var(--accent-rgb),.05)}40%{background:rgba(var(--accent-rgb),.22)}100%{background:rgba(var(--accent-rgb),.05)}}

.mill{position:absolute;left:0;right:0;top:0;will-change:transform}
.form{
  position:absolute;left:50%;width:min(78%,340px);height:70px;margin-top:11px;
  display:flex;align-items:center;justify-content:center;text-align:center;
  border-radius:.85rem;border:1.5px solid rgba(201,169,97,.28);
  background:linear-gradient(178deg,rgba(24,24,27,.94),rgba(14,14,16,.97));
  font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(1rem,3.4vw,1.2rem);
  color:var(--paper);box-shadow:0 .5rem 1.2rem rgba(0,0,0,.5);
  transition:border-color .15s,background .15s;
}
.form.inzone{border-color:var(--accent);box-shadow:0 0 22px rgba(var(--accent-rgb),.35)}
.form.hit{border-color:var(--ok);background:linear-gradient(178deg,rgba(74,102,26,.92),rgba(36,52,14,.96))}
.form.miss{border-color:var(--wrong);background:linear-gradient(178deg,rgba(112,42,38,.92),rgba(54,20,18,.96))}

/* ══ FOOTER ══ */
.footer{
  position:fixed;bottom:0;left:0;right:0;z-index:20;min-height:var(--footer-h);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;
  padding:1rem 1.4rem 1.2rem;text-align:center;
  background:rgba(10,10,12,.96);border-top:1px solid rgba(255,255,255,.08);
}
.verbTag{font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.sentence{font-family:'DM Sans',sans-serif;font-weight:600;font-size:clamp(.95rem,3vw,1.15rem);line-height:1.5;color:var(--paper);max-width:640px}
.sentence .blank{display:inline-block;min-width:2.6em;margin:0 .15em;border-bottom:2px dashed rgba(var(--accent-rgb),.55);color:var(--accent);font-weight:800}
.sentence mark{background:none;color:var(--gold);font-weight:700;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:.18em}
.footNote{
  max-width:640px;font-size:.8rem;line-height:1.5;color:var(--dim);
  padding:.55rem .9rem;border-radius:.6rem;opacity:0;transition:opacity .3s ease;
}
.footNote.show{opacity:1}
.footNote.ok{background:rgba(171,195,47,.1);border:1px solid rgba(171,195,47,.3);color:#e8ffb0}
.footNote.bad{background:rgba(232,106,92,.1);border:1px solid rgba(232,106,92,.3);color:#ffd9d4}

.loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0a0a0c;z-index:99}
.ld{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:ld 1.2s ease-in-out infinite}
@keyframes ld{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1.3)}}
.loaderr{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#0a0a0c;z-index:99;
  flex-direction:column;gap:.6rem;padding:2rem;text-align:center}
.loaderr.show{display:flex}
.loaderr p{font-family:'DM Mono',monospace;font-size:.7rem;color:var(--dim);max-width:320px;line-height:1.6}
.loaderr button{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:.68rem;letter-spacing:.08em;
  text-transform:uppercase;color:#12100a;background:var(--accent);padding:.6rem 1.3rem;border-radius:999px}

@media(max-width:600px){
  :root{--footer-h:170px}
  .form{width:88%}
}
</style>
</head>
<body>

<div class="loading" id="loading"><div class="ld"></div></div>
<div class="loaderr" id="loaderr">
  <p id="loaderrMsg">Couldn't load the question data.</p>
  <button id="loaderrRetry">Retry</button>
</div>

<header class="header">
  <div class="htop">
    <a class="backlink" href="/?openModal=grammar">← Grammar</a>
    <div class="brand"><b>INTUITY</b><span>Tense Mill</span></div>
    <span class="tag">Level <b>B2–C1</b></span>
  </div>
  <div class="modeRow">
    <div class="modeRow-inner">
      <a class="modePill" href="tenses-rules.html">🗺️ Explore</a>
      <a class="modePill" href="tenses-rules.html?mode=practice">✍️ Practice</a>
      <a class="modePill" href="tenses-rules.html?mode=quiz">📝 Quiz</a>
      <a class="modePill" href="tenses-rush.html">🎵 Rush</a>
      <span class="modePill active">🌀 Mill</span>
    </div>
  </div>
  <div class="hstats">
    <span>caught <b id="hitCount">0</b></span>
    <span>verb <b id="verbCount">1</b> / <b id="verbTotal">0</b></span>
  </div>
</header>

<div class="track" id="track">
  <div class="spine"></div>
  <div class="strikezone" id="strikezone"></div>
  <div class="mill" id="mill"></div>
</div>

<div class="footer">
  <div class="verbTag" id="verbTag">VERB</div>
  <div class="sentence" id="sentence"></div>
  <div class="footNote" id="footNote"></div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════
   DATA — one entry per verb. `forms` is always six items long, always in
   this fixed order (matches the winding path in the original sketch):
     0 Present Simple · 1 Present Continuous · 2 Present Perfect
     3 Future Simple  · 4 Present Perfect Continuous · 5 Future Perfect
   `answer` is the index of the form that correctly completes the sentence.
   ══════════════════════════════════════════════════════════════════════ */
const DATA_URL = new URLSearchParams(location.search).get('data') || '../../data/grammar-rules/tense-rush-data.json';
let ROUNDS = [];

/* Rush's file is grouped by tense-contrast set: [{id,label,items:[...]}, ...].
   Mill only cares about items that carry the two extra optional fields
   below — everything else in the file (options, id, label...) is Rush's
   business and is ignored here. */
function flattenForMill(groups){
  const rounds = [];
  (groups||[]).forEach(g => {
    (g.items||[]).forEach(it => {
      if (!it.verb || !Array.isArray(it.forms) || it.forms.length !== 6) return;
      const answerIdx = it.forms.indexOf(it.answer);
      if (answerIdx === -1) return; // answer text doesn't match any of the six forms — skip rather than guess
      rounds.push({
        verb: it.verb, cue: it.cue, after: it.after, mark: it.mark,
        forms: it.forms, answer: answerIdx, note: it.note, wrongNote: it.wrongNote
      });
    });
  });
  return rounds;
}
let roundIdx = 0, hitCount = 0, roundSolved = false;

const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* ── mill geometry ── */
const ITEM_H = 96;
const WAVE = [0, -68, 58, -50, 78, -62]; // px horizontal offset per slot in the 6-form cycle, gives the winding look
let scrollY = 0;
const SPEED = 34; // px / second
let lastT = null, rafId = null;
let millEls = [];

function buildMill(forms){
  const mill = $('mill');
  mill.innerHTML = '';
  millEls = [];
  // triple the list so the wave repeats seamlessly across the loop boundary
  const tripled = [...forms, ...forms, ...forms];
  tripled.forEach((text,i) => {
    const el = document.createElement('div');
    el.className = 'form';
    el.textContent = text;
    el.style.top = (i*ITEM_H) + 'px';
    el.style.transform = `translate(calc(-50% + ${WAVE[i%6]}px),0)`;
    el.dataset.formIndex = i % 6;
    el.addEventListener('click', () => tryCatch(el, i % 6));
    mill.appendChild(el);
    millEls.push(el);
  });
  scrollY = 0;
}

function tick(t){
  if (lastT===null) lastT = t;
  const dt = (t-lastT)/1000; lastT = t;
  scrollY += SPEED*dt;
  const loopH = ITEM_H * (ROUNDS[roundIdx]?.forms.length || 6);
  if (scrollY >= loopH) scrollY -= loopH;
  $('mill').style.transform = `translateY(${-scrollY}px)`;
  markZone();
  rafId = requestAnimationFrame(tick);
}

function zoneRect(){
  return $('strikezone').getBoundingClientRect();
}
function markZone(){
  const zr = zoneRect();
  millEls.forEach(el=>{
    const r = el.getBoundingClientRect();
    const inZone = r.top < zr.bottom && r.bottom > zr.top;
    el.classList.toggle('inzone', inZone && !el.classList.contains('hit') && !el.classList.contains('miss'));
  });
}

function tryCatch(el, formIdx){
  if (roundSolved) return;
  const zr = zoneRect(), r = el.getBoundingClientRect();
  const inZone = r.top < zr.bottom && r.bottom > zr.top;
  if (!inZone) return; // only taps inside the strike zone count

  const round = ROUNDS[roundIdx];
  const ok = formIdx === round.answer;

  $('strikezone').classList.remove('pulse'); void $('strikezone').offsetWidth; $('strikezone').classList.add('pulse');

  if (ok){
    el.classList.add('hit');
    roundSolved = true;
    hitCount++; $('hitCount').textContent = hitCount;
    showNote(round.note || 'Correct.', true);
    setTimeout(nextRound, 1100);
  } else {
    el.classList.add('miss');
    setTimeout(()=>el.classList.remove('miss'), 500);
    showNote(round.wrongNote || 'Not quite — that form doesn\'t fit this sentence. Watch for it again.', false);
  }
}

function showNote(text, ok){
  const n = $('footNote');
  n.textContent = text;
  n.className = 'footNote show ' + (ok?'ok':'bad');
  if (ok) return; // stays until next round replaces it
  clearTimeout(showNote._t);
  showNote._t = setTimeout(()=>{ n.classList.remove('show'); }, 2200);
}

function renderSentence(round){
  $('verbTag').textContent = round.verb.toUpperCase();
  let s = esc(round.cue) + ' <span class="blank">____</span> ' + esc(round.after);
  (round.mark||[]).forEach(w=>{
    const re = new RegExp('\\b'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i');
    s = s.replace(re, m => '<mark>'+m+'</mark>');
  });
  $('sentence').innerHTML = s;
}

function nextRound(){
  roundIdx = (roundIdx+1) % ROUNDS.length;
  startRound();
}
function startRound(){
  roundSolved = false;
  const round = ROUNDS[roundIdx];
  $('verbCount').textContent = roundIdx+1;
  $('footNote').classList.remove('show');
  renderSentence(round);
  buildMill(round.forms);
}

/* ── boot ── */
async function loadData(){
  const res = await fetch(DATA_URL, { cache:'no-store' });
  if (!res.ok) throw new Error('HTTP '+res.status);
  const groups = await res.json();
  const rounds = flattenForMill(groups);
  if (!rounds.length) throw new Error('no items with verb + 6 forms found — add those two fields to at least one item in tense-rush-data.json');
  return rounds;
}
function showLoadError(msg){
  $('loading').style.display = 'none';
  $('loaderrMsg').textContent = msg;
  $('loaderr').classList.add('show');
}
async function boot(){
  $('loaderr').classList.remove('show');
  $('loading').style.display = 'flex';
  try{
    ROUNDS = await loadData();
  }catch(err){
    showLoadError(
      'Couldn\'t load ' + DATA_URL + ' (' + err.message + '). ' +
      'If you opened this file directly (file://), your browser blocks local JSON fetches — ' +
      'serve this folder over http:// instead, e.g. run "python3 -m http.server" in it.'
    );
    return;
  }
  $('verbTotal').textContent = ROUNDS.length;
  $('loading').style.display = 'none';
  startRound();
  lastT = null;
  rafId = requestAnimationFrame(tick);
}
$('loaderrRetry').addEventListener('click', boot);
window.addEventListener('resize', markZone);
boot();
</script>
</body>
</html>
