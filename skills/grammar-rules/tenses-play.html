<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>INTUITY — Street</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --stage:#D9CFC2;
    --paper:#FEFCF9;
    --ink:#000000;
    --soft:#5f5852;
    --mute:#8a8078;
    --rule:#BCAF9E;
    --hot:#C85A2B;
    --spring:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{background:var(--stage);color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none;}
  .display{font-family:'Anton',Impact,sans-serif;font-weight:400;text-transform:uppercase;
    line-height:.94;letter-spacing:-.005em;}

  /* ---------- bar ---------- */
  .bar{display:flex;align-items:center;gap:10px;flex:none;
    padding:12px 16px calc(12px + env(safe-area-inset-top,0px));}
  .bar .back{border:none;background:none;color:var(--soft);font-family:inherit;
    font-size:.68rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase;
    cursor:pointer;padding:6px 0;flex:none;}
  .bar .back:hover{color:var(--ink);}
  .bar .title{flex:1;min-width:0;font-size:.62rem;font-weight:700;letter-spacing:.16em;
    text-transform:uppercase;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bar .count{font-size:.68rem;font-weight:500;color:var(--mute);font-variant-numeric:tabular-nums;flex:none;letter-spacing:.06em;}
  .bar .count b{color:var(--ink);font-weight:700;}

  /* ---------- sections ---------- */
  .sections{flex:1;min-height:0;overflow-y:auto;padding:4px 16px calc(20px + env(safe-area-inset-bottom,0px));}
  .lede{font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-bottom:12px;}
  .sec{width:100%;text-align:left;border:none;background:var(--paper);border-radius:12px;
    padding:15px 16px;margin-bottom:9px;cursor:pointer;display:flex;align-items:center;gap:12px;
    transition:transform .15s var(--spring);}
  .sec:active{transform:scale(.985);}
  .sec .txt{flex:1;min-width:0;}
  .sec .nm{font-family:'Anton',Impact,sans-serif;text-transform:uppercase;font-size:1.12rem;
    line-height:1.05;margin-bottom:4px;}
  .sec .mt{font-size:.74rem;color:var(--mute);}
  .sec .mt em{font-style:normal;color:var(--hot);font-weight:700;}
  .sec .tick{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--rule);
    display:flex;align-items:center;justify-content:center;font-size:.7rem;color:#fff;}
  .sec.done .tick{background:var(--hot);border-color:var(--hot);}

  /* ---------- street ---------- */
  .play{flex:1;min-height:0;display:none;flex-direction:column;}
  .play.on{display:flex;}
  .stage{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;}
  .cardzone{flex:none;touch-action:none;padding:0 14px calc(16px + env(safe-area-inset-bottom,0px));}
  .road{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
  .road line{stroke:var(--rule);stroke-width:1;}
  .road .centre{stroke:#BFB3A0;stroke-dasharray:5 12;stroke-width:1.5;}
  .road .vp{fill:#8a7f6d;}

  .sign{position:absolute;cursor:pointer;display:flex;flex-direction:column;
    background:var(--paper);padding:11px 13px;border-radius:2px;
    box-shadow:0 6px 20px rgba(40,32,22,.34);
    border-left:3px solid #16161a;
    transform-origin:right center;
    transition:left .5s var(--spring),right .5s var(--spring),top .5s var(--spring),
               width .5s var(--spring),opacity .3s ease;}
  .sign::after{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:max(100%,44px);height:max(100%,44px);}
  .sign .cue{color:var(--hot);line-height:1.05;overflow-wrap:break-word;max-width:100%;}
  .sign.right{align-items:flex-end;text-align:right;
    border-left:none;border-right:3px solid #16161a;
    transform-origin:left center;}
  .sign .line{margin-top:5px;color:var(--soft);line-height:1.32;font-weight:400;}
  .sign .line b{font-weight:700;color:var(--ink);}
  .sign:active{opacity:.55;}

  /* black post the board is bolted to, standing behind it */
  .post{position:absolute;pointer-events:none;background:#16161a;border-radius:1px;}
  .post::after{content:'';position:absolute;left:50%;bottom:-3px;transform:translateX(-50%);
    width:180%;height:5px;border-radius:2px;background:#16161a;opacity:.85;}

  .more{position:absolute;border:none;background:none;color:var(--mute);
    font-family:'Inter',sans-serif;font-size:.7rem;font-weight:700;letter-spacing:.1em;
    cursor:pointer;transform:translate(-50%,-50%);padding:10px;}
  .more:hover{color:var(--ink);}

  .card{width:min(480px,100%);margin:0 auto;padding:16px 18px 14px;
    background:var(--paper);border-radius:12px;
    box-shadow:0 8px 26px rgba(58,47,34,.26);
    transition:transform .42s var(--spring),opacity .3s ease;}
  .card.in{transform:translateY(16px);opacity:0;}
  .card.out{transform:translateY(-46px) scale(.94);opacity:0;}
  .card .kick{font-size:.54rem;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin-bottom:7px;}
  .card .cue{font-size:clamp(1.4rem,6vw,2.1rem);color:var(--hot);margin-bottom:11px;
    border-bottom:2px solid var(--hot);padding-bottom:3px;display:inline-block;max-width:100%;overflow-wrap:break-word;}
  .card .sentence{font-size:1.12rem;font-weight:400;line-height:1.4;letter-spacing:-.01em;color:var(--soft);}
  .card .sentence b{font-weight:700;color:var(--ink);}
  .card .note{font-size:.74rem;color:var(--mute);line-height:1.5;margin-top:11px;
    padding-top:9px;border-top:1px solid var(--rule);}
  .hint{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:12px;
    font-size:.55rem;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);}
  .hint span{font-size:.85rem;line-height:1;}

  .done{text-align:center;padding:4px 0 2px;}
  .done h2{font-size:clamp(1.8rem,9vw,2.6rem);margin-bottom:10px;}
  .done p{font-size:.88rem;color:var(--soft);line-height:1.5;margin-bottom:16px;}
  .done .row{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;}
  .lnk{border:none;background:none;color:var(--soft);font-family:inherit;font-size:.68rem;
    font-weight:700;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;padding:6px 0;}
  .lnk.hot{color:var(--hot);}

  .sheet{position:absolute;inset:0;background:var(--stage);padding:20px;
    display:none;flex-direction:column;gap:2px;overflow-y:auto;}
  .sheet.open{display:flex;}
  .sheet h3{font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);
    font-weight:500;margin-bottom:10px;}
  .sheet button{text-align:left;border:none;border-bottom:1px solid var(--rule);background:none;
    font-family:'Anton',Impact,sans-serif;text-transform:uppercase;font-size:1.35rem;color:var(--hot);
    padding:13px 0;cursor:pointer;min-height:44px;}
  .sheet button i{display:block;font-family:'Inter',sans-serif;font-style:normal;text-transform:none;
    font-size:.78rem;font-weight:400;color:var(--soft);margin-top:4px;}
  .sheet .close{font-family:'Inter',sans-serif;font-size:.66rem;letter-spacing:.16em;
    text-transform:uppercase;color:var(--soft);border-bottom:none;margin-top:8px;}

  .msg{margin:auto;text-align:center;color:var(--soft);font-size:.92rem;line-height:1.55;padding:24px;}
  @media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important;}}
</style>
</head>
<body>

<div class="bar">
  <button class="back" id="back" type="button">&larr; Sections</button>
  <span class="title" id="title">&nbsp;</span>
  <span class="count" id="count"></span>
</div>

<div class="sections" id="sections"></div>

<div class="play" id="play">
  <div class="stage" id="stage">
    <svg class="road" id="road" preserveAspectRatio="none"></svg>
    <div id="signLayer"></div>
    <div class="sheet" id="sheet"></div>
  </div>
  <div class="cardzone" id="cardLayer"></div>
</div>

<script>
const P        = new URLSearchParams(location.search);
const CATEGORY = P.get('category') || 'present';
const TENSE    = P.get('tense')    || 'simple';
const JSON_URL = P.get('json')     || '../../data/grammar-rules/tenses-rules.json';
const START    = P.get('section') !== null ? parseInt(P.get('section'),10) : null;
/* One ratio drives both axes, so every sign sits exactly on the line
   running from its side of the road to the vanishing point. Width tapers
   with depth; type size does not, so the far boards stay readable and
   simply wrap to more lines. */
const ROW_STEP  = 0.35;   // depth step along the road
const WIDTH_TAPER = 0.74; // width multiplier per row back

let tense = null, useCases = [], secIdx = null;
let cards = [], placements = [], activeCard = null, activeIsPlaced = false, done = false;
const cleared = new Set();

const $ = id => document.getElementById(id);

/* ---------------- data ---------------- */
async function load(){
  try{
    const res = await fetch(JSON_URL, { cache:'no-store' });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const raw  = await res.json();
    const list = Array.isArray(raw) ? raw : (raw.rules || Object.values(raw));
    tense = (Array.isArray(list)?list:Object.values(list))
              .find(t => t.id === CATEGORY+'-'+TENSE);
    if(!tense) throw new Error('tense not found');
    useCases = tense.useCases || [];
  }catch(e){
    console.error(e);
    $('sections').innerHTML = '<div class="msg">Couldn\'t load the tense data.<br>'+
      'Looked for '+JSON_URL+'</div>';
    return;
  }
  if(START !== null && useCases[START]) openSection(START);
  else showSections();
}

/* ---------------- text ---------------- */
function esc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

function mark(sentence, markers){
  if(!markers || !markers.length) return sentence;
  let out = sentence;
  markers.slice().sort((a,b)=>b.length-a.length).forEach(m=>{
    out = out.replace(new RegExp('\\b('+esc(m)+')\\b','i'), '<b>$1</b>');
  });
  return out;
}

/* The signpost for a SENTENCE — the time expression that actually appears
   in it, so six sentences from one section carry six different signs. */
const TIME_RE = /\b((?:every|each|this|next|last)\s+\w+|on\s+\w+days?|in\s+the\s+\w+|at\s+\d[\d:.]*\s*(?:am|pm)?|at\s+(?:night|noon|midnight|dawn|dusk|weekends?)|since\s+[\w\s]{1,12}?|for\s+\w+\s*\w*|all\s+\w+|when|while|before|after|until|as\s+soon\s+as|yet|just|already|never|ever|always|usually|often|sometimes|rarely|nowadays|recently|lately|currently|tomorrow|tonight|yesterday|today|now)\b/i;

function cueFor(sentence, uc){
  const ms = (uc.timeMarkers||[]).slice().sort((a,b)=>b.length-a.length);
  for(const m of ms){
    const hit = sentence.match(new RegExp('\\b('+esc(m)+'[\\w\\s]{0,10}?)(?=[,.!?]|$)','i'));
    if(hit) return hit[1].trim().replace(/\s+/g,' ');
    if(new RegExp('\\b'+esc(m)+'\\b','i').test(sentence)) return m;
  }
  const g = sentence.match(TIME_RE);
  if(g) return g[1];
  return sentence.split(/\s+/).slice(0,2).join(' ').replace(/[,.!?]$/,'');
}

/* ---------------- sections ---------------- */
function showSections(){
  secIdx = null;
  $('play').classList.remove('on');
  $('sections').style.display = '';
  $('back').style.visibility = 'hidden';
  $('title').textContent = tense.name || '';
  $('count').innerHTML = '<b>'+cleared.size+'</b> / '+useCases.length;

  $('sections').innerHTML =
    '<div class="lede">Choose a use &middot; each one is a street</div>' +
    useCases.map((uc,i) => {
      const n = 1 + (uc.moreExamples||[]).length;
      const cue = cueFor(uc.mainExample, uc);
      return '<button class="sec'+(cleared.has(i)?' done':'')+'" data-i="'+i+'" type="button">'+
               '<span class="txt">'+
                 '<span class="nm">'+uc.title+'</span>'+
                 '<span class="mt">'+n+' cards &middot; <em>'+cue+'</em></span>'+
               '</span>'+
               '<span class="tick">'+(cleared.has(i)?'&#10003;':'')+'</span>'+
             '</button>';
    }).join('');

  $('sections').querySelectorAll('.sec').forEach(b => {
    b.onclick = () => openSection(+b.dataset.i);
  });
}

function openSection(i){
  secIdx = i;
  const uc = useCases[i];
  cards = [uc.mainExample].concat(uc.moreExamples||[]).map(s => ({
    text: s, cue: cueFor(s, uc), markers: uc.timeMarkers||[], note: uc.note||''
  }));
  placements = []; activeCard = 0; activeIsPlaced = false; done = false;

  $('sections').style.display = 'none';
  $('play').classList.add('on');
  $('back').style.visibility = 'visible';
  $('back').textContent = START !== null ? '\u2190 List' : '\u2190 Sections';
  $('title').textContent = uc.title;
  layout(); render();
}

/* ---------------- geometry ---------------- */
let G = {};
function layout(){
  const st = $('stage');
  const w = st.clientWidth, h = st.clientHeight;
  const narrow = w < 620;
  G = { w, h, narrow,
        perSide: narrow ? 2 : 3,
        vpx: w*0.5, vpy: h*0.12,
        baseY: h*0.86,
        baseW: narrow ? Math.min(w*0.45,190) : Math.min(w*0.31,230),
        edge: 8 };
  /* The angle of the road line, damped. Boards are sheared to match it so
     their top and bottom edges run toward the vanishing point instead of
     staying level and facing the viewer. */
  const raw = Math.atan2(G.baseY - G.vpy, G.vpx - G.edge) * 180 / Math.PI;
  G.shear = Math.min(24, raw * 0.45);
  const svg = $('road');
  const kerb = G.narrow ? 44 : 78;
  svg.setAttribute('viewBox','0 0 '+w+' '+h);

  /* Layers, back to front: far light, two walls, pavements, road.
     Every shade is a tint of the same warm ground, so the street reads
     as one material lit differently rather than as coloured panels. */
  svg.innerHTML =
    '<defs>'+
      '<linearGradient id="wl" x1="0" y1="0" x2="0" y2="1">'+
        '<stop offset="0%" stop-color="#C6BBA9"/><stop offset="100%" stop-color="#A99C86"/></linearGradient>'+
      '<linearGradient id="wr" x1="0" y1="0" x2="0" y2="1">'+
        '<stop offset="0%" stop-color="#CFC5B4"/><stop offset="100%" stop-color="#B4A894"/></linearGradient>'+
      '<linearGradient id="rd" x1="0" y1="1" x2="0" y2="0">'+
        '<stop offset="0%" stop-color="#D2C8B9"/><stop offset="100%" stop-color="#EDE7DC"/></linearGradient>'+
      '<linearGradient id="pv" x1="0" y1="1" x2="0" y2="0">'+
        '<stop offset="0%" stop-color="#C8BDAB"/><stop offset="100%" stop-color="#E2DACD"/></linearGradient>'+
      '<radialGradient id="hz" cx="50%" cy="50%" r="50%">'+
        '<stop offset="0%" stop-color="#F6F2EA" stop-opacity=".95"/>'+
        '<stop offset="100%" stop-color="#F6F2EA" stop-opacity="0"/></radialGradient>'+
    '</defs>'+

    '<rect x="0" y="0" width="'+w+'" height="'+h+'" fill="#DCD3C6"/>'+

    '<polygon points="0,0 '+G.vpx+','+G.vpy+' '+G.edge+','+h+' 0,'+h+'" fill="url(#wl)"/>'+
    '<polygon points="'+w+',0 '+G.vpx+','+G.vpy+' '+(w-G.edge)+','+h+' '+w+','+h+'" fill="url(#wr)"/>'+

    '<polygon points="'+G.edge+','+h+' '+G.vpx+','+G.vpy+' '+(G.edge+kerb)+','+h+'" fill="url(#pv)"/>'+
    '<polygon points="'+(w-G.edge)+','+h+' '+G.vpx+','+G.vpy+' '+(w-G.edge-kerb)+','+h+'" fill="url(#pv)"/>'+

    '<polygon points="'+(G.edge+kerb)+','+h+' '+G.vpx+','+G.vpy+' '+(w-G.edge-kerb)+','+h+'" fill="url(#rd)"/>'+

    '<circle cx="'+G.vpx+'" cy="'+G.vpy+'" r="'+Math.min(w,h)*0.28+'" fill="url(#hz)"/>'+

    '<line x1="'+(G.edge+kerb)+'" y1="'+h+'" x2="'+G.vpx+'" y2="'+G.vpy+'" stroke="#B0A290" stroke-width="1"/>'+
    '<line x1="'+(w-G.edge-kerb)+'" y1="'+h+'" x2="'+G.vpx+'" y2="'+G.vpy+'" stroke="#B0A290" stroke-width="1"/>'+
    '<line class="centre" x1="'+G.vpx+'" y1="'+h+'" x2="'+G.vpx+'" y2="'+G.vpy+'"/>'+
    '<circle class="vp" cx="'+G.vpx+'" cy="'+G.vpy+'" r="2.5"/>';
}
function slotAt(side, depth){
  const t  = Math.max(0.15, 1 - depth*ROW_STEP);
  const ax = side ? G.w - G.edge : G.edge;
  const x  = G.vpx + (ax - G.vpx)*t;
  // Never let a board reach across the road: cap its width at the gap
  // between its own edge and the centre line.
  const room = Math.abs(G.vpx - x) - 16;
  return {
    x: x,
    y: G.vpy + (G.baseY - G.vpy)*t,
    t: t,
    w: Math.max(96, Math.min(G.baseW * Math.pow(WIDTH_TAPER, depth), room))
  };
}

/* ---------------- render ---------------- */
function render(){
  $('count').innerHTML = '<b>'+placements.length+'</b> / '+cards.length;
  renderSigns(); renderCard();
}

function renderSigns(){
  const layer = $('signLayer');
  layer.innerHTML = '';
  let hidden = 0;

  placements.forEach((p,i) => {
    const depth = placements.slice(i+1).filter(q => q.side === p.side).length;
    if(depth >= G.perSide){ hidden++; return; }
    if(activeIsPlaced && p.c === activeCard) return;

    const s = slotAt(p.side, depth), c = cards[p.c];
    const el = document.createElement('div');
    el.className = 'sign' + (p.side ? ' right' : '');
    el.style.width = s.w+'px';
    el.style.top = (s.y - 30)+'px';
    if(p.side) el.style.right = (G.w - s.x)+'px'; else el.style.left = s.x+'px';
    // Sheared along the road line, plus a little turn for thickness.
    const sh = p.side ? G.shear : -G.shear;
    const ry = p.side ? -13 : 13;
    el.style.transform = 'perspective(1200px) rotateY('+ry+'deg) skewY('+sh+'deg)';

    // Fixed type sizes — every hanging sign stays fully readable.
    const cueSize  = G.narrow ? 15 : 17;
    const bodySize = G.narrow ? 12.5 : 13.5;
    const html =
      '<div class="cue display" style="font-size:'+cueSize+'px">'+c.cue+'</div>'+
      '<div class="line" style="font-size:'+bodySize+'px">'+mark(c.text, c.markers)+'</div>';

    el.innerHTML = html;
    el.onclick = () => retrieve(p.c);

    // Post first, so the board sits in front of it.
    const post = document.createElement('div');
    post.className = 'post';
    const pw = Math.max(4, Math.round(7*s.t));
    const ph = Math.round((G.baseY - s.y) * 0.30 + 52*s.t);
    post.style.transform = 'skewY('+(p.side ? G.shear*0.5 : -G.shear*0.5)+'deg)';
    post.style.width  = pw+'px';
    post.style.height = ph+'px';
    post.style.top    = (s.y - 30 + 26)+'px';
    if(p.side) post.style.right = (G.w - s.x + 14)+'px';
    else       post.style.left  = (s.x + 14)+'px';
    layer.appendChild(post);

    layer.appendChild(el);
  });

  if(hidden){
    const b = document.createElement('button');
    b.className = 'more';
    b.style.left = G.vpx+'px'; b.style.top = (G.vpy-28)+'px';
    b.textContent = '+'+hidden;
    b.onclick = openSheet;
    layer.appendChild(b);
  }
}

function renderCard(){
  const layer = $('cardLayer');
  layer.innerHTML = '';

  if(done){
    const el = document.createElement('div');
    el.className = 'card';
    const nextIdx = useCases.findIndex((_,i) => !cleared.has(i));
    el.innerHTML =
      '<div class="done">'+
        '<h2 class="display">Street complete</h2>'+
        '<p>Tap any sign to bring it back. Say the sentence before you do.</p>'+
        '<div class="row">'+
          (nextIdx > -1 ? '<button class="lnk hot" id="nx" type="button">Next use &rarr;</button>' : '')+
          '<button class="lnk" id="bk" type="button">All uses</button>'+
        '</div>'+
      '</div>';
    layer.appendChild(el);
    if(el.querySelector('#nx')) el.querySelector('#nx').onclick = () => openSection(nextIdx);
    el.querySelector('#bk').onclick = leave;
    return;
  }

  if(activeCard === null) return;
  const c = cards[activeCard];
  const el = document.createElement('div');
  el.className = 'card in';
  el.innerHTML =
    '<div class="kick">'+(tense.name||'')+'</div>'+
    '<div class="cue display">'+c.cue+'</div>'+
    '<div class="sentence">'+mark(c.text, c.markers)+'</div>'+
    (c.note ? '<div class="note">'+c.note+'</div>' : '')+
    '<div class="hint"><span>&uarr;</span>'+
      (activeIsPlaced ? 'Tap or swipe up to put it back' : 'Tap or swipe up to send it down')+
    '</div>';
  layer.appendChild(el);
  requestAnimationFrame(() => el.classList.remove('in'));
}

/* ---------------- state ---------------- */
function advance(){
  if(done || activeCard === null) return;
  const el = document.querySelector('.card');
  if(!activeIsPlaced) placements.push({ c: activeCard, side: placements.length % 2 });
  activeIsPlaced = false;

  const nx = cards.findIndex((_,i) => !placements.some(p => p.c === i));
  activeCard = nx === -1 ? null : nx;
  if(activeCard === null){ done = true; cleared.add(secIdx); }

  if(el){ el.classList.add('out'); setTimeout(render, 220); } else render();
}
function undo(){
  if(!placements.length) return;
  activeCard = placements.pop().c;
  activeIsPlaced = false; done = false;
  render();
}
function retrieve(i){
  activeCard = i; activeIsPlaced = true; done = false;
  closeSheet(); render();
}

/* ---------------- overflow ---------------- */
function openSheet(){
  const sheet = $('sheet');
  let html = '<h3>Further down the street</h3>';
  placements.forEach((p,i) => {
    if(placements.slice(i+1).filter(q => q.side === p.side).length < G.perSide) return;
    const c = cards[p.c];
    html += '<button type="button" data-c="'+p.c+'">'+c.cue+'<i>'+c.text+'</i></button>';
  });
  html += '<button type="button" class="close" data-close="1">Close</button>';
  sheet.innerHTML = html;
  sheet.classList.add('open');
  sheet.querySelectorAll('button').forEach(b => {
    b.onclick = () => b.dataset.close ? closeSheet() : retrieve(+b.dataset.c);
  });
}
function closeSheet(){ $('sheet').classList.remove('open'); }

/* ---------------- chrome ---------------- */
function leave(){
  if(START !== null){
    if(window.parent !== window) parent.postMessage({ intuity:'showList' }, '*');
    else showSections();
  } else showSections();
}
$('back').onclick = leave;

const swipeArea = $('play');
let sx=0, sy=0, tracking=false;
swipeArea.addEventListener('pointerdown', e => {
  if(e.target.closest('.sign, .more, .sheet, .lnk')) return;
  sx = e.clientX; sy = e.clientY; tracking = true;
});
swipeArea.addEventListener('pointerup', e => {
  if(!tracking) return;
  tracking = false;
  const dy = e.clientY - sy, dx = e.clientX - sx;
  // A tap (no travel) counts as "send it down" — clicking is what people
  // do on a desktop, and requiring a drag there reads as a frozen screen.
  if(Math.abs(dy) < 12 && Math.abs(dx) < 12){ advance(); return; }
  if(Math.abs(dy) < 45 || Math.abs(dx) > Math.abs(dy)) return;
  dy < 0 ? advance() : undo();
});
swipeArea.addEventListener('pointercancel', () => { tracking = false; });

document.addEventListener('keydown', e => {
  if(secIdx === null) return;
  if(e.key === 'ArrowUp' || e.key === ' '){ e.preventDefault(); advance(); }
  if(e.key === 'ArrowDown'){ e.preventDefault(); undo(); }
  if(e.key === 'Escape'){ if($('sheet').classList.contains('open')) closeSheet(); else leave(); }
});

let rt;
window.addEventListener('resize', () => {
  clearTimeout(rt);
  rt = setTimeout(() => { if(secIdx !== null){ layout(); render(); } }, 120);
});

load();
</script>
