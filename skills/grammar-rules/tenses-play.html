<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>INTUITY — Mind Map</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --stage:#F1E8DA;
    --paper:#FEFCF9;
    --ink:#2B2129;
    --soft:#5C4E52;
    --mute:#8B7B78;
    --rule:#D9C0A4;
    --line:#2B2129;
    --spring:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{background:var(--stage);color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none;}
  .display{font-family:'Anton',Impact,sans-serif;font-weight:400;text-transform:uppercase;
    line-height:.94;letter-spacing:-.005em;}

  /* ---------- bar ---------- */
  .bar{display:flex;align-items:center;gap:10px;flex:none;
    padding:12px 16px calc(12px + env(safe-area-inset-top,0px));}
  .bar .back{border:none;background:none;color:var(--soft);font-family:inherit;
    font-size:.68rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase;
    cursor:pointer;padding:6px 0;flex:none;}
  .bar .back:hover{color:var(--ink);}
  .bar .title{flex:1;min-width:0;font-size:.62rem;font-weight:700;letter-spacing:.16em;
    text-transform:uppercase;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bar .count{font-size:.68rem;font-weight:500;color:var(--mute);font-variant-numeric:tabular-nums;flex:none;letter-spacing:.06em;}
  .bar .count b{color:var(--ink);font-weight:700;}

  /* ---------- sections list ---------- */
  .sections{flex:1;min-height:0;overflow-y:auto;padding:4px 16px calc(20px + env(safe-area-inset-bottom,0px));}
  .lede{font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-bottom:12px;}
  .sec{width:100%;text-align:left;border:none;background:var(--paper);border-radius:12px;
    padding:15px 16px;margin-bottom:9px;cursor:pointer;display:flex;align-items:center;gap:12px;
    transition:transform .15s var(--spring);}
  .sec:active{transform:scale(.985);}
  .sec .txt{flex:1;min-width:0;}
  .sec .nm{font-family:'Anton',Impact,sans-serif;text-transform:uppercase;font-size:1.12rem;
    line-height:1.05;margin-bottom:4px;}
  .sec .mt{font-size:.74rem;color:var(--mute);}
  .sec .mt em{font-style:normal;color:var(--line);font-weight:700;}
  .sec .tick{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--rule);
    display:flex;align-items:center;justify-content:center;font-size:.7rem;color:#fff;}
  .sec.done .tick{background:var(--line);border-color:var(--line);}

  /* ---------- map ---------- */
  .play{flex:1;min-height:0;display:none;flex-direction:column;}
  .play.on{display:flex;}
  .map{position:relative;flex:1;min-height:0;margin:0 12px calc(10px + env(safe-area-inset-bottom,0px));}
  @media(max-width:480px){
    .map{margin:0 6px calc(8px + env(safe-area-inset-bottom,0px));}
  }
  .mapPath{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
  .mapPath .road{fill:none;stroke:var(--mute);stroke-width:.16;stroke-linecap:round;}
  .mapPath .stem{stroke:var(--rule);stroke-width:.4;}
  .mapPath .dot{fill:var(--paper);stroke:var(--line);stroke-width:.3;}

  .nodes{position:absolute;inset:0;}
  .node{position:absolute;transform:translateY(-50%);width:100%;}

  .pill{position:absolute;top:0;transform:translate(-50%,-50%);
    display:flex;align-items:center;border:none;background:none;padding:0;cursor:pointer;
    transition:transform .15s var(--spring);}
  .pill:active{transform:translate(-50%,-50%) scale(.96);}

  .pill .circle{width:44px;height:44px;border-radius:50%;flex:none;position:relative;z-index:2;order:1;
    display:flex;align-items:center;justify-content:center;
    font-family:'Anton',Impact,sans-serif;font-size:1.15rem;
    box-shadow:0 5px 14px rgba(30,24,16,.24);}
  .pill .circle .chk{display:none;}
  .pill.seen .circle .num{display:none;}
  .pill.seen .circle .chk{display:inline;}

  .pill .rect{height:36px;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;order:2;
    border-radius:0 999px 999px 0;padding:0 18px 0 26px;margin-left:-16px;
    font-family:'Anton',Impact,sans-serif;text-transform:uppercase;
    font-size:.8rem;letter-spacing:.01em;white-space:nowrap;
    box-shadow:0 5px 14px rgba(30,24,16,.2);}
  /* .circle-right: circle sits on the right instead — same fusion, mirrored.
     The rect's flat edge always sits against the circle; the open/rounded
     tip always faces away from it (and is the end the stem connects from). */
  .pill.circle-right .circle{order:2;margin-left:-12px;}
  .pill.circle-right .rect{order:1;margin-left:0;padding:0 30px 0 18px;margin-right:0;
    border-radius:999px 0 0 999px;}

  .cap{position:absolute;top:0;transform:translateY(-50%);max-width:44%;}
  .cap .ct{font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;
    color:var(--line);margin-bottom:3px;}
  .cap .cs{font-size:.76rem;line-height:1.32;color:var(--soft);}
  .cap .cs b{font-weight:700;color:var(--ink);}
  .cap.right{text-align:left;}
  .cap.left{text-align:right;}

  /* ---------- modal ---------- */
  .modalWrap{position:absolute;inset:0;display:none;align-items:flex-end;justify-content:center;z-index:5;}
  .modalWrap.open{display:flex;}
  .backdrop{position:absolute;inset:0;background:rgba(30,26,20,.42);opacity:0;transition:opacity .25s ease;}
  .modalWrap.open .backdrop{opacity:1;}
  .modalCard{position:relative;width:min(480px,100%);margin:0 12px calc(12px + env(safe-area-inset-bottom,0px));
    padding:18px 20px 16px;background:var(--paper);border-radius:16px;
    box-shadow:0 -8px 30px rgba(30,24,16,.3);
    transform:translateY(24px);opacity:0;transition:transform .32s var(--spring),opacity .28s ease;}
  .modalWrap.open .modalCard{transform:translateY(0);opacity:1;}
  .modalCard .x{position:absolute;top:12px;right:14px;border:none;background:none;
    font-size:1.1rem;color:var(--mute);cursor:pointer;line-height:1;padding:6px;}
  .modalCard .kick{font-size:.54rem;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin-bottom:7px;}
  .modalCard .cue{font-size:clamp(1.4rem,6vw,2rem);color:var(--line);margin-bottom:11px;
    border-bottom:2px solid var(--line);padding-bottom:3px;display:inline-block;max-width:88%;overflow-wrap:break-word;}
  .modalCard .sentence{font-size:1.08rem;font-weight:400;line-height:1.4;letter-spacing:-.01em;color:var(--soft);}
  .modalCard .sentence b{font-weight:700;color:var(--ink);}
  .modalCard .note{font-size:.74rem;color:var(--mute);line-height:1.5;margin-top:11px;
    padding-top:9px;border-top:1px solid var(--rule);}

  .msg{margin:auto;text-align:center;color:var(--soft);font-size:.92rem;line-height:1.55;padding:24px;}
  @media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important;}}
</style>
</head>
<body>

<div class="bar">
  <button class="back" id="back" type="button">&larr; Sections</button>
  <span class="title" id="title">&nbsp;</span>
  <span class="count" id="count"></span>
</div>

<div class="sections" id="sections"></div>

<div class="play" id="play">
  <div class="map" id="map">
    <svg class="mapPath" id="mapPath" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
    <div class="nodes" id="nodes"></div>
    <div class="modalWrap" id="modalWrap">
      <div class="backdrop" id="backdrop"></div>
      <div class="modalCard" id="modalCard"></div>
    </div>
  </div>
</div>

<script>
const P        = new URLSearchParams(location.search);
const CATEGORY = P.get('category') || 'present';
const TENSE    = P.get('tense')    || 'simple';
const JSON_URL = P.get('json')     || '../../data/grammar-rules/tenses-rules.json';
const START    = P.get('section') !== null ? parseInt(P.get('section'),10) : null;

/* Six fixed points, hand-placed to fit one phone screen without scrolling.
   Everything below is plain percentages — no JS layout math, no resize
   handling needed, the browser just scales the whole thing with CSS. */
const NODE_LAYOUT = [
  { y: 13.8, capSide:'right', capFrom: 42, capTo: 97 },
  { y: 28.3, capSide:'left',  capFrom: 3,  capTo: 58 },
  { y: 42.8, capSide:'right', capFrom: 42, capTo: 97 },
  { y: 57.3, capSide:'left',  capFrom: 3,  capTo: 58 },
  { y: 71.8, capSide:'right', capFrom: 42, capTo: 97 },
  { y: 86.3, capSide:'left',  capFrom: 3,  capTo: 58 },
];

// The wave is no longer an independent decorative shape that dots try to
// match. It's built the other way around: each row's dot sits at a fixed,
// equally-padded offset from its pill (computed in buildMap), and the
// wave is drawn straight through those six points as its anchors. That
// makes "does the curve pass through the dot" true by construction —
// there's nothing left to compute or drift out of sync.
/* "Flight of Fancy" — neutral warm tones with muted jewel accents.
   Paired with a readable text colour per tone (the two lighter shades
   need dark text, not white). Cycles for the 6th node. */
const PALETTE = [
  { bg:'#DD8E58', fg:'#FEFCF9' },
  { bg:'#708A81', fg:'#FEFCF9' },
  { bg:'#E5D1B8', fg:'#2B2129' },
  { bg:'#C2956E', fg:'#2B2129' },
  { bg:'rgba(0,0,0,.7)', fg:'#FEFCF9' },
];

let tense = null, useCases = [], secIdx = null;
let cards = [], visited = new Set(), openIdx = null;
const cleared = new Set();

const $ = id => document.getElementById(id);

/* ---------------- data ---------------- */
async function load(){
  try{
    const res = await fetch(JSON_URL, { cache:'no-store' });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const raw  = await res.json();
    const list = Array.isArray(raw) ? raw : (raw.rules || Object.values(raw));
    tense = (Array.isArray(list)?list:Object.values(list))
              .find(t => t.id === CATEGORY+'-'+TENSE);
    if(!tense) throw new Error('tense not found');
    useCases = tense.useCases || [];
  }catch(e){
    console.error(e);
    $('sections').innerHTML = '<div class="msg">Couldn\'t load the tense data.<br>'+
      'Looked for '+JSON_URL+'</div>';
    return;
  }
  if(START !== null && useCases[START]) openSection(START);
  else showSections();
}

/* ---------------- text ---------------- */
function esc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

function mark(sentence, markers){
  if(!markers || !markers.length) return sentence;
  let out = sentence;
  markers.slice().sort((a,b)=>b.length-a.length).forEach(m=>{
    out = out.replace(new RegExp('\\b('+esc(m)+')\\b','i'), '<b>$1</b>');
  });
  return out;
}

const TIME_RE = /\b((?:every|each|this|next|last)\s+\w+|on\s+\w+days?|in\s+the\s+\w+|at\s+\d[\d:.]*\s*(?:am|pm)?|at\s+(?:night|noon|midnight|dawn|dusk|weekends?)|since\s+[\w\s]{1,12}?|for\s+\w+\s*\w*|all\s+\w+|when|while|before|after|until|as\s+soon\s+as|yet|just|already|never|ever|always|usually|often|sometimes|rarely|nowadays|recently|lately|currently|tomorrow|tonight|yesterday|today|now)\b/i;

function cueFor(sentence, uc){
  const ms = (uc.timeMarkers||[]).slice().sort((a,b)=>b.length-a.length);
  for(const m of ms){
    const hit = sentence.match(new RegExp('\\b('+esc(m)+'[\\w\\s]{0,10}?)(?=[,.!?]|$)','i'));
    if(hit) return hit[1].trim().replace(/\s+/g,' ');
    if(new RegExp('\\b'+esc(m)+'\\b','i').test(sentence)) return m;
  }
  const g = sentence.match(TIME_RE);
  if(g) return g[1];
  return sentence.split(/\s+/).slice(0,2).join(' ').replace(/[,.!?]$/,'');
}

/* ---------------- sections list ---------------- */
function showSections(){
  secIdx = null;
  $('play').classList.remove('on');
  $('sections').style.display = '';
  $('back').style.visibility = 'hidden';
  $('title').textContent = tense.name || '';
  $('count').innerHTML = '<b>'+cleared.size+'</b> / '+useCases.length;

  $('sections').innerHTML =
    '<div class="lede">Choose a use &middot; tap a node to read it</div>' +
    useCases.map((uc,i) => {
      const n = 1 + (uc.moreExamples||[]).length;
      const cue = cueFor(uc.mainExample, uc);
      return '<button class="sec'+(cleared.has(i)?' done':'')+'" data-i="'+i+'" type="button">'+
               '<span class="txt">'+
                 '<span class="nm">'+uc.title+'</span>'+
                 '<span class="mt">'+n+' cards &middot; <em>'+cue+'</em></span>'+
               '</span>'+
               '<span class="tick">'+(cleared.has(i)?'&#10003;':'')+'</span>'+
             '</button>';
    }).join('');

  $('sections').querySelectorAll('.sec').forEach(b => {
    b.onclick = () => openSection(+b.dataset.i);
  });
}

function openSection(i){
  secIdx = i;
  const uc = useCases[i];
  cards = [uc.mainExample].concat(uc.moreExamples||[]).slice(0,6).map(s => ({
    text: s, cue: cueFor(s, uc), markers: uc.timeMarkers||[], note: uc.note||''
  }));
  visited = new Set(); openIdx = null;

  $('sections').style.display = 'none';
  $('play').classList.add('on');
  $('back').style.visibility = 'visible';
  $('back').textContent = START !== null ? '\u2190 List' : '\u2190 Sections';
  $('title').textContent = uc.title;
  buildMap();
}

/* ---------------- map ---------------- */
function buildMap(){
  $('count').innerHTML = '<b>'+visited.size+'</b> / '+cards.length;

  // Each card sits an offset off whatever the curve is doing at that
  // height — so cards stay "attached" to the line's wander instead of
  // the line drifting away from a fixed column. The offset is expressed
  // in viewBox units (0-100), but the cards themselves are a FIXED pixel
  // size (font-size/padding are in px/rem, not %). On a wide desktop
  // frame (~760px), 14 units ≈ 106px — plenty of clearance. On a narrow
  // phone (~370px), the same 14 units is only ≈50px — less than half a
  // card's own width — so the card visually crosses the line. Scaling
  // the offset by the container's real pixel width keeps the pixel
  // clearance roughly constant across screen sizes.
  const mapWidthPx = $('map').clientWidth || 760;
  // Pills sit CLOSE to the wave — a small offset, so the pill visually
  // hugs the spine (matches the reference: pill centre sits only ~6% of
  // the canvas width off true centre).
  const PIXEL_CLEARANCE = 46;
  const OFFSET = Math.max(8, Math.min(18, PIXEL_CLEARANCE / mapWidthPx * 100));
  // Captions sit FAR from the wave — roughly 4x the pill's offset, so
  // definitions read as clearly separate from the spine (reference:
  // caption centre sits ~23% of canvas width off true centre).
  const PIXEL_STEM = 150; // the stem length that looked right on desktop
  const STEM_LEN = Math.max(30, Math.min(46, PIXEL_STEM / mapWidthPx * 100));
  const CAP_GAP = 0.4; // minimal on purpose: dot should sit almost touching the caption text

  // Pill centre: fixed distance either side of x=50, same on every row.
  const pillXs = NODE_LAYOUT.map(n => n.capSide === 'right' ? 50 - OFFSET : 50 + OFFSET);
  const dirs   = NODE_LAYOUT.map(n => n.capSide === 'right' ? 1 : -1);
  // Connector dot: fixed offset from its own pill — never from the curve.
  // These six points are the wave's anchors; the curve is drawn to pass
  // through them, not solved for afterward, so it can't drift off them.
  const dots = NODE_LAYOUT.map((n,i) => ({ x: pillXs[i] + dirs[i]*STEM_LEN, y: n.y }));

  // Smooth "S" path threading through the six fixed dots. This first
  // paint happens before any pill has actually rendered, so there's no
  // real geometry yet to wrap the ends around — that's done in the RAF
  // pass below, once pill positions are known. This is just a plain
  // placeholder shape for the split-second before that.
  let d = 'M '+dots[0].x+' '+dots[0].y;
  for(let i=1;i<dots.length;i++){
    const a = dots[i-1], b = dots[i], my = (a.y+b.y)/2;
    d += ' C '+a.x+' '+my+', '+b.x+' '+my+', '+b.x+' '+b.y;
  }

  let svg = '<path class="road" d="'+d+'"/>';
  cards.forEach((_,i) => {
    const n = NODE_LAYOUT[i], px = pillXs[i], dot = dots[i];
    const x1 = px + dirs[i]*11;
    svg += '<line class="stem" data-i="'+i+'" x1="'+x1+'" y1="'+n.y+'" x2="'+dot.x+'" y2="'+n.y+'"/>'+
           '<circle class="dot" data-i="'+i+'" cx="'+dot.x+'" cy="'+n.y+'" r="0.46"/>';
  });
  $('mapPath').innerHTML = svg;

  $('nodes').innerHTML = cards.map((c,i) => {
    const n = NODE_LAYOUT[i], px = pillXs[i], dot = dots[i];
    const seen = visited.has(i);
    const tone = PALETTE[i%PALETTE.length];
    // Circle sits at the OUTER end of the pill (away from the spine); the
    // rect's flat fused edge faces inward, toward the stem/road, matching
    // the sketch where the line continues out of the rectangle, not the circle.
    const circleRight = px >= 50;
    // Caption sits opposite the pill, starting just past the connector dot.
    const capFrom = n.capSide === 'right' ? dot.x + CAP_GAP : 3;
    const capTo   = n.capSide === 'right' ? 97 : dot.x - CAP_GAP;
    return '<div class="node" style="top:'+n.y+'%">'+
      '<button class="pill'+(seen?' seen':'')+(circleRight?' circle-right':'')+'" data-i="'+i+'" '+
        'style="left:'+px+'%">'+
        '<span class="circle" style="background:'+tone.bg+';color:'+tone.fg+'"><span class="num">'+(i+1)+'</span><span class="chk">&#10003;</span></span>'+
        '<span class="rect" style="background:'+tone.bg+';color:'+tone.fg+'">'+c.cue+'</span>'+
      '</button>'+
      '<div class="cap '+n.capSide+'" style="left:'+capFrom+'%;right:'+(100-capTo)+'%">'+
        '<div class="ct">'+c.cue+'</div>'+
        '<div class="cs">'+mark(c.text, c.markers)+'</div>'+
      '</div>'+
    '</div>';
  }).join('');

  $('nodes').querySelectorAll('.pill').forEach(b => {
    b.onclick = () => openNode(+b.dataset.i);
  });

  // Cue cards were auto-sizing to their own text, so shorter labels ("AT
  // 7PM") looked noticeably smaller than longer ones ("IN THE EVENING").
  // Measure every rect's natural width first, then lock them all to the
  // widest one so every card in the section reads as the same size.
  requestAnimationFrame(() => {
    const rects = $('nodes').querySelectorAll('.pill .rect');
    let maxW = 0;
    rects.forEach(r => { r.style.width = ''; maxW = Math.max(maxW, r.offsetWidth); });
    rects.forEach(r => { r.style.width = maxW + 'px'; });

    // The wave (the curved "road" spine) is pulled in to sit right
    // against each pill's real rendered edge — half the previous gap —
    // and terminates in a small dot at the very top and bottom instead
    // of looping around the first/last pill. The little connector dot
    // sits ~8mm off each definition's real edge, at the far end of the
    // straight stem — and that stem now starts at the wave's own anchor
    // point, not at the pill, so the pill-to-wave gap reads as a single
    // clean span instead of two overlapping lines. Only positions
    // move here; the banners and the caption text itself stay exactly
    // where NODE_LAYOUT/pillXs/CAP_GAP put them.
    const PILL_GAP_PX = 5 * 96 / 25.4; // 5mm, wave-to-banner (halved from 10mm)
    const CAP_GAP_PX  = 2 * 96 / 25.4; // 2mm, dot-to-definition — minimal padding
    const mapRect = $('map').getBoundingClientRect();
    const capEls = $('nodes').querySelectorAll('.cap');
    const toPctX = px => px / mapRect.width * 100;
    const toPctY = py => py / mapRect.height * 100;

    const tightDots = dots.map((dot,i) => {
      const pillEl = $('nodes').querySelector('.pill[data-i="'+i+'"]');
      const dir = dirs[i];
      const pRect = pillEl.getBoundingClientRect();
      const edgePx = dir > 0 ? (pRect.right - mapRect.left) : (pRect.left - mapRect.left);
      const gapPct = toPctX(PILL_GAP_PX);
      return { x: toPctX(edgePx) + dir*gapPct, y: dot.y };
    });

    // Far end of each stem: sits just short of the caption's own real
    // edge (on the wave side of it), 8mm off.
    const capDots = dots.map((dot,i) => {
      const dir = dirs[i];
      const cRect = capEls[i].getBoundingClientRect();
      const capEdgePx = dir > 0 ? (cRect.left - mapRect.left) : (cRect.right - mapRect.left);
      const gapPct = toPctX(CAP_GAP_PX);
      return { x: toPctX(capEdgePx) - dir*gapPct, y: dot.y };
    });

    $('nodes').querySelectorAll('.pill').forEach(pillEl => {
      const i = +pillEl.dataset.i;
      const stemLine = $('mapPath').querySelector('.stem[data-i="'+i+'"]');
      const dotEl    = $('mapPath').querySelector('.dot[data-i="'+i+'"]');
      if(stemLine){
        // Starts at the wave itself, not the banner.
        stemLine.setAttribute('x1', tightDots[i].x);
        stemLine.setAttribute('x2', capDots[i].x);
      }
      if(dotEl) dotEl.setAttribute('cx', capDots[i].x);
    });

    // The road threads through all six tight anchors. Each segment's
    // bezier control points share their anchor's x-coordinate, which
    // means the curve actually enters/leaves every anchor moving
    // vertically — not along the diagonal toward the next anchor. So
    // the tail extension has to continue in that same vertical
    // direction, or it kinks into a visible spike instead of reading as
    // one smooth line.
    const TAIL_LEN = 6; // how far past the first/last anchor the tail extends, in viewBox units

    const a0 = tightDots[0];
    const topExt = { x: a0.x, y: a0.y - TAIL_LEN };

    const aLast = tightDots[tightDots.length-1];
    const bottomExt = { x: aLast.x, y: aLast.y + TAIL_LEN };

    let td = 'M '+topExt.x+' '+topExt.y+' L '+a0.x+' '+a0.y;
    for(let i=1;i<tightDots.length;i++){
      const a = tightDots[i-1], b = tightDots[i], my = (a.y+b.y)/2;
      td += ' C '+a.x+' '+my+', '+b.x+' '+my+', '+b.x+' '+b.y;
    }
    td += ' L '+bottomExt.x+' '+bottomExt.y;

    const roadEl = $('mapPath').querySelector('.road');
    if(roadEl) roadEl.setAttribute('d', td);

    // Terminal end-caps: a small dot at the tip of each straight tail.
    const mapSvg = $('mapPath');
    let endCaps = mapSvg.querySelector('.endCaps');
    if(!endCaps){
      endCaps = document.createElementNS('http://www.w3.org/2000/svg','g');
      endCaps.setAttribute('class','endCaps');
      mapSvg.appendChild(endCaps);
    }
    endCaps.innerHTML =
      '<circle class="dot" cx="'+topExt.x+'" cy="'+topExt.y+'" r="0.46"/>'+
      '<circle class="dot" cx="'+bottomExt.x+'" cy="'+bottomExt.y+'" r="0.46"/>';
  });
}

function openNode(i){
  openIdx = i;
  const c = cards[i];
  if(!visited.has(i)){
    visited.add(i);
    $('nodes').querySelector('.pill[data-i="'+i+'"]').classList.add('seen');
    $('count').innerHTML = '<b>'+visited.size+'</b> / '+cards.length;
    if(visited.size === cards.length) cleared.add(secIdx);
  }
  $('modalCard').innerHTML =
    '<button class="x" id="modalClose" type="button">&#10005;</button>'+
    '<div class="kick">'+(tense.name||'')+'</div>'+
    '<div class="cue display">'+c.cue+'</div>'+
    '<div class="sentence">'+mark(c.text, c.markers)+'</div>'+
    (c.note ? '<div class="note">'+c.note+'</div>' : '');
  $('modalWrap').classList.add('open');
  $('modalClose').onclick = closeModal;
}
function closeModal(){
  $('modalWrap').classList.remove('open');
  openIdx = null;
}
$('backdrop').onclick = closeModal;

/* ---------------- chrome ---------------- */
function leave(){
  if(START !== null){
    if(window.parent !== window) parent.postMessage({ intuity:'showList' }, '*');
    else showSections();
  } else showSections();
}
$('back').onclick = leave;

document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ if($('modalWrap').classList.contains('open')) closeModal(); else if(secIdx!==null) leave(); }
});

let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if(secIdx !== null) buildMap(); }, 150);
});

load();
</script>
</body>
</html>
