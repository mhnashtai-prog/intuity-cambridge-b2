<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INTUITY - Tenses Practice</title>
  <style>
/* ── INTUITY light scheme — same tokens as tenses-rules.html ── */
:root{
  --screen:#FAF7F2; --card:#FFFFFF;
  --sentence:#3A3A38; --dim:#5C5852; --faint:#7A7570;
  --rule:#D2CEC2; --edge:#8F8574;
  --ink:#232C31;          /* titles — cool dark */
  --sentence:#4A433D;     /* body — warm dark */
  --target:#AC5A3E;       /* THE GRAMMAR: key words, corrections */
  --topic-ink:#AC5A3E;    /* alias */
  --filled:#AC5A3E;       /* alias */
  --faint:#7A6F73;
  --live:#97B1D2;         /* a slot holding an unmarked answer — on the LINE */
  --ok:#4A6B5C; --no:#A23B2C;
}

    * { margin: 0; padding: 0; box-sizing: border-box; }
  
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
      background: var(--screen);
      min-height: 100vh;
      color: var(--sentence);
      /* No top padding. A sticky element with space above it inside the
         scrolling box snaps upward by exactly that amount the moment it
         sticks — which is the jump you see. The pinned block carries its own
         top padding instead, so nothing moves. */
      padding: 0 0.5rem 0.5rem;
      -webkit-font-smoothing: antialiased;
    }
    
    .container { 
      max-width: 45rem;   /* the quiz column: 720px */ 
      margin: 0 auto;
      padding: 0 1rem;
    }
    
    /* COMPACT TEST SELECTOR */
    /* Sticky, not scrolling: on Explore the tense selector is fixed and never
       leaves the screen, and a student should always be able to see — and
       change — which set they are in. Inside an iframe the body scrolls, so
       sticky is the equivalent of the host's fixed header. */
    .test-selector {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--screen);
      padding-top: 0.5rem;
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 1rem;
      padding-bottom: .8rem;
      border-bottom: 1px solid var(--rule);
    }
    
    .test-btn {
      padding: 0.375rem 0.625rem;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      border-radius: 0;
      color: var(--faint);
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 500;
      transition: all 0.2s ease;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    
    .test-btn:hover {
      color: var(--topic-ink);
      border-bottom-color: var(--rule);
    }
    
    .test-btn.active {
      color: var(--topic-ink);
      border-bottom-color: var(--topic-ink);
      font-weight: 600;
    }
    
    /* No panel. The quiz has none, and a rounded card around the whole page
       was the loudest difference between the three modes. */
    .content-container {
      background: none;
      border: none;
      border-radius: 0;
      padding: 0 0 2.5rem;
    }
    
    /* COMPACT QUESTION CARDS */
    /* No card. Space separates the items; a panel around each one was
       furniture the page did not need. */
    .question-card {
      background: none;
      border: none;
      border-radius: 0;
      padding: 0;
      margin-bottom: 1.5rem;
    }
    
    /* Orange circle marking position, as in the quiz. It never changes state
       — the strip's dots carry progress, so each mark does one job. */
    .q-row { display: flex; align-items: flex-start; gap: 0.62rem; }
    .q-body { flex: 1; min-width: 0; }

    .q-number {
      flex-shrink: 0;
      /* Whole pixels, not rem. 1.15rem = 18.4px and 0.62rem = 9.92px, so both
         the circle and the numeral landed on fractional boundaries and the
         glyph was smeared across two device pixels. 20px/11px sit on the
         grid, and the fixed line-height stops flex centring from
         reintroducing a half-pixel offset. */
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #DD8E58;
      color: #333333;
      font-size: 11px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 20px;
      text-align: center;
      -webkit-font-smoothing: antialiased;
      margin-top: 2px;
    }

    /* Instruction left, dots right — the quiz's strip, same proportions. */
    /* NOT pinned. It is rendered inside contentContainer, so it cannot share a
       sticky wrapper with the selector above it — and pinning it separately
       meant guessing the selector's height, which is what made the quiz jitter
       when the tabs wrapped to two rows. */
    .practice-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: .95rem;
      padding-bottom: .45rem;
      border-bottom: 1px solid var(--rule);
    }
    .practice-instruction {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--faint);
    }
    .practice-tally {
      font-variant-numeric: tabular-nums;
      font-size: .7rem;
      color: #B3AAA2;
      margin-left: .55rem;
    }
    .practice-dots { display: flex; gap: 0.42rem; align-items: center; }
    .practice-dot {
      width: 0.62rem;
      height: 0.62rem;
      border-radius: 50%;
      background: none;
      box-shadow: inset 0 0 0 1.5px #C9BFB2;
      transition: background .3s ease, box-shadow .3s ease;
    }
    .practice-dot.answered {
      background: #DD8E58;
      box-shadow: inset 0 0 0 1.5px #DD8E58;
    }

    /* The key word is the grammar being taught — brick, as everywhere else. */
    .keyword {
      color: var(--target);
      font-size: 0.875rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-align: left;
      margin: 0.625rem 0 0.375rem 0;
      display: block;
    }
    
    /* COMPACT SENTENCES */
    /* The source sentence is READ, not filled in. It had the same beige box
       as the input below it, so both said "here is a field". A left rule
       marks it as quoted, matching Explore. */
    .sentence1 {
      color: var(--sentence);
      font-size: 0.875rem;
      margin-bottom: 0.55rem;
      line-height: 1.5;
      padding: 0.1rem 0 0.1rem 0.75rem;
      background: none;
      border-radius: 0;
      border-left: 2px solid var(--rule);
    }

    .sentence2-wrapper {
      margin-top: 0;
    }

    .sentence2 {
      color: var(--sentence);
      font-size: 0.875rem;
      line-height: 1.5;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.25rem;
    }

    .sentence2-part {
      display: inline;
    }

    /* INLINE INPUT - AUTO-EXPANDING */
    /* A rule, not a box — the printed-paper convention. Padding stays so the
       tap target survives the border's removal. */
    .answer-input {
      min-width: 6em;
      max-width: 250px;
      width: auto;
      padding: 0.3rem 0.15rem;
      background: none;
      border: none;
      border-bottom: 2px solid var(--edge);
      border-radius: 0;
      color: var(--sentence);
      font-weight: 600;
      font-size: 0.875rem;
      font-family: inherit;
      text-align: center;
      outline: none;
      transition: border-color .2s ease, border-width .2s ease;
      display: inline-block;
    }
    .answer-input::placeholder { color: #B8AFA4; font-weight: 400; }

    /* Focus changes shape as well as colour. */
    .answer-input:focus {
      background: none;
      box-shadow: none;
      border-bottom: 3px solid var(--target);
    }
    /* Holding an unmarked answer: blue on the LINE, word stays in ink. */
    .answer-input.has-value { border-bottom-color: var(--live); }

    /* Marking follows the classroom: only what is wrong is marked. */
    .answer-input.correct {
      background: none;
      color: var(--sentence);
      border-bottom: 1px solid var(--rule);
    }
    .answer-input.incorrect {
      background: none;
      color: var(--no);
      border-bottom: 2px solid var(--no);
      text-decoration: line-through;
      text-decoration-thickness: 1px;
    }

    /* MINIMAL FEEDBACK */
    /* No panel: the correction is a line of text under the sentence. */
    .feedback {
      margin-top: 0.45rem;
      padding: 0 0 0 0.75rem;
      border-radius: 0;
      font-size: 0.8125rem;
      display: none;
    }

    .feedback.show {
      display: block;
    }

    /* A right answer is left alone — the absence of a mark is the feedback,
       exactly as it is on paper. */
    .feedback.correct { display: none !important; }

    .feedback.incorrect {
      background: none;
      border: none;
      border-left: 2px solid var(--no);
      color: var(--no);
    }

    .feedback-label {
      font-weight: 700;
      margin-bottom: 0.25rem;
      font-size: 0.6875rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* The correction is the grammar being taught, so it is brick. */
    .feedback-answer {
      color: var(--target);
      color: var(--sentence);
      font-style: italic;
      font-size: 0.8125rem;
    }

    /* STICKY ACTION BAR */
    .action-bar {
      position: sticky;
      bottom: 0;
      background: var(--screen);
      
      border-top: 1px solid var(--rule);
      padding: 0.75rem;
      display: flex;
      justify-content: center;
      gap: 0.625rem;
      z-index: 100;
    }

    .action-btn {
      padding: 0.55rem 1.15rem;
      border-radius: 999px;
      font-size: 0.8125rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid transparent;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Outlined, not filled: CLEAR is a quiet option, CHECK is the action. */
    .action-btn.secondary {
      background: none;
      color: var(--faint);
      border-color: var(--rule);
    }
    .action-btn.secondary:hover {
      background: none;
      color: var(--sentence);
      border-color: var(--edge);
    }

    .action-btn.primary {
      background: var(--target);
      color: #FFFFFF;
      border-color: var(--target);
      box-shadow: none;
    }
    .action-btn.primary:hover { background: #8F4E38; border-color: #8F4E38; }

    /* COMPACT SCORE */
    .score-banner {
      background: none;
      border: none;
      border-top: 1px solid var(--rule);
      border-radius: 0.625rem;
      padding: 0.75rem;
      margin-bottom: 0.75rem;
      text-align: center;
    }

    .score-text {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--topic-ink);
      margin-bottom: 0.25rem;
    }

    .score-label {
      font-size: 0.75rem;
      color: var(--faint);
    }
    
    .loading, .error {
      text-align: center;
      padding: 2rem;
      color: var(--faint);
      font-size: 0.875rem;
    }
    
    .error {
      color: var(--topic-ink);
    }

    /* MOBILE OPTIMIZATIONS */
    @media (max-width: 640px) {
      body {
        padding: 0.375rem;
      }

      .test-btn {
        font-size: 0.625rem;
        padding: 0.1875rem 0.4375rem;
      }

      .question-card {
        padding: 0.625rem;
        margin-bottom: 0.5rem;
      }

      .sentence1, .sentence2 {
        font-size: 0.8125rem;
      }

      .action-bar {
        padding: 0.625rem 0.5rem;
      }

      .action-btn {
        padding: 0.5rem 1rem;
        font-size: 0.75rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="content-container">
      <div class="test-selector" id="testSelector"></div>
      
      <div id="contentContainer">
        <div class="loading">Loading exercises...</div>
      </div>
    </div>
  </div>

  <div class="action-bar" id="actionBar" style="display: none;">
    <button class="action-btn secondary" onclick="clearAnswers()">Clear</button>
    <button class="action-btn primary" onclick="checkAnswers()">Check</button>
  </div>

    <script>
let allTests = [];
let currentTest = 0;
let isChecked = false;
let testScores = {};

// Load saved scores from localStorage on startup
function loadSavedScores() {
  try {
    const saved = localStorage.getItem('tenses_practice_scores');
    if (saved) {
      testScores = JSON.parse(saved);
    }
  } catch (e) {
    console.error('Error loading saved scores:', e);
  }
}

// Save scores to localStorage
function saveScores() {
  try {
    localStorage.setItem('tenses_practice_scores', JSON.stringify(testScores));
  } catch (e) {
    console.error('Error saving scores:', e);
  }
}

/* Two shapes exist. Conditionals was merged into one file per topic with a
   `practice` key; tenses was not — its practice sets are still in their own
   file, and tenses-data.json holds only `rules`. Reading .practice from it
   returned undefined, so the page rendered nothing at all: not a 404, an
   empty result. Try the merged file first, then the standalone one. */
const PRACTICE_SOURCES = [
  '../../data/grammar-rules/tenses-data.json',
  '../../data/grammar-rules/tenses-practice.json'
];

async function fetchPractice(){
  let lastErr = null;
  for(const url of PRACTICE_SOURCES){
    try{
      const res = await fetch(url, { cache:'no-store' });
      if(!res.ok){ lastErr = new Error('HTTP '+res.status); continue; }
      const raw = await res.json();
      // merged file -> raw.practice ; standalone file -> the array itself
      const sets = Array.isArray(raw) ? raw : raw.practice;
      if(Array.isArray(sets) && sets.length) return sets;
      lastErr = new Error('no practice sets in ' + url.split('/').pop());
    }catch(e){ lastErr = e; }
  }
  throw lastErr || new Error('no practice data found');
}

async function loadData() {
  try {
    const data = await fetchPractice();

    allTests = data.map(section => ({
      title: section.title,
      transformations: section.transformations
    }));
    
    loadSavedScores(); // Load saved scores
    
    renderTestSelector();
    loadTest(0);
    
  } catch (error) {
    console.error('Error loading data:', error);
    document.getElementById('contentContainer').innerHTML = `
      <div class="error">
        <div style="font-size: 1.5rem; margin-bottom: 0.5rem;">⚠️</div>
        <div>Failed to load exercises</div>
        <div style="font-size: 0.6875rem; margin-top: 0.375rem;">${error.message}</div>
      </div>
    `;
  }
}


/* ── selector lives in the HOST header ──
   Explore keeps every navigation control in one fixed header. These pages
   had their selector inside the scrolling frame instead, which gave them a
   second band and a different scroll behaviour. Now the frame reports its
   tests upward and the host renders them beside the mode buttons; clicks
   come back down. The frame owns the content, the header owns navigation. */
const EMBEDDED = window.parent !== window;

function publishTests() {
  if (!EMBEDDED) return;
  parent.postMessage({
intuity: 'tests',
titles: allTests.map(function (t) { return t.title; }),
active: currentTest
  }, '*');
}

window.addEventListener('message', function (e) {
  if (e.data && e.data.intuity === 'setTest') loadTest(e.data.index);
});

function renderTestSelector() {
  publishTests();
  const sel = document.getElementById('testSelector');
  if (EMBEDDED) { sel.style.display = 'none'; return; }
  const selector = document.getElementById('testSelector');
  selector.innerHTML = '';
  
  allTests.forEach((test, index) => {
    const btn = document.createElement('button');
    btn.className = 'test-btn' + (index === currentTest ? ' active' : '');
    btn.textContent = test.title;
    
    // Add score indicator if test has been completed
    const scoreKey = `test${index}`;
    if (testScores[scoreKey]) {
      const score = testScores[scoreKey];
      btn.textContent = `${test.title} (${score.percentage}%)`;
    }
    
    btn.onclick = () => loadTest(index);
    selector.appendChild(btn);
  });
}

function loadTest(index) {
  currentTest = index;
  isChecked = false;
  renderTestSelector();
  
  const test = allTests[index];
  const container = document.getElementById('contentContainer');

  /* Instruction left, dots right — the quiz's strip. The dots are the only
     thing that changes as you work; the circles beside each question mark
     position and stay put. */
  let html = '<div class="practice-strip">' +
             '<span class="practice-instruction">Complete the second sentence' +
             '<span class="practice-tally" id="practiceTally">0/' +
             allTests[index].transformations.length + '</span></span>' +
             '<span class="practice-dots" id="practiceDots"></span>' +
             '</div>';
  
  test.transformations.forEach((transformation, idx) => {
    const inputId = `input-${idx}`;
    const feedbackId = `feedback-${idx}`;
    
    const parts = transformation.sentence2.split('_____');
    
    html += `
      <div class="question-card">
       <div class="q-row">
        <div class="q-number">${idx + 1}</div>
        <div class="q-body">
        <div class="sentence1">${transformation.sentence1}</div>
        <div class="sentence2-wrapper">
          <div class="keyword">${transformation.keyWord.toUpperCase()}</div>
          <div class="sentence2">
            ${parts[0] ? `<span class="sentence2-part">${parts[0]}</span>` : ''}<input 
              type="text" 
              class="answer-input" 
              id="${inputId}"
              data-answer="${transformation.answer}"
              data-alternatives='${JSON.stringify(transformation.alternativeAnswers)}'
              placeholder="..."
              oninput="this.classList.toggle('has-value', !!this.value); autoExpandInput('${inputId}'); renderPracticeDots()"
              size="10"
            />${parts[1] ? `<span class="sentence2-part">${parts[1]}</span>` : ''}
          </div>
        </div>
        <div class="feedback" id="${feedbackId}">
          <div class="feedback-label"></div>
          <div class="feedback-answer"></div>
        </div>
        </div><!-- /.q-body -->
       </div><!-- /.q-row -->
      </div>
    `;
  });
  
  container.innerHTML = html;
  renderPracticeDots();
  document.getElementById('actionBar').style.display = 'flex';
}

/* One dot per question, filled once that question has an answer. */
function renderPracticeDots() {
  const wrap = document.getElementById('practiceDots');
  if (!wrap) return;
  const test = allTests[currentTest];
  if (!test) return;
  let done = 0;
  wrap.innerHTML = test.transformations.map(function (_, idx) {
    const el = document.getElementById('input-' + idx);
    const filled = el && el.value.trim() !== '';
    if (filled) done++;
    return '<span class="practice-dot' + (filled ? ' answered' : '') + '"></span>';
  }).join('');
  const tally = document.getElementById('practiceTally');
  if (tally) tally.textContent = done + '/' + test.transformations.length;
}

function autoExpandInput(inputId) {
  const input = document.getElementById(inputId);
  const value = input.value.trim();
  
  if (value) {
    const textWidth = value.length * 9;
    input.style.width = Math.min(Math.max(textWidth + 20, 80), 250) + 'px';
  } else {
    input.style.width = '80px';
  }
}

function normalizeAnswer(answer) {
  return answer.toLowerCase()
    .trim()
    .replace(/\s+/g, ' ')
    .replace(/'/g, '')
    .replace(/'/g, '');
}

function checkAnswers() {
  const test = allTests[currentTest];
  let correct = 0;
  let total = test.transformations.length;
  
  test.transformations.forEach((transformation, idx) => {
    const input = document.getElementById(`input-${idx}`);
    const feedback = document.getElementById(`feedback-${idx}`);
    const userAnswer = normalizeAnswer(input.value);
    const correctAnswer = normalizeAnswer(input.dataset.answer);
    const alternatives = JSON.parse(input.dataset.alternatives);
    
    const isCorrect = userAnswer === correctAnswer || 
                      alternatives.some(alt => normalizeAnswer(alt) === userAnswer);
    
    feedback.classList.add('show');
    
    if (isCorrect) {
      input.classList.add('correct');
      feedback.classList.add('correct');
      feedback.querySelector('.feedback-label').textContent = '✓ Correct';
      correct++;
    } else {
      input.classList.add('incorrect');
      feedback.classList.add('incorrect');
      feedback.querySelector('.feedback-label').textContent = '✗ Incorrect';
      feedback.querySelector('.feedback-answer').textContent = `Answer: "${input.dataset.answer}"`;
    }
    
    input.readOnly = true;
  });
  
  isChecked = true;
  
  const percentage = Math.round((correct / total) * 100);
  
  // Save score to localStorage
  const scoreKey = `test${currentTest}`;
  testScores[scoreKey] = {
    correct,
    total,
    percentage,
    timestamp: new Date().toISOString()
  };
  saveScores();
  
  const scoreHtml = `
    <div class="score-banner">
      <div class="score-text">${correct}/${total}</div>
      <div class="score-label">${percentage}% Correct</div>
    </div>
  `;
  
  const container = document.getElementById('contentContainer');
  container.insertAdjacentHTML('afterbegin', scoreHtml);
  
  const actionBar = document.getElementById('actionBar');
  actionBar.innerHTML = `
    <button class="action-btn secondary" onclick="clearAnswers()">Retry</button>
    <button class="action-btn primary" onclick="showAnswers()">Answers</button>
  `;
  
  // Update test selector to show new score
  renderTestSelector();
  
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showAnswers() {
  const test = allTests[currentTest];
  
  test.transformations.forEach((transformation, idx) => {
    const input = document.getElementById(`input-${idx}`);
    const feedback = document.getElementById(`feedback-${idx}`);
    
    if (input.classList.contains('incorrect')) {
      input.value = input.dataset.answer;
      input.classList.remove('incorrect');
      input.classList.add('correct');
      feedback.classList.remove('incorrect');
      feedback.classList.add('correct');
      feedback.querySelector('.feedback-label').textContent = '✓ Answer';
      feedback.querySelector('.feedback-answer').textContent = '';
      autoExpandInput(`input-${idx}`);
    }
  });
}

function clearAnswers() {
  const scoreBanner = document.querySelector('.score-banner');
  if (scoreBanner) scoreBanner.remove();
  
  const test = allTests[currentTest];
  test.transformations.forEach((transformation, idx) => {
    const input = document.getElementById(`input-${idx}`);
    const feedback = document.getElementById(`feedback-${idx}`);
    
    input.value = '';
    input.style.width = '80px';
    input.classList.remove('correct', 'incorrect');
    input.readOnly = false;
    feedback.classList.remove('show', 'correct', 'incorrect');
  });
  
  isChecked = false;
  
  const actionBar = document.getElementById('actionBar');
  actionBar.innerHTML = `
    <button class="action-btn secondary" onclick="clearAnswers()">Clear</button>
    <button class="action-btn primary" onclick="checkAnswers()">Check</button>
  `;
  
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

window.addEventListener('load', loadData);
</script>
</body>
</html>
