<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INTUITY - Tenses Practice</title>
  <!-- The quiz runs in an iframe, which is a separate document and inherits
       nothing from the host — so it loads the fonts and the shell itself.
       Shared assets all live in data/grammar-rules/, beside gapfill.css and
       gapfill.js. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=2">
  <style>
/* ═══════════════════════════════════════════════════════════════════════
   PRACTICE — key-word transformation.

   Tokens, base, the tile family and the close control come from the shell.
   This file used to carry its own :root that CLAIMED to be "the same tokens
   as tenses-rules.html" and was not: --rule was #D2CEC2 against the games'
   #BCB1A0, --sentence and --faint were each declared twice (so the first of
   each was dead), and the body ran -apple-system while every other mode ran
   Space Grotesk. That is why Practice read as a different app.
   ═══════════════════════════════════════════════════════════════════════ */

:root{
  /* the only token this page owns: an unmarked answer, shown ON THE LINE */
  --live:var(--typed);
  --no:var(--wrong);          /* the script and older rules say --no */
  --topic-ink:var(--target);  /* legacy aliases, kept so nothing breaks */
  --filled:var(--target);
}

body{
  font-family:var(--f-body);
  background:var(--screen);
  color:var(--sentence);
  /* The frame is the scroller. min-height:100vh inside an iframe measures the
     WINDOW, not the frame, so the body was taller than its own viewport
     before a single sentence was added — which is why the flick died on the
     first drag. height:100% measures the frame. */
  height:100%;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  /* No top padding. A sticky element with space above it inside the scrolling
     box snaps upward by exactly that amount the moment it sticks — which is
     the jump you see. The pinned block carries its own top padding instead. */
  padding:0 .5rem .5rem;
  overflow-y:auto;
}
.container{max-width:720px;margin:0 auto;padding:0 1rem}
/* No panel. The quiz has none, and a rounded card around the whole page was
   the loudest difference between the three modes. */
.content-container{background:none;border:none;border-radius:0;padding:0 0 2.5rem}

/* ── TEST TABS ───────────────────────────────────────────────────────────
   The shell's .vtab, identical to the Quiz's row and to the row the host
   draws in its own header. Those three sit inches apart, so any difference
   between them was visible.
   Sticky, not scrolling: inside an iframe the body scrolls, so sticky is the
   equivalent of the host's fixed header, and a student should always be able
   to see — and change — which set they are in. */
.test-selector{position:sticky;top:0;z-index:20;background:var(--screen);
  display:flex;gap:.3rem;justify-content:center;flex-wrap:wrap;
  padding-top:.5rem;padding-bottom:.8rem;margin-bottom:1rem;
  border-bottom:1px solid var(--rule)}
.test-btn{font-family:var(--f-display);font-size:.58rem;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;padding:.26rem .62rem;
  border:none;border-radius:var(--r-chip);background:none;color:var(--faint);
  white-space:nowrap;cursor:pointer;transition:color .2s,background .15s}
.test-btn:hover{color:var(--sentence);background:rgba(43,33,41,.04)}
.test-btn.active{color:var(--tile-ink);font-weight:700;background:var(--tile-bg)}

/* ── ITEMS ───────────────────────────────────────────────────────────────
   No card. Space separates the items; a panel around each was furniture. */
.question-card{background:none;border:none;border-radius:0;padding:0;margin-bottom:1.5rem}
.q-row{display:flex;align-items:flex-start;gap:.62rem}
.q-body{flex:1;min-width:0}

/* Marks POSITION and never changes state — the strip's dots carry progress,
   so each mark does one job. Now a tile rather than an orange disc with
   #333 numerals: ten saturated circles down the margin were competing with
   the sentences they were numbering.
   Whole pixels, not rem: 1.15rem = 18.4px landed on a fractional boundary
   and the numeral smeared across two device pixels. */
.q-number{flex-shrink:0;width:20px;height:20px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--tile-bg);color:var(--tile-ink);
  font-family:var(--f-mono);font-size:11px;font-weight:500;
  font-variant-numeric:tabular-nums;line-height:20px;text-align:center;
  -webkit-font-smoothing:antialiased;margin-top:2px}

/* ── THE STRIP ──
   Instruction left, dots right — the quiz's strip, same proportions.
   NOT pinned: it renders inside contentContainer so it cannot share a sticky
   wrapper with the selector above it, and pinning it separately meant
   guessing the selector's height — which is what made the quiz jitter when
   the tabs wrapped to two rows. */
.practice-strip{display:flex;align-items:center;justify-content:space-between;
  gap:1rem;margin-bottom:.95rem;padding-bottom:.45rem;
  border-bottom:1px solid var(--rule)}
.practice-instruction{font-family:var(--f-display);font-size:.58rem;
  font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.practice-tally{font-family:var(--f-mono);font-variant-numeric:tabular-nums;
  font-size:.7rem;color:var(--faint);margin-left:.55rem}
.practice-dots{display:flex;gap:.42rem;align-items:center}
.practice-dot{width:.62rem;height:.62rem;border-radius:50%;background:none;
  box-shadow:inset 0 0 0 1.5px var(--rule);transition:background .3s,box-shadow .3s}
.practice-dot.answered{background:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}

/* The key word is the grammar being taught — brick, as everywhere else. */
.keyword{display:block;color:var(--target);font-family:var(--f-display);
  font-size:.875rem;font-weight:700;letter-spacing:.05em;text-align:left;
  margin:.625rem 0 .375rem}

/* The source sentence is READ, not filled in. It had the same beige box as
   the input below it, so both said "here is a field". A left rule marks it
   as quoted, matching Explore. */
.sentence1{color:var(--sentence);font-size:.875rem;line-height:1.5;
  margin-bottom:.55rem;padding:.1rem 0 .1rem .75rem;
  background:none;border-radius:0;border-left:1px solid var(--rule)}
.sentence2-wrapper{margin-top:0}
.sentence2{color:var(--sentence);font-size:.875rem;line-height:1.5;
  display:flex;align-items:center;flex-wrap:wrap;gap:.25rem}
.sentence2-part{display:inline}

/* ── THE SLOT ────────────────────────────────────────────────────────────
   A capsule, not a rule. The underline was the printed-paper convention and
   it was the last dated thing on the page: once every other control in the
   system became a filled shape, a hairline with a gap over it read as an
   unfinished form. iOS text fields are grey rounded fills too — the line was
   never the native idiom, it was the paper one.

   Empty vs filled follows Forge exactly: the HOLLOW is deeper than a tile,
   and typing into it LIFTS it to tile grey. Recessed = nothing here yet,
   raised = an answer. That reads without colour, which is what the old blue
   underline could not do. */
.answer-input{display:inline-block;min-width:6em;max-width:100%;width:auto;
  /* was max-width:250px — Practice answers are whole clauses ("when you heat
     it to 100°C"), so the cap hid the end of nearly every one. */
  box-sizing:border-box;
  padding:.34em 1em;margin:0 .18rem;vertical-align:baseline;
  -webkit-appearance:none;appearance:none;
  border:none;border-radius:var(--r-chip);box-shadow:none;
  background:var(--slot-bg);color:var(--tile-ink);
  font-family:var(--f-display);font-weight:600;font-size:.875rem;
  text-align:center;outline:none;
  transition:background .15s,box-shadow .15s,color .15s}
.answer-input::placeholder{color:var(--faint);font-weight:400;opacity:.65}
/* holding an answer, not yet marked: the slot has become an object */
.answer-input.has-value{background:var(--tile-bg)}
/* Focus is a ring, so it survives the fill changing underneath it and does
   not rely on hue alone. */
.answer-input:focus{background:var(--tile-bg);
  box-shadow:0 0 0 2px rgba(var(--accent-rgb),.6)}

/* Marking follows the classroom: only what is WRONG is marked loudly. A right
   answer settles into the quiet green tile rather than being celebrated. */
.answer-input.correct{background:var(--tile-ok-bg);color:var(--tile-ok-ink);font-weight:600}
.answer-input.incorrect{background:var(--tile-no-bg);color:var(--tile-no-ink);
  text-decoration:line-through;text-decoration-thickness:1px;
  text-decoration-color:var(--tile-no-ink)}

/* ── FEEDBACK ──
   No panel: the correction is a line of text under the sentence. A right
   answer is left alone — the absence of a mark is the feedback, exactly as
   it is on paper. */
.feedback{display:none;margin-top:.45rem;padding:0 0 0 .75rem;
  border-radius:0;font-size:.8125rem}
.feedback.show{display:block}
.feedback.correct{display:none !important}
.feedback.incorrect{background:none;border:none;
  border-left:1px solid var(--wrong);color:var(--wrong)}
.feedback-label{font-family:var(--f-display);font-weight:700;font-size:.6875rem;
  text-transform:uppercase;letter-spacing:.05em;margin-bottom:.25rem}
/* had `color` twice — brick then overwritten by ink. Ink is right: it is the
   sentence written out correctly, not a grammar label. */
.feedback-answer{color:var(--sentence);font-style:italic;font-size:.8125rem}

/* ── ACTION BAR ──────────────────────────────────────────────────────────
   CLEAR is a quiet option, CHECK is the action — but the quiet one is now a
   tile rather than an outlined ghost, matching the Quiz footer and the
   games. No page in the system has outlined buttons any more. */
.action-bar{position:sticky;bottom:0;z-index:100;background:var(--screen);
  border-top:1px solid var(--rule);padding:.75rem;
  display:flex;justify-content:center;gap:.625rem}
.action-btn{font-family:var(--f-display);font-size:.78rem;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;
  padding:.62rem 1.3rem;border:none;border-radius:var(--r-chip);
  cursor:pointer;box-shadow:none;
  transition:transform .1s cubic-bezier(.2,.8,.2,1),background .15s}
.action-btn:active:not(:disabled){transform:scale(.96)}
.action-btn.secondary{background:var(--tile-bg);color:var(--dim)}
.action-btn.secondary:hover{background:var(--tile-bg-press)}
.action-btn.primary{background:var(--accent);color:#FFFFFF}
.action-btn.primary:hover{background:#DB5524}
.action-btn:disabled{opacity:.32;cursor:default}

/* ── SCORE ──
   Was a border-radius on an element with no fill and no border — a rounded
   nothing. It is a rule and a number. */
.score-banner{background:none;border:none;border-top:1px solid var(--rule);
  border-radius:0;padding:.9rem .75rem;margin-bottom:.75rem;text-align:center}
.score-text{font-family:var(--f-display);font-size:1.35rem;font-weight:900;
  font-variant-numeric:tabular-nums;color:var(--accent);margin-bottom:.25rem}
.score-label{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;
  text-transform:uppercase;color:var(--faint)}

.loading{text-align:center;padding:2rem;color:var(--faint);
  font-family:var(--f-mono);font-size:.82rem}
.error{text-align:center;padding:2rem;color:var(--wrong);
  font-size:.875rem;line-height:1.6}

/* ── PHONE ──
   16px is the threshold below which iOS zooms the page on input focus. It is
   the one value here that must not be in rem. */
@media (max-width:640px){
  body{padding:.375rem}
  .question-card{margin-bottom:1.25rem}
  .sentence1,.sentence2{font-size:.8125rem}
  .answer-input{font-size:16px;padding:.32em .95em}   /* 16px or iOS zooms on focus */
  .action-bar{padding:.625rem .5rem}
  .action-btn{padding:.55rem 1.1rem;font-size:.72rem}
}

/* ── PROJECTION ──
   A phone is read at about 30cm, a projected whiteboard at six metres. Only
   above 900px, roughly 15% larger, with NO change to weight: bolding would
   thicken the strokes and on a projector's soft focus reduce legibility. */
@media (min-width:900px){
  .sentence1,.sentence2{font-size:1rem;line-height:1.55}
  .answer-input{font-size:1rem}
  .keyword{font-size:.95rem}
  .practice-instruction{font-size:.66rem}
  .test-btn{font-size:.66rem}
  .feedback{font-size:.92rem}
}
</style>
</head>
<body>
  <div class="container">
    <div class="content-container">
      <div class="test-selector" id="testSelector"></div>
      
      <div id="contentContainer">
        <div class="loading">Loading exercises...</div>
      </div>
    </div>
  </div>

  <div class="action-bar" id="actionBar" style="display: none;">
    <button class="action-btn secondary" onclick="clearAnswers()">Clear</button>
    <button class="action-btn primary" onclick="checkAnswers()">Check</button>
  </div>

    <script>
let allTests = [];
let currentTest = 0;
let isChecked = false;
let testScores = {};

// Load saved scores from localStorage on startup
function loadSavedScores() {
  try {
    const saved = localStorage.getItem('tenses_practice_scores');
    if (saved) {
      testScores = JSON.parse(saved);
    }
  } catch (e) {
    console.error('Error loading saved scores:', e);
  }
}

// Save scores to localStorage
function saveScores() {
  try {
    localStorage.setItem('tenses_practice_scores', JSON.stringify(testScores));
  } catch (e) {
    console.error('Error saving scores:', e);
  }
}

/* Two shapes exist. Conditionals was merged into one file per topic with a
   `practice` key; tenses was not — its practice sets are still in their own
   file, and tenses-data.json holds only `rules`. Reading .practice from it
   returned undefined, so the page rendered nothing at all: not a 404, an
   empty result. Try the merged file first, then the standalone one. */
const PRACTICE_SOURCES = [
  '../../data/grammar-rules/tenses-data.json',
  '../../data/grammar-rules/tenses-practice.json'
];

async function fetchPractice(){
  let lastErr = null;
  for(const url of PRACTICE_SOURCES){
    try{
      const res = await fetch(url, { cache:'no-store' });
      if(!res.ok){ lastErr = new Error('HTTP '+res.status); continue; }
      const raw = await res.json();
      // merged file -> raw.practice ; standalone file -> the array itself
      const sets = Array.isArray(raw) ? raw : raw.practice;
      if(Array.isArray(sets) && sets.length) return sets;
      lastErr = new Error('no practice sets in ' + url.split('/').pop());
    }catch(e){ lastErr = e; }
  }
  throw lastErr || new Error('no practice data found');
}

async function loadData() {
  try {
    const data = await fetchPractice();

    allTests = data.map(section => ({
      title: section.title,
      transformations: section.transformations
    }));
    
    loadSavedScores(); // Load saved scores
    
    renderTestSelector();
    loadTest(0);
    
  } catch (error) {
    console.error('Error loading data:', error);
    document.getElementById('contentContainer').innerHTML = `
      <div class="error">
        <div style="font-size: 1.5rem; margin-bottom: 0.5rem;">⚠️</div>
        <div>Failed to load exercises</div>
        <div style="font-size: 0.6875rem; margin-top: 0.375rem;">${error.message}</div>
      </div>
    `;
  }
}


/* ── selector lives in the HOST header ──
   Explore keeps every navigation control in one fixed header. These pages
   had their selector inside the scrolling frame instead, which gave them a
   second band and a different scroll behaviour. Now the frame reports its
   tests upward and the host renders them beside the mode buttons; clicks
   come back down. The frame owns the content, the header owns navigation. */
const EMBEDDED = window.parent !== window;

function publishTests() {
  if (!EMBEDDED) return;
  parent.postMessage({
    intuity: 'tests',
    mode: 'practice',      /* the host keeps one list per mode */
    titles: allTests.map(function (t) { return t.title; }),
    active: currentTest
  }, '*');
}

window.addEventListener('message', function (e) {
  if (e.data && e.data.intuity === 'setTest') loadTest(e.data.index);
});

function renderTestSelector() {
  publishTests();
  const sel = document.getElementById('testSelector');
  if (EMBEDDED) { sel.style.display = 'none'; return; }
  const selector = document.getElementById('testSelector');
  selector.innerHTML = '';
  
  allTests.forEach((test, index) => {
    const btn = document.createElement('button');
    btn.className = 'test-btn' + (index === currentTest ? ' active' : '');
    btn.textContent = test.title;
    
    // Add score indicator if test has been completed
    const scoreKey = `test${index}`;
    if (testScores[scoreKey]) {
      const score = testScores[scoreKey];
      btn.textContent = `${test.title} (${score.percentage}%)`;
    }
    
    btn.onclick = () => loadTest(index);
    selector.appendChild(btn);
  });
}

function loadTest(index) {
  currentTest = index;
  isChecked = false;
  renderTestSelector();
  
  const test = allTests[index];
  const container = document.getElementById('contentContainer');

  /* Instruction left, dots right — the quiz's strip. The dots are the only
     thing that changes as you work; the circles beside each question mark
     position and stay put. */
  let html = '<div class="practice-strip">' +
             '<span class="practice-instruction">Complete the second sentence' +
             '<span class="practice-tally" id="practiceTally">0/' +
             allTests[index].transformations.length + '</span></span>' +
             '<span class="practice-dots" id="practiceDots"></span>' +
             '</div>';
  
  test.transformations.forEach((transformation, idx) => {
    const inputId = `input-${idx}`;
    const feedbackId = `feedback-${idx}`;
    
    const parts = transformation.sentence2.split('_____');
    
    html += `
      <div class="question-card">
       <div class="q-row">
        <div class="q-number">${idx + 1}</div>
        <div class="q-body">
        <div class="sentence1">${transformation.sentence1}</div>
        <div class="sentence2-wrapper">
          <div class="keyword">${transformation.keyWord.toUpperCase()}</div>
          <div class="sentence2">
            ${parts[0] ? `<span class="sentence2-part">${parts[0]}</span>` : ''}<input 
              type="text" 
              class="answer-input" 
              id="${inputId}"
              data-answer="${transformation.answer}"
              data-alternatives='${JSON.stringify(transformation.alternativeAnswers)}'
              placeholder="..."
              oninput="this.classList.toggle('has-value', !!this.value); autoExpandInput('${inputId}'); renderPracticeDots()"
              size="10"
            />${parts[1] ? `<span class="sentence2-part">${parts[1]}</span>` : ''}
          </div>
        </div>
        <div class="feedback" id="${feedbackId}">
          <div class="feedback-label"></div>
          <div class="feedback-answer"></div>
        </div>
        </div><!-- /.q-body -->
       </div><!-- /.q-row -->
      </div>
    `;
  });
  
  container.innerHTML = html;
  renderPracticeDots();
  document.getElementById('actionBar').style.display = 'flex';
}

/* One dot per question, filled once that question has an answer. */
function renderPracticeDots() {
  const wrap = document.getElementById('practiceDots');
  if (!wrap) return;
  const test = allTests[currentTest];
  if (!test) return;
  let done = 0;
  wrap.innerHTML = test.transformations.map(function (_, idx) {
    const el = document.getElementById('input-' + idx);
    const filled = el && el.value.trim() !== '';
    if (filled) done++;
    return '<span class="practice-dot' + (filled ? ' answered' : '') + '"></span>';
  }).join('');
  const tally = document.getElementById('practiceTally');
  if (tally) tally.textContent = done + '/' + test.transformations.length;
}

function autoExpandInput(inputId) {
  const input = document.getElementById(inputId);
  const value = input.value.trim();
  
  if (value) {
    const textWidth = value.length * 9;
    input.style.width = Math.min(Math.max(textWidth + 20, 80), 250) + 'px';
  } else {
    input.style.width = '80px';
  }
}

function normalizeAnswer(answer) {
  return answer.toLowerCase()
    .trim()
    .replace(/\s+/g, ' ')
    .replace(/'/g, '')
    .replace(/'/g, '');
}

function checkAnswers() {
  const test = allTests[currentTest];
  let correct = 0;
  let total = test.transformations.length;
  
  test.transformations.forEach((transformation, idx) => {
    const input = document.getElementById(`input-${idx}`);
    const feedback = document.getElementById(`feedback-${idx}`);
    const userAnswer = normalizeAnswer(input.value);
    const correctAnswer = normalizeAnswer(input.dataset.answer);
    const alternatives = JSON.parse(input.dataset.alternatives);
    
    const isCorrect = userAnswer === correctAnswer || 
                      alternatives.some(alt => normalizeAnswer(alt) === userAnswer);
    
    feedback.classList.add('show');
    
    if (isCorrect) {
      input.classList.add('correct');
      feedback.classList.add('correct');
      feedback.querySelector('.feedback-label').textContent = '✓ Correct';
      correct++;
    } else {
      input.classList.add('incorrect');
      feedback.classList.add('incorrect');
      feedback.querySelector('.feedback-label').textContent = '✗ Incorrect';
      feedback.querySelector('.feedback-answer').textContent = `Answer: "${input.dataset.answer}"`;
    }
    
    input.readOnly = true;
  });
  
  isChecked = true;
  
  const percentage = Math.round((correct / total) * 100);
  
  // Save score to localStorage
  const scoreKey = `test${currentTest}`;
  testScores[scoreKey] = {
    correct,
    total,
    percentage,
    timestamp: new Date().toISOString()
  };
  saveScores();
  
  const scoreHtml = `
    <div class="score-banner">
      <div class="score-text">${correct}/${total}</div>
      <div class="score-label">${percentage}% Correct</div>
    </div>
  `;
  
  const container = document.getElementById('contentContainer');
  container.insertAdjacentHTML('afterbegin', scoreHtml);
  
  const actionBar = document.getElementById('actionBar');
  actionBar.innerHTML = `
    <button class="action-btn secondary" onclick="clearAnswers()">Retry</button>
    <button class="action-btn primary" onclick="showAnswers()">Answers</button>
  `;
  
  // Update test selector to show new score
  renderTestSelector();
  
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showAnswers() {
  const test = allTests[currentTest];
  
  test.transformations.forEach((transformation, idx) => {
    const input = document.getElementById(`input-${idx}`);
    const feedback = document.getElementById(`feedback-${idx}`);
    
    if (input.classList.contains('incorrect')) {
      input.value = input.dataset.answer;
      input.classList.remove('incorrect');
      input.classList.add('correct');
      feedback.classList.remove('incorrect');
      feedback.classList.add('correct');
      feedback.querySelector('.feedback-label').textContent = '✓ Answer';
      feedback.querySelector('.feedback-answer').textContent = '';
      autoExpandInput(`input-${idx}`);
    }
  });
}

function clearAnswers() {
  const scoreBanner = document.querySelector('.score-banner');
  if (scoreBanner) scoreBanner.remove();
  
  const test = allTests[currentTest];
  test.transformations.forEach((transformation, idx) => {
    const input = document.getElementById(`input-${idx}`);
    const feedback = document.getElementById(`feedback-${idx}`);
    
    input.value = '';
    input.style.width = '80px';
    input.classList.remove('correct', 'incorrect');
    input.readOnly = false;
    feedback.classList.remove('show', 'correct', 'incorrect');
  });
  
  isChecked = false;
  
  const actionBar = document.getElementById('actionBar');
  actionBar.innerHTML = `
    <button class="action-btn secondary" onclick="clearAnswers()">Clear</button>
    <button class="action-btn primary" onclick="checkAnswers()">Check</button>
  `;
  
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

window.addEventListener('load', loadData);
</script>
</body>
</html>
