<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INTUITY - Tenses Practice</title>
  <style>
/* ── INTUITY light scheme — same tokens as tenses-rules.html ── */
:root{
  --screen:#FAF7F2; --card:#FFFFFF;
  --sentence:#3A3A38; --dim:#5C5852; --faint:#7A7570;
  --rule:#D2CEC2; --edge:#8F8574;
  --ink:#2B2129; --topic-ink:#9D653E; --filled:#97B1D2;
  --ok:#4A6B5C; --no:#A23B2C;
}

    * { margin: 0; padding: 0; box-sizing: border-box; }
  
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
      background: var(--screen);
      min-height: 100vh;
      color: var(--sentence);
      padding: 0.5rem;
      -webkit-font-smoothing: antialiased;
    }
    
    .container { 
      max-width: 64rem; 
      margin: 0 auto;
      padding: 0 1rem;
    }
    
    /* COMPACT TEST SELECTOR */
    .test-selector {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 0rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--rule);
    }
    
    .test-btn {
      padding: 0.375rem 0.625rem;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      border-radius: 0;
      color: var(--faint);
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 500;
      transition: all 0.2s ease;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    
    .test-btn:hover {
      color: var(--topic-ink);
      border-bottom-color: var(--rule);
    }
    
    .test-btn.active {
      color: var(--topic-ink);
      border-bottom-color: var(--topic-ink);
      font-weight: 600;
    }
    
    .content-container {
      background: var(--card);
      backdrop-filter: blur(40px) saturate(150%);
      -webkit-backdrop-filter: blur(40px) saturate(150%);
      border-radius: 1rem;
      border: 1.5px solid var(--rule);
      padding: 2rem 1rem 1rem 1rem;
      min-height: 400px;
      box-shadow: 0 12px 40px rgba(43,33,41,.10);
    }
    
    /* COMPACT QUESTION CARDS */
    .question-card {
      background: var(--card);
      border: 1px solid var(--rule);
      border-radius: 0.625rem;
      padding: 0.75rem;
      margin-bottom: 0.625rem;
      transition: all 0.2s ease;
    }

    .question-card:hover {
      border-color: var(--rule);
    }
    
    /* MINIMAL HEADER */
    .q-number {
      font-size: 0.6875rem;
      color: var(--faint);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }

    .keyword {
      color: var(--filled);
      font-size: 0.875rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-align: left;
      margin: 0.625rem 0 0.375rem 0;
      display: block;
    }
    
    /* COMPACT SENTENCES */
    .sentence1 {
      color: var(--sentence);
      font-size: 0.875rem;
      margin-bottom: 0.5rem;
      line-height: 1.5;
      padding: 0.5rem;
      background: var(--rule);
      border-radius: 0.4375rem;
      border-left: 2px solid var(--filled);
    }

    .sentence2-wrapper {
      margin-top: 0;
    }

    .sentence2 {
      color: var(--sentence);
      font-size: 0.875rem;
      line-height: 1.5;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.25rem;
    }

    .sentence2-part {
      display: inline;
    }

    /* INLINE INPUT - AUTO-EXPANDING */
    .answer-input {
      min-width: 80px;
      max-width: 250px;
      width: auto;
      padding: 0.375rem 0.5rem;
      background: var(--card);
      border: 1px solid var(--rule);
      border-radius: 0.4375rem;
      color: var(--sentence);
      font-size: 0.875rem;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
      display: inline-block;
    }
    
    .answer-input:focus {
      border-color: var(--topic-ink);
      background: rgba(157,101,62,.07);
      box-shadow: 0 0 0 2px rgba(157,101,62,.10);
    }

    .answer-input.correct {
      background: rgba(74,107,92,.12);
      border-color: var(--ok);
    }

    .answer-input.incorrect {
      background: rgba(162,59,44,.10);
      border-color: var(--no);
    }

    /* MINIMAL FEEDBACK */
    .feedback {
      margin-top: 0.375rem;
      padding: 0.5rem;
      border-radius: 0.4375rem;
      font-size: 0.8125rem;
      display: none;
    }

    .feedback.show {
      display: block;
    }

    .feedback.correct {
      background: rgba(74,107,92,.12);
      border: 1px solid var(--ok);
      color: var(--ok);
    }

    .feedback.incorrect {
      background: rgba(162,59,44,.10);
      border: 1px solid var(--no);
      color: var(--no);
    }

    .feedback-label {
      font-weight: 700;
      margin-bottom: 0.25rem;
      font-size: 0.6875rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .feedback-answer {
      color: var(--sentence);
      font-style: italic;
      font-size: 0.8125rem;
    }

    /* STICKY ACTION BAR */
    .action-bar {
      position: sticky;
      bottom: 0;
      background: var(--screen);
      
      border-top: 1px solid var(--rule);
      padding: 0.75rem;
      display: flex;
      justify-content: center;
      gap: 0.625rem;
      z-index: 100;
    }

    .action-btn {
      padding: 0.625rem 1.25rem;
      border-radius: 0.625rem;
      font-size: 0.8125rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid transparent;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .action-btn.secondary {
      background: var(--rule);
      color: var(--dim);
      border-color: var(--rule);
    }

    .action-btn.secondary:hover {
      background: var(--edge);
      color: var(--sentence);
    }

    .action-btn.primary {
      background: var(--rule);
      color: var(--topic-ink);
      border-color: var(--edge);
      box-shadow: 0 2px 8px var(--rule);
    }

    .action-btn.primary:hover {
      background: var(--edge);
      box-shadow: 0 4px 12px var(--rule);
    }

    /* COMPACT SCORE */
    .score-banner {
      background: rgba(157,101,62,.10);
      border: 1px solid var(--rule);
      border-radius: 0.625rem;
      padding: 0.75rem;
      margin-bottom: 0.75rem;
      text-align: center;
    }

    .score-text {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--topic-ink);
      margin-bottom: 0.25rem;
    }

    .score-label {
      font-size: 0.75rem;
      color: var(--faint);
    }
    
    .loading, .error {
      text-align: center;
      padding: 2rem;
      color: var(--faint);
      font-size: 0.875rem;
    }
    
    .error {
      color: var(--topic-ink);
    }

    /* MOBILE OPTIMIZATIONS */
    @media (max-width: 640px) {
      body {
        padding: 0.375rem;
      }

      .test-btn {
        font-size: 0.625rem;
        padding: 0.1875rem 0.4375rem;
      }

      .question-card {
        padding: 0.625rem;
        margin-bottom: 0.5rem;
      }

      .sentence1, .sentence2 {
        font-size: 0.8125rem;
      }

      .action-bar {
        padding: 0.625rem 0.5rem;
      }

      .action-btn {
        padding: 0.5rem 1rem;
        font-size: 0.75rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="content-container">
      <div class="test-selector" id="testSelector"></div>
      
      <div id="contentContainer">
        <div class="loading">Loading exercises...</div>
      </div>
    </div>
  </div>

  <div class="action-bar" id="actionBar" style="display: none;">
    <button class="action-btn secondary" onclick="clearAnswers()">Clear</button>
    <button class="action-btn primary" onclick="checkAnswers()">Check</button>
  </div>

    <script>
let allTests = [];
let currentTest = 0;
let isChecked = false;
let testScores = {};

// Load saved scores from localStorage on startup
function loadSavedScores() {
  try {
    const saved = localStorage.getItem('tenses_practice_scores');
    if (saved) {
      testScores = JSON.parse(saved);
    }
  } catch (e) {
    console.error('Error loading saved scores:', e);
  }
}

// Save scores to localStorage
function saveScores() {
  try {
    localStorage.setItem('tenses_practice_scores', JSON.stringify(testScores));
  } catch (e) {
    console.error('Error saving scores:', e);
  }
}

async function loadData() {
  try {
    const response = await fetch('../../data/grammar-rules/tenses-data.json');
    
    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }
    
    /* One file per topic now: the practice sections live under `practice`. */
    const data = (await response.json()).practice;
    
    allTests = data.map(section => ({
      title: section.title,
      transformations: section.transformations
    }));
    
    loadSavedScores(); // Load saved scores
    
    renderTestSelector();
    loadTest(0);
    
  } catch (error) {
    console.error('Error loading data:', error);
    document.getElementById('contentContainer').innerHTML = `
      <div class="error">
        <div style="font-size: 1.5rem; margin-bottom: 0.5rem;">⚠️</div>
        <div>Failed to load exercises</div>
        <div style="font-size: 0.6875rem; margin-top: 0.375rem;">${error.message}</div>
      </div>
    `;
  }
}

function renderTestSelector() {
  const selector = document.getElementById('testSelector');
  selector.innerHTML = '';
  
  allTests.forEach((test, index) => {
    const btn = document.createElement('button');
    btn.className = 'test-btn' + (index === currentTest ? ' active' : '');
    btn.textContent = test.title;
    
    // Add score indicator if test has been completed
    const scoreKey = `test${index}`;
    if (testScores[scoreKey]) {
      const score = testScores[scoreKey];
      btn.textContent = `${test.title} (${score.percentage}%)`;
    }
    
    btn.onclick = () => loadTest(index);
    selector.appendChild(btn);
  });
}

function loadTest(index) {
  currentTest = index;
  isChecked = false;
  renderTestSelector();
  
  const test = allTests[index];
  const container = document.getElementById('contentContainer');
  
  let html = '';
  
  test.transformations.forEach((transformation, idx) => {
    const inputId = `input-${idx}`;
    const feedbackId = `feedback-${idx}`;
    
    const parts = transformation.sentence2.split('_____');
    
    html += `
      <div class="question-card">
        <div class="q-number">Question ${idx + 1}</div>
        <div class="sentence1">${transformation.sentence1}</div>
        <div class="sentence2-wrapper">
          <div class="keyword">${transformation.keyWord.toUpperCase()}</div>
          <div class="sentence2">
            ${parts[0] ? `<span class="sentence2-part">${parts[0]}</span>` : ''}<input 
              type="text" 
              class="answer-input" 
              id="${inputId}"
              data-answer="${transformation.answer}"
              data-alternatives='${JSON.stringify(transformation.alternativeAnswers)}'
              placeholder="..."
              oninput="autoExpandInput('${inputId}')"
              size="10"
            />${parts[1] ? `<span class="sentence2-part">${parts[1]}</span>` : ''}
          </div>
        </div>
        <div class="feedback" id="${feedbackId}">
          <div class="feedback-label"></div>
          <div class="feedback-answer"></div>
        </div>
      </div>
    `;
  });
  
  container.innerHTML = html;
  document.getElementById('actionBar').style.display = 'flex';
}

function autoExpandInput(inputId) {
  const input = document.getElementById(inputId);
  const value = input.value.trim();
  
  if (value) {
    const textWidth = value.length * 9;
    input.style.width = Math.min(Math.max(textWidth + 20, 80), 250) + 'px';
  } else {
    input.style.width = '80px';
  }
}

function normalizeAnswer(answer) {
  return answer.toLowerCase()
    .trim()
    .replace(/\s+/g, ' ')
    .replace(/'/g, '')
    .replace(/'/g, '');
}

function checkAnswers() {
  const test = allTests[currentTest];
  let correct = 0;
  let total = test.transformations.length;
  
  test.transformations.forEach((transformation, idx) => {
    const input = document.getElementById(`input-${idx}`);
    const feedback = document.getElementById(`feedback-${idx}`);
    const userAnswer = normalizeAnswer(input.value);
    const correctAnswer = normalizeAnswer(input.dataset.answer);
    const alternatives = JSON.parse(input.dataset.alternatives);
    
    const isCorrect = userAnswer === correctAnswer || 
                      alternatives.some(alt => normalizeAnswer(alt) === userAnswer);
    
    feedback.classList.add('show');
    
    if (isCorrect) {
      input.classList.add('correct');
      feedback.classList.add('correct');
      feedback.querySelector('.feedback-label').textContent = '✓ Correct';
      correct++;
    } else {
      input.classList.add('incorrect');
      feedback.classList.add('incorrect');
      feedback.querySelector('.feedback-label').textContent = '✗ Incorrect';
      feedback.querySelector('.feedback-answer').textContent = `Answer: "${input.dataset.answer}"`;
    }
    
    input.readOnly = true;
  });
  
  isChecked = true;
  
  const percentage = Math.round((correct / total) * 100);
  
  // Save score to localStorage
  const scoreKey = `test${currentTest}`;
  testScores[scoreKey] = {
    correct,
    total,
    percentage,
    timestamp: new Date().toISOString()
  };
  saveScores();
  
  const scoreHtml = `
    <div class="score-banner">
      <div class="score-text">${correct}/${total}</div>
      <div class="score-label">${percentage}% Correct</div>
    </div>
  `;
  
  const container = document.getElementById('contentContainer');
  container.insertAdjacentHTML('afterbegin', scoreHtml);
  
  const actionBar = document.getElementById('actionBar');
  actionBar.innerHTML = `
    <button class="action-btn secondary" onclick="clearAnswers()">Retry</button>
    <button class="action-btn primary" onclick="showAnswers()">Answers</button>
  `;
  
  // Update test selector to show new score
  renderTestSelector();
  
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showAnswers() {
  const test = allTests[currentTest];
  
  test.transformations.forEach((transformation, idx) => {
    const input = document.getElementById(`input-${idx}`);
    const feedback = document.getElementById(`feedback-${idx}`);
    
    if (input.classList.contains('incorrect')) {
      input.value = input.dataset.answer;
      input.classList.remove('incorrect');
      input.classList.add('correct');
      feedback.classList.remove('incorrect');
      feedback.classList.add('correct');
      feedback.querySelector('.feedback-label').textContent = '✓ Answer';
      feedback.querySelector('.feedback-answer').textContent = '';
      autoExpandInput(`input-${idx}`);
    }
  });
}

function clearAnswers() {
  const scoreBanner = document.querySelector('.score-banner');
  if (scoreBanner) scoreBanner.remove();
  
  const test = allTests[currentTest];
  test.transformations.forEach((transformation, idx) => {
    const input = document.getElementById(`input-${idx}`);
    const feedback = document.getElementById(`feedback-${idx}`);
    
    input.value = '';
    input.style.width = '80px';
    input.classList.remove('correct', 'incorrect');
    input.readOnly = false;
    feedback.classList.remove('show', 'correct', 'incorrect');
  });
  
  isChecked = false;
  
  const actionBar = document.getElementById('actionBar');
  actionBar.innerHTML = `
    <button class="action-btn secondary" onclick="clearAnswers()">Clear</button>
    <button class="action-btn primary" onclick="checkAnswers()">Check</button>
  `;
  
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

window.addEventListener('load', loadData);
</script>
</body>
</html>
