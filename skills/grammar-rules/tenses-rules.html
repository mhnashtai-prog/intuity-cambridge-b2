<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTUITY — Tenses</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

:root{
  --gold:#C9A961;
  --paper:#e5e5e7; --dim:rgba(229,229,231,.55); --faint:rgba(229,229,231,.26);
  --blue:#60a5fa; --amber:#fb923c;
  --header-h:150px; --hud-h:40px;
}
html,body{width:100%;height:100%;overflow:hidden;background:#0d0d0d;overscroll-behavior:none}
body{font-family:'DM Sans',sans-serif;color:var(--paper);
  background-image:radial-gradient(circle at 20% 50%,rgba(201,169,97,.04) 0,transparent 50%),
                   radial-gradient(circle at 80% 80%,rgba(201,169,97,.03) 0,transparent 50%)}
button,a{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-decoration:none}

/* ══ HEADER ══ */
.header{
  position:fixed;top:0;left:0;right:0;z-index:30;
  display:flex;flex-direction:column;gap:.4rem;padding:.5rem 1.25rem .4rem;
  background:rgba(13,13,13,.88);backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(255,255,255,.06);
}
.header-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.back-link{justify-self:start;font-family:'Space Grotesk',sans-serif;font-size:.6rem;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.3);transition:color .2s;white-space:nowrap}
.back-link:hover{color:rgba(255,255,255,.7)}
.header-title{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.app-title{font-family:'Space Grotesk',sans-serif;font-size:1rem;font-weight:900;letter-spacing:.22em;color:var(--gold)}
.app-subtitle{font-size:.58rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(255,255,255,.32);margin-top:.1rem}
.header-spacer{justify-self:end;font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--faint);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:.3rem .65rem}
.header-spacer b{color:var(--gold)}

.mode-selector{display:flex;flex-wrap:wrap;justify-content:center;align-self:center;
  background:rgba(28,28,30,.6);backdrop-filter:blur(40px);
  border-radius:999px;border:1px solid rgba(201,169,97,.2);overflow:hidden}
.mode-btn{display:flex;align-items:center;gap:.4rem;font-family:'Space Grotesk',sans-serif;
  font-size:.66rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  padding:.5rem 1.05rem;border-right:1px solid rgba(84,84,88,.2);color:#636366;
  transition:background .2s,color .2s}
.mode-btn:last-child{border-right:none}
.mode-btn:hover{color:#9ca3af;background:rgba(201,169,97,.1)}
.mode-btn.active{background:rgba(201,169,97,.15);color:var(--gold)}
@media(max-width:760px){.mode-btn{padding:.42rem .62rem;font-size:.6rem;gap:.3rem}}

.set-tabs{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.28rem;padding:0 .5rem}
.set-tabs.hidden{display:none}
.vtab{font-family:'Space Grotesk',sans-serif;font-size:.56rem;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;padding:.28rem .72rem;border-radius:999px;border:1px solid transparent;
  color:rgba(255,255,255,.3);white-space:nowrap;transition:all .2s}
.vtab:hover{color:rgba(255,255,255,.75);border-color:rgba(255,255,255,.15)}
.vtab.active{color:var(--vc,var(--gold));border-color:var(--vc,var(--gold));background:rgba(255,255,255,.06)}
.vtab.lead{font-size:.6rem;letter-spacing:.14em}

/* ══ HUD ══ */
.hud{position:fixed;top:var(--header-h);left:0;right:0;height:var(--hud-h);z-index:25;
  display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:0 1rem;
  font-family:'DM Mono',monospace;font-size:.62rem;color:var(--faint);
  border-bottom:1px solid rgba(255,255,255,.05)}
.hud.hidden{display:none}
.hud .now{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .now b{color:var(--gold)}
/* View switch — inside the content container, top right. Sticky so it
   stays reachable twenty use cases down without being a fixed bar of
   its own. One control, not one per card. */
.viewbar{position:sticky;top:0;z-index:8;display:flex;justify-content:flex-end;
  padding:.15rem 0 .55rem;margin-bottom:-.35rem;pointer-events:none}
.viewtog{display:flex;padding:.16rem;gap:.16rem;border-radius:999px;pointer-events:auto;
  background:rgba(20,20,22,.92);backdrop-filter:blur(14px);
  border:1px solid rgba(201,169,97,.28);box-shadow:0 3px 12px rgba(0,0,0,.45)}
.vbtn{font-family:'Space Grotesk',sans-serif;font-size:.58rem;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;padding:.32rem .8rem;border-radius:999px;color:rgba(255,255,255,.4);
  transition:color .2s,background .2s}
.vbtn:hover{color:rgba(255,255,255,.8)}
.vbtn.on{color:#12100a;background:var(--gold)}

/* ══ CONTENT ══ */
.area{position:fixed;top:calc(var(--header-h) + var(--hud-h));left:0;right:0;bottom:0;
  display:none;overflow-y:auto;-webkit-overflow-scrolling:touch}
.area.active{display:block}
.inner{max-width:1000px;margin:0 auto;padding:1.1rem 1rem 2.5rem;
  display:flex;flex-direction:column;gap:1.1rem}
.cards{display:flex;flex-direction:column;gap:1.1rem}

.card{background:rgba(28,28,30,.6);backdrop-filter:blur(40px);
  border:1px solid rgba(201,169,97,.2);border-radius:1.1rem;padding:1.5rem;transition:border-color .25s}
.card:hover{border-color:rgba(201,169,97,.4)}
.uc-title{font-family:'DM Mono',monospace;font-size:1rem;color:var(--gold);text-transform:uppercase;
  letter-spacing:.1em;font-weight:500;padding:.45rem .9rem;background:rgba(201,169,97,.1);
  border-radius:.5rem;display:inline-block;margin-bottom:1.1rem}
.markers{background:rgba(96,165,250,.08);border:1px solid rgba(96,165,250,.25);border-radius:.6rem;
  padding:.8rem .95rem;margin-bottom:1.1rem}
.markers.hidden{display:none}
.markers-t{font-family:'DM Mono',monospace;font-size:.56rem;color:var(--faint);text-transform:uppercase;
  letter-spacing:.12em;margin-bottom:.55rem}
.markers-l{display:flex;flex-wrap:wrap;gap:.4rem}
.marker{background:rgba(96,165,250,.15);color:var(--blue);padding:.25rem .65rem;border-radius:.35rem;
  font-size:.72rem;font-weight:500;border:1px solid rgba(96,165,250,.3)}
.exs{display:flex;flex-direction:column;gap:.6rem;margin-bottom:1rem}
.ex{font-size:1.02rem;line-height:1.55;color:#e5e5e7;padding:.6rem .85rem;background:rgba(48,48,51,.3);
  border-radius:.45rem;border-left:3px solid var(--blue)}
.note{padding:.85rem 1.05rem;background:rgba(251,146,60,.08);border-left:3px solid var(--amber);
  border-radius:.45rem;font-size:.84rem;color:#d1d1d6;line-height:1.6}
.note i{color:var(--amber);font-style:normal;margin-right:.4rem}

.frame{position:absolute;inset:0}
.frame iframe{width:100%;height:100%;border:none;display:block}

.msg{padding:3rem 1.5rem;text-align:center;color:var(--amber);line-height:1.7;font-size:.9rem}
.msg small{display:block;color:var(--faint);margin-top:.5rem;font-size:.72rem}

/* ══ SLIDES MODAL ══ */
.modal{position:fixed;inset:0;z-index:60;background:rgba(8,8,9,.86);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;padding:1.25rem}
.modal.open{display:flex}
.shell{position:relative;width:min(760px,100%);height:100%;border-radius:1.1rem;overflow:hidden;
  background:#D9CFC2;box-shadow:0 24px 70px rgba(0,0,0,.6)}
.shell iframe{width:100%;height:100%;border:none;display:block}
.closex{position:absolute;top:.6rem;right:.6rem;z-index:5;width:34px;height:34px;border-radius:50%;
  background:rgba(0,0,0,.1);color:#000;font-size:1.1rem;line-height:1;
  display:flex;align-items:center;justify-content:center}
.closex:hover{background:rgba(0,0,0,.2)}
@media(max-width:768px){.modal{padding:0}.shell{border-radius:0}}

@media(max-width:600px){
  :root{--header-h:172px}
  .inner{padding:.9rem .75rem 2rem}
  .card{padding:1.15rem}
  .ex{font-size:.95rem}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="header">
  <div class="header-top">
    <a class="back-link" href="/?openModal=grammar" target="_top">← Grammar</a>
    <div class="header-title">
      <div class="app-title">INTUITY</div>
      <div class="app-subtitle">B2 First Tenses</div>
    </div>
    <span class="header-spacer">Level <b>B2–C1</b></span>
  </div>

  <div class="mode-selector">
    <button class="mode-btn active" data-mode="explore">🗺️ Explore</button>
    <button class="mode-btn" data-mode="practice">✍️ Practice</button>
    <button class="mode-btn" data-mode="quiz">📝 Quiz</button>
    <a class="mode-btn" href="/skills/grammar-rules/tenses-defuse">💣 Defuse</a>
    <a class="mode-btn" href="/skills/grammar-rules/tenses-forge">🌀 Forge</a>
  </div>

  <div class="set-tabs" id="catTabs"></div>
  <div class="set-tabs" id="tenseTabs"></div>
</header>

<div class="hud" id="hud">
  <span class="now" id="now">&nbsp;</span>
</div>

<div class="area active" id="exploreArea">
  <div class="inner">
    <div class="viewbar">
      <div class="viewtog" role="group" aria-label="Choose a view">
        <button class="vbtn on" data-v="list" type="button">List</button>
        <button class="vbtn" data-v="slides" type="button">Slides</button>
      </div>
    </div>
    <div class="cards" id="list"></div>
  </div>
</div>

<div class="area" id="practiceArea"><div class="frame"><iframe id="practiceFrame" src="" title="Practice"></iframe></div></div>
<div class="area" id="quizArea"><div class="frame"><iframe id="quizFrame" src="" title="Quiz"></iframe></div></div>

<div class="modal" id="modal">
  <div class="shell">
    <button class="closex" id="closeX" type="button" aria-label="Close">×</button>
    <iframe id="slidesFrame" src="" title="Tense slides"></iframe>
  </div>
</div>

<script>
const PLAY = 'tenses-play.html';
const DEF  = '../../data/grammar-rules/tenses-rules.json';
const P    = new URLSearchParams(location.search);
const JSON_URL = P.get('json') || DEF;

const CATS   = ['present','past','future'];
const CATL   = ['Present','Past','Future'];
const TENSES = ['simple','continuous','perfect','perfect-continuous'];
const TENSEL = ['Simple','Continuous','Perfect','Perfect continuous'];

let data = [], cat = 0, tense = 0, view = 'list', mainMode = 'explore';

const $ = id => document.getElementById(id);

async function boot(){
  try{
    const res = await fetch(JSON_URL, { cache:'no-store' });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const raw = await res.json();
    const list = Array.isArray(raw) ? raw : (raw.rules || Object.values(raw));
    data = Array.isArray(list) ? list : Object.values(list);
  }catch(e){
    $('list').innerHTML = '<div class="msg">Couldn\'t load the tense rules.'+
      '<small>Looked for '+JSON_URL+' — '+String(e.message||e).replace(/[<>]/g,'')+'</small></div>';
    syncHeader();
    return;
  }
  buildTabs();
  paintList();
  syncHeader();

  const m = P.get('mode');
  if(m === 'practice' || m === 'quiz') switchMode(m);
  if(P.get('view') === 'slides') setView('slides');
}

const current = () => data.find(t => t.id === CATS[cat]+'-'+TENSES[tense]);

/* ── tabs ── */
function buildTabs(){
  const c = $('catTabs'); c.innerHTML = '';
  CATL.forEach((label,i)=>{
    const b = document.createElement('button');
    b.className = 'vtab lead' + (i===cat ? ' active' : '');
    b.textContent = label;
    b.onclick = () => { if(i===cat) return; cat = i; buildTabs(); paintList(); refreshSlides(); };
    c.appendChild(b);
  });
  const t = $('tenseTabs'); t.innerHTML = '';
  TENSEL.forEach((label,i)=>{
    const b = document.createElement('button');
    b.className = 'vtab' + (i===tense ? ' active' : '');
    b.textContent = label;
    b.onclick = () => { if(i===tense) return; tense = i; buildTabs(); paintList(); refreshSlides(); };
    t.appendChild(b);
  });
  syncHeader();
}

/* ── list ── */
function paintList(){
  const tn = current();
  const wrap = $('list');
  if(!tn || !tn.useCases){
    wrap.innerHTML = '<div class="msg">No use cases for this tense yet.</div>';
    $('now').innerHTML = '';
    return;
  }
  $('now').innerHTML = '<b>'+tn.name+'</b> · '+tn.useCases.length+' uses';
  wrap.innerHTML = tn.useCases.map(uc => {
    const markers = (uc.timeMarkers||[]).length
      ? '<div class="markers"><div class="markers-t">Time markers</div><div class="markers-l">'+
        uc.timeMarkers.map(m=>'<span class="marker">'+m+'</span>').join('')+'</div></div>'
      : '';
    const exs = [uc.mainExample].concat(uc.moreExamples||[])
      .map(e=>'<div class="ex">'+e+'</div>').join('');
    const note = uc.note ? '<div class="note"><i>💡</i>'+uc.note+'</div>' : '';
    return '<div class="card"><div class="uc-title">'+uc.title+'</div>'+
           markers+'<div class="exs">'+exs+'</div>'+note+'</div>';
  }).join('');
}

/* ── modes ── */
function switchMode(mode){
  if(mode === mainMode) return;
  mainMode = mode;
  document.querySelectorAll('.mode-btn[data-mode]').forEach(b =>
    b.classList.toggle('active', b.dataset.mode === mode));
  document.querySelectorAll('.area').forEach(a => a.classList.remove('active'));

  const explore = mode === 'explore';
  $('hud').classList.toggle('hidden', !explore);
  $('catTabs').classList.toggle('hidden', !explore);
  $('tenseTabs').classList.toggle('hidden', !explore);

  if(explore){ $('exploreArea').classList.add('active'); }
  else if(mode === 'practice'){
    $('practiceArea').classList.add('active');
    const f = $('practiceFrame');
    if(!f.src) f.src = 'tenses-practice.html';
  }else if(mode === 'quiz'){
    $('quizArea').classList.add('active');
    const f = $('quizFrame');
    if(!f.src) f.src = 'tenses-gapfill.html';
  }
  syncHeader();
}
document.querySelectorAll('.mode-btn[data-mode]').forEach(b =>
  b.addEventListener('click', () => switchMode(b.dataset.mode)));

/* ── list / slides ── */
function setView(v){
  view = v;
  document.querySelectorAll('.vbtn').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  $('modal').classList.toggle('open', v === 'slides');
  if(v === 'slides') refreshSlides();
}
document.querySelectorAll('.vbtn').forEach(b =>
  b.addEventListener('click', () => setView(b.dataset.v)));

function refreshSlides(){
  if(view !== 'slides') return;
  const src = PLAY+'?category='+CATS[cat]+'&tense='+TENSES[tense]+'&json='+encodeURIComponent(JSON_URL);
  const f = $('slidesFrame');
  if(f.getAttribute('src') !== src) f.setAttribute('src', src);
}

$('closeX').onclick = () => setView('list');
$('modal').addEventListener('click', e => { if(e.target === $('modal')) setView('list'); });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && view === 'slides') setView('list'); });
window.addEventListener('message', e => {
  if(e.data && e.data.intuity === 'showList') setView('list');
});

/* ── layout sync — measures the real header instead of trusting the CSS
   guess. Two tab rows plus a six-item mode selector wrap to different
   heights on every width, so a stale --header-h would let the header
   sit on top of the content. Ported from tenses-defuse.html. ── */
function syncHeader(){
  const h = document.querySelector('.header'), hu = document.querySelector('.hud');
  if(h) document.documentElement.style.setProperty('--header-h', h.offsetHeight+'px');
  document.documentElement.style.setProperty('--hud-h',
    (hu && !hu.classList.contains('hidden')) ? hu.offsetHeight+'px' : '0px');
}
window.addEventListener('resize', syncHeader);
window.addEventListener('orientationchange', () => setTimeout(syncHeader,120));
if(document.fonts && document.fonts.ready) document.fonts.ready.then(syncHeader);

boot();
</script>
</body>
</html>
