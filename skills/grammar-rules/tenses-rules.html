<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTUITY — Tenses</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Anton&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

:root{
  /* Light scheme. One accent hue at three depths: display, body, quiet.
     The old --blue was Tailwind's default and belonged to no palette here. */
  --screen:#FAF7F2;      /* page */
  --card:#FFFFFF;        /* raised surface, exercises only */
  --sentence:#3A3A38;    /* body text            10.7:1 */
  --dim:#5C5852;         /* secondary text        7.2:1 */
  --faint:#7A7570;       /* labels only           4.3:1 */
  --rule:#D2CEC2;        /* hairlines — felt, not read */
  --edge:#8F8574;        /* component borders     3.4:1 */
  --topic:#DD8E58;       /* topic words AS A FILL — 2.4:1 as text */
  --topic-ink:#9D653E;   /* the same hue, darkened to carry text 4.5:1 */
  --filled:#97B1D2;      /* a completed answer, AS A FILL */
  --accent:#C97253;      /* display / large type  3.3:1 */
  --accent-ink:#A55D44;  /* the same hue for body 4.6:1 */
  --gold:#8A6A3F;        /* section titles on light */
  --sage:#4A6B5C;        /* correct               5.5:1 */
  --ink:#2B2129;         /* wordmark, active states */
  --header-h:150px; --hud-h:40px;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--screen);overscroll-behavior:none}
/* The glow gradients are gone: on a light ground they read as smudges, and
   they were the most dated thing on the page. */
body{font-family:'DM Sans',sans-serif;color:var(--sentence)}
button,a{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-decoration:none}

/* ══ HEADER ══
   Light, like everything else. The dark band was the last piece of the old
   app, and on a projector it renders as a grey slab rather than black.
   A hairline is enough to separate chrome from content. */
.header{
  position:fixed;top:0;left:0;right:0;z-index:30;
  display:flex;flex-direction:column;gap:.45rem;padding:.55rem 1.25rem .45rem;
  background:var(--screen);
  border-bottom:1px solid var(--rule);
}
.header-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.back-link{justify-self:start;font-family:'Space Grotesk',sans-serif;font-size:.6rem;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--faint);transition:color .2s;white-space:nowrap}
.back-link:hover{color:var(--accent-ink)}
.header-title{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.app-title{font-family:'Space Grotesk',sans-serif;font-size:1rem;font-weight:900;letter-spacing:.22em;color:var(--ink)}
.app-subtitle{font-size:.58rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim);margin-top:.1rem}
.header-spacer{justify-self:end;font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--faint);border:1px solid var(--rule);border-radius:999px;padding:.3rem .65rem}
.header-spacer b{color:var(--sentence)}

/* Modes are words, not a segmented pill. The active one is marked by weight
   and a rule beneath it — never by colour alone, so it still reads for a
   colour-blind student. */
.mode-selector{display:flex;flex-wrap:wrap;justify-content:center;align-self:center;gap:.2rem}
.mode-btn{display:flex;align-items:center;gap:.4rem;font-family:'Space Grotesk',sans-serif;
  font-size:.68rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  padding:.42rem .8rem;color:var(--faint);
  border-bottom:2px solid transparent;
  transition:color .2s,border-color .2s}
.mode-btn:hover{color:var(--sentence)}
.mode-btn.active{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
@media(max-width:760px){.mode-btn{padding:.42rem .62rem;font-size:.6rem;gap:.3rem}}

.set-tabs{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.28rem;padding:0 .5rem}
.set-tabs.hidden{display:none}
.vtab{font-family:'Space Grotesk',sans-serif;font-size:.58rem;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;padding:.26rem .6rem;border:none;border-bottom:2px solid transparent;
  color:var(--faint);white-space:nowrap;transition:color .2s,border-color .2s}
.vtab:hover{color:var(--sentence)}
.vtab.active{color:var(--ink);font-weight:700;border-bottom-color:var(--vc,var(--accent))}
.vtab.lead{font-size:.6rem;letter-spacing:.14em}

/* A completed answer. #97B1D2 is 2.1:1 as text on this screen — unreadable —
   but 7.1:1 underneath #2B2129, so it works as a fill and not as ink. Same
   logic as the map's pills. */
.filled{background:var(--filled);color:#2B2129;font-weight:600;
  padding:.08em .42em;border-radius:.25rem;}

/* ══ HUD ══ */
.hud{position:fixed;top:var(--header-h);left:0;right:0;height:var(--hud-h);z-index:25;
  display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:0 1rem;
  font-family:'DM Mono',monospace;font-size:.62rem;color:var(--faint);
  background:var(--screen);border-bottom:1px solid var(--rule)}
.hud.hidden{display:none}
.hud .now{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .now b{color:var(--gold)}
/* Each use case opens its own map. The list IS the section index, so
   there's no second menu inside the modal. */
.card-head{display:flex;align-items:center;gap:.8rem;margin-bottom:1.1rem}
.card-head .uc-title{margin-bottom:0;flex:1}
.explore-btn{flex:none;display:inline-flex;align-items:center;gap:.4rem;
  font-family:'Space Grotesk',sans-serif;font-size:.64rem;font-weight:800;letter-spacing:.05em;
  text-transform:uppercase;padding:.5rem .7rem .5rem 1rem;border-radius:999px;
  /* Solid accent, no gradient and no glow. The gold pill only worked on
     black — on this screen it sits at 2.1:1, below what a button boundary
     needs. #A55D44 is 4.6:1 against the page and 4.9:1 under white. */
  color:#FFFFFF;background:var(--accent-ink);
  transition:transform .2s cubic-bezier(.34,1.56,.64,1),background .2s}
.explore-btn:hover{transform:translateY(-1px);background:#8F4E38}
.explore-btn:active{transform:scale(.93)}
.explore-btn .icon-badge{display:inline-flex;align-items:center;justify-content:center;
  width:1.3rem;height:1.3rem;border-radius:50%;background:rgba(255,255,255,.18);
  font-size:.78rem;transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.explore-btn:hover .icon-badge{transform:rotate(18deg) scale(1.12)}

/* ══ CONTENT ══ */
.area{position:fixed;top:calc(var(--header-h) + var(--hud-h));left:0;right:0;bottom:0;
  display:none;overflow-y:auto;-webkit-overflow-scrolling:touch}
.area.active{display:block}
.inner{max-width:1000px;margin:0 auto;padding:1.1rem 1rem 2.5rem;
  display:flex;flex-direction:column;gap:1.1rem}
.cards{display:flex;flex-direction:column;gap:1.1rem}

/* The card was a translucent panel with a gold outline. On a light ground a
   panel adds nothing — the sentences read better straight on the page — so
   the fill and the border go, and a hairline separates one section from the
   next. Padding stays: the rhythm was right. */
.card{background:none;border:none;border-bottom:1px solid var(--rule);
  border-radius:0;padding:1.5rem 0;transition:none}
.cards .card:first-child{padding-top:.6rem}
.cards .card:last-child{border-bottom:none}
/* Anton, and big. In mono at 1rem this was a LABEL sitting directly above a
   row of coloured markers at nearly the same size — nothing told the eye it
   outranked them, so grey read as lifeless when it was really just small.
   Scale carries the hierarchy, which frees the accent to mean one thing:
   focus. It also matches the poster this section opens. */
.uc-title{font-family:'DM Mono',monospace;font-weight:500;
  font-size:.78rem;line-height:1.3;color:#76716D;
  text-transform:uppercase;letter-spacing:.14em;margin-bottom:.9rem}
.markers{margin-bottom:1.1rem}
.markers.hidden{display:none}
.markers-t{font-family:'DM Mono',monospace;font-size:.56rem;color:var(--dim);text-transform:uppercase;
  letter-spacing:.12em;margin-bottom:.55rem}
.markers-l{display:flex;flex-wrap:wrap;gap:.4rem .9rem}
.marker{color:var(--topic-ink);font-size:.86rem;font-weight:600}
.markers-group{margin-bottom:.85rem}
.markers-group:last-child{margin-bottom:0}
.exs{display:flex;flex-direction:column;gap:.6rem;margin-bottom:1rem}
.ex{font-size:1.02rem;line-height:1.55;color:var(--sentence);padding:.5rem 0 .5rem .9rem;background:none;
  border-left:2px solid var(--rule);
  }
.ex .marker-inline{color:var(--topic-ink);font-weight:700}
.note{padding:.8rem 0 .8rem 1rem;background:none;border-left:2px solid var(--rule);
  font-size:.84rem;color:var(--dim);line-height:1.6}
.note i{color:var(--accent-ink);font-style:normal;margin-right:.4rem}

.frame{position:absolute;inset:0}
.frame iframe{width:100%;height:100%;border:none;display:block}

.msg{padding:3rem 1.5rem;text-align:center;color:var(--faint);line-height:1.7;font-size:.9rem}
.msg small{display:block;color:var(--faint);margin-top:.5rem;font-size:.72rem}

/* ══ SLIDES MODAL ══ */
.modal{position:fixed;inset:0;z-index:60;background:rgba(8,8,9,.86);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;padding:1.25rem}
.modal.open{display:flex}
.shell{position:relative;width:min(760px,100%);height:100%;border-radius:1.1rem;overflow:hidden;
  background:#D9CFC2;box-shadow:0 24px 70px rgba(0,0,0,.6)}
.shell iframe{width:100%;height:100%;border:none;display:block}
.closex{position:absolute;top:.6rem;right:.6rem;z-index:5;width:34px;height:34px;border-radius:50%;
  background:rgba(0,0,0,.1);color:#000;font-size:1.1rem;line-height:1;
  display:flex;align-items:center;justify-content:center}
.closex:hover{background:rgba(0,0,0,.2)}
@media(max-width:768px){.modal{padding:0}.shell{border-radius:0}}

@media(max-width:600px){
  :root{--header-h:172px}
  .inner{padding:.9rem .75rem 2rem}
  .card{padding:1.15rem}
  .ex{font-size:.95rem}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="header">
  <div class="header-top">
    <a class="back-link" href="/?openModal=grammar" target="_top">← Grammar</a>
    <div class="header-title">
      <div class="app-title">INTUITY</div>
      <div class="app-subtitle">B2 First Tenses</div>
    </div>
    <span class="header-spacer">Level <b>B2–C1</b></span>
  </div>

  <div class="mode-selector">
    <button class="mode-btn active" data-mode="explore">🗺️ Explore</button>
    <button class="mode-btn" data-mode="practice">✍️ Practice</button>
    <button class="mode-btn" data-mode="quiz">📝 Quiz</button>
    <a class="mode-btn" href="/skills/grammar-rules/tenses-defuse">💣 Defuse</a>
    <a class="mode-btn" href="/skills/grammar-rules/tenses-forge">🌀 Forge</a>
  </div>

  <div class="set-tabs" id="catTabs"></div>
  <div class="set-tabs" id="tenseTabs"></div>
</header>

<div class="hud" id="hud">
  <span class="now" id="now">&nbsp;</span>
</div>

<div class="area active" id="exploreArea">
  <div class="inner">
    <div class="cards" id="list"></div>
  </div>
</div>

<div class="area" id="practiceArea"><div class="frame"><iframe id="practiceFrame" src="" title="Practice"></iframe></div></div>
<div class="area" id="quizArea"><div class="frame"><iframe id="quizFrame" src="" title="Quiz"></iframe></div></div>

<div class="modal" id="modal">
  <div class="shell">
    <button class="closex" id="closeX" type="button" aria-label="Close">×</button>
    <iframe id="slidesFrame" src="" title="Tense slides"></iframe>
  </div>
</div>

<script>
const PLAY = 'explore-map.html';   // ONE renderer for every topic
const DEF  = '../../data/grammar-rules/tenses-rules.json';
const P    = new URLSearchParams(location.search);
const JSON_URL = P.get('json') || DEF;

const CATS   = ['present','past','future'];
const CATL   = ['Present','Past','Future'];
const TENSES = ['simple','continuous','perfect','perfect-continuous'];
const TENSEL = ['Simple','Continuous','Perfect','Perfect continuous'];

let data = [], cat = 0, tense = 0, view = 'list', mainMode = 'explore';

const $ = id => document.getElementById(id);

/* ── time-marker helpers ──
   timeMarkers can be either:
     - a flat array of strings (legacy / simple tenses), or
     - { list1: {label, items}, list2: {label, items} } for tenses that
       benefit from two groups (e.g. frequency adverbs vs frequency phrases).
   normMarkerGroups() always returns an array of {label, items} groups so
   the renderer only has one code path. flatMarkers() flattens everything
   into a single word list for the inline highlighter. */
function normMarkerGroups(tm){
  if(!tm) return [];
  if(Array.isArray(tm)) return tm.length ? [{ label:'Time markers', items: tm }] : [];
  const groups = [];
  if(tm.list1 && tm.list1.items && tm.list1.items.length) groups.push(tm.list1);
  if(tm.list2 && tm.list2.items && tm.list2.items.length) groups.push(tm.list2);
  return groups;
}
function flatMarkers(tm){
  if(!tm) return [];
  if(Array.isArray(tm)) return tm;
  return [
    ...((tm.list1 && tm.list1.items) || []),
    ...((tm.list2 && tm.list2.items) || [])
  ];
}
function escRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function escHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
/* Wraps any marker word/phrase found inside `text` in a blue <span>, so
   the same signal words shown in the marker chips are visible in situ
   inside the example sentences. Longest markers are matched first so a
   phrase like "hardly ever" isn't partly swallowed by "ever" (which
   doesn't exist here, but keeps this correct in general). */
function highlightMarkers(text, markers){
  const safe = escHtml(text);
  if(!markers || !markers.length) return safe;
  const sorted = [...markers].sort((a,b)=>b.length-a.length).map(escRe);
  const re = new RegExp('\\b(' + sorted.join('|') + ')\\b','gi');
  return safe.replace(re, '<span class="marker-inline">$1</span>');
}

async function boot(){
  try{
    const res = await fetch(JSON_URL, { cache:'no-store' });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const raw = await res.json();
    const list = Array.isArray(raw) ? raw : (raw.rules || Object.values(raw));
    data = Array.isArray(list) ? list : Object.values(list);
  }catch(e){
    $('list').innerHTML = '<div class="msg">Couldn\'t load the tense rules.'+
      '<small>Looked for '+JSON_URL+' — '+String(e.message||e).replace(/[<>]/g,'')+'</small></div>';
    syncHeader();
    return;
  }
  buildTabs();
  paintList();
  syncHeader();

  const m = P.get('mode');
  if(m === 'practice' || m === 'quiz') switchMode(m);

}

const current = () => data.find(t => t.id === CATS[cat]+'-'+TENSES[tense]);

/* ── tabs ── */
function buildTabs(){
  const c = $('catTabs'); c.innerHTML = '';
  CATL.forEach((label,i)=>{
    const b = document.createElement('button');
    b.className = 'vtab lead' + (i===cat ? ' active' : '');
    b.textContent = label;
    b.onclick = () => { if(i===cat) return; cat = i; buildTabs(); paintList(); refreshSlides(); };
    c.appendChild(b);
  });
  const t = $('tenseTabs'); t.innerHTML = '';
  TENSEL.forEach((label,i)=>{
    const b = document.createElement('button');
    b.className = 'vtab' + (i===tense ? ' active' : '');
    b.textContent = label;
    b.onclick = () => { if(i===tense) return; tense = i; buildTabs(); paintList(); refreshSlides(); };
    t.appendChild(b);
  });
  syncHeader();
}

/* ── list ── */
function paintList(){
  const tn = current();
  const wrap = $('list');
  if(!tn || !tn.useCases){
    wrap.innerHTML = '<div class="msg">No use cases for this tense yet.</div>';
    $('now').innerHTML = '';
    return;
  }
  $('now').innerHTML = '<b>'+tn.name+'</b> · '+tn.useCases.length+' uses';
  wrap.innerHTML = tn.useCases.map((uc,i) => {
    const groups = normMarkerGroups(uc.timeMarkers);
    const flat = flatMarkers(uc.timeMarkers);
    const markers = groups.length
      ? '<div class="markers">'+
          groups.map(g =>
            '<div class="markers-group">'+
              '<div class="markers-t">'+g.label+'</div>'+
              '<div class="markers-l">'+
                g.items.map(m=>'<span class="marker">'+escHtml(m)+'</span>').join('')+
              '</div>'+
            '</div>'
          ).join('')+
        '</div>'
      : '';
    const exs = [uc.mainExample].concat(uc.moreExamples||[])
      .map(e=>'<div class="ex">'+highlightMarkers(e, flat)+'</div>').join('');
    const note = uc.note ? '<div class="note"><i>💡</i>'+escHtml(uc.note)+'</div>' : '';
    return '<div class="card">'+
             '<div class="card-head">'+
               '<div class="uc-title">'+uc.title+'</div>'+
               '<button class="explore-btn" type="button" data-sec="'+i+'">'+
                 'Explore<span class="icon-badge">🧭</span>'+
               '</button>'+
             '</div>'+
             markers+'<div class="exs">'+exs+'</div>'+note+'</div>';
  }).join('');

  wrap.querySelectorAll('.explore-btn').forEach(b =>
    b.addEventListener('click', () => openMap(+b.dataset.sec)));
}

/* ── modes ── */
function switchMode(mode){
  if(mode === mainMode) return;
  mainMode = mode;
  document.querySelectorAll('.mode-btn[data-mode]').forEach(b =>
    b.classList.toggle('active', b.dataset.mode === mode));
  document.querySelectorAll('.area').forEach(a => a.classList.remove('active'));

  const explore = mode === 'explore';
  $('hud').classList.toggle('hidden', !explore);
  $('catTabs').classList.toggle('hidden', !explore);
  $('tenseTabs').classList.toggle('hidden', !explore);

  if(explore){ $('exploreArea').classList.add('active'); }
  else if(mode === 'practice'){
    $('practiceArea').classList.add('active');
    const f = $('practiceFrame');
    if(!f.src) f.src = 'tenses-practice.html';
  }else if(mode === 'quiz'){
    $('quizArea').classList.add('active');
    const f = $('quizFrame');
    if(!f.src) f.src = 'tenses-gapfill.html';
  }
  syncHeader();
}
document.querySelectorAll('.mode-btn[data-mode]').forEach(b =>
  b.addEventListener('click', () => switchMode(b.dataset.mode)));

/* ── list / slides ── */
function openMap(section){
  view = 'slides';
  $('slidesFrame').setAttribute('src',
    PLAY+'?topic=tenses&category='+CATS[cat]+'&tense='+TENSES[tense]+
    '&section='+section+'&json='+encodeURIComponent(JSON_URL));
  $('modal').classList.add('open');
}
function closeMap(){
  view = 'list';
  $('modal').classList.remove('open');
  $('slidesFrame').setAttribute('src','');
}
function refreshSlides(){ if(view === 'slides') closeMap(); }

$('closeX').onclick = closeMap;
$('modal').addEventListener('click', e => { if(e.target === $('modal')) closeMap(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && view === 'slides') closeMap(); });
window.addEventListener('message', e => {
  if(e.data && e.data.intuity === 'showList') closeMap();
});

/* ── layout sync — measures the real header instead of trusting the CSS
   guess. Two tab rows plus a six-item mode selector wrap to different
   heights on every width, so a stale --header-h would let the header
   sit on top of the content. Ported from tenses-defuse.html. ── */
function syncHeader(){
  const h = document.querySelector('.header'), hu = document.querySelector('.hud');
  if(h) document.documentElement.style.setProperty('--header-h', h.offsetHeight+'px');
  document.documentElement.style.setProperty('--hud-h',
    (hu && !hu.classList.contains('hidden')) ? hu.offsetHeight+'px' : '0px');
}
window.addEventListener('resize', syncHeader);
window.addEventListener('orientationchange', () => setTimeout(syncHeader,120));
if(document.fonts && document.fonts.ready) document.fonts.ready.then(syncHeader);

boot();
</script>
</body>
