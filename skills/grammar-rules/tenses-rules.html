<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTUITY — Tenses</title>

<!-- Preconnect before the stylesheet request, so the font handshake overlaps
     the CSS download instead of queuing behind it. A late font swap resizes
     the header, which is the jump the ResizeObserver at the bottom exists to
     catch — better not to cause it. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Geist:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">

<!-- THE SHELL. Tokens, header, mode row, tabs, tile family, close control,
     sheets and view transitions all live here and are shared verbatim with
     Defuse and Forge. This replaces the "edit it there and copy, never here"
     convention that let the three headers drift apart. -->
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=2">

<style>
/* ═══ WHAT ONLY THIS PAGE OWNS ═══
   Everything above is shared. What follows is Explore's reading surface and
   the slides sheet — nothing else has them, so nothing else should carry
   their CSS. */

/* ── TOKENS THIS PAGE OWNS ──
   The verb chip and the Explore pill exist nowhere else, so their values
   stay here rather than in the shell. Everything else still comes from
   intuity-shell.css. */
:root{
  --verb:#EEE8E0;                 /* the verb chip. One step lighter than
                                     --tile-bg #E8E1D6, so a read-only chip
                                     can never be mistaken for a Practice
                                     tile. */
  --verb-ink:var(--tile-ink);
  --sage:#708A81;                 /* = --mark-sweep, already in the shell */
  --sage-tint:rgba(112,138,129,.16);
  /* The pill's base. Darker and a shade bluer than --sage, which is what
     lets it carry a solid fill: at this depth a white label clears 4.9:1,
     where the old tint could only take an ink one. */
  --sage-deep:#60747C;

  /* The two faces of a sentence. The verb is the lesson and the rest is
     context, so they are set in different voices rather than different
     sizes: 12pt grotesk against 11pt serif. One point of difference is not
     a hierarchy, but grotesk-against-serif is, and it costs no height. */
  --f-verb:'Geist',system-ui,sans-serif;
  --f-read:'Newsreader',Georgia,serif;
}

html,body{width:100%;height:100%;overflow:hidden}

/* ── EXPLORE ─────────────────────────────────────────────────────────── */
.inner{max-width:720px;margin:0 auto;padding:.9rem 1rem 2.5rem;
  display:flex;flex-direction:column;gap:1.1rem}
.cards{display:flex;flex-direction:column;gap:1.1rem}
/* No panel. On a light ground a card around the sentences added nothing —
   the page IS the surface. Space and one hairline do the separating. */
.card{background:none;border:none;border-radius:0;padding:.3rem 0 1.3rem}
.cards .card:first-child{padding-top:.6rem}

.card-head{display:flex;align-items:center;gap:.8rem;
  padding-bottom:.75rem;margin-bottom:.95rem;border-bottom:1px solid var(--rule)}
.card-head .uc-title{margin-bottom:0;flex:1}

/* Space Grotesk, not mono. A monospace label reads as terminal, and that was
   half of what felt dated here. Scale carries the hierarchy, which frees the
   accent to mean one thing: focus. */
.uc-title{font-family:var(--f-display);font-weight:500;font-size:.96rem;
  line-height:1.3;color:var(--sage);text-transform:uppercase;
  letter-spacing:.2em;margin-bottom:1rem}

/* THE EXPLORE PILL.
   Solid brick was right when the sentences were loud. They are not any more:
   against a plain sentence list, a filled --accent-ink rectangle became the
   highest-contrast object on the page, which put the emphasis on a
   navigation control rather than on the grammar.

   Two changes. It is sage, not brick — brick is --target and means "this is
   the grammar being taught"; spending it on a button made it mean two things
   on one screen. And it is a tint with an ink label, not a fill with a white
   one: a tinted capsule with tinted text is a coloured object, while a
   tinted capsule with black text is a plain control that happens to be
   sage. Sentence case, because small letterspaced caps are this system's
   label voice and this is a thing you tap. */
.explore-btn{flex:none;display:inline-flex;align-items:center;
  font-family:var(--f-display);font-size:.78rem;font-weight:600;
  letter-spacing:0;
  padding:.34rem 1rem;border-radius:var(--r-chip);
  color:#FFFFFF;background:var(--sage-deep);border:none;
  cursor:pointer;
  transition:transform .12s cubic-bezier(.2,.8,.2,1),filter .2s}
.explore-btn:hover{filter:brightness(.92)}
.explore-btn:active{transform:scale(.94);filter:brightness(.86)}
.explore-btn:focus-visible{outline:2px solid var(--sage-deep);outline-offset:2px}

.markers{margin-bottom:1.1rem}
.markers.hidden{display:none}
.markers-t{font-family:var(--f-mono);font-size:.56rem;color:var(--dim);
  text-transform:uppercase;letter-spacing:.12em;margin-bottom:.55rem}
.markers-l{display:flex;flex-wrap:wrap;gap:.4rem .9rem}
.marker{color:var(--target);font-size:.86rem;font-weight:600}
.markers-group{margin-bottom:.85rem}
.markers-group:last-child{margin-bottom:0}

/* ── THE SENTENCE LIST ───────────────────────────────────────────────────
   This used to be a lens: verbs held in a centred, curved column so the
   paradigm read as a shape. It looked distinctive but it also looked like a
   spreadsheet — ragged subject widths on the left, a hard-edged box in the
   middle, tails wrapping unevenly on the right. Every sentence competed
   with the grid it was forced into instead of just being read.

   The Gerunds & Infinitives page solved the same problem — "show the
   pattern inside a real sentence" — with one flowing line per example: the
   trigger word boxed in place, the rest set as ordinary reading text. No
   columns to keep aligned, no shape that only holds up down to a point and
   then falls apart on a narrow screen. This page now does the same thing.
   Same two colours (a chip for the taught verb, brick for the time marker),
   just carried by a sentence instead of a table. */
.exs{display:flex;flex-direction:column;margin-bottom:1rem}
.ts-row{padding:.6rem 0;border-bottom:1px solid var(--rule);
  font-family:var(--f-read);font-size:11pt;line-height:1.65;
  color:var(--sentence)}
.exs .ts-row:last-child{border-bottom:none}

/* THE VERB. Carried by face and weight rather than by a grid cell: grotesk
   against serif, 600 against 400, sitting in its own chip so it still reads
   as the one word in the sentence being taught. */
.ts-verb{display:inline-block;font-family:var(--f-verb);font-weight:600;
  font-size:.94em;letter-spacing:-.008em;color:var(--tile-ink);
  background:var(--verb);border-radius:.4rem;padding:.02em .5em;margin:0 .1em;
  white-space:nowrap}

/* A second finite verb — a subordinate clause, the result half of a
   conditional — keeps the family but not the chip. */
.ts-row .vb{font-family:var(--f-verb);font-weight:600;color:var(--tile-ink)}
.ts-row .marker-inline{color:var(--target);font-weight:700}

.note{padding:.8rem 0 .8rem 1rem;border-left:1px solid var(--rule);
  font-size:.84rem;color:var(--dim);line-height:1.6}
.note i{color:var(--accent-ink);font-style:normal;margin-right:.4rem}

.msg{padding:3rem 1.5rem;text-align:center;color:var(--faint);
  line-height:1.7;font-size:.9rem}
.msg small{display:block;color:var(--faint);margin-top:.5rem;font-size:.72rem}

/* ── THE SLIDES SHEET ────────────────────────────────────────────────────
   Was rgba(8,8,9,.86) with a blur — the only near-black surface in the
   product, and a hard cut against a cream page. The veil is the page's own
   colour now, so the sheet reads as the page stepping back rather than as a
   different app launching. */
/* No lift. This card holds the map, which fills it — so there is nothing for
   a shadow to separate it from, and a 70px spread under it dimmed the ground
   the map's own pills are lifted against. The pills keep their shadows; the
   surface behind them does not need one. */
.slides-card{position:relative;width:min(760px,100%);height:100%;
  border-radius:var(--r-sheet);overflow:hidden;background:var(--card);
  /* ── THE LIFT ────────────────────────────────────────────────────────────
     Not one shadow but four, each wider and fainter than the last. A single
     large blur has a visible edge where it stops; a stack falls off the way
     light actually does, so the card seems to sit above the page rather than
     to have a grey halo drawn round it. Total opacity stays under a quarter
     of what a single shadow would need, which is why it reads as a glow and
     not as weight. */
  box-shadow:
    0 1px 2px  rgba(43,33,41,.04),
    0 4px 10px rgba(43,33,41,.05),
    0 12px 28px rgba(43,33,41,.06),
    0 28px 64px rgba(43,33,41,.07)}
.slides-card iframe{width:100%;height:100%;border:none;display:block}
@media(max-width:768px){
  .sheet.slides{padding:0}
  .slides-card{border-radius:0}
}

@media(max-width:600px){
  :root{--header-h:172px}
  .inner{padding:.9rem .75rem 2rem}
}

/* ── bigger type on wide screens ──
   A phone is read at about 30cm, a projected whiteboard at six metres. Only
   above 900px, roughly 15% larger, with NO change to weight — bolding would
   thicken the strokes and on a projector's soft focus actually reduce
   legibility. */
@media (min-width:900px){
  .ts-row{font-size:14pt}
  .ts-verb{font-size:.92em}
  .marker{font-size:.95rem}
  .markers-t{font-size:.62rem}
  .uc-title{font-size:1.08rem}
  .note{font-size:.86rem}
  .vtab{font-size:.66rem}
  .mode-btn{font-size:.76rem}
}
</style>
</head>
<body>

<header class="header">
  <div class="header-top">
<a class="back-link" href="#" onclick="history.back();return false;" target="_top">← Grammar</a>
    <div class="header-title">
      <div class="app-title">INTUITY</div>
      <div class="app-subtitle">B2 First Tenses</div>
    </div>
    <span class="header-spacer">Level <b>B2–C1</b></span>
  </div>

  <!-- No emoji. Five saturated multicolour glyphs sat across the top of every
       page in a palette of warm grey and one orange — the loudest thing on
       screen, each saying nothing the word beside it did not. -->
  <div class="mode-selector">
    <button class="mode-btn active" data-mode="explore">Explore</button>
    <button class="mode-btn" data-mode="practice">Practice</button>
    <button class="mode-btn" data-mode="quiz">Quiz</button>
    <a class="mode-btn" href="/skills/grammar-rules/tenses-defuse">Defuse</a>
    <a class="mode-btn" href="/skills/grammar-rules/tenses-forge">Forge</a>
  </div>

  <div class="set-tabs" id="catTabs"></div>
  <div class="set-tabs" id="tenseTabs"></div>
  <!-- Practice and Quiz report their set list upward and it is drawn HERE,
       beside Explore's own tabs. Navigation belongs in one place for every
       mode: a student changes set the same way they change tense, and the
       gate below only has to point at it. -->
  <div class="set-tabs hidden" id="frameTabs"></div>
</header>

<div class="area active" id="exploreArea">
  <div class="inner"><div class="cards" id="list"></div></div>
</div>

<!-- Practice and Quiz are sheets that sit BELOW the header, never over it.
     The header is where the set tabs live, and a student mid-exercise still
     has to be able to see which set they are in, switch to another, or leave
     the mode — so covering it would hide the only navigation they have. The
     frames report their set lists upward and #frameTabs draws them beside
     Explore's own tabs. -->
<div class="area sheet-mode" id="practiceArea">
  <div class="sheet-full">
    <button class="close-btn sheet-close" data-close type="button"
            aria-label="Close Practice">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
             stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="sheet-gate" id="practiceGate">
      <div class="gate-mark pend-hang"><div class="pend-dial"><span>?</span></div></div>
      <div class="gate-head">Pick a set above to start practising</div>
      <div class="gate-sub">Each set is a different group of sentences — choose one from the tabs above.</div>
    </div>
    <div class="frame"><iframe id="practiceFrame" title="Practice"></iframe></div>
  </div>
</div>

<div class="area sheet-mode" id="quizArea">
  <div class="sheet-full">
    <button class="close-btn sheet-close" data-close type="button"
            aria-label="Close Quiz">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
             stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="sheet-gate" id="quizGate">
      <div class="gate-mark pend-hang"><div class="pend-dial"><span>?</span></div></div>
      <div class="gate-head">Pick a set above to start the quiz</div>
      <div class="gate-sub">Each set is a different group of sentences — choose one from the tabs above.</div>
    </div>
    <div class="frame"><iframe id="quizFrame" title="Quiz"></iframe></div>
  </div>
</div>

<div class="sheet slides" id="slides">
  <div class="slides-card">
    <button class="close-btn" id="closeX" type="button" aria-label="Close"
            style="position:absolute;top:.6rem;right:.6rem;z-index:5">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
           stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <iframe id="slidesFrame" title="Tense slides"></iframe>
  </div>
</div>

<script>
const PLAY  = 'explore-map.html';   // ONE renderer for every topic
/* Bump when a framed page changes. Iframes are cached independently of the
   top document, so a hard refresh of THIS page can still serve a stale child.
   The query string makes each build a distinct URL. */
const BUILD = '2026-09-01a';
const DEF   = '../../data/grammar-rules/tenses-rules.json';
const P     = new URLSearchParams(location.search);
const JSON_URL = P.get('json') || DEF;

const CATS   = ['present','past','future'];
const CATL   = ['Present','Past','Future'];
const TENSES = ['simple','continuous','perfect','perfect-continuous'];
const TENSEL = ['Simple','Continuous','Perfect','Perfect continuous'];

let data = [], cat = 0, tense = 0, view = 'list', mainMode = 'explore';
const $ = id => document.getElementById(id);

/* ── time-marker helpers ──
   timeMarkers is either a flat array of strings, or {list1,list2} groups.
   normMarkerGroups always returns groups so the renderer has one code path;
   flatMarkers flattens for the inline highlighter. */
function normMarkerGroups(tm){
  if(!tm) return [];
  if(Array.isArray(tm)) return tm.length ? [{ label:'Time markers', items: tm }] : [];
  const groups = [];
  if(tm.list1 && tm.list1.items && tm.list1.items.length) groups.push(tm.list1);
  if(tm.list2 && tm.list2.items && tm.list2.items.length) groups.push(tm.list2);
  return groups;
}
function flatMarkers(tm){
  if(!tm) return [];
  if(Array.isArray(tm)) return tm;
  return [...((tm.list1&&tm.list1.items)||[]), ...((tm.list2&&tm.list2.items)||[])];
}
function escRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function esc(s){ return escHtml(s); }
function escHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* Most sentences carry a time expression that is NOT in the section's own
   timeMarkers list, so only one sentence in six was ever marked. This is the
   same fallback the map uses to pick its cue, so the two surfaces agree on
   what the signal word is. */
const TIME_RE = /\b((?:every|each|this|next|last)\s+\w+|on\s+\w+days?|in\s+the\s+\w+|at\s+\d[\d:.]*\s*(?:am|pm)?|at\s+(?:night|noon|midnight|dawn|dusk|weekends?)|since\s+\w+|for\s+\w+(?:\s+\w+)?|all\s+\w+|as soon as|hardly ever|yet|just|already|never|ever|always|usually|often|sometimes|rarely|nowadays|recently|lately|currently|tomorrow|tonight|yesterday|today|now)\b/gi;

function highlightMarkers(text, markers){
  const safe = escHtml(text);
  let out = safe, hit = false;
  if(markers && markers.length){
    const sorted = [...markers].sort((a,b)=>b.length-a.length).map(escRe);
    const re = new RegExp('\\b(' + sorted.join('|') + ')\\b','gi');
    out = safe.replace(re, m => { hit = true; return '<span class="marker-inline">'+m+'</span>'; });
  }
  /* only fall back when the listed markers found nothing, so a section that
     does mark its own words keeps full control */
  if(!hit){ TIME_RE.lastIndex = 0; out = safe.replace(TIME_RE,'<span class="marker-inline">$1</span>'); }
  return out;
}

/* ── PRELOADING THE FRAMES ───────────────────────────────────────────────
   Practice and Quiz used to get their src on FIRST SWITCH, so the first tap
   on either showed an empty white frame while it fetched — the one place
   where switching mode inside this document was slower than navigating away
   from it. Both are mounted during boot, off-screen and non-interactive, so
   by the time anyone taps they are already painted and the switch is a
   cross-fade with nothing to load. */
function mountFrames(){
  const f1 = $('practiceFrame'), f2 = $('quizFrame');
  if(f1 && !f1.getAttribute('src')) f1.setAttribute('src','tenses-practice.html?v='+BUILD);
  if(f2 && !f2.getAttribute('src')) f2.setAttribute('src','tenses-gapfill.html?v='+BUILD);
}

async function boot(){
  try{
    const res = await fetch(JSON_URL, { cache:'no-store' });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const raw = await res.json();
    const list = Array.isArray(raw) ? raw : (raw.rules || Object.values(raw));
    data = Array.isArray(list) ? list : Object.values(list);
  }catch(e){
    $('list').innerHTML = '<div class="msg">Couldn\'t load the tense rules.'+
      '<small>Looked for '+JSON_URL+' — '+String(e.message||e).replace(/[<>]/g,'')+'</small></div>';
    syncHeader();
    return;
  }
  buildTabs();
  paintList();
  syncHeader();

  /* Explore is on screen and readable; the frames load in the gap after it,
     so they cost the first paint nothing and are ready before they're wanted. */
  requestIdleCallbackSafe(mountFrames);

  /* Defuse and Forge link BACK here as ?mode=quiz. Without this the parameter
     was ignored and every return landed on Explore. Also makes each mode
     addressable by URL. */
  const wanted = P.get('mode');
  if(wanted && wanted !== 'explore' && document.querySelector('.mode-btn[data-mode="'+wanted+'"]')){
    mountFrames();          // wanted immediately — don't wait for idle
    switchMode(wanted);
  }
}
function requestIdleCallbackSafe(fn){
  if(window.requestIdleCallback) requestIdleCallback(fn,{timeout:1500});
  else setTimeout(fn,400);
}

const current = () => data.find(t => t.id === CATS[cat]+'-'+TENSES[tense]);

/* ── tabs ── */
function buildTabs(){
  const c = $('catTabs'); c.innerHTML = '';
  CATL.forEach((label,i)=>{
    const b = document.createElement('button');
    b.className = 'vtab lead' + (i===cat ? ' active' : '');
    b.textContent = label;
    b.onclick = () => { if(i===cat) return; cat = i; buildTabs(); paintList(); refreshSlides(); };
    c.appendChild(b);
  });
  const t = $('tenseTabs'); t.innerHTML = '';
  TENSEL.forEach((label,i)=>{
    const b = document.createElement('button');
    b.className = 'vtab' + (i===tense ? ' active' : '');
    b.textContent = label;
    b.onclick = () => { if(i===tense) return; tense = i; buildTabs(); paintList(); refreshSlides(); };
    t.appendChild(b);
  });
  syncHeader();
}

/* ── ONE SENTENCE ────────────────────────────────────────────────────────
   The data marks its verbs. {{...}} is the verb that exemplifies THIS
   section's tense and gets the chip; {...} is any other finite verb in the
   sentence, which keeps the family but not the chip. An unmarked sentence
   just renders as a plain line, so a set that has not been marked yet still
   renders correctly. */
function renderExample(text, markers){
  const parts = text.split(/\{\{([^}]+)\}\}/);
  if(parts.length < 2)
    return '<div class="ts-row">'+inlineParts(text, markers)+'</div>';
  return '<div class="ts-row">'+
    inlineParts(parts[0], markers)+
    '<span class="ts-verb">'+escHtml(parts[1])+'</span>'+
    inlineParts(parts.slice(2).join(''), markers)+
  '</div>';
}
/* time markers in brick, any secondary verb in the tint */
function inlineParts(text, markers){
  return text.split(/\{([^}]+)\}/).map((seg,i) =>
    i % 2 ? '<span class="vb">'+escHtml(seg)+'</span>'
          : highlightMarkers(seg, markers)
  ).join('');
}

/* ── list ── */
function paintList(){
  const tn = current(), wrap = $('list');
  if(!tn || !tn.useCases){
    wrap.innerHTML = '<div class="msg">No use cases for this tense yet.</div>';
    return;
  }
  wrap.innerHTML = tn.useCases.map((uc,i) => {
    const groups = normMarkerGroups(uc.timeMarkers);
    const flat   = flatMarkers(uc.timeMarkers);
    const markers = groups.length
      ? '<div class="markers">'+ groups.map(g =>
          '<div class="markers-group"><div class="markers-t">'+g.label+'</div>'+
          '<div class="markers-l">'+
            g.items.map(m=>'<span class="marker">'+escHtml(m)+'</span>').join('')+
          '</div></div>').join('') +'</div>'
      : '';
    const exs = [uc.mainExample].concat(uc.moreExamples||[])
      .map(e=>renderExample(e, flat)).join('');
    const note = uc.note ? '<div class="note"><i>💡</i>'+escHtml(uc.note)+'</div>' : '';
    return '<div class="card"><div class="card-head">'+
             '<div class="uc-title">'+uc.title+'</div>'+
             '<button class="explore-btn" type="button" data-sec="'+i+'">Explore</button>'+
           '</div>'+ markers +'<div class="exs">'+exs+'</div>'+ note +'</div>';
  }).join('');
  wrap.querySelectorAll('.explore-btn').forEach(b =>
    b.addEventListener('click', () => openMap(+b.dataset.sec)));
}

/* ── modes ──
   Same-document switching, wrapped in a view transition so it uses the exact
   mechanism the cross-document navigation to Defuse/Forge uses. That is what
   makes all five modes feel like one surface: the three in here and the two
   out there now change over identically. */
function applyMode(mode){
  mainMode = mode;
  document.querySelectorAll('.mode-btn[data-mode]').forEach(b =>
    b.classList.toggle('active', b.dataset.mode === mode));
  document.querySelectorAll('.area').forEach(a => a.classList.remove('active'));

  const explore = mode === 'explore';
  /* Explore is always the page underneath, so it stays active while a sheet
     is open — closing the sheet reveals it already scrolled where it was. */
  $('exploreArea').classList.add('active');
  $('catTabs').classList.toggle('hidden', !explore);
  $('tenseTabs').classList.toggle('hidden', !explore);
  /* A sheet covers the header, so nothing there needs hiding any more. */
  if(explore)                 $('exploreArea').classList.add('active');
  else if(mode === 'practice'){ mountFrames(); $('practiceArea').classList.add('active'); openGate('practice'); }
  else if(mode === 'quiz'){     mountFrames(); $('quizArea').classList.add('active'); openGate('quiz'); }
  /* the page behind a sheet must not scroll under the finger */
  document.body.style.overflow = explore ? '' : 'hidden';
  paintFrameTabs();
  syncHeader();
}

/* ── CLOSING IS TWO STEPS, NOT ONE ───────────────────────────────────────
   Leaving an exercise dropped the student all the way back to Explore, so
   choosing a different set meant Practice → gate → set again — three moves
   to do the thing they had just been doing. Closing now returns to the gate
   it came from, and only a second close leaves the mode. Same control, one
   step at a time: exercise → set list → Explore. */
function closeSheet(){
  if(mainMode === 'explore') return;
  const g = $(gateFor[mainMode] && gateFor[mainMode].gate);
  if(g && !g.classList.contains('open')){ openGate(mainMode); return; }
  switchMode('explore');
}
document.querySelectorAll('[data-close]').forEach(b =>
  b.addEventListener('click', closeSheet));
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && mainMode !== 'explore' && view !== 'slides') closeSheet();
});
function switchMode(mode){
  if(mode === mainMode) return;
  const u = new URL(location.href);
  if(mode === 'explore') u.searchParams.delete('mode'); else u.searchParams.set('mode', mode);
  history.replaceState(null,'',u);
  if(document.startViewTransition && !matchMedia('(prefers-reduced-motion: reduce)').matches){
    document.startViewTransition(() => applyMode(mode));
  }else{
    applyMode(mode);
  }
}
document.querySelectorAll('.mode-btn[data-mode]').forEach(b =>
  b.addEventListener('click', () => switchMode(b.dataset.mode)));

/* The tab relay that used to live here is gone with the sheets. The frame
   owns its own tabs; the host owns the page behind them. */

/* ── slides ── */
function openMap(section){
  view = 'slides';
  $('slidesFrame').setAttribute('src',
    PLAY+'?topic=tenses&category='+CATS[cat]+'&tense='+TENSES[tense]+
    '&section='+section+'&json='+encodeURIComponent(JSON_URL));
  $('slides').classList.add('open');
}
function closeMap(){
  view = 'list';
  $('slides').classList.remove('open');
  $('slidesFrame').setAttribute('src','');
}
function refreshSlides(){ if(view === 'slides') closeMap(); }
$('closeX').onclick = closeMap;
$('slides').addEventListener('click', e => { if(e.target === $('slides')) closeMap(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && view === 'slides') closeMap(); });
window.addEventListener('message', e => { if(e.data && e.data.intuity === 'showList') closeMap(); });

/* ── layout sync ──
   Measures the real header instead of trusting the CSS guess: two tab rows
   plus a five-item mode row wrap to different heights at every width, so a
   stale --header-h lets the header sit on top of the content. */
function syncHeader(){
  const h = document.querySelector('.header');
  if(h) document.documentElement.style.setProperty('--header-h', h.offsetHeight+'px');
}
window.addEventListener('resize', syncHeader);
window.addEventListener('orientationchange', () => setTimeout(syncHeader,120));
/* Returning from Defuse or Forge restores this page from the back/forward
   cache: boot() does not run again and nothing resizes, so --header-h can be
   left at whatever it was. pageshow is the only event that fires on a bfcache
   restore. */
window.addEventListener('pageshow', e => {
  syncHeader();
  if(e.persisted) requestAnimationFrame(syncHeader);
});
document.addEventListener('visibilitychange', () => { if(!document.hidden) syncHeader(); });
if(document.fonts && document.fonts.ready) document.fonts.ready.then(syncHeader);
/* syncHeader measures at the instant it is called, but the header can change
   height AFTER that — a late webfont swap, or the tab row rewrapping once
   layout settles. A ResizeObserver removes the timing question entirely. */
if(window.ResizeObserver){
  const h = document.querySelector('.header');
  if(h) new ResizeObserver(() => syncHeader()).observe(h);
}else{
  [0,60,200,500].forEach(ms => setTimeout(syncHeader, ms));
}

/* ── SET NAVIGATION LIVES IN THE HEADER ──────────────────────────────────
   The gate used to list every set as a tile inside the sheet. That put the
   same choice in two places and, worse, made the sheet the thing you chose
   from — so a student who wanted a different set had to reopen the sheet
   rather than just tap the header.

   Navigation belongs in one place for every mode: Explore's tense tabs and
   Practice/Quiz's set tabs are drawn in the same row, in the same header, in
   the same chips. The gate only points at it. */
const gateFor = { practice:{gate:'practiceGate', frame:'practiceFrame'},
                  quiz:    {gate:'quizGate',     frame:'quizFrame'} };
const testLists = { practice:null, quiz:null };
/* null, not 0. The gate says "pick a set above" while a tab sits highlighted
   — so the page contradicted itself, and a student who took the highlight at
   face value pressed the tab that was already lit and saw nothing happen.
   Nothing is chosen until the student chooses it. */
let frameActive = { practice:null, quiz:null };

window.addEventListener('message', e => {
  if(!e.data || e.data.intuity !== 'tests') return;
  const from = e.data.mode;
  if(from !== 'practice' && from !== 'quiz') return;
  testLists[from] = e.data.titles || [];
  /* The frame reports which test it has loaded, which is 0 before anyone has
     picked. Adopting that would re-light the first tab behind the gate and
     put the contradiction straight back. Only take it once a choice exists. */
  if(frameActive[from] !== null) frameActive[from] = e.data.active || 0;
  if(from === mainMode) paintFrameTabs();
});

function paintFrameTabs(){
  const wrap = $('frameTabs');
  if(!wrap) return;
  const titles = testLists[mainMode];
  const on = mainMode !== 'explore' && titles && titles.length;
  wrap.classList.toggle('hidden', !on);
  if(!on){ wrap.innerHTML = ''; syncHeader(); return; }
  wrap.innerHTML = titles.map((t,i) =>
    '<button class="vtab' + (i === frameActive[mainMode] ? ' active' : '') +
    '" type="button" data-i="' + i + '">' + esc(t) + '</button>').join('');
  wrap.querySelectorAll('.vtab').forEach(b =>
    b.addEventListener('click', () => chooseSet(mainMode, +b.dataset.i)));
  syncHeader();
}

function chooseSet(mode, index){
  frameActive[mode] = index;
  const f = $(gateFor[mode].frame);
  /* The frame owns its content, so it is TOLD which set to load rather than
     reloaded — it is already parsed, so the switch is instant. */
  if(f && f.contentWindow) f.contentWindow.postMessage({ intuity:'setTest', index:index }, '*');
  const g = $(gateFor[mode].gate);
  if(g) g.classList.remove('open');   /* the gate's job is done once a set is picked */
  paintFrameTabs();
}

/* The gate returns every time the sheet opens: nothing is chosen for the
   student, and nothing is remembered from last time either. */
function openGate(mode){
  /* back at the gate, nothing is selected again — including after a close,
     so a student returning to pick a different set sees no stale highlight */
  if(gateFor[mode]) frameActive[mode] = null;
  const g = $(gateFor[mode] && gateFor[mode].gate);
  if(g) g.classList.add('open');
  paintFrameTabs();
  /* A framed page that never announces its sets — the older topic pages do
     not — would leave the gate pointing at an empty header row. After a
     moment, step out of the way and show the exercises. */
  setTimeout(() => {
    if(mainMode === mode && (!testLists[mode] || !testLists[mode].length) && g){
      g.classList.remove('open');
    }
  }, 1400);
}

/* Tell the framed pages that this host draws the tabs, so they hide their own
   and the row is not shown twice. A page that never hears this keeps its own,
   which is exactly what a standalone visit needs. */
function announceHost(){
  ['practiceFrame','quizFrame'].forEach(id => {
    const f = $(id);
    if(f && f.contentWindow) { try{ f.contentWindow.postMessage({intuity:'hostTabs'},'*'); }catch(e){} }
  });
}
['practiceFrame','quizFrame'].forEach(id => {
  const f = document.getElementById(id);
  if(f) f.addEventListener('load', announceHost);
});

boot();
</script>
