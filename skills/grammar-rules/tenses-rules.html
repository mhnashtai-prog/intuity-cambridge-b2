<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INTUITY - Tenses</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* Fixed-height flex column. The old layout sized the iframe with a
       hard-coded calc(100vh - 250px), which assumes the chrome above it
       is 250px tall. On a phone the mode selector and both tab strips
       wrap to extra lines, so the real chrome is taller and the iframe
       gets a sliver. flex:1 lets the browser work out what's actually
       left over, on any device. */
    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #0d0d0d;
      background-image: radial-gradient(circle at 20% 50%, rgba(201, 169, 97, 0.04) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(201, 169, 97, 0.03) 0%, transparent 50%);
      color: #e5e5e5;
      padding: 1rem;
      display: flex;
      flex-direction: column;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
      min-height: 0;
    }

    /* TOP NAVIGATION */
    .top-nav {
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 0;
      margin-bottom: 1rem;
      gap: 1rem;
      opacity: 0;
      animation: fadeInDown 0.8s ease forwards;
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      min-width: 100px;
    }

    .nav-link {
      color: #8e8e93;
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      transition: color 0.3s ease;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 0.375rem;
    }

    .nav-link:hover {
      color: #C9A961;
    }

    .nav-center {
      flex: 1;
      text-align: center;
    }

    .nav-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      color: #C9A961;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #C9A961 0%, rgba(201, 169, 97, 0.7) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .nav-right {
      min-width: 100px;
    }

    /* HEADER */
    header {
      flex-shrink: 0;
      text-align: center;
      margin-bottom: 1.5rem;
      padding: 0.5rem 0;
      opacity: 0;
      animation: fadeIn 0.8s ease 0.2s forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .subtitle {
      font-size: 0.875rem;
      color: #8e8e93;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    /* MODE SELECTOR */
    .mode-selector-container {
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      margin-bottom: 1.5rem;
      opacity: 0;
      animation: fadeIn 0.8s ease 0.4s forwards;
    }

    .mode-selector {
      display: flex;
      background: rgba(28, 28, 30, 0.6);
      backdrop-filter: blur(40px);
      border-radius: 999px;
      border: 1px solid rgba(201, 169, 97, 0.2);
      overflow: hidden;
    }

    .mode-option {
      padding: 0.625rem 1.25rem;
      background: transparent;
      border: none;
      color: #636366;
      cursor: pointer;
      font-size: 0.8125rem;
      font-weight: 600;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border-right: 1px solid rgba(84, 84, 88, 0.2);
    }

    .mode-option:last-child {
      border-right: none;
    }

    .mode-option:hover {
      color: #9ca3af;
      background: rgba(201, 169, 97, 0.1);
    }

    .mode-option.active {
      color: #C9A961;
      background: rgba(201, 169, 97, 0.15);
    }

    /* VIEW MODE TOGGLE */
    .view-mode-container {
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      margin-bottom: 1.5rem;
      opacity: 0;
      animation: fadeIn 0.8s ease 0.6s forwards;
    }

    .view-mode-container.hidden {
      display: none;
    }

    .toggle-container {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: rgba(28, 28, 30, 0.6);
      backdrop-filter: blur(40px);
      padding: 0.75rem 1.5rem;
      border-radius: 999px;
      border: 1px solid rgba(201, 169, 97, 0.2);
    }

    .toggle-label {
      font-size: 0.875rem;
      color: #636366;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: color 0.3s;
      cursor: pointer;
      background: none;
      border: none;
      font-family: 'Inter', sans-serif;
    }

    .toggle-label.active {
      color: #C9A961;
    }

    .toggle-switch {
      position: relative;
      width: 56px;
      height: 30px;
      background: rgba(28, 28, 30, 0.8);
      border: 1px solid rgba(84, 84, 88, 0.3);
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .toggle-switch:hover {
      border-color: rgba(201, 169, 97, 0.4);
    }

    .toggle-switch:focus-visible {
      outline: 2px solid #C9A961;
      outline-offset: 3px;
    }

    .toggle-slider {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 22px;
      height: 22px;
      background: #C9A961;
      border-radius: 50%;
      transition: all 0.3s ease;
      box-shadow: 0 2px 8px rgba(201, 169, 97, 0.4);
    }

    .toggle-switch.active .toggle-slider {
      transform: translateX(26px);
    }

    /* CATEGORY TABS (PRESENT/PAST/FUTURE) */
    .category-tabs {
      flex-shrink: 0;
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid rgba(84, 84, 88, 0.2);
      opacity: 0;
      animation: fadeIn 0.8s ease 0.8s forwards;
    }

    .category-tabs.hidden {
      display: none;
    }

    .category-tab {
      padding: 0.5rem 1.25rem;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: #636366;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 600;
      transition: all 0.2s ease;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .category-tab:hover {
      color: #C9A961;
      border-bottom-color: rgba(201, 169, 97, 0.3);
    }

    .category-tab.active {
      color: #C9A961;
      border-bottom-color: #C9A961;
    }

    /* TENSE TABS (SIMPLE/CONTINUOUS/PERFECT/PERFECT CONTINUOUS) */
    .tense-tabs {
      flex-shrink: 0;
      display: flex;
      gap: 0.375rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 2rem;
      opacity: 0;
      animation: fadeIn 0.8s ease 1s forwards;
    }

    .tense-tabs.hidden {
      display: none;
    }

    .tense-tab {
      padding: 0.375rem 0.625rem;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: #8e8e93;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 500;
      transition: all 0.2s ease;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .tense-tab:hover {
      color: #C9A961;
      border-bottom-color: rgba(201, 169, 97, 0.3);
    }

    .tense-tab.active {
      color: #C9A961;
      border-bottom-color: #C9A961;
      font-weight: 600;
    }

    /* CONTENT AREAS */
    .content-area {
      display: none;
      flex: 1;
      min-height: 0;
    }

    .content-area.active {
      display: flex;
      flex-direction: column;
    }

    /* LIST VIEW */
    .list-view {
      display: none;
    }

    .list-view.show {
      display: block;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      opacity: 0;
      animation: fadeIn 0.6s ease forwards;
    }

    .list-container {
      display: flex;
      flex-direction: column;
      gap: 2rem;
      padding-bottom: 2rem;
    }

    .list-item {
      background: rgba(28, 28, 30, 0.6);
      backdrop-filter: blur(40px);
      border: 1px solid rgba(201, 169, 97, 0.2);
      border-radius: 1.25rem;
      padding: 2rem;
      transition: all 0.3s ease;
    }

    .list-item:hover {
      border-color: rgba(201, 169, 97, 0.4);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .list-use-case-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.125rem;
      color: #C9A961;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 1.5rem;
      font-weight: 600;
      padding: 0.5rem 1rem;
      background: rgba(201, 169, 97, 0.1);
      border-radius: 0.5rem;
      display: inline-block;
    }

    .list-time-markers {
      background: rgba(96, 165, 250, 0.08);
      border: 1px solid rgba(96, 165, 250, 0.25);
      border-radius: 0.625rem;
      padding: 0.875rem 1rem;
      margin-bottom: 1.5rem;
    }

    .list-time-markers.hidden {
      display: none;
    }

    .list-time-markers-title {
      font-size: 0.625rem;
      color: #8e8e93;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.625rem;
    }

    .list-time-markers-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .time-marker {
      background: rgba(96, 165, 250, 0.15);
      color: #60a5fa;
      padding: 0.3rem 0.75rem;
      border-radius: 0.375rem;
      font-size: 0.75rem;
      font-weight: 500;
      border: 1px solid rgba(96, 165, 250, 0.3);
    }

    .list-examples {
      display: flex;
      flex-direction: column;
      gap: 0.875rem;
      margin-bottom: 1.25rem;
    }

    .list-example {
      font-size: 1.125rem;
      line-height: 1.6;
      color: #e5e5e7;
      font-weight: 400;
      padding: 0.75rem 1rem;
      background: rgba(48, 48, 51, 0.3);
      border-radius: 0.5rem;
      border-left: 3px solid #60a5fa;
    }

    .list-note {
      padding: 1rem 1.25rem;
      background: rgba(251, 146, 60, 0.08);
      border-left: 3px solid #fb923c;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      color: #d1d1d6;
      line-height: 1.6;
    }

    .note-icon {
      color: #fb923c;
      margin-right: 0.5rem;
      font-size: 1rem;
    }

    .load-error {
      color: #fb923c;
      text-align: center;
      padding: 3rem 1rem;
      line-height: 1.6;
    }

    /* SLIDES VIEW */
    .slides-view {
      display: none;
    }

    .slides-view.show {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      opacity: 0;
      animation: fadeIn 0.6s ease forwards;
    }

    /* IFRAME CONTAINER */
    .iframe-container {
      width: 100%;
      flex: 1;
      min-height: 0;
      border: none;
      border-radius: 1.5rem;
      overflow: hidden;
    }

    .iframe-container iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* MOBILE RESPONSIVE */
    @media (max-width: 768px) {
      body { padding: 0.75rem; }
      .nav-title { font-size: 1.25rem; }
      .subtitle { font-size: 0.75rem; }
      .mode-option { font-size: 0.7rem; padding: 0.5rem 0.875rem; }
      .category-tab { font-size: 0.8125rem; padding: 0.4375rem 1rem; }
      .tense-tab { font-size: 0.6875rem; padding: 0.3125rem 0.5rem; }
      .time-marker { font-size: 0.6875rem; padding: 0.25rem 0.625rem; }
      .list-item { padding: 1.5rem; }
      .list-use-case-title { font-size: 0.9375rem; }
      .list-example { font-size: 1rem; }
    }

    @media (max-width: 480px) {
      body { padding: 0.5rem; }
      .nav-title { font-size: 1rem; }
      .subtitle { font-size: 0.65rem; }
      .mode-option { font-size: 0.625rem; padding: 0.4rem 0.75rem; }
      .category-tab { font-size: 0.75rem; padding: 0.375rem 0.875rem; }
      .tense-tab { font-size: 0.625rem; padding: 0.25rem 0.4rem; }
      .time-marker { font-size: 0.625rem; padding: 0.2rem 0.5rem; }
      .list-example { font-size: 0.9375rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- TOP NAVIGATION -->
    <div class="top-nav">
      <div class="nav-left">
        <a class='nav-link' href='/?openModal=grammar'>← Grammar</a>
      </div>
      <div class="nav-center">
        <div class="nav-title">INTUITY</div>
      </div>
      <div class="nav-right"></div>
    </div>

    <!-- HEADER -->
    <header>
      <p class="subtitle">B2 First Tenses · Interactive Grammar System</p>
    </header>

    <!-- MODE SELECTOR -->
    <div class="mode-selector-container">
      <div class="mode-selector">
        <button class="mode-option active" data-mode="explore">
          🗺️ <span>EXPLORE</span>
        </button>
        <button class="mode-option" data-mode="practice">
          ✍️ <span>PRACTICE</span>
        </button>
        <button class="mode-option" data-mode="quiz">
          📝 <span>QUIZ</span>
        </button>
        <button class="mode-option" data-href="tenses-defuse.html">
          💣 <span>DEFUSE</span>
        </button>
        <button class="mode-option" data-href="tenses-forge.html">
          🌀 <span>FORGE</span>
        </button>
      </div>
    </div>

    <!-- VIEW MODE TOGGLE: LIST | SLIDES -->
    <div class="view-mode-container" id="viewModeContainer">
      <div class="toggle-container">
        <button class="toggle-label active" id="listLabel" type="button">LIST</button>
        <div class="toggle-switch" id="viewModeToggle" role="switch" aria-checked="false"
             aria-label="Switch between list and slides" tabindex="0">
          <div class="toggle-slider"></div>
        </div>
        <button class="toggle-label" id="slidesLabel" type="button">SLIDES</button>
      </div>
    </div>

    <!-- CATEGORY TABS -->
    <div class="category-tabs" id="categoryTabs"></div>

    <!-- TENSE TABS -->
    <div class="tense-tabs" id="tenseTabs"></div>

    <!-- EXPLORE MODE CONTENT -->
    <div class="content-area active" id="exploreArea">

      <!-- LIST VIEW (default) -->
      <div class="list-view show" id="listView">
        <div class="list-container" id="listContainer"></div>
      </div>

      <!-- SLIDES VIEW (delegated to tense-play-mode.html) -->
      <div class="slides-view" id="slidesView">
        <div class="iframe-container">
          <iframe id="slidesIframe" src="" title="Tense slides"></iframe>
        </div>
      </div>

    </div>

    <!-- PRACTICE MODE CONTENT -->
    <div class="content-area" id="practiceArea">
      <div class="iframe-container">
        <iframe id="practiceIframe" src="" title="Practice"></iframe>
      </div>
    </div>

    <!-- QUIZ MODE CONTENT -->
    <div class="content-area" id="quizArea">
      <div class="iframe-container">
        <iframe id="quizIframe" src="" title="Quiz"></iframe>
      </div>
    </div>

  </div>

  <script>
    /* ============================================================
       DATA + STATE
       ============================================================ */
    const PLAY_MODE_FILE = 'tense-play-mode.html';
    const DEFAULT_JSON   = '../../data/grammar-rules/tenses-rules.json';

    // ?json=... overrides the data file, and is forwarded to the slides page
    // so parent and child always read the same source.
    const pageParams = new URLSearchParams(location.search);
    const JSON_PATH  = pageParams.get('json') || DEFAULT_JSON;

    let tensesData = [];

    let viewMode = 'list';        // 'list' | 'slides'  — list is the landing view
    let currentMainMode = 'explore';
    let currentCategory = 0;      // 0=Present, 1=Past, 2=Future
    let currentTense = 0;         // 0=Simple, 1=Continuous, 2=Perfect, 3=Perfect Continuous

    const categories     = ['present', 'past', 'future'];
    const categoryLabels = ['PRESENT', 'PAST', 'FUTURE'];
    const tenseTypes     = ['simple', 'continuous', 'perfect', 'perfect-continuous'];
    const tenseLabels    = ['Simple', 'Continuous', 'Perfect', 'Perfect Continuous'];

    /* ============================================================
       LOAD DATA
       Accepts either a bare array or { rules: [...] } / { ...map }.
       ============================================================ */
    async function loadData() {
      try {
        const response = await fetch(JSON_PATH);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const raw  = await response.json();
        const data = Array.isArray(raw) ? raw : (raw.rules || Object.values(raw));
        tensesData = Array.isArray(data) ? data : Object.values(data);

        init();
      } catch (error) {
        console.error('Error loading data:', error);
        document.getElementById('listContainer').innerHTML = `
          <div class="load-error">
            <div style="font-size: 2rem; margin-bottom: 1rem;">⚠️</div>
            <div>Couldn't load the tense rules.</div>
            <div style="font-size:0.8125rem; color:#8e8e93; margin-top:0.5rem;">
              Looked for: ${JSON_PATH}
            </div>
          </div>
        `;
      }
    }

    function getCurrentTenseData() {
      const tenseId = `${categories[currentCategory]}-${tenseTypes[currentTense]}`;
      return tensesData.find(t => t.id === tenseId);
    }

    /* ============================================================
       INIT
       ============================================================ */
    function init() {
      setupToggle();
      setupModeButtons();
      renderCategoryTabs();
      renderTenseTabs();
      buildListView();

      const requestedMode = pageParams.get('mode');
      if (requestedMode === 'practice' || requestedMode === 'quiz') {
        switchMainMode(requestedMode);
      }
      // ?view=slides opens straight into the slides page
      if (pageParams.get('view') === 'slides') setViewMode('slides');

      // The play page asks to come back to the list via postMessage.
      window.addEventListener('message', (e) => {
        if (e.data && e.data.intuity === 'showList') setViewMode('list');
      });
    }

    /* ============================================================
       MAIN MODE (EXPLORE / PRACTICE / QUIZ)
       ============================================================ */
    function switchMainMode(mode) {
      if (mode === currentMainMode) return;
      currentMainMode = mode;

      document.querySelectorAll('.mode-option').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === mode);
      });

      document.querySelectorAll('.content-area').forEach(area => area.classList.remove('active'));

      const viewModeContainer = document.getElementById('viewModeContainer');
      const categoryTabs = document.getElementById('categoryTabs');
      const tenseTabs = document.getElementById('tenseTabs');

      if (mode === 'explore') {
        viewModeContainer.classList.remove('hidden');
        categoryTabs.classList.remove('hidden');
        tenseTabs.classList.remove('hidden');
        document.getElementById('exploreArea').classList.add('active');
      } else {
        viewModeContainer.classList.add('hidden');
        categoryTabs.classList.add('hidden');
        tenseTabs.classList.add('hidden');

        if (mode === 'practice') {
          document.getElementById('practiceArea').classList.add('active');
          const iframe = document.getElementById('practiceIframe');
          if (!iframe.src || !iframe.src.includes('tenses-practice.html')) {
            iframe.src = 'tenses-practice.html';
          }
        } else if (mode === 'quiz') {
          document.getElementById('quizArea').classList.add('active');
          const iframe = document.getElementById('quizIframe');
          if (!iframe.src || !iframe.src.includes('tenses-gapfill.html')) {
            iframe.src = 'tenses-gapfill.html';
          }
        }
      }
    }

    /* ============================================================
       TABS
       ============================================================ */
    function switchCategory(index) {
      if (index === currentCategory) return;
      currentCategory = index;
      renderCategoryTabs();
      buildListView();
      loadSlides();          // only reloads if slides view is open
    }

    function switchTense(index) {
      if (index === currentTense) return;
      currentTense = index;
      renderTenseTabs();
      buildListView();
      loadSlides();
    }

    function renderCategoryTabs() {
      const container = document.getElementById('categoryTabs');
      container.innerHTML = '';
      categoryLabels.forEach((label, index) => {
        const tab = document.createElement('button');
        tab.className = `category-tab ${index === currentCategory ? 'active' : ''}`;
        tab.textContent = label;
        tab.onclick = () => switchCategory(index);
        container.appendChild(tab);
      });
    }

    function renderTenseTabs() {
      const container = document.getElementById('tenseTabs');
      container.innerHTML = '';
      tenseLabels.forEach((label, index) => {
        const tab = document.createElement('button');
        tab.className = `tense-tab ${index === currentTense ? 'active' : ''}`;
        tab.textContent = label;
        tab.onclick = () => switchTense(index);
        container.appendChild(tab);
      });
    }

    function setupModeButtons() {
      document.querySelectorAll('.mode-option[data-mode]').forEach(btn => {
        btn.addEventListener('click', () => switchMainMode(btn.dataset.mode));
      });
      document.querySelectorAll('.mode-option[data-href]').forEach(btn => {
        btn.addEventListener('click', () => { window.location.href = btn.dataset.href; });
      });
    }

    /* ============================================================
       VIEW MODE: LIST <-> SLIDES
       ============================================================ */
    function setupToggle() {
      const toggle = document.getElementById('viewModeToggle');
      toggle.addEventListener('click', () => setViewMode(viewMode === 'list' ? 'slides' : 'list'));
      toggle.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.key === 'Enter') {
          e.preventDefault();
          setViewMode(viewMode === 'list' ? 'slides' : 'list');
        }
      });
      document.getElementById('listLabel').addEventListener('click', () => setViewMode('list'));
      document.getElementById('slidesLabel').addEventListener('click', () => setViewMode('slides'));
    }

    function setViewMode(mode) {
      viewMode = mode;

      const toggle = document.getElementById('viewModeToggle');
      toggle.classList.toggle('active', mode === 'slides');
      toggle.setAttribute('aria-checked', mode === 'slides');

      document.getElementById('listLabel').classList.toggle('active', mode === 'list');
      document.getElementById('slidesLabel').classList.toggle('active', mode === 'slides');

      document.getElementById('listView').classList.toggle('show', mode === 'list');
      document.getElementById('slidesView').classList.toggle('show', mode === 'slides');

      if (mode === 'slides') loadSlides();
    }

    /* Points the iframe at tense-play-mode.html for the selected tense.
       The play page reads: ?category=present&tense=simple&json=... */
    function loadSlides() {
      if (viewMode !== 'slides') return;
      const iframe = document.getElementById('slidesIframe');
      const src = `${PLAY_MODE_FILE}?category=${categories[currentCategory]}`
                + `&tense=${tenseTypes[currentTense]}`
                + `&json=${encodeURIComponent(JSON_PATH)}`;
      if (iframe.getAttribute('src') !== src) iframe.setAttribute('src', src);
    }

    /* ============================================================
       LIST VIEW — static reference index for the selected tense
       ============================================================ */
    function buildListView() {
      const container = document.getElementById('listContainer');
      container.innerHTML = '';

      const tense = getCurrentTenseData();
      if (!tense || !tense.useCases) {
        container.innerHTML = `<div class="load-error">No use cases found for this tense yet.</div>`;
        return;
      }

      tense.useCases.forEach(useCase => {
        const item = document.createElement('div');
        item.className = 'list-item';

        let html = `<div class="list-use-case-title">${useCase.title}</div>`;

        if (useCase.timeMarkers && useCase.timeMarkers.length > 0) {
          html += `
            <div class="list-time-markers">
              <div class="list-time-markers-title">Time Markers:</div>
              <div class="list-time-markers-list">
                ${useCase.timeMarkers.map(marker => `<span class="time-marker">${marker}</span>`).join('')}
              </div>
            </div>
          `;
        }

        html += `<div class="list-examples">`;
        html += `<div class="list-example">${useCase.mainExample}</div>`;
        (useCase.moreExamples || []).forEach(example => {
          html += `<div class="list-example">${example}</div>`;
        });
        html += `</div>`;

        if (useCase.note) {
          html += `
            <div class="list-note">
              <span class="note-icon">💡</span>
              ${useCase.note}
            </div>
          `;
        }

        item.innerHTML = html;
        container.appendChild(item);
      });
    }

    loadData();
  </script>
</body>
</html>
