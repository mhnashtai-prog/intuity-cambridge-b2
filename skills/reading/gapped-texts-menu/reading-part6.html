<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>INTUITY — Reading · Part 6</title>
<meta name="theme-color" content="#F3F1ED">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500&family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=7">
<link rel="stylesheet" href="/data/use-of-english/uoe.css?v=2">
<link rel="stylesheet" href="/data/reading/reading.css?v=1">
<style>
  /* The only rule that stays in the page, for the reason this repo already
     records twice: intuity-shell.css sets body{color:var(--paper)} and
     expects each page to set its own ink. If a stylesheet fails to load,
     that rule stands and the page renders white on white — working, and
     completely invisible. A missing stylesheet should cost the styling,
     not the page. */
  body{color:var(--ink,#14110E);background:var(--screen,#F3F1ED);}
</style>
</head>
<body>

<header class="header">
  <div class="header-top">
    <a class="back-link" href="/index.html?openModal=reading" target="_top">&larr; Reading</a>
    <div class="header-title">
      <div class="app-title">INTUITY</div>
      <div class="app-subtitle">Reading &middot; Part 6</div>
    </div>
    <span class="header-spacer">
      <button class="mute" id="mute" type="button" aria-label="Sound">&#128266;</button>
      Level <b>B2</b>
    </span>
  </div>

  <!-- The three Reading parts, as navigation. Same row that carries
       Full texts / Sentences in Use of English Part 1: whatever the
       biggest sideways move is on a page, it lives here, and it is links
       rather than buttons so the browser handles it. -->
  <nav class="mode-selector" aria-label="Reading part">
    <a class="mode-btn" href="/skills/reading/multiple-choice-menu/reading-part5.html">Part 5</a>
    <span class="mode-btn active" aria-current="page">Part 6</span>
    <a class="mode-btn" href="/skills/reading/multiple-matching-menu/reading-part7.html">Part 7</a>
  </nav>

  <div class="set-tabs" id="setTabs"></div>
</header>

<div class="wrapper">
  <div class="setrow">
    <button class="arrow" id="prevSet" type="button" aria-label="Previous gap">&lsaquo;</button>
    <div class="tdots" id="tdots" role="tablist" aria-label="Choose a gap"></div>
    <button class="arrow" id="nextSet" type="button" aria-label="Next gap">&rsaquo;</button>
  </div>

  <!-- PER QUESTION IS THE DEFAULT, and on a phone that is not a
       concession. One chunk and one question is the only readable form on
       a 390px screen; Full text is the harder practice, and closer to what
       Cambridge sets, where finding the evidence across 550 words IS the
       skill. -->
  <div class="viewrow">
    <div class="viewtog" role="group" aria-label="How much to show">
      <button class="viewbtn active" type="button" data-view="one">Per gap</button>
      <button class="viewbtn"        type="button" data-view="full">Full text</button>
    </div>
  </div>

  <div id="board"><div class="loading">Loading&hellip;</div></div>
</div>

<div class="bar" id="bar">
  <button id="btnPrev" type="button">&lsaquo; Prev</button>
  <button class="go" id="btnSubmit" type="button" disabled>Submit</button>
  <button id="btnNext" type="button">Next &rsaquo;</button>
</div>

<!-- The choice card. One modal for the whole paper, built from the poster,
     replacing the three different sheets the old Reading pages carried
     (openQuestion, openGapModal, openTextModal). -->
<div class="rd-sheet" id="rdSheet" role="dialog" aria-modal="true" aria-label="Choose a sentence">
  <div class="rd-card">
    <div class="rd-card-kick" id="rdKick"></div>
    <div class="rd-card-q" id="rdQ"></div>
    <div id="rdOpts"></div>
    <button class="rd-close" id="rdClose" type="button">&times; Close</button>
  </div>
</div>

<div class="ov" id="ov">
  <div class="ov-card">
    <div class="ov-em" id="ovEm">🎉</div>
    <div class="ov-title" id="ovTitle">Done</div>
    <div class="ov-sc" id="ovScore"></div>
    <div class="ov-bars" id="ovBars"></div>
    <div class="ov-miss" id="ovMiss"></div>
    <div class="ov-btns">
      <button class="ov-btn primary" id="ovNext" type="button">Next text &rsaquo;</button>
      <button class="ov-btn ghost" id="ovAgain" type="button">↺ Try again</button>
      <button class="ov-btn ghost" id="ovClose" type="button">Review answers</button>
    </div>
  </div>
</div>

<script>
  /* The whole contract between this page and the engine.
     marksPerQuestion is 2 because Cambridge scores Reading Parts 5 and 6
     at two marks a question — Part 7 scores one. Every part of this
     product used to score everything out of one, which made a Reading
     percentage mean something Cambridge does not mean by it. */
  window.RD = {
    part: 6,
    kind: 'gap',          /* one text, six gaps, SEVEN sentences */
    texts: 12,
    marksPerQuestion: 2,  /* Cambridge scores Part 6 at two marks a gap */
    scoreKey: 'reading_part6_scores',
    path: function (n) {
      return '/data/reading/gapped-texts-folder/gapped-text' + n + '.json';
    }
  };
</script>
<script src="/skills/grammar-rules/intuity-sound.js"></script>
<script src="/data/reading/reading.js?v=1"></script>
</body>
</html>
