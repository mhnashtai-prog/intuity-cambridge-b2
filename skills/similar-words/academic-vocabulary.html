<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F3F1ED">
  <title>INTUITY — Academic Vocabulary</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Anton is the card's headline face; Geist carries everything else. The
       old page linked NO webfont at all, so every token in the shell resolved
       to system-ui and it rendered in San Francisco on a Mac, Segoe on
       Windows. That was the most visible thing wrong with it, and it was
       invisible in the stylesheet — because the stylesheet was correct. The
       page simply never asked for the type. -->
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500&family=Anton&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=7">
  <link rel="stylesheet" href="/data/similar-words/vocab.css?v=7">
  <style>
    .vtab .pct{font-family:var(--f-mono);font-size:.82em;opacity:.7;
      font-variant-numeric:tabular-nums}
  </style>
</head>
<body>

<header class="header">
  <div class="header-top">
    <a class="back-link" href="/index.html?openModal=vocabulary" target="_top">&larr; Vocabulary</a>
    <div class="header-title">
      <div class="app-title">INTUITY</div>
      <div class="app-subtitle">Academic Vocabulary &middot; B2 First</div>
    </div>
    <span class="header-spacer">Level <b>B2</b></span>
  </div>

  <!-- Three entries, because these are the same exercise on different
       material: a student who has done one already knows how to do the next.
       Academic Vocabulary was previously reachable only from the modal, which
       is why nobody arriving at Similar Words ever found it. -->
  <div class="mode-selector">
    <a class="mode-btn" href="/skills/similar-words/vocabulary.html">Similar Words</a>
    <a class="mode-btn" href="/skills/similar-words/topic-vocabulary.html">Topic Vocabulary</a>
    <span class="mode-btn active">Academic</span>
  </div>

  <div class="set-tabs" id="setTabs"></div>
</header>

<div class="wrap">
  <div class="strip">
    <span><span class="strip-label">Tap a word, then tap its gap</span><span class="strip-tally" id="tally"></span></span>
    <div class="view-toggle" role="group" aria-label="How many sets to show">
      <button class="view-btn" type="button" data-view="all" aria-pressed="true">All sets</button>
      <button class="view-btn" type="button" data-view="one" aria-pressed="false">One set</button>
    </div>
    <button class="snd" id="sndBtn" type="button" aria-pressed="false" aria-label="Sound off"></button>
    <div class="dots" id="dots"></div>
  </div>
  <div id="board" class="board"><div class="loading">Loading&hellip;</div></div>
</div>

<div class="action-bar">
  <button class="nav-btn" id="prevBtn" type="button" hidden>&larr; Prev</button>
  <button class="action-btn secondary" id="clearBtn" type="button">Clear</button>
  <button class="action-btn primary" id="checkBtn" type="button" disabled>Check</button>
  <button class="nav-btn" id="nextBtn" type="button" hidden>Next &rarr;</button>
</div>

<script>
  /* The whole page-level contract. Eight words to a set instead of four or
     five, which the pool wraps to two rows for and nothing else notices. */
  window.VOCAB = { data: 'academic-vocabulary-sets', scoreKey: 'academic_vocabulary_scores' };
</script>
<script src="/skills/grammar-rules/intuity-sound.js"></script>
<script src="/data/similar-words/vocab.js?v=6"></script>

<script>
/* The header wraps to different heights at every width and the strip is
   sticky against --header-h, so it is measured rather than guessed. */
function syncHeader(){
  var h = document.querySelector('.header');
  if (h) document.documentElement.style.setProperty('--header-h', h.offsetHeight + 'px');
}
addEventListener('resize', syncHeader);
addEventListener('orientationchange', function(){ setTimeout(syncHeader, 120); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(syncHeader);
if (window.ResizeObserver) {
  var hh = document.querySelector('.header');
  if (hh) new ResizeObserver(syncHeader).observe(hh);
}
syncHeader();
</script>
</body>
</html>
