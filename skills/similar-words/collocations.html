<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F3F1ED">
  <title>INTUITY — Collocations</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500&family=Anton&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=5">
  <!-- vocab.css carries the poster palette, the card, the strip, the action
       bar and the sage accent. colloc.css adds only what a BANK needs. Two
       links rather than a copy: the card is one card in two pages. -->
  <link rel="stylesheet" href="/data/similar-words/vocab.css?v=3">
  <link rel="stylesheet" href="/data/similar-words/colloc.css?v=1">
  <style>
    .vtab .pct{font-family:var(--f-mono);font-size:.82em;opacity:.7;
      font-variant-numeric:tabular-nums}
    /* Browse has nothing to score, so the strip carries a count instead of a
       tally and the dots stay empty. Same row, doing the job the mode needs. */
    .strip-tally{margin-left:.55rem}
  </style>
</head>
<body>

<header class="header">
  <div class="header-top">
    <a class="back-link" href="/index.html?openModal=vocabulary" target="_top">← Vocabulary</a>
    <div class="header-title">
      <div class="app-title">INTUITY</div>
      <div class="app-subtitle">Collocations · B2–C1</div>
    </div>
    <span class="header-spacer">Level <b>B2–C1</b></span>
  </div>

  <!-- Two real modes, not two sibling pages. Browse is the resource and
       Practice is generated from it, which is why they belong in one row on
       one page rather than being two entries in the menu. -->
  <div class="mode-selector">
    <button class="mode-btn active" type="button" data-mode="browse">Browse</button>
    <button class="mode-btn" type="button" data-mode="practice">Practice</button>
  </div>

  <!-- The seven pattern families. The only axis that is not the node, and it
       is here because a teacher planning a lesson thinks in patterns even
       though a learner looking a word up does not. -->
  <div class="set-tabs" id="setTabs"></div>
</header>

<div class="wrap">
  <div class="strip">
    <span><span class="strip-label" id="stripLabel">The partners that go with each word</span><span class="strip-tally" id="tally"></span></span>
    <div class="dots" id="dots"></div>
  </div>
  <div id="board" class="bank"><div class="loading">Loading…</div></div>
</div>

<div class="action-bar" id="actionBar" style="display:none">
  <button class="action-btn secondary" id="clearBtn" type="button">New set</button>
  <button class="action-btn primary" id="checkBtn" type="button" disabled>Check</button>
</div>

<script src="/skills/grammar-rules/intuity-sound.js"></script>
<script src="/data/similar-words/colloc.js?v=1"></script>

<script>
function syncHeader(){
  var h = document.querySelector('.header');
  if (h) document.documentElement.style.setProperty('--header-h', h.offsetHeight + 'px');
}
addEventListener('resize', syncHeader);
addEventListener('orientationchange', function(){ setTimeout(syncHeader, 120); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(syncHeader);
if (window.ResizeObserver) {
  var hh = document.querySelector('.header');
  if (hh) new ResizeObserver(syncHeader).observe(hh);
}
syncHeader();
</script>
</body>
</html>
