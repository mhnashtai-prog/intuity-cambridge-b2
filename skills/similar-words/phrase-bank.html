<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F3F1ED">
  <title>INTUITY — Phrase Bank</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500&family=Anton&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=5">
  <!-- Same two links as collocations: the shell carries the header, the mode
       row and the set tabs; vocab.css carries the poster, the strip and the
       action bar. Only the board below is new, and it is the same shape as
       colloc's .bank — a stack of posters, one per node. -->
  <link rel="stylesheet" href="/data/similar-words/vocab.css?v=3">
  <style>
    /* --- board: mirrors colloc.css .bank / .kick / .cols / .col --- */
    .bank{display:flex;flex-direction:column;gap:.6rem}
    .kick{display:flex;align-items:center;gap:9px;
      font-family:var(--f-mono);font-size:.56rem;letter-spacing:.22em;
      text-transform:uppercase;color:var(--poster-faint);margin-bottom:.9rem}
    .kick i{display:block;width:26px;height:10px;flex:none;background:var(--caramel)}
    .poster .node{font-family:'Anton',Impact,var(--f-display),sans-serif;
      font-weight:400;font-size:clamp(1.47rem,6.3vw,2.1rem);line-height:.95;
      color:var(--poster-ink);margin:0 0 .2rem}
    .poster-sub{font-family:var(--f-mono);font-size:.58rem;letter-spacing:.16em;
      text-transform:uppercase;color:var(--poster-faint);margin-bottom:.85rem}
    .cols{display:flex;flex-direction:column;gap:.05rem}
    .col{display:grid;grid-template-columns:minmax(6.5rem,auto) 1fr;
      gap:.1rem .9rem;align-items:baseline;padding:.45rem 0}
    .col + .col{border-top:1px solid var(--poster-rule)}
    .col .w{font-family:var(--f-display);font-weight:700;font-size:1rem;
      color:var(--poster-ink);justify-self:start}
    .col .eg{font-size:.86rem;line-height:1.55;color:var(--poster-body)}

    /* The one axis collocations doesn't have: these phrases are graded for
       formality, so the register rides the row it belongs to. */
    .reg{font-family:var(--f-mono);font-size:.5rem;letter-spacing:.12em;
      text-transform:uppercase;color:var(--poster-faint);
      justify-self:start;align-self:center}
    .col.has-reg{grid-template-columns:minmax(6.5rem,auto) 1fr auto}

    /* Practice: the frame is the thing being learned, so the gap falls in the
       frame, not in the example. Tap the row to check — no typing on a phone. */
    .gap{display:inline-block;min-width:3.4em;border-bottom:2px solid var(--sage);
      color:transparent;user-select:none;transition:color .2s}
    .col.shown .gap{color:var(--poster-ink)}
    .practice .col{cursor:pointer}
    .practice .col:active{background:var(--poster-fill)}

    /* Produce: the question is the prompt and the frames hide behind it, so a
       learner speaks first and checks second. */
    .prompt{font-family:var(--f-display);font-weight:600;font-size:1rem;
      line-height:1.45;color:var(--poster-ink);margin:0 0 .1rem}
    .prompt + .prompt{margin-top:.7rem}
    .peek{margin-top:1rem;font-family:var(--f-display);font-size:.62rem;
      font-weight:700;letter-spacing:.08em;text-transform:uppercase;
      color:var(--sage,#527065);background:var(--poster-fill);
      border:none;border-radius:var(--r-chip);padding:.5rem 1rem;cursor:pointer}
    .poster[data-open="0"] .cols{display:none}

    .count{font-family:var(--f-mono);font-size:.82em;opacity:.7;
      font-variant-numeric:tabular-nums}
    .strip-tally{margin-left:.55rem}
  </style>
</head>
<body>

<header class="header">
  <div class="header-top">
    <a class="back-link" href="/index.html?openModal=vocabulary" target="_top">← Vocabulary</a>
    <div class="header-title">
      <div class="app-title">INTUITY</div>
      <div class="app-subtitle">Phrase Bank · B2–C1</div>
    </div>
    <span class="header-spacer">Level <b>B2–C1</b></span>
  </div>

  <!-- Three modes because the page already had three: read the frames, recall
       them, produce them. They were buried inside a function view, where a
       learner never found them. -->
  <div class="mode-selector">
    <button class="mode-btn active" type="button" data-mode="browse">Browse</button>
    <button class="mode-btn" type="button" data-mode="practice">Practice</button>
    <button class="mode-btn" type="button" data-mode="produce">Produce</button>
  </div>

  <!-- The five families the corpus already groups by. Filtering here is what
       stops 28 moves competing for one screen. -->
  <div class="set-tabs" id="setTabs"></div>
</header>

<div class="wrap">
  <div class="strip">
    <span><span class="strip-label" id="stripLabel">The phrases that do each job</span><span class="strip-tally" id="tally"></span></span>
    <div class="dots" id="dots"></div>
  </div>
  <div id="board" class="bank"><div class="loading">Loading…</div></div>
</div>

<div class="action-bar" id="actionBar" style="display:none">
  <button class="action-btn secondary" id="resetBtn" type="button">Reset</button>
  <button class="action-btn primary" id="revealBtn" type="button">Reveal all</button>
</div>

<script>
var CORPUS={}, FAMS=[], mode='browse', set='all';
var shown={};

function frameOf(){ return ''; }

/* Same two adapters as the road page, unchanged — the corpus format is not
   what needed fixing. */
function adaptV2(data){
  var out={};
  for(var k in (data.categories||{})){
    var c=data.categories[k]; if(c.hidden) continue;
    out[k]={name:c.label, purpose:c.note||'', functions:{}};
  }
  for(var fid in (data.functions||{})){
    var fn=data.functions[fid];
    if(fn.hidden || !out[fn.category]) continue;
    out[fn.category].functions[fid]={
      label:fn.label, tasks:fn.tasks||[], when:fn.when||'',
      yield:(fn.phrases||[]).length,
      capsule:(fn.phrases||[]).map(function(p){
        return {stem:p.t, tail:p.connector||'', register:p.register||null};
      })
    };
  }
  return out;
}
function adaptCorpus(data){
  if(data && data.functions && !Array.isArray(data.functions)) return adaptV2(data);
  var out={};
  for(var fk in data.families) out[fk]={name:data.families[fk].label, purpose:data.families[fk].purpose, functions:{}};
  (data.functions||[]).forEach(function(fn){
    if(!out[fn.family]) return;
    out[fn.family].functions[fn.id]={
      label:fn.label, tasks:fn.tasks||[], when:fn.when||'',
      yield:fn.phrases.length,
      capsule:fn.phrases.map(function(p){ return {stem:p.stem, tail:p.connector, register:p.register||null}; })
    };
  });
  return out;
}

function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

/* Blank the longest content word — the load-bearing one in a frame. */
var STOP=('the a an is it of to that this there be in on and or but as so if far my i one no not are was were '+
 'been being for with from by at would could may might will can do does than then few people say said what '+
 'which who when how why over past years').split(' ');
function blank(stem){
  var toks=stem.split(/(\s+)/), best=-1, len=0;
  toks.forEach(function(t,i){
    var w=t.replace(/[^A-Za-z']/g,'').toLowerCase();
    if(w.length>=4 && STOP.indexOf(w)<0 && t.indexOf('…')<0 && w.length>len){ len=w.length; best=i; }
  });
  if(best<0) return stem;
  var o=toks[best], lead=(o.match(/^[^A-Za-z']*/)||[''])[0], trail=(o.match(/[^A-Za-z']*$/)||[''])[0];
  toks[best]=lead+'<span class="gap">'+o.slice(lead.length,o.length-trail.length)+'</span>'+trail;
  return toks.join('');
}

function funcsInSet(){
  var list=[];
  FAMS.forEach(function(f){
    if(set!=='all' && set!==f) return;
    var F=CORPUS[f];
    for(var k in F.functions) list.push({fam:f, famName:F.name, k:k, fn:F.functions[k]});
  });
  return list;
}

function render(){
  var board=document.getElementById('board');
  var list=funcsInSet();
  board.className='bank'+(mode==='practice'?' practice':'');
  board.innerHTML=list.map(function(it,i){
    var fn=it.fn, open = mode==='produce' ? 0 : 1;
    var rows=fn.capsule.map(function(p,j){
      var stem = mode==='practice' ? blank(p.stem) : p.stem;
      var reg = p.register ? '<span class="reg">'+p.register+'</span>' : '';
      return '<div class="col'+(p.register?' has-reg':'')+'" data-f="'+i+'" data-p="'+j+'">'+
             '<span class="w">'+stem+'</span>'+
             '<span class="eg">'+(p.tail||'')+'</span>'+reg+'</div>';
    }).join('');
    var prompts='';
    if(mode==='produce'){
      var qs=(fn.tasks||[]).filter(function(t){return t.question;}).map(function(t){return t.question;});
      if(!qs.length && fn.when) qs=[cap(fn.when)];
      prompts=qs.map(function(q){ return '<p class="prompt">'+q+'</p>'; }).join('')+
        '<button class="peek" type="button" data-peek="'+i+'">Show the frames</button>';
    }
    return '<article class="poster" data-open="'+open+'" data-i="'+i+'">'+
      '<div class="kick"><i></i>'+it.famName+'</div>'+
      '<h2 class="node">'+(fn.label||cap(it.k))+'</h2>'+
      '<div class="poster-sub">'+fn.yield+' expressions'+(fn.when?' · '+fn.when:'')+'</div>'+
      prompts+'<div class="cols">'+rows+'</div></article>';
  }).join('') || '<div class="loading">Nothing in this set yet.</div>';

  document.getElementById('tally').textContent='· '+list.length+' moves, '+
    list.reduce(function(s,it){return s+it.fn.yield;},0)+' phrases';
  document.getElementById('stripLabel').textContent =
    mode==='browse' ? 'The phrases that do each job' :
    mode==='practice' ? 'Recall the frame, then tap to check' :
                        'Answer aloud, then check your frames';
  document.getElementById('actionBar').style.display = mode==='browse' ? 'none' : 'flex';
  drawDots(list.length);
}

function drawDots(n){
  var d=document.getElementById('dots');
  if(mode==='browse'||!n){ d.innerHTML=''; return; }
  var html=''; for(var i=0;i<n;i++) html+='<span class="dot'+(shown[i]?' answered':'')+'"></span>';
  d.innerHTML=html;
}

document.addEventListener('click',function(e){
  var mb=e.target.closest('.mode-btn');
  if(mb){
    document.querySelectorAll('.mode-btn').forEach(function(b){b.classList.remove('active');});
    mb.classList.add('active'); mode=mb.dataset.mode; shown={}; render(); return;
  }
  var st=e.target.closest('.set-tab');
  if(st){
    document.querySelectorAll('.set-tab').forEach(function(b){b.classList.remove('active');});
    st.classList.add('active'); set=st.dataset.set; shown={}; render(); return;
  }
  var pk=e.target.closest('.peek');
  if(pk){
    var art=pk.closest('.poster');
    art.dataset.open = art.dataset.open==='1' ? '0' : '1';
    pk.textContent = art.dataset.open==='1' ? 'Hide the frames' : 'Show the frames';
    shown[art.dataset.i]=1; drawDots(document.querySelectorAll('.poster').length); return;
  }
  var col=e.target.closest('.col');
  if(col && mode==='practice'){
    col.classList.add('shown');
    shown[col.dataset.f]=1; drawDots(document.querySelectorAll('.poster').length);
  }
});
document.getElementById('revealBtn').addEventListener('click',function(){
  document.querySelectorAll('.col').forEach(function(c){c.classList.add('shown');});
  document.querySelectorAll('.poster').forEach(function(a,i){a.dataset.open='1'; shown[i]=1;});
  document.querySelectorAll('.peek').forEach(function(p){p.textContent='Hide the frames';});
  drawDots(document.querySelectorAll('.poster').length);
});
document.getElementById('resetBtn').addEventListener('click',function(){ shown={}; render(); });

function corpusUrl(){
  return new URLSearchParams(location.search).get('json') || '/data/similar-words/phrase-bank-corpus.json';
}
fetch(corpusUrl()).then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
  .then(function(data){
    CORPUS=adaptCorpus(data); FAMS=Object.keys(CORPUS);
    document.getElementById('setTabs').innerHTML =
      '<button class="set-tab active" type="button" data-set="all">All</button>'+
      FAMS.map(function(f){
        return '<button class="set-tab" type="button" data-set="'+f+'">'+CORPUS[f].name+
               ' <span class="count">'+Object.keys(CORPUS[f].functions).length+'</span></button>';
      }).join('');
    render(); syncHeader();
  })
  .catch(function(err){
    document.getElementById('board').innerHTML='<div class="error">Couldn\u2019t load the phrase corpus ('+corpusUrl()+'). '+err.message+'.</div>';
  });

function syncHeader(){
  var h=document.querySelector('.header');
  if(h) document.documentElement.style.setProperty('--header-h', h.offsetHeight+'px');
}
addEventListener('resize', syncHeader);
addEventListener('orientationchange', function(){ setTimeout(syncHeader,120); });
if(document.fonts && document.fonts.ready) document.fonts.ready.then(syncHeader);
if(window.ResizeObserver){ var hh=document.querySelector('.header'); if(hh) new ResizeObserver(syncHeader).observe(hh); }
syncHeader();
</script>
</body>
</html>
