<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTUITY — Phrase Bank</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500&family=Anton&display=swap" rel="stylesheet">
<!-- Tokens only. This page keeps its own layout — the constellation is a
     teaching surface, not a document — but it stops owning its own colours
     and type, which is what made it read as a different product. -->
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=7">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  :root{
    /* ── THE BOARD IS A RECESS, THE CARDS ARE PAPER ON IT ──
       This is the one page in the product that genuinely needs a BOARD: ten
       cards floating in open space, draggable, with no column to sit in. On
       --screen they would have nothing to lift off and a 1px shadow would
       be doing all the work.

       So the board is --sunk #EBE8E1, which the shell declared for exactly
       this ("a recess in the page … that should read as behind rather than
       above") and which nothing had used. The cards are --card #FAF8F5.
       That is 3.87 ΔE of separation, against 1.54 on a normal page — the
       cards sit up, on a surface that is still unmistakably this product.

       It is also Sort's relationship, board darker than paper, which is the
       right precedent: Sort is the other page where things are moved
       around rather than read down. */
    --board:#EBE8E1;
    --gold:var(--accent-ink);

    /* ── BLACK, CARAMEL, SAGE, GREY. NOTHING ELSE ──
       The five family hues are gone from every screen, not just from the
       constellation. They were teal, amber, red, purple and gold — five
       saturated colours doing a job the family's own NAME was already
       doing, in a product whose whole argument is that colour is spent
       only where it earns something.

       --fc and --fc-d survive as names because the markup and the script
       set them per family and neither is being touched. They now resolve
       to the same two values everywhere: caramel for a mark, sage for an
       action. A family is told apart by what it is called. */
    --sage:#527065; --sage-d:#456055;
    --evaluating:var(--caramel);   --evaluating-d:var(--sage-d);
    --reasoning:var(--caramel);    --reasoning-d:var(--sage-d);
    --positioning:var(--caramel);  --positioning-d:var(--sage-d);
    --projecting:var(--caramel);   --projecting-d:var(--sage-d);
    --relating:var(--caramel);     --relating-d:var(--sage-d);
    --ink:#14110E; --stance:#5C5852;
  }
  html,body{width:100%;height:100%;background:var(--board);overflow:hidden;}
  body{font-family:var(--f-body);color:var(--paper);-webkit-tap-highlight-color:transparent;}

  .header{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;
    justify-content:space-between;padding:.7rem 1.15rem;height:52px;
    background:var(--board);border-bottom:1px solid var(--rule);}
  .brand{display:flex;flex-direction:column;gap:1px;}
  .brand-t{font-family:var(--f-display);font-weight:800;font-size:.9rem;letter-spacing:-.01em;}
  .brand-s{font-size:.5rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);}
  .back-link{position:absolute;left:1.15rem;text-decoration:none;font-family:var(--f-display);
    font-size:.58rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);}
  .back-link:hover{color:var(--paper);}
  .header .brand{margin:0 auto;align-items:center;}
  .crumb{position:absolute;right:1.15rem;font-family:var(--f-display);font-size:.56rem;
    font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);cursor:pointer;
    opacity:0;transition:opacity .2s;pointer-events:none;}
  .crumb.show{opacity:1;pointer-events:auto;}
  .crumb:hover{color:var(--ink);}

  .stage{position:fixed;top:52px;left:0;right:0;bottom:0;overflow-y:auto;
    scrollbar-width:thin;scrollbar-color:var(--rule) transparent;}
  .stage::-webkit-scrollbar{width:5px;} .stage::-webkit-scrollbar-thumb{background:var(--rule);border-radius:3px;}
  .stage.no-scroll{overflow:hidden;}
  .wrap{max-width:1180px;margin:0 auto;padding:1.3rem 1.15rem 3rem;}
  .wrap.full{max-width:none;padding:0;}

  .lead-row{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin:0 0 1.1rem;}
  .lead-chip{display:inline-flex;align-items:center;gap:.4rem;
    font-family:var(--f-display);font-size:.7rem;font-weight:500;
    letter-spacing:.04em;color:var(--dim);
    background:var(--tile-bg);border:none;
    padding:.32rem .8rem;border-radius:2rem;white-space:nowrap;}
  .lead-chip b{color:var(--ink);font-weight:700;}
  .lead-bar i{display:inline-block;width:13px;height:4px;border-radius:2px;background:var(--caramel);}
  .lead-bar i:nth-child(1){opacity:.3;} .lead-bar i:nth-child(2){opacity:.6;}
  .lead-do{color:var(--accent-ink);border-color:transparent;background:var(--tile-bg);}
  .lead{font-size:.8rem;color:var(--faint);font-weight:500;margin:.1rem .3rem 1.15rem;line-height:1.5;max-width:640px;}
  .cap-inner{max-width:640px;margin:0 auto;}

  /* ── LEVEL 1 · FIVE FAMILY CARDS, ALL ON ONE SCREEN ── */
  .fam-carousel{position:relative;display:flex;align-items:stretch;gap:.4rem;}
/* the row no longer scrolls sideways — columns wrap, so this scrolls down */
  .fam-viewport{flex:1;min-width:0;overflow-x:hidden;overflow-y:auto;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:.2rem 0 .3rem;}
  .fam-viewport::-webkit-scrollbar{display:none;}
/* ══ CARDS SIZE TO THEIR CONTENTS ═══════════════════════════════════
   align-items:stretch forced every card to the height of the tallest, so
   "Weighing it up" showed four badges above a large empty panel while the
   ten-category set ran off the right edge with only a 4px sliver to say so.
   Columns instead: a card is as tall as its own functions, and a short card
   leaves room for the next one BENEATH it. Nothing off screen. */
  /* column-WIDTH, not column-count. Five was a number picked for one
     window: at 1366px it gave each card ~250px, each badge ~90px, and
     DISADVANTAGES needs more than 90px at this size however you set it.

     Declaring a minimum width instead lets the browser choose the count —
     five on a wide screen, three on a laptop, one on a phone — and every
     card is guaranteed enough room for its longest name. This is the
     "repositioned" part: nothing is placed at a fixed count any more. */
  .families{columns:20rem;column-gap:.85rem;padding:0 .15rem;display:block;}
  .fam{position:relative;padding-top:1rem;break-inside:avoid;-webkit-column-break-inside:avoid;
    page-break-inside:avoid;width:100%;margin:0 0 .7rem;min-width:0;
    background:var(--card);border-radius:var(--r-sheet);padding:1.1rem .9rem 1rem;
    display:flex;flex-direction:column;
    box-shadow:0 6px 16px -6px rgba(20,17,14,.20),0 2px 5px rgba(20,17,14,.09);}
  .fam-sec{position:relative;}
  /* A second family sharing a card. A rule, not a dashed one — this product
     does not draw dashed lines anywhere else. */
  .fam-sec.guest{margin-top:1.4rem;padding-top:1.4rem;
    border-top:1px solid var(--poster-rule);}
  /* The poster kicker, at family scale. Same 26x10 caramel block, same mono
     uppercase at the same tracking as every other card in the product. The
     coloured slab and its folded tail are gone: they were the only place in
     INTUITY where a label sat on a filled shape, and they existed to carry
     a hue that no longer exists. */
  .fam-head{display:flex;align-items:center;gap:9px;margin-bottom:.5rem;}
  .fam-head::before{content:'';display:block;flex:none;
    width:26px;height:10px;background:var(--caramel);}
  /* NO white-space:nowrap and NO ellipsis. "Likelihood and trends" was being
     cut to fit a fixed ribbon; the heading wraps now and the card grows. */
  .fam-name{font-family:var(--f-mono);font-weight:400;font-size:.56rem;
    letter-spacing:.16em;text-transform:uppercase;color:var(--poster-faint);
    line-height:1.35;min-width:0;}
  .fam-purpose{font-size:.7rem;font-style:italic;color:var(--poster-body);
    margin:0 0 .85rem;line-height:1.45;}
  /* ── inside each family card: 2-col catalogue, filling the card top-down ── */
  /* Two columns when there is room for two, one when there is not. A hard
     `1fr 1fr` is what forced a 90px badge to hold a 13-letter word. */
  /* 8.5rem = 136px. DISADVANTAGES, the longest label in the corpus, measures
     ~102px at this size and weight, plus 22px of padding — so 136px is the
     narrowest a badge may be and still hold its worst case on one line.
     7.5rem let auto-fit slip a third column in at ~1000px and put the badge
     back to 104px, two pixels of slack. Measured, not guessed. */
  .fam-badges{display:grid;grid-template-columns:repeat(auto-fit,minmax(8.5rem,1fr));
    gap:.5rem;align-content:start;}
  /* ── WHY THE NAMES WERE BREAKING ───────────────────────────────────
     DISADVANTA/GES. SIMILARITIE/S. SPECULATIO/N. COMPLAININ/G. Three things
     were fighting: a fixed FIVE-column outer layout, a rigid two-column grid
     inside each card, and `word-break:break-word`, which is licence to split
     a word at any letter with no hyphen to say it happened.

     All three are fixed below, and the order matters — widening the column
     is what actually solves it. The other two only stop the symptom being
     hidden. */
  .fbadge{position:relative;min-width:0;display:flex;flex-direction:column;
    cursor:pointer;text-align:left;
    background:var(--poster-fill);border:none;border-radius:var(--r-sheet);
    padding:.75rem .7rem .6rem;
    /* No min-height. A card is as tall as its name needs — this is the
       "expand if necessary" part, and a two-line name simply gets two
       lines instead of being sliced. */
    transition:background .16s;}
  @media(hover:hover){
    .fbadge:hover{background:var(--poster-fill-hi);}
  }
  .fbadge:active{transform:scale(.98);}
  .fbadge:focus-visible{outline:2px solid var(--caramel);outline-offset:2px;}
  /* The count. Mono, grey, no pill — a pill is a shape that means "a word
     goes here" elsewhere in the product, and this is a number about the
     card, not something to tap. */
  .fbadge-tag{align-self:flex-start;font-family:var(--f-mono);font-size:.5rem;
    font-weight:400;letter-spacing:.14em;text-transform:uppercase;
    color:var(--poster-faint);background:none;padding:0;margin-bottom:.45rem;}
  .fbadge-hero{flex:1;display:flex;align-items:center;font-family:var(--f-display);
    font-size:.68rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    color:var(--poster-ink);line-height:1.25;
    /* overflow-wrap, not word-break: it breaks BETWEEN words first and only
       splits one if a single word cannot fit any line at all. And hyphens
       so that if it ever does come to that, the reader is told. */
    overflow-wrap:break-word;word-break:normal;hyphens:auto;}
  .fbadge-foot{display:flex;align-items:center;justify-content:flex-end;margin-top:.5rem;}
  /* Sage, the action colour. The one place on this screen that is not
     black, caramel or grey — because it is the only thing here you press. */
  .fbadge-open{flex-shrink:0;width:1.25rem;height:1.25rem;
    border-radius:var(--r-field);
    background:none;color:var(--sage);
    display:flex;align-items:center;justify-content:center;
    font-size:.7rem;line-height:1;font-weight:700;transition:background .16s;}
  @media(hover:hover){
    .fbadge:hover .fbadge-open{background:rgba(82,112,101,.14);}
  }

  /* ── LEVEL 2 · FUNCTIONS within a family (kept for future radial use) ── */
  .fn-list{display:flex;flex-direction:column;gap:.55rem;}
  .fn-tile{position:relative;display:flex;align-items:center;justify-content:space-between;gap:.8rem;
    border-radius:.85rem;padding:.9rem 1.05rem;cursor:pointer;
    background:var(--card);border:none;
    border-left:4px solid var(--fc);transition:transform .16s,background .2s;}
  .fn-tile:hover{transform:translateX(3px);background:var(--tile-bg-press);}
  .fn-tile:focus-visible{outline:2px solid var(--fc);outline-offset:2px;}
  .fn-name{font-family:var(--f-display);font-weight:800;font-size:.82rem;letter-spacing:.04em;
    text-transform:uppercase;color:var(--card);}
  .fn-when{font-size:.68rem;font-style:italic;color:var(--faint);margin-top:.15rem;}
  .fn-yield{flex-shrink:0;font-family:var(--f-display);font-size:.56rem;font-weight:700;
    letter-spacing:.05em;color:var(--fc);background:color-mix(in srgb,var(--fc) 14%,transparent);
    border:1px solid color-mix(in srgb,var(--fc) 35%,transparent);border-radius:999px;padding:.25rem .6rem;white-space:nowrap;}

  /* ── LEVEL 2 · CONSTELLATION — question centre, phrases orbiting, no spokes ── */
  .constellation{position:relative;width:100%;height:calc(100vh - 52px);overflow:hidden;
    touch-action:none;}

  /* the question: plain, prominent, no box, no circle */
  .q-centre{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;
    width:min(46%,520px);text-align:center;pointer-events:none;}
  .q-eyebrow{font-family:var(--f-display);font-size:.56rem;font-weight:700;letter-spacing:.16em;
    text-transform:uppercase;color:var(--fc);opacity:.9;margin-bottom:.7rem;}
  /* THE QUESTION. Anton, because this is the headline of the whole screen
     and Anton is what the product uses for a headline. The text-shadow is
     gone: it existed to hold white type off a near-black field, and on this
     board it would be a smudge. */
  .q-text{font-family:'Anton',Impact,var(--f-display),sans-serif;
    font-weight:400;letter-spacing:.01em;
    font-size:clamp(1.3rem,2.4vw,1.95rem);line-height:1.18;color:var(--ink);}
  .q-next{pointer-events:auto;margin-top:1.1rem;font-family:var(--f-display);font-size:.58rem;
    font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fc);
    background:color-mix(in srgb,var(--fc) 12%,transparent);
    border:1px solid color-mix(in srgb,var(--fc) 40%,transparent);border-radius:999px;
    padding:.5rem 1.1rem;cursor:pointer;transition:background .18s,transform .18s;}
  .q-next:hover{background:color-mix(in srgb,var(--fc) 24%,transparent);transform:translateY(-1px);}
  .q-controls{display:flex;align-items:center;justify-content:center;gap:.55rem;margin-top:1.1rem;flex-wrap:wrap;}
  .q-controls .q-next{margin-top:0;}
  .q-practice{pointer-events:auto;font-family:var(--f-display);font-size:.58rem;font-weight:700;
    letter-spacing:.08em;text-transform:uppercase;color:var(--dim);
    background:var(--tile-bg);border:none;border-radius:999px;
    padding:.5rem 1rem;cursor:pointer;transition:all .18s;}
  .q-practice:hover{color:var(--ink);border-color:var(--faint);}
  .q-practice.on{color:var(--fc);background:color-mix(in srgb,var(--fc) 16%,transparent);
    border-color:color-mix(in srgb,var(--fc) 45%,transparent);}
  .q-further{pointer-events:auto;text-decoration:none;font-family:var(--f-display);font-size:.58rem;
    font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);
    background:var(--tile-bg);border:none;border-radius:var(--r-chip);
    padding:.5rem 1rem;transition:all .18s;}
  .q-further:hover{background:var(--tile-bg-press);transform:translateY(-1px);}

  /* gap-blank in practice mode */
  .gap{display:inline-block;min-width:3.2em;text-align:center;
    border-bottom:2px dashed color-mix(in srgb,var(--fc) 60%,#bbb);color:transparent;
    cursor:pointer;user-select:none;transition:color .2s,border-color .2s;position:relative;}
  .gap.revealed{color:var(--fc-d);border-bottom-color:transparent;font-weight:800;}
  .enode.practising{cursor:pointer;}
  .enode.practising .enode-tail{opacity:.55;}

  /* phrase card — white poster with family-hue RIBBON BANNER (unity element) */
  /* THE PHRASE CARD, AS A POSTER.
     Square corners and the paper token, like every other card in the
     product. The shadow is the one thing here that is NOT the poster's:
     a card lying in a column gets 1px, but a card floating on a board with
     nothing under it needs to read as picked up, and it has to survive
     being dragged over another card. So it is a real drop shadow, tuned
     down from the old one — which was built for near-black and turned to
     mud on a light board. */
  .enode{position:absolute;z-index:2;width:270px;
    background:var(--card);border-radius:var(--r-sheet);
    padding:2.3rem .95rem .85rem;cursor:grab;transform:translate(-50%,-50%);
    box-shadow:0 6px 16px -6px rgba(20,17,14,.22),0 2px 5px rgba(20,17,14,.10);
    /* SHADOW ONLY. NOT transform.
       Every card is positioned with transform:translate(-50%,-50%), and the
       first thing mousedown does is hand off from that to absolute pixels:
       it measures the rect, sets transform:none, and writes the same visual
       position into left/top. The maths is exact, so nothing should move.

       Put transform in this transition and the browser ANIMATES that handoff
       — the card slides half its width and half its height over 180ms before
       the pointer takes over. That is the jump before it settles. The
       transition was doing precisely what it was told; it should not have
       been told. */
    transition:box-shadow .18s;
    user-select:none;-webkit-user-select:none;}
  .enode:active{cursor:grabbing;}
  /* Lifted. Higher and softer, so a dragged card is visibly ABOVE the
     others rather than merely on top of them in z-order. */
  .enode.dragging{box-shadow:0 18px 38px -10px rgba(20,17,14,.32),0 4px 10px rgba(20,17,14,.14);
    z-index:20;}
  /* the ribbon banner — small tag straddling the top-left corner */
  /* THE KICKER, KEEPING THE RIBBON'S POSITION.
     It sat at the top-left corner and that placement is right — the number
     is what a teacher points at across a room ("card four, move it up"), so
     it has to be findable without reading the card. What goes is the
     coloured slab it was printed on: on this card the mark is the caramel
     block the poster wears everywhere, and the family name is type. */
  .enode-banner{position:absolute;top:.85rem;left:.95rem;right:.95rem;
    display:flex;align-items:center;gap:.5rem;z-index:3;}
  /* The caramel mark, 26x10, exactly as the poster wears it. `order:-1`
     puts it first without needing a wrapper element in markup this file
     is not otherwise touching. */
  .enode-banner::before{content:'';display:block;flex:none;
    width:26px;height:10px;background:var(--caramel);order:-1;}
  /* The number stays a filled chip, because it is the one thing that must
     be legible at four metres. Ink on the card's own grey. */
  .enode-bnum{font-family:var(--f-mono);font-weight:500;font-size:.6rem;
    color:var(--poster-ink);background:var(--poster-fill);
    min-width:1.2rem;height:1.2rem;border-radius:var(--r-field);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    padding:0 .3em}
  .enode-blabel{font-family:var(--f-mono);font-weight:400;font-size:.52rem;
    letter-spacing:.16em;text-transform:uppercase;color:var(--poster-faint);
    white-space:nowrap;}
  .enode-stem{font-family:var(--f-display);font-size:.86rem;font-weight:600;
    color:var(--poster-ink);line-height:1.38;}
  /* The connector. Body ink, not a serif borrowed from another product —
     Lora appeared on this page and nowhere else. */
  .enode-tail{font-size:.72rem;color:var(--poster-body);line-height:1.45;
    margin-top:.25rem;}
  .const-hint{position:absolute;bottom:1.1rem;left:50%;transform:translateX(-50%);z-index:4;
    font-size:.6rem;font-style:italic;color:var(--faint);letter-spacing:.04em;pointer-events:none;
    transition:opacity .5s;}
  .const-hint.hidden{opacity:0;}

  /* ── FURTHER PRACTICE: cue-card state on the orbiting cards ── */
  .enode.cue-card .enode-tail{display:none;}
  .enode.cue-card .enode-stem{font-size:.9rem;letter-spacing:.01em;}
  .enode.cue-card .cue-trigger{display:inline-block;margin-top:.5rem;font-family:var(--f-display);
    font-size:.5rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink);
    background:var(--fc);border-radius:999px;padding:.16rem .55rem;}
  .enode.cue-card .cue-slash{color:color-mix(in srgb,var(--fc) 55%,#ccc);font-weight:400;margin:0 .1rem;}
  .enode.cue-card{cursor:pointer;}
  /* Cue cards are the one .enode that is never dragged — the drill wiring
     returns before the drag handlers are attached — so they can animate
     their transform without touching the handoff above. */
  .enode.cue-card{transition:box-shadow .18s,transform .18s;}
  .enode.cue-card:hover{transform:translate(-50%,-50%) scale(1.03);}
  .enode.done .enode-banner::before{content:'✓';position:absolute;right:-1.4rem;top:50%;transform:translateY(-50%);
    font-size:.7rem;color:var(--ok);font-weight:900;}
  .enode.done{opacity:.7;}

  /* ── completion card overlay (the beautiful centre card) ── */
  .cc-overlay{position:absolute;inset:0;z-index:40;display:none;align-items:center;justify-content:center;
    background:rgba(10,10,12,.72);backdrop-filter:blur(3px);padding:1rem;}
  .cc-overlay.show{display:flex;animation:ccfade .25s ease;}
  @keyframes ccfade{from{opacity:0;}to{opacity:1;}}
  /* The completion card. It is a MODAL over the board, so unlike the
     phrase cards it does need to sit well clear of what is behind it —
     hence a deeper shadow than the poster's, and the scrim below. */
  .cc-card{position:relative;width:min(560px,94%);background:var(--card);
    border-radius:var(--r-sheet);
    padding:2.7rem 1.7rem 1.5rem;box-shadow:0 24px 60px -18px rgba(20,17,14,.38),0 6px 16px rgba(20,17,14,.14);
    animation:ccpop .28s cubic-bezier(.22,1,.36,1);}
  @keyframes ccpop{from{opacity:0;transform:translateY(14px) scale(.97);}to{opacity:1;transform:none;}}
  .cc-banner{position:absolute;top:1rem;left:-8px;display:flex;align-items:center;gap:.4rem;
    background:var(--fc);padding:.32rem .7rem .32rem .5rem;border-radius:.4rem .6rem .6rem .4rem;
    box-shadow:0 5px 12px -4px rgba(0,0,0,.35);}
  .cc-banner::after{content:'';position:absolute;left:0;bottom:-8px;border-style:solid;border-width:8px 0 0 12px;
    border-color:var(--fc-d) transparent transparent transparent;filter:brightness(.75);}
  .cc-blabel{font-family:var(--f-display);font-weight:800;font-size:.5rem;letter-spacing:.1em;
    text-transform:uppercase;color:var(--ink);}
  .cc-task{font-family:var(--f-display);font-size:.54rem;font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;color:var(--fc-d);margin-bottom:1rem;}
  .cc-cue{font-size:1.35rem;font-weight:700;color:var(--ink);line-height:1.4;}
  .cc-cue .slash{color:color-mix(in srgb,var(--fc) 55%,#ccc);font-weight:400;margin:0 .15rem;}
  .cc-trigger{display:inline-block;margin-top:1rem;font-family:var(--f-display);font-size:.78rem;
    font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);background:var(--fc);
    border-radius:999px;padding:.35rem .95rem;box-shadow:0 4px 12px -3px rgba(0,0,0,.3);}
  .cc-answer{width:100%;margin-top:1.3rem;background:var(--poster-fill);border:none;border-radius:var(--r-field);
    padding:.8rem .9rem;font-family:var(--f-body);font-size:1rem;color:var(--ink);resize:vertical;
    min-height:3rem;outline:none;transition:border-color .18s;}
  .cc-answer:focus{border-color:var(--fc);}
  .cc-reveal{margin-top:1.2rem;padding:1.1rem 1.2rem;border-radius:.8rem;display:none;
    background:color-mix(in srgb,var(--fc) 8%,var(--card));border:1px solid color-mix(in srgb,var(--fc) 25%,transparent);}
  .cc-reveal.show{display:block;animation:ccfade .25s ease;}
  .cc-reveal-label{font-family:var(--f-display);font-size:.5rem;font-weight:700;letter-spacing:.1em;
    text-transform:uppercase;color:var(--fc-d);margin-bottom:.5rem;}
  .cc-reveal-model{font-size:1.05rem;line-height:1.5;color:var(--ink);font-weight:600;}
  .cc-reveal-alt{font-size:.9rem;color:var(--stance);line-height:1.5;margin-top:.5rem;font-style:italic;font-family:var(--f-body);}
  .cc-assess{display:none;gap:.6rem;margin-top:1.1rem;}
  .cc-assess.show{display:flex;}
  .cc-assess-btn{flex:1;font-family:var(--f-display);font-size:.6rem;font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;padding:.7rem;border-radius:.7rem;cursor:pointer;border:1.5px solid;transition:all .15s;}
  .cc-got{background:var(--tile-ok-bg);border-color:transparent;color:var(--tile-ok-ink);}
  .cc-got:hover{background:var(--tile-ok-bg);filter:brightness(.96);}
  .cc-miss{background:var(--tile-no-bg);border-color:transparent;color:var(--tile-no-ink);}
  .cc-miss:hover{background:var(--tile-no-bg);filter:brightness(.96);}
  .cc-actions{margin-top:1.2rem;}
  .cc-act{width:100%;font-family:var(--f-display);font-size:.62rem;font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;padding:.78rem;border-radius:.7rem;cursor:pointer;border:none;transition:all .16s;}
  .cc-primary{background:var(--accent);color:var(--card);}
  .cc-primary:hover{background:var(--accent-hover,var(--accent-ink));}
  .cc-close{width:100%;margin-top:.7rem;font-family:var(--f-display);font-size:.58rem;font-weight:700;
    letter-spacing:.06em;text-transform:uppercase;padding:.65rem;border-radius:.7rem;cursor:pointer;
    background:transparent;border:1px solid rgba(0,0,0,.14);color:var(--stance);transition:all .15s;}
  .cc-close:hover{background:rgba(0,0,0,.04);color:var(--ink);}


  /* carousel arrows + dots (galleries idiom) */
  .fam-arrow{flex-shrink:0;width:42px;height:42px;border-radius:50%;background:var(--tile-bg);
    border:none;color:var(--sage);font-size:1.1rem;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:all .25s;box-shadow:0 6px 16px rgba(0,0,0,.4);}
  .fam-arrow:hover:not(:disabled){background:var(--tile-bg-press);transform:scale(1.08);}
  .fam-arrow:disabled{opacity:.18;cursor:not-allowed;}
  .fam-dots{display:flex;align-items:center;justify-content:center;gap:.4rem;margin-top:1rem;}
  .fam-dot{width:8px;height:8px;border-radius:50%;background:rgba(99,99,102,.32);cursor:pointer;transition:all .3s;}
  .fam-dot.active{background:var(--caramel);transform:scale(1.45);}
  .fam-dot:hover:not(.active){background:var(--rule);}

  /* All five fit on wide → arrows and dots hidden; carousel only engages when narrower */
  .fam-arrow,.fam-dots{display:none;}

  /* view switching */
  .fbadge-bar{display:flex;gap:2px;height:4px;border-radius:2px;overflow:hidden;margin:6px 0 2px;}
  .rb-seg{display:block;border-radius:2px;}
  .rb-i{background:var(--poster-fill);}
  .rb-n{background:var(--poster-fill-hi);}
  .rb-f{background:var(--caramel);}
  .fbadge-note{font-size:.7rem;opacity:.55;}
  .view{display:none;} .view.active{display:block;animation:fade .28s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  @media(prefers-reduced-motion:reduce){.view.active{animation:none;} .fam:hover,.fn-tile:hover,.fbadge:hover{transform:none;} .fam-viewport{scroll-behavior:auto;}}

  /* below 1000px the five no longer fit → become a swipeable carousel */
  /* ══ NARROW SCREENS ═══════════════════════════════════════════════
     These rules still set flex on .fam, which stopped being a flex item
     when the row became columns — so nothing applied and the phone got a
     five-column layout squeezed into 380px, with arrows and dots for a
     carousel that no longer scrolls sideways.
     One column, one card at a time, scroll down. Nothing else. */
  @media(max-width:1100px){ .families{column-count:3;} }
  @media(max-width:820px){  .families{column-count:2;} }
  @media(max-width:620px){
    .families{column-count:1;column-gap:0;}
    .fam{margin-bottom:.9rem;}
    /* the carousel controls have nothing left to control */
    .fam-arrow,.fam-dots{display:none !important;}
    .wrap{padding:1.1rem .7rem 3rem;}
    .fam-badges{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;}
    .lead-row{gap:.35rem;}
    .lead-chip{font-size:.63rem;padding:.28rem .6rem;}
  }
  @media(max-width:400px){
    .fam-badges{grid-template-columns:1fr;}
    .fbadge-hero{font-size:.9rem;}
  }
</style>
</head>
<body>

<header class="header">
  <a class="back-link" href="/?openModal=vocabulary" id="backLink" onclick="return smartBack(event)">← Back</a>
  <div class="brand"><span class="brand-t">Phrase Bank</span><span class="brand-s">Functional Language</span></div>
  <span class="crumb" id="crumb" onclick="goBack()">↑ All families</span>
</header>

<div class="stage">
  <div class="wrap">
    <!-- LEVEL 1 -->
    <div class="view active" id="viewFamilies">
      <!-- 54 words of prose nobody was going to read, and two of its facts
           had gone stale (forty-two, swipe across). Three signals instead:
           what is here, what the bar means, what to do. -->
      <div class="lead-row">
        <span class="lead-chip"><b>45</b> moves</span>
        <span class="lead-chip lead-bar"><i></i><i></i><i></i> informal &rarr; formal</span>
        <span class="lead-chip lead-do">Tap one &rarr;</span>
      </div>
      <div class="fam-carousel">
        <button class="fam-arrow" id="famPrev" aria-label="Previous">←</button>
        <div class="fam-viewport"><div class="families" id="familyList"></div></div>
        <button class="fam-arrow" id="famNext" aria-label="Next">→</button>
      </div>
      <div class="fam-dots" id="famDots"></div>
    </div>
    <!-- LEVEL 2 · constellation — question at centre, phrases orbiting -->
    <div class="view" id="viewCapsule">
      <div class="constellation" id="constellation">
        <div class="q-centre" id="qCentre">
          <div class="q-eyebrow" id="qEyebrow"></div>
          <div class="q-text" id="qText"></div>
          <div class="q-controls">
            <button class="q-next" id="qNext" onclick="nextQuestion()">Next question →</button>
            <button class="q-practice" id="qPractice" onclick="togglePractice()">Practice: off</button>
            <button class="q-further" id="qFurther" onclick="toggleFurther()">Further practice →</button>
          </div>
        </div>
        <!-- phrase / cue cards injected here -->
        <!-- completion card overlay (appears when a cue is chosen) -->
        <div class="cc-overlay" id="ccOverlay">
          <div class="cc-card" id="ccCard">
            <div class="cc-banner"><span class="cc-blabel" id="ccLabel"></span></div>
            <div class="cc-task">Build the full sentence using the trigger</div>
            <div class="cc-cue" id="ccCue"></div>
            <span class="cc-trigger" id="ccTrigger"></span>
            <textarea class="cc-answer" id="ccAnswer" placeholder="Write your sentence… (optional — or say it aloud)"></textarea>
            <div class="cc-reveal" id="ccReveal">
              <div class="cc-reveal-label">Model answer</div>
              <div class="cc-reveal-model" id="ccModel"></div>
              <div class="cc-reveal-alt" id="ccAlt"></div>
            </div>
            <div class="cc-assess" id="ccAssess">
              <button class="cc-assess-btn cc-got" onclick="ccMark(true)">✓ I built it</button>
              <button class="cc-assess-btn cc-miss" onclick="ccMark(false)">✗ Needs work</button>
            </div>
            <div class="cc-actions" id="ccActions">
              <button class="cc-act cc-primary" id="ccRevealBtn" onclick="ccReveal()">Reveal model</button>
            </div>
            <button class="cc-close" id="ccClose" onclick="ccCloseCard()">✕ Close — next student</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* ══ CORPUS — fetched from the unified functional-english.json ═══
   One source of truth, shared with the speaking page. The adapter
   folds the flat functions[] into the family tree the bank renders,
   mapping {stem, connector, expanded} → {stem, tail, frame} + PREC. */
let CORPUS = {};
let FAM_ORDER=['evaluating','reasoning','positioning','projecting','relating'];

// derive a short "frame" tag from a stem's grammatical shape (for the register chip)
function frameOf(stem){
  const s=stem.trim().toLowerCase();
  if(/^(in my|from my|to my|as far as|as i see|personally|in general|by and large|broadly|on the whole|generally|more often|as a rule|in most)/.test(s)) return 'adverbial phrase';
  if(/\bthat\s*…?$/.test(s) || /\bthat\b/.test(s)) return 'clause frame';
  if(/^(this|it|there|one|a |the )/.test(s)) return 'noun-phrase frame';
  if(/,\s*…?$/.test(s)) return 'sentence opener';
  return 'set phrase';
}

/* ══ CORPUS ADAPTER ═══════════════════════════════════════════════════
   Two schemas. The original five-family file, and functions-v2 — the merged
   inventory, where DISCURSIVE language (advantages, cause, trends) meets
   INTERACTIONAL language (thanking, inviting, refusing). 42 functions across
   10 categories, so a category is what the old file called a family and the
   carousel simply grows. Phrases come in two shapes: discursive ones carry a
   connector, interactional ones are complete on their own. */
function adaptV2(data){
  const out={};
  /* `hidden` marks a card or a function NOT ready for the classroom — the
     phrases exist but no questions or cues are written, so opening one would
     lead nowhere. They stay in the corpus; they simply do not render yet. */
  for(const [k,c] of Object.entries(data.categories||{})){
    if(c.hidden) continue;
    out[k]={ name:c.label, purpose:c.note||'', functions:{} };
  }
  for(const [fid,fn] of Object.entries(data.functions||{})){
    if(fn.hidden || !out[fn.category]) continue;
    const cat=fn.category;
    out[cat].functions[fid]={
      label: fn.label,
      /* question, cue, trigger and model are ONE object now, so the card on
         screen always answers the question on screen. They used to live in
         two files matched by array position, which silently permuted. */
      tasks: fn.tasks || [],
      when: fn.when || 'to use this move',
      yield: (fn.phrases||[]).length,
      convention: fn.convention || null,
      /* the bar is shown only where the phrases are actually graded —
         an axis that is not in the data would be a lie on the card */
      graded: (fn.phrases||[]).some(p=>p.register),
      prec: null,
      capsule: (fn.phrases||[]).map(p=>({
        stem: p.t, tail: p.connector || '', register: p.register || null,
        frame: frameOf(p.t)
      }))
    };
  }
  return out;
}

function adaptCorpus(data){
  if(data && data.functions && !Array.isArray(data.functions)) return adaptV2(data);
  const out={};
  for(const [famKey,fam] of Object.entries(data.families)){
    out[famKey]={ name:fam.label, purpose:fam.purpose, functions:{} };
  }
  for(const fn of data.functions){
    const famKey=fn.family;
    if(!out[famKey]) continue;
    out[famKey].functions[fn.id]={
      label: fn.label,
      when: fn.when || 'to use this move',
      yield: fn.phrases.length,
      prec: fn.expanded || null,
      capsule: fn.phrases.map(p=>({
        stem: p.stem,
        tail: p.connector,
        frame: frameOf(p.stem)
      }))
    };
  }
  return out;
}

let path={family:null, fn:null};

const HUE_FALLBACK=['#7b5ea7','#5a9657','#c2681f','#4a7fb5','#c94f6d','#3d9e95','#c08b2f','#6a4374','#1a8f5e','#b4453a'];
function hueFor(fam){
  const map=HUES[fam];
  if(map) return map;
  const i=Math.max(0,FAM_ORDER.indexOf(fam))%HUE_FALLBACK.length;
  const c=HUE_FALLBACK[i];
  return [c,c];
}
const HUES={
  evaluating:['var(--evaluating)','var(--evaluating-d)'],
  reasoning:['var(--reasoning)','var(--reasoning-d)'],
  positioning:['var(--positioning)','var(--positioning-d)'],
  projecting:['var(--projecting)','var(--projecting-d)'],
  relating:['var(--relating)','var(--relating-d)']
};
const hue = fam => hueFor(fam);

/* the bar shows the register spread of a function's phrases — informal to
   formal, left to right. Only drawn where the data is graded. */
function regBar(fn){
  const n={informal:0,neutral:0,formal:0};
  fn.capsule.forEach(p=>{ if(p.register && n[p.register]!==undefined) n[p.register]++; });
  const t=n.informal+n.neutral+n.formal;
  if(!t) return '';
  const seg=(k,cls)=> n[k]?`<span class="rb-seg ${cls}" style="flex:${n[k]}"></span>`:'';
  return `<span class="fbadge-bar" aria-label="${n.informal} informal, ${n.neutral} neutral, ${n.formal} formal">${
    seg('informal','rb-i')}${seg('neutral','rb-n')}${seg('formal','rb-f')}</span>`;
}

/* LEVEL 1 — one card per category, a badge per function inside it.
   A category may be MERGED into another: it keeps its own banner badge and
   its own purpose line, but shares the card. Weighing it up (4 functions)
   and Assess and recommend (3) each needed a card of their own, and the
   two stacked pushed the first column past the fold. Together they are one
   card with two banners — the same reading, less chrome. */
const MERGE={ assess:'discursive' };

function badgesFor(fam){
  const F=CORPUS[fam], [c]=hue(fam);
  return Object.entries(F.functions).map(([k,fn])=>`
      <button class="fbadge" style="--fc:${c}" onclick="openFn('${fam}','${k}')"
        aria-label="${cap(k)}, ${fn.yield} expressions">
        <span class="fbadge-tag">${fn.yield} expr.</span>
        <span class="fbadge-hero">${fn.label||cap(k)}</span>
        ${fn.graded?regBar(fn):''}
        <span class="fbadge-foot">
          ${fn.convention?'<span class="fbadge-note" title="Convention note">&#9432;</span>':'<span></span>'}
          <span class="fbadge-open">&rarr;</span>
        </span>
      </button>`).join('');
}

function sectionFor(fam,isGuest){
  const F=CORPUS[fam], [c]=hue(fam);
  return `<div class="fam-sec${isGuest?' guest':''}" style="--fc:${c}">
      <div class="fam-head"><span class="fam-name">${F.name}</span></div>
      <div class="fam-purpose">${F.purpose}</div>
      <div class="fam-badges">${badgesFor(fam)}</div>
    </div>`;
}

function renderFamilies(){
  const el=document.getElementById('familyList');
  const guests={};
  Object.entries(MERGE).forEach(([g,host])=>{
    if(CORPUS[g] && CORPUS[host]) (guests[host]=guests[host]||[]).push(g);
  });
  const hosts=FAM_ORDER.filter(f=>!MERGE[f] || !CORPUS[MERGE[f]]);
  el.innerHTML=hosts.map(fam=>{
    const [c]=hue(fam);
    const extra=(guests[fam]||[]).map(g=>sectionFor(g,true)).join('');
    return `<div class="fam" style="--fc:${c};--fc-d:${hue(fam)[1]}">
      ${sectionFor(fam,false)}${extra}
    </div>`;
  }).join('');
  initCarousel();
}

/* ── horizontal carousel: arrows + dots page the scroll-snap track ── */
function perPage(){
  const w=window.innerWidth;
  return w<=520?1 : w<=760?2 : w<=1000?3 : 5;
}
function pageCount(){ return Math.max(1, Math.ceil(FAM_ORDER.length/perPage())); }
function currentPage(vp){
  const cardW=vp.querySelector('.fam')?.offsetWidth||1;
  const gap=16;
  return Math.round(vp.scrollLeft/((cardW+gap)*perPage()));
}
function initCarousel(){
  const vp=document.querySelector('.fam-viewport');
  const prev=document.getElementById('famPrev');
  const next=document.getElementById('famNext');
  const dots=document.getElementById('famDots');
  const pages=pageCount();
  dots.innerHTML=Array.from({length:pages},(_,i)=>`<div class="fam-dot" data-p="${i}"></div>`).join('');
  const update=()=>{
    const p=currentPage(vp);
    dots.querySelectorAll('.fam-dot').forEach((d,i)=>d.classList.toggle('active',i===p));
    prev.disabled=vp.scrollLeft<=4;
    next.disabled=vp.scrollLeft>=vp.scrollWidth-vp.clientWidth-4;
  };
  const go=dir=>{
    const cardW=vp.querySelector('.fam')?.offsetWidth||1;
    vp.scrollBy({left:dir*(cardW+16)*perPage(),behavior:'smooth'});
  };
  prev.onclick=()=>go(-1);
  next.onclick=()=>go(1);
  vp.onscroll=update;
  dots.querySelectorAll('.fam-dot').forEach(d=>d.onclick=()=>{
    const cardW=vp.querySelector('.fam')?.offsetWidth||1;
    vp.scrollTo({left:(+d.dataset.p)*(cardW+16)*perPage(),behavior:'smooth'});
  });
  window.addEventListener('resize',()=>{dots.innerHTML='';initCarousel();},{once:true});
  update();
}

/* LEVEL 2 — constellation: question at centre, phrases orbiting with ribbon banners */
let qList=[], taskList=[], qIndex=0, curFam=null, curFn=null;

function openFn(fam,k){
  path={family:fam, fn:k};
  curFam=fam; curFn=k;
  const F=CORPUS[fam], fn=F.functions[k], [c]=hue(fam);
  const con=document.getElementById('constellation');
  con.style.setProperty('--fc',c);
  con.style.setProperty('--fc-d',hue(fam)[1]);

  // question set for this function (fall back to a generic prompt if none)
  const T=(CORPUS[fam]&&CORPUS[fam].functions[k]&&CORPUS[fam].functions[k].tasks)||[];
  taskList = T.filter(t=>t.question);
  qList = taskList.length ? taskList.map(t=>t.question)
                          : ((QUESTIONS[k] && QUESTIONS[k].length) ? QUESTIONS[k].slice() : []);
  qIndex = 0;
  setQuestion(fam,k);

  // reset Further Practice when entering a function
  furtherMode=false;
  const fbtn=document.getElementById('qFurther');
  if(fbtn){ fbtn.textContent='Further practice →'; fbtn.classList.remove('on'); }

  // clear previous cards + hint
  con.querySelectorAll('.enode').forEach(n=>n.remove());
  con.querySelector('.const-hint')?.remove();

  switchView('viewCapsule');
  requestAnimationFrame(()=>layoutConstellation(fam,k));
  setCrumb();
}

function setQuestion(fam,k){
  const F=CORPUS[fam], [c]=hue(fam);
  document.getElementById('qEyebrow').textContent=cap(k)+' · '+F.name;
  document.getElementById('qEyebrow').style.setProperty('--fc',c);
  const qt=document.getElementById('qText');
  qt.textContent = qList.length ? qList[qIndex] : F.functions[k].when;
  const nextBtn=document.getElementById('qNext');
  nextBtn.style.display = qList.length>1 ? 'inline-block' : 'none';
  nextBtn.style.setProperty('--fc',c);
}

function nextQuestion(){
  if(!qList.length) return;
  qIndex = (qIndex+1) % qList.length;
  setQuestion(curFam,curFn);
  const con=document.getElementById('constellation');
  con.querySelectorAll('.enode').forEach(nd=>nd.remove());
  con.querySelector('.const-hint')?.remove();
  layoutConstellation(curFam,curFn);
}

let dragEl=null, dragDX=0, dragDY=0;
function layoutConstellation(fam,k){
  const F=CORPUS[fam], fn=F.functions[k], [c,d]=hue(fam);
  const con=document.getElementById('constellation');
  const W=con.clientWidth, H=con.clientHeight;
  const cx=W/2, cy=H/2;

  // In Further Practice mode the orbiting cards are the drill CUE items;
  // otherwise they are the phrase frames.
  /* ══ SIX CUES, ONE QUESTION ═════════════════════════════════════════
     A question used to have exactly one matching cue, and the orbit was
     padded out with five more taken from elsewhere in the function — so
     five of the six cards on screen answered a different question. The
     cues now live INSIDE the task, so every card belongs to the question
     above it and no padding is possible. */
  const tasks = fn.tasks || [];
  const withQ = tasks.filter(t=>t.question);
  const active = withQ.length ? withQ[qIndex % withQ.length] : null;
  const drillItems = active && active.cues && active.cues.length
    ? active.cues
    : (DRILLS[k] || []);
  const items = furtherMode ? drillItems : fn.capsule;
  const n=items.length;
  if(furtherMode && !n){
    // no drills authored for this function — fall back with a note
    const note=document.createElement('div');
    note.className='const-hint'; note.style.opacity='.5';
    note.textContent='No drill written for this question yet.';
    con.appendChild(note);
    return;
  }

  /* Original elliptical placement — the natural spread around the question.
     Cards on a wide ellipse, distributed by even angular steps down each flank. */
  const half = Math.ceil(n/2);
  const rightCount = n - half;
  const rx = Math.min(W*0.32, 470);       // pushed further out horizontally, away from the question
  const ry = Math.min(H*0.42, 280);       // ~1cm more room between stacked cards

  function place(i){
    const onLeft = i < half;
    const idx = onLeft ? i : i - half;
    const count = onLeft ? half : rightCount;
    // equal VERTICAL spacing between stacked cards, but bounded to the same
    // ±65° envelope the original design used — so outer cards (1, 5, 6, 10)
    // still swing out to the side instead of collapsing to dead-center.
    const angMax = 65 * Math.PI/180;
    const yMaxFrac = Math.sin(angMax);
    const t = count>1 ? (idx/(count-1))*2 - 1 : 0;   // -1..1, equal steps
    const yFrac = t*yMaxFrac;
    const xFrac = Math.sqrt(Math.max(0, 1 - yFrac*yFrac));
    const baseX = onLeft ? -xFrac : xFrac;
    return { x: cx + baseX*rx, y: cy + yFrac*ry };
  }

  items.forEach((x,i)=>{
    const node=document.createElement('div');
    node.className='enode'+(practiceMode?' practising':'')+(furtherMode?' cue-card':'')
    node.style.setProperty('--fc',c); node.style.setProperty('--fc-d',d);

    if(furtherMode){
      const cueHtml=x.cue.split('/').map(s=>s.trim()).join('<span class="cue-slash">/</span>');
      node.innerHTML=`<div class="enode-banner">
          <span class="enode-bnum">${i+1}</span>
          <span class="enode-blabel">${cap(k)}</span>
        </div>
        <div class="enode-stem">${cueHtml}</div>
        <span class="cue-trigger">[${x.trigger}]</span>`;
      if(furtherDone.has(cueKey(k,i))) node.classList.add('done');
    } else {
      node.innerHTML=`<div class="enode-banner">
          <span class="enode-bnum">${i+1}</span>
          <span class="enode-blabel">${cap(k)}</span>
        </div>
        <div class="enode-stem">${practiceMode ? blankStem(x.stem) : x.stem}</div>
        <div class="enode-tail">${x.tail}</div>`;
    }
    con.appendChild(node);

    const p=place(i);
    node.style.left=p.x+'px'; node.style.top=p.y+'px';

    if(furtherMode){
      // cue cards: click opens the completion card (no dragging in drill mode)
      node.addEventListener('click',()=>openCompletion(k,i,x,c,d));
      return; // skip drag wiring
    }

    let downX=0, downY=0, moved=false;
    const down=(px,py)=>{
      downX=px; downY=py; moved=false;
      dragEl=node; node.classList.add('dragging');
      const cr=con.getBoundingClientRect(), r=node.getBoundingClientRect();
      node.style.transform='none';
      node.style.left=(r.left-cr.left)+'px';
      node.style.top =(r.top -cr.top )+'px';
      dragDX=px-r.left; dragDY=py-r.top;
      hideHint();
    };
    node.addEventListener('mousedown',e=>{e.preventDefault();down(e.clientX,e.clientY);});
    node.addEventListener('touchstart',e=>{down(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
  });

  const hint=document.createElement('div');
  hint.className='const-hint';
  hint.textContent = furtherMode ? 'Choose a card to complete — build it, then close for the next student'
                   : practiceMode ? 'Fill the gap in your head — then tap the card to check'
                   : 'Drag any expression to arrange your answer';
  con.appendChild(hint);
}

let dragMoved=false;
function moveNode(px,py){
  if(!dragEl) return;
  dragMoved=true;
  const con=document.getElementById('constellation');
  const cr=con.getBoundingClientRect();
  dragEl.style.left=(px-cr.left-dragDX)+'px';
  dragEl.style.top =(py-cr.top -dragDY)+'px';
}
document.addEventListener('mousemove',e=>{ if(dragEl) moveNode(e.clientX,e.clientY); });
document.addEventListener('touchmove',e=>{ if(dragEl){ moveNode(e.touches[0].clientX,e.touches[0].clientY);} },{passive:true});
document.addEventListener('mouseup',()=>{ if(dragEl){dragEl.classList.remove('dragging');dragEl=null; setTimeout(()=>dragMoved=false,0);} });
document.addEventListener('touchend',()=>{ if(dragEl){dragEl.classList.remove('dragging');dragEl=null; setTimeout(()=>dragMoved=false,0);} });
let hintGone=false;
function hideHint(){ if(hintGone)return; hintGone=true; document.querySelector('.const-hint')?.classList.add('hidden'); }

/* ── practice mode: hide one key word in each stem, tap to reveal ── */
let practiceMode=false;
// pick the most distinctive word to blank: longest content word, skipping function words
const STOPWORDS=new Set(['the','a','an','is','it','of','to','that','this','there','be','in','on',
  'and','or','but','as','so','if','far','my','i','one','no','not','are','was','were','been','being',
  'for','with','from','by','at','would','could','may','might','will','can','do','does','than','then',
  'few','people','deny','say','said','what','which','who','when','how','why','over','past','years']);
function blankStem(stem){
  // tokens keep their trailing punctuation; we blank one word inside
  const tokens=stem.split(/(\s+)/);           // keep whitespace tokens
  // candidate indices: real words, stripped of punctuation, not stopwords, length>=4, not the ellipsis
  const cand=[];
  tokens.forEach((t,idx)=>{
    const w=t.replace(/[^A-Za-z']/g,'').toLowerCase();
    if(w.length>=4 && !STOPWORDS.has(w) && !t.includes('…')) cand.push({idx,len:w.length});
  });
  if(!cand.length) return stem; // nothing safe to blank
  // choose the longest candidate (most distinctive/content-bearing)
  cand.sort((a,b)=>b.len-a.len);
  const pick=cand[0].idx;
  const original=tokens[pick];
  // preserve leading/trailing punctuation around the blanked word
  const lead=(original.match(/^[^A-Za-z']*/)||[''])[0];
  const trail=(original.match(/[^A-Za-z']*$/)||[''])[0];
  const word=original.slice(lead.length, original.length-trail.length);
  tokens[pick]=`${lead}<span class="gap" data-word="${word}">${word}</span>${trail}`;
  return tokens.join('');
}
function togglePractice(){
  practiceMode=!practiceMode;
  const btn=document.getElementById('qPractice');
  btn.textContent='Practice: '+(practiceMode?'on':'off');
  btn.classList.toggle('on',practiceMode);
  // re-layout current function with/without gaps
  if(curFn){
    const con=document.getElementById('constellation');
    con.querySelectorAll('.enode').forEach(nd=>nd.remove());
    con.querySelector('.const-hint')?.remove();
    layoutConstellation(curFam,curFn);
  }
}
// CSS reveal: tapping a .gap shows the word (handled in card click above)
document.addEventListener('click',e=>{
  const g=e.target.closest('.gap');
  if(g && practiceMode && !dragMoved) g.classList.add('revealed');
});

/* ── FURTHER PRACTICE: in-place production drill (class relay) ── */
let furtherMode=false;
let DRILLS={};                 // { functionId: [ {cue,trigger,models} ] }
const furtherDone=new Set();   // cueKey of completed cues (tick marks)
let ccCurrent=null;            // {k, i, item}
function cueKey(k,i){ return k+':'+i; }

function toggleFurther(){
  furtherMode=!furtherMode;
  const btn=document.getElementById('qFurther');
  btn.textContent = furtherMode ? '← Back to frames' : 'Further practice →';
  btn.classList.toggle('on',furtherMode);
  // Further and gap-practice are mutually exclusive
  if(furtherMode && practiceMode){
    practiceMode=false;
    const pb=document.getElementById('qPractice');
    pb.textContent='Practice: off'; pb.classList.remove('on');
  }
  // the question stays as context; hide Next/Practice noise while drilling? keep them, just re-layout
  if(curFn){
    const con=document.getElementById('constellation');
    con.querySelectorAll('.enode').forEach(nd=>nd.remove());
    con.querySelector('.const-hint')?.remove();
    layoutConstellation(curFam,curFn);
  }
}

function openCompletion(k,i,item,c,d){
  ccCurrent={k,i,item};
  const ov=document.getElementById('ccOverlay');
  const card=document.getElementById('ccCard');
  card.style.setProperty('--fc',c); card.style.setProperty('--fc-d',d);
  document.getElementById('ccLabel').textContent=cap(k);
  document.getElementById('ccCue').innerHTML=
    item.cue.split('/').map(s=>s.trim()).join('<span class="slash">/</span>');
  document.getElementById('ccTrigger').textContent='['+item.trigger+']';
  document.getElementById('ccAnswer').value='';
  document.getElementById('ccReveal').classList.remove('show');
  document.getElementById('ccAssess').classList.remove('show');
  document.getElementById('ccActions').style.display='block';
  document.getElementById('ccRevealBtn').style.display='block';
  ov.classList.add('show');
}
function ccReveal(){
  if(!ccCurrent) return;
  const it=ccCurrent.item;
  document.getElementById('ccModel').textContent=it.models[0];
  const alt=document.getElementById('ccAlt');
  if(it.models.length>1){ alt.textContent='Also valid: '+it.models.slice(1).join('  ·  '); alt.style.display='block'; }
  else alt.style.display='none';
  document.getElementById('ccReveal').classList.add('show');
  document.getElementById('ccActions').style.display='none';
  document.getElementById('ccAssess').classList.add('show');
}
function ccMark(got){
  if(!ccCurrent) return;
  // mark this cue as done (tick) regardless — the self-judgement is the student's own
  furtherDone.add(cueKey(ccCurrent.k, ccCurrent.i));
  ccCloseCard();
}
function ccCloseCard(){
  document.getElementById('ccOverlay').classList.remove('show');
  ccCurrent=null;
  // re-layout so the completed cue shows its tick, back to the spread for the next student
  if(curFn){
    const con=document.getElementById('constellation');
    con.querySelectorAll('.enode').forEach(nd=>nd.remove());
    con.querySelector('.const-hint')?.remove();
    layoutConstellation(curFam,curFn);
  }
}


function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function switchView(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  const stage=document.querySelector('.stage'), wrap=document.querySelector('.wrap');
  const radial = id==='viewCapsule';
  stage.classList.toggle('no-scroll',radial);
  wrap.classList.toggle('full',radial);
  if(!radial) stage.scrollTo({top:0});
}
function setCrumb(){ document.getElementById('crumb').classList.add('show'); }
function goBack(){
  switchView('viewFamilies');
  document.getElementById('crumb').classList.remove('show');
  path={family:null,fn:null};
}
/* Context-aware back: if the student came from another INTUITY page, return there;
   otherwise fall back to the Vocabulary modal (this file's registered home). */
function smartBack(e){
  try{
    const ref=document.referrer;
    if(ref && new URL(ref).host===location.host){
      e.preventDefault(); history.back(); return false;
    }
  }catch(_){}
  return true; /* let the href (/?openModal=vocabulary) proceed */
}
window.addEventListener('resize',()=>{
  if(document.getElementById('viewCapsule').classList.contains('active') && path.fn){
    const con=document.getElementById('constellation');
    con.querySelectorAll('.enode').forEach(n=>n.remove());
    con.querySelector('.const-hint')?.remove();
    layoutConstellation(path.family,path.fn);
  }
});

/* ── boot: fetch the unified corpus, adapt, then render ── */
function corpusUrl(){
  const p=new URLSearchParams(location.search).get('json');
  return p || '/data/similar-words/phrase-bank-corpus.json';
}
function questionsUrl(){
  const p=new URLSearchParams(location.search).get('questions');
  return p || '/data/similar-words/functional-questions.json';
}
function drillsUrl(){
  const p=new URLSearchParams(location.search).get('drills');
  return p || '/data/similar-words/functional-drills.json';
}
let QUESTIONS={};   // { functionId: [ "…", "…" ] }
(function boot(){
  const list=document.getElementById('familyList');
  Promise.all([
    fetch(corpusUrl()).then(r=>{ if(!r.ok) throw new Error('corpus HTTP '+r.status); return r.json(); }),
    fetch(questionsUrl()).then(r=> r.ok ? r.json() : {questions:{}}).catch(()=>({questions:{}})),
    fetch(drillsUrl()).then(r=> r.ok ? r.json() : {drills:{}}).catch(()=>({drills:{}}))
  ])
    .then(([corpus, q, dr])=>{
      CORPUS=adaptCorpus(corpus);
      FAM_ORDER=Object.keys(CORPUS);   /* ten categories now, not five */
      QUESTIONS=(q && q.questions) ? q.questions : {};
      DRILLS=(dr && dr.drills) ? dr.drills : {};
      renderFamilies();
    })
    .catch(err=>{
      list.innerHTML=`<div style="color:var(--dim);font-size:.85rem;padding:2rem 1rem;max-width:520px;">
        Couldn't load the phrase corpus (<code>${corpusUrl()}</code>). ${err.message}.<br><br>
        On the live site the JSON sits beside this page; opened straight from disk, some browsers block the fetch —
        run it through the deployed site or a local server.</div>`;
    });
})();
