<!--
  THE NEW PHRASE BANK (Nov 2026)
  ring menu  →  one function: Everyday | Academic, Maya's question, PLAY · Read · Practise
             →  the belt: one sentence in focus (Anton, expression in rust), the done ones
                quiet (Collocations style), the rest waiting as grey bars.
  WATCH   Maya reads the question, then the six; the belt moves when she finishes each one.
  READ    all six open, at the kid's pace.
  PRACTISE one tap per phrase: the key word appears, Maya says the sentence, the belt moves on.
  Nothing can be failed and nothing waits for a right answer.
  Content: /data/similar-words/phrase-bank-v2.json. Until Maya is recorded, the phone's own
  voice reads; recordings go in phrase-bank-v2-audio.json (plain sentence → mp3).
  The old drag-around mind map lives on, whole, at phrase-map.html (classroom PC).
-->
<style>
:root{--pb-paper:#F3F1EC;--pb-ink:#14110E;--pb-body:#5C5852;--pb-faint:#8A8279;--pb-rule:#D9D3C9;
  --pb-sage:#8AA79C;--pb-sage-ink:#4F6B61;--pb-rust:#9A4F2E;--pb-car:#7A5C3A;--pb-chip:#E6E1D8;--pb-bar:#E2DDD4}
html,body{background:var(--pb-paper)}
body{margin:0;min-height:100dvh;display:flex;flex-direction:column}
#app{flex:1;display:flex;flex-direction:column;width:100%;max-width:520px;margin:0 auto;box-sizing:border-box;padding:calc(var(--header-h,96px) + 10px) 20px 20px;min-height:100dvh}
#app.full{height:100dvh;min-height:0}
.mono{font-family:'Geist Mono',monospace;font-weight:500;letter-spacing:.14em;text-transform:uppercase}
button{font-family:inherit;-webkit-tap-highlight-color:transparent}

/* ── MENU: six swinging rings, one per family (the Speaking hub's gate) ── */
:root{--dial:clamp(84px,22vw,116px)}
.lead{margin:.2rem 0 2.6rem;font:400 1rem/1.5 Geist,system-ui,sans-serif;color:var(--pb-body);text-align:center}
.dials{display:grid;grid-template-columns:repeat(2,auto);gap:clamp(3.4rem,8vh,4.4rem) clamp(2.2rem,12vw,4.5rem);justify-content:center;padding-top:30px}
@media(min-width:720px){ .dials{grid-template-columns:repeat(3,auto)} }
.dial-b{display:flex;flex-direction:column;align-items:center;gap:.85rem;border:none;background:none;padding:0;cursor:pointer;font:inherit;color:inherit}
.dial-b .pend-hang{display:block;width:var(--dial);height:var(--dial);will-change:transform;animation:pbCalm 5.2s cubic-bezier(.37,0,.63,1) infinite}
.dial-b .pend-dial{--mark-sweep:#708A81;--mark-rest:#4A433D;--mark-core:#201E1C;--mark-ink:#E5D1B8;--mark-pct:100%}
.dial-b .pend-dial span{font-size:calc(var(--dial) * .3)}
@keyframes pbCalm{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@media(prefers-reduced-motion:reduce){ .dial-b .pend-hang{animation:none} }
.dial-name{font:600 .82rem/1.2 Geist,sans-serif;color:#4A443D;text-align:center;max-width:9rem}
.dial-b:active .pend-hang,.dial-b:active .still{transform:scale(.95)}
.dial-b .still{display:flex;width:var(--dial);height:var(--dial)}
.dials.fam-dials{padding-top:6px}
.fam-note + .dials{margin-top:2.4rem}
.dial-b.soon{cursor:default}
.dial-b.soon .pend-dial{--mark-sweep:#CFC8BC;--mark-rest:#CFC8BC;--mark-core:#B8B0A5;--mark-ink:#F3F1EC}
.dial-b.soon .dial-name{color:#A39B91}

/* ── FAMILY: its functions, as a short list ── */
.fam-title{margin:.6rem 0 .3rem;text-align:center;font:400 clamp(2.2rem,10vw,2.8rem)/1.05 Anton,Impact,sans-serif;letter-spacing:.01em;color:var(--pb-ink)}
.fam-note{margin:0 0 1.6rem;text-align:center;font-size:.72rem;color:var(--pb-faint)}
.fns{display:flex;flex-direction:column;border-top:1px solid var(--pb-rule)}
.fn-b{display:flex;align-items:center;justify-content:space-between;gap:1rem;min-height:68px;border:none;border-bottom:1px solid var(--pb-rule);background:none;padding:0 .3rem;cursor:pointer;text-align:left}
.fn-b b{font:400 1.45rem/1.1 Anton,Impact,sans-serif;letter-spacing:.015em;color:var(--pb-ink)}
.fn-b span{font-size:.68rem;color:var(--pb-sage-ink)}
.fn-b.soon{cursor:default}
.fn-b.soon b{color:#B3AB9F}
.fn-b.soon span{color:#B3AB9F}

/* ── FUNCTION: the question ── */
.trk{display:flex;gap:6px;padding:4px;border-radius:999px;background:var(--pb-chip);margin:.2rem 0 0}
.trk button{flex:1;height:42px;border:none;border-radius:999px;background:transparent;color:#4A443D;font:600 15px/1 Geist,sans-serif;cursor:pointer}
.trk button.on{background:var(--pb-ink);color:#fff}
.qscreen{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1.3rem;text-align:center;padding:1.2rem 0}
.asks{display:flex;align-items:center;gap:10px;font-size:.72rem;color:var(--pb-sage-ink)}
.wave{display:flex;align-items:flex-end;gap:3px;height:18px;color:var(--pb-sage-ink)}
.wave i{display:block;width:3px;border-radius:2px;background:currentColor}
.q-big{margin:0;font:400 clamp(2.3rem,11vw,3rem)/1.06 Anton,Impact,sans-serif;letter-spacing:.01em;color:var(--pb-ink)}
.q-big em,.q-pin em{font-style:normal;color:var(--pb-rust)}
.use{margin:0;font:400 1rem/1.45 Geist,sans-serif;color:var(--pb-body)}
.alts{display:flex;gap:10px;width:100%;max-width:340px}
.alts button{flex:1;height:52px;border-radius:999px;border:1.5px solid var(--pb-rule);background:transparent;color:#2F2B27;font:600 17px/1 Geist,sans-serif;cursor:pointer}

.frames{list-style:none;margin:-.3rem 0 .2rem;padding:0;display:flex;flex-direction:column;gap:.45rem;text-align:center}
.frames li{font:600 1.05rem/1.3 Geist,sans-serif;color:var(--pb-ink)}
.qscreen.spoken{gap:1.05rem}
.q-big.long{font-size:clamp(1.75rem,8vw,2.2rem)}
.cmap{display:none}
@media (min-width:900px) and (hover:hover){ .cmap{display:block;margin:3.2rem 0 0;text-align:center;font-size:.72rem;color:var(--pb-faint);text-decoration:none} .cmap:hover{color:var(--pb-ink)} }

/* ── MAYA'S PILL (hallmark) ── */
.maya{position:relative;width:212px;height:76px;flex:none}
.maya svg.ring-o{position:absolute;inset:0;overflow:visible}
.maya .o-rest{fill:none;stroke:#C9C1B5;stroke-width:1.5}
.maya .o-prog{fill:none;stroke:var(--pb-sage-ink);stroke-width:3;stroke-linecap:round;transition:stroke-dasharray .5s ease}
.maya button{position:absolute;left:6px;top:6px;width:200px;height:64px;box-sizing:border-box;border:1.5px solid #1E1B18;border-radius:999px;background:#FAF8F5;
  display:flex;align-items:center;justify-content:flex-start;gap:6px;padding:0 0 0 14px;cursor:pointer}
.maya button b{font:700 19px/1 Geist,sans-serif;letter-spacing:.16em;color:var(--pb-ink)}
.maya.small{transform:scale(.82);margin:-7px 0}

/* ── THE BELT ── */
.q-pin{margin:.5rem 0 .9rem;font:400 1.45rem/1.12 Anton,Impact,sans-serif;letter-spacing:.01em;color:var(--pb-ink)}
.belt{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:.5rem}
.belt.tap{cursor:pointer}
.row{display:flex;gap:16px}
.rail{flex:none;width:28px;display:flex;flex-direction:column;align-items:center}
.node{flex:none;box-sizing:border-box;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all .35s ease}
.row.done .node{width:24px;height:24px;background:var(--pb-sage-ink)}
.row.cur .node{width:26px;height:26px;border:5px solid var(--pb-sage-ink);background:var(--pb-paper);margin-top:4px}
.row.todo .node{width:14px;height:14px;margin-top:5px;background:#C9C1B5}
.row.read .node{width:12px;height:12px;margin-top:9px;background:var(--pb-sage-ink)}
.line{flex:1;min-height:12px;width:3px;border-radius:2px;margin:4px 0;background:var(--pb-rule);transition:background .35s ease}
.row.done .line,.row.read .line{background:var(--pb-sage-ink)}
.row:last-child .line{background:transparent}
.txt{flex:1;min-width:0;padding-bottom:12px}
.row.cur .txt{padding-bottom:20px}
.bar{display:block;margin-top:6px;height:12px;border-radius:6px;background:var(--pb-bar)}
.s-cur{display:block;margin-top:-4px;font:400 clamp(1.8rem,8.6vw,2.15rem)/1.1 Anton,Impact,sans-serif;letter-spacing:.01em;color:#1E1B18}
.s-cur .f{color:var(--pb-rust)}
.s-done{display:block;padding-top:1px;font:400 17px/1.5 Geist,system-ui,sans-serif;color:var(--pb-body)}
.s-done .f{color:var(--pb-ink);font-weight:600;font-size:19px}
.row.read .s-done{font-size:18px}
.row.read .s-done .f{font-size:20px}
.gap{display:inline-block;min-width:2.6em;border-bottom:4px solid var(--pb-rust);color:transparent;line-height:.9}

/* ── the foot of the belt ── */
.foot{display:flex;flex-direction:column;align-items:center;gap:.7rem;padding-top:.6rem}
.hint{font-size:.72rem;padding:9px 12px;border-radius:999px;background:var(--pb-chip);color:#4A443D}
.hint.go{background:var(--pb-car);color:#fff}
.pair{display:flex;gap:10px;width:100%}
.pair button{flex:1;height:54px;border-radius:999px;font:600 17px/1 Geist,sans-serif;cursor:pointer}
.b-sage{border:none;background:var(--pb-sage-ink);color:#fff}
.b-line{border:1.5px solid var(--pb-rule);background:transparent;color:#4A443D}
.yourturn{font-size:.72rem;color:var(--pb-car);text-align:center;line-height:1.4}
@media (prefers-reduced-motion:reduce){ .node,.line{transition:none} }

/* ═══ PLAY / LIST (11 Nov 2026, the teacher's call): the bank is a game first,
   and still a list for the pupils who love lists, one switch apart. ═══ */
.pl-switch{display:flex;justify-content:center;margin:2px 0 18px}
.pl-switch span{display:inline-flex;padding:4px;border-radius:999px;background:rgba(20,17,14,.07)}
.pl-switch button{all:unset;cursor:pointer;padding:9px 22px;border-radius:999px;font:700 12px/1 'Geist',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#8A8378}
.pl-switch button[aria-checked=true]{background:#14110E;color:#F6F3EE}
.pl-fams{display:flex;gap:6px;overflow-x:auto;padding:0 2px 10px;margin:0 -2px;scrollbar-width:none}
.pl-fams::-webkit-scrollbar{display:none}
.pl-fams button{all:unset;flex:none;cursor:pointer;padding:7px 12px;border-radius:999px;border:1px solid #C9C1B4;font:600 10.5px/1 'Geist Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:#3A3530;background:rgba(250,248,245,.92)}
.pl-fams button[aria-pressed=true]{background:#14110E;border-color:#14110E;color:#F6F3EE}
.pl-card{margin-top:6px}
.pl-job{display:block;margin-top:12px;font:500 10.5px/1.3 'Geist Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#8A8378}
.pl-s{display:block;margin:12px 0 4px;font:500 clamp(18px,5vw,20px)/1.55 'Geist',sans-serif;color:#14110E}
.pl-s .f{color:#14110E;font-weight:700}
.pl-gap{display:inline-block;min-width:3.2em;border-bottom:2.5px solid #9A5A2C;margin:0 2px;text-align:center;color:#9A5A2C;font-weight:700}
.pl-gap.ok{border-color:#4F6B61;color:#4F6B61}.pl-gap.no{border-color:#C9A57F}
.pl-hud{display:flex;gap:14px;margin-top:12px;font:500 11px/1.4 'Geist Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#8A8378}
.pl-hud b{font-size:13px;color:#14110E}
.pl-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 4px}
.pl-opts button{all:unset;text-align:center;cursor:pointer;padding:14px 6px;border-radius:12px;border:1.5px solid rgba(20,17,14,.14);background:#fff;font:600 15px/1.2 'Geist',sans-serif;color:#14110E}
.pl-opts button.ok{background:#E3ECE7;border-color:#4F6B61;color:#2F4A40}
.pl-opts button.no{background:#F6ECE2;border-color:#C9A57F;color:#8A8378;text-decoration:line-through}
.pl-opts.done button{cursor:default}
.pl-why{display:block;margin-top:12px;padding-top:10px;border-top:1px dashed rgba(20,17,14,.14);font-size:14px;line-height:1.5;color:#5C5852}
.pl-why b{color:#14110E}
.pl-big{display:block;margin:12px 0 2px;font:400 clamp(64px,20vw,88px)/1 'Anton',Impact,sans-serif;color:#14110E}
.pl-sub{display:block;font:500 11px/1.5 'Geist Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#8A8378}
.pl-acts{display:flex;gap:10px;margin:18px 0 6px}
.pl-acts button,.pl-next{all:unset;cursor:pointer;flex:1;text-align:center;height:50px;line-height:50px;border-radius:999px;font:600 16px/50px 'Geist',sans-serif;border:1.5px solid rgba(20,17,14,.2);color:#4A443D}
.pl-acts .go,.pl-next{background:#14110E;border-color:#14110E;color:#F6F3EE}
.pl-next{display:block;width:150px;margin:16px auto 0}
</style>
</head>
<body>
<header class="header">
  <div class="header-top">
    <a class="back-link" id="back" href="/index.html?openModal=vocabulary" target="_top">← Vocabulary</a>
    <div class="header-title"><div class="app-title">INTUITY</div><div class="app-subtitle" id="sub">Phrase Bank</div></div>
    <span class="header-spacer">Level <b>B2</b></span>
  </div>
</header>
<main id="app"></main>
<script src="/skills/grammar-rules/intuity-sound.js"></script>
<script src="/tools/intuity-cheer.js?v=2"></script>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let DATA = null, AUDIO = {};
/* which menu sent the kid here: the Writing menu adds ?from=writing */
const FROM = new URLSearchParams(location.search).get('from') === 'writing' ? 'writing' : 'vocabulary';
const FROM_Q = FROM === 'writing' ? 'from=writing' : '';
const S = { view:'menu', fam:null, fn:null, track:'everyday', qi:0, mode:null, n:-1, shown:false, end:null, playing:false, paused:false };
let tok = { dead:true };

/* ── sentences: {…} = the target expression, […] = its key word ── */
function parse(src){
  const out = []; let f = false, k = false, buf = '';
  const push = () => { if (buf) out.push({ t:buf, f, k }); buf = ''; };
  for (const ch of src){
    if (ch === '{'){ push(); f = true; } else if (ch === '}'){ push(); f = false; }
    else if (ch === '['){ push(); k = true; } else if (ch === ']'){ push(); k = false; }
    else buf += ch;
  }
  push(); return out;
}
const plain = src => src.replace(/[{}\[\]]/g, '');
const qHtml = src => esc(src).replace(/\[([^\]]+)\]/g, '<em>$1</em>');

function findFn(id){ for (const F of DATA.families) for (const f of F.functions) if (f.id === id){ S.fam = F; return f; } return null; }
function findFam(id){ return DATA.families.find(F => F.id === id) || null; }
function T(){ return S.fn.tracks[S.track]; }
function NQ(){ return T().questions.length + ((S.fn.more || []).length); }          /* belts + spoken questions */
function spoken(){ return S.qi % NQ() >= T().questions.length; }
function Q(){ const qs = T().questions, i = S.qi % NQ(); return i < qs.length ? qs[i] : { q:S.fn.more[i - qs.length], s:[] }; }
/* the six expressions of a track, as frames: "What makes … appealing is …" */
function frameOf(src){ const out = []; parse(src).forEach(g => { if (g.f) out.push(g.t); else if (out[out.length-1] !== ' … ') out.push(' … '); });
  return out.join('').replace(/\s+/g, ' ').replace(/ ([,.!?])/g, '$1').trim(); }

/* ── MAYA: recorded if we have it, otherwise the phone's own voice ── */
const A = new Audio(); A.preload = 'auto';
function voice(){ const v = (window.speechSynthesis && speechSynthesis.getVoices()) || [];
  return v.find(x => /en-GB/i.test(x.lang) && /female|serena|kate|martha|libby|sonia/i.test(x.name)) || v.find(x => /en-GB/i.test(x.lang)) || v.find(x => /^en/i.test(x.lang)) || null; }
function speak(text, t){
  return new Promise(res => {
    if (t && t.dead) return res();
    const done = () => { clearTimeout(guard); res(); };
    const guard = setTimeout(done, 1200 + text.split(' ').length * 520);   /* never hang on a silent voice */
    const url = AUDIO[text];
    if (url){ A.onended = done; A.onerror = () => tts(text, done); A.src = url; A.currentTime = 0; A.play().catch(() => tts(text, done)); return; }
    tts(text, done);
  });
}
function tts(text, done){
  if (!window.speechSynthesis){ return; }               /* the guard timer moves the belt on */
  try{ speechSynthesis.cancel(); }catch(e){}
  const u = new SpeechSynthesisUtterance(text); const v = voice(); if (v) u.voice = v;
  u.lang = 'en-GB'; u.rate = .92; u.onend = done; u.onerror = done; speechSynthesis.speak(u);
}
function hush(){ tok.dead = true; A.pause(); try{ speechSynthesis.cancel(); }catch(e){} }
const wait = ms => new Promise(r => setTimeout(r, ms));

/* ── the pill ── */
function pill(state, label, pct, small){
  const icon = state === 'pause'
    ? '<svg width="60" height="60" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4.2" height="14" rx="1.4" fill="#14110E" stroke="#8AA79C" stroke-width="1.6"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.4" fill="#14110E" stroke="#8AA79C" stroke-width="1.6"/></svg>'
    : '<svg width="60" height="60" viewBox="0 0 24 24" aria-hidden="true"><polygon points="6,4 20,12 6,20" fill="#8AA79C" stroke="#8AA79C" stroke-width="1" stroke-linejoin="round"/><line x1="6" y1="4" x2="6" y2="20" stroke="#14110E" stroke-width="2" stroke-linecap="round"/><polygon points="6,7.4 14.2,12 6,16.6" fill="#14110E"/></svg>';
  const prog = pct > 0 ? '<rect class="o-prog" x="0.75" y="0.75" width="210.5" height="74.5" rx="37.25" pathLength="100" stroke-dasharray="'+Math.min(100,pct)+' 100"/>' : '';
  return '<div class="maya'+(small?' small':'')+'"><svg class="ring-o" width="212" height="76" viewBox="0 0 212 76" aria-hidden="true">'+
    '<rect class="o-rest" x="0.75" y="0.75" width="210.5" height="74.5" rx="37.25"/>'+prog+'</svg>'+
    '<button type="button" data-pill aria-label="'+(state==='pause'?'Pause Maya':'Play Maya')+'">'+icon+'<b>'+esc(label)+'</b></button></div>';
}

/* ═══ VIEWS ═══ */
function setHeader(){
  const b = $('#back'), sub = $('#sub');
  if (S.view === 'menu' || S.view === 'play'){ b.textContent = FROM === 'writing' ? '← Writing' : '← Vocabulary'; b.href = '/index.html?openModal=' + FROM; sub.textContent = 'Phrase Bank'; }
  else if (S.view === 'fam'){ b.textContent = '← Phrase Bank'; b.href = '#'; sub.textContent = 'Phrase Bank'; }
  else if (S.view === 'fn'){ b.textContent = '← ' + ({weighing:'Weighing up',reasoning:'Reasons',stance:'Stance',comparison:'Comparing',projecting:'Likelihood',assess:'Assess'}[S.fam.id] || 'Back'); b.href = '#'; sub.textContent = S.fn.label; }
  else { b.textContent = '← Question'; b.href = '#'; sub.textContent = S.fn.label; }
}

function drawMenu(){
  let h = '<p class="lead">Six families. Each one is a job your English has to do.</p><div class="dials">';
  DATA.families.forEach((F, i) => {
    const live = F.functions.some(f => f.tracks);
    h += '<button class="dial-b'+(live?'':' soon')+'" type="button" '+(live?'data-fam="'+F.id+'"':'disabled aria-disabled="true"')+' aria-label="'+esc(F.label)+'">'+
      '<div class="pend-dial still" aria-hidden="true"><span>'+(i+1)+'</span></div>'+
      '<span class="dial-name">'+esc(F.label)+'</span></button>';
  });
  $('#app').innerHTML = plSwitch() + h.replace('<div class="dials">','<div class="dials fam-dials">') + '</div>' +
    '<a class="cmap mono" href="/skills/similar-words/phrase-map.html">Classroom map ›</a>';   /* teacher's PC only: the drag-around map and the class relay */
}
function drawFam(){
  const F = S.fam;
  $('#app').innerHTML = '<h1 class="fam-title">'+esc(F.label)+'</h1><p class="fam-note mono">'+F.functions.length+' jobs · Everyday and Academic</p><div class="dials">'+
    F.functions.map((f, i) => { const live = !!f.tracks;
      return '<button class="dial-b'+(live?'':' soon')+'" type="button" '+(live?'data-fn="'+f.id+'"':'disabled aria-disabled="true"')+' aria-label="'+esc(f.label)+'">'+
        '<div class="pend-hang" style="animation-delay:'+(i * -1.3).toFixed(2)+'s" aria-hidden="true"><div class="pend-dial"><span>'+(i+1)+'</span></div></div>'+
        '<span class="dial-name">'+esc(f.label)+'</span></button>'; }).join('')+'</div>';
}

function drawSpoken(){
  const t = T(), q = Q(), n = S.qi % NQ() + 1;
  $('#app').innerHTML =
    '<div class="trk" role="tablist"><button data-track="everyday" class="'+(S.track==='everyday'?'on':'')+'">Everyday</button>'+
    '<button data-track="academic" class="'+(S.track==='academic'?'on':'')+'">Academic</button></div>'+
    '<div class="qscreen spoken">'+
      '<div class="asks mono"><span class="wave" aria-hidden="true"><i style="height:8px"></i><i style="height:16px"></i><i style="height:11px"></i><i style="height:18px"></i><i style="height:9px"></i></span>Out loud · question '+n+' of '+NQ()+'</div>'+
      '<h1 class="q-big'+(q.q.length > 55 ? ' long' : '')+'">'+qHtml(q.q)+'</h1>'+
      '<p class="use">Answer out loud. Start with one of these:</p>'+
      '<ul class="frames">'+t.questions[0].s.map(x => '<li>'+esc(frameOf(x))+'</li>').join('')+'</ul>'+
      pill('play','PLAY',0)+
      '<div class="alts"><button data-again-q>Next question →</button></div>'+
    '</div>';
}
function drawFn(){
  if (spoken()) return drawSpoken();
  const t = T(), q = Q(), qs = NQ();
  $('#app').innerHTML =
    '<div class="trk" role="tablist"><button data-track="everyday" class="'+(S.track==='everyday'?'on':'')+'">Everyday</button>'+
    '<button data-track="academic" class="'+(S.track==='academic'?'on':'')+'">Academic</button></div>'+
    '<div class="qscreen">'+
      '<div class="asks mono"><span class="wave" aria-hidden="true"><i style="height:8px"></i><i style="height:16px"></i><i style="height:11px"></i><i style="height:18px"></i><i style="height:9px"></i></span>'+(S.track==='academic'?'The task':'Maya asks')+'</div>'+
      '<h1 class="q-big">'+qHtml(q.q)+'</h1>'+
      '<p class="use">'+(['','One','Two','Three','Four','Five','Six','Seven','Eight'][q.s.length]||q.s.length)+' ways to start your answer. '+esc(t.use)+(qs>1?' <span style="color:#8A8279">· Question '+(S.qi%qs+1)+' of '+qs+'</span>':'')+'</p>'+
      pill('play','PLAY',0)+
      '<div class="alts"><button data-mode="read">Read</button><button data-mode="practice">Practise</button></div>'+
    '</div>';
}

function rowHtml(src, i){
  const segs = parse(src);
  let cls;
  if (S.mode === 'read' && !S.end) cls = 'read';
  else if (S.end) cls = 'done';
  else cls = i < S.n ? 'done' : i === S.n ? 'cur' : 'todo';
  let txt;
  if (cls === 'todo') txt = '<span class="bar" style="width:'+[72,58,66,50,62,54][i%6]+'%"></span>';
  else {
    const gap = cls === 'cur' && S.mode === 'practice' && !S.shown;
    txt = '<span class="'+(cls==='cur'?'s-cur':'s-done')+'">'+segs.map(g =>
      gap && g.k ? '<span class="gap">'+esc(g.t)+'</span>' : g.f ? '<span class="f">'+esc(g.t)+'</span>' : esc(g.t)).join('')+'</span>';
  }
  const tick = cls === 'done' ? '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 7.5l2.6 2.6L11 4.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>' : '';
  return '<div class="row '+cls+'"><div class="rail"><span class="node">'+tick+'</span><span class="line"></span></div><div class="txt">'+txt+'</div></div>';
}

function drawBelt(){
  const q = Q(), L = q.s.length;
  let foot = '';
  if (S.end === 'watch')
    foot = '<div class="pair"><button class="b-sage" data-mode="practice">Practise</button><button class="b-line" data-mode="watch">↺ Watch again</button></div>';
  else if (S.end === 'practice')
    foot = '<span class="yourturn mono">Your turn · if you like · pick one, answer out loud</span><div class="pair"><button class="b-line" data-next>Next question →</button></div>';
  else if (S.mode === 'watch')
    foot = pill(S.paused ? 'play' : 'pause', S.n < 0 ? 'MAYA' : (S.n+1)+' / '+L, S.n < 0 ? 3 : ((S.n+1)/L)*100, true);
  else if (S.mode === 'read')
    foot = '<div class="pair"><button class="b-sage" data-mode="watch">▶ Watch</button><button class="b-line" data-mode="practice">Practise</button></div>';
  else if (S.mode === 'practice')
    foot = '<span class="hint mono'+(S.shown?'':' go')+'">'+(S.shown?'Maya says it':'Say it, then tap')+'</span>';
  $('#app').innerHTML = '<p class="q-pin">'+qHtml(q.q)+'</p>'+
    '<div class="belt'+(S.mode==='practice'&&!S.end?' tap':'')+'" id="belt">'+q.s.map(rowHtml).join('')+'</div>'+
    '<div class="foot">'+foot+'</div>';
  const cur = document.querySelector('.row.cur');
  if (cur) cur.scrollIntoView({ block:'nearest', behavior:'smooth' });
}

function draw(){ setHeader(); $('#app').classList.toggle('full', S.view === 'belt'); if (S.view === 'play') drawPlay(); else if (S.view === 'menu') drawMenu(); else if (S.view === 'fam') drawFam(); else if (S.view === 'fn') drawFn(); else drawBelt(); }

/* ═══ PLAY: the right word for the job ════════════════════════════════
   A sentence from the bank with its key word missing ("The ___ thing about
   city life is…"), and three words: its own, and two key words from OTHER
   jobs in the same family, so the choice is about what the phrase does, not
   a synonym hunt. Rounds of eight, a run, a best per family, review cards. */
const PL_R = 8;
let PL = null;
const plMem = (k, v) => { try{ if (v === undefined) return localStorage.getItem('intuity.pb.' + k); localStorage.setItem('intuity.pb.' + k, v); }catch(e){ return null; } };
function plItems(famId){
  const out = [];
  DATA.families.forEach(F => { if (famId && F.id !== famId) return;
    F.functions.forEach(fn => { if (!fn.tracks) return;
      Object.keys(fn.tracks).forEach(tk => fn.tracks[tk].questions.forEach((q, qi) => q.s.forEach((src, si) => {
        const segs = parse(src), key = segs.filter(g => g.k).map(g => g.t).join(' ').trim();
        if (key && segs.filter(g => g.k).length === 1) out.push({ id: fn.id + '.' + tk + '.' + qi + '.' + si, src, key, fn, F, track: tk });
      }))); }); });
  return out;
}
function plRound(same){
  const fam = plMem('fam') || '';
  let items = same && PL ? PL.items : null;
  if (!items){
    const all = plItems(fam).sort(() => Math.random() - .5), used = {}; items = [];
    for (const x of all){ if (items.length >= PL_R) break; if (used[x.fn.id] >= 2) continue; used[x.fn.id] = (used[x.fn.id] || 0) + 1; items.push(x); }
    items = items.map(x => {
      const pool = [...new Set(plItems(x.F.id).filter(y => y.fn.id !== x.fn.id).map(y => y.key.toLowerCase()))].filter(w => w !== x.key.toLowerCase()).sort(() => Math.random() - .5);
      return Object.assign({}, x, { opts: [x.key].concat(pool.slice(0, 2)).sort(() => Math.random() - .5) });
    });
  }
  PL = { items, pos: 0, kept: 0, missed: 0, run: 0, best: 0, res: [], n: (PL ? PL.n : 0) + (same ? 0 : 1), fam, done: false };
}
function plSwitch(){ return '<div class="pl-switch"><span role="radiogroup" aria-label="Play or list">' +
  '<button type="button" role="radio" data-pl="play" aria-checked="' + (S.view === 'play') + '">Play</button>' +
  '<button type="button" role="radio" data-pl="list" aria-checked="' + (S.view !== 'play') + '">List</button></span></div>'; }
function plFams(){ const cur = plMem('fam') || '';
  return '<div class="pl-fams" role="group" aria-label="Family">' + [['', 'All']].concat(DATA.families.filter(F => F.functions.some(f => f.tracks)).map(F => [F.id, F.label]))
    .map(([id, l]) => '<button type="button" data-plfam="' + id + '" aria-pressed="' + (id === cur) + '">' + esc(l) + '</button>').join('') + '</div>'; }
function plBar(){ return '<span class="rbar" aria-hidden="true">' + PL.items.map((_, i) => '<i class="' + (PL.res[i] || (i === PL.pos && !PL.done ? 'now' : '')) + '"></i>').join('') + '</span>'; }
function drawPlay(){
  if (!PL || PL.fam !== (plMem('fam') || '')) plRound(false);
  let h = plSwitch() + plFams();
  if (PL.pos >= PL.items.length){
    const tot = PL.items.length, bk = 'best.' + (PL.fam || 'all'); let best = +plMem(bk) || 0; const nb = PL.kept > best; if (nb) plMem(bk, PL.kept);
    const f = PL.kept / tot;
    h += '<article class="fc-card pl-card"><span class="fc-k">Phrase Bank · Round ' + PL.n + ' done</span><span class="pl-big">' + PL.kept + ' / ' + tot + '</span>' +
      '<span class="pl-sub">' + (PL.missed ? PL.missed + ' missed' : 'none missed') + (PL.best >= 3 ? ' · best run ' + PL.best : '') +
      (nb ? (best ? ' · new best' : ' · first score to beat') : best ? ' · your best ' + best + ' / ' + tot : '') + '</span>' +
      '<div class="pl-acts"><button type="button" data-plagain>↻ These again</button><button type="button" class="go" data-plnext>Next eight →</button></div></article>';
    $('#app').innerHTML = h;
    setTimeout(() => { if (!window.Cheer) return; const big = document.querySelector('.pl-big'); if (PL.kept === tot) Cheer.finale(); else if (nb && best) Cheer.streak(big); else if (f >= .75) Cheer.done(big); else Cheer.tick(big); }, 200);
    return;
  }
  const x = PL.items[PL.pos], segs = parse(x.src), n = PL.kept + PL.missed;
  h += '<article class="fc-card pl-card"><span class="fc-k">' + esc(x.F.label) + ' · Round ' + PL.n + '</span><span class="fc-t">The right word <span class="fc-n">' + (PL.pos + 1) + '</span></span><span class="fc-bar" aria-hidden="true"></span>' +
    plBar() + (n ? '<div class="pl-hud"><span><b>' + PL.kept + '</b> right</span><span><b>' + PL.missed + '</b> missed</span><span>🔥 <b>' + PL.run + '</b></span></div>' : '') +
    '<span class="pl-job">Job: ' + esc(x.fn.label) + ' · ' + (x.track === 'academic' ? 'Academic' : 'Everyday') + '</span>' +
    '<span class="pl-s">' + segs.map(g => g.k ? '<span class="pl-gap" id="plGap">&nbsp;</span>' : g.f ? '<span class="f">' + esc(g.t) + '</span>' : esc(g.t)).join('') + '</span>' +
    '<div class="pl-opts" id="plOpts">' + x.opts.map(o => '<button type="button" data-plo="' + esc(o) + '">' + esc(o) + '</button>').join('') + '</div>' +
    '<span id="plWhy"></span></article>';
  $('#app').innerHTML = h;
}
let PL_T = 0;
function plPick(b){
  const x = PL.items[PL.pos], box = document.getElementById('plOpts'); if (!x || box.classList.contains('done')) return;
  const o = b.getAttribute('data-plo'), ok = o.toLowerCase() === x.key.toLowerCase();
  box.classList.add('done');
  box.querySelectorAll('button').forEach(y => { y.disabled = true; if (y.getAttribute('data-plo').toLowerCase() === x.key.toLowerCase()) y.classList.add('ok'); else if (y === b) y.classList.add('no'); });
  const g = document.getElementById('plGap'); g.textContent = x.key; g.classList.add(ok ? 'ok' : 'no');
  if (ok){ PL.kept++; PL.run++; PL.best = Math.max(PL.best, PL.run); } else { PL.missed++; PL.run = 0; }
  PL.res[PL.pos] = ok ? 'ok' : 'no';
  const seg = document.querySelectorAll('.pl-card .rbar i')[PL.pos]; if (seg) seg.className = ok ? 'ok' : 'no';
  const other = !ok ? plItems(x.F.id).find(y => y.key.toLowerCase() === o.toLowerCase()) : null;
  document.getElementById('plWhy').outerHTML = '<span class="pl-why"><b>' + (ok ? 'Right.' : 'Not this one.') + '</b> ' +
    (ok ? 'It does the job: ' + esc(x.fn.label.toLowerCase()) + '.' : '“' + esc(o) + '” belongs to ' + esc(other ? other.fn.label.toLowerCase() : 'another job') + '; this phrase is for ' + esc(x.fn.label.toLowerCase()) + '.') + '</span>' +
    (ok ? '' : '<button type="button" class="pl-next" data-plgo>Next</button>');
  try{ if (window.Be2 && Be2.answer) Be2.answer('phrase-bank', { id: x.id, correct: ok, prompt: plain(x.src).replace(x.key, '___'), answer: x.key, given: ok ? '' : o,
      rule: x.fn.label + ': ' + plain(x.src), opts: x.opts, href: location.pathname + '?play=1' }); }catch(e){}
  if (window.Cheer){ if (ok){ Cheer.right(g, true); if (PL.run >= 3 && PL.run % 3 === 0) Cheer.streak(g); } else Cheer.soft(); }
  PL.pos++;
  clearTimeout(PL_T); if (ok) PL_T = setTimeout(() => { if (S.view === 'play') drawPlay(); }, 1500);
}
document.addEventListener('click', e => {
  const sw = e.target.closest('[data-pl]');
  if (sw){ const v = sw.getAttribute('data-pl'); plMem('view', v); clearTimeout(PL_T); hush();
    if (v === 'play'){ S.view = 'play'; history.replaceState({ v:'menu' }, ''); draw(); } else { S.view = 'menu'; draw(); } scrollTo(0, 0); return; }
  const fb = e.target.closest('[data-plfam]'); if (fb){ plMem('fam', fb.getAttribute('data-plfam')); clearTimeout(PL_T); PL = null; drawPlay(); return; }
  const ob = e.target.closest('[data-plo]'); if (ob){ plPick(ob); return; }
  if (e.target.closest('[data-plgo]')){ clearTimeout(PL_T); drawPlay(); return; }
  if (e.target.closest('[data-plagain]')){ plRound(true); drawPlay(); return; }
  if (e.target.closest('[data-plnext]')){ plRound(false); drawPlay(); return; }
});

/* ═══ FLOW ═══ */
function go(view, push){
  hush();
  S.view = view;
  if (push !== false) history.pushState({ v:view, fam:S.fam && S.fam.id, fn:S.fn && S.fn.id, track:S.track, qi:S.qi, mode:S.mode }, '', location.pathname + (view === 'fam' ? '?fam='+S.fam.id : S.fn && view !== 'menu' ? '?fn='+S.fn.id : '') + (FROM_Q ? (view === 'menu' ? '?' : '&') + FROM_Q : ''));
  draw(); scrollTo(0, 0);
}
function startMode(mode){
  hush(); S.mode = mode; S.end = null; S.paused = false; S.shown = false;
  S.n = mode === 'read' ? 99 : mode === 'watch' ? -1 : 0;
  if (S.view !== 'belt') go('belt'); else draw();
  if (mode === 'watch') runWatch();
}
async function runWatch(){
  const t = tok = { dead:false }, q = Q();
  if (S.n < 0){ await speak(plain(q.q), t); if (t.dead) return; S.n = 0; drawBelt(); await wait(300); }
  while (!t.dead && S.n < q.s.length){
    await speak(plain(q.s[S.n]), t); if (t.dead) return;
    await wait(450); if (t.dead) return;
    if (S.n < q.s.length - 1){ S.n++; drawBelt(); } else { S.end = 'watch'; drawBelt(); return; }
  }
}
async function practiseTap(){
  if (S.mode !== 'practice' || S.end || S.shown) return;
  const t = tok = { dead:false }, q = Q();
  S.shown = true; drawBelt();
  await speak(plain(q.s[S.n]), t); if (t.dead) return;
  await wait(500); if (t.dead) return;
  if (S.n < q.s.length - 1){ S.n++; S.shown = false; } else S.end = 'practice';
  drawBelt();
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-fam],[data-fn],[data-track],[data-mode],[data-pill],[data-next],[data-again-q],#belt,#back');
  if (!el) return;
  if (el.id === 'back'){
    if (S.view === 'menu' || S.view === 'play'){  /* leave: back to the INTUITY page that sent us, else the menu */
      try{ if (document.referrer && new URL(document.referrer).host === location.host){ e.preventDefault(); history.back(); } }catch(_){}
      return;
    }
    e.preventDefault(); history.back(); return;
  }
  if (el.dataset.fam){ S.fam = findFam(el.dataset.fam); S.fn = null; go('fam'); return; }
  if (el.dataset.fn){ S.fn = findFn(el.dataset.fn); S.track = 'everyday'; S.qi = 0; S.mode = null; go('fn'); return; }
  if (el.dataset.track){ S.track = el.dataset.track; S.qi = 0; history.replaceState(Object.assign({}, history.state, { track:S.track, qi:0 }), ''); drawFn(); return; }
  if (el.hasAttribute('data-pill')){
    if (S.view === 'fn' && spoken()){ hush(); const t = tok = { dead:false }; speak(plain(Q().q), t); return; }   /* Maya asks; the kid answers */
    if (S.view === 'fn'){ startMode('watch'); return; }
    if (S.mode === 'watch' && !S.end){                       /* one tap pauses, one tap resumes */
      if (S.paused){ S.paused = false; drawBelt(); runWatch(); }
      else { hush(); S.paused = true; drawBelt(); }
    }
    return;
  }
  if (el.dataset.mode){ startMode(el.dataset.mode); return; }
  if (el.hasAttribute('data-again-q')){ hush(); S.qi = (S.qi + 1) % NQ(); drawFn(); scrollTo(0, 0); return; }
  if (el.hasAttribute('data-next')){ S.qi = (S.qi + 1) % NQ(); S.mode = null; S.end = null; history.back(); setTimeout(() => { if (S.view === 'fn') drawFn(); }, 60); return; }
  if (el.id === 'belt'){ practiseTap(); return; }
});
window.addEventListener('popstate', e => {
  hush();
  const st = e.state;
  if (!st || st.v === 'menu'){ S.view = plMem('view') === 'list' ? 'menu' : 'play'; S.fn = null; draw(); return; }
  if (st.v === 'fam'){ S.fam = findFam(st.fam); S.fn = null; S.view = 'fam'; draw(); return; }
  S.fn = findFn(st.fn); S.view = st.v;
  if (S.view === 'belt'){ S.view = 'fn'; }       /* coming back to a belt: start again from the question */
  draw();
});
document.addEventListener('visibilitychange', () => { if (document.hidden && S.mode === 'watch' && !S.end && !S.paused){ hush(); S.paused = true; if (S.view === 'belt') drawBelt(); } });
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => {};

/* the shell's header is fixed: the page starts below its real height */
function syncHeader(){ const h = document.querySelector('.header'); if (h) document.documentElement.style.setProperty('--header-h', h.offsetHeight + 'px'); }
addEventListener('resize', syncHeader);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(syncHeader);
if (window.ResizeObserver){ const hh = document.querySelector('.header'); if (hh) new ResizeObserver(syncHeader).observe(hh); }
syncHeader();

/* ═══ START ═══ */
Promise.all([
  fetch('/data/similar-words/phrase-bank-v2.json', { cache:'no-cache' }).then(r => r.json()),
  fetch('/data/similar-words/phrase-bank-v2-audio.json', { cache:'no-cache' }).then(r => r.ok ? r.json() : {}).catch(() => ({}))
]).then(([d, a]) => {
  DATA = d; AUDIO = a || {};
  const qs = new URLSearchParams(location.search), f = qs.get('fn') && findFn(qs.get('fn')), F = qs.get('fam') && findFam(qs.get('fam'));
  history.replaceState({ v:'menu' }, '', location.pathname + (FROM_Q ? '?' + FROM_Q : ''));
  if (f && f.tracks){ S.fam = F || S.fam; history.pushState({ v:'fam', fam:S.fam.id }, '', location.pathname+'?fam='+S.fam.id+(FROM_Q ? '&'+FROM_Q : '')); S.fn = f; go('fn'); }
  else if (F){ S.fam = F; go('fam'); } else { if (plMem('view') !== 'list' || qs.get('play')) S.view = 'play'; draw(); }
});
</script>
