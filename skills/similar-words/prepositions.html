<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F3F1ED">
  <title>Be2FIRST — Prepositions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..900&family=Geist+Mono:wght@400..600&family=Space+Grotesk:wght@700&family=Anton&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=20261012">
  <link rel="stylesheet" href="/tools/intuity-pills.css?v=20261012">
  <script src="/tools/be2-brand.js?v=20261012c"></script>
<style>
/* ═══ PREPOSITIONS — the triangle band ═══════════════════════════════════
   Eighteen triangles in two strips of nine, the shape of the paper tarsia.
   Wide screens lay the band flat (a long hexagon, 5 sides × 2 heights);
   phones stand it up, so every triangle points sideways and its word runs
   along the long, flat side — the only way "congratulate" fits a triangle
   on a 390px screen at a size a class can read.
   Tap a triangle → its sentence comes up in the tray → choose the
   preposition. Right fills the tile; wrong marks the pill and counts.    */
:root{
  --tile:var(--card);
  --tile-ink:var(--ink);
  --solved:#708A81;          /* the Vocabulary tone, as on the home menu */
  --solved-ink:#FEFCF9;
  --pick:var(--accent);
}
body{min-height:100dvh}
.wrap{max-width:var(--w-sheet);margin:0 auto;padding:0 var(--gutter) 13rem}
.strip{display:flex;justify-content:space-between;align-items:baseline;
  max-width:var(--w-read);margin:.9rem auto .5rem;padding:0 .25rem;
  font-family:var(--f-mono);font-size:.6875rem;letter-spacing:var(--track-label);
  text-transform:uppercase;color:var(--faint)}
.strip b{color:var(--ink);font-weight:600}
.strip .miss b{color:var(--wrong)}

.band{display:block;margin:0 auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.band .tri{cursor:pointer}
.band .tri polygon{fill:var(--tile);stroke:var(--screen);stroke-width:6;stroke-linejoin:round;
  transition:fill .25s ease}
/* Two tones, like the cut-out pieces of a paper tarsia: the eye reads the
   triangles from the tone change, so no outline is needed. */
.band .tri.alt polygon{fill:color-mix(in srgb,var(--ink) 6%,var(--card))}
@media(hover:hover){ .band .tri:not(.done):hover polygon{fill:color-mix(in srgb,var(--pick) 10%,var(--tile))} }
.band .tri.sel polygon,.band .tri.alt.sel polygon{fill:color-mix(in srgb,var(--pick) 22%,var(--tile))}
.band .tri.done polygon,.band .tri.alt.done polygon{fill:var(--solved)}
.band .tri.flash polygon,.band .tri.alt.flash polygon{fill:color-mix(in srgb,var(--wrong) 30%,var(--tile))}
.band .w{font-family:var(--f-display);font-weight:600;fill:var(--tile-ink);letter-spacing:-.005em}
.band .p{font-family:var(--f-mono);font-weight:600;fill:var(--solved-ink);letter-spacing:.04em}
.band .tri.done .w{fill:var(--solved-ink)}
.band .tri.done .w{opacity:.92}
.band .tri.sel .w{fill:var(--accent-ink)}

/* ── the tray: one sentence and the prepositions ─────────────────────── */
.tray{position:fixed;left:0;right:0;bottom:0;z-index:20;
  padding:.85rem var(--gutter) calc(.9rem + env(safe-area-inset-bottom));
  background:var(--card);box-shadow:0 -10px 30px -18px rgba(35,44,49,.35)}
.tray-in{max-width:var(--w-read);margin:0 auto}
.say{font-family:var(--f-body);font-size:1.0625rem;line-height:1.45;color:var(--ink);
  min-height:3em;margin:0 0 .7rem;text-align:center;text-wrap:balance}
.say .gap{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--pick);
  color:var(--accent-ink);font-weight:600;text-align:center;padding:0 .15em}
.say .gap.ok{border-color:var(--solved);color:var(--solved)}
.say .gap.none{min-width:1.4em}
.say .hint{color:var(--faint);font-size:.9375rem}
.opts{display:flex;flex-wrap:wrap;justify-content:center;gap:.4rem}
.opt{font-family:var(--f-mono);font-size:.875rem;font-weight:500;letter-spacing:.02em;
  min-width:3.4rem;padding:.55rem .8rem;border:none;border-radius:var(--r-tab);
  background:color-mix(in srgb,var(--ink) 7%,var(--card));color:var(--ink);cursor:pointer;
  transition:background .15s,color .15s,transform .1s}
.opt:active{transform:scale(.96)}
@media(hover:hover){ .opt:hover:not(:disabled){background:color-mix(in srgb,var(--pick) 25%,var(--card))} }
.opt.no{background:none;color:color-mix(in srgb,var(--wrong) 70%,var(--card));text-decoration:line-through;cursor:default}
.opt.yes{background:var(--solved);color:var(--solved-ink)}

/* ── the end of a set ────────────────────────────────────────────────── */
.done-card{text-align:center}
.done-card .big{font-family:var(--f-display);font-weight:800;font-size:1.6rem;
  letter-spacing:var(--track-display);color:var(--ink);margin:.1rem 0 .2rem}
.done-card .sub{font-size:.9375rem;color:var(--faint);margin:0 0 .7rem}
.done-card .review{display:flex;flex-wrap:wrap;justify-content:center;gap:.35rem .9rem;
  font-size:.9375rem;margin:0 0 .85rem;color:var(--paper)}
.done-card .review b{color:var(--wrong);font-weight:600}
.endgo{display:flex;gap:.5rem;justify-content:center;background:none!important;padding:0!important}
.endgo button{font-family:var(--f-display);font-weight:700;font-size:.8125rem;letter-spacing:.06em;
  text-transform:uppercase;border:none;border-radius:var(--r-tab);padding:.7rem 1.2rem;cursor:pointer;
  background:color-mix(in srgb,var(--ink) 7%,var(--card));color:var(--ink)}
.endgo button.primary{background:var(--ink);color:var(--card)}
@media (min-width:700px){
  .say{font-size:1.1875rem}
  /* Lying flat, the band is short: the tray follows it instead of
     floating at the foot of an empty screen. */
  .wrap{padding-bottom:2rem}
  .tray{position:static;background:none;box-shadow:none;padding-top:1.4rem}
}
</style>
</head>
<body>
<header class="header header--flow">
  <div class="header-top">
    <a class="back-link" href="/index.html?openModal=vocabulary" target="_top">← Vocabulary</a>
    <div class="header-title">
      <div class="app-title">INTUITY</div>
      <div class="app-subtitle">Prepositions</div>
    </div>
    <span class="header-spacer">Level <b>B2</b></span>
  </div>
  <div class="set-tabs" id="sets" role="tablist" aria-label="Set"></div>
</header>

<main class="wrap">
  <div class="strip" aria-live="polite">
    <span id="setName"></span>
    <span><b id="nDone">0</b>/<span id="nAll">18</span> · <span class="miss"><b id="nMiss">0</b> mistakes</span></span>
  </div>
  <svg class="band" id="band" role="group" aria-label="Eighteen words"></svg>
</main>

<div class="tray" id="tray"><div class="tray-in" id="trayIn">
  <p class="say" id="say"><span class="hint">Tap a triangle.</span></p>
  <div class="opts" id="opts"></div>
</div></div>

<script>
(function(){
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const H = Math.sqrt(3) / 2;
const KEY = 'be2.prepositions.v1';
let DATA = null, SET = 0, CELLS = [], SEL = -1, MISS = 0, MISSED = [];

const store = {
  get(){ try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){ return {}; } },
  put(v){ try { localStorage.setItem(KEY, JSON.stringify(v)); } catch(e){} }
};
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ── geometry: the 18 triangles in unit sides, laid flat ──────────────
   Top strip: even = pointing up (base on the middle line), odd = down.
   Bottom strip mirrors it. Together: a long hexagon 5 wide, 2H tall. */
function flatTriangles(){
  const t = [];
  for (const row of [0, 1]) for (let i = 0; i < 9; i++) {
    const k = Math.floor(i / 2), even = i % 2 === 0;
    if (row === 0) t.push(even ? [[k,H],[k+1,H],[k+.5,0]] : [[k+.5,0],[k+1.5,0],[k+1,H]]);
    else           t.push(even ? [[k,H],[k+1,H],[k+.5,2*H]] : [[k+.5,2*H],[k+1.5,2*H],[k+1,H]]);
  }
  return t;
}
/* Upright on a phone: swap the axes, so the band runs down the screen and
   each triangle points left or right. */
const upright = () => window.innerWidth < 700;

/* Where a horizontal line at y crosses a triangle: [x1, x2] or null. */
function span(pts, y){
  const xs = [];
  for (let i = 0; i < 3; i++) {
    const [ax, ay] = pts[i], [bx, by] = pts[(i + 1) % 3];
    if ((y - ay) * (y - by) <= 0 && ay !== by) xs.push(ax + (y - ay) * (bx - ax) / (by - ay));
  }
  return xs.length < 2 ? null : [Math.min(...xs), Math.max(...xs)];
}
/* Width free for a line of text of size fs centred on y: the narrower of
   the spans at its top and its bottom, less a margin. */
function room(pts, y, fs){
  const a = span(pts, y - fs * .55), b = span(pts, y + fs * .55);
  if (!a || !b) return null;
  const x1 = Math.max(a[0], b[0]), x2 = Math.min(a[1], b[1]);
  return { x1, x2, w: x2 - x1 };
}

let MEASURE = null;
function textWidth(str, fs, weight, family){
  MEASURE = MEASURE || document.createElement('canvas').getContext('2d');
  MEASURE.font = weight + ' ' + fs + 'px ' + family;
  return MEASURE.measureText(str).width;
}
const FAMILY_W = "Geist, system-ui, sans-serif", FAMILY_P = "'Geist Mono', ui-monospace, monospace";

/* ── drawing ──────────────────────────────────────────────────────────── */
function draw(){
  const svg = $('band');
  const vertical = upright();
  const avail = Math.min(document.documentElement.clientWidth, 1100) - 32;
  const s = vertical ? Math.min(132, avail / (2 * H)) : Math.min(176, avail / 5);
  const base = flatTriangles().map(tri => tri.map(([x, y]) => vertical ? [y * s, x * s] : [x * s, y * s]));
  const W = vertical ? 2 * H * s : 5 * s, Ht = vertical ? 5 * s : 2 * H * s;
  svg.setAttribute('viewBox', `-4 -4 ${W + 8} ${Ht + 8}`);
  svg.setAttribute('width', W + 8); svg.setAttribute('height', Ht + 8);
  svg.innerHTML = '';
  base.forEach((pts, i) => {
    const c = CELLS[i]; if (!c) return;
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'tri' + (i % 2 ? ' alt' : '') + (c.done ? ' done' : '') + (i === SEL ? ' sel' : ''));
    g.setAttribute('role', 'button'); g.setAttribute('tabindex', '0');
    g.setAttribute('aria-label', c.it.w + (c.done ? ' ' + c.it.p : ''));
    const poly = document.createElementNS(NS, 'polygon');
    poly.setAttribute('points', pts.map(p => p.join(',')).join(' '));
    g.appendChild(poly);
    label(g, pts, c, vertical, s);
    g.addEventListener('click', () => pick(i));
    g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(i); } });
    svg.appendChild(g);
  });
}

/* The word sits against the triangle's flat side, where it is widest:
   above the base for an up-triangle, below it for a down one, and beside
   the base when the band stands upright. A solved tile adds the
   preposition on a second line. Sizes shrink to fit, never below 9px. */
function label(g, pts, c, vertical, s){
  const ys = pts.map(p => p[1]), xs = pts.map(p => p[0]);
  let wy, py;
  if (vertical) {
    const cy = (Math.min(...ys) + Math.max(...ys)) / 2;
    wy = c.done ? cy - s * .075 : cy; py = cy + s * .11;
  } else {
    const flatY = ys.filter(y => ys.filter(z => Math.abs(z - y) < .01).length === 2)[0];
    const apexY = ys.find(y => Math.abs(y - flatY) > .01);
    const dir = Math.sign(apexY - flatY), h = Math.abs(apexY - flatY);
    /* The preposition always reads under the word. A down-triangle has
       room for that (flat side on top); an up-triangle moves the word up
       towards the apex and puts the preposition on the wide base. */
    if (dir > 0) { wy = flatY + h * (c.done ? .28 : .3); py = flatY + h * .52; }
    else         { wy = flatY - h * (c.done ? .47 : .3); py = flatY - h * .2; }
  }
  const word = c.it.w;
  const fitted = fit(pts, wy, word, 600, FAMILY_W, vertical ? 15 : 16);
  if (fitted) addText(g, 'w', word, fitted);
  if (c.done) {
    const p = c.it.p === 'Ø' ? 'Ø' : c.it.p;
    const f2 = fit(pts, py, p, 600, FAMILY_P, 13);
    if (f2) addText(g, 'p', p, f2);
  }
}
function fit(pts, y, str, weight, family, max){
  for (let fs = max; fs >= 9; fs -= .5) {
    const r = room(pts, y, fs); if (!r) continue;
    const pad = fs * .7;
    if (textWidth(str, fs, weight, family) <= r.w - 2 * pad) return { x: (r.x1 + r.x2) / 2, y, fs };
  }
  const r = room(pts, y, 9); return r ? { x: (r.x1 + r.x2) / 2, y, fs: 9 } : null;
}
function addText(g, cls, str, f){
  const t = document.createElementNS(NS, 'text');
  t.setAttribute('class', cls); t.setAttribute('x', f.x); t.setAttribute('y', f.y);
  t.setAttribute('text-anchor', 'middle'); t.setAttribute('dominant-baseline', 'central');
  t.setAttribute('font-size', f.fs); t.textContent = str;
  g.appendChild(t);
}

/* ── play ─────────────────────────────────────────────────────────────── */
function loadSet(k){
  SET = k; SEL = -1; MISS = 0; MISSED = [];
  CELLS = shuffle(DATA.sets[k].items).map(it => ({ it, done: false, tried: [] }));
  $('setName').textContent = 'Set ' + (k + 1) + ' · ' + DATA.sets[k].title;
  $('nAll').textContent = CELLS.length;
  tabs(); count(); draw(); pick(0, true);
  try { const u = new URL(location.href); u.searchParams.set('set', k + 1); history.replaceState(null, '', u); } catch(e){}
}
function tabs(){
  const best = store.get();
  $('sets').innerHTML = DATA.sets.map((s, i) =>
    `<button class="vtab${i === SET ? ' active' : ''}" role="tab" aria-selected="${i === SET}" data-k="${i}" title="${esc(s.title)}${best[i] != null ? ' · best ' + best[i] + '/18' : ''}">${i + 1}</button>`).join('');
  $('sets').querySelectorAll('button').forEach(b => b.onclick = () => loadSet(+b.dataset.k));
}
function count(){
  $('nDone').textContent = CELLS.filter(c => c.done).length;
  $('nMiss').textContent = MISS;
}
function pick(i, quiet){
  if (!CELLS[i] || CELLS[i].done) return;
  SEL = i; draw(); tray();
  if (!quiet && upright()) {
    const g = $('band').querySelectorAll('.tri')[i];
    const r = g && g.getBoundingClientRect(), trayTop = $('tray').getBoundingClientRect().top;
    const top = document.querySelector('.header').getBoundingClientRect().bottom;
    if (r && (r.bottom > trayTop - 8 || r.top < top + 8)) window.scrollBy({ top: r.top - (trayTop - r.height) / 2, behavior: 'smooth' });
  }
}
function sentence(it, filled){
  const [a, b] = it.s.split('___');
  const none = it.p === 'Ø';
  const gap = filled
    ? `<span class="gap ok${none ? ' none' : ''}">${none ? '—' : esc(it.p)}</span>`
    : '<span class="gap">&nbsp;</span>';
  return esc(a) + gap + esc(b);
}
function tray(){
  const c = CELLS[SEL];
  if (!c) return;
  $('say').innerHTML = sentence(c.it, false);
  $('opts').innerHTML = DATA.options.map(o =>
    `<button class="opt${c.tried.includes(o) ? ' no' : ''}" data-o="${esc(o)}" ${c.tried.includes(o) ? 'disabled' : ''} aria-label="${o === 'Ø' ? 'no preposition' : o}">${esc(o)}</button>`).join('');
  $('opts').querySelectorAll('.opt').forEach(b => b.onclick = () => answer(b.dataset.o, b));
}
function answer(o, btn){
  const c = CELLS[SEL]; if (!c || c.done) return;
  const ok = o === c.it.p || (c.it.alt || []).includes(o);
  if (ok) {
    c.done = true; btn.classList.add('yes');
    $('say').innerHTML = sentence(c.it, true);
    count();
    const g = $('band').querySelectorAll('.tri')[SEL];
    setTimeout(() => {
      draw();
      const next = nextOpen(SEL);
      if (next < 0) return finish();
      setTimeout(() => pick(next), 450);
    }, 380);
  } else {
    MISS++; c.tried.push(o);
    if (!MISSED.includes(c)) MISSED.push(c);
    btn.classList.add('no'); btn.disabled = true; count();
    const g = $('band').querySelectorAll('.tri')[SEL];
    if (g) { g.classList.add('flash'); setTimeout(() => g.classList.remove('flash'), 420); }
  }
}
function nextOpen(from){
  for (let k = 1; k <= CELLS.length; k++) { const j = (from + k) % CELLS.length; if (!CELLS[j].done) return j; }
  return -1;
}
function finish(){
  SEL = -1; draw();
  const right = CELLS.length - MISSED.length;
  const best = store.get(); if (best[SET] == null || right > best[SET]) { best[SET] = right; store.put(best); }
  const more = SET + 1 < DATA.sets.length;
  $('say').innerHTML = '';
  $('opts').innerHTML = `<div class="done-card">
    <div class="big">${right}/${CELLS.length} first time</div>
    <p class="sub">${MISS ? MISS + (MISS === 1 ? ' mistake' : ' mistakes') + ' — these are worth saying aloud:' : 'No mistakes. Every preposition first time.'}</p>
    ${MISSED.length ? '<div class="review">' + MISSED.map(c => `<span>${esc(c.it.w)} <b>${c.it.p === 'Ø' ? 'Ø' : esc(c.it.p)}</b></span>`).join('') + '</div>' : ''}
    <div class="endgo"><button type="button" id="again">Again</button>${more ? `<button type="button" class="primary" id="next">Set ${SET + 2} →</button>` : ''}</div></div>`;
  $('again').onclick = () => loadSet(SET);
  if (more) $('next').onclick = () => { loadSet(SET + 1); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  tabs();
}

let rT; window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(draw, 120); });

fetch('/data/similar-words/prepositions.json', { cache: 'no-store' })
  .then(r => r.json())
  .then(d => {
    DATA = d;
    const want = parseInt(new URLSearchParams(location.search).get('set'), 10);
    const start = want >= 1 && want <= d.sets.length ? want - 1 : 0;
    (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => loadSet(start));
  })
  .catch(() => { $('say').textContent = 'The words did not load. Please refresh.'; });

if (new URLSearchParams(location.search).get('test')) window.PREP_TEST = {
  cells: () => CELLS.map(c => ({ w: c.it.w, p: c.it.p, done: c.done })),
  sel: () => SEL,
  answer: o => { const b = [...document.querySelectorAll('.opt')].find(x => x.dataset.o === o); if (b) b.click(); }
};
})();
</script>
</body>
</html>
