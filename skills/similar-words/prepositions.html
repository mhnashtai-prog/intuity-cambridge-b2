<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F3F1ED">
  <title>Be2FIRST — Prepositions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..900&family=Geist+Mono:wght@400..600&family=Space+Grotesk:wght@700&family=Anton&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=20261012">
  <link rel="stylesheet" href="/tools/intuity-pills.css?v=20261012">
  <script src="/tools/be2-brand.js?v=20261012c"></script>
<style>
/* ═══ PREPOSITIONS — the honeycomb ═══════════════════════════════════════
   Eighteen hexagonal cells in the house style of the Board and the Game
   rings: a black core, a sage rim, cream lettering; caramel marks the cell
   in play, clay a mistake. A hexagon is widest across its middle, which is
   where a word sits, so "congratulate" fits a phone cell at a size a class
   can read — the reason it replaced the triangle.

     ≥ 1000px  two rows of nine   (the 9 + 9 of the paper version)
     ≥ 700px   three rows of six
     phone     six rows of three

   Tap a cell → the prepositions and its sentence come up in the tray →
   choose. Right: the preposition is stamped under the word, sage if first
   time, clay if it took more than one go.                                */
:root{
  --ring-sage:#8AA79C; --ring-core:#201E1C; --ring-ink:#E5D1B8;
  --caramel:#C2956E; --caramel-ink:#8A6440; --clay:#B4653A;
}
body{min-height:100dvh}
.wrap{max-width:74rem;margin:0 auto;padding:0 var(--gutter) 15rem}   /* wide enough for nine across */
.strip{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;
  max-width:var(--w-read);margin:.8rem auto .4rem;padding:0 .25rem;
  font-family:var(--f-mono);font-size:.6875rem;letter-spacing:var(--track-label);
  text-transform:uppercase;color:var(--faint)}
.strip b{color:var(--ink);font-weight:600}
.strip .miss b{color:var(--clay)}

.comb{display:block;margin:0 auto;overflow:visible;touch-action:manipulation;
  user-select:none;-webkit-user-select:none}
.cell{cursor:pointer;outline:none}
.cell .rim{fill:var(--ring-core);stroke:var(--ring-sage);stroke-linejoin:round;
  transition:stroke .25s ease;filter:drop-shadow(0 6px 9px rgba(35,44,49,.18))}
.cell.sel .rim{stroke:var(--caramel)}
.cell.flash .rim{stroke:var(--clay)}
@media(hover:hover){ .cell:not(.done):not(.sel):hover .rim{stroke:color-mix(in srgb,var(--caramel) 55%,var(--ring-sage))} }
.cell:focus-visible .rim{stroke:var(--caramel)}
.cell .w{font-family:var(--f-display);font-weight:600;fill:var(--ring-ink);letter-spacing:.005em}
.cell.done .w{opacity:.78}
.cell .p{font-family:var(--f-mono);font-weight:600;fill:var(--ring-sage);letter-spacing:.06em}
.cell .p.late{fill:var(--clay)}

/* ── the tray: the prepositions first, then the sentence ─────────────── */
.tray{position:fixed;left:0;right:0;bottom:0;z-index:20;
  padding:.7rem var(--gutter) calc(.75rem + env(safe-area-inset-bottom));
  background:var(--card);box-shadow:0 -10px 30px -18px rgba(35,44,49,.35)}
.tray-in{max-width:var(--w-read);margin:0 auto}
.opts{display:flex;flex-wrap:wrap;justify-content:center;gap:.35rem;margin:0 0 .6rem}
/* Their own class, not .opt: intuity-pills.css restyles every .opt on the
   site as a grey capsule, and these are the ring's black. */
.tray .pp{font-family:var(--f-mono)!important;font-size:.875rem;font-weight:500;letter-spacing:.02em;
  min-width:3.2rem;padding:.5rem .7rem!important;border:none!important;border-radius:var(--r-tab)!important;
  background:var(--ring-core)!important;color:var(--ring-ink)!important;cursor:pointer;box-shadow:none!important;
  transition:background .15s,color .15s,transform .1s}
.tray .pp:active{transform:scale(.96)}
@media(hover:hover){ .tray .pp:hover:not(:disabled){background:var(--caramel-ink)!important;color:#FEFCF9!important} }
.tray .pp.no{background:none!important;color:var(--clay)!important;text-decoration:line-through;cursor:default;
  box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--clay) 35%,transparent)!important}
.tray .pp.yes{background:var(--ring-sage)!important;color:var(--ring-core)!important}
.say{font-family:var(--f-body);font-size:1.0625rem;line-height:1.45;color:var(--ink);
  margin:0;text-align:center;text-wrap:balance;min-height:1.5em}
.say .gap{display:inline-block;min-width:3em;border-bottom:2px solid var(--caramel);
  color:var(--caramel-ink);font-weight:600;text-align:center;padding:0 .15em}
.say .gap.ok{border-color:var(--ring-sage);color:#4A6B5C}
.say .gap.none{min-width:1.4em}

/* ── the end of a set ────────────────────────────────────────────────── */
.done-card{text-align:center}
.done-card .big{font-family:var(--f-display);font-weight:800;font-size:1.5rem;
  letter-spacing:var(--track-display);color:var(--ink);margin:.1rem 0 .15rem}
.done-card .sub{font-size:.9375rem;color:var(--faint);margin:0 0 .6rem}
.done-card .review{display:flex;flex-wrap:wrap;justify-content:center;gap:.3rem .9rem;
  font-size:.9375rem;margin:0 0 .8rem;color:var(--paper)}
.done-card .review b{color:var(--clay);font-weight:600}
.endgo{display:flex;gap:.5rem;justify-content:center;background:none!important;padding:0!important}
.endgo button{font-family:var(--f-display);font-weight:700;font-size:.8125rem;letter-spacing:.06em;
  text-transform:uppercase;border:none;border-radius:var(--r-tab);padding:.7rem 1.2rem;cursor:pointer;
  background:color-mix(in srgb,var(--ink) 7%,var(--card));color:var(--ink)}
.endgo button.primary{background:var(--ring-core);color:var(--ring-ink)}

@media (min-width:700px){
  .say{font-size:1.1875rem}
  .wrap{padding-bottom:2rem}
  /* The comb is short on a wide screen: the tray follows it rather than
     floating at the foot of an empty page. */
  .tray{position:static;background:none;box-shadow:none;padding-top:1.6rem}
  .tray-in{max-width:var(--w-sheet)}
}
</style>
</head>
<body>
<header class="header header--flow">
  <div class="header-top">
    <a class="back-link" href="/index.html?openModal=vocabulary" target="_top">← Vocabulary</a>
    <div class="header-title">
      <div class="app-title">INTUITY</div>
      <div class="app-subtitle">Prepositions</div>
    </div>
    <span class="header-spacer">Level <b>B2</b></span>
  </div>
  <div class="set-tabs" id="sets" role="tablist" aria-label="Set"></div>
</header>

<main class="wrap">
  <div class="strip" aria-live="polite">
    <span id="setName"></span>
    <span><b id="nDone">0</b>/<span id="nAll">18</span> · <span class="miss"><b id="nMiss">0</b> mistakes</span></span>
  </div>
  <svg class="comb" id="comb" role="group" aria-label="Eighteen words"></svg>
</main>

<div class="tray" id="tray"><div class="tray-in">
  <div class="opts" id="opts"></div>
  <p class="say" id="say"></p>
</div></div>

<script>
(function(){
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const R3 = Math.sqrt(3);
const KEY = 'be2.prepositions.v2';
let DATA = null, SET = 0, CELLS = [], SEL = -1, MISS = 0, MISSED = [];

const store = {
  get(){ try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){ return {}; } },
  put(v){ try { localStorage.setItem(KEY, JSON.stringify(v)); } catch(e){} }
};
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ── the honeycomb ──────────────────────────────────────────────────────
   Pointy-top hexagons of radius r, width w = √3·r. Rows sit 1.5·r apart
   and every second row is pushed half a cell right, so the cells nest. */
function columns(){
  const W = document.documentElement.clientWidth;
  return W >= 1000 ? 9 : W >= 700 ? 6 : 3;
}
function layout(){
  const C = columns(), rows = Math.ceil(18 / C), gap = C === 3 ? 7 : 9;
  const avail = $('comb').parentElement.clientWidth - 2 * 16;   // the column it sits in
  const pitch = Math.min(C === 3 ? 124 : 132, avail / (C + .5));   // centre to centre, across
  const w = pitch - gap, r = w / R3, dy = 1.5 * r + gap * R3 / 2;
  const cells = [];
  for (let k = 0; k < 18; k++) {
    const row = Math.floor(k / C), col = k % C;
    cells.push({ cx: w / 2 + col * pitch + (row % 2 ? pitch / 2 : 0), cy: r + row * dy });
  }
  return { r, w, cells, width: C * pitch - gap + pitch / 2, height: 2 * r + (rows - 1) * dy };
}
const hexPts = (cx, cy, r) => [0,1,2,3,4,5].map(i => {
  const a = Math.PI / 180 * (60 * i - 90);
  return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
});

let MEASURE = null;
function textWidth(str, fs, weight, family){
  MEASURE = MEASURE || document.createElement('canvas').getContext('2d');
  MEASURE.font = weight + ' ' + fs + 'px ' + family;
  return MEASURE.measureText(str).width;
}
/* Largest size up to max at which str fits width; never below 9px. */
function fitSize(str, width, weight, family, max){
  for (let fs = max; fs > 9; fs -= .5) if (textWidth(str, fs, weight, family) <= width) return fs;
  return 9;
}
const FAMILY_W = "Geist, system-ui, sans-serif", FAMILY_P = "'Geist Mono', ui-monospace, monospace";

function draw(){
  const svg = $('comb'), L = layout();
  const rim = Math.max(5, L.r * .11);
  svg.setAttribute('viewBox', `-6 -6 ${L.width + 12} ${L.height + 18}`);
  svg.setAttribute('width', L.width + 12); svg.setAttribute('height', L.height + 18);
  svg.innerHTML = '';
  /* text room: the core between the two vertical sides, less the rim */
  const room = L.w - rim * 2 - L.r * .22;
  const maxW = L.r > 62 ? 17 : 14.5;
  L.cells.forEach((p, i) => {
    const c = CELLS[i]; if (!c) return;
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'cell' + (c.done ? ' done' : '') + (i === SEL ? ' sel' : ''));
    g.setAttribute('role', 'button'); g.setAttribute('tabindex', '0');
    g.setAttribute('aria-label', c.it.w + (c.done ? ' ' + c.it.p : ''));
    const hex = document.createElementNS(NS, 'polygon');
    hex.setAttribute('class', 'rim');
    hex.setAttribute('points', hexPts(p.cx, p.cy, L.r - rim / 2).map(q => q.map(v => v.toFixed(2)).join(',')).join(' '));
    hex.setAttribute('stroke-width', rim);
    g.appendChild(hex);
    const fw = fitSize(c.it.w, room, 600, FAMILY_W, maxW);
    text(g, 'w', c.it.w, p.cx, c.done ? p.cy - L.r * .15 : p.cy, fw);
    if (c.done) text(g, 'p' + (c.late ? ' late' : ''), c.it.p, p.cx, p.cy + L.r * .25, Math.min(fw, maxW - 1.5));
    g.addEventListener('click', () => pick(i));
    g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(i); } });
    svg.appendChild(g);
  });
}
function text(g, cls, str, x, y, fs){
  const t = document.createElementNS(NS, 'text');
  t.setAttribute('class', cls); t.setAttribute('x', x); t.setAttribute('y', y);
  t.setAttribute('text-anchor', 'middle'); t.setAttribute('dominant-baseline', 'central');
  t.setAttribute('font-size', fs); t.textContent = str;
  g.appendChild(t);
}

/* ── play ─────────────────────────────────────────────────────────────── */
function loadSet(k){
  SET = k; SEL = -1; MISS = 0; MISSED = [];
  CELLS = shuffle(DATA.sets[k].items).map(it => ({ it, done: false, late: false, tried: [] }));
  $('setName').textContent = 'Set ' + (k + 1) + ' · ' + DATA.sets[k].title;
  $('nAll').textContent = CELLS.length;
  tabs(); count(); draw(); pick(0, true);
  try { const u = new URL(location.href); u.searchParams.set('set', k + 1); history.replaceState(null, '', u); } catch(e){}
}
function tabs(){
  const best = store.get();
  $('sets').innerHTML = DATA.sets.map((s, i) =>
    `<button class="vtab${i === SET ? ' active' : ''}" role="tab" aria-selected="${i === SET}" data-k="${i}" title="${esc(s.title)}${best[i] != null ? ' · best ' + best[i] + '/18' : ''}">${i + 1}</button>`).join('');
  $('sets').querySelectorAll('button').forEach(b => b.onclick = () => loadSet(+b.dataset.k));
}
function count(){
  $('nDone').textContent = CELLS.filter(c => c.done).length;
  $('nMiss').textContent = MISS;
}
function pick(i, quiet){
  if (!CELLS[i] || CELLS[i].done) return;
  SEL = i; draw(); tray();
  if (!quiet && document.documentElement.clientWidth < 700) {
    const g = $('comb').querySelectorAll('.cell')[i];
    const r = g && g.getBoundingClientRect(), trayTop = $('tray').getBoundingClientRect().top;
    const top = document.querySelector('.header').getBoundingClientRect().bottom;
    if (r && (r.bottom > trayTop - 10 || r.top < top + 10)) window.scrollBy({ top: r.top - (top + trayTop - r.height) / 2, behavior: 'smooth' });
  }
}
function sentence(it, filled){
  const [a, b] = it.s.split('___'), none = it.p === 'Ø';
  const gap = filled
    ? `<span class="gap ok${none ? ' none' : ''}">${none ? '—' : esc(it.p)}</span>`
    : '<span class="gap">&nbsp;</span>';
  return esc(a) + gap + esc(b);
}
function tray(){
  const c = CELLS[SEL]; if (!c) return;
  $('opts').innerHTML = DATA.options.map(o =>
    `<button class="pp${c.tried.includes(o) ? ' no' : ''}" data-o="${esc(o)}" ${c.tried.includes(o) ? 'disabled' : ''} aria-label="${o === 'Ø' ? 'no preposition' : o}">${esc(o)}</button>`).join('');
  $('opts').querySelectorAll('.pp').forEach(b => b.onclick = () => answer(b.dataset.o, b));
  $('say').innerHTML = sentence(c.it, false);
}
function answer(o, btn){
  const c = CELLS[SEL]; if (!c || c.done) return;
  const ok = o === c.it.p || (c.it.alt || []).includes(o);
  if (ok) {
    c.done = true; c.late = c.tried.length > 0;
    btn.classList.add('yes');
    $('say').innerHTML = sentence(c.it, true);
    count();
    setTimeout(() => {
      draw();
      const next = nextOpen(SEL);
      if (next < 0) return finish();
      setTimeout(() => pick(next), 420);
    }, 360);
  } else {
    MISS++; c.tried.push(o);
    if (!MISSED.includes(c)) MISSED.push(c);
    btn.classList.add('no'); btn.disabled = true; count();
    const g = $('comb').querySelectorAll('.cell')[SEL];
    if (g) { g.classList.add('flash'); setTimeout(() => g.classList.remove('flash'), 420); }
  }
}
function nextOpen(from){
  for (let k = 1; k <= CELLS.length; k++) { const j = (from + k) % CELLS.length; if (!CELLS[j].done) return j; }
  return -1;
}
function finish(){
  SEL = -1; draw();
  const right = CELLS.length - MISSED.length;
  const best = store.get(); if (best[SET] == null || right > best[SET]) { best[SET] = right; store.put(best); }
  const more = SET + 1 < DATA.sets.length;
  $('say').innerHTML = '';
  $('opts').innerHTML = `<div class="done-card">
    <div class="big">${right}/${CELLS.length} first time</div>
    <p class="sub">${MISS ? MISS + (MISS === 1 ? ' mistake' : ' mistakes') + ' — say these aloud:' : 'No mistakes. Every preposition first time.'}</p>
    ${MISSED.length ? '<div class="review">' + MISSED.map(c => `<span>${esc(c.it.w)} <b>${esc(c.it.p)}</b></span>`).join('') + '</div>' : ''}
    <div class="endgo"><button type="button" id="again">Again</button>${more ? `<button type="button" class="primary" id="next">Set ${SET + 2} →</button>` : ''}</div></div>`;
  $('again').onclick = () => loadSet(SET);
  if (more) $('next').onclick = () => { loadSet(SET + 1); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  tabs();
}

let rT; window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(draw, 120); });

fetch('/data/similar-words/prepositions.json', { cache: 'no-store' })
  .then(r => r.json())
  .then(d => {
    DATA = d;
    const want = parseInt(new URLSearchParams(location.search).get('set'), 10);
    const start = want >= 1 && want <= d.sets.length ? want - 1 : 0;
    (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => loadSet(start));
  })
  .catch(() => { $('say').textContent = 'The words did not load. Please refresh.'; });

if (new URLSearchParams(location.search).get('test')) window.PREP_TEST = {
  cells: () => CELLS.map(c => ({ w: c.it.w, p: c.it.p, done: c.done })),
  sel: () => SEL,
  answer: o => { const b = [...document.querySelectorAll('.pp')].find(x => x.dataset.o === o); if (b) b.click(); }
};
})();
</script>
</body>
</html>
