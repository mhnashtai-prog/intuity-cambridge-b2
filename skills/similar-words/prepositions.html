<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F3F1ED">
  <title>Be2FIRST — Prepositions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..900&family=Geist+Mono:wght@400..600&family=Space+Grotesk:wght@700&family=Anton&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=20261012">
  <link rel="stylesheet" href="/tools/intuity-pills.css?v=20261012">
  <script src="/tools/be2-brand.js?v=20261012c"></script>
<style>
/* ═══ PREPOSITIONS — the honeycomb (octagons: ?shape=oct) ═══════════════════════════════════════
   Twenty-seven hexagonal cells in the house style of the Board and the
   Game rings: a black core, a sage rim, cream lettering. Under each word
   sits a compact pill of dots — the space to fill.

   Tap a cell: it lifts, its rim turns caramel, and the student TYPES the
   preposition into the pill (0 for none). Typing, not choosing: recall
   is what the exam asks for in Part 2 and Part 4.
   Right → the pill keeps the answer in sage, the cell settles, the next
   one lifts. Wrong → the cell shakes, the rim flashes clay, try again;
   after three tries the answer is shown in clay and the cell closes.

     ≥ 1000px  three rows of nine
     ≥ 700px   rows of six
     phone     rows of three                                              */
:root{
  --ring-sage:#8AA79C; --ring-core:#201E1C; --ring-ink:#E5D1B8;
  --caramel:#C2956E; --caramel-ink:#8A6440; --clay:#B4653A;
}
body{min-height:100dvh}
.wrap{max-width:74rem;margin:0 auto;padding:0 var(--gutter) 4rem}
.strip{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;
  max-width:var(--w-read);margin:.8rem auto .15rem;padding:0 .25rem;
  font-family:var(--f-mono);font-size:.6875rem;letter-spacing:var(--track-label);
  text-transform:uppercase;color:var(--faint)}
.strip b{color:var(--ink);font-weight:600}
.strip .miss b{color:var(--clay)}
.how{max-width:var(--w-read);margin:.35rem auto 1.1rem;padding:0 .25rem;text-align:center;
  font-size:.875rem;color:var(--faint)}
.how b{font-family:var(--f-mono);color:var(--ink);font-weight:600}

/* ── the comb ────────────────────────────────────────────────────────── */
.comb{position:relative;margin:0 auto}
/* The Game rings' light: a soft highlight top-left, a shadow bottom-right.
   Hover lifts the cell and deepens both, as on the Game's board. */
.cell{position:absolute;cursor:pointer;
  filter:drop-shadow(-3px -3px 5px rgba(255,255,255,.8)) drop-shadow(5px 6px 8px rgba(43,33,41,.2));
  transition:transform .22s cubic-bezier(.2,.8,.3,1.2),filter .22s ease;
  -webkit-tap-highlight-color:transparent}
.pz-hex{position:absolute;inset:0;
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.pz-rim{background:var(--ring-sage);transition:background .25s ease}
.pz-core{background:var(--ring-core)}
.pz-face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.42em}
.pz-face.oct{gap:.3em}
.pz-word{font-family:var(--f-display);font-weight:600;color:var(--ring-ink);
  white-space:nowrap;line-height:1;letter-spacing:.005em}

/* the space to fill: a compact capsule of dots */
/* As small as a pill can be and still take a thumb and three letters:
   it reads as a mark under the word, not a field. */
/* The field is 16px inside (an iPhone zooms the whole page into any
   smaller input) and scaled down by --k to its drawn size; the negative
   margins hand back the room the scaling frees. It grows with what is
   typed (--n letters), so "against" or "between" shows whole. */
.pz-slot{display:block;box-sizing:border-box;border:none;outline:none;
  font-size:16px!important;transform:scale(var(--k,.72));
  margin:calc((var(--k,.72) - 1) * .65em) 0;
  height:1.3em;width:calc(max(3.3em, (var(--n, 0) + 1.5) * .64em));padding:0 .3em;border-radius:999px;
  transition:background .2s,box-shadow .2s,color .2s,width .15s ease;
  font:600 1em/1 var(--f-mono);letter-spacing:.04em;text-align:center;
  color:var(--ring-ink);background:rgba(229,209,184,.13);
  caret-color:var(--caramel);-webkit-appearance:none;appearance:none}
/* the green tick of a right answer, at the top of the cell */
.pz-tick{position:absolute;left:50%;top:10%;width:var(--t,16px);height:var(--t,16px);margin-left:calc(var(--t,16px) / -2);
  overflow:visible;pointer-events:none}
.pz-tick path{fill:none;stroke:#8FC79A;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.pz-tick.pop{animation:tickPop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes tickPop{0%{transform:scale(.2);opacity:0}60%{opacity:1}100%{transform:scale(1)}}
.pz-slot::placeholder{color:rgba(229,209,184,.5);letter-spacing:.08em}
.pz-slot[readonly]{cursor:pointer}

@media(hover:hover){ .cell:not(.done):not(.sel):hover{transform:translateY(-5px);
  filter:drop-shadow(-4px -4px 7px rgba(255,255,255,.95)) drop-shadow(7px 10px 13px rgba(43,33,41,.26))} }
.cell:not(.done):not(.sel):active{transform:translateY(-2px)}
/* in play: it lifts */
.cell.sel{z-index:3;transform:translateY(-7px) scale(1.06);
  filter:drop-shadow(0 16px 16px rgba(35,44,49,.30))}
.cell.sel .pz-rim{background:var(--caramel)}
.cell.sel .pz-slot{background:rgba(229,209,184,.22);box-shadow:inset 0 0 0 1.5px var(--caramel)}
.cell.wrong .pz-rim{background:var(--clay)}
.cell.wrong .pz-slot{color:#F0B894}
.cell.shake{animation:shake .38s ease}
@keyframes shake{20%{translate:-5px 0}45%{translate:5px 0}70%{translate:-3px 0}90%{translate:2px 0}}
.cell.done{cursor:default}
.cell.done .pz-word{opacity:.8}
.cell.done .pz-slot{background:rgba(138,167,156,.16);color:var(--ring-sage)}
.cell.done.late .pz-slot{background:rgba(180,101,58,.16);color:#D9875A}

/* ── celebration, as on the Board ────────────────────────────────────
   A small burst of glitter from the answer: sixteen flecks first time,
   nine on a later try. Sound follows the site-wide mute; the glitter
   follows reduced motion. */
.glitter{position:fixed;left:0;top:0;width:0;height:0;pointer-events:none;z-index:40}
.glitter i{position:absolute;left:0;top:0;width:var(--s);height:var(--s);margin:calc(var(--s) / -2) 0 0 calc(var(--s) / -2);background:var(--c);
  border-radius:var(--r);opacity:0;animation:glit var(--d) cubic-bezier(.15,.7,.3,1) var(--w) forwards}
@keyframes glit{0%{opacity:0;transform:translate(0,0) rotate(0) scale(.4)}15%{opacity:1}
  100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--rot)) scale(1)}}
.pz-slot.pop{animation:slotPop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes slotPop{0%{transform:scale(calc(var(--k,.72) * .4))}100%{transform:scale(var(--k,.72))}}
.mute{border:none;background:none;cursor:pointer;font-size:.9rem;line-height:1;padding:0 .35rem 0 0;vertical-align:-1px}
.mute.off{opacity:.32;filter:grayscale(1)}
.vtab .mark{margin-left:.2em;color:var(--caramel)}

/* ── the result: the Board's card ─────────────────────────────────────── */
.scrim{position:fixed;inset:0;z-index:900;display:flex;align-items:center;justify-content:center;padding:1rem;
  background:rgba(20,17,14,.34);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;transition:opacity .25s}
.scrim[hidden]{display:none}
.scrim.on{opacity:1}
.focus{position:relative;width:min(var(--w-focus,35rem),100%);max-height:90vh;overflow-y:auto;background:var(--card);
  box-shadow:0 24px 60px -18px rgba(20,17,14,.38),0 6px 16px rgba(20,17,14,.14);padding:1.6rem 1.5rem 1.4rem;
  transform:translateY(24px) scale(.97);transition:transform .45s cubic-bezier(.2,1.3,.4,1)}
.scrim.on .focus{transform:none}
.focus .x{position:absolute;top:.8rem;right:.9rem;border:none;background:none;font-size:1rem;color:var(--faint);cursor:pointer;padding:.4rem}
.kick{display:flex;align-items:center;gap:9px;font-family:var(--f-mono);font-size:.6875rem;letter-spacing:.24em;text-transform:uppercase;color:var(--caramel-ink)}
.kick::before{content:'';display:block;width:26px;height:10px;flex:none;background:var(--caramel)}
.focus h2{font-family:'Anton', Impact, var(--f-display), sans-serif;font-weight:400;font-size:clamp(1.6rem,6vw,2.1rem);line-height:1.02;color:var(--ink);margin:.45rem 0 .2rem}
.focus h2::after{content:'';display:block;width:40px;height:3px;background:var(--ink);margin:.65rem 0 0}
.big{font-family:'Anton', Impact, var(--f-display), sans-serif;font-size:3.2rem;line-height:1;color:var(--ink);margin:.8rem 0 .2rem}
.grade{font-family:var(--f-display);font-size:.92rem;color:var(--caramel-ink)}
.cup{display:block;width:92px;height:92px;margin:.6rem 0 .2rem}
.cup .rim{fill:none;stroke:var(--caramel);stroke-width:5}
.review{list-style:none;margin:1rem 0 0;padding:0;border-top:1px solid color-mix(in srgb,var(--ink) 10%,transparent)}
.review li{display:flex;justify-content:space-between;gap:1rem;padding:.5rem 0;font-size:.95rem;
  border-bottom:1px solid color-mix(in srgb,var(--ink) 10%,transparent)}
.review li b{color:#4A6B5C;font-family:var(--f-mono);font-weight:600}
.review li span{color:var(--faint);font-size:.85rem}
.review li span.w{color:var(--ink);font-size:.95rem}
.review-h{margin:1rem 0 0;font-size:.92rem;color:var(--paper)}
.cta{display:flex;gap:.5rem;margin-top:1.1rem;flex-wrap:wrap}
.cta button{font-family:var(--f-display);font-weight:700;font-size:.8125rem;letter-spacing:.06em;
  text-transform:uppercase;border:none;border-radius:var(--r-tab);padding:.75rem 1.25rem;cursor:pointer;
  background:color-mix(in srgb,var(--ink) 7%,var(--card));color:var(--ink)}
.cta button.fill{background:var(--ring-core);color:var(--ring-ink)}
@media (prefers-reduced-motion:reduce){ .glitter{display:none} .pz-slot.pop{animation:none} .pz-tick.pop{animation:none} .scrim,.focus{transition:none} }
@media (prefers-reduced-motion:reduce){ .cell{transition:none} .cell.shake{animation:none} }
</style>
</head>
<body>
<header class="header header--flow">
  <div class="header-top">
    <a class="back-link" href="/index.html?openModal=vocabulary" target="_top">← Vocabulary</a>
    <div class="header-title">
      <div class="app-title">INTUITY</div>
      <div class="app-subtitle">Prepositions</div>
    </div>
    <span class="header-spacer"><button class="mute" id="mute" type="button" aria-label="Sound on" aria-pressed="true">&#128266;</button> Level <b>B2</b></span>
  </div>
  <div class="set-tabs" id="sets" role="tablist" aria-label="Set"></div>
</header>

<main class="wrap">
  <div class="strip" aria-live="polite">
    <span id="setName"></span>
    <span><b id="nDone">0</b>/<span id="nAll">27</span> · <span class="miss"><b id="nMiss">0</b> mistakes</span></span>
  </div>
  <p class="how">Tap a cell and type the preposition. No preposition? Type <b>0</b>.</p>
  <div class="comb" id="comb" role="group" aria-label="Words"></div>
</main>
<div class="scrim" id="scrim" hidden><div class="focus" id="focus" role="dialog" aria-modal="true" aria-labelledby="fTitle"></div></div>
<!-- one sound engine and one mute for every INTUITY page -->
<script src="/skills/grammar-rules/intuity-sound.js?v=2"></script>

<script>
(function(){
const $ = id => document.getElementById(id);
const R3 = Math.sqrt(3);
const KEY = 'be2.prepositions.v4';
const NONE = ['0', 'ø', '-', '–', '—', 'none', 'no', 'nothing', 'x', 'zero', 'no preposition'];
let DATA = null, SET = 0, CELLS = [], SEL = -1, MISS = 0, MISSED = [], ACCEPT = {}, T0 = 0, PENDING = null;

const store = {
  get(){ try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){ return {}; } },
  put(v){ try { localStorage.setItem(KEY, JSON.stringify(v)); } catch(e){} }
};
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* Without a sentence, "complain" is right with "about" and with "to". So
   a word accepts every preposition the data gives it anywhere in its own
   kind (verb, adjective, noun) — "lack" the verb takes none, "lack" the
   noun takes "of", and the two never mix. */
function buildAccept(){
  ACCEPT = {};
  DATA.sets.forEach(s => s.items.forEach(it => {
    const k = s.kind + ':' + it.w;
    (ACCEPT[k] = ACCEPT[k] || new Set()).add(it.p);
    (it.alt || []).forEach(a => ACCEPT[k].add(a));
  }));
}
function norm(v){
  const t = String(v || '').toLowerCase().replace(/[.,!?]/g, '').trim().replace(/\s+/g, ' ');
  return NONE.includes(t) ? 'Ø' : t;
}
const shown = p => p === 'Ø' ? 'Ø' : p;

/* ── geometry ─────────────────────────────────────────────────────────
   Default: the honeycomb — pointy-top hexagons, every second row pushed
   half a cell so the rows nest. ?shape=oct gives low octagons in a
   straight grid (0.6 as tall as wide, ~17% less height on a phone).
   A short last row is centred either way. */
const SHAPE = new URLSearchParams(location.search).get('shape') === 'oct' ? 'oct' : 'hex';
function columns(){
  const W = document.documentElement.clientWidth;
  return W >= 1000 ? 9 : W >= 700 ? 6 : 3;
}
function layout(n){
  const C = columns(), rows = Math.ceil(n / C), gap = C === 3 ? 8 : 10;
  const avail = $('comb').parentElement.clientWidth - 32;
  const pos = [];
  if (SHAPE === 'oct') {
    const pitch = Math.min(C === 3 ? 130 : 140, (avail + gap) / C);
    const w = pitch - gap, h = Math.round(w * .6), dy = h + gap;
    for (let k = 0; k < n; k++) {
      const row = Math.floor(k / C), col = k % C, inRow = Math.min(C, n - row * C);
      pos.push({ x: col * pitch + (C - inRow) * pitch / 2, y: row * dy });
    }
    return { w, h, big: w > 118, pos, width: C * pitch - gap, height: rows * dy - gap };
  }
  const pitch = Math.min(C === 3 ? 124 : 132, avail / (C + .5));
  const w = pitch - gap, r = w / R3, dy = 1.5 * r + gap * R3 / 2;
  for (let k = 0; k < n; k++) {
    const row = Math.floor(k / C), col = k % C, inRow = Math.min(C, n - row * C);
    pos.push({ x: col * pitch + (row % 2 ? pitch / 2 : 0) + (C - inRow) * pitch / 2, y: row * dy });
  }
  return { w, h: 2 * r, big: r > 62, pos, width: C * pitch - gap + pitch / 2, height: 2 * r + (rows - 1) * dy };
}
/* An octagon in px: corners cut by c; the core is the same shape inset by
   the rim t, its cut shortened so the rim reads even all the way round. */
function octagon(x0, y0, W, H, c){
  const x1 = x0 + W, y1 = y0 + H;
  return `polygon(${[[x0+c,y0],[x1-c,y0],[x1,y0+c],[x1,y1-c],[x1-c,y1],[x0+c,y1],[x0,y1-c],[x0,y0+c]].map(p=>p[0].toFixed(1)+'px '+p[1].toFixed(1)+'px').join(',')})`;
}

let MEASURE = null;
function fits(str, fs){
  MEASURE = MEASURE || document.createElement('canvas').getContext('2d');
  MEASURE.font = '600 ' + fs + 'px Geist, system-ui, sans-serif';
  return MEASURE.measureText(str).width;
}

function draw(){
  const comb = $('comb'), L = layout(CELLS.length);
  const rim = SHAPE === 'oct' ? Math.max(4.5, L.w * .045) : Math.max(5, L.h * .05);
  comb.style.width = L.width + 'px'; comb.style.height = (L.height + 10) + 'px';
  const room = SHAPE === 'oct' ? L.w - 2 * rim - 14 : L.w * .76, maxW = L.big ? 17 : 15;
  const slotFs = L.big ? 12 : 11;
  const cut = L.h * .3, cutIn = Math.max(0, cut - rim * .414);
  const clipRim = SHAPE === 'oct' ? `clip-path:${octagon(0, 0, L.w, L.h, cut)}` : '';
  const clipCore = SHAPE === 'oct' ? `clip-path:${octagon(rim, rim, L.w - 2 * rim, L.h - 2 * rim, cutIn)}` : `inset:${rim}px ${rim * .87}px`;
  comb.innerHTML = '';
  CELLS.forEach((c, i) => {
    const p = L.pos[i];
    const el = document.createElement('div');
    el.className = 'cell' + (c.done ? ' done' : '') + (c.late ? ' late' : '') + (i === SEL ? ' sel' : '') +
      (!c.done && c.lastWrong && norm(c.typed) === c.lastWrong ? ' wrong' : '');
    el.style.cssText = `left:${p.x}px;top:${p.y}px;width:${L.w}px;height:${L.h}px`;
    let fs = maxW; while (fs > 9 && fits(c.it.w, fs) > room) fs -= .5;
    el.innerHTML =
      `<div class="pz-hex pz-rim" style="${clipRim}"></div><div class="pz-hex pz-core" style="${clipCore}"></div>
       <div class="pz-face${SHAPE === 'oct' ? ' oct' : ''}"><span class="pz-word" style="font-size:${fs}px">${esc(c.it.w)}</span>
       <input class="pz-slot" style="--k:${(slotFs / 16).toFixed(3)};--n:${(c.done ? shown(c.it.p) : c.typed || '').length}" type="text" maxlength="12" placeholder="•••"
         aria-label="Preposition after ${esc(c.it.w)}" autocomplete="off" autocapitalize="off"
         autocorrect="off" spellcheck="false" enterkeyhint="next"
         ${c.done || i !== SEL ? 'readonly' : ''} value="${c.done ? esc(shown(c.it.p)) : esc(c.typed || '')}"></div>
       ${c.done && !c.revealed ? `<svg class="pz-tick${c.fresh ? ' pop' : ''}" style="--t:${Math.round(L.w * .15)}px" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10.5l4 4 8-9"/></svg>` : ''}`;
    c.fresh = false;
    /* A tap on another cell is the student moving on: pointerdown notes it
       so the blur below leaves the checking to select(), which checks the
       cell being left and then opens this one. */
    el.addEventListener('pointerdown', () => { PENDING = i; });
    el.addEventListener('click', () => { PENDING = null; if (!c.done && i !== SEL) select(i); });
    const inp = el.querySelector('.pz-slot');
    /* Enter, Tab, or simply leaving the cell all check the answer: a
       student who types and taps the next cell has answered. */
    inp.addEventListener('keydown', e => { if (e.key === 'Enter' || (e.key === 'Tab' && !e.shiftKey)) { e.preventDefault(); check(i, inp.value, true); } });
    inp.addEventListener('input', () => { c.typed = inp.value; inp.style.setProperty('--n', inp.value.length); el.classList.remove('wrong'); });
    inp.addEventListener('blur', () => setTimeout(() => {
      if (PENDING == null && SEL === i && inp.isConnected && document.activeElement !== inp) check(i, inp.value, false);
    }, 0));
    comb.appendChild(el);
  });
}

/* ── play ─────────────────────────────────────────────────────────────── */
function loadSet(k){
  SET = k; SEL = -1; MISS = 0; MISSED = [];
  const s = DATA.sets[k];
  CELLS = shuffle(s.items).map(it => ({ it, kind: s.kind, done: false, late: false, tries: 0, typed: '' }));
  $('setName').textContent = 'Set ' + (k + 1) + ' · ' + s.title;
  $('nAll').textContent = CELLS.length;
  closeCard(); T0 = 0;
  tabs(); count(); draw();
  try { const u = new URL(location.href); u.searchParams.set('set', k + 1); history.replaceState(null, '', u); } catch(e){}
}
function tabs(){
  const best = store.get();   /* {k: {best, mark: 'cup' | 'done'}} — the Board's ★ and ✓ */
  $('sets').innerHTML = DATA.sets.map((s, i) => { const b = best[i] || {};
    return `<button class="vtab${i === SET ? ' active' : ''}" role="tab" aria-selected="${i === SET}" data-k="${i}" title="${esc(s.title)}${b.best != null ? ' · best ' + b.best + '/' + s.items.length : ''}">${i + 1}${b.mark ? `<span class="mark">${b.mark === 'cup' ? '★' : '✓'}</span>` : ''}</button>`; }).join('');
  $('sets').querySelectorAll('button').forEach(b => b.onclick = () => loadSet(+b.dataset.k));
}
function count(){
  $('nDone').textContent = CELLS.filter(c => c.done).length;
  $('nMiss').textContent = MISS;
}
function select(i){
  if (!T0) T0 = Date.now();
  const prev = SEL;
  if (prev >= 0 && prev !== i && CELLS[prev] && !CELLS[prev].done && (CELLS[prev].typed || '').trim()) check(prev, CELLS[prev].typed, false);
  if (CELLS[i].done) return;
  SEL = i; draw();
  const inp = $('comb').children[i].querySelector('.pz-slot');
  inp.focus({ preventScroll: true });
  const len = inp.value.length; try { inp.setSelectionRange(len, len); } catch(e){}
  const r = $('comb').children[i].getBoundingClientRect();
  const top = document.querySelector('.header').getBoundingClientRect().bottom;
  const bottom = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
  if (r.top < top + 8 || r.bottom > bottom - 8) window.scrollBy({ top: r.top - (top + bottom - r.height) / 2, behavior: 'smooth' });
}
/* advance: move on to the next open cell (Enter, Tab) — or stay put,
   because the student has already chosen where to go (tapped elsewhere). */
function check(i, value, advance){
  const c = CELLS[i]; if (!c || c.done) return;
  const v = norm(value); if (!v) return;
  if (v === c.lastWrong) return;          /* the same wrong answer counts once */
  const ok = (ACCEPT[c.kind + ':' + c.it.w] || new Set([c.it.p])).has(v);
  const el = $('comb').children[i], inp = el && el.querySelector('.pz-slot');
  if (ok) {
    c.done = true; c.it = Object.assign({}, c.it, { p: v }); c.late = c.tries > 0; c.fresh = true;
    sfx(c.late ? 'pop' : 'jingle');
    settle(i, true, advance);
  } else {
    c.tries++; MISS++; c.lastWrong = v; sfx('wrong');
    if (!MISSED.includes(c)) MISSED.push(c);
    count();
    if (el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake', 'wrong'); }
    if (c.tries >= 3) { c.done = true; c.late = true; c.revealed = true; if (inp) inp.value = shown(c.it.p); setTimeout(() => settle(i, false, advance), 650); }
    else if (advance && inp) inp.select();
  }
}
function settle(i, won, advance){
  count();
  const next = nextOpen(i);
  if (advance !== false || SEL === i) SEL = -1;
  draw();
  if (won) burst(i, !CELLS[i].late);
  if (next < 0) return setTimeout(finish, 700);
  if (advance !== false) setTimeout(() => select(next), 260);
  else if (SEL >= 0) { const f = $('comb').children[SEL]; const fi = f && f.querySelector('.pz-slot'); if (fi) fi.focus({ preventScroll: true }); }
}
const sfx = name => { try { if (window.SFX && SFX.isOn() && SFX[name]) SFX[name](); } catch(e){} };
function burst(i, first){
  const slot = $('comb').children[i] && $('comb').children[i].querySelector('.pz-slot'); if (!slot) return;
  slot.classList.remove('pop'); void slot.offsetWidth; slot.classList.add('pop');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const b = slot.getBoundingClientRect(), g = document.createElement('div'); g.className = 'glitter';
  g.style.left = (b.left + b.width / 2) + 'px'; g.style.top = (b.top + b.height / 2) + 'px';
  const cols = ['#C2956E', 'var(--ring-ink)', 'var(--ring-sage)', '#F6F1E6', '#E9C98F'], n = first ? 16 : 9;
  for (let k = 0; k < n; k++) {
    const a = Math.PI * 2 * k / n + Math.random() * .5, d = (first ? 30 : 20) + Math.random() * (first ? 26 : 14), s = 2.5 + Math.random() * (first ? 4 : 3);
    const e = document.createElement('i');
    e.style.cssText = `--x:${(Math.cos(a) * d).toFixed(1)}px;--y:${(Math.sin(a) * d - 6).toFixed(1)}px;--s:${s.toFixed(1)}px;` +
      `--c:${cols[k % cols.length]};--r:${k % 3 ? '1px' : '50%'};--rot:${Math.round(Math.random() * 240 - 120)}deg;--d:${650 + Math.round(Math.random() * 250)}ms;--w:${Math.round(Math.random() * 70)}ms`;
    g.appendChild(e);
  }
  document.body.appendChild(g); setTimeout(() => g.remove(), 1100);
}
function nextOpen(from){
  for (let k = 1; k <= CELLS.length; k++) { const j = (from + k) % CELLS.length; if (!CELLS[j].done) return j; }
  return -1;
}
/* ── the result: the Board's card, its grade line and its cup ──────── */
function openCard(html){
  $('focus').innerHTML = '<button class="x" type="button" aria-label="Close" id="fx">✕</button>' + html;
  $('fx').onclick = closeCard;
  const sc = $('scrim'); sc.hidden = false; requestAnimationFrame(() => sc.classList.add('on'));
}
function closeCard(){ const sc = $('scrim'); sc.classList.remove('on'); sc.hidden = true; }
function finish(){
  const n = CELLS.length, right = n - MISSED.length, pct = Math.round(right / n * 100);
  const secs = T0 ? Math.round((Date.now() - T0) / 1000) : 0, t = Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0');
  const clean = right === n;
  const all = store.get(), prev = all[SET] || {};
  all[SET] = { best: Math.max(prev.best || 0, right), mark: prev.mark === 'cup' || clean ? 'cup' : 'done' };
  store.put(all);
  sfx(clean ? 'fanfare' : 'bowlLow');
  /* the Board's words, not Cambridge's grade names */
  const grade = pct >= 90 ? 'Exam-ready' : pct >= 75 ? 'Nearly there' : pct >= 60 ? 'Getting there' : 'Not yet — keep practising';
  const CUP = `<svg class="cup" viewBox="0 0 92 92" aria-hidden="true"><circle cx="46" cy="46" r="43" fill="var(--ring-core)"/><circle class="rim" cx="46" cy="46" r="40"/>
    <path d="M31 27h30v9c0 9-6.5 16-15 16s-15-7-15-16z M31 31h-7c0 8 4 12 9 12 M61 31h7c0 8-4 12-9 12 M46 52v9 M36 66h20" fill="none" stroke="#E9C98F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  const more = SET + 1 < DATA.sets.length;
  openCard(`<div class="kick">Prepositions · Set ${SET + 1} · ${esc(DATA.sets[SET].title)}</div>${clean ? CUP : ''}
    <h2 id="fTitle">${clean ? 'The cup.' : 'Your result'}</h2>
    <div class="big">${pct}%</div>
    <div class="grade">${grade} · ${right} of ${n} first time · ${t}</div>
    ${MISSED.length ? `<p class="review-h">Say these aloud — the word and its preposition together:</p>
      <ul class="review">${MISSED.map(c => `<li><span class="w">${esc(c.it.w)} <b>${esc(shown(c.it.p))}</b></span><span>${c.tries >= 3 ? 'shown' : c.tries + 1 + ' tries'}</span></li>`).join('')}</ul>` : ''}
    <div class="cta"><button type="button" id="rAgain">Try again</button>${more ? `<button class="fill" type="button" id="rNext">Set ${SET + 2} →</button>` : ''}</div>`);
  $('rAgain').onclick = () => { loadSet(SET); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  if (more) $('rNext').onclick = () => { loadSet(SET + 1); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  tabs();
}
$('scrim').addEventListener('click', e => { if (e.target.id === 'scrim') closeCard(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('scrim').hidden) closeCard(); });
function paintMute(){ const m = $('mute'); if (!m || !window.SFX) return; const on = SFX.isOn(); m.classList.toggle('off', !on); m.setAttribute('aria-pressed', on); m.setAttribute('aria-label', on ? 'Sound on' : 'Sound off'); }
$('mute').onclick = () => { if (window.SFX) { SFX.toggle(); paintMute(); } };
paintMute();

let rT, lastW = document.documentElement.clientWidth;
window.addEventListener('resize', () => {
  /* a phone keyboard opening is a resize too — only redraw when the width
     changes, or the cell being typed in would lose its focus */
  const w = document.documentElement.clientWidth; if (w === lastW) return; lastW = w;
  clearTimeout(rT); rT = setTimeout(() => { draw(); if (SEL >= 0) select(SEL); }, 150);
});

fetch('/data/similar-words/prepositions.json', { cache: 'no-store' })
  .then(r => r.json())
  .then(d => {
    DATA = d; buildAccept();
    const want = parseInt(new URLSearchParams(location.search).get('set'), 10);
    const start = want >= 1 && want <= d.sets.length ? want - 1 : 0;
    (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => loadSet(start));
  })
  .catch(() => { $('comb').textContent = 'The words did not load. Please refresh.'; });

if (new URLSearchParams(location.search).get('test')) window.PREP_TEST = {
  cells: () => CELLS.map(c => ({ w: c.it.w, p: c.it.p, done: c.done })),
  sel: () => SEL,
  select: i => select(i),
  type: v => { const i = SEL; const inp = $('comb').children[i].querySelector('.pz-slot'); inp.value = v; check(i, inp.value, true); }
};
})();
</script>
