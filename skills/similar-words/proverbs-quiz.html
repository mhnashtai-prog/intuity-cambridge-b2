<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>INTUITY — Idiomatic Expressions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500&family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=5">
<!-- The same two links collocations carries: the shell brings the header,
     the mode row and the tokens; vocab.css brings the strip, the dots, the
     nav buttons and the action bar. This page was the one vocabulary screen
     that loaded neither, which is why it read as a different product. -->
<link rel="stylesheet" href="/data/similar-words/vocab.css?v=3">
<style>
  /* ── IDIOMATIC EXPRESSIONS ─────────────────────────────────────────
     Restyle only. Every id, every class and the entire script are the
     originals — LIST / QUIZ / BUILD, the drag-to-order chips, the scoring
     and the completion overlay all behave exactly as they did. What
     changes is that the page stops owning a palette and a type stack of
     its own (#0c0c0c, gold #C9A961, Bebas Neue, Barlow Condensed) and
     wears the product's. */
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;overflow:hidden;
    background:var(--screen);color:var(--ink);font-family:var(--f-body);
    -webkit-font-smoothing:antialiased;}

  .shell{display:flex;flex-direction:column;height:100%;}

  /* The old .hdr/.mode-seg/.seg-btn are gone: the header markup below is
     the shell's, so this page's header is the same object as every other
     page's — same height, same back link, same mode row. */
  .score-chip{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.06em;
    color:var(--poster-faint);font-variant-numeric:tabular-nums;}
  .score-chip + .score-chip{margin-left:.55rem;}
  .score-chip b{color:var(--poster-ink);font-weight:500;}

  .prog-bar{flex:none;height:2px;background:var(--rule);}
  .prog-fill{height:100%;width:0;background:var(--sage,#527065);transition:width .3s ease;}

  .stage{flex:1;min-height:0;overflow-y:auto;
    padding:1rem var(--gutter,1rem) 1.5rem;
    scrollbar-width:thin;scrollbar-color:var(--rule) transparent;}
  .card{max-width:var(--w-read,640px);margin:0 auto;}

  /* ── LIST ── */
  .list-panel{display:none;} .list-panel.show{display:block;}
  .list-heading{display:flex;align-items:center;gap:9px;
    font-family:var(--f-mono);font-size:.56rem;letter-spacing:.22em;
    text-transform:uppercase;color:var(--poster-faint);margin-bottom:1.1rem;}
  .list-heading::before{content:'';display:block;width:26px;height:10px;flex:none;
    background:var(--caramel);}
  .list-item{display:grid;grid-template-columns:auto 1fr;gap:.15rem .8rem;
    padding:.85rem 0;border-top:1px solid var(--poster-rule);}
  .list-item:first-of-type{border-top:none;}
  .list-num{font-family:var(--f-mono);font-size:.56rem;color:var(--poster-faint);
    padding-top:.28rem;font-variant-numeric:tabular-nums;}
  .list-proverb{font-family:var(--f-display);font-weight:700;font-size:1rem;
    color:var(--poster-ink);line-height:1.3;}
  .list-meaning{grid-column:2;font-size:.84rem;line-height:1.5;color:var(--poster-body);}

  /* ── QUIZ + BUILD poster ── */
  .poster-zone{background:var(--card);border-radius:var(--r-sheet);
    padding:1.5rem 1.3rem;margin-bottom:.9rem;}
  .poster-meta{display:flex;align-items:center;gap:9px;margin-bottom:.75rem;}
  .poster-meta::before{content:'';display:block;width:26px;height:10px;flex:none;
    background:var(--caramel);}
  .poster-num,.poster-tag{font-family:var(--f-mono);font-size:.56rem;
    letter-spacing:.16em;text-transform:uppercase;color:var(--poster-faint);}
  .poster-num{font-variant-numeric:tabular-nums;}
  .poster-tag{margin-left:auto;}
  /* The scenario is the headline of the screen, so it is set the way this
     product sets a headline. */
  .scenario-text{font-family:'Anton',Impact,var(--f-display),sans-serif;font-weight:400;
    font-size:clamp(1.3rem,4.6vw,1.8rem);line-height:1.18;color:var(--poster-ink);}
  .scenario-text .kw{color:var(--accent-ink,#8A5A2B);}

  /* ── QUIZ options ── */
  .options-zone{background:var(--card);border-radius:var(--r-sheet);overflow:hidden;}
  .opt-btn{width:100%;display:flex;align-items:baseline;gap:.8rem;
    padding:.95rem 1.3rem;background:none;border:none;cursor:pointer;text-align:left;
    border-top:1px solid var(--poster-rule);transition:background .15s;}
  .opt-btn:first-child{border-top:none;}
  .opt-btn.locked{cursor:default;}
  @media(hover:hover){ .opt-btn:hover:not(.locked){background:var(--poster-fill);} }
  .opt-letter{font-family:var(--f-mono);font-size:.62rem;color:var(--poster-faint);
    flex:none;text-transform:uppercase;}
  .opt-text{font-family:var(--f-display);font-size:.95rem;font-weight:500;
    color:var(--poster-ink);line-height:1.35;}
  /* Marked with the shell's own right/wrong inks — the pair every other
     exercise in the product marks with. */
  .opt-btn.correct,.opt-btn.reveal{background:var(--tile-ok-bg);}
  .opt-btn.correct .opt-text,.opt-btn.reveal .opt-text{color:var(--tile-ok-ink);font-weight:700;}
  .opt-btn.correct .opt-letter,.opt-btn.reveal .opt-letter{color:var(--tile-ok-ink);}
  .opt-btn.wrong{background:var(--tile-no-bg);}
  .opt-btn.wrong .opt-text{color:var(--tile-no-ink);text-decoration:line-through;font-weight:700;}
  .opt-btn.wrong .opt-letter{color:var(--tile-no-ink);}

  /* ── BUILD ── */
  .build-actions{display:none;gap:.6rem;margin:.9rem 0;}
  .check-btn,.next-btn{flex:1;font-family:var(--f-display);font-size:.72rem;font-weight:700;
    letter-spacing:.06em;text-transform:uppercase;padding:.8rem;border:none;
    border-radius:var(--r-field);cursor:pointer;background:var(--sage,#527065);color:var(--card);
    transition:filter .15s,transform .1s;}
  .check-btn:active,.next-btn:active{transform:scale(.99);}
  @media(hover:hover){ .check-btn:hover,.next-btn:hover{filter:brightness(.94);} }

  .build-zone{display:flex;flex-wrap:wrap;gap:.45rem;
    background:var(--card);border-radius:var(--r-sheet);padding:1.1rem;}
  .word-chip{font-family:var(--f-display);font-size:.9rem;font-weight:500;
    color:var(--poster-ink);background:var(--poster-fill);
    border:none;border-radius:var(--r-field);padding:.5rem .8rem;
    cursor:grab;user-select:none;transition:background .15s,opacity .15s,transform .15s;}
  .word-chip:active{cursor:grabbing;}
  .word-chip.dragging{opacity:.35;transform:scale(.95);}
  .word-chip.over{background:var(--poster-fill-hi);box-shadow:inset 0 0 0 2px var(--caramel);}
  .word-chip.correct-pos{background:var(--tile-ok-bg);color:var(--tile-ok-ink);font-weight:700;}
  .word-chip.wrong-pos{background:var(--tile-no-bg);color:var(--tile-no-ink);
    text-decoration:line-through;}

  /* ── FEEDBACK ── */
  .feedback{display:flex;align-items:center;gap:.6rem;margin-top:.9rem;
    background:var(--poster-fill);border-radius:var(--r-field);
    padding:.85rem 1rem;font-size:.9rem;line-height:1.5;color:var(--poster-body);}
  .feedback-icon{flex:none;font-weight:900;}

  /* ── FOOTER ── */
  .ftr{flex:none;display:flex;align-items:center;justify-content:center;gap:.9rem;
    background:var(--screen);border-top:1px solid var(--rule);
    padding:.75rem calc(.75rem + env(safe-area-inset-bottom,0px));}
  .dots-row{display:flex;gap:.42rem;align-items:center;flex-wrap:wrap;
    max-width:60%;justify-content:center;}
  .ctr{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.1em;
    color:var(--poster-faint);font-variant-numeric:tabular-nums;}

  /* ── COMPLETE OVERLAY ── */
  .overlay{position:fixed;inset:0;z-index:60;display:none;
    flex-direction:column;align-items:center;justify-content:center;gap:.7rem;
    padding:1.2rem;background:rgba(20,17,14,.55);backdrop-filter:blur(6px);}
  .overlay.show{display:flex;}
  .ov-em{font-size:2.4rem;}
  .ov-title{font-family:'Anton',Impact,var(--f-display),sans-serif;font-weight:400;
    text-transform:uppercase;font-size:clamp(2rem,9vw,3rem);line-height:.95;
    color:var(--card);}
  .ov-score{font-family:var(--f-mono);font-size:.8rem;letter-spacing:.14em;
    color:rgba(255,255,255,.72);}
  .ov-bars{display:flex;gap:3px;margin:.4rem 0;flex-wrap:wrap;
    justify-content:center;max-width:320px;}
  .ov-bar{width:10px;height:32px;border-radius:3px;}
  .ov-sub{font-size:.82rem;color:rgba(255,255,255,.6);text-align:center;
    max-width:300px;line-height:1.55;}
  .ov-btns{display:flex;gap:.6rem;margin-top:.6rem;}
  .ov-btn{font-family:var(--f-display);font-size:.72rem;font-weight:700;
    letter-spacing:.06em;text-transform:uppercase;padding:.75rem 1.5rem;
    border-radius:var(--r-field);cursor:pointer;border:none;transition:filter .15s;}
  .ov-btn.primary{background:var(--sage,#527065);color:var(--card);}
  .ov-btn.ghost{background:rgba(255,255,255,.12);color:var(--card);}
  @media(hover:hover){ .ov-btn:hover{filter:brightness(1.08);} }
  .header .strip{position:static;padding:.55rem var(--gutter,1rem) .5rem;margin:0;}
</style>
</head>
<body>

<div class="shell">
  <!-- HEADER -->
  <header class="header">
    <div class="header-top">
      <a class="back-link" href="/index.html?openModal=vocabulary" target="_top">&larr; Vocabulary</a>
      <div class="header-title">
        <div class="app-title">INTUITY</div>
        <div class="app-subtitle">Idiomatic Expressions &middot; B1&ndash;B2</div>
      </div>
      <span class="header-spacer">Level <b>B1&ndash;B2</b></span>
    </div>

    <!-- The same three modes, in the shell's mode row. setMode still toggles
         .active on these ids, so the script is untouched. -->
    <div class="mode-selector">
      <button class="mode-btn active" type="button" id="segList"  onclick="setMode('list')">Browse</button>
      <button class="mode-btn"        type="button" id="segQuiz"  onclick="setMode('quiz')">Quiz</button>
      <button class="mode-btn"        type="button" id="segBuild" onclick="setMode('build')">Build</button>
    </div>

    <div class="strip">
      <span class="strip-label" id="stripLabel">Match the situation to the expression</span>
      <span>
        <span class="score-chip">&#10003; <b id="scoreCorrect">0</b></span>
        <span class="score-chip">&#10007; <b id="scoreWrong">0</b></span>
      </span>
    </div>
  </header>

  <!-- PROGRESS BAR -->
  <div class="prog-bar" id="progBar"><div class="prog-fill" id="progFill"></div></div>

  <!-- STAGE -->
  <main class="stage">
    <div class="card" id="card">

      <!-- LIST MODE -->
      <div class="list-panel show" id="listPanel">
        <div class="list-heading">Proverbs · B1–B2</div>
        <div id="listBody"></div>
      </div>

      <!-- QUIZ + BUILD (shared poster) -->
      <div class="poster-zone" id="posterZone" style="display:none">
        <div class="poster-meta">
          <span class="poster-num" id="cardNum">1 / 35</span>
          <span class="poster-tag" id="posterTag">Which proverb fits?</span>
        </div>
        <div class="scenario-text" id="scenarioText"></div>
      </div>

      <!-- QUIZ OPTIONS -->
      <div class="options-zone" id="optionsZone" style="display:none"></div>

      <!-- BUILD ACTION BAR — above the chips -->
      <div class="build-actions" id="buildActions">
        <button class="check-btn" id="btnCheck" onclick="checkBuild()" style="display:none">CHECK</button>
        <button class="next-btn"  id="btnNext"  onclick="quizNext()"   style="display:none">NEXT →</button>
      </div>

      <!-- BUILD CHIPS -->
      <div class="build-zone" id="buildZone" style="display:none"></div>

      <!-- FEEDBACK (quiz + build) -->
      <div class="feedback" id="feedback" style="display:none">
        <span class="feedback-icon" id="fbIcon"></span>
        <span id="fbText"></span>
      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="ftr">
    <button class="nav-btn" id="btnP"    onclick="prev()" disabled style="display:none">‹</button>
    <div class="dots-row"   id="dotsRow"                           style="display:none"></div>
    <span class="ctr"       id="ctr"                               style="display:none">1 / 35</span>
    <button class="nav-btn" id="btnN"    onclick="next()"          style="display:none">›</button>
  </footer>
</div>

<!-- COMPLETE OVERLAY -->
<div class="overlay" id="overlay">
  <div class="ov-em" id="ovEm">🎉</div>
  <div class="ov-title">Complete!</div>
  <div class="ov-score" id="ovScore"></div>
  <div class="ov-bars"  id="ovBars"></div>
  <div class="ov-sub"   id="ovSub"></div>
  <div class="ov-btns">
    <button class="ov-btn primary" onclick="restart()">↺ Try Again</button>
    <button class="ov-btn ghost"   onclick="closeOverlay()">Review</button>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════
   PALETTE
═══════════════════════════════════════════ */
const PAL = ['#C9A961','#6ab0d8','#a8d86a','#e07b7b','#b07dd4','#6fcf8a','#d4936a','#7ec8c8'];

/* ═══════════════════════════════════════════
   STATE
═══════════════════════════════════════════ */
let slides=[], TOTAL=0;
let order=[], results={}, shuffledOpts={}, correctTexts={};
let buildWords={}, buildChecked={};
let cur=0, animDir='in';
let appMode='list'; // 'list' | 'quiz' | 'build'

/* ── drag state ── */
let bDragIdx=null, bDragSlide=null;
let bTouchEl=null, bTouchIdx=null, bTouchSlide=null;

/* ═══════════════════════════════════════════
   LOAD
═══════════════════════════════════════════ */
async function loadData(){
  document.getElementById('card').style.opacity='.4';
  try{
    const res  = await fetch('./data/proverbs-quiz.json');
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    slides = data.slides;
    TOTAL  = slides.length;
    document.getElementById('card').style.opacity='';
    init();
    renderList(); // list is the default first view
  }catch(err){
    document.getElementById('card').style.opacity='';
    document.getElementById('scenarioText').textContent='⚠ Could not load data.';
    console.error(err);
  }
}

/* ═══════════════════════════════════════════
   INIT
═══════════════════════════════════════════ */
function init(){
  order = Array.from({length:TOTAL},(_,i)=>i);
  shuffle(order);
  shuffledOpts={}; correctTexts={}; buildWords={}; buildChecked={};
  slides.forEach((s,i)=>{
    correctTexts[i] = s.options[s.correct];
    const arr=[...s.options]; shuffle(arr);
    shuffledOpts[i] = arr;
    const bw=[...correctTexts[i].split(/\s+/)]; shuffle(bw);
    buildWords[i] = bw;
  });
  results={};
  cur=0;
}

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
}

/* ═══════════════════════════════════════════
   MODE SWITCH
═══════════════════════════════════════════ */
function setMode(m){
  appMode=m;
  // seg buttons
  ['list','quiz','build'].forEach(id=>{
    document.getElementById('seg'+id.charAt(0).toUpperCase()+id.slice(1))
      .classList.toggle('active', id===m);
  });
  // panels
  document.getElementById('listPanel').classList.toggle('show', m==='list');
  document.getElementById('posterZone').style.display   = m!=='list'?'':'none';
  document.getElementById('optionsZone').style.display  = m==='quiz'?'':'none';
  document.getElementById('buildZone').style.display    = m==='build'?'':'none';
  document.getElementById('buildActions').style.display = m==='build'?'flex':'none';
  document.getElementById('feedback').style.display     = m!=='list'?'':'none';
  // progress bar
  document.getElementById('progBar').style.display      = m!=='list'?'':'none';
  // footer
  const showNav = m!=='list';
  document.getElementById('btnP').style.display    = showNav?'':'none';
  document.getElementById('btnN').style.display    = showNav?'':'none';
  document.getElementById('dotsRow').style.display = showNav?'':'none';
  document.getElementById('ctr').style.display     = showNav?'':'none';
  document.getElementById('btnCheck').style.display= m==='build'?'':'none';
  document.getElementById('btnNext').style.display = 'none';
  // poster tag
  document.getElementById('posterTag').textContent =
    m==='quiz' ? 'Which proverb fits?' : 'Order the words';
  // render
  if(m==='list')  renderList();
  else            renderSlide('in');
}

/* ═══════════════════════════════════════════
   LIST
═══════════════════════════════════════════ */
function renderList(){
  if(!slides.length) return;
  document.getElementById('listBody').innerHTML = slides.map((s,i)=>`
    <div class="list-item">
      <span class="list-num">${i+1}</span>
      <span class="list-proverb" style="color:${PAL[i%PAL.length]}">${s.options[s.correct]}</span>
      <span class="list-meaning">${s.meaning}</span>
    </div>`).join('');
}

/* ═══════════════════════════════════════════
   RENDER SLIDE (QUIZ + BUILD)
═══════════════════════════════════════════ */
function renderSlide(dir='in'){
  const s = slides[order[cur]];
  if(!s) return;
  const card = document.getElementById('card');
  card.classList.remove('anim-in','anim-back');
  void card.offsetWidth;
  card.classList.add(dir==='back'?'anim-back':'anim-in');
  // reset footer buttons on new slide
  document.getElementById('btnNext').style.display='none';
  if(appMode==='build'){
    document.getElementById('buildActions').style.display='flex';
    const already = buildChecked[order[cur]];
    document.getElementById('btnCheck').style.display = already ? 'none' : '';
    document.getElementById('btnNext').style.display  = already ? '' : 'none';
  } else {
    document.getElementById('buildActions').style.display='none';
  }

  document.getElementById('cardNum').textContent = (cur+1)+' / '+TOTAL;
  document.getElementById('ctr').textContent     = (cur+1)+' / '+TOTAL;

  // accent + keyword colour
  const col   = PAL[order[cur]%PAL.length];
  const kwCol = PAL[order[cur]%PAL.length];
  document.getElementById('posterZone').style.setProperty('--accent',col);

  // keyword highlight
  const raw     = s.scenario;
  const kw      = s.keyword||'';
  const escHtml = raw.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  let scenHtml  = escHtml;
  if(kw){
    const ek  = kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    const rx  = new RegExp('(?<![\\w])('+ek+')(?![\\w])','i');
    scenHtml  = escHtml.replace(rx,`<span class="kw" style="color:${kwCol}">$1</span>`);
    if(scenHtml===escHtml){
      scenHtml = escHtml.replace(new RegExp('('+ek+')','i'),
        `<span class="kw" style="color:${kwCol}">$1</span>`);
    }
  }
  document.getElementById('scenarioText').innerHTML = scenHtml;

  if(appMode==='quiz')  renderQuizOpts(s, order[cur]);
  if(appMode==='build') renderBuildChips(order[cur]);

  renderFeedback(s, order[cur]);
  updateProgress();
  updateNav();
  renderDots();
}

/* ── QUIZ options ── */
function renderQuizOpts(s, slideIdx){
  const zone   = document.getElementById('optionsZone');
  zone.innerHTML='';
  const letters=['A','B','C'];
  const res    = results[slideIdx];
  const opts   = shuffledOpts[slideIdx];
  const corr   = correctTexts[slideIdx];

  opts.forEach((opt,i)=>{
    const btn=document.createElement('button');
    btn.className='opt-btn';
    if(res){
      btn.classList.add('locked');
      if(opt===corr) btn.classList.add(res==='correct'?'correct':'reveal');
      else if(res==='wrong'&&opt===results[slideIdx+'_chosen']) btn.classList.add('wrong');
    }
    btn.innerHTML=`<span class="opt-letter">${letters[i]}</span><span class="opt-text">${opt}</span>`;
    if(!res) btn.onclick=()=>choose(opt,btn,slideIdx);
    zone.appendChild(btn);
  });
}

/* ── BUILD chips ── */
function renderBuildChips(slideIdx){
  const zone    = document.getElementById('buildZone');
  zone.innerHTML='';
  const words   = buildWords[slideIdx];
  const correct = correctTexts[slideIdx].split(/\s+/);
  const checked = buildChecked[slideIdx];

  words.forEach((word,i)=>{
    const chip=document.createElement('span');
    chip.className='word-chip';
    chip.textContent=word;
    chip.dataset.idx=i;
    if(checked){
      chip.classList.add(word===correct[i]?'correct-pos':'wrong-pos');
    } else {
      chip.draggable=true;
      chip.addEventListener('dragstart', bdragStart);
      chip.addEventListener('dragover',  bdragOver);
      chip.addEventListener('drop',      bdrop);
      chip.addEventListener('dragend',   bdragEnd);
      chip.addEventListener('touchstart',btouchStart,{passive:false});
      chip.addEventListener('touchmove', btouchMove, {passive:false});
      chip.addEventListener('touchend',  btouchEnd,  {passive:false});
    }
    zone.appendChild(chip);
  });
}

/* ── BUILD drag (desktop) ── */
function bdragStart(e){
  bDragIdx=parseInt(e.target.dataset.idx);
  bDragSlide=order[cur];
  e.target.classList.add('dragging');
  e.dataTransfer.effectAllowed='move';
}
function bdragOver(e){
  e.preventDefault();
  e.target.closest('.word-chip')?.classList.add('over');
}
function bdrop(e){
  e.preventDefault();
  const target=e.target.closest('.word-chip');
  if(!target||bDragIdx===null) return;
  target.classList.remove('over');
  const di=parseInt(target.dataset.idx);
  if(di===bDragIdx) return;
  const arr=buildWords[bDragSlide];
  [arr[bDragIdx],arr[di]]=[arr[di],arr[bDragIdx]];
  renderBuildChips(bDragSlide);
}
function bdragEnd(e){
  e.target.classList.remove('dragging');
  document.querySelectorAll('.word-chip.over').forEach(c=>c.classList.remove('over'));
  bDragIdx=null;
}

/* ── BUILD touch (mobile) ── */
function btouchStart(e){
  e.preventDefault();
  bTouchEl=e.target.closest('.word-chip');
  bTouchIdx=parseInt(bTouchEl.dataset.idx);
  bTouchSlide=order[cur];
  bTouchEl.classList.add('dragging');
}
function btouchMove(e){
  e.preventDefault();
  const t=e.touches[0];
  const el=document.elementFromPoint(t.clientX,t.clientY);
  const chip=el?.closest('.word-chip');
  document.querySelectorAll('.word-chip.over').forEach(c=>c.classList.remove('over'));
  if(chip&&chip!==bTouchEl) chip.classList.add('over');
}
function btouchEnd(e){
  e.preventDefault();
  const t=e.changedTouches[0];
  const el=document.elementFromPoint(t.clientX,t.clientY);
  const chip=el?.closest('.word-chip');
  if(chip&&chip!==bTouchEl){
    const di=parseInt(chip.dataset.idx);
    const arr=buildWords[bTouchSlide];
    [arr[bTouchIdx],arr[di]]=[arr[di],arr[bTouchIdx]];
  }
  document.querySelectorAll('.word-chip.over,.word-chip.dragging')
    .forEach(c=>c.classList.remove('over','dragging'));
  renderBuildChips(bTouchSlide);
  bTouchEl=null; bTouchIdx=null;
}

/* ── CHECK BUILD ── */
function checkBuild(){
  const slideIdx=order[cur];
  if(buildChecked[slideIdx]) return;
  buildChecked[slideIdx]=true;
  renderBuildChips(slideIdx);
  const s=slides[slideIdx];
  const corr=correctTexts[slideIdx];
  const words=buildWords[slideIdx];
  const correct=corr.split(/\s+/);
  const allRight=words.every((w,i)=>w===correct[i]);
  const fb=document.getElementById('feedback');
  const fbText=document.getElementById('fbText');
  const fbIcon=document.getElementById('fbIcon');
  fb.classList.add('show');
  fbIcon.textContent=allRight?'✓':'✗';
  fbText.innerHTML=allRight
    ?`<strong>${corr}</strong> · ${s.meaning}`
    :`Answer: <strong>${corr}</strong> · ${s.meaning}`;
  // hide CHECK, show NEXT — student reads feedback then decides to move on
  document.getElementById('btnCheck').style.display='none';
  if(!results[slideIdx]){
    results[slideIdx]=allRight?'correct':'wrong';
    updateScoreDisplay(); renderDots(); updateProgress();
    const answered=Object.keys(results).filter(k=>!k.includes('_')).length;
    if(answered===TOTAL) setTimeout(showComplete,1200);
    else document.getElementById('btnNext').style.display='';
  }
}

/* ── FEEDBACK ── */
function renderFeedback(s,slideIdx){
  const fb=document.getElementById('feedback');
  const fbText=document.getElementById('fbText');
  const fbIcon=document.getElementById('fbIcon');
  const res=results[slideIdx];
  const bChecked=buildChecked[slideIdx];
  const corr=correctTexts[slideIdx];

  if(appMode==='quiz'&&res){
    fb.classList.add('show');
    fbIcon.textContent=res==='correct'?'✓':'✗';
    fbText.innerHTML=res==='correct'
      ?`<strong>${corr}</strong> · ${s.meaning}`
      :`Correct: <strong>${corr}</strong> · ${s.meaning}`;
  } else if(appMode==='build'&&bChecked){
    const words=buildWords[slideIdx];
    const correct=corr.split(/\s+/);
    const allRight=words.every((w,i)=>w===correct[i]);
    fb.classList.add('show');
    fbIcon.textContent=allRight?'✓':'✗';
    fbText.innerHTML=allRight
      ?`<strong>${corr}</strong> · ${s.meaning}`
      :`Answer: <strong>${corr}</strong> · ${s.meaning}`;
  } else {
    fb.classList.remove('show');
    fbText.textContent=''; fbIcon.textContent='';
  }
}

/* ═══════════════════════════════════════════
   QUIZ ANSWER
═══════════════════════════════════════════ */
function choose(chosenText,btn,slideIdx){
  const s=slides[slideIdx];
  const corr=correctTexts[slideIdx];
  const isCorrect=chosenText===corr;
  results[slideIdx]=isCorrect?'correct':'wrong';
  results[slideIdx+'_chosen']=chosenText;
  updateScoreDisplay();
  const allBtns=document.querySelectorAll('.opt-btn');
  allBtns.forEach(b=>b.classList.add('locked'));
  if(isCorrect){btn.classList.add('correct');}
  else{
    btn.classList.add('wrong');
    allBtns.forEach(b=>{if(b.querySelector('.opt-text').textContent===corr)b.classList.add('reveal');});
  }
  const fb=document.getElementById('feedback');
  const fbText=document.getElementById('fbText');
  const fbIcon=document.getElementById('fbIcon');
  fb.classList.add('show');
  fbIcon.textContent=isCorrect?'✓':'✗';
  fbText.innerHTML=isCorrect
    ?`<strong>${corr}</strong> · ${s.meaning}`
    :`Correct: <strong>${corr}</strong> · ${s.meaning}`;
  renderDots();
  updateProgress();
  // auto-advance after feedback pause
  const answered=Object.keys(results).filter(k=>!k.includes('_')).length;
  if(answered===TOTAL) setTimeout(showComplete,1800);
  else setTimeout(()=>{ if(cur<TOTAL-1) next(); }, 1800);
}

function quizNext(){
  // used by BUILD mode after checking
  document.getElementById('btnNext').style.display='none';
  document.getElementById('btnCheck').style.display='none';
  if(cur<TOTAL-1) next();
  else showComplete();
}

/* ═══════════════════════════════════════════
   NAV + SCORE + DOTS
═══════════════════════════════════════════ */
function goTo(i){
  if(i<0||i>=TOTAL)return;
  animDir=i>cur?'in':'back';
  cur=i; renderSlide(animDir);
}
function next(){if(cur<TOTAL-1)goTo(cur+1)}
function prev(){if(cur>0)goTo(cur-1)}

function updateNav(){
  document.getElementById('btnP').disabled=cur<=0;
  document.getElementById('btnN').disabled=cur>=TOTAL-1;
}
function updateProgress(){
  const answered=Object.keys(results).filter(k=>!k.includes('_')).length;
  document.getElementById('progFill').style.width=(answered/TOTAL*100)+'%';
}
function updateScoreDisplay(){
  let ok=0,bad=0;
  Object.entries(results).forEach(([k,v])=>{
    if(k.includes('_'))return;
    if(v==='correct')ok++;else bad++;
  });
  document.getElementById('scoreCorrect').textContent=ok;
  document.getElementById('scoreWrong').textContent=bad;
}
function renderDots(){
  const row=document.getElementById('dotsRow');
  row.innerHTML='';
  order.forEach((_,i)=>{
    const d=document.createElement('button');
    d.className='dot';
    const res=results[order[i]];
    if(i===cur)              d.classList.add('cur');
    else if(res==='correct') d.classList.add('done-ok');
    else if(res==='wrong')   d.classList.add('done-err');
    d.title='Slide '+(i+1);
    d.onclick=e=>{e.stopPropagation();goTo(i)};
    row.appendChild(d);
  });
}

/* ═══════════════════════════════════════════
   COMPLETE
═══════════════════════════════════════════ */
function showComplete(){
  let ok=0;
  Object.entries(results).forEach(([k,v])=>{if(!k.includes('_')&&v==='correct')ok++;});
  const pct=Math.round(ok/TOTAL*100);
  document.getElementById('ovEm').textContent=pct===100?'🏆':pct>=80?'🎉':pct>=60?'👍':'📚';
  document.getElementById('ovScore').textContent=ok+' / '+TOTAL+' correct ('+pct+'%)';
  document.getElementById('ovSub').textContent=
    pct===100?'Perfect! You know your proverbs!':
    pct>=80?'Excellent — almost flawless!':
    pct>=60?'Good effort. Keep practising.':'Review the list and try again!';
  const bars=document.getElementById('ovBars');
  bars.innerHTML='';
  order.forEach((_,i)=>{
    const b=document.createElement('div');
    b.className='ov-bar';
    const res=results[order[i]];
    b.style.background=res==='correct'?'var(--green)':res==='wrong'?'var(--red)':'rgba(255,255,255,.1)';
    bars.appendChild(b);
  });
  document.getElementById('overlay').classList.add('show');
}
function restart(){
  document.getElementById('overlay').classList.remove('show');
  init();
  if(appMode==='list') renderList();
  else renderSlide('in');
}
function closeOverlay(){
  document.getElementById('overlay').classList.remove('show');
  cur=0; renderSlide('in');
}

/* ═══════════════════════════════════════════
   KEYBOARD + SWIPE
═══════════════════════════════════════════ */
document.addEventListener('keydown',e=>{
  if(appMode==='list') return;
  if(e.key==='ArrowRight') next();
  else if(e.key==='ArrowLeft') prev();
  else if(e.key===' '){e.preventDefault();if(appMode==='build')checkBuild();}
  else if(e.key==='1'||e.key==='a') clickOpt(0);
  else if(e.key==='2'||e.key==='b') clickOpt(1);
  else if(e.key==='3'||e.key==='c') clickOpt(2);
  else if(e.key==='Escape') document.getElementById('overlay').classList.remove('show');
});
function clickOpt(i){
  if(appMode!=='quiz') return;
  const btns=document.querySelectorAll('.opt-btn');
  if(btns[i]&&!btns[i].classList.contains('locked')) btns[i].click();
}
let _tx=0;
document.addEventListener('touchstart',e=>{_tx=e.changedTouches[0].screenX},{passive:true});
document.addEventListener('touchend',e=>{
  if(appMode==='list'||appMode==='build') return;
  const dx=e.changedTouches[0].screenX-_tx;
  if(Math.abs(dx)>55){if(dx<0)next();else prev();}
});

/* ── START ── */
loadData();
</script>
<script>
function syncHeader(){
  var h=document.querySelector('.header');
  if(h) document.documentElement.style.setProperty('--header-h', h.offsetHeight+'px');
}
addEventListener('resize', syncHeader);
addEventListener('orientationchange', function(){ setTimeout(syncHeader,120); });
if(document.fonts && document.fonts.ready) document.fonts.ready.then(syncHeader);
if(window.ResizeObserver){ var hh=document.querySelector('.header'); if(hh) new ResizeObserver(syncHeader).observe(hh); }
syncHeader();
</script>
</body>
