<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F3F1ED">
  <title>INTUITY — Similar Words</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Anton is the card's headline face, as in Sort. Geist carries everything
       else. Two families, and the second is used for exactly one thing. -->
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500&family=Anton&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=7">
  <link rel="stylesheet" href="/data/similar-words/vocab.css?v=7">
  <style>
    /* A percentage inside a numbered tab, so a three-character chip can still
       report a score. Twenty-three of these wrap to two rows; the shell's
       .set-tabs already handles that. */
    .vtab .pct{font-family:var(--f-mono);font-size:.82em;opacity:.7;
      font-variant-numeric:tabular-nums}
  </style>
</head>
<body>

<!-- ── THE HEADER, IN THE DEFUSE STYLE ─────────────────────────────────────
     Compact: title, modes, sets. Nothing else. The inactive mode is a real
     link and the active one a plain span, so the row is correct on first
     paint with no JavaScript — which is why Defuse's header was the one to
     copy rather than the toggle-driven versions.

     The Select Data dropdown is gone. It held two entries, and they were not
     two views of one topic but two different topics hidden behind a control
     on a page titled Similar Words. They are two entries in this row now,
     which is also how Topic Vocabulary becomes findable at all. -->
<header class="header">
  <div class="header-top">
    <a class="back-link" href="/index.html?openModal=vocabulary" target="_top">← Vocabulary</a>
    <div class="header-title">
      <div class="app-title">INTUITY</div>
      <div class="app-subtitle">Similar Words · B2 First</div>
    </div>
    <span class="header-spacer">Level <b>B2</b></span>
  </div>

  <div class="mode-selector">
    <span class="mode-btn active">Similar Words</span>
    <a class="mode-btn" href="/skills/similar-words/topic-vocabulary.html">Topic Vocabulary</a>
  </div>

  <div class="set-tabs" id="setTabs"></div>
</header>

<div class="wrap">
  <div class="strip">
    <span><span class="strip-label">Tap a word, then tap its gap</span><span class="strip-tally" id="tally"></span></span>
    <!-- A VIEW, not a mode: same test, same questions, same score, laid out
         two ways. Five cards scrolling, or one card at a time. It sits here
         beside the progress it changes rather than in the mode row, and the
         choice is remembered. -->
    <!-- "All" and "One" name a quantity without naming what OF. A child
         reads them as an instruction they have not been given. The kicker on
         every card already says SET 1, so the toggle names the same thing:
         all the sets, or one set. Nothing to work out. -->
    <div class="view-toggle" role="group" aria-label="How many sets to show">
      <button class="view-btn" type="button" data-view="all" aria-pressed="true">All sets</button>
      <button class="view-btn" type="button" data-view="one" aria-pressed="false">One set</button>
    </div>
    <!-- Shown only in ONE view. ALL is a worksheet and stays silent; ONE is a
         single card with the whole screen, and can carry sound without
         becoming a noise problem in a room of thirty. -->
    <button class="snd" id="sndBtn" type="button" aria-pressed="false" aria-label="Sound off"></button>
    <div class="dots" id="dots"></div>
  </div>
  <div id="board" class="board"><div class="loading">Loading…</div></div>
</div>

<div class="action-bar">
  <button class="nav-btn" id="prevBtn" type="button" hidden>← Prev</button>
  <button class="action-btn secondary" id="clearBtn" type="button">Clear</button>
  <button class="action-btn primary" id="checkBtn" type="button" disabled>Check</button>
  <button class="nav-btn" id="nextBtn" type="button" hidden>Next →</button>
</div>

<script>
  window.VOCAB = { data: 'similar-words', scoreKey: 'similar_words_scores' };
</script>
<!-- Shared with Forge, Defuse, Sort, Board and Pegs: one oscillator
     module, one device-wide mute. -->
<script src="/skills/grammar-rules/intuity-sound.js"></script>
<script src="/data/similar-words/vocab.js?v=6"></script>

<script>
/* The header wraps to different heights at every width — two mode buttons on
   one line, twenty-three set tabs on two or three — and the strip is sticky
   against --header-h. A stale value lets the header sit on top of the first
   card, so it is measured rather than guessed. Same as the rules pages. */
function syncHeader(){
  var h = document.querySelector('.header');
  if (h) document.documentElement.style.setProperty('--header-h', h.offsetHeight + 'px');
}
addEventListener('resize', syncHeader);
addEventListener('orientationchange', function(){ setTimeout(syncHeader, 120); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(syncHeader);
if (window.ResizeObserver) {
  var hh = document.querySelector('.header');
  if (hh) new ResizeObserver(syncHeader).observe(hh);
}
syncHeader();
</script>
</body>
</html>
