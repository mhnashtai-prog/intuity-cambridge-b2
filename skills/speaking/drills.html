<style>
/* ═══ SPEAKING DRILLS — one phrase per screen (30 Oct 2026, pilot: Buying time)
   The phrase library (data/speaking-phrases.json) had no drill of its own:
   Practice / Quiz / Recall drill whole ANSWERS, so a phrase was met once,
   in one topic. Here the unit is the PHRASE, and every screen runs the
   same six beats so the kid stops reading instructions after screen one:
     1 Hear      Samara says the phrase alone
     2 Say it    a silent bar: say it back
     3 Copy      the examiner asks, Samara answers, the kid copies the answer
     4 Listen    a second question, a second answer: same phrase, new topic
     5 Your turn a third question and a ring: answer it, starting with the phrase
     6 Compare   Samara's own answer to that question
   Swipe (or ↓) for the next phrase. Tap the stage to pause. ♡ keeps a phrase.
   Samara: /audio/drills/<area>/sNN.mp3 (missing → the browser's voice).
   Examiner: the male examiner recordings already in /audio/speaking. ═══ */
:root{
  --paper:#F3F1EC; --card:#FAF8F5; --ink:#14110E; --dim:#5C5852; --faint:rgba(20,17,14,.42); --rule:rgba(20,17,14,.12);
  --sage:#8AA79C; --sage-ink:#4F6B61; --sage-bg:#E3EBE6; --car:#A9875F; --car-ink:#7A5C3A; --car-bg:#EFE6DA;
}
html,body{background:var(--paper)}
body{height:100vh;height:100dvh;display:flex;flex-direction:column;color:var(--ink);overflow:hidden}
.header{position:relative;flex:none}
.header::after{display:none}
#sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:min(52vw,520px);margin:0 auto}
[hidden]{display:none!important}

/* ── the areas ── */
#areas{flex:1;overflow-y:auto;padding:1rem 16px 3rem}
.ar-in{width:min(980px,100%);margin:0 auto}
.ar-lead{font:400 .95rem/1.5 Geist,system-ui,sans-serif;color:var(--dim);margin:.4rem 0 1.4rem;max-width:36rem}
.ar-lead b{color:var(--ink);font-weight:600}
.ar-cat{font:500 .7rem/1 'Geist Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:1.6rem 0 .7rem;display:flex;align-items:center;gap:.6rem}
.ar-cat::before{content:"";width:22px;height:8px;background:var(--car)}
.ar-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.8rem}
.ac{display:flex;flex-direction:column;gap:.5rem;text-align:left;padding:1rem 1rem .9rem;background:var(--card);border:none;border-radius:4px;
  box-shadow:0 1px 2px rgba(20,17,14,.05),0 10px 24px -18px rgba(20,17,14,.35);font:inherit;color:inherit;cursor:pointer;min-height:9.2rem}
.ac h3{margin:0;font:700 1.08rem/1.2 Geist,system-ui,sans-serif;letter-spacing:-.01em}
.ac p{margin:0;font-size:.82rem;line-height:1.4;color:var(--dim);flex:1}
.ac .meta{display:flex;align-items:center;gap:.3rem;flex-wrap:wrap}
.pc{font:600 .66rem/1 'Geist Mono',monospace;padding:.28rem .4rem;border-radius:3px;background:var(--sage-bg);color:var(--sage-ink)}
.ac .go{display:inline-block;line-height:1;align-self:center;margin-left:auto;white-space:nowrap;text-transform:none;letter-spacing:0;font:600 .74rem/1 Geist,system-ui,sans-serif;color:#fff;background:var(--sage-ink);padding:.42rem .7rem;border-radius:999px}
.ar-part{display:flex;align-items:baseline;gap:.8rem;margin:0 0 .6rem;font:700 1.15rem/1.2 Geist,system-ui,sans-serif}
.ar-part a{font:500 .8rem/1 Geist,system-ui,sans-serif;color:var(--sage-ink);text-decoration:none;margin-left:auto}
.ar-head{margin-top:2rem}
.ac .go{min-height:0!important;height:auto!important;display:inline-flex;align-items:center;padding:.42rem .75rem!important;line-height:1!important}
.ac.soon{cursor:default;opacity:.55;box-shadow:none;background:transparent;border:1px dashed var(--rule)}
.ac.soon .go{background:none;color:var(--faint);padding:0}
.ac.mine{background:var(--car-bg)}
.ac.mine .go{background:var(--car-ink)}
@media(hover:hover){.ac:not(.soon):hover{transform:translateY(-2px)} .ac{transition:transform .15s}}

/* ── the feed: one screen per phrase, snap like a short-video app ── */
#feed{flex:1;min-height:0;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
#feed::-webkit-scrollbar{display:none}
.reel{height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;justify-content:center;padding:0 16px}
.ri{width:min(460px,100%);height:100%;display:flex;flex-direction:column;padding:clamp(.6rem,2.2vh,1.3rem) 0 clamp(.7rem,2.4vh,1.4rem);gap:clamp(.5rem,1.8vh,1rem)}
.r-top{display:flex;align-items:center;gap:.4rem}
.kick{font:500 .68rem/1 'Geist Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-right:auto}
.keep{border:none;background:none;font:600 .78rem/1 Geist,system-ui,sans-serif;color:var(--faint);cursor:pointer;padding:.35rem .2rem .35rem .5rem;display:flex;align-items:center;gap:.3rem}
.keep i{font-style:normal;font-size:1.05rem;line-height:1}
.keep.on{color:var(--car-ink)}
.r-phrase{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:clamp(2.5rem,11.5vw,3.9rem);line-height:1.02;letter-spacing:.005em;margin:0;color:var(--ink)}
.r-info{display:flex;align-items:center;gap:.9rem;flex-wrap:wrap}
.meter{display:flex;align-items:center;gap:.5rem;font:500 .64rem/1 'Geist Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.meter span{display:flex;gap:3px}
.meter b{display:block;width:18px;height:8px;border-radius:2px;background:var(--rule)}
.meter b.f{background:var(--sage)}
.job{font:600 .86rem/1.2 Geist,system-ui,sans-serif;color:var(--sage-ink)}
.mouth{font:500 .64rem/1 'Geist Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--car-ink);background:var(--car-bg);padding:.3rem .45rem;border-radius:3px}

/* the six beats */
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.steps div{display:flex;flex-direction:column;gap:.35rem;font:500 .6rem/1.1 'Geist Mono',monospace;letter-spacing:.04em;color:var(--faint);text-transform:uppercase}
.steps div::before{content:"";height:3px;border-radius:2px;background:var(--rule)}
.steps div.done::before{background:var(--sage)}
.steps div.now{color:var(--ink)}
.steps div.now::before{background:var(--car)}

/* the stage: who is speaking, and what */
.stage{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:.9rem;background:var(--card);border-radius:6px;
  padding:clamp(.9rem,2.6vh,1.4rem) 1.1rem;box-shadow:0 1px 2px rgba(20,17,14,.05),0 14px 30px -22px rgba(20,17,14,.4);cursor:pointer;position:relative;
  -webkit-tap-highlight-color:transparent;user-select:none}
.who{display:flex;align-items:center;gap:.5rem;font:500 .64rem/1 'Geist Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.wave{display:flex;align-items:center;gap:2px;height:14px}
.wave i{display:block;width:3px;height:3px;border-radius:2px;background:currentColor;opacity:.5}
.talking .wave i{opacity:1;animation:wv .9s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.15s}.wave i:nth-child(3){animation-delay:.3s}.wave i:nth-child(4){animation-delay:.45s}
@keyframes wv{0%,100%{height:3px}50%{height:13px}}
.line-q{font:500 clamp(1.12rem,4.9vw,1.35rem)/1.35 Geist,system-ui,sans-serif;margin:0;color:var(--ink)}
.line-a{font:400 clamp(1.2rem,5.2vw,1.45rem)/1.45 Geist,system-ui,sans-serif;margin:0;color:var(--dim)}
.line-a mark{background:none;color:var(--sage-ink);font-weight:700;box-shadow:inset 0 -.38em 0 var(--sage-bg)}
.blk{display:flex;flex-direction:column;gap:.45rem;transition:opacity .25s}
.blk.q .who{color:var(--car-ink)}
.blk.a .who{color:var(--sage-ink)}
.blk.dim{opacity:.38}
.blk.q.partner .who{color:#5F7E9C}
.scene{margin:0;font:500 .7rem/1.45 'Geist Mono',monospace;letter-spacing:.02em;color:var(--faint);padding:.5rem .6rem;border:1px dashed var(--rule);border-radius:4px}
.you{display:flex;flex-direction:column;align-items:center;gap:.7rem;text-align:center}
.you .who{color:var(--ink)}
.you .big{font:700 clamp(1.15rem,5vw,1.4rem)/1.25 Geist,system-ui,sans-serif;margin:0}
.you .big mark{background:none;color:var(--sage-ink)}
.bar{width:100%;height:6px;border-radius:3px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--sage)}
.ring{width:84px;height:84px}
.ring circle{fill:none;stroke-width:6}
.ring .bg{stroke:var(--rule)} .ring .fg{stroke:var(--car);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.ring text{font:700 22px Geist,system-ui,sans-serif;fill:var(--ink)}
.paused-tag{position:absolute;top:.7rem;right:.8rem;font:500 .62rem/1 'Geist Mono',monospace;letter-spacing:.14em;color:var(--car-ink);text-transform:uppercase}
.tapstart{display:flex;flex-direction:column;align-items:center;gap:.8rem;text-align:center;color:var(--dim);font-size:.92rem}
.tl{display:flex;gap:3px;width:100%}
.tl i{display:block;font-style:normal;height:20px;border-radius:3px;background:var(--rule);position:relative;overflow:hidden}
.tl i b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:500 .54rem/1 'Geist Mono',monospace;letter-spacing:.04em;text-transform:uppercase;color:var(--faint)}
.tl i.on{background:var(--car)} .tl i.on b{color:#fff}
.crib{margin:0;padding:.6rem .9rem .6rem 2rem;background:var(--card);border-radius:6px;font:400 .8rem/1.45 Geist,system-ui,sans-serif;color:var(--dim)}
.crib li::marker{font:500 .7rem 'Geist Mono',monospace;color:var(--car-ink)}
.ac.feat{background:var(--ink);color:#fff} .ac.feat p{color:rgba(255,255,255,.7)} .ac.feat .pc{background:rgba(255,255,255,.14);color:#fff} .ac.feat .go{background:var(--car)}
.r-note{font:400 .84rem/1.4 Geist,system-ui,sans-serif;color:var(--dim);margin:0;padding-left:.75rem;border-left:2px solid var(--car)}
.r-ctrl{display:flex;align-items:center;gap:.5rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;border:none;cursor:pointer;font:600 .86rem/1 Geist,system-ui,sans-serif;
  padding:.72rem 1.05rem;border-radius:999px;background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(20,17,14,.1);-webkit-tap-highlight-color:transparent}
.btn.dark{background:var(--ink);color:#fff}
.btn.sage{background:var(--sage-ink);color:#fff}
.btn:active{transform:scale(.97)}
.r-ctrl .next{margin-left:auto}
.play-i{width:0;height:0;border-left:9px solid currentColor;border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:2px}

/* intro + close screens */
.r-title{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:clamp(3rem,14vw,4.6rem);line-height:.98;margin:0}
.intro-t{font:400 1rem/1.5 Geist,system-ui,sans-serif;color:var(--dim);margin:0}
.plist{display:flex;flex-direction:column;background:var(--card);border-radius:6px;padding:.35rem 1rem;box-shadow:0 1px 2px rgba(20,17,14,.05)}
.plist div{display:flex;align-items:center;gap:.6rem;padding:.55rem 0;border-bottom:1px solid var(--rule);font:600 .98rem/1.2 Geist,system-ui,sans-serif}
.plist div:last-child{border-bottom:none}
.plist .meter{margin-left:auto}
.plist .meter b{width:12px;height:6px}
.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem .6rem;font:400 .76rem/1.3 Geist,system-ui,sans-serif;color:var(--dim)}
.legend b{display:block;font:500 .6rem/1 'Geist Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);margin-bottom:.2rem}
.legend span{border-top:3px solid var(--sage);padding-top:.4rem}
.legend span:nth-child(5){border-color:var(--car)}
.spacer{flex:1}
.r-phrase.longp{font-size:clamp(1.55rem,6.4vw,2.25rem);line-height:1.12}
.stage{justify-content:flex-start;overflow-y:auto}
.stage>:nth-child(2){margin-top:auto} .stage>:last-child{margin-bottom:auto}
.line-a.small{font-size:clamp(.92rem,3.9vw,1.05rem);line-height:1.5}
.ri.long .r-phrase{font-size:clamp(2.2rem,10vw,3.2rem)}
.ri{overflow:hidden}
.ri.long .legend{display:none}
.ri.long .plist div{padding:.4rem 0;font-size:.86rem;font-weight:500}
.ri.long .intro-t{font-size:.92rem}
.swipe{font:500 .66rem/1 'Geist Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);text-align:center}
@media (max-height:640px){ .r-note{display:none} .legend{display:none} }
@media (prefers-reduced-motion:reduce){ .talking .wave i{animation:none;height:9px} }
</style>

<body>
<header class="header">
  <div class="header-top">
    <a class="back-link" id="back" href="/index.html?openModal=speaking" target="_top">← Speaking</a>
    <div class="header-title"><div class="app-title">INTUITY</div><div class="app-subtitle" id="sub">Speaking · Drills</div></div>
    <span class="header-spacer">Level <b>B2</b></span>
  </div>
</header>

<main id="areas"><div class="ar-in">
  <p class="ar-lead"><b>Pick an area.</b> One phrase per screen: Samara says it, you say it back, then it's <i>your</i> turn to answer. Swipe up for the next one, and replay as often as you like.</p>
  <div id="arList"></div>
</div></main>

<div id="feed" hidden></div>

<script>
(function(){
'use strict';
/* areas with recordings and a reel file; everything else in the library shows as "soon" */
const LIVE = { buying_time:'buying-time', reacting:'reacting', initiating:'initiating', asking_opinion:'asking', justifying:'reasons',
  partly_agreeing:'partly', building_on:'building', negotiating:'deciding', repairing:'repairing' };
/* Recorded in text but not in Samara's voice yet, so not shown (30 Oct 2026):
   comparing:'share', contrasting:'differ', speculating:'guessing', managing_minute:'question',
   describing_one:'onephoto', answering_prompt:'answering' — add back when recorded. */
const KEEP_KEY = 'intuity.speakingKeep';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const markUp = t => esc(t).replace(/\{([^}]*)\}/g, '<mark>$1</mark>');
const plain  = t => String(t).replace(/[{}]/g, '');
function kept(){ try{ return JSON.parse(localStorage.getItem(KEEP_KEY)||'[]'); }catch(e){ return []; } }
function setKept(a){ try{ localStorage.setItem(KEEP_KEY, JSON.stringify(a)); }catch(e){} }

let LIB = null;        /* speaking-phrases.json */
const AREAS = {};      /* id → reel data */

/* ═══ AUDIO — one <audio> element (plays with the iPhone's silent switch on,
   unlike Web Audio); the browser's voice stands in for a missing file ═══ */
const A = new Audio(); A.preload = 'auto';
let unlocked = false, paused = false, ttsVoice = null;
function pickVoice(){ const v = (window.speechSynthesis && speechSynthesis.getVoices()) || [];
  ttsVoice = v.find(x => /en-GB/i.test(x.lang) && /female|samantha|serena|kate|libby|sonia/i.test(x.name)) || v.find(x => /en-GB/i.test(x.lang)) || v.find(x => /^en/i.test(x.lang)) || null; }
if (window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function unlock(){
  if (unlocked) return; unlocked = true;
  A.src = 'data:audio/mp3;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4Ljc2LjEwMAAAAAAAAAAAAAAA//tQxAADB8AhSmxhIIEVCSiJrDCQBTcu3UrAIwUdkRgQbFAZC1CQEwTJ9mjRvBA4UOLD8nKVOWfh+UlK3z/177OXrfOdKl7pyn3Xf//WreyTRUoAWgBgkOAGbZHBgG1OF6zM82DWbZaUmMBptgQhGjsyYqc9ae9XFz280948NMBWInljyzsNRFLPWdnZGWrddDsjK1unuSrVN9jJsK8KuQtQCtMBjCEtImISdNKJOopIpBFpNSMbIHCSRpRR5iakjTiyzLhchUUBwCgyKiweBv/7UsQbg8isVNoMPMjAAAA0gAAABEVFGmgqK////9bP/6XCykxBTUUzLjEwMKqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq';
  A.play().catch(()=>{});
  try{ if (window.speechSynthesis){ const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } }catch(e){}
}
/* plays one line; resolves with how long it took (seconds) */
function say(url, text, tok){
  return new Promise(res => {
    if (tok.dead) return res(0);
    const t0 = performance.now(); let done = false;
    const fin = d => { if (done) return; done = true; tok.stop = null; res(d); };
    const tts = () => {
      if (!window.speechSynthesis || !text){ return fin(1.5); }
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(plain(text)); if (ttsVoice) u.voice = ttsVoice; u.lang = 'en-GB'; u.rate = .95;
      const t1 = performance.now();
      u.onend = u.onerror = () => fin((performance.now()-t1)/1000);
      tok.stop = () => { speechSynthesis.cancel(); fin(0); };
      speechSynthesis.speak(u);
      /* some browsers never fire onend: give up after a generous estimate */
      const est = plain(text).split(/\s+/).length / 2.2 + 3;
      setTimeout(() => { if (!done && !paused) fin(est - 3); }, est*1000);
    };
    A.onended = () => fin(A.duration || (performance.now()-t0)/1000);
    A.onerror = () => { A.onerror = A.onended = null; tts(); };
    tok.stop = () => { A.pause(); A.onended = A.onerror = null; fin(0); };
    A.src = url; A.currentTime = 0;
    A.play().catch(() => { if (!done){ A.onerror = A.onended = null; tts(); } });
  });
}
/* a wait that stands still while paused; prog(0..1) every frame */
function wait(sec, tok, prog, early){
  return new Promise(res => {
    let acc = 0, last = performance.now();
    (function f(now){
      if (tok.dead) return res();
      if (!paused) acc += (now - last)/1000; last = now;
      if (prog) prog(Math.min(1, acc/sec));
      if (acc >= sec || (early && early())) return res();
      requestAnimationFrame(f);
    })(last);
  });
}
const until = tok => new Promise(r => { (function f(){ if (tok.dead || !paused) return r(); setTimeout(f, 120); })(); });
function setPaused(p){
  paused = p;
  if (p){ A.pause(); try{ speechSynthesis.pause(); }catch(e){} }
  else { if (A.src && !A.ended && A.currentTime > 0 && A.onended) A.play().catch(()=>{}); try{ speechSynthesis.resume(); }catch(e){} }
  document.querySelectorAll('.paused-tag').forEach(x => x.hidden = !p);
}

/* ═══ AREAS ═══ */
/* ?part=N (from a Part page's "Drills with Samara" pill) shows only that Part's
   drills; the full list is one tap away. Areas not recorded yet are not shown. */
const PARTQ = +new URLSearchParams(location.search).get('part') || 0;
const PART_PAGE = {1:'part1.html',2:'part2-turn.html',3:'part3-talk.html',4:'part4-views.html'};
const BUILD = [
  {id:'mirror', part:1, href:'mirror.html', h:'Part 1 · Mirroring', p:'Samara asks, you record yourself: answer, reason, example, contrast.'},
  {id:'longturn2',  part:2, h:'Part 2 · The long turn', p:'Similar, different, likely, another possibility: the whole minute, frame by frame.'},
  {id:'discussion3',part:3, h:'Part 3 · The discussion', p:'Start, react, add, decide: two minutes with a partner.'},
  {id:'opinion4',   part:4, h:'Part 4 · Your opinion', p:'Opinion, reason, example, then hand it back.'}];
function drawAreas(){
  const k = kept(), inPart = parts => !PARTQ || (parts||[]).includes(PARTQ);
  let h = '';
  if (PARTQ) h += '<p class="ar-part">Part '+PARTQ+' · drills <a href="drills.html">All drills ›</a></p>';
  if (k.length && !PARTQ) h += '<div class="ar-grid" style="margin-bottom:.4rem"><button class="ac mine" data-area="mine"><h3>My phrases</h3><p>The phrases you kept with ♡, all in one feed.</p><div class="meta"><span class="go">▶ '+k.length+'</span></div></button></div>';
  const b = BUILD.filter(x => inPart([x.part]));
  if (b.length) h += '<div class="ar-cat">Build the answer</div><div class="ar-grid">'+b.map(x =>
    (x.href ? '<a class="ac feat" href="'+x.href+'" style="text-decoration:none">' : '<button class="ac feat" data-area="'+x.id+'">')+
    '<h3>'+x.h+'</h3><p>'+x.p+'</p><div class="meta"><span class="pc">P'+x.part+'</span><span class="go">▶ Start</span></div>'+(x.href ? '</a>' : '</button>')).join('')+'</div>';
  let first = true;
  Object.keys(LIB.categories).forEach(cat => {
    const fns = Object.keys(LIB.functions).filter(id => LIB.functions[id].category === cat && LIVE[id] && inPart(LIB.functions[id].parts));
    if (!fns.length) return;
    if (first){ h += '<div class="ar-cat ar-head">Phrases by area</div>'; first = false; }
    h += '<div class="ar-cat">'+esc(LIB.categories[cat].label)+'</div><div class="ar-grid">';
    fns.forEach(id => {
      const f = LIB.functions[id];
      h += '<button class="ac" data-area="'+LIVE[id]+'"><h3>'+esc(f.label)+'</h3><p>'+esc(f.when||'')+'</p><div class="meta">'+
        (f.parts||[]).map(p=>'<span class="pc">P'+p+'</span>').join('')+'<span class="go">▶ Start</span></div></button>';
    });
    h += '</div>';
  });
  $('#arList').innerHTML = h;
}
$('#arList').addEventListener('click', e => {
  const b = e.target.closest('[data-area]'); if (!b) return;
  unlock(); openArea(b.dataset.area, true);
});

async function loadArea(id){
  if (!AREAS[id]) AREAS[id] = await fetch('/data/drills/speaking/'+id+'.json', {cache:'no-cache'}).then(r => r.json());
  return AREAS[id];
}

/* ═══ FEED ═══ */
let REELS = [], DATA = null, cur = -1, tok = {dead:true}, started = false;
async function openArea(id, push){
  let D;
  if (id === 'mine'){
    const k = kept(); const reels = [];
    for (const area of Object.values(LIVE)){ const d = await loadArea(area);
      d.reels.forEach(r => { if (k.includes(area+':'+r.id)) reels.push(Object.assign({_area:d}, r)); }); }
    D = {id:'mine', title:'My phrases', kicker:'Kept', reels, intro:null, close:null};
  } else {
    D = await loadArea(id); D.reels.forEach(r => r._area = D);
  }
  DATA = D;
  if (push) history.pushState({area:id}, '', '?area='+id);
  $('#areas').hidden = true; $('#feed').hidden = false;
  $('#sub').textContent = 'Drill · ' + D.title;
  $('#back').textContent = '← Areas';
  buildFeed();
}
function closeFeed(){
  stopReel(); cur = -1;
  $('#feed').hidden = true; $('#areas').hidden = false;
  $('#sub').textContent = 'Speaking · Drills'; setHomeBack();
  drawAreas();
}
$('#back').addEventListener('click', e => {
  if (!$('#feed').hidden){ e.preventDefault(); if (history.state && history.state.area) history.back(); else { history.replaceState(null,'',location.pathname); closeFeed(); } }
});
window.addEventListener('popstate', () => {
  const a = new URLSearchParams(location.search).get('area');
  if (a) openArea(a, false); else closeFeed();
});

function meter(n){ return '<span>'+[1,2,3].map(i=>'<b class="'+(i<=n?'f':'')+'"></b>').join('')+'</span>'; }
/* the one-minute shape of Part 2: where this frame sits in it */
const SECS = [['Similarity',18],['Differences',40],['Speculation',42]];
function timeline(cur, secs){ return '<span class="tl" aria-label="'+cur+'">'+(secs||SECS).map(x=>'<i class="'+(x[0]===cur?'on':'')+'" style="flex:'+x[1]+'"><b>'+x[0]+'</b></i>').join('')+'</span>'; }
const STEPS = ['Hear','Say it','Copy','Listen','Your turn','Compare'];

function buildFeed(){
  const D = DATA, F = $('#feed'); let h = '';
  REELS = [];
  if (D.intro){
    REELS.push({kind:'intro'});
    const longList = D.reels.length > 6 || D.reels.some(r => r.p.length > 30);
    h += '<section class="reel" data-i="0"><div class="ri'+(longList?' long':'')+'">'+
      '<div class="r-top"><span class="kick">'+esc(D.kicker)+' · '+D.reels.length+' phrases</span>'+(D.parts||[]).map(p=>'<span class="pc">P'+p+'</span>').join('')+'</div>'+
      '<h1 class="r-title">'+esc(D.title)+'</h1>'+
      '<p class="intro-t">'+esc(D.intro.t)+'</p>'+
      '<div class="plist">'+D.reels.map(r=>'<div>'+esc(r.p)+'<span class="meter">'+meter(r.time)+'</span></div>').join('')+'</div>'+
      '<div class="legend"><span><b>1 · Hear</b>Samara says it</span><span><b>2 · Say it</b>you say it back</span><span><b>3 · Copy</b>copy her answer</span>'+
        '<span><b>4 · Listen</b>a new topic</span><span><b>5 · Your turn</b>now you answer</span><span><b>6 · Compare</b>hear her version</span></div>'+
      '<div class="spacer"></div>'+
      '<div class="r-ctrl"><button class="btn dark" data-start><i class="play-i"></i> Start with Samara</button><span class="swipe" style="margin-left:auto">or swipe ↑</span></div>'+
      '</div></section>';
  }
  const k = kept();
  D.reels.forEach((r, j) => {
    const i = REELS.length; REELS.push({kind:'phrase', r});
    const key = r._area.id+':'+r.id, on = k.includes(key);
    h += '<section class="reel" data-i="'+i+'"><div class="ri">'+
      '<div class="r-top"><span class="kick">'+esc(r._area.title)+' · '+(j+1)+' / '+D.reels.length+'</span>'+
        '<button class="keep'+(on?' on':'')+'" data-keep="'+key+'"><i>'+(on?'♥':'♡')+'</i>'+(on?'Kept':'Keep')+'</button></div>'+
      '<h2 class="r-phrase'+(r.p.length > 26 ? ' longp' : '')+'">'+esc(r.p)+'</h2>'+
      '<div class="r-info">'+(r.sec ? timeline(r.sec, r._area.secs) : '<span class="meter">'+esc(r._area.meterLabel||'Time bought')+' '+meter(r.time)+'</span>')+'<span class="job">'+esc(r.job)+'</span>'+
        (r.sec ? '' : '<span class="mouth">'+(r.mouth==='teen'?'Sounds like you':'Anyone can say it')+'</span>')+'</div>'+
      '<div class="steps">'+STEPS.map(s=>'<div>'+s+'</div>').join('')+'</div>'+
      '<div class="stage" data-stage><div class="tapstart"><button class="btn sage" data-run><i class="play-i"></i> Play</button>Tap to start this phrase</div></div>'+
      '<p class="r-note">'+esc(r.note)+'</p>'+
      '<div class="r-ctrl"><button class="btn" data-again>↻ Again</button><button class="btn next" data-next>Next ↓</button></div>'+
      '</div></section>';
  });
  if (D.minute){
    const m = D.minute, i = REELS.length; REELS.push({kind:'minute', m, D});
    h += '<section class="reel" data-i="'+i+'"><div class="ri">'+
      '<div class="r-top"><span class="kick">'+esc(D.title)+' · the whole answer</span></div>'+
      '<h2 class="r-phrase">'+esc(m.title||'Now the whole minute.')+'</h2>'+
      '<ol class="crib">'+m.crib.map(c=>'<li>'+esc(c)+'</li>').join('')+'</ol>'+
      '<div class="stage" data-stage><div class="tapstart"><button class="btn sage" data-run><i class="play-i"></i> Play</button>'+(D.id==='longturn2'?'New photos. ':'A new task. ')+'Use every frame, in order.</div></div>'+
      '<div class="r-ctrl"><button class="btn" data-again>↻ Again</button><button class="btn next" data-next>Next ↓</button></div>'+
      '</div></section>';
  }
  if (D.close || D.id === 'mine'){
    REELS.push({kind:'close'});
    h += '<section class="reel" data-i="'+(REELS.length-1)+'"><div class="ri">'+
      '<div class="r-top"><span class="kick">'+esc(D.title)+' · done</span></div><div class="spacer"></div>'+
      '<h1 class="r-title">'+(D.reels.length? 'Well done.' : 'Nothing kept yet.')+'</h1>'+
      '<p class="intro-t">'+esc(D.close ? D.close.t : (D.reels.length ? 'Come back tomorrow and say them again.' : 'Tap ♡ on any phrase to keep it here.'))+'</p>'+
      '<div class="spacer"></div>'+
      '<div class="r-ctrl"><button class="btn dark" data-top>↺ From the top</button><button class="btn next" data-areas>Other areas</button></div>'+
      '</div></section>';
  }
  F.innerHTML = h; F.scrollTop = 0; cur = -1;
  IO.disconnect(); F.querySelectorAll('.reel').forEach(s => IO.observe(s));
}

const IO = new IntersectionObserver(es => {
  es.forEach(e => { if (e.isIntersecting && e.intersectionRatio >= .6){ const i = +e.target.dataset.i; if (i !== cur){ cur = i; enter(i); } } });
}, {root: document.getElementById('feed'), threshold:[.6]});

function sec(i){ return document.querySelector('#feed .reel[data-i="'+i+'"]'); }
function goTo(i){ const s = sec(i); if (!s) return; if (i === cur) enter(i); else s.scrollIntoView({behavior:'smooth', block:'start'}); }
function stopReel(){ tok.dead = true; if (tok.stop) tok.stop(); setPaused(false); }

function enter(i){
  stopReel();
  const R = REELS[i];
  if ((R.kind === 'phrase' || R.kind === 'minute') && started) run(i);
  if (R.kind === 'close' && started && DATA.close) { tok = {dead:false}; say(DATA.close && (DATA.close._url || audioUrl(DATA, DATA.close.a)), DATA.close.t, tok); }
}
function audioUrl(D, a){ return (D.audio||'/audio/drills/'+D.id+'/') + a + '.mp3'; }
const exUrl = qa => (qa.charAt(0) === '/' ? '' : '/audio/speaking/') + qa + '.mp3';

function run(i){ return REELS[i].kind === 'minute' ? runMinute(i) : runPhrase(i); }

/* ═══ THE WHOLE MINUTE: new photos, the frames as a crib, sixty seconds, then Samara ═══ */
async function runMinute(i){
  const T = tok = {dead:false, skip:false};
  const s = sec(i), m = REELS[i].m, D = REELS[i].D, stage = s.querySelector('[data-stage]');
  const P = '<span class="paused-tag" hidden>Paused · tap</span>';
  const show = html => { if (!T.dead) stage.innerHTML = P + html; };
  const qb = talking => (m.scene ? '<p class="scene">'+esc(m.scene)+'</p>' : '')+'<div class="blk q'+(talking?' talking':'')+'"><div class="who"><span class="wave"><i></i><i></i><i></i><i></i></span>Examiner</div><p class="line-q">'+esc(m.q)+'</p></div>';
  const go = async fn => { await until(T); if (!T.dead) await fn(); };
  show(qb(true)); await say(exUrl(m.qa), m.q, T); if (T.dead) return;
  const RING = m.ring || 60, C = 2*Math.PI*36;
  const span = RING >= 60 && RING % 60 === 0 ? (RING/60 === 1 ? 'one minute' : RING/60+' minutes') : RING >= 60 ? Math.floor(RING/60)+' min '+(RING%60)+' s' : RING+' seconds';
  show(qb(false)+'<div class="you"><div class="who">Your turn · '+span+'</div>'+
    '<svg class="ring" viewBox="0 0 84 84"><circle class="bg" cx="42" cy="42" r="36"/><circle class="fg" cx="42" cy="42" r="36" stroke-dasharray="'+C+'" stroke-dashoffset="0"/><text x="42" y="50" text-anchor="middle">'+RING+'</text></svg>'+
    '<button class="btn" data-done>I\'ve finished</button></div>');
  const fg = stage.querySelector('.ring .fg'), tx = stage.querySelector('.ring text');
  await wait(RING, T, p => { if (fg){ fg.setAttribute('stroke-dashoffset', (C*p).toFixed(1)); tx.textContent = Math.ceil(RING*(1-p)); } }, () => T.skip); if (T.dead) return;
  /* the model: one Samara turn, or a whole exchange with the partner */
  const parts = m.parts || [{role:'Samara', a:m.a, t:m.t}];
  const blocks = k => (m.scene ? '<p class="scene">'+esc(m.scene)+'</p>' : '') + parts.map((x, j) =>
    '<div class="blk '+(x.role==='Partner'?'q partner':'a')+(j===k?' talking':'')+(k>-1&&j>k?' dim':'')+'"><div class="who"><span class="wave"><i></i><i></i><i></i><i></i></span>'+x.role+'</div>'+
    '<p class="line-a small">'+esc(x.t)+'</p></div>').join('');
  for (let k = 0; k < parts.length; k++){
    show(blocks(k));
    const cur = stage.querySelectorAll('.blk')[k]; if (cur && parts.length > 1) cur.scrollIntoView({block:'nearest'});
    const x = parts[k];
    await go(() => say(x.qa ? exUrl(x.qa) : audioUrl(D, x.a), x.t, T)); if (T.dead) return;
  }
  show(blocks(-1));
}

/* ═══ ONE PHRASE, SIX BEATS ═══ */
async function runPhrase(i){
  const T = tok = {dead:false};
  const s = sec(i), r = REELS[i].r, D = r._area;
  const stage = s.querySelector('[data-stage]'), steps = s.querySelectorAll('.steps div');
  const step = n => steps.forEach((d, k) => { d.className = k < n ? 'done' : (k === n ? 'now' : ''); });
  const P = '<span class="paused-tag" hidden>Paused · tap</span>';
  const who = (cls, label) => '<div class="who"><span class="wave"><i></i><i></i><i></i><i></i></span>'+label+'</div>';
  const blkQ = (e, talking) => (e.scene ? '<p class="scene">'+esc(e.scene)+'</p>' : '') +
    '<div class="blk q'+(e.role==='Partner'?' partner':'')+(talking?' talking':'')+'">'+who('q', e.role||'Examiner')+'<p class="line-q">'+esc(e.q)+'</p></div>';
  const blkA = (t, talking, dim) => '<div class="blk a'+(talking?' talking':'')+(dim?' dim':'')+'">'+who('a','Samara')+'<p class="line-a">'+markUp(t)+'</p></div>';
  const show = html => { if (!T.dead) stage.innerHTML = P + html; };
  const echo = async (label, big, secs) => {
    show('<div class="you">'+'<div class="who">You · '+label+'</div><p class="big">'+big+'</p><div class="bar"><i></i></div></div>');
    const bar = stage.querySelector('.bar i');
    await wait(secs, T, p => { if (bar) bar.style.width = (p*100)+'%'; });
  };
  const go = async fn => { await until(T); if (!T.dead) await fn(); };
  const ex = r.ex;

  /* 1 Hear */
  const bt = r.bt || r.p.replace(/\s*…$/,'');
  step(0); show(blkA('{'+bt+'}', true));
  let d = await say(audioUrl(D, r.bare), bt, T); if (T.dead) return;
  /* 2 Say it */
  step(1); await go(() => echo('say it back', '<mark>'+esc(bt)+'</mark>', Math.max(1.6, d*1.5 + .5))); if (T.dead) return;
  /* 3 Copy */
  step(2); show(blkQ(ex[0], true)); await go(() => say(exUrl(ex[0].qa), ex[0].q, T)); if (T.dead) return;
  show(blkQ(ex[0]) + blkA(ex[0].t, true)); d = await say(audioUrl(D, ex[0].a), ex[0].t, T); if (T.dead) return;
  await go(() => echo('copy her answer', markUp(ex[0].t), Math.max(2.5, d*1.15 + .8))); if (T.dead) return;
  /* 4 Listen */
  step(3); show(blkQ(ex[1], true)); await go(() => say(exUrl(ex[1].qa), ex[1].q, T)); if (T.dead) return;
  show(blkQ(ex[1]) + blkA(ex[1].t, true)); await go(() => say(audioUrl(D, ex[1].a), ex[1].t, T)); if (T.dead) return;
  await go(() => wait(.6, T)); if (T.dead) return;
  /* 5 Your turn */
  step(4); show(blkQ(ex[2], true)); await go(() => say(exUrl(ex[2].qa), ex[2].q, T)); if (T.dead) return;
  const RING = D.ring || 8, C = 2*Math.PI*36;
  show(blkQ(ex[2]) + '<div class="you"><div class="who">Your turn · start with</div><p class="big"><mark>'+esc(r.p)+'</mark></p>'+
    '<svg class="ring" viewBox="0 0 84 84"><circle class="bg" cx="42" cy="42" r="36"/><circle class="fg" cx="42" cy="42" r="36" stroke-dasharray="'+C+'" stroke-dashoffset="0"/><text x="42" y="50" text-anchor="middle">'+RING+'</text></svg></div>');
  const fg = stage.querySelector('.ring .fg'), tx = stage.querySelector('.ring text');
  await wait(RING, T, p => { if (fg){ fg.setAttribute('stroke-dashoffset', (C*p).toFixed(1)); tx.textContent = Math.ceil(RING*(1-p)); } }); if (T.dead) return;
  /* 6 Compare */
  step(5); show(blkQ(ex[2]) + blkA(ex[2].t, true)); await go(() => say(audioUrl(D, ex[2].a), ex[2].t, T)); if (T.dead) return;
  steps.forEach(x => x.className = 'done');
  show(blkQ(ex[2]) + blkA(ex[2].t, false) + '<div class="swipe">Swipe ↑ for the next phrase · ↻ to go again</div>');
}

/* ═══ TAPS & KEYS ═══ */
document.getElementById('feed').addEventListener('click', e => {
  const t = e.target;
  if (t.closest('[data-start]')){ unlock(); started = true; stopReel(); tok = {dead:false}; const T = tok;
    say(audioUrl(DATA, DATA.intro.a), DATA.intro.t, T).then(() => { if (!T.dead) goTo(1); }); return; }
  const kb = t.closest('[data-keep]');
  if (kb){ const k = kept(), key = kb.dataset.keep, ix = k.indexOf(key);
    if (ix > -1) k.splice(ix, 1); else k.push(key); setKept(k);
    const on = ix < 0; kb.classList.toggle('on', on); kb.innerHTML = '<i>'+(on?'♥':'♡')+'</i>'+(on?'Kept':'Keep'); return; }
  if (t.closest('[data-run]') || t.closest('[data-again]')){ unlock(); started = true; const i = +t.closest('.reel').dataset.i; stopReel(); cur = i; run(i); return; }
  if (t.closest('[data-next]')){ goTo(+t.closest('.reel').dataset.i + 1); return; }
  if (t.closest('[data-done]')){ tok.skip = true; return; }
  if (t.closest('[data-top]')){ goTo(DATA.intro ? 1 : 0); return; }
  if (t.closest('[data-areas]')){ history.back(); return; }
  if (t.closest('[data-stage]') && !tok.dead){ setPaused(!paused); }
});
document.addEventListener('keydown', e => {
  if ($('#feed').hidden) return;
  if (e.key === 'ArrowDown' || e.key === 'PageDown'){ e.preventDefault(); goTo(Math.min(REELS.length-1, cur+1)); }
  else if (e.key === 'ArrowUp' || e.key === 'PageUp'){ e.preventDefault(); goTo(Math.max(0, cur-1)); }
  else if (e.key === ' '){ e.preventDefault(); if (!tok.dead) setPaused(!paused); }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && !tok.dead) setPaused(true); });

function setHomeBack(){ const b = $('#back');
  if (PARTQ){ b.textContent = '← Part '+PARTQ; b.href = '/skills/speaking/'+PART_PAGE[PARTQ]; }
  else { b.textContent = '← Speaking'; b.href = '/index.html?openModal=speaking'; } }
setHomeBack();
/* ═══ START ═══ */
fetch('/skills/speaking/data/speaking-phrases.json', {cache:'no-cache'}).then(r => r.json()).then(L => {
  LIB = L; drawAreas();
  const a = new URLSearchParams(location.search).get('area');
  if (a) openArea(a, false);
});
})();
</script>
