/* ═══════════════════════════════════════════════════════════════════════
   SPEAKING IN FIVE  ·  v1 (22 Nov 2026) — Writing's "in five", said aloud

   The same page as skills/writing/five.html, for a Speaking Part: five
   moves, one sentence each, the school's frames first (Maya's drills), on
   the same five-step ladder, checked by the app, one step a day. What is
   new is the mouth: every card can be heard (Maya), and after a right
   answer the pupil can say it and hear himself next to her. Saying is
   never marked, never stored, never required: knowing the phrase is
   checked, speaking it stays private. My answer is the five said as one
   answer, with a clock that shows the target length and nothing else.
   Content: data/speaking/five/part<N>.json (tools/build-speaking-five.py).
   Below: the Writing blueprint's notes, which all still hold.

   YOUR REVIEW IN FIVE  ·  v3 (5 Nov 2026) — the blueprint for every task

   Michael: "A kid feels he has learned the type if he can make up a mental
   model in his head: one introduction, three body phrases, one
   recommendation." Five slots, never more. For a 14-year-old on his own,
   with no teacher in the room:

   THE GATE gives him something to do in one second: the pendulum says START (6 Nov: "Start" tells him what happens; "tap" only names the gesture).
   TAP. One line (5 sentences. 1 review.), five progress circles, nothing
   to read first. His subject (a game, a series…) is the header's filter
   row; the name of his game is the first card, one tap on a chip.

   THE LADDER (v3, Michael: "why assume that clicking a pill teaches the
   whole phrase?"). Each slot meets its WHOLE phrase on five steps, the
   support taken away one step at a time (vanishing cues):
       1 Select       which one does this job?
       2 Match        the first half, and the end that fits
       3 Sort         the pieces in order
       4 Fill         three words gone, first letters given, typed
       5 Memory       only the job shown: he writes the whole phrase
   One card per slot per session, at that slot's step, so a session is five
   quick cards and mixes the activities by itself. A slot climbs one step a
   day at most (the spacing is in the game); a miss drops it one step, not
   to the start. Done from memory on a later day = the slot is HIS: it can
   then change its wording. After a right answer on a phrase with a “…”, he
   finishes it his own way, and My review shows his own sentences.
   The app checks everything itself: no "I knew it" buttons.

   Built from INTUITY's parts: the writing header (writing-chrome.js), the
   pendulum, the Challenge's focus card, the stage pill (Practise · My
   review). Every answer joins the review deck (Be2). All on this device.
   Content: data/writing/five/<task>.json.
   ═══════════════════════════════════════════════════════════════════════ */

.gate .lead{max-width:21rem;margin:.5rem auto 0;font-size:.95rem;line-height:1.45;color:#5C5852}
.f5card{--c:#708A81;max-width:24rem;margin:1rem auto 0;text-align:left;background:#fff;padding:16px 18px 10px;box-shadow:0 2px 10px rgba(0,0,0,.08)}

.f5t{font:800 1.45rem/1 'Geist',system-ui,sans-serif;text-transform:uppercase;letter-spacing:.01em;color:var(--c)}
.f5t small{display:block;margin-top:6px;font-size:.66rem;font-weight:700;letter-spacing:.16em;color:#8A8378}
.f5n{flex:none;width:38px;height:38px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font:700 1.05rem/1 'Geist',sans-serif}
.f5spine{list-style:none;margin:0;padding:0 0 0 34px;position:relative}
.f5spine::before{content:'';position:absolute;left:12px;top:8px;bottom:10px;width:2px;background:var(--c);opacity:.75}
.f5spine li{position:relative;display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:8px;min-height:26px;padding:0 0 9px}
.f5spine li:last-child{padding-bottom:4px}
.f5d{position:absolute;left:-34px;top:0;width:26px;height:26px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font:600 .66rem/1 'Geist Mono',ui-monospace,monospace}
.f5k{grid-column:1;font:700 .64rem/1.2 'Geist',sans-serif;letter-spacing:.17em;text-transform:uppercase;color:#6B645C}
.f5j{grid-column:1;font:500 .98rem/1.3 'Geist',sans-serif;color:#3A3530}
.f5p{grid-column:2;align-self:center;font:600 9px/1 'Geist Mono',monospace;letter-spacing:.14em;color:#B2AA9E;white-space:nowrap}
.f5p.own{color:#4A6B5C;letter-spacing:.06em;font-size:11px}
.f5foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #CFC8BC;margin-top:8px;padding-top:8px;font:600 .62rem/1 'Geist',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#6B645C}
.f5foot .how{margin:0;font:inherit;letter-spacing:.06em;text-transform:none;font-size:.86rem}

/* ── the focus card (the Challenge's tiles) ── */
.kick{display:flex;align-items:center;gap:9px;font-family:var(--f-mono);font-size:0.6875rem;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-ink,#8A5A35)}

ol.pv{list-style:none;margin:.9rem 0 0;padding:0}
ol.pv li{padding:.6rem 0;border-top:1px solid rgba(20,17,14,.1)}
ol.pv small{display:block;font:500 .625rem/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:#9A5A2C;margin-bottom:4px}
ol.pv span{font-size:1rem;line-height:1.5}
.scrim{position:fixed;inset:0;z-index:900;display:flex;align-items:center;justify-content:center;padding:1rem;
  background:rgba(20,17,14,.34);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;transition:opacity .25s}
.scrim.on{opacity:1}
.focus{position:relative;width:min(33rem,100%);max-height:calc(100dvh - 1.25rem);overflow-y:auto;background:var(--f5-card);border-radius:var(--r-box,4px);
  box-shadow:0 24px 60px -18px rgba(20,17,14,.38),0 6px 16px rgba(20,17,14,.14);padding:1.5rem 1.4rem 1.3rem;
  transform:translateY(24px) scale(.97);transition:transform .45s cubic-bezier(.2,1.3,.4,1)}
.scrim.on .focus{transform:none}
.focus .x{position:absolute;top:.8rem;right:.9rem;border:none;background:none;font-size:1rem;color:var(--f5-faint);cursor:pointer;padding:.4rem}
.focus h2{font-family:'Anton',Impact,var(--f-display),sans-serif;font-weight:400;font-size:clamp(1.6rem,6vw,2.05rem);line-height:1.02;color:var(--ink);margin:.45rem 0 .2rem;text-transform:uppercase}

.steps5{display:flex;gap:4px;margin:.75rem 0 0}
.steps5 i{flex:1;height:4px;background:rgba(20,17,14,.1)} .steps5 i.on{background:var(--f5-car)} .steps5 i.now{background:var(--ink)}
.aim{font-size:.88rem;line-height:1.45;color:var(--f5-dim);margin:.9rem 0 0;padding-left:.7rem;border-left:3px solid var(--f5-car)}
.aim .new{display:inline-block;font:700 .58rem/1 var(--f-mono);letter-spacing:.12em;background:var(--ink);color:var(--f5-card);padding:.25rem .4rem;border-radius:3px;margin-right:.4rem;vertical-align:.1em}
.line{font-family:var(--f-display);font-weight:600;font-size:1.12rem;line-height:1.6;color:var(--ink);margin:.9rem 0 .4rem}
.nm{background:rgba(194,149,110,.26);padding:0 .2em;border-radius:3px}
.gap{display:inline-block;min-width:2.6em;border-bottom:2px dotted #9A5A2C;height:1em;vertical-align:-.15em}

.btn.fill{background:var(--ink);color:var(--f5-card)}
.btn:disabled{opacity:.35;cursor:default}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.cta{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1rem}

.fb b.yes{color:var(--f5-ok)} .fb b.no{color:var(--f5-no)}
.fb .full{display:block;margin:.35rem 0 0;font-family:var(--f-display);font-weight:600}

/* 1 Select · 2 Match: answer rows (the Challenge's) */
.opts{display:flex;flex-direction:column;margin:.6rem 0 0}
.opt{display:flex;align-items:flex-start;gap:.8rem;text-align:left;padding:.75rem .2rem;border:none;border-bottom:1px solid var(--f5-rule);background:none;
  font:inherit;font-size:.96rem;line-height:1.5;color:var(--ink);cursor:pointer}
.opt .l{flex:none;width:24px;height:24px;border-radius:50%;background:rgba(20,17,14,.07);display:grid;place-items:center;font:600 .6875rem var(--f-mono);color:var(--f5-faint);margin-top:.05rem}

.opt.no{background:rgba(180,83,47,.08)} .opt.no .l{background:var(--f5-no);color:#fff}

/* 3 Sort: the sentence builds as he taps */
.built{min-height:3.2em;border-bottom:1.5px solid var(--ink);padding:.2rem 0 .5rem}
.built .pc{display:inline;font-family:var(--f-display);font-weight:600;font-size:1.08rem;line-height:1.7;color:var(--ink)}
.built .pc + .pc::before{content:' '}
.pool{display:flex;flex-wrap:wrap;gap:.45rem;margin:.9rem 0 0}

/* 4 Fill: the boxes sit in the sentence */
.line input.w{font:inherit;color:var(--ink);border:0;border-bottom:2px solid var(--ink);background:rgba(194,149,110,.12);border-radius:3px 3px 0 0;padding:0 .2em;
  text-align:center;outline:none;min-width:2.5em;box-sizing:content-box;font-size:1em}
.line input.w:focus{background:rgba(194,149,110,.25)}

<script>
(function(){
'use strict';
const P=new URLSearchParams(location.search);
const PN=Math.max(1,Math.min(4,+(P.get('part')||1)||1)), TASK='part'+PN;
const NW=()=>(['','one','two','three','four','five','six'][D.slots.length]||D.slots.length);
const KEY='be2.sfive.'+TASK+'.v2';   /* 25 Nov 2026: the moves are the blueprint's now; old progress was on other moves */
const PAGE={1:'part1.html',2:'part2-turn.html',3:'part3-talk.html',4:'part4-views.html'}[PN];
{ const b=document.getElementById('back'); b.href='/skills/speaking/test.html?part='+PN;   /* 23 Nov 2026: back to the Part's practice */ b.textContent='← Part '+PN;
  document.getElementById('sub').textContent='Speaking · Part '+PN;
  /* Learn it's tabs, as Writing's Basics · Guided · Build · Cards (22 Nov 2026) */
  /* 24 Nov 2026: the bottom is the Part's footer (tools/speaking-foot.js); this page's own modes
     (Basics · Practise · My answer) sit in the header, as other pages keep theirs */
  { const st=document.querySelector('.wr-foot .wr-stages'), roof=document.getElementById('roof'); if(st&&roof){ roof.replaceWith(st); st.classList.add('sp-modes'); const wf=document.querySelector('.wr-foot'); if(wf) wf.remove(); } }
  if(false) document.getElementById('roof').innerHTML='<span class="mode-btn active" aria-current="page">Basics</span>'+
    '<a class="mode-btn" href="/skills/speaking/useful-expressions.html?part='+PN+'&view=list">Phrases</a>'+
    '<a class="mode-btn" href="/skills/speaking/'+PAGE+'?stage=explore">Models</a>'; }
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>{ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const sfx=k=>{ try{ if(window.SFX&&SFX[k]) SFX[k](); }catch(e){} };
/* 8 Nov 2026: the Board games' glitter and fireworks, after the card has drawn (tools/intuity-cheer.js) */
const cheer=(how,sel)=>setTimeout(()=>{ try{ if(!window.Cheer) return; const el=document.querySelector(sel||'#fTitle');
  if(how==='big') Cheer.finale(); else if(how==='done') Cheer.done(el); else Cheer.right(el); }catch(e){} },60);
const load=()=>{ try{ return JSON.parse(localStorage.getItem(KEY)||'null')||{}; }catch(e){ return {}; } };
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(ST)); }catch(e){} };
let D, ST, MODE='practise', at=0, res=[];

const STEP=[null,
  {k:'select',name:'Select',how:'Tap the sentence that does this job.'},
  {k:'match', name:'Match',how:'Tap the end that fits.'},
  {k:'sort',  name:'Sort', how:'Tap the pieces in the right order.'},
  {k:'fill',  name:'Fill the gaps',how:'Type the missing words. The first letter is your clue.',howTap:'Tap the missing words in order. The first letter is your clue.'},
  {k:'memory',name:'From memory',how:'Write the sentence you have been learning, from memory. Only its job is shown.',howTap:'Build the whole sentence. Two pieces don’t belong.'}];
/* NO KEYBOARD (v4, 5 Nov): for students who won't type on a phone, Fill and
   From memory are tapped, still checked by the app: Fill offers three words
   for each gap (same first letter where it can), From memory builds the
   sentence from its pieces with two that don't belong. ?tap=1 or the switch
   in How it works; remembered on this device. */
const howOf=(st,r)=>ST.tap&&st.howTap?st.howTap:st.how;
/* A NEW KID'S CARD (7 Nov 2026): the kicker says which sentence ("Sentence 3
   of 5 · Second reason"), the title is the question itself (Select) or what
   to do, a small line names the step, and the instruction shows only the
   first time a step appears. Before, a card said "3 · REASON / SELECT",
   two different "of 5" bars, and the same instruction twice. */
const LB=i=>D.slots[i].label||D.slots[i].part;
const STEPT={select:null,match:'Which end fits?',sort:'Put it in order',fill:'Fill the gaps',memory:'Say it from memory'};
const STEPV={select:'pick it',match:'match it',sort:'order it',fill:'fill it',memory:'say it from memory'};
let PRACTICE=false;   /* "Practise anyway": a round that does not move the steps */

/* ── state ── */
function SUB(){ return D.subjects.find(s=>s.key===ST.key)||D.subjects[0]; }
function name(){ return (ST.names&&ST.names[ST.key])||''; }
function X(){ return name()||SUB().eg; }
function slot(i){ ST.slots=ST.slots||[]; const s=ST.slots[i]=ST.slots[i]||{}; if(!s.rung) s.rung=1; return s; }
function way(i){ const s=slot(i); return s.pick==='own'?null:D.slots[i].ways[typeof s.pick==='number'?s.pick:0]; }
function ideas(){ ST.ideas=ST.ideas||{}; return ST.ideas[ST.key]=ST.ideas[ST.key]||{}; }

/* a wording, filled for HIS thing */
function fill(w){ const s=SUB(); return w.t.replace(/\{a\}/g,s.a).replace(/\{plural\}/g,s.plural).replace(/\{X\}/g,X()); }
const body=t=>t.replace(/\s*…\s*$/,'').trim();          /* the phrase without its open end */
const open=t=>/…\s*$/.test(t);
/* to HTML: the name boxed, the open end a dotted gap (or his idea) */
function html(t,idea){
  let h=esc(t); const n=esc(X());
  if(n) h=h.split(n).join('<span class="nm">'+n+'</span>');
  return h.replace(/…\s*$/,idea?'<span class="idea">'+esc(idea)+'</span>':'<span class="gap"></span>');
}
/* the phrase in pieces: words, with his thing's name kept as one piece */
function tokens(t){ const n=X(); return body(t).split(n).map((p,i,a)=>p.trim().split(/\s+/).filter(Boolean).concat(i<a.length-1?['\u0001'+n]:[])).flat(); }
const shown=w=>w.charAt(0)==='\u0001'?w.slice(1):w;
const norm=s=>String(s).toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' ]+/g,' ').replace(/\s+/g,' ').trim();
function lev(a,b){ const m=a.length,n=b.length; if(Math.abs(m-n)>1) return 2; const d=[...Array(n+1).keys()];
  for(let i=1;i<=m;i++){ let p=d[0]; d[0]=i; for(let j=1;j<=n;j++){ const t=d[j]; d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1)); p=t; } } return d[n]; }
const near=(a,b)=>{ a=norm(a); b=norm(b); return a===b||(b.length>4&&lev(a,b)<=1); };

/* ── the header's filter row: the subjects ── */
function tabs(){
  $('subj').innerHTML=D.subjects.map(s=>'<button type="button" class="ftab'+(s.key===ST.key?' active':'')+'" role="tab" aria-selected="'+(s.key===ST.key)+'" data-k="'+s.key+'">'+esc(s.label.replace(/^An? /,''))+'</button>').join('');
  $('subj').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{ ST.key=b.dataset.k; save(); tabs(); paint(); });
}

/* ── PRACTISE: the gate ── */
function climbable(){ return D.slots.filter((_,i)=>{ const s=slot(i); return s.rday!==today(); }).length; }
function gate(){
  const tot=D.slots.reduce((a,_,i)=>a+(slot(i).own?5:slot(i).rung-1),0), started=ST.slots&&ST.slots.some(x=>x&&(x.rung>1||x.own));
  document.documentElement.style.setProperty('--mark-pct',Math.max(4,tot/25*100)+'%');
  const c=climbable();
  $('stage').innerHTML='<section class="gate">'+
    /* 28 Nov 2026 (the owner): no START dial here, nothing to decide; the pendulum is only for a decision.
       The page opens on the card; "Learn them" under it starts the climb */
    /* 19 Nov 2026 (the owner, after 12 pupils found this screen unclear): the five sentences are shown
       as a Cards card (the same caramel spine, numbered dots and part labels), so the screen looks
       familiar and says what each sentence is for; one line says what to do */
    '<p class="lead">One sentence for each move. Learn all '+NW()+', and you can answer any '+esc(D.name)+' question.</p>'+
    '<div class="f5subs" role="tablist" aria-label="Topic">'+D.subjects.map(x=>'<button type="button" role="tab" aria-selected="'+(x.key===ST.key)+'" class="'+(x.key===ST.key?'on':'')+'" data-sub="'+x.key+'">'+esc(x.label.replace(/^(An?|The) /,''))+'</button>').join('')+'</div>'+
    '<button type="button" class="f5pick'+(name()?'':' none')+'" id="chg"><small>Topic</small><b>'+esc(name()||'Choose one')+'</b><i aria-hidden="true">▾</i></button>'+
    '<button type="button" class="go" id="dial">Learn them ›</button>'+
    '<div class="f5card" aria-label="Your five moves"><div class="f5top"><div class="f5t">'+esc(D.name)+'<small>'+esc(D.part||'')+' · in '+NW()+' moves</small></div><span class="f5n">'+D.slots.length+'</span></div>'+
    '<ol class="f5spine">'+D.slots.map((sl,i)=>{ const s=slot(i);
      /* one line a row (19 Nov, the owner: "a bit tense"): the part's name is enough, its job is its title */
      return '<li title="'+esc((sl.job||'').replace(/^./,c=>c.toUpperCase()))+'"><span class="f5d">'+String(i+1).padStart(2,'0')+'</span><span class="f5j">'+esc(sl.label||sl.part)+'</span>'+
        '<span class="f5p'+(s.own?' own':'')+'">'+(s.own?'✓ yours':'●'.repeat(s.rung-1)+'○'.repeat(6-s.rung))+'</span></li>'; }).join('')+'</ol>'+
    '<div class="f5foot"><span>About 2 minutes</span><button type="button" class="how" id="how">How it works</button></div></div>'+
    (started?'<p class="today">'+(c?'Today '+c+' can climb a step':'All climbed today. They climb again tomorrow.')+'</p>'+(c?'':'<button type="button" class="how" id="again">Practise anyway</button>'):'')+
    '</section>';
  $('dial').onclick=()=>start(!c&&started); $('how').onclick=how;
  if($('chg')) $('chg').onclick=()=>{ PRACTICE=false; at=0; res=[]; askName(); };
  $('stage').querySelectorAll('.f5subs [data-sub]').forEach(b=>b.onclick=()=>{ if(b.dataset.sub===ST.key) return; ST.key=b.dataset.sub; save(); sfx('pop'); tabs(); paint(); });
  { const on=$('stage').querySelector('.f5subs .on'), tr=$('stage').querySelector('.f5subs'); if(on&&tr) tr.scrollLeft=on.offsetLeft-(tr.clientWidth-on.offsetWidth)/2; }
  if($('again')) $('again').onclick=()=>start(true);
}
function how(){
  card('<div class="kick">How it works</div><h2 id="fTitle">'+D.slots.length+' moves, 5 steps</h2>'+
    '<p class="aim">'+(D.how?esc(D.how):'A review in five sentences: one to open it, two features, one drawback, one to recommend it. All about your own '+esc(SUB().a.replace(/^an? /,''))+'.')+'</p>'+
    '<p class="aim">Each sentence climbs five steps: select it, match its halves, sort its pieces, fill its gaps, then build it from memory. The app checks each one.</p>'+
    '<p class="aim">After each card: ▶ to hear it, ● to say it yourself and hear the two side by side. Nothing is kept.</p>'+
    '<p class="aim">The last step is said, not tapped: your phone’s dictation listens and shows the words you got. Say it from memory on a new day, and it’s yours ✓.</p>'+
    '<label class="kb"><input type="checkbox" id="kb"'+(ST.tap?'':' checked')+'> Type my answers <small>(off: tap only)</small></label>'+
    (SR?'<label class="kb"><input type="checkbox" id="vc"'+(ST.voice===false?'':' checked')+'> Say the last step <small>(off: build it)</small></label>':'')+
    '<div class="cta"><button type="button" class="btn fill" id="ok">Got it</button></div>');
  $('kb').onchange=()=>{ ST.tap=!$('kb').checked; save(); };
  if($('vc')) $('vc').onchange=()=>{ ST.voice=$('vc').checked; save(); };
  $('ok').onclick=close;
}

/* ── the focus card ── */
function card(h){ $('focus').innerHTML='<button class="x" type="button" aria-label="Close" id="fx">✕</button>'+h;
  const s=$('scrim'); if(s.hidden){ s.hidden=false; requestAnimationFrame(()=>s.classList.add('on')); } $('fx').onclick=close; $('focus').scrollTop=0; }
/* ONE SCREEN: step the card down until nothing scrolls (watches every change to it) */
function fitFocus(){ const f=$('focus'); if(!f) return; f.classList.remove('fit1','fit2','fit3','fit4');
  for(const k of ['fit1','fit2','fit3','fit4']){ if(f.scrollHeight<=f.clientHeight+1) break; f.classList.add(k); } }
{ let q=0; new MutationObserver(()=>{ if(q) return; q=requestAnimationFrame(()=>{ q=0; fitFocus(); }); }).observe(document.getElementById('focus'),{childList:true,subtree:true}); }
addEventListener('resize',()=>fitFocus());
function close(){ const s=$('scrim'); s.classList.remove('on'); setTimeout(()=>{ s.hidden=true; paint(); },250); }
function head(i,r){
  const st=STEP[r], seen=(ST.seen=ST.seen||{})[st.k];
  const qt=!STEPT[st.k];   /* Select: the title is the question, in sentence case */
  return '<div class="kick">'+(i+1)+' of '+D.slots.length+' · '+esc(LB(i))+'</div><h2 id="fTitle"'+(qt?' class="fq"':'')+'>'+esc(STEPT[st.k]||D.slots[i].q||st.name)+'</h2>'+
    '<div class="steps5" aria-label="Step '+r+' of 5">'+[1,2,3,4,5].map(k=>'<i class="'+(k<r?'on':k===r?'now':'')+'"></i>').join('')+'</div>'+
    '<p class="stepl">Step '+r+' of 5 · '+esc(STEPV[st.k])+(PRACTICE?' · practice':'')+'</p>'+
    (seen?'':'<p class="aim"><span class="new">NEW</span>'+esc(howOf(st,r))+'</p>')+
    (r===1||r===5?exq():'');
}
/* the examiner's question: on the first and last step, tap to hear it */
function qText(){ return String(SUB().q||'').replace(/\{X\}/g,X()); }
function exq(){ return '<button type="button" class="exq" data-say="q"><i>Examiner</i><span>'+esc(qText())+'</span></button>'; }
/* ── VOICE (22 Nov 2026): Maya through the browser's voice (recordings, where they exist, via be2-voice.js) ── */
function say(t,then){ try{ const S=window.speechSynthesis; if(!S){ then&&then(); return; } S.cancel();
  const u=new SpeechSynthesisUtterance(String(t).replace(/…/g,'')); u.lang='en-GB'; u.rate=.95;
  const v=(S.getVoices()||[]).filter(x=>/en-GB/i.test(x.lang)); const f=v.find(x=>/female|libby|sonia|serena|kate|martha/i.test(x.name))||v[0]; if(f) u.voice=f;
  let fired=false; const fin=()=>{ if(fired) return; fired=true; then&&then(); }; u.onend=fin; u.onerror=fin; S.speak(u);

       another wording of the same sentence is not a mistake. It earns no step, but loses none either */
    const lcs=(a,b)=>{ const M=Array(a.length+1).fill(0).map(()=>Array(b.length+1).fill(0));
      for(let i=a.length-1;i>=0;i--) for(let j=b.length-1;j>=0;j--) M[i][j]=near(b[j],a[i])?1+M[i+1][j+1]:Math.max(M[i+1][j],M[i][j+1]); return M[0][0]; };
    const frames=D.slots[at].ways.filter(o=>o!==w).map(o=>body(fill(o)).split(/…/)[0]).concat(bankFrames(D.slots[at].label||D.slots[at].part));
    const alt=!ok&&frames.some(f=>{ const fr=norm(f).split(' ').filter(Boolean); return fr.length>=3&&lcs(fr,got)/fr.length>=.85; });
    result(ok,w,r,ok&&hit.filter(Boolean).length===want.length?null:shownW.map((x,i)=>hit[i]?esc(x):'<mark>'+esc(x)+'</mark>').join(' '),alt);
  };
}
/* his own sentence (a slot he chose to write his own way) */
function ownSentence(){
  card('<div class="kick">'+(at+1)+' of '+D.slots.length+' · '+esc(LB(at))+'</div><h2 id="fTitle">Your own</h2><p class="aim">Write your own sentence. It must '+esc(D.slots[at].job)+'.</p>'+
    '<textarea class="wr" id="mem" rows="3" placeholder="Your sentence">'+esc((ideas()['own'+at])||'')+'</textarea><div class="cta"><button type="button" class="btn fill" id="chk">Save</button><button type="button" class="btn" id="back">Choose a wording</button></div>');
  $('chk').onclick=()=>{ const v=$('mem').value.trim(); if(v.split(/\s+/).length<5){ $('mem').focus(); return; } ideas()['own'+at]=v; save(); res[at]=true; sfx('correct'); at++; next(); };
  $('back').onclick=()=>{ delete slot(at).pick; save(); next(); };
}

/* ── the result of a card: climb or drop, then his own idea ── */
/* the Phrases bank's openers for the job this sentence does (20 Nov 2026): a pupil who writes one of
   those has written a good sentence, just not the one he is learning */
let BANKJ=null;   /* Writing's phrase bank; Speaking's other wordings are the slot's own */
function bankFrames(label){
  if(!BANKJ) return [];
  const T={essays:'essay',emails:'email',articles:'article',reviews:'review',reports:'report',story:'story'}[TASK];
  const MAP=[[/intro|open|start|scene|greet|hook/i,['start','open-email','opinion','reader']],[/reason|feature|point|detail|body|idea|request|first|second/i,['reason','add','opinion','good','example','ask','people']],
    [/other side|drawback|against|problem|downside/i,['contrast','bad']],[/conclu|recommend|verdict|ending|sign|close|finish/i,['finish','recommend','signoff']]];
  const ids=[...new Set(MAP.filter(m=>m[0].test(label)).map(m=>m[1]).flat())];
  return BANKJ.jobs.filter(j=>ids.indexOf(j.id)>=0).map(j=>j.phrases.filter(p=>p.for.indexOf(T)>=0).map(p=>p.t.replace(/\[|\]/g,'').split('…')[0])).flat();
}
function result(ok,w,r,diff,alt){
  const s=slot(at), t=today(); let line;
  const r0=s.rung, rd0=s.rday, own0=s.own;   /* restored after a practice round */
  (ST.seen=ST.seen||{})[STEP[r].k]=1;
  if(ok){
    if(r===5&&!s.own&&s.rday!==t){ s.own=true; s.rday=t; line='<b class="yes">It’s yours ✓</b> You '+(SAID?'said':'wrote')+' it from memory.'; sfx('fanfare'); cheer('big'); }
    else if(!s.own&&s.rday!==t&&s.rung<5){ s.rung++; s.rday=t; line='<b class="yes">Yes!</b> Up to step '+s.rung+': '+esc(STEP[s.rung].name.toLowerCase())+', tomorrow.'; sfx('correct'); cheer('right','.yes'); }
    else { line='<b class="yes">Yes!</b> '+(s.own?'Still yours.':r===5?'Do it again on another day and it’s yours.':'Already climbed today. Tomorrow it goes up.'); sfx('correct'); cheer('right','.yes'); }
  } else if(alt){
    line='<b class="yes">Good sentence.</b> That one works too, but it isn’t the one you’re learning, so your step stays. Yours is:<span class="full">'+(diff||html(fill(w)))+'</span>'; sfx('pop');
  } else {
    const drop=!s.own&&s.rung>1; if(drop) s.rung--;
    /* Select and Match already show the right one in green */
    line='<b class="no">Not yet.</b> '+(drop?'Back to step '+s.rung+'. ':s.own?'':'It comes back tomorrow. ')+(r<=2?'':'Here it is:<span class="full">'+(diff||html(fill(w)))+'</span>'); sfx('wrong');
  }
  if(PRACTICE){ s.rung=r0; s.rday=rd0; s.own=own0;
    line=(ok?'<b class="yes">Yes!</b> ':'<b class="no">Not yet.</b> '+(r<=2?'':'Here it is:<span class="full">'+(diff||html(fill(w)))+'</span> '))+'Practice round: your steps stay as they are.'; }
  save(); res[at]=ok;
  try{ Be2.answer('speaking-five-'+TASK,{id:'s'+(at+1)+'-'+D.slots[at].ways.indexOf(w),correct:ok,keep:true,kind:'recall',
    prompt:fill(w).replace(new RegExp('\\b'+w.hide+'\\b'),w.hide[0]+'___'),answer:fill(w),href:'/skills/speaking/five.html?part='+PN}); }catch(e){}
  const wantIdea=ok&&open(w.t)&&(r>=3||!ideas()[at]);
  $('after').innerHTML='<p class="fb">'+line+'</p>'+(wantIdea?
    '<p class="aim" style="margin-top:.9rem"><b>Now make it yours.</b> '+(a=>/\?\s*$/.test(a)?'Finish it: '+esc(a):'Finish it with '+esc(a)+'.')(against(at)?SUB().askBad:SUB().ask)+'</p><input class="wr" id="idea" maxlength="80" placeholder="your own idea" value="'+esc(ideas()[at]||'')+'">':'')+
    voiceRow()+'<div class="cta"><button type="button" class="btn fill" id="nx">'+(at===D.slots.length-1?'Finish':'Next')+' →</button></div>';
  /* what Maya says: the sentence, with his own ending once he has typed one */
  wireVoice(()=>{ const v=$('idea')&&$('idea').value.trim(); return body(fill(w))+(open(w.t)&&v?' '+v:''); },12);
  $('nx').onclick=()=>{ hush(); recStop(); const v=$('idea')&&$('idea').value.trim(); if(v){ ideas()[at]=v; save(); } at++; next(); };
  $('nx').focus({preventScroll:true}); $('after').scrollIntoView({block:'nearest',behavior:'smooth'});
}
function done(){
  const got=res.filter(Boolean).length;
  card('<div class="kick">All done</div><h2 id="fTitle">'+got+' of '+D.slots.length+'</h2>'+
    '<div class="rungs" style="justify-content:flex-start;margin-top:1rem">'+D.slots.map((_,i)=>{ const s=slot(i); return '<i class="'+(s.own?'own':'')+'" style="--p:'+(s.own?100:(s.rung-1)*25)+'"><b>'+(s.own?'✓':i+1)+'</b></i>'; }).join('')+'</div>'+
    '<p class="aim">'+(PRACTICE?'Practice round done. ':got===D.slots.length?'Every one. ':'The ones you missed come back tomorrow. ')+'Each sentence climbs one step a day.</p>'+
    '<div class="cta"><button type="button" class="btn fill" id="see5">Say my answer</button><a class="btn" href="/skills/speaking/test.html?part='+PN+'">A real question</a></div>');
  sfx(got===D.slots.length?'jingle':'rise'); if(got===D.slots.length) cheer(PRACTICE?'done':'big'); else if(got) cheer('done');
  $('see5').onclick=()=>{ setMode('mine'); close(); };
  if($('qx')) $('qx').onclick=bridge;
}

/* ── THE BRIDGE: his five on a real exam question (6 Nov) ──────────────
   Owning five sentences about Minecraft is not yet answering "tell us what
   you learnt". A real Part 2 question from the bank, chosen for his
   subject: for each of its points he taps the sentence that covers it (a
   point that describes goes in a feature; "would others like it?" in the
   recommendation). Then the plan shows each point INSIDE the gap it fills:
   the points are what his “…” are for. Checked by the app. */
let QS=null, QI=0;
function bridge(){
  if(!QS) return fetch(D.bridge.questions).then(r=>r.json()).then(d=>{ QS=d.questions; QI=0; bridge(); }).catch(()=>{});
  const want=D.bridge.bySubject[ST.key]||[], order=QS.filter(q=>want.indexOf(q.id)>-1).concat(QS.filter(q=>want.indexOf(q.id)<0));
  const q=order[QI%order.length], noun=D.bridge.noun[q.id]||'thing', rec=new RegExp(D.bridge.recommend,'i');
  const pts=q.keyPoints.map(t=>({t,rec:rec.test(t)})), nFeat=pts.filter(x=>!x.rec).length;
  /* his name if his thing is this kind of thing; otherwise "your documentary" */
  const mine=SUB().a.replace(/^an? /,'').split(' ').pop()===noun.split(' ').pop(), Xq=mine?X():'your '+noun;
  const a=(/^[aeiou]/.test(noun)?'an ':'a ')+noun;
  const fillQ=w=>w.t.replace(/\{a\}/g,a).replace(/\{plural\}/g,noun+'s').replace(/\{X\}/g,Xq);
  let k=0, miss=0; const put=[];
  /* "Describe the gameplay" → "the gameplay": what goes in the gap */
  const gist=t=>t.replace(/^(describe|explain|tell us|say|information (on|about)|the)\s+/i,m=>/^the\s/i.test(m)?m:'').replace(/^./,c=>c.toLowerCase());
  const label=i=>(i+1)+' · '+D.slots[i].part;
  const draw=()=>{
    const done=k>=pts.length;
    let h='<div class="kick">A real exam question</div><h2 id="fTitle">Use your five</h2>'+
      '<div class="q"><b>'+esc(q.announcement||'')+'</b> '+esc(q.question)+'</div>';
    if(!done){
      h+='<p class="aim">Point '+(k+1)+' of '+pts.length+': which of your five covers it?</p><p class="line" style="font-size:1.02rem">'+esc(pts[k].t)+'</p>'+
        '<div class="pool" id="pool">'+D.slots.map((_,i)=>'<button type="button" class="chip" data-i="'+i+'">'+esc(label(i))+'</button>').join('')+'</div><p class="fb" id="hint"></p>';
    } else {
      /* the plan: his five for THIS question, each point in its gap */
      const at2={}; put.forEach((i,j)=>{ (at2[i]=at2[i]||[]).push(pts[j].t); });
      h+='<p class="aim">'+(miss?'Done. ':'All right first time. ')+'Here is your plan for this question: each point goes in the gap it fills.</p><ol class="five plan">'+
        D.slots.map((sl,i)=>{ const p=at2[i];
          /* a third point in the drawback's place takes a feature's wording */
          const w=i===3&&p?D.slots[2].ways[2]:way(i);
          const note=p?' <span class="idea">→ '+esc(p.map(gist).join(' · '))+'</span>':'';
          const t=w?esc(fillQ(w)).replace(/\s*…\s*$/,' <span class="gap"></span>')+note:'<i>Your own sentence</i>'+note;
          return '<li><b class="n">'+(i+1)+'</b><div><small><span>'+esc(i===3&&p?'Feature, not the drawback':sl.part)+'</span></small>'+t+(i===3&&p?'<br><small style="display:block;margin-top:.2rem">Three points to cover: the third takes the drawback’s place.</small>':'')+'</div></li>'; }).join('')+'</ol>'+
        '<p class="aim">In your notebook: write this review, 140–190 words, with a detail for every point.</p>'+
        '<div class="cta"><button type="button" class="btn fill" id="qn">Another question</button><button type="button" class="btn" id="qd">Done</button></div>';
    }
    card(h);
    if(!done) $('pool').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
      const i=+b.dataset.i, P=pts[k], used=put.filter(x=>x===i).length;
      const featOK=(i===1||i===2||(i===3&&nFeat>2))&&!used;
      const ok=P.rec?i===4:featOK;
      if(ok){ put.push(i); k++; sfx('pop'); draw(); if(k>=pts.length) sfx(miss?'rise':'jingle'); }
      else { miss++; b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); sfx('wrong');
        $('hint').textContent=P.rec?'“Would others like it?” is what the recommendation is for.':i===0?'The introduction names it; a point like this needs a feature.':used&&(i===1||i===2)?'That feature already covers a point. Use the other one.':'A point that describes it goes in a feature.'; }
    });
    else { $('qn').onclick=()=>{ QI++; bridge(); }; $('qd').onclick=close; }
  };
  draw();
}

/* ── MY FIVE: his five, with his own ideas, then the notebook ── */
const against=i=>!!D.slots[i].against||/drawback/i.test(D.slots[i].part);
/* MY <TASK> (7 Nov 2026): his five as the five card, filled — the fixed
   phrase dark, his own words grey, a caramel … where he hasn't written yet.
   Each line ends in its step (2/5); a ✓ line is his, and tapping ✓ changes
   its wording. */
function mine(){
  const id=ideas(), H=D.headings||{};
  const line=i=>{ const w=way(i), s=slot(i), sl=D.slots[i];
    const own=x=>'<span class="fc-own">'+esc(x)+'</span>';
    const h=w?esc(fill(w)).replace(/\s*…\s*$/,id[i]?' '+own(id[i]):' '+FiveCard.gap):(id['own'+i]?own(id['own'+i]):FiveCard.gap);
    return h+(s.own?'<button type="button" class="f5st fc-meta chg" data-i="'+i+'" aria-label="'+esc(sl.part)+': yours. Change the wording">✓</button>'
      :'<span class="f5st fc-meta stepdots" aria-label="'+esc(sl.part)+': step '+s.rung+' of 5">'+'●'.repeat(s.rung)+'○'.repeat(5-s.rung)+'</span>'); };
  const n=D.slots.length, mid=D.slots.map((_,i)=>i).slice(1,n-1);
  const sec=D.secs||[20,30], max=Math.round(sec[1]*1.6);
  /* MY ANSWER (22 Nov 2026): the five as one answer, said aloud. The clock shows the exam's
     length and nothing else: no score, no band, nothing kept. Then Maya says the same five. */
  $('stage').innerHTML='<section class="mine"><p class="key"><span class="stepdots">●●●○○</span> how well you know each sentence · ✓ learned</p><div class="fc-wrap">'+FiveCard.card({label:(D.part||'')+' · '+X(),task:'Part',n:PN,roles:['Start','Middle','End'],
      openHead:H.open||'',closeHead:H.close||'',open:[line(0)],
      body:mid.map(i=>({html:line(i),against:against(i),head:H.body||''})),close:[line(n-1)]})+'</div>'+
    '<div class="sayit"><div class="kick">Say your answer</div>'+exq()+
      '<p>Say your five as one answer, in your own words where you can. Aim for '+sec[0]+'–'+sec[1]+' seconds.</p>'+
      '<div class="clock"><b id="clk">0:00</b><span id="clkL">aim '+sec[0]+'–'+sec[1]+' s</span></div>'+
      '<div class="band"><i style="left:'+(sec[0]/max*100)+'%;width:'+((sec[1]-sec[0])/max*100)+'%"></i><u id="bar" style="width:0"></u></div>'+
      voiceRow()+'</div>'+
    '<div class="note"><div class="kick">Three times</div><p>Once reading the card, once glancing at it, once without it. Then the real thing.</p></div>'+
    '<nav class="onward"><a href="/skills/speaking/test.html?part='+PN+'">Practise Part '+PN+' now →</a></nav></section>';
  const full=()=>D.slots.map((sl,i)=>{ const w=way(i); if(!w) return id['own'+i]||''; const b=body(fill(w)); return open(w.t)?(id[i]?b+' '+id[i]:b+'…'):fill(w); }).filter(Boolean);
  const tick=t=>{ const k=Math.floor(t); $('clk').textContent=Math.floor(k/60)+':'+String(k%60).padStart(2,'0'); $('bar').style.width=Math.min(100,t/max*100)+'%';
    $('clkL').textContent=t<sec[0]?'aim '+sec[0]+'–'+sec[1]+' s':t<=sec[1]?'about right':'a little long'; };
  wireVoice(full,max,tick);
  $('stage').querySelectorAll('.chg').forEach(b=>b.onclick=()=>choose(+b.dataset.i));
}
/* a slot that is his: another wording, or his own sentence */
function choose(i){
  const ways=D.slots[i].ways, cur=slot(i).pick; let k=typeof cur==='number'?cur:cur==='own'?'own':0;
  const draw=()=>{
    card('<div class="kick">'+(i+1)+' of '+D.slots.length+' · '+esc(LB(i))+' · Yours ✓</div><h2 id="fTitle">Pick your way</h2><p class="aim">To '+esc(D.slots[i].pick||D.slots[i].job)+'. A new wording starts at step 3.</p><div class="opts">'+
      ways.map((w,j)=>'<button type="button" class="opt'+(j===k?' on':'')+'" data-j="'+j+'"><span class="l">'+'ABC'[j]+'</span><span>'+html(fill(w))+'</span></button>').join('')+
      '<button type="button" class="opt'+(k==='own'?' on':'')+'" data-j="own"><span class="l">✎</span><span><b>My own sentence</b>, if it does the same job</span></button></div>'+
      '<div class="cta"><button type="button" class="btn fill" id="keep">Keep this one</button></div>');
    $('focus').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ k=b.dataset.j==='own'?'own':+b.dataset.j; draw(); });
    $('keep').onclick=()=>{ const s=slot(i); if(k!==s.pick&&!(k===0&&s.pick==null)){ s.pick=k; s.rung=3; s.rday=null; } save(); close(); };
  };
  draw();
}

function paint(){ if(MODE==='mine') mine(); else gate(); }
function setMode(m){ MODE=m; document.querySelectorAll('.wr-stage[data-m]').forEach(b=>{ const on=b.dataset.m===m; b.classList.toggle('active',on); if(on) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); }); paint(); window.scrollTo(0,0);
  /* the header's task tabs keep the mode: Essay → Review stays in My … or Practise */
  document.querySelectorAll('.mode-selector a.mode-btn').forEach(x=>{ x.href=x.href.replace(/&mode=mine\b/,'')+(m==='mine'?'&mode=mine':''); }); }
document.querySelectorAll('.wr-stage[data-m]').forEach(b=>b.onclick=()=>setMode(b.dataset.m));

fetch('/data/speaking/five/'+TASK+'.json?v=1').then(r=>{ if(!r.ok) throw 0; return r.json(); }).then(d=>{
  D=d; ST=load();
  /* earlier versions: one subject {key,name}; slots by days right */
  if(ST.subj&&!ST.key){ ST.key=ST.subj.key; ST.names={}; ST.names[ST.subj.key]=ST.subj.name; delete ST.subj; }
  (ST.slots||[]).forEach(s=>{ if(s&&s.days&&!s.rung){ s.rung=s.days.length>=2?4:s.days.length?2:1; delete s.days; } });
  if(!D.subjects.some(s=>s.key===ST.key)) ST.key=D.subjects[0].key;
  /* v4: slot 4 became the drawback, so its progress and ideas start again */
  /* TAP FIRST (22 Nov 2026): a teen on a phone taps; typing stays one switch away in How it works */
  if(ST.tap===undefined) ST.tap=true;
  if(P.get('tap')==='1') ST.tap=true; else if(P.get('tap')==='0') ST.tap=false;
  save();
  document.title='INTUITY — Speaking '+D.name+' basics';
  
  $('subj').setAttribute('aria-label','What you write about');
  tabs(); if(P.get('mode')==='mine') setMode('mine'); else paint();
}).catch(()=>{ $('stage').innerHTML='<p style="text-align:center">This could not load. Check your connection and try again.</p>'; });
})();
</script>
