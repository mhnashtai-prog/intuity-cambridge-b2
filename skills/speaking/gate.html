<style>
/* ═══════════════════════════════════════════════════════════════════════
   SPEAKING — A PART'S GATE (22 Nov 2026), Writing's task gate for a Speaking Part.
   The same four doors, so a pupil who knows Writing already knows this:
     Start here   the Part in thirty seconds, said by Maya (never forced)
     1 Learn it   the Part in five moves (five.html?part=N)
     2 Practise it  say the phrases after Maya (drills.html?part=N)
     3 Work on a question   a real question, built line by line (?stage=practice)
     4 Say it     optional: the whole Part, timed, recorded only for you (?stage=talk)
   Below: the Writing gate's notes, which all still hold.

   WRITING — THE GATE (25 Oct 2026, Essay first)

   The same object as the Speaking gate: the shell's pendulum, nothing
   redrawn. A student arriving at a task makes ONE decision here — quick
   revision, work on a question, or the Model Generator — so the slide
   behind the first door no longer has to advertise the other two. Each
   dial carries a one-line promise, because a 14-year-old choosing between
   "revision" and "a question" needs to know what is behind each.
   Every "← back" in the journey returns here (sessionStorage).
   ═══════════════════════════════════════════════════════════════════════ */
:root{
  --accent:#DD8E58; --accent-ink:#9A5A2C;
  --mark-sweep:#708A81; --mark-rest:#4A433D; --mark-core:#201E1C; --mark-ink:#E5D1B8; --mark-pct:100%;
  --dial:clamp(92px,21vw,128px);
}
.header{position:sticky}
.header::after{display:none}
body{min-height:100dvh;display:flex;flex-direction:column}
.gate{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:1.5rem var(--gutter,16px) 3rem}
/* centred when it fits, top-aligned when it does not: justify-content:center
   pushed the Start here ring under the header on a phone (7 Nov 2026) */
.gate::before,.gate::after{content:'';flex:1 1 0}
.dials{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:clamp(2.2rem,7vh,3.6rem) clamp(1.6rem,7vw,4.5rem);max-width:820px}
.four .dials{max-width:560px}
.dial-b{display:flex;flex-direction:column;align-items:center;gap:.75rem;width:clamp(150px,30vw,210px);
  border:none;background:none;padding:0;cursor:pointer;font:inherit;color:inherit;text-decoration:none}
.dial-b .pend-hang{display:block;width:var(--dial);height:var(--dial);will-change:transform;backface-visibility:hidden;
  animation:pendCalm 5.2s cubic-bezier(.37,0,.63,1) infinite}
@keyframes pendCalm{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@media(prefers-reduced-motion:reduce){ .dial-b .pend-hang{animation:none;transform:rotate(0)} }
.dial-b .pend-dial span{font-size:calc(var(--dial) * .3)}
.dial-name{font-family:var(--f-display);font-size:.95rem;font-weight:700;letter-spacing:.01em;color:var(--ink,#232C31);transition:color .15s}
.dial-promise{font-size:.8rem;line-height:1.35;color:var(--dim,#5C5852);text-align:center;margin-top:-.35rem}
.dial-b:hover .dial-name,.dial-b:focus-visible .dial-name{color:var(--accent-ink)}
.dial-b:focus-visible{outline:none}
.dial-b:focus-visible .pend-hang{outline:2px solid var(--accent-ink);outline-offset:7px;border-radius:50%}
.dial-b:active .pend-hang{transform:scale(.95)}
/* a phone held sideways: one row of three */
@media (max-height:520px) and (orientation:landscape){
  :root{--dial:84px}
  .gate{padding:.6rem 16px 1rem}
  .dials{flex-wrap:nowrap;gap:2rem}
}
/* optional: watch a short presentation before choosing a door */
.watch{display:inline-flex;align-items:center;gap:.5rem;margin:.6rem 0 clamp(3.6rem,10vh,5.2rem);padding:.45rem .95rem .45rem .5rem;
  border:1.5px solid rgba(20,17,14,.18);border-radius:999px;background:none;color:var(--ink,#232C31);text-decoration:none;font:600 .85rem/1 var(--f-body)}
.watch[hidden]{display:none}   /* tasks without clips (Story) show nothing, not an empty ring */
.watch i{width:1.45rem;height:1.45rem;border-radius:50%;background:#8AA79C;display:grid;place-items:center;flex:none}
.watch i::after{content:"";margin-left:2px;border-left:6px solid #fff;border-top:4px solid transparent;border-bottom:4px solid transparent}
.watch span{font:500 .72rem/1 var(--f-mono);letter-spacing:.06em;color:var(--dim,#5C5852)}
/* Start here (5 Nov, Michael): the clip is a pendulum like the doors, rimmed in
   caramel like the Ultimate Challenge on the menu, so the first thing to watch
   looks like the first door, and is still only a link. */
.watch{display:flex;flex-direction:column;align-items:center;gap:.6rem;width:auto;margin:0 0 clamp(2.8rem,7vh,3.8rem);padding:0;
  border:0;border-radius:0;background:none;text-align:center;--mark-sweep:#C2956E;--mark-rest:#C2956E}
.watch .pend-hang{display:block;width:var(--dial);height:var(--dial);animation:pendCalm 5.2s cubic-bezier(.37,0,.63,1) infinite;animation-delay:-1.3s}
@media(prefers-reduced-motion:reduce){ .watch .pend-hang{animation:none} }
.watch .pend-dial span{width:0;height:0;border-left:calc(var(--dial) * .17) solid var(--mark-ink);border-top:calc(var(--dial) * .1) solid transparent;
  border-bottom:calc(var(--dial) * .1) solid transparent;margin-left:calc(var(--dial) * .05)}
.watch .w-n{font-family:var(--f-display);font-size:.95rem;font-weight:700;letter-spacing:.01em;color:var(--ink,#232C31)}
.watch .w-p{font:400 .8rem/1.35 var(--f-body);letter-spacing:0;color:var(--dim,#5C5852);margin-top:-.35rem;max-width:24ch}
.watch:hover .w-n,.watch:focus-visible .w-n{color:var(--accent-ink)}
/* the tick on a step already opened (19 Nov 2026) */
.dial-b .tick{position:absolute;right:-2px;bottom:-2px;width:26px;height:26px;border-radius:50%;background:#708A81;color:#fff;
  display:grid;place-items:center;font:700 13px/1 'Geist',system-ui,sans-serif;font-style:normal;box-shadow:0 0 0 3px #F3F1ED}
</style>

<style>
/* THE STAGE PAGES' HEADER (7 Nov 2026), Essay first: "ESSAY · PART 1 ▾" opens
   the task list, a sound switch where the level chip was, the same as on
   Question, Plan, Model and Sample, so nothing changes as you step in */
.g-pick{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;margin-top:2px;padding:3px 6px 3px 8px;border-radius:8px;
  font:600 .6875rem/1.2 var(--f-display,'Geist',system-ui,sans-serif);letter-spacing:.2em;text-transform:uppercase;color:#4A443E}
.g-pick::after{content:'';flex:none;width:5px;height:5px;margin:-3px 2px 0 0;border-right:1.5px solid #8A8378;border-bottom:1.5px solid #8A8378;transform:rotate(45deg)}
.g-pick:active{background:rgba(20,17,14,.06)}.g-pick:focus-visible{outline:2px solid #B0865C;outline-offset:2px}
.g-mute{all:unset;cursor:pointer;justify-self:end;padding:8px;line-height:0;color:var(--ink,#232C31);opacity:.8}
.g-mute.off{opacity:.4}
.g-bg{position:fixed;inset:0;z-index:90;background:rgba(20,17,14,.35)}
.g-sheet{position:fixed;left:0;right:0;bottom:0;z-index:91;background:#FAF8F5;border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px rgba(20,17,14,.18)}
.g-sheet h3{margin:4px 0 10px;font:500 .6875rem/1 'Geist Mono',ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase;color:#8A8378}
.g-sheet div{display:flex;flex-wrap:wrap;gap:8px}
.g-opt{all:unset;cursor:pointer;padding:10px 14px;border-radius:999px;background:rgba(20,17,14,.06);font:500 .9rem/1 var(--f-body,'Geist',system-ui,sans-serif);color:#14110E}
.g-opt.on{background:#14110E;color:#FAF8F5}
/* Start here and Essentials, side by side, the two doors outside the numbers */
.tops{display:flex;justify-content:center;align-items:flex-start;gap:clamp(1.6rem,7vw,4.5rem);margin:0 0 clamp(2.8rem,7vh,3.8rem)}
.tops .watch{margin:0;width:clamp(150px,30vw,210px)}
.ess2 .pend-hang{animation-delay:-3.1s}
.ess2 .pend-dial span.pg{width:calc(var(--dial) * .26);height:calc(var(--dial) * .34);margin:0;border:0;border-radius:2px;background:var(--mark-ink);
  display:flex;flex-direction:column;justify-content:center;gap:calc(var(--dial) * .045);padding:0 calc(var(--dial) * .05);box-sizing:border-box}
.ess2 .pend-dial span.pg i{display:block;width:auto;height:2px;background:#201E1C;opacity:.75;border-radius:1px;place-items:normal}
.ess2 .pend-dial span.pg i::after{display:none}
.ess2 .pend-dial span.pg i:last-child{width:60%}
/* Essentials: the quick fix, beside Start here and outside the numbered route */
.ess{display:flex;align-items:center;gap:12px;max-width:420px;width:100%;box-sizing:border-box;margin:-1.4rem 0 clamp(2.4rem,6vh,3.2rem);padding:12px 14px 12px 16px;
  background:#F3EADF;border-left:3px solid #B0865C;color:#14110E;text-decoration:none}
.ess b{font:700 .95rem/1.2 var(--f-display);flex:none}
.ess span{flex:1;font:400 .8rem/1.35 var(--f-body);color:#5C5852}
.ess i{font-style:normal;font-size:1.3rem;color:#9A5A2C}
.ess:active{background:#EEE2D3}.ess:focus-visible{outline:2px solid #9A5A2C;outline-offset:2px}
</style>

<body>
<header class="header">
  <div class="header-top">
    <a class="back-link" id="back" href="/index.html?openModal=speaking" target="_top">← Speaking</a>
    <div class="header-title"><div class="app-title">INTUITY</div><div class="app-subtitle" id="sub">Part 1</div></div>
    <span class="header-spacer">Level <b>B2</b></span>
  </div>
</header>
<main class="gate"><a class="watch" id="watch" href="#start"></a><div class="dials" id="dials"></div></main>
<div class="g-intro" id="intro" hidden><div class="g-card" role="dialog" aria-modal="true" aria-labelledby="iT">
  <button class="g-x" id="iX" type="button" aria-label="Close">✕</button>
  <div class="g-kick" id="iK"></div><h2 id="iT"></h2><div class="g-bar"><i id="iBar"></i></div><p class="g-share" id="iS"></p>
  <ol class="g-steps" id="iL"></ol>
  <div class="g-cta"><button type="button" class="g-play" id="iP"><i></i><span>Listen</span></button><a class="g-go" id="iGo" href="#">Learn the five →</a></div>
</div></div>
<style>
/* START HERE for Speaking (22 Nov 2026): Writing's clips have no Speaking twin yet, so the
   Part is one card, said by Maya: how long, what happens, the five moves. Nothing to read first. */
.g-intro{position:fixed;inset:0;z-index:95;display:flex;align-items:center;justify-content:center;padding:1rem;background:rgba(20,17,14,.34);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.g-intro[hidden]{display:none}
.g-card{position:relative;width:min(30rem,100%);max-height:calc(100dvh - 2rem);overflow:auto;background:#FAF8F5;padding:1.4rem 1.3rem 1.2rem;box-shadow:0 24px 60px -18px rgba(20,17,14,.38)}
.g-x{all:unset;cursor:pointer;position:absolute;top:.8rem;right:.9rem;padding:.4rem;color:#8A847C}
.g-kick{display:flex;align-items:center;gap:9px;font:500 .6875rem/1 'Geist Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:#8A5A35}
.g-kick::before{content:'';width:26px;height:10px;background:#C2956E}
.g-card h2{font:400 clamp(1.6rem,6vw,2rem)/1.02 'Anton',Impact,sans-serif;text-transform:uppercase;color:#14110E;margin:.45rem 0 .6rem}
.g-bar{height:5px;background:rgba(20,17,14,.08)}.g-bar i{display:block;height:100%;background:#DD8E58}
.g-share{margin:.4rem 0 .2rem;font:500 .66rem/1.3 'Geist Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#8A8378}
.g-steps{list-style:none;margin:.6rem 0 0;padding:0}
.g-steps li{display:grid;grid-template-columns:1.8rem 1fr;gap:.5rem;padding:.55rem 0;border-top:1px solid rgba(20,17,14,.1);font-size:.95rem;line-height:1.4;color:#14110E}
.g-steps b{font:400 1.2rem/1 'Anton',Impact,sans-serif;text-align:center}
.g-steps small{display:block;color:#5C5852;font-size:.8rem}
.g-cta{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1rem}
.g-play,.g-go{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:.5rem;min-height:44px;padding:0 1.2rem;border-radius:999px;font:600 .9rem/1 'Geist',system-ui,sans-serif}
.g-play{border:1.5px solid #14110E;color:#14110E}
.g-play i{width:0;height:0;border-left:8px solid currentColor;border-top:5px solid transparent;border-bottom:5px solid transparent}
.g-go{background:#14110E;color:#FAF8F5}
.g-play:focus-visible,.g-go:focus-visible{outline:2px solid #C2956E;outline-offset:2px}
</style>
<script>
(function(){
'use strict';
const P=new URLSearchParams(location.search), N=Math.max(1,Math.min(4,+(P.get('part')||1)||1));
const PARTS={
 1:{name:'Interview',min:'2 minutes',share:2,page:'part1.html',
    what:'The examiner asks you a few questions about yourself: home, free time, school, the future.',
    five:['Buy time','Answer','Reason','Example','The other side'],
    tip:'Never one word. Answer, then why, then an example: about twenty seconds.'},
 2:{name:'Long turn',min:'1 minute alone',share:4,page:'part2-turn.html',
    what:'You get two photos and a question. You talk for one minute on your own. Then thirty seconds on your partner’s photos.',
    five:['What they share','How they differ','A guess','Another possibility','Answer the question'],
    tip:'Don’t describe the photos. Compare them, guess, and answer the question printed above them.'},
 3:{name:'Collaborate',min:'3 minutes',share:3,page:'part3-talk.html',
    what:'You and your partner get a question and five ideas. You talk together for two minutes, then decide in one.',
    five:['Start it','Ask your partner','React','Move on','Decide'],
    tip:'A conversation, not two speeches. Your partner is on your side.'},
 4:{name:'Discuss',min:'4 minutes',share:4,page:'part4-views.html',
    what:'The examiner asks you both bigger questions on the same topic as Part 3.',
    five:['Your opinion','Reason','Example','The other side','Bring it home'],
    tip:'This is where you sound like an adult: an opinion, a reason, the other side.'}};
const T=PARTS[N];
const DOORS=[
 {name:'Learn it',promise:'The Part in five moves, one sentence each, about your own life',url:'/skills/speaking/five.html?part='+N},
 /* 22 Nov 2026 (the owner: fewer taps to Maya): straight into Maya's drill for this Part, not the list */
 {name:'Practise it',promise:'Say the phrases after Maya, then hear yourself next to her',url:{1:'/skills/speaking/mirror.html?back='+encodeURIComponent('?part=1'),2:'/skills/speaking/drills.html?part=2&area=longturn2',3:'/skills/speaking/drills.html?part=3&area=discussion3',4:'/skills/speaking/drills.html?part=4&area=opinion4'}[N]},
 {name:'Work on a question',promise:'A real exam question, answered line by line',url:'/skills/speaking/'+T.page+'?stage=practice'},
 {name:'Say it',promise:'Optional: the whole Part, timed, recorded only for you',url:'/skills/speaking/'+T.page+'?stage=talk'}];
DOORS.forEach((d,i)=>d.n=i+1);
document.documentElement.classList.add('four');
document.title='INTUITY — Speaking Part '+N;
/* the header: "PART 1 · INTERVIEW ▾" opens the four Parts, a sound switch where the level chip was (as Writing) */
{
  const sub=document.getElementById('sub'), pick=document.createElement('button');
  pick.type='button'; pick.className='g-pick'; pick.textContent='Part '+N+' · '+T.name;
  pick.setAttribute('aria-haspopup','dialog'); pick.setAttribute('aria-label','Change Part: Part '+N);
  sub.replaceWith(pick);
  const close=()=>{ document.querySelectorAll('.g-bg,.g-sheet').forEach(n=>n.remove()); pick.focus(); };
  pick.onclick=()=>{
    const bg=document.createElement('div'); bg.className='g-bg'; bg.onclick=close;
    const sh=document.createElement('div'); sh.className='g-sheet'; sh.setAttribute('role','dialog'); sh.setAttribute('aria-label','Choose a Part');
    sh.innerHTML='<h3>Part</h3><div>'+[1,2,3,4].map(k=>k===N?'<button type="button" class="g-opt on" aria-current="page">Part '+k+' · '+PARTS[k].name+'</button>':'<a class="g-opt" href="?part='+k+'">Part '+k+' · '+PARTS[k].name+'</a>').join('')+'</div>';
    sh.querySelector('.on').onclick=close;
    document.body.append(bg,sh); sh.querySelector('.g-opt').focus();
  };
  addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(document.querySelector('.g-sheet')) close(); if(!document.getElementById('intro').hidden) shut(); } });
  const lv=document.querySelector('.header-spacer'), mb=document.createElement('button');
  mb.type='button'; mb.className='g-mute';
  const paint=()=>{ const on=!window.SFX||SFX.isOn();
    mb.innerHTML='<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z" fill="currentColor" stroke="none"/>'+
      (on?'<path d="M15.5 9.2a4 4 0 0 1 0 5.6"/><path d="M18 6.8a7.4 7.4 0 0 1 0 10.4"/>':'<path d="M16 9.5l5 5M21 9.5l-5 5"/>')+'</svg>';
    mb.setAttribute('aria-label',on?'Sound on':'Sound off'); mb.classList.toggle('off',!on); };
  mb.onclick=()=>{ if(window.SFX) SFX.toggle(); paint(); };
  paint(); if(lv) lv.replaceWith(mb);
}
/* START HERE: the Part in thirty seconds */
const $=id=>document.getElementById(id);
const w=$('watch');
w.setAttribute('aria-label','Start here: what Part '+N+' is, in thirty seconds');
w.innerHTML='<div class="pend-hang" aria-hidden="true"><div class="pend-dial"><span></span></div></div><span class="w-n">Start here</span><span class="w-p">Part '+N+' in thirty seconds</span>';
const script=()=>'Part '+N+'. '+T.what+' '+T.tip+' Five moves: '+T.five.join(', ')+'.';
function hush(){ try{ speechSynthesis.cancel(); }catch(e){} }
function say(t){ try{ hush(); const u=new SpeechSynthesisUtterance(t); u.lang='en-GB'; u.rate=.95;
  const v=(speechSynthesis.getVoices()||[]).filter(x=>/en-GB/i.test(x.lang)); const f=v.find(x=>/female|libby|sonia|serena|kate|martha/i.test(x.name))||v[0]; if(f) u.voice=f; speechSynthesis.speak(u); }catch(e){} }
function shut(){ hush(); $('intro').hidden=true; w.focus(); }
w.onclick=e=>{ e.preventDefault(); try{ localStorage.setItem('be2.door.speaking'+N+'.Start here','1'); }catch(err){}
  $('iK').textContent='Start here · Part '+N; $('iT').textContent=T.name;
  $('iBar').style.width=(T.share/14*100)+'%'; $('iS').textContent=T.min+' · '+T.share+' of the 14 minutes';
  $('iL').innerHTML='<li><b>?</b><div>'+T.what+'<small>'+T.tip+'</small></div></li>'+T.five.map((m,i)=>'<li><b>'+(i+1)+'</b><div>'+m+'</div></li>').join('');
  $('iGo').href=DOORS[0].url; $('intro').hidden=false; $('iX').focus(); };
$('iX').onclick=shut; $('intro').onclick=e=>{ if(e.target===$('intro')) shut(); };
$('iP').onclick=()=>say(script());
/* the four doors, with a tick on the ones already opened (as Writing, 19 Nov 2026) */
const box=$('dials');
const seenKey=d=>'be2.door.speaking'+N+'.'+d.name, seen=d=>{ try{ return !!localStorage.getItem(seenKey(d)); }catch(e){ return false; } };
DOORS.forEach((d,i)=>{
  const a=document.createElement('a'), was=seen(d);
  a.className='dial-b'+(was?' seen':''); a.href=d.url; a.setAttribute('aria-label',d.name+': '+d.promise+(was?' (opened before)':''));
  a.addEventListener('click',()=>{ try{ localStorage.setItem(seenKey(d),'1'); }catch(e){} });
  a.innerHTML='<div class="pend-hang" style="animation-delay:'+(i*-1.7).toFixed(2)+'s" aria-hidden="true"><div class="pend-dial"><span>'+d.n+'</span>'+(was?'<i class="tick">✓</i>':'')+'</div></div>'+
    '<span class="dial-name">'+d.name+'</span><span class="dial-promise">'+d.promise+'</span>';
  box.appendChild(a);
});
/* the Part pages and Maya's drills come back here */
try{ sessionStorage.setItem('intuity.speakReturn',JSON.stringify({part:N,url:location.pathname+'?part='+N})); }catch(e){}
})();
</script>
</body>
</html>
