<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F3F1ED">
<title>INTUITY — Speaking</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- ONE family. The old Speaking pages each loaded Inter + Space Grotesk + DM
     Sans and used Geist nowhere, which is three font families per page across
     ten pages and a section that could not match the rest of the product. -->
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;900&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=7">

<style>
/* ═══════════════════════════════════════════════════════════════════════
   SPEAKING — THE SHAPE OF THE EXAM

   This page replaces hub-practice.html, which was navigation three times
   over: the modal that opened it, its own part-selector chip row, and its
   four part cards — the row and the cards resolving to the same four URLs,
   with the "All Parts" chip wired to nothing at all.

   What it keeps is the only thing that page had and nowhere else does: the
   twenty functions, which name what a student learns to DO with language
   rather than which topic they will talk about. Part 2's five are the top
   level keys of part2-structure.json, so the list is a real index of the
   material rather than a description of it.

   What it adds is duration, which the hub never showed and which is the
   fact a student is actually anxious about. Once the parts have lengths
   they have proportion, and proportion can be drawn. The bars are the
   lesson: nothing on this screen explains the exam in a sentence.
   ═══════════════════════════════════════════════════════════════════════ */

:root{
  /* ── SPEAKING IS CLAY ──────────────────────────────────────────────────
     index.html already gives every area a tone and Speaking's is #DD8E58.
     Taking it from there rather than inventing one is what makes the map
     and the page agree — the same reason Vocabulary is sage.

     Measured on --screen it carries 2.3:1, which is correct for a BLOCK
     and would fail for a word. So the bar is the tone and every piece of
     type is the same hue taken down to #9A5A2C, at 4.81:1. Exactly the
     split the shell already makes between .poster-kick i and its text. */
  --accent:#DD8E58;
  --accent-ink:#9A5A2C;
  --accent-rgb:221,142,88;
}

/* ── THE HEADER IS STICKY, NOT FIXED ─────────────────────────────────────
   Every other page in the suite measures its own header with a
   ResizeObserver and writes the result to --header-h, because a fixed
   header is out of flow and the content below it has to be told how much
   room to leave. A stale value lets the header sit on top of the first
   card, which is the bug that observer exists to prevent.

   In flow, there is nothing to measure. No observer, no --header-h, no
   stale value, and the same visual result. */
.header{position:sticky;padding-bottom:.55rem}

/* The rule appears only once something has gone under it. A permanent line
   under a header is a line drawn before it is needed. */
.header::after{opacity:0;transition:opacity .2s ease;width:100%}
body.scrolled .header::after{opacity:1}

.wrap{max-width:var(--w-read);margin:0 auto;
  padding:1.6rem var(--gutter) 5rem}

/* ── THE TOTAL ───────────────────────────────────────────────────────────
   One number, top right, against the four that follow it. It is the only
   figure on the page that is a sum, so it is the only one set in mono. */
.total{display:flex;justify-content:space-between;align-items:baseline;
  margin-bottom:2.1rem}
.total-h{font-family:var(--f-display);font-size:1.5rem;font-weight:900;
  letter-spacing:var(--track-display);color:var(--ink)}
.total-n{font-family:var(--f-mono);font-size:.82rem;color:var(--dim);
  font-variant-numeric:tabular-nums}

/* ── A PART ──────────────────────────────────────────────────────────────
   No card. A part is a line of type and a bar, and the bar is the only
   filled object on the screen. Chanel's rule: the thing that was going to
   be a card is the thing removed. */
.part{border:none;background:none;width:100%;display:block;text-align:left;
  padding:0 0 1.5rem;cursor:pointer;font:inherit;color:inherit}
.part:last-of-type{padding-bottom:1.1rem}
.part:focus-visible{outline:2px solid var(--accent-ink);outline-offset:6px}

.part-line{display:flex;align-items:baseline;gap:.85rem;margin-bottom:.5rem}
/* Which part is open, said on the row itself. Without it the only cue is a
   list appearing somewhere below, and on a phone that can be off-screen. */
.part-n{transition:color .2s ease}
.part[aria-expanded="true"] .part-n{color:var(--accent-ink)}
.part[aria-expanded="true"] .part-name{color:var(--accent-ink)}
.part-n{font-family:var(--f-display);font-size:1.45rem;font-weight:900;
  line-height:1;color:var(--ink);min-width:1.1ch;
  letter-spacing:var(--track-display)}
.part-name{font-family:var(--f-display);font-size:1.02rem;font-weight:600;
  color:var(--ink)}
.part-time{margin-left:auto;font-family:var(--f-mono);font-size:.74rem;
  color:var(--dim);white-space:nowrap}

/* The bar. Inline width, because the width IS the datum — it is the part's
   share of fourteen minutes and belongs with the content, not the style. */
/* display:block, and it is not a detail.
   The bar was a <span>, and width and height do not apply to an inline box —
   the browser ignored both, so every bar on this page drew nothing at all.
   The whole screen rests on four proportional bars and none of them existed;
   the gaps between the parts were where they should have been.

   The lesson for me: a rule that is silently ignored looks exactly like a
   rule that is working. */
.bar{display:block;height:10px;border-radius:2px;background:var(--accent);
  margin-left:calc(1.1ch + .85rem);
  transform-origin:left;transition:transform .16s cubic-bezier(.2,.8,.2,1)}
.part:active .bar{transform:scaleY(.72)}

/* They grow in, one after another, on arrival. Proportion is the point of
   this screen, and watching four lengths settle says it faster than seeing
   them already settled. */
.bar{width:0;animation:grow .55s cubic-bezier(.2,.9,.3,1) both}
@keyframes grow{from{width:0}to{width:var(--w)}}
@media(prefers-reduced-motion:reduce){
  .bar{animation:none;width:var(--w)}
}

/* ── WHAT YOU PRACTISE ───────────────────────────────────────────────────
   The twenty functions. Closed by default, because a wall of twenty
   bullets was the hub's whole problem. Opening one is the student asking,
   which is the only condition under which a list of five is read.

   grid-template-rows 0fr → 1fr animates a height nobody has to measure. */
.fns{display:grid;grid-template-rows:0fr;
  transition:grid-template-rows .26s cubic-bezier(.2,.8,.2,1)}
.part[aria-expanded="true"] + .fns{grid-template-rows:1fr}
.fns > div{overflow:hidden}
.fns ul{list-style:none;margin:.9rem 0 0 calc(1.1ch + .85rem);
  padding:0 0 1.5rem}
.fns li{font-size:.88rem;line-height:1.55;color:var(--sentence);
  padding-left:1.05rem;position:relative}
/* The mark is the area tone as a block, which is the one place 2.3:1 is
   the right number. Never as a letter. */
.fns li::before{content:'';position:absolute;left:0;top:.62em;
  width:9px;height:3px;background:var(--accent)}

.fns .open{display:inline-block;margin-top:.9rem;
  font-family:var(--f-display);font-size:.7rem;font-weight:600;
  letter-spacing:.05em;color:var(--tile-ink);background:var(--tile-bg);
  border-radius:var(--r-chip);padding:.45rem .85rem;
  transition:background .15s,transform .1s cubic-bezier(.2,.8,.2,1)}
@media(hover:hover){ .fns .open:hover{background:var(--tile-bg-press)} }
.fns .open:active{transform:scale(.96)}
.fns .soon{display:inline-block;margin-top:.9rem;
  font-family:var(--f-mono);font-size:.7rem;color:var(--faint)}

/* One sentence, once, on the only screen that sees all four parts at a time.
   Without it a student meets the same four pills four times and has to infer
   that they mean the same thing. */
.same{font-size:.88rem;line-height:1.6;color:var(--dim);
  margin:0 0 1.4rem calc(1.1ch + .85rem);max-width:30rem}
.same b{font-weight:600;color:var(--sentence)}

/* ── THE PILL ────────────────────────────────────────────────────────────
   Everything a student might need to be told, and nothing they need to be
   told now. One control, one sheet, and a first paint with no instruction
   on it anywhere. */
/* Same object as the pill row on the four part pages, so the Hub belongs to
   the same product rather than resembling it. */
.pill{margin-left:calc(1.1ch + .85rem);
  font-family:var(--f-display);font-size:.66rem;font-weight:600;
  letter-spacing:.05em;
  color:var(--sentence);background:var(--tile-bg);
  border:none;border-radius:var(--r-chip);padding:.55rem 1rem;
  transition:background .15s,transform .1s cubic-bezier(.2,.8,.2,1)}
@media(hover:hover){ .pill:hover{background:var(--tile-bg-press)} }
.pill:active{transform:scale(.96);background:var(--tile-bg-press)}

.sheet-card{align-items:stretch;text-align:left;gap:0}
.sheet-card h2{font-family:var(--f-display);font-size:1.2rem;font-weight:900;
  letter-spacing:var(--track-display);color:var(--ink);margin-bottom:1rem}
.sheet-card dl{margin:0}
.sheet-card dt{font-family:var(--f-display);font-size:.76rem;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);
  margin-top:1.05rem}
.sheet-card dd{font-size:.9rem;line-height:1.6;color:var(--sentence);
  margin:.25rem 0 0}
.sheet-card .close-btn{position:absolute;top:.8rem;right:.8rem}

@media(max-width:560px){
  .total-h{font-size:1.32rem}
  .part-n{font-size:1.3rem}
  .part-name{font-size:.94rem}
}
@media(prefers-reduced-motion:reduce){
  .fns,.bar,.header::after{transition:none}
}
</style>
</head>
<body>

<!-- Back control and the wordmark. No mode row: the Speaking modal on the
     landing page IS the mode row, and a second copy of it here would be the
     third menu in a row. AESTHETIC.md §6, taken literally. -->
<header class="header">
  <div class="header-top">
    <a class="back-link" href="/index.html?openModal=speaking" target="_top">← Speaking</a>
    <div class="header-title">
      <div class="app-title">INTUITY</div>
      <div class="app-subtitle">Speaking</div>
    </div>
    <span class="header-spacer">Level <b>B2</b></span>
  </div>
</header>

<main class="wrap">
  <div class="total">
    <h1 class="total-h">The test</h1>
    <span class="total-n" id="total"></span>
  </div>

  <div id="parts"></div>

  <p class="same">Every part works the same way: <b>listen</b> to a model,
    <b>read</b> it at your own pace, <b>build</b> one yourself, and open the
    <b>phrase bank</b> at any point. Only the building differs, because each
    part is marked on something different.</p>

  <button class="pill" type="button" id="pillBtn">How the test runs</button>
</main>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetH">
  <div class="sheet-card">
    <button class="close-btn" id="sheetX" type="button" aria-label="Close">
      <svg width="15" height="15" viewBox="0 0 15 15" aria-hidden="true">
        <path d="M3 3 L12 12 M12 3 L3 12" stroke="currentColor"
              stroke-width="1.8" stroke-linecap="round" fill="none"/>
      </svg>
    </button>
    <h2 id="sheetH">How the test runs</h2>
    <dl id="sheetBody"></dl>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   ONE OBJECT, AND EVERYTHING ON THE PAGE COMES OUT OF IT.

   The shape Reading Lab got right and the grammar pages did not: content
   above, engine below, and nothing to edit in the markup. When a second
   skill needs this screen, `SPEAKING` lifts out to
   data/speaking/format.json and the engine stays where it is.

   `minutes` is the pair's share of the fourteen, which is what sets the
   bar. `alone` overrides the figure shown beside the name where the two
   differ — Part 2's bar is wide because the pair spends four minutes on
   it, and its number says one, because one minute is what a student
   actually faces. That gap is the thing worth teaching and the reason
   this screen exists rather than a sentence saying the same.
   ═══════════════════════════════════════════════════════════════════════ */
const SPEAKING = {
  total: 14,
  parts: [
    { n:1, name:'Interview', minutes:2,
      url:'part1.html',
      /* Rewritten as functions. The hub listed Part 1 as topics — daily
         habits, home and family, work and study — while Parts 2 to 4 were
         listed as functions, so the four parts sat on two different axes.
         The topics are already the categories in part1-structure.json and
         belong in that page's tabs, not in an index of what is learned. */
      fns:['Giving information about yourself',
           'Expanding an answer past one line',
           'Talking about habits and routines',
           'Talking about past experience',
           'Talking about plans'] },

    { n:2, name:'Long turn', minutes:4, alone:'1 min on your own',
      url:'part2-turn.html',
      fns:['Comparing two photographs',
           'Pointing out what is similar',
           'Pointing out what is different',
           'Justifying an opinion',
           'Speculating about a situation'] },

    { n:3, name:'Collaborate', minutes:3,
      url:'part3-talk.html',
      fns:['Putting an idea forward',
           'Agreeing politely',
           'Disagreeing without sounding rude',
           'Suggesting something else',
           'Reaching a decision together'] },

    { n:4, name:'Discuss', minutes:4,
      url:'part4-views.html',
      fns:['Giving a clear opinion',
           'Giving reasons for it',
           'Building an argument',
           'Agreeing and disagreeing',
           'Talking about ideas, not just facts'] }
  ],
  /* The sheet. Everything the hub would have printed on the screen, kept
     one tap away instead. Four entries, because a fifth would mean this
     had become the wall of text it replaced. */
  how: [
    ['Who is in the room',
     'Two examiners. One talks to you, the other only listens and marks.'],
    ['Who you are with',
     'Another student. You are marked on your own, whatever your partner does.'],
    ['Part 4 follows Part 3',
     'The discussion stays on the topic you have just worked through together.'],
    ['Part 2 is the short one',
     'You speak alone for a minute, then answer a question about your partner\u2019s photos for about thirty seconds.']
  ]
};

/* ── RENDER ───────────────────────────────────────────────────────────── */
const partsEl = document.getElementById('parts');

document.getElementById('total').textContent = SPEAKING.total + ' min';

SPEAKING.parts.forEach(function(p, i){
  const pct = (p.minutes / SPEAKING.total * 100).toFixed(1) + '%';
  const id  = 'fns' + p.n;

  const btn = document.createElement('button');
  btn.className = 'part';
  btn.type = 'button';
  btn.setAttribute('aria-expanded', 'false');
  btn.setAttribute('aria-controls', id);
  btn.innerHTML =
    '<span class="part-line">' +
      '<span class="part-n">' + p.n + '</span>' +
      '<span class="part-name">' + p.name + '</span>' +
      '<span class="part-time">' + (p.alone || p.minutes + ' min') + '</span>' +
    '</span>' +
    '<span class="bar" style="--w:' + pct + ';animation-delay:' +
      (i * 0.09).toFixed(2) + 's"></span>';

  const box = document.createElement('div');
  box.className = 'fns';
  box.id = id;

  /* A part with no page says so, and shows its functions anyway. The hub
     linked Part 3 to an empty file and Part 4 to a filename that does not
     exist (part4-structure.html; the file on disk is part4.structure.html
     and is also empty), so two of its four cards were dead and looked
     exactly like the two that were not. Visible and not yet enterable is
     the honest version of that. */
  const tail = p.url
    ? '<a class="open" href="' + p.url + '">Open Part ' + p.n + '</a>'
    : '<span class="soon">Not ready yet</span>';

  box.innerHTML = '<div><ul>' +
    p.fns.map(function(f){ return '<li>' + f + '</li>'; }).join('') +
    '</ul>' + tail + '</div>';

  /* The ul carries the padding, so it has to move inside the collapsed
     box rather than sit under it. */
  box.querySelector('ul').style.paddingBottom = '0';
  box.querySelector('div').style.paddingBottom = '.4rem';

  btn.addEventListener('click', function(){
    const open = btn.getAttribute('aria-expanded') === 'true';
    /* One at a time. Four open lists is the wall of twenty bullets again,
       arrived at by a different route. */
    partsEl.querySelectorAll('.part[aria-expanded="true"]').forEach(function(o){
      o.setAttribute('aria-expanded', 'false');
    });
    btn.setAttribute('aria-expanded', open ? 'false' : 'true');
  });

  partsEl.appendChild(btn);
  partsEl.appendChild(box);
});

/* ── THE SHEET ────────────────────────────────────────────────────────── */
document.getElementById('sheetBody').innerHTML = SPEAKING.how.map(function(r){
  return '<dt>' + r[0] + '</dt><dd>' + r[1] + '</dd>';
}).join('');

const sheet = document.getElementById('sheet');
const pill  = document.getElementById('pillBtn');

function openSheet(){ sheet.classList.add('open'); document.getElementById('sheetX').focus(); }
function shutSheet(){ sheet.classList.remove('open'); pill.focus(); }

pill.addEventListener('click', openSheet);
document.getElementById('sheetX').addEventListener('click', shutSheet);
sheet.addEventListener('click', function(e){ if (e.target === sheet) shutSheet(); });
addEventListener('keydown', function(e){
  if (e.key === 'Escape' && sheet.classList.contains('open')) shutSheet();
});

/* ── THE RULE UNDER THE HEADER ────────────────────────────────────────── */
addEventListener('scroll', function(){
  document.body.classList.toggle('scrolled', scrollY > 4);
}, { passive:true });
</script>
</body>
</html>
