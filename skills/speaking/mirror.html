<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>INTUITY — Mirroring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..900&family=Geist+Mono:wght@400..600&family=Space+Grotesk:wght@700&family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=20261018">
<script src="/tools/be2-brand.js?v=20261012c"></script>
<style>
/* ═══ MIRRORING (30 Oct 2026) — Michael's classroom routine, on a phone ═══
   Maya asks. The kid reads a model answer out loud from a teleprompter and
   records it, then hears themselves next to Maya. Round two keeps the same
   four-part frame but blanks the content, so the controlled answer becomes
   the kid's own:  Answer · Reason · Example · Contrast.
   Recordings never leave the phone: they live in memory as blob URLs and are
   gone when the page closes. Without a microphone the teleprompter still
   runs and the kid says it out loud. */
:root{
  --paper:#F3F1EC; --card:#FAF8F5; --ink:#14110E; --dim:#5C5852; --faint:rgba(20,17,14,.45); --rule:rgba(20,17,14,.12);
  --sage:#8AA79C; --sage-ink:#4F6B61; --sage-bg:#E3EBE6; --car:#A9875F; --car-ink:#7A5C3A; --car-bg:#EFE6DA; --rec:#B4553C;
}
html,body{background:var(--paper)}
body{min-height:100dvh;display:flex;flex-direction:column;color:var(--ink)}
.header{position:sticky;top:0;z-index:5}
.header::after{display:none}
[hidden]{display:none!important}
main{flex:1;display:flex;justify-content:center;padding:0 16px 1.4rem}
.in{width:min(560px,100%);display:flex;flex-direction:column;gap:1rem;padding-top:clamp(.6rem,2vh,1.2rem)}
.top{display:flex;align-items:center;gap:.5rem;font:500 .7rem/1 'Geist Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.top .n{margin-left:auto}
.legend{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.legend div{display:flex;flex-direction:column;gap:.35rem;font:500 .64rem/1.1 'Geist Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.legend div::before{content:"";height:4px;border-radius:2px;background:var(--rule)}
.legend div.on{color:var(--ink)} .legend div.on::before{background:var(--car)}
.legend div.done::before{background:var(--sage)}
.ask{display:flex;flex-direction:column;gap:.45rem}
.who{display:flex;align-items:center;gap:.5rem;font:500 .66rem/1 'Geist Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--sage-ink)}
.wave{display:flex;align-items:center;gap:2px;height:14px}
.wave i{display:block;width:3px;height:3px;border-radius:2px;background:currentColor;opacity:.5}
.talking .wave i{opacity:1;animation:wv .9s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.15s}.wave i:nth-child(3){animation-delay:.3s}.wave i:nth-child(4){animation-delay:.45s}
@keyframes wv{0%,100%{height:3px}50%{height:13px}}
.q{margin:0;font:600 clamp(1.3rem,5.6vw,1.6rem)/1.3 Geist,system-ui,sans-serif;letter-spacing:-.01em}
/* the teleprompter */
.prompter{background:var(--card);border-radius:8px;padding:1.1rem 1.1rem 1rem;display:flex;flex-direction:column;gap:.8rem;
  box-shadow:0 1px 2px rgba(20,17,14,.05),0 14px 30px -22px rgba(20,17,14,.4)}
.tpl{display:grid;grid-template-columns:4.6rem 1fr;gap:.7rem;align-items:baseline;transition:opacity .25s}
.tpl b{font:500 .62rem/1.3 'Geist Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding-top:.25rem}
.tpl span{font:400 clamp(1.15rem,4.9vw,1.35rem)/1.42 Geist,system-ui,sans-serif;color:var(--dim)}
.tpl .blank{display:inline-block;min-width:5.5em;border-bottom:2px solid var(--car);margin-left:.15em}
.prompter.run .tpl{opacity:.32}
.prompter.run .tpl.on{opacity:1}
.prompter.run .tpl.on span{color:var(--ink);font-weight:500}
.prompter.run .tpl.on b{color:var(--car-ink)}
.prompter.run .tpl.past{opacity:.55}
.round{font:500 .66rem/1 'Geist Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--car-ink);margin:0 0 -.2rem}
.ctrl{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border:none;cursor:pointer;font:600 .92rem/1 Geist,system-ui,sans-serif;
  padding:.8rem 1.1rem;border-radius:999px;background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(20,17,14,.1);-webkit-tap-highlight-color:transparent}
.btn.dark{background:var(--ink);color:#fff}
.btn.rec{background:var(--rec);color:#fff}
.btn.rec .dot{width:.7rem;height:.7rem;border-radius:50%;background:#fff}
.btn.rec.live .dot{border-radius:2px}
.btn.sage{background:var(--sage-ink);color:#fff}
.btn:disabled{opacity:.4}
.btn:active{transform:scale(.97)}
.play-i{width:0;height:0;border-left:9px solid currentColor;border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:2px}
.ctrl .push{margin-left:auto}
.note{font:400 .8rem/1.45 Geist,system-ui,sans-serif;color:var(--faint);margin:0}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:.6rem}
.start{display:flex;flex-direction:column;gap:1rem;padding-top:1rem}
.start h1{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:clamp(3rem,14vw,4.4rem);line-height:.98;margin:0}
.start p{font:400 1.02rem/1.5 Geist,system-ui,sans-serif;color:var(--dim);margin:0}
.frame4{display:grid;grid-template-columns:repeat(2,1fr);gap:.5rem}
.frame4 div{background:var(--card);border-radius:6px;padding:.7rem .8rem;font:600 1rem/1.25 Geist,system-ui,sans-serif}
.frame4 b{display:block;font:500 .62rem/1 'Geist Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--car-ink);margin-bottom:.35rem}
</style>
</head>
<body>
<header class="header">
  <div class="header-top">
    <a class="back-link" id="back" href="/skills/speaking/drills.html?part=1" target="_top">← Drills</a>
    <div class="header-title"><div class="app-title">INTUITY</div><div class="app-subtitle">Speaking · Mirroring</div></div>
    <span class="header-spacer">Level <b>B2</b></span>
  </div>
</header>
<main><div class="in" id="app"></div></main>
<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D = null, i = -1, round = 1, busy = false;
const mine = {};               /* i:round → blob URL of the kid's recording */

/* ── Maya (or the browser's voice where she is not recorded yet) ── */
const A = new Audio(); A.preload = 'auto';
function voice(){ const v=(window.speechSynthesis&&speechSynthesis.getVoices())||[];
  return v.find(x=>/en-GB/i.test(x.lang)&&/female|samantha|serena|kate|libby|sonia/i.test(x.name))||v.find(x=>/en-GB/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null; }
function say(url, text){
  return new Promise(res => {
    let done = false; const fin = () => { if (!done){ done = true; res(); } };
    const tts = () => { if (!window.speechSynthesis) return fin();
      speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); const v = voice(); if (v) u.voice = v; u.lang = 'en-GB'; u.rate = .95;
      u.onend = u.onerror = fin; speechSynthesis.speak(u);
      setTimeout(fin, (text.split(/\s+/).length/2.2 + 3)*1000); };
    A.onended = fin; A.onerror = () => { A.onerror = null; tts(); };
    A.src = url; A.currentTime = 0; A.play().catch(() => { A.onerror = null; tts(); });
  });
}
const sUrl = a => D.audio + a + '.mp3';
function hush(){ A.pause(); try{ speechSynthesis.cancel(); }catch(e){} if (M) M.pause(); }

/* ── the microphone ── */
let stream = null, rec = null, chunks = [], M = null;
async function mic(){
  if (stream) return stream;
  if (!navigator.mediaDevices || !window.MediaRecorder) return null;
  try{ stream = await navigator.mediaDevices.getUserMedia({audio:true}); }catch(e){ stream = null; }
  return stream;
}
function stopMic(){ if (stream){ stream.getTracks().forEach(t => t.stop()); stream = null; } }
document.addEventListener('visibilitychange', () => { if (document.hidden){ hush(); if (rec && rec.state === 'recording') rec.stop(); stopMic(); } });
window.addEventListener('pagehide', stopMic);

/* ── screens ── */
function startScreen(){
  hush();
  $('#app').innerHTML =
    '<div class="start"><div class="top">Part 1 · Mirroring</div><h1>Mirroring</h1>'+
    '<p>Maya asks. You read your answer out loud and record it, then listen to yourself next to her. Then the same shape again, with your own ideas.</p>'+
    '<div class="frame4">'+D.parts.map(p=>'<div><b>'+esc(p[0])+'</b>'+esc(p[1])+'</div>').join('')+'</div>'+
    '<p class="note">Your recordings stay on this phone. Nothing is uploaded, and they disappear when you close the page.</p>'+
    '<div class="ctrl"><button class="btn dark" id="go"><i class="play-i"></i> Start with Maya</button></div></div>';
  $('#go').onclick = async () => { $('#go').disabled = true; await say(sUrl(D.intro.a), D.intro.t); show(0, 1, true); };
}
function segHTML(it, r){
  return it.segs.map((s, k) => {
    const txt = r === 1 ? esc(s) : esc(D.parts[k][1].replace('…','')) + ' <span class="blank"></span>';
    return '<div class="tpl" data-k="'+k+'"><b>'+esc(D.parts[k][0])+'</b><span>'+txt+'</span></div>';
  }).join('');
}
function show(n, r, ask){
  hush(); i = n; round = r;
  const it = D.items[i], key = i+':'+r, have = !!mine[key];
  $('#app').innerHTML =
    '<div class="top">Part 1 · Mirroring <span class="n">'+(i+1)+' / '+D.items.length+'</span></div>'+
    '<div class="legend" id="legend">'+D.parts.map(p=>'<div>'+esc(p[0])+'</div>').join('')+'</div>'+
    '<div class="ask" id="ask"><div class="who"><span class="wave"><i></i><i></i><i></i><i></i></span>Maya asks</div><p class="q">'+esc(it.q)+'</p></div>'+
    '<p class="round">'+(r === 1 ? 'Round 1 · Read it out loud' : 'Round 2 · Your own answer')+'</p>'+
    '<div class="prompter" id="prompter">'+segHTML(it, r)+'</div>'+
    '<div class="ctrl" id="ctrl">'+
      '<button class="btn rec" id="rec"><span class="dot"></span><span>'+(have ? 'Record again' : 'Record')+'</span></button>'+
      '<button class="btn" id="me"'+(have?'':' hidden')+'><i class="play-i"></i> Me</button>'+
      '<button class="btn sage" id="sam"'+(r===1 && !have ? ' hidden' : '')+'><i class="play-i"></i> '+(r===1?'Maya':'Maya\'s idea')+'</button>'+
    '</div>'+
    '<p class="note" id="hint">'+(r === 1 ? 'Tap Record and read each line as it lights up. Tap the screen to move on faster.' : 'Same four steps, your own ideas. Fill each line as it lights up.')+'</p>'+
    '<div class="nav"><button class="btn" id="prev">← Back</button>'+
      (r === 1 ? '<button class="btn dark" id="next">Your own answer →</button>' : '<button class="btn dark" id="next">'+(i < D.items.length-1 ? 'Next question →' : 'Finish')+'</button>')+'</div>';
  $('#rec').onclick = record;
  $('#me').onclick = () => playMine(key);
  $('#sam').onclick = () => { hush(); say(sUrl(it.a), it.segs.join(' ')); };
  $('#prev').onclick = () => r === 2 ? show(i, 1) : (i > 0 ? show(i-1, 2) : startScreen());
  $('#next').onclick = () => r === 1 ? show(i, 2) : (i < D.items.length-1 ? show(i+1, 1, true) : finish());
  $('#ask').onclick = () => askQ();
  if (ask) askQ();
}
async function askQ(){
  const it = D.items[i], a = $('#ask'); if (!a) return;
  a.classList.add('talking'); await say(sUrl(it.qa), it.q); if (a) a.classList.remove('talking');
}
function playMine(key){ hush(); if (!mine[key]) return; M = M || new Audio(); M.src = mine[key]; M.play().catch(()=>{}); }

/* the teleprompter: each line lights up for as long as it takes to say it */
let skip = null;
async function record(){
  if (busy) return; busy = true; hush();
  const key = i+':'+round, it = D.items[i], P = $('#prompter'), segs = P.querySelectorAll('.tpl'), L = $('#legend').children;
  const s = await mic(), b = $('#rec');
  if (s){
    chunks = []; const type = ['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || '';
    rec = new MediaRecorder(s, type ? {mimeType:type} : undefined);
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = () => { if (chunks.length){ if (mine[key]) URL.revokeObjectURL(mine[key]); mine[key] = URL.createObjectURL(new Blob(chunks, {type: rec.mimeType || type || 'audio/mp4'})); }
      const me = $('#me'), sm = $('#sam'); if (me) me.hidden = false; if (sm) sm.hidden = false; if (b) b.lastChild.textContent = 'Record again'; };
    rec.start();
    b.classList.add('live'); b.lastChild.textContent = 'Stop';
  } else {
    $('#hint').textContent = 'No microphone here, so just say it out loud as each line lights up.';
  }
  let stop = false; b.onclick = () => { stop = true; if (skip) skip(); };
  P.classList.add('run');
  P.onclick = () => { if (skip) skip(); };
  for (let k = 0; k < segs.length && !stop; k++){
    segs.forEach((x, j) => x.className = 'tpl' + (j === k ? ' on' : j < k ? ' past' : ''));
    [...L].forEach((x, j) => x.className = j === k ? 'on' : j < k ? 'done' : '');
    const words = round === 1 ? it.segs[k].split(/\s+/).length : it.segs[k].split(/\s+/).length + 3;
    await new Promise(r => { const t = setTimeout(r, Math.max(1800, words/2.3*1000 + 600)); skip = () => { clearTimeout(t); r(); }; });
  }
  skip = null;
  if (!stop) await new Promise(r => setTimeout(r, 500));
  P.classList.remove('run'); P.onclick = null; [...L].forEach(x => x.className = 'done');
  segs.forEach(x => x.className = 'tpl');
  b.classList.remove('live'); b.onclick = record;
  if (rec && rec.state === 'recording') rec.stop(); else if (b) b.lastChild.textContent = 'Read it again';
  busy = false;
}
async function finish(){
  hush();
  $('#app').innerHTML = '<div class="start"><div class="top">Part 1 · Mirroring · done</div><h1>Well done.</h1><p>'+esc(D.close.t)+'</p>'+
    '<div class="ctrl"><button class="btn dark" id="again">↺ From the top</button><a class="btn push" href="/skills/speaking/drills.html?part=1">Other drills</a></div></div>';
  $('#again').onclick = () => show(0, 1, true);
  await say(sUrl(D.close.a), D.close.t);
}

fetch('/data/drills/speaking/mirror.json', {cache:'no-cache'}).then(r => r.json()).then(d => { D = d; startScreen(); });
})();
</script>
</body>
</html>
