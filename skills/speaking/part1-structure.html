<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F3F1ED">
<title>INTUITY — Speaking Part 1</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;900&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=7">

<style>
/* ═══════════════════════════════════════════════════════════════════════
   SPEAKING PART 1 — THE INTERVIEW

   Same shell as the rest of the app: one voice, one dialogue per topic.
   The old page carried three registers side by side (Default / Alternative
   1 / Alternative 2); the formal one read like a written paragraph rather
   than something a candidate would say aloud, so rather than fix three
   voices this page commits to the one that already sounded like speech
   and gives it the room the other two were taking up.

   Two things a student can do here: watch the exchange, or open the
   phrase bank behind it. Neither is a mode you set and forget — the bank
   button sits right where a phrase is wanted, mid-answer, not before it.
   ═══════════════════════════════════════════════════════════════════════ */

:root{
  --accent:#DD8E58;
  --accent-ink:#9A5A2C;
}

.header{position:sticky;padding-bottom:.5rem}
.header::after{opacity:0;transition:opacity .2s ease;width:100%}
body.scrolled .header::after{opacity:1}

.wrap{max-width:var(--w-read);margin:0 auto;padding:1.5rem var(--gutter) 6rem}

/* ── THE QUESTION ─────────────────────────────────────────────────────── */
.ask-row{display:flex;align-items:center;gap:.2rem;margin-bottom:.4rem}
.ask-label{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint)}
.ask{font-family:var(--f-display);font-size:1.22rem;font-weight:600;
  line-height:1.35;color:var(--ink);letter-spacing:var(--track-display);
  margin-bottom:1.6rem}

/* ── THE EXCHANGE ─────────────────────────────────────────────────────────
   Examiner and candidate, told apart by a label and an indent — no
   avatars, no bubbles, no alternating tints. */
.xq{margin:0 0 1.15rem}
.xa{margin:0 0 1.8rem;padding-left:1.1rem;border-left:2px solid var(--accent)}
.xl{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.11em;
  text-transform:uppercase;color:var(--faint);margin-bottom:.25rem}
.xa .xl{color:var(--accent-ink)}
.xq p{margin:0;font-family:var(--f-display);font-size:1.04rem;font-weight:600;
  line-height:1.4;color:var(--ink);letter-spacing:var(--track-display)}
.xa p{margin:0;font-size:.99rem;line-height:1.72;color:var(--sentence)}
.xturn{transition:opacity .3s ease}
.playing .xturn{opacity:.32}
.playing .xturn.live{opacity:1}

/* X-ray: discourse markers underlined, vocabulary in colour — two separate
   criteria, marked two separate ways. */
.xr-d{box-shadow:inset 0 -2px 0 var(--accent)}
.xr-v{color:var(--accent-ink)}

/* ── THE PILLS ────────────────────────────────────────────────────────── */
.pills{display:flex;gap:.15rem;flex-wrap:wrap;align-items:center;
  padding-top:.9rem;border-top:1px solid var(--rule);margin-bottom:.2rem}
.pill-b{font-family:var(--f-display);font-size:.66rem;font-weight:600;
  letter-spacing:.05em;padding:.4rem .72rem;border:none;border-radius:var(--r-chip);
  background:none;color:var(--faint);cursor:pointer;white-space:nowrap;
  transition:background .15s,color .15s}
@media(hover:hover){ .pill-b:hover{color:var(--sentence)} }
.pill-b.on{background:var(--tile-bg);color:var(--tile-ink);font-weight:700}

.tools{display:flex;align-items:center;gap:.5rem;min-height:2.1rem;
  margin-bottom:1.1rem;flex-wrap:wrap}
.tool{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.08em;
  text-transform:uppercase;color:var(--faint);background:none;border:none;
  padding:.35rem .5rem;border-radius:var(--r-chip);cursor:pointer;
  transition:background .15s,color .15s}
.tool.on{background:var(--tile-bg);color:var(--accent-ink)}
@media(hover:hover){ .tool:hover{color:var(--sentence)} }
.tool-n{font-family:var(--f-mono);font-size:.62rem;color:var(--faint);
  margin-left:auto}

/* ── AUDIO ────────────────────────────────────────────────────────────── */
.say{background:none;border:none;padding:.25rem;color:var(--faint);
  cursor:pointer;vertical-align:middle;
  transition:color .15s,transform .1s cubic-bezier(.2,.8,.2,1)}
.say:active{transform:scale(.9)}
.say.on{color:var(--accent-ink)}
@media(hover:hover){ .say:hover{color:var(--accent-ink)} }
.say svg{display:block}
.speaking{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@media(prefers-reduced-motion:reduce){ .speaking{animation:none} }

/* ── THE PHRASE BANK ──────────────────────────────────────────────────── */
.bank{display:none;padding-top:.5rem}
.bank.show{display:block}
.bank-tip{display:flex;gap:.8rem;align-items:flex-start;
  background:var(--sunk);border-radius:var(--r-field);padding:1rem 1.1rem;
  margin-bottom:1.4rem}
.bank-tip-icon{font-size:1.3rem;flex-shrink:0}
.bank-tip p{margin:0;font-size:.86rem;line-height:1.6;color:var(--dim)}
.bank-grid{display:grid;gap:.9rem}
@media(min-width:640px){ .bank-grid{grid-template-columns:1fr 1fr} }
.bank-step{background:var(--tile-bg);border-radius:var(--r-field);
  padding:1rem 1.1rem;border-left:3px solid var(--step-color, var(--accent))}
.bank-step-h{display:flex;align-items:center;gap:.5rem;margin-bottom:.7rem}
.bank-step-n{width:1.6rem;height:1.6rem;border-radius:50%;flex-shrink:0;
  background:var(--step-color, var(--accent));color:var(--screen);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--f-mono);font-size:.72rem;font-weight:600}
.bank-step-icon{font-size:1rem}
.bank-step-l{font-family:var(--f-display);font-size:.7rem;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;color:var(--tile-ink)}
.bank-step-sub{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.06em;
  text-transform:uppercase;color:var(--faint);margin-bottom:.5rem}
.bank-phrases{list-style:none;margin:0;padding:0;display:flex;
  flex-direction:column;gap:.4rem}
.bank-phrases li{font-size:.86rem;line-height:1.5;color:var(--tile-ink);
  background:var(--sunk);border-radius:var(--r-chip);padding:.42rem .7rem}

/* ── NAVIGATION ───────────────────────────────────────────────────────── */
.p1-nav{display:flex;justify-content:space-between;align-items:center;
  gap:.6rem;margin-top:2.2rem;padding-top:1.2rem;border-top:1px solid var(--rule)}
.nav-b{font-family:var(--f-display);font-size:.68rem;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;padding:.6rem 1rem;
  border:none;border-radius:var(--r-chip);background:var(--tile-bg);
  color:var(--tile-ink);cursor:pointer;transition:background .15s}
.nav-b:disabled{opacity:.35;cursor:default}
@media(hover:hover){ .nav-b:not(:disabled):hover{background:var(--tile-bg-press)} }
.nav-b.primary{background:var(--accent);color:var(--screen)}

.try-note{font-size:.82rem;line-height:1.55;color:var(--dim);
  margin-top:.9rem;display:none}
.try-note.show{display:block}

@media(max-width:560px){
  .ask{font-size:1.08rem}
  .p1-nav{flex-wrap:wrap}
}
</style>
</head>
<body>

<header class="header">
  <div class="header-top">
    <a class="back-link" href="/index.html?openModal=speaking" target="_top">← Speaking</a>
    <div class="header-title">
      <div class="app-title">INTUITY</div>
      <div class="app-subtitle">Speaking</div>
    </div>
    <span class="header-spacer">Level <b>B2</b></span>
  </div>
  <nav class="mode-selector" aria-label="Exam part">
    <span class="mode-btn active" aria-current="page">Part 1</span>
    <a class="mode-btn" href="part2-structure.html">Part 2</a>
    <a class="mode-btn" href="part3-structure.html">Part 3</a>
    <a class="mode-btn" href="part4-structure.html">Part 4</a>
  </nav>
  <div class="set-tabs" id="tabs"></div>
</header>

<main class="wrap">

  <div class="ask-row">
    <div class="ask-label">Examiner</div>
    <button class="say" type="button" id="askSay" aria-label="Hear the question">
      <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M3 6h2.5L9 3v10L5.5 10H3z" fill="currentColor"/>
        <path d="M11.5 5.5a3.5 3.5 0 010 5M13.5 3.5a6 6 0 010 9"
              stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
  <h1 class="ask" id="ask"></h1>

  <section id="exchange"></section>

  <nav class="pills" id="pills" aria-label="View">
    <button class="pill-b on" type="button" data-v="interview">Interview</button>
    <button class="pill-b" type="button" data-v="bank">Phrase bank</button>
  </nav>
  <div class="tools" id="tools"></div>

  <div class="bank" id="bank"></div>

  <div class="p1-nav">
    <button class="nav-b" id="prevBtn" type="button">← Previous</button>
    <button class="nav-b primary" id="tryBtn" type="button">Now you try</button>
    <button class="nav-b" id="nextBtn" type="button">Next →</button>
  </div>
  <p class="try-note" id="tryNote">There's no recording mode here yet — for now,
    cover the candidate's lines and answer the examiner's questions aloud
    yourself before checking how the model answer handled each one.</p>

</main>

<script>
var $ = function(id){ return document.getElementById(id); };
var esc = function(s){ return s.replace(/[&<>"]/g, function(c){
  return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); };

var D = null, ti = 0, view = 'interview', xray = false, playing = false, playIx = 0;

/* Collocation-tolerant match, carried over from the Part 1 fix elsewhere in
   the app: a tagged phrase like "read extensively" should still light up
   inside "read quite extensively" rather than silently matching nothing. */
function rx(p){
  var w = p.trim().split(/\s+/).map(function(x){
    return x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); });
  return new RegExp('(?![^<]*>)(' + w.join('(?:\\s+\\S+){0,2}\\s+') + ')', 'i');
}
function highlight(turn){
  var t = esc(turn.text);
  if (!xray || !turn.phrases) return t;
  function mark(list, cls){
    (list || []).slice().sort(function(a, b){ return b.length - a.length; })
      .forEach(function(p){ t = t.replace(rx(p), '<span class="' + cls + '">$1</span>'); });
  }
  mark(turn.phrases.discourse, 'xr-d');
  mark(turn.phrases.vocabulary, 'xr-v');
  return t;
}

function topic(){ return D.topics[ti]; }

function drawExchange(){
  var t = topic();
  $('ask').textContent = t.question;
  $('exchange').innerHTML = t.dialogue.map(function(turn, i){
    var q = turn.speaker === 'interlocutor';
    return '<div class="xturn ' + (q ? 'xq' : 'xa') + '" data-i="' + i + '">' +
      '<div class="xl">' + (q ? 'Examiner' : 'Candidate') + '</div>' +
      '<p>' + highlight(turn) + '</p></div>';
  }).join('');
}

function tools(){
  var T = $('tools'); T.innerHTML = '';
  function btn(label, on, fn){
    var b = document.createElement('button');
    b.className = 'tool' + (on ? ' on' : ''); b.type = 'button'; b.textContent = label;
    b.addEventListener('click', fn);
    T.appendChild(b); return b;
  }
  if (view === 'interview') {
    btn(playing ? '■ stop' : '▶ play the interview', playing, function(){
      playing ? stopPlay() : startPlay();
    });
    btn('x-ray', xray, function(){ xray = !xray; tools(); drawExchange(); });
    var n = document.createElement('span'); n.className = 'tool-n';
    n.textContent = xray ? 'markers underlined · vocabulary in colour' : 'reveal the language';
    T.appendChild(n);
  }
}

function setView(v){
  view = v; hush(); stopPlay();
  Array.prototype.forEach.call($('pills').children, function(b){
    b.classList.toggle('on', b.dataset.v === v);
  });
  $('exchange').style.display = v === 'interview' ? '' : 'none';
  $('bank').classList.toggle('show', v === 'bank');
  tools();
  if (v === 'bank') drawBank();
}

/* ── PHRASE BANK ─────────────────────────────────────────────────────── */
function drawBank(){
  var pb = D.phraseBank, keys = Object.keys(pb).filter(function(k){ return k !== 'pro_tip'; });
  var html = '<div class="bank-tip"><span class="bank-tip-icon">' + esc(pb.pro_tip.icon) +
    '</span><p>' + esc(pb.pro_tip.text) + '</p></div><div class="bank-grid">';
  keys.forEach(function(k){
    var s = pb[k];
    html += '<div class="bank-step" style="--step-color:' + s.color + '">' +
      '<div class="bank-step-h"><span class="bank-step-n">' + esc(s.stepNumber) + '</span>' +
      '<span class="bank-step-icon">' + esc(s.icon) + '</span>' +
      '<span class="bank-step-l">' + esc(s.label) + '</span></div>';
    s.sections.forEach(function(sub){
      html += '<div class="bank-step-sub">' + esc(sub.heading) + '</div>' +
        '<ul class="bank-phrases">' +
        sub.phrases.map(function(p){ return '<li>' + esc(p) + '</li>'; }).join('') +
        '</ul>';
    });
    html += '</div>';
  });
  $('bank').innerHTML = html + '</div>';
}

/* ── AUDIO ───────────────────────────────────────────────────────────── */
var SPEECH = ('speechSynthesis' in window), speakingBtn = null;
function pickVoice(who){
  var vs = speechSynthesis.getVoices(), want = who === 'interlocutor' ? /male/i : /female/i;
  return vs.filter(function(v){ return /en[-_]GB/i.test(v.lang) && want.test(v.name); })[0]
      || vs.filter(function(v){ return /^en/i.test(v.lang) && want.test(v.name); })[0]
      || vs.filter(function(v){ return /en[-_]GB/i.test(v.lang); })[0]
      || vs.filter(function(v){ return /^en/i.test(v.lang); })[0] || null;
}
function hush(){
  if (!SPEECH) return;
  speechSynthesis.cancel();
  if (speakingBtn){ speakingBtn.classList.remove('on', 'speaking'); speakingBtn = null; }
}
function speak(text, who, btn, onend){
  if (!SPEECH || !text) return;
  hush();
  var u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-GB'; u.rate = 0.9; u.pitch = who === 'interlocutor' ? 0.9 : 1.1;
  var v = pickVoice(who); if (v) u.voice = v;
  if (btn){ speakingBtn = btn; btn.classList.add('on', 'speaking'); }
  u.onend = u.onerror = function(){
    if (btn) btn.classList.remove('on', 'speaking');
    if (speakingBtn === btn) speakingBtn = null;
    if (onend) onend();
  };
  speechSynthesis.speak(u);
}
$('askSay').addEventListener('click', function(){
  speak(topic().question, 'interlocutor', $('askSay'));
});

function startPlay(){
  if (!SPEECH) return;
  var turns = topic().dialogue;
  playing = true; playIx = 0; $('exchange').classList.add('playing'); tools();
  (function next(){
    if (!playing || playIx >= turns.length){ stopPlay(); return; }
    var t = turns[playIx];
    Array.prototype.forEach.call($('exchange').querySelectorAll('.xturn'), function(el){
      el.classList.toggle('live', +el.dataset.i === playIx);
    });
    speak(t.text, t.speaker, null, function(){ playIx++; setTimeout(next, 340); });
  })();
}
function stopPlay(){
  playing = false; hush();
  var el = $('exchange');
  el.classList.remove('playing');
  Array.prototype.forEach.call(el.querySelectorAll('.live'), function(x){ x.classList.remove('live'); });
  tools();
}

/* ── TABS / NAV ──────────────────────────────────────────────────────── */
function chrome(){
  $('tabs').innerHTML = '';
  D.topics.forEach(function(t, i){
    var b = document.createElement('button');
    b.className = 'vtab' + (i === ti ? ' active' : '');
    b.type = 'button';
    b.textContent = t.category;
    b.addEventListener('click', function(){
      ti = i; hush(); stopPlay(); chrome(); drawExchange();
      if (view === 'bank') drawBank();
      $('tryNote').classList.remove('show');
    });
    $('tabs').appendChild(b);
  });
  $('prevBtn').disabled = ti === 0;
  $('nextBtn').disabled = ti === D.topics.length - 1;
}

$('prevBtn').addEventListener('click', function(){
  if (ti > 0){ ti--; hush(); stopPlay(); chrome(); drawExchange(); if (view === 'bank') drawBank(); }
});
$('nextBtn').addEventListener('click', function(){
  if (ti < D.topics.length - 1){ ti++; hush(); stopPlay(); chrome(); drawExchange(); if (view === 'bank') drawBank(); }
});
$('tryBtn').addEventListener('click', function(){ $('tryNote').classList.toggle('show'); });

Array.prototype.forEach.call($('pills').children, function(b){
  b.addEventListener('click', function(){ setView(b.dataset.v); });
});

if (!SPEECH) $('askSay').style.display = 'none';
if (SPEECH && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function(){};
addEventListener('pagehide', hush);
addEventListener('scroll', function(){
  document.body.classList.toggle('scrolled', scrollY > 4);
}, { passive: true });

/* ── BOOT ────────────────────────────────────────────────────────────── */
fetch('data/part1-structure.json')
  .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(function(d){ D = d; chrome(); drawExchange(); setView('interview'); })
  .catch(function(e){
    $('ask').textContent = 'Could not load Part 1.';
    $('exchange').innerHTML = '<p class="try-note show">data/part1-structure.json did not load (' + e.message + ').</p>';
  });
</script>
</body>
</html>
