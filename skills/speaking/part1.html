<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F3F1ED">
<title>INTUITY — Speaking Part 1</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;900&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=7">
   
<style>
/* ═══════════════════════════════════════════════════════════════════════
   SPEAKING PART 1 — GROWING AN ANSWER

   The architecture is clause-builder's and the credit belongs there: a
   level is written in full by a person, the engine never composes one, it
   only chooses which to show and diffs one against the next. That is what
   makes the material checkable by eye instead of by trust.

   What changes is the unit. clause-builder's segments carry a syntactic
   kind — independent, dependent, non-finite — because Writing is marked on
   range of structure. Part 1 is not. Part 1 is marked on Discourse
   Management, and the thing that costs a candidate the band is stopping
   after eight words. So a segment here carries a MOVE, and the moves are
   the school's own drill: REACT, ANSWER, then expand with a REASON, an
   EXAMPLE and a CONTRAST.

   That sequence is not invented here. part1-structure.json's phraseBank
   already holds it as five steps with a phrase list each; this page is
   that bank turned into something a student does. The bank itself is one
   tap away at the move it belongs to, which is where a drilled phrase is
   actually wanted — at the moment of choosing, not in a list beforehand.

   THE REACTION GOES IN FRONT. Level 1 is the bare answer a student gives
   unprompted; round 1 puts a reaction BEFORE it, and the student watches
   it arrive there. A phrase list can say the reaction comes first. Only
   the screen can show it.

   And the readout changes with it. clause-builder counts clauses and
   words; this counts SECONDS, because the exam is two minutes long and
   the number a student needs to feel is how little four words buys them.
   No score, no combo, no flow bar — AESTHETIC.md §6 asks for one back
   control and one number, and the number is the seconds.

   LISTEN AND READ NO LONGER CARRY A REGISTER. The interview data used to
   store a Simple / Natural / Advanced version of every answer, and this
   page reused the Build voice index to pick one of them — which meant
   switching "whose life" the builder was on also silently changed the
   formality of a completely different candidate in the exchange below.
   Advanced, in particular, read like a written paragraph rather than
   something spoken aloud, and calling it "Advanced" told a student that
   was the target. There is now one dialogue per topic. Build still offers
   three lives; the exchange shows one candidate, the way the exam sounds.
   ═══════════════════════════════════════════════════════════════════════ */

:root{
  /* Speaking's tone, taken from index.html's AREAS rather than invented.
     #DD8E58 measures 2.3:1 on --screen, correct for a block and wrong for
     a word, so type uses the same hue at #9A5A2C (4.81:1). */
  --accent:#DD8E58;
  --accent-ink:#9A5A2C;
  --accent-rgb:221,142,88;
}

/* Sticky, in flow: no --header-h, no ResizeObserver, nothing to go stale.
   Same as speaking-format.html. */
.header{position:sticky;padding-bottom:.5rem}
.header::after{opacity:0;transition:opacity .2s ease;width:100%}
body.scrolled .header::after{opacity:1}

.mode-btn[aria-disabled="true"]{color:var(--rule);cursor:default}

.wrap{max-width:var(--w-read);margin:0 auto;padding:1.5rem var(--gutter) 6rem}

/* ── THE QUESTION ────────────────────────────────────────────────────────
   The examiner speaks first and is the only voice on screen that is not
   the student's, so it is the only thing set in mono. No card, no tint —
   the label and the type do the separating. */
.ask-label{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint);margin-bottom:.4rem}
.ask{font-family:var(--f-display);font-size:1.22rem;font-weight:600;
  line-height:1.35;color:var(--ink);letter-spacing:var(--track-display);
  margin-bottom:1.6rem}

/* ── THE ANSWER ──────────────────────────────────────────────────────────
   Prose, at reading size, growing in place. Each move is a <span> so the
   newest can be brought in on its own without redrawing the rest — which
   is the whole point of storing levels as segments. */
.answer{font-size:1.02rem;line-height:1.75;color:var(--sentence);
  min-height:5.2em;margin-bottom:1.1rem}
.seg{transition:opacity .3s ease}
.seg.new{animation:segIn .36s cubic-bezier(.2,.8,.2,1) both}
@keyframes segIn{from{opacity:0}to{opacity:1}}
.answer.shift .seg:not(.new){animation:shiftIn .36s cubic-bezier(.2,.8,.2,1) both}
@keyframes shiftIn{from{transform:translateX(-10px)}to{transform:none}}
.mk{box-shadow:inset 0 -2px 0 var(--accent)}

/* ── THE NUMBER ──────────────────────────────────────────────────────────
   Seconds of speech at about 150 words a minute. */
.metre{display:flex;align-items:center;gap:.7rem;margin:2.2rem 0 0;
  padding-top:1.1rem;border-top:1px solid var(--rule)}
.metre-n{font-family:var(--f-mono);font-size:1.34rem;color:var(--ink);
  font-variant-numeric:tabular-nums;min-width:3.4ch}
.metre-l{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--faint);white-space:nowrap}
.metre-track{position:relative;flex:1;height:8px;border-radius:2px;
  background:var(--slot-bg);overflow:hidden}
.metre-fill{height:100%;width:0;background:var(--accent);
  transition:width .4s cubic-bezier(.2,.9,.3,1),background .3s}
.metre-fill.over{background:var(--wrong)}
.metre-band{position:absolute;left:50%;width:16.7%;top:0;bottom:0;
  background:var(--edge);opacity:.16}
.metre-n.over{color:var(--wrong)}

/* ── THE MOVES ───────────────────────────────────────────────────────────
   clause-builder's structures strip, mapped onto discourse. */
.moves{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:2rem}
.move{font-family:var(--f-display);font-size:.62rem;font-weight:600;
  letter-spacing:.07em;text-transform:uppercase;padding:.3rem .62rem;
  border-radius:var(--r-chip);background:var(--sunk);color:var(--rule);
  transition:background .25s,color .25s}
.move.on{background:var(--tile-bg);color:var(--tile-ink)}

/* ── THE ROUND ───────────────────────────────────────────────────────────
   Three options, full width, no card. */
.prompt{font-size:.9rem;color:var(--dim);margin-bottom:.8rem}
.opts{display:flex;flex-direction:column;gap:.5rem}
.opt{text-align:left;width:100%;font-size:.94rem;line-height:1.5;
  padding:.85rem 1rem;border:none;border-radius:var(--r-field);
  background:var(--tile-bg);color:var(--tile-ink);cursor:pointer;
  transition:background .14s,transform .1s cubic-bezier(.2,.8,.2,1)}
@media(hover:hover){ .opt:hover:not(:disabled){background:var(--tile-bg-press)} }
.opt:active:not(:disabled){transform:scale(.985)}
.opt:disabled{cursor:default}
.opt.is-ok{background:var(--tile-ok-bg);color:var(--tile-ok-ink)}
.opt.is-no{background:var(--tile-no-bg);color:var(--tile-no-ink)}

.why{font-size:.84rem;line-height:1.55;color:var(--dim);
  padding:.7rem 1rem 0;display:none}
.why.show{display:block}

/* ── VOICE ───────────────────────────────────────────────────────────────
   Not in the header. Belongs to Build only — Listen and Read no longer
   have a register axis for this to be confused with. */
.voice{display:flex;align-items:center;gap:.3rem;margin:2.2rem 0 0;
  flex-wrap:wrap}
.voice-l{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--faint);margin-right:.35rem}
.vb{font-family:var(--f-display);font-size:.66rem;font-weight:600;
  letter-spacing:.05em;padding:.36rem .7rem;border:none;
  border-radius:var(--r-chip);background:none;color:var(--faint);
  cursor:pointer;transition:background .15s,color .15s}
@media(hover:hover){ .vb:hover{color:var(--sentence)} }
.vb.on{background:var(--tile-bg);color:var(--tile-ink);font-weight:700}

.done{margin-top:1.6rem;display:none}
.done.show{display:block}
.done-n{font-size:.92rem;line-height:1.6;color:var(--sentence);
  margin-bottom:1rem}
.again{font-family:var(--f-display);font-size:.72rem;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);
  background:none;border:none;padding:.4rem 0;cursor:pointer}

/* ── THE PILLS ───────────────────────────────────────────────────────────
   Four modes, one thin line, below the header rather than inside it. */
.pills{display:flex;gap:.15rem;flex-wrap:wrap;align-items:center;
  padding-top:.9rem;border-top:1px solid var(--rule);margin-bottom:.2rem}
.pill-b{font-family:var(--f-display);font-size:.66rem;font-weight:600;
  letter-spacing:.05em;padding:.4rem .72rem;border:none;border-radius:var(--r-chip);
  background:none;color:var(--faint);cursor:pointer;white-space:nowrap;
  transition:background .15s,color .15s}
@media(hover:hover){ .pill-b:hover{color:var(--sentence)} }
.pill-b.on{background:var(--tile-bg);color:var(--tile-ink);font-weight:700}
.pill-b:disabled{color:var(--rule);cursor:default;background:none}

.tools{display:flex;align-items:center;gap:.5rem;min-height:2.1rem;
  margin-bottom:1.1rem;flex-wrap:wrap}
.tool{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.08em;
  text-transform:uppercase;color:var(--faint);background:none;border:none;
  padding:.35rem .5rem;border-radius:var(--r-chip);cursor:pointer;
  transition:background .15s,color .15s}
.tool.on{background:var(--tile-bg);color:var(--accent-ink)}
@media(hover:hover){ .tool:hover{color:var(--sentence)} }
.tool-n{font-family:var(--f-mono);font-size:.62rem;color:var(--faint);
  margin-left:auto}

/* ── THE EXCHANGE · STYLE ────────────────────────────────────────────────
   The exam room. An examiner turn and a candidate turn, and nothing at all
   between them or beside them. */
.xq{margin:0 0 1.15rem}
.xa{margin:0 0 1.8rem;padding-left:1.1rem;border-left:2px solid var(--accent)}
.xl{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.11em;
  text-transform:uppercase;color:var(--faint);margin-bottom:.25rem}
.xa .xl{color:var(--accent-ink)}
.xq p{margin:0;font-family:var(--f-display);font-size:1.04rem;font-weight:600;
  line-height:1.4;color:var(--ink);letter-spacing:var(--track-display)}
.xa p{margin:0;font-size:.99rem;line-height:1.72;color:var(--sentence)}
.xturn{transition:opacity .3s ease}
.playing .xturn{opacity:.32}
.playing .xturn.live{opacity:1}

.xr-d{box-shadow:inset 0 -2px 0 var(--accent)}
.xr-v{color:var(--accent-ink)}

.gap{font-size:.84rem;line-height:1.55;color:var(--dim);
  padding:1rem 0 0;border-top:1px solid var(--rule);margin-top:.5rem}

/* ── AUDIO · STYLE ───────────────────────────────────────────────────────*/
.say{background:none;border:none;padding:.25rem;margin-left:.4rem;
  color:var(--faint);cursor:pointer;vertical-align:middle;
  transition:color .15s,transform .1s cubic-bezier(.2,.8,.2,1)}
.say:active{transform:scale(.9)}
.say.on{color:var(--accent-ink)}
@media(hover:hover){ .say:hover{color:var(--accent-ink)} }
.say svg{display:block}

.vmode{display:inline-flex;gap:.2rem;margin-left:auto}
.vm{font-family:var(--f-display);font-size:.62rem;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;padding:.3rem .6rem;
  border:none;border-radius:var(--r-chip);background:none;color:var(--faint);
  cursor:pointer;transition:background .15s,color .15s}
.vm.on{background:var(--tile-bg);color:var(--tile-ink);font-weight:700}
.ask-row{display:flex;align-items:center;gap:.2rem;margin-bottom:.4rem}
.ask-row .ask-label{margin:0}
.speaking{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@media(prefers-reduced-motion:reduce){ .speaking{animation:none} }

/* ── THE SHEET · STYLE ────────────────────────────────────────────*/
.bank-btn{margin-left:auto;font-family:var(--f-mono);font-size:.62rem;
  letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);
  background:none;border:none;padding:.3rem 0;cursor:pointer}
.prompt-row{display:flex;align-items:baseline;gap:1rem;margin-bottom:.8rem}
.prompt-row .prompt{margin:0}

.sheet-card{align-items:stretch;text-align:left;gap:0;max-width:26rem}
.sheet-card h2{font-family:var(--f-display);font-size:1.12rem;font-weight:900;
  letter-spacing:var(--track-display);color:var(--ink);margin-bottom:.3rem}
.sheet-card .tip{font-size:.82rem;line-height:1.55;color:var(--dim);
  margin-bottom:1.1rem}
.bank-g{padding:.8rem 0;border-top:1px solid var(--rule)}
.bank-g.here{background:none}
.bank-h{display:flex;align-items:baseline;gap:.5rem;margin-bottom:.5rem}
.bank-h b{font-family:var(--f-display);font-size:.72rem;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.bank-g.here .bank-h b{color:var(--accent-ink)}
.bank-h i{font-style:normal;font-family:var(--f-mono);font-size:.62rem;
  color:var(--faint)}
.bank-g ul{list-style:none;margin:0;padding:0;display:flex;
  flex-wrap:wrap;gap:.3rem}
.bank-g li{font-size:.84rem;color:var(--tile-ink);background:var(--tile-bg);
  border-radius:var(--r-chip);padding:.32rem .6rem}
.bank-g.here li{background:var(--sunk)}
.sheet-card .close-btn{position:absolute;top:.7rem;right:.7rem}

@media(max-width:560px){
  .ask{font-size:1.08rem}
  .answer{font-size:.98rem}
}
@media(prefers-reduced-motion:reduce){
  .seg.new{animation:none}
  .metre-fill{transition:none}
}
/* ── THE PHRASE BANK · STYLE ─────────────────────────────────────────── */
.bank-g{padding:.9rem 0;border-top:1px solid var(--rule)}
.bank-g b{display:block;font-family:var(--f-display);font-size:.76rem;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;color:var(--ink);margin-bottom:.15rem}
.bank-g i{display:block;font-style:normal;font-size:.8rem;line-height:1.5;
  color:var(--dim);margin-bottom:.6rem}
.bank-g ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:.3rem}
.bank-g li{font-size:.84rem;color:var(--tile-ink);background:var(--tile-bg);
  border-radius:var(--r-chip);padding:.32rem .6rem}
/* A phrase that appears nowhere in this page's own turns. Shown, because
   range is the point, and marked, because pretending it was in the material
   would be the lie the corpus was built to avoid. */
.bank-g li.extra{background:none;box-shadow:inset 0 0 0 1px var(--rule);color:var(--dim)}
/* Cannot open a sentence — 'whereas', 'although'. The leading dash is the
   sentence it has to attach to. */
.bank-g li.joins::before{content:'… ';color:var(--faint)}
.bank-g li em{font-style:normal;font-family:var(--f-mono);font-size:.58rem;
  letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-left:.45rem}
.bank-note{font-size:.82rem;line-height:1.6;color:var(--dim);
  margin:.7rem 0 0;white-space:pre-line}
.bank-miss{font-size:.8rem;line-height:1.55;color:var(--dim);margin:.55rem 0 0}
.bank-miss s{color:var(--wrong);text-decoration-color:var(--wrong);margin-right:.35rem}

    /* ── PHRASE BANK CARD · same on every Speaking page ─────────────────
   Width matches the Listen column (43rem); on a phone it shrinks to fit.
   Rows follow the Hub card: a heading, a one-line "when", then one phrase
   per line with a hairline between them and the age tag on the right. */
.sheet-card{width:min(43rem,calc(100vw - 2rem));max-width:none}

.sheet-card .bank-g{padding:1.1rem 0 .3rem;border-top:1px solid var(--rule)}
.sheet-card .bank-g b{font-size:.9rem;letter-spacing:.05em;margin-bottom:.2rem}
.sheet-card .bank-g.here b{color:var(--accent-ink)}
.sheet-card .bank-g i{font-size:.92rem;margin-bottom:.4rem}

.sheet-card .bank-g ul{display:block}
.sheet-card .bank-g li{position:relative;display:block;
  padding:.7rem 4.5rem .7rem 0;font-size:1rem;line-height:1.4;
  color:var(--ink);background:none;border-radius:0;box-shadow:none;
  border-bottom:1px solid var(--rule)}
.sheet-card .bank-g li:last-child{border-bottom:none}
.sheet-card .bank-g li.extra{color:var(--dim);box-shadow:none}
.sheet-card .bank-g.here li{background:none}
.sheet-card .bank-g li em{position:absolute;right:0;top:50%;
  transform:translateY(-50%);margin:0}

.sheet-card .bank-note,
.sheet-card .bank-miss{font-size:.9rem}

/* ── SECTIONS VIEW · a Slides card ── same block on every Speaking page ── */
.tool-sep{width:1px;height:1rem;background:var(--rule);margin:0 .25rem}

.sc{display:flex;flex-direction:column;background:var(--card);
  border-radius:var(--r-sheet);margin-top:.2rem;
  padding:.7rem clamp(1.2rem,4vw,2.4rem) clamp(1rem,3vw,1.4rem)}
.sc-top{display:flex;align-items:baseline;justify-content:space-between;
  gap:1rem;padding-bottom:.5rem;border-bottom:1px solid var(--poster-rule);
  font-family:var(--f-mono);font-size:.62rem;letter-spacing:.08em;
  text-transform:uppercase;color:var(--faint)}
.sc-body{min-height:19rem;display:flex;flex-direction:column;
  align-items:flex-start;justify-content:center;text-align:left;
  gap:1.4rem;padding:1.6rem 0}
.sc-ctx{margin:0;font-size:.95rem;line-height:1.5;color:var(--dim)}
.sc-ans{margin:0;font-family:var(--f-display);font-weight:600;
  letter-spacing:var(--track-display);line-height:1.5;color:var(--poster-ink);
  font-size:clamp(1.05rem,2.6vw,1.35rem)}
.sc .xr-d{box-shadow:none;color:var(--accent-ink)}
.sc-chips{display:flex;flex-wrap:wrap;gap:.45rem}
.sc-chips span{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.06em;
  text-transform:uppercase;color:var(--faint);background:var(--poster-fill);
  border-radius:var(--r-field);padding:.35rem .65rem}
.sc-nav{display:flex;align-items:center;justify-content:space-between;
  gap:.6rem;padding-top:.9rem;border-top:1px solid var(--poster-rule)}
.sc-arrow{border:none;background:none;padding:.4rem .6rem;cursor:pointer;
  font-size:1.1rem;line-height:1;color:var(--faint);transition:color .15s}
.sc-arrow:disabled{color:var(--rule);cursor:default}
@media(hover:hover){ .sc-arrow:not(:disabled):hover{color:var(--accent-ink)} }
.sc-dots{display:flex;gap:.34rem;flex-wrap:wrap;justify-content:center}
.sc-dots button{width:6px;height:6px;border-radius:50%;border:none;padding:0;
  cursor:pointer;background:var(--rule);transition:background .2s,transform .2s}
.sc-dots button.on{background:var(--accent-ink);transform:scale(1.35)}
@media(min-width:900px){
  .sc-ctx{font-size:1.05rem}
  .sc-ans{font-size:1.5rem}
}
</style>
</head>
<body>

<header class="header">
  <div class="header-top">
    <a class="back-link" href="/index.html?openModal=speaking" target="_top">← Speaking</a>
    <div class="header-title">
      <div class="app-title">INTUITY</div>
      <div class="app-subtitle">Speaking</div>
    </div>
    <span class="header-spacer">Level <b>B2</b></span>
  </div>
<nav class="mode-selector" aria-label="Speaking sections">
  <a class="mode-btn" href="speaking-format.html">Hub</a>
  <span class="mode-btn active" aria-current="page">Part 1</span>
  <a class="mode-btn" href="part2-turn.html">Part 2</a>
  <a class="mode-btn" href="part3-talk.html">Part 3</a>
  <a class="mode-btn" href="part4-views.html">Part 4</a>
  <a class="mode-btn" href="useful-expressions.html">Slides</a>
</nav>

  <div class="set-tabs" id="tabs"></div>
</header>

<main class="wrap">

  <nav class="pills" id="pills" aria-label="Mode">
 <button class="pill-b" type="button" data-m="listen">Listen</button>
<button class="pill-b" type="button" data-m="read">Read</button>
    <button class="pill-b on" type="button" data-m="build">Build an answer</button>
    <button class="pill-b" type="button" data-m="bank">Phrase bank</button>
  </nav>
  <div class="tools" id="tools"></div>

  <!-- LISTEN / READ: the exchange -->
  <section id="interview" style="display:none"></section>

  <!-- BUILD -->
  <section id="builder">
  <div class="ask-row">
    <div class="ask-label">Examiner</div>
    <button class="say" type="button" id="askSay" aria-label="Hear the question">
      <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M3 6h2.5L9 3v10L5.5 10H3z" fill="currentColor"/>
        <path d="M11.5 5.5a3.5 3.5 0 010 5M13.5 3.5a6 6 0 010 9"
              stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
  <h1 class="ask" id="ask"></h1>

  <div class="answer" id="answer"></div>


  <div class="moves" id="moves"></div>

  <div id="round">
    <div class="prompt-row">
      <p class="prompt" id="prompt"></p>
      <button class="bank-btn" type="button" id="bankBtn">Phrases</button>
    </div>
    <div class="opts" id="opts"></div>
    <div class="why" id="why"></div>
  </div>

  <!-- THE TIMER SITS LAST.
       It was between the question and the choices, which put a number in the
       one gap that should hold nothing — the examiner has spoken and the
       candidate is about to. A counter there is read every time the eye
       travels between them, and it is not needed until after the choice is
       made. Below the round it is still glanceable and never in the way. -->
  <div class="metre">
    <span class="metre-n" id="secs">0s</span>
    <div class="metre-track">
      <div class="metre-band"></div>
      <div class="metre-fill" id="fill"></div>
    </div>
    <span class="metre-l" id="metreL">of speaking</span>
    <button class="say" type="button" id="turnSay" aria-label="Hear the answer so far">
      <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M4 3l9 5-9 5z" fill="currentColor"/>
      </svg>
    </button>
  </div>

  <div class="done" id="done">
    <p class="done-n" id="doneN"></p>
    <button class="again" type="button" id="againBtn">Build it again</button>
  </div>

  <div class="voice">
    <span class="voice-l">Whose life</span>
    <span id="voices"></span>
  </div>
  </section>
</main>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="bankH">
  <div class="sheet-card">
    <button class="close-btn" id="sheetX" type="button" aria-label="Close">
      <svg width="15" height="15" viewBox="0 0 15 15" aria-hidden="true">
        <path d="M3 3 L12 12 M12 3 L3 12" stroke="currentColor"
              stroke-width="1.8" stroke-linecap="round" fill="none"/>
      </svg>
    </button>
    <h2 id="bankH">Phrase bank</h2>
    <p class="tip" id="bankTip"></p>
    <div id="bankBody"></div>
  </div>
</div>
<script>
/* ═══════════════════════════════════════════════════════════════════════
   THE ENGINE
   ═══════════════════════════════════════════════════════════════════════ */

var D = null, ti = 0, vi = 0, step = 0, locked = false, nowMove = null;

var $ = function(id){ return document.getElementById(id); };
var esc = function(s){ return s.replace(/[&<>"]/g, function(c){
  return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); };

function seconds(segs){
  var w = segs.map(function(s){ return s.t; }).join(' ')
    .split(/\s+/).filter(function(x){ return /[A-Za-z0-9]/.test(x); }).length;
  return Math.round(w / 2.5);
}

function markup(seg){
  var t = esc(seg.t);
  (seg.marks || []).forEach(function(m){
    var e = esc(m).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    t = t.replace(new RegExp('(' + e + ')'), '<span class="mk">$1</span>');
  });
  return t;
}

var MARKERS = ["To be honest","If there's one thing","What I love about",
  "What I like about","The thing about","On the other hand","That said",
  "This is mainly because","That's mainly due to","The main reason",
  "It's just that","for instance","Honestly","actually","absolutely",
  "easily","usually","mostly","Although","However","Of course","Well","Oh"];
function markFor(t){
  return MARKERS.filter(function(m){ return t.indexOf(m) !== -1; });
}

function life(){ return D.topics[ti].lives[D.voices[vi].id]; }

var picked = {};
function choose(segs){
  return segs.map(function(x){
    if (!picked[x.m]) return x;
    var c = picked[x.m];
    return { t:c.t, m:x.m, marks:c.marks || [] };
  });
}

function draw(fresh, front){
  var L = life(), segs = choose(L.levels[step]);

  var newIdx = -1;
  if (fresh && step > 0) {
    var prev = choose(L.levels[step - 1]).map(function(x){ return x.t; });
    for (var i = 0; i < segs.length; i++) {
      if (prev.indexOf(segs[i].t) === -1) { newIdx = i; break; }
    }
  }

  $('answer').innerHTML = segs.map(function(s, i){
    return '<span class="seg' + (i === newIdx ? ' new' : '') + '">' +
           markup(s) + '</span>';
  }).join(' ');

  $('answer').classList.toggle('shift', !!front);

  var s = seconds(segs);
  var over = s > 20;
  $('secs').textContent = s + 's';
  $('secs').classList.toggle('over', over);
  $('fill').classList.toggle('over', over);
  $('fill').style.width = Math.min(100, s / 30 * 100) + '%';
  $('metreL').textContent = over ? 'long for Part 1'
                                 : (s >= 15 ? 'about right' : 'of speaking');

  var used = {};
  segs.forEach(function(x){ used[x.m] = 1; });
  $('moves').innerHTML = Object.keys(D.moves).map(function(k){
    return '<span class="move' + (used[k] ? ' on' : '') + '" title="' +
           esc(D.moves[k].hint) + '">' + D.moves[k].name + '</span>';
  }).join('');

  if (step < L.rounds.length) { round(L.rounds[step]); }
  else { finish(s); }
}

function round(r){
  locked = false;
  $('round').style.display = '';
  $('done').classList.remove('show');
  $('why').classList.remove('show');
  $('why').textContent = '';
  $('prompt').textContent = r.prompt;
  nowMove = r.move;

  var opts = r.options.slice();
  for (var i = opts.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = opts[i]; opts[i] = opts[j]; opts[j] = t;
  }

  $('opts').innerHTML = '';
  opts.forEach(function(o){
    var b = document.createElement('button');
    b.className = 'opt';
    b.type = 'button';
    b.textContent = o.t;
    o.front = (r.where === 'front');
    o.move  = r.move;
    b.addEventListener('click', function(){ pick(b, o); });
    $('opts').appendChild(b);
  });
}

function pick(btn, o){
  if (locked) return;

  if (o.ok) {
    locked = true;
    if (o.note) { $('why').textContent = o.note; $('why').classList.add('show'); }
    if (o.move) picked[o.move] = { t:o.t, marks:markFor(o.t) };
    btn.classList.add('is-ok');
    Array.prototype.forEach.call($('opts').children, function(b){ b.disabled = true; });
    setTimeout(function(){
      step++; draw(true, o.front);
      if(voiceOn) speak(o.t,'candidate',null);
    }, 420);
  } else {
    btn.classList.add('is-no');
    btn.disabled = true;
    $('why').textContent = o.why;
    $('why').classList.add('show');
  }
}

function finish(s){
  $('round').style.display = 'none';
  $('done').classList.add('show');
  $('doneN').textContent = s > 20
    ? ('That is ' + s + ' seconds. Strong, but long for Part 1 — the four ' +
       'moves before the contrast are already a band 5 answer here. Save ' +
       'the fifth for Part 2 and Part 4, where the turns are long enough ' +
       'to carry it.')
    : ('That is ' + s + ' seconds, which is about right for Part 1. The ' +
       'reaction you added second is the one the examiner hears first.');
}

/* ── MODES ────────────────────────────────────────────────────────────── */
var mode='build', xray=false, playing=false, playIx=0, view='full';

/* ONE SOURCE OF TRUTH.
   Listen, Read and Build now read the same ladders out of part1-answers.json.
   There is no second interview file, so there is no second candidate: pick
   'At school' and the interview is a school student, because it is literally
   the answer Build would have you construct.

   That also repairs something that was quietly wrong. The life selector
   governed Build alone, so a student could choose 'At school' and then hear a
   thirty-year-old talk about their current job. Nothing on screen explained
   the switch, because nothing on screen knew about it.

   THE INTERVIEW IS THE SIX TOPICS. The old file asked three questions on one
   topic; this one asks one question on each of six, which is closer to how an
   examiner actually moves. What is lost is the examiner coming BACK at you on
   the same subject — worth adding later as three questions per topic, and a
   writing job rather than a code one. */
function ivFor(){ return D && D.topics.length ? true : null; }

/* THE FOUR-MOVE ANSWER: react, answer, reason, example. The same array Build
   builds, at the life currently selected — not a copy and not a paraphrase.

   The LAST level, not this one, was what Listen played until now, and it was
   wrong. The full ladder adds the contrast move and lands at 22 to 28
   seconds; Part 1 gives each candidate roughly fifteen to twenty. The metre
   on this very page prints “long for Part 1” above twenty seconds, so Listen
   was modelling an answer that Build then told the student off for. Five of
   the six topics did it.

   So the model stops at four moves, which lands at 17 to 21 seconds across
   all six. The contrast is still taught — it is the last round in Build, and
   the finish line there already says to save it for Parts 2 and 4, where the
   turns are long enough to carry it. */
function finalAnswer(topic){
  var L = topic.lives[D.voices[vi].id].levels;
  return L[L.length-2];
}

function setMode(m){
  if(m==='bank'){ bank(); return; }
  /* No memory, and no rewriting of the address bar as you switch.

     Both were here and both were wrong. Rewriting the URL turned every click
     into a bookmark, so a reload replayed whatever you last pressed — and
     with a remembered preference on top, a student who tried Build once
     could never reach the opening state again. 'Opens in Listen' has to mean
     opens in Listen.

     ?mode= still works in a link someone writes deliberately. That is the
     difference: a link is an intention, a click is not. */
  hush(); stopPlay();
  mode=m;
  Array.prototype.forEach.call($('pills').children,function(b){
    b.classList.toggle('on', b.dataset.m===m);
  });
  var iv = m==='listen'||m==='read';
  $('interview').style.display = iv ? '' : 'none';
  $('builder').style.display   = iv ? 'none' : '';
  tools(); if(iv) drawIv(); else draw(false);
}

function tools(){
  var T=$('tools'); T.innerHTML='';
  function btn(label,on,fn,dis){
    var b=document.createElement('button');
    b.className='tool'+(on?' on':''); b.type='button'; b.textContent=label;
    if(dis) b.disabled=true; else b.addEventListener('click',fn);
    T.appendChild(b); return b;
  }
  function views(){
    btn('Full interview',view==='full',function(){ setView('full'); });
    btn('In sections',view==='sections',function(){ setView('sections'); });
    var s=document.createElement('span'); s.className='tool-sep'; T.appendChild(s);
  }
  var sec = view==='sections';
  var count = (sec ? (ti+1)+' of '+D.topics.length : D.topics.length+' questions')+
              ' · '+D.voices[vi].tab.toLowerCase();
  if(mode==='listen'){
    if(!ivFor()) return;
    views();
    btn(playing?'■ stop':(sec?'▶ play this answer':'▶ play the interview'),playing,function(){
      playing?stopPlay():startPlay(); });
    var n=document.createElement('span'); n.className='tool-n';
    n.textContent=count;
    T.appendChild(n);
  } else if(mode==='read'){
    if(!ivFor()) return;
    views();
    btn('x-ray',xray,function(){ xray=!xray; tools(); drawIv(); });
    var n=document.createElement('span'); n.className='tool-n';
    n.textContent=xray?'discourse markers underlined':count;
    T.appendChild(n);
  } else {
    btn('Text',!voiceOn,function(){ setVoice(false); tools(); });
    btn('Voice',voiceOn,function(){ setVoice(true); tools();
      speak(D.topics[ti].question,'examiner',$('askSay')); });
  }
}

/* ── THE EXCHANGE ────────────────────────────────────────────────────── */
/* Collocation-tolerant match: tags are phrases like "read extensively",
   which won't always appear as an exact literal substring once the turn
   text inserts a word ("read quite extensively"). A phrase that fails to
   match looks the same as one that was never tagged, so tolerance here
   matters — a silent miss is invisible and stays broken indefinitely. */
function rx(p){
  var w=p.trim().split(/\s+/).map(function(x){
    return x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); });
  return new RegExp('(?![^<]*>)('+w.join('(?:\\s+\\S+){0,2}\\s+')+')','i');
}
function xr(turn){
  var t=esc(turn.t);
  if(!xray) return t;
  function mark(list,cls){
    (list||[]).slice().sort(function(a,b){ return b.length-a.length; })
      .forEach(function(p){
        t=t.replace(rx(p),'<span class="'+cls+'">$1</span>');
      });
  }
  /* Discourse markers only. The ladders tag the markers a student is meant to
     notice and reuse; they carry no separate lexis list, and inventing one
     here would be data written by the page rather than by a person. */
  mark(turn.d,'xr-d');
  return t;
}

/* One dialogue per topic — no register to select, so no lookup keyed on
   the Build voice index. That lookup was the bug: it read the "whose
   life" index as if it also meant "which formality register", which
   is how a school-voice builder answer and an Advanced-register
   interview answer ended up looking like two settings of one dial. */
/* THE INTERVIEW, ASSEMBLED FROM THE LADDERS.
   This function is the one the one-source rewrite was supposed to install and
   silently did not: the file kept an older body that read iv.dialogue from
   part1-interview.json, a file nothing loads any more. ivFor() returns true,
   true.dialogue is undefined, and the page died on .map — which is why only
   the header painted.

   Every question in part1-answers.json, each followed by the answer Build
   ends on, at the life currently selected. */
   
function turns(){
  var out=[];
  var list = view==='sections' ? [D.topics[ti]] : D.topics;
  list.forEach(function(t){
    out.push({who:'q', t:t.question, d:[]});
    var segs=finalAnswer(t);
    out.push({who:'a',
              t: segs.map(function(s){ return s.t; }).join(' '),
              d: segs.reduce(function(a,s){ return a.concat(s.marks||[]); },[])});
  });
  return out;
}

/* Listen and Read show the WHOLE interview — that is what the pill promises,
   and a six-question run is the only place a student sees Part 1 pace out.
   But that left the topic tabs doing nothing visible: six exchanges rendered,
   always starting at Weekends, whichever tab was lit. A control that appears
   to do nothing is worse than one that is not there.

   So the tab still means something: the chosen exchange is marked, and on a
   click the page goes to it. Nothing is hidden, and the full interview is
   still a full interview. `jump` is false on first paint, because scrolling
   a student somewhere they did not ask to go is its own rudeness. */
function sectionHtml(){
  var t = D.topics[ti], T = turns(), segs = finalAnswer(t), used = {};
  segs.forEach(function(x){ used[x.m] = 1; });
  var chips = [t.tab].concat(Object.keys(D.moves)
    .filter(function(k){ return used[k]; })
    .map(function(k){ return D.moves[k].name; }));
  return '<div class="sc">' +
    '<div class="sc-top"><span>Part 1 · Interview</span><span>' +
      (ti+1) + ' / ' + D.topics.length + '</span></div>' +
    '<div class="sc-body">' +
      '<p class="sc-ctx xturn" data-i="0">' + esc(T[0].t) + '</p>' +
      '<p class="sc-ans xturn" data-i="1">' + xr(T[1]) + '</p>' +
      '<div class="sc-chips">' + chips.map(function(c){
        return '<span>' + esc(c) + '</span>'; }).join('') + '</div>' +
    '</div>' + navHtml() + '</div>';
}

function drawIv(jump){
  if(view==='sections'){ $('interview').innerHTML = sectionHtml(); return; }
  var here = D.topics[ti].id;
  $('interview').innerHTML = turns().map(function(t,i){
    var q = t.who==='q';
    var mine = D.topics[Math.floor(i/2)].id===here;
    return '<div class="xturn '+(q?'xq':'xa')+(mine?' here':'')+'" data-i="'+i+'"'+
      (q&&mine?' id="hereQ"':'')+'>'+
      '<div class="xl">'+(q?'Examiner':'Candidate')+'</div>'+
      '<p>'+xr(t)+'</p></div>';
  }).join('');

  if(jump){
    var el=$('hereQ');
    if(el && el.scrollIntoView) el.scrollIntoView({behavior:'smooth', block:'start'});
  }
}

function navHtml(){
  var n = D.topics.length;
  return '<div class="sc-nav">' +
    '<button class="sc-arrow" type="button" data-go="'+(ti-1)+'"'+(ti===0?' disabled':'')+
      ' aria-label="Previous question">&larr;</button>' +
    '<div class="sc-dots">' + D.topics.map(function(t,i){
      return '<button type="button" data-go="'+i+'"'+(i===ti?' class="on"':'')+
             ' aria-label="'+esc(t.tab)+'"></button>';
    }).join('') + '</div>' +
    '<button class="sc-arrow" type="button" data-go="'+(ti+1)+'"'+(ti===n-1?' disabled':'')+
      ' aria-label="Next question">&rarr;</button></div>';
}
   
function goSection(i){
  if(i<0 || i>=D.topics.length) return;
  ti=i; step=0; hush(); stopPlay(); chrome(); tools(); drawIv();
}

function setView(v){
  if(v===view) return;
  view=v; stopPlay(); tools(); drawIv();
}

$('interview').addEventListener('click',function(e){
  var b=e.target.closest('[data-go]');
  if(b && !b.disabled) goSection(+b.dataset.go);
});
addEventListener('keydown',function(e){
  if(view!=='sections' || (mode!=='listen' && mode!=='read')) return;
  if($('sheet').classList.contains('open')) return;
  if(e.key==='ArrowRight') goSection(ti+1);
  if(e.key==='ArrowLeft')  goSection(ti-1);
});
   
function startPlay(){
  if(!SPEECH) return;
  var T=turns();
  playing=true; playIx=0; $('interview').classList.add('playing'); tools();
  (function next(){
    if(!playing||playIx>=T.length){ stopPlay(); return; }
    var t=T[playIx];
    Array.prototype.forEach.call($('interview').querySelectorAll('.xturn'),function(el){
      el.classList.toggle('live', +el.dataset.i===playIx); });
    var u=new SpeechSynthesisUtterance(t.t);
    u.lang='en-GB'; u.rate=0.9; u.pitch = t.who==='q' ? 0.9 : 1.1;
    var v=pickVoice(t.who==='q'?'examiner':'candidate'); if(v) u.voice=v;
    u.onend=function(){ playIx++; setTimeout(next,340); };
    u.onerror=function(){ stopPlay(); };
    speechSynthesis.speak(u);
  })();
}
function stopPlay(){
  playing=false;
  if(SPEECH) speechSynthesis.cancel();
  var el=$('interview'); if(el){ el.classList.remove('playing');
    Array.prototype.forEach.call(el.querySelectorAll('.live'),function(x){ x.classList.remove('live'); }); }
  if($('tools')) tools();
}

/* ── AUDIO ────────────────────────────────────────────────────────────── */
var voiceOn=false, speakingBtn=null;
var SPEECH = ('speechSynthesis' in window);

/* ── CHOOSING A VOICE ────────────────────────────────────────────────────
   This was broken on iOS, and in two separate ways.

   FIRST: the old test for a man was /male/i — which matches "female". The
   substring is right there, so the examiner filter would cheerfully pick a
   woman if her name happened to contain the word.

   SECOND, and the reason an iPhone always read in the same dull man's
   voice: iOS voice names carry NO gender word. They are called Serena,
   Martha, Daniel, Arthur. So /female/i matched nothing at all, every
   lookup fell through to "the first en-GB voice in the list", and on iOS
   that is Daniel. No setting on the phone could have changed it, because
   the page was never asking for anything else.

   So voices are matched BY NAME against the ones the platforms actually
   ship — Apple, Google and Microsoft — with the gender words kept only as
   a last resort for desktop engines that do use them. */
var VOICE_F = /(serena|martha|kate|stephanie|sonia|hazel|susan|libby|maisie|fiona|moira|karen|tessa|samantha|victoria|zira|catherine|amelie|female)/i;
var VOICE_M = /(daniel|oliver|arthur|george|ryan|thomas|alex|fred|gordon|\bmale\b|\bman\b)/i;

function pickVoice(who){
  var vs = speechSynthesis.getVoices() || [];
  var wantF = who !== 'examiner';           /* the candidate is a woman */
  var gb = vs.filter(function(v){ return /en[-_]GB/i.test(v.lang); });
  var en = vs.filter(function(v){ return /^en/i.test(v.lang); });

  function find(list, yes, no){
    return list.filter(function(v){ return yes.test(v.name) && !no.test(v.name); })[0];
  }
  var yes = wantF ? VOICE_F : VOICE_M, no = wantF ? VOICE_M : VOICE_F;

  return find(gb, yes, no)                  /* a British voice of the right sex */
      || find(en, yes, no)                  /* any English one */
      /* Nothing named: take a British voice that is at least not obviously
         the other sex, rather than the first in the list. */
      || gb.filter(function(v){ return !no.test(v.name); })[0]
      || gb[0] || en[0] || null;
}

function hush(){
  if(!SPEECH) return;
  speechSynthesis.cancel();
  if(speakingBtn){ speakingBtn.classList.remove('on','speaking'); speakingBtn=null; }
}

function speak(text, who, btn){
  if(!SPEECH || !text) return;
  hush();
  var u = new SpeechSynthesisUtterance(text);
  u.lang='en-GB'; u.rate=0.9; u.pitch = who==='examiner' ? 0.9 : 1.1;
  var v = pickVoice(who); if(v) u.voice=v;
  if(btn){ speakingBtn=btn; btn.classList.add('on','speaking'); }
  u.onend=u.onerror=function(){
    if(btn){ btn.classList.remove('on','speaking'); }
    if(speakingBtn===btn) speakingBtn=null;
  };
  speechSynthesis.speak(u);
}

function sayTurn(){
  var segs = choose(life().levels[step]).map(function(x){ return x.t; }).join(' ');
  speak(segs,'candidate',$('turnSay'));
}

$('askSay').addEventListener('click',function(){
  speak(D.topics[ti].question,'examiner',$('askSay'));
});
$('turnSay').addEventListener('click', sayTurn);

function setVoice(on){ voiceOn=on; hush(); }
if(!SPEECH){ $('askSay').style.display='none'; $('turnSay').style.display='none'; }
if(SPEECH && speechSynthesis.onvoiceschanged!==undefined){
  speechSynthesis.onvoiceschanged=function(){};
}
addEventListener('pagehide',hush);

/* ── THE PHRASE BANK ─────────────────────────────────────────────────────
   Reads data/speaking-phrases.json, the one corpus shared by all four parts
   and the Hub, filtered here to the functions tagged for THIS part.

   Not each page's own list any more. Contrast is contrast wherever it
   happens, and a phrase that lived in four files was four copies waiting to
   drift — which is exactly what happened twice already in this project.

   Every phrase carries where it came from. `turn` means it appears in a
   model turn on this page; `bank` means it was added for range and appears
   nowhere yet. Both are shown, and the marker says which — hiding the
   second kind would narrow the bank to what one writer happened to use.

   `mouth` is shown only where it discriminates: a function whose phrases
   are all the same age says nothing by displaying it. */
var PART = 1;
var PH = null;

function bankFns(){
  if (!PH) return [];
  var out = [];
  Object.keys(PH.functions).forEach(function(k){
    var f = PH.functions[k];
    if (f.parts.indexOf(PART) !== -1) out.push(f);
  });
  return out;
}

function bank(){
  var fns = bankFns();
  if (!fns.length){
    $('bankBody').innerHTML = '<p class="bank-miss">The phrase bank did not load. ' +
      'Expected data/speaking-phrases.json beside this page.</p>';
  } else {
    $('bankBody').innerHTML = fns.map(function(f){
      /* show the age marker only when the function actually mixes ages */
      var mixed = f.phrases.some(function(p){ return p.mouth !== f.phrases[0].mouth; });
      var here  = (typeof nowMove !== 'undefined' && nowMove && f.moves &&
                   f.moves.indexOf(nowMove) !== -1) ? ' here' : '';
      return '<div class="bank-g' + here + '">' +
        '<b>' + esc(f.label) + '</b>' +
        (f.when ? '<i>' + esc(f.when) + '</i>' : '') +
        '<ul>' + f.phrases.map(function(p){
          var cls = 'ph' + (p.from === 'bank' ? ' extra' : '') +
                    (p.joins ? ' joins' : '');
          var tag = (mixed && p.mouth !== 'both')
            ? '<em>' + (p.mouth === 'teen' ? 'teen' : 'adult') + '</em>' : '';
          return '<li class="' + cls + '" title="' + esc(p.note || '') + '">' +
                 esc(p.t) + tag + '</li>';
        }).join('') + '</ul>' +
        (f.convention ? '<p class="bank-note">' + esc(f.convention) + '</p>' : '') +
        (f.misfires ? f.misfires.map(function(m){
            return '<p class="bank-miss"><s>' + esc(m.t) + '</s> ' + esc(m.why) + '</p>';
          }).join('') : '') +
        '</div>';
    }).join('');
  }
  $('sheet').classList.add('open');
  var h = $('bankBody').querySelector('.bank-g.here');
  if (h && h.scrollIntoView) h.scrollIntoView({ block:'nearest' });
  $('sheetX').focus();
}
function shutBank(){ $('sheet').classList.remove('open'); $('bankBtn').focus(); }

$('bankBtn').addEventListener('click', bank);
$('sheetX').addEventListener('click', shutBank);
$('sheet').addEventListener('click', function(e){ if (e.target === $('sheet')) shutBank(); });
addEventListener('keydown', function(e){
  if (e.key === 'Escape' && $('sheet').classList.contains('open')) shutBank();
});

/* ── TABS AND VOICES ──────────────────────────────────────────────────── */
function chrome(){
  $('tabs').innerHTML = '';
  D.topics.forEach(function(t, i){
    var b = document.createElement('button');
    b.className = 'vtab' + (i === ti ? ' active' : '');
    b.type = 'button';
    b.textContent = t.tab;
    b.addEventListener('click', function(){
      ti = i; step = 0; hush(); stopPlay(); chrome();
      if((mode==='listen'||mode==='read') && !ivFor()){ setMode('build'); return; }
      tools();
      if(mode==='listen'||mode==='read'){ drawIv(true); }
      else { draw(false); if(voiceOn) speak(D.topics[ti].question,'examiner',$('askSay')); }
    });
    $('tabs').appendChild(b);
  });

  $('voices').innerHTML = '';
  D.voices.forEach(function(v, i){
    var b = document.createElement('button');
    b.className = 'vb' + (i === vi ? ' on' : '');
    b.type = 'button';
    b.textContent = v.tab;
    b.addEventListener('click', function(){ vi = i; hush(); chrome(); draw(false); });
    $('voices').appendChild(b);
  });

  $('ask').textContent = D.topics[ti].question;

}

$('againBtn').addEventListener('click', function(){ step = 0; picked = {}; hush(); draw(false); });

Array.prototype.forEach.call($('pills').children,function(b){
  b.addEventListener('click',function(){ setMode(b.dataset.m); });
});

addEventListener('scroll', function(){
  document.body.classList.toggle('scrolled', scrollY > 4);
}, { passive:true });
   
/* ── BOOT ─────────────────────────────────────────────────────────────── */
Promise.all([
  fetch('data/part1-answers.json').then(function(r){ if(!r.ok) throw new Error('part1-answers.json '+r.status); return r.json(); }),
  /* The shared corpus. A failure here must NOT take the page down: a
     student can still build an answer without the phrase bank, so it
     resolves to null and bank() says so when opened. */
  fetch('data/speaking-phrases.json').then(function(r){ return r.ok ? r.json() : null; })
                                     .catch(function(){ return null; })
])
  .then(function(both){
    var d=both[0]; PH=both[1];
    D=d;
    var p=new URLSearchParams(location.search);
    var wantT=p.get('topic');
    if(wantT){ D.topics.forEach(function(t,i){ if(t.id===wantT) ti=i; }); }
    chrome();
    var wantM=p.get('mode');
    if(['listen','read','build'].indexOf(wantM)===-1) wantM='listen';
      if(p.get('view')==='sections') view='sections';
      setMode(wantM);
  })
  .catch(function(e){
    $('ask').textContent = 'Could not load Part 1.';
    $('answer').textContent = e.message + '. Expected data/part1-answers.json beside this page.';
  });
</script>
