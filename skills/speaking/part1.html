<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F3F1ED">
<title>INTUITY — Speaking Part 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;900&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=10">
<style>

/* ═══════════════════════════════════════════════════════════════════════
   THE SPEAKING BLUEPRINT — identical on Parts 1–4 and Slides.
   Header · topic slider · stage switch · the sheet · the dialogue.
   ═══════════════════════════════════════════════════════════════════════ */
:root{ --accent:#DD8E58; --accent-ink:#9A5A2C; --accent-rgb:221,142,88;
  --bg:var(--screen,var(--page-bg,#F3F1ED)); }
.header{position:sticky;top:0;z-index:20;background:var(--bg);padding-bottom:.35rem}
.header::after{opacity:0;transition:opacity .2s ease;width:100%}
body.scrolled .header::after{opacity:1}
.wrap{max-width:40rem;margin:0 auto;padding:.9rem var(--gutter,1rem) 6rem}

/* ── STOPGAP ─── .seg / .tool / .dots belong to the shell (v8). Delete this
   block once v8 is confirmed live. ─────────────────────────────────────── */
/* .seg, .seg.sm and .tool come from the shell — one segmented control
   across the app, square-cornered per the token set. The copies that used
   to live here set border-radius:999px and fought it. */
.tool{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--faint);background:none;border:none;cursor:pointer;padding:.5rem .5rem;min-height:36px}
.tool.on{color:var(--accent-ink)}
.dots{display:flex;align-items:center;justify-content:center;gap:.1rem;flex-wrap:wrap}
.dots button{width:24px;height:24px;padding:0;border:none;background:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.dots button::after{content:'';width:6px;height:6px;border-radius:50%;background:var(--rule);transition:background .2s,transform .2s}
.dots button.on::after{background:var(--accent);transform:scale(1.25)}
/* ── end stopgap ── */

/* ── 1 · THE TOPIC · one line, sliding ─────────────────────────────────── */
.topics{display:flex;gap:.1rem;overflow-x:auto;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;padding:0 1rem;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 1rem,#000 calc(100% - 1rem),transparent 100%);
          mask-image:linear-gradient(90deg,transparent 0,#000 1rem,#000 calc(100% - 1rem),transparent 100%)}
.topics::-webkit-scrollbar{display:none}
.topics button{flex:none;scroll-snap-align:center;font-family:var(--f-mono);font-size:.64rem;letter-spacing:.08em;
  text-transform:uppercase;color:var(--faint);background:none;border:none;cursor:pointer;padding:.7rem .6rem;
  position:relative;white-space:nowrap;min-height:40px;transition:color .15s}
.topics button.on{color:var(--ink)}
.topics button.on::after{content:'';position:absolute;left:.6rem;right:.6rem;bottom:.4rem;height:1.5px;
  background:var(--accent);border-radius:1px}
@media(min-width:720px){ .topics{justify-content:center;-webkit-mask-image:none;mask-image:none} }

/* ── 2 · THE STAGE ─────────────────────────────────────────────────────── */
/* Three columns, so the stage control stays optically centred with a
   button on one side only. Column 1 is the empty counterweight. */
.stage-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  gap:.6rem;margin:.3rem 0 1.1rem}
.stage-row .seg{grid-column:2;justify-self:center}
.stage-row .bank-btn{grid-column:3}
.bank-btn{justify-self:end;font-family:var(--f-mono);font-size:.6rem;letter-spacing:.09em;
  text-transform:uppercase;color:var(--faint);background:none;border:none;cursor:pointer;
  padding:.5rem .2rem;min-height:44px;white-space:nowrap;transition:color .15s}
@media(hover:hover){ .bank-btn:hover{color:var(--accent-ink)} }
.bank-btn:active{color:var(--ink)}
@media(max-width:560px){ .bank-btn{font-size:.55rem} }

/* ── 3 · THE SHEET ─────────────────────────────────────────────────────── */
.sheet-wrap{background:var(--bg);padding:.2rem 0 .6rem}
.sheet-wrap.pin{position:sticky;top:var(--hh,120px);z-index:10;border-bottom:1px solid var(--rule)}
.qline{font-family:var(--f-display);font-size:1.02rem;font-weight:700;line-height:1.35;color:var(--ink);
  text-align:center;margin:0 auto .3rem;max-width:28rem}
.qline small{display:block;font-family:var(--f-mono);font-size:.58rem;font-weight:400;letter-spacing:.12em;
  text-transform:uppercase;color:var(--faint);margin-bottom:.25rem}
/* The moves, as a plain row of chips — no spider, no branches: Part 1 is
   one candidate answering, not two people covering a shared task card. */
.moves-row{display:flex;align-items:center;justify-content:center;gap:.7rem;margin:.3rem auto .2rem;flex-wrap:wrap}
.moves{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center}
.mv{font-family:var(--f-display);font-size:.76rem;font-weight:600;color:var(--dim);background:none;
  border:1px solid var(--rule);border-radius:999px;padding:.4rem .8rem;cursor:default;transition:color .2s,border-color .2s,background .2s}
button.mv{cursor:pointer}
.mv.now{color:var(--ink);border-color:var(--faint);background:var(--tile-bg)}
.mv.done{color:var(--accent-ink);border-color:var(--accent)}
.mv .tick{color:var(--accent);margin-left:.3rem}
.playhub{flex:none;width:52px;height:52px;border-radius:50%;border:none;background:var(--ink);color:var(--bg);
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}
.playhub::before{content:'';display:block;width:0;height:0;border-style:solid;
  border-width:9px 0 9px 14px;border-color:transparent transparent transparent currentColor;margin-left:3px}
.playhub.stop::before{width:14px;height:14px;border:none;background:currentColor;margin:0;border-radius:2px}
.playhub.off{background:var(--rule);cursor:default}
@media(hover:hover){ .playhub:not(.off):hover{background:var(--accent-ink)} }
.playhub:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* The seconds, drawn to scale, under the sheet. */
.tl{position:relative;margin-top:.7rem}
.tl-track{position:relative;height:8px;border-radius:2px;background:var(--rule)}
.tl-seg{position:absolute;top:0;height:100%;background:var(--accent);transition:left .3s,width .3s}
.tl-seg.p0{opacity:.35}.tl-seg.p1{opacity:.5}.tl-seg.p2{opacity:.65}.tl-seg.p3{opacity:.82}.tl-seg.p4{opacity:1}
.tl-seg.over{background:var(--wrong);opacity:.55}
.tl-band{position:absolute;top:-3px;bottom:-3px;background:var(--ink);opacity:.08;border-radius:2px}
.tl-limit{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink)}
.tl-head{position:absolute;top:-5px;width:2px;height:18px;background:var(--ink);border-radius:1px;
  transition-property:left;transition-timing-function:linear;display:none}
.tl-head.on{display:block}
.tl-row{display:flex;justify-content:space-between;align-items:baseline;gap:.8rem;margin-top:.5rem;
  font-family:var(--f-mono);font-size:.62rem;color:var(--faint);font-variant-numeric:tabular-nums}
.tl-row .hot{color:var(--wrong)} .tl-row .ink{color:var(--ink)}

/* ── 4 · THE DIALOGUE ─────────────────────────────────────────────────── */
.dlg{margin-top:1.1rem;border-top:1px solid var(--rule);padding-top:.8rem}
.dlg-hd{display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:nowrap;margin-bottom:.9rem}
.dlg-sub{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin:-.35rem 0 .8rem}
.dlg-sub .tool{padding-left:0}
.dlg-n{font-family:var(--f-mono);font-size:.6rem;color:var(--faint);text-align:right;font-variant-numeric:tabular-nums}
@media(max-width:360px){ .seg.sm button{padding:.36rem .48rem} }
.lbl{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.11em;text-transform:uppercase;color:var(--faint)}
.turn{margin-bottom:.9rem;transition:opacity .3s ease}
.turn .who{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);margin-bottom:.2rem}
.turn p{margin:0;font-size:1rem;line-height:1.6;color:var(--sentence)}
.turn.q p{font-family:var(--f-display);font-weight:600;color:var(--ink)}
.turn.mine{padding-left:1rem;border-left:2px solid var(--accent)}
.turn.mine .who{color:var(--accent-ink)}
.turn.mine p{color:var(--ink)}
.turn.other{padding-left:1rem;border-left:2px solid var(--rule)}
.sg{transition:opacity .3s}
.playing .sg,.playing .turn.q p{opacity:.3}
.playing .sg.live,.playing .turn.q.live p{opacity:1}
.xr{box-shadow:inset 0 -2px 0 var(--accent)}
.one .turn p{font-size:1.12rem}
.one-foot{display:flex;align-items:center;justify-content:space-between;margin-top:.9rem;
  padding-top:.6rem;border-top:1px solid var(--rule)}
.arrow{font-size:1.05rem;line-height:1;color:var(--sentence);background:none;border:none;
  padding:.6rem .8rem;cursor:pointer;min-height:44px;min-width:44px}
.arrow:disabled{color:var(--rule);cursor:default}

/* ── PRACTICE · shadowing ──────────────────────────────────────────────── */
.fn-row{display:flex;gap:.3rem;overflow-x:auto;scrollbar-width:none;padding-bottom:.2rem;margin-bottom:1rem}
.fn-row::-webkit-scrollbar{display:none}
.fn{flex:none;font-family:var(--f-display);font-size:.7rem;font-weight:600;color:var(--dim);background:none;
  border:none;border-radius:999px;box-shadow:inset 0 0 0 1px var(--rule);padding:.5rem .85rem;cursor:pointer;
  min-height:36px;white-space:nowrap}
.fn.on{color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--accent)}
.fn .n{font-family:var(--f-mono);font-size:.58rem;color:var(--faint);margin-left:.25rem}
.fn-when{font-size:.9rem;line-height:1.55;color:var(--dim);margin:0 0 1.2rem}
.dr-ctx{font-size:.95rem;line-height:1.55;color:var(--dim);margin:0 0 1rem}
.dr-ctx b{display:block;font-family:var(--f-mono);font-size:.6rem;font-weight:400;letter-spacing:.11em;
  text-transform:uppercase;color:var(--faint);margin-bottom:.25rem}
.dr-line{font-size:1.2rem;line-height:1.5;color:var(--ink);margin:0 0 1.2rem;padding-left:1rem;
  border-left:2px solid var(--accent)}
.dr-line .xr{box-shadow:none;color:var(--accent-ink);font-weight:700}
.dr-say{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.09em;text-transform:uppercase;
  color:var(--faint);margin-bottom:.45rem}
.dr-say.now{color:var(--accent-ink)}
.bar{height:2px;background:var(--rule);border-radius:1px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
.bar i.run{transition:width linear}
.dr-foot{display:flex;align-items:center;justify-content:space-between;margin-top:1.2rem;
  padding-top:.6rem;border-top:1px solid var(--rule)}
.dr-n{font-family:var(--f-mono);font-size:.62rem;color:var(--faint);font-variant-numeric:tabular-nums}

/* ── QUIZ · the answer, growing ────────────────────────────────────────── */
.answer{font-size:1.04rem;line-height:1.75;color:var(--sentence);min-height:3.4em;margin:0 0 1.2rem}
.aseg.new{animation:segIn .36s cubic-bezier(.2,.8,.2,1) both}
@keyframes segIn{from{opacity:0}to{opacity:1}}
/* A reaction arrives IN FRONT of what is already there; the rest visibly
   gives way to it. That shift is the teaching. */
.answer.shift .aseg:not(.new){display:inline-block;animation:shiftIn .36s cubic-bezier(.2,.8,.2,1) both}
@keyframes shiftIn{from{transform:translateX(-10px)}to{transform:none}}
.ask{font-size:.9rem;color:var(--dim);margin:0 0 .7rem}
.opts{display:flex;flex-direction:column;gap:.5rem}
.opt{text-align:left;width:100%;font-size:.95rem;line-height:1.5;padding:.85rem 1rem;border:none;
  border-radius:var(--r-field,12px);background:var(--tile-bg);color:var(--tile-ink);cursor:pointer;min-height:48px;
  transition:background .14s,transform .1s cubic-bezier(.2,.8,.2,1)}
.opt:active:not(:disabled){transform:scale(.99)}
.opt.is-ok{background:var(--tile-ok-bg);color:var(--tile-ok-ink)}
.opt.is-no{background:var(--tile-no-bg);color:var(--tile-no-ink)}
.why{font-size:.86rem;line-height:1.55;color:var(--dim);padding:.7rem .2rem 0;display:none}
.why.show{display:block}
.res h2{font-family:var(--f-display);font-size:1.08rem;font-weight:900;color:var(--ink);margin:0 0 .5rem}
.res p{font-size:.94rem;line-height:1.6;color:var(--sentence);margin:0 0 .8rem}
.hand{margin:1.4rem 0 1.2rem;padding-top:1rem;border-top:1px solid var(--rule)}

/* ── TALK ──────────────────────────────────────────────────────────────── */
.clock{font-family:var(--f-mono);font-size:2.4rem;color:var(--ink);line-height:1;text-align:center;
  font-variant-numeric:tabular-nums;margin:.9rem 0 .2rem}
.clock.low{color:var(--wrong)}
.talk-lead{font-size:.95rem;line-height:1.6;color:var(--sentence);margin:1rem 0 0}
.model{border-top:1px solid var(--rule);margin-top:1.4rem;padding-top:1rem;display:none}
.model.show{display:block}
.model p{font-size:1.04rem;line-height:1.6;color:var(--ink);margin:.4rem 0 0;padding-left:1rem;border-left:2px solid var(--accent)}

/* ── THE PHRASE BANK · a sheet from anywhere ───────────────────────────── */
#sheet .sheet-card{width:min(40rem,calc(100vw - 1.5rem));max-width:none;align-items:stretch;text-align:left;gap:0}
.sheet-card h2{font-family:var(--f-display);font-size:1.1rem;font-weight:900;color:var(--ink);margin-bottom:.5rem}
.sheet-card .close-btn{position:absolute;top:.7rem;right:.7rem}
.bank-g{padding:1rem 0 .2rem;border-top:1px solid var(--rule)}
.bank-g b{display:block;font-family:var(--f-display);font-size:.86rem;font-weight:700;letter-spacing:.04em;
  text-transform:uppercase;color:var(--ink);margin-bottom:.2rem}
.bank-g i{display:block;font-style:normal;font-size:.9rem;line-height:1.5;color:var(--dim);margin-bottom:.3rem}
.bank-g ul{list-style:none;margin:0;padding:0}
.bank-g li{font-size:1rem;color:var(--ink);padding:.65rem 0;border-bottom:1px solid var(--rule)}
.bank-g li:last-child{border-bottom:none}

@media(prefers-reduced-motion:reduce){
  .bar i.run,.tl-head{transition:none!important}
  .aseg.new,.answer.shift .aseg{animation:none}
  .seg button,.dots button::after{transition:none}
}

/* ═══════════════════════════════════════════════════════════════════════
   SPEAKING PART 1 — REACT, ANSWER, EXPAND · on the Part 2/3 blueprint

   Part 1 hands the candidate nothing to look at: the examiner simply asks.
   So the sheet here is the SHAPE of a good answer — the five moves as a
   plain row of chips, a single play button beside them, each chip
   lighting as it is spoken — and under it the seconds, with the 15–20s
   band a Part 1 answer should land in. The thing on the table is the
   answer's structure, which is what Part 1 marks. There is no shared task
   card here, because Part 1 is one candidate answering, not two people
   covering five prompts together — that belongs to Part 3.

   The right-hand switch in the dialogue header is "whose life": Simple,
   Alternative 1, Alternative 2. Same slot Simple/Natural/Advanced fills on
   Parts 2 and 3 — one axis of variation, always in the same place.
   ═══════════════════════════════════════════════════════════════════════ */
</style>
</head>
<body>

<header class="header" id="hdr">
  <div class="header-top">
    <a class="back-link" href="/index.html?openModal=speaking" target="_top">← Speaking</a>
    <div class="header-title">
      <div class="app-title">INTUITY</div>
      <div class="app-subtitle">Speaking · Part 1</div>
    </div>
    <span class="header-spacer">Level <b>B2</b></span>
  </div>
  <!-- Slides lives in the menu only. tools/check-pages.py --fix-nav
       regenerates this row — change it there or Slides comes back. -->
  <nav class="mode-selector" aria-label="Speaking sections">
    <a class="mode-btn" href="speaking-format.html">Hub</a>
    <span class="mode-btn active" aria-current="page">Part 1</span>
    <a class="mode-btn" href="part2-turn.html">Part 2</a>
    <a class="mode-btn" href="part3-talk.html">Part 3</a>
    <a class="mode-btn" href="part4-views.html">Part 4</a>
  </nav>
  <div class="topics" id="topics" role="tablist" aria-label="Topic"></div>
</header>

<main class="wrap">
  <div class="stage-row">
    <div class="seg" id="stages" role="tablist" aria-label="Stage">
      <button type="button" role="tab" data-s="explore" aria-selected="true">Explore</button>
      <button type="button" role="tab" data-s="practice" aria-selected="false">Practice</button>
      <button type="button" role="tab" data-s="quiz" aria-selected="false">Quiz</button>
      <button type="button" role="tab" data-s="talk" aria-selected="false">Talk</button>
    </div>
    <button class="bank-btn" type="button" id="bankBtn">Phrase bank</button>
  </div>
  <div class="sheet-wrap" id="sheetWrap">
    <p class="qline" id="qline"></p>
    <div class="moves-row">
      <button class="playhub" id="playHub" type="button" aria-label="Play"></button>
      <div class="moves" id="moves" role="group" aria-label="The shape of the answer"></div>
    </div>
    <div class="tl" id="tl"></div>
  </div>
  <div id="body"></div>
</main>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="bankH">
  <div class="sheet-card">
    <button class="close-btn" id="sheetX" type="button" aria-label="Close">
      <svg width="15" height="15" viewBox="0 0 15 15" aria-hidden="true"><path d="M3 3 L12 12 M12 3 L3 12"
        stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
    </button>
    <h2 id="bankH">Reacting, answering, expanding</h2>
    <div id="bankBody"></div>
  </div>
</div>

<script>

/* ═══ SHARED HELPERS — identical on every Speaking page built from the blueprint ═══ */
var $=function(id){ return document.getElementById(id); };
var esc=function(s){ return String(s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
var SPEECH=('speechSynthesis' in window), tmr=null;
function pref(k,v){ try{ if(v===undefined) return localStorage.getItem(PFX+k);
  localStorage.setItem(PFX+k,v); }catch(e){ return null; } }
function measure(){ var h=$('hdr'); if(h) document.documentElement.style.setProperty('--hh',h.offsetHeight+'px'); }
function secs(t){ return Math.round(String(t).split(/\s+/).filter(function(x){ return /[A-Za-z0-9]/.test(x); }).length/2.5); }
function seg(items,cur,attr,cls){
  return '<div class="seg'+(cls?' '+cls:'')+'" role="tablist">'+items.map(function(it){
    return '<button type="button" role="tab" '+attr+'="'+it.id+'" aria-selected="'+(it.id===cur)+'">'+
      esc(it.label)+'</button>'; }).join('')+'</div>';
}
/* Marks in the accent, longest first so "even though" beats "though". */
function mk(t,marks){
  var s=esc(t);
  (marks||[]).slice().sort(function(a,b){ return b.length-a.length; }).forEach(function(m){
    var e=esc(m).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    s=s.replace(new RegExp('(?![^<]*>)('+e+')'),'<span class="xr">$1</span>');
  });
  return s;
}

/* The topic row: one line, sliding, current one scrolled into view. */
function topicRow(list,cur,pick){
  var T=$('topics'); T.innerHTML='';
  list.forEach(function(lab,i){
    var b=document.createElement('button'); b.type='button'; b.textContent=lab; b.setAttribute('role','tab');
    b.className=i===cur?'on':''; b.setAttribute('aria-selected',String(i===cur));
    b.addEventListener('click',function(){ if(i!==cur) pick(i); });
    T.appendChild(b);
  });
  var on=T.querySelector('.on'); if(on&&on.scrollIntoView) on.scrollIntoView({inline:'center',block:'nearest'});
  measure();
}
/* Move the underline without redrawing anything — used while playback walks topics. */
function topicMark(cur){
  Array.prototype.forEach.call($('topics').children,function(b,i){
    b.classList.toggle('on',i===cur); b.setAttribute('aria-selected',String(i===cur)); });
  var on=$('topics').querySelector('.on'); if(on&&on.scrollIntoView) on.scrollIntoView({inline:'center',block:'nearest'});
}

/* ── THE MOVES ───────────────────────────────────────────────────────────
   A plain row of chips — react / answer / reason / example / contrast —
   plus one round play button beside them. No branches, no hub, no shared
   task card: that apparatus belongs to Part 3's two-candidate discussion.
   In Talk, the chips double as tap targets, so a candidate can mark off
   each move as they say it, same as the old branches did. */
function renderMoves(labels,now,done,tap){
  $('moves').innerHTML=labels.map(function(l,i){
    var cls='mv'+(now.indexOf(i)!==-1?' now':'')+(done.indexOf(i)!==-1?' done':'');
    var tick=done.indexOf(i)!==-1?' <span class="tick">&check;</span>':'';
    return tap
      ? '<button type="button" class="'+cls+'" data-branch="'+i+'" aria-label="'+esc(l)+
        (done.indexOf(i)!==-1?', done':'')+'">'+esc(l)+tick+'</button>'
      : '<span class="'+cls+'">'+esc(l)+tick+'</span>';
  }).join('');
}
function setHub(state){
  var h=$('playHub');
  h.className='playhub'+(state==='off'?' off':'')+(state==='stop'?' stop':'');
  h.disabled=state==='off';
  h.setAttribute('aria-label', state==='stop'?'Stop':'Play');
}

/* ── THE SECONDS, drawn ──────────────────────────────────────────────────
   items [{phase,s}] in speaking order. opts: limit (hard line), band [a,b],
   scale, left/right readouts. */
function timeline(items,opts){
  opts=opts||{};
  var L=opts.limit||0, total=items.reduce(function(a,x){ return a+x.s; },0);
  var scale=Math.max(opts.scale||0,L,total,1), pc=function(v){ return (v/scale*100).toFixed(2)+'%'; };
  var h='<div class="tl-track">', t=0;
  if(opts.band) h+='<i class="tl-band" style="left:'+pc(opts.band[0])+';width:'+pc(opts.band[1]-opts.band[0])+'"></i>';
  items.forEach(function(x){
    var a=t, b=t+x.s, cls='tl-seg p'+Math.max(0,Math.min(4,x.phase));
    if(L && b>L){
      if(a<L) h+='<i class="'+cls+'" style="left:'+pc(a)+';width:'+pc(L-a)+'"></i>';
      var s0=Math.max(a,L); h+='<i class="tl-seg over" style="left:'+pc(s0)+';width:'+pc(b-s0)+'"></i>';
    } else h+='<i class="'+cls+'" style="left:'+pc(a)+';width:'+pc(b-a)+'"></i>';
    t=b;
  });
  if(L) h+='<i class="tl-limit" style="left:calc('+pc(L)+' - 1px)"></i>';
  h+='<i class="tl-head" id="tlHead"></i></div>';
  h+='<div class="tl-row"><span>'+(opts.left||'')+'</span><span>'+(opts.right||'')+'</span></div>';
  $('tl').innerHTML=h; $('tl').dataset.scale=scale;
}
function head(from,to,ms){
  var el=$('tlHead'); if(!el) return; var sc=+$('tl').dataset.scale||1;
  el.classList.add('on'); el.style.transitionDuration='0ms'; el.style.left=(from/sc*100)+'%'; void el.offsetWidth;
  el.style.transitionDuration=ms+'ms'; el.style.left=(to/sc*100)+'%';
}

/* ── VOICE ───────────────────────────────────────────────────────────────
   By name: iOS voices carry no gender word, and /male/ matches "female".
   A watchdog, because iOS drops utterances without firing onend. */
var VF=/(serena|martha|kate|stephanie|sonia|hazel|susan|libby|maisie|fiona|moira|karen|tessa|samantha|victoria|zira|catherine|amelie|female)/i;
var VM=/(daniel|oliver|arthur|george|ryan|thomas|alex|fred|gordon|\bmale\b|\bman\b)/i;
function voice(fem){
  var vs=speechSynthesis.getVoices()||[];
  var gb=vs.filter(function(v){ return /en[-_]GB/i.test(v.lang); }), en=vs.filter(function(v){ return /^en/i.test(v.lang); });
  var yes=fem?VF:VM, no=fem?VM:VF;
  function f(l){ return l.filter(function(v){ return yes.test(v.name)&&!no.test(v.name); })[0]; }
  return f(gb)||f(en)||gb.filter(function(v){ return !no.test(v.name); })[0]||gb[0]||en[0]||null;
}
function say(text,fem,pitch,then){
  var n=String(text).split(/\s+/).length, pause=Math.max(1400,n*380), moved=false;
  function go(){ if(moved) return; moved=true; if(then) then(); }
  if(!SPEECH){ tmr=setTimeout(go,pause); return; }
  var u=new SpeechSynthesisUtterance(text);
  u.lang='en-GB'; u.rate=.93; u.pitch=pitch||1;
  var v=voice(fem); if(v) u.voice=v;
  u.onend=go; u.onerror=go;
  speechSynthesis.speak(u);
  tmr=setTimeout(function(){ if(!speechSynthesis.speaking) go(); }, pause+1800);
}
function hush(){ if(tmr){ clearTimeout(tmr); tmr=null; } if(SPEECH) speechSynthesis.cancel(); }

/* ── SHADOWING ───────────────────────────────────────────────────────────
   Hear it, say it, say it again, next. Paced for a fifteen-year-old
   reading aloud, not a synthesiser: the multiplier is the one number. */
var dItems=[], dIx=0, dRun=false, dTmr=null;
function drillGo(){
  if(!dRun) return;
  var it=dItems[dIx]; if(!it){ drillStop(); return; }
  var span=Math.max(2000,String(it.text).split(/\s+/).length*460);
  function bar(ms){ var b=$('drBar'); if(!b) return; b.className=''; b.style.width='0'; void b.offsetWidth;
    b.className='run'; b.style.transitionDuration=ms+'ms'; b.style.width='100%'; }
  function lab(t,on){ var s=$('drSay'); if(s){ s.textContent=t; s.classList.toggle('now',!!on); } }
  lab('listen',false); bar(span);
  say(it.text,it.fem!==false,it.pitch||1.05,function(){
    if(!dRun) return; lab('your turn — say it',true); bar(span);
    dTmr=setTimeout(function(){ if(!dRun) return; lab('again',true); bar(span);
      dTmr=setTimeout(function(){ if(!dRun) return;
        if(dIx<dItems.length-1){ dIx++; drill(); drillGo(); } else { dRun=false; drill(); } },span);
    },span);
  });
}
function drillStop(){ dRun=false; if(dTmr){ clearTimeout(dTmr); dTmr=null; } }
function drillFoot(){
  return '<div class="dr-say" id="drSay">listen</div><div class="bar"><i id="drBar"></i></div>'+
    '<div class="dr-foot">'+
    '<button class="arrow" type="button" data-d="-1"'+(dIx<=0?' disabled':'')+' aria-label="Previous">&larr;</button>'+
    '<button class="tool'+(dRun?' on':'')+'" type="button" data-d="go">'+(dRun?'■ stop':'▶ start')+'</button>'+
    '<span class="dr-n">'+(dIx+1)+' / '+dItems.length+'</span>'+
    '<button class="arrow" type="button" data-d="1"'+(dIx>=dItems.length-1?' disabled':'')+' aria-label="Next">&rarr;</button></div>';
}

/* ── THE PHRASE BANK · the shared corpus first, the page's own as fallback ── */
function bank(){
  var G=[];
  if(PH && PH.functions) Object.keys(PH.functions).forEach(function(k){
    var f=PH.functions[k];
    if(f.parts && f.parts.indexOf(PART)!==-1) G.push({l:f.label,w:f.when,p:f.phrases.map(function(x){ return x.t; })});
  });
  if(!G.length && D && D.phraseBank) G=D.phraseBank.map(function(g){ return {l:g.heading,w:g.note,p:g.phrases}; });
  $('bankBody').innerHTML=G.length?G.map(function(g){
    return '<div class="bank-g"><b>'+esc(g.l)+'</b>'+(g.w?'<i>'+esc(g.w)+'</i>':'')+
      '<ul>'+g.p.map(function(p){ return '<li>'+esc(p)+'</li>'; }).join('')+'</ul></div>';
  }).join(''):'<p class="dr-ctx">The phrase bank did not load.</p>';
  $('sheet').classList.add('open'); $('sheetX').focus();
}
function shutBank(){ $('sheet').classList.remove('open'); }
function shellWire(){
  $('bankBtn').addEventListener('click',bank);
  $('sheetX').addEventListener('click',shutBank);
  $('sheet').addEventListener('click',function(e){ if(e.target===$('sheet')) shutBank(); });
  addEventListener('resize',measure,{passive:true});
  addEventListener('scroll',function(){ document.body.classList.toggle('scrolled',scrollY>4); },{passive:true});
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape' && $('sheet').classList.contains('open')){ shutBank(); }
  });
}

var PFX='intuity.p1.', PART=1;
var D=null, PH=null, ti=0, vi=0, stage='explore', view='whole', xray=false;
var playing=false, PI=null;
var ORDER=['x','a','r','e','c'];

function topic(){ return D.topics[ti]; }
function lifeOf(tp){ return tp.lives[D.voices[vi].id]; }
/* Four moves: react, answer, reason, example. The full ladder adds the
   contrast and lands at 22–28s; Part 1 gives a candidate 15–20. So the
   model stops at four, and the contrast stays a Quiz round — exactly as
   the old page decided. */
function model(tp){ var L=lifeOf(tp).levels; return L[L.length-2]; }
function full(tp){ var L=lifeOf(tp).levels; return L[L.length-1]; }
function labels(){ return ORDER.map(function(k){ return D.moves[k].name; }); }
function mi(m){ return ORDER.indexOf(m); }
function qline(tp,label){ $('qline').innerHTML='<small>'+esc(label||'Examiner')+'</small>'+esc(tp.question); }
function items(segs){ return segs.map(function(s){ return {phase:Math.max(0,mi(s.m)), s:secs(s.t)}; }); }
function readout(total){
  return total>20 ? '<span class="hot">'+total+'s · long for Part 1</span>'
       : total>=15 ? '<span class="ink">'+total+'s · about right</span>'
       : '<span class="ink">'+total+'s</span> · aim for 15–20';
}
var MARKERS=["To be honest","If there's one thing","What I love about","What I like about","The thing about",
  "On the other hand","That said","This is mainly because","That's mainly due to","The main reason",
  "It's just that","for instance","Honestly","actually","absolutely","easily","usually","mostly",
  "Although","However","Of course","Well","Oh"];
function markFor(t){ return MARKERS.filter(function(m){ return t.indexOf(m)!==-1; }); }

/* ═══ EXPLORE ═════════════════════════════════════════════════════════ */
function explore(){
  var N=D.topics.length;
  var hd='<div class="dlg-hd">'+
    seg([{id:'whole',label:'Whole'},{id:'section',label:'Section'}],view,'data-view','sm')+
    seg(D.voices.map(function(v,i){ return {id:String(i),label:v.tab}; }),String(vi),'data-life','sm')+
    '</div><div class="dlg-sub"><button class="tool'+(xray?' on':'')+'" type="button" data-xray="1">x-ray</button>'+
    '<span class="dlg-n">'+(view==='whole'?N+' questions · the interview':'question '+(ti+1)+' of '+N)+'</span></div>';
  var list=view==='whole'?D.topics:[topic()];
  var body=list.map(function(tp){
    var k=D.topics.indexOf(tp);
    return '<div class="turn q" data-t="'+k+'"><div class="who">Examiner</div><p>'+esc(tp.question)+'</p></div>'+
      '<div class="turn mine"><div class="who">Candidate</div><p>'+model(tp).map(function(s,j){
        return '<span class="sg" data-t="'+k+'" data-j="'+j+'">'+(xray?mk(s.t,s.marks):esc(s.t))+'</span>';
      }).join(' ')+'</p></div>';
  }).join('');
  if(view==='section'){
    var dots=''; for(var j=0;j<N;j++) dots+='<button type="button" data-go="'+j+'"'+(j===ti?' class="on"':'')+
      ' aria-label="'+esc(D.topics[j].tab)+'"></button>';
    body='<div class="one">'+body+'<div class="one-foot">'+
      '<button class="arrow" type="button" data-go="'+(ti-1)+'"'+(ti<=0?' disabled':'')+' aria-label="Previous question">&larr;</button>'+
      '<div class="dots">'+dots+'</div>'+
      '<button class="arrow" type="button" data-go="'+(ti+1)+'"'+(ti>=N-1?' disabled':'')+' aria-label="Next question">&rarr;</button></div></div>';
  }
  $('body').innerHTML='<section class="dlg" aria-label="The interview">'+hd+'<div id="talk">'+body+'</div></section>';
  sheetState();
}

function sheetState(){
  var tp=topic(), segs=model(tp), now=[], done=segs.map(function(s){ return mi(s.m); });
  if(playing && PI){
    if(PI.q){ now=[]; done=[]; }
    else { now=[mi(PI.s.m)]; done=segs.slice(0,PI.j).map(function(s){ return mi(s.m); }); }
  }
  qline(tp);
  renderMoves(labels(), now, done, false);
  setHub(SPEECH?(playing?'stop':'play'):'off');
  var tot=segs.reduce(function(a,s){ return a+secs(s.t); },0);
  timeline(items(segs),{limit:20, band:[15,20], left:'react · answer · reason · example', right:readout(tot)});
  if(playing && PI && !PI.q){
    var st=segs.slice(0,PI.j).reduce(function(a,s){ return a+secs(s.t); },0);
    head(st, st+secs(PI.s.t), secs(PI.s.t)*1000);
  }
}

/* Whole: the full six-question interview, the sheet pinned while it plays
   and following each question. Section: the question on screen. */
function play(){
  if(!SPEECH) return;
  var list=view==='whole'?D.topics.map(function(_,i){ return i; }):[ti], Q=[];
  list.forEach(function(k){ Q.push({t:k,q:true});
    model(D.topics[k]).forEach(function(s,j){ Q.push({t:k,j:j,s:s}); }); });
  playing=true; var i=0;
  $('talk').classList.add('playing');
  if(view==='whole'){ measure(); $('sheetWrap').classList.add('pin'); }
  (function next(){
    if(!playing||i>=Q.length){ stop(); return; }
    PI=Q[i];
    if(PI.t!==ti){ ti=PI.t; topicMark(ti); }
    Array.prototype.forEach.call($('talk').querySelectorAll('.live'),function(x){ x.classList.remove('live'); });
    var el = PI.q ? $('talk').querySelector('.turn.q[data-t="'+PI.t+'"]')
                  : $('talk').querySelector('.sg[data-t="'+PI.t+'"][data-j="'+PI.j+'"]');
    if(el){ el.classList.add('live'); if(view==='whole' && el.scrollIntoView) el.scrollIntoView({block:'end',behavior:'smooth'}); }
    sheetState();
    say(PI.q?D.topics[PI.t].question:PI.s.t, !PI.q, PI.q?.9:1.08, function(){ i++; tmr=setTimeout(next, PI.q?380:90); });
  })();
  sheetState();
}

function stop(){
  playing=false; PI=null; hush(); drillStop(); clockStop(false);
  var el=$('talk'); if(el){ el.classList.remove('playing');
    Array.prototype.forEach.call(el.querySelectorAll('.live'),function(x){ x.classList.remove('live'); }); }
  var sw=$('sheetWrap'); if(sw) sw.classList.remove('pin');
  if(D && stage==='explore') sheetState();
}

/* ═══ PRACTICE — say it after them, one move at a time ════════════════
   Every topic, in the life you have chosen, starting with the topic that
   is selected. Above each line, the answer as it stood BEFORE this move —
   and for React, the bare answer, because the reaction goes in front. */
var dMove='x';
function drillList(m){
  var out=[], N=D.topics.length;
  for(var q=0;q<N;q++){
    var k=(ti+q)%N, tp=D.topics[k], L=lifeOf(tp), F=full(tp);
    if(m==='x'){
      var r=L.rounds.filter(function(r){ return r.move==='x'; })[0];
      var bare=F.filter(function(s){ return s.m==='a'; }).map(function(s){ return s.t; }).join(' ');
      (r?r.options:[]).filter(function(o){ return o.ok; }).forEach(function(o){
        out.push({t:k, text:o.t, marks:markFor(o.t), ctx:bare, ctxL:'the bare answer · the reaction goes in front'}); });
    } else {
      var at=F.map(function(s){ return s.m; }).indexOf(m); if(at<0) continue;
      out.push({t:k, text:F[at].t, marks:F[at].marks||[], ctx:F.slice(0,at).map(function(s){ return s.t; }).join(' '),
                ctxL:'the answer so far', before:F.slice(0,at).map(function(s){ return mi(s.m); })});
    }
  }
  return out;
}
function practice(){
  dItems=drillList(dMove); dIx=0; dRun=false;
  $('tl').style.display='none';
  $('body').innerHTML='<div class="fn-row">'+ORDER.map(function(k){
    return '<button class="fn'+(k===dMove?' on':'')+'" type="button" data-move="'+k+'">'+esc(D.moves[k].name)+
      ' <span class="n">'+drillList(k).length+'</span></button>'; }).join('')+'</div>'+
    '<p class="fn-when">'+esc(D.moves[dMove].hint.charAt(0).toUpperCase()+D.moves[dMove].hint.slice(1))+'.</p><div id="dr"></div>';
  drill();
}
function drill(){
  var it=dItems[dIx];
  if(!it){ $('dr').innerHTML='<p class="dr-ctx">Nothing to practise for this move yet.</p>'; return; }
  var tp=D.topics[it.t];
  qline(tp, tp.tab+' · '+(dIx+1)+' of '+dItems.length);
  renderMoves(labels(), [mi(dMove)], it.before||[], false);
  setHub(dRun?'stop':'play');
  $('dr').innerHTML=(it.ctx?'<p class="dr-ctx"><b>'+esc(it.ctxL)+'</b>'+esc(it.ctx)+'</p>':'')+
    '<p class="dr-line">'+mk(it.text,it.marks)+'</p>'+drillFoot();
}

/* ═══ QUIZ — build an answer ══════════════════════════════════════════
   The ladder, kept: every level written in full by a person; the page
   only chooses which to show and finds what was added. The reaction
   arrives in front. The sheet lights the move being chosen. */
var step=0, picked={}, locked=false;
function choose(segs){ return segs.map(function(x){ if(!picked[x.m]) return x;
  var c=picked[x.m]; return {t:c.t, m:x.m, marks:c.marks||[]}; }); }
function quiz(){ step=0; picked={}; qDraw(false,false); }
function qDraw(fresh,front){
  var L=lifeOf(topic()), segs=choose(L.levels[step]), r=step<L.rounds.length?L.rounds[step]:null;
  var newIdx=-1;
  if(fresh && step>0){ var prev=choose(L.levels[step-1]).map(function(x){ return x.t; });
    for(var i=0;i<segs.length;i++) if(prev.indexOf(segs[i].t)===-1){ newIdx=i; break; } }
  qline(topic());
  renderMoves(labels(), r?[mi(r.move)]:[], segs.map(function(s){ return mi(s.m); }), false);
  setHub('off');
  var tot=segs.reduce(function(a,s){ return a+secs(s.t); },0);
  timeline(items(segs),{limit:20, band:[15,20], left:tot+'s of speaking', right:readout(tot)});
  var ans='<p class="answer'+(front?' shift':'')+'">'+segs.map(function(x,i){
    return '<span class="aseg'+(i===newIdx?' new':'')+'">'+mk(x.t,x.marks)+'</span>'; }).join(' ')+'</p>';
  if(!r){
    var msg = tot>20
      ? 'That is '+tot+' seconds. Strong, but long for Part 1 — the four moves before the contrast are already a strong answer here. Save the fifth for Parts 2 and 4, where the turns are long enough to carry it.'
      : 'That is '+tot+' seconds, which is about right for Part 1. The reaction you added second is the one the examiner hears first.';
    $('body').innerHTML='<section class="dlg">'+ans+'<div class="res"><h2>Built.</h2><p>'+esc(msg)+'</p>'+
      '<button class="tool on" type="button" data-again="1">Build it again</button></div></section>';
    return;
  }
  locked=false;
  $('body').innerHTML='<section class="dlg">'+ans+'<p class="ask">'+esc(r.prompt)+'</p>'+
    '<div class="opts" id="opts"></div><div class="why" id="why"></div></section>';
  var opts=r.options.slice();
  for(var a=opts.length-1;a>0;a--){ var b=Math.floor(Math.random()*(a+1)); var t=opts[a]; opts[a]=opts[b]; opts[b]=t; }
  opts.forEach(function(o){
    var btn=document.createElement('button'); btn.className='opt'; btn.type='button'; btn.textContent=o.t;
    btn.addEventListener('click',function(){
      if(locked) return;
      if(o.ok){
        locked=true; btn.classList.add('is-ok');
        if(o.note){ $('why').textContent=o.note; $('why').classList.add('show'); }
        picked[r.move]={t:o.t, marks:markFor(o.t)};
        Array.prototype.forEach.call($('opts').children,function(x){ x.disabled=true; });
        setTimeout(function(){ step++; qDraw(true, r.where==='front'); }, o.note?1300:420);
      } else {
        btn.classList.add('is-no'); btn.disabled=true;
        $('why').textContent=o.why; $('why').classList.add('show');
      }
    });
    $('opts').appendChild(btn);
  });
}

/* ═══ TALK — your turn, for real ══════════════════════════════════════
   Twenty seconds, the question, the shape. Tap each move once you have
   said it. At the end, one way the model answered. Nothing recorded. */
var TALK=20, cLeft=0, cTmr=null, cDone=[];
function talk(){
  cLeft=TALK; cDone=[];
  $('body').innerHTML='<div class="clock" id="clk">0:'+TALK+'</div>'+
    '<p class="talk-lead" id="lead">Press the centre and answer out loud: react, answer, then a reason and an example. '+
    'Tap each move on the sheet once you have said it.</p>'+
    '<div class="model" id="model"><span class="lbl">One way to answer it</span><p id="modelP"></p></div>';
  talkSheet(0);
}
function talkSheet(el){
  qline(topic());
  renderMoves(labels(), [], cDone, true);
  setHub(cTmr?'stop':'play');
  timeline(el>0?[{phase:el>=15?4:1,s:el}]:[],{limit:20, band:[15,20], scale:20, left:'aim for 15–20 seconds', right:''});
}
function fmt(s){ s=Math.max(0,s); return Math.floor(s/60)+':'+(s%60<10?'0':'')+(s%60); }
function clockGo(){
  if(cTmr) return; $('lead').style.display='none';
  cTmr=setInterval(function(){
    cLeft--; $('clk').textContent=fmt(cLeft); $('clk').classList.toggle('low',cLeft<=5);
    talkSheet(TALK-cLeft); if(cLeft<=0) clockStop(true);
  },1000);
  talkSheet(0);
}
function clockStop(reveal){
  if(cTmr){ clearInterval(cTmr); cTmr=null; }
  if(stage!=='talk' || !$('clk')) return;
  talkSheet(TALK-cLeft);
  if(!reveal) return;
  $('modelP').innerHTML=model(topic()).map(function(s){ return mk(s.t,s.marks); }).join(' ');
  $('model').classList.add('show');
}

/* ═══ ROUTING ═════════════════════════════════════════════════════════ */
function draw(){
  $('tl').style.display='';
  if(stage==='explore') explore(); else if(stage==='practice') practice();
  else if(stage==='quiz') quiz(); else talk();
}
function setStage(s){
  stop(); stage=s; pref('stage',s);
  Array.prototype.forEach.call($('stages').children,function(b){ b.setAttribute('aria-selected',String(b.dataset.s===s)); });
  draw();
}
Array.prototype.forEach.call($('stages').children,function(b){
  b.addEventListener('click',function(){ if(b.dataset.s!==stage) setStage(b.dataset.s); }); });

function pickTopic(i){ stop(); ti=i; pref('topic',D.topics[i].id); topicRow(D.topics.map(function(t){ return t.tab; }),ti,pickTopic); draw(); }

document.addEventListener('click',function(e){
  if(e.target.closest('#playHub')){
    if(stage==='explore'){ playing?stop():play(); }
    else if(stage==='talk'){ cTmr?clockStop(false):clockGo(); }
    else if(stage==='practice'){ if(dRun){ drillStop(); drill(); } else { dRun=true; drill(); drillGo(); } }
    return;
  }
  var g=e.target.closest('[data-branch]');
  if(g && stage==='talk'){
    var k=+g.dataset.branch, at=cDone.indexOf(k); if(at===-1) cDone.push(k); else cDone.splice(at,1);
    talkSheet(TALK-cLeft); return;
  }
  var t=e.target.closest('button'); if(!t) return;
  if(t.dataset.view){ if(t.dataset.view!==view){ stop(); view=t.dataset.view; pref('view',view); explore(); } return; }
  if(t.dataset.life!==undefined){ stop(); vi=+t.dataset.life; pref('life',vi); draw(); return; }
  if(t.dataset.xray){ xray=!xray; explore(); return; }
  if(t.dataset.go!==undefined && stage==='explore'){ var n=+t.dataset.go;
    if(n>=0 && n<D.topics.length){ pickTopic(n); } return; }
  if(t.dataset.move){ drillStop(); dMove=t.dataset.move; pref('move',dMove); practice(); return; }
  if(t.dataset.d!==undefined){
    if(t.dataset.d==='go'){ if(dRun){ drillStop(); drill(); } else { dRun=true; drill(); drillGo(); } }
    else { drillStop(); dIx=Math.max(0,Math.min(dItems.length-1,dIx+(+t.dataset.d))); drill(); }
    return; }
  if(t.dataset.again){ quiz(); return; }
});
document.addEventListener('keydown',function(e){
  if(stage==='explore' && view==='section' && !$('sheet').classList.contains('open')){
    if(e.key==='ArrowRight' && ti<D.topics.length-1){ e.preventDefault(); pickTopic(ti+1); }
    if(e.key==='ArrowLeft' && ti>0){ e.preventDefault(); pickTopic(ti-1); }
  }
});
shellWire();
addEventListener('pagehide',stop);

Promise.all([
  fetch('data/part1-answers.json').then(function(r){ if(!r.ok) throw new Error('part1-answers.json '+r.status); return r.json(); }),
  fetch('data/speaking-phrases.json').then(function(r){ return r.ok?r.json():null; }).catch(function(){ return null; })
]).then(function(got){
  D=got[0]; PH=got[1];
  var p=new URLSearchParams(location.search);
  var wt=p.get('topic')||pref('topic'); if(wt) D.topics.forEach(function(t,i){ if(t.id===wt) ti=i; });
  var pv=pref('view'); if(pv==='whole'||pv==='section') view=pv;
  if(p.get('view')==='sections'||p.get('view')==='section') view='section';
  var pl=+pref('life'); if(pl>=0 && pl<D.voices.length) vi=pl;
  var pm=pref('move'); if(pm && ORDER.indexOf(pm)!==-1) dMove=pm;
  var ws=p.get('mode')||p.get('stage')||pref('stage');
  ws=({listen:'explore',read:'explore',build:'quiz',bank:'explore'})[ws]||ws;
  stage=['explore','practice','quiz','talk'].indexOf(ws)>-1?ws:'explore';
  Array.prototype.forEach.call($('stages').children,function(b){ b.setAttribute('aria-selected',String(b.dataset.s===stage)); });
  topicRow(D.topics.map(function(t){ return t.tab; }),ti,pickTopic);
  draw();
}).catch(function(e){ $('body').innerHTML='<p class="dr-ctx">data/part1-answers.json did not load ('+esc(e.message)+').</p>'; });
</script>
</body>
</html>
