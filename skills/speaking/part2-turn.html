<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F3F1ED">
<title>INTUITY — Speaking Part 2</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;900&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=7">

<style>
/* ═══════════════════════════════════════════════════════════════════════
   SPEAKING PART 2 — ONE MINUTE, THREE JOBS

   Part 1's mechanic was extension: moves accumulate and the metre asks for
   more. Reusing it here would be a template, and it would teach the wrong
   thing — Part 2 has no shortage problem. Every model turn in
   pictures-data.json runs 67 to 80 seconds against a 60-second limit.

   Part 2's skill is BUDGETING. The candidate has one minute and three jobs,
   and the way the minute is lost is always the same: fifty seconds
   describing the photographs, ten seconds on the question. So the clock is
   hard, the phases are ordered, and a sentence you can no longer afford is
   shown greyed with its price still on it. Running out is not a failure
   state bolted on — it is the thing being taught.

   ═══════════════════════════════════════════════════════════════════════ */

:root{
  --accent:#DD8E58;
  --accent-ink:#9A5A2C;
  --accent-rgb:221,142,88;
}

.header{position:sticky;padding-bottom:.5rem}
.header::after{opacity:0;transition:opacity .2s ease;width:100%}
body.scrolled .header::after{opacity:1}
.mode-btn[aria-disabled="true"]{color:var(--rule);cursor:default}

.wrap{max-width:var(--w-read);margin:0 auto;padding:1.3rem var(--gutter) 6rem}

/* ── THE PHOTOGRAPHS ─────────────────────────────────────────────────────
   Side by side, because the comparison is between them and a stacked pair
   makes a student describe one and then the other. No frame, no shadow —
   a photograph is already an object and does not need help being one. */
.pics{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:1rem}
.pics img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;
  border-radius:var(--r-field);background:var(--sunk)}

/* ── THE QUESTION ────────────────────────────────────────────────────────
   Set at heading size and never scrolled away from, because the second
   clause of it — "and say what might be difficult" — is the half that
   candidates forget, and it is the half that carries the marks. */
.task{font-family:var(--f-display);font-size:1.02rem;font-weight:600;
  line-height:1.45;color:var(--ink);letter-spacing:var(--track-display);
  margin-bottom:1.3rem}
.task b{font-weight:600;box-shadow:inset 0 -2px 0 var(--accent)}

/* ── THE CLOCK · STYLE ───────────────────────────────────────────────────────────
   One bar, three segments, filling left to right in the order the turn is
   spoken. The mark at 30s is the advice: about half the minute on the
   photographs, about half on the question. The source data agrees —
   answer_question is the longest step in all eight topics. */
.clock{margin-bottom:.5rem}
.clock-track{position:relative;display:flex;height:10px;border-radius:2px;
  background:var(--slot-bg);overflow:hidden}
.clock-seg{height:100%;width:0;transition:width .3s cubic-bezier(.2,.9,.3,1)}
.clock-seg.p0{background:var(--accent);opacity:.45}
.clock-seg.p1{background:var(--accent);opacity:.72}
.clock-seg.p2{background:var(--accent)}
.clock-half{position:absolute;left:50%;top:0;bottom:0;width:1px;
  background:var(--edge);opacity:.55;z-index:2}
.clock-row{display:flex;justify-content:space-between;align-items:baseline;
  margin-top:.45rem;font-family:var(--f-mono);font-size:.66rem;
  color:var(--faint);font-variant-numeric:tabular-nums}
.clock-left{color:var(--ink)}
.clock-left.tight{color:var(--wrong)}

/* ── THE PILLS ───────────────────────────────────────────────────────────
   The same four as Parts 1, 3 and 4. Only Build differs. */
.pills{display:flex;gap:.15rem;flex-wrap:wrap;align-items:center;
  padding-top:.9rem;border-top:1px solid var(--rule);margin-bottom:.2rem}
.pill-b{font-family:var(--f-display);font-size:.66rem;font-weight:600;
  letter-spacing:.05em;padding:.4rem .72rem;border:none;border-radius:var(--r-chip);
  background:none;color:var(--faint);cursor:pointer;white-space:nowrap;
  transition:background .15s,color .15s}
@media(hover:hover){ .pill-b:hover{color:var(--sentence)} }
.pill-b.on{background:var(--tile-bg);color:var(--tile-ink);font-weight:700}
.tools{display:flex;align-items:center;gap:.5rem;min-height:2.1rem;
  margin-bottom:1.1rem;flex-wrap:wrap}
.tool{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.08em;
  text-transform:uppercase;color:var(--faint);background:none;border:none;
  padding:.35rem .5rem;border-radius:var(--r-chip);cursor:pointer;
  transition:background .15s,color .15s}
.tool.on{background:var(--tile-bg);color:var(--accent-ink)}
.tool-n{font-family:var(--f-mono);font-size:.62rem;color:var(--faint);margin-left:auto}

/* ── THE MODEL, AND THE LINE ─────────────────────────────────────────────
   Part 2's exception, and it turned out to be the best thing on the page.

   Every model turn in the source runs 67 to 80 seconds against a 60-second
   limit, so Listen cannot simply play it: doing so would teach the opposite
   of what Build teaches. Cutting it for time would mean inventing an edit
   nobody wrote.

   So the whole model plays, and the page draws a line at the exact sentence
   where sixty seconds elapses — the point the interlocutor would stop you.
   Nothing is removed, nothing is invented, and the lesson is the one thing a
   student cannot get from a transcript: how quickly a minute goes. */
.mturn{margin-bottom:.9rem;transition:opacity .3s ease}
.mphase{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.11em;
  text-transform:uppercase;color:var(--faint);margin:1.5rem 0 .55rem}
.mphase:first-child{margin-top:0}
.mline{display:flex;align-items:flex-start;gap:.8rem;font-size:.96rem;
  line-height:1.65;color:var(--sentence)}
.mline .c{flex:none;font-family:var(--f-mono);font-size:.68rem;color:var(--faint);
  padding-top:.2em;font-variant-numeric:tabular-nums;min-width:3.2ch}
.playing .mturn{opacity:.32}
.playing .mturn.live{opacity:1}
/* Past the minute, the words are still there and visibly no longer counted. */
.mturn.past .mline{color:var(--faint)}
.cutoff{display:flex;align-items:center;gap:.7rem;margin:1.1rem 0;
  font-family:var(--f-mono);font-size:.62rem;letter-spacing:.08em;
  text-transform:uppercase;color:var(--wrong)}
.cutoff::before,.cutoff::after{content:'';flex:1;height:1px;background:var(--wrong);opacity:.5}
.xr-m{box-shadow:inset 0 -2px 0 var(--accent)}

.bank-g{padding:.85rem 0;border-top:1px solid var(--rule)}
.bank-g b{display:block;font-family:var(--f-display);font-size:.74rem;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;color:var(--ink);margin-bottom:.2rem}
.bank-g i{display:block;font-style:normal;font-size:.8rem;line-height:1.5;
  color:var(--dim);margin-bottom:.55rem}
.bank-g ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:.3rem}
.bank-g li{font-size:.84rem;color:var(--tile-ink);background:var(--tile-bg);
  border-radius:var(--r-chip);padding:.32rem .6rem}
.sheet-card{align-items:stretch;text-align:left;gap:0;max-width:27rem}
.sheet-card h2{font-family:var(--f-display);font-size:1.12rem;font-weight:900;
  letter-spacing:var(--track-display);color:var(--ink);margin-bottom:.9rem}
.sheet-card .close-btn{position:absolute;top:.7rem;right:.7rem}

/* ── THE TURN SO FAR ─────────────────────────────────────────────────────
   Prose, growing. The same object as Part 1's answer, deliberately: a
   student who has done Part 1 should recognise what they are making. */
.turn{font-size:.98rem;line-height:1.75;color:var(--sentence);
  min-height:3.2em;margin:1.4rem 0 1.5rem}
.turn:empty::before{content:'Your minute starts empty.';color:var(--faint)}
.seg{animation:segIn .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes segIn{from{opacity:0}to{opacity:1}}
.mk{box-shadow:inset 0 -2px 0 var(--accent)}

/* ── THE PHASE ───────────────────────────────────────────────────────────
   Three phases, in order, and the row names which one is open. A student
   can leave a phase early; that is the whole decision the page exists to
   make them take. */
.phases{display:flex;gap:.35rem;margin-bottom:1.1rem;flex-wrap:wrap}
.ph{font-family:var(--f-display);font-size:.62rem;font-weight:600;
  letter-spacing:.07em;text-transform:uppercase;padding:.3rem .62rem;
  border-radius:var(--r-chip);background:var(--sunk);color:var(--rule)}
.ph.done{background:var(--tile-bg);color:var(--tile-ink)}
.ph.here{background:var(--tile-bg);color:var(--accent-ink);font-weight:700}

.phase-h{display:flex;align-items:baseline;gap:.6rem;margin-bottom:.7rem}
.phase-h b{font-family:var(--f-display);font-size:.94rem;font-weight:700;
  color:var(--ink)}
.phase-h i{font-style:normal;font-size:.82rem;color:var(--dim)}

/* A line you can say, with what it costs. The price is always visible,
   including on the ones you can no longer afford — that is the lesson. */
.lines{display:flex;flex-direction:column;gap:.45rem}
.line{display:flex;align-items:flex-start;gap:.8rem;width:100%;text-align:left;
  font-size:.92rem;line-height:1.5;padding:.72rem .9rem;border:none;
  border-radius:var(--r-field);background:var(--tile-bg);color:var(--tile-ink);
  cursor:pointer;transition:background .14s,transform .1s cubic-bezier(.2,.8,.2,1)}
@media(hover:hover){ .line:hover:not(:disabled){background:var(--tile-bg-press)} }
.line:active:not(:disabled){transform:scale(.99)}
.line .c{flex:none;font-family:var(--f-mono);font-size:.7rem;color:var(--dim);
  padding-top:.12em;font-variant-numeric:tabular-nums}
.line.used{background:var(--sunk);color:var(--faint);cursor:default}
.line.used .c{color:var(--faint)}
/* Not disabled-and-hidden: greyed, priced, and still legible. A student who
   cannot afford a sentence should be able to read exactly what they lost. */
.line.broke{background:none;color:var(--rule);cursor:default}
.line.broke .c{color:var(--wrong)}

.bar{display:flex;align-items:center;gap:.8rem;margin-top:1.2rem}
.next{font-family:var(--f-display);font-size:.72rem;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);
  background:none;border:none;padding:.5rem 0;cursor:pointer}
.next:disabled{color:var(--rule);cursor:default}

/* ── THE RESULT · STYLE ──────────────────────────────────────────────────────────
   Not a score. The split, and whether the question got its half. */
.res{display:none;margin-top:1.5rem}
.res.show{display:block}
.res h2{font-family:var(--f-display);font-size:1.1rem;font-weight:900;
  letter-spacing:var(--track-display);color:var(--ink);margin-bottom:.5rem}
.res p{font-size:.92rem;line-height:1.6;color:var(--sentence);margin-bottom:1rem}
.res .miss{color:var(--wrong)}
.split{display:flex;flex-direction:column;gap:.4rem;margin-bottom:1.2rem}
.split-row{display:flex;align-items:center;gap:.7rem;font-family:var(--f-mono);
  font-size:.7rem;color:var(--dim);font-variant-numeric:tabular-nums}
.split-row span:first-child{min-width:7.5rem;font-family:var(--f-body);
  font-size:.82rem;color:var(--ink)}
.split-bar{height:8px;border-radius:2px;background:var(--accent)}

.voice{display:flex;align-items:center;gap:.3rem;margin-top:2.2rem;flex-wrap:wrap}
.voice-l{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--faint);margin-right:.35rem}
.vb{font-family:var(--f-display);font-size:.66rem;font-weight:600;
  letter-spacing:.05em;padding:.36rem .7rem;border:none;border-radius:var(--r-chip);
  background:none;color:var(--faint);cursor:pointer;transition:background .15s,color .15s}
.vb.on{background:var(--tile-bg);color:var(--tile-ink);font-weight:700}
.voice-n{width:100%;font-size:.8rem;color:var(--dim);margin-top:.5rem}

@media(max-width:560px){
  .task{font-size:.94rem}
  .line{font-size:.88rem}
}
@media(prefers-reduced-motion:reduce){ .seg{animation:none} }
</style>
</head>
<body>

<header class="header">
  <div class="header-top">
    <a class="back-link" href="/index.html?openModal=speaking" target="_top">← Speaking</a>
    <div class="header-title">
      <div class="app-title">INTUITY</div>
      <div class="app-subtitle">Speaking</div>
    </div>
    <span class="header-spacer">Level <b>B2</b></span>
  </div>
  <!-- Generated by tools/check-pages.py --fix-nav. All four parts,
       same row on every page. Do not hand-edit one copy. -->
  <nav class="mode-selector" aria-label="Exam part">
    <a class="mode-btn" href="part1-builder.html">Part 1</a>
    <span class="mode-btn active" aria-current="page">Part 2</span>
    <a class="mode-btn" href="part3-talk.html">Part 3</a>
    <a class="mode-btn" href="part4-views.html">Part 4</a>
  </nav>

  <div class="set-tabs" id="tabs"></div>
</header>

<main class="wrap">
  <nav class="pills" id="pills" aria-label="Mode">
    <button class="pill-b" type="button" data-m="listen">Listen · full turn</button>
    <button class="pill-b" type="button" data-m="read">Read · full turn</button>

  </nav>
  <div class="tools" id="tools"></div>

  <div class="pics" id="pics"></div>

  <div class="clock">
    <div class="clock-track">
      <div class="clock-half"></div>
      <div class="clock-seg p0" id="s0"></div>
      <div class="clock-seg p1" id="s1"></div>
      <div class="clock-seg p2" id="s2"></div>
    </div>
    <div class="clock-row">
      <span id="spent">0s spoken</span>
      <span class="clock-left" id="left">60s left</span>
    </div>
  </div>

  <section id="model" style="display:none"></section>

  <div class="turn" id="turn"></div>

  <div id="build">
    <div class="phases" id="phases"></div>
    <div class="phase-h"><b id="phName"></b><i id="phHint"></i></div>
    <div class="lines" id="lines"></div>
    <div class="bar">
      <button class="next" type="button" id="nextBtn"></button>
    </div>
  </div>

  <div class="res" id="res">
    <h2 id="resH"></h2>
    <p id="resP"></p>
    <div class="split" id="split"></div>
    <button class="next" type="button" id="againBtn">Try the minute again</button>
  </div>

  <div class="voice">
    <span class="voice-l">Phrasing</span>
    <span id="voices"></span>
    <span class="voice-n" id="voiceN"></span>
  </div>
</main>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="bankH">
  <div class="sheet-card">
    <button class="close-btn" id="sheetX" type="button" aria-label="Close">
      <svg width="15" height="15" viewBox="0 0 15 15" aria-hidden="true">
        <path d="M3 3 L12 12 M12 3 L3 12" stroke="currentColor"
              stroke-width="1.8" stroke-linecap="round" fill="none"/>
      </svg>
    </button>
    <h2 id="bankH">Comparing, and knowing when to stop</h2>
    <div id="bankBody"></div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   THE ENGINE

   State is four numbers: which task, which style, which phase, and the
   seconds spent. Everything else is read from the JSON, and the JSON is
   derived from pictures-data.json at sentence boundaries — nothing in it
   was written for this page.
   ═══════════════════════════════════════════════════════════════════════ */

var D=null, ti=0, si=0, ph=0, spent=0, chosen=[], done=false;
var mode='build', xray=false, playing=false, playIx=0;
var SPEECH=('speechSynthesis' in window);

var $=function(id){ return document.getElementById(id); };
var esc=function(s){ return s.replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };

/* ── MODES ────────────────────────────────────────────────────────────────
   Listen and Read show the model turn Build has you assemble — the same
   sentences, at the same task, in the same register. */
function setMode(m){
  if(m==='bank'){ bank(); return; }
  stopPlay();
  mode=m;
  Array.prototype.forEach.call($('pills').children,function(b){
    b.classList.toggle('on', b.dataset.m===m);
  });
  var iv = m==='listen'||m==='read';
  $('model').style.display = iv ? '' : 'none';
  $('build').style.display = iv ? 'none' : '';
  $('turn').style.display  = iv ? 'none' : '';
  document.querySelector('.clock').style.display = iv ? 'none' : '';
  $('res').classList.remove('show');
  tools();
  if(iv) drawModel(); else reset();
}

function tools(){
  var T=$('tools'); if(!T) return;
  T.innerHTML='';
  function btn(label,on,fn){
    var b=document.createElement('button');
    b.className='tool'+(on?' on':''); b.type='button'; b.textContent=label;
    b.addEventListener('click',fn); T.appendChild(b); return b;
  }
  var n=document.createElement('span'); n.className='tool-n';
  var total=modelLines().reduce(function(a,x){ return a+x.s; },0);
  /* Three of the twenty-four model turns fit inside the minute. Saying so
     matters: a student who only ever meets the over-long ones learns that
     Part 2 is impossible rather than that it is tight. */
  var fits = total<=D.limit;
  var verdict = fits ? total+'s — this one just fits'
                     : total+'s against a '+D.limit+'s limit';
  if(mode==='listen'){
    if(!SPEECH){ n.textContent='this browser has no speech'; T.appendChild(n); return; }
    btn(playing?'■ stop':'▶ play the whole model',playing,function(){
      playing?stopPlay():startPlay(); });
    n.textContent=verdict;
  } else if(mode==='read'){
    btn('x-ray',xray,function(){ xray=!xray; tools(); drawModel(); });
    n.textContent = xray ? 'the phrase that opens each move' : verdict;
  } else {
    n.textContent='you have '+D.limit+' seconds';
  }
  T.appendChild(n);
}

/* Every sentence of the model, in order, each carrying its own cost and the
   running total at the point it ends. */
function modelLines(){
  var out=[], run=0;
  D.phases.forEach(function(p,pi){
    phase(pi).forEach(function(l,li){
      run+=l.s;
      out.push({t:l.t, s:l.s, at:run, phase:pi, first:li===0});
    });
  });
  return out;
}

function mark(l){
  var t=esc(l.t);
  if(!xray) return t;
  (l.marks||[]).forEach(function(m){
    var e=esc(m).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    t=t.replace(new RegExp('(?![^<]*>)('+e+')'),'<span class="xr-m">$1</span>');
  });
  return t;
}

function drawModel(){
  var L=modelLines(), src=[];
  D.phases.forEach(function(p,pi){ phase(pi).forEach(function(l){ src.push(l); }); });
  var out='', drawn=false;
  L.forEach(function(l,i){
    if(l.first) out+='<div class="mphase">'+esc(D.phases[l.phase].name)+'</div>';
    /* The line is drawn before the first sentence that ENDS past the minute,
       so the sentence it interrupts is visibly the one you would be cut off
       in the middle of. */
    if(!drawn && l.at>D.limit){
      out+='<div class="cutoff">'+D.limit+' seconds — the examiner stops you here</div>';
      drawn=true;
    }
    out+='<div class="mturn'+(l.at>D.limit?' past':'')+'" data-i="'+i+'">'+
      '<div class="mline"><span class="c">'+l.at+'s</span><span>'+
      mark(src[i])+'</span></div></div>';
  });
  $('model').innerHTML=out;
}

/* ── PLAY ───────────────────────────────────────────────────────────────── */
function startPlay(){
  if(!SPEECH) return;
  var L=modelLines(); playing=true; playIx=0;
  $('model').classList.add('playing'); tools();
  (function next(){
    if(!playing||playIx>=L.length){ stopPlay(); return; }
    var l=L[playIx];
    Array.prototype.forEach.call($('model').querySelectorAll('.mturn'),function(el){
      el.classList.toggle('live', +el.dataset.i===playIx); });
    var u=new SpeechSynthesisUtterance(l.t);
    u.lang='en-GB'; u.rate=0.95; u.pitch=1.05;
    var v=pickVoice('candidate'); if(v) u.voice=v;
    u.onend=function(){ playIx++; setTimeout(next,120); };
    u.onerror=function(){ stopPlay(); };
    speechSynthesis.speak(u);
  })();
}
function stopPlay(){
  playing=false;
  if(SPEECH) speechSynthesis.cancel();
  var el=$('model');
  if(el){ el.classList.remove('playing');
    Array.prototype.forEach.call(el.querySelectorAll('.live'),function(x){
      x.classList.remove('live'); }); }
  if($('tools')) tools();
}

/* ── CHOOSING A VOICE ────────────────────────────────────────────────────
   This was broken on iOS, and in two separate ways.

   FIRST: the old test for a man was /male/i — which matches "female". The
   substring is right there, so the examiner filter would cheerfully pick a
   woman if her name happened to contain the word.

   SECOND, and the reason an iPhone always read in the same dull man's
   voice: iOS voice names carry NO gender word. They are called Serena,
   Martha, Daniel, Arthur. So /female/i matched nothing at all, every
   lookup fell through to "the first en-GB voice in the list", and on iOS
   that is Daniel. No setting on the phone could have changed it, because
   the page was never asking for anything else.

   So voices are matched BY NAME against the ones the platforms actually
   ship — Apple, Google and Microsoft — with the gender words kept only as
   a last resort for desktop engines that do use them. */
var VOICE_F = /(serena|martha|kate|stephanie|sonia|hazel|susan|libby|maisie|fiona|moira|karen|tessa|samantha|victoria|zira|catherine|amelie|female)/i;
var VOICE_M = /(daniel|oliver|arthur|george|ryan|thomas|alex|fred|gordon|\bmale\b|\bman\b)/i;

function pickVoice(who){
  var vs = speechSynthesis.getVoices() || [];
  var wantF = who !== 'examiner';           /* the candidate is a woman */
  var gb = vs.filter(function(v){ return /en[-_]GB/i.test(v.lang); });
  var en = vs.filter(function(v){ return /^en/i.test(v.lang); });

  function find(list, yes, no){
    return list.filter(function(v){ return yes.test(v.name) && !no.test(v.name); })[0];
  }
  var yes = wantF ? VOICE_F : VOICE_M, no = wantF ? VOICE_M : VOICE_F;

  return find(gb, yes, no)                  /* a British voice of the right sex */
      || find(en, yes, no)                  /* any English one */
      /* Nothing named: take a British voice that is at least not obviously
         the other sex, rather than the first in the list. */
      || gb.filter(function(v){ return !no.test(v.name); })[0]
      || gb[0] || en[0] || null;
}


function bank(){
  $('bankBody').innerHTML=D.phraseBank.map(function(g){
    return '<div class="bank-g"><b>'+esc(g.heading)+'</b>'+
      (g.note?'<i>'+esc(g.note)+'</i>':'')+'<ul>'+
      g.phrases.map(function(p){ return '<li>'+esc(p)+'</li>'; }).join('')+
      '</ul></div>';
  }).join('');
  $('sheet').classList.add('open'); $('sheetX').focus();
}
function shutBank(){ $('sheet').classList.remove('open'); }

function task(){ return D.tasks[ti]; }
function turn(){ return task().turns[D.styles[si].id]; }
function phase(i){ return turn()[D.phases[i].id]; }
function left(){ return D.limit - spent; }

function markup(l){
  var t=esc(l.t);
  (l.marks||[]).forEach(function(m){
    var e=esc(m).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    t=t.replace(new RegExp('('+e+')'),'<span class="mk">$1</span>');
  });
  return t;
}

/* ── THE CLOCK ────────────────────────────────────────────────────────── */
function clock(){
  var per=[0,0,0];
  chosen.forEach(function(c){ per[c.ph]+=c.s; });
  [0,1,2].forEach(function(i){
    $('s'+i).style.width=(per[i]/D.limit*100)+'%';
  });
  $('spent').textContent=spent+'s spoken';
  /* The number that matters during phases 1 and 2 is not what you have
     said — it is what is left for the question. */
  var l=left();
  $('left').textContent = ph<2 ? (l+'s left for the question') : (l+'s left');
  $('left').classList.toggle('tight', l<15);
  return per;
}

/* ── RENDER ───────────────────────────────────────────────────────────── */
function draw(fresh){
  var t=task();

  $('pics').innerHTML=t.photos.map(function(p){
    return '<img src="'+esc(p.src)+'" alt="'+esc(p.title)+'" loading="lazy">';
  }).join('');

  /* The 'and say…' clause is underlined, because it is the half of the
     question that gets forgotten and the half that carries the marks. */
  $('task').innerHTML=esc(t.question).replace(/(and say[^.]*)/,'<b>$1</b>');

  $('turn').innerHTML=chosen.map(function(c,i){
    return '<span class="seg"'+(fresh&&i===chosen.length-1?'':' style="animation:none"')+
           '>'+markup(c)+'</span>';
  }).join(' ');

  $('phases').innerHTML=D.phases.map(function(p,i){
    return '<span class="ph'+(i<ph?' done':(i===ph?' here':''))+'">'+esc(p.name)+'</span>';
  }).join('');

  clock();
  if(done){ return; }

  $('phName').textContent=D.phases[ph].name;
  $('phHint').textContent=D.phases[ph].hint;

  var used={}; chosen.forEach(function(c){ used[c.t]=1; });
  $('lines').innerHTML='';
  phase(ph).forEach(function(l){
    var b=document.createElement('button');
    b.type='button';
    var isUsed=!!used[l.t], broke=!isUsed && l.s>left();
    b.className='line'+(isUsed?' used':(broke?' broke':''));
    b.innerHTML='<span class="c">'+l.s+'s</span><span>'+esc(l.t)+'</span>';
    if(isUsed||broke){ b.disabled=true; }
    else { b.addEventListener('click',function(){ say(l); }); }
    $('lines').appendChild(b);
  });

  var last = ph===D.phases.length-1;
  $('nextBtn').textContent = last ? 'Finish the turn' : 'Move on →';
  $('nextBtn').disabled=false;

  /* If nothing in this phase is affordable any more, the turn is over.
     The interlocutor does not wait for you to find a shorter sentence. */
  var any=phase(ph).some(function(l){ return !used[l.t] && l.s<=left(); });
  if(!any && !last && left()<=0){ finish(true); }
}

function say(l){
  chosen.push({t:l.t,s:l.s,marks:l.marks,ph:ph});
  spent+=l.s;
  draw(true);
  if(left()<=0){ finish(true); }
}

$('nextBtn').addEventListener('click',function(){
  if(ph===D.phases.length-1){ finish(false); }
  else { ph++; draw(false); }
});

/* ── THE RESULT ───────────────────────────────────────────────────────── */
function finish(cut){
  done=true;
  $('build').style.display='none';
  $('res').classList.add('show');

  var per=clock();
  var describing=per[0]+per[1], answering=per[2];

  $('split').innerHTML=D.phases.map(function(p,i){
    return '<div class="split-row"><span>'+esc(p.name)+'</span>'+
      '<div class="split-bar" style="width:'+(per[i]/D.limit*100*2.2)+'%"></div>'+
      '<span>'+per[i]+'s</span></div>';
  }).join('');

  if(answering===0){
    $('resH').textContent='You never answered the question.';
    $('resP').innerHTML='<span class="miss">'+describing+' seconds on the photographs and '+
      'nothing on the question.</span> This is the commonest way to lose Part 2: the '+
      'description is the easy half and it eats the minute. The question is where the marks are.';
  } else if(cut && answering<12){
    $('resH').textContent='Cut off mid-answer.';
    $('resP').innerHTML='<span class="miss">'+describing+'s describing, '+answering+
      's answering.</span> You reached the question with almost nothing left. Drop two '+
      'sentences from the description next time and spend them here instead.';
  } else if(answering>=describing*0.8){
    $('resH').textContent='That is the shape.';
    $('resP').textContent=describing+'s on the photographs, '+answering+
      's on the question — roughly the half and half the task asks for, inside the minute.';
  } else {
    $('resH').textContent='Description-heavy.';
    $('resP').textContent=describing+'s describing against '+answering+
      's answering. It fits the minute, but the balance is wrong: the question '+
      'deserves about half, and it is the part an examiner is listening hardest to.';
  }
}

$('againBtn').addEventListener('click',function(){ reset(); });

Array.prototype.forEach.call($('pills').children,function(b){
  b.addEventListener('click',function(){ setMode(b.dataset.m); });
});
$('sheetX').addEventListener('click',shutBank);
$('sheet').addEventListener('click',function(e){ if(e.target===$('sheet')) shutBank(); });
addEventListener('keydown',function(e){
  if(e.key==='Escape' && $('sheet').classList.contains('open')) shutBank(); });
addEventListener('pagehide',stopPlay);

function reset(){
  ph=0; spent=0; chosen=[]; done=false;
  $('build').style.display='';
  $('res').classList.remove('show');
  draw(false);
}

/* ── TABS AND PHRASING ────────────────────────────────────────────────── */
function chrome(){
  $('tabs').innerHTML='';
  D.tasks.forEach(function(t,i){
    var b=document.createElement('button');
    b.className='vtab'+(i===ti?' active':'');
    b.type='button'; b.textContent=t.tab;
    b.addEventListener('click',function(){ ti=i; stopPlay(); chrome();
      if(mode==='listen'||mode==='read'){ tools(); drawModel(); } else reset(); });
    $('tabs').appendChild(b);
  });

  $('voices').innerHTML='';
  D.styles.forEach(function(s,i){
    var b=document.createElement('button');
    b.className='vb'+(i===si?' on':'');
    b.type='button'; b.textContent=s.tab;
    b.addEventListener('click',function(){ si=i; stopPlay(); chrome();
      if(mode==='listen'||mode==='read'){ tools(); drawModel(); } else reset(); });
    $('voices').appendChild(b);
  });

  /* Worth saying out loud, because it is counter-intuitive and it falls out
     of the data rather than being asserted: the simple phrasing is the
     LONGEST in nearly every task. Denser wording buys seconds. */
  var tot={};
  D.styles.forEach(function(s){
    var T=task().turns[s.id], n=0;
    D.phases.forEach(function(p){ T[p.id].forEach(function(l){ n+=l.s; }); });
    tot[s.id]=n;
  });
  var mine=tot[D.styles[si].id];
  $('voiceN').textContent='All of it would take '+mine+'s. You have '+D.limit+
    ', so '+(mine>D.limit ? 'something has to go.' : 'it just fits — but only just.');
}

addEventListener('scroll',function(){
  document.body.classList.toggle('scrolled',scrollY>4);
},{passive:true});

fetch('data/part2-turn.json')
  .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(function(d){
    D=d;
    var p=new URLSearchParams(location.search);
    var wt=p.get('topic'); if(wt) D.tasks.forEach(function(t,i){ if(t.id===wt) ti=i; });
    chrome();
    var wm=p.get('mode');
    setMode(['listen','read','build'].indexOf(wm)>-1 ? wm : 'listen');
  })
  .catch(function(e){
    $('task').textContent='Could not load the tasks.';
    $('turn').textContent='data/part2-turn.json did not load ('+e.message+').';
  });
</script>
</body>
