<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F3F1ED">
<title>INTUITY — Speaking Part 2</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;900&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=8">

<style>
/* ═══════════════════════════════════════════════════════════════════════
   SPEAKING PART 2 — ONE MINUTE, THREE JOBS · PHONE FIRST

   The same screen as Part 3, top to bottom:

     1  the topic       one line, slides sideways
     2  the stage       Explore · Practice · Quiz · Talk
     3  the sheet       the question, TWO PHOTOS, play where they meet,
                        and under them the minute as a line
     4  the monologue   the model turn, with its own whole/section switch

   Part 3's sheet is a spider because its task is five prompts. Part 2's is
   two photographs and a clock, because its task is a minute: every model
   turn in the data runs 66 to 80 seconds against a 60-second limit. Part 2
   is a BUDGETING task, and the failure it punishes is fifty seconds
   describing and ten on the question. So the minute is drawn, the 60-second
   mark is on it, and the model visibly runs past it.

   WHICH PHOTO: read from the sentence. "The first", "the second", "both",
   or a word from one photo's title that the other lacks ("office", "café").
   A sentence that names neither stays on the photo already under
   discussion. Tested against the Work model: fifteen sentences, fifteen
   right.
   ═══════════════════════════════════════════════════════════════════════ */

:root{ --accent:#DD8E58; --accent-ink:#9A5A2C; --accent-rgb:221,142,88;
  --bg:var(--screen,var(--page-bg,#F3F1ED)); }

.header{position:sticky;top:0;z-index:20;background:var(--bg);padding-bottom:.35rem}
.header::after{opacity:0;transition:opacity .2s ease;width:100%}
body.scrolled .header::after{opacity:1}
.wrap{max-width:40rem;margin:0 auto;padding:.9rem var(--gutter,1rem) 6rem}

/* ── STOPGAP ─── .seg / .tool / .dots belong to the shell (v8). Delete this
   block once v8 is confirmed live on this page. ─────────────────────────── */
.seg{display:inline-flex;align-items:center;padding:.18rem;background:var(--tile-bg);border-radius:999px}
.seg button{font-family:var(--f-display);font-size:.7rem;font-weight:600;letter-spacing:.03em;
  color:var(--dim);background:none;border:none;cursor:pointer;padding:.45rem .9rem;
  border-radius:999px;min-height:34px;white-space:nowrap;
  transition:background .18s cubic-bezier(.2,.8,.2,1),color .18s,box-shadow .18s}
.seg button[aria-selected="true"]{background:var(--bg);color:var(--ink);font-weight:700;
  box-shadow:0 1px 2px rgba(0,0,0,.07)}
.tool{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--faint);background:none;border:none;cursor:pointer;padding:.5rem .5rem;min-height:36px}
.tool.on{color:var(--accent-ink)}
.dots{display:flex;align-items:center;justify-content:center;gap:.1rem}
.dots button{width:24px;height:24px;padding:0;border:none;background:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.dots button::after{content:'';width:6px;height:6px;border-radius:50%;background:var(--rule);
  transition:background .2s,transform .2s}
.dots button.on::after{background:var(--accent);transform:scale(1.25)}
/* ── end stopgap ── */

/* ── 1 · THE TOPIC · one line, sliding ─────────────────────────────────── */
.topics{display:flex;gap:.1rem;overflow-x:auto;scroll-snap-type:x proximity;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;padding:0 1rem;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 1rem,#000 calc(100% - 1rem),transparent 100%);
          mask-image:linear-gradient(90deg,transparent 0,#000 1rem,#000 calc(100% - 1rem),transparent 100%)}
.topics::-webkit-scrollbar{display:none}
.topics button{flex:none;scroll-snap-align:center;font-family:var(--f-mono);font-size:.64rem;
  letter-spacing:.08em;text-transform:uppercase;color:var(--faint);background:none;border:none;
  cursor:pointer;padding:.7rem .6rem;position:relative;white-space:nowrap;min-height:40px;
  transition:color .15s}
.topics button.on{color:var(--ink)}
.topics button.on::after{content:'';position:absolute;left:.6rem;right:.6rem;bottom:.4rem;
  height:1.5px;background:var(--accent);border-radius:1px}
@media(min-width:720px){ .topics{justify-content:center;-webkit-mask-image:none;mask-image:none} }

/* ── 2 · THE STAGE ─────────────────────────────────────────────────────── */
.stage-row{display:flex;justify-content:center;margin:.3rem 0 1.1rem}

/* ── 3 · THE SHEET ─────────────────────────────────────────────────────── */
.sheet-wrap{background:var(--bg);padding:.2rem 0 .7rem}
.sheet-wrap.pin{position:sticky;top:var(--hh,120px);z-index:10;border-bottom:1px solid var(--rule)}

/* The question. Its second clause — "and say what might be difficult" — is
   the half candidates forget and the half that carries the marks, so it is
   underlined. */
.qline{font-family:var(--f-display);font-size:.98rem;font-weight:600;line-height:1.4;
  color:var(--ink);text-align:center;margin:0 auto .7rem;max-width:30rem}
.qline small{display:block;font-family:var(--f-mono);font-size:.58rem;font-weight:400;
  letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:.3rem}
.qline b{font-weight:600;box-shadow:inset 0 -2px 0 var(--accent)}

/* The two photographs, side by side, because the comparison is BETWEEN them.
   The hub sits where they meet. */
.pics{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:.45rem}
.pic{position:relative;border-radius:var(--r-field,12px);overflow:hidden;
  aspect-ratio:4/3;background:var(--tile-bg);transition:opacity .35s ease,box-shadow .35s ease}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
/* If a photo fails, say what it was, rather than leave an empty box. */
.pic.fail{display:flex;align-items:center;justify-content:center;text-align:center;padding:.6rem}
.pic.fail span{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.08em;
  text-transform:uppercase;color:var(--faint)}
.pics.talking .pic{opacity:.4}
.pics.talking .pic.now{opacity:1;box-shadow:0 0 0 2px var(--accent)}
.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;
  width:56px;height:56px;border-radius:50%;border:3px solid var(--bg);background:var(--ink);
  cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;
  transition:background .2s}
.hub svg{display:block}
.hub:disabled{background:var(--rule);cursor:default}
@media(hover:hover){ .hub:not(:disabled):hover{background:var(--accent-ink)} }
.hub:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ── THE MINUTE ────────────────────────────────────────────────────────────
   Drawn to scale. Three phases in the order they are spoken, a mark at the
   half — the advice is about half on the photos, half on the question —
   and a hard line at sixty seconds. When a turn runs past, the overrun is
   visibly past the line, and the line does not move. */
.tl{position:relative;margin-top:.8rem}
.tl-track{position:relative;height:8px;border-radius:2px;background:var(--rule);opacity:1;overflow:visible}
.tl-seg{position:absolute;top:0;height:100%;background:var(--accent);transition:left .3s,width .3s}
.tl-seg.p0{opacity:.4}.tl-seg.p1{opacity:.68}.tl-seg.p2{opacity:1}
.tl-seg.over{background:var(--wrong);opacity:.55}
.tl-seg.dim{opacity:.15}
.tl-half{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--faint);opacity:.6}
.tl-limit{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink)}
.tl-head{position:absolute;top:-5px;width:2px;height:18px;background:var(--ink);
  border-radius:1px;transition-property:left;transition-timing-function:linear;display:none}
.tl-head.on{display:block}
.tl-row{display:flex;justify-content:space-between;align-items:baseline;margin-top:.5rem;
  font-family:var(--f-mono);font-size:.62rem;color:var(--faint);font-variant-numeric:tabular-nums}
.tl-row .hot{color:var(--wrong)}
.tl-row .ink{color:var(--ink)}

/* ── 4 · THE MONOLOGUE ─────────────────────────────────────────────────── */
.dlg{margin-top:1.1rem;border-top:1px solid var(--rule);padding-top:.8rem}
.dlg-hd{display:flex;align-items:center;justify-content:space-between;gap:.6rem;
  flex-wrap:wrap;margin-bottom:.9rem}
.lbl{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.11em;text-transform:uppercase;
  color:var(--faint)}
.mphase{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.11em;text-transform:uppercase;
  color:var(--faint);margin:1.3rem 0 .5rem}
.mphase:first-child{margin-top:0}
.ml{display:flex;gap:.8rem;align-items:flex-start;margin-bottom:.7rem;transition:opacity .3s}
.ml .c{flex:none;min-width:3ch;font-family:var(--f-mono);font-size:.66rem;color:var(--faint);
  padding-top:.25em;font-variant-numeric:tabular-nums}
.ml p{margin:0;font-size:1rem;line-height:1.6;color:var(--ink)}
.ml.past p{color:var(--faint)}
.playing .ml{opacity:.3}
.playing .ml.live{opacity:1}
.one .ml p{font-size:1.12rem}
.cut{display:flex;align-items:center;gap:.7rem;margin:1rem 0;font-family:var(--f-mono);
  font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--wrong)}
.cut::before,.cut::after{content:'';flex:1;height:1px;background:var(--wrong);opacity:.45}
.xr{box-shadow:inset 0 -2px 0 var(--accent)}
.one-foot{display:flex;align-items:center;justify-content:space-between;margin-top:.9rem;
  padding-top:.6rem;border-top:1px solid var(--rule)}
.arrow{font-size:1.05rem;line-height:1;color:var(--sentence);background:none;border:none;
  padding:.6rem .8rem;cursor:pointer;min-height:44px;min-width:44px}
.arrow:disabled{color:var(--rule);cursor:default}

/* The dialogue's two switches share one row: how much you see on the
   left, how it is phrased on the right. Compact, because on a phone the
   two together have to fit in one line. Everything else about the
   dialogue — x-ray, the readout — sits quietly underneath. */
.dlg-hd{flex-wrap:nowrap}
.seg.sm{padding:.14rem}
.seg.sm button{font-size:.64rem;padding:.38rem .6rem;min-height:30px}
.dlg-sub{display:flex;align-items:center;justify-content:space-between;gap:.6rem;
  margin:-.35rem 0 .8rem}
.dlg-sub .tool{padding-left:0}
.dlg-n{font-family:var(--f-mono);font-size:.6rem;color:var(--faint);text-align:right;
  font-variant-numeric:tabular-nums}
@media(max-width:360px){ .seg.sm button{padding:.36rem .48rem} }

/* ── PRACTICE ──────────────────────────────────────────────────────────── */
.fn-row{display:flex;gap:.3rem;overflow-x:auto;scrollbar-width:none;padding-bottom:.2rem;margin-bottom:1rem}
.fn-row::-webkit-scrollbar{display:none}
.fn{flex:none;font-family:var(--f-display);font-size:.7rem;font-weight:600;color:var(--dim);
  background:none;border:none;border-radius:999px;box-shadow:inset 0 0 0 1px var(--rule);
  padding:.5rem .85rem;cursor:pointer;min-height:36px;white-space:nowrap}
.fn.on{color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--accent)}
.frames{margin-top:-.4rem}
.fn.sub{font-size:.66rem;padding:.42rem .75rem;min-height:34px}
.fn.sub:disabled{opacity:.4;cursor:default}
.fn.sub .n{font-family:var(--f-mono);font-size:.58rem;color:var(--faint);margin-left:.25rem}
/* The frame on its own, above the line: the shape before the content. */
.skel{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.02em;line-height:1.5;
  color:var(--accent-ink);margin:0 0 .8rem}
.dr-line .fr{color:var(--accent-ink);font-weight:700}
.dr-line .anc{box-shadow:inset 0 -1.5px 0 var(--rule)}
.added{font-family:var(--f-mono);font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--faint);margin:-.6rem 0 1rem}
.fn-when{font-size:.9rem;line-height:1.55;color:var(--dim);margin:0 0 1.2rem}
.dr-ctx{font-size:.92rem;line-height:1.55;color:var(--dim);margin:0 0 1rem}
.dr-ctx b{display:block;font-family:var(--f-mono);font-size:.6rem;font-weight:400;
  letter-spacing:.11em;text-transform:uppercase;color:var(--faint);margin-bottom:.25rem}
.dr-line{font-size:1.2rem;line-height:1.5;color:var(--ink);margin:0 0 1.2rem;
  padding-left:1rem;border-left:2px solid var(--accent)}
.dr-line .xr{box-shadow:none;color:var(--accent-ink)}
.dr-say{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.09em;text-transform:uppercase;
  color:var(--faint);margin-bottom:.45rem}
.dr-say.now{color:var(--accent-ink)}
.bar{height:2px;background:var(--rule);border-radius:1px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
.bar i.run{transition:width linear}
.dr-foot{display:flex;align-items:center;justify-content:space-between;margin-top:1.2rem;
  padding-top:.6rem;border-top:1px solid var(--rule)}
.dr-n{font-family:var(--f-mono);font-size:.62rem;color:var(--faint);font-variant-numeric:tabular-nums}

/* ── QUIZ · build the minute ───────────────────────────────────────────── */
.turn-so-far{font-size:.98rem;line-height:1.7;color:var(--sentence);min-height:2.4em;margin:0 0 1.2rem}
.turn-so-far:empty::before{content:'Your minute starts empty.';color:var(--faint)}
.phase-h{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap;margin-bottom:.7rem}
.phase-h b{font-family:var(--f-display);font-size:.95rem;font-weight:700;color:var(--ink)}
.phase-h i{font-style:normal;font-size:.84rem;color:var(--dim)}
.lines{display:flex;flex-direction:column;gap:.45rem}
.line{display:flex;align-items:flex-start;gap:.8rem;width:100%;text-align:left;font-size:.94rem;
  line-height:1.5;padding:.78rem .95rem;border:none;border-radius:var(--r-field,12px);
  background:var(--tile-bg);color:var(--tile-ink);cursor:pointer;min-height:48px;
  transition:background .14s,transform .1s cubic-bezier(.2,.8,.2,1)}
.line:active:not(:disabled){transform:scale(.99)}
.line .c{flex:none;font-family:var(--f-mono);font-size:.7rem;color:var(--dim);padding-top:.12em;
  font-variant-numeric:tabular-nums}
.line.used{background:none;box-shadow:inset 0 0 0 1px var(--rule);color:var(--faint);cursor:default}
/* Greyed, priced, still legible: a student who cannot afford a sentence
   should be able to read exactly what they lost. */
.line.broke{background:none;color:var(--rule);cursor:default}
.line.broke .c{color:var(--wrong)}
.next{font-family:var(--f-display);font-size:.74rem;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--accent-ink);background:none;border:none;padding:.7rem 0;
  cursor:pointer;min-height:44px;margin-top:.8rem}
.res h2{font-family:var(--f-display);font-size:1.08rem;font-weight:900;color:var(--ink);margin:0 0 .5rem}
.res p{font-size:.94rem;line-height:1.6;color:var(--sentence);margin:0 0 .8rem}
.res .miss{color:var(--wrong)}

/* ── TALK ──────────────────────────────────────────────────────────────── */
.clock{font-family:var(--f-mono);font-size:2.4rem;color:var(--ink);line-height:1;text-align:center;
  font-variant-numeric:tabular-nums;margin:1rem 0 .2rem}
.clock.low{color:var(--wrong)}
.talk-lead{font-size:.95rem;line-height:1.6;color:var(--sentence);margin:1rem 0 0}
.nudge{font-size:.95rem;line-height:1.55;color:var(--accent-ink);margin:.8rem 0 0;text-align:center;
  min-height:1.5em}
.model{border-top:1px solid var(--rule);margin-top:1.4rem;padding-top:1rem;display:none}
.model.show{display:block}
.model p{font-size:1.02rem;line-height:1.55;color:var(--ink);margin:.4rem 0 0;padding-left:1rem;
  border-left:2px solid var(--accent)}

/* ── THE PHRASE BANK ───────────────────────────────────────────────────── */
.bank-btn{display:block;margin:2rem auto 0;font-family:var(--f-mono);font-size:.62rem;
  letter-spacing:.09em;text-transform:uppercase;color:var(--faint);background:none;border:none;
  cursor:pointer;padding:.7rem;min-height:44px}
#sheet .sheet-card{width:min(40rem,calc(100vw - 1.5rem));max-width:none;align-items:stretch;
  text-align:left;gap:0}
.sheet-card h2{font-family:var(--f-display);font-size:1.1rem;font-weight:900;color:var(--ink);margin-bottom:.5rem}
.sheet-card .close-btn{position:absolute;top:.7rem;right:.7rem}
.bank-g{padding:1rem 0 .2rem;border-top:1px solid var(--rule)}
.bank-g b{display:block;font-family:var(--f-display);font-size:.86rem;font-weight:700;
  letter-spacing:.04em;text-transform:uppercase;color:var(--ink);margin-bottom:.2rem}
.bank-g i{display:block;font-style:normal;font-size:.9rem;line-height:1.5;color:var(--dim);margin-bottom:.3rem}
.bank-g ul{list-style:none;margin:0;padding:0}
.bank-g li{font-size:1rem;color:var(--ink);padding:.65rem 0;border-bottom:1px solid var(--rule)}
.bank-g li:last-child{border-bottom:none}

@media(prefers-reduced-motion:reduce){
  .bar i.run,.tl-head{transition:none!important}
  .seg button,.dots button::after{transition:none}
}
</style>
</head>

  <!-- Slides removed, as on Part 3. tools/check-pages.py --fix-nav
       regenerates this row — change it there or it comes back. -->
  <nav class="mode-selector" aria-label="Speaking sections">
    <a class="mode-btn" href="speaking-format.html">Hub</a>

    <span class="mode-btn active" aria-current="page">Part 2</span>

  </nav>

</header>

<main class="wrap">
  <div class="stage-row">
    <div class="seg" id="stages" role="tablist" aria-label="Stage">
      <button type="button" role="tab" data-s="explore" aria-selected="true">Explore</button>
      <button type="button" role="tab" data-s="practice" aria-selected="false">Practice</button>
      <button type="button" role="tab" data-s="quiz" aria-selected="false">Quiz</button>

    </div>

  <div class="sheet-wrap" id="sheetWrap">
    <p class="qline" id="qline"></p>

  </div>

  <button class="bank-btn" type="button" id="bankBtn">Phrase bank</button>
</main>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="bankH">
  <div class="sheet-card">
    <button class="close-btn" id="sheetX" type="button" aria-label="Close">
      <svg width="15" height="15" viewBox="0 0 15 15" aria-hidden="true">
        <path d="M3 3 L12 12 M12 3 L3 12" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" fill="none"/></svg>
    </button>
    <h2 id="bankH">Comparing, and knowing when to stop</h2>
    <div id="bankBody"></div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════════════════════════════════ */
var D=null, PH=null, ti=0, si=0;
var stage='explore', view='whole', xray=false, sp=0;
var playing=false, playIx=-1, tmr=null;
var SPEECH=('speechSynthesis' in window);

var $=function(id){ return document.getElementById(id); };
var esc=function(s){ return String(s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
function pref(k,v){
  try{ if(v===undefined) return localStorage.getItem('intuity.p2.'+k);
       localStorage.setItem('intuity.p2.'+k,v); }catch(e){ return null; }
}

function task(){ return D.tasks[ti]; }
function turn(){ return task().turns[D.styles[si].id]; }
function phase(i){ return turn()[D.phases[i].id]||[]; }

/* Every sentence of the model in order, with its phase, where it starts,
   where it ends, and which photo it is about. */
function lines(){
  var out=[], t=0, last=[0,1], T=task().photos.map(function(p){ return p.title; });
  D.phases.forEach(function(p,pi){
    phase(pi).forEach(function(l,li){
      var ph=photoOf(l.t,T); if(ph) last=ph;
      out.push({t:l.t, s:l.s, marks:l.marks||[], phase:pi, first:li===0,
                start:t, at:t+l.s, photo:last.slice()});
      t+=l.s;
    });
  });
  return out;
}

/* ── WHICH PHOTO ─────────────────────────────────────────────────────────
   Ordinal words first — they are how candidates are taught to do it — then
   "both", then any word from one photo's title that the other lacks. */
function norm(s){ return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }
function stems(s){ var o={}; norm(s).replace(/[^a-z\s]/g,' ').split(/\s+/)
  .forEach(function(w){ if(w.length>=4) o[w.slice(0,5)]=1; }); return o; }
function photoOf(t,titles){
  var s=norm(t), a=/\b(first|top)\b/.test(s), b=/\b(second|bottom)\b/.test(s);
  if(a&&b) return [0,1];
  if(/\bboth\b|\bin common\b|\bshare\b|\bsimilar/.test(s)) return [0,1];
  if(a) return [0]; if(b) return [1];
  var T=titles.map(stems), w=stems(t), hit=[];
  T.forEach(function(ts,i){ var other=T[1-i]||{};
    if(Object.keys(ts).some(function(k){ return w[k] && !other[k]; })) hit.push(i); });
  return hit.length?hit:null;
}

var ICON_PLAY='<svg width="20" height="22" viewBox="0 0 20 22" aria-hidden="true"><path d="M2 1 L19 11 L2 21Z" fill="currentColor"/></svg>';
var ICON_STOP='<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect width="16" height="16" rx="2.5" fill="currentColor"/></svg>';

/* hub: 'play' | 'stop' | 'off' ; now: photo indices lit, or null */

/* ── THE MINUTE, drawn ───────────────────────────────────────────────────
   items: [{phase, s}] in speaking order. opts: focus (a phase to keep lit),
   head:{from,to,ms} for a moving playhead, left/right readouts. */
function timeline(items,opts){
  opts=opts||{};
  var L=D.limit, total=items.reduce(function(a,x){ return a+x.s; },0);
  var scale=Math.max(L,total), pc=function(s){ return (s/scale*100).toFixed(2)+'%'; };
  var h='<div class="tl-track">', t=0;
  items.forEach(function(x){
    var a=t, b=t+x.s;
    var cls='tl-seg p'+x.phase+(opts.focus!==undefined && x.phase!==opts.focus?' dim':'');
    if(a<L){ h+='<i class="'+cls+'" style="left:'+pc(a)+';width:'+pc(Math.min(b,L)-a)+'"></i>'; }
    if(b>L){ var s0=Math.max(a,L);
      h+='<i class="tl-seg over" style="left:'+pc(s0)+';width:'+pc(b-s0)+'"></i>'; }
    t=b;
  });
  h+='<i class="tl-half" style="left:'+pc(L/2)+'"></i>';
  h+='<i class="tl-limit" style="left:calc('+pc(L)+' - 1px)"></i>';
  h+='<i class="tl-head" id="tlHead"></i></div>';
  h+='<div class="tl-row"><span>'+(opts.left||'')+'</span><span>'+(opts.right||'')+'</span></div>';
  $('tl').innerHTML=h;
  $('tl').dataset.scale=scale;
}
function head(from,to,ms){
  var el=$('tlHead'); if(!el) return; var sc=+$('tl').dataset.scale||D.limit;
  el.classList.add('on'); el.style.transitionDuration='0ms';
  el.style.left=(from/sc*100)+'%'; void el.offsetWidth;
  el.style.transitionDuration=ms+'ms'; el.style.left=(to/sc*100)+'%';
}

/* ═══════════════════════════════════════════════════════════════════════
   EXPLORE
   ═══════════════════════════════════════════════════════════════════════ */
function mark(l,always){
  var t=esc(l.t);
  if(!xray && !always) return t;
  (l.marks||[]).forEach(function(m){
    var e=esc(m).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    t=t.replace(new RegExp('(?![^<]*>)('+e+')'),'<span class="xr">$1</span>');
  });
  return t;
}
function seg(items,cur,attr,cls){
  return '<div class="seg'+(cls?' '+cls:'')+'" role="tablist">'+items.map(function(it){
    return '<button type="button" role="tab" '+attr+'="'+it.id+'" aria-selected="'+(it.id===cur)+'">'+
      esc(it.label)+'</button>'; }).join('')+'</div>';
}

function explore(){
  var L=lines(), N=D.phases.length, lim=D.limit;
  var tot=L.length?L[L.length-1].at:0;
  var hd='<div class="dlg-hd">'+
    seg([{id:'whole',label:'Whole'},{id:'section',label:'Section'}],view,'data-view','sm')+
    seg(D.styles.map(function(s,i){ return {id:String(i),label:s.tab}; }),String(si),'data-style','sm')+
    '</div><div class="dlg-sub">'+
    '<button class="tool'+(xray?' on':'')+'" type="button" data-xray="1">x-ray</button>'+
    '<span class="dlg-n">all of it takes '+tot+'s · you have '+lim+'</span></div>';
  var body='', cut=false;
  var show = view==='whole' ? L : L.filter(function(l){ return l.phase===sp; });
  if(view==='section') cut = show.length && show[0].start>=lim;
  show.forEach(function(l){
    var i=L.indexOf(l);
    if(view==='whole' && l.first) body+='<div class="mphase">'+esc(D.phases[l.phase].name)+'</div>';
    /* The line goes before the first sentence that ENDS past the minute, so
       the sentence it interrupts is the one you would be stopped inside. */
    if(!cut && l.at>lim){ body+='<div class="cut">'+lim+' seconds — the examiner stops you here</div>'; cut=true; }
    body+='<div class="ml'+(l.at>lim?' past':'')+'" data-i="'+i+'"><span class="c">'+l.at+'s</span>'+
      '<p>'+mark(l)+'</p></div>';
  });
  if(view==='section'){
    var dots=''; for(var j=0;j<N;j++) dots+='<button type="button" data-go="'+j+'"'+(j===sp?' class="on"':'')+
      ' aria-label="'+esc(D.phases[j].name)+'"></button>';
    body='<div class="mphase">'+esc(D.phases[sp].name)+' · '+esc(D.phases[sp].hint)+'</div>'+body+
      '<div class="one-foot">'+
      '<button class="arrow" type="button" data-go="'+(sp-1)+'"'+(sp<=0?' disabled':'')+' aria-label="Previous phase">&larr;</button>'+
      '<div class="dots">'+dots+'</div>'+
      '<button class="arrow" type="button" data-go="'+(sp+1)+'"'+(sp>=N-1?' disabled':'')+' aria-label="Next phase">&rarr;</button></div>';
  }
  $('body').innerHTML='<section class="dlg" aria-label="The model turn">'+hd+
    '<div id="talk" class="'+(view==='section'?'one':'')+'">'+body+'</div></section>';
  sheetState();
}

function sheetState(){
  var L=lines(), total=L.length?L[L.length-1].at:0, lim=D.limit;
  var cur = playing && playIx>=0 ? L[playIx] : null;
  pics(SPEECH?(playing?'stop':'play'):'off', cur?cur.photo:null);
  timeline(L.map(function(l){ return {phase:l.phase,s:l.s}; }),{
    focus: view==='section' ? sp : undefined,
    left: D.phases.map(function(p,i){
      var s=L.filter(function(l){ return l.phase===i; }).reduce(function(a,l){ return a+l.s; },0);
      return esc(p.name.toLowerCase())+' '+s+'s'; }).join(' · '),
    right: total>lim ? '<span class="hot">'+total+'s</span> of '+lim+'s' : '<span class="ink">'+total+'s</span> of '+lim+'s'
  });
  if(cur) head(cur.start,cur.at,cur.s*1000);
}

/* The whole model plays, and runs past the line: that IS the lesson. */
function play(){
  if(!SPEECH) return;
  var L=lines(), lo=0, hi=L.length;
  if(view==='section'){ var idx=L.map(function(l,i){ return l.phase===sp?i:-1; }).filter(function(i){ return i>=0; });
    lo=idx[0]; hi=idx[idx.length-1]+1; }
  playing=true; playIx=lo;
  $('talk').classList.add('playing');
  if(view==='whole'){ measure(); $('sheetWrap').classList.add('pin'); }
  (function next(){
    if(!playing || playIx>=hi){ stop(); return; }
    Array.prototype.forEach.call($('talk').querySelectorAll('.ml'),function(el){
      var live=+el.dataset.i===playIx; el.classList.toggle('live',live);
      if(live && view==='whole' && el.scrollIntoView) el.scrollIntoView({block:'end',behavior:'smooth'});
    });
    sheetState();
    say(L[playIx].t,function(){ playIx++; tmr=setTimeout(next,140); });
  })();
}

function stop(){
  playing=false; playIx=-1;
  if(tmr){ clearTimeout(tmr); tmr=null; }
  if(SPEECH) speechSynthesis.cancel();
  drillStop(); clockStop(false);
  var el=$('talk');
  if(el){ el.classList.remove('playing');
    Array.prototype.forEach.call(el.querySelectorAll('.live'),function(x){ x.classList.remove('live'); }); }
  var sw=$('sheetWrap'); if(sw) sw.classList.remove('pin');
  if(D && stage==='explore') sheetState();
}

function say(text,then){
  var n=String(text).split(/\s+/).length, pause=Math.max(1600,n*380), moved=false;
  function go(){ if(moved) return; moved=true; then(); }
  if(!SPEECH){ tmr=setTimeout(go,pause); return; }
  var u=new SpeechSynthesisUtterance(text);
  u.lang='en-GB'; u.rate=.95; u.pitch=1.05;
  var v=voice(); if(v) u.voice=v;
  u.onend=go; u.onerror=go;
  speechSynthesis.speak(u);
  /* iOS drops utterances without firing onend; don't stall on a dead one. */
  tmr=setTimeout(function(){ if(!speechSynthesis.speaking) go(); }, pause+1800);
}

/* By name, because iOS voices carry no gender word and /male/ matches
   "female". The candidate here is a woman. */
var VF=/(serena|martha|kate|stephanie|sonia|hazel|susan|libby|maisie|fiona|moira|karen|tessa|samantha|victoria|zira|catherine|amelie|female)/i;
var VM=/(daniel|oliver|arthur|george|ryan|thomas|alex|fred|gordon|\bmale\b|\bman\b)/i;
function voice(){
  var vs=speechSynthesis.getVoices()||[];
  var gb=vs.filter(function(v){ return /en[-_]GB/i.test(v.lang); });
  var en=vs.filter(function(v){ return /^en/i.test(v.lang); });
  function f(l){ return l.filter(function(v){ return VF.test(v.name)&&!VM.test(v.name); })[0]; }
  return f(gb)||f(en)||gb.filter(function(v){ return !VM.test(v.name); })[0]||gb[0]||en[0]||null;
}

/* ═══════════════════════════════════════════════════════════════════════
   PRACTICE — say it after them
   Grouped by the job the phrase does, within the selected topic: every
   way this topic's models open the comparison, pivot, and turn to the
   question. Change topic, and the same frame comes back with new photos.
   ═══════════════════════════════════════════════════════════════════════ */
var FN=[
  {id:0, label:'Open the comparison', when:'The first thing you say. Name what both photos share, and the minute has started well.'},
  {id:1, label:'Pivot to the differences', when:'One phrase turns a description into a comparison. Say each one twice, then change topic above and say the same frame about new photos.'},
  {id:2, label:'Answer the question', when:'Where the marks are, and where candidates run out of time. Turn to it out loud, then speculate — the frame is what makes an answer sound like one.'}
];

/* ── THE PIVOT, BY FRAME ─────────────────────────────────────────────────
   Five frames, each drilled on its own. Repetition with ONE thing held
   still — the frame — and one thing moving — the photos, as the student
   changes topic. That is how the
   frame separates from the content and becomes something a student reaches
   for, rather than a sentence they once heard.

   Lines come from Simple and Natural only. Advanced is left out on
   purpose: rehearsing "anonymous coexistence" aloud is practising the
   wrong thing. */
var FRAMES={
  /* OPEN — what the two photos share. From the similarities phase only. */
  0:[
    {id:'both',   label:'Both photos show', skel:'Both photos show …',
     re:/\bboth (photos|pictures|photographs|images) show\b|\b(pictures|images|photos) both show\b/i, phases:[0]},
    {id:'common', label:'What they have in common', skel:'What they have in common is that …',
     re:/\bwhat (they|these \w+) have in common\b/i, phases:[0]},
    {id:'inboth', label:'In both situations', skel:'In both situations, …',
     re:/\bin both (situations|cases)\b/i, phases:[0]},
    {id:'each',   label:'The first … the second', skel:'In the first one, … In the second, …',
     re:/^(in )?the (first|second)\b/i, phases:[0]}
  ],
  /* PIVOT — from any phase, because the models contrast the photos while
     answering the question too. */
  1:[
    {id:'signal',   label:'Signal the switch', skel:'But there are some big differences.',
     re:/\b(but|however)\b[^.]*\bdifferen/i, phases:[1]},
    {id:'while',    label:'While …, the second …', skel:'While the first picture shows …, the second …',
     re:/\bwhile\b/i},
    {id:'whereas',  label:'Whereas', skel:'Whereas the first picture shows …, the second …',
     re:/\bwhereas\b/i},
    {id:'contrast', label:'By contrast', skel:'The first picture shows … By contrast, the second …',
     re:/\bby contrast\b|\bin contrast\b/i},
    {id:'other',    label:'On the other hand', skel:'The first picture shows … On the other hand, the second …',
     re:/\bon the other hand\b/i}
  ],
  /* ANSWER — the half of the minute that carries the marks. From the
     answer_question phase only. */
  2:[
    {id:'turn',  label:'Turn to the question', skel:'So what might be …?',
     re:/\?\s*$/, hl:/^.*$/, phases:[2]},
    {id:'asfor', label:'As for …', skel:'As for what might be difficult, I\u2019d say …',
     re:/\bas for\b/i, phases:[2]},
    {id:'think', label:'I think … probably', skel:'I think … is probably … / I\u2019d say …',
     re:/\bI think\b|\bI'd say\b|\bI\u2019d say\b|\bprobably\b/i, phases:[2]},
    {id:'might', label:'might / could', skel:'They might feel … / It could be …',
     re:/\b(might|could)\b/i, phases:[2]},
    {id:'plus',  label:'Plus, … / Also, …', skel:'Plus, … / Also, …',
     re:/^(plus|also)\b/i, phases:[2]}
  ]
};

/* "By contrast" is in none of the model turns. These are written for
   practice, one per task, in the Simple register, and every one of them is
   marked as such on screen — the same rule the phrase bank uses for
   anything not lifted from a model. Move them into part2-turn.json when
   you are happy with them. */
var ADDED={ contrast:{
  'work-situations':      'The first picture shows a formal meeting in an office. By contrast, the second shows someone working on their own in a café.',
  'social-situations':    'The first picture shows strangers in a busy city at night. By contrast, the second shows friends studying together in a library.',
  'entertainment-choices':'The first picture shows people watching a film at the cinema. By contrast, the second shows a family playing board games at home.',
  'shopping-experiences': 'The first picture shows a big, modern shopping mall. By contrast, the second shows a small local market with stalls.',
  'outdoor-activities':   'The first picture shows people relaxing on a beach. By contrast, the second shows someone hiking up a mountain.',
  'learning-situations':  'The first picture shows students studying at university. By contrast, the second shows young children learning at home with a parent.',
  'sports-activities':    'The first picture shows a team playing football outdoors. By contrast, the second shows someone training alone in a gym.',
  'travel-experiences':   'The first picture shows tourists visiting a busy city. By contrast, the second shows someone alone in a quiet natural place.'
}};

var fnId=0, frIds={0:'both',1:'while',2:'asfor'}, dItems=[], dIx=0, dRun=false, dTmr=null;

function fnItems(pi){
  var out=[], sid=D.styles[si].id, pid=D.phases[pi].id;
  D.tasks.forEach(function(tk){
    var arr=(tk.turns[sid]||{})[pid]||[];
    arr.forEach(function(l){ if(l.marks && l.marks.length)
      out.push({tk:tk, topic:tk.tab, question:tk.question, l:l}); });
  });
  return out;
}

function frameItems(move,id){
  var F=(FRAMES[move]||[]).filter(function(f){ return f.id===id; })[0]; if(!F) return [];
  /* The two photos belong to the topic, in every stage. So Practice draws
     only from the topic that is selected: change Work to Social and the
     photos, the question and every line change with it. */
  var out=[], seen={}, keep=['default','alternative1'];
  [task()].forEach(function(tk){
    keep.forEach(function(sid){
      var T=tk.turns[sid]; if(!T) return;
      D.phases.forEach(function(p,pi){
        if(F.phases && F.phases.indexOf(pi)===-1) return;
        (T[p.id]||[]).forEach(function(l){
          if(!F.re.test(l.t) || seen[l.t]) return;
          seen[l.t]=1;
          out.push({tk:tk, topic:tk.tab, l:{t:l.t, marks:[]}, frame:F, reg:sid});
        });
      });
    });
    var add=ADDED[id] && ADDED[id][tk.id];
    if(add && !seen[add]){ seen[add]=1;
      out.push({tk:tk, topic:tk.tab, l:{t:add, marks:[]}, frame:F, added:true}); }
  });
  return out;
}

function practice(){
  var f=FN[fnId];
  if(!frameItems(fnId, frIds[fnId]).length){
    var alt=FRAMES[fnId].filter(function(F){ return frameItems(fnId,F.id).length; })[0];
    if(alt) frIds[fnId]=alt.id;
  }
  dItems = frameItems(fnId, frIds[fnId]);
  dIx=0; dRun=false;
  var frames =
    '<div class="fn-row frames">'+FRAMES[fnId].map(function(F){
      var n=frameItems(fnId,F.id).length;
      return '<button class="fn sub'+(F.id===frIds[fnId]?' on':'')+'" type="button" data-frame="'+F.id+'"'+
        (n?'':' disabled')+'>'+
        esc(F.label)+' <span class="n">'+n+'</span></button>';
    }).join('')+'</div>';
  $('body').innerHTML='<div class="fn-row">'+FN.map(function(x){
    return '<button class="fn'+(x.id===fnId?' on':'')+'" type="button" data-fn="'+x.id+'">'+esc(x.label)+'</button>';
  }).join('')+'</div>'+frames+'<p class="fn-when">'+esc(f.when)+'</p><div id="dr"></div>';
  drill();
}

/* The frame lit, and the two anchors it hangs between — "the first",
   "the second" — underlined, so the shape of the sentence is visible
   before its content is. */
function lightFrame(t,F){
  var s=esc(t);
  s=s.replace(/\b(the (first|second|other)( one| picture| photo| photograph)?|the top (photo|picture|one)|the bottom (photo|picture|one))\b/gi,
    '<span class="anc">$1</span>');
  var R=F.hl||F.re, flags=R.flags.indexOf('g')===-1?R.flags+'g':R.flags;
  var seen={};
  (t.match(new RegExp(R.source,flags))||[]).forEach(function(w){
    if(!w || seen[w]) return; seen[w]=1;
    var e=esc(w).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    s=s.replace(new RegExp('(?![^<]*>)('+e+')','g'),'<span class="fr">$1</span>');
  });
  return s;
}

/* The line only makes sense against its own photographs, and these lines
   come from eight different tasks. So the sheet follows the line: its
   photos, its question, and the photo the line is about lit. The hub runs
   the drill, as it runs playback in Explore. */
function drillSheet(){
  var it=dItems[dIx]; if(!it) return;
  qline(it.tk, 'Practice · '+(dIx+1)+' of '+dItems.length);
  pics(dRun?'stop':'play', photoOf(it.l.t, it.tk.photos.map(function(p){ return p.title; })), it.tk);
}

function drill(){
  var it=dItems[dIx];
  if(!it){ $('dr').innerHTML='<p class="dr-ctx">No lines use this frame yet.</p>'; return; }
  drillSheet();
  var line = it.frame ? lightFrame(it.l.t,it.frame) : mark(it.l,true);
  $('dr').innerHTML=
    (it.frame ? '<p class="skel">'+esc(it.frame.skel)+'</p>' : '')+
    '<p class="dr-line">'+line+'</p>'+
    (it.added ? '<p class="added">written for practice — not from a model turn</p>' : '')+
    '<div class="dr-say" id="drSay">listen</div><div class="bar"><i id="drBar"></i></div>'+
    '<div class="dr-foot">'+
    '<button class="arrow" type="button" data-d="-1"'+(dIx<=0?' disabled':'')+' aria-label="Previous">&larr;</button>'+
    '<button class="tool'+(dRun?' on':'')+'" type="button" data-d="go">'+(dRun?'■ stop':'▶ start')+'</button>'+
    '<span class="dr-n">'+(dIx+1)+' / '+dItems.length+'</span>'+
    '<button class="arrow" type="button" data-d="1"'+(dIx>=dItems.length-1?' disabled':'')+' aria-label="Next">&rarr;</button></div>';
}

function drillGo(){
  if(!dRun) return;
  var it=dItems[dIx]; if(!it){ drillStop(); return; }
  /* Paced for a fifteen-year-old reading aloud, not a synthesiser. */
  var span=Math.max(2000,String(it.l.t).split(/\s+/).length*460);
  function bar(ms){ var b=$('drBar'); if(!b) return; b.className=''; b.style.width='0'; void b.offsetWidth;
    b.className='run'; b.style.transitionDuration=ms+'ms'; b.style.width='100%'; }
  function lab(t,on){ var s=$('drSay'); if(s){ s.textContent=t; s.classList.toggle('now',!!on); } }
  lab('listen',false); bar(span);
  say(it.l.t,function(){
    if(!dRun) return; lab('your turn — say it',true); bar(span);
    dTmr=setTimeout(function(){ if(!dRun) return; lab('again',true); bar(span);
      dTmr=setTimeout(function(){ if(!dRun) return;
        if(dIx<dItems.length-1){ dIx++; drill(); drillGo(); } else { dRun=false; drill(); } },span);
    },span);
  });
}
function drillStop(){ dRun=false; if(dTmr){ clearTimeout(dTmr); dTmr=null; } }

/* ═══════════════════════════════════════════════════════════════════════
   QUIZ — build the minute
   Your mechanic, kept: pick sentences phase by phase, each priced in
   seconds, against a hard sixty. The timeline under the photos IS the
   clock, filling as you speak.
   ═══════════════════════════════════════════════════════════════════════ */
var qp=0, spent=0, chosen=[], qDone=false;

function quiz(){ qp=0; spent=0; chosen=[]; qDone=false; qDraw(); }

function qSheet(){
  var left=D.limit-spent;
  pics('off',null);
  timeline(chosen.map(function(c){ return {phase:c.phase,s:c.s}; }),{
    left: spent+'s spoken',
    right: qp<2 ? '<span class="'+(left<15?'hot':'ink')+'">'+left+'s</span> left for the question'
                : '<span class="'+(left<15?'hot':'ink')+'">'+left+'s</span> left'
  });
}

function qDraw(){
  qSheet();
  var used={}; chosen.forEach(function(c){ used[c.t]=1; });
  var so='<p class="turn-so-far">'+chosen.map(function(c){ return mark(c,true); }).join(' ')+'</p>';
  if(qDone){ $('body').innerHTML='<section class="dlg">'+so+qResult()+'</section>'; return; }
  var left=D.limit-spent, P=D.phases[qp], last=qp===D.phases.length-1;
  var ls=phase(qp).map(function(l,k){
    var u=!!used[l.t], broke=!u && l.s>left;
    return '<button class="line'+(u?' used':(broke?' broke':''))+'" type="button" data-q="'+k+'"'+
      ((u||broke)?' disabled':'')+'><span class="c">'+l.s+'s</span><span>'+esc(l.t)+'</span></button>';
  }).join('');
  $('body').innerHTML='<section class="dlg">'+so+
    '<div class="phase-h"><b>'+esc(P.name)+'</b><i>'+esc(P.hint)+'</i></div>'+
    '<div class="lines">'+ls+'</div>'+
    '<button class="next" type="button" data-qnext="1">'+(last?'Finish the turn':'Move on →')+'</button></section>';
  /* Nothing affordable and nothing left: the examiner does not wait. */
  if(left<=0){ qDone=true; qDraw(); }
}

function qResult(){
  var per=[0,0,0]; chosen.forEach(function(c){ per[c.phase]+=c.s; });
  var desc=per[0]+per[1], ans=per[2], h, p;
  if(ans===0){ h='You never answered the question.';
    p='<span class="miss">'+desc+' seconds on the photographs, nothing on the question.</span> The commonest way to lose Part 2: the description is the easy half and it eats the minute.'; }
  else if(spent>=D.limit && ans<12){ h='Cut off mid-answer.';
    p='<span class="miss">'+desc+'s describing, '+ans+'s answering.</span> Drop two sentences from the description and spend them on the question.'; }
  else if(ans>=desc*.8){ h='That is the shape.'; p=desc+'s on the photos, '+ans+'s on the question — about half and half, inside the minute.'; }
  else { h='Description-heavy.'; p=desc+'s describing against '+ans+'s answering. It fits, but the question deserves about half, and it is where the examiner is listening hardest.'; }
  return '<div class="res"><h2>'+h+'</h2><p>'+p+'</p><button class="next" type="button" data-qagain="1">Try the minute again</button></div>';
}

/* ═══════════════════════════════════════════════════════════════════════
   TALK — your minute
   The photos, the question, a clock. The line under the photos fills as
   the minute goes; at the half, a nudge — be on the question by now. At
   the end, one way the model answered it. Nothing recorded or marked.
   ═══════════════════════════════════════════════════════════════════════ */
var cLeft=0, cTmr=null;

function talk(){
  cLeft=D.limit;
  $('body').innerHTML='<div class="clock" id="clk">'+fmt(cLeft)+'</div>'+
    '<p class="nudge" id="nudge"></p>'+
    '<p class="talk-lead" id="lead">Press the centre and talk about the photos, out loud, for one minute. '+
    'Compare them — then answer the question before the line reaches the end.</p>'+
    '<div class="model" id="model"><span class="lbl">One way the model answered the question</span><div id="modelP"></div></div>';
  talkSheet(0);
}
function talkSheet(el){
  pics(cTmr?'stop':'play',null);
  timeline(el>0?[{phase:el<D.limit/2?0:2,s:el}]:[],{left:'half-way mark: about half on the photos, half on the question',right:''});
}
function fmt(s){ s=Math.max(0,s); return Math.floor(s/60)+':'+(s%60<10?'0':'')+(s%60); }
function clockGo(){
  if(cTmr) return;
  $('lead').style.display='none';
  cTmr=setInterval(function(){
    cLeft--; var el=D.limit-cLeft;
    $('clk').textContent=fmt(cLeft); $('clk').classList.toggle('low',cLeft<=10);
    if(cLeft===Math.floor(D.limit/2)) $('nudge').textContent='Half-way — you should be on the question by now.';
    talkSheet(el);
    if(cLeft<=0) clockStop(true);
  },1000);
  talkSheet(0);
}
function clockStop(reveal){
  if(cTmr){ clearInterval(cTmr); cTmr=null; }
  if(stage!=='talk' || !$('clk')) return;
  pics('play',null);
  if(!reveal) return;
  $('nudge').textContent='Time.';
  var q=phase(2).slice(0,3);
  $('modelP').innerHTML=q.map(function(l){ return '<p>'+mark(l,true)+'</p>'; }).join('');
  $('model').classList.add('show');
}

/* ═══════════════════════════════════════════════════════════════════════
   THE PHRASE BANK — the shared corpus first, this file's own as fallback
   ═══════════════════════════════════════════════════════════════════════ */
function bank(){
  var G=[];
  if(PH && PH.functions) Object.keys(PH.functions).forEach(function(k){
    var f=PH.functions[k];
    if(f.parts && f.parts.indexOf(2)!==-1) G.push({l:f.label,w:f.when,p:f.phrases.map(function(x){ return x.t; })});
  });
  if(!G.length && D.phraseBank) G=D.phraseBank.map(function(g){ return {l:g.heading,w:g.note,p:g.phrases}; });
  $('bankBody').innerHTML=G.length?G.map(function(g){
    return '<div class="bank-g"><b>'+esc(g.l)+'</b>'+(g.w?'<i>'+esc(g.w)+'</i>':'')+
      '<ul>'+g.p.map(function(p){ return '<li>'+esc(p)+'</li>'; }).join('')+'</ul></div>';
  }).join(''):'<p class="dr-ctx">The phrase bank did not load.</p>';
  $('sheet').classList.add('open'); $('sheetX').focus();
}
function shutBank(){ $('sheet').classList.remove('open'); }

/* ═══════════════════════════════════════════════════════════════════════
   ROUTING
   ═══════════════════════════════════════════════════════════════════════ */
function draw(){
  qline(); 
  $('tl').style.display = stage==='practice' ? 'none' : '';
  if(stage==='explore') explore();
  else if(stage==='practice') practice();
  else if(stage==='quiz') quiz();
  else talk();
}
function setStage(s){
  stop(); stage=s; pref('stage',s);
  Array.prototype.forEach.call($('stages').children,function(b){
    b.setAttribute('aria-selected',String(b.dataset.s===s)); });
  draw();
}
Array.prototype.forEach.call($('stages').children,function(b){
  b.addEventListener('click',function(){ if(b.dataset.s!==stage) setStage(b.dataset.s); });
});

document.addEventListener('click',function(e){
  var t=e.target.closest('button'); if(!t) return;
  if(t.dataset.hub){ if(stage==='explore') playing?stop():play();
                     else if(stage==='talk') cTmr?clockStop(false):clockGo();
                     else if(stage==='practice'){ if(dRun){ drillStop(); drill(); }
                                                 else { dRun=true; drill(); drillGo(); } }
                     return; }
  if(t.dataset.view){ if(t.dataset.view!==view){ stop(); view=t.dataset.view; pref('view',view); sp=0; explore(); } return; }
  if(t.dataset.xray){ xray=!xray; explore(); return; }
  if(t.dataset.style!==undefined){ stop(); si=+t.dataset.style; pref('style',si); draw(); return; }
  if(t.dataset.go!==undefined && stage==='explore'){ var n=+t.dataset.go;
    if(n>=0 && n<D.phases.length){ stop(); sp=n; explore(); } return; }
  if(t.dataset.fn!==undefined){ drillStop(); fnId=+t.dataset.fn; pref('fn',fnId); practice(); return; }
  if(t.dataset.frame){ drillStop(); frIds[fnId]=t.dataset.frame; pref('frame'+fnId,t.dataset.frame); practice(); return; }
  if(t.dataset.d!==undefined){
    if(t.dataset.d==='go'){ if(dRun){ drillStop(); drill(); } else { dRun=true; drill(); drillGo(); } }
    else { drillStop(); dIx=Math.max(0,Math.min(dItems.length-1,dIx+(+t.dataset.d))); drill(); }
    return; }
  if(t.dataset.q!==undefined){ var l=phase(qp)[+t.dataset.q];
    chosen.push({t:l.t,s:l.s,marks:l.marks,phase:qp}); spent+=l.s; qDraw(); return; }
  if(t.dataset.qnext){ if(qp===D.phases.length-1){ qDone=true; } else qp++; qDraw(); return; }
  if(t.dataset.qagain){ quiz(); return; }
});

document.addEventListener('keydown',function(e){
  if(e.key==='Escape' && $('sheet').classList.contains('open')){ shutBank(); return; }
  if(stage==='explore' && view==='section'){
    if(e.key==='ArrowRight' && sp<D.phases.length-1){ e.preventDefault(); stop(); sp++; explore(); }
    if(e.key==='ArrowLeft' && sp>0){ e.preventDefault(); stop(); sp--; explore(); }
  }
});
$('bankBtn').addEventListener('click',bank);
$('sheetX').addEventListener('click',shutBank);
$('sheet').addEventListener('click',function(e){ if(e.target===$('sheet')) shutBank(); });
addEventListener('pagehide',stop);
addEventListener('resize',measure,{passive:true});
addEventListener('scroll',function(){ document.body.classList.toggle('scrolled',scrollY>4); },{passive:true});

Promise.all([
  fetch('data/part2-turn.json').then(function(r){ if(!r.ok) throw new Error('part2-turn.json '+r.status); return r.json(); }),
  fetch('data/speaking-phrases.json').then(function(r){ return r.ok?r.json():null; }).catch(function(){ return null; })
]).then(function(got){
  D=got[0]; PH=got[1];
  var p=new URLSearchParams(location.search);
  var wt=p.get('topic')||pref('topic'); if(wt) D.tasks.forEach(function(t,i){ if(t.id===wt) ti=i; });
  var pv=pref('view'); if(pv==='whole'||pv==='section') view=pv;
  if(p.get('view')==='sections'||p.get('view')==='section') view='section';
  var ps=+pref('style'); if(ps>=0 && ps<D.styles.length) si=ps;
  var pf=+pref('fn'); if(pf>=0 && pf<FN.length) fnId=pf;
  [0,1,2].forEach(function(m){ var pr=pref('frame'+m);
    if(pr && FRAMES[m].some(function(f){ return f.id===pr; })) frIds[m]=pr; });
  var ws=p.get('mode')||p.get('stage')||pref('stage');
  ws=({listen:'explore',read:'explore',build:'quiz',bank:'explore'})[ws]||ws;
  stage=['explore','practice','quiz','talk'].indexOf(ws)>-1?ws:'explore';
  Array.prototype.forEach.call($('stages').children,function(b){
    b.setAttribute('aria-selected',String(b.dataset.s===stage)); });
  topics(); draw();
}).catch(function(e){
  $('body').innerHTML='<p class="dr-ctx">data/part2-turn.json did not load ('+esc(e.message)+').</p>';
});
</script>
</body>
