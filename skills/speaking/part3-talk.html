<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F3F1ED">
<title>INTUITY — Speaking Part 3</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;900&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=7">

<style>
/* ═══════════════════════════════════════════════════════════════════════
   SPEAKING PART 3 — TWO JOBS EVERY TURN

   Part 1 taught extension and measured seconds. Part 2 taught budgeting and
   measured a minute. Part 3 is neither: it is the only part marked chiefly
   on Interactive Communication, and its failure mode is two candidates
   taking turns to deliver prepared opinions at each other.

   The mechanic came out of the source data rather than being designed onto
   it. dialogues-data.json tags all 240 turns, and nearly every tag has the
   shape <respond>_then_<advance> — acknowledging_then_building,
   partial_agreement_then_disagreement, agreeing_then_speculating. Every
   turn does two jobs. So the round offers the real turn against the same
   turn with one half cut off, and the student learns which half they were
   about to drop.

   The readout is therefore neither a clock nor a count of words: it is how
   many of your turns did both jobs.
   ═══════════════════════════════════════════════════════════════════════ */

:root{ --accent:#DD8E58; --accent-ink:#9A5A2C; --accent-rgb:221,142,88; }

.header{position:sticky;padding-bottom:.5rem}
.header::after{opacity:0;transition:opacity .2s ease;width:100%}
body.scrolled .header::after{opacity:1}
.mode-btn[aria-disabled="true"]{color:var(--rule);cursor:default}
.wrap{max-width:var(--w-read);margin:0 auto;padding:1.3rem var(--gutter) 6rem}

/* ── THE MAP ─────────────────────────────────────────────────────────────
   Part 3 is not a photograph task. Cambridge hands the pair a written
   question with five prompts around it, and the candidates are expected to
   work through them. So the space Part 2 gives to two photographs is given
   here to the thing the exam actually puts in front of you.

   Drawn as one inline SVG: hairlines and type, no nodes, no boxes, no
   fills. A prompt dims in once the discussion has reached it, so the map
   doubles as the record of what the pair has covered — which is the other
   half of what Part 3 marks, and impossible to show with a static picture.

   The five sit on an ellipse rather than a circle because the container is
   wider than it is tall; a circle would waste the corners and crowd the
   question. */
.q-label{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint);margin-bottom:.35rem}
.map{margin:0 0 1.1rem}
.map svg{width:100%;height:auto;display:block;overflow:visible}
.map .spoke{stroke:var(--rule);stroke-width:1;transition:stroke .4s ease}
.map .spoke.hit{stroke:var(--accent)}
.map .node{font-family:var(--f-body);font-size:13px;fill:var(--faint);
  transition:fill .4s ease}
.map .node.hit{fill:var(--accent-ink)}
.map .core{font-family:var(--f-display);font-weight:600;font-size:16px;
  fill:var(--ink);letter-spacing:-.01em}
.map .ring{fill:none;stroke:var(--rule);stroke-width:1}

/* ── THE SCORE THAT IS NOT A SCORE ───────────────────────────────────────
   Two counts, because the skill has two halves and a student needs to know
   which one they keep dropping. */
.tally{display:flex;gap:1.6rem;margin-bottom:1.6rem}
.ty{display:flex;align-items:baseline;gap:.4rem}
.ty b{font-family:var(--f-mono);font-size:1.15rem;color:var(--ink);
  font-variant-numeric:tabular-nums;font-weight:400}
.ty span{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.09em;
  text-transform:uppercase;color:var(--faint)}
.ty.weak b{color:var(--wrong)}

/* ── THE TRANSCRIPT ──────────────────────────────────────────────────────
   Two speakers, told apart by indent and label alone. No bubbles, no tails,
   no alternating tints: a chat-app skin would be five more objects on a
   screen whose content is one conversation. */
.talk{margin-bottom:1.8rem}
.turn{margin-bottom:.95rem;animation:tIn .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes tIn{from{opacity:0}to{opacity:1}}
.turn .who{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--faint);margin-bottom:.2rem}
.turn p{margin:0;font-size:.96rem;line-height:1.6;color:var(--sentence)}
.turn.mine{padding-left:1.1rem;border-left:2px solid var(--accent)}
.turn.mine .who{color:var(--accent-ink)}
/* The two halves of your own turn, marked once it is said. The student sees
   the shape of what they chose, not a label telling them about it. */
.turn.mine .r{color:var(--accent-ink)}

.phase{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.11em;
  text-transform:uppercase;color:var(--faint);margin:1.6rem 0 .8rem;
  padding-top:.9rem;border-top:1px solid var(--rule)}

/* ── THE ROUND ───────────────────────────────────────────────────────── */
.prompt{font-size:.88rem;color:var(--dim);margin-bottom:.75rem}
.opts{display:flex;flex-direction:column;gap:.5rem}
.opt{text-align:left;width:100%;font-size:.94rem;line-height:1.5;
  padding:.82rem 1rem;border:none;border-radius:var(--r-field);
  background:var(--tile-bg);color:var(--tile-ink);cursor:pointer;
  transition:background .14s,transform .1s cubic-bezier(.2,.8,.2,1)}
@media(hover:hover){ .opt:hover:not(:disabled){background:var(--tile-bg-press)} }
.opt:active:not(:disabled){transform:scale(.99)}
.opt:disabled{cursor:default}
.opt.is-ok{background:var(--tile-ok-bg);color:var(--tile-ok-ink)}
.opt.is-no{background:var(--tile-no-bg);color:var(--tile-no-ink)}
.why{font-size:.84rem;line-height:1.55;color:var(--dim);
  padding:.7rem 1rem 0;display:none}
.why.show{display:block}

.res{display:none;margin-top:1.6rem}
.res.show{display:block}
.res h2{font-family:var(--f-display);font-size:1.08rem;font-weight:900;
  letter-spacing:var(--track-display);color:var(--ink);margin-bottom:.5rem}
.res p{font-size:.92rem;line-height:1.6;color:var(--sentence);margin-bottom:1rem}
.again{font-family:var(--f-display);font-size:.72rem;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);
  background:none;border:none;padding:.4rem 0;cursor:pointer}

.voice{display:flex;align-items:center;gap:.3rem;margin-top:2.2rem;flex-wrap:wrap}
.voice-l{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--faint);margin-right:.35rem}
.vb{font-family:var(--f-display);font-size:.66rem;font-weight:600;
  letter-spacing:.05em;padding:.36rem .7rem;border:none;border-radius:var(--r-chip);
  background:none;color:var(--faint);cursor:pointer;transition:background .15s,color .15s}
.vb.on{background:var(--tile-bg);color:var(--tile-ink);font-weight:700}

@media(max-width:560px){ .q{font-size:1rem} .opt{font-size:.9rem} }
@media(prefers-reduced-motion:reduce){ .turn{animation:none} }
</style>
</head>
<body>

<header class="header">
  <div class="header-top">
    <a class="back-link" href="/index.html?openModal=speaking" target="_top">← Speaking</a>
    <div class="header-title">
      <div class="app-title">INTUITY</div>
      <div class="app-subtitle">Speaking</div>
    </div>
    <span class="header-spacer">Level <b>B2</b></span>
  </div>
  <!-- Generated by tools/check-pages.py --fix-nav. All four parts,
       same row on every page. Do not hand-edit one copy. -->
  <nav class="mode-selector" aria-label="Exam part">
    <a class="mode-btn" href="part1-builder.html">Part 1</a>
    <a class="mode-btn" href="part2-turn.html">Part 2</a>
    <span class="mode-btn active" aria-current="page">Part 3</span>
    <a class="mode-btn" href="part4-views.html">Part 4</a>
  </nav>
  <div class="set-tabs" id="tabs"></div>
</header>

<main class="wrap">
  <div class="q-label">Talk together</div>
  <div class="map" id="map"></div>

  <div class="tally">
    <span class="ty" id="tyBoth"><b>0</b><span>turns doing both</span></span>
    <span class="ty" id="tyMiss"><b>0</b><span>half-turns</span></span>
  </div>

  <div class="talk" id="talk"></div>

  <div id="round">
    <p class="prompt" id="prompt"></p>
    <div class="opts" id="opts"></div>
    <div class="why" id="why"></div>
  </div>

  <div class="res" id="res">
    <h2 id="resH"></h2>
    <p id="resP"></p>
    <button class="again" type="button" id="againBtn">Run it again</button>
  </div>

  <div class="voice">
    <span class="voice-l">Phrasing</span>
    <span id="voices"></span>
  </div>
</main>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   THE ENGINE
   State: topic, style, position in the run, and two counters. The options
   are built at the moment they are needed, from the turn itself.
   ═══════════════════════════════════════════════════════════════════════ */
var D=null, ti=0, si=0, at=0, both=0, halves=0, locked=false, done=false;

var $=function(id){ return document.getElementById(id); };
var esc=function(s){ return s.replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };

function topic(){ return D.topics[ti]; }
function run(){ return topic().runs[D.styles[si].id]; }

/* ── THE OPTIONS ──────────────────────────────────────────────────────────
   Three lines, all from the same turn. The correct one is what the speaker
   actually said; the other two are that sentence with one half amputated.
   Nothing is invented, so nothing can be off-key or off-level. */
function options(t){
  var o=[
   { t:t.t, ok:true },
   { t:t.advance,
     why:'Your point, but deaf. It moves the discussion on without once '+
         'acknowledging what your partner just said — which is how two '+
         'candidates end up giving speeches at each other.' },
   { t:t.respond,
     why:'Polite, and then nothing. You have agreed and stopped, so your '+
         'partner has to do all the work of restarting. A turn has to leave '+
         'something for the other person to answer.' }
  ];
  for(var i=o.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var x=o[i]; o[i]=o[j]; o[j]=x; }
  return o;
}

/* The question is wrapped by hand: SVG has no line box, so the words are
   measured roughly and broken at the widest that still fits the centre. */
function wrap(t,per){
  var w=t.split(' '),L=[],cur='';
  w.forEach(function(x){
    if((cur+' '+x).trim().length>per){ L.push(cur.trim()); cur=x; }
    else cur+=' '+x;
  });
  if(cur.trim()) L.push(cur.trim());
  return L;
}

function drawMap(hits){
  var t=topic(), P=t.prompts, W=680, H=300, cx=W/2, cy=H/2, rx=252, ry=112;
  var svg=['<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+
           esc(t.question)+', with five prompts">'];

  P.forEach(function(p,i){
    /* Five points, evenly spaced, first one at the top. */
    var a=(-90+i*72)*Math.PI/180;
    var x=cx+rx*Math.cos(a), y=cy+ry*Math.sin(a);
    /* The spoke stops short of both ends so no line ever touches type. */
    var x1=cx+rx*0.30*Math.cos(a), y1=cy+ry*0.42*Math.sin(a);
    var x2=cx+rx*0.80*Math.cos(a), y2=cy+ry*0.76*Math.sin(a);
    var on=hits.indexOf(i)!==-1?' hit':'';
    svg.push('<line class="spoke'+on+'" x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+
             '" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'"/>');
    /* Anchored by which side of the centre it falls, so nothing runs off. */
    var anc = Math.abs(x-cx)<40 ? 'middle' : (x>cx?'start':'end');
    var dy  = y<cy ? -4 : 14;
    svg.push('<text class="node'+on+'" x="'+x.toFixed(1)+'" y="'+(y+dy).toFixed(1)+
             '" text-anchor="'+anc+'">'+esc(p)+'</text>');
  });

  var lines=wrap(t.question,26);
  var top=cy-((lines.length-1)*11);
  lines.forEach(function(l,i){
    svg.push('<text class="core" x="'+cx+'" y="'+(top+i*22)+
             '" text-anchor="middle" dominant-baseline="middle">'+esc(l)+'</text>');
  });

  svg.push('</svg>');
  $('map').innerHTML=svg.join('');
}

function render(){
  var seq=run();
  /* A prompt lights as the discussion reaches it: one per completed
     exchange, in order, the way a pair works round the map. */
  var reached=[]; for(var k=0;k<Math.min(both,topic().prompts.length);k++) reached.push(k);
  drawMap(reached);

  $('talk').innerHTML=seq.slice(0,at).map(function(t){
    var mine=t.who==='me';
    var body;
    if(mine && t.respond){
      /* Your own turn shows its two halves once said: the responding half in
         the accent, the advancing half in the sentence colour. */
      body='<span class="r">'+esc(t.respond)+'</span> '+esc(t.advance);
    } else { body=esc(t.t); }
    return '<div class="turn'+(mine?' mine':'')+'">'+
      '<div class="who">'+esc(mine?'You':topic().them)+'</div>'+
      '<p>'+body+'</p></div>';
  }).join('');

  $('tyBoth').querySelector('b').textContent=both;
  $('tyMiss').querySelector('b').textContent=halves;
  $('tyMiss').classList.toggle('weak',halves>both);

  /* Walk forward over the partner's turns and any of yours that are not
     choosable — the opening opinion, the bare invitation — until the next
     decision point. */
  while(at<seq.length && !seq[at].choose){ at++; render2(); return; }
  if(at>=seq.length){ finish(); return; }
  ask(seq[at]);
}
function render2(){ setTimeout(render,340); }

function ask(t){
  locked=false;
  $('round').style.display='';
  $('why').classList.remove('show'); $('why').textContent='';
  /* The last exchange is the exam's one-minute decision, not more discussion. */
  $('prompt').textContent = t.last
    ? 'Last exchange. Part 3 ends with the two of you reaching a decision — what do you say?'
    : 'Your turn. Which of these does both jobs?';

  $('opts').innerHTML='';
  options(t).forEach(function(o){
    var b=document.createElement('button');
    b.className='opt'; b.type='button'; b.textContent=o.t;
    b.addEventListener('click',function(){ pick(b,o); });
    $('opts').appendChild(b);
  });
}

function pick(btn,o){
  if(locked) return;
  if(o.ok){
    locked=true; both++;
    btn.classList.add('is-ok');
    Array.prototype.forEach.call($('opts').children,function(b){ b.disabled=true; });
    setTimeout(function(){ at++; render(); },420);
  } else {
    /* Wrong is not a dead end. The half you chose is named, the round stays
       open, and the count of half-turns goes up — which is the diagnostic. */
    halves++;
    btn.classList.add('is-no'); btn.disabled=true;
    $('why').textContent=o.why; $('why').classList.add('show');
    $('tyMiss').querySelector('b').textContent=halves;
    $('tyMiss').classList.toggle('weak',halves>both);
  }
}

function finish(){
  done=true;
  $('round').style.display='none';
  $('res').classList.add('show');
  if(halves===0){
    $('resH').textContent='Every turn did both jobs.';
    $('resP').textContent='You answered your partner and moved the discussion on, '+
      both+' times out of '+both+'. That is what Interactive Communication is marked on, '+
      'and Part 3 is where the examiners look hardest for it.';
  } else if(halves<=both){
    $('resH').textContent='Mostly both.';
    $('resP').textContent=both+' full turns and '+halves+' half-turns. Look back at which '+
      'half you dropped: reaching for your own point before answering theirs is the commoner '+
      'of the two, and the more costly.';
  } else {
    $('resH').textContent='Half-turns outnumbered full ones.';
    $('resP').textContent=halves+' half-turns against '+both+'. The English was fine every '+
      'time — that is the point. A turn can be perfectly correct and still score badly in '+
      'Part 3 if it ignores the person you are talking to.';
  }
}

$('againBtn').addEventListener('click',function(){ reset(); });
function reset(){
  at=0; both=0; halves=0; done=false;
  $('res').classList.remove('show'); $('round').style.display='';
  render();
}

function chrome(){
  $('tabs').innerHTML='';
  D.topics.forEach(function(t,i){
    var b=document.createElement('button');
    b.className='vtab'+(i===ti?' active':''); b.type='button'; b.textContent=t.tab;
    b.addEventListener('click',function(){ ti=i; chrome(); reset(); });
    $('tabs').appendChild(b);
  });
  $('voices').innerHTML='';
  D.styles.forEach(function(s,i){
    var b=document.createElement('button');
    b.className='vb'+(i===si?' on':''); b.type='button'; b.textContent=s.tab;
    b.addEventListener('click',function(){ si=i; chrome(); reset(); });
    $('voices').appendChild(b);
  });
}

addEventListener('scroll',function(){
  document.body.classList.toggle('scrolled',scrollY>4);
},{passive:true});

fetch('data/part3-talk.json')
  .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(function(d){ D=d; chrome(); render(); })
  .catch(function(e){
    $('map').textContent='Could not load the discussions.';
    $('prompt').textContent='data/part3-talk.json did not load ('+e.message+').';
  });
</script>
</body>
</html>
