<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;900&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
/* ═══════════════════════════════════════════════════════════════════════
   SPEAKING PART 3 — TWO JOBS EVERY TURN

   Part 1 taught extension and measured seconds. Part 2 taught budgeting and
   measured a minute. Part 3 is neither: it is the only part marked chiefly
   on Interactive Communication, and its failure mode is two candidates
   taking turns to deliver prepared opinions at each other.

   The mechanic came out of the source data rather than being designed onto
   it. dialogues-data.json tags all 240 turns, and nearly every tag has the
   shape <respond>_then_<advance> — acknowledging_then_building,
   partial_agreement_then_disagreement, agreeing_then_speculating. Every
   turn does two jobs. So the round offers the real turn against the same
   turn with one half cut off, and the student learns which half they were
   about to drop.

   The readout is therefore neither a clock nor a count of words: it is how
   many of your turns did both jobs.
   ═══════════════════════════════════════════════════════════════════════ */

:root{ --accent:#DD8E58; --accent-ink:#9A5A2C; --accent-rgb:221,142,88; }

.header{position:sticky;padding-bottom:.5rem}
.header::after{opacity:0;transition:opacity .2s ease;width:100%}
body.scrolled .header::after{opacity:1}
.mode-btn[aria-disabled="true"]{color:var(--rule);cursor:default}
.wrap{max-width:var(--w-read);margin:0 auto;padding:1.3rem var(--gutter) 6rem}

/* ── THE MAP ─────────────────────────────────────────────────────────────
   Part 3 is not a photograph task. Cambridge hands the pair a written
   question with five prompts around it, and the candidates are expected to
   work through them. So the space Part 2 gives to two photographs is given
   here to the thing the exam actually puts in front of you.

   Drawn as one inline SVG: hairlines and type, no nodes, no boxes, no
   fills. A prompt dims in once the discussion has reached it, so the map
   doubles as the record of what the pair has covered — which is the other
   half of what Part 3 marks, and impossible to show with a static picture.

   The five sit on an ellipse rather than a circle because the container is
   wider than it is tall; a circle would waste the corners and crowd the
   question. */
.q-label{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint);margin-bottom:.35rem}
.map{margin:0 0 1.1rem}
.map svg{width:100%;height:auto;display:block;overflow:visible}
/* The sheet. Hairlines and boxes, nothing else — the card is printed, so it
   has no fills, no shadows and no colour until the pair touches a prompt. */
.map{border:1px solid var(--rule);border-radius:var(--r-field);
  padding:.9rem .7rem;background:var(--card-bg,transparent)}
.map .join{stroke:var(--rule);stroke-width:1;transition:stroke .4s ease}
.map .join.hit{stroke:var(--accent)}
.map .bx{fill:none;stroke:var(--rule);stroke-width:1;transition:stroke .4s ease}
.map .bx.core{stroke:var(--ink);stroke-width:1.4}
.map .bx.hit{stroke:var(--accent);stroke-width:1.4}
.map .bt{font-family:var(--f-body);font-size:13px;fill:var(--sentence);
  transition:fill .4s ease}
.map .bt.core{font-family:var(--f-display);font-weight:600;font-size:14.5px;
  fill:var(--ink)}
.map .bt.hit{fill:var(--accent-ink)}

/* ── THE SCORE THAT IS NOT A SCORE ───────────────────────────────────────
   Two counts, because the skill has two halves and a student needs to know
   which one they keep dropping. */
.tally{display:flex;gap:1.6rem;margin-bottom:1.6rem}
.ty{display:flex;align-items:baseline;gap:.4rem}
.ty b{font-family:var(--f-mono);font-size:1.15rem;color:var(--ink);
  font-variant-numeric:tabular-nums;font-weight:400}
.ty span{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.09em;
  text-transform:uppercase;color:var(--faint)}
.ty.weak b{color:var(--wrong)}

/* ── THE TRANSCRIPT ──────────────────────────────────────────────────────
   Two speakers, told apart by indent and label alone. No bubbles, no tails,
   no alternating tints: a chat-app skin would be five more objects on a
   screen whose content is one conversation. */
.talk{margin-bottom:1.8rem}
.turn{margin-bottom:.95rem;animation:tIn .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes tIn{from{opacity:0}to{opacity:1}}
.turn .who{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--faint);margin-bottom:.2rem}
.turn p{margin:0;font-size:.96rem;line-height:1.6;color:var(--sentence)}
.turn.mine{padding-left:1.1rem;border-left:2px solid var(--accent)}
.turn.mine .who{color:var(--accent-ink)}
/* The two halves of your own turn, marked once it is said. The student sees
   the shape of what they chose, not a label telling them about it. */
.turn.mine .r{color:var(--accent-ink)}

.phase{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.11em;
  text-transform:uppercase;color:var(--faint);margin:1.6rem 0 .8rem;
  padding-top:.9rem;border-top:1px solid var(--rule)}

/* ── THE PILLS ───────────────────────────────────────────────────────────
   The same four on every part, in the same order, meaning the same thing.
   Only Build differs between parts, which is the point: a student learns the
   interface once and meets four mechanics.

   Listen and Read read exactly what Build works on — one source per part, no
   second file and no second cast. */
.pills{display:flex;gap:.15rem;flex-wrap:wrap;align-items:center;
  padding-top:.9rem;border-top:1px solid var(--rule);margin-bottom:.2rem}
.pill-b{font-family:var(--f-display);font-size:.66rem;font-weight:600;
  letter-spacing:.05em;padding:.4rem .72rem;border:none;border-radius:var(--r-chip);
  background:none;color:var(--faint);cursor:pointer;white-space:nowrap;
  transition:background .15s,color .15s}
@media(hover:hover){ .pill-b:hover{color:var(--sentence)} }
.pill-b.on{background:var(--tile-bg);color:var(--tile-ink);font-weight:700}

.tools{display:flex;align-items:center;gap:.5rem;min-height:2.1rem;
  margin-bottom:1.1rem;flex-wrap:wrap}
.tool{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.08em;
  text-transform:uppercase;color:var(--faint);background:none;border:none;
  padding:.35rem .5rem;border-radius:var(--r-chip);cursor:pointer;
  transition:background .15s,color .15s}
.tool.on{background:var(--tile-bg);color:var(--accent-ink)}
.tool-n{font-family:var(--f-mono);font-size:.62rem;color:var(--faint);margin-left:auto}

/* Playing: the turn being spoken at full opacity, the rest stepped back.
   Opacity only — a highlight box would be a third object in a room that
   contains two people. */
.playing .turn{opacity:.32;transition:opacity .3s ease}
.playing .turn.live{opacity:1}

/* X-RAY, and in Part 3 it marks the thing Part 3 is graded on: the two jobs.
   The responding half and the advancing half, told apart, on every line. */
.xr-r{box-shadow:inset 0 -2px 0 var(--accent)}
.xr-a{color:var(--accent-ink)}

/* ── THE SHEET, as a bank ──────────────────────────────────────────────── */
.sheet-card{align-items:stretch;text-align:left;gap:0;max-width:27rem}
.sheet-card h2{font-family:var(--f-display);font-size:1.12rem;font-weight:900;
  letter-spacing:var(--track-display);color:var(--ink);margin-bottom:.9rem}
.bank-g{padding:.85rem 0;border-top:1px solid var(--rule)}
.bank-g b{display:block;font-family:var(--f-display);font-size:.74rem;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;color:var(--ink);margin-bottom:.2rem}
.bank-g i{display:block;font-style:normal;font-size:.8rem;line-height:1.5;
  color:var(--dim);margin-bottom:.55rem}
.bank-g ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:.3rem}
.bank-g li{font-size:.84rem;color:var(--tile-ink);background:var(--tile-bg);
  border-radius:var(--r-chip);padding:.32rem .6rem}
.sheet-card .close-btn{position:absolute;top:.7rem;right:.7rem}

/* ── THE ROUND ───────────────────────────────────────────────────────── */
.prompt{font-size:.88rem;color:var(--dim);margin-bottom:.75rem}
.opts{display:flex;flex-direction:column;gap:.5rem}
.opt{text-align:left;width:100%;font-size:.94rem;line-height:1.5;
  padding:.82rem 1rem;border:none;border-radius:var(--r-field);
  background:var(--tile-bg);color:var(--tile-ink);cursor:pointer;
  transition:background .14s,transform .1s cubic-bezier(.2,.8,.2,1)}
@media(hover:hover){ .opt:hover:not(:disabled){background:var(--tile-bg-press)} }
.opt:active:not(:disabled){transform:scale(.99)}
.opt:disabled{cursor:default}
.opt.is-ok{background:var(--tile-ok-bg);color:var(--tile-ok-ink)}
.opt.is-no{background:var(--tile-no-bg);color:var(--tile-no-ink)}
.why{font-size:.84rem;line-height:1.55;color:var(--dim);
  padding:.7rem 1rem 0;display:none}
.why.show{display:block}

.res{display:none;margin-top:1.6rem}
.res.show{display:block}
.res h2{font-family:var(--f-display);font-size:1.08rem;font-weight:900;
  letter-spacing:var(--track-display);color:var(--ink);margin-bottom:.5rem}
.res p{font-size:.92rem;line-height:1.6;color:var(--sentence);margin-bottom:1rem}
.again{font-family:var(--f-display);font-size:.72rem;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);
  background:none;border:none;padding:.4rem 0;cursor:pointer}

.voice{display:flex;align-items:center;gap:.3rem;margin-top:2.2rem;flex-wrap:wrap}
.voice-l{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--faint);margin-right:.35rem}
.vb{font-family:var(--f-display);font-size:.66rem;font-weight:600;
  letter-spacing:.05em;padding:.36rem .7rem;border:none;border-radius:var(--r-chip);
  background:none;color:var(--faint);cursor:pointer;transition:background .15s,color .15s}
.vb.on{background:var(--tile-bg);color:var(--tile-ink);font-weight:700}

@media(max-width:560px){ .q{font-size:1rem} .opt{font-size:.9rem} }
@media(prefers-reduced-motion:reduce){ .turn{animation:none} }
</style>
</head>
<body>

<header class="header">
  <div class="header-top">
    <a class="back-link" href="/index.html?openModal=speaking" target="_top">← Speaking</a>
    <div class="header-title">
      <div class="app-title">INTUITY</div>
      <div class="app-subtitle">Speaking</div>
    </div>
    <span class="header-spacer">Level <b>B2</b></span>
  </div>
  <!-- Generated by tools/check-pages.py --fix-nav. All four parts,
       same row on every page. Do not hand-edit one copy. -->
  <nav class="mode-selector" aria-label="Exam part">
    <a class="mode-btn" href="part1-builder.html">Part 1</a>
    <a class="mode-btn" href="part2-turn.html">Part 2</a>
    <span class="mode-btn active" aria-current="page">Part 3</span>
    <a class="mode-btn" href="part4-views.html">Part 4</a>
  </nav>
  <div class="set-tabs" id="tabs"></div>
</header>

<main class="wrap">

  <nav class="pills" id="pills" aria-label="Mode">
    <button class="pill-b" type="button" data-m="listen">Listen · full discussion</button>
    <button class="pill-b" type="button" data-m="read">Read · full discussion</button>
    <button class="pill-b on" type="button" data-m="build">Build your turns</button>
    <button class="pill-b" type="button" data-m="bank">Phrase bank</button>
  </nav>
  <div class="tools" id="tools"></div>

  <div class="q-label">Talk together</div>
  <div class="map" id="map"></div>

  <div class="tally">
    <span class="ty" id="tyBoth"><b>0</b><span>turns doing both</span></span>
    <span class="ty" id="tyMiss"><b>0</b><span>half-turns</span></span>
  </div>

  <div class="talk" id="talk"></div>

  <div id="round">
    <p class="prompt" id="prompt"></p>
    <div class="opts" id="opts"></div>
    <div class="why" id="why"></div>
  </div>

  <div class="res" id="res">
    <h2 id="resH"></h2>
    <p id="resP"></p>
    <button class="again" type="button" id="againBtn">Run it again</button>
  </div>

  <div class="voice">
    <span class="voice-l">Phrasing</span>
    <span id="voices"></span>
  </div>
</main>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="bankH">
  <div class="sheet-card">
    <button class="close-btn" id="sheetX" type="button" aria-label="Close">
      <svg width="15" height="15" viewBox="0 0 15 15" aria-hidden="true">
        <path d="M3 3 L12 12 M12 3 L3 12" stroke="currentColor"
              stroke-width="1.8" stroke-linecap="round" fill="none"/>
      </svg>
    </button>
    <h2 id="bankH">Responding to your partner</h2>
    <div id="bankBody"></div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   THE ENGINE
   State: topic, style, position in the run, and two counters. The options
   are built at the moment they are needed, from the turn itself.
   ═══════════════════════════════════════════════════════════════════════ */
var D=null, ti=0, si=0, at=0, both=0, halves=0, locked=false, done=false;
var mode='build', xray=false, playing=false, playIx=0;
var SPEECH=('speechSynthesis' in window);

var $=function(id){ return document.getElementById(id); };
var esc=function(s){ return s.replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };

function topic(){ return D.topics[ti]; }
function run(){ return topic().runs[D.styles[si].id]; }

/* ── THE OPTIONS ──────────────────────────────────────────────────────────
   Three lines, all from the same turn. The correct one is what the speaker
   actually said; the other two are that sentence with one half amputated.
   Nothing is invented, so nothing can be off-key or off-level. */
function options(t){
  var o=[
   { t:t.t, ok:true },
   { t:t.advance,
     why:'Your point, but deaf. It moves the discussion on without once '+
         'acknowledging what your partner just said — which is how two '+
         'candidates end up giving speeches at each other.' },
   { t:t.respond,
     why:'Polite, and then nothing. You have agreed and stopped, so your '+
         'partner has to do all the work of restarting. A turn has to leave '+
         'something for the other person to answer.' }
  ];
  for(var i=o.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var x=o[i]; o[i]=o[j]; o[j]=x; }
  return o;
}

/* The question is wrapped by hand: SVG has no line box, so the words are
   measured roughly and broken at the widest that still fits the centre. */
function wrap(t,per){
  var w=t.split(' '),L=[],cur='';
  w.forEach(function(x){
    if((cur+' '+x).trim().length>per){ L.push(cur.trim()); cur=x; }
    else cur+=' '+x;
  });
  if(cur.trim()) L.push(cur.trim());
  return L;
}

/* ── THE EXAM SHEET ──────────────────────────────────────────────────────
   Cambridge hands the pair a printed card: the question in a box, five
   prompts in boxes around it, joined by plain rules. This reproduces that
   card, in the arrangement the real sheet uses — two down each side and one
   below.

   Boxes, in a product that has spent months removing them. The exception is
   deliberate and narrow: this is not a component, it is a facsimile of a
   document the candidates will be holding. A student who has practised on
   this should recognise the paper in the room. Everywhere else on the page
   the rule still stands.

   Box heights are computed from the wrapped line count rather than fixed, so
   a long prompt grows its box instead of overflowing it. */
function drawMap(hits){
  var t=topic(), P=t.prompts, W=620, lh=17, SIDE=170, GAP=26;

  function box(x,y,w,lines){
    var h=lines.length*lh+22;
    return {x:x,y:y,w:w,h:h,lines:lines,cx:x+w/2,cy:y+h/2,r:x+w,b:y+h};
  }

  /* The two side columns are stacked from the top with a real gap, and the
     question is then centred against whatever height they came to. Laying
     them out with fixed offsets put the lower box on top of the upper one on
     every sheet, because a three-line prompt is taller than a two-line one. */
  var L=P.map(function(p){ return wrap(p,20); });
  var x2=W-15-SIDE;
  var tl=box(15,22,SIDE,L[0]);
  var ml=box(15,tl.b+GAP,SIDE,L[2]);
  var tr=box(x2,22,SIDE,L[1]);
  var mr=box(x2,tr.b+GAP,SIDE,L[3]);

  var colTop=22, colBot=Math.max(ml.b,mr.b);
  var qL=wrap(t.question,24), qH=qL.length*lh+22;
  var q=box((W-190)/2, colTop+((colBot-colTop)-qH)/2, 190, qL);
  var bc=box((W-200)/2, Math.max(colBot,q.b)+40, 200, L[4]);
  var H=bc.b+20;

  var svg=['<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+
           esc(t.question)+', with five prompts">'];

  /* Each rule runs from the prompt to the question box, its far end clamped
     inside the question's own height — so the upper joins come out level and
     the lower ones slope, exactly as they do on the printed card. */
  function clamp(y){ return Math.max(q.y+12, Math.min(q.b-12, y)); }
  var joins=[
    [tl.r, tl.cy, q.x, clamp(tl.cy)],
    [tr.x, tr.cy, q.r, clamp(tr.cy)],
    [ml.r, ml.cy, q.x, clamp(ml.cy)],
    [mr.x, mr.cy, q.r, clamp(mr.cy)],
    [bc.cx, bc.y, q.cx, q.b]
  ];
  joins.forEach(function(j,i){
    svg.push('<line class="join'+(hits.indexOf(i)!==-1?' hit':'')+'" x1="'+
      j[0].toFixed(1)+'" y1="'+j[1].toFixed(1)+'" x2="'+j[2].toFixed(1)+
      '" y2="'+j[3].toFixed(1)+'"/>');
  });

  function draw(b,cls){
    var o='<rect class="bx '+cls+'" x="'+b.x+'" y="'+b.y.toFixed(1)+'" width="'+
          b.w+'" height="'+b.h+'" rx="10"/>';
    var top=b.cy-((b.lines.length-1)*lh)/2;
    b.lines.forEach(function(l,i){
      o+='<text class="bt '+cls+'" x="'+b.cx+'" y="'+(top+i*lh).toFixed(1)+
         '" text-anchor="middle" dominant-baseline="middle">'+esc(l)+'</text>';
    });
    return o;
  }
  svg.push(draw(q,'core'));
  [tl,tr,ml,mr,bc].forEach(function(b,i){
    svg.push(draw(b,hits.indexOf(i)!==-1?'hit':''));
  });
  svg.push('</svg>');
  $('map').innerHTML=svg.join('');
}

/* ── MODES ────────────────────────────────────────────────────────────────
   Listen and Read show the discussion Build has you take part in. Same data,
   same eight topics, same three registers — there is no second transcript. */
function setMode(m){
  if(m==='bank'){ bank(); return; }
  stopPlay();
  mode=m;
  Array.prototype.forEach.call($('pills').children,function(b){
    b.classList.toggle('on', b.dataset.m===m);
  });
  var iv = m==='listen'||m==='read';
  $('round').style.display = iv ? 'none' : '';
  $('res').classList.remove('show');
  var ty=document.querySelector('.tally'); if(ty) ty.style.display = iv ? 'none' : '';
  tools();
  if(iv) drawAll(); else reset();
}

function tools(){
  var T=$('tools'); if(!T) return;
  T.innerHTML='';
  function btn(label,on,fn){
    var b=document.createElement('button');
    b.className='tool'+(on?' on':''); b.type='button'; b.textContent=label;
    b.addEventListener('click',fn); T.appendChild(b); return b;
  }
  var n=document.createElement('span'); n.className='tool-n';
  if(mode==='listen'){
    if(!SPEECH){ n.textContent='this browser has no speech'; T.appendChild(n); return; }
    btn(playing?'■ stop':'▶ play the discussion',playing,function(){
      playing?stopPlay():startPlay(); });
    n.textContent=topic().them+' and you · '+run().length+' turns';
  } else if(mode==='read'){
    /* Part 3's x-ray marks what Part 3 is graded on. Not vocabulary: the two
       jobs, on every line, so the pattern is visible before it is explained. */
    btn('x-ray',xray,function(){ xray=!xray; tools(); drawAll(); });
    n.textContent = xray ? 'responding half underlined · advancing half in colour'
                         : 'show the two jobs';
  } else {
    n.textContent='you are '+topic().me;
  }
  T.appendChild(n);
}

/* Every turn, start to finish — the discussion as it actually runs. */
function drawAll(){
  var seq=run();
  $('talk').innerHTML=seq.map(function(t,i){
    var mine=t.who==='me', body;
    if(xray && t.respond){
      body='<span class="xr-r">'+esc(t.respond)+'</span> '+
           '<span class="xr-a">'+esc(t.advance)+'</span>';
    } else { body=esc(t.t); }
    return '<div class="turn'+(mine?' mine':'')+'" data-i="'+i+'">'+
      '<div class="who">'+esc(mine?'You ('+topic().me+')':topic().them)+'</div>'+
      '<p>'+body+'</p></div>';
  }).join('');
  drawMap([0,1,2,3,4]);
}

/* ── PLAY THE DISCUSSION ─────────────────────────────────────────────────
   Two voices. Part 1 had to assemble an interview out of separate answers;
   this is a real conversation in the file, so Listen plays the thing itself. */
function startPlay(){
  if(!SPEECH) return;
  var seq=run(); playing=true; playIx=0;
  $('talk').classList.add('playing'); tools();
  (function next(){
    if(!playing||playIx>=seq.length){ stopPlay(); return; }
    var t=seq[playIx];
    Array.prototype.forEach.call($('talk').querySelectorAll('.turn'),function(el){
      el.classList.toggle('live', +el.dataset.i===playIx); });
    var u=new SpeechSynthesisUtterance(t.t);
    u.lang='en-GB'; u.rate=0.95; u.pitch = t.who==='me' ? 0.9 : 1.1;
    var vs=speechSynthesis.getVoices();
    var want = t.who==='me' ? /male/i : /female/i;
    var v = vs.filter(function(x){ return /en[-_]GB/i.test(x.lang) && want.test(x.name); })[0]
         || vs.filter(function(x){ return /en[-_]GB/i.test(x.lang); })[0]
         || vs.filter(function(x){ return /^en/i.test(x.lang); })[0];
    if(v) u.voice=v;
    u.onend=function(){ playIx++; setTimeout(next,300); };
    u.onerror=function(){ stopPlay(); };
    speechSynthesis.speak(u);
  })();
}
function stopPlay(){
  playing=false;
  if(SPEECH) speechSynthesis.cancel();
  var el=$('talk');
  if(el){ el.classList.remove('playing');
    Array.prototype.forEach.call(el.querySelectorAll('.live'),function(x){
      x.classList.remove('live'); }); }
  if($('tools')) tools();
}

/* ── THE BANK ────────────────────────────────────────────────────────────
   A sheet, never a destination — the same rule as Part 1. Every phrase is
   lifted verbatim from a turn in these discussions. */
function bank(){
  $('bankBody').innerHTML=D.phraseBank.map(function(g){
    return '<div class="bank-g"><b>'+esc(g.heading)+'</b>'+
      (g.note?'<i>'+esc(g.note)+'</i>':'')+'<ul>'+
      g.phrases.map(function(p){ return '<li>'+esc(p)+'</li>'; }).join('')+
      '</ul></div>';
  }).join('');
  $('sheet').classList.add('open');
  $('sheetX').focus();
}
function shutBank(){ $('sheet').classList.remove('open'); }

function render(){
  var seq=run();
  /* A prompt lights as the discussion reaches it: one per completed
     exchange, in order, the way a pair works round the map. */
  var reached=[]; for(var k=0;k<Math.min(both,topic().prompts.length);k++) reached.push(k);
  drawMap(reached);

  $('talk').innerHTML=seq.slice(0,at).map(function(t){
    var mine=t.who==='me';
    var body;
    if(mine && t.respond){
      /* Your own turn shows its two halves once said: the responding half in
         the accent, the advancing half in the sentence colour. */
      body='<span class="r">'+esc(t.respond)+'</span> '+esc(t.advance);
    } else { body=esc(t.t); }
    return '<div class="turn'+(mine?' mine':'')+'">'+
      '<div class="who">'+esc(mine?'You':topic().them)+'</div>'+
      '<p>'+body+'</p></div>';
  }).join('');

  $('tyBoth').querySelector('b').textContent=both;
  $('tyMiss').querySelector('b').textContent=halves;
  $('tyMiss').classList.toggle('weak',halves>both);

  /* Walk forward over the partner's turns and any of yours that are not
     choosable — the opening opinion, the bare invitation — until the next
     decision point. */
  while(at<seq.length && !seq[at].choose){ at++; render2(); return; }
  if(at>=seq.length){ finish(); return; }
  ask(seq[at]);
}
function render2(){ setTimeout(render,340); }

function ask(t){
  locked=false;
  $('round').style.display='';
  $('why').classList.remove('show'); $('why').textContent='';
  /* The last exchange is the exam's one-minute decision, not more discussion. */
  $('prompt').textContent = t.last
    ? 'Last exchange. Part 3 ends with the two of you reaching a decision — what do you say?'
    : 'Your turn. Which of these does both jobs?';

  $('opts').innerHTML='';
  options(t).forEach(function(o){
    var b=document.createElement('button');
    b.className='opt'; b.type='button'; b.textContent=o.t;
    b.addEventListener('click',function(){ pick(b,o); });
    $('opts').appendChild(b);
  });
}

function pick(btn,o){
  if(locked) return;
  if(o.ok){
    locked=true; both++;
    btn.classList.add('is-ok');
    Array.prototype.forEach.call($('opts').children,function(b){ b.disabled=true; });
    setTimeout(function(){ at++; render(); },420);
  } else {
    /* Wrong is not a dead end. The half you chose is named, the round stays
       open, and the count of half-turns goes up — which is the diagnostic. */
    halves++;
    btn.classList.add('is-no'); btn.disabled=true;
    $('why').textContent=o.why; $('why').classList.add('show');
    $('tyMiss').querySelector('b').textContent=halves;
    $('tyMiss').classList.toggle('weak',halves>both);
  }
}

function finish(){
  done=true;
  $('round').style.display='none';
  $('res').classList.add('show');
  if(halves===0){
    $('resH').textContent='Every turn did both jobs.';
    $('resP').textContent='You answered your partner and moved the discussion on, '+
      both+' times out of '+both+'. That is what Interactive Communication is marked on, '+
      'and Part 3 is where the examiners look hardest for it.';
  } else if(halves<=both){
    $('resH').textContent='Mostly both.';
    $('resP').textContent=both+' full turns and '+halves+' half-turns. Look back at which '+
      'half you dropped: reaching for your own point before answering theirs is the commoner '+
      'of the two, and the more costly.';
  } else {
    $('resH').textContent='Half-turns outnumbered full ones.';
    $('resP').textContent=halves+' half-turns against '+both+'. The English was fine every '+
      'time — that is the point. A turn can be perfectly correct and still score badly in '+
      'Part 3 if it ignores the person you are talking to.';
  }
}

$('againBtn').addEventListener('click',function(){ reset(); });

Array.prototype.forEach.call($('pills').children,function(b){
  b.addEventListener('click',function(){ setMode(b.dataset.m); });
});
$('sheetX').addEventListener('click',shutBank);
$('sheet').addEventListener('click',function(e){ if(e.target===$('sheet')) shutBank(); });
addEventListener('keydown',function(e){
  if(e.key==='Escape' && $('sheet').classList.contains('open')) shutBank(); });
addEventListener('pagehide',stopPlay);
function reset(){
  at=0; both=0; halves=0; done=false;
  $('res').classList.remove('show'); $('round').style.display='';
  render();
}

function chrome(){
  $('tabs').innerHTML='';
  D.topics.forEach(function(t,i){
    var b=document.createElement('button');
    b.className='vtab'+(i===ti?' active':''); b.type='button'; b.textContent=t.tab;
    b.addEventListener('click',function(){ ti=i; stopPlay(); chrome();
      if(mode==='listen'||mode==='read') { tools(); drawAll(); } else reset(); });
    $('tabs').appendChild(b);
  });
  $('voices').innerHTML='';
  D.styles.forEach(function(s,i){
    var b=document.createElement('button');
    b.className='vb'+(i===si?' on':''); b.type='button'; b.textContent=s.tab;
    b.addEventListener('click',function(){ si=i; stopPlay(); chrome();
      if(mode==='listen'||mode==='read') drawAll(); else reset(); });
    $('voices').appendChild(b);
  });
}

addEventListener('scroll',function(){
  document.body.classList.toggle('scrolled',scrollY>4);
},{passive:true});

fetch('data/part3-talk.json')
  .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(function(d){
    D=d;
    var p=new URLSearchParams(location.search);
    var wt=p.get('topic');
    if(wt) D.topics.forEach(function(t,i){ if(t.id===wt) ti=i; });
    chrome();
    var wm=p.get('mode');
    /* Listen unless the link says otherwise — notice the discussion before
       being asked to take part in one. */
    setMode(['listen','read','build'].indexOf(wm)>-1 ? wm : 'listen');
  })
  .catch(function(e){
    $('map').textContent='Could not load the discussions.';
    $('prompt').textContent='data/part3-talk.json did not load ('+e.message+').';
  });
</script>
</body>
