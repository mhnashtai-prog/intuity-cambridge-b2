<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F3F1ED">
<title>INTUITY — Speaking Part 3</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;900&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=8">

<style>
/* ═══════════════════════════════════════════════════════════════════════
   SPEAKING PART 3 — PHONE FIRST, THE SHEET AT THE CENTRE

   The screen is a phone held by a fifteen-year-old, so the page is four
   things stacked, and nothing else:

     1  the topic       one line, slides sideways
     2  the stage       Explore · Practice · Quiz · Talk
     3  the sheet       the question, five prompts, PLAY in the middle
     4  the dialogue    Emma and Lucas, with its own whole/section switch

   The sheet is the exam paper the pair hold in the room, drawn as a
   spider: five branches and a hub. The hub is the play button, because on
   a phone the thing you press should be the thing you are looking at.
   While the pair talk, the branch they are on fills grey; once covered it
   keeps a tick. While sound is playing the sheet pins under the header, so
   the dialogue scrolls beneath it and the paper never leaves the table.

   WHICH BRANCH: read from what Emma and Lucas actually SAY. Each prompt's
   words are matched against each turn; the question's own words are
   ignored, since every turn mentions the topic. A `prompt` field on a turn
   in the data overrides this, so when the data is tagged by hand the
   heuristic retires without a code change.
   ═══════════════════════════════════════════════════════════════════════ */

:root{ --accent:#DD8E58; --accent-ink:#9A5A2C; --accent-rgb:221,142,88;
  --bg:var(--screen,var(--page-bg,#F3F1ED)); }

.header{position:sticky;top:0;z-index:20;background:var(--bg);padding-bottom:.35rem}
.header::after{opacity:0;transition:opacity .2s ease;width:100%}
body.scrolled .header::after{opacity:1}
.wrap{max-width:40rem;margin:0 auto;padding:.9rem var(--gutter,1rem) 6rem}

/* ── STOPGAP ─────────────────────────────────────────────────────────────
   .seg, .tool and .dots belong to the shell (intuity-nav, v8). Kept here
   ONLY until v8 is confirmed live on this page; delete this block then.
   Without it, a stale shell leaves the stage switch unstyled in class. */
.seg{display:inline-flex;align-items:center;padding:.18rem;background:var(--tile-bg);
  border-radius:999px}
.seg button{font-family:var(--f-display);font-size:.7rem;font-weight:600;
  letter-spacing:.03em;color:var(--dim);background:none;border:none;cursor:pointer;
  padding:.45rem .9rem;border-radius:999px;min-height:34px;white-space:nowrap;
  transition:background .18s cubic-bezier(.2,.8,.2,1),color .18s,box-shadow .18s}
.seg button[aria-selected="true"]{background:var(--bg);color:var(--ink);
  font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.07)}
.tool{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.08em;
  text-transform:uppercase;color:var(--faint);background:none;border:none;
  cursor:pointer;padding:.5rem .5rem;min-height:36px}
.tool.on{color:var(--accent-ink)}
.dots{display:flex;align-items:center;justify-content:center;gap:.1rem}
.dots button{width:24px;height:24px;padding:0;border:none;background:none;
  cursor:pointer;display:flex;align-items:center;justify-content:center}
.dots button::after{content:'';width:6px;height:6px;border-radius:50%;
  background:var(--rule);transition:background .2s,transform .2s}
.dots button.on::after{background:var(--accent);transform:scale(1.25)}
/* ── end stopgap ── */

/* ── 1 · THE TOPIC ───────────────────────────────────────────────────────
   Eight topics on one line that slides, not four lines of chips. The
   current one is scrolled into view, so a student arriving on topic six
   sees topic six. Faded edges say "there is more this way" without an
   arrow to press. */
.topics{display:flex;gap:.1rem;overflow-x:auto;scroll-snap-type:x proximity;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;padding:0 1rem;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 1rem,#000 calc(100% - 1rem),transparent 100%);
          mask-image:linear-gradient(90deg,transparent 0,#000 1rem,#000 calc(100% - 1rem),transparent 100%)}
.topics::-webkit-scrollbar{display:none}
.topics button{flex:none;scroll-snap-align:center;font-family:var(--f-mono);
  font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);
  background:none;border:none;cursor:pointer;padding:.7rem .6rem;position:relative;
  white-space:nowrap;min-height:40px;transition:color .15s}
.topics button.on{color:var(--ink)}
.topics button.on::after{content:'';position:absolute;left:.6rem;right:.6rem;
  bottom:.4rem;height:1.5px;background:var(--accent);border-radius:1px}
@media(min-width:720px){ .topics{justify-content:center;-webkit-mask-image:none;mask-image:none} }

/* ── 2 · THE STAGE ───────────────────────────────────────────────────── */
.stage-row{display:flex;justify-content:center;margin:.3rem 0 1.1rem}

/* ── 3 · THE SHEET ───────────────────────────────────────────────────── */
.sheet-wrap{background:var(--bg);padding:.2rem 0 .6rem}
.sheet-wrap.pin{position:sticky;top:var(--hh,120px);z-index:10;
  border-bottom:1px solid var(--rule)}
.qline{font-family:var(--f-display);font-size:1.02rem;font-weight:700;
  line-height:1.35;color:var(--ink);text-align:center;margin:0 auto .3rem;max-width:26rem}
.qline small{display:block;font-family:var(--f-mono);font-size:.58rem;font-weight:400;
  letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:.25rem}

/* ── PHASE-FILTER TABS · Full text + one tab per discussion prompt ────────
   Same job as Part 2's phase tabs, ported: instead of stepping through
   exchanges two at a time with arrows, a student picks a prompt directly —
   "show me only the bit about pocket money" — and reads just that. Full
   text still shows everything, uninterrupted, as Whole always did. */
.seg.phase{width:auto;margin-bottom:0;flex-wrap:wrap}
.seg.phase button{flex:1 1 auto;min-width:5.2rem;font-size:.62rem;line-height:1.22;
  white-space:normal;padding:.5rem .35rem;text-align:center}
@media(min-width:480px){ .seg.phase button{font-size:.68rem} }
.mphase{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.11em;
  text-transform:uppercase;color:var(--faint);margin:0 0 .7rem}

.web svg{width:100%;height:auto;display:block;max-width:30rem;margin:0 auto;overflow:visible}
.web .sp{fill:none;stroke:var(--rule);stroke-width:1.3;transition:stroke .35s}
.web .pl{fill:transparent;stroke:var(--rule);stroke-width:1;transition:fill .35s,stroke .35s}
.web .tx{font-family:var(--f-body);font-size:13px;fill:var(--sentence);transition:fill .35s}
.web .br.now .sp{stroke:var(--faint)}
.web .br.now .pl{fill:var(--tile-bg);stroke:var(--faint)}
.web .br.now .tx{fill:var(--ink)}
.web .br.done .pl{stroke:var(--dim)}
.web .br.done .sp{stroke:var(--dim)}
.web .br.done .tx{fill:var(--ink)}
.web .tk{fill:none;stroke:var(--dim);stroke-width:1.8;stroke-linecap:round;
  stroke-linejoin:round;opacity:0;transition:opacity .3s}
.web .br.done .tk{opacity:1}
.web .br.tap{cursor:pointer}
/* The hub. Solid, because it is the one thing on the screen to press. */
.web .hub{cursor:pointer}
.web .hub circle{fill:var(--ink);transition:fill .2s}
.web .hub path,.web .hub rect{fill:var(--bg)}
.web .hub.off{cursor:default}
.web .hub.off circle{fill:var(--rule)}
@media(hover:hover){ .web .hub:not(.off):hover circle{fill:var(--accent-ink)} }
.web .hub:focus-visible{outline:none}
.web .hub:focus-visible circle{stroke:var(--accent);stroke-width:3}

/* ── 4 · THE DIALOGUE ─────────────────────────────────────────────────── */
.dlg{margin-top:1.1rem;border-top:1px solid var(--rule);padding-top:.8rem}
.dlg-hd{display:flex;align-items:center;justify-content:space-between;gap:.6rem;
  flex-wrap:wrap;margin-bottom:.9rem}
.lbl{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.11em;
  text-transform:uppercase;color:var(--faint)}
.turn{margin-bottom:.9rem;transition:opacity .3s ease}
.turn .who{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--faint);margin-bottom:.2rem}
.turn p{margin:0;font-size:1rem;line-height:1.6;color:var(--sentence)}
.turn.mine{padding-left:1rem;border-left:2px solid var(--accent)}
.turn.mine .who{color:var(--accent-ink)}
.turn.mine p{color:var(--ink)}
.playing .turn{opacity:.3}
.playing .turn.live{opacity:1}
.xr-r{box-shadow:inset 0 -2px 0 var(--accent)}
.xr-a{color:var(--accent-ink)}
.one .turn p{font-size:1.12rem}
.one-foot{display:flex;align-items:center;justify-content:space-between;
  margin-top:.9rem;padding-top:.6rem;border-top:1px solid var(--rule)}
.arrow{font-size:1.05rem;line-height:1;color:var(--sentence);background:none;
  border:none;padding:.6rem .8rem;cursor:pointer;min-height:44px;min-width:44px}
.arrow:disabled{color:var(--rule);cursor:default}

/* The phase tabs and the register toggle now live in the same row, so it
   has to wrap as a unit: whichever buttons don't fit drop to the next
   line together, same as the phase tabs already wrap among themselves. */
.dlg-hd{flex-wrap:wrap;row-gap:.4rem}
.seg.sm{padding:.14rem}
.seg.sm button{font-size:.64rem;padding:.38rem .6rem;min-height:30px}
.dlg-sub{display:flex;align-items:center;justify-content:space-between;gap:.6rem;
  margin:.3rem 0 .8rem}
.dlg-sub .tool{padding-left:0}
.dlg-n{font-family:var(--f-mono);font-size:.6rem;color:var(--faint);text-align:right;
  font-variant-numeric:tabular-nums}
@media(max-width:360px){ .seg.sm button{padding:.36rem .48rem} }

/* ── PRACTICE · shadowing, grouped by move ─────────────────────────────── */
.fn-row{display:flex;gap:.3rem;overflow-x:auto;scrollbar-width:none;
  padding-bottom:.2rem;margin-bottom:1rem}
.fn-row::-webkit-scrollbar{display:none}
.fn{flex:none;font-family:var(--f-display);font-size:.7rem;font-weight:600;
  color:var(--dim);background:none;border:none;border-radius:999px;
  box-shadow:inset 0 0 0 1px var(--rule);padding:.5rem .85rem;cursor:pointer;
  min-height:36px;white-space:nowrap}
.fn.on{color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--accent)}
.fn-when{font-size:.9rem;line-height:1.55;color:var(--dim);margin:0 0 1.2rem}
.dr-ctx{font-size:.95rem;line-height:1.55;color:var(--dim);margin:0 0 1rem}
.dr-ctx b{display:block;font-family:var(--f-mono);font-size:.6rem;font-weight:400;
  letter-spacing:.11em;text-transform:uppercase;color:var(--faint);margin-bottom:.25rem}
.dr-line{font-size:1.2rem;line-height:1.5;color:var(--ink);margin:0 0 1.2rem;
  padding-left:1rem;border-left:2px solid var(--accent)}
.dr-line .r{color:var(--accent-ink)}
.dr-say{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.09em;
  text-transform:uppercase;color:var(--faint);margin-bottom:.45rem}
.dr-say.now{color:var(--accent-ink)}
.bar{height:2px;background:var(--rule);border-radius:1px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
.bar i.run{transition:width linear}
.dr-foot{display:flex;align-items:center;justify-content:space-between;
  margin-top:1.2rem;padding-top:.6rem;border-top:1px solid var(--rule)}
.dr-n{font-family:var(--f-mono);font-size:.62rem;color:var(--faint);
  font-variant-numeric:tabular-nums}

/* ── QUIZ ────────────────────────────────────────────────────────────── */
.tally{display:flex;gap:1.4rem;justify-content:center;margin:.2rem 0 .2rem}
.ty{display:flex;align-items:baseline;gap:.4rem}
.ty b{font-family:var(--f-mono);font-size:1.1rem;font-weight:400;color:var(--ink);
  font-variant-numeric:tabular-nums}
.ty span{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.09em;
  text-transform:uppercase;color:var(--faint)}
.ty.weak b{color:var(--wrong)}
.ask{font-size:.9rem;color:var(--dim);margin:0 0 .7rem}
.opts{display:flex;flex-direction:column;gap:.5rem}
.opt{text-align:left;width:100%;font-size:.95rem;line-height:1.5;padding:.85rem 1rem;
  border:none;border-radius:var(--r-field,12px);background:var(--tile-bg);
  color:var(--tile-ink);cursor:pointer;min-height:48px;
  transition:background .14s,transform .1s cubic-bezier(.2,.8,.2,1)}
.opt:active:not(:disabled){transform:scale(.99)}
.opt.is-ok{background:var(--tile-ok-bg);color:var(--tile-ok-ink)}
.opt.is-no{background:var(--tile-no-bg);color:var(--tile-no-ink)}
.why{font-size:.86rem;line-height:1.55;color:var(--dim);padding:.7rem .2rem 0;display:none}
.why.show{display:block}
.res h2{font-family:var(--f-display);font-size:1.08rem;font-weight:900;color:var(--ink);
  margin:0 0 .5rem}
.res p{font-size:.94rem;line-height:1.6;color:var(--sentence);margin:0 0 .8rem}

/* ── TALK · the real three minutes ─────────────────────────────────────── */
.clock-row{display:flex;align-items:baseline;justify-content:center;gap:.8rem;
  margin:.1rem 0 .5rem}
.clock{font-family:var(--f-mono);font-size:2.4rem;color:var(--ink);line-height:1;
  font-variant-numeric:tabular-nums}
.clock.low{color:var(--wrong)}
.phase{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--faint)}
.phase.dec{color:var(--accent-ink)}
.talk-lead{font-size:.95rem;line-height:1.6;color:var(--sentence);margin:1rem 0 0}
.examiner{font-size:.98rem;line-height:1.55;color:var(--ink);margin:1rem 0 0;
  font-style:italic}
.model{border-top:1px solid var(--rule);margin-top:1.4rem;padding-top:1rem;display:none}
.model.show{display:block}
.model p{font-size:1.05rem;line-height:1.55;color:var(--ink);margin:.4rem 0 0;
  padding-left:1rem;border-left:2px solid var(--accent)}
.model p .r{color:var(--accent-ink)}

/* ── THE PHRASE BANK · a sheet from anywhere, never a stage ────────────── */
.bank-btn{display:block;margin:2rem auto 0;font-family:var(--f-mono);font-size:.62rem;
  letter-spacing:.09em;text-transform:uppercase;color:var(--faint);background:none;
  border:none;cursor:pointer;padding:.7rem;min-height:44px}
#sheet .sheet-card{width:min(40rem,calc(100vw - 1.5rem));max-width:none;
  align-items:stretch;text-align:left;gap:0}
.sheet-card h2{font-family:var(--f-display);font-size:1.1rem;font-weight:900;
  color:var(--ink);margin-bottom:.5rem}
.sheet-card .close-btn{position:absolute;top:.7rem;right:.7rem}
.bank-g{padding:1rem 0 .2rem;border-top:1px solid var(--rule)}
.bank-g b{display:block;font-family:var(--f-display);font-size:.86rem;font-weight:700;
  letter-spacing:.04em;text-transform:uppercase;color:var(--ink);margin-bottom:.2rem}
.bank-g i{display:block;font-style:normal;font-size:.9rem;line-height:1.5;
  color:var(--dim);margin-bottom:.3rem}
.bank-g ul{list-style:none;margin:0;padding:0}
.bank-g li{font-size:1rem;color:var(--ink);padding:.65rem 0;border-bottom:1px solid var(--rule)}
.bank-g li:last-child{border-bottom:none}

@media(prefers-reduced-motion:reduce){
  .bar i.run{transition:none}
  .seg button,.dots button::after{transition:none}
}
</style>
</head>
<body>

<header class="header" id="hdr">
  <div class="header-top">
    <a class="back-link" href="/index.html?openModal=speaking" target="_top">← Speaking</a>
    <div class="header-title">
      <div class="app-title">INTUITY</div>
      <div class="app-subtitle">Speaking · Part 3</div>
    </div>
    <span class="header-spacer">Level <b>B2</b></span>
  </div>
  <!-- NOTE: Slides removed from this row, per the sketch. tools/check-pages.py
       --fix-nav regenerates this row on every page — change it THERE, or
       the next run puts Slides back. -->
  <nav class="mode-selector" aria-label="Speaking sections">
    <a class="mode-btn" href="speaking-format.html">Hub</a>
    <a class="mode-btn" href="part1.html">Part 1</a>
    <a class="mode-btn" href="part2-turn.html">Part 2</a>
    <span class="mode-btn active" aria-current="page">Part 3</span>
    <a class="mode-btn" href="part4-views.html">Part 4</a>
  </nav>
  <div class="topics" id="topics" role="tablist" aria-label="Topic"></div>
</header>

<main class="wrap">
  <div class="stage-row">
    <div class="seg" id="stages" role="tablist" aria-label="Stage">
      <button type="button" role="tab" data-s="explore" aria-selected="true">Explore</button>
      <button type="button" role="tab" data-s="practice" aria-selected="false">Practice</button>
      <button type="button" role="tab" data-s="quiz" aria-selected="false">Quiz</button>
      <button type="button" role="tab" data-s="talk" aria-selected="false">Talk</button>
    </div>
  </div>

  <div class="sheet-wrap" id="sheetWrap">
    <p class="qline" id="qline"></p>
    <div class="web" id="web"></div>
  </div>

  <div id="body"></div>

  <button class="bank-btn" type="button" id="bankBtn">Phrase bank</button>
</main>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="bankH">
  <div class="sheet-card">
    <button class="close-btn" id="sheetX" type="button" aria-label="Close">
      <svg width="15" height="15" viewBox="0 0 15 15" aria-hidden="true">
        <path d="M3 3 L12 12 M12 3 L3 12" stroke="currentColor"
              stroke-width="1.8" stroke-linecap="round" fill="none"/>
      </svg>
    </button>
    <h2 id="bankH">Responding to your partner</h2>
    <div id="bankBody"></div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════════════════════════════════ */
var D=null, PH=null, ti=0, si=0;
var stage='explore', view='whole', xray=false, fp='view';
var playing=false, playIx=-1, tmr=null;
var TR=null;                                   /* the prompt trace for this run */
var SPEECH=('speechSynthesis' in window);

var $=function(id){ return document.getElementById(id); };
var esc=function(s){ return String(s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };

function pref(k,v){
  try{ if(v===undefined) return localStorage.getItem('intuity.p3.'+k);
       localStorage.setItem('intuity.p3.'+k,v); }catch(e){ return null; }
}

function topic(){ return D.topics[ti]; }
function run(){ return topic().runs[D.styles[si].id]; }

/* ═══════════════════════════════════════════════════════════════════════
   WHICH BRANCH ARE THEY ON
   Read from the words. For each prompt, its content words are stemmed and
   matched against each turn. A prompt counts as addressed when every one
   of its words turns up, or when a substantial word unique to it does — "money"
   belongs to both "handling money" and "pocket money", so money alone
   proves nothing, but "pocket" does.

   The question's own words are thrown out first: every turn in a
   discussion about part-time jobs says "jobs", and that is not evidence of
   any prompt.

   A turn with no hit keeps the previous branch lit — the pair are still on
   it. A `prompt` number or array on a turn in the data overrides all of
   this; tag by hand and the heuristic simply stops being consulted.
   ═══════════════════════════════════════════════════════════════════════ */
var STOP={the:1,and:1,for:1,with:1,you:1,your:1,who:1,what:1,that:1,this:1,
  they:1,them:1,are:1,can:1,its:1,from:1,about:1,just:1,like:1,really:1,
  think:1,people:1,not:1,but:1,also:1,should:1,would:1,could:1,have:1,has:1,
  been:1,more:1,less:1,very:1,much:1,some:1,any:1,all:1,there:1,their:1,
  than:1,then:1,into:1,out:1,get:1,got:1,maybe:1,yeah:1,don:1,doesn:1,isn:1};

function stem(w){
  w=w.replace(/'s$/,'').replace(/^'+|'+$/g,'');
  if(w.length>5) w=w.replace(/(ing|ed|es|s)$/,'');
  else if(w.length>3) w=w.replace(/s$/,'');
  return w.slice(0,5);
}
function words(s,skip){
  var out={};
  String(s).toLowerCase().replace(/[^a-z\s'-]/g,' ').split(/\s+/).forEach(function(w){
    w=w.replace(/^-+|-+$/g,'');
    if(w.length<3 || STOP[w]) return;
    var st=stem(w);
    if(!skip || !skip[st]) out[st]=1;
  });
  return out;
}

function trace(){
  var tp=topic(), seq=run(), P=tp.prompts;
  var qw=words(tp.question), pw=P.map(function(p){ return Object.keys(words(p,qw)); });
  /* stems that belong to exactly one prompt */
  var count={}; pw.forEach(function(ws){ ws.forEach(function(w){ count[w]=(count[w]||0)+1; }); });

  var now=[], done=[], raw=[], seen={}, last=[];
  seq.forEach(function(t,i){
    var hits=[];
    if(t.prompt!==undefined && t.prompt!==null){
      hits=[].concat(t.prompt);
    } else {
      var tw=words(t.t,qw);
      pw.forEach(function(ws,k){
        if(!ws.length) return;
        var m=ws.filter(function(w){ return tw[w]; });
        /* A word unique to one prompt is evidence — but only a substantial
           one. "work" and "time" are unique to their prompts and still turn
           up in "working weekends" and "time management"; "pocket" and
           "school" do not wander like that. */
        var unique=m.some(function(w){ return count[w]===1 && w.length>=5; });
        if(m.length===ws.length || unique) hits.push(k);
      });
    }
    /* raw: this turn's own evidence, nothing carried forward — what the
       Practice-style filtered view selects on. now/done (below) carry the
       last hit forward, which is right for lighting up the spider diagram
       but wrong for "show me only the turns about X". */
    raw.push(hits.slice());
    if(hits.length) last=hits;
    hits.forEach(function(k){ seen[k]=1; });
    now.push(last.slice());
    done.push(Object.keys(seen).map(Number));
  });
  return {now:now, done:done, raw:raw};
}

/* ═══════════════════════════════════════════════════════════════════════
   WHICH LANGUAGE FUNCTION IS THIS TURN
   Not a heuristic — the data already carries the answer. Every turn has a
   `tag`, and almost all of them are literally <respond>_then_<advance>:
   the turn reacts to the partner, then does its own next job. That
   compound shape IS what Interactive Communication marks, so one turn
   sorts into exactly one bucket below by what its tag says it does, in
   this priority order (checked top to bottom, first match wins):

     1. the turn that closes the discussion (`last:true`, or a tag ending
        _summarizing) — reaching consensus, wherever it falls
     2. a bare view (`opinion`, `opinion_with_*`) — expressing a view
     3. a bare reason (`reasoning`, `acknowledging_then_reasoning`) — justifying
     4. a tag ending _then_inviting, or `inviting` — handing the floor back
     5. everything else — reacting: every remaining tag is a
        <react>_then_<build> compound (partial_agreement_then_disagreement,
        acknowledging_then_questioning, strong_agreement_then_building...),
        so rather than force each one into "agree" OR "disagree" — which
        the tag itself refuses to be — they sit together in one bucket,
        with x-ray on by default to show where the reaction ends and the
        candidate's own move begins.

   NOT COVERED: exemplifying. Cambridge's own Part 3 criteria list it
   alongside justifying, but no tag in this corpus marks a turn as giving
   an example rather than a reason — so there is no "Exemplifying" tab
   here. Adding one would mean inventing which turns count, which is worse
   than leaving the gap visible. Tag the data by hand (a `func:"example"`
   field, read the same way `prompt` already overrides the Part 2/3
   heuristics) and a sixth tab drops in without touching this code. */
function funcOf(t){
  var tag=t.tag||'';
  if(t.last===true || /summarizing$/.test(tag)) return 'consensus';
  if(tag==='opinion' || /^opinion_with/.test(tag)) return 'view';
  if(tag==='reasoning' || tag==='acknowledging_then_reasoning') return 'justify';
  if(tag==='inviting' || /_then_inviting$/.test(tag)) return 'invite';
  return 'react';
}

var FUNCS=[
  { id:'view', label:'Expressing a view',
    hint:'The opening move, and any fresh opinion raised mid-discussion.' },
  { id:'justify', label:'Justifying',
    hint:'A reason given for a view, not just the view on its own.' },
  { id:'react', label:'Agreeing & disagreeing',
    hint:'Reacting to your partner before adding your own move — x-ray shows where the reaction ends and the next move starts.' },
  { id:'invite', label:'Handing back',
    hint:'Ending on a question, so the discussion stays a discussion.' },
  { id:'consensus', label:'Reaching consensus',
    hint:'The turn that closes the discussion. Part 3 always ends with one.' }
];

function phaseTabs(){ return [{id:'whole',label:'Full text'}].concat(FUNCS); }

/* Every turn in this function, plus its immediate neighbour on each side
   — the line that prompted it and the line that follows — so the
   filtered read stays a legible exchange, not isolated fragments. */
function funcTurns(id){
  var seq=run(), keep={};
  seq.forEach(function(t,i){
    if(funcOf(t)!==id) return;
    keep[i]=1;
    if(i>0) keep[i-1]=1;
    if(i<seq.length-1) keep[i+1]=1;
  });
  return Object.keys(keep).map(Number).sort(function(a,b){ return a-b; });
}

/* ═══════════════════════════════════════════════════════════════════════
   THE SHEET — a spider, the way the exam paper is laid out: two branches
   left, two right, one below, the question above, PLAY at the hub.
   ═══════════════════════════════════════════════════════════════════════ */
function lines(s,max){
  var w=String(s).split(' '), L=[], cur='';
  w.forEach(function(x){
    if((cur+' '+x).trim().length>max && cur){ L.push(cur.trim()); cur=x; }
    else cur+=' '+x;
  });
  if(cur.trim()) L.push(cur.trim());
  return L.slice(0,2);
}

/* state: { now:[], done:[], hub:'play'|'stop'|'off', tap:bool } */
function web(state){
  var P=topic().prompts.slice(0,5), W=360, cx=180, R=27, lh=15;

  /* Vertical rhythm is measured, not fixed: the rows are placed from the
     pills' real heights, with GAP between the upper and lower branches.
     38 viewBox units is ~1cm on a phone, where the sheet renders at about
     360px wide. The hub sits in the gap horizontally, between the columns,
     so a tight gap never pushes the rows apart to make room for it. */
  var GAP=38, TOP=6, BELOW=14;
  var LS=P.map(function(p){ return lines(p,15); });
  var HT=LS.map(function(L){ return L.length*lh+14; });
  var hT=Math.max(HT[0]||0,HT[1]||0), hL=Math.max(HT[2]||0,HT[3]||0);
  var yTop=TOP+hT/2, yLow=yTop+hT/2+GAP+hL/2, cy=(yTop+yLow)/2;
  var yBot=Math.max(yLow+hL/2, cy+R)+BELOW+(HT[4]||0)/2;
  var H=Math.ceil(yBot+(HT[4]||0)/2+6);
  var spots=[ {x:66,y:yTop}, {x:294,y:yTop}, {x:66,y:yLow}, {x:294,y:yLow}, {x:180,y:yBot} ];
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="group" aria-label="The task card">';

  P.forEach(function(p,i){
    var sp=spots[i], L=LS[i];
    var wd=Math.min(128, Math.max.apply(null,L.map(function(l){ return l.length; }))*6.9+26);
    var ht=HT[i];
    var bx=sp.x-wd/2, by=sp.y-ht/2;
    /* A straight rule from the hub to the near side of the pill — the
       printed sheet has no curves, so neither does this. */
    var ex = i===4 ? sp.x : (sp.x<cx ? bx+wd : bx);
    var ey = i===4 ? by : sp.y;
    var cls='br'+(state.now.indexOf(i)!==-1?' now':'')+
            (state.done.indexOf(i)!==-1?' done':'')+(state.tap?' tap':'');
    s+='<g class="'+cls+'" data-branch="'+i+'"'+
       (state.tap?' role="button" tabindex="0" aria-label="'+esc(p)+'"':'')+'>';
    s+='<path class="sp" d="M'+cx+' '+cy.toFixed(1)+' L'+ex.toFixed(1)+' '+ey.toFixed(1)+'"/>';
    s+='<rect class="pl" x="'+bx.toFixed(1)+'" y="'+by.toFixed(1)+'" width="'+wd.toFixed(1)+
       '" height="'+ht+'" rx="'+(ht/2>14?14:ht/2)+'"/>';
    var ty=sp.y-((L.length-1)*lh)/2;
    L.forEach(function(l,k){
      s+='<text class="tx" x="'+sp.x+'" y="'+(ty+k*lh).toFixed(1)+
         '" text-anchor="middle" dominant-baseline="middle">'+esc(l)+'</text>';
    });
    var kx=bx+wd-11, ky=by+5;
    s+='<path class="tk" d="M'+(kx-4)+' '+(ky+3)+' l2.6 2.8 l4.6-5.6"/>';
    s+='</g>';
  });

  var lab = state.hub==='stop' ? 'Stop' : (state.hub==='play' ? 'Play' : '');
  s+='<g class="hub'+(state.hub==='off'?' off':'')+'" data-hub="1"'+
     (state.hub==='off'?'':' role="button" tabindex="0" aria-label="'+lab+'"')+'>';
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'"/>';
  if(state.hub==='stop') s+='<rect x="'+(cx-8)+'" y="'+(cy-8)+'" width="16" height="16" rx="2.5"/>';
  else if(state.hub==='play') s+='<path d="M'+(cx-7)+' '+(cy-11)+' L'+(cx+12)+' '+cy+' L'+(cx-7)+' '+(cy+11)+'Z"/>';
  s+='</g></svg>';
  $('web').innerHTML=s;
}

function qline(){
  $('qline').innerHTML='<small>Talk together</small>'+esc(topic().question);
}

/* ═══════════════════════════════════════════════════════════════════════
   TOPICS — one line, sliding
   ═══════════════════════════════════════════════════════════════════════ */
function topics(){
  var T=$('topics'); T.innerHTML='';
  D.topics.forEach(function(t,i){
    var b=document.createElement('button');
    b.type='button'; b.textContent=t.tab; b.setAttribute('role','tab');
    b.className=i===ti?'on':''; b.setAttribute('aria-selected',String(i===ti));
    b.addEventListener('click',function(){
      if(i===ti) return;
      stop(); ti=i; pref('topic',t.id); topics(); draw();
    });
    T.appendChild(b);
  });
  var on=T.querySelector('.on');
  if(on && on.scrollIntoView) on.scrollIntoView({inline:'center',block:'nearest'});
  measure();
}

/* The pinned sheet sits under the header, whatever height that came to. */
function measure(){
  var h=$('hdr'); if(h) document.documentElement.style.setProperty('--hh',h.offsetHeight+'px');
}

/* ═══════════════════════════════════════════════════════════════════════
   EXPLORE — the sheet, and the dialogue under it
   ═══════════════════════════════════════════════════════════════════════ */
function turnHtml(t,i){
  var mine=t.who==='me', body;
  if(xray && t.respond && t.advance)
    body='<span class="xr-r">'+esc(t.respond)+'</span> <span class="xr-a">'+esc(t.advance)+'</span>';
  else body=esc(t.t);
  return '<div class="turn'+(mine?' mine':'')+'" data-i="'+i+'">'+
    '<div class="who">'+esc(mine?'You ('+topic().me+')':topic().them)+'</div>'+
    '<p>'+body+'</p></div>';
}

function seg(items,cur,attr,cls){
  return '<div class="seg'+(cls?' '+cls:'')+'" role="tablist">'+items.map(function(it){
    return '<button type="button" role="tab" '+attr+'="'+it.id+'" aria-selected="'+
      (it.id===cur)+'">'+esc(it.label)+'</button>'; }).join('')+'</div>';
}

function explore(){
  var seq=run(), tabs=phaseTabs(), curTab = view==='whole' ? 'whole' : fp;
  var phaseSeg='<div class="seg phase" role="tablist" aria-label="Filter by language function">'+
    tabs.map(function(pt){
      return '<button type="button" role="tab" data-view="'+pt.id+'" aria-selected="'+
        (pt.id===curTab)+'">'+esc(pt.label)+'</button>'; }).join('')+'</div>';
  var head='<div class="dlg-hd">'+phaseSeg+
    seg(D.styles.map(function(s,i){ return {id:String(i),label:s.tab}; }),String(si),'data-style','sm')+
    '</div><div class="dlg-sub">'+
    '<button class="tool'+(xray?' on':'')+'" type="button" data-xray="1">x-ray</button>'+
    '<span class="dlg-n">'+esc(topic().them)+' and you · '+seq.length+' turns</span></div>';
  var body;
  if(view==='whole'){
    body='<div id="talk">'+seq.map(turnHtml).join('')+'</div>';
  } else {
    var idx=funcTurns(fp), meta=FUNCS.filter(function(f){ return f.id===fp; })[0];
    var lines = idx.length
      ? idx.map(function(i){ return turnHtml(seq[i],i); }).join('')
      : '<p class="dr-ctx">No turns do this move in this register — try Full text, or another register above.</p>';
    body='<div id="talk"><div class="mphase">'+esc(meta.label)+'</div>'+
      '<p class="dr-ctx" style="margin-top:-.4rem">'+esc(meta.hint)+'</p>'+lines+'</div>';
  }
  $('body').innerHTML='<section class="dlg" aria-label="The discussion">'+head+body+'</section>';
  sheetState();
}

/* What the sheet shows, given where we are. The spider's five branches are
   the discussion PROMPTS (content), not the language functions filtered
   above, so playback still lights up whichever prompt the current turn
   happens to be about — the two axes are independent, and both stay true
   on screen at once. */
function sheetState(){
  var n=run().length, at=(playing && playIx>=0) ? playIx : n-1;
  web({ now: playing ? TR.now[at] : [], done: TR.done[at],
        hub: SPEECH ? (playing?'stop':'play') : 'off', tap:false });
}

/* Sound is a tool on the text. Whole: the full discussion, the sheet
   pinned so it never scrolls away. Section: the exchange on screen. */
function play(){
  if(!SPEECH) return;
  var seq=run();
  var idx = view==='whole' ? seq.map(function(_,i){ return i; }) : funcTurns(fp);
  if(!idx.length) return;
  playing=true; var pos=0; playIx=idx[0];
  $('talk').classList.add('playing');
  if(view==='whole'){ measure(); $('sheetWrap').classList.add('pin'); }
  (function next(){
    if(!playing || pos>=idx.length){ stop(); return; }
    playIx=idx[pos];
    var t=seq[playIx];
    Array.prototype.forEach.call($('talk').querySelectorAll('.turn'),function(el){
      var live=+el.dataset.i===playIx;
      el.classList.toggle('live',live);
      if(live && view==='whole' && el.scrollIntoView) el.scrollIntoView({block:'end',behavior:'smooth'});
    });
    sheetState();
    say(t.t, t.who==='me', function(){ pos++; tmr=setTimeout(next,280); });
  })();
  sheetState();
}

function stop(){
  playing=false; playIx=-1;
  if(tmr){ clearTimeout(tmr); tmr=null; }
  if(SPEECH) speechSynthesis.cancel();
  drillStop(); clockStop(false);
  var el=$('talk');
  if(el){ el.classList.remove('playing');
    Array.prototype.forEach.call(el.querySelectorAll('.live'),function(x){ x.classList.remove('live'); }); }
  var sw=$('sheetWrap'); if(sw) sw.classList.remove('pin');
  if(D && stage==='explore') sheetState();
}

/* One speaker per voice, and a watchdog: iOS drops utterances silently
   often enough that without one, playback stalls on a dead turn. */
function say(text,isMe,then){
  var n=String(text).split(/\s+/).length, pause=Math.max(1600,n*380), moved=false;
  function go(){ if(moved) return; moved=true; then(); }
  if(!SPEECH){ tmr=setTimeout(go,pause); return; }
  var u=new SpeechSynthesisUtterance(text);
  u.lang='en-GB'; u.rate=.95; u.pitch=isMe?.92:1.08;
  var v=voice(isMe); if(v) u.voice=v;
  u.onend=go; u.onerror=go;
  speechSynthesis.speak(u);
  tmr=setTimeout(function(){ if(!speechSynthesis.speaking) go(); }, pause+1800);
}

/* The old test for a man was /male/i, which matches "female"; and iOS
   voices carry no gender word at all. So: by name, against what ships. */
var VF=/(serena|martha|kate|stephanie|sonia|hazel|susan|libby|maisie|fiona|moira|karen|tessa|samantha|victoria|zira|catherine|amelie|female)/i;
var VM=/(daniel|oliver|arthur|george|ryan|thomas|alex|fred|gordon|\bmale\b|\bman\b)/i;
function voice(isMe){
  var vs=speechSynthesis.getVoices()||[];
  var wantF = (topic().me==='Emma') ? isMe : !isMe;
  var gb=vs.filter(function(v){ return /en[-_]GB/i.test(v.lang); });
  var en=vs.filter(function(v){ return /^en/i.test(v.lang); });
  var yes=wantF?VF:VM, no=wantF?VM:VF;
  function f(l){ return l.filter(function(v){ return yes.test(v.name)&&!no.test(v.name); })[0]; }
  return f(gb)||f(en)||gb.filter(function(v){ return !no.test(v.name); })[0]||gb[0]||en[0]||null;
}

/* ═══════════════════════════════════════════════════════════════════════
   PRACTICE — say it after them
   One move at a time, across all eight topics: eight instances of the same
   move in eight contexts is how a pattern separates from its content. The
   sheet is hidden here, because these lines come from every topic at once.
   ═══════════════════════════════════════════════════════════════════════ */
var FN=[
  { id:'pushback', label:'Agree, then push back',
    when:'You accept their point and keep your own. The most useful move in Part 3.',
    test:function(t){ return /^partial_agreement_then_/.test(t) ||
      t==='acknowledging_then_questioning' || t==='acknowledging_then_contrasting'; } },
  { id:'build', label:'Accept it, then build',
    when:'You take what they said and add the next step.',
    test:function(t){ return /^acknowledging_then_/.test(t) || /^agreeing_then_/.test(t) ||
      t==='agreement_then_questioning'; } },
  { id:'strong', label:'Agree, then add',
    when:'Quick agreement commits you — so have the next thing ready.',
    test:function(t){ return /^strong_agreement_then_/.test(t); } },
  { id:'doubt', label:'Not convinced',
    when:'Disagreeing without saying no, and leaving room to answer.',
    test:function(t){ return /^questioning_/.test(t); } },
  { id:'handback', label:'Hand it back',
    when:'Ending on a question is how a discussion stays a discussion.',
    test:function(t){ return /_then_inviting$/.test(t) || /_then_questioning$/.test(t) ||
      t==='inviting'; } }
];
var fnId='pushback', dItems=[], dIx=0, dRun=false, dTmr=null;

function fnItems(id){
  var f=FN.filter(function(x){ return x.id===id; })[0]; if(!f) return [];
  var out=[], sid=D.styles[si].id;
  D.topics.forEach(function(tp){
    var seq=tp.runs[sid]||[];
    seq.forEach(function(t,i){
      if(!t.respond || !t.advance || !f.test(t.tag||'')) return;
      out.push({ topic:tp.tab, ctxWho:(t.who==='me'?tp.them:tp.me),
                 ctx:(i>0?seq[i-1].t:tp.question), t:t });
    });
  });
  return out;
}

function practice(){
  var f=FN.filter(function(x){ return x.id===fnId; })[0];
  dItems=fnItems(fnId); dIx=0; dRun=false;
  $('body').innerHTML=
    '<div class="fn-row">'+FN.map(function(x){
      return '<button class="fn'+(x.id===fnId?' on':'')+'" type="button" data-fn="'+x.id+'">'+
             esc(x.label)+'</button>'; }).join('')+'</div>'+
    '<p class="fn-when">'+esc(f.when)+'</p><div id="dr"></div>';
  drill();
}

function drill(){
  var it=dItems[dIx];
  if(!it){ $('dr').innerHTML='<p class="dr-ctx">No turns tagged for this move yet.</p>'; return; }
  $('dr').innerHTML=
    '<p class="dr-ctx"><b>'+esc(it.ctxWho)+' · '+esc(it.topic)+'</b>'+esc(it.ctx)+'</p>'+
    '<p class="dr-line"><span class="r">'+esc(it.t.respond)+'</span> '+esc(it.t.advance)+'</p>'+
    '<div class="dr-say" id="drSay">listen</div><div class="bar"><i id="drBar"></i></div>'+
    '<div class="dr-foot">'+
      '<button class="arrow" type="button" data-d="-1"'+(dIx<=0?' disabled':'')+' aria-label="Previous">&larr;</button>'+
      '<button class="tool'+(dRun?' on':'')+'" type="button" data-d="go">'+(dRun?'■ stop':'▶ start')+'</button>'+
      '<span class="dr-n">'+(dIx+1)+' / '+dItems.length+'</span>'+
      '<button class="arrow" type="button" data-d="1"'+(dIx>=dItems.length-1?' disabled':'')+' aria-label="Next">&rarr;</button>'+
    '</div>';
}

function drillGo(){
  if(!dRun) return;
  var it=dItems[dIx]; if(!it){ drillStop(); return; }
  /* Paced for a B2 fifteen-year-old reading aloud, not for a synthesiser.
     If they are being cut off, this multiplier is the one number to change. */
  var span=Math.max(2000, String(it.t.t).split(/\s+/).length*460);
  function bar(ms){ var b=$('drBar'); if(!b) return; b.className=''; b.style.width='0';
    void b.offsetWidth; b.className='run'; b.style.transitionDuration=ms+'ms'; b.style.width='100%'; }
  function lab(t,on){ var s=$('drSay'); if(s){ s.textContent=t; s.classList.toggle('now',!!on); } }
  lab('listen',false); bar(span);
  say(it.t.t, true, function(){
    if(!dRun) return;
    lab('your turn — say it',true); bar(span);
    dTmr=setTimeout(function(){
      if(!dRun) return;
      lab('again',true); bar(span);
      dTmr=setTimeout(function(){
        if(!dRun) return;
        if(dIx<dItems.length-1){ dIx++; drill(); drillGo(); } else { dRun=false; drill(); }
      },span);
    },span);
  });
}
function drillStop(){ dRun=false; if(dTmr){ clearTimeout(dTmr); dTmr=null; } }

/* ═══════════════════════════════════════════════════════════════════════
   QUIZ — the turn that does both jobs
   The real turn against the same turn with one half cut off. The sheet
   fills as the discussion you are building reaches each prompt.
   ═══════════════════════════════════════════════════════════════════════ */
var at=0, both=0, halves=0, locked=false;

function options(t){
  var o=[{t:t.t,ok:true},
    {t:t.advance, why:'Your point, but deaf. It moves on without acknowledging what your '+
      'partner just said — which is how two candidates end up giving speeches at each other.'},
    {t:t.respond, why:'Polite, and then nothing. You have agreed and stopped, so your '+
      'partner has to do all the work of restarting.'}];
  for(var i=o.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var x=o[i]; o[i]=o[j]; o[j]=x; }
  return o;
}

function quiz(){
  $('body').innerHTML=
    '<div class="tally"><span class="ty" id="tyB"><b>0</b><span>both jobs</span></span>'+
    '<span class="ty" id="tyH"><b>0</b><span>half-turns</span></span></div>'+
    '<section class="dlg"><div id="talk"></div>'+
    '<div id="round"><p class="ask" id="ask"></p><div class="opts" id="opts"></div>'+
    '<div class="why" id="why"></div></div>'+
    '<div class="res" id="res" style="display:none"><h2 id="resH"></h2><p id="resP"></p>'+
    '<button class="tool on" type="button" data-again="1">Run it again</button></div></section>';
  at=0; both=0; halves=0; step();
}

function step(){
  var seq=run();
  var k=Math.max(0,at-1);
  web({ now: at>0 ? TR.now[k] : [], done: at>0 ? TR.done[k] : [], hub:'off', tap:false });
  $('talk').innerHTML=seq.slice(0,at).map(turnHtml).join('');
  $('tyB').querySelector('b').textContent=both;
  $('tyH').querySelector('b').textContent=halves;
  $('tyH').classList.toggle('weak',halves>both);
  if(at<seq.length && !seq[at].choose){ at++; setTimeout(step,300); return; }
  if(at>=seq.length){ finish(); return; }
  var t=seq[at]; locked=false;
  $('why').classList.remove('show');
  $('ask').textContent = t.last
    ? 'Last exchange. Part 3 ends with a decision — what do you say?'
    : 'Your turn. Which of these does both jobs?';
  $('opts').innerHTML='';
  options(t).forEach(function(o){
    var b=document.createElement('button'); b.className='opt'; b.type='button'; b.textContent=o.t;
    b.addEventListener('click',function(){
      if(locked) return;
      if(o.ok){ locked=true; both++; b.classList.add('is-ok');
        Array.prototype.forEach.call($('opts').children,function(x){ x.disabled=true; });
        setTimeout(function(){ at++; step(); },420);
      } else { halves++; b.classList.add('is-no'); b.disabled=true;
        $('why').textContent=o.why; $('why').classList.add('show');
        $('tyH').querySelector('b').textContent=halves;
        $('tyH').classList.toggle('weak',halves>both); }
    });
    $('opts').appendChild(b);
  });
  var last=$('talk').lastElementChild;
  if(last && last.scrollIntoView) last.scrollIntoView({block:'nearest',behavior:'smooth'});
}

function finish(){
  $('round').style.display='none'; $('res').style.display='';
  if(halves===0){ $('resH').textContent='Every turn did both jobs.';
    $('resP').textContent='You answered your partner and moved the discussion on '+both+
      ' times out of '+both+'. That is what Interactive Communication is marked on.'; }
  else if(halves<=both){ $('resH').textContent='Mostly both.';
    $('resP').textContent=both+' full turns, '+halves+' half-turns. Reaching for your own '+
      'point before answering theirs is the commoner slip, and the more costly.'; }
  else { $('resH').textContent='Half-turns outnumbered full ones.';
    $('resP').textContent='The English was fine every time — that is the point. A correct '+
      'turn still scores badly if it ignores the person you are talking to.'; }
}

/* ═══════════════════════════════════════════════════════════════════════
   TALK — the real thing
   Two minutes to discuss, then the examiner cuts in and you have one more
   to decide — both lengths read from the file. The hub starts the clock.
   Tap a branch when you have talked about it, the way a candidate glances
   down and knows what is left. Nothing is recorded or marked.
   ═══════════════════════════════════════════════════════════════════════ */
/* The clock. Two minutes of discussion, as the student asked for.
   DECIDE is the exam's extra minute after the examiner cuts in; it is 0
   for now. Set it to D.limit_decide||60 to run the full 2 + 1. */
var TALK_SECS=120, DECIDE=0;
var cLeft=0, cTmr=null, cDone=[];

function talk(){
  var A=TALK_SECS, B=DECIDE;
  cLeft=A+B; cDone=[];
  $('body').innerHTML=
    '<div class="clock-row"><span class="clock" id="clk">'+fmt(cLeft)+'</span>'+
    '<span class="phase" id="phase">discuss</span></div>'+
    '<div class="bar"><i id="clkBar" style="width:100%"></i></div>'+
    '<p class="talk-lead" id="lead">Press the centre to start. Talk through the prompts — '+
    'out loud, with whoever is next to you — and tap each one once you have covered it.</p>'+
    '<p class="examiner" id="exr" style="display:none">Now you have a minute to decide '+
    'which is the most important point.</p>'+
    '<div class="model" id="model"><span class="lbl">One way the pair closed it</span>'+
    '<p id="modelP"></p></div>';
  talkWeb();
}

function talkWeb(){
  web({ now:[], done:cDone, hub: cTmr?'stop':'play', tap:true });
}

function fmt(s){ s=Math.max(0,s); return Math.floor(s/60)+':'+(s%60<10?'0':'')+(s%60); }

function clockGo(){
  if(cTmr) return;
  var A=TALK_SECS, B=DECIDE, T=A+B;
  $('lead').style.display='none';
  cTmr=setInterval(function(){
    cLeft--;
    $('clk').textContent=fmt(cLeft);
    $('clk').classList.toggle('low',cLeft<=10);
    $('clkBar').style.width=Math.max(0,cLeft/T*100)+'%';
    /* The examiner cuts in at two minutes, as in the room. */
    if(B && cLeft===B){
      $('phase').textContent='decide'; $('phase').classList.add('dec');
      $('exr').style.display='';
    }
    if(cLeft<=0) clockStop(true);
  },1000);
  talkWeb();
}

function clockStop(reveal){
  if(cTmr){ clearInterval(cTmr); cTmr=null; }
  if(stage!=='talk' || !$('clk')) return;
  talkWeb();
  if(!reveal) return;
  var last=null; run().forEach(function(t){ if(t.last) last=t; });
  if(!last) return;
  $('modelP').innerHTML = last.respond && last.advance
    ? '<span class="r">'+esc(last.respond)+'</span> '+esc(last.advance) : esc(last.t);
  $('model').classList.add('show');
}

/* ═══════════════════════════════════════════════════════════════════════
   THE PHRASE BANK
   The shared corpus first; this file's own bank only as the fallback, so
   there is one source of truth and not two lists drifting apart.
   ═══════════════════════════════════════════════════════════════════════ */
function bank(){
  var G=[];
  if(PH && PH.functions) Object.keys(PH.functions).forEach(function(k){
    var f=PH.functions[k];
    if(f.parts && f.parts.indexOf(3)!==-1)
      G.push({l:f.label,w:f.when,p:f.phrases.map(function(x){ return x.t; })});
  });
  if(!G.length && D.phraseBank) G=D.phraseBank.map(function(g){ return {l:g.heading,w:g.note,p:g.phrases}; });
  $('bankBody').innerHTML = G.length ? G.map(function(g){
    return '<div class="bank-g"><b>'+esc(g.l)+'</b>'+(g.w?'<i>'+esc(g.w)+'</i>':'')+
      '<ul>'+g.p.map(function(p){ return '<li>'+esc(p)+'</li>'; }).join('')+'</ul></div>';
  }).join('') : '<p class="dr-ctx">The phrase bank did not load.</p>';
  $('sheet').classList.add('open'); $('sheetX').focus();
}
function shutBank(){ $('sheet').classList.remove('open'); }

/* ═══════════════════════════════════════════════════════════════════════
   ROUTING
   ═══════════════════════════════════════════════════════════════════════ */
function draw(){
  TR=trace(); qline();
  var showSheet = stage!=='practice';
  $('sheetWrap').style.display = showSheet ? '' : 'none';
  if(stage==='explore') explore();
  else if(stage==='practice') practice();
  else if(stage==='quiz') quiz();
  else talk();
}

function setStage(s){
  stop(); stage=s; pref('stage',s);
  Array.prototype.forEach.call($('stages').children,function(b){
    b.setAttribute('aria-selected',String(b.dataset.s===s)); });
  draw();
}
Array.prototype.forEach.call($('stages').children,function(b){
  b.addEventListener('click',function(){ if(b.dataset.s!==stage) setStage(b.dataset.s); });
});

function hubPress(){
  if(stage==='explore'){ playing?stop():play(); }
  else if(stage==='talk'){ cTmr?clockStop(false):clockGo(); }
}

document.addEventListener('click',function(e){
  var g=e.target.closest('[data-hub],[data-branch]');
  if(g && g.dataset.hub){ hubPress(); return; }
  if(g && g.dataset.branch!==undefined && stage==='talk'){
    var k=+g.dataset.branch, at=cDone.indexOf(k);
    if(at===-1) cDone.push(k); else cDone.splice(at,1);
    talkWeb(); return;
  }
  var t=e.target.closest('button'); if(!t) return;
  if(t.dataset.view){
    var v=t.dataset.view, nv=v==='whole'?'whole':'func', nf=v==='whole'?fp:v;
    if(nv!==view || nf!==fp){
      stop(); view=nv; fp=nf; if(nv==='func') xray=true;
      pref('view',view); pref('fp',fp); explore();
    }
    return;
  }
  if(t.dataset.xray){ xray=!xray; explore(); return; }
  if(t.dataset.style!==undefined){ stop(); si=+t.dataset.style; pref('style',si); draw(); return; }
  if(t.dataset.fn){ drillStop(); fnId=t.dataset.fn; pref('fn',fnId); practice(); return; }
  if(t.dataset.d!==undefined){
    if(t.dataset.d==='go'){ if(dRun){ drillStop(); drill(); } else { dRun=true; drill(); drillGo(); } }
    else { drillStop(); dIx=Math.max(0,Math.min(dItems.length-1,dIx+(+t.dataset.d))); drill(); }
    return;
  }
  if(t.dataset.again){ quiz(); return; }
});

/* The hub and the branches are SVG, so Enter and Space are wired by hand. */
document.addEventListener('keydown',function(e){
  if(e.key==='Escape' && $('sheet').classList.contains('open')){ shutBank(); return; }
  var g=document.activeElement && document.activeElement.closest &&
        document.activeElement.closest('[data-hub],[data-branch]');
  if(g && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); g.dispatchEvent(new MouseEvent('click',{bubbles:true})); return; }
  if(stage==='explore' && view==='func'){
    var ids=FUNCS.map(function(f){ return f.id; }), pos=ids.indexOf(fp);
    if(e.key==='ArrowRight' && pos<ids.length-1){ e.preventDefault(); stop(); fp=ids[pos+1]; pref('fp',fp); explore(); }
    if(e.key==='ArrowLeft' && pos>0){ e.preventDefault(); stop(); fp=ids[pos-1]; pref('fp',fp); explore(); }
  }
});

$('bankBtn').addEventListener('click',bank);
$('sheetX').addEventListener('click',shutBank);
$('sheet').addEventListener('click',function(e){ if(e.target===$('sheet')) shutBank(); });
addEventListener('pagehide',stop);
addEventListener('resize',measure,{passive:true});
addEventListener('scroll',function(){ document.body.classList.toggle('scrolled',scrollY>4); },{passive:true});

Promise.all([
  fetch('data/part3-talk.json').then(function(r){ if(!r.ok) throw new Error('part3-talk.json '+r.status); return r.json(); }),
  fetch('data/speaking-phrases.json').then(function(r){ return r.ok?r.json():null; }).catch(function(){ return null; })
]).then(function(got){
  D=got[0]; PH=got[1];
  var p=new URLSearchParams(location.search);
  var wt=p.get('topic')||pref('topic');
  if(wt) D.topics.forEach(function(t,i){ if(t.id===wt) ti=i; });
  var pv=pref('view'); if(pv==='whole'||pv==='func') view=pv;
  var pfp=pref('fp'); if(pfp && FUNCS.some(function(f){ return f.id===pfp; })) fp=pfp;
  var pf=pref('fn'); if(pf && FN.some(function(f){ return f.id===pf; })) fnId=pf;
  var ps=+pref('style'); if(ps>=0 && ps<D.styles.length) si=ps;
  var ws=p.get('mode')||p.get('stage')||pref('stage');
  ws=({listen:'explore',read:'explore',build:'quiz',bank:'explore'})[ws]||ws;
  stage=['explore','practice','quiz','talk'].indexOf(ws)>-1?ws:'explore';
  Array.prototype.forEach.call($('stages').children,function(b){
    b.setAttribute('aria-selected',String(b.dataset.s===stage)); });
  topics(); draw();
}).catch(function(e){
  $('body').innerHTML='<p class="dr-ctx">data/part3-talk.json did not load ('+esc(e.message)+').</p>';
});
</script>
