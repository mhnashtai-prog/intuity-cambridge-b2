<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F3F1ED">
<title>INTUITY — Speaking Part 3</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;900&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=8">

<style>
/* ═══════════════════════════════════════════════════════════════════════
   SPEAKING PART 3 — TWO JOBS EVERY TURN

   Every turn in the source is tagged <respond>_then_<advance>:
   acknowledging_then_building, partial_agreement_then_disagreement,
   agreeing_then_speculating. That is Part 3 in one line — answer your
   partner AND move the discussion on. A turn that does one is half a turn,
   and Interactive Communication is marked on it.

   FOUR STAGES, the same four the grammar pages use:

     EXPLORE    the discussion. Read it, hear it, see the two jobs.
     PRACTICE   say it after them. Repetition, no judgement.
     QUIZ       choose the turn that does both jobs.
     TALK       sixty seconds, reach a decision.

   Listen and Read are ONE stage, not two: no student listens and then
   separately reads. The text is there and the sound is a tool on it.

   The two views — the whole discussion, or one exchange at a time — are
   the one segmented control, and BOTH carry every tool. Choosing a view is
   about pacing, not about which features you are allowed. The choice is
   remembered, because a preference you must re-pick on every topic is a
   setting you fight with.
   ═══════════════════════════════════════════════════════════════════════ */

:root{ --accent:#DD8E58; --accent-ink:#9A5A2C; --accent-rgb:221,142,88; }

.header{position:sticky;padding-bottom:.5rem}
.header::after{opacity:0;transition:opacity .2s ease;width:100%}
body.scrolled .header::after{opacity:1}
.wrap{max-width:var(--w-read);margin:0 auto;padding:1.1rem var(--gutter) 6rem}

/* The stage row and the view row. Both use .seg from the shell — the one
   filled control in the product. */
.stage-row{display:flex;justify-content:center;padding-top:.9rem;
  border-top:1px solid var(--rule)}
.view-row{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;
  margin:1rem 0 .2rem}

/* ── THE TASK CARD ───────────────────────────────────────────────────────
   In the exam the sheet lies on the table for the whole fifteen minutes,
   and consulting it costs a glance. So it is furniture in every view and
   every stage — never a tooltip, never a thing to summon. Prompts tick as
   the pair cover them. */
.card{border:1px solid var(--rule);border-radius:var(--r-field);
  padding:.9rem 1rem 1rem;background:var(--card-bg,transparent)}
.card h3{font-family:var(--f-mono);font-size:.6rem;font-weight:400;
  letter-spacing:.11em;text-transform:uppercase;color:var(--faint);margin:0 0 .5rem}
.card .qq{font-family:var(--f-display);font-size:.95rem;font-weight:600;
  line-height:1.4;color:var(--ink);margin:0 0 .8rem;
  padding-bottom:.75rem;border-bottom:1px solid var(--rule)}
.card ul{list-style:none;margin:0;padding:0}
.card li{display:flex;align-items:flex-start;gap:.5rem;font-size:.88rem;
  line-height:1.4;color:var(--dim);padding:.34rem 0;transition:color .35s ease}
.card li.done{color:var(--accent-ink)}
.card li i{flex:none;width:13px;height:13px;margin-top:.18rem;border-radius:50%;
  box-shadow:inset 0 0 0 1px var(--rule);position:relative;transition:box-shadow .35s}
.card li.done i{box-shadow:inset 0 0 0 1px var(--accent)}
.card li.done i::after{content:'';position:absolute;left:4px;top:1.5px;width:3px;
  height:6.5px;border:solid var(--accent);border-width:0 1.5px 1.5px 0;
  transform:rotate(42deg)}

/* Card left, content right — in BOTH views. */
.grid{display:grid;grid-template-columns:15rem 1fr;gap:2rem;align-items:start;
  margin-top:1.1rem}
@media(max-width:860px){ .grid{grid-template-columns:1fr;gap:1.2rem} }

/* ── THE TRANSCRIPT ─────────────────────────────────────────────────────
   Two speakers told apart by indent and label. No bubbles: a chat skin
   would be five more objects on a screen holding one conversation. */
.turn{margin-bottom:.95rem}
.turn .who{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--faint);margin-bottom:.2rem}
.turn p{margin:0;font-size:.98rem;line-height:1.6;color:var(--sentence)}
.turn.mine{padding-left:1.1rem;border-left:2px solid var(--accent)}
.turn.mine .who{color:var(--accent-ink)}
.turn.mine p{color:var(--ink)}
.playing .turn{opacity:.32;transition:opacity .3s ease}
.playing .turn.live{opacity:1}

/* X-ray marks the thing Part 3 is graded on, and works in BOTH views. */
.xr-r{box-shadow:inset 0 -2px 0 var(--accent)}
.xr-a{color:var(--accent-ink)}

/* One exchange at a time. Same turns, more room, and the position shown. */
.one{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
  padding:1.2rem 0 .9rem}
.one-top{display:flex;justify-content:space-between;align-items:baseline;
  font-family:var(--f-mono);font-size:.62rem;letter-spacing:.11em;
  text-transform:uppercase;color:var(--faint);margin-bottom:1.2rem}
.one .turn p{font-size:1.15rem;line-height:1.55}
@media(min-width:900px){ .one .turn p{font-size:1.3rem} }
.one-foot{display:flex;align-items:center;justify-content:space-between;
  margin-top:1.3rem;padding-top:.8rem;border-top:1px solid var(--rule)}
.arrow{font-size:1.05rem;line-height:1;color:var(--sentence);background:none;
  border:none;padding:.5rem .7rem;cursor:pointer;border-radius:var(--r-chip)}
.arrow:disabled{color:var(--rule);cursor:default}
@media(hover:hover){ .arrow:hover:not(:disabled){background:var(--tile-bg)} }
.chips{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:1.1rem}
.chips span{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.08em;
  text-transform:uppercase;color:var(--tile-ink);background:var(--tile-bg);
  border-radius:var(--r-chip);padding:.34rem .62rem}

/* ── PRACTICE ────────────────────────────────────────────────────────────
   Shadowing. The line plays, the student says it over the top, twice, and
   moves on. No scoring and no microphone: this is imitation, the rung
   between watching a plane land and flying one.

   Grouped BY FUNCTION, not by topic — eight instances of the same move in
   eight different contexts is how a pattern separates from its content.
   One topic's worth of each move is how it stays invisible. */
.fn-row{display:flex;flex-wrap:wrap;gap:.3rem;margin-bottom:1.2rem}
.fn{font-family:var(--f-display);font-size:.68rem;font-weight:600;
  letter-spacing:.03em;color:var(--dim);background:var(--tile-bg);border:none;
  border-radius:var(--r-chip);padding:.5rem .8rem;cursor:pointer;min-height:36px;
  transition:background .15s,color .15s}
.fn.on{background:var(--ink);color:var(--page-bg,#F3F1ED)}
.dr{border-top:1px solid var(--rule);padding-top:1.4rem}
.dr-ctx{font-size:.95rem;line-height:1.55;color:var(--dim);margin:0 0 1.1rem}
.dr-ctx b{font-family:var(--f-mono);font-size:.6rem;font-weight:400;
  letter-spacing:.11em;text-transform:uppercase;color:var(--faint);
  display:block;margin-bottom:.25rem}
.dr-line{font-size:1.25rem;line-height:1.5;color:var(--ink);margin:0 0 1.3rem;
  padding-left:1.1rem;border-left:2px solid var(--accent)}
@media(min-width:900px){ .dr-line{font-size:1.45rem} }
.dr-line .r{color:var(--accent-ink)}
.dr-say{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.09em;
  text-transform:uppercase;color:var(--faint);margin-bottom:.5rem}
.dr-say.now{color:var(--accent-ink)}
.dr-bar{height:2px;background:var(--rule);border-radius:1px;overflow:hidden}
.dr-bar i{display:block;height:100%;width:0;background:var(--accent)}
.dr-bar i.run{transition:width linear}
.dr-foot{display:flex;align-items:center;justify-content:space-between;
  margin-top:1.4rem;padding-top:.9rem;border-top:1px solid var(--rule)}
.dr-n{font-family:var(--f-mono);font-size:.62rem;color:var(--faint);
  font-variant-numeric:tabular-nums}

/* ── QUIZ ────────────────────────────────────────────────────────────── */
.tally{display:flex;gap:1.6rem;margin-bottom:1.4rem}
.ty{display:flex;align-items:baseline;gap:.4rem}
.ty b{font-family:var(--f-mono);font-size:1.15rem;color:var(--ink);
  font-variant-numeric:tabular-nums;font-weight:400}
.ty span{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.09em;
  text-transform:uppercase;color:var(--faint)}
.ty.weak b{color:var(--wrong)}
.prompt{font-size:.88rem;color:var(--dim);margin-bottom:.75rem}
.opts{display:flex;flex-direction:column;gap:.5rem}
.opt{text-align:left;width:100%;font-size:.94rem;line-height:1.5;
  padding:.85rem 1rem;border:none;border-radius:var(--r-field);
  background:var(--tile-bg);color:var(--tile-ink);cursor:pointer;min-height:44px;
  transition:background .14s,transform .1s cubic-bezier(.2,.8,.2,1)}
@media(hover:hover){ .opt:hover:not(:disabled){background:var(--tile-bg-press)} }
.opt:active:not(:disabled){transform:scale(.99)}
.opt.is-ok{background:var(--tile-ok-bg);color:var(--tile-ok-ink)}
.opt.is-no{background:var(--tile-no-bg);color:var(--tile-no-ink)}
.why{font-size:.84rem;line-height:1.55;color:var(--dim);padding:.7rem 1rem 0;display:none}
.why.show{display:block}
.res{display:none;margin-top:1.6rem}
.res.show{display:block}
.res h2{font-family:var(--f-display);font-size:1.08rem;font-weight:900;
  letter-spacing:var(--track-display);color:var(--ink);margin-bottom:.5rem}
.res p{font-size:.92rem;line-height:1.6;color:var(--sentence);margin-bottom:1rem}
.again{font-family:var(--f-display);font-size:.72rem;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);
  background:none;border:none;padding:.5rem 0;cursor:pointer;min-height:44px}

/* ── TALK ────────────────────────────────────────────────────────────────
   The exam's last minute. Part 3 ends with the pair reaching a decision,
   and pairs routinely run out of discussion before they get there. So:
   the card, a clock, and nothing else on the screen. */
.talk-lead{font-size:.95rem;line-height:1.6;color:var(--sentence);margin:0 0 1.4rem}
.clock{font-family:var(--f-mono);font-size:3.2rem;font-weight:400;color:var(--ink);
  font-variant-numeric:tabular-nums;line-height:1;margin-bottom:.9rem}
.clock.low{color:var(--wrong)}
.clock-bar{height:2px;background:var(--rule);border-radius:1px;overflow:hidden;
  margin-bottom:1.5rem}
.clock-bar i{display:block;height:100%;width:100%;background:var(--accent)}
.model{border-top:1px solid var(--rule);margin-top:1.6rem;padding-top:1.2rem;display:none}
.model.show{display:block}
.model h3{font-family:var(--f-mono);font-size:.6rem;font-weight:400;
  letter-spacing:.11em;text-transform:uppercase;color:var(--faint);margin:0 0 .5rem}
.model p{font-size:1.1rem;line-height:1.55;color:var(--ink);margin:0;
  padding-left:1.1rem;border-left:2px solid var(--accent)}
.model p .r{color:var(--accent-ink)}

/* ── THE PHRASE BANK · a sheet, never a stage ──────────────────────────── */
.bank-btn{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.08em;
  text-transform:uppercase;color:var(--faint);background:none;border:none;
  cursor:pointer;padding:.5rem .55rem;min-height:36px;transition:color .15s}
@media(hover:hover){ .bank-btn:hover{color:var(--accent-ink)} }
#sheet .sheet-card{width:min(43rem,calc(100vw - 2rem));max-width:none;
  align-items:stretch;text-align:left;gap:0}
.sheet-card h2{font-family:var(--f-display);font-size:1.12rem;font-weight:900;
  letter-spacing:var(--track-display);color:var(--ink);margin-bottom:.6rem}
.sheet-card .close-btn{position:absolute;top:.7rem;right:.7rem}
.bank-g{padding:1.1rem 0 .3rem;border-top:1px solid var(--rule)}
.bank-g b{display:block;font-family:var(--f-display);font-size:.9rem;font-weight:700;
  letter-spacing:.05em;text-transform:uppercase;color:var(--ink);margin-bottom:.2rem}
.bank-g i{display:block;font-style:normal;font-size:.92rem;line-height:1.5;
  color:var(--dim);margin-bottom:.4rem}
.bank-g ul{list-style:none;margin:0;padding:0}
.bank-g li{font-size:1rem;line-height:1.4;color:var(--ink);padding:.7rem 0;
  border-bottom:1px solid var(--rule)}
.bank-g li:last-child{border-bottom:none}

@media(prefers-reduced-motion:reduce){
  .dr-bar i.run{transition:none}
}
</style>
</head>
<body>

<header class="header">
  <div class="header-top">
    <a class="back-link" href="/index.html?openModal=speaking" target="_top">← Speaking</a>
    <div class="header-title">
      <div class="app-title">INTUITY</div>
      <div class="app-subtitle">B2 First Speaking</div>
    </div>
    <span class="header-spacer">Level <b>B2</b></span>
  </div>
  <!-- Generated by tools/check-pages.py --fix-nav. -->
<nav class="mode-selector" aria-label="Speaking sections">
  <a class="mode-btn" href="speaking-format.html">Hub</a>
  <a class="mode-btn" href="part1.html">Part 1</a>
  <a class="mode-btn" href="part2-turn.html">Part 2</a>
  <span class="mode-btn active" aria-current="page">Part 3</span>
  <a class="mode-btn" href="part4-views.html">Part 4</a>
  <a class="mode-btn" href="useful-expressions.html">Slides</a>
</nav>
  <div class="set-tabs" id="tabs"></div>
</header>

<main class="wrap">

  <div class="stage-row">
    <div class="seg" id="stages" role="tablist" aria-label="Stage">
      <button type="button" role="tab" data-s="explore" aria-selected="true">Explore</button>
      <button type="button" role="tab" data-s="practice" aria-selected="false">Practice</button>
      <button type="button" role="tab" data-s="quiz" aria-selected="false">Quiz</button>
      <button type="button" role="tab" data-s="talk" aria-selected="false">Talk</button>
    </div>
  </div>

  <div class="view-row" id="viewRow"></div>

  <div class="grid">
    <aside id="card"></aside>
    <div id="main"></div>
  </div>
</main>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="bankH">
  <div class="sheet-card">
    <button class="close-btn" id="sheetX" type="button" aria-label="Close">
      <svg width="15" height="15" viewBox="0 0 15 15" aria-hidden="true">
        <path d="M3 3 L12 12 M12 3 L3 12" stroke="currentColor"
              stroke-width="1.8" stroke-linecap="round" fill="none"/>
      </svg>
    </button>
    <h2 id="bankH">Responding to your partner</h2>
    <div id="bankBody"></div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════════════════════════════════ */
var D=null, PH=null, ti=0, si=0;
var stage='explore', view='full', xray=false, xi=0;
var playing=false, playIx=0, playTimer=null;
var SPEECH=('speechSynthesis' in window);

var $=function(id){ return document.getElementById(id); };
var esc=function(s){ return String(s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };

/* A preference you must re-pick on every topic is a setting you fight
   with. Wrapped, because a school browser may have storage switched off. */
function pref(k,v){
  try{
    if(v===undefined) return localStorage.getItem('intuity.p3.'+k);
    localStorage.setItem('intuity.p3.'+k,v);
  }catch(e){ return null; }
}

function topic(){ return D.topics[ti]; }
function run(){ return topic().runs[D.styles[si].id]; }
function exCount(){ return Math.ceil(run().length/2); }

/* ── WHICH PROMPT ────────────────────────────────────────────────────────
   Inferred: exchange n works prompt n. Wrong more often than it is right —
   in part-time jobs, exchange 2 covers three prompts and exchange 1 covers
   none. The fix is data, not code: a `prompt: [0,2]` array on each turn.
   Every caller goes through here, so it is one edit when that lands. */
function promptOf(ex){ return Math.min(ex, topic().prompts.length-1); }
function covered(upto){
  var a=[]; for(var i=0;i<=promptOf(upto);i++) a.push(i); return a;
}

/* ── THE FUNCTIONS ───────────────────────────────────────────────────────
   Thirty-two tags in the source, which is too many to show a student and
   exactly the right number to group. Grouped by the RESPONDING half —
   what the turn does about the partner — because that is the half students
   drop and the half Part 3 is marked on. */
var FN=[
  { id:'pushback', label:'Agree, then push back',
    when:'You accept their point and keep your own. The most useful move in Part 3.',
    test:function(t){ return /^partial_agreement_then_/.test(t) ||
      t==='acknowledging_then_questioning' || t==='acknowledging_then_contrasting'; } },
  { id:'build', label:'Accept it, then build',
    when:'You take what they said and add the next step to it.',
    test:function(t){ return /^acknowledging_then_/.test(t) || /^agreeing_then_/.test(t) ||
      t==='agreement_then_questioning'; } },
  { id:'strong', label:'Agree hard, then add',
    when:'Quick agreement commits you — so have the next thing ready.',
    test:function(t){ return /^strong_agreement_then_/.test(t); } },
  { id:'doubt', label:'Not convinced',
    when:'Disagreeing without saying no, and leaving them room to answer.',
    test:function(t){ return /^questioning_/.test(t); } },
  { id:'handback', label:'Say your bit, then hand it back',
    when:'Ending on a question is how a discussion stays a discussion.',
    test:function(t){ return /_then_inviting$/.test(t) || /_then_questioning$/.test(t) ||
      t==='inviting'; } }
];
var fnId='pushback';

/* Every model turn in the corpus for one function, across all eight
   topics, each with the partner line that provoked it. Eight instances of
   one move beats one instance in each of eight discussions. */
function fnItems(id){
  var f=null; FN.forEach(function(x){ if(x.id===id) f=x; });
  if(!f) return [];
  var out=[], sid=D.styles[si].id;
  D.topics.forEach(function(tp){
    var seq=tp.runs[sid]||[];
    seq.forEach(function(t,i){
      if(!t.respond || !t.advance) return;
      if(!f.test(t.tag||'')) return;
      out.push({ topic:tp.tab, who:(t.who==='me'?tp.me:tp.them),
                 ctxWho:(t.who==='me'?tp.them:tp.me),
                 ctx:(i>0?seq[i-1].t:tp.question), t:t });
    });
  });
  return out;
}

/* ═══════════════════════════════════════════════════════════════════════
   CHROME
   ═══════════════════════════════════════════════════════════════════════ */
function tabs(){
  $('tabs').innerHTML='';
  D.topics.forEach(function(t,i){
    var b=document.createElement('button');
    b.className='vtab'+(i===ti?' active':''); b.type='button'; b.textContent=t.tab;
    b.addEventListener('click',function(){
      ti=i; xi=0; stop(); tabs(); draw();
    });
    $('tabs').appendChild(b);
  });
}

function seg(items,cur,fn,label){
  var s='<div class="seg" role="tablist" aria-label="'+esc(label)+'">';
  items.forEach(function(it){
    s+='<button type="button" role="tab" data-v="'+it.id+'" aria-selected="'+
       (it.id===cur)+'">'+esc(it.label)+'</button>';
  });
  return s+'</div>';
}

function tool(label,on,attr){
  return '<button class="tool'+(on?' on':'')+'" type="button" '+attr+'>'+
         esc(label)+'</button>';
}

/* The row under the stages: the view choice, then tools, then the bank.
   Both views get every tool — choosing a view is about pacing, not about
   which features you are allowed. */
function viewRow(){
  var V=$('viewRow'); V.innerHTML='';
  if(stage==='explore'){
    V.innerHTML =
      seg([{id:'full',label:'Whole discussion'},{id:'one',label:'One at a time'}],
          view,null,'View') +
      '<div class="tools" style="flex:1;margin:0">' +
        tool(playing?'■ stop':'▶ play', playing, 'data-play="1"') +
        tool('x-ray', xray, 'data-xray="1"') +
        '<span class="tool-n">'+ (xray ? 'responding half underlined · advancing half in colour'
           : (view==='one' ? topic().tab.toLowerCase()+' · '+(xi+1)+' of '+exCount()
                           : topic().them+' and you · '+run().length+' turns')) +
        '</span>' +
      '</div>';
  } else if(stage==='practice'){
    V.innerHTML='<div class="tools" style="flex:1;margin:0">'+
      '<span class="tool-n" style="margin-left:0">say each line out loud, twice</span></div>';
  } else if(stage==='quiz'){
    V.innerHTML='<div class="tools" style="flex:1;margin:0">'+
      '<span class="tool-n" style="margin-left:0">you are '+esc(topic().me)+'</span></div>';
  } else {
    V.innerHTML='<div class="tools" style="flex:1;margin:0">'+
      '<span class="tool-n" style="margin-left:0">'+D.limit_decide+' seconds · reach a decision</span></div>';
  }
  var b=document.createElement('button');
  b.className='bank-btn'; b.type='button'; b.textContent='Phrase bank';
  b.addEventListener('click',bank);
  V.appendChild(b);
}

/* The card, in every stage and every view. */
function cardHtml(upto){
  var t=topic(), hit=covered(upto);
  return '<div class="card">'+
    '<h3>Talk together</h3>'+
    '<p class="qq">'+esc(t.question)+'</p>'+
    '<ul>'+t.prompts.map(function(p,i){
      return '<li class="'+(hit.indexOf(i)!==-1?'done':'')+'">'+
             '<i aria-hidden="true"></i><span>'+esc(p)+'</span></li>';
    }).join('')+'</ul></div>';
}

/* ═══════════════════════════════════════════════════════════════════════
   EXPLORE
   ═══════════════════════════════════════════════════════════════════════ */
function turnHtml(t,i,big){
  var mine=t.who==='me', body;
  if(xray && t.respond && t.advance){
    body='<span class="xr-r">'+esc(t.respond)+'</span> '+
         '<span class="xr-a">'+esc(t.advance)+'</span>';
  } else { body=esc(t.t); }
  return '<div class="turn'+(mine?' mine':'')+'" data-i="'+i+'">'+
    '<div class="who">'+esc(mine?'You ('+topic().me+')':topic().them)+'</div>'+
    '<p>'+body+'</p></div>';
}

function explore(){
  var seq=run();
  if(view==='full'){
    $('main').innerHTML='<div id="talk">'+seq.map(function(t,i){
      return turnHtml(t,i,false); }).join('')+'</div>';
    return;
  }
  var lo=xi*2, pair=seq.slice(lo,lo+2), N=exCount();
  var chips=[topic().tab], two=false;
  pair.forEach(function(t){ if(t.respond&&t.advance) two=true; });
  if(two) chips.push('Respond','Advance');
  if(pair.some(function(t){ return t.last; })) chips.push('The decision');
  $('main').innerHTML='<div class="one" id="talk">'+
    '<div class="one-top"><span>Part 3 · Collaborate</span><span>'+(xi+1)+' / '+N+'</span></div>'+
    pair.map(function(t,j){ return turnHtml(t,lo+j,true); }).join('')+
    '<div class="chips">'+chips.map(function(c){ return '<span>'+esc(c)+'</span>'; }).join('')+'</div>'+
    '<div class="one-foot">'+
      '<button class="arrow" type="button" data-go="'+(xi-1)+'"'+(xi<=0?' disabled':'')+
        ' aria-label="Previous exchange">&larr;</button>'+
      '<div class="dots">'+(function(){ var d='';
        for(var j=0;j<N;j++) d+='<button type="button" data-go="'+j+'"'+
          (j===xi?' class="on"':'')+' aria-label="Exchange '+(j+1)+' of '+N+'"></button>';
        return d; })()+'</div>'+
      '<button class="arrow" type="button" data-go="'+(xi+1)+'"'+(xi>=N-1?' disabled':'')+
        ' aria-label="Next exchange">&rarr;</button>'+
    '</div></div>';
}

/* Sound is a tool on the text, not a separate destination. In the whole
   view it reads down the discussion; in one-at-a-time it reads the
   exchange on screen and stops. */
function play(){
  if(!SPEECH) return;
  var seq=run(), lo=0, hi=seq.length;
  if(view==='one'){ lo=xi*2; hi=Math.min(seq.length,lo+2); }
  playing=true; playIx=lo;
  $('talk').classList.add('playing'); viewRow();
  (function next(){
    if(!playing||playIx>=hi){ stop(); return; }
    var t=seq[playIx];
    Array.prototype.forEach.call($('talk').querySelectorAll('.turn'),function(el){
      el.classList.toggle('live', +el.dataset.i===playIx); });
    var u=new SpeechSynthesisUtterance(t.t);
    u.lang='en-GB'; u.rate=.95; u.pitch = t.who==='me' ? .9 : 1.1;
    var v=voice(t.who==='me'); if(v) u.voice=v;
    var moved=false;
    u.onend=function(){ if(moved)return; moved=true; playIx++; playTimer=setTimeout(next,300); };
    u.onerror=function(){ if(moved)return; moved=true; stop(); };
    speechSynthesis.speak(u);
  })();
}

function stop(){
  playing=false;
  if(playTimer){ clearTimeout(playTimer); playTimer=null; }
  if(SPEECH) speechSynthesis.cancel();
  drillStop();
  clockStop();
  var el=$('talk');
  if(el){ el.classList.remove('playing');
    Array.prototype.forEach.call(el.querySelectorAll('.live'),function(x){
      x.classList.remove('live'); }); }
}

/* ── CHOOSING A VOICE ────────────────────────────────────────────────────
   The old test for a man was /male/i — which matches "female". And iOS
   voice names carry no gender word at all (Serena, Martha, Daniel), so
   every lookup fell through to the first en-GB voice, which on iOS is
   Daniel. Hence matching by NAME against what the platforms ship. */
var VF=/(serena|martha|kate|stephanie|sonia|hazel|susan|libby|maisie|fiona|moira|karen|tessa|samantha|victoria|zira|catherine|amelie|female)/i;
var VM=/(daniel|oliver|arthur|george|ryan|thomas|alex|fred|gordon|\bmale\b|\bman\b)/i;
function voice(isMe){
  var vs=speechSynthesis.getVoices()||[];
  /* Whoever "you" are in this topic keeps one voice; the partner the other. */
  var wantF = (topic().me==='Emma') ? isMe : !isMe;
  var gb=vs.filter(function(v){ return /en[-_]GB/i.test(v.lang); });
  var en=vs.filter(function(v){ return /^en/i.test(v.lang); });
  var yes=wantF?VF:VM, no=wantF?VM:VF;
  function find(l){ return l.filter(function(v){
    return yes.test(v.name) && !no.test(v.name); })[0]; }
  return find(gb)||find(en)||gb.filter(function(v){ return !no.test(v.name); })[0]
      ||gb[0]||en[0]||null;
}

/* ═══════════════════════════════════════════════════════════════════════
   PRACTICE — shadowing
   Hear it, say it, say it again, next. The student's mouth moves from the
   first minute, and nothing judges them for it.
   ═══════════════════════════════════════════════════════════════════════ */
var dItems=[], dIx=0, dRep=0, dRun=false, dTimer=null;

function practice(){
  var f=null; FN.forEach(function(x){ if(x.id===fnId) f=x; });
  dItems=fnItems(fnId);
  $('main').innerHTML=
    '<div class="fn-row">'+FN.map(function(x){
      return '<button class="fn'+(x.id===fnId?' on':'')+'" type="button" data-fn="'+
             x.id+'">'+esc(x.label)+'</button>'; }).join('')+'</div>'+
    (f?'<p class="dr-ctx" style="margin-bottom:1.2rem">'+esc(f.when)+'</p>':'')+
    '<div class="dr" id="dr"></div>';
  dIx=0; dRep=0; dRun=false;
  drill();
}

function drill(){
  var it=dItems[dIx];
  if(!it){ $('dr').innerHTML='<p class="dr-ctx">No turns tagged for this move yet.</p>'; return; }
  var body = it.t.respond && it.t.advance
    ? '<span class="r">'+esc(it.t.respond)+'</span> '+esc(it.t.advance)
    : esc(it.t.t);
  $('dr').innerHTML=
    '<p class="dr-ctx"><b>'+esc(it.ctxWho)+' · '+esc(it.topic)+'</b>'+esc(it.ctx)+'</p>'+
    '<p class="dr-line">'+body+'</p>'+
    '<div class="dr-say" id="drSay">listen</div>'+
    '<div class="dr-bar"><i id="drBar"></i></div>'+
    '<div class="dr-foot">'+
      '<button class="arrow" type="button" data-d="-1"'+(dIx<=0?' disabled':'')+
        ' aria-label="Previous">&larr;</button>'+
      '<button class="tool'+(dRun?' on':'')+'" type="button" data-d="go">'+
        (dRun?'■ stop':'▶ start')+'</button>'+
      '<span class="dr-n">'+(dIx+1)+' / '+dItems.length+'</span>'+
      '<button class="arrow" type="button" data-d="1"'+(dIx>=dItems.length-1?' disabled':'')+
        ' aria-label="Next">&rarr;</button>'+
    '</div>';
}

function drillGo(){
  if(!dRun) return;
  var it=dItems[dIx]; if(!it){ drillStop(); return; }
  var words=String(it.t.t).split(/\s+/).length;
  var span=Math.max(1800, words*420);

  function bar(ms){
    var b=$('drBar'); if(!b) return;
    b.className=''; b.style.width='0';
    void b.offsetWidth;
    b.className='run'; b.style.transitionDuration=ms+'ms'; b.style.width='100%';
  }
  function say(label,on){ var s=$('drSay'); if(s){ s.textContent=label;
    s.classList.toggle('now',!!on); } }

  /* 1 · hear it */
  say('listen',false); bar(span);
  speak(it.t.t, it.t.who==='me', function(){
    if(!dRun) return;
    /* 2 · say it, twice — the bar is the pace, not a score */
    dRep=1; say('your turn — say it',true); bar(span);
    dTimer=setTimeout(function(){
      if(!dRun) return;
      dRep=2; say('again',true); bar(span);
      dTimer=setTimeout(function(){
        if(!dRun) return;
        if(dIx<dItems.length-1){ dIx++; drill(); drillGo(); }
        else { dRun=false; drill(); }
      },span);
    },span);
  });
}

function speak(text,isMe,then){
  var words=String(text).split(/\s+/).length, pause=Math.max(1600,words*380);
  if(!SPEECH){ dTimer=setTimeout(then,pause); return; }
  var u=new SpeechSynthesisUtterance(text);
  u.lang='en-GB'; u.rate=.95; u.pitch=isMe?.9:1.1;
  var v=voice(isMe); if(v) u.voice=v;
  var moved=false;
  u.onend=function(){ if(moved)return; moved=true; then(); };
  u.onerror=function(){ if(moved)return; moved=true; then(); };
  speechSynthesis.speak(u);
  /* iOS drops utterances silently often enough that a watchdog is not
     paranoia: without it the drill stalls on a dead line. */
  dTimer=setTimeout(function(){
    if(moved||speechSynthesis.speaking) return; moved=true; then();
  }, pause+1800);
}

function drillStop(){
  dRun=false;
  if(dTimer){ clearTimeout(dTimer); dTimer=null; }
}

/* ═══════════════════════════════════════════════════════════════════════
   QUIZ — the turn that does both jobs
   Three lines, all from the same turn: the real one, and that same turn
   with one half amputated. Nothing invented, so nothing off-level.
   ═══════════════════════════════════════════════════════════════════════ */
var at=0, both=0, halves=0, locked=false;

function options(t){
  var o=[
    { t:t.t, ok:true },
    { t:t.advance, why:'Your point, but deaf. It moves the discussion on without '+
      'acknowledging what your partner just said — which is how two candidates end '+
      'up giving speeches at each other.' },
    { t:t.respond, why:'Polite, and then nothing. You have agreed and stopped, so '+
      'your partner has to do all the work of restarting.' }
  ];
  for(var i=o.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1));
    var x=o[i]; o[i]=o[j]; o[j]=x; }
  return o;
}

function quiz(){
  $('main').innerHTML=
    '<div class="tally">'+
      '<span class="ty" id="tyB"><b>0</b><span>turns doing both</span></span>'+
      '<span class="ty" id="tyH"><b>0</b><span>half-turns</span></span>'+
    '</div>'+
    '<div id="talk"></div>'+
    '<div id="round"><p class="prompt" id="prompt"></p>'+
      '<div class="opts" id="opts"></div><div class="why" id="why"></div></div>'+
    '<div class="res" id="res"><h2 id="resH"></h2><p id="resP"></p>'+
      '<button class="again" type="button" id="againB">Run it again</button></div>';
  $('againB').addEventListener('click',function(){ at=0;both=0;halves=0;step(); });
  at=0; both=0; halves=0; step();
}

function step(){
  var seq=run();
  $('card').innerHTML=cardHtml(Math.max(0,both-1));
  $('talk').innerHTML=seq.slice(0,at).map(function(t,i){
    return turnHtml(t,i,false); }).join('');
  $('tyB').querySelector('b').textContent=both;
  $('tyH').querySelector('b').textContent=halves;
  $('tyH').classList.toggle('weak',halves>both);
  while(at<seq.length && !seq[at].choose){ at++; setTimeout(step,300); return; }
  if(at>=seq.length){ done(); return; }
  ask(seq[at]);
}

function ask(t){
  locked=false;
  $('round').style.display=''; $('res').classList.remove('show');
  $('why').classList.remove('show'); $('why').textContent='';
  $('prompt').textContent = t.last
    ? 'Last exchange. Part 3 ends with the two of you reaching a decision — what do you say?'
    : 'Your turn. Which of these does both jobs?';
  $('opts').innerHTML='';
  options(t).forEach(function(o){
    var b=document.createElement('button');
    b.className='opt'; b.type='button'; b.textContent=o.t;
    b.addEventListener('click',function(){ pick(b,o); });
    $('opts').appendChild(b);
  });
}

function pick(btn,o){
  if(locked) return;
  if(o.ok){
    locked=true; both++;
    btn.classList.add('is-ok');
    Array.prototype.forEach.call($('opts').children,function(b){ b.disabled=true; });
    setTimeout(function(){ at++; step(); },420);
  } else {
    /* Wrong is not a dead end: name the half they chose, leave the round
       open, and count it. The count is the diagnostic. */
    halves++;
    btn.classList.add('is-no'); btn.disabled=true;
    $('why').textContent=o.why; $('why').classList.add('show');
    $('tyH').querySelector('b').textContent=halves;
    $('tyH').classList.toggle('weak',halves>both);
  }
}

function done(){
  $('round').style.display='none'; $('res').classList.add('show');
  if(halves===0){
    $('resH').textContent='Every turn did both jobs.';
    $('resP').textContent='You answered your partner and moved the discussion on '+
      both+' times out of '+both+'. That is what Interactive Communication is marked on.';
  } else if(halves<=both){
    $('resH').textContent='Mostly both.';
    $('resP').textContent=both+' full turns and '+halves+' half-turns. Reaching for '+
      'your own point before answering theirs is the commoner of the two, and the more costly.';
  } else {
    $('resH').textContent='Half-turns outnumbered full ones.';
    $('resP').textContent=halves+' half-turns against '+both+'. The English was fine '+
      'every time — that is the point. A turn can be perfectly correct and still score '+
      'badly if it ignores the person you are talking to.';
  }
}

/* ═══════════════════════════════════════════════════════════════════════
   TALK — the last minute
   The exam ends with a decision and most pairs never reach one. So: the
   card, a clock, and nothing else. No microphone, no marking — the student
   talks, and afterwards sees one way the model pair closed it.
   ═══════════════════════════════════════════════════════════════════════ */
var cSec=0, cTimer=null;

function talk(){
  cSec=D.limit_decide||60;
  $('main').innerHTML=
    '<p class="talk-lead">Now decide. Look at the card, talk it through out loud — '+
    'on your own or with whoever is next to you — and reach an answer before the '+
    'clock runs out.</p>'+
    '<div class="clock" id="clk">'+fmt(cSec)+'</div>'+
    '<div class="clock-bar"><i id="clkBar"></i></div>'+
    '<button class="tool" type="button" data-talk="go">▶ start</button>'+
    '<div class="model" id="model"><h3>One way they closed it</h3><p id="modelP"></p></div>';
}

function fmt(s){ return '0:'+(s<10?'0':'')+s; }

function clockGo(){
  if(cTimer) return;
  var total=D.limit_decide||60;
  cTimer=setInterval(function(){
    cSec--;
    $('clk').textContent=fmt(Math.max(0,cSec));
    $('clk').classList.toggle('low',cSec<=10);
    $('clkBar').style.width=Math.max(0,(cSec/total)*100)+'%';
    if(cSec<=0) clockStop(true);
  },1000);
}

function clockStop(reveal){
  if(cTimer){ clearInterval(cTimer); cTimer=null; }
  if(!reveal) return;
  var seq=run(), last=null;
  seq.forEach(function(t){ if(t.last) last=t; });
  var m=$('model'); if(!m||!last) return;
  $('modelP').innerHTML = last.respond && last.advance
    ? '<span class="r">'+esc(last.respond)+'</span> '+esc(last.advance)
    : esc(last.t);
  m.classList.add('show');
}

/* ═══════════════════════════════════════════════════════════════════════
   THE PHRASE BANK — a sheet, reachable from every stage, never a stage
   ═══════════════════════════════════════════════════════════════════════ */
function bank(){
  var groups=[];
  if(PH && PH.functions){
    Object.keys(PH.functions).forEach(function(k){
      var f=PH.functions[k];
      if(f.parts && f.parts.indexOf(3)!==-1)
        groups.push({label:f.label,when:f.when,list:f.phrases.map(function(p){ return p.t; })});
    });
  }
  /* The page's own bank is the fallback, not the source. Two lists that
     say the same thing is the drift this project keeps paying for. */
  if(!groups.length && D.phraseBank){
    groups=D.phraseBank.map(function(g){
      return {label:g.heading,when:g.note,list:g.phrases}; });
  }
  $('bankBody').innerHTML = groups.length
    ? groups.map(function(g){
        return '<div class="bank-g"><b>'+esc(g.label)+'</b>'+
          (g.when?'<i>'+esc(g.when)+'</i>':'')+
          '<ul>'+g.list.map(function(p){ return '<li>'+esc(p)+'</li>'; }).join('')+
          '</ul></div>'; }).join('')
    : '<p class="dr-ctx">The phrase bank did not load.</p>';
  $('sheet').classList.add('open');
  $('sheetX').focus();
}
function shutBank(){ $('sheet').classList.remove('open'); }

/* ═══════════════════════════════════════════════════════════════════════
   ROUTING
   ═══════════════════════════════════════════════════════════════════════ */
function draw(){
  viewRow();
  if(stage==='explore'){ $('card').innerHTML=cardHtml(view==='one'?xi:exCount()-1); explore(); }
  else if(stage==='practice'){ $('card').innerHTML=''; practice(); }
  else if(stage==='quiz'){ quiz(); }
  else { $('card').innerHTML=cardHtml(-1); talk(); }
}

function setStage(s){
  stop(); stage=s; pref('stage',s);
  Array.prototype.forEach.call($('stages').children,function(b){
    b.setAttribute('aria-selected', String(b.dataset.s===s)); });
  draw();
}

Array.prototype.forEach.call($('stages').children,function(b){
  b.addEventListener('click',function(){ setStage(b.dataset.s); });
});

/* One delegated listener for everything the stages render. */
document.addEventListener('click',function(e){
  var t=e.target.closest('button'); if(!t) return;

  if(t.dataset.v && stage==='explore'){
    if(t.dataset.v===view) return;
    stop(); view=t.dataset.v; pref('view',view); xi=0; draw(); return;
  }
  if(t.dataset.play){ playing?stop():play(); viewRow(); return; }
  if(t.dataset.xray){ xray=!xray; draw(); return; }
  if(t.dataset.go!==undefined && stage==='explore'){
    var n=+t.dataset.go;
    if(n>=0 && n<exCount()){ stop(); xi=n; draw(); }
    return;
  }
  if(t.dataset.fn){ drillStop(); fnId=t.dataset.fn; pref('fn',fnId); practice(); return; }
  if(t.dataset.d!==undefined){
    if(t.dataset.d==='go'){
      if(dRun){ drillStop(); drill(); }
      else { dRun=true; drill(); drillGo(); }
    } else {
      drillStop(); dIx=Math.max(0,Math.min(dItems.length-1,dIx+(+t.dataset.d))); drill();
    }
    return;
  }
  if(t.dataset.talk){
    if(cTimer){ clockStop(false); t.textContent='▶ start'; t.classList.remove('on'); }
    else { clockGo(); t.textContent='■ stop'; t.classList.add('on'); }
    return;
  }
});

$('sheetX').addEventListener('click',shutBank);
$('sheet').addEventListener('click',function(e){ if(e.target===$('sheet')) shutBank(); });
addEventListener('keydown',function(e){
  if(e.key==='Escape' && $('sheet').classList.contains('open')){ shutBank(); return; }
  if(stage!=='explore' || view!=='one') return;
  if(e.key==='ArrowRight' && xi<exCount()-1){ e.preventDefault(); stop(); xi++; draw(); }
  if(e.key==='ArrowLeft'  && xi>0)          { e.preventDefault(); stop(); xi--; draw(); }
});
addEventListener('pagehide',stop);
addEventListener('scroll',function(){
  document.body.classList.toggle('scrolled',scrollY>4);
},{passive:true});

Promise.all([
  fetch('data/part3-talk.json').then(function(r){
    if(!r.ok) throw new Error('part3-talk.json '+r.status); return r.json(); }),
  fetch('data/speaking-phrases.json').then(function(r){ return r.ok?r.json():null; })
                                     .catch(function(){ return null; })
]).then(function(got){
  D=got[0]; PH=got[1];
  var p=new URLSearchParams(location.search);
  var wt=p.get('topic');
  if(wt) D.topics.forEach(function(t,i){ if(t.id===wt) ti=i; });

  /* Remembered, then overridden by the link if it says otherwise. */
  var pv=pref('view'); if(pv==='full'||pv==='one') view=pv;
  var pf=pref('fn'); if(pf) FN.forEach(function(f){ if(f.id===pf) fnId=pf; });
  if(p.get('view')==='sections'||p.get('view')==='one') view='one';

  var ws=p.get('mode')||p.get('stage')||pref('stage');
  /* Old links said listen / read / build. They meant these. */
  var MAP={listen:'explore',read:'explore',build:'quiz',bank:'explore'};
  ws=MAP[ws]||ws;
  stage=['explore','practice','quiz','talk'].indexOf(ws)>-1 ? ws : 'explore';

  tabs();
  Array.prototype.forEach.call($('stages').children,function(b){
    b.setAttribute('aria-selected', String(b.dataset.s===stage)); });
  draw();
}).catch(function(e){
  $('main').innerHTML='<p class="dr-ctx">data/part3-talk.json did not load ('+
    esc(e.message)+').</p>';
});
</script>
