<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F3F1ED">
<title>INTUITY — Speaking Part 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;900&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=10">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   SPEAKING PART 4 · v3 — A VIEW, DEVELOPED

   Part 1's deck: chapters in the topic row, five questions each, five
   dots. Part 2's card: two turns switched in place — Candidate A's view,
   then Candidate B joining in by name — so the question stays still while
   the speaker changes. The Part 4 move is GENERALISE: Part 1 asks about
   you, Part 4 asks about people.
   ═══════════════════════════════════════════════════════════════════════ */
:root{ --accent:#DD8E58; --accent-ink:#9A5A2C; --accent-rgb:221,142,88;
  --bg:var(--screen,var(--page-bg,#F3F1ED)); }
.header{position:sticky;top:0;z-index:20;background:var(--bg);padding-bottom:.35rem}
.header::after{opacity:0;transition:opacity .2s ease;width:100%}
body.scrolled .header::after{opacity:1}
.wrap{max-width:40rem;margin:0 auto;padding:.8rem var(--gutter,1rem) 3rem}

/* ── CHAPTERS ─────────────────────────────────────────────────────────── */
.topics{display:flex;gap:.1rem;overflow-x:auto;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;padding:0 1rem;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 1rem,#000 calc(100% - 1rem),transparent 100%);
          mask-image:linear-gradient(90deg,transparent 0,#000 1rem,#000 calc(100% - 1rem),transparent 100%)}
.topics::-webkit-scrollbar{display:none}
.topics button{flex:none;scroll-snap-align:center;font-family:var(--f-mono);font-size:.64rem;letter-spacing:.08em;
  text-transform:uppercase;color:var(--faint);background:none;border:none;cursor:pointer;padding:.7rem .6rem;
  position:relative;white-space:nowrap;min-height:40px;transition:color .15s}
.topics button.on{color:var(--ink)}
.topics button.on::after{content:'';position:absolute;left:.6rem;right:.6rem;bottom:.4rem;height:1.5px;background:var(--accent)}
.topics button:disabled{color:var(--rule);cursor:default}
@media(min-width:760px){ .topics{justify-content:center;-webkit-mask-image:none;mask-image:none} }

/* ── STAGE ─────────────────────────────────────────────────────────────── */
.stage-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.6rem;margin:.2rem 0 .9rem}
.stage-row .seg{grid-column:2;justify-self:center}
.stage-row .bank-btn{grid-column:3}
.bank-btn{justify-self:end;font-family:var(--f-mono);font-size:.6rem;letter-spacing:.09em;
  text-transform:uppercase;color:var(--sentence);background:var(--tile-bg);
  border:none;border-radius:999px;cursor:pointer;padding:.5rem .95rem;min-height:28px;white-space:nowrap;
  transition:background .15s,color .15s,transform .1s cubic-bezier(.2,.8,.2,1)}
@media(hover:hover){ .bank-btn:hover{background:var(--tile-bg-press);color:var(--ink)} }
.bank-btn:active{transform:scale(.96)}
@media(max-width:480px){ .stage-row{grid-template-columns:1fr;gap:.5rem}
  .stage-row .seg,.stage-row .bank-btn{grid-column:1;justify-self:center} }

/* ── THE CARD ──────────────────────────────────────────────────────────── */
.card{background:var(--card,#FAF8F5);border-radius:var(--r-card,0);
  box-shadow:0 0 0 1px var(--rule),0 12px 28px -18px rgba(35,44,49,.35);
  padding:1.2rem 1.3rem 1.3rem;touch-action:pan-y;position:relative}
@media(max-width:480px){ .card{padding:1rem 1rem 1.1rem} }
.card.in-next{animation:inNext .32s cubic-bezier(.2,.8,.2,1) both}
.card.in-prev{animation:inPrev .32s cubic-bezier(.2,.8,.2,1) both}
@keyframes inNext{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes inPrev{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.card-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.3rem}
.card-top .lbl{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.11em;text-transform:uppercase;color:var(--faint)}
.count{font-family:var(--f-mono);font-size:.62rem;color:var(--faint);font-variant-numeric:tabular-nums}
.q{font-family:var(--f-display);font-size:1.35rem;font-weight:700;line-height:1.25;color:var(--ink);
  margin:0 0 1rem;letter-spacing:-.01em;text-wrap:balance}
@media(max-width:480px){ .q{font-size:1.18rem} }
.alts{display:flex;justify-content:flex-start;margin-bottom:1rem}
@media(max-width:380px){ .alts .seg.sm button{padding:.36rem .45rem;font-size:.6rem} }

/* the photos */
.photos{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin:0 0 .9rem}
.ph{position:relative;aspect-ratio:4/3;background:var(--sunk,#EDE9E2);overflow:hidden;
  border-radius:var(--r-field,3px);display:flex;flex-direction:column;justify-content:flex-end}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph .n{position:absolute;top:.4rem;left:.4rem;font-family:var(--f-mono);font-size:.58rem;
  background:var(--card,#FAF8F5);color:var(--ink);padding:.1rem .35rem;border-radius:var(--r-field,3px)}
.ph .brief{position:relative;padding:.6rem .6rem .55rem;font-size:.78rem;line-height:1.4;color:var(--dim)}
.ph .brief b{display:block;font-family:var(--f-display);font-size:.8rem;color:var(--ink);margin-bottom:.15rem}
.ph.has-img .brief{display:none}
@media(max-width:420px){ .ph .brief{font-size:.7rem} .ph{aspect-ratio:1/1} }
.credits{font-size:.68rem;line-height:1.45;color:var(--faint);margin:-.55rem 0 .9rem}
.credits:empty{display:none}
.credits a{color:inherit}
.card-ctl{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:space-between;margin-bottom:1rem}
.card-ctl .seg{margin:0}

/* moves + seconds, inside the card */
.moves-row{display:flex;align-items:flex-start;gap:.6rem;margin:0 0 .2rem}
.moves-row .moves{flex:1;min-width:0}
.moves{display:flex;flex-wrap:wrap;gap:.3rem}
.mv{font-family:var(--f-display);font-size:.7rem;font-weight:600;color:var(--dim);background:none;
  border:1px solid var(--rule);border-radius:var(--r-chip,4px);padding:.3rem .6rem;cursor:default;
  transition:color .2s,border-color .2s,opacity .2s}
button.mv{cursor:pointer}
.mv.now{color:var(--ink);border-color:var(--ink)}
.mv.done{color:var(--accent-ink);border-color:var(--accent)}
.mv .tick{color:var(--accent);margin-left:.25rem}
.mv.off{border-style:dashed;color:var(--faint);opacity:.5}
.playhub{flex:none;width:40px;height:40px;border-radius:var(--r-chip,4px);border:none;background:var(--ink);
  color:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}
.playhub::before{content:'';display:block;width:0;height:0;border-style:solid;
  border-width:7px 0 7px 11px;border-color:transparent transparent transparent currentColor;margin-left:3px}
.playhub.stop::before{width:11px;height:11px;border:none;background:currentColor;margin:0}
.playhub.off{background:var(--rule);cursor:default}
@media(hover:hover){ .playhub:not(.off):hover{background:var(--accent-ink)} }
.playhub:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tl{position:relative;margin:.7rem 0 0}
.tl-track{position:relative;height:6px;background:var(--rule)}
.tl-seg{position:absolute;top:0;height:100%;background:var(--accent);transition:left .3s,width .3s}
.tl-seg.p0{opacity:.35}.tl-seg.p1{opacity:.5}.tl-seg.p2{opacity:.65}.tl-seg.p3{opacity:.82}.tl-seg.p4{opacity:1}
.tl-seg+.tl-seg{box-shadow:inset 1px 0 0 var(--card,#FAF8F5)}
.tl-seg.over{background:var(--wrong);opacity:.55}
.tl-band{position:absolute;top:-3px;bottom:-3px;background:var(--ink);opacity:.08}
.tl-limit{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.tl-head{position:absolute;top:-4px;width:2px;height:14px;background:var(--ink);
  transition-property:left;transition-timing-function:linear;display:none}
.tl-head.on{display:block}
.tl-row{display:flex;justify-content:space-between;align-items:baseline;gap:.8rem;margin-top:.45rem;
  font-family:var(--f-mono);font-size:.6rem;color:var(--faint);font-variant-numeric:tabular-nums}
.tl-row .hot{color:var(--wrong)} .tl-row .ink{color:var(--ink)}

/* the answer */
.answer{font-size:1.14rem;line-height:1.7;color:var(--ink);margin:1.1rem 0 0;padding-left:1rem;
  border-left:2px solid var(--accent)}
.sg{transition:opacity .3s}
/* The minute, one move per line: the shape is visible before a word is read. */
/* Candidate B's turn sits in the rule colour: a second, shorter voice. */
.answer.partner{border-left-color:var(--rule)}
.playing .sg{opacity:.3} .playing .sg.live{opacity:1}
/* X-RAY · the coursebook convention: key expressions in one colour, nothing
   else changes. Off, the answer reads as plain speech. */
.xr{transition:color .2s}
.card.xray .xr{color:var(--accent-ink);font-weight:600}
/* Cover: the chunk keeps its width, loses its ink. Tap to bring it back. */
.gap{font:inherit;line-height:inherit;display:inline;min-height:0;height:auto;vertical-align:baseline;color:transparent;background:var(--sunk,#EDE9E2);border:none;padding:0 .1em;margin:0;
  cursor:pointer;box-shadow:inset 0 -2px 0 var(--accent);border-radius:var(--r-field,3px)}
.gap:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.card-tools{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin:.5rem 0 0}
.card-tools .tool{padding-left:0}

/* the frame */
.frame{margin:1.2rem 0 0;padding-top:.9rem;border-top:1px solid var(--rule)}
.frame h3{font-family:var(--f-display);font-size:.8rem;font-weight:700;color:var(--ink);margin:0 0 .35rem}
.frame p{font-size:1rem;line-height:1.75;color:var(--sentence);margin:0}
.blank{display:inline-block;width:2.6em;height:1em;vertical-align:-.15em;
  border-bottom:1.5px solid var(--faint);margin:0 .12em}
.frame .why-shape{font-size:.88rem;line-height:1.55;color:var(--dim);margin:.8rem 0 0;padding-left:.8rem;border-left:2px solid var(--rule)}

/* deck navigation */
.deck-nav{display:flex;align-items:center;justify-content:space-between;margin-top:.8rem}
.arrow{font-size:1.1rem;line-height:1;color:var(--sentence);background:none;border:none;
  padding:.6rem .8rem;cursor:pointer;min-height:44px;min-width:44px;border-radius:var(--r-chip,4px)}
.arrow:disabled{color:var(--rule);cursor:default}
.dots button{width:30px;height:30px}
.dots button::after{width:7px;height:7px}

/* practice · quiz · talk inside the card */
.dr-ctx{font-size:.95rem;line-height:1.55;color:var(--dim);margin:1rem 0 .6rem}
.dr-ctx b{display:block;font-family:var(--f-mono);font-size:.6rem;font-weight:400;letter-spacing:.11em;
  text-transform:uppercase;color:var(--faint);margin-bottom:.25rem}
.dr-line{font-size:1.2rem;line-height:1.5;color:var(--ink);margin:0 0 1.1rem;padding-left:1rem;border-left:2px solid var(--accent)}
.dr-line .xr{box-shadow:none;color:var(--accent-ink);font-weight:700}
.dr-say{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin-bottom:.45rem}
.dr-say.now{color:var(--accent-ink)}
.bar{height:2px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
.bar i.run{transition:width linear}
.dr-foot{display:flex;align-items:center;justify-content:space-between;margin-top:.9rem}
.dr-n{font-family:var(--f-mono);font-size:.62rem;color:var(--faint);font-variant-numeric:tabular-nums}
.build{font-size:1.06rem;line-height:1.75;color:var(--sentence);min-height:3.4em;margin:1rem 0 1rem}
.aseg.new{animation:segIn .36s cubic-bezier(.2,.8,.2,1) both}
@keyframes segIn{from{opacity:0}to{opacity:1}}
.build.shift .aseg:not(.new){display:inline-block;animation:shiftIn .36s cubic-bezier(.2,.8,.2,1) both}
@keyframes shiftIn{from{transform:translateX(-10px)}to{transform:none}}
.ask{font-size:.9rem;color:var(--dim);margin:0 0 .7rem}
.opts{display:flex;flex-direction:column;gap:.5rem}
.opt{text-align:left;width:100%;font-size:.95rem;line-height:1.5;padding:.8rem 1rem;border:none;
  border-radius:var(--r-field,3px);background:var(--tile-bg);color:var(--tile-ink);cursor:pointer;min-height:48px;
  transition:background .14s,transform .1s cubic-bezier(.2,.8,.2,1)}
.opt:active:not(:disabled){transform:scale(.99)}
.opt.is-ok{background:var(--tile-ok-bg);color:var(--tile-ok-ink)}
.opt.is-no{background:var(--tile-no-bg);color:var(--tile-no-ink)}
.why{font-size:.86rem;line-height:1.55;color:var(--dim);padding:.7rem .2rem 0;display:none}
.why.show{display:block}
.res h2{font-family:var(--f-display);font-size:1.05rem;font-weight:900;color:var(--ink);margin:0 0 .4rem}
.res p{font-size:.94rem;line-height:1.6;color:var(--sentence);margin:0 0 .6rem}
.clock{font-family:var(--f-mono);font-size:2.4rem;color:var(--ink);line-height:1;text-align:center;
  font-variant-numeric:tabular-nums;margin:1.2rem 0 .2rem}
.clock.low{color:var(--wrong)}
.talk-lead{font-size:.95rem;line-height:1.6;color:var(--sentence);margin:1rem 0 0}
.reveal{display:none}.reveal.show{display:block}

/* phrase bank */
#sheet .sheet-card{width:min(40rem,calc(100vw - 1.5rem));max-width:none;align-items:stretch;text-align:left;gap:0;
  max-height:88vh;overflow-y:auto}
.sheet-card h2{font-family:var(--f-display);font-size:1.1rem;font-weight:900;color:var(--ink);margin-bottom:.5rem}
.sheet-card .close-btn{position:absolute;top:.7rem;right:.7rem}
.bank-g{padding:1rem 0 .2rem;border-top:1px solid var(--rule)}
.bank-g b{display:block;font-family:var(--f-display);font-size:.9rem;font-weight:700;color:var(--ink);margin-bottom:.2rem}
.bank-g i{display:block;font-style:normal;font-size:.9rem;line-height:1.5;color:var(--dim);margin-bottom:.3rem}
.bank-g ul{list-style:none;margin:0;padding:0}
.bank-g li{font-size:1rem;color:var(--ink);padding:.6rem 0;border-bottom:1px solid var(--rule)}
.bank-g li:last-child{border-bottom:none}
.vh{position:absolute;left:-9999px}

@media(prefers-reduced-motion:reduce){
  .card.in-next,.card.in-prev,.aseg.new,.build.shift .aseg{animation:none}
  .bar i.run,.tl-head{transition:none!important}
}
</style>
</head>
<body>

<header class="header" id="hdr">
  <div class="header-top">
    <a class="back-link" href="/index.html?openModal=speaking" target="_top">← Speaking</a>
    <div class="header-title">
      <div class="app-title">INTUITY</div>
      <div class="app-subtitle">Speaking · Part 4</div>
    </div>
    <span class="header-spacer">Level <b>B2</b></span>
  </div>
  <!-- tools/check-pages.py --fix-nav regenerates this row. -->
  <nav class="mode-selector" aria-label="Speaking sections">
    <a class="mode-btn" href="speaking-format.html">Hub</a>
    <a class="mode-btn" href="part1.html">Part 1</a>
    <a class="mode-btn" href="part2-turn.html">Part 2</a>
    <a class="mode-btn" href="part3-talk.html">Part 3</a>
    <span class="mode-btn active" aria-current="page">Part 4</span>
  </nav>
  <div class="topics" id="topics" role="tablist" aria-label="Topic"></div>
</header>

<main class="wrap">
  <div class="stage-row">
    <div class="seg" id="stages" role="tablist" aria-label="Stage">
      <button type="button" role="tab" data-s="explore" aria-selected="true">Explore</button>
      <button type="button" role="tab" data-s="practice" aria-selected="false">Practice</button>
      <button type="button" role="tab" data-s="quiz" aria-selected="false">Quiz</button>
      <button type="button" role="tab" data-s="talk" aria-selected="false">Talk</button>
    </div>
    <button class="bank-btn" type="button" id="bankBtn">Phrase bank</button>
  </div>

  <article class="card" id="card" aria-live="polite">
    <div class="card-top"><span class="lbl">Examiner</span><span class="count" id="count"></span></div>
    <h2 class="q" id="q"></h2>
    <div class="card-ctl"><div id="modes"></div><div id="alts"></div></div>
    <div class="moves-row">
      <button class="playhub" id="playHub" type="button" aria-label="Play"></button>
      <div class="moves" id="moves" role="group" aria-label="The shape of this answer"></div>
    </div>
    <div class="tl" id="tl"></div>
    <div id="body"></div>
  </article>

  <nav class="deck-nav" aria-label="Questions in this chapter">
    <button class="arrow" id="prev" type="button" aria-label="Previous question">&larr;</button>
    <div class="dots" id="dots"></div>
    <button class="arrow" id="next" type="button" aria-label="Next question">&rarr;</button>
  </nav>
</main>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="bankH">
  <div class="sheet-card">
    <button class="close-btn" id="sheetX" type="button" aria-label="Close">
      <svg width="15" height="15" viewBox="0 0 15 15" aria-hidden="true"><path d="M3 3 L12 12 M12 3 L3 12"
        stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
    </button>
    <h2 id="bankH">Giving and developing a view</h2>
    <div id="bankBody"></div>
  </div>
</div>

<script>
/* ═══ HELPERS ══════════════════════════════════════════════════════════ */
var $=function(id){ return document.getElementById(id); };
var esc=function(s){ return String(s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
var SPEECH=('speechSynthesis' in window), tmr=null;
var RM=matchMedia('(prefers-reduced-motion:reduce)');
var PFX='intuity.p4.', D=null, ORDER=['x','a','g','r','e','c'], LIM=35, BAND=[20,30];
function pref(k,v){ try{ if(v===undefined) return localStorage.getItem(PFX+k); localStorage.setItem(PFX+k,v); }catch(e){ return null; } }
function secs(t){ return Math.round(String(t).split(/\s+/).filter(function(x){ return /[A-Za-z0-9]/.test(x); }).length/2.5); }
function seg(items,cur,attr,cls){
  return '<div class="seg'+(cls?' '+cls:'')+'" role="tablist">'+items.map(function(it){
    return '<button type="button" role="tab" '+attr+'="'+it.id+'" aria-selected="'+(it.id===cur)+'">'+esc(it.label)+'</button>'; }).join('')+'</div>';
}
/* Chunks in the accent, longest first. With cover on, each chunk becomes a
   tappable gap that keeps its width — the sentence keeps its shape. */
var revealed={};
function mk(t,marks,cover,key){
  var s=esc(t), n=0;
  (marks||[]).slice().sort(function(a,b){ return b.length-a.length; }).forEach(function(m){
    var e=esc(m).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    s=s.replace(new RegExp('(?![^<]*>)('+e+')'),function(x){
      var id=key+'-'+(n++);
      return (cover && !revealed[id])
        ? '<button type="button" class="gap" data-gap="'+id+'" aria-label="Hidden chunk — tap to show">'+x+'</button>'
        : '<span class="xr">'+x+'</span>'; });
  });
  return s;
}
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

/* ═══ STATE ════════════════════════════════════════════════════════════ */
var xray=false, ci=0, qi=0, ai=0, mode='turn', stage='explore', cover=false, playing=false, PI=null;
function chapter(){ return D.chapters[ci]; }
function card(){ return chapter().cards[qi]; }
function ready(ch){ return ch.cards.every(function(c){ return c.alts && c.alts.length; }); }
function ans(){ return card().alts[ai][mode]; }
function qText(){ return mode==='turn'?card().question:ans().handover; }
function setMode(){ var M=D.modes[mode]; ORDER=M.order; LIM=M.limit; BAND=M.band; }
function segs(){ return ans().segs; }
function shapeOf(ss){ return ss.map(function(s){ return s.m; }); }
function names(ms){ return ms.map(function(m){ return D.moves[m].name.toLowerCase(); }).join(' · '); }
function mi(m){ return ORDER.indexOf(m); }
function total(ss){ return ss.reduce(function(a,s){ return a+secs(s.t); },0); }
function readout(t){ return t>LIM?'<span class="hot">'+t+'s · over the '+(mode==='turn'?'35 seconds':'15 seconds')+'</span>':t>=BAND[0]?'<span class="ink">'+t+'s · about right</span>':'<span class="ink">'+t+'s</span> · aim for '+BAND[0]+'–'+BAND[1]; }
function items(ss){ return ss.map(function(s){ return {phase:mi(s.m), s:secs(s.t)}; }); }
function voiceOf(){ return D.voices[ai]; }

/* ═══ THE CHROME: chapters, card head, dots ════════════════════════════ */
function chapters(){
  var T=$('topics'); T.innerHTML='';
  D.chapters.forEach(function(ch,i){
    var b=document.createElement('button'); b.type='button'; b.textContent=ch.tab; b.setAttribute('role','tab');
    b.className=i===ci?'on':''; b.setAttribute('aria-selected',String(i===ci));
    b.addEventListener('click',function(){ if(i!==ci) go(i,0,i>ci?1:-1); });
    T.appendChild(b);
  });
  var on=T.querySelector('.on'); if(on&&on.scrollIntoView) on.scrollIntoView({inline:'center',block:'nearest'});
}
function head(){
  $('count').textContent=chapter().tab+' · '+(qi+1)+' / '+chapter().cards.length;
  document.querySelector('.card-top .lbl').textContent=mode==='turn'?'Examiner, to '+voiceOf().a:'Then, to '+voiceOf().b;
  $('q').textContent=qText();
  var MK=Object.keys(D.modes);   /* one task on the card? no switch to show */
  $('modes').innerHTML=MK.length>1?seg(MK.map(function(k){ return {id:k,label:D.modes[k].label}; }),mode,'data-mode','sm'):'';
  $('alts').innerHTML=seg(D.voices.map(function(v,i){ return {id:String(i),label:v.tab}; }),String(ai),'data-alt','sm');
  var n=chapter().cards.length, d='';
  for(var j=0;j<n;j++) d+='<button type="button" data-dot="'+j+'"'+(j===qi?' class="on" aria-current="true"':'')+
    ' aria-label="Question '+(j+1)+': '+esc(chapter().cards[j].question)+'"></button>';
  $('dots').innerHTML=d;
  $('prev').disabled=!neighbour(-1); $('next').disabled=!neighbour(1);
}
/* Past the fifth card, the next ready chapter begins. */
function neighbour(dir){
  var c=ci, q=qi+dir;
  while(c>=0 && c<D.chapters.length){
    var ch=D.chapters[c];
    if(ready(ch) && q>=0 && q<ch.cards.length) return [c,q];
    c+=dir; if(c<0||c>=D.chapters.length) return null;
    q=dir>0?0:D.chapters[c].cards.length-1;
  }
  return null;
}
function go(c,q,dir){
  stop(); var chg=c!==ci; ci=c; qi=q; revealed={};
  pref('topic',chapter().id); pref('q',String(qi));
  chapters();
  draw();
  var el=$('card'); el.classList.remove('in-next','in-prev'); void el.offsetWidth;
  if(dir && !RM.matches) el.classList.add(dir>0?'in-next':'in-prev');
}
function step(dir){ var n=neighbour(dir); if(n) go(n[0],n[1],dir); }

/* ═══ SHAPE STRIP ══════════════════════════════════════════════════════ */
function renderMoves(use,now,done,tap){
  $('moves').innerHTML=ORDER.map(function(k){
    var off=use.indexOf(k)===-1, isDone=done.indexOf(k)!==-1, l=D.moves[k].name;
    var cls='mv'+(off?' off':'')+(now.indexOf(k)!==-1?' now':'')+(isDone?' done':'');
    var tick=isDone?' <span class="tick">&check;</span>':'';
    return tap ? '<button type="button" class="'+cls+'" data-branch="'+k+'" aria-pressed="'+isDone+'">'+esc(l)+tick+'</button>'
      : '<span class="'+cls+'">'+esc(l)+tick+(off?'<span class="vh"> (not used)</span>':'')+'</span>';
  }).join('');
}
function setHub(state){
  var h=$('playHub'); h.className='playhub'+(state==='off'?' off':'')+(state==='stop'?' stop':'');
  h.disabled=state==='off'; h.setAttribute('aria-label',state==='stop'?'Stop':'Play');
}
function timeline(its,opts){
  opts=opts||{};
  var L=opts.limit||0, tot=its.reduce(function(a,x){ return a+x.s; },0);
  var sc=Math.max(opts.scale||0,L,tot,1), pc=function(v){ return (v/sc*100).toFixed(2)+'%'; };
  var h='<div class="tl-track">', t=0;
  if(opts.band) h+='<i class="tl-band" style="left:'+pc(opts.band[0])+';width:'+pc(opts.band[1]-opts.band[0])+'"></i>';
  its.forEach(function(x){ var a=t,b=t+x.s,cls='tl-seg p'+Math.max(0,Math.min(4,x.phase));
    if(L&&b>L){ if(a<L) h+='<i class="'+cls+'" style="left:'+pc(a)+';width:'+pc(L-a)+'"></i>';
      var s0=Math.max(a,L); h+='<i class="tl-seg over" style="left:'+pc(s0)+';width:'+pc(b-s0)+'"></i>'; }
    else h+='<i class="'+cls+'" style="left:'+pc(a)+';width:'+pc(b-a)+'"></i>'; t=b; });
  if(L) h+='<i class="tl-limit" style="left:calc('+pc(L)+' - 1px)"></i>';
  h+='<i class="tl-head" id="tlHead"></i></div><div class="tl-row"><span>'+(opts.left||'')+'</span><span>'+(opts.right||'')+'</span></div>';
  $('tl').innerHTML=h; $('tl').dataset.scale=sc;
}
function playhead(from,to,ms){
  var el=$('tlHead'); if(!el) return; var sc=+$('tl').dataset.scale||1;
  el.classList.add('on'); el.style.transitionDuration='0ms'; el.style.left=(from/sc*100)+'%'; void el.offsetWidth;
  el.style.transitionDuration=ms+'ms'; el.style.left=(to/sc*100)+'%';
}
function strip(){ // the default strip: this answer's shape and seconds
  var ss=segs(), use=shapeOf(ss), now=[], done=use.slice();
  if(playing&&PI){ if(PI.q) done=[]; else { now=[PI.s.m]; done=shapeOf(ss.slice(0,PI.j)); } }
  renderMoves(use,now,done,false);
  timeline(items(ss),{limit:LIM,band:BAND,left:names(use),right:readout(total(ss))});
  if(playing&&PI&&!PI.q){ var st=total(ss.slice(0,PI.j)); playhead(st,st+secs(PI.s.t),secs(PI.s.t)*1000); }
}

/* ═══ VOICE ════════════════════════════════════════════════════════════ */
var VF=/(serena|martha|kate|stephanie|sonia|hazel|susan|libby|maisie|fiona|moira|karen|tessa|samantha|victoria|zira|catherine|amelie|female)/i;
var VM=/(daniel|oliver|arthur|george|ryan|thomas|alex|fred|gordon|\bmale\b|\bman\b)/i;
function voice(fem){
  var vs=speechSynthesis.getVoices()||[];
  var gb=vs.filter(function(v){ return /en[-_]GB/i.test(v.lang); }), en=vs.filter(function(v){ return /^en/i.test(v.lang); });
  var yes=fem?VF:VM, no=fem?VM:VF;
  function f(l){ return l.filter(function(v){ return yes.test(v.name)&&!no.test(v.name); })[0]; }
  return f(gb)||f(en)||gb.filter(function(v){ return !no.test(v.name); })[0]||gb[0]||en[0]||null;
}
function say(text,fem,pitch,then,rate){
  var n=String(text).split(/\s+/).length, pause=Math.max(1400,n*380), moved=false;
  function done(){ if(moved) return; moved=true; if(then) then(); }
  if(!SPEECH){ tmr=setTimeout(done,pause); return; }
  var u=new SpeechSynthesisUtterance(text); u.lang='en-GB'; u.rate=rate||.93; u.pitch=pitch||1;
  var v=voice(fem); if(v) u.voice=v; u.onend=done; u.onerror=done;
  speechSynthesis.speak(u);
  tmr=setTimeout(function(){ if(!speechSynthesis.speaking) done(); }, pause+1800);
}
function hush(){ if(tmr){ clearTimeout(tmr); tmr=null; } if(SPEECH) speechSynthesis.cancel(); }
function studentSay(t,then){ var v=voiceOf(), f=(mode==='partner'?v.bFem:v.fem)!==false; say(t,f,f?1.12:1.04,then,.98); }
function examinerSay(t,then){ say(t,false,.9,then); }

/* ═══ EXPLORE — read it, hear it, see its frame ════════════════════════ */
function explore(){
  var a=ans();
  $('body').innerHTML=
    '<p class="answer'+(mode==='partner'?' partner':'')+'" id="ansP">'+a.segs.map(function(s,j){
      return '<span class="sg" data-j="'+j+'">'+mk(s.t,s.marks,cover,ai+'-'+j)+'</span>'; }).join(' ')+'</p>'+
    '<div class="card-tools"><span><button class="tool'+(xray?' on':'')+'" type="button" data-xray="1" aria-pressed="'+xray+'">X-ray</button> '+
      '<button class="tool'+(cover?' on':'')+'" type="button" data-cover="1" aria-pressed="'+cover+'">'+
      (cover?'Show the chunks':'Cover the chunks')+'</button></span>'+
      (cover?'<span class="count">tap a gap to check it</span>':'')+'</div>'+
    '<div class="frame"><h3>The pattern</h3><p>'+esc(a.frame).replace(/_{3,}/g,'<span class="blank" aria-label="blank"></span>').replace(/\n/g,'<br><br>')+'</p>'+
    (a.why?'<p class="why-shape">'+esc(a.why)+'</p>':'')+'</div>';
  setHub(SPEECH?(playing?'stop':'play'):'off');
  strip();
}
function play(){
  if(!SPEECH) return;
  var Q=[{q:true}].concat(segs().map(function(s,j){ return {j:j,s:s}; })), i=0;
  playing=true; $('ansP').classList.add('playing');
  (function next(){
    if(!playing||i>=Q.length){ stop(); return; }
    PI=Q[i];
    Array.prototype.forEach.call($('ansP').querySelectorAll('.live'),function(x){ x.classList.remove('live'); });
    if(!PI.q){ var el=$('ansP').querySelector('.sg[data-j="'+PI.j+'"]'); if(el) el.classList.add('live'); }
    setHub('stop'); strip();
    var done=function(){ i++; tmr=setTimeout(next,PI.q?380:90); };
    if(PI.q) examinerSay(qText(),done); else studentSay(PI.s.t,done);
  })();
}
function stop(){
  playing=false; PI=null; hush(); drillStop(); clockStop(false);
  var p=$('ansP'); if(p){ p.classList.remove('playing');
    Array.prototype.forEach.call(p.querySelectorAll('.live'),function(x){ x.classList.remove('live'); }); }
  if(D && stage==='explore'){ setHub(SPEECH?'play':'off'); strip(); }
}

/* ═══ PRACTICE — shadow it, one move at a time ═════════════════════════ */
var dIx=0, dRun=false, dTmr=null;
function practice(){ dIx=0; dRun=false; drill(); }
function drill(){
  var ss=segs(), s=ss[dIx];
  renderMoves(shapeOf(ss),[s.m],shapeOf(ss.slice(0,dIx)),false);
  timeline(items(ss.slice(0,dIx+1)),{limit:LIM,band:BAND,scale:LIM,left:D.moves[s.m].name+' — '+D.moves[s.m].hint,right:''});
  setHub(dRun?'stop':'play');
  $('body').innerHTML=(dIx?'<p class="dr-ctx"><b>so far</b>'+esc(ss.slice(0,dIx).map(function(x){ return x.t; }).join(' '))+'</p>':'<p class="dr-ctx"></p>')+
    '<p class="dr-line">'+mk(s.t,s.marks,false,'d')+'</p>'+
    '<div class="dr-say" id="drSay">'+(dRun?'listen':'press play, then say it after them')+'</div><div class="bar"><i id="drBar"></i></div>'+
    '<div class="dr-foot"><button class="arrow" type="button" data-d="-1"'+(dIx<=0?' disabled':'')+' aria-label="Previous line">&larr;</button>'+
    '<span class="dr-n">line '+(dIx+1)+' of '+ss.length+'</span>'+
    '<button class="arrow" type="button" data-d="1"'+(dIx>=ss.length-1?' disabled':'')+' aria-label="Next line">&rarr;</button></div>';
}
function drillGo(){
  if(!dRun) return;
  var s=segs()[dIx], span=Math.max(2000,s.t.split(/\s+/).length*460);
  function bar(ms){ var b=$('drBar'); if(!b) return; b.className=''; b.style.width='0'; void b.offsetWidth;
    b.className='run'; b.style.transitionDuration=ms+'ms'; b.style.width='100%'; }
  function lab(t,on){ var x=$('drSay'); if(x){ x.textContent=t; x.classList.toggle('now',!!on); } }
  lab('listen',false); bar(span);
  studentSay(s.t,function(){
    if(!dRun) return; lab('your turn — say it',true); bar(span);
    dTmr=setTimeout(function(){ if(!dRun) return; lab('again, without looking',true); bar(span);
      dTmr=setTimeout(function(){ if(!dRun) return;
        if(dIx<segs().length-1){ dIx++; drill(); drillGo(); } else { dRun=false; drill(); } },span); },span);
  });
}
function drillStop(){ dRun=false; if(dTmr){ clearTimeout(dTmr); dTmr=null; } }

/* ═══ QUIZ — build it back ═════════════════════════════════════════════ */
var qStep=0, plan=[], locked=false;
function quiz(){ var ms=shapeOf(segs());
  plan=ms.indexOf('a')>-1?['a'].concat(ms.indexOf('x')>-1?['x']:[],ms.filter(function(m){ return m!=='a'&&m!=='x'; })):ms.slice();
  qStep=0; qDraw(false,false); }
function level(k){ var inc=plan.slice(0,k+1); return segs().filter(function(s){ return inc.indexOf(s.m)>-1; }); }
function qDraw(fresh,front){
  var ss=level(qStep), m=plan[qStep+1], r=m?segs().filter(function(s){ return s.m===m; })[0]:null, newIdx=-1;
  if(fresh&&qStep>0){ var prev=level(qStep-1).map(function(x){ return x.t; });
    for(var i=0;i<ss.length;i++) if(prev.indexOf(ss[i].t)===-1){ newIdx=i; break; } }
  renderMoves(shapeOf(segs()),r?[r.m]:[],shapeOf(ss),false); setHub('off');
  var tot=total(ss); timeline(items(ss),{limit:LIM,band:BAND,left:tot+'s of speaking',right:readout(tot)});
  var html='<p class="build'+(front?' shift':'')+'">'+ss.map(function(x,i){
    return '<span class="aseg'+(i===newIdx?' new':'')+'">'+mk(x.t,x.marks,false,'q')+'</span>'; }).join(' ')+'</p>';
  if(!r){
    $('body').innerHTML=html+'<div class="res"><h2>Built — '+tot+' seconds.</h2><p>Shape: '+esc(names(shapeOf(segs())))+'. '+esc(ans().why||'')+'</p>'+
      '<button class="tool on" type="button" data-again="1">Build it again</button></div>';
    return;
  }
  locked=false;
  $('body').innerHTML=html+'<p class="ask">'+esc(D.moves[r.m].ask)+'</p><div class="opts" id="opts"></div><div class="why" id="why" aria-live="polite"></div>';
  shuffle([{t:r.t,ok:true}].concat(r.wrong||[])).forEach(function(o){
    var b=document.createElement('button'); b.className='opt'; b.type='button'; b.textContent=o.t;
    b.addEventListener('click',function(){
      if(locked) return;
      if(o.ok){ locked=true; b.classList.add('is-ok');
        Array.prototype.forEach.call($('opts').children,function(x){ x.disabled=true; });
        setTimeout(function(){ qStep++; qDraw(true,r.m==='x'); },480); }
      else { b.classList.add('is-no'); b.disabled=true; $('why').textContent=o.why; $('why').classList.add('show'); }
    });
    $('opts').appendChild(b);
  });
}

/* ═══ TALK — the answer hidden, the clock running ══════════════════════ */
var cLeft=0, cTmr=null, cDone=[];
function talk(){
  cLeft=LIM; cDone=[];
  $('body').innerHTML='<div class="clock" id="clk">'+fmt(LIM)+'</div>'+
    '<p class="talk-lead" id="lead">'+(mode==='turn'
      ? 'Press play: the examiner asks you the question. React, give your view, then widen it out to people in general — and add a reason, an example or the other side. About half a minute. Tap each move once you\'ve said it.'
      : 'Press play: the examiner turns to you after your partner. Say their name — agree or disagree — then add one point of your own. A few seconds is enough.')+'</p>'+
    '<div class="reveal" id="reveal"><p class="answer">'+segs().map(function(s){ return '<span class="sg">'+mk(s.t,s.marks,false,'t')+'</span>'; }).join(' ')+'</p>'+
    '<div class="frame"><h3>The pattern</h3><p>'+esc(ans().frame).replace(/_{3,}/g,'<span class="blank"></span>').replace(/\n/g,'<br><br>')+'</p></div></div>';
  talkStrip(0);
}
function talkStrip(el){
  renderMoves(ORDER,[],cDone,true); setHub(cTmr?'stop':'play');
  timeline(el>0?[{phase:el>=BAND[0]?4:1,s:el}]:[],{limit:LIM,band:BAND,scale:LIM,
    left:cDone.length?names(ORDER.filter(function(k){ return cDone.indexOf(k)>-1; })):'aim for '+BAND[0]+'–'+BAND[1]+' seconds',right:''});
}
function fmt(s){ s=Math.max(0,s); return Math.floor(s/60)+':'+(s%60<10?'0':'')+(s%60); }
function clockGo(){
  if(cTmr) return; $('lead').style.display='none'; examinerSay(qText());
  cTmr=setInterval(function(){ cLeft--; $('clk').textContent=fmt(cLeft); $('clk').classList.toggle('low',cLeft<=5);
    talkStrip(LIM-cLeft); if(cLeft<=0) clockStop(true); },1000);
  talkStrip(0);
}
function clockStop(reveal){
  if(cTmr){ clearInterval(cTmr); cTmr=null; }
  if(stage!=='talk'||!$('clk')) return;
  talkStrip(LIM-cLeft);
  if(reveal) $('reveal').classList.add('show');
}

/* ═══ PHRASE BANK ══════════════════════════════════════════════════════ */
function bank(){
  var G=(D.phraseBank||[]);
  $('bankBody').innerHTML=G.length?G.map(function(g){
    return '<div class="bank-g"><b>'+esc(g.heading)+'</b>'+(g.note?'<i>'+esc(g.note)+'</i>':'')+
      '<ul>'+g.phrases.map(function(p){ return '<li>'+esc(p)+'</li>'; }).join('')+'</ul></div>'; }).join('')
    :'<p class="dr-ctx">The phrase bank is empty in this file.</p>';
  $('sheet').classList.add('open'); $('sheetX').focus();
}
function shutBank(){ $('sheet').classList.remove('open'); $('bankBtn').focus(); }

/* ═══ ROUTING ══════════════════════════════════════════════════════════ */
function draw(){
  head();
  if(stage==='explore') explore(); else if(stage==='practice') practice();
  else if(stage==='quiz') quiz(); else talk();
}
function setStage(s){
  stop(); stage=s; pref('stage',s);
  Array.prototype.forEach.call($('stages').children,function(b){ b.setAttribute('aria-selected',String(b.dataset.s===s)); });
  draw();
}
Array.prototype.forEach.call($('stages').children,function(b){
  b.addEventListener('click',function(){ if(b.dataset.s!==stage) setStage(b.dataset.s); }); });
$('prev').addEventListener('click',function(){ step(-1); });
$('next').addEventListener('click',function(){ step(1); });
$('bankBtn').addEventListener('click',bank);
$('sheetX').addEventListener('click',shutBank);
$('sheet').addEventListener('click',function(e){ if(e.target===$('sheet')) shutBank(); });
addEventListener('scroll',function(){ document.body.classList.toggle('scrolled',scrollY>4); },{passive:true});
addEventListener('pagehide',stop);

document.addEventListener('click',function(e){
  if(e.target.closest('#playHub')){
    if(stage==='explore'){ playing?stop():play(); }
    else if(stage==='talk'){ cTmr?clockStop(false):clockGo(); }
    else if(stage==='practice'){ if(dRun){ drillStop(); hush(); drill(); } else { dRun=true; drill(); drillGo(); } }
    return;
  }
  var g=e.target.closest('[data-gap]');
  if(g){ revealed[g.dataset.gap]=true; var sp=document.createElement('span'); sp.className='xr'; sp.textContent=g.textContent;
    g.replaceWith(sp); return; }
  var br=e.target.closest('[data-branch]');
  if(br && stage==='talk'){ var k=br.dataset.branch, at=cDone.indexOf(k); if(at===-1) cDone.push(k); else cDone.splice(at,1); talkStrip(LIM-cLeft); return; }
  var t=e.target.closest('button'); if(!t) return;
  if(t.dataset.dot!==undefined){ var n=+t.dataset.dot; if(n!==qi) go(ci,n,n>qi?1:-1); return; }
  if(t.dataset.mode!==undefined){ if(t.dataset.mode!==mode){ stop(); mode=t.dataset.mode; setMode(); revealed={}; pref('mode',mode); draw(); } return; }
  if(t.dataset.alt!==undefined){ stop(); ai=+t.dataset.alt; revealed={}; pref('alt',voiceOf().id); draw(); return; }
  if(t.dataset.xray){ xray=!xray; pref('xray',xray?'1':''); $('card').classList.toggle('xray',xray);
    t.classList.toggle('on',xray); t.setAttribute('aria-pressed',String(xray)); return; }
  if(t.dataset.cover){ stop(); cover=!cover; revealed={}; pref('cover',cover?'1':''); explore(); return; }
  if(t.dataset.d!==undefined){ drillStop(); hush(); dIx=Math.max(0,Math.min(segs().length-1,dIx+(+t.dataset.d))); drill(); return; }
  if(t.dataset.again){ quiz(); return; }
});
document.addEventListener('keydown',function(e){
  if($('sheet').classList.contains('open')){ if(e.key==='Escape') shutBank(); return; }
  if(/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if(e.key==='ArrowRight'){ e.preventDefault(); step(1); }
  if(e.key==='ArrowLeft'){ e.preventDefault(); step(-1); }
});
/* Swipe: horizontal, deliberate, and never from a button. */
(function(){
  var x0=null,y0=0,t0=0, el=$('card');
  el.addEventListener('pointerdown',function(e){ if(e.pointerType==='mouse'||e.target.closest('button')) return; x0=e.clientX; y0=e.clientY; t0=Date.now(); });
  el.addEventListener('pointerup',function(e){ if(x0===null) return; var dx=e.clientX-x0, dy=e.clientY-y0; x0=null;
    if(Math.abs(dx)>60 && Math.abs(dy)<45 && Date.now()-t0<700) step(dx<0?1:-1); });
  el.addEventListener('pointercancel',function(){ x0=null; });
})();

fetch('data/part4-views.json').then(function(r){ if(!r.ok) throw new Error('status '+r.status); return r.json(); })
.then(function(data){
  D=data;
  if(!D.version||D.version<3||!D.chapters) throw new Error('this page needs the v3 Part 4 file');
  var p=new URLSearchParams(location.search);
  var wt=p.get('topic')||pref('topic'); D.chapters.forEach(function(c,i){ if(c.id===wt) ci=i; });
  var wq=p.get('q')?+p.get('q'):+(pref('q')||0)+1; qi=Math.max(0,Math.min(chapter().cards.length-1,(wq||1)-1));
  var wm=p.get('mode')||pref('mode'); if(D.modes[wm]) mode=wm; setMode();
  var wa=p.get('alt')||pref('alt'); D.voices.forEach(function(v,i){ if(v.id===wa) ai=i; });
  cover=pref('cover')==='1'; xray=pref('xray')==='1'; $('card').classList.toggle('xray',xray);
  var ws=p.get('stage')||pref('stage'); stage=['explore','practice','quiz','talk'].indexOf(ws)>-1?ws:'explore';
  Array.prototype.forEach.call($('stages').children,function(b){ b.setAttribute('aria-selected',String(b.dataset.s===stage)); });
  chapters(); draw();
}).catch(function(e){
  $('q').textContent='The questions didn\'t load.';
  $('body').innerHTML='<p class="dr-ctx">'+esc(e.message)+'. Check that data/part4-views.json is the v3 file, then reload.</p>';
});
</script>
