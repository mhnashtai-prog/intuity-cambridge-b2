<style>
/* ═══════════════════════════════════════════════════════════════════════
   SPEAKING — THE GATE

   The entry to Speaking, and nothing else: the wordmark, the level, and four
   pendulums. No bars, no lists, no paragraph explaining the modes. A student
   arriving here has one decision to make — which part — and every other mark
   on the screen was competing with it.

   THE PENDULUM IS THE SHELL'S, NOT A COPY. intuity-shell.css already defines
   .pend-hang and .pend-dial, with --mark-sweep sage and --mark-core black as
   its defaults; conditionals-decide.html sets those same three tokens rather
   than redrawing the object. So this page declares no pendulum CSS at all.
   An earlier version of this file carried its own reconstruction — the right
   shape, arrived at the wrong way, and one that would have drifted from the
   real one the first time the shell changed.

   TWO BY TWO, not a row of four. The reason is in conditionals-decide: four
   across forces each dial down to about 58px on a phone before the gaps are
   counted, and a block of four reads as one object where a strip reads as a
   toolbar.

   The proportion bar and the twenty functions did not disappear — they moved
   into the card behind each pendulum, which is where a student is asking
   about one part rather than choosing between four.
   ═══════════════════════════════════════════════════════════════════════ */

:root{
  --accent:#DD8E58;
  --accent-ink:#9A5A2C;
  /* the sage rim and black core, named the way every other surface names
     them — three tokens, no geometry */
  --mark-sweep:#708A81;
  --mark-rest:#4A433D;
  --mark-core:#201E1C;
  --mark-ink:#E5D1B8;
  --mark-pct:100%;
  --dial:clamp(92px,21vw,132px);
}

.header{position:sticky}
.header::after{display:none}

/* ── CENTRING ────────────────────────────────────────────────────────────
   The rings sit in the middle of whatever is left after the header, on any
   screen. Done by making the body a flex column and letting the gate take
   the remaining height, rather than by subtracting a guessed header height
   from 100vh — that guess was 150px, it is wrong the moment the part row is
   added, and it would be wrong again on a phone where the row wraps.

   100dvh, not 100vh: on a phone 100vh counts the area BEHIND the browser's
   address bar, so a vertically centred block sits visibly low and shifts
   when the bar retracts. dvh measures what is actually visible. */
body{min-height:100dvh;display:flex;flex-direction:column}
.gate{flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:2rem var(--gutter) 3rem}

/* 2x2. The cord hangs 40px above each dial, so the rows need room for it. */
/* 2x2, and the block itself is centred rather than stretched: place-content
   keeps the four together as one object at any width. */
.dials{display:grid;grid-template-columns:repeat(2,auto);
  gap:clamp(2.6rem,8vh,4.2rem) clamp(1.8rem,11vw,4.5rem);
  justify-items:center;align-items:start;place-content:center;
  margin:0 auto}

.dial-b{display:flex;flex-direction:column;align-items:center;gap:.9rem;
  border:none;background:none;padding:0;cursor:pointer;font:inherit;color:inherit}
/* display:block, and for the second time in this file the reason is the
   same: I built the hanger as a <span>, and width and height do not apply to
   an inline box. Everywhere else in the product .pend-hang sits on a <div>,
   which is why it has never needed the declaration. The markup is now a div
   too; this line stays as the belt to that braces. */
.dial-b .pend-hang{display:block;width:var(--dial);height:var(--dial);
  will-change:transform;backface-visibility:hidden;
  animation:pendCalm 5.2s cubic-bezier(.37,0,.63,1) infinite}

/* ── THE SWING ───────────────────────────────────────────────────────────
   The shell's pendulum swings ten degrees in 2.6s on ease-in-out, which is
   right for ONE mark on a gate that a student looks at for a second. Four of
   them, permanently on screen, is a different problem: the same motion reads
   as restless, and it was jerking for two reasons.

   FIRST, EASING. ease-in-out is a symmetrical curve but not a sinusoidal
   one — it holds slightly at the extremes and hurries the middle, so each
   pass has a faint hitch at the turn. A real pendulum is simple harmonic
   motion, which is a sine wave, and cubic-bezier(.37,0,.63,1) is the
   standard sine approximation. The turn stops being a stop.

   SECOND, THE DELAYS. Mine were positive, so each dial held dead still at
   -10deg and then started moving when its delay elapsed — four separate
   lurches into motion within the first second of the page. Negative delays
   start each one part-way through a cycle it is treated as having already
   run, so they are all in motion at first paint and simply out of phase.

   And the angle drops to four degrees. At ten, four dials at the corners of
   a grid sweep visibly toward and away from each other; at four it reads as
   hanging rather than swinging, which is what a thing at rest should do. */
@keyframes pendCalm{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@media(prefers-reduced-motion:reduce){
  .dial-b .pend-hang{animation:none;transform:rotate(0)}
}
.dial-b .pend-dial span{font-size:calc(var(--dial) * .3)}
.dial-name{font-family:var(--f-display);font-size:.78rem;font-weight:600;
  letter-spacing:.01em;color:var(--dim);transition:color .15s}
.dial-b:hover .dial-name,.dial-b:focus-visible .dial-name{color:var(--accent-ink)}
/* ── THE FOCUS RING ──────────────────────────────────────────────────────
   It was a rectangle drawn around a circle. The button is a flex column
   holding a round dial and a label, so its box is rectangular and an outline
   on it boxes the whole pair — which is what appeared on click, since the
   card returns focus to the dial when it closes.

   Not simply deleted: a keyboard user needs to see where they are, and a
   page whose only controls are four identical rings needs it more than most.
   The ring moves onto the dial itself, where border-radius:50% makes the
   outline follow the circle. Same information, no box. */
.dial-b:focus-visible{outline:none}
.dial-b:focus-visible .pend-hang{outline:2px solid var(--accent-ink);
  outline-offset:7px;border-radius:50%}
.dial-b:focus-visible .dial-name{color:var(--accent-ink)}
.dial-b:active .pend-hang{transform:scale(.95)}

/* ── THE CARD ────────────────────────────────────────────────────────────
   Flat: page colour, one hairline, no shadow, no blur. Everything the gate
   no longer shows lives here, for one part at a time. */
.card-h{display:flex;align-items:baseline;gap:.7rem;margin-bottom:.5rem}
.card-h b{font-family:var(--f-display);font-size:1.5rem;font-weight:900;
  letter-spacing:var(--track-display);color:var(--accent-ink);line-height:1}
.card-h span{font-family:var(--f-display);font-size:1.12rem;font-weight:700;color:var(--ink)}
.card-h i{margin-left:auto;font-style:normal;font-family:var(--f-mono);
  font-size:.72rem;color:var(--dim)}

/* The part's share of the fourteen minutes, kept because proportion was the
   one thing the old screen taught that a list cannot. */
.card-bar{height:8px;border-radius:2px;background:var(--slot-bg);
  margin-bottom:.35rem;overflow:hidden}
.card-bar i{display:block;height:100%;background:var(--accent);
  animation:grow .5s cubic-bezier(.2,.9,.3,1) both}
@keyframes grow{from{width:0}}
.card-sub{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.09em;
  text-transform:uppercase;color:var(--faint);margin:0 0 1.2rem}

/* ── ONE CARD, NOT THREE SURFACES ────────────────────────────────────────
   The shell paints --scrim over the page and --card on top of it, so a
   sheet was page → tinted veil → card: three stacked rectangles to show one
   thing. The veil now IS the page colour and the card carries no shadow, so
   what opens is a single surface that the page has stepped back behind.

   And it is sized to the four rings it replaces — roughly 336 x 391 on a
   desktop — so the card appears where the rings were rather than as a new
   object of a different size. */
.sheet{background:none}
.sheet-card{align-items:stretch;text-align:left;gap:0;
  width:min(26rem,92vw);max-width:none;
  height:min(30rem,78vh);max-height:none;
  overflow:hidden;box-shadow:none;
  padding:1.3rem 1.3rem 1.1rem}
.sheet-card .close-btn{position:absolute;top:.7rem;right:.7rem;z-index:2}
.open-link{display:inline-block;margin-top:1.1rem;font-family:var(--f-display);
  font-size:.7rem;font-weight:600;letter-spacing:.05em;color:var(--tile-ink);
  background:var(--tile-bg);border-radius:var(--r-chip);padding:.45rem .85rem;
  text-decoration:none;transition:background .15s,transform .1s cubic-bezier(.2,.8,.2,1)}
@media(hover:hover){ .open-link:hover{background:var(--tile-bg-press)} }
.open-link:active{transform:scale(.96)}
/* ── THE PHRASE BANK · STYLE ─────────────────────────────────────────────
   Closed, a function is one line: its name and how many phrases it holds.
   Open, it is the only thing on screen. No second card, no box — a hairline
   between rows is all the structure a list of thirteen needs. */
/* ── A GALLERY, NOT A LIST ───────────────────────────────────────────────
   One function per slide, swiped through — the shape of the Apple product
   page and of gerunds-sort's own card: a thing at a time, dots to say where
   you are, and no long scroll anywhere.

   The convention note is what made a list necessary. At 300 to 540
   characters each it is the tallest thing in every function, and stacking it
   under the phrases pushed twelve of eighteen slides past the card. Held
   behind one row it drops to two, and the order is better teaching anyway:
   the phrases first, the caution when asked for. */
.card-body{flex:1;min-height:0;display:flex;flex-direction:column;margin-top:.2rem}
.gal{flex:1;min-height:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;
  scrollbar-width:none;-ms-overflow-style:none}
.gal::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;min-width:0;
  overflow-y:auto;padding:.1rem .1rem .6rem}
.slide h3{font-family:var(--f-display);font-size:.88rem;font-weight:700;
  letter-spacing:.04em;text-transform:uppercase;color:var(--ink);margin:0 0 .1rem}
.slide .when{font-size:.82rem;line-height:1.5;color:var(--dim);margin:0 0 .75rem}

/* Where you are, and how far there is to go. A dot is a control as well as
   a marker — on a desktop there is no swipe to make. */
.dots{display:flex;justify-content:center;align-items:center;gap:.34rem;
  padding:.7rem 0 .1rem;flex-wrap:wrap}
.dot{width:6px;height:6px;border-radius:50%;border:none;padding:0;cursor:pointer;
  background:var(--rule);transition:background .2s,transform .2s}
.dot.on{background:var(--accent-ink);transform:scale(1.35)}
.gal-nav{display:flex;align-items:center;justify-content:space-between;gap:.6rem}
.gal-arrow{border:none;background:none;padding:.3rem .45rem;cursor:pointer;
  font-size:1rem;line-height:1;color:var(--faint);transition:color .15s}
.gal-arrow:disabled{color:var(--rule);cursor:default}
@media(hover:hover){ .gal-arrow:not(:disabled):hover{color:var(--accent-ink)} }

/* The caution, one row until asked for. */
.watch{margin-top:.7rem;border-top:1px solid var(--rule)}
.watch-b{display:flex;align-items:center;gap:.5rem;width:100%;text-align:left;
  border:none;background:none;padding:.6rem 0;cursor:pointer;font:inherit;
  font-family:var(--f-mono);font-size:.6rem;letter-spacing:.09em;
  text-transform:uppercase;color:var(--accent-ink)}
.watch-b span{margin-left:auto;color:var(--faint)}
.card-back{display:flex;align-items:center;gap:.5rem;border:none;background:none;
  padding:.5rem 0;cursor:pointer;font:inherit;
  font-family:var(--f-mono);font-size:.62rem;letter-spacing:.09em;
  text-transform:uppercase;color:var(--accent-ink)}
.card-back span{font-size:.9rem;line-height:1}
.fn-head{font-family:var(--f-display);font-size:.9rem;font-weight:700;
  letter-spacing:.04em;text-transform:uppercase;color:var(--ink);margin:.3rem 0 .15rem}
.fn-when{font-size:.84rem;line-height:1.5;color:var(--dim);margin:0 0 .8rem}

.bank-g{border-top:1px solid var(--rule)}
.bank-h{display:flex;align-items:baseline;gap:.8rem;width:100%;text-align:left;
  border:none;background:none;padding:.85rem 0;cursor:pointer;font:inherit;
  color:inherit;transition:color .15s}
.bank-h b{font-family:var(--f-display);font-size:.78rem;font-weight:700;
  letter-spacing:.05em;text-transform:uppercase;color:var(--ink)}
.bank-h span{margin-left:auto;font-family:var(--f-mono);font-size:.66rem;
  color:var(--faint);font-variant-numeric:tabular-nums}
@media(hover:hover){ .bank-h:hover b{color:var(--accent-ink)} }
.bank-g.open .bank-h b{color:var(--accent-ink)}
.bank-g.open .bank-h span{color:var(--accent-ink)}
.bank-g i{display:block;font-style:normal;font-size:.82rem;line-height:1.5;
  color:var(--dim);margin:0 0 .7rem}
.bank-g ul{list-style:none;margin:0;padding:0 0 .2rem;
  display:flex;flex-wrap:wrap;gap:.3rem}
.bank-g li{font-size:.84rem;color:var(--tile-ink);background:var(--tile-bg);
  border-radius:var(--r-chip);padding:.32rem .6rem}
/* A phrase that appears nowhere in this page's own turns. Shown, because
   range is the point, and marked, because pretending it was in the material
   would be the lie the corpus was built to avoid. */
.bank-g li.extra{background:none;box-shadow:inset 0 0 0 1px var(--rule);color:var(--dim)}
/* Cannot open a sentence — 'whereas', 'although'. The leading ellipsis is
   the first half it has to attach to. */
.bank-g li.joins::before{content:'… ';color:var(--faint)}
.bank-g li em{font-style:normal;font-family:var(--f-mono);font-size:.58rem;
  letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-left:.45rem}
.bank-note{font-size:.82rem;line-height:1.6;color:var(--dim);
  margin:.85rem 0 0;white-space:pre-line}
.bank-miss{font-size:.8rem;line-height:1.55;color:var(--dim);margin:.6rem 0 .3rem}
.bank-miss s{color:var(--wrong);text-decoration-color:var(--wrong);margin-right:.35rem}
.bank-g.open{padding-bottom:1rem}
.sheet-card{max-height:82vh;overflow-y:auto}
.fn-list{list-style:none;margin:0;padding:0}
.fn-one{list-style:none;margin:0;padding:0}
.fn-ph{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:.3rem}
.fn-ph li{font-size:.84rem;color:var(--tile-ink);background:var(--tile-bg);
  border-radius:var(--r-chip);padding:.32rem .6rem}
.fn-ph li.extra{background:none;box-shadow:inset 0 0 0 1px var(--rule);color:var(--dim)}
.fn-ph li.joins::before{content:'… ';color:var(--faint)}
.fn-ph li em{font-style:normal;font-family:var(--f-mono);font-size:.58rem;
  letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-left:.45rem}
.fn-list li/* ── A GALLERY, NOT A LIST ───────────────────────────────────────────────
   One function per slide, swiped through — the shape of the Apple product

  scrollbar-width:none;-ms-overflow-style:none}
.gal::-webkit-scrollbar{display:none}

.slide h3{font-family:var(--f-display);font-size:.88rem;font-weight:700;

.slide .when{font-size:.82rem;line-height:1.5;color:var(--dim);margin:0 0 .75rem}

/* Where you are, and how far there is to go. A dot is a control as well as

.dots{display:flex;justify-content:center;align-items:center;gap:.34rem;

.dot{width:6px;height:6px;border-radius:50%;border:none;padding:0;cursor:pointer;

.gal-arrow{border:none;background:none;padding:.3rem .45rem;cursor:pointer;

<script>
/* ── THE CORPUS ──────────────────────────────────────────────────────────
   The Hub is the only screen that sees all four parts at once, so it is the
   only one that shows the whole corpus — browsed by FUNCTION, which is the
   axis the writing corpus settled on and the reason a learner looking for a
   way to disagree politely should not have to know which part it lives in.

   TIPS below stays as the fallback. It is twenty lines written for this page
   and synced to nothing, which was true when I wrote it and is written here
   so nobody discovers it later. Where the corpus covers a function, the
   corpus wins; where it does not yet, the line is shown and marked. */
var PH = null;
fetch('data/speaking-phrases.json')
  .then(function(r){ return r.ok ? r.json() : null; })
  .then(function(d){ PH = d; })
  .catch(function(){ PH = null; });

/* The Hub's own labels and its FN_OF bridge are gone. There were three
   vocabularies for one thing: the Hub's twenty hand-written function names,
   the corpus function labels, and a hand-written map between them. A bridge
   is what you build when two things should have been one.

   The ring now opens exactly what the part page's own bank shows — same
   functions, same filter, same accordion — so a student who learns the bank
   in Part 3 already knows it from the Hub, and the other way round. One
   component, one vocabulary, two doors into it.

   What stays is the Hub's own job: the part number, its name, its duration
   and its share of the fourteen minutes. That has nothing to do with
   phrases and exists nowhere else. */

const SPEAKING = {
  total: 14,
  parts: [
    { n:1, name:'Interview', minutes:2,
      url:'part1.html',
      /* Rewritten as functions. The hub listed Part 1 as topics — daily
         habits, home and family, work and study — while Parts 2 to 4 were
         listed as functions, so the four parts sat on two different axes.
         The topics are already the categories in part1-structure.json and
         belong in that page's tabs, not in an index of what is learned. */
      fns:['Giving information about yourself',
           'Expanding an answer past one line',
           'Talking about habits and routines',
           'Talking about past experience',
           'Talking about plans'] },

    { n:2, name:'Long turn', minutes:4, alone:'1 min on your own',
      url:'part2-turn.html',
      fns:['Comparing two photographs',
           'Pointing out what is similar',
           'Pointing out what is different',
           'Justifying an opinion',
           'Speculating about a situation'] },

    { n:3, name:'Collaborate', minutes:3,
      url:'part3-talk.html',
      fns:['Putting an idea forward',
           'Agreeing politely',
           'Disagreeing without sounding rude',
           'Suggesting something else',
           'Reaching a decision together'] },

    { n:4, name:'Discuss', minutes:4,
      url:'part4-views.html',
      fns:['Giving a clear opinion',
           'Giving reasons for it',
           'Building an argument',
           'Agreeing and disagreeing',
           'Talking about ideas, not just facts'] }
  ],
  /* The sheet. Everything the hub would have printed on the screen, kept
     one tap away instead. Four entries, because a fifth would mean this
     had become the wall of text it replaced. */
  how: [
    ['Who is in the room',
     'Two examiners. One talks to you, the other only listens and marks.'],
    ['Who you are with',
     'Another student. You are marked on your own, whatever your partner does.'],
    ['Part 4 follows Part 3',
     'The discussion stays on the topic you have just worked through together.'],
    ['Part 2 is the short one',
     'You speak alone for a minute, then answer a question about your partner\u2019s photos for about thirty seconds.']
  ]
};

/* ── THE GATE ────────────────────────────────────────────────────────────
   Four pendulums, staggered so they do not swing as one mechanism. The swing
   is decoration; the button is not, so each carries a real label for anyone
   who cannot see it move. */
const $ = id => document.getElementById(id);
const dials = $('dials');

SPEAKING.parts.forEach(function(p, i){
  const b = document.createElement('button');
  b.className = 'dial-b';
  b.type = 'button';
  b.setAttribute('aria-label', 'Part ' + p.n + ', ' + p.name + ', ' + p.minutes + ' minutes');
  b.innerHTML =
    '<div class="pend-hang" style="animation-delay:' + (i * -1.3).toFixed(2) + 's" aria-hidden="true">' +
      '<div class="pend-dial"><span>' + p.n + '</span></div></div>' +
    '<span class="dial-name">' + p.name + '</span>';
  b.addEventListener('click', function(){ openCard(p, b); });
  dials.appendChild(b);
});

/* ── A PART'S CARD ───────────────────────────────────────────────────────
   Each function is a control, and its line opens underneath rather than
   floating over the list: on a phone a floating tooltip covers the next two
   items, which is worse than none. One open at a time. */
const card = $('card');
let lastDial = null;

function openCard(p, from){
  const h = $('cardH');
  h.querySelector('b').textContent = p.n;
  h.querySelector('span').textContent = p.name;
  h.querySelector('i').textContent = p.alone || (p.minutes + ' min');

  $('cardBar').style.width = (p.minutes / SPEAKING.total * 100).toFixed(1) + '%';
  $('cardShare').textContent = p.minutes + ' of the ' + SPEAKING.total + ' minutes';

  cardPart = p;
  drawCardFns(p);

  const open = $('cardOpen');
  if (p.url){ open.href = p.url; open.style.display = ''; open.textContent = 'Open Part ' + p.n; }
  else { open.style.display = 'none'; }

  lastDial = from;
  card.classList.add('open');
  $('cardX').focus();
}

/* The same accordion the four part pages use: an index of function names,
   one open at a time, the open one the only thing on screen. Part 4's bank
   is fourteen functions and 197 phrases — flat, that is seven phone screens
   to find one phrase, which is a document rather than a bank. */
let cardPart = null, galFns = [], galAt = 0;

function partFns(n){
  if (!PH || !PH.functions) return [];
  const out = [];
  Object.keys(PH.functions).forEach(function(k){
    const f = PH.functions[k];
    if (f.parts.indexOf(n) !== -1){ f._key = k; out.push(f); }
  });
  return out;
}

function drawCardFns(p){
  const fns = partFns(p.n);
  if (!fns.length){
    $('gal').innerHTML = '<p class="bank-miss">The phrase bank did not load. ' +
      'Expected data/speaking-phrases.json beside this page.</p>';
    $('dots').innerHTML = '';
    return;
  }
  galFns = fns;

  $('gal').innerHTML = fns.map(function(f, i){
    const mixed = f.phrases.some(function(x){ return x.mouth !== f.phrases[0].mouth; });
    const watch = (f.convention ? '<p class="bank-note">' + f.convention + '</p>' : '') +
      (f.misfires ? f.misfires.map(function(m){
          return '<p class="bank-miss"><s>' + m.t + '</s> ' + m.why + '</p>';
        }).join('') : '');
    return '<section class="slide" data-i="' + i + '">' +
      '<h3>' + f.label + '</h3>' +
      (f.when ? '<p class="when">' + f.when.charAt(0).toUpperCase() + f.when.slice(1) + '</p>' : '') +
      '<ul class="fn-ph">' + f.phrases.map(function(x){
        const cls = 'ph' + (x.from === 'bank' ? ' extra' : '') + (x.joins ? ' joins' : '');
        const tag = (mixed && x.mouth !== 'both')
          ? '<em>' + (x.mouth === 'teen' ? 'teen' : 'adult') + '</em>' : '';
        return '<li class="' + cls + '">' + x.t + tag + '</li>';
      }).join('') + '</ul>' +
      (watch ? '<div class="watch"><button class="watch-b" type="button" ' +
        'aria-expanded="false">what to watch<span>+</span></button>' +
        '<div class="watch-body" hidden>' + watch + '</div></div>' : '') +
      '</section>';
  }).join('');

  $('dots').innerHTML = fns.map(function(f, i){
    return '<button class="dot" type="button" data-i="' + i + '" aria-label="' + f.label + '"></button>';
  }).join('');

  Array.prototype.forEach.call($('dots').children, function(b){
    b.addEventListener('click', function(){ galGo(+b.dataset.i); });
  });
  Array.prototype.forEach.call($('gal').querySelectorAll('.watch-b'), function(b){
    b.addEventListener('click', function(){
      const open = b.getAttribute('aria-expanded') === 'true';
      b.setAttribute('aria-expanded', open ? 'false' : 'true');
      b.querySelector('span').textContent = open ? '+' : '\u2212';
      b.nextSibling.hidden = open;
    });
  });

  galAt = 0;
  galMark();
}

/* The track is a scroll container with snap points, so a swipe is free and
   the dots and arrows drive the same thing a finger would. */
function galGo(i){
  if (!galFns.length) return;
  galAt = Math.max(0, Math.min(galFns.length - 1, i));
  const g = $('gal');
  g.scrollTo({ left: galAt * g.clientWidth, behavior:'smooth' });
  galMark();
}

function galMark(){
  Array.prototype.forEach.call($('dots').children, function(b, i){
    b.classList.toggle('on', i === galAt);
  });
  $('galPrev').disabled = galAt === 0;
  $('galNext').disabled = galAt === galFns.length - 1;
}


function shutCard(){
  card.classList.remove('open');
  /* Focus goes back to the dial that opened the card, so a keyboard user is
     not dropped at the top of the document. preventScroll stops the page
     jumping; :focus-visible keeps the ring off for a pointer user, who does
     not need it and did not ask for it. */
  if (lastDial) lastDial.focus({ preventScroll:true });
}
$('cardX').addEventListener('click', shutCard);
card.addEventListener('click', function(e){ if (e.target === card) shutCard(); });
$('galPrev').addEventListener('click', function(){ galGo(galAt - 1); });
$('galNext').addEventListener('click', function(){ galGo(galAt + 1); });

/* A swipe moves the track on its own; this keeps the dots in step with it. */
$('gal').addEventListener('scroll', function(){
  const g = $('gal');
  const i = Math.round(g.scrollLeft / Math.max(1, g.clientWidth));
  if (i !== galAt){ galAt = i; galMark(); }
}, { passive:true });

addEventListener('keydown', function(e){
  if (!card.classList.contains('open')) return;
  if (e.key === 'Escape') shutCard();
  /* Arrow keys, because on a desktop there is no swipe to make and reaching
     for a 6px dot is not navigation. */
  if (e.key === 'ArrowRight') galGo(galAt + 1);
  if (e.key === 'ArrowLeft')  galGo(galAt - 1);
});
</script>
</body>
</html>
