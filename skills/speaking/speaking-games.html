<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F3F1ED">
<title>INTUITY — Speaking · Recall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;900&family=Geist+Mono:wght@400;500&family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=7">
<link rel="stylesheet" href="/data/similar-words/vocab.css?v=7">
<style>
/* ═══ SPEAKING · RECALL ═════════════════════════════════════════════════
   Writing's Storyboard, brought to Speaking: read a model answer, it
   vanishes, bring its phrases back. The phrases are the ones the answer
   data already marks — the language that makes an answer sound like B2 —
   so nothing here is chosen by the page. Recalling a phrase from memory
   fixes it far better than reading it again, and a stock of phrases is
   what lets a candidate sound fluent under exam pressure.
   One page for Parts 1 and 4 (?part=1 or ?part=4), reading the same files
   as their Build pages: data/part1-answers.json, data/part4-views.json.
   ═══════════════════════════════════════════════════════════════════════ */
body{color:var(--ink,#232C31);background:var(--screen,#F3F1ED)}
[hidden]{display:none!important}
.rc-top{display:flex;align-items:center;justify-content:space-between;gap:.8rem;flex-wrap:wrap;margin:0 0 1rem}
.rc-top .viewtog{margin:0}
.rc-qs{display:flex;align-items:center;gap:.9rem;flex-wrap:wrap;justify-content:space-between;margin:0 0 .9rem}
.rc-dots{display:flex;gap:.4rem}
.rc-dot{width:.8rem;height:.8rem;border-radius:50%;border:1.5px solid var(--rule);background:none;padding:0;cursor:pointer}
.rc-dot.on{background:var(--ink);border-color:var(--ink)}
.rc-dot.ok{background:var(--tile-ok-bg,#D2E3D6);border-color:#6FA383}
.rc-dot.ok.on{background:#2E6B48;border-color:#2E6B48}
.rc-qs .seg{margin:0}

.poster{background:var(--card,#FAF8F5);box-shadow:0 1px 2px rgba(35,44,49,.06),0 10px 26px -18px rgba(35,44,49,.35);padding:1.4rem 1.4rem 1.2rem}
.kick{display:flex;align-items:center;gap:.6rem;font-family:var(--f-mono);font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin:0 0 .8rem}
.kick::before{content:'';width:26px;height:10px;background:#B0865C;flex:none}
.rc-ask{font-family:var(--f-display);font-weight:800;font-size:clamp(1.15rem,3.4vw,1.4rem);line-height:1.35;letter-spacing:var(--track-display);color:var(--ink);margin:0 0 1rem}
.rc-stage{font-size:.86rem;color:var(--dim);margin:0 0 .9rem;padding-top:.8rem;border-top:1px solid var(--rule)}
.rc-stage b{color:var(--ink)}
.rc-who{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:1rem 0 .3rem}
.rc-who:first-child{margin-top:0}
.rc-text{font-size:1.06rem;line-height:1.9;color:var(--sentence);margin:0}
.rc-hand{font-style:italic;color:var(--dim);margin:.6rem 0 0}
mark.rc-mk{background:none;color:var(--accent-ink);font-weight:700;border-bottom:2px solid rgba(221,142,88,.55);padding:0 .05em}
.rc-in{font:inherit;font-weight:700;color:var(--accent-ink);background:var(--slot-bg,#DED7CA);border:none;border-bottom:2px solid var(--ink);
  border-radius:3px 3px 0 0;padding:.02em .35em;margin:0 .1em;min-width:4ch;outline:none;line-height:1.35}
.rc-in:focus{background:rgba(221,142,88,.18)}
.rc-in.ok{background:var(--tile-ok-bg,#D2E3D6);color:var(--tile-ok-ink,#1F4230);border-bottom-color:#2E6B48}
.rc-in.no{background:var(--tile-no-bg,#F3D9D2);color:var(--tile-no-ink,#6E2416);border-bottom-color:#B4513A}
.rc-in.shown{background:none;color:var(--dim);border-bottom:2px dashed var(--rule);font-weight:600}
.rc-in:disabled{opacity:1}
.rc-shake{animation:rcShake .4s}
@keyframes rcShake{25%,75%{transform:translateX(-4px)}50%{transform:translateX(4px)}}
.rc-veil{display:grid;place-items:center;gap:.6rem;min-height:9rem;text-align:center;color:var(--faint);font-size:.9rem}
.rc-veil .ring{width:3.4rem;height:3.4rem;border-radius:50%;background:var(--ring-core,#201E1C);box-shadow:0 0 0 5px #8AA79C;display:grid;place-items:center;
  color:var(--ring-ink,#E5D1B8);font-family:'Anton',Impact,var(--f-display),sans-serif;font-size:1.3rem}
.rc-result{margin:1rem 0 0;padding-top:.9rem;border-top:1px solid var(--rule);font-size:.95rem;color:var(--sentence)}
.rc-result b{font-family:'Anton',Impact,var(--f-display),sans-serif;font-weight:400;font-size:1.5rem;color:var(--ink);margin-right:.35rem;vertical-align:-2px}
.rc-why{font-size:.9rem;color:var(--dim);margin:.4rem 0 0}
.rc-err{color:var(--wrong,#B4513A)}
@media(max-width:560px){ .poster{padding:1.1rem 1rem} .rc-text{font-size:1rem} }
@media(prefers-reduced-motion:reduce){ .rc-shake{animation:none} }
</style>
</head>
<body>

<header class="header">
  <div class="header-top">
    <a class="back-link" href="/index.html?openModal=speaking" target="_top">← Speaking</a>
    <div class="header-title">
      <div class="app-title">INTUITY</div>
      <div class="app-subtitle" id="sub">Speaking · Recall</div>
    </div>
    <span class="header-spacer">Level <b>B2</b></span>
  </div>
  <!-- the same row as every Speaking page; Parts 1 and 4 stay on Recall -->
  <nav class="mode-selector" aria-label="Exam part" id="parts">
    <a class="mode-btn" href="speaking-format.html">Hub</a>
    <a class="mode-btn" data-part="1" href="?part=1">Part 1</a>
    <a class="mode-btn" href="part2-turn.html">Part 2</a>
    <a class="mode-btn" href="part3-talk.html">Part 3</a>
    <a class="mode-btn" data-part="4" href="?part=4">Part 4</a>
  </nav>
  <div class="set-tabs" id="tabs" role="tablist" aria-label="Topic"></div>
</header>

<main class="wrap">
  <div class="rc-top">
    <!-- which view: Build is the part's own page, Recall is this one -->
    <div class="viewtog" role="group" aria-label="How to practise">
      <a class="viewbtn" id="toBuild" href="part1.html">Build</a>
      <button class="viewbtn active" type="button" aria-current="page">Recall</button>
    </div>
  </div>
  <div class="rc-qs">
    <div class="rc-dots" id="dots" role="tablist" aria-label="Question"></div>
    <div class="seg" id="voices" role="group" aria-label="Model answer"></div>
  </div>

  <article class="poster" id="card">
    <div class="kick" id="kick">Loading</div>
    <h1 class="rc-ask" id="ask"></h1>
    <p class="rc-stage" id="stage"></p>
    <div id="body"></div>
    <div id="result" hidden></div>
  </article>
</main>

<div class="action-bar" id="bar"></div>

<script src="/skills/grammar-rules/intuity-sound.js"></script>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const P = new URLSearchParams(location.search);
  const PART = P.get('part') === '4' ? 4 : 1;
  const FILE = PART === 4 ? 'data/part4-views.json' : 'data/part1-answers.json';
  const BUILD = PART === 4 ? 'part4-views.html' : 'part1.html';
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
  const norm = s => String(s).toLowerCase().replace(/[’']/g, "'").replace(/[—–-]/g, ' ').replace(/[.,!?;:…]/g, '').replace(/\s+/g, ' ').trim();
  const sfx = n => { try { if (window.SFX && SFX.isOn() && SFX[n]) SFX[n](); } catch(e){} };
  let D, ci = 0, qi = 0, vi = 0, stage = 'read', marks = [], hints = false, won = {};

  const chapter = () => D.chapters[ci], card = () => chapter().cards[qi], alt = () => card().alts[vi];
  const voice = () => D.voices[vi] || {};
  const key = () => chapter().id + ':' + qi + ':' + vi;
  const store = () => { try { localStorage.setItem('intuity.speakrecall.p' + PART, JSON.stringify(won)); } catch(e){} };
  try { won = JSON.parse(localStorage.getItem('intuity.speakrecall.p' + PART) || '{}') || {}; } catch(e){ won = {}; }

  /* the turns of one model answer, as blocks: Part 1 one speaker; Part 4
     the view, the handover, and the partner joining in */
  function blocks(){
    const a = alt(), v = voice();
    if (PART === 1) return [{ who: null, segs: a.segs }];
    const out = [{ who: v.a || 'Candidate A', segs: a.turn.segs }];
    if (a.partner && a.partner.segs){ out.push({ who: v.b || 'Candidate B', hand: a.partner.handover, segs: a.partner.segs }); }
    return out;
  }
  /* one seg's text, with its marks either highlighted or turned into inputs */
  function segHTML(s, mode){
    let t = s.t, html = '', at = 0;
    const found = (s.marks || []).map(m => ({ m, i: t.indexOf(m) })).filter(x => x.i >= 0).sort((a, b) => a.i - b.i);
    found.forEach(({ m, i }) => {
      if (i < at) return;                                   /* overlapping marks: keep the first */
      html += esc(t.slice(at, i));
      const k = marks.length; marks.push({ m, tries: 0, ok: false });      /* counted in every stage */
      if (mode === 'read') html += '<mark class="rc-mk">' + esc(m) + '</mark>';
      else {
        html += `<input class="rc-in" data-k="${k}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Missing phrase ${k + 1}" style="width:${Math.max(4, m.length + 2)}ch">`; }
      at = i + m.length;
    });
    return html + esc(t.slice(at));
  }
  function answerHTML(mode){
    marks = [];
    return blocks().map(b => (b.who ? `<p class="rc-who">${esc(b.who)}</p>` : '') +
      (b.hand ? `<p class="rc-hand">“${esc(b.hand)}”</p>` : '') +
      `<p class="rc-text">${b.segs.map(s => segHTML(s, mode)).join(' ')}</p>`).join('');
  }
  const plain = () => blocks().map(b => b.segs.map(s => s.t).join(' ')).join(' ');

  /* ── the bar: one or two actions, per stage ── */
  function bar(btns){
    $('bar').innerHTML = btns.map(b => `<button class="action-btn ${b.primary ? 'primary' : 'secondary'}" type="button" id="${b.id}">${b.label}</button>`).join('');
    btns.forEach(b => { $(b.id).onclick = b.on; });
  }

  function draw(){
    try { speechSynthesis.cancel(); } catch(e){}
    const c = card(), n = marks.length;
    $('kick').textContent = 'Question ' + (qi + 1) + ' of ' + chapter().cards.length + ' · ' + (voice().tab || 'Model answer');
    $('ask').textContent = c.question;
    $('result').hidden = true; $('result').innerHTML = '';
    if (stage === 'read'){
      $('body').innerHTML = answerHTML('read');
      $('stage').innerHTML = 'Read it — out loud if you can. The <b>' + marks.length + ' coloured phrases</b> will disappear.';
      bar([{ id:'bHear', label:'Hear it', on: hear }, { id:'bHide', label:'Hide it', primary:true, on: () => { stage = 'veil'; draw(); } }]);
    } else if (stage === 'veil'){
      answerHTML('read'); const count = marks.length;
      $('body').innerHTML = '<div class="rc-veil"><span class="ring">' + count + '</span>Say the answer to yourself.<br>Then bring the phrases back.</div>';
      $('stage').innerHTML = 'The answer is hidden.';
      bar([{ id:'bPeek', label:'Read again', on: () => { stage = 'read'; draw(); } }, { id:'bGo', label:'Bring it back', primary:true, on: () => { stage = 'recall'; draw(); } }]);
    } else {
      $('body').innerHTML = answerHTML('recall');
      $('stage').innerHTML = 'Type the <b>' + marks.length + ' missing phrases</b>. Enter moves to the next one.';
      wire(); bar([{ id:'bHint', label: hints ? 'Hide hints' : 'First letters', on: toggleHints },
                   { id:'bCheck', label:'Check', primary:true, on: check }]);
      const f = document.querySelector('.rc-in'); if (f) setTimeout(() => f.focus(), 60);
    }
    paintNav();
  }
  function wire(){
    const ins = [...document.querySelectorAll('.rc-in')];
    ins.forEach((inp, i) => {
      inp.addEventListener('input', () => { inp.classList.remove('no'); inp.style.width = Math.max(4, Math.max(inp.value.length, marks[i].m.length) + 2) + 'ch'; });
      inp.addEventListener('keydown', e => { if (e.key !== 'Enter') return; e.preventDefault();
        const next = ins.slice(i + 1).concat(ins.slice(0, i)).find(x => !x.disabled); if (next && ins.some(x => !x.disabled && !x.value.trim())) next.focus(); else check(); });
    });
    paintHints();
  }
  function paintHints(){
    document.querySelectorAll('.rc-in').forEach(inp => { const m = marks[+inp.dataset.k].m;
      inp.placeholder = hints ? m.split(/\s+/).map(w => w[0] + '…').join(' ') : ''; });
  }
  function toggleHints(){ hints = !hints; paintHints(); $('bHint').textContent = hints ? 'Hide hints' : 'First letters'; }

  function check(){
    const ins = [...document.querySelectorAll('.rc-in')]; let left = 0, wrong = 0;
    ins.forEach(inp => {
      const mk = marks[+inp.dataset.k]; if (mk.ok || inp.disabled) return;
      if (!inp.value.trim()){ left++; return; }
      if (norm(inp.value) === norm(mk.m)){ mk.ok = true; inp.value = mk.m; inp.classList.add('ok'); inp.disabled = true; }
      else { mk.tries++; wrong++; inp.classList.add('no'); inp.classList.remove('rc-shake'); void inp.offsetWidth; inp.classList.add('rc-shake'); }
    });
    if (marks.every(m => m.ok)) return finish(false);
    if (wrong) sfx('wrong');
    $('stage').innerHTML = (wrong ? '<span class="rc-err">' + wrong + ' not quite</span> — try again' : 'Keep going') +
      (left ? ', ' + left + ' still empty.' : '.') + ' Or show what’s left.';
    bar([{ id:'bShow', label:'Show the rest', on: () => finish(true) }, { id:'bCheck', label:'Check', primary:true, on: check }]);
    const f = ins.find(x => !x.disabled && (!x.value.trim() || x.classList.contains('no'))); if (f) f.focus();
  }
  function finish(gaveUp){
    document.querySelectorAll('.rc-in').forEach(inp => { const mk = marks[+inp.dataset.k];
      if (!mk.ok){ inp.value = mk.m; inp.classList.remove('no'); inp.classList.add('shown'); } inp.disabled = true; });
    const first = marks.filter(m => m.ok && !m.tries).length, all = marks.length;
    if (first === all){ won[key()] = 1; store(); sfx('correct'); }
    else if (!gaveUp) sfx('pop');
    stage = 'done';
    $('stage').innerHTML = first === all ? '<b>Every phrase back, first time.</b>' : 'Here is the whole answer again.';
    $('result').hidden = false;
    $('result').innerHTML = `<p class="rc-result"><b>${first}/${all}</b>phrases back first time</p>` +
      (alt().why || (alt().turn && alt().turn.why) ? `<p class="rc-why">${esc(alt().why || alt().turn.why)}</p>` : '');
    const last = qi >= chapter().cards.length - 1;
    bar([{ id:'bAgain', label:'Again', on: () => { stage = 'read'; draw(); } },
         { id:'bNext', label: last ? 'Next topic ›' : 'Next question ›', primary:true, on: next }]);
    paintNav();
  }
  function next(){
    if (qi < chapter().cards.length - 1) qi++; else { ci = (ci + 1) % D.chapters.length; qi = 0; }
    stage = 'read'; draw(); sync();
  }
  function hear(){
    try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(plain()); u.lang = 'en-GB'; u.rate = .95; speechSynthesis.speak(u); } catch(e){}
  }

  /* ── the rows: topics, questions, model answers ── */
  function paintNav(){
    document.querySelectorAll('#tabs .vtab').forEach((b, i) => { b.classList.toggle('active', i === ci); b.setAttribute('aria-selected', i === ci); });
    $('dots').innerHTML = chapter().cards.map((c, i) => {
      const ok = D.voices.some((v, j) => won[chapter().id + ':' + i + ':' + j]);
      return `<button class="rc-dot${i === qi ? ' on' : ''}${ok ? ' ok' : ''}" type="button" data-q="${i}" aria-label="Question ${i + 1}${ok ? ', recalled' : ''}"></button>`; }).join('');
    $('dots').querySelectorAll('.rc-dot').forEach(b => b.onclick = () => { qi = +b.dataset.q; stage = 'read'; draw(); sync(); });
    $('voices').innerHTML = D.voices.map((v, i) => `<button type="button" class="${i === vi ? 'active' : ''}" data-v="${i}">${esc(v.tab)}</button>`).join('');
    $('voices').querySelectorAll('button').forEach(b => b.onclick = () => { vi = +b.dataset.v; stage = 'read'; draw(); sync(); });
    const v = voice();
    $('toBuild').href = `${BUILD}?topic=${encodeURIComponent(chapter().id)}&q=${qi + 1}&alt=${encodeURIComponent(v.id || '')}`;
  }
  function sync(){
    const u = new URL(location.href); u.searchParams.set('part', PART); u.searchParams.set('topic', chapter().id);
    u.searchParams.set('q', qi + 1); u.searchParams.set('alt', voice().id || ''); history.replaceState(null, '', u);
  }

  async function boot(){
    document.querySelectorAll('#parts [data-part]').forEach(a => { const on = +a.dataset.part === PART;
      a.classList.toggle('active', on); if (on) a.setAttribute('aria-current', 'page'); });
    $('sub').textContent = 'Speaking · Part ' + PART + ' · Recall';
    document.title = 'INTUITY — Speaking Part ' + PART + ' · Recall';
    try {
      const r = await fetch(FILE, { cache:'no-store' }); if (!r.ok) throw new Error('HTTP ' + r.status); D = await r.json();
      if (!D.chapters || !D.voices) throw new Error('unexpected file');
    } catch(e){
      $('kick').textContent = 'Could not load'; $('ask').textContent = 'The Part ' + PART + ' answers didn’t load.';
      $('stage').textContent = String(e.message || e); return;
    }
    const wt = P.get('topic'); D.chapters.forEach((c, i) => { if (c.id === wt) ci = i; });
    qi = Math.max(0, Math.min(chapter().cards.length - 1, (+P.get('q') || 1) - 1));
    const wa = P.get('alt'); D.voices.forEach((v, i) => { if (v.id === wa) vi = i; });
    $('tabs').innerHTML = D.chapters.map((c, i) => `<button class="vtab" type="button" role="tab" data-c="${i}">${esc(c.tab)}</button>`).join('');
    $('tabs').querySelectorAll('.vtab').forEach(b => b.onclick = () => { ci = +b.dataset.c; qi = 0; stage = 'read'; draw(); sync(); });
    draw(); sync();
  }
  boot();
})();
</script>
</body>
</html>
