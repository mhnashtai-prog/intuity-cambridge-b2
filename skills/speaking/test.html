<!--
═══════════════════════════════════════════════════════════════════════════
  SPEAKING · THE TEST  (23 Nov 2026) — Speaking's front door
  The pupils' verdict (23 Nov): too many gates before the point of a page
  showed. The owner: "A book is immediate" — open a practice book and the
  whole test is on one page, the examiner's lines in order, the candidate's
  turns as [1 minute]. And: practice now is the main offer, everything else
  is secondary ("learn to cook by cooking the egg").
  So Speaking opens HERE: one test, Part 1 → 4, laid out like the book's
  frames and like the Reading full test. One tap and Maya,
  the examiner, begins; the pupil's turns record by themselves and end on
  the clock or on Done; Beatriz is the partner (her recorded model turns).
  The teaching comes AFTER: each Part's review plays your answer next to a
  model and points to the one page that fixes it (the five moves, Maya's
  drills). The old doors (the Part gates, the five moves, the drills, the
  phrases) are all still there, one line down: secondary, never in the way.
  Voices: only recorded lines are played (audio/speaking/manifest.json); a
  line not yet recorded is shown, never read by the phone, so the examiner
  is always Maya (the owner, 24 Nov 2026: Maya is the examiner). Recordings stay in this tab; nothing is uploaded.
  ?stats=1 shows what this phone measured (time to first word, tests, days).
  ONE PART (23 Nov 2026, the owner): the menu's four rings open ?part=N, the
  same page for that Part only: the other Parts in the header, and the footer
  pills, as Writing's: Practise (here) · Structures (the five moves) · Drills
  (Maya's drill for this Part) · Games (the phrase game, this Part's
  phrases). Without ?part it is the whole test (the menu's Full test pill).
═══════════════════════════════════════════════════════════════════════════
-->
<style>
:root{--screen:#F3F1ED;--card:#FAF8F5;--ink:#14110E;--dim:#5C5852;--faint:#8A8378;--line:rgba(20,17,14,.12);
  --caramel:#C2956E;--caramel-ink:#8A5A35;--sage:#708A81;--sage-soft:#8AA79C;--clay:#DD8E58;--rec:#B3261E;
  --anton:'Anton',Impact,sans-serif;--geist:'Geist',system-ui,sans-serif;--mono:'Geist Mono',ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden;background:var(--screen);color:var(--ink);font-family:var(--geist);-webkit-font-smoothing:antialiased}
.header{position:sticky;top:0;z-index:30;background:var(--screen)}
.parts{display:flex;justify-content:center;gap:.25rem;padding:.1rem 0 .55rem;border-bottom:1px solid var(--line)}
.parts button{all:unset;cursor:pointer;font:600 .66rem/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);padding:.5rem .7rem;border-radius:999px}
.parts button.on{background:rgba(118,118,128,.12);color:var(--ink)}   /* 27 Nov 2026: header tabs grey */
.parts button.done{color:var(--sage)}
.parts button:focus-visible{outline:2px solid var(--caramel);outline-offset:2px}
/* 24 Nov 2026 (the owner): on a Part page the row is that Part's topics, every set one tap away */
.parts.topics{justify-content:flex-start;overflow-x:auto;scrollbar-width:none;padding:.1rem .9rem .55rem;scroll-padding:0 .9rem}
.parts.topics::-webkit-scrollbar{display:none}
.parts.topics a{flex:none;white-space:nowrap}
main{position:static;z-index:auto;max-width:34rem;margin:0 auto;padding:1rem 1.1rem 11rem}
.test-kick{display:flex;align-items:center;gap:9px;font:500 .66rem/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--caramel-ink);margin:.4rem 0 .3rem}
.test-kick::before{content:'';width:26px;height:10px;background:var(--caramel)}
h1.test-t{font:400 2.1rem/1 var(--anton);text-transform:uppercase;margin:0 0 .3rem}
.test-sub{font:500 .7rem/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:0 0 1rem}
/* the script, as the book prints it */
.ph{display:flex;align-items:baseline;gap:.6rem;margin:1.6rem 0 .5rem;padding-top:.9rem;border-top:2px solid var(--ink)}
.ph b{font:400 1.25rem/1 var(--anton);text-transform:uppercase}
.ph span{font:500 .68rem/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
/* 23 Nov 2026 (the owner: too pale, uninviting): the script is a card, in full ink until it
   starts; only lines already done fade, the ones to come stay readable */
#script{background:var(--card);padding:.4rem 1rem .6rem;box-shadow:0 14px 30px -20px rgba(35,44,49,.45);border-top:3px solid var(--ink)}
body:not(.one) #script{background:none;box-shadow:none;border-top:0;padding:0}
.ln{display:grid;grid-template-columns:4.2rem 1fr;gap:.5rem;padding:.5rem 0;border-bottom:1px solid var(--line);transition:opacity .3s}
.ln:last-child{border-bottom:0}
.ln .who{font:600 .6rem/1.6 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);padding-top:.12rem}
.ln .tx{font-size:1rem;line-height:1.45}
.ln.ex .who{color:var(--sage)}
.ln.ex .tx{font-weight:500}
.ln.pa .who{color:var(--caramel-ink)}
.ln.pa .tx{color:var(--dim)}
.ln.you .who{color:var(--caramel-ink)}
.ln.you .tx{justify-self:start;font:600 .72rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--caramel-ink);background:rgba(194,149,110,.16);border-radius:999px;padding:.45rem .7rem}
.ln.you .tx b{font-style:normal;color:var(--ink)}
.ln.quiet .tx{color:var(--ink)}
.ln.now{opacity:1}
.ln.now .tx{color:var(--ink)}
.ln.now.you .tx{color:#fff;background:var(--rec)}
.ln.now{background:linear-gradient(90deg,rgba(112,138,129,.10),transparent)}
.ln.past{opacity:.45}
.ln.next{opacity:1}
body.running .ln.next{opacity:.6}
.ln.you .took{display:inline;margin-left:.5rem;color:inherit}
.stg .kp{font-weight:600;color:var(--ink);transition:font-size .25s,background-size .35s,font-weight .25s}
/* 24 Nov 2026 (the owner): X-RAY. Each key phrase lights up as it is said: bolder, bigger, marked */
.stg .kp.lit{font-weight:800;font-size:1.07em;background:linear-gradient(transparent 58%,rgba(194,149,110,.38) 0) no-repeat;background-size:100% 100%;border-radius:2px}
.stg .kp{background:linear-gradient(transparent 58%,rgba(194,149,110,.38) 0) no-repeat;background-size:0 100%}
.stg i{display:inline-block;font:600 .5rem/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;font-style:normal;color:var(--caramel-ink);background:rgba(194,149,110,.14);border-radius:3px;padding:.18rem .3rem;margin-right:.3rem;vertical-align:.15em}
.scaf{margin:-.2rem 0 .3rem 4.7rem;padding:.55rem .7rem;border-left:2px solid rgba(194,149,110,.5);font-size:.9rem;line-height:1.55;color:var(--dim)}
.scaf .by{display:block;font:600 .56rem/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-bottom:.35rem}
.ln.you .mtag{font:600 .6rem/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--sage);margin-right:.3rem}
.ln.you .tx.model{font:inherit;letter-spacing:0;text-transform:none;color:var(--dim);background:none;padding:0;border-radius:0}
.ln .took{display:block;font:500 .66rem/1.3 var(--mono);letter-spacing:.06em;color:var(--sage);font-style:normal;margin-top:.15rem}
.vis{margin:.3rem 0 .6rem 5.1rem}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:.4rem}
.photos figure{margin:0}
.photos img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#E5E1DA}
.photos figcaption{font:500 .58rem/1.3 var(--mono);color:var(--faint);margin-top:.2rem}
.photos.small{max-width:70%}
.qcard{background:var(--card);border-left:3px solid var(--sage);padding:.6rem .8rem;margin-top:.4rem;font-weight:600;font-size:.92rem;line-height:1.4}
.ideas{background:var(--card);padding:.7rem .8rem;box-shadow:0 10px 24px -18px rgba(35,44,49,.35)}
.ideas .q{font:600 .95rem/1.35 var(--geist);text-align:center;padding:.5rem .4rem;margin:0 0 .5rem;border:1.5px solid var(--ink);border-radius:999px}
.ideas ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:.35rem;justify-content:center}
.ideas li{font-size:.82rem;padding:.35rem .6rem;border-radius:999px;background:rgba(112,138,129,.14)}
.skipline{all:unset;cursor:pointer;font:600 .7rem/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--caramel-ink);text-decoration:underline;text-underline-offset:3px}
/* the deck: one control, always in the same place */
.deck{position:fixed;left:0;right:0;bottom:0;z-index:200;background:linear-gradient(to top,var(--screen) 72%,rgba(243,241,237,0));padding:1.6rem 1rem calc(.8rem + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:.45rem}
.pills{display:flex;justify-content:center;gap:.7rem}
.pl{all:unset;display:inline-flex;align-items:center;gap:.65rem;box-sizing:border-box;-webkit-appearance:none;appearance:none;cursor:pointer;
  min-width:9.2rem;justify-content:center;padding:.95rem 1.4rem;border-radius:999px;border:2px solid #C9C1B4;background:var(--card);
  font:700 .95rem/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:#3A3632;transition:border-color .2s,box-shadow .2s,background .2s,color .2s}
.pl .tri{width:0;height:0;border-left:13px solid var(--sage-soft);border-top:8px solid transparent;border-bottom:8px solid transparent}
.pl .dot{width:12px;height:12px;border-radius:50%;background:var(--rec);opacity:.75}
.pl.on{border-color:var(--ink);box-shadow:0 8px 20px -10px rgba(20,17,14,.45);color:var(--ink)}
.pl.on .tri{border-left-color:var(--sage)}
.pl.on .dot{opacity:1}
.pl.busy{opacity:.55}
.pl.rec{background:var(--rec);border-color:var(--rec);color:#fff}
.pl.rec .dot{background:#fff;border-radius:2px;width:11px;height:11px}
.pl[hidden]{display:none}
.pl:focus-visible{outline:2px solid var(--caramel);outline-offset:3px}
.prog{width:min(19.5rem,90%);height:3px;background:rgba(20,17,14,.08);border-radius:2px;margin:.6rem auto 0;overflow:hidden;opacity:0;transition:opacity .2s}
.prog i{display:block;height:100%;width:0;background:var(--rec);transition:width .2s linear}
.deck.rec .prog{opacity:1}
@media(max-width:380px){.pl{min-width:8rem;padding:.85rem 1rem;letter-spacing:.14em}}
@media(prefers-reduced-motion:reduce){.pl,.prog i{transition:none}}
.deck-say{display:none;font:500 .72rem/1.35 var(--mono);letter-spacing:.06em;color:var(--dim);text-align:center;min-height:1.1em;max-width:22rem}
.deck-row{display:flex;gap:.5rem}
.dbtn{all:unset;cursor:pointer;font:600 .8rem/1 var(--geist);padding:.6rem 1rem;border-radius:999px;border:1.5px solid var(--ink)}
.dbtn.fill{background:var(--ink);color:var(--screen)}
.dbtn:focus-visible{outline:2px solid var(--caramel);outline-offset:2px}
.dbtn[hidden]{display:none}
/* secondary: everything that is not the test, one line, never in the way */
.more{margin:2.2rem 0 0;padding-top:.9rem;border-top:1px solid var(--line);font-size:.8rem;color:var(--faint);line-height:2}
.more b{font:600 .6rem/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;display:block;margin-bottom:.2rem}
.more a{display:inline-block;color:var(--dim);text-decoration:none;border-bottom:1px solid var(--line);margin:0 .9rem .2rem 0;white-space:nowrap;line-height:1.5}
/* the review, after the test */
.rv{background:var(--card);padding:1rem 1rem .8rem;margin:1rem 0;box-shadow:0 12px 28px -18px rgba(35,44,49,.35)}
.rv .test-kick{margin-top:0}
.rv h3{font:400 1.45rem/1.05 var(--anton);text-transform:uppercase;margin:.3rem 0 .6rem}
.ans{padding:.6rem 0;border-top:1px solid var(--line)}
.ans .q{font-size:.88rem;font-weight:600;margin:0 0 .35rem}
.bar{position:relative;height:6px;background:rgba(20,17,14,.08);border-radius:3px;margin:.25rem 0 .2rem}
.bar i{position:absolute;top:0;bottom:0;background:rgba(112,138,129,.35)}
.bar u{position:absolute;left:0;top:0;bottom:0;background:var(--ink);text-decoration:none;border-radius:3px}
.secs{font:500 .64rem/1.3 var(--mono);letter-spacing:.06em;color:var(--faint)}
.plays{display:flex;gap:.4rem;margin-top:.45rem;flex-wrap:wrap}
.pb{all:unset;cursor:pointer;font:600 .74rem/1 var(--geist);padding:.45rem .75rem;border-radius:999px;border:1.5px solid var(--ink)}
.pb:disabled{opacity:.35;cursor:default}
.pb:focus-visible{outline:2px solid var(--caramel);outline-offset:2px}
.fix{display:inline-block;margin-top:.7rem;font:600 .82rem/1.2 var(--geist);color:var(--caramel-ink);text-decoration:none;border-bottom:1.5px solid var(--caramel)}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:210;display:flex;justify-content:center;background:var(--screen);border-top:1px solid var(--line);padding:.6rem 1rem calc(.6rem + env(safe-area-inset-bottom))}
.stages{display:flex;gap:.1rem;background:var(--poster-fill,rgba(20,17,14,.06));border-radius:999px;padding:.2rem}
.stage{font:700 .6875rem/1 var(--geist);letter-spacing:.07em;text-transform:uppercase;padding:.55rem .8rem;border-radius:999px;color:var(--poster-faint,rgba(20,17,14,.5));text-decoration:none}
.stage.active{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(20,17,14,.10)}
.stage:focus-visible{outline:2px solid var(--caramel);outline-offset:2px}
@media(max-width:380px){.stage{padding:.5rem .55rem;letter-spacing:.04em}}
body.one .deck{bottom:calc(3.4rem + env(safe-area-inset-bottom))}
body.one main{padding-bottom:13rem}
body.one .header{border-bottom:1px solid var(--line)}
.parts a{all:unset;cursor:pointer;font:600 .66rem/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);padding:.5rem .7rem;border-radius:999px}
.parts a.on{background:rgba(118,118,128,.12);color:var(--ink)}   /* 27 Nov 2026: header tabs grey */
.parts a:not(.on){color:#4A4541}   /* one tone for unselected mode selectors (26 Nov 2026) */
.parts a:focus-visible{outline:2px solid var(--caramel);outline-offset:2px}
.stats{font:500 .7rem/1.6 var(--mono);background:#fff;border:1px dashed var(--faint);padding:.6rem .8rem;margin:.6rem 0}
@media(prefers-reduced-motion:reduce){.ln{transition:none}}
</style>

<body>
<header class="header">
  <div class="header-top">
    <a class="back-link" href="/index.html" target="_top">← Home</a>
    <div class="header-title"><div class="app-title">INTUITY</div><div class="app-subtitle" id="sub">Speaking · Test</div></div>
    <span class="header-spacer">Level <b>B2</b></span>
  </div>
  <nav class="parts" id="parts" aria-label="Parts of the test"></nav>
</header>
<main id="main">
  <div class="test-kick">Cambridge B2 First · Speaking</div>
  <h1 class="test-t" id="tt">Test 1</h1>
  <p class="test-sub">4 parts · about 14 minutes · you, Beatriz, and Maya as the examiner</p>
  <div id="stats"></div>
  <div id="script"></div>
  <div id="review"></div>
  <nav class="more" aria-label="More Speaking">
    <b>Practise one Part</b>
    <a href="/skills/speaking/test.html?part=1">Part 1</a><a href="/skills/speaking/test.html?part=2">Part 2</a><a href="/skills/speaking/test.html?part=3">Part 3</a><a href="/skills/speaking/test.html?part=4">Part 4</a><a href="/skills/speaking/speaking-format.html">How the test works</a>
  </nav>
</main>
<div class="deck" id="deck">
  <!-- 23 Nov 2026 (the owner): two pills, as "▶ How to use": LISTEN (Maya, the examiner, or Beatriz,
       up to your turn; again = hear it again) and SPEAK (records; tap again to stop). The page
       opens on Listen. Nothing else to read. -->
  <div class="pills">
    <button type="button" class="pl on" id="lis"><i class="tri" aria-hidden="true"></i><span>Listen</span></button>
    <button type="button" class="pl" id="spk"><i class="dot" aria-hidden="true"></i><span>Speak</span></button>
  </div>
  <div class="prog" aria-hidden="true"><i id="prog"></i></div>
</div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P=new URLSearchParams(location.search);
const KEY='be2.speakTest';
let ST={}; try{ ST=JSON.parse(localStorage.getItem(KEY)||'{}'); }catch(e){}
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(ST)); }catch(e){} };
const T0=performance.now();
const PART=Math.max(0,Math.min(4,+(P.get('part')||0)||0));
const NAMES={1:'Interview',2:'Long turn',3:'Collaborate',4:'Discuss'};
const CNT=PART?'p'+PART:'done';
const TESTN=(+P.get('test'))||(PART===1?1:((ST[CNT]||0)+1));   /* Part 1 always opens on the model interview */
/* 24 Nov 2026 (the owner): every topic of a Part stays one tap away in the header (?topic=id) */
let TOPIC=P.get('topic')||'', TOPICS=[];
if(TOPIC==='model') TOPIC='city';   /* the Model is now the City interview */
const USE_MODEL=false;   /* 25 Nov 2026: the Model is the City interview, in the Part page and the Full test alike */
function topicOf(list){ if(!PART) return (TESTN-1)%list.length;   /* the Full test: test N takes topic N, round and round */
  const i=list.findIndex(x=>x.id===TOPIC);
  const k=i>=0?i:((TESTN-1)%list.length); TOPIC=list[k].id; return k; }
if(PART){
  document.body.classList.add('one');
  $('parts').classList.add('topics'); $('parts').setAttribute('aria-label','Topics');   /* one Part, one focus: the row holds its topics */
  $('tt').textContent='Part '+PART+' · '+NAMES[PART];
  $('sub').textContent='Speaking · Part '+PART;
  document.querySelector('.test-sub').textContent={1:USE_MODEL?'listen first · Maya, Tomás and Beatriz':'4 questions · about 20 seconds each',2:'your photographs · 1 minute, then Beatriz’s',3:'with Beatriz · discuss, then decide',4:'3 questions · about 40 seconds each'}[PART];
  document.querySelector('.back-link').href='/index.html?openModal=speaking'; document.querySelector('.back-link').textContent='← Speaking';
  document.querySelector('.more').hidden=true;
  /* the footer: tools/speaking-foot.js (the same on Practise, Structures, Drills and Games) */
} else { $('tt').textContent='Test '+TESTN; $('sub').textContent='Speaking · Full test '+TESTN; }
document.title='INTUITY — Speaking '+(PART?'Part '+PART:'test '+TESTN);

/* ── the recordings: only what is recorded is played (the examiner is always Maya) ── */
let MAP={}, VER={};
const norm=t=>String(t||'').toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9' ]+/g,' ').replace(/\s+/g,' ').trim();
const fileOf=t=>MAP[norm(t)];
const url=f=>'/audio/speaking/'+f+(VER[f]?'?v='+VER[f]:'');
/* ONE PLAYER (iPhones let a page play sound only from a tap): it is unlocked by the Start tap,
   and every later line, the examiner's or Beatriz's or a model, plays through it */
const PL=new Audio(); PL.preload='auto'; let AUD=null;
function unlock(){ try{ PL.muted=true; PL.src=url(fileOf(SEQ[1]&&SEQ[1].t)||''); const p=PL.play(); if(p) p.then(()=>{ PL.pause(); PL.muted=false; }).catch(()=>{ PL.muted=false; }); else PL.muted=false; }catch(e){ PL.muted=false; } }
let CUT=null;   /* stopping a line resolves it, so the listening loop never hangs */
/* 24 Nov 2026 (the owner: Part 2 paused in the middle of a minute on the iPhone): a watchdog.
   If the phone stops a line (a slow network, an interruption), it tries once to carry on,
   and if the sound still does not move for 4 seconds, the run goes on to the next line. */
function playText(t){ return new Promise(res=>{ const f=fileOf(t); if(!f) return res(false);
  let last=-1, still=0, retried=false, dog=null;
  const done=v=>{ clearInterval(dog); PL.onpause=null; if(CUT===done) CUT=null; res(v); }; CUT=done;
  AUD=PL; PL.muted=false; PL.onended=()=>done(true); PL.onerror=()=>done(false);
  PL.onpause=()=>{ if(CUT===done&&!PL.ended&&!retried){ retried=true; PL.play().catch(()=>{}); } };
  dog=setInterval(()=>{ if(CUT!==done) return clearInterval(dog);
    if(PL.currentTime!==last){ last=PL.currentTime; still=0; return; }
    if(++still>=4){ if(!retried){ retried=true; still=0; PL.play().catch(()=>{}); } else done(false); } },1000);
  PL.src=url(f); PL.play().catch(()=>done(false)); }); }
/* the next lines are fetched while this one plays, so nothing waits for the network */
const warmed=new Set();
function warm(i){ for(let k=i+1;k<Math.min(SEQ.length,i+4);k++){ const s=SEQ[k]; if(!s) continue;
  const list=s.k==='ex'?[s.t]:s.k==='pa'?(fileOf(s.t.join(' '))?[s.t.join(' ')]:s.t):s.k==='you'?(s.model||[]):[];
  list.forEach(t=>{ const f=fileOf(t); if(f&&!warmed.has(f)){ warmed.add(f); fetch(url(f)).catch(()=>{}); } }); } }
async function playList(list,alive){ for(const t of list){ if(alive&&!alive()) return; await playText(t); } }
function hush(){ if(AUD){ try{ AUD.pause(); AUD.onended=null; }catch(e){} AUD=null; } if(CUT){ const c=CUT; CUT=null; c(false); } }

function nextTopic(){ const i=TOPICS.findIndex(x=>x.id===TOPIC); let n=TOPICS[(i+1)%TOPICS.length]; if(n&&n.id==='model') n=TOPICS[1]; return n?n.id:''; }
/* a seeded shuffle, so Test 3 is always Test 3 */
function rng(seed){ let s=seed*9301+49297; return ()=>(s=(s*9301+49297)%233280)/233280; }
const R=rng(TESTN*7+3), pick=a=>a[Math.floor(R()*a.length)];
function pickN(a,n){ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(R()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b.slice(0,n); }
const segsOf=alt=>((alt&&(alt.turn||alt).segs)||[]).map(s=>s.t);

/* ── the test, as the book's frames: lines in order ── */
let SEQ=[], MODEL1=null, DLG=null, DLG2=null, DLG3=null, DLG4=null, LISTEN_ONLY=false, INTERVIEW=false;
function build(D1,D2,D3,D4){
  const S=[], H=(n,name,mins)=>{ if(!PART) S.push({k:'head',part:n,name,mins}); };   /* one Part: the page title is its heading */
  const ex=(t,part,o)=>S.push(Object.assign({k:'ex',t,part},o||{}));
  const you=(secs,label,part,o)=>S.push(Object.assign({k:'you',secs,label,part},o||{}));
  /* PART 1: four questions from four different chapters */
  if(!PART||PART===1){
  H(1,'Interview','2 minutes');
  const HELLO=()=>ex("Good afternoon. My name's Maya. First of all, we'd like to know something about you.",1);
  /* SET 1 IS THE MODEL INTERVIEW (24 Nov 2026, the owner): Maya asks; Tomás gives the stronger
     answer (played); at Beatriz's turns the pupil speaks, her safe answer under the turn as the
     scaffold, stage by stage (the school's pattern), and in the review as the model. */
  if(MODEL1&&USE_MODEL){
    /* 24 Nov 2026 (the owner): the model plays straight through, no stops; then 'Now you' */
    LISTEN_ONLY=true;
    (MODEL1.intro||[]).forEach(it=>{ if(it.who==='examiner') ex(it.t,1); else S.push({k:'pa',t:[it.t],label:MODEL1.cast[it.who].name,part:1}); });
    MODEL1.turns.forEach(tn=>{ ex(tn.q,1,{q:1});
      S.push({k:'pa',t:tn.stages.map(x=>x.t),stages:tn.stages,label:MODEL1.cast[tn.who].name,part:1,asYou:30,q:tn.q}); });   /* in Speak, these are your turns */
  } else if(PART===1||!PART){
    const ch=D1.chapters[topicOf(D1.chapters)], tp=DLG&&DLG.topics.find(x=>x.id===ch.id);
    const ready=tp&&tp.turns.every(tn=>fileOf(tn.q)&&tn.stages.every(x=>fileOf(x.t)));
    if(ready){   /* 24 Nov 2026 (the owner): every topic is an interview in the school's pattern */
      INTERVIEW=true;
      (DLG.intro||[]).forEach(it=>{ if(it.who==='examiner') ex(it.t,1); else S.push({k:'pa',t:[it.t],label:DLG.cast[it.who].name,part:1}); });
      tp.turns.forEach(tn=>{ ex(tn.q,1,{q:1}); S.push({k:'pa',t:tn.stages.map(x=>x.t),stages:tn.stages,label:DLG.cast[tn.who].name,part:1,asYou:30,q:tn.q}); });
    } else { HELLO();   /* not recorded yet: four of its questions */
    pickN(ch.cards,4).forEach(c=>{ ex(c.question,1,{q:1}); you(30,'about 20 seconds',1,{q:c.question,model:segsOf(c.alts&&c.alts[0])}); }); }
  } else { HELLO();
  pickN(D1.chapters,4).forEach(ch=>{ const c=pick(ch.cards); ex(c.question,1,{q:1});
    you(30,'about 20 seconds',1,{q:c.question,model:segsOf(c.alts&&c.alts[0])}); }); }
  }
  /* PART 2: your photographs, Beatriz's, and a short question about hers */
  if(!PART||PART===2){
  H(2,'Long turn','4 minutes');
  let [t2,t2b]=pickN(D2.tasks,2);
  if(PART===2||!PART){ const k=topicOf(D2.tasks); t2=D2.tasks[k]; t2b=D2.tasks[(k+1)%D2.tasks.length]; }   /* yours, and the next pair for Beatriz */
  /* 24 Nov 2026 (the owner): Part 2 as the exam runs it, Tomás and Beatriz (similarities, differences, speculation) */
  const pA=(PART===2||!PART)&&DLG2&&DLG2.pairs.find(x=>x.id===t2.id), pB=(PART===2||!PART)&&DLG2&&DLG2.pairs.find(x=>x.id===t2b.id);
  const rec=a=>a&&a.every(x=>fileOf(x.t));
  if(pA&&pB&&rec(pA.tomas)&&rec(pA.beatrizFollow)&&rec(pB.beatriz)&&rec(pB.tomasFollow)){
    INTERVIEW=true; const turn=(st,who,secs,q)=>S.push({k:'pa',t:st.map(x=>x.t),stages:st,label:DLG2.cast[who].name,part:2,asYou:secs,q});
    ex("In this part of the test, I'm going to give each of you two photographs. I'd like you to talk about your photographs on your own for about a minute, and also to answer a short question about your partner's photographs.",2);
    ex('Here are your photographs. '+t2.theme,2,{to:'Tomás',vis:{photos:t2.photos,q:t2.question}}); ex(t2.question,2,{q:1});
    turn(pA.tomas,'tomas',60,t2.question); ex('Thank you.',2);
    ex(t2.followUp,2,{to:'Beatriz',q:1}); turn(pA.beatrizFollow,'beatriz',30,t2.followUp); ex('Thank you.',2);
    ex('Here are your photographs. '+t2b.theme,2,{to:'Beatriz',vis:{photos:t2b.photos,q:t2b.question}}); ex(t2b.question,2,{q:1});
    turn(pB.beatriz,'beatriz',60,t2b.question); ex('Thank you.',2);
    ex(t2b.followUp,2,{to:'Tomás',q:1}); turn(pB.tomasFollow,'tomas',30,t2b.followUp); ex('Thank you.',2);
  } else {
  ex("In this part of the test, I'm going to give each of you two photographs. I'd like you to talk about your photographs on your own for about a minute, and also to answer a short question about your partner's photographs.",2);
  ex('Here are your photographs. '+t2.theme,2,{vis:{photos:t2.photos,q:t2.question}});
  ex(t2.question,2,{q:1});
  you(60,'1 minute',2,{q:t2.question,model:segsOf(t2.alts&&t2.alts[0])});
  ex('Thank you.',2);
  ex('Here are your photographs. '+t2b.theme,2,{to:'Beatriz',vis:{photos:t2b.photos,q:t2b.question,small:1}});
  ex(t2b.question,2,{to:'Beatriz'});
  S.push({k:'pa',t:segsOf(t2b.alts&&t2b.alts[0]),label:'Beatriz · 1 minute',part:2,long:1});
  ex('Thank you.',2);
  ex(t2b.followUp,2,{q:1});
  you(30,'about 20 seconds',2,{q:t2b.followUp,model:segsOf(t2b.alts&&t2b.alts[0]&&t2b.alts[0].follow)});   /* the follow-up's recorded model */
  }
  }
  /* PART 3: the task, Beatriz opens, you answer her, then decide (Part 4 takes its topic) */
  const t3=D3.tasks[topicOf(D3.tasks)], alt3=t3.alts[0], turns=(alt3.discuss&&alt3.discuss.turns)||[], dec=(alt3.decide&&alt3.decide.turns)||[];
  if(!PART||PART===3){
  H(3,'Collaborate','4 minutes');
  ex("Now, I'd like you to talk about something together for about two minutes.",3);
  ex(t3.scenario,3,{vis:{ideas:t3.prompts,q:t3.question}});
  ex('First you have some time to look at the task.',3);
  S.push({k:'look',secs:12,part:3});
  ex(t3.talkLine,3);
  /* 24 Nov 2026 (the owner): Part 3 as young people talk; in Speak you are Tomás, Beatriz is your partner */
  const p3=(PART===3||!PART)&&DLG3&&DLG3.tasks.find(x=>x.id===t3.id), all3=p3?p3.discuss.concat(p3.decide):[];
  if(p3&&all3.every(tn=>tn.stages.every(x=>fileOf(x.t)))){
    INTERVIEW=true; const turn=(tn,q)=>S.push({k:'pa',t:tn.stages.map(x=>x.t),stages:tn.stages,label:DLG3.cast[tn.who].name,part:3,asYou:tn.who==='tomas'?25:0,q});
    let last=t3.question; p3.discuss.forEach(tn=>{ turn(tn,'Beatriz: “'+last+'”'); last=tn.stages.map(x=>x.t).join(' '); });
    ex(t3.decideLine,3); last=t3.decide; p3.decide.forEach(tn=>{ turn(tn,'Beatriz: “'+last+'”'); last=tn.stages.map(x=>x.t).join(' '); });
    ex('Thank you.',3);
  } else {
  const A=turns.filter(x=>x.who==='a'), B=turns.filter(x=>x.who==='b');
  for(let i=0;i<3&&i<A.length;i++){
    S.push({k:'pa',t:A[i].segs.map(s=>s.t),label:'Beatriz',part:3});
    you(30,'answer Beatriz',3,{q:'Beatriz: “'+A[i].segs.map(s=>s.t).join(' ').slice(0,90)+'…”',model:B[i]?B[i].segs.map(s=>s.t):[]});
  }
  ex(t3.decideLine,3);
  const dA=dec.filter(x=>x.who==='a'), dB=dec.filter(x=>x.who==='b');
  if(dA[0]){ S.push({k:'pa',t:dA[0].segs.map(s=>s.t),label:'Beatriz',part:3});
    you(40,'decide together',3,{q:t3.decide||'Decide together',model:dB[0]?dB[0].segs.map(s=>s.t):[]}); }
  ex('Thank you.',3);
  } }
  /* PART 4: the same topic as Part 3 where there is one */
  if(!PART||PART===4){
  H(4,'Discuss','4 minutes');
  const ch4=PART===4?D4.chapters[topicOf(D4.chapters)]:(D4.chapters.find(c=>c.id===t3.id)||pick(D4.chapters));
  /* 25 Nov 2026 (the owner): Part 4 discusses, supports and maintains a view; in Speak you are Tomás */
  const p4=(PART===4||!PART)&&DLG4&&DLG4.topics.find(x=>x.id===ch4.id);
  const hand=h=>fileOf(h)?h:'What do you think?';   /* Maya's named handover once recorded */
  if(p4&&p4.questions.every(x=>[x.answer].concat(x.join).every(tn=>tn.stages.every(y=>fileOf(y.t))))){
    INTERVIEW=true; const turn=(tn,secs,q)=>S.push({k:'pa',t:tn.stages.map(x=>x.t),stages:tn.stages,label:DLG4.cast[tn.who].name,part:4,asYou:tn.who==='tomas'?secs:0,q});
    p4.questions.forEach(x=>{ ex(x.question,4,{q:1}); turn(x.answer,45,x.question); ex(hand(x.hand),4);
      let last=x.answer; x.join.forEach(tn=>{ turn(tn,20,DLG4.cast[last.who].name+': “'+last.stages.map(y=>y.t).join(' ')+'”'); last=tn; }); });
  } else
  pickN(ch4.cards,3).forEach(c=>{ ex(c.question,4,{q:1}); you(45,'about 40 seconds',4,{q:c.question,model:segsOf(c.alts&&c.alts[0])}); });
  ex(PART?'Thank you.':'Thank you. That is the end of the test.',4);
  }
  SEQ=S;
}

/* ── the script on the page ── */
function render(){
  const parts=[];
  $('script').innerHTML=SEQ.map((s,i)=>{
    if(s.k==='head') return '<div class="ph" id="L'+i+'" data-part="'+s.part+'"><b>Part '+s.part+'</b><span>'+esc(s.name)+' · '+esc(s.mins)+'</span></div>';
    if(s.k==='ex'){ const rec=!!fileOf(s.t);
      return '<div class="ln ex next'+(rec?'':' quiet')+'" id="L'+i+'"><span class="who">Maya'+(s.to?' → '+esc(s.to):'')+'</span><span class="tx">'+esc(s.t)+'</span></div>'+(s.vis?vis(s.vis):''); }
    if(s.k==='pa') return '<div class="ln pa next" id="L'+i+'"><span class="who">'+esc(s.label.split(' ·')[0])+'</span><span class="tx">'+(s.long?'[1 minute] <button type="button" class="skipline" data-skip="'+i+'">skip</button>':s.stages?staged(s.stages):esc(s.t.join(' ')))+'</span></div>';
    if(s.k==='look') return '<div class="ln quiet next" id="L'+i+'"><span class="who">You</span><span class="tx"><i>[a few seconds to look]</i></span></div>';
    return '<div class="ln you next" id="L'+i+'"><span class="who">You</span><span class="tx">Your turn · '+esc(s.label)+'</span></div>'+
      (s.stages?'<div class="scaf"><span class="by">'+esc(s.by)+'</span>'+staged(s.stages)+'</div>':'');
  }).join('');
  if(!PART){ $('parts').innerHTML=[1,2,3,4].map(n=>'<button type="button" data-p="'+n+'">Part '+n+'</button>').join('');
    $('parts').querySelectorAll('button').forEach(b=>b.onclick=()=>jump(+b.dataset.p)); }
  $('script').querySelectorAll('[data-skip]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); SKIP=+b.dataset.skip; hush(); });
}
/* an answer, stage by stage: the school's pattern, named */

  .sort((a,b)=>b.length-a.length);
const KRX=new RegExp('(^|[^A-Za-z])('+KEYS.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')(?![A-Za-z])','g');
function xray(t,base,total){ let out='', at=0; t.replace(KRX,(m,pre,k,off)=>{ const st=off+pre.length;
  out+=esc(t.slice(at,st))+'<b class="kp" data-at="'+((base+st)/total).toFixed(3)+'">'+esc(k)+'</b>'; at=st+k.length; return m; });
  return out+esc(t.slice(at)); }
function staged(st){ const total=st.reduce((n,x)=>n+x.t.length+1,0); let base=0;
  return st.map(x=>{ const h='<span class="stg"><i>'+(STAGE[x.stage]||x.stage)+'</i>'+xray(x.t,base,total)+'</span>'; base+=x.t.length+1; return h; }).join(' '); }
/* lighting them in time with the voice: the share of the turn already heard */
let XR=null;
function xrayRun(i,stageAt){ xrayStop(); const el=$('L'+i); if(!el) return; const kps=[...el.querySelectorAll('.kp')]; if(!kps.length) return;
  XR=setInterval(()=>{ let f=stageAt!=null?stageAt():(PL.duration&&isFinite(PL.duration)?PL.currentTime/PL.duration:0);
    kps.forEach(k=>{ if(+k.dataset.at<=f+0.03) k.classList.add('lit'); }); },80); }
function xrayStop(i){ if(XR){ clearInterval(XR); XR=null; } if(i!=null){ const el=$('L'+i); if(el) el.querySelectorAll('.kp').forEach(k=>k.classList.add('lit')); } }
function vis(v){

  return '<div class="vis"><div class="ideas"><p class="q">'+esc(v.q)+'</p><ul>'+v.ideas.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div></div>';

/* ── the run: LISTEN plays up to your turn; SPEAK records it ── */
let run=0, STREAM=null, REC=null, ANS=[], firstWord=false, SKIP=-1, FINISHED=false, started=false, ENDTURN=null;
const deck={ lis:$('lis'), spk:$('spk'), prog:$('prog'), el:$('deck') };
/* which pill is lit: the next thing to do */
function lit(which){ deck.lis.classList.toggle('on',which==='lis'); deck.spk.classList.toggle('on',which==='spk'); }
function label(btn,t){ btn.querySelector('span').textContent=t; }
function mark(i){
  SEQ.forEach((s,k)=>{ const el=$('L'+k); if(!el||s.k==='head') return; el.classList.toggle('past',k<i); el.classList.toggle('now',k===i); el.classList.toggle('next',k>i); });
  const el=$('L'+i); if(el) el.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
  const p=(SEQ[i]||{}).part||(i<0?1:4);   /* before the first line, Part 1 (27 Nov 2026: Part 4 lit up, Parts 1–3 looked done) */
  if(!PART&&$('parts')) $('parts').querySelectorAll('button').forEach(b=>{ const n=+b.dataset.p; b.classList.toggle('on',n===p); b.classList.toggle('done',n<p); });
}
function jump(n){ const i=SEQ.findIndex(s=>s.k==='head'&&s.part===n); if(i<0) return; stopAll(); idle(); LAT=i; listen(); }
function stopAll(){ run++; hush(); if(ENDTURN){ const e=ENDTURN; ENDTURN=null; e(true); } }
function wait(ms,my){ return new Promise(r=>{ const t0=Date.now(); const tk=()=>{ if(my!==run||SKIP>=0) return r(); if(Date.now()-t0>=ms) return r(); setTimeout(tk,100); }; tk(); }); }
const nextYou=i=>{ while(i<SEQ.length&&SEQ[i].k!=='you') i++; return i; };
/* the microphone: asked for once, on the first tap, kept open for the Part (nothing is uploaded) */
async function mic(){ if(STREAM&&STREAM.active) return STREAM;
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder)) return null;
  try{ STREAM=await navigator.mediaDevices.getUserMedia({audio:true}); return STREAM; }catch(e){ return null; } }
function begin(){ if(started) return; started=true; document.body.classList.add('running'); mic();   /* every sound starts from a Listen tap: iPhones allow it */
  ST.days=Array.from(new Set((ST.days||[]).concat(new Date().toISOString().slice(0,10)))).slice(-60); save(); }
/* 24 Nov 2026 (the owner): LISTEN plays the whole Part straight through, a model answer in each
   of your turns; SPEAK is the practice: Maya asks, it stops for you, and goes on when you finish */
let MODE='', LAT=0, SAT=0;   /* where Listen and Speak each are */
const isTurn=s=>s.k==='you'||(s.k==='pa'&&s.asYou);
function showModel(i,on){ const s=SEQ[i], el=$('L'+i); if(!el||s.k!=='you') return; const tx=el.querySelector('.tx');
  if(tx.dataset.orig===undefined) tx.dataset.orig=tx.innerHTML;
  const m=on&&s.model&&s.model.length; tx.classList.toggle('model',!!m);
  tx.innerHTML=m?'<span class="mtag">Model</span>'+esc(s.model.join(' ')):tx.dataset.orig; }
function idle(){ MODE=''; deck.lis.classList.remove('busy'); deck.spk.classList.remove('busy'); label(deck.lis,'Listen'); if(!ENDTURN) label(deck.spk,'Speak'); }
/* 24 Nov 2026 (the owner: 'Maya is jumping'): a breath between speakers, as in a real room */
const GAP=(prev,s)=>!prev||prev.k==='head'?0:s.k==='ex'?(prev.k==='ex'?700:1000):s.k==='pa'?(prev.k==='pa'?800:700):s.k==='you'?700:0;
async function playStep(s,i,my){
  if(s.k==='ex'){ const ok=await playText(s.t); if(my!==run) return; if(!ok) await wait(Math.min(3500,1100+s.t.length*22),my); }
  else if(s.k==='pa'){ const whole=s.t.join(' ');   /* the whole turn as one recording, when there is one */
    if(s.t.length>1&&fileOf(whole)){ xrayRun(i); await playText(whole); }
    else { const tot=s.t.reduce((n,x)=>n+x.length+1,0); let n=0, base=0, cur=0;
      xrayRun(i,()=>(base+(PL.duration&&isFinite(PL.duration)?PL.currentTime/PL.duration:0)*cur)/tot);
      for(const t of s.t){ if(my!==run||SKIP===i) break; if(n++) await wait(250,my); cur=t.length+1; await playText(t); base+=cur; } }
    if(my===run) xrayStop(i); else xrayStop(); }
  else if(s.k==='look') await wait(s.secs*1000,my);
}
async function listen(){
  if(FINISHED){ location.href=PART?'?part='+PART+'&topic='+nextTopic():'?test='+(TESTN+1); return; }
  if(MODE==='lis'){ stopAll(); idle(); lit('lis'); return; }   /* a second tap pauses */
  begin(); stopAll(); const my=run; MODE='lis'; deck.spk.classList.remove('busy'); label(deck.spk,'Speak'); deck.lis.classList.add('busy'); lit('lis'); label(deck.lis,'Pause');
  for(let i=LAT>=SEQ.length?0:LAT;i<SEQ.length;i++){ const s=SEQ[i]; LAT=i; mark(i); SKIP=-1; warm(i);
    if(s.k==='head') continue;
    await wait(GAP(SEQ[i-1],s),my); if(my!==run) return;
    if(s.k==='you'){ showModel(i,true);
      if((s.model||[]).some(t=>fileOf(t))) await playList(s.model,()=>my===run&&SKIP!==i); else await wait(1500,my); }
    else await playStep(s,i,my);
    if(my!==run) return; }
  LAT=0; idle(); lit('spk');   /* heard it all: now you */
}
/* one turn of yours: recorded until the clock or a tap ends it */
function record(i,my){ return new Promise(async done=>{
  const s=SEQ[i], secs=s.secs||s.asYou; showModel(i,false);
  const st=await mic(); if(my!==run) return done(false);
  const t0=Date.now(); let chunks=[], r=null;
  if(st){ try{ r=new MediaRecorder(st); REC=r; r.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); }; r.start(); }catch(e){ r=null; } }
  if(!firstWord){ firstWord=true; ST.first=(ST.first||[]).concat(Math.round((performance.now()-T0)/1000)).slice(-20); save(); }
  deck.spk.classList.add('rec'); deck.el.classList.add('rec'); lit('spk');
  const fmt=k=>Math.floor(k/60)+':'+String(k%60).padStart(2,'0');
  label(deck.spk,'0:00');
  const tick=setInterval(()=>{ const t=(Date.now()-t0)/1000; deck.prog.style.width=Math.min(100,t/secs*100)+'%'; label(deck.spk,fmt(Math.floor(t))); if(t>=secs&&ENDTURN){ const e=ENDTURN; ENDTURN=null; e(false); } },200);
  ENDTURN=(dropped)=>{ clearInterval(tick); deck.spk.classList.remove('rec'); deck.el.classList.remove('rec'); deck.prog.style.width='0'; label(deck.spk,'Pause');
    const took=Math.round((Date.now()-t0)/1000);
    const keep=u=>{ if(dropped) return done(false);
      ANS.push({part:s.part,q:s.q,secs:took,target:secs,model:s.k==='pa'?s.t:(s.model||[]),url:u});
      const el=$('L'+i); if(el) el.querySelector('.tx').insertAdjacentHTML('beforeend','<span class="took">✓ '+took+' s</span>');
      done(true); };
    if(r&&r.state==='recording'){ r.onstop=()=>keep(URL.createObjectURL(new Blob(chunks,{type:r.mimeType||'audio/webm'}))); try{ r.stop(); }catch(e){ keep(null); } } else keep(null);
  };
}); }
async function speak(){
  if(ENDTURN){ const e=ENDTURN; ENDTURN=null; e(false); return; }   /* done talking: on to Maya */
  if(MODE==='spk'){ stopAll(); idle(); lit('spk'); return; }          /* a tap while Maya talks pauses */
  if(FINISHED) return;
  begin(); stopAll(); const my=run; MODE='spk'; deck.lis.classList.remove('busy'); label(deck.lis,'Listen'); deck.spk.classList.add('busy'); lit('spk'); label(deck.spk,'Pause');
  SEQ.forEach((x,k)=>showModel(k,false)); const SAT0=SAT;
  for(let i=SAT;i<SEQ.length;i++){ const s=SEQ[i]; SAT=i; mark(i); SKIP=-1; warm(i);
    if(s.k==='head') continue;
    if(i>SAT0) await wait(GAP(SEQ[i-1],s),my); if(my!==run) return;
    if(isTurn(s)){ const ok=await record(i,my); if(my!==run||!ok) return; SAT=i+1; if(MODE==='spk') label(deck.spk,'Pause'); continue; }
    await playStep(s,i,my); if(my!==run) return; }
  SAT=SEQ.length; idle(); finish();
}
deck.lis.onclick=()=>listen();
/* 24 Nov 2026 (the owner: 'it continues on my smart watch'): the iPhone shows any page's sound
   in Now Playing (Lock Screen, Control Centre, Apple Watch). Name it, and make its buttons
   do what the pills do, so a pause there is a real pause and never fought by the watchdog. */
if('mediaSession' in navigator){ try{
  navigator.mediaSession.metadata=new MediaMetadata({title:PART?'Speaking · Part '+PART+' · '+NAMES[PART]:'Speaking · Full test',artist:'Maya, Tomás and Beatriz',album:'INTUITY · Cambridge B2'});
  navigator.mediaSession.setActionHandler('pause',()=>{ const m=MODE; if(m&&!ENDTURN){ stopAll(); idle(); lit(m); } });
  navigator.mediaSession.setActionHandler('play',()=>{ if(!MODE&&!ENDTURN&&!FINISHED) listen(); });
  ['seekbackward','seekforward','previoustrack','nexttrack'].forEach(a=>{ try{ navigator.mediaSession.setActionHandler(a,null); }catch(e){} });
}catch(e){} }
deck.spk.onclick=()=>speak();
/* ── the review: your answers next to a model, and the one page that fixes each Part ── */
const FIX={1:['Practise Part 1: answer, reason, example','/skills/speaking/five.html?part=1'],2:['Practise the long turn: compare, guess, answer','/skills/speaking/five.html?part=2'],
  3:['Practise Part 3: start, react, decide','/skills/speaking/five.html?part=3'],4:['Practise Part 4: opinion, reason, the other side','/skills/speaking/five.html?part=4']};
const NAME={1:'Interview',2:'Long turn',3:'Collaborate',4:'Discuss'};
function finish(){
  stopAll(); FINISHED=true; deck.lis.classList.remove('busy'); label(deck.lis,'Next'); lit('lis'); deck.spk.hidden=true;
  ST[CNT]=Math.max(ST[CNT]||0,TESTN); save();
  $('review').innerHTML='<div class="ph"><b>'+(PART?'Your answers':'Your test')+'</b><span>listen back</span></div>'+[1,2,3,4].map(n=>{
    const A=ANS.filter(a=>a.part===n); if(!A.length) return '';
    const short=A.filter(a=>a.secs<a.target*.6).length;
    return '<section class="rv"><div class="test-kick">Part '+n+' · '+NAME[n]+'</div><h3>'+(short?short+' answer'+(short>1?'s':'')+' too short':'Good length')+'</h3>'+
      A.map((a,k)=>{ const mx=a.target*1.3, pc=x=>Math.min(100,x/mx*100);
        return '<div class="ans"><p class="q">'+esc(a.q)+'</p><div class="bar"><i style="left:'+pc(a.target*.6)+'%;width:'+(pc(a.target)-pc(a.target*.6))+'%"></i><u style="width:'+pc(a.secs)+'%"></u></div>'+
        '<span class="secs">you: '+a.secs+' s · aim: '+Math.round(a.target*.6)+'–'+a.target+' s</span><div class="plays">'+
        '<button type="button" class="pb" data-me="'+ANS.indexOf(a)+'"'+(a.url?'':' disabled')+'>▶ You</button>'+
        '<button type="button" class="pb" data-model="'+ANS.indexOf(a)+'"'+(a.model.some(t=>fileOf(t))?'':' disabled')+'>▶ A model</button></div></div>'; }).join('')+
      '<a class="fix" href="'+FIX[n][1]+'">'+FIX[n][0]+' →</a></section>';
  }).join('');
  $('review').querySelectorAll('[data-me]').forEach(b=>b.onclick=()=>{ hush(); AUD=PL; PL.onended=null; PL.src=ANS[+b.dataset.me].url; PL.play().catch(()=>{}); });
  $('review').querySelectorAll('[data-model]').forEach(b=>b.onclick=()=>{ hush(); run++; const my=run; playList(ANS[+b.dataset.model].model,()=>my===run); });
  $('review').scrollIntoView({behavior:'smooth'});
  if(STREAM) STREAM.getTracks().forEach(t=>t.stop());
}

/* ── what this phone measured (?stats=1) ── */
if(P.get('stats')==='1'){ const f=ST.first||[];
  $('stats').innerHTML='<div class="stats">Seconds from opening to first word: '+(f.length?f.join(', '):'none yet')+'<br>Tests finished: '+(ST.done||0)+'<br>Days used: '+((ST.days||[]).length)+' ('+((ST.days||[]).slice(-7).join(', ')||'—')+')</div>'; }

/* ── load ── */
const J=u=>fetch(u).then(r=>r.json());
Promise.all([J('/audio/speaking/manifest.json'),J('/skills/speaking/data/part1-answers.json'),J('/skills/speaking/data/part2-turn.json'),J('/skills/speaking/data/part3-talk.json'),J('/skills/speaking/data/part4-views.json'),J('/skills/speaking/data/part1-model.json').catch(()=>null),J('/skills/speaking/data/part1-dialogues.json').catch(()=>null),J('/skills/speaking/data/part2-dialogues.json').catch(()=>null),J('/skills/speaking/data/part3-dialogues.json').catch(()=>null),J('/skills/speaking/data/part4-dialogues.json').catch(()=>null)])
.then(([m,d1,d2,d3,d4,pm,dl,dl2,dl3,dl4])=>{ MAP=m.lines||{}; VER=m.v||{}; MODEL1=pm; DLG=dl; DLG2=dl2; DLG3=dl3; DLG4=dl4; build(d1,d2,d3,d4); render(); mark(-1);
  /* the first line is ready before the tap, so the examiner starts at once */
  const f=fileOf(SEQ[1]&&SEQ[1].t); if(f){ const a=new Audio(); a.preload='auto'; a.src=url(f); }
  if(!PART&&$('parts')) $('parts').querySelectorAll('button')[0].classList.add('on');
  if(PART){ TOPICS=({1:d1.chapters,2:d2.tasks,3:d3.tasks,4:d4.chapters})[PART].map(x=>({id:x.id,tab:x.tab}));
    if(INTERVIEW) document.querySelector('.test-sub').textContent=({1:'Maya, Tomás and Beatriz · 6 questions',2:'Tomás and Beatriz · a minute each, then a short question',3:'Tomás and Beatriz · discuss, then decide · in Speak you are Tomás',4:'Tomás and Beatriz · give, support and hold a view · in Speak you are Tomás'})[PART];
    $('parts').innerHTML=TOPICS.map(x=>'<a href="?part='+PART+'&topic='+x.id+'"'+(x.id===TOPIC?' class="on" aria-current="page"':'')+'>'+esc(x.tab)+'</a>').join('');
    const on=$('parts').querySelector('.on'); if(on) $('parts').scrollLeft=on.offsetLeft-$('parts').clientWidth/2+on.clientWidth/2; } })
.catch(()=>{ $('script').innerHTML='<p>The test could not load. Check your connection and try again.</p>'; });
})();
