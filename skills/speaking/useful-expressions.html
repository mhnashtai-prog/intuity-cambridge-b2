<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F3F1ED">
<title>INTUITY — Useful Expressions</title>
   
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;900&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=7">

<style>
/* ═══════════════════════════════════════════════════════════════════════
   USEFUL EXPRESSIONS — THE DRILL

   Replaces speaking-slides-multi-levels/speaking-slides.html, retired
   whole: dark glass, neumorphic insets, a B1/B2/C2 level toggle, three
   unrelated fonts, no shell. None of that carries forward.

   WHY THIS PAGE STILL EARNS A PLACE. The hub's part-cards already show
   every function's phrases as a browsable list — so a second copy of the
   same content in the same shape would be pure duplication. This page is
   not that: it is a DRILL, one item full-screen at a time, built for
   repetition and for a teacher projecting a single phrase to a room. Same
   underlying phrases in one tab, genuinely different content (model
   answers to Part 4-style topics) in the other.

   B2 ONLY. The old toggle switched between B1/B2/C2 decks; the app itself
   only ever shows LEVEL B2 in its own header. Keeping a level switch here
   that does not exist anywhere else in the product was the one thing in
   the old file most worth cutting outright rather than restyling.

   TWO TABS, TWO SOURCES. Functions pulls the same data/speaking-phrases.
   json the hub cards already use — one phrase at a time instead of a list,
   with a small function-picker above the deck since 7 functions and 97
   phrases cannot run as one undifferentiated sequence the way 10 flat
   topics can. Topics keeps fetching the original external JSON: that
   content (full model-answer sentences for Planet, Cities, Work, and so
   on) exists nowhere else in the app, so nothing here is copied twice.
   ═══════════════════════════════════════════════════════════════════════ */

.header{position:sticky;padding-bottom:.5rem}
.header::after{display:none}

body{min-height:100dvh;display:flex;flex-direction:column}

/* ── THE SUB-TABS ────────────────────────────────────────────────────────
   Functions / Topics. Styled exactly like the shell's own .vtab set-tabs
   row (see intuity-shell.css §6) rather than invented fresh, so a student
   who has used the grammar pages' EXPLORE/PRACTICE/QUIZ tabs already knows
   how these behave. */
.drill-tabs{display:flex;justify-content:center;gap:.3rem;
  padding:1rem var(--gutter) 0}
.drill-tab{font-family:var(--f-display);font-size:.68rem;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;padding:.4rem .9rem;
  border:none;border-radius:var(--r-chip);color:var(--faint);
  background:none;cursor:pointer;transition:color .2s,background .15s}
@media(hover:hover){ .drill-tab:hover{color:var(--sentence);background:rgba(43,33,41,.04)} }
.drill-tab.active{color:var(--tile-ink);font-weight:700;background:var(--tile-bg)}

/* The function picker, shown only on the Functions tab. Same chip family
   as everywhere else in the product — a .tile is a .tile whether it is
   picking a part of speech or a function. */
.fn-picker{display:flex;flex-wrap:wrap;justify-content:center;gap:.4rem;
  padding:1rem var(--gutter) 0;max-width:var(--w-read);margin:0 auto}
.fn-picker button{font-family:var(--f-display);font-size:.72rem;font-weight:600;
  padding:.4rem .8rem;border:none;border-radius:var(--r-chip);
  background:var(--tile-bg);color:var(--tile-ink);cursor:pointer;
  transition:background .15s,transform .1s cubic-bezier(.2,.8,.2,1)}
.fn-picker button.active{background:var(--accent);color:#fff}
.fn-picker button:active{transform:scale(.96)}
   .fn-picker[hidden]{display:none}

/* ── THE STAGE ───────────────────────────────────────────────────────────
   Flat paper, one hairline, no shadow, no blur — the .poster idiom (see
   intuity-shell.css §13), not the old file's inset-shadow glass. The
   giant answer is the one deliberately oversized thing on the page;
   everything around it stays quiet so it stays the thing a student's eye
   lands on first. */
main.stage{flex:1;display:flex;flex-direction:column;align-items:center;
  padding:1.2rem var(--gutter) 2.5rem;min-height:0}
.deck{width:100%;max-width:var(--w-sheet);flex:1;min-height:0;
  display:flex;flex-direction:column;background:var(--card);
  border-radius:var(--r-sheet);padding:clamp(1.5rem,5vw,3rem);
  overflow:hidden}

.deck-top{display:flex;align-items:baseline;justify-content:space-between;
  gap:1rem;padding-bottom:.9rem;border-bottom:1px solid var(--poster-rule);
  font-family:var(--f-mono);font-size:.62rem;letter-spacing:.08em;
  text-transform:uppercase;color:var(--faint)}
.deck-top b{color:var(--accent-ink);font-weight:700}

.deck-body{flex:1;min-height:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  gap:1.4rem;overflow-y:auto;padding:2rem 0}

.deck-context{font-size:.95rem;color:var(--dim);line-height:1.5;max-width:38rem}

.deck-answer{font-family:'Anton',Impact,var(--f-display),sans-serif;
  font-weight:400;letter-spacing:.005em;line-height:1.08;color:var(--poster-ink);
  font-size:clamp(1.7rem,5.5vw,3rem);max-width:42rem}
.deck-answer .accent{color:var(--accent-ink)}
   .deck-answer.long{font-family:var(--f-display);font-weight:600;
  letter-spacing:var(--track-display);line-height:1.5;
  font-size:clamp(1.05rem,2.6vw,1.35rem);max-width:38rem}
.deck-extra{font-size:.95rem;line-height:1.6;color:var(--dim);max-width:38rem;
  border-top:1px solid var(--poster-rule);padding-top:1rem}
.deck-extra b{color:var(--ink);font-weight:600}
.fn-picker button:disabled{opacity:.4;cursor:default}

.deck-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:.45rem;
  max-width:36rem}
.deck-chips span{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.06em;
  text-transform:uppercase;color:var(--faint);
  background:var(--poster-fill);border-radius:var(--r-field);
  padding:.35rem .65rem}
.deck-chips span.bank{background:none;box-shadow:inset 0 0 0 1px var(--rule)}

/* Nav row — same shape as speaking-format.html's .gal-nav, so the two
   pages behave alike even though this one is a full page, not a card. */
.deck-nav{display:flex;align-items:center;justify-content:space-between;
  gap:.6rem;padding-top:.9rem;border-top:1px solid var(--poster-rule)}
.deck-arrow{border:none;background:none;padding:.4rem .6rem;cursor:pointer;
  font-size:1.1rem;line-height:1;color:var(--faint);transition:color .15s}
.deck-arrow:disabled{color:var(--rule);cursor:default}
@media(hover:hover){ .deck-arrow:not(:disabled):hover{color:var(--accent-ink)} }
.deck-dots{display:flex;gap:.34rem;flex-wrap:wrap;justify-content:center}
.deck-dots button{width:6px;height:6px;border-radius:50%;border:none;padding:0;
  cursor:pointer;background:var(--rule);transition:background .2s,transform .2s}
.deck-dots button.on{background:var(--accent-ink);transform:scale(1.35)}

.deck-msg{font-size:.85rem;color:var(--dim);text-align:center;margin:auto}
</style>
</head>
<body>

<header class="header">
  <div class="header-top">
    <a class="back-link" href="/index.html?openModal=speaking" target="_top">← Speaking</a>
    <div class="header-title">
      <div class="app-title">INTUITY</div>
      <div class="app-subtitle">Useful expressions</div>
    </div>
    <span class="header-spacer">Level <b>B2</b></span>
  </div>
 <nav class="mode-selector" aria-label="Speaking sections">
  <a class="mode-btn" href="speaking-format.html">Hub</a>
  <a class="mode-btn" href="part1.html">Part 1</a>
  <a class="mode-btn" href="part2-turn.html">Part 2</a>
  <a class="mode-btn" href="part3-talk.html">Part 3</a>
  <a class="mode-btn" href="part4-views.html">Part 4</a>
  <span class="mode-btn active" aria-current="page">Slides</span>
</nav>
</header>

<nav class="drill-tabs" id="drillTabs">
  <button class="drill-tab active" type="button" data-tab="functions">Functions</button>
  <button class="drill-tab" type="button" data-tab="topics">Topics</button>
</nav>

<div class="fn-picker" id="fnPicker" hidden></div>

<main class="stage">
  <div class="deck">
    <div class="deck-top">
      <span id="deckLabel">Loading…</span>
      <span id="deckCounter"></span>
    </div>
    <div class="deck-body" id="deckBody">
      <p class="deck-msg">Loading…</p>
    </div>
    <div class="deck-nav">
      <button class="deck-arrow" id="prevBtn" type="button" aria-label="Previous">&larr;</button>
      <div class="deck-dots" id="deckDots"></div>
      <button class="deck-arrow" id="nextBtn" type="button" aria-label="Next">&rarr;</button>
    </div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

/* SOURCES. Everything comes from files the app already has.
   Functions: the shared phrase corpus.
   Topics: the same answer files the Part pages read. */
const PHRASES_URL = 'data/speaking-phrases.json';
const PART_URL = {
  1: 'data/part1-answers.json',
  /* 2: 'data/…',  add when Part 2's file is wired in */
  /* 3: 'data/…',  add when Part 3's file is wired in */
  4: 'data/part4-views.json'
};
const PART_LABEL = { 1:'Interview', 2:'Long turn', 3:'Collaborate', 4:'Discuss' };

let PH = null;
let PARTS = {};            // PARTS[n] = that part's JSON, once loaded
let tab = 'functions';     // 'functions' | 'topics'
let fnKey = null;          // Functions tab: current function
let partKey = 0;           // Topics tab: 0 = all four parts, else 1-4
let at = 0;

function fnList(){ return PH && PH.functions ? Object.keys(PH.functions) : []; }

function functionSlides(key){
  const f = PH && PH.functions ? PH.functions[key] : null;
  if (!f) return [];
  return f.phrases.map(function(p){
    const chips = [];
    if (p.mouth && p.mouth !== 'both') chips.push({ text: p.mouth.toUpperCase(), bank:false });
    if (p.from === 'bank') chips.push({ text: 'wider bank, not in a model turn', bank:true });
    return {
      context: f.when ? f.when.charAt(0).toUpperCase() + f.when.slice(1) : '',
      answerHtml: p.t,
      chips
    };
  });
}

/* ── TOPICS: the whole answer, expressions marked ────────────────────── */
function marked(seg){
  let t = esc(seg.t);
  (seg.marks || []).slice().sort((a, b) => b.length - a.length).forEach(m => {
    const e = esc(m).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    t = t.replace(new RegExp('(?![^<]*>)(' + e + ')'), '<span class="accent">$1</span>');
  });
  return t;
}

function moveChips(D, segs){
  const used = {};
  segs.forEach(s => { used[s.m] = 1; });
  return Object.keys(D.moves || {}).filter(k => used[k])
    .map(k => ({ text: D.moves[k].name, bank:false }));
}

/* One builder per part, each reading its own file the way that Part's page does. */
const BUILD = {
  1(D){
    const vid = D.voices[0].id;                         // the life Part 1 opens on
    return D.topics.map(t => {
      const L = t.lives[vid].levels;
      const segs = L[L.length - 2];                     // four moves, same as Listen
      return { context: esc(t.question),
               answerHtml: segs.map(marked).join(' '),
               chips: [{ text:t.tab, bank:false }].concat(moveChips(D, segs)) };
    });
  },
  4(D){
    return D.topics.map(t => {
      const L = t.levels[t.levels.length - 1];
      const mine   = L.filter(s => s.m !== 'p');
      const theirs = L.filter(s => s.m === 'p');
      return { context: esc(t.question),
               answerHtml: mine.map(marked).join(' '),
               extra: theirs.length
                 ? '<b>' + esc(t.handover) + '</b><br>' + theirs.map(marked).join(' ') : '',
               chips: [{ text:t.tab, bank:false }].concat(moveChips(D, mine)) };
    });
  }
};

function topicSlides(){
  const keys = partKey ? [partKey] : [1, 2, 3, 4];
  const out = [];
  keys.forEach(k => {
    if (!PARTS[k] || !BUILD[k]) return;
    try {
      BUILD[k](PARTS[k]).forEach(s => {
        s.long = true;
        s.chips.unshift({ text: 'Part ' + k + ' · ' + PART_LABEL[k], bank:false });
        out.push(s);
      });
    } catch (e) { console.warn('Part ' + k + ' did not build', e); }
  });
  return out;
}

function currentSlides(){
  return tab === 'functions' ? functionSlides(fnKey) : topicSlides();
}

function currentLabel(){
  if (tab === 'topics') return partKey ? 'Part ' + partKey + ' · ' + PART_LABEL[partKey] : 'All four parts';
  const f = PH && fnKey ? PH.functions[fnKey] : null;
  return f ? f.label : 'Functions';
}

/* ── RENDER ──────────────────────────────────────────────────────────── */
function render(){
  const slides = currentSlides();
  const body = $('deckBody');

  $('deckLabel').textContent = currentLabel();

  if (!slides.length){
    body.innerHTML = '<p class="deck-msg">' +
      (tab === 'topics' ? 'No answers loaded yet.' : 'Nothing to show yet.') + '</p>';
    $('deckCounter').textContent = '';
    $('deckDots').innerHTML = '';
    $('prevBtn').disabled = true;
    $('nextBtn').disabled = true;
    return;
  }

  at = Math.max(0, Math.min(slides.length - 1, at));
  const s = slides[at];

  $('deckCounter').textContent = (at + 1) + ' / ' + slides.length;
  body.innerHTML =
    (s.context ? '<p class="deck-context">' + s.context + '</p>' : '') +
    '<p class="deck-answer' + (s.long ? ' long' : '') + '">' + s.answerHtml + '</p>' +
    (s.extra ? '<p class="deck-extra">' + s.extra + '</p>' : '') +
    (s.chips.length ? '<div class="deck-chips">' + s.chips.map(function(c){
        return '<span class="' + (c.bank ? 'bank' : '') + '">' + c.text + '</span>';
      }).join('') + '</div>' : '');

  $('deckDots').innerHTML = slides.map(function(_, i){
    return '<button type="button" data-i="' + i + '" aria-label="Item ' + (i + 1) + '"></button>';
  }).join('');
  Array.prototype.forEach.call($('deckDots').children, function(b, i){
    b.classList.toggle('on', i === at);
    b.addEventListener('click', function(){ at = i; render(); });
  });

  const loop = tab === 'topics';               // Topics is the loop: it never dead-ends
  $('prevBtn').disabled = !loop && at === 0;
  $('nextBtn').disabled = !loop && at === slides.length - 1;
}

/* One picker row, two meanings: a function on Functions, a part on Topics. */
function renderPicker(){
  const picker = $('fnPicker');
  let items;
  if (tab === 'functions'){
    if (!PH){ picker.hidden = true; return; }
    items = fnList().map(k => ({ key:k, label:PH.functions[k].label, on:k === fnKey, off:false }));
  } else {
    items = [{ key:'0', label:'All four parts', on:partKey === 0, off:false }].concat(
      [1, 2, 3, 4].map(n => ({ key:String(n), label:'Part ' + n, on:partKey === n, off:!PARTS[n] })));
  }
  picker.hidden = false;
  picker.innerHTML = items.map(function(i){
    return '<button type="button" data-k="' + i.key + '"' +
      (i.on ? ' class="active"' : '') + (i.off ? ' disabled' : '') + '>' + i.label + '</button>';
  }).join('');
  Array.prototype.forEach.call(picker.children, function(b){
    b.addEventListener('click', function(){
      if (tab === 'functions') fnKey = b.dataset.k; else partKey = +b.dataset.k;
      at = 0; renderPicker(); render();
    });
  });
}

/* ── TABS AND NAVIGATION ─────────────────────────────────────────────── */
$('drillTabs').addEventListener('click', function(e){
  const b = e.target.closest('.drill-tab');
  if (!b) return;
  tab = b.dataset.tab; at = 0;
  Array.prototype.forEach.call($('drillTabs').children, function(x){
    x.classList.toggle('active', x === b);
  });
  renderPicker();
  render();
});

function go(d){
  const n = currentSlides().length;
  if (!n) return;
  at = tab === 'topics' ? (at + d + n) % n                 // wraps: last goes back to first
                        : Math.max(0, Math.min(n - 1, at + d));
  render();
}
$('prevBtn').addEventListener('click', function(){ go(-1); });
$('nextBtn').addEventListener('click', function(){ go(1); });
addEventListener('keydown', function(e){
  if (e.key === 'ArrowRight') go(1);
  if (e.key === 'ArrowLeft')  go(-1);
});

/* ── BOOT ────────────────────────────────────────────────────────────── */
const load = url => fetch(url).then(r => r.ok ? r.json() : null).catch(() => null);
const partNums = Object.keys(PART_URL);
Promise.all([load(PHRASES_URL)].concat(partNums.map(k => load(PART_URL[k])))).then(function(res){
  PH = res[0];
  partNums.forEach(function(k, i){ PARTS[k] = res[i + 1]; });
  if (PH && PH.functions) fnKey = fnList()[0] || null;
  renderPicker();
  render();
});
</script>
</body>
</html>
