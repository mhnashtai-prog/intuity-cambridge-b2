<style>
/* ═══════════════════════════════════════════════════════════════════════
   SPEAKING · USEFUL EXPRESSIONS — LIST AND POSTER

   Both views read the four Parts' own files, so the phrase bank, the
   models and this page can never disagree.

   LIST · each Part's phrase bank under its own headings. Every phrase
   shows how many model lines use it; tap it for up to three of those
   lines — a small concordance, straight from the corpus.

   POSTER · one per Part: the shape, the timing, the frame, the bank and
   one model with its expressions in the accent. On screen it is a card;
   printed, it is an A4 page. "All four parts" prints all four.
   ═══════════════════════════════════════════════════════════════════════ */
:root{ --accent:#DD8E58; --accent-ink:#9A5A2C; --bg:var(--screen,var(--page-bg,#F3F1ED)); }
.header{position:sticky;top:0;z-index:20;background:var(--bg);padding-bottom:.4rem}
.header::after{opacity:0;transition:opacity .2s ease;width:100%}
body.scrolled .header::after{opacity:1}
.wrap{max-width:52rem;margin:0 auto;padding:.8rem var(--gutter,1rem) 4rem}
.parts-row{display:flex;justify-content:center;margin:.5rem 0 .2rem;overflow-x:auto;scrollbar-width:none}
.parts-row::-webkit-scrollbar{display:none}
@media(max-width:420px){ .parts-row .seg button{padding:.34rem .7rem} }
.stage-row{display:flex;justify-content:center;gap:.6rem;align-items:center;margin:.4rem 0 1.1rem;flex-wrap:wrap}

/* ── LIST · the Collocations card ────────────────────────────────────────
   One card per group of the bank, built from the shell's .poster paper:
   the caramel kicker, the Anton headline, then phrase left and a real model
   line right — read straight down, like a collocation list. A phrase the
   models use carries the caramel underline; tap the row for more lines. */
.bank{display:flex;flex-direction:column;gap:.6rem}
.part-hd{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;
  padding:.4rem 0 .6rem;margin-top:.6rem;border-bottom:1px solid var(--rule);
  font-family:var(--f-display);font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.part-hd b{font-family:var(--f-mono);font-weight:400;font-size:0.6875rem;letter-spacing:.04em;text-transform:none;color:var(--faint)}
.lcard .poster-head{margin-bottom:.35rem}
.lcard .gnote{font-size:.86rem;line-height:1.5;color:var(--poster-body);margin:0 0 .6rem}
.cols{display:flex;flex-direction:column}
.col{display:grid;grid-template-columns:minmax(8.5rem,.9fr) 1.6fr;gap:.15rem .9rem;align-items:baseline;padding:.5rem 0;
  border:none;background:none;width:100%;text-align:left;font:inherit;cursor:pointer;color:inherit}
.col + .col{border-top:1px solid var(--poster-rule)}
.col .w{font-family:var(--f-display);font-weight:700;font-size:.98rem;color:var(--poster-ink);justify-self:start}
.col.used .w{box-shadow:inset 0 -1px 0 var(--caramel)}
.col .eg{font-size:.86rem;line-height:1.55;color:var(--poster-body)}
.col .eg b{font-weight:600;color:var(--poster-ink)}
.col .eg .free{color:var(--poster-faint);font-style:italic}
.col .more{display:none;grid-column:2;font-size:.82rem;line-height:1.5;color:var(--poster-body)}
.col .more p{margin:.35rem 0 0}
.col .more .src{display:block;font-family:var(--f-mono);font-size:0.6875rem;letter-spacing:.08em;text-transform:uppercase;color:var(--poster-faint)}
.col .src0{display:block;font-family:var(--f-mono);font-size:0.6875rem;letter-spacing:.08em;text-transform:uppercase;color:var(--poster-faint);margin-top:.1rem}
.col.open .more{display:block}
.col .n{font-family:var(--f-mono);font-size:0.6875rem;color:var(--poster-faint);margin-left:.35rem}
.col:focus-visible{outline:2px solid var(--caramel);outline-offset:2px}
@media(max-width:520px){ .col{grid-template-columns:1fr} .col .more{grid-column:1} }

/* ── POSTER ────────────────────────────────────────────────────────────── */
.tools{display:flex;justify-content:flex-end;margin:0 0 .8rem}
.print-btn{font-family:var(--f-display);font-size:.72rem;font-weight:600;color:var(--sentence);background:var(--tile-bg);
  border:none;border-radius:999px;padding:.5rem 1rem;cursor:pointer}
@media(hover:hover){ .print-btn:hover{background:var(--tile-bg-press);color:var(--ink)} }
.sheetp{background:var(--card,#FAF8F5);border:1px solid var(--rule);padding:1.4rem 1.4rem 1.2rem;margin:0 0 1.6rem;
  box-shadow:0 12px 28px -18px rgba(35,44,49,.35);color:var(--ink)}
.po-top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;border-bottom:2px solid var(--ink);padding-bottom:.7rem;margin-bottom:1rem}
.po-kick{font-family:var(--f-mono);font-size:0.6875rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink);margin:0 0 .25rem}
.po-title{font-family:var(--f-display);font-weight:900;font-size:clamp(1.6rem,5vw,2.3rem);line-height:1;letter-spacing:-.02em;margin:0}
.po-sub{font-size:.9rem;color:var(--dim);margin:.35rem 0 0}
.po-time{flex:none;text-align:right;font-family:var(--f-mono);font-size:0.6875rem;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.po-time b{display:block;font-family:var(--f-display);font-size:1.4rem;letter-spacing:0;color:var(--ink);font-weight:800}
.po-grid{display:grid;grid-template-columns:1fr;gap:1.1rem}
@media(min-width:720px){ .po-grid{grid-template-columns:1.05fr 1fr} }
.po-sec h4{font-family:var(--f-mono);font-size:0.6875rem;font-weight:400;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);
  margin:0 0 .45rem;padding-bottom:.3rem;border-bottom:1px solid var(--rule)}
.shape{display:flex;flex-wrap:wrap;gap:.3rem;margin:0 0 .3rem}
.shape span{font-family:var(--f-display);font-size:.74rem;font-weight:600;color:var(--accent-ink);border:1px solid var(--accent);
  border-radius:var(--r-chip,4px);padding:.25rem .55rem}
.shape .arr{border:none;padding:.25rem 0;color:var(--faint)}
.split{display:flex;height:.55rem;margin:.5rem 0 .25rem;border-radius:2px;overflow:hidden}
.split i{display:block;background:var(--accent)}
.split i+i{box-shadow:inset 1px 0 0 var(--card,#FAF8F5)}
.split-lab{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:0.6875rem;color:var(--faint);gap:.4rem}
.frame-lines p{margin:0 0 .45rem;font-size:.92rem;line-height:1.6;color:var(--sentence)}
.frame-lines b{font-family:var(--f-mono);font-size:0.6875rem;font-weight:400;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-right:.35rem}
.blank{display:inline-block;width:2.2em;height:.9em;vertical-align:-.12em;border-bottom:1.5px solid var(--faint);margin:0 .1em}
.model p{margin:0 0 .5rem;font-size:.92rem;line-height:1.6;color:var(--ink)}
.model p b{font-family:var(--f-mono);font-size:0.6875rem;font-weight:400;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-right:.35rem}
.model .xr{color:var(--accent-ink);font-weight:700}
.model .q{font-weight:600;color:var(--dim)}
.bankcols{columns:2 13rem;column-gap:1.2rem}
.bankcols .bg{break-inside:avoid;margin:0 0 .7rem}
.bankcols h5{font-family:var(--f-display);font-size:.74rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;margin:0 0 .2rem;color:var(--ink)}
.bankcols ul{list-style:none;margin:0;padding:0}
.bankcols li{font-size:.84rem;line-height:1.45;color:var(--sentence);padding:.08rem 0}
.mini-map{display:grid;grid-template-columns:1fr 1.2fr 1fr;grid-template-areas:"a c b" "e c d" ". f .";gap:.35rem .8rem;margin:.2rem 0 .3rem}
.mini-map div{border:1px solid var(--rule);border-radius:.45rem;padding:.3rem .35rem;font-size:.7rem;line-height:1.2;text-align:center;
  display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:600;color:var(--sentence)}
.mini-map .mc{border:1.5px solid var(--ink);font-weight:700;color:var(--ink);font-size:.74rem}
.po-tip{margin:1rem 0 0;padding:.7rem .9rem;background:var(--tile-bg);font-size:.92rem;line-height:1.5;color:var(--ink)}
.po-tip b{font-family:var(--f-mono);font-size:0.6875rem;font-weight:400;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);margin-right:.4rem}
.po-foot{display:flex;justify-content:space-between;margin-top:.9rem;padding-top:.5rem;border-top:1px solid var(--rule);
  font-family:var(--f-mono);font-size:0.6875rem;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.msg{font-size:.95rem;color:var(--dim);padding:1rem 0}

/* ── PRINT · one A4 page per poster, nothing else ──────────────────────── */
@page{size:A4 portrait;margin:11mm}
@media print{
  html,body{background:#fff}
  .header,.parts-row,.stage-row,.tools,#list{display:none!important}
  .wrap{max-width:none;padding:0;margin:0}
  .sheetp{box-shadow:none;border:none;margin:0;padding:0;break-after:page;page-break-after:always;font-size:10.5pt}
  .sheetp:last-child{break-after:auto;page-break-after:auto}
  .po-grid{grid-template-columns:1.05fr 1fr;gap:6mm}
  .po-title{font-size:26pt}
  .bankcols{columns:2}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media(prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>

<style>
/* ═══ PLAY (11 Nov 2026, the teacher's call): the phrases as a game first, the list and the posters one tap away ═══ */
#playView{max-width:34rem;margin:0 auto;padding:0 2px}
.ue-card{margin-top:4px}
.ue-ph{display:block;margin:16px 0 4px;font:600 clamp(20px,5.6vw,23px)/1.35 'Geist',sans-serif;color:#14110E}
.ue-ask{display:block;margin-top:6px;font:500 10.5px/1.3 'Geist Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#8A8378}
.ue-hud{display:flex;gap:14px;margin-top:12px;font:500 11px/1.4 'Geist Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#8A8378}
.ue-hud b{font-size:13px;color:#14110E}
.ue-opts{display:flex;flex-direction:column;gap:8px;margin:14px 0 4px}
.ue-opts button{all:unset;cursor:pointer;padding:13px 16px;border-radius:12px;border:1.5px solid rgba(20,17,14,.14);background:#fff;font:500 15px/1.35 'Geist',sans-serif;color:#14110E}
.ue-opts button.ok{background:#E3ECE7;border-color:#4F6B61;color:#2F4A40;font-weight:600}
.ue-opts button.no{background:#F6ECE2;border-color:#C9A57F;color:#8A8378;text-decoration:line-through}
.ue-why{display:block;margin-top:12px;padding-top:10px;border-top:1px dashed rgba(20,17,14,.14);font-size:14px;line-height:1.5;color:#5C5852}
.ue-why b{color:#14110E}.ue-why i{display:block;margin-top:6px;font-style:normal;color:#14110E}.ue-why i small{display:block;font:500 10px/1.4 'Geist Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#8A8378}
.ue-big{display:block;margin:12px 0 2px;font:400 clamp(64px,20vw,88px)/1 'Anton',Impact,sans-serif;color:#14110E}
.ue-sub{display:block;font:500 11px/1.5 'Geist Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#8A8378}
.ue-acts{display:flex;gap:10px;margin:18px 0 6px}
.ue-acts button,.ue-next{all:unset;cursor:pointer;flex:1;text-align:center;height:50px;border-radius:999px;font:600 16px/50px 'Geist',sans-serif;border:1.5px solid rgba(20,17,14,.2);color:#4A443D}
.ue-acts .go,.ue-next{background:#14110E;border-color:#14110E;color:#F6F3EE}
.ue-next{display:block;width:150px;margin:16px auto 0}
</style>

<header class="header" id="hdr">
  <div class="header-top">
    <a class="back-link" href="/index.html?openModal=speaking" target="_top">← Speaking</a>
    <div class="header-title">
      <div class="app-title">INTUITY</div>
      <div class="app-subtitle">Useful expressions</div>
    </div>
    <span class="header-spacer">Level <b>B2</b></span>
  </div>
  <div class="parts-row"><div id="parts"></div></div>
</header>

<main class="wrap">
  <div class="stage-row"><div id="views"></div></div>
  <section id="playView" aria-live="polite" hidden></section>
  <section id="list" aria-live="polite"></section>
  <section id="posterView" hidden>
    <div class="tools"><button class="print-btn" type="button" id="printBtn">Print / Save as PDF</button></div>
    <div id="posters"></div>
  </section>
</main>

<script>
var $=function(id){ return document.getElementById(id); };
var esc=function(s){ return String(s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
var PFX='intuity.ue.';
function pref(k,v){ try{ if(v===undefined) return localStorage.getItem(PFX+k); localStorage.setItem(PFX+k,v); }catch(e){ return null; } }
function seg(items,cur,attr){ return '<div class="seg" role="tablist">'+items.map(function(it){
  return '<button type="button" role="tab" '+attr+'="'+it.id+'" aria-selected="'+(String(it.id)===String(cur))+'">'+esc(it.label)+'</button>'; }).join('')+'</div>'; }
function secs(t){ return Math.round(String(t).split(/\s+/).filter(function(x){ return /[A-Za-z0-9]/.test(x); }).length/2.5); }
function mk(t,marks){
  var s=esc(t);
  (marks||[]).slice().sort(function(a,b){ return b.length-a.length; }).forEach(function(m){
    var e=esc(m).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    s=s.replace(new RegExp('(?![^<]*>)('+e+')'),'<span class="xr">$1</span>'); });
  return s;
}
function blanks(f){ return esc(f).replace(/_{3,}/g,'<span class="blank"></span>'); }

var URL_={1:'data/part1-answers.json',2:'data/part2-turn.json',3:'data/part3-talk.json',4:'data/part4-views.json'};
var NAME={1:'Interview',2:'Long turn',3:'Collaborative task',4:'Discussion'};
var P={}, part=+(pref('part')||0), view=pref('view')==='poster'?'poster':pref('view')==='list'?'list':'play';

/* ── THE CORPUS · every model line in a Part, with where it comes from ── */
function lines(k){
  var d=P[k], out=[]; if(!d) return out;
  function add(t,src){ out.push({t:t,src:src}); }
  if(k===1) d.chapters.forEach(function(ch){ ch.cards.forEach(function(c){ c.alts.forEach(function(a,i){
    a.segs.forEach(function(s){ add(s.t,ch.tab+' · '+c.question+' · '+d.voices[i].tab); }); }); }); });
  if(k===2) d.tasks.forEach(function(t){ t.alts.forEach(function(a,i){
    a.turn.segs.forEach(function(s){ add(s.t,t.tab+' · '+d.voices[i].tab); }); }); });
  if(k===3) d.tasks.forEach(function(t){ t.alts.forEach(function(a,i){ ['discuss','decide'].forEach(function(m){
    a[m].turns.forEach(function(tn){ var who=tn.who==='a'?d.voices[i].a:d.voices[i].b;
      tn.segs.forEach(function(s){ add(s.t,t.tab+' · '+(m==='discuss'?'Discuss':'Decide')+' · '+who); }); }); }); }); });
  if(k===4) d.chapters.forEach(function(ch){ ch.cards.forEach(function(c){ c.alts.forEach(function(a,i){
    a.turn.segs.forEach(function(s){ add(s.t,ch.tab+' · '+c.question+' · '+d.voices[i].a); });
    a.partner.segs.forEach(function(s){ add(s.t,ch.tab+' · '+c.question+' · '+d.voices[i].b); }); }); }); });
  return out;
}
/* A bank phrase like "I'd love to…" or "…, which means…" becomes its fixed
   part — the longest stretch without an ellipsis — and is matched in the lines. */
function stem(p){
  var parts=String(p).split(/…|\.\.\./).map(function(x){ return x.replace(/^[\s,.;:!?—-]+|[\s,.;:!?—-]+$/g,''); }).filter(Boolean);
  parts.sort(function(a,b){ return b.length-a.length; });
  var s=parts[0]||''; return s.replace(/\s*\/\s*.*$/,'');     // "It looks as if… / It looks like…" → the first form
}
var CACHE={};
function uses(k,p){
  var key=k+'|'+p; if(CACHE[key]) return CACHE[key];
  var st=stem(p).toLowerCase(); if(st.length<3) return (CACHE[key]=[]);
  var re=new RegExp('(^|[^a-z])'+st.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'($|[^a-z])','i');
  return (CACHE[key]=lines(k).filter(function(l){ return re.test(l.t); }));
}
function hit(t,p){
  var st=stem(p); if(!st) return esc(t);
  var i=t.toLowerCase().indexOf(st.toLowerCase()); if(i<0) return esc(t);
  return esc(t.slice(0,i))+'<b>'+esc(t.slice(i,i+st.length))+'</b>'+esc(t.slice(i+st.length));
}

/* ═══ LIST ══════════════════════════════════════════════════════════════ */
function listPart(k){
  var d=P[k]; if(!d) return '<p class="msg">Part '+k+' didn\'t load.</p>';
  var n=0; (d.phraseBank||[]).forEach(function(g){ n+=g.phrases.length; });
  return '<div class="part-hd"><span>Part '+k+' · '+esc(NAME[k])+'</span><b>'+(d.phraseBank||[]).length+' groups · '+n+' phrases · '+lines(k).length+' model lines</b></div>'+
    '<div class="bank">'+(d.phraseBank||[]).map(function(g,gi){
      var head=g.heading.replace(/^\d+\s*·\s*/,''), num=(g.heading.match(/^(\d+)\s*·/)||[])[1];
      return '<article class="poster lcard"><div class="poster-kick"><i></i>Part '+k+' · '+esc(NAME[k])+(num?' · '+num:'')+'</div>'+
        '<h3 class="poster-head">'+esc(head)+'</h3>'+(g.note?'<p class="gnote">'+esc(g.note)+'</p>':'')+
        '<div class="cols">'+g.phrases.map(function(p,pi){ var u=uses(k,p), id=k+'-'+gi+'-'+pi;
          return '<button type="button" class="col'+(u.length?' used':'')+'" data-ph="'+id+'" id="ph-'+id+'" aria-expanded="false">'+
            '<span class="w">'+esc(p)+'</span>'+
            '<span class="eg">'+(u.length?hit(u[0].t,p)+'<span class="src0">'+esc(u[0].src)+(u.length>1?' · +'+(u.length-1)+' more':'')+'</span>'
                                    :'<span class="free">Free to use — no model line yet.</span>')+'</span>'+
            '<span class="more"></span></button>'; }).join('')+'</div></article>'; }).join('')+'</div>';
}
function renderList(){ $('list').innerHTML=(part?[part]:[1,2,3,4]).map(listPart).join(''); }
function toggle(id){
  var a=id.split('-').map(Number), k=a[0], p=P[k].phraseBank[a[1]].phrases[a[2]], row=$('ph-'+id), u=uses(k,p);
  if(u.length<2) return;
  var open=!row.classList.contains('open'); row.classList.toggle('open',open); row.setAttribute('aria-expanded',String(open));
  if(open) row.querySelector('.more').innerHTML=u.slice(1,4).map(function(l){ return '<p>'+hit(l.t,p).replace(/class="k"/g,'')+'<span class="src">'+esc(l.src)+'</span></p>'; }).join('')+
    (u.length>4?'<p class="src">…and '+(u.length-4)+' more in the models</p>':'');
}

/* ═══ POSTERS ═══════════════════════════════════════════════════════════ */
function shapeHTML(names){ return '<div class="shape">'+names.map(function(n,i){ return (i?'<span class="arr">→</span>':'')+'<span>'+esc(n)+'</span>'; }).join('')+'</div>'; }
function splitHTML(parts){ var t=parts.reduce(function(a,x){ return a+x[1]; },0);
  return '<div class="split">'+parts.map(function(x,i){ return '<i style="width:'+(x[1]/t*100)+'%;opacity:'+(0.45+0.55*(i+1)/parts.length)+'"></i>'; }).join('')+'</div>'+
    '<div class="split-lab">'+parts.map(function(x){ return '<span>'+esc(x[0])+' · '+x[1]+'s</span>'; }).join('')+'</div>'; }
function bankHTML(d,max){ return '<div class="bankcols">'+(d.phraseBank||[]).map(function(g){
  return '<div class="bg"><h5>'+esc(g.heading.replace(/^\d+\s*·\s*/,''))+'</h5><ul>'+g.phrases.slice(0,max||5).map(function(p){ return '<li>'+esc(p)+'</li>'; }).join('')+'</ul></div>'; }).join('')+'</div>'; }
function poster(k){
  var d=P[k]; if(!d) return '';
  var title, sub, time, shape, split='', frame='', model='', extra='', tip;
  if(k===1){
    var c=d.chapters[0].cards[2], a=c.alts[0];
    title='Part 1 · Interview'; sub='The examiner asks about you. React, answer — then give it one more move.'; time='<b>15–20s</b>per answer';
    shape=shapeHTML(['React','Answer','Reason','Example','Contrast'])+'<p class="po-sub" style="margin:.2rem 0 0">Pick two to four moves that fit the question — never all five.</p>';
    frame='<p>'+blanks(a.frame)+'</p>';
    model='<p class="q">'+esc(c.question)+'</p><p>'+a.segs.map(function(s){ return mk(s.t,s.marks); }).join(' ')+'</p>';
    tip='Say the feeling first — the answer can wait two seconds.';
  }
  if(k===2){
    var t=d.tasks[0], a2=t.alts[0].turn;
    title='Part 2 · Long turn'; sub='One minute, two photos. Compare quickly — then spend the minute speculating.'; time='<b>1 min</b>+ partner 30s';
    shape=shapeHTML(a2.segs.map(function(s){ return d.moves[s.m].name; }));
    split=splitHTML(a2.segs.map(function(s){ return [d.moves[s.m].name,secs(s.t)]; }));
    frame='';   /* the minute is long: its model, with the frame in orange, does both jobs on one page */
    model='<p class="q">'+esc(t.question)+'</p>'+a2.segs.map(function(s){ return '<p><b>'+esc(d.moves[s.m].name)+'</b>'+mk(s.t,s.marks)+'</p>'; }).join('');
    tip='Don\'t just describe — guess. Speculating is where your best grammar shows.';
  }
  if(k===3){
    var t3=d.tasks[0], tr=t3.alts[0].discuss.turns;
    title='Part 3 · Collaborative task'; sub='Talk it through for two minutes, then agree in one. Keep the ball moving.'; time='<b>2 + 1 min</b>discuss · decide';
    shape=shapeHTML(['React / build on','Opinion','Justify','Ask'])+'<p class="po-sub" style="margin:.2rem 0 0">The loop: every turn catches the ball, then throws it back.</p>';
    extra='<div class="mini-map"><div class="mc" style="grid-area:c">'+esc(t3.question)+'</div>'+
      t3.prompts.map(function(p,i){ return '<div style="grid-area:'+'abdef'[i]+'">'+esc(p)+'</div>'; }).join('')+'</div>';
    frame=tr.slice(0,2).map(function(tn){ return '<p><b>'+esc(tn.who==='a'?d.voices[0].a:d.voices[0].b)+'</b>'+blanks(tn.frame)+'</p>'; }).join('');
    model=tr.slice(0,3).map(function(tn){ return '<p><b>'+esc(tn.who==='a'?d.voices[0].a:d.voices[0].b)+'</b>'+tn.segs.map(function(s){ return mk(s.t,s.marks); }).join(' ')+'</p>'; }).join('');
    tip='The decision isn\'t marked — the negotiating is. Ask, build on, then agree.';
  }
  if(k===4){
    var c4=d.chapters[0].cards[0], a4=c4.alts[0];
    title='Part 4 · Discussion'; sub='Give a view and develop it — then widen it out. Part 1 asks about you; Part 4 asks about people.'; time='<b>20–30s</b>+ partner 5–12s';
    shape=shapeHTML(['React','View','Generalise','Reason','Example','Concede']);
    frame='<p><b>'+esc(d.voices[0].a)+'</b>'+blanks(a4.turn.frame)+'</p><p><b>'+esc(d.voices[0].b)+'</b>'+blanks(a4.partner.frame)+'</p>';
    model='<p class="q">'+esc(c4.question)+'</p><p><b>'+esc(d.voices[0].a)+'</b>'+a4.turn.segs.map(function(s){ return mk(s.t,s.marks); }).join(' ')+'</p>'+
      '<p><b>'+esc(d.voices[0].b)+'</b>'+a4.partner.segs.map(function(s){ return mk(s.t,s.marks); }).join(' ')+'</p>';
    tip='Widen it out: "Generally speaking, people…" turns your opinion into a discussion.';
  }
  return '<article class="sheetp" aria-label="'+esc(title)+' poster">'+
    '<div class="po-top"><div><p class="po-kick">Cambridge B2 First · Speaking</p><h2 class="po-title">'+esc(title)+'</h2><p class="po-sub">'+esc(sub)+'</p></div>'+
      '<div class="po-time">'+time+'</div></div>'+
    '<div class="po-grid"><div>'+
      '<div class="po-sec"><h4>The shape</h4>'+shape+split+extra+'</div>'+
      (frame?'<div class="po-sec" style="margin-top:1rem"><h4>The frame</h4><div class="frame-lines">'+frame+'</div></div>':'')+
      '<div class="po-sec" style="margin-top:1rem"><h4>'+(frame?'One model':'One model · the frame in orange')+'</h4><div class="model">'+model+'</div></div>'+
    '</div><div class="po-sec"><h4>The phrase bank</h4>'+bankHTML(d,k===2?4:5)+'</div></div>'+
    '<p class="po-tip"><b>Tip</b>'+esc(tip)+'</p>'+
    '<div class="po-foot"><span>Be2FIRST · be2first.com</span><span>Part '+k+' of 4</span></div></article>';
}
function renderPosters(){ $('posters').innerHTML=(part?[part]:[1,2,3,4]).map(poster).join(''); }

/* ═══ ROUTING ═══════════════════════════════════════════════════════════ */
function draw(){
  $('parts').innerHTML=seg([{id:0,label:'All'},{id:1,label:'Part 1'},{id:2,label:'Part 2'},{id:3,label:'Part 3'},{id:4,label:'Part 4'}],part,'data-part');
  $('views').innerHTML=seg([{id:'play',label:'Play'},{id:'list',label:'List'},{id:'poster',label:'Poster'}],view,'data-view');
  $('list').hidden=view!=='list'; $('posterView').hidden=view!=='poster'; $('playView').hidden=view!=='play';
  if(view==='play') renderPlay(); else if(view==='list') renderList(); else renderPosters();
}

/* ═══ PLAY: which job does this phrase do? ══════════════════════════════
   A phrase from the Part's bank, and three of that Part's jobs ("Reacting -
   when you love it", "Saying why"...): pick the one it does. Then a real
   line from the models where it is used. Rounds of eight, a run, a best per
   Part, review cards. */
var UE=null, UE_T=0;
function ueItems(){
  var out=[]; (part?[part]:[1,2,3,4]).forEach(function(k){ var d=P[k]; if(!d) return;
    var heads=(d.phraseBank||[]).map(function(g){ return g.heading.replace(/^\d+\s*·\s*/,''); });
    (d.phraseBank||[]).forEach(function(g,gi){ g.phrases.forEach(function(ph,pi){ out.push({k:k,gi:gi,pi:pi,ph:ph,job:heads[gi],heads:heads}); }); }); });
  return out;
}
function ueRound(same){
  var items=same&&UE?UE.items:null;
  if(!items){ items=ueItems().sort(function(){ return Math.random()-.5; }).slice(0,8).map(function(x){
      var others=x.heads.filter(function(h){ return h!==x.job; }).sort(function(){ return Math.random()-.5; }).slice(0,2);
      return Object.assign({},x,{opts:[x.job].concat(others).sort(function(){ return Math.random()-.5; })}); }); }
  UE={items:items,pos:0,kept:0,missed:0,run:0,best:0,res:[],n:(UE?UE.n:0)+(same?0:1),part:part};
}
function renderPlay(){
  clearTimeout(UE_T);
  if(!UE||UE.part!==part) ueRound(false);
  var box=$('playView'), tot=UE.items.length;
  if(!tot){ box.innerHTML='<p class="msg">The phrases are loading.</p>'; return; }
  if(UE.pos>=tot){
    var bk='best.play.'+(part||'all'), best=+pref(bk)||0, nb=UE.kept>best; if(nb) pref(bk,String(UE.kept));
    box.innerHTML='<article class="fc-card ue-card"><span class="fc-k">Useful expressions · Round '+UE.n+' done</span><span class="ue-big">'+UE.kept+' / '+tot+'</span>'+
      '<span class="ue-sub">'+(UE.missed?UE.missed+' missed':'none missed')+(UE.best>=3?' · best run '+UE.best:'')+(nb?(best?' · new best':' · first score to beat'):best?' · your best '+best+' / '+tot:'')+'</span>'+
      '<div class="ue-acts"><button type="button" data-ueagain>↻ These again</button><button type="button" class="go" data-uenext>Next eight →</button></div></article>';
    setTimeout(function(){ if(!window.Cheer) return; var big=document.querySelector('.ue-big'); if(UE.kept===tot) Cheer.finale(); else if(nb&&best) Cheer.streak(big); else if(UE.kept/tot>=.75) Cheer.done(big); else Cheer.tick(big); },200);
    return;
  }
  var x=UE.items[UE.pos], n=UE.kept+UE.missed;
  box.innerHTML='<article class="fc-card ue-card"><span class="fc-k">Part '+x.k+' · '+esc(NAME[x.k])+' · Round '+UE.n+'</span><span class="fc-t">Which job <span class="fc-n">'+(UE.pos+1)+'</span></span><span class="fc-bar" aria-hidden="true"></span>'+
    '<span class="rbar" aria-hidden="true">'+UE.items.map(function(_,i){ return '<i class="'+(UE.res[i]||(i===UE.pos?'now':''))+'"></i>'; }).join('')+'</span>'+
    (n?'<div class="ue-hud"><span><b>'+UE.kept+'</b> right</span><span><b>'+UE.missed+'</b> missed</span><span>🔥 <b>'+UE.run+'</b></span></div>':'')+
    '<span class="ue-ph">'+esc(x.ph)+'</span><span class="ue-ask">What does it do?</span>'+
    '<div class="ue-opts" id="ueOpts">'+x.opts.map(function(o,i){ return '<button type="button" data-ueo="'+i+'">'+esc(o)+'</button>'; }).join('')+'</div><span id="ueWhy"></span></article>';
}
function uePick(b){
  var x=UE.items[UE.pos], box=$('ueOpts'); if(!x||box.classList.contains('done')) return;
  var o=x.opts[+b.dataset.ueo], ok=o===x.job; box.classList.add('done');
  [].forEach.call(box.querySelectorAll('button'),function(y,i){ y.disabled=true; if(x.opts[i]===x.job) y.classList.add('ok'); else if(y===b) y.classList.add('no'); });
  if(ok){ UE.kept++; UE.run++; UE.best=Math.max(UE.best,UE.run); } else { UE.missed++; UE.run=0; }
  UE.res[UE.pos]=ok?'ok':'no'; var seg=document.querySelectorAll('.ue-card .rbar i')[UE.pos]; if(seg) seg.className=ok?'ok':'no';
  var u=uses(x.k,x.ph);
  $('ueWhy').outerHTML='<span class="ue-why"><b>'+(ok?'Right.':'Not this one.')+'</b> '+(ok?'':'It does this job: '+esc(x.job)+'.')+
    (u.length?'<i>'+hit(u[0].t,x.ph)+'<small>'+esc(u[0].src)+'</small></i>':'')+'</span>'+(ok?'':'<button type="button" class="ue-next" data-uego>Next</button>');
  try{ if(window.Be2&&Be2.answer) Be2.answer('speaking-phrases',{id:x.k+'-'+x.gi+'-'+x.pi,correct:ok,prompt:x.ph,ask:'Which job does this phrase do?',answer:x.job,given:ok?'':o,
    opts:x.opts,rule:u.length?u[0].t:'',href:location.pathname+'?view=play'}); }catch(e){}
  if(window.Cheer){ if(ok){ Cheer.right(b,true); if(UE.run>=3&&UE.run%3===0) Cheer.streak(b); } else Cheer.soft(); }
  UE.pos++;
  if(ok) UE_T=setTimeout(function(){ if(view==='play') renderPlay(); },1700);
}
document.addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b) return;
  if(b.dataset.ueo!==undefined){ uePick(b); return; }
  if(b.hasAttribute('data-uego')){ renderPlay(); return; }
  if(b.hasAttribute('data-ueagain')){ ueRound(true); renderPlay(); return; }
  if(b.hasAttribute('data-uenext')){ ueRound(false); renderPlay(); return; }
  if(b.dataset.part!==undefined){ part=+b.dataset.part; pref('part',part); UE=null; draw(); scrollTo(0,0); return; }
  if(b.dataset.view){ view=b.dataset.view; pref('view',view); draw(); scrollTo(0,0); return; }
  if(b.dataset.ph){ toggle(b.dataset.ph); return; }
  if(b.id==='printBtn'){ window.print(); }
});
addEventListener('scroll',function(){ document.body.classList.toggle('scrolled',scrollY>4); },{passive:true});

var p=new URLSearchParams(location.search);
if(p.get('part')) part=Math.max(0,Math.min(4,+p.get('part')||0));
if(p.get('view')==='poster'||p.get('view')==='list'||p.get('view')==='play') view=p.get('view');
Promise.all([1,2,3,4].map(function(k){ return fetch(URL_[k]).then(function(r){ return r.ok?r.json():null; }).catch(function(){ return null; }); }))
.then(function(r){ [1,2,3,4].forEach(function(k,i){ if(r[i]&&r[i].version>=3) P[k]=r[i]; }); draw(); });
</script>
