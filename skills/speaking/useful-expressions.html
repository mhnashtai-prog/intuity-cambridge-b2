<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F3F1ED">
<title>INTUITY — Speaking · Slides</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;900&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=8">
<style>

/* ═══════════════════════════════════════════════════════════════════════
   THE SPEAKING BLUEPRINT — identical on Parts 1–4 and Slides.
   Header · topic slider · stage switch · the sheet · the dialogue.
   ═══════════════════════════════════════════════════════════════════════ */
:root{ --accent:#DD8E58; --accent-ink:#9A5A2C; --accent-rgb:221,142,88;
  --bg:var(--screen,var(--page-bg,#F3F1ED)); }
.header{position:sticky;top:0;z-index:20;background:var(--bg);padding-bottom:.35rem}
.header::after{opacity:0;transition:opacity .2s ease;width:100%}
body.scrolled .header::after{opacity:1}
.wrap{max-width:40rem;margin:0 auto;padding:.9rem var(--gutter,1rem) 6rem}

/* ── STOPGAP ─── .seg / .tool / .dots belong to the shell (v8). Delete this
   block once v8 is confirmed live. ─────────────────────────────────────── */
.seg{display:inline-flex;align-items:center;padding:.18rem;background:var(--tile-bg);border-radius:999px}
.seg button{font-family:var(--f-display);font-size:.7rem;font-weight:600;letter-spacing:.03em;
  color:var(--dim);background:none;border:none;cursor:pointer;padding:.45rem .9rem;border-radius:999px;
  min-height:34px;white-space:nowrap;transition:background .18s cubic-bezier(.2,.8,.2,1),color .18s,box-shadow .18s}
.seg button[aria-selected="true"]{background:var(--bg);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.07)}
.tool{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--faint);background:none;border:none;cursor:pointer;padding:.5rem .5rem;min-height:36px}
.tool.on{color:var(--accent-ink)}
.dots{display:flex;align-items:center;justify-content:center;gap:.1rem;flex-wrap:wrap}
.dots button{width:24px;height:24px;padding:0;border:none;background:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.dots button::after{content:'';width:6px;height:6px;border-radius:50%;background:var(--rule);transition:background .2s,transform .2s}
.dots button.on::after{background:var(--accent);transform:scale(1.25)}
/* ── end stopgap ── */

/* ── 1 · THE TOPIC · an iOS-style segmented toggle ─────────────────────── */
.topics{display:flex;gap:.15rem;overflow-x:auto;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;margin:0 auto;max-width:100%;width:fit-content;padding:.18rem;
  background:var(--tile-bg);border-radius:999px}
.topics::-webkit-scrollbar{display:none}
.topics button{flex:none;scroll-snap-align:center;font-family:var(--f-display);font-size:.7rem;font-weight:600;
  letter-spacing:.02em;color:var(--dim);background:none;border:none;border-radius:999px;cursor:pointer;
  padding:.5rem .85rem;white-space:nowrap;min-height:34px;
  transition:background .18s cubic-bezier(.2,.8,.2,1),color .18s,box-shadow .18s}
.topics button.on{background:var(--bg);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.07)}
@media(min-width:720px){ .topics{justify-content:center} }

/* ── 2 · THE STAGE ─────────────────────────────────────────────────────── */
.stage-row{display:flex;justify-content:center;margin:.3rem 0 1.1rem}

/* ── 3 · THE SHEET ─────────────────────────────────────────────────────── */
.sheet-wrap{background:var(--bg);padding:.2rem 0 .6rem}
.sheet-wrap.pin{position:sticky;top:var(--hh,120px);z-index:10;border-bottom:1px solid var(--rule)}
.qline{font-family:var(--f-display);font-size:1.02rem;font-weight:700;line-height:1.35;color:var(--ink);
  text-align:center;margin:0 auto .3rem;max-width:28rem}
.qline small{display:block;font-family:var(--f-mono);font-size:.58rem;font-weight:400;letter-spacing:.12em;
  text-transform:uppercase;color:var(--faint);margin-bottom:.25rem}
.web svg{width:100%;height:auto;display:block;max-width:30rem;margin:0 auto;overflow:visible}
.web .sp{fill:none;stroke:var(--rule);stroke-width:1.3;transition:stroke .35s}
.web .pl{fill:transparent;stroke:var(--rule);stroke-width:1;transition:fill .35s,stroke .35s}
.web .tx{font-family:var(--f-body);font-size:13px;fill:var(--sentence);transition:fill .35s}
.web .br.now .sp{stroke:var(--faint)}
.web .br.now .pl{fill:var(--tile-bg);stroke:var(--faint)}
.web .br.now .tx{fill:var(--ink)}
.web .br.done .pl,.web .br.done .sp{stroke:var(--accent)}
.web .br.done .tx{fill:var(--accent-ink)}
.web .tk{fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .3s}
.web .br.done .tk{opacity:1}
.web .br.tap{cursor:pointer}
.web .hub{cursor:pointer}
.web .hub circle{fill:var(--ink);transition:fill .2s}
.web .hub path,.web .hub rect{fill:var(--bg)}
.web .hub.off{cursor:default}
.web .hub.off circle{fill:var(--rule)}
@media(hover:hover){ .web .hub:not(.off):hover circle{fill:var(--accent-ink)} }
.web .hub:focus-visible{outline:none}
.web .hub:focus-visible circle{stroke:var(--accent);stroke-width:3}

/* The seconds, drawn to scale, under the sheet. */
.tl{position:relative;margin-top:.7rem}
.tl-track{position:relative;height:8px;border-radius:2px;background:var(--rule)}
.tl-seg{position:absolute;top:0;height:100%;background:var(--accent);transition:left .3s,width .3s}
.tl-seg.p0{opacity:.35}.tl-seg.p1{opacity:.5}.tl-seg.p2{opacity:.65}.tl-seg.p3{opacity:.82}.tl-seg.p4{opacity:1}
.tl-seg.over{background:var(--wrong);opacity:.55}
.tl-band{position:absolute;top:-3px;bottom:-3px;background:var(--ink);opacity:.08;border-radius:2px}
.tl-limit{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink)}
.tl-head{position:absolute;top:-5px;width:2px;height:18px;background:var(--ink);border-radius:1px;
  transition-property:left;transition-timing-function:linear;display:none}
.tl-head.on{display:block}
.tl-row{display:flex;justify-content:space-between;align-items:baseline;gap:.8rem;margin-top:.5rem;
  font-family:var(--f-mono);font-size:.62rem;color:var(--faint);font-variant-numeric:tabular-nums}
.tl-row .hot{color:var(--wrong)} .tl-row .ink{color:var(--ink)}

/* ── 4 · THE DIALOGUE ─────────────────────────────────────────────────── */
.dlg{margin-top:1.1rem;border-top:1px solid var(--rule);padding-top:.8rem}
.dlg-hd{display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:nowrap;margin-bottom:.9rem}
.seg.sm{padding:.14rem}
.seg.sm button{font-size:.64rem;padding:.38rem .6rem;min-height:30px}
.dlg-sub{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin:-.35rem 0 .8rem}
.dlg-sub .tool{padding-left:0}
.dlg-n{font-family:var(--f-mono);font-size:.6rem;color:var(--faint);text-align:right;font-variant-numeric:tabular-nums}
@media(max-width:360px){ .seg.sm button{padding:.36rem .48rem} }
.lbl{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.11em;text-transform:uppercase;color:var(--faint)}
.turn{margin-bottom:.9rem;transition:opacity .3s ease}
.turn .who{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);margin-bottom:.2rem}
.turn p{margin:0;font-size:1rem;line-height:1.6;color:var(--sentence)}
.turn.q p{font-family:var(--f-display);font-weight:600;color:var(--ink)}
.turn.mine{padding-left:1rem;border-left:2px solid var(--accent)}
.turn.mine .who{color:var(--accent-ink)}
.turn.mine p{color:var(--ink)}
.turn.other{padding-left:1rem;border-left:2px solid var(--rule)}
.sg{transition:opacity .3s}
.playing .sg,.playing .turn.q p{opacity:.3}
.playing .sg.live,.playing .turn.q.live p{opacity:1}
.xr{box-shadow:inset 0 -2px 0 var(--accent)}
.one .turn p{font-size:1.12rem}
.one-foot{display:flex;align-items:center;justify-content:space-between;margin-top:.9rem;
  padding-top:.6rem;border-top:1px solid var(--rule)}
.arrow{font-size:1.05rem;line-height:1;color:var(--sentence);background:none;border:none;
  padding:.6rem .8rem;cursor:pointer;min-height:44px;min-width:44px}
.arrow:disabled{color:var(--rule);cursor:default}

/* ── PRACTICE · shadowing ──────────────────────────────────────────────── */
.fn-row{display:flex;gap:.3rem;overflow-x:auto;scrollbar-width:none;padding-bottom:.2rem;margin-bottom:1rem}
.fn-row::-webkit-scrollbar{display:none}
.fn{flex:none;font-family:var(--f-display);font-size:.7rem;font-weight:600;color:var(--dim);background:none;
  border:none;border-radius:999px;box-shadow:inset 0 0 0 1px var(--rule);padding:.5rem .85rem;cursor:pointer;
  min-height:36px;white-space:nowrap}
.fn.on{color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--accent)}
.fn .n{font-family:var(--f-mono);font-size:.58rem;color:var(--faint);margin-left:.25rem}
.fn-when{font-size:.9rem;line-height:1.55;color:var(--dim);margin:0 0 1.2rem}
.dr-ctx{font-size:.95rem;line-height:1.55;color:var(--dim);margin:0 0 1rem}
.dr-ctx b{display:block;font-family:var(--f-mono);font-size:.6rem;font-weight:400;letter-spacing:.11em;
  text-transform:uppercase;color:var(--faint);margin-bottom:.25rem}
.dr-line{font-size:1.2rem;line-height:1.5;color:var(--ink);margin:0 0 1.2rem;padding-left:1rem;
  border-left:2px solid var(--accent)}
.dr-line .xr{box-shadow:none;color:var(--accent-ink);font-weight:700}
.dr-say{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.09em;text-transform:uppercase;
  color:var(--faint);margin-bottom:.45rem}
.dr-say.now{color:var(--accent-ink)}
.bar{height:2px;background:var(--rule);border-radius:1px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
.bar i.run{transition:width linear}
.dr-foot{display:flex;align-items:center;justify-content:space-between;margin-top:1.2rem;
  padding-top:.6rem;border-top:1px solid var(--rule)}
.dr-n{font-family:var(--f-mono);font-size:.62rem;color:var(--faint);font-variant-numeric:tabular-nums}

/* ── QUIZ · the answer, growing ────────────────────────────────────────── */
.answer{font-size:1.04rem;line-height:1.75;color:var(--sentence);min-height:3.4em;margin:0 0 1.2rem}
.aseg.new{animation:segIn .36s cubic-bezier(.2,.8,.2,1) both}
@keyframes segIn{from{opacity:0}to{opacity:1}}
/* A reaction arrives IN FRONT of what is already there; the rest visibly
   gives way to it. That shift is the teaching. */
.answer.shift .aseg:not(.new){display:inline-block;animation:shiftIn .36s cubic-bezier(.2,.8,.2,1) both}
@keyframes shiftIn{from{transform:translateX(-10px)}to{transform:none}}
.ask{font-size:.9rem;color:var(--dim);margin:0 0 .7rem}
.opts{display:flex;flex-direction:column;gap:.5rem}
.opt{text-align:left;width:100%;font-size:.95rem;line-height:1.5;padding:.85rem 1rem;border:none;
  border-radius:var(--r-field,12px);background:var(--tile-bg);color:var(--tile-ink);cursor:pointer;min-height:48px;
  transition:background .14s,transform .1s cubic-bezier(.2,.8,.2,1)}
.opt:active:not(:disabled){transform:scale(.99)}
.opt.is-ok{background:var(--tile-ok-bg);color:var(--tile-ok-ink)}
.opt.is-no{background:var(--tile-no-bg);color:var(--tile-no-ink)}
.why{font-size:.86rem;line-height:1.55;color:var(--dim);padding:.7rem .2rem 0;display:none}
.why.show{display:block}
.res h2{font-family:var(--f-display);font-size:1.08rem;font-weight:900;color:var(--ink);margin:0 0 .5rem}
.res p{font-size:.94rem;line-height:1.6;color:var(--sentence);margin:0 0 .8rem}
.hand{margin:1.4rem 0 1.2rem;padding-top:1rem;border-top:1px solid var(--rule)}

/* ── TALK ──────────────────────────────────────────────────────────────── */
.clock{font-family:var(--f-mono);font-size:2.4rem;color:var(--ink);line-height:1;text-align:center;
  font-variant-numeric:tabular-nums;margin:.9rem 0 .2rem}
.clock.low{color:var(--wrong)}
.talk-lead{font-size:.95rem;line-height:1.6;color:var(--sentence);margin:1rem 0 0}
.model{border-top:1px solid var(--rule);margin-top:1.4rem;padding-top:1rem;display:none}
.model.show{display:block}
.model p{font-size:1.04rem;line-height:1.6;color:var(--ink);margin:.4rem 0 0;padding-left:1rem;border-left:2px solid var(--accent)}

/* ── THE PHRASE BANK · a sheet from anywhere ───────────────────────────── */
.bank-btn{display:block;margin:2rem auto 0;font-family:var(--f-mono);font-size:.62rem;letter-spacing:.09em;
  text-transform:uppercase;color:var(--faint);background:none;border:none;cursor:pointer;padding:.7rem;min-height:44px}
#sheet .sheet-card{width:min(40rem,calc(100vw - 1.5rem));max-width:none;align-items:stretch;text-align:left;gap:0}
.sheet-card h2{font-family:var(--f-display);font-size:1.1rem;font-weight:900;color:var(--ink);margin-bottom:.5rem}
.sheet-card .close-btn{position:absolute;top:.7rem;right:.7rem}
.bank-g{padding:1rem 0 .2rem;border-top:1px solid var(--rule)}
.bank-g b{display:block;font-family:var(--f-display);font-size:.86rem;font-weight:700;letter-spacing:.04em;
  text-transform:uppercase;color:var(--ink);margin-bottom:.2rem}
.bank-g i{display:block;font-style:normal;font-size:.9rem;line-height:1.5;color:var(--dim);margin-bottom:.3rem}
.bank-g ul{list-style:none;margin:0;padding:0}
.bank-g li{font-size:1rem;color:var(--ink);padding:.65rem 0;border-bottom:1px solid var(--rule)}
.bank-g li:last-child{border-bottom:none}

@media(prefers-reduced-motion:reduce){
  .bar i.run,.tl-head{transition:none!important}
  .aseg.new,.answer.shift .aseg{animation:none}
  .seg button,.dots button::after{transition:none}
}

/* ═══════════════════════════════════════════════════════════════════════
   SLIDES — ONE ITEM, FULL SIZE · on the Part 2/3 blueprint

   Reached from the menu only. Same header, same one-line slider, same
   segmented switch as the four parts, so moving between them is seamless.

   It is a DRILL, not a list: one item at a time, large enough for a
   teacher to project to a room. Functions reads the shared phrase corpus
   one phrase at a time. Topics reads the four parts' own answer files —
   now all four, where it used to read two — and shows each model answer
   whole, with its expressions in the accent.
   ═══════════════════════════════════════════════════════════════════════ */
.deck{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:1rem 0 .8rem}
.deck-top{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;
  font-family:var(--f-mono);font-size:.62rem;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);
  padding-bottom:.7rem;border-bottom:1px solid var(--rule)}
.deck-top b{font-weight:400;color:var(--accent-ink)}
.deck-top .tool{padding:0 .1rem;min-height:0}
.deck-body{min-height:15rem;display:flex;flex-direction:column;justify-content:center;gap:1.1rem;padding:1.4rem 0}
/* List mode: every phrase in the category at once, page-scrolled — no
   per-item paging, no centering. */
.deck-body.list{display:block;min-height:0;padding:.2rem 0}
.deck-item{padding:1.1rem 0;border-bottom:1px solid var(--rule)}
.deck-item:first-child{padding-top:0}
.deck-item:last-child{border-bottom:none}
.deck-item .deck-ctx{margin-bottom:.35rem}
.deck-item .deck-ans{font-size:clamp(1.1rem,3.2vw,1.5rem)}
.deck-item .deck-extra{margin-top:.6rem;padding-top:.6rem}
.deck-ctx{margin:0;font-size:.98rem;line-height:1.55;color:var(--dim)}
.deck-ans{margin:0;font-family:var(--f-display);font-weight:700;line-height:1.3;color:var(--ink);
  font-size:clamp(1.6rem,6vw,2.6rem);letter-spacing:-.01em}
.deck-ans.long{font-weight:500;font-size:clamp(1.08rem,3vw,1.4rem);line-height:1.6;letter-spacing:0}
.deck-ans .xr,.deck-ans .r{box-shadow:none;color:var(--accent-ink)}
.deck-extra{margin:0;font-size:.98rem;line-height:1.6;color:var(--sentence);border-top:1px solid var(--rule);padding-top:.9rem}
.deck-extra b{display:block;font-family:var(--f-mono);font-size:.6rem;font-weight:400;letter-spacing:.11em;
  text-transform:uppercase;color:var(--faint);margin-bottom:.25rem}
.chips{display:flex;flex-wrap:wrap;gap:.3rem}
.chips span{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--tile-ink);background:var(--tile-bg);border-radius:var(--r-chip,8px);padding:.34rem .62rem}
.chips span.bank{background:none;box-shadow:inset 0 0 0 1px var(--rule);color:var(--faint)}
.deck-foot{display:flex;align-items:center;justify-content:space-between;padding-top:.6rem}
.deck-n{font-family:var(--f-mono);font-size:.62rem;color:var(--faint);font-variant-numeric:tabular-nums}
.deck-msg{margin:auto;font-size:.9rem;color:var(--dim)}
@media(min-width:900px){
  .wrap.wide{max-width:64rem}
  .deck-ans{font-size:3.2rem} .deck-ans.long{font-size:1.6rem}
  .deck-ctx,.deck-extra{font-size:1.1rem}
}
</style>
</head>
<body>

<header class="header" id="hdr">
  <div class="header-top">
    <a class="back-link" href="/index.html?openModal=speaking" target="_top">← Speaking</a>
    <div class="header-title">
      <div class="app-title">INTUITY</div>
      <div class="app-subtitle">Speaking · Slides</div>
    </div>
    <span class="header-spacer">Level <b>B2</b></span>
  </div>
  <div class="topics" id="topics" role="tablist" aria-label="Topic"></div>
</header>

<main class="wrap wide">
  <div class="stage-row">
    <div class="seg" id="tabs" role="tablist" aria-label="Deck">
      <button type="button" role="tab" data-tab="functions" aria-selected="true">List</button>
      <button type="button" role="tab" data-tab="topics" aria-selected="false">Topics</button>
    </div>
  </div>
  <section class="deck" aria-live="polite">
    <div class="deck-top"><span id="deckLabel">Loading…</span>
      <span><button class="tool" type="button" id="readBtn">▶ read</button> · <b id="deckN"></b></span></div>
    <div class="deck-body" id="deckBody"><p class="deck-msg">Loading…</p></div>
    <div class="deck-foot">
      <button class="arrow" type="button" id="prevBtn" aria-label="Previous">&larr;</button>
      <div class="dots" id="deckDots"></div>
      <button class="arrow" type="button" id="nextBtn" aria-label="Next">&rarr;</button>
    </div>
  </section>
</main>


<script>

/* ═══ SHARED HELPERS — identical on every Speaking page built from the blueprint ═══ */
var $=function(id){ return document.getElementById(id); };
var esc=function(s){ return String(s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
var SPEECH=('speechSynthesis' in window), tmr=null;
function pref(k,v){ try{ if(v===undefined) return localStorage.getItem(PFX+k);
  localStorage.setItem(PFX+k,v); }catch(e){ return null; } }
function measure(){ var h=$('hdr'); if(h) document.documentElement.style.setProperty('--hh',h.offsetHeight+'px'); }
function secs(t){ return Math.round(String(t).split(/\s+/).filter(function(x){ return /[A-Za-z0-9]/.test(x); }).length/2.5); }
function seg(items,cur,attr,cls){
  return '<div class="seg'+(cls?' '+cls:'')+'" role="tablist">'+items.map(function(it){
    return '<button type="button" role="tab" '+attr+'="'+it.id+'" aria-selected="'+(it.id===cur)+'">'+
      esc(it.label)+'</button>'; }).join('')+'</div>';
}
/* Marks in the accent, longest first so "even though" beats "though". */
function mk(t,marks){
  var s=esc(t);
  (marks||[]).slice().sort(function(a,b){ return b.length-a.length; }).forEach(function(m){
    var e=esc(m).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    s=s.replace(new RegExp('(?![^<]*>)('+e+')'),'<span class="xr">$1</span>');
  });
  return s;
}

/* The topic row: one line, sliding, current one scrolled into view. */
function topicRow(list,cur,pick){
  var T=$('topics'); T.innerHTML='';
  list.forEach(function(lab,i){
    var b=document.createElement('button'); b.type='button'; b.textContent=lab; b.setAttribute('role','tab');
    b.className=i===cur?'on':''; b.setAttribute('aria-selected',String(i===cur));
    b.addEventListener('click',function(){ if(i!==cur) pick(i); });
    T.appendChild(b);
  });
  var on=T.querySelector('.on'); if(on&&on.scrollIntoView) on.scrollIntoView({inline:'center',block:'nearest'});
  measure();
}
/* Move the underline without redrawing anything — used while playback walks topics. */
function topicMark(cur){
  Array.prototype.forEach.call($('topics').children,function(b,i){
    b.classList.toggle('on',i===cur); b.setAttribute('aria-selected',String(i===cur)); });
  var on=$('topics').querySelector('.on'); if(on&&on.scrollIntoView) on.scrollIntoView({inline:'center',block:'nearest'});
}

/* ── THE SHEET ───────────────────────────────────────────────────────────
   Five branches and a hub, the Part 3 spider. Rows are placed from the
   pills' real heights with ~1cm between upper and lower; straight rules.
   state: { labels:[5], now:[], done:[], hub:'play'|'stop'|'off', tap:bool } */
function lines(s,max){
  var w=String(s).split(' '), L=[], cur='';
  w.forEach(function(x){ if((cur+' '+x).trim().length>max && cur){ L.push(cur.trim()); cur=x; } else cur+=' '+x; });
  if(cur.trim()) L.push(cur.trim());
  return L.slice(0,2);
}
function web(state){
  var P=state.labels.slice(0,5), W=360, cx=180, R=27, lh=15, GAP=38, TOP=6, BELOW=14;
  var LS=P.map(function(p){ return lines(p,15); }), HT=LS.map(function(L){ return L.length*lh+14; });
  var hT=Math.max(HT[0]||0,HT[1]||0), hL=Math.max(HT[2]||0,HT[3]||0);
  var yTop=TOP+hT/2, yLow=yTop+hT/2+GAP+hL/2, cy=(yTop+yLow)/2;
  var yBot=Math.max(yLow+hL/2,cy+R)+BELOW+(HT[4]||0)/2, H=Math.ceil(yBot+(HT[4]||0)/2+6);
  var spots=[{x:66,y:yTop},{x:294,y:yTop},{x:66,y:yLow},{x:294,y:yLow},{x:180,y:yBot}];
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="group" aria-label="'+esc(state.aria||'The sheet')+'">';
  P.forEach(function(p,i){
    var sp=spots[i], L=LS[i], ht=HT[i];
    var wd=Math.min(128,Math.max.apply(null,L.map(function(l){ return l.length; }))*6.9+26);
    var bx=sp.x-wd/2, by=sp.y-ht/2;
    var ex=i===4?sp.x:(sp.x<cx?bx+wd:bx), ey=i===4?by:sp.y;
    var cls='br'+(state.now.indexOf(i)!==-1?' now':'')+(state.done.indexOf(i)!==-1?' done':'')+(state.tap?' tap':'');
    s+='<g class="'+cls+'" data-branch="'+i+'"'+(state.tap?' role="button" tabindex="0" aria-label="'+esc(p)+'"':'')+'>';
    s+='<path class="sp" d="M'+cx+' '+cy.toFixed(1)+' L'+ex.toFixed(1)+' '+ey.toFixed(1)+'"/>';
    s+='<rect class="pl" x="'+bx.toFixed(1)+'" y="'+by.toFixed(1)+'" width="'+wd.toFixed(1)+'" height="'+ht+
       '" rx="'+(ht/2>14?14:ht/2)+'"/>';
    var ty=sp.y-((L.length-1)*lh)/2;
    L.forEach(function(l,k){ s+='<text class="tx" x="'+sp.x+'" y="'+(ty+k*lh).toFixed(1)+
      '" text-anchor="middle" dominant-baseline="middle">'+esc(l)+'</text>'; });
    var kx=bx+wd-11, ky=by+5;
    s+='<path class="tk" d="M'+(kx-4)+' '+(ky+3)+' l2.6 2.8 l4.6-5.6"/></g>';
  });
  var lab=state.hub==='stop'?'Stop':(state.hub==='play'?'Play':'');
  s+='<g class="hub'+(state.hub==='off'?' off':'')+'" data-hub="1"'+
     (state.hub==='off'?'':' role="button" tabindex="0" aria-label="'+lab+'"')+'>';
  s+='<circle cx="'+cx+'" cy="'+cy.toFixed(1)+'" r="'+R+'"/>';
  if(state.hub==='stop') s+='<rect x="'+(cx-8)+'" y="'+(cy-8).toFixed(1)+'" width="16" height="16" rx="2.5"/>';
  else if(state.hub==='play') s+='<path d="M'+(cx-7)+' '+(cy-11).toFixed(1)+' L'+(cx+12)+' '+cy.toFixed(1)+
    ' L'+(cx-7)+' '+(cy+11).toFixed(1)+'Z"/>';
  s+='</g></svg>';
  $('web').innerHTML=s;
}

/* ── THE SECONDS, drawn ──────────────────────────────────────────────────
   items [{phase,s}] in speaking order. opts: limit (hard line), band [a,b],
   scale, left/right readouts. */
function timeline(items,opts){
  opts=opts||{};
  var L=opts.limit||0, total=items.reduce(function(a,x){ return a+x.s; },0);
  var scale=Math.max(opts.scale||0,L,total,1), pc=function(v){ return (v/scale*100).toFixed(2)+'%'; };
  var h='<div class="tl-track">', t=0;
  if(opts.band) h+='<i class="tl-band" style="left:'+pc(opts.band[0])+';width:'+pc(opts.band[1]-opts.band[0])+'"></i>';
  items.forEach(function(x){
    var a=t, b=t+x.s, cls='tl-seg p'+Math.max(0,Math.min(4,x.phase));
    if(L && b>L){
      if(a<L) h+='<i class="'+cls+'" style="left:'+pc(a)+';width:'+pc(L-a)+'"></i>';
      var s0=Math.max(a,L); h+='<i class="tl-seg over" style="left:'+pc(s0)+';width:'+pc(b-s0)+'"></i>';
    } else h+='<i class="'+cls+'" style="left:'+pc(a)+';width:'+pc(b-a)+'"></i>';
    t=b;
  });
  if(L) h+='<i class="tl-limit" style="left:calc('+pc(L)+' - 1px)"></i>';
  h+='<i class="tl-head" id="tlHead"></i></div>';
  h+='<div class="tl-row"><span>'+(opts.left||'')+'</span><span>'+(opts.right||'')+'</span></div>';
  $('tl').innerHTML=h; $('tl').dataset.scale=scale;
}
function head(from,to,ms){
  var el=$('tlHead'); if(!el) return; var sc=+$('tl').dataset.scale||1;
  el.classList.add('on'); el.style.transitionDuration='0ms'; el.style.left=(from/sc*100)+'%'; void el.offsetWidth;
  el.style.transitionDuration=ms+'ms'; el.style.left=(to/sc*100)+'%';
}

/* ── VOICE ───────────────────────────────────────────────────────────────
   By name: iOS voices carry no gender word, and /male/ matches "female".
   A watchdog, because iOS drops utterances without firing onend. */
var VF=/(serena|martha|kate|stephanie|sonia|hazel|susan|libby|maisie|fiona|moira|karen|tessa|samantha|victoria|zira|catherine|amelie|female)/i;
var VM=/(daniel|oliver|arthur|george|ryan|thomas|alex|fred|gordon|\bmale\b|\bman\b)/i;
function voice(fem){
  var vs=speechSynthesis.getVoices()||[];
  var gb=vs.filter(function(v){ return /en[-_]GB/i.test(v.lang); }), en=vs.filter(function(v){ return /^en/i.test(v.lang); });
  var yes=fem?VF:VM, no=fem?VM:VF;
  function f(l){ return l.filter(function(v){ return yes.test(v.name)&&!no.test(v.name); })[0]; }
  return f(gb)||f(en)||gb.filter(function(v){ return !no.test(v.name); })[0]||gb[0]||en[0]||null;
}
function say(text,fem,pitch,then){
  var n=String(text).split(/\s+/).length, pause=Math.max(1400,n*380), moved=false;
  function go(){ if(moved) return; moved=true; if(then) then(); }
  if(!SPEECH){ tmr=setTimeout(go,pause); return; }
  var u=new SpeechSynthesisUtterance(text);
  u.lang='en-GB'; u.rate=.93; u.pitch=pitch||1;
  var v=voice(fem); if(v) u.voice=v;
  u.onend=go; u.onerror=go;
  speechSynthesis.speak(u);
  tmr=setTimeout(function(){ if(!speechSynthesis.speaking) go(); }, pause+1800);
}
function hush(){ if(tmr){ clearTimeout(tmr); tmr=null; } if(SPEECH) speechSynthesis.cancel(); }

/* ── SHADOWING ───────────────────────────────────────────────────────────
   Hear it, say it, say it again, next. Paced for a fifteen-year-old
   reading aloud, not a synthesiser: the multiplier is the one number. */
var dItems=[], dIx=0, dRun=false, dTmr=null;
function drillGo(){
  if(!dRun) return;
  var it=dItems[dIx]; if(!it){ drillStop(); return; }
  var span=Math.max(2000,String(it.text).split(/\s+/).length*460);
  function bar(ms){ var b=$('drBar'); if(!b) return; b.className=''; b.style.width='0'; void b.offsetWidth;
    b.className='run'; b.style.transitionDuration=ms+'ms'; b.style.width='100%'; }
  function lab(t,on){ var s=$('drSay'); if(s){ s.textContent=t; s.classList.toggle('now',!!on); } }
  lab('listen',false); bar(span);
  say(it.text,it.fem!==false,it.pitch||1.05,function(){
    if(!dRun) return; lab('your turn — say it',true); bar(span);
    dTmr=setTimeout(function(){ if(!dRun) return; lab('again',true); bar(span);
      dTmr=setTimeout(function(){ if(!dRun) return;
        if(dIx<dItems.length-1){ dIx++; drill(); drillGo(); } else { dRun=false; drill(); } },span);
    },span);
  });
}
function drillStop(){ dRun=false; if(dTmr){ clearTimeout(dTmr); dTmr=null; } }
function drillFoot(){
  return '<div class="dr-say" id="drSay">listen</div><div class="bar"><i id="drBar"></i></div>'+
    '<div class="dr-foot">'+
    '<button class="arrow" type="button" data-d="-1"'+(dIx<=0?' disabled':'')+' aria-label="Previous">&larr;</button>'+
    '<button class="tool'+(dRun?' on':'')+'" type="button" data-d="go">'+(dRun?'■ stop':'▶ start')+'</button>'+
    '<span class="dr-n">'+(dIx+1)+' / '+dItems.length+'</span>'+
    '<button class="arrow" type="button" data-d="1"'+(dIx>=dItems.length-1?' disabled':'')+' aria-label="Next">&rarr;</button></div>';
}

/* ── THE PHRASE BANK · the shared corpus first, the page's own as fallback ── */
function bank(){
  var G=[];
  if(PH && PH.functions) Object.keys(PH.functions).forEach(function(k){
    var f=PH.functions[k];
    if(f.parts && f.parts.indexOf(PART)!==-1) G.push({l:f.label,w:f.when,p:f.phrases.map(function(x){ return x.t; })});
  });
  if(!G.length && D && D.phraseBank) G=D.phraseBank.map(function(g){ return {l:g.heading,w:g.note,p:g.phrases}; });
  $('bankBody').innerHTML=G.length?G.map(function(g){
    return '<div class="bank-g"><b>'+esc(g.l)+'</b>'+(g.w?'<i>'+esc(g.w)+'</i>':'')+
      '<ul>'+g.p.map(function(p){ return '<li>'+esc(p)+'</li>'; }).join('')+'</ul></div>';
  }).join(''):'<p class="dr-ctx">The phrase bank did not load.</p>';
  $('sheet').classList.add('open'); $('sheetX').focus();
}
function shutBank(){ $('sheet').classList.remove('open'); }
function shellWire(){
  $('bankBtn').addEventListener('click',bank);
  $('sheetX').addEventListener('click',shutBank);
  $('sheet').addEventListener('click',function(e){ if(e.target===$('sheet')) shutBank(); });
  addEventListener('resize',measure,{passive:true});
  addEventListener('scroll',function(){ document.body.classList.toggle('scrolled',scrollY>4); },{passive:true});
  /* The hub and branches are SVG, so Enter and Space are wired by hand. */
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape' && $('sheet').classList.contains('open')){ shutBank(); return; }
    var g=document.activeElement && document.activeElement.closest && document.activeElement.closest('[data-hub],[data-branch]');
    if(g && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); g.dispatchEvent(new MouseEvent('click',{bubbles:true})); }
  });
}

var PFX='intuity.sl.', PART=0, D=null, PH=null;
var PART_URL={1:'data/part1-answers.json',2:'data/part2-turn.json',3:'data/part3-talk.json',4:'data/part4-views.json'};
var PART_LABEL={1:'Interview',2:'Long turn',3:'Collaborate',4:'Discuss'};
var PARTS={}, tab='functions', fi=0, pk=0, at=0;

function fnKeys(){ return PH && PH.functions ? Object.keys(PH.functions) : []; }

/* ── FUNCTIONS: one phrase at a time ─────────────────────────────────── */
function functionSlides(){
  var k=fnKeys()[fi], f=k?PH.functions[k]:null; if(!f) return [];
  return f.phrases.map(function(p){
    var chips=[{t:f.label}];
    if(p.mouth && p.mouth!=='both') chips.push({t:p.mouth});
    if(p.joins) chips.push({t:'joins two halves'});
    if(p.from==='bank') chips.push({t:'wider bank · not in a model turn',bank:true});
    return {ctx:f.when?f.when.charAt(0).toUpperCase()+f.when.slice(1)+'.':'', ans:esc(p.t), speak:p.t,
            extra:p.note?'<b>note</b>'+esc(p.note):'', chips:chips};
  });
}

/* ── TOPICS: every model answer, whole, from all four parts ──────────── */
var BUILD={
  1:function(P){
    var vid=P.voices[0].id;
    return P.topics.map(function(t){
      var L=t.lives[vid].levels, segs=L[L.length-2];
      return {ctx:esc(t.question), ans:segs.map(function(s){ return mk(s.t,s.marks); }).join(' '),
        speak:segs.map(function(s){ return s.t; }).join(' '), long:true,
        chips:[{t:t.tab}].concat(movesOf(P,segs))};
    });
  },
  2:function(P){
    return P.tasks.map(function(tk){
      var T=tk.turns.default||{}, all=[], n=0;
      P.phases.forEach(function(ph){ (T[ph.id]||[]).forEach(function(l){ all.push(l); n+=l.s; }); });
      return {ctx:esc(tk.question), ans:all.map(function(l){ return mk(l.t,l.marks); }).join(' '),
        speak:all.map(function(l){ return l.t; }).join(' '), long:true,
        chips:[{t:tk.tab},{t:n+'s against '+P.limit+'s'}]};
    });
  },
  /* Part 3: one slide per turn of yours — your partner's line as the
     context, your turn beneath it with the responding half lit. */
  3:function(P){
    var out=[];
    P.topics.forEach(function(tp){
      var seq=tp.runs.default||[];
      seq.forEach(function(t,i){
        if(t.who!=='me' || !t.respond || !t.advance) return;
        var ctx=i>0?seq[i-1]:null;
        out.push({ctx:(ctx?'<b style="font-weight:600">'+esc(tp.them)+':</b> '+esc(ctx.t):esc(tp.question)),
          ans:'<span class="r">'+esc(t.respond)+'</span> '+esc(t.advance), speak:t.t, long:true,
          chips:[{t:tp.tab},{t:'Respond'},{t:'Advance'}]});
      });
    });
    return out;
  },
  4:function(P){
    return P.topics.map(function(t){
      var L=t.levels[t.levels.length-1];
      var mine=L.filter(function(s){ return s.m!=='p'; }), theirs=L.filter(function(s){ return s.m==='p'; });
      return {ctx:esc(t.question), ans:mine.map(function(s){ return mk(s.t,s.marks); }).join(' '),
        speak:mine.map(function(s){ return s.t; }).join(' '),
        extra:theirs.length?'<b>'+esc(t.handover)+'</b>'+theirs.map(function(s){ return mk(s.t,s.marks); }).join(' '):'',
        chips:[{t:t.tab}].concat(movesOf(P,mine))};
    });
  }
};
function movesOf(P,segs){ var u={}; segs.forEach(function(s){ u[s.m]=1; });
  return Object.keys(P.moves||{}).filter(function(k){ return u[k]; }).map(function(k){ return {t:P.moves[k].name}; }); }

function topicSlides(){
  var keys=pk?[pk]:[1,2,3,4], out=[];
  keys.forEach(function(k){
    if(!PARTS[k]||!BUILD[k]) return;
    try{ BUILD[k](PARTS[k]).forEach(function(s){ s.chips.unshift({t:'Part '+k+' · '+PART_LABEL[k]}); out.push(s); }); }
    catch(e){ console.warn('Part '+k+' did not build',e); }
  });
  return out;
}
function slides(){ return tab==='functions'?functionSlides():topicSlides(); }
function label(){
  if(tab==='topics') return pk?'Part '+pk+' · '+PART_LABEL[pk]:'All four parts';
  var k=fnKeys()[fi]; return k?PH.functions[k].label:'Functions';
}

/* ── RENDER ──────────────────────────────────────────────────────────── */
function row(){
  var list = tab==='functions'
    ? fnKeys().map(function(k){ return PH.functions[k].label; })
    : ['All four parts','Part 1','Part 2','Part 3','Part 4'];
  topicRow(list, tab==='functions'?fi:pk, function(i){ hush(); if(tab==='functions'){ fi=i; pref('fn',i); } else { pk=i; pref('part',i); } at=0; row(); render(); });
  /* A part whose file did not load is shown, and cannot be picked. */
  if(tab==='topics') Array.prototype.forEach.call($('topics').children,function(b,i){
    if(i>0 && !PARTS[i]){ b.disabled=true; b.style.opacity=.4; } });
}
function render(){
  var S=slides(), body=$('deckBody'), listMode = tab==='functions';
  body.classList.toggle('list',listMode);
  $('deckLabel').textContent=label();

  if(!S.length){
    body.innerHTML='<p class="deck-msg">Nothing to show yet.</p>';
    $('deckN').textContent=''; $('deckDots').innerHTML='';
    $('prevBtn').disabled=$('nextBtn').disabled=true;
    $('readBtn').style.display='';
    return;
  }

  /* LIST mode: the whole category at once. Prev/next (and the header row)
     both move between categories — there is no single "current" item. */
  if(listMode){
    $('readBtn').style.display='none';
    var keys=fnKeys();
    $('deckN').textContent=S.length+(S.length===1?' phrase':' phrases');
    body.innerHTML=S.map(function(s){
      return '<div class="deck-item">'+
        (s.ctx?'<p class="deck-ctx">'+s.ctx+'</p>':'')+
        '<p class="deck-ans">'+s.ans+'</p>'+
        (s.extra?'<p class="deck-extra">'+s.extra+'</p>':'')+
        (s.chips.length?'<div class="chips">'+s.chips.map(function(c){
          return '<span'+(c.bank?' class="bank"':'')+'>'+esc(c.t)+'</span>'; }).join('')+'</div>':'')+
      '</div>';
    }).join('');
    $('deckDots').innerHTML='';
    $('prevBtn').disabled = keys.length<=1;
    $('nextBtn').disabled = keys.length<=1;
    return;
  }

  $('readBtn').style.display='';
  at=Math.max(0,Math.min(S.length-1,at));
  var s=S[at];
  $('deckN').textContent=(at+1)+' / '+S.length;
  body.innerHTML=(s.ctx?'<p class="deck-ctx">'+s.ctx+'</p>':'')+
    '<p class="deck-ans'+(s.long?' long':'')+'">'+s.ans+'</p>'+
    (s.extra?'<p class="deck-extra">'+s.extra+'</p>':'')+
    (s.chips.length?'<div class="chips">'+s.chips.map(function(c){
      return '<span'+(c.bank?' class="bank"':'')+'>'+esc(c.t)+'</span>'; }).join('')+'</div>':'');
  /* Dots while they can still be counted at a glance; past twenty the
     counter in the top row says it better than a row of specks. */
  $('deckDots').innerHTML = S.length<=20 ? S.map(function(_,i){
    return '<button type="button" data-i="'+i+'"'+(i===at?' class="on"':'')+' aria-label="Item '+(i+1)+'"></button>'; }).join('') : '';
  $('prevBtn').disabled = tab!=='topics' && at===0;
  $('nextBtn').disabled = tab!=='topics' && at===S.length-1;
}
function go(d){
  hush();
  if(tab==='functions'){
    var keys=fnKeys(), n=keys.length; if(!n) return;
    fi=(fi+d+n)%n; pref('fn',fi);
    row(); render();
    return;
  }
  var n=slides().length; if(!n) return;
  at = tab==='topics' ? (at+d+n)%n : Math.max(0,Math.min(n-1,at+d));
  render();
}

$('tabs').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b || b.dataset.tab===tab) return;
  hush(); tab=b.dataset.tab; pref('tab',tab); at=0;
  Array.prototype.forEach.call($('tabs').children,function(x){ x.setAttribute('aria-selected',String(x===b)); });
  row(); render();
});
$('deckDots').addEventListener('click',function(e){ var b=e.target.closest('[data-i]'); if(b){ hush(); at=+b.dataset.i; render(); } });
$('prevBtn').addEventListener('click',function(){ go(-1); });
$('nextBtn').addEventListener('click',function(){ go(1); });
$('readBtn').addEventListener('click',function(){
  var s=slides()[at]; if(!s) return;
  if(SPEECH && speechSynthesis.speaking){ hush(); return; }
  say(s.speak||'', true, 1.05, null);
});
addEventListener('keydown',function(e){
  if(e.key==='ArrowRight') go(1);
  if(e.key==='ArrowLeft') go(-1);
});
addEventListener('resize',measure,{passive:true});
addEventListener('scroll',function(){ document.body.classList.toggle('scrolled',scrollY>4); },{passive:true});
addEventListener('pagehide',hush);

var load=function(u){ return fetch(u).then(function(r){ return r.ok?r.json():null; }).catch(function(){ return null; }); };
var nums=Object.keys(PART_URL);
Promise.all([load('data/speaking-phrases.json')].concat(nums.map(function(k){ return load(PART_URL[k]); }))).then(function(res){
  PH=res[0]; nums.forEach(function(k,i){ PARTS[k]=res[i+1]; });
  var pt=pref('tab'); if(pt==='functions'||pt==='topics') tab=pt;
  var pf=+pref('fn'); if(pf>=0 && pf<fnKeys().length) fi=pf;
  var pp=+pref('part'); if(pp>=0 && pp<=4) pk=pp;
  Array.prototype.forEach.call($('tabs').children,function(x){ x.setAttribute('aria-selected',String(x.dataset.tab===tab)); });
  row(); render();
});
</script>
</body>
</html>
