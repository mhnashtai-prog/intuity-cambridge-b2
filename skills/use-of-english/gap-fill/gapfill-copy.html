<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F3F1ED">
<title>INTUITY &mdash; Use of English Part 2</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500&family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=7">

<style>
  /* ── USE OF ENGLISH · PART 2 · OPEN CLOZE ────────────────────────────
     Same architecture as part1.html — shell tokens, one poster for the
     passage, numbered {n} placeholders — and one structural difference
     that changes the whole interaction: there are NO OPTIONS. The student
     supplies the word.

     So the gap is not a target you fill from a list below; it is the input
     itself. There is no second poster of choices, and the page is shorter
     for it. */
  body{padding-bottom:6rem}
  .wrap{max-width:var(--w-read);margin:0 auto;padding:1.2rem var(--gutter) 0}

  .passage{line-height:2.4;font-size:clamp(.95rem,3.4vw,1.05rem);
    color:var(--poster-body)}
  .passage p{margin-bottom:1.1rem}
  .passage p:last-child{margin-bottom:0}

  /* THE GAP IS AN <input>.
     Typed into directly, in place, at the size of the surrounding text —
     which is what the exam asks for and what a paper answer sheet looks
     like. `field-sizing:content` grows it to the word where supported;
     the fixed width below is the fallback, wide enough for the longest
     answer in the corpus. */
  .g{display:inline-block;width:5.5em;field-sizing:content;min-width:4.5em;
    margin:0 .1em;padding:0 .25em;
    font-family:var(--f-display);font-weight:600;font-size:1em;
    color:var(--poster-ink);background:none;border:none;
    box-shadow:inset 0 -2px 0 var(--poster-rule);
    text-align:center;transition:box-shadow .15s,background .15s}
  .g::placeholder{color:var(--poster-faint);font-weight:400}
  .g:focus{outline:none;background:var(--poster-fill);
    box-shadow:inset 0 -2px 0 var(--caramel)}
  .g.filled{box-shadow:inset 0 -2px 0 var(--caramel)}
  .g.right{color:var(--tile-ok-ink);box-shadow:inset 0 -2px 0 var(--tile-ok-ink)}
  .g.wrong{color:var(--tile-no-ink);box-shadow:inset 0 -2px 0 var(--tile-no-ink)}
  .g:disabled{opacity:1}
  /* The example. Filled, inert, and visibly not yours to answer. */
  .g.example{color:var(--poster-body);
    box-shadow:inset 0 -2px 0 var(--poster-rule)}

  /* The gap number, riding above the line. Small, mono, grey — the same
     numeral treatment as everywhere else. */
  .gn{font-family:var(--f-mono);font-size:.52rem;letter-spacing:.06em;
    color:var(--poster-faint);vertical-align:.85em;margin-right:.1em}

  /* ── THE ANSWER LINE ──
     Open cloze has no distractors to explain, so the correction is short:
     the word, and the class of word it was. Naming the class is the whole
     teaching — 26% of the gaps in this corpus are prepositions and 12%
     relatives, and a student who sees that stops hunting for meaning and
     starts reading the structure. */
  .key{border-top:1px solid var(--poster-rule);padding:.6rem 0;
    display:flex;align-items:baseline;gap:.7rem}
  .key:first-of-type{border-top:none}
  .key-n{font-family:var(--f-mono);font-size:.62rem;color:var(--poster-faint);
    min-width:1.6rem}
  .key-a{font-family:var(--f-display);font-weight:600;font-size:.95rem;
    color:var(--poster-ink)}
  .key-a.miss{color:var(--tile-no-ink)}
  .key-yours{font-size:.82rem;font-style:italic;color:var(--poster-body)}
  .key-focus{margin-left:auto;font-family:var(--f-mono);font-size:.54rem;
    letter-spacing:.12em;text-transform:uppercase;color:var(--poster-faint);
    background:var(--poster-fill);border-radius:var(--r-field);
    padding:.22em .55em;white-space:nowrap}

  .rubric{font-size:.82rem;line-height:1.5;color:var(--dim);margin-bottom:1.2rem}
  .score{text-align:center}
</style>
</head>
<body>

<header class="header">
  <div class="header-top">
    <a class="back-link" href="/skills/use-of-english.html" target="_top">&larr; Use of English</a>
    <div class="header-title">
      <div class="app-title">INTUITY</div>
      <div class="app-subtitle">Reading &amp; Use of English &middot; Part 2</div>
    </div>
    <span class="header-spacer">Level <b>B2</b></span>
  </div>
  <div class="mode-selector" id="lengths"></div>
  <div class="set-tabs" id="setTabs"></div>
</header>

<div class="wrap">
  <div class="strip">
    <span><span class="strip-label" id="stripLabel">One word in each gap</span><span class="strip-tally" id="tally"></span></span>
  </div>
  <div id="board"><div class="loading">Loading&hellip;</div></div>
</div>

<div class="action-bar">
  <button class="action-btn secondary" id="clearBtn" type="button">Clear</button>
  <button class="action-btn primary" id="checkBtn" type="button" disabled>Check</button>
</div>

<script>
/* ═══ USE OF ENGLISH · PART 2 ══════════════════════════════════════════
   /data/use-of-english/gapfill/use-of-english-part2.json

   Identical contract to Part 1: numbered {n} placeholders matched to the
   question whose `number` is n. The renderer never counts gaps. */

var DATA_URL = '/data/use-of-english/gapfill/use-of-english-part2.json';
var DOC=null, T=null, LEN=8, checked=false;

function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

fetch(DATA_URL,{cache:'no-store'})
  .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
  .then(function(d){
    DOC=d;
    if(!d.tests || !d.tests.length) throw new Error('no tests in the file');
    buildLengths(); buildTabs(); open(0);
  })
  .catch(function(e){
    $('board').innerHTML='<div class="error">The tests did not load.<br>'+esc(e.message)+'</div>';
  });

/* The corpus holds the same texts at four gap densities — 8, 12, 15 and 20.
   That is a real teaching axis, not duplication: eight gaps is the exam,
   twenty is a drill. So density is the mode row, and the tab row below it
   lists only the texts available at the chosen density. */
function lengths(){
  var s={}; DOC.tests.forEach(function(t){ s[t.gapCount]=1; });
  return Object.keys(s).map(Number).sort(function(a,b){ return a-b; });
}
function buildLengths(){
  var L=lengths(); LEN=L.indexOf(8)>=0?8:L[0];
  $('lengths').innerHTML=L.map(function(n){
    return '<button class="mode-btn'+(n===LEN?' active':'')+'" type="button" data-n="'+n+'">'+
           n+' gaps'+(n===8?' · exam':'')+'</button>';
  }).join('');
  $('lengths').querySelectorAll('.mode-btn').forEach(function(b){
    b.addEventListener('click',function(){
      LEN=+b.dataset.n;
      $('lengths').querySelectorAll('.mode-btn').forEach(function(x){ x.classList.toggle('active',x===b); });
      buildTabs(); open(0);
    });
  });
}
function pool(){ return DOC.tests.filter(function(t){ return t.gapCount===LEN; }); }

function buildTabs(){
  $('setTabs').innerHTML=pool().map(function(t,i){
    return '<button class="vtab'+(i===0?' active':'')+'" type="button" data-i="'+i+'">'+esc(t.title)+'</button>';
  }).join('');
  $('setTabs').querySelectorAll('.vtab').forEach(function(b){
    b.addEventListener('click',function(){
      $('setTabs').querySelectorAll('.vtab').forEach(function(x){ x.classList.toggle('active',x===b); });
      open(+b.dataset.i);
    });
  });
}

function open(i){ T=pool()[i]; checked=false; render(); }

function qByNumber(n){
  for(var k=0;k<T.questions.length;k++) if(T.questions[k].number===n) return T.questions[k];
  return null;
}

function passageHTML(){
  return T.text.map(function(para){
    return '<p>'+esc(para).replace(/\{(\d+)\}/g,function(_,n){
      n=+n;
      if(T.example && n===T.example.number){
        return '<span class="gn">'+n+'</span><input class="g example" value="'+esc(T.example.answer)+'" disabled>';
      }
      return '<span class="gn">'+n+'</span><input class="g" data-n="'+n+'" type="text" '+
             'autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" '+
             'placeholder="&mdash;" aria-label="Gap '+n+'">';
    })+'</p>';
  }).join('');
}

function render(){
  $('board').innerHTML=
    '<div class="poster">'+
      '<div class="poster-kick"><i></i>Part '+esc(DOC.part)+' &middot; '+T.questions.length+' gaps</div>'+
      '<h2 class="poster-head">'+esc(T.title)+'</h2>'+
      (DOC.rubric?'<div class="rubric">'+esc(DOC.rubric)+'</div>':'')+
      '<div class="passage">'+passageHTML()+'</div>'+
    '</div>';

  $('board').querySelectorAll('.g:not(.example)').forEach(function(inp){
    inp.addEventListener('input',function(){
      inp.classList.toggle('filled', inp.value.trim()!=='');
      sync();
    });
    /* Enter moves to the next gap rather than submitting. With twenty
       inputs in a passage, reaching for the mouse between each one is the
       difference between a drill and a chore. */
    inp.addEventListener('keydown',function(e){
      if(e.key!=='Enter') return;
      e.preventDefault();
      var all=[].slice.call($('board').querySelectorAll('.g:not(.example)'));
      var k=all.indexOf(inp);
      if(k>-1 && k+1<all.length) all[k+1].focus(); else check();
    });
  });
  sync();
}

function filled(){
  var n=0;
  $('board').querySelectorAll('.g:not(.example)').forEach(function(i){ if(i.value.trim()) n++; });
  return n;
}
function sync(){
  var f=filled(), total=T.questions.length;
  $('tally').textContent=f+' / '+total;
  $('checkBtn').disabled=checked;
  $('checkBtn').textContent=checked?'Checked':(f<total?'Check — '+(total-f)+' to go':'Check');
}

/* Marking is case-insensitive and trims whitespace. `accept` carries
   alternative correct words, because open cloze frequently has more than
   one — it is empty for now and this comparison already honours it, so
   filling it in later needs no code change. */
function isRight(q,typed){
  var t=(typed||'').trim().toLowerCase();
  if(!t) return false;
  if(t===String(q.answer).trim().toLowerCase()) return true;
  return (q.accept||[]).some(function(a){ return t===String(a).trim().toLowerCase(); });
}

function check(){
  if(checked) return;
  checked=true;
  var got=0, rows='';

  T.questions.forEach(function(q){
    var inp=$('board').querySelector('.g[data-n="'+q.number+'"]');
    var typed=inp?inp.value:'';
    var ok=isRight(q,typed);
    if(ok) got++;
    if(inp){
      inp.disabled=true;
      inp.classList.remove('filled');
      inp.classList.add(ok?'right':'wrong');
      if(!ok) inp.value=q.answer;
    }
    rows+='<div class="key">'+
      '<span class="key-n">'+q.number+'</span>'+
      '<span class="key-a'+(ok?'':' miss')+'">'+esc(q.answer)+'</span>'+
      (!ok && typed.trim()
        ? '<span class="key-yours">you wrote &ldquo;'+esc(typed.trim())+'&rdquo;</span>'
        : (!ok?'<span class="key-yours">left blank</span>':''))+
      (q.focus && q.focus!=='other'?'<span class="key-focus">'+esc(q.focus)+'</span>':'')+
    '</div>';
  });

  var pct=Math.round(got/T.questions.length*100);
  $('board').insertAdjacentHTML('beforeend',
    '<div class="poster" style="margin-top:1.1rem">'+
      '<div class="poster-kick"><i></i>Answers</div>'+rows+
    '</div>'+
    '<div class="poster score" style="margin-top:1.1rem">'+
      '<h2 class="poster-head">'+got+' / '+T.questions.length+'</h2>'+
      '<div class="poster-body">'+pct+'% &middot; the word class on the right is what each gap was testing.</div>'+
    '</div>');
  sync();
  $('clearBtn').textContent='Again';
}

$('checkBtn').addEventListener('click',check);
$('clearBtn').addEventListener('click',function(){
  var i=pool().indexOf(T); open(i<0?0:i);
  $('clearBtn').textContent='Clear';
  var el=document.scrollingElement||document.body;
  try{ el.scrollTo({top:0,behavior:'smooth'}); }catch(e){ el.scrollTop=0; }
});

function syncHeader(){
  var h=document.querySelector('.header');
  if(h) document.documentElement.style.setProperty('--header-h',h.offsetHeight+'px');
}
addEventListener('resize',syncHeader);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(syncHeader);
if(window.ResizeObserver){ var hh=document.querySelector('.header'); if(hh) new ResizeObserver(syncHeader).observe(hh); }
syncHeader();
</script>
</body>
</html>
