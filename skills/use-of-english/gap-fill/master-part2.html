<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>INTUITY — Master · Part 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=12">
<style>
/* ═══ MASTER · PART 2 · the learning ring for the open cloze ═══════════════
   The exam ring (gap-fill.html) practises the task. This page teaches what
   it tests: the small words — of, to, as, which, had — and the patterns
   that call for them. It is Master · Part 3's twin: the same header, the
   same three navigation tiers, the same quiet system, cards and Ring.

   NAVIGATION, in the shell's order:
     1 .mode-selector  Explore · Practice · Game
     2 .set-tabs       Prepositions · Auxiliaries · Pronouns · Quantity ·
                       Linkers · Compare · Phrases · Mix
     3 .seg            Type | Choose — Practice only: type the word as in the
                       exam, or choose from four as a first step

   EXPLORE orders the words by how often they really fill Part 2 gaps:
   counted from the 713 gaps of the 59 open-cloze passages in the app.
   THE GAME puts one word in the ring; tap every gap it fills.
   DATA: /data/use-of-english/gapfill/master-part2.json (163 reviewed items).
   ═══════════════════════════════════════════════════════════════════════ */
.wf{
  --ink:#2B2129; --sheet:#FEFCF9; --soft:#5C4E52; --mute:#8B7B78; --rule:#D9C0A4;
  --sage:#8AA79C; --caramel:#C2956E; --caramel-ink:#8A6440;
  --right:#4A6B5C; --wrong:#B4653A;
  --right-soft:rgba(74,107,92,.12); --wrong-soft:rgba(180,101,58,.13); --sand:rgba(229,209,184,.45);
  --core:#201E1C; --ring-ink:#E5D1B8;
  --r-box:16px; --r-tap:999px;
  max-width:42rem; margin:0 auto; padding:1rem 1rem 4rem; color:var(--ink);
  font-family:'Geist','Inter',system-ui,sans-serif;
}
.wf *{box-sizing:border-box}
.wf button{font:inherit}
.view-row{display:flex;justify-content:center;margin:0}
/* the shell's header is fixed; the content starts below it, at its measured height
   (seven tabs wrap to two lines on a phone, so the height is never assumed) */
main.wf{padding-top:calc(var(--wf-head,170px) + 1rem)}
.lead{color:var(--soft);font-size:.95rem;line-height:1.5;margin:0 0 1rem;text-align:center}
.count{color:var(--mute);font-size:.85rem;text-align:center;margin:-.4rem 0 1rem}
.hidden{display:none !important}

/* ── EXPLORE: the families, then one opens as a card ─────────────────── */
.fam-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr));gap:.6rem}
.fam{display:flex;flex-direction:column;align-items:flex-start;gap:.3rem;text-align:left;cursor:pointer;
  background:var(--sheet);border:1px solid rgba(217,192,164,.55);border-radius:var(--r-box);padding:.85rem .9rem;color:var(--ink);
  transition:border-color .15s,transform .15s}
.fam:hover{border-color:var(--caramel)}
.fam:active{transform:scale(.98)}
.fam b{font-size:1.08rem;font-weight:600;letter-spacing:-.01em}
.fam span{font-size:.82rem;color:var(--soft);line-height:1.35}
.fam .due{width:.42rem;height:.42rem;border-radius:50%;background:var(--wrong);display:inline-block;margin-left:.35rem;vertical-align:middle}

/* ── THE MODAL CARD (the app's panel: soft corner, blurred ground) ────── */
.scrim{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:max(14px,env(safe-area-inset-top)) 14px 14px;
  background:rgba(250,247,242,.72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.card{position:relative;width:min(34rem,100%);max-height:88vh;overflow-y:auto;background:var(--sheet);border-radius:18px;
  padding:1.4rem 1.3rem 1.3rem;color:var(--ink);font-family:'Geist','Inter',system-ui,sans-serif;
  box-shadow:0 1px 2px rgba(43,33,41,.04),0 12px 28px rgba(43,33,41,.07),0 28px 64px rgba(43,33,41,.08)}
.card .x{position:absolute;top:.6rem;right:.7rem;border:none;background:none;font-size:1.1rem;color:var(--mute);cursor:pointer;padding:.5rem;line-height:1}
.card .x:hover{color:var(--ink)}
.kick{display:flex;align-items:center;gap:.55rem;font-size:.78rem;color:var(--caramel-ink);margin-bottom:.6rem}
.kick i{width:1.4rem;height:.5rem;background:var(--caramel);display:block;border-radius:2px}
.card h2{font-size:1.9rem;font-weight:700;letter-spacing:-.02em;margin:0 0 .15rem}
.card .pos{color:var(--mute);font-size:.88rem;margin-bottom:1rem}
.form{border-top:1px solid rgba(217,192,164,.5);padding:.95rem 0 .2rem}
.form.dim{opacity:.55}
.eq{display:flex;flex-wrap:wrap;align-items:center;gap:.35rem;margin-bottom:.5rem}
.tile{display:inline-block;padding:.2rem .65rem;border-radius:var(--r-tap);font-size:.86rem;font-weight:600}
.tile.base{background:var(--sand);color:var(--ink)}
.tile.aff{background:var(--core);color:var(--ring-ink)}
.op{color:var(--mute);font-size:.9rem}
.word{font-size:1.15rem;font-weight:700}
.cls{font-size:.78rem;color:var(--mute);margin-left:.15rem}
.gloss{margin:.15rem 0 .35rem;color:var(--soft);font-size:.92rem}
.ex{margin:0 0 .35rem;font-size:.98rem;line-height:1.5}
.ex b{color:var(--right);font-weight:700}
.rule{font-size:.86rem;color:var(--soft);background:rgba(138,167,156,.14);border-radius:12px;padding:.5rem .7rem;margin:.4rem 0 .5rem}
.rule b{color:var(--ink)}
.watch{margin-top:1rem;padding-top:.8rem;border-top:1px solid rgba(217,192,164,.5)}
.watch h3{font-size:.9rem;margin:0 0 .5rem}
.watch li{font-size:.88rem;color:var(--soft);margin:.35rem 0;line-height:1.45}
.watch .no{color:var(--wrong);font-weight:700;text-decoration:line-through;text-decoration-thickness:1.5px}
.watch .conf{color:var(--caramel-ink);font-weight:700}
.watch ul{padding-left:1.1rem;margin:0}
.note{font-size:.88rem;color:var(--soft);margin:.8rem 0 0}

/* ── PRACTICE ─────────────────────────────────────────────────────────── */
.dots{display:flex;justify-content:center;gap:.4rem;margin:.2rem 0 1rem}
.dots i{width:.55rem;height:.55rem;border-radius:50%;background:rgba(217,192,164,.6);display:block}
.dots i.ok{background:var(--right)} .dots i.no{background:var(--wrong)} .dots i.now{box-shadow:0 0 0 2px var(--caramel)}
.q{background:var(--sheet);border-radius:var(--r-box);padding:1.3rem 1.2rem;border:1px solid rgba(217,192,164,.55)}
.q .ask{font-size:.9rem;color:var(--soft);margin:0 0 .9rem}
.q .line{display:flex;align-items:baseline;gap:1rem;margin-bottom:1rem}
.q .sent{flex:1;font-size:1.15rem;font-weight:600;line-height:1.55;margin:0}
.q .stem{flex:none;font-weight:800;font-size:.9rem;letter-spacing:.08em;padding:.15rem .6rem;border-radius:var(--r-tap);background:rgba(43,33,41,.06)}
.blank{display:inline-block;min-width:5.5em;border-bottom:2px solid var(--ink);text-align:center;color:var(--right)}
.blank.miss{color:var(--wrong)}
.opts{display:flex;flex-wrap:wrap;gap:.5rem}
.opt{border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:var(--r-tap);padding:.6rem 1.1rem;font-size:1rem;font-weight:600;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.ok{background:var(--right-soft);border-color:var(--right);color:var(--right)}
.opt.no{background:var(--wrong-soft);border-color:var(--wrong);color:var(--wrong);text-decoration:line-through}
.opt:disabled{cursor:default}
.field{display:flex;gap:.5rem}
.field input{flex:1;min-width:0;font:inherit;font-size:1.05rem;padding:.7rem .95rem;border:1px solid var(--rule);border-radius:var(--r-box);background:var(--sheet);color:var(--ink)}
.field input:focus{outline:2px solid var(--caramel);outline-offset:1px}
.btn{border:none;border-radius:var(--r-tap);padding:.7rem 1.3rem;font-size:.95rem;font-weight:600;cursor:pointer;background:var(--ink);color:var(--sheet)}
.btn.quiet{background:none;color:var(--ink);border:1px solid var(--rule)}
.btn:disabled{opacity:.4;cursor:default}
.fb{margin:1rem 0 0;font-size:.95rem;line-height:1.5;color:var(--soft);min-height:1.5em}
.fb b.ok{color:var(--right)} .fb b.no{color:var(--wrong)}
.fb .rule{margin-top:.6rem}
.next-row{display:flex;justify-content:flex-end;margin-top:1rem}
.result{text-align:center;padding:1.6rem 1.2rem}
.result .big{font-size:3rem;font-weight:700;letter-spacing:-.03em;margin:.2rem 0}
.ring-line{font-size:.92rem;line-height:1.55;color:var(--soft);margin:1rem 0;padding:.75rem .9rem;border-radius:var(--r-box);background:rgba(74,107,92,.07)}
.ring-line b{color:var(--right)}

/* ── GAME · THE WORD LAB — the one bold thing on the page ────────────────
   The base word sits in the INTUITY ring; the affixes are pills around it.
   Tap one: if it builds a real word, the word joins the family below; if
   not, a heart goes. Words built in two steps (creative → creativity) open
   once their first step is found: tap a found word to build on it. */
.lab-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem;font-size:.9rem;color:var(--soft)}
.hearts{display:flex;gap:.25rem}
.hearts svg{width:16px;height:16px;fill:var(--wrong);transition:opacity .3s,transform .3s}
.hearts svg.gone{opacity:.2;transform:scale(.8)}
.lab{display:flex;flex-direction:column;align-items:center;gap:1.1rem;background:var(--sheet);border-radius:var(--r-box);padding:1.6rem 1rem 1.3rem;border:1px solid rgba(217,192,164,.55)}
.ring{--d:9.5rem;width:var(--d);height:var(--d);border-radius:50%;display:grid;place-items:center;position:relative;
  background:linear-gradient(145deg,#FFFFFF,#E4DDD1);box-shadow:-6px -6px 14px rgba(255,255,255,.9),8px 8px 20px rgba(43,33,41,.16)}
.ring::before{content:'';position:absolute;inset:5.5%;border-radius:50%;background:var(--sage)}
.ring::after{content:'';position:absolute;inset:14.8%;border-radius:50%;background:var(--core)}
.ring span{position:relative;z-index:2;color:var(--ring-ink);font-weight:700;font-size:1.25rem;letter-spacing:-.01em;max-width:6.3rem;text-align:center;line-height:1.1;word-break:break-word}
.ring.snap{animation:snap .45s cubic-bezier(.22,1,.36,1)}
@keyframes snap{40%{transform:scale(1.07)}}
.ring.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.affixes{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;max-width:28rem}
.aff{border:none;border-radius:var(--r-tap);padding:.55rem 1rem;font-size:1rem;font-weight:700;cursor:pointer;background:var(--core);color:var(--ring-ink);transition:transform .12s,opacity .2s}
.aff:active{transform:scale(.95)}
.aff.used{opacity:.25;cursor:default}
.aff.miss{background:var(--wrong-soft);color:var(--wrong);text-decoration:line-through}
.lab-msg{min-height:1.4em;font-size:.95rem;color:var(--soft);text-align:center;margin:0}
.found{width:100%;display:flex;flex-direction:column;gap:.5rem}
.found .row{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;padding:.55rem .7rem;border-radius:12px;background:var(--right-soft)}
.found .row .w{font-weight:700;color:var(--right)}
.found .row .g{font-size:.86rem;color:var(--soft);flex-basis:100%}
.found .row button{border:1px solid var(--right);background:none;color:var(--right);border-radius:var(--r-tap);padding:.15rem .7rem;font-size:.8rem;font-weight:600;cursor:pointer;margin-left:auto}
.lab-foot{display:flex;justify-content:space-between;align-items:center;width:100%;gap:.5rem;flex-wrap:wrap}
.cross-link{display:block;text-align:center;margin-top:2rem;font-size:.9rem;color:var(--soft)}
.cross-link a{color:var(--ink);font-weight:600}

/* game controls are tapped, not read: no long-press menu on a phone */
.aff,.opt,.fam,.ring,.btn,.dots{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
@media (prefers-reduced-motion:reduce){ .ring.snap,.ring.shake{animation:none} .fam,.aff{transition:none} }

/* ── PART 2 additions ── */
.word-grid .fam b{font-size:1.25rem}
.freq{font-size:.78rem;color:var(--caramel-ink);font-weight:600}
.pat{border-top:1px solid rgba(217,192,164,.5);padding:.8rem 0 .4rem}
.pat .ex{margin-bottom:.25rem}
.pat .also{font-size:.82rem;color:var(--mute)}
.cards{width:100%;display:grid;grid-template-columns:1fr;gap:.5rem}
.sc{text-align:left;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:var(--r-box);padding:.75rem .9rem;font-size:.98rem;line-height:1.45;cursor:pointer;transition:border-color .15s,background .2s}
.sc:hover:not(:disabled){border-color:var(--ink)}
.sc:disabled{cursor:default}
.sc.hit{background:var(--right-soft);border-color:var(--right)}
.sc.hit .g{color:var(--right);font-weight:700}
.sc.miss{background:var(--wrong-soft);border-color:var(--wrong)}
.sc.miss .g{color:var(--wrong);font-weight:700}
.sc.left{border-style:dashed;border-color:var(--right)}
.sc .g{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--ink);text-align:center}
.seg-wrap.hidden{display:none}
.sc{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

</style>
</head>
<body>

<header class="header">
  <div class="header-top">
    <a class="back-link" href="/index.html?openModal=english" target="_top">← Use of English</a>
    <div class="header-title">
      <div class="app-title">INTUITY</div>
      <div class="app-subtitle">Master · Part 2</div>
    </div>
    <span class="header-spacer">Level <b>B2</b></span>
  </div>
  <div class="mode-selector" id="modes">
    <button class="mode-btn" data-mode="explore" type="button">Explore</button>
    <button class="mode-btn" data-mode="practice" type="button">Practice</button>
    <button class="mode-btn" data-mode="game" type="button">Game</button>
  </div>
  <div class="set-tabs" id="sets"></div>
  <div class="view-row seg-wrap" id="segWrap"><div class="seg" id="kind" role="group" aria-label="Type or choose">
    <button type="button" data-kind="type">Type</button><button type="button" data-kind="choose">Choose</button>
  </div></div>
</header>

<main class="wf" id="wf">
  <section id="explore"></section>
  <section id="practice" class="hidden"></section>
  <section id="game" class="hidden"></section>
  <p class="cross-link">Ready for the exam task? <a href="/skills/use-of-english/gap-fill/gap-fill.html">Practise Part 2 in Cambridge format</a></p>
</main>

<script src="/tools/intuity-log.js?v=1"></script>
<script src="/tools/intuity-ring.js?v=1"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const norm=s=>String(s).toLowerCase().replace(/[’']/g,"'").replace(/[.!?,;:]/g,'').replace(/\s+/g,' ').trim();
const TOPIC='master-part2', PART='UoE2';
const SETS=[['prep','Prepositions'],['aux','Auxiliaries'],['pron','Pronouns'],['quant','Quantity'],['link','Linkers'],['comp','Compare'],['phrase','Phrases'],['mix','Mix']];
const P=new URLSearchParams(location.search);
let D=null, mode=P.get('mode')||'explore', set=P.get('set')||'mix', kind=P.get('kind')==='choose'?'choose':'type';

const pool=()=>D.items.filter(i=>set==='mix'||i.tab===set);
const answers=i=>[i.a].concat(i.alt||[]);
const fits=(i,w)=>answers(i).map(norm).includes(norm(w));
const freq=w=>D.freq[norm(w)]||0;
const due=id=>{ try{ return !!(window.IntuityRing&&IntuityRing.isDue(id)); }catch(e){ return false; } };
function remember(i,right){
  try{ if(window.IntuityRing){ right?IntuityRing.right(i.id):IntuityRing.miss(i.id,{topic:TOPIC,part:PART}); } }catch(e){}
  try{ if(window.INTUITY) INTUITY.log(TOPIC,i.id,right,{game:'master-part2-'+mode}); }catch(e){}
}
const parts=s=>{ const k=s.indexOf('___'); return {pre:s.slice(0,k),post:s.slice(k+3)}; };
const filled=(s,w)=>{ const p=parts(s); return esc(p.pre)+'<b>'+esc(w)+'</b>'+esc(p.post); };
/* a sentence starting with the gap takes a capital, whatever the word */
const cap=(s,w)=>s.trim().startsWith('___')?w.charAt(0).toUpperCase()+w.slice(1):w;

/* ══ NAVIGATION ══ */
function drawNav(){
  $('sets').innerHTML=SETS.map(([k,l])=>`<button class="vtab${k===set?' active':''}" type="button" data-set="${k}">${l}</button>`).join('');
  document.querySelectorAll('#modes .mode-btn').forEach(b=>{ const on=b.dataset.mode===mode; b.classList.toggle('active',on); on?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'); });
  document.querySelectorAll('#kind button').forEach(b=>{ const on=b.dataset.kind===kind; b.classList.toggle('on',on); b.setAttribute('aria-selected',on); });
  $('segWrap').classList.toggle('hidden',mode!=='practice');          /* Type | Choose only changes Practice */
  ['explore','practice','game'].forEach(v=>$(v).classList.toggle('hidden',v!==mode));
  history.replaceState(null,'',location.pathname+'?'+new URLSearchParams({mode,set,kind}));
}
function go(){ drawNav(); if(mode==='explore') explore(); else if(mode==='practice') gate(); else ringStart(); }
$('modes').addEventListener('click',e=>{ const b=e.target.closest('[data-mode]'); if(b){ mode=b.dataset.mode; go(); } });
$('sets').addEventListener('click',e=>{ const b=e.target.closest('[data-set]'); if(b){ set=b.dataset.set; go(); } });
$('kind').addEventListener('click',e=>{ const b=e.target.closest('[data-kind]'); if(b){ kind=b.dataset.kind; go(); } });

/* ══ EXPLORE: the words, most frequent in real Part 2 texts first ══ */
function words(){ const m=new Map(); pool().forEach(i=>{ const w=norm(i.a); if(!m.has(w)) m.set(w,[]); m.get(w).push(i); });
  return [...m.entries()].sort((a,b)=>freq(b[0])-freq(a[0])||b[1].length-a[1].length||a[0].localeCompare(b[0])); }
function explore(){
  const W=words(), label=(SETS.find(s=>s[0]===set)||[])[1];
  $('explore').innerHTML=`<p class="lead">The small words Part 2 tests, the most frequent first. Tap one to see the patterns that call for it.</p>
    <p class="count">${W.length} words · ${pool().length} patterns in ${esc(label)}</p>
    <div class="fam-grid word-grid">${W.map(([w,is])=>`<button class="fam" type="button" data-w="${esc(w)}"><b>${esc(w)}${is.some(i=>due(i.id))?'<i class="due" title="Still to fix"></i>':''}</b>
      <span>${is.length} ${is.length===1?'pattern':'patterns'}</span>${freq(w)?`<span class="freq">in ${freq(w)} real gaps</span>`:''}</button>`).join('')}</div>`;
}
$('explore').addEventListener('click',e=>{ const b=e.target.closest('.fam'); if(b) openWord(b.dataset.w); });
function openWord(w){
  const is=D.items.filter(i=>norm(i.a)===w), f=freq(w);
  openCard(`<div class="kick"><i></i>Part 2 word</div><h2>${esc(w)}</h2>
    <div class="pos">${f?`Fills ${f} of the 713 gaps in the app's real Part 2 texts`:'Not among the most frequent, but tested'}</div>
    ${is.map(i=>`<div class="pat"><p class="ex">${filled(i.s,cap(i.s,i.a))}</p><p class="gloss">${esc(i.why)}</p>${(i.alt||[]).length?`<p class="also">Also right here: ${i.alt.map(esc).join(', ')}</p>`:''}</div>`).join('')}`);
}

/* ══ THE MODAL CARD ══ */
function openCard(html){ closeCard(); const s=document.createElement('div'); s.className='scrim'; s.id='scrim';
  s.innerHTML=`<div class="card wf" role="dialog" aria-modal="true"><button class="x" type="button" aria-label="Close">✕</button>${html}</div>`;
  document.body.appendChild(s); s.addEventListener('click',e=>{ if(e.target===s||e.target.closest('.x')) closeCard(); }); s.querySelector('.x').focus(); }
function closeCard(){ const s=$('scrim'); if(s) s.remove(); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeCard(); });

/* ══ PRACTICE: ten gaps, mistakes first, the answer and the reason straight after ══ */
let S=null;
function gate(){
  const n=pool().length, d=pool().filter(i=>due(i.id)).length;
  $('practice').innerHTML=`<div class="q result"><p class="lead">Ten gaps from ${n} patterns · ${kind==='type'?'type one word, as in the exam':'choose from four, as a first step'}.${d?` <b>${d}</b> ${d===1?'is a mistake':'are mistakes'} from last time, so ${d===1?'it comes':'they come'} first.`:''}</p>
    <button class="btn" type="button" id="pStart">Start</button></div>`;
  $('pStart').onclick=start;
}
function start(){ const all=shuffle(pool()); all.sort((a,b)=>due(b.id)-due(a.id)); S={items:all.slice(0,10),i:0,res:[],tries:0,fixed:0,half:0}; showQ(); }
function showQ(){
  const i=S.items[S.i]; if(!i) return results(); S.tries=0; const p=parts(i.s);
  const dots=S.items.map((x,k)=>`<i class="${S.res[k]===true?'ok':S.res[k]===false?'no':k===S.i?'now':''}"></i>`).join('');
  const opts=kind==='choose'?shuffle([i.a].concat(i.o)):null;
  $('practice').innerHTML=`<div class="dots" aria-label="Gap ${S.i+1} of ${S.items.length}">${dots}</div><div class="q">
    <p class="ask">${kind==='type'?'Write <b>one word</b> in the gap.':'Which word fills the gap?'}</p>
    <div class="line"><p class="sent">${esc(p.pre)}<span class="blank" id="blank">&nbsp;</span>${esc(p.post)}</p></div>
    ${opts?`<div class="opts">${opts.map(o=>`<button class="opt" type="button" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>`
          :`<div class="field"><input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="One word" aria-label="Your answer"><button class="btn" type="button" id="chk">Check</button></div>`}
    <div class="fb" id="fb" aria-live="polite"></div><div class="next-row hidden" id="nextRow"><button class="btn" type="button" id="next">${S.i+1<S.items.length?'Next':'See your result'}</button></div></div>`;
  $('practice').querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b.dataset.o,b));
  const inp=$('ans'); if(inp){ $('chk').onclick=()=>answer(inp.value); inp.addEventListener('keydown',e=>{ if(e.key==='Enter') answer(inp.value); }); setTimeout(()=>inp.focus(),80); }
  $('next').onclick=()=>{ S.i++; showQ(); };
}
function answer(v,btn){
  const i=S.items[S.i], fb=$('fb'); if(S.res[S.i]!==undefined||!String(v).trim()) return;
  if(!btn&&/\s/.test(norm(v))){ fb.innerHTML='<b class="no">One word only</b> — every Part 2 gap takes exactly one word.'; $('ans').select(); return; }
  const right=fits(i,v);
  if(!right&&!btn&&S.tries<1){ S.tries++;
    fb.innerHTML='<b class="no">Not quite.</b> Read the words on both sides of the gap: what do they need? It starts with <b>“'+esc(cap(i.s,i.a).charAt(0))+'…”</b>';
    $('ans').select(); return; }
  S.res[S.i]=right&&S.tries===0;
  const was=(()=>{ try{ return IntuityRing.has(i.id); }catch(e){ return false; } })();
  remember(i,S.res[S.i]); if(S.res[S.i]&&was){ try{ IntuityRing.has(i.id)?S.half++:S.fixed++; }catch(e){} }
  if(btn){ $('practice').querySelectorAll('.opt').forEach(b=>{ b.disabled=true; if(fits(i,b.dataset.o)) b.classList.add('ok'); }); if(!right) btn.classList.add('no'); }
  const inp=$('ans'); if(inp){ inp.disabled=true; $('chk').disabled=true; }
  $('blank').textContent=cap(i.s,right&&!btn?String(v).trim().toLowerCase():i.a);
  const also=answers(i).filter(a=>norm(a)!==norm(right?v:i.a));
  fb.innerHTML=(right?'<b class="ok">Right.</b> ':`<b class="no">The answer: ${esc(i.a)}.</b> `)+esc(i.why)+(also.length?`<br><span class="also">Also right: ${also.map(esc).join(', ')}</span>`:'');
  $('nextRow').classList.remove('hidden'); $('next').focus();
}
function results(){
  const r=S.res.filter(Boolean).length, waiting=(()=>{ try{ return pool().filter(i=>IntuityRing.has(i.id)).length; }catch(e){ return 0; } })();
  const bits=[]; if(S.fixed) bits.push(`<b>${S.fixed}</b> ${S.fixed===1?'mistake':'mistakes'} fixed for good`); if(S.half) bits.push(`<b>${S.half}</b> right today — ${S.half===1?'it comes':'they come'} back tomorrow to make sure`);
  $('practice').innerHTML=`<div class="q result"><p class="kick" style="justify-content:center"><i></i>Practice</p><div class="big">${r} of ${S.items.length}</div>
    <p class="lead">right first time</p><p class="ring-line">${bits.length?bits.join(' · ')+'. ':''}${waiting?`Still to fix here: <b>${waiting}</b>.`:'Nothing left to fix in this set.'}</p>
    <button class="btn" type="button" id="again">Ten more</button></div>`;
  $('again').onclick=start;
}

/* ══ GAME · THE RING: one word in the ring — tap every gap it fills ══
   The skill Part 2 tests, put into the mechanic: which little word does
   each pattern take? The wrong cards are chosen, where possible, from gaps
   where the ring word is a real trap (one of that gap's own distractors). */
let G=null;
const HEART='<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4.5 6.7 4.5c2.1 0 3.6 1.1 5.3 3 1.7-1.9 3.2-3 5.3-3 3.7 0 5.8 3.8 4.3 7.2C19.5 16.4 12 21 12 21z"/></svg>';
function ringWords(){ const W=words().filter(([w,is])=>is.length>=2); return W.length?W:words(); }
function ringStart(){
  const W=ringWords(); if(!W.length){ $('game').innerHTML='<p class="lead">No words in this set yet.</p>'; return; }
  const order=W.map(x=>x[0]); order.sort((a,b)=>(pool().some(i=>norm(i.a)===b&&due(i.id))-pool().some(i=>norm(i.a)===a&&due(i.id))));
  G={order,at:0}; ringDeal();
}
function ringDeal(){
  const w=G.order[G.at%G.order.length];
  const targets=shuffle(D.items.filter(i=>fits(i,w)&&(set==='mix'||i.tab===set))).slice(0,3);
  const traps=shuffle(D.items.filter(i=>!fits(i,w)&&i.o.map(norm).includes(w)));
  const others=shuffle(D.items.filter(i=>!fits(i,w)&&!traps.includes(i)&&(set==='mix'||i.tab===set)));
  const wrong=traps.concat(others).slice(0,6-targets.length);
  Object.assign(G,{w,cards:shuffle(targets.concat(wrong)),hit:new Set(),miss:new Set(),hearts:3});
  ringDraw();
}
function ringDraw(msg){
  const tg=G.cards.filter(i=>fits(i,G.w)), found=tg.filter(i=>G.hit.has(i)).length, done=found===tg.length, dead=G.hearts<=0;
  $('game').innerHTML=`<div class="lab-head"><span>Tap every gap that <b>${esc(G.w)}</b> fills</span><span class="hearts">${[0,1,2].map(i=>HEART.replace('<svg',`<svg class="${i<G.hearts?'':'gone'}"`)).join('')}</span></div>
    <div class="lab"><div class="ring" id="ring"><span>${esc(G.w)}</span></div>
      <p class="lab-msg" aria-live="polite">${msg||(done?`All ${tg.length} found.`:dead?'Out of hearts — the dashed ones were the gaps it fills.':`${found} of ${tg.length} found`)}</p>
      <div class="cards">${G.cards.map((i,k)=>{ const p=parts(i.s), isT=fits(i,G.w), h=G.hit.has(i), m=G.miss.has(i);
        const show=h?cap(i.s,G.w):m?cap(i.s,i.a):'';
        const cls=h?'hit':m?'miss':((done||dead)&&isT?'left':'');
        return `<button class="sc ${cls}" type="button" data-k="${k}"${h||m||done||dead?' disabled':''}>${esc(p.pre)}<span class="g">${show?esc(show):'&nbsp;'}</span>${esc(p.post)}</button>`; }).join('')}</div>
      <div class="lab-foot"><button class="btn quiet" type="button" id="ringLook">See the patterns</button><button class="btn" type="button" id="ringNext">${done||dead?'Next word':'Skip this word'}</button></div></div>`;
  $('game').querySelectorAll('.sc').forEach(b=>b.onclick=()=>ringTap(G.cards[+b.dataset.k]));
  $('ringLook').onclick=()=>openWord(G.w);
  $('ringNext').onclick=()=>{ G.at++; ringDeal(); };          /* skipping is not a mistake */
}
function ringTap(i){
  if(fits(i,G.w)){ G.hit.add(i); remember(i,true); ringDraw(); const r=$('ring'); r.classList.add('snap'); }
  else { G.miss.add(i); G.hearts--; remember(i,false); $('ring').classList.add('shake');
    if(G.hearts<=0) G.cards.filter(x=>fits(x,G.w)&&!G.hit.has(x)).forEach(x=>remember(x,false));
    setTimeout(()=>ringDraw(G.hearts>0?`Not ${G.w}: that gap takes ${cap(i.s,i.a)}.`:undefined),380); }
}

/* the header's real height, kept up to date as tabs wrap or the phone turns */
(function(){ const h=document.querySelector('header.header'); const set=()=>document.documentElement.style.setProperty('--wf-head',h.getBoundingClientRect().height+'px');
  set(); if(window.ResizeObserver) new ResizeObserver(set).observe(h); window.addEventListener('resize',set); })();

/* ══ BOOT ══ */
fetch('/data/use-of-english/gapfill/master-part2.json',{cache:'no-cache'}).then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); }).then(d=>{
  D=d; if(!SETS.some(s=>s[0]===set)) set='mix'; if(!['explore','practice','game'].includes(mode)) mode='explore'; go();
}).catch(()=>{ $('explore').innerHTML='<p class="lead">The words didn’t load. Check your connection and reload.</p>'; });
})();
</script>
