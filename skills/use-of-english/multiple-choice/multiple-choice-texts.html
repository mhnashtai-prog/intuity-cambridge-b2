<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>INTUITY — Multiple Choice · Texts</title>
<meta name="theme-color" content="#F3F1ED">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500&family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=7">
<link rel="stylesheet" href="/data/use-of-english/uoe.css?v=2">
<style>
    /* The ONLY rule that stays in the page, and for the reason this repo
       already records: intuity-shell.css sets body{color:var(--paper)} and
       expects each page to set its own ink afterwards. If uoe.css fails to
       load, that rule stands and the page renders white on white — working,
       and completely invisible. A missing stylesheet should cost you the
       styling, not the page. */
    body{color:var(--ink,#14110E);background:var(--screen,#F3F1ED);}
  </style>
</head>
<body>

<header class="header">
  <div class="header-top">
    <a class='back-link' href='/?openModal=english' target='_top'>&larr; Use of English</a>
    <div class="header-title">
      <div class="app-title">INTUITY</div>
      <div class="app-subtitle">Use of English &middot; Part 1</div>
    </div>
    <span class="header-spacer">
      <button class="mute" id="mute" type="button" aria-label="Sound">&#128266;</button>
      Level <b>B2</b>
    </span>
  </div>
  <!-- TWO EXERCISES, TWO FILES, ONE ROW.
       This is navigation, not a view toggle: Full texts is this page,
       Sentences is multiple-choice.html. They read different data — a
       connected passage against sets of eight standalone sentences — and
       a single file branching on shape at every step is exactly what broke
       before. So the row is two links, and each page renders one thing.

       Full texts is the default, which is also the exam's own order:
       Part 1 IS a text, and the sentence bank is extra practice. -->
  <nav class="mode-selector" aria-label="Exercise type">
    <span class="mode-btn active" aria-current="page">Full texts</span>
    <a class="mode-btn" href="/skills/use-of-english/multiple-choice/multiple-choice.html">Sentences</a>
  </nav>
  <div class="set-tabs" id="setTabs"></div>
</header>

<div class="wrapper">
  <!-- One line: back, the texts as dots, forward. The dots ARE the label —
       which text you are on and how many there are, read at a glance,
       where "Text 1 of 10" needed reading. Same shape the gap-fill page
       already uses for its tests. -->
  <div class="setrow">
    <button class="arrow" id="prevSet" type="button" aria-label="Previous text">&lsaquo;</button>
    <div class="tdots" id="tdots" role="tablist" aria-label="Choose a text"></div>
    <button class="arrow" id="nextSet" type="button" aria-label="Next text">&rsaquo;</button>
  </div>
  <span class="label" id="setLabel" hidden></span>

  <!-- The view toggle, right-aligned above the card it reshapes. Separate
       from the row above on purpose: that one chooses the EXERCISE, this
       one chooses how much of one text is on screen. Two different
       questions should not look like one control with four options. -->
  <div class="viewrow">
    <div class="viewtog" role="group" aria-label="How much to show">
      <button class="viewbtn active" type="button" data-view="full">Complete</button>
      <button class="viewbtn" type="button" data-view="one">Paragraph</button>
    </div>
  </div>

  <div class="qdots" id="qdots"></div>
  <div id="board"><div class="loading">Loading…</div></div>
</div>

<div class="tip" id="tip"></div>

<div class="bar" id="bar">
  <button id="btnPrev" type="button">&lsaquo; Prev</button>
  <button id="btnRepeat" type="button">Repeat</button>
  <button class="go" id="btnSubmit" type="button" disabled>Submit</button>
  <button id="btnNext" type="button">Next &rsaquo;</button>
</div>

<div class="ov" id="ov">
  <div class="ov-card">
    <div class="ov-em" id="ovEm">🎉</div>
    <div class="ov-title" id="ovTitle">Done</div>
    <div class="ov-sc" id="ovScore"></div>
    <div class="ov-bars" id="ovBars"></div>
    <div class="ov-miss" id="ovMiss"></div>
    <div class="ov-btns">
      <button class="ov-btn primary" id="ovNext" type="button">Next text &rsaquo;</button>
      <button class="ov-btn ghost" id="ovAgain" type="button">↺ Try again</button>
      <button class="ov-btn ghost" id="ovClose" type="button">Review answers</button>
    </div>
  </div>
</div>

<script>
  /* One file per DENSITY, the way every other Use of English part names
     them. Adding 12, 15 or 20 is dropping a sibling file in beside these;
     this page needs no edit, and a tab whose file is missing arrives
     disabled rather than absent. */
  window.MC = {
    mode: 'texts',
    scoreKey: 'mc_texts_scores',
    datasets: [
      { name:'8 gaps',  path:'/data/use-of-english/multiple-choice/multiple-choice-8gaps.json'  },
      { name:'12 gaps', path:'/data/use-of-english/multiple-choice/multiple-choice-12gaps.json' },
      { name:'15 gaps', path:'/data/use-of-english/multiple-choice/multiple-choice-15gaps.json' },
      { name:'20 gaps', path:'/data/use-of-english/multiple-choice/multiple-choice-20gaps.json' }
    ]
  };
</script>
<!-- Shared with Forge, Defuse, Sort, Board and Pegs: one oscillator
     module, one device-wide mute. -->
<script src="/skills/grammar-rules/intuity-sound.js"></script>
<script src="/data/use-of-english/mc.js?v=1"></script>

</body>
</html>
