<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INTUITY - Multiple Choice Quiz</title>
  <meta name="theme-color" content="#F3F1ED">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500&family=Anton&display=swap" rel="stylesheet">
  <!-- The shell brings the header, the mode row and every token; uoe.css is
       the one stylesheet Parts 1-4 now share. This page's own stylesheet is
       gone: it held a private palette and a type stack, nothing unique. -->
  <link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=5">
  <link rel="stylesheet" href="/data/use-of-english/uoe.css?v=1">
  <style>
    /* Page-specific only. Everything shared lives in uoe.css.

       This one rule is deliberately here and not there: intuity-shell.css
       sets body{color:var(--paper)} and expects each page to set its own
       ink afterwards. If uoe.css fails to load, that rule stands and the
       page renders white on white — fully working and completely
       invisible. Declaring the ink inline means a missing stylesheet
       costs you the styling, not the page. */
    body{color:var(--ink,#14110E);background:var(--screen,#F3F1ED);}
  </style>
</head>
<body>
  <header class="header">
    <div class="header-top">
      <a class="back-link" href="/index.html?openModal=english" target="_top">&larr; Use of English</a>
      <div class="header-title">
        <div class="app-title">INTUITY</div>
        <div class="app-subtitle">Multiple Choice · Part 1</div>
      </div>
      <span class="header-spacer">Level <b>B2</b></span>
    </div>
    <div class="uoe-sets"><div class="dataset-selector">
        <button class="dataset-btn" onclick="toggleDatasetMenu()" aria-label="Select quiz type">Select Data ▾</button>
        <div class="dataset-dropdown" id="datasetDropdown" role="menu">
          <button class="dataset-option active" data-path="../../../data4/test-04.json" data-name="Set 1" role="menuitem">Set 1</button>
          <button class="dataset-option" data-path="../../../data2/test-01.json" data-name="Set 2" role="menuitem">Set 2</button>
          <button class="dataset-option" data-path="../../../data3/test-03.json" data-name="Set 3" role="menuitem">Set 3</button>
          <button class="dataset-option" disabled data-name="Texts" role="menuitem">Texts (Coming Soon)</button>
        </div>
      </div></div>
  </header>
<div class="container">
  

  <div class="test-nav">
    <div class="dots-container" id="dotsContainer" role="navigation" aria-label="Test selection"></div>
  </div>

  <div class="test-info" id="testInfo" role="status" aria-live="polite">Loading...</div>

  <div class="content-container">
    <div class="content-header-wrapper">
      <div class="question-nav-dots" id="questionNavDots"></div>
      <div class="mode-toggle-container">
        <span class="mode-toggle-label">Full</span>
        <div class="mode-toggle-switch" id="modeToggleSwitch" onclick="toggleMode()" role="switch" aria-checked="false" aria-label="Toggle between full exercise and single screen mode"></div>
        <span class="mode-toggle-label">Single</span>
      </div>
    </div>
    
    <div id="guidedContainer" class="hidden"></div>
    <div id="classicContainer">
      <div class="loading-state">
        <div class="loading-spinner"></div>
        <div>Loading quiz...</div>
      </div>
    </div>
  </div>

  <div class="external-nav">
    <button class="external-nav-arrow" id="prevQuestionBtn" onclick="navigatePrevQuestion()" aria-label="Previous question">← Previous Question</button>
    <button class="external-nav-arrow" id="nextQuestionBtn" onclick="navigateNextQuestion()" aria-label="Next question">Next Question →</button>
  </div>

  <div class="footer" id="footer" role="toolbar">
    <button onclick="showHint()" id="hintBtn" aria-label="Get a hint">Hint</button>
    <button onclick="showKey()" id="keyBtn" disabled aria-label="Show answer key" aria-pressed="false">Key</button>
    <button onclick="clearAnswers()" aria-label="Clear all answers">Clear</button>
    <button class="primary" onclick="submitAndScore()" id="submitBtn" aria-label="Submit for scoring">Submit</button>
  </div>
</div>

<div class="modal-overlay" id="scoreModal" role="dialog" aria-labelledby="scoreModalTitle" aria-modal="true">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="scoreModalTitle">Test Results</h2>
        <div class="modal-subtitle" id="modalSubtitle"></div>
      </div>
      <div class="score-display">
        <div class="score-number" id="scoreNumber" aria-label="Score">0/0</div>
        <div class="score-label">Score</div>
      </div>
      <div class="answers-section">
        <div id="answersDisplay"></div>
      </div>
      <div class="modal-footer">
        <button class="modal-btn modal-btn-secondary" onclick="closeModal()">Close</button>
        <button class="modal-btn modal-btn-primary" onclick="nextTestModal()">Next Test</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="alert" aria-live="polite"></div>
<script>
    // DATASETS array - count removed, calculated dynamically after load
    const DATASETS = [
      { name: 'Set 1', path: '../../../data4/test-04.json' },
      { name: 'Set 2', path: '../../../data2/test-01.json' },
      { name: 'Set 3', path: '../../../data3/test-03.json' }
    ];

    let allTests = [];
    let currentDatasetIndex = 0;
    let currentTest = 0;
    let currentQuestion = 0;
    let answers = {};
    let expandedQuestions = [];
    let currentMode = 'classic';
    let showingResults = false;
    let keyVisible = false;
    let testScores = {};
    let storageKey = '';

    function sanitizeText(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function showToast(message, duration = 2500) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), duration);
    }

    function getStorageKey() {
      return 'mc_progress_' + DATASETS[currentDatasetIndex].name.toLowerCase().replace(/\s+/g, '_');
    }

    function loadProgress() {
      try {
        storageKey = getStorageKey();
        const saved = localStorage.getItem(storageKey);
        testScores = saved ? JSON.parse(saved) : {};
      } catch (e) {
        console.error('Error loading progress:', e);
        testScores = {};
        showToast('⚠ Progress saving disabled', 3000);
      }
    }

    function saveProgress() {
      try {
        localStorage.setItem(storageKey, JSON.stringify(testScores));
      } catch (e) {
        console.error('Error saving progress:', e);
        showToast('⚠ Could not save progress', 3000);
      }
    }

    function toggleDatasetMenu() {
      document.getElementById('datasetDropdown').classList.toggle('active');
    }

    document.addEventListener('click', (e) => {
      const selector = document.querySelector('.dataset-selector');
      if (selector && !selector.contains(e.target)) {
        document.getElementById('datasetDropdown').classList.remove('active');
      }
    });

    async function init() {
      loadProgress();
      setupDatasetListeners();
      await loadDataset(0);
      setupKeyboardShortcuts();
    }

    function setupDatasetListeners() {
      document.querySelectorAll('.dataset-option:not([disabled])').forEach((btn, index) => {
        btn.addEventListener('click', async function() {
          document.querySelectorAll('.dataset-option').forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          currentDatasetIndex = index;
          toggleDatasetMenu();
          currentTest = 0;
          currentQuestion = 0;
          answers = {};
          expandedQuestions = [];
          await loadDataset(index);
        });
      });
    }

    function setupKeyboardShortcuts() {
      document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
          const footer = document.getElementById('footer');
          if (footer.classList.contains('visible') && !showingResults) {
            e.preventDefault();
            submitAndScore();
          }
        }
        if (e.key === 'Escape') {
          closeModal();
          const dropdown = document.getElementById('datasetDropdown');
          if (dropdown.classList.contains('active')) toggleDatasetMenu();
        }
        if (currentMode === 'guided' && !showingResults && !e.target.matches('input')) {
          if (e.key === 'ArrowLeft') navigatePrevQuestion();
          if (e.key === 'ArrowRight') navigateNextQuestion();
        }
      });
    }

    async function loadDataset(index) {
      try {
        showLoadingState();
        loadProgress();
        
        const response = await fetch(DATASETS[index].path);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        
        if (!data || !data.sets || !Array.isArray(data.sets)) {
          throw new Error('Invalid data format');
        }
        
        allTests = data.sets;
        
        updateDatasetButtonText(index);
        
        createDots();
        createQuestionNavDots();
        loadTest(0);
      } catch (error) {
        console.error('Error loading dataset:', error);
        showError(`Could not load quiz: ${error.message}`);
      }
    }

    function updateDatasetButtonText(index) {
      const buttons = document.querySelectorAll('.dataset-option:not([disabled])');
      if (buttons[index]) {
        const dataset = DATASETS[index];
        const count = allTests.length;
        buttons[index].textContent = `${dataset.name} (${count} tests)`;
      }
      
      if (index === currentDatasetIndex) {
        const mainBtn = document.querySelector('.dataset-btn');
        if (mainBtn) {
          mainBtn.textContent = 'Select Type ▾';
        }
      }
    }

    function showLoadingState() {
      const container = document.getElementById('classicContainer');
      container.innerHTML = `
        <div class="loading-state">
          <div class="loading-spinner"></div>
          <div>Loading quiz...</div>
        </div>
      `;
    }

    function showError(message) {
      const container = document.getElementById('classicContainer');
      container.innerHTML = `
        <div class="error-state">
          <div style="font-size: 3rem; margin-bottom: 1rem;">⚠</div>
          <div style="font-size: 1.125rem; color: var(--poster-ink); margin-bottom: 0.5rem;">Error Loading Quiz</div>
          <div style="font-size: 0.875rem; color: var(--poster-faint); margin-bottom: 1rem;">${sanitizeText(message)}</div>
          <button onclick="location.reload()" class="nav-btn nav-btn-primary">Reload</button>
        </div>
      `;
    }

    function createDots() {
      const container = document.getElementById('dotsContainer');
      container.innerHTML = '';
      
      for (let i = 0; i < allTests.length; i++) {
        const dot = document.createElement('button');
        dot.className = 'test-dot';
        dot.setAttribute('aria-label', `Test ${i + 1}`);
        
        if (i === currentTest) {
          dot.classList.add('current');
          dot.setAttribute('aria-current', 'true');
        }
        
        const score = testScores[`test${i}`];
        if (score) {
          const percentage = score.bestPercentage || score.percentage;
          if (percentage === 100) {
            dot.classList.add('perfect');
            dot.innerHTML = '<span class="star-badge">⭐</span>';
          } else if (percentage >= 75) dot.classList.add('excellent');
          else if (percentage >= 60) dot.classList.add('good');
          else if (percentage >= 50) dot.classList.add('fair');
          else dot.classList.add('poor');
        }
        
        dot.onclick = () => goToTest(i);
        container.appendChild(dot);
      }
    }

    function createQuestionNavDots() {
      const test = allTests[currentTest];
      if (!test || !test.sentences) return;
      
      const container = document.getElementById('questionNavDots');
      container.innerHTML = '';
      
      test.sentences.forEach((q, idx) => {
        const dot = document.createElement('button');
        dot.className = 'question-nav-dot';
        dot.setAttribute('aria-label', `Question ${idx + 1}`);
        
        if (idx === currentQuestion) {
          dot.classList.add('current');
          dot.setAttribute('aria-current', 'true');
        }
        
        if (answers[idx] !== undefined) {
          dot.classList.add('answered');
        }
        
        dot.onclick = () => jumpToQuestionNav(idx);
        container.appendChild(dot);
      });
      
      updateExternalNav();
    }

    function updateExternalNav() {
      const test = allTests[currentTest];
      if (!test) return;
      
      const prevBtn = document.getElementById('prevQuestionBtn');
      const nextBtn = document.getElementById('nextQuestionBtn');
      const navContainer = document.querySelector('.external-nav');
      const questionNavDots = document.getElementById('questionNavDots');
      
      if (currentMode === 'classic') {
        navContainer.style.display = 'none';
        if (questionNavDots) questionNavDots.classList.remove('hidden-guided');
      } else {
        navContainer.style.display = 'flex';
        prevBtn.disabled = currentQuestion === 0;
        nextBtn.disabled = currentQuestion >= test.sentences.length - 1;
        if (questionNavDots) questionNavDots.classList.add('hidden-guided');
      }
    }

    function loadTest(testIdx) {
      if (!allTests[testIdx]) return;
      
      currentTest = testIdx;
      currentQuestion = 0;
      answers = {};
      showingResults = false;
      keyVisible = false;
      
      const test = allTests[currentTest];
      if (test && test.sentences) {
        if (currentMode === 'classic') {
          expandedQuestions = test.sentences.map((_, idx) => idx);
        } else {
          expandedQuestions = [];
        }
      }
      
      createQuestionNavDots();
      
      if (currentMode === 'guided') renderGuidedMode();
      else renderClassicMode();
      
      updateTestInfo();
      updateFooter();
      updateKeyButton();
      updateExternalNav();
      createDots();
    }

    function updateTestInfo() {
      const test = allTests[currentTest];
      if (!test) return;
      const total = test.sentences.length;
      const answered = Object.keys(answers).length;
      const datasetName = DATASETS[currentDatasetIndex].name;
      document.getElementById('testInfo').textContent = 
        `${datasetName} • Test ${currentTest + 1} of ${allTests.length} • ${answered}/${total} answered`;
    }

    function goToTest(testIdx) {
      loadTest(testIdx);
    }

    function toggleMode() {
      const toggleSwitch = document.getElementById('modeToggleSwitch');
      
      if (currentMode === 'classic') {
        currentMode = 'guided';
        toggleSwitch.classList.add('active');
        toggleSwitch.setAttribute('aria-checked', 'true');
        document.getElementById('classicContainer').classList.add('hidden');
        document.getElementById('guidedContainer').classList.remove('hidden');
        renderGuidedMode();
      } else {
        currentMode = 'classic';
        toggleSwitch.classList.remove('active');
        toggleSwitch.setAttribute('aria-checked', 'false');
        document.getElementById('guidedContainer').classList.add('hidden');
        document.getElementById('classicContainer').classList.remove('hidden');
        
        const test = allTests[currentTest];
        if (test && test.sentences) {
          expandedQuestions = test.sentences.map((_, idx) => idx);
        }
        
        renderClassicMode();
      }
      updateExternalNav();
      showToast(`Switched to ${currentMode === 'classic' ? 'Full exercise' : 'Single screen'} mode`);
    }

    function renderGuidedMode() {
      const test = allTests[currentTest];
      if (!test || !test.sentences) return;
      
      const container = document.getElementById('guidedContainer');
      const questions = test.sentences;
      
      let html = '<div class="guided-container">';
      html += '<div class="question-dots">';
      questions.forEach((q, idx) => {
        const isCurrent = idx === currentQuestion;
        const isAnswered = answers[idx] !== undefined;
        html += `<div class="question-dot ${isCurrent ? 'current' : ''} ${isAnswered ? 'answered' : ''}" onclick="jumpToQuestion(${idx})" tabindex="0" role="button" aria-label="Question ${idx + 1}">${idx + 1}</div>`;
      });
      html += '</div>';
      
      const q = questions[currentQuestion];
      html += `
        <div class="question-card">
          <div class="question-label">Question ${currentQuestion + 1} of ${questions.length}</div>
          <div class="question-text-large">${sanitizeText(q.q)}</div>
          <div class="options-grid-large" id="optionsGridLarge"></div>
        </div>
      `;
      html += '</div>';
      
      container.innerHTML = html;
      
      const optionsGrid = document.getElementById('optionsGridLarge');
      const correctIndex = q.answer ? (q.answer.charCodeAt(0) - 65) : 0;
      
      q.options.forEach((option, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-large';
        
        if (keyVisible && showingResults) {
          if (idx === correctIndex) btn.classList.add('key-shown');
        } else if (showingResults) {
          if (idx === correctIndex) btn.classList.add('correct');
          if (answers[currentQuestion] === idx && idx !== correctIndex) btn.classList.add('incorrect');
        } else {
          if (answers[currentQuestion] === idx) btn.classList.add('selected');
        }
        
        const letter = option.charAt(0);
        const text = option.substring(3).trim();
        btn.innerHTML = `<span class="option-letter">${letter}</span> ${sanitizeText(text)}`;
        
        if (!showingResults) {
          btn.onclick = () => {
            selectAnswer(currentQuestion, idx);
            renderGuidedMode();
            createQuestionNavDots();
          };
        }
        
        optionsGrid.appendChild(btn);
      });
    }

    function renderClassicMode() {
      const test = allTests[currentTest];
      if (!test || !test.sentences) return;
      
      const container = document.getElementById('classicContainer');
      
      const scrollPos = window.scrollY;
      
      container.innerHTML = '<div class="questions-list"></div>';
      const list = container.querySelector('.questions-list');
      
      test.sentences.forEach((q, qIdx) => {
        const isExpanded = expandedQuestions.includes(qIdx);
        const isAnswered = answers[qIdx] !== undefined;
        const correctIndex = q.answer ? (q.answer.charCodeAt(0) - 65) : 0;
        
        const questionDiv = document.createElement('div');
        questionDiv.className = 'question-item' + (isExpanded ? ' expanded' : '');
        
        const headerDiv = document.createElement('div');
        headerDiv.className = 'question-header';
        
        const numberDiv = document.createElement('div');
        numberDiv.className = 'question-number' + (isAnswered ? ' answered' : '');
        numberDiv.textContent = qIdx + 1;
        numberDiv.onclick = () => toggleQuestion(qIdx);
        
        const textDiv = document.createElement('div');
        textDiv.className = 'question-text';
        textDiv.textContent = q.q;
        
        headerDiv.appendChild(numberDiv);
        headerDiv.appendChild(textDiv);
        
        if (isExpanded) {
          const closeBtn = document.createElement('button');
          closeBtn.className = 'close-btn';
          closeBtn.textContent = '✕';
          closeBtn.onclick = () => toggleQuestion(qIdx);
          headerDiv.appendChild(closeBtn);
        }
        
        questionDiv.appendChild(headerDiv);
        
        if (isExpanded) {
          const optionsGrid = document.createElement('div');
          optionsGrid.className = 'options-grid';
          
          q.options.forEach((option, idx) => {
            const optionBtn = document.createElement('button');
            optionBtn.className = 'option';
            
            if (keyVisible && showingResults) {
              if (idx === correctIndex) optionBtn.classList.add('key-shown');
            } else if (showingResults) {
              if (idx === correctIndex) optionBtn.classList.add('correct');
              if (answers[qIdx] === idx && idx !== correctIndex) optionBtn.classList.add('incorrect');
            } else {
              if (answers[qIdx] === idx) optionBtn.classList.add('selected');
            }
            
            if (!showingResults) {
              optionBtn.onclick = () => {
                selectAnswer(qIdx, idx);
                renderClassicMode();
              };
            }
            
            const letter = option.charAt(0);
            const text = option.substring(3).trim();
            optionBtn.innerHTML = `<span class="option-letter">${letter}</span> ${sanitizeText(text)}`;
            optionsGrid.appendChild(optionBtn);
          });
          
          questionDiv.appendChild(optionsGrid);
        }
        
        list.appendChild(questionDiv);
      });
      
      requestAnimationFrame(() => {
        window.scrollTo(0, scrollPos);
      });
    }

    function toggleQuestion(qIdx) {
      currentQuestion = qIdx;
      if (expandedQuestions.includes(qIdx)) {
        expandedQuestions = expandedQuestions.filter(id => id !== qIdx);
      } else {
        expandedQuestions.push(qIdx);
      }
      renderClassicMode();
      createQuestionNavDots();
    }

    function selectAnswer(qIdx, answerIdx) {
      if (showingResults) return;
      answers[qIdx] = answerIdx;
      createQuestionNavDots();
      updateTestInfo();
      updateFooter();
    }

    function navigatePrevQuestion() {
      if (currentQuestion > 0) {
        currentQuestion--;
        if (currentMode === 'guided') renderGuidedMode();
        else {
          renderClassicMode();
          scrollToQuestion(currentQuestion);
        }
        createQuestionNavDots();
      }
    }

    function navigateNextQuestion() {
      const test = allTests[currentTest];
      if (currentQuestion < test.sentences.length - 1) {
        currentQuestion++;
        if (currentMode === 'guided') renderGuidedMode();
        else {
          renderClassicMode();
          scrollToQuestion(currentQuestion);
        }
        createQuestionNavDots();
      }
    }

    function jumpToQuestion(idx) {
      currentQuestion = idx;
      renderGuidedMode();
      createQuestionNavDots();
    }

    function jumpToQuestionNav(idx) {
      currentQuestion = idx;
      if (currentMode === 'guided') {
        renderGuidedMode();
      } else {
        if (!expandedQuestions.includes(idx)) {
          expandedQuestions.push(idx);
        }
        renderClassicMode();
        scrollToQuestion(idx);
      }
      createQuestionNavDots();
    }

    function scrollToQuestion(idx) {
      setTimeout(() => {
        const questionEl = document.querySelectorAll('.question-item')[idx];
        if (questionEl) {
          questionEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }, 100);
    }

    function updateFooter() {
      const test = allTests[currentTest];
      if (!test) return;
      
      const total = test.sentences.length;
      const answered = Object.keys(answers).length;
      const footer = document.getElementById('footer');
      
      if (answered === total && !showingResults) {
        footer.classList.add('visible');
      } else if (showingResults) {
        footer.classList.add('visible');
      } else {
        footer.classList.remove('visible');
      }
      
      updateTestInfo();
    }

    function updateKeyButton() {
      const btn = document.getElementById('keyBtn');
      if (!btn) return;
      
      if (showingResults) {
        btn.disabled = false;
        btn.textContent = keyVisible ? 'Hide Key' : 'Key';
        btn.classList.toggle('key-active', keyVisible);
        btn.setAttribute('aria-pressed', keyVisible ? 'true' : 'false');
      } else {
        btn.disabled = true;
        btn.textContent = 'Key';
        btn.classList.remove('key-active');
        btn.setAttribute('aria-pressed', 'false');
      }
    }

    function showHint() {
      if (showingResults) {
        showToast('Hints not available after submission');
        return;
      }
      
      const test = allTests[currentTest];
      const unanswered = test.sentences
        .map((q, idx) => idx)
        .filter(idx => answers[idx] === undefined);
      
      if (unanswered.length === 0) {
        showToast('All questions answered!');
        return;
      }
      
      const randomIdx = unanswered[Math.floor(Math.random() * unanswered.length)];
      
      if (currentMode === 'guided') {
        currentQuestion = randomIdx;
        renderGuidedMode();
        createQuestionNavDots();
        showToast(`Showing question ${randomIdx + 1}`, 2000);
      } else {
        if (!expandedQuestions.includes(randomIdx)) {
          expandedQuestions.push(randomIdx);
        }
        currentQuestion = randomIdx;
        renderClassicMode();
        createQuestionNavDots();
        scrollToQuestion(randomIdx);
        showToast(`Highlighted question ${randomIdx + 1}`, 2000);
      }
    }

    function showKey() {
      if (!showingResults) {
        showToast('Submit first to enable Key');
        return;
      }
      
      keyVisible = !keyVisible;
      updateKeyButton();
      
      if (currentMode === 'guided') renderGuidedMode();
      else renderClassicMode();
      
      showToast(keyVisible ? 'Showing all correct answers' : 'Key hidden');
    }

    function clearAnswers() {
      if (showingResults) {
        showToast('Cannot clear - test is locked');
        return;
      }
      
      if (Object.keys(answers).length === 0) {
        showToast('Nothing to clear');
        return;
      }
      
      if (confirm('Clear all answers?')) {
        answers = {};
        if (currentMode === 'guided') renderGuidedMode();
        else renderClassicMode();
        createQuestionNavDots();
        updateTestInfo();
        updateFooter();
        showToast('Cleared');
      }
    }

    function submitAndScore() {
      const test = allTests[currentTest];
      const total = test.sentences.length;
      const answered = Object.keys(answers).length;
      
      if (answered < total) {
        showToast('Please answer all questions');
        return;
      }
      
      let correct = 0;
      test.sentences.forEach((q, idx) => {
        const correctIndex = q.answer ? (q.answer.charCodeAt(0) - 65) : 0;
        if (answers[idx] === correctIndex) correct++;
      });
      
      const percentage = Math.round((correct / total) * 100);
      
      const existingScore = testScores[`test${currentTest}`];
      const isNewBest = !existingScore || percentage > (existingScore.bestPercentage || 0);
      
      testScores[`test${currentTest}`] = {
        correct,
        total,
        percentage,
        firstAttemptScore: !existingScore ? percentage : existingScore.firstAttemptScore,
        bestPercentage: Math.max(percentage, existingScore?.bestPercentage || 0),
        attempts: (existingScore?.attempts || 0) + 1,
        timestamp: new Date().toISOString()
      };
      
      saveProgress();
      
      showingResults = true;
      keyVisible = false;
      
      const testData = allTests[currentTest];
      if (testData && testData.sentences) {
        expandedQuestions = testData.sentences.map((_, idx) => idx);
      }
      
      if (currentMode === 'guided') renderGuidedMode();
      else renderClassicMode();
      
      updateKeyButton();
      updateFooter();
      createDots();
      
      setTimeout(() => showResultsModal(test, correct, total, percentage), 200);
    }

    function showResultsModal(test, correct, total, percentage) {
      const datasetName = DATASETS[currentDatasetIndex].name;
      const existingScore = testScores[`test${currentTest}`];
      const attempts = existingScore?.attempts || 1;
      
      let subtitle = `${datasetName} • Test ${currentTest + 1} of ${allTests.length}`;
      if (attempts > 1) {
        subtitle += ` • Attempt ${attempts}`;
        if (percentage > (existingScore.firstAttemptScore || 0)) {
          subtitle += ' (Improved!)';
        }
      }
      
      document.getElementById('modalSubtitle').textContent = subtitle;
      document.getElementById('scoreNumber').textContent = `${correct}/${total}`;
      
      const answersDisplay = document.getElementById('answersDisplay');
      let html = '';
      
      if (percentage === 100) {
        html += '<div style="text-align: center; padding: 1.5rem; font-size: 1.375rem; color: var(--tile-ok-ink); font-weight: 600;">Perfect Score ⭐</div>';
      } else if (percentage >= 75) {
        html += '<div style="text-align: center; padding: 1.5rem; font-size: 1.25rem; color: var(--tile-ok-ink); font-weight: 600;">Great Job!</div>';
      } else if (percentage >= 60) {
        html += '<div style="text-align: center; padding: 1.5rem; color: var(--poster-body); font-weight: 500;">Good Effort</div>';
      } else if (percentage >= 50) {
        html += '<div style="text-align: center; padding: 1.5rem; color: var(--accent-ink); font-weight: 500;">Keep Practicing</div>';
      } else {
        html += '<div style="text-align: center; padding: 1.5rem; color: var(--accent-ink); font-weight: 500;">Review & Try Again</div>';
      }
      
      test.sentences.forEach((q, idx) => {
        const userAnswer = answers[idx];
        const correctIndex = q.answer ? (q.answer.charCodeAt(0) - 65) : 0;
        const isCorrect = userAnswer === correctIndex;
        const userLetter = userAnswer !== undefined ? String.fromCharCode(65 + userAnswer) : '?';
        const correctLetter = q.answer || 'A';
        
        html += `
          <div class="answer-item ${isCorrect ? 'correct' : 'incorrect'}" style="animation-delay: ${idx * 50}ms">
            <span>Q${idx + 1}: <strong>${userLetter}</strong></span>
            ${!isCorrect ? `<span style="color: var(--tile-ok-ink);">→ ${correctLetter}</span>` : '<span style="color: var(--tile-ok-ink);">✓</span>'}
          </div>
        `;
      });
      
      answersDisplay.innerHTML = html;
      document.getElementById('scoreModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('scoreModal').classList.remove('active');
    }

    function nextTestModal() {
      closeModal();
      if (currentTest < allTests.length - 1) {
        goToTest(currentTest + 1);
      } else {
        showToast('No more tests available');
      }
    }

    document.getElementById('scoreModal').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });

    window.addEventListener('load', init);
  </script>
<script>
function syncHeader(){
  var h=document.querySelector('.header');
  if(h) document.documentElement.style.setProperty('--header-h', h.offsetHeight+'px');
}
addEventListener('resize', syncHeader);
addEventListener('orientationchange', function(){ setTimeout(syncHeader,120); });
if(document.fonts && document.fonts.ready) document.fonts.ready.then(syncHeader);
if(window.ResizeObserver){ var hh=document.querySelector('.header'); if(hh) new ResizeObserver(syncHeader).observe(hh); }
syncHeader();
</script>
</body>
