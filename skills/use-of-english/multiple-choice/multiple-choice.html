<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>INTUITY — Multiple Choice · Part 1</title>
<meta name="theme-color" content="#F3F1ED">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500&family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=5">
<link rel="stylesheet" href="/data/use-of-english/uoe.css?v=2">
<style>
  /* Page-specific only — the header, the tokens and the shared exam
     furniture live in the shell and in uoe.css.

     This first rule is deliberately here and not there: intuity-shell.css
     sets body{color:var(--paper)} and expects each page to set its own ink.
     If uoe.css fails to load, that rule stands and the page renders white
     on white: working, and completely invisible. */
  body{color:var(--ink,#14110E);background:var(--screen,#F3F1ED);}

  .wrapper{max-width:var(--w-read,44rem);margin:0 auto;
    padding:calc(var(--header-h,120px) + 1.1rem) var(--gutter,1rem) 6rem;}
  .loading{text-align:center;padding:3rem 1rem;color:var(--poster-faint);
    font-family:var(--f-mono);font-size:.8rem;}

  /* ── THE SET ROW ── */
  .setrow{display:flex;align-items:center;justify-content:center;gap:.8rem;margin:0 0 1.1rem;}
  .setrow .arrow{width:34px;height:34px;flex:none;border:none;border-radius:50%;
    background:var(--poster-fill);color:var(--poster-ink);cursor:pointer;
    font-size:1rem;line-height:1;display:flex;align-items:center;justify-content:center;
    transition:background .15s,transform .12s;}
  .setrow .arrow:active:not(:disabled){transform:scale(.94);}
  .setrow .arrow:disabled{opacity:.32;cursor:default;}
  .setrow .label{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.16em;
    text-transform:uppercase;color:var(--poster-faint);min-width:8.5rem;text-align:center;}

  /* Progress, not a scorecard: a filled dot is one answered, so how many
     are left reads at a glance — count the hollow ones. */
  .qdots{display:flex;gap:.4rem;justify-content:center;flex-wrap:wrap;margin-bottom:1.2rem;}
  .qdot{width:.55rem;height:.55rem;padding:0;border:none;border-radius:50%;
    background:none;box-shadow:inset 0 0 0 1.5px var(--rule);cursor:pointer;
    transition:background .2s,box-shadow .2s,transform .18s;}
  .qdot.filled{background:var(--caramel);box-shadow:none;}
  .qdot.cur{transform:scale(1.3);box-shadow:0 0 0 2px var(--screen),0 0 0 3.5px var(--caramel);}
  .qdot.ok{background:var(--tile-ok-ink);box-shadow:none;}
  .qdot.no{background:var(--tile-no-ink);box-shadow:none;}

  /* ── THE CARD ────────────────────────────────────────────────────
     Named mc-* rather than .sheet / .kick / .qline. intuity-shell.css
     already owns .sheet, and there it is a full-screen modal:
     position:fixed, display:none until .open. Reusing the name rendered
     all eight sentences and then hid them — the DOM was right, the ink was
     right, the height was zero. Any class a page invents needs a prefix. */
  .mc-card{background:var(--card);border-radius:var(--r-sheet);
    padding:1.6rem 1.4rem 1.5rem;
    box-shadow:0 6px 16px -8px rgba(20,17,14,.16),0 1px 3px rgba(20,17,14,.07);}
  .mc-kick{display:flex;align-items:center;gap:9px;margin-bottom:1.2rem;
    font-family:var(--f-mono);font-size:.56rem;letter-spacing:.22em;
    text-transform:uppercase;color:var(--poster-faint);}
  .mc-kick::before{content:'';display:block;width:26px;height:10px;flex:none;background:var(--caramel);}
  .mc-kick .right{margin-left:auto;letter-spacing:.14em;}

  .mc-line{display:flex;gap:.9rem;align-items:baseline;
    padding:1.05rem 0;border-top:1px solid var(--poster-rule);}
  .mc-line:first-of-type{border-top:none;padding-top:0;}
  .mc-num{font-family:var(--f-mono);font-size:.58rem;color:var(--poster-faint);
    flex:none;font-variant-numeric:tabular-nums;padding-top:.25rem;}
  .mc-text{font-size:1rem;line-height:2.1;color:var(--poster-ink);}

  /* One at a time: the sentence is the headline of the screen. */
  .solo .mc-line{border:none;padding:0;}
  .solo .mc-num{display:none;}
  .solo .mc-text{font-family:'Anton',Impact,var(--f-display),sans-serif;font-weight:400;
    font-size:clamp(1.3rem,4.4vw,1.85rem);line-height:1.55;}

  /* ── THE GAP IS THE CONTROL ── */
  .gapbtn{display:inline-flex;align-items:center;justify-content:center;
    min-width:6.5rem;padding:.15rem .7rem;margin:0 .15rem;
    font-family:var(--f-display);font-size:.95rem;font-weight:600;
    color:var(--poster-faint);background:var(--poster-fill);
    border:none;border-radius:var(--r-field);cursor:pointer;vertical-align:baseline;
    box-shadow:inset 0 0 0 1px var(--poster-rule);
    transition:background .15s,box-shadow .15s,color .15s;}
  .gapbtn:hover{background:var(--poster-fill-hi);}
  .gapbtn.filled{color:var(--poster-ink);background:var(--poster-fill-hi);box-shadow:none;}
  .gapbtn.open{box-shadow:inset 0 0 0 2px var(--caramel);}
  .gapbtn.ok{background:var(--tile-ok-bg);color:var(--tile-ok-ink);box-shadow:none;}
  .gapbtn.no{background:var(--tile-no-bg);color:var(--tile-no-ink);box-shadow:none;
    text-decoration:line-through;}
  .solo .gapbtn{font-size:inherit;min-width:8rem;}
  .fix{font-family:var(--f-display);font-size:.8rem;font-weight:600;
    color:var(--tile-ok-ink);margin-left:.4rem;white-space:nowrap;}

  /* ── THE TOOLTIP ───────────────────────────────────────────────────
     Narrow, anchored to the gap it belongs to, four choices and nothing
     else. It closes the moment one is taken and the word drops into the
     sentence — which is where the student is already reading. A list of
     options set apart from the sentence makes the reader look away from
     the thing the question is about. */
  .tip{position:absolute;z-index:70;width:13.5rem;
    background:var(--card);border-radius:var(--r-sheet);overflow:hidden;
    box-shadow:0 18px 44px -14px rgba(20,17,14,.34),0 4px 10px rgba(20,17,14,.12);
    opacity:0;transform:translateY(-4px);pointer-events:none;
    transition:opacity .14s ease,transform .14s ease;}
  .tip.show{opacity:1;transform:none;pointer-events:auto;}
  .tip-head{font-family:var(--f-mono);font-size:.5rem;letter-spacing:.16em;
    text-transform:uppercase;color:var(--poster-faint);padding:.6rem .85rem .35rem;}
  .tip-opt{display:flex;width:100%;align-items:baseline;gap:.6rem;
    padding:.6rem .85rem;background:none;border:none;cursor:pointer;text-align:left;
    border-top:1px solid var(--poster-rule);
    font-family:var(--f-display);font-size:.9rem;font-weight:500;color:var(--poster-ink);
    transition:background .12s;}
  .tip-opt:hover{background:var(--poster-fill);}
  .tip-opt .let{font-family:var(--f-mono);font-size:.58rem;color:var(--poster-faint);flex:none;}
  .tip-opt.chosen{background:var(--poster-fill-hi);font-weight:700;}

  /* ── FOOTER ── */
  .bar{position:fixed;left:0;right:0;bottom:0;z-index:40;
    display:flex;align-items:center;justify-content:center;gap:.6rem;flex-wrap:wrap;
    background:var(--screen);border-top:1px solid var(--rule);
    padding:.7rem calc(.7rem + env(safe-area-inset-bottom,0px));}
  .bar button{font-family:var(--f-display);font-size:.68rem;font-weight:700;
    letter-spacing:.08em;text-transform:uppercase;padding:.6rem 1.3rem;
    border:none;border-radius:999px;cursor:pointer;
    background:var(--poster-fill);color:var(--poster-ink);
    transition:background .15s,filter .15s,transform .1s;}
  .bar button:active:not(:disabled){transform:scale(.98);}
  .bar button:disabled{opacity:.4;cursor:default;}
  .bar .go{background:var(--sage,#527065);color:var(--card);min-width:9rem;}
  .bar .go:hover:not(:disabled){filter:brightness(.94);}

  /* ── SCORE ── */
  .ov{position:fixed;inset:0;z-index:90;display:none;
    align-items:center;justify-content:center;padding:1.1rem;
    background:rgba(20,17,14,.55);backdrop-filter:blur(6px);}
  .ov.show{display:flex;}
  .ov-card{width:min(520px,100%);max-height:86vh;overflow-y:auto;text-align:center;
    background:var(--card);border-radius:var(--r-sheet);padding:2rem 1.6rem 1.5rem;
    box-shadow:0 24px 60px -18px rgba(20,17,14,.38),0 6px 16px rgba(20,17,14,.14);}
  .ov-em{font-size:2.2rem;}
  .ov-title{font-family:'Anton',Impact,var(--f-display),sans-serif;font-weight:400;
    text-transform:uppercase;font-size:clamp(2rem,9vw,2.9rem);line-height:.95;
    color:var(--poster-ink);margin:.3rem 0 .2rem;}
  .ov-sc{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.14em;
    text-transform:uppercase;color:var(--poster-faint);}
  .ov-bars{display:flex;gap:3px;justify-content:center;margin:1rem 0;}
  .ov-bar{width:12px;height:30px;border-radius:3px;background:var(--poster-fill);}
  .ov-miss{text-align:left;margin-top:.6rem;}
  .ov-miss-h{font-family:var(--f-mono);font-size:.54rem;letter-spacing:.16em;
    text-transform:uppercase;color:var(--poster-faint);margin-bottom:.5rem;}
  .ov-miss-i{font-size:.86rem;line-height:1.6;color:var(--poster-body);
    padding:.35rem 0;border-top:1px solid var(--poster-rule);}
  .ov-miss-i b{color:var(--tile-ok-ink);}
  .ov-miss-i s{color:var(--tile-no-ink);opacity:.8;}
  .ov-btns{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin-top:1.3rem;}
  .ov-btn{font-family:var(--f-display);font-size:.7rem;font-weight:700;
    letter-spacing:.08em;text-transform:uppercase;padding:.7rem 1.4rem;
    border:none;border-radius:999px;cursor:pointer;transition:filter .15s;}
  .ov-btn.primary{background:var(--sage,#527065);color:var(--card);}
  .ov-btn.ghost{background:var(--poster-fill);color:var(--poster-ink);}
  .ov-btn:hover{filter:brightness(.96);}

  /* .vtab is the shell's tab button — NOT .set-tab, which nothing styles.
     An unstyled button inherits body{color:var(--paper)}: white on white,
     present but invisible. Same trap as the missing uoe.css. */
  .vtab .pct{font-family:var(--f-mono);font-size:.82em;opacity:.7;
    font-variant-numeric:tabular-nums;}

  .mute{border:none;background:none;cursor:pointer;font-size:.9rem;line-height:1;
    padding:0 .5rem 0 0;opacity:.75;}
  .mute.off{opacity:.32;filter:grayscale(1);}

  @media(max-width:560px){
    .header-top{flex-wrap:wrap;row-gap:.2rem;}
    .header-title{order:3;flex:1 0 100%;text-align:center;}
    .mc-card{padding:1.2rem 1rem;}
    .mc-text{font-size:.95rem;line-height:2.15;}
    .tip{width:12rem;}
    .setrow .label{min-width:7rem;font-size:.55rem;}
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-top">
    <a class="back-link" href="/index.html?openModal=english" target="_top">&larr; Use of English</a>
    <div class="header-title">
      <div class="app-title">INTUITY</div>
      <div class="app-subtitle">Use of English &middot; Part 1</div>
    </div>
    <span class="header-spacer">
      <button class="mute" id="mute" type="button" aria-label="Sound">&#128266;</button>
      Level <b>B2</b>
    </span>
  </div>
  <div class="mode-selector">
    <button class="mode-btn active" type="button" data-mode="full">Full test</button>
    <button class="mode-btn"        type="button" data-mode="solo">One at a time</button>
  </div>
  <!-- The dataset picker, as tabs. It was a dropdown floating over the
       page; a set is a choice among three, and three things fit on a row.
       Same set-tabs the collocations page uses. -->
  <div class="set-tabs" id="setTabs"></div>
</header>

<div class="wrapper">
  <div class="setrow">
    <button class="arrow" id="prevSet" type="button" aria-label="Previous test">&lsaquo;</button>
    <span class="label" id="setLabel">Loading</span>
    <button class="arrow" id="nextSet" type="button" aria-label="Next test">&rsaquo;</button>
  </div>
  <div class="qdots" id="qdots"></div>
  <div id="board"><div class="loading">Loading…</div></div>
</div>

<div class="tip" id="tip"></div>

<div class="bar" id="bar">
  <button id="btnPrev" type="button">&lsaquo; Prev</button>
  <button id="btnRepeat" type="button">Repeat</button>
  <button class="go" id="btnSubmit" type="button" disabled>Submit</button>
  <button id="btnNext" type="button">Next &rsaquo;</button>
</div>

<div class="ov" id="ov">
  <div class="ov-card">
    <div class="ov-em" id="ovEm">🎉</div>
    <div class="ov-title" id="ovTitle">Done</div>
    <div class="ov-sc" id="ovScore"></div>
    <div class="ov-bars" id="ovBars"></div>
    <div class="ov-miss" id="ovMiss"></div>
    <div class="ov-btns">
      <button class="ov-btn primary" id="ovNext" type="button">Next test &rsaquo;</button>
      <button class="ov-btn ghost" id="ovAgain" type="button">↺ Try again</button>
      <button class="ov-btn ghost" id="ovClose" type="button">Review answers</button>
    </div>
  </div>
</div>

<script src="/skills/grammar-rules/intuity-sound.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════
   PART 1 · MULTIPLE CHOICE

   The data is sets of 8 sentences, each with four options and one answer
   — the set IS the test. Two readings of it:

     Full test       all 8 on one card, scrolled
     One at a time   one sentence per card, prev / repeat / next

   In both, the GAP is the control. Tapping it opens a narrow tooltip
   holding only the four choices; taking one closes the tooltip and drops
   the word into the sentence.
   ═══════════════════════════════════════════════════════════════════ */

const DATASETS = [
  { name:'Set 1', path:'../../../data4/test-04.json' },
  { name:'Set 2', path:'../../../data2/test-01.json' },
  { name:'Set 3', path:'../../../data3/test-03.json' }
];

let BANKS=[];      /* one entry per dataset, each holding its own tests */
let bi=0;          /* which dataset */
let TESTS=[];      /* the current dataset's tests */
let si=0;          /* which test within it */
let qi=0;          /* which sentence, in one-at-a-time */
let answers={};    /* index -> 'A'|'B'|'C'|'D' */
let marked=false;
let mode='full';

const $=id=>document.getElementById(id);
function sfx(n){ try{ if(window.SFX&&SFX[n]) SFX[n](); }catch(e){} }

Promise.all(DATASETS.map(d=>
  fetch(d.path).then(r=>{ if(!r.ok) throw new Error(d.name); return r.json(); }).catch(()=>null)
)).then(list=>{
  list.forEach((j,di)=>{
    if(!j||!j.sets) return;
    const tests=j.sets.filter(s=>s.sentences&&s.sentences.length)
                      .map(s=>({items:s.sentences}));
    if(tests.length) BANKS.push({name:DATASETS[di].name,tests:tests});
  });
  if(!BANKS.length) throw new Error('no sets found');
  paintTabs();
  loadBank(0);
}).catch(err=>{
  $('board').innerHTML='<div class="loading">Couldn\u2019t load the tests ('+err.message+').</div>';
});

/* Options arrive as "A) march": the letter is the key, the word is what
   belongs in the sentence. Split once, here, rather than at every use. */
function optParts(o){
  const m=String(o).match(/^\s*([A-D])\s*\)\s*(.*)$/);
  return m ? {letter:m[1],word:m[2].trim()} : {letter:'',word:String(o).trim()};
}
function wordFor(item,letter){
  const hit=item.options.map(optParts).find(p=>p.letter===letter);
  return hit?hit.word:'';
}

/* A set is a bank of tests. Choosing one starts at its first test. */
function loadBank(i){
  bi=(i+BANKS.length)%BANKS.length;
  TESTS=BANKS[bi].tests;
  paintTabs();
  loadSet(0);
}
function loadSet(i){
  si=(i+TESTS.length)%TESTS.length;
  qi=0; answers={}; marked=false;
  render();
}

function paintTabs(){
  $('setTabs').innerHTML=BANKS.map((b,i)=>
    '<button class="vtab'+(i===bi?' active':'')+'" type="button" data-b="'+i+'">'+
    b.name+' <span class="pct">'+b.tests.length+'</span></button>').join('');
  $('setTabs').querySelectorAll('.vtab').forEach(t=>{
    t.onclick=()=>{ if(+t.dataset.b!==bi) loadBank(+t.dataset.b); };
  });
  syncHeader();
}

function render(){
  const items=TESTS[si].items;
  $('setLabel').textContent='Test '+(si+1)+' of '+TESTS.length;
  $('setLabel').title=BANKS[bi].name;
  $('prevSet').disabled=si===0;
  $('nextSet').disabled=si===TESTS.length-1;

  const shown = mode==='full' ? items.map((_,i)=>i) : [qi];
  const lines = shown.map(i=>{
    const it=items[i], chosen=answers[i];
    const gap='<button class="gapbtn'+(chosen?' filled':'')+
      (marked&&chosen?(chosen===it.answer?' ok':' no'):'')+
      '" data-q="'+i+'">'+(chosen?wordFor(it,chosen):'&nbsp;&nbsp;&nbsp;&nbsp;')+'</button>'+
      (marked&&chosen&&chosen!==it.answer
        ? '<span class="fix">'+wordFor(it,it.answer)+'</span>':'');
    const text=String(it.q).replace(/_{2,}/,gap);
    return '<div class="mc-line"><span class="mc-num">'+String(i+1).padStart(2,'0')+
           '</span><span class="mc-text">'+text+'</span></div>';
  }).join('');

  $('board').innerHTML='<div class="mc-card'+(mode==='solo'?' solo':'')+'">'+
    '<div class="mc-kick">Multiple choice<span class="right">'+
      (mode==='full' ? Object.keys(answers).length+' / '+items.length+' answered'
                     : 'Question '+(qi+1)+' of '+items.length)+
    '</span></div>'+lines+'</div>';

  $('board').querySelectorAll('.gapbtn').forEach(b=>{
    b.addEventListener('click',e=>{ e.stopPropagation(); openTip(b,+b.dataset.q); });
  });
  paintDots(); paintBar();
}

function paintDots(){
  const items=TESTS[si].items;
  $('qdots').innerHTML=items.map((it,i)=>{
    let c='qdot';
    if(marked&&answers[i]!==undefined) c+= answers[i]===it.answer?' ok':' no';
    else if(answers[i]!==undefined) c+=' filled';
    if(mode==='solo'&&i===qi) c+=' cur';
    return '<button class="'+c+'" data-i="'+i+'" aria-label="Question '+(i+1)+'"></button>';
  }).join('');
  $('qdots').querySelectorAll('.qdot').forEach(d=>{
    d.onclick=()=>{
      const i=+d.dataset.i;
      if(mode==='solo'){ qi=i; render(); }
      else{
        const g=$('board').querySelector('.gapbtn[data-q="'+i+'"]');
        if(g){ g.scrollIntoView({behavior:'smooth',block:'center'});
               setTimeout(()=>openTip(g,i),280); }
      }
    };
  });
}

function paintBar(){
  const items=TESTS[si].items;
  const all=items.every((_,i)=>answers[i]!==undefined);
  const solo=mode==='solo';
  $('btnPrev').style.display   = solo?'':'none';
  $('btnRepeat').style.display = solo?'':'none';
  $('btnNext').style.display   = solo?'':'none';
  $('btnPrev').disabled=qi===0;
  $('btnNext').disabled=qi===items.length-1;
  $('btnSubmit').disabled=!all||marked;
  $('btnSubmit').textContent=marked?'Marked':'Submit';
}

/* ── the tooltip ──────────────────────────────────────────────────── */
function openTip(btn,i){
  if(marked) return;
  const it=TESTS[si].items[i], tip=$('tip');
  document.querySelectorAll('.gapbtn.open').forEach(b=>b.classList.remove('open'));
  btn.classList.add('open');

  tip.innerHTML='<div class="tip-head">Choose one</div>'+
    it.options.map(o=>{
      const p=optParts(o);
      return '<button class="tip-opt'+(answers[i]===p.letter?' chosen':'')+
        '" data-l="'+p.letter+'"><span class="let">'+p.letter+'</span>'+p.word+'</button>';
    }).join('');
  tip.querySelectorAll('.tip-opt').forEach(o=>{
    o.onclick=e=>{ e.stopPropagation(); choose(i,o.dataset.l); };
  });

  /* Anchored under its own gap, and pulled back inside the viewport when
     the gap sits near an edge — a tooltip off the screen is worse than
     none. Flips above the gap when there is no room below. */
  tip.classList.add('show');
  const r=btn.getBoundingClientRect(), tw=tip.offsetWidth, th=tip.offsetHeight;
  let x=r.left+r.width/2-tw/2;
  x=Math.max(8,Math.min(x,window.innerWidth-tw-8));
  let y=r.bottom+window.scrollY+8;
  if(r.bottom+th+8>window.innerHeight) y=r.top+window.scrollY-th-8;
  tip.style.left=x+'px'; tip.style.top=y+'px';
}
function closeTip(){
  $('tip').classList.remove('show');
  document.querySelectorAll('.gapbtn.open').forEach(b=>b.classList.remove('open'));
}
document.addEventListener('click',e=>{ if(!e.target.closest('.tip')) closeTip(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeTip(); });
window.addEventListener('scroll',closeTip,{passive:true});

function choose(i,letter){
  answers[i]=letter;
  sfx('tick');
  closeTip();
  render();
  /* One at a time: taking an answer moves you on, so the rhythm is
     read-choose-read rather than read-choose-reach-for-a-button. */
  if(mode==='solo'&&qi<TESTS[si].items.length-1){
    setTimeout(()=>{ qi++; render(); },260);
  }
}

/* ── marking ──────────────────────────────────────────────────────── */
function submit(){
  const items=TESTS[si].items;
  if(marked||!items.every((_,i)=>answers[i]!==undefined)) return;
  marked=true;
  let ok=0; items.forEach((it,i)=>{ if(answers[i]===it.answer) ok++; });
  if(mode==='solo') qi=0;
  render();

  const pct=Math.round(ok/items.length*100);
  $('ovEm').textContent    = pct===100?'🏆':pct>=75?'🎉':pct>=50?'👍':'📚';
  $('ovTitle').textContent = pct===100?'Perfect':pct>=75?'Strong':pct>=50?'Getting there':'Keep going';
  $('ovScore').textContent = ok+' / '+items.length+' correct · '+pct+'%';
  $('ovBars').innerHTML=items.map((it,i)=>
    '<div class="ov-bar" style="background:'+
    (answers[i]===it.answer?'var(--tile-ok-ink)':'var(--tile-no-ink)')+'"></div>').join('');

  /* What was missed and what it should have been. A percentage on its own
     tells a student nothing to do next. */
  const missed=items.map((it,i)=>({it,i})).filter(o=>answers[o.i]!==o.it.answer);
  $('ovMiss').innerHTML = missed.length
    ? '<div class="ov-miss-h">Worth another look</div>'+missed.map(o=>
        '<div class="ov-miss-i">'+String(o.i+1).padStart(2,'0')+' &middot; <s>'+
        wordFor(o.it,answers[o.i])+'</s> &rarr; <b>'+wordFor(o.it,o.it.answer)+'</b></div>').join('')
    : '';
  sfx(pct===100?'fanfare':'bowlLow');
  $('ov').classList.add('show');
}

/* ── wiring ───────────────────────────────────────────────────────── */
$('btnSubmit').onclick=submit;
$('btnPrev').onclick=()=>{ if(qi>0){qi--;render();} };
$('btnNext').onclick=()=>{ if(qi<TESTS[si].items.length-1){qi++;render();} };
$('btnRepeat').onclick=()=>{ delete answers[qi]; marked=false; render(); };
$('prevSet').onclick=()=>loadSet(si-1);
$('nextSet').onclick=()=>loadSet(si+1);
$('ovClose').onclick=()=>$('ov').classList.remove('show');
$('ovAgain').onclick=()=>{ $('ov').classList.remove('show'); answers={}; marked=false; qi=0; render(); };
$('ovNext').onclick=()=>{
  $('ov').classList.remove('show');
  /* Past the last test of a set, roll on to the next set rather than
     wrapping round to a test the student has just done. */
  if(si<TESTS.length-1) loadSet(si+1);
  else if(BANKS.length>1) loadBank(bi+1);
  else loadSet(0);
};

document.querySelectorAll('.mode-btn').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('.mode-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    mode=b.dataset.mode; qi=0; closeTip(); render();
    window.scrollTo({top:0,behavior:'smooth'});
  };
});

(function(){
  const b=$('mute'); if(!b) return;
  function paint(){
    const on=!window.SFX||SFX.isOn();
    b.textContent=on?'\uD83D\uDD0A':'\uD83D\uDD07';
    b.classList.toggle('off',!on);
  }
  b.onclick=()=>{ if(window.SFX) SFX.toggle(); paint(); };
  paint();
})();

function syncHeader(){
  const h=document.querySelector('.header');
  if(h) document.documentElement.style.setProperty('--header-h',h.offsetHeight+'px');
}
addEventListener('resize',syncHeader);
addEventListener('orientationchange',()=>setTimeout(syncHeader,120));
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(syncHeader);
if(window.ResizeObserver){ const h=document.querySelector('.header'); if(h) new ResizeObserver(syncHeader).observe(h); }
syncHeader();
</script>
</body>
</html>
