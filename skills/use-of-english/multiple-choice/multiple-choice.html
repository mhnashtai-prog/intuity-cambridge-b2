<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F3F1ED">
<title>INTUITY &mdash; Use of English Part 1</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500&family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=7">

<style>
  /* ── USE OF ENGLISH · PART 1 ─────────────────────────────────────────
     Self-contained but for the shell, which supplies every token and the
     poster. Black, caramel, sage, grey — nothing else. */
  body{padding-bottom:6rem}
  .wrap{max-width:var(--w-read);margin:0 auto;padding:1.2rem var(--gutter) 0}

  /* ── THE PASSAGE ──
     One poster. Part 1 is a CONNECTED text and its gaps lean on each other
     — gap 7 is only decidable once you have read to the end of the sentence
     after it — so the whole thing stays on screen while you work. That is
     the difference between this and the 156 standalone sentences in
     test-03.json, and it is why they cannot share a page. */
  .passage{line-height:2.15;font-size:clamp(.95rem,3.4vw,1.05rem);
    color:var(--poster-body)}
  .passage p{margin-bottom:1rem}
  .passage p:last-child{margin-bottom:0}

  /* A gap. Empty it is a caramel-ruled space with its number floating above
     — the number is how the option rows below refer back to it, so it has
     to be readable without filling the gap first. */
  .g{display:inline-block;position:relative;min-width:5.5em;margin:0 .12em;
    padding:0 .3em;text-align:center;vertical-align:baseline;
    box-shadow:inset 0 -2px 0 var(--poster-rule);
    font-family:var(--f-display);font-weight:600;color:transparent;
    cursor:pointer;transition:box-shadow .15s,background .15s}
  .g::before{content:attr(data-n);position:absolute;top:-.85em;left:0;
    font-family:var(--f-mono);font-size:.5rem;letter-spacing:.08em;
    color:var(--poster-faint)}
  @media(hover:hover){ .g:hover{background:var(--poster-fill)} }
  .g.here{background:var(--poster-fill);box-shadow:inset 0 -2px 0 var(--caramel)}
  .g.done{color:var(--poster-ink);box-shadow:inset 0 -2px 0 var(--caramel)}
  /* Marked. The tile inks, the same pair every exercise in the product
     marks with — never a new colour for a new page. */
  .g.right{color:var(--tile-ok-ink);box-shadow:inset 0 -2px 0 var(--tile-ok-ink)}
  .g.wrong{color:var(--tile-no-ink);box-shadow:inset 0 -2px 0 var(--tile-no-ink);
    text-decoration:line-through;text-decoration-thickness:1px}
  /* The example, gap 0. Filled from the start and not tappable — it is the
     paper's worked answer and the page should not pretend otherwise. */
  .g.example{color:var(--poster-body);cursor:default;
    box-shadow:inset 0 -2px 0 var(--poster-rule)}

  /* ── THE QUESTIONS ──
     Four options across, exactly as the exam prints them, so the shape of
     the page is the shape of the paper. */
  .q{border-top:1px solid var(--poster-rule);padding:.85rem 0}
  .q:first-of-type{border-top:none;padding-top:.2rem}
  .q-n{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.1em;
    color:var(--poster-faint);margin-bottom:.45rem}
  .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(7rem,1fr));
    gap:.4rem}
  .o{font-family:var(--f-display);font-size:.88rem;font-weight:600;
    color:var(--poster-ink);background:var(--poster-fill);
    border:none;border-radius:var(--r-field);padding:.5rem .7rem;
    text-align:left;transition:background .15s,transform .1s}
  .o b{font-family:var(--f-mono);font-weight:400;font-size:.72em;
    color:var(--poster-faint);margin-right:.5em}
  @media(hover:hover){ .o:hover:not(:disabled){background:var(--poster-fill-hi)} }
  .o:active:not(:disabled){transform:scale(.98)}
  .o:focus-visible{outline:2px solid var(--caramel);outline-offset:2px}
  .o.picked{background:var(--poster-ink);color:var(--card)}
  .o.picked b{color:var(--card);opacity:.6}
  .o.is-right{background:var(--tile-ok-bg);color:var(--tile-ok-ink)}
  .o.is-right b{color:var(--tile-ok-ink);opacity:.7}
  .o.is-wrong{background:var(--tile-no-bg);color:var(--tile-no-ink)}
  .o.is-wrong b{color:var(--tile-no-ink);opacity:.7}

  /* ── THE REASON ──
     Shown only after Check, and only on a miss. Part 1 is decided by
     collocation, dependent preposition and fixed phrase far more often than
     by meaning — seven of these eight are — so a student told only WHICH
     answer learns the answer instead of the pattern. `focus` names the kind
     of question, `why` gives the rule, and the note explains the option
     they actually chose. */
  .why{display:none;margin-top:.7rem;padding:.7rem .8rem;
    background:var(--poster-fill);border-radius:var(--r-field)}
  .why.show{display:block}
  .why-kind{font-family:var(--f-mono);font-size:.54rem;letter-spacing:.14em;
    text-transform:uppercase;color:var(--poster-faint);margin-bottom:.35rem}
  .why-text{font-size:.86rem;line-height:1.5;color:var(--poster-ink)}
  .why-yours{margin-top:.5rem;font-size:.82rem;line-height:1.5;font-style:italic;
    color:var(--poster-body)}
  .why-yours b{font-style:normal;font-weight:600;color:var(--poster-ink)}

  .rubric{font-size:.82rem;line-height:1.5;color:var(--dim);
    margin-bottom:1.1rem}
  .score{text-align:center}
  .score .poster-head{font-size:clamp(2rem,9vw,3rem)}
</style>
</head>
<body>

<header class="header">
  <div class="header-top">
    <a class="back-link" href="/skills/use-of-english.html" target="_top">&larr; Use of English</a>
    <div class="header-title">
      <div class="app-title">INTUITY</div>
      <div class="app-subtitle">Reading &amp; Use of English &middot; Part 1</div>
    </div>
    <span class="header-spacer">Level <b>B2</b></span>
  </div>
  <div class="set-tabs" id="setTabs"></div>
</header>

<div class="wrap">
  <div class="strip">
    <span><span class="strip-label" id="stripLabel">Multiple-choice cloze</span><span class="strip-tally" id="tally"></span></span>
  </div>
  <div id="board"><div class="loading">Loading&hellip;</div></div>
</div>

<div class="action-bar">
  <button class="action-btn secondary" id="clearBtn" type="button">Clear</button>
  <button class="action-btn primary" id="checkBtn" type="button" disabled>Check</button>
</div>

<script>
/* ═══ USE OF ENGLISH · PART 1 ══════════════════════════════════════════
   Reads the schema committed at
   /data/use-of-english/multiple-choice/use-of-english-part1.json

   The placeholders in `text` are NUMBERED, {0}…{8}, not positional — so
   this renderer never counts gaps and a gap cannot drift onto the wrong
   question. It matches each {n} to the question whose `number` is n. */

var DATA_URL = '/data/use-of-english/multiple-choice/use-of-english-part1.json';
var DOC = null, T = null, picks = {}, checked = false;

function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
var LETTER = ['A','B','C','D'];

fetch(DATA_URL, {cache:'no-store'})
  .then(function(r){
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  })
  .then(function(d){
    DOC = d;
    if(!d.tests || !d.tests.length) throw new Error('no tests in the file');
    buildTabs();
    open(0);
  })
  .catch(function(e){
    $('board').innerHTML = '<div class="error">The test did not load.<br>' + esc(e.message) + '</div>';
  });

/* One tab per test. There is one today; the schema was written so that
   adding a second is appending an object, and this row grows with it
   without another line of code. */
function buildTabs(){
  $('setTabs').innerHTML = DOC.tests.map(function(t,i){
    return '<button class="vtab' + (i===0?' active':'') + '" type="button" data-i="' + i + '">' +
           esc(t.title || ('Test ' + t.testNumber)) + '</button>';
  }).join('');
  $('setTabs').querySelectorAll('.vtab').forEach(function(b){
    b.addEventListener('click', function(){
      $('setTabs').querySelectorAll('.vtab').forEach(function(x){ x.classList.toggle('active', x===b); });
      open(+b.dataset.i);
    });
  });
}

function open(i){
  T = DOC.tests[i];
  picks = {}; checked = false;
  render();
}

function qByNumber(n){
  for(var k=0;k<T.questions.length;k++) if(T.questions[k].number===n) return T.questions[k];
  return null;
}

/* {n} → a gap. The example is rendered filled and inert. */
function passageHTML(){
  return T.text.map(function(para){
    return '<p>' + esc(para).replace(/\{(\d+)\}/g, function(_, n){
      n = +n;
      if(T.example && n === T.example.number){
        var w = T.example.options[T.example.correct];
        return '<span class="g example done" data-n="' + n + '">' + esc(w) + '</span>';
      }
      return '<span class="g" data-n="' + n + '" role="button" tabindex="0"></span>';
    }) + '</p>';
  }).join('');
}

function questionsHTML(){
  return T.questions.map(function(q){
    return '<div class="q" data-n="' + q.number + '">' +
      '<div class="q-n">' + q.number + '</div>' +
      '<div class="opts">' +
        q.options.map(function(o,i){
          return '<button class="o" type="button" data-n="' + q.number + '" data-i="' + i + '">' +
                 '<b>' + LETTER[i] + '</b>' + esc(o) + '</button>';
        }).join('') +
      '</div>' +
      '<div class="why" data-n="' + q.number + '"></div>' +
    '</div>';
  }).join('');
}

function render(){
  $('board').innerHTML =
    '<div class="poster">' +
      '<div class="poster-kick"><i></i>Part ' + esc(DOC.part) + ' &middot; ' + T.questions.length + ' gaps</div>' +
      '<h2 class="poster-head">' + esc(T.title) + '</h2>' +
      (DOC.rubric ? '<div class="rubric">' + esc(DOC.rubric) + '</div>' : '') +
      '<div class="passage">' + passageHTML() + '</div>' +
    '</div>' +
    '<div class="poster" style="margin-top:1.1rem">' +
      '<div class="poster-kick"><i></i>Choose one for each gap</div>' +
      questionsHTML() +
    '</div>';

  $('board').querySelectorAll('.o').forEach(function(b){
    b.addEventListener('click', function(){ pick(+b.dataset.n, +b.dataset.i); });
  });
  /* Tapping a gap scrolls to its question — with a connected text you read
     top to bottom and answer out of order, and hunting for number 6 in a
     list of eight is friction with no teaching in it. */
  $('board').querySelectorAll('.g:not(.example)').forEach(function(g){
    function go(){
      var q = $('board').querySelector('.q[data-n="' + g.dataset.n + '"]');
      if(q) q.scrollIntoView({behavior:'smooth', block:'center'});
      $('board').querySelectorAll('.g').forEach(function(x){ x.classList.remove('here'); });
      g.classList.add('here');
    }
    g.addEventListener('click', go);
    g.addEventListener('keydown', function(e){
      if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); }
    });
  });
  sync();
}

function pick(n, i){
  if(checked) return;
  picks[n] = i;
  var q = qByNumber(n);
  $('board').querySelectorAll('.o[data-n="' + n + '"]').forEach(function(b){
    b.classList.toggle('picked', +b.dataset.i === i);
  });
  var g = $('board').querySelector('.g[data-n="' + n + '"]');
  if(g){ g.textContent = q.options[i]; g.classList.add('done'); g.classList.remove('here'); }
  sync();
}

function sync(){
  var done = Object.keys(picks).length, total = T.questions.length;
  $('tally').textContent = done + ' / ' + total;
  $('checkBtn').disabled = checked || done < total;
  $('checkBtn').textContent = checked ? 'Checked'
    : (done < total ? 'Check — ' + (total-done) + ' to go' : 'Check');
}

function check(){
  if(checked) return;
  checked = true;
  var got = 0;

  T.questions.forEach(function(q){
    var chose = picks[q.number], ok = chose === q.correct;
    if(ok) got++;

    $('board').querySelectorAll('.o[data-n="' + q.number + '"]').forEach(function(b){
      var i = +b.dataset.i;
      b.disabled = true;
      b.classList.remove('picked');
      if(i === q.correct) b.classList.add('is-right');
      else if(i === chose) b.classList.add('is-wrong');
    });

    var g = $('board').querySelector('.g[data-n="' + q.number + '"]');
    if(g){
      g.classList.add(ok ? 'right' : 'wrong');
      if(!ok){
        /* The correct word replaces the wrong one, struck through above it
           would have meant two words in one gap and an unreadable line. */
        g.textContent = q.options[q.correct];
        g.classList.remove('wrong'); g.classList.add('right');
      }
    }

    /* The reason, on a miss only. After a correct answer it explains
       something the student has just shown they did not need, and a note
       under all eight turns the page back into a wall of prose. */
    if(!ok){
      var box = $('board').querySelector('.why[data-n="' + q.number + '"]');
      var yours = q.options[chose];
      var note = q.distractors && q.distractors[yours];
      box.innerHTML =
        (q.focus ? '<div class="why-kind">' + esc(q.focus) + '</div>' : '') +
        '<div class="why-text">' + esc(q.why || '') + '</div>' +
        (note ? '<div class="why-yours">You chose <b>' + esc(yours) + '</b> — ' + esc(note) + '</div>' : '');
      box.classList.add('show');
    }
  });

  var pct = Math.round(got / T.questions.length * 100);
  $('board').insertAdjacentHTML('beforeend',
    '<div class="poster score" style="margin-top:1.1rem">' +
      '<h2 class="poster-head">' + got + ' / ' + T.questions.length + '</h2>' +
      '<div class="poster-body">' + pct + '% &middot; the reasons are under the ones you missed.</div>' +
    '</div>');
  sync();
  $('clearBtn').textContent = 'Again';
}

$('checkBtn').addEventListener('click', check);
$('clearBtn').addEventListener('click', function(){
  open(DOC.tests.indexOf(T));
  $('clearBtn').textContent = 'Clear';
  var el = document.scrollingElement || document.body;
  try { el.scrollTo({top:0, behavior:'smooth'}); } catch(e){ el.scrollTop = 0; }
});

function syncHeader(){
  var h = document.querySelector('.header');
  if(h) document.documentElement.style.setProperty('--header-h', h.offsetHeight + 'px');
}
addEventListener('resize', syncHeader);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(syncHeader);
if(window.ResizeObserver){ var hh=document.querySelector('.header'); if(hh) new ResizeObserver(syncHeader).observe(hh); }
syncHeader();
</script>
</body>
</html>
