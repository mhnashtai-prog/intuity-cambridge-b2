<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>INTUITY — Word Families</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=12">
<style>
/* ═══ WORD FAMILIES · Use of English Part 3, the learning ring ════════════
   The exam ring (word-formation.html) practises the task. This page teaches
   what the task tests: how a word is BUILT — a base, an affix, a spelling
   rule — so that a learner meeting ATTRACT in the exam reaches for
   attractive, attraction, unattractive without guessing.

   NAVIGATION is the shell's own, in its own order:
     1 .mode-selector  Explore · Practice · Game
     2 .set-tabs       Verbs · Nouns · Adjectives · Adverbs · Mix 1 · 2 · 3
     3 .seg            Suffixes | Prefixes — two views of the same words
   The Mix tabs are a ladder: core families, then the exam traps, then all.

   THE LOOK is the quiet system the Challenge uses, scoped to the page's
   content so the shared header stays exactly as every other page draws it.
   (In the shell, --paper is the BODY TEXT colour; the light surface here is
   --sheet.) Two radii: a pill for anything tapped on one line, one soft
   corner for anything that holds content.

   THE DATA is /data/use-of-english/word-formation/word-families.json —
   140 families, reviewed form by form. Every form has a permanent id, so
   Practice and the Lab feed the same Ring as the Challenge and the Boards.
   ═══════════════════════════════════════════════════════════════════════ */
.wf{
  --ink:#2B2129; --sheet:#FEFCF9; --soft:#5C4E52; --mute:#8B7B78; --rule:#D9C0A4;
  --sage:#8AA79C; --caramel:#C2956E; --caramel-ink:#8A6440;
  --right:#4A6B5C; --wrong:#B4653A;
  --right-soft:rgba(74,107,92,.12); --wrong-soft:rgba(180,101,58,.13); --sand:rgba(229,209,184,.45);
  --core:#201E1C; --ring-ink:#E5D1B8;
  --r-box:16px; --r-tap:999px;
  max-width:42rem; margin:0 auto; padding:1rem 1rem 4rem; color:var(--ink);
  font-family:'Geist','Inter',system-ui,sans-serif;
}
.wf *{box-sizing:border-box}
.wf button{font:inherit}
.view-row{display:flex;justify-content:center;margin:0}
/* the shell's header is fixed; the content starts below it, at its measured height
   (seven tabs wrap to two lines on a phone, so the height is never assumed) */
main.wf{padding-top:calc(var(--wf-head,170px) + 1rem)}
.lead{color:var(--soft);font-size:.95rem;line-height:1.5;margin:0 0 1rem;text-align:center}
.count{color:var(--mute);font-size:.85rem;text-align:center;margin:-.4rem 0 1rem}
.hidden{display:none !important}

/* ── EXPLORE: the families, then one opens as a card ─────────────────── */
.fam-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr));gap:.6rem}
.fam{display:flex;flex-direction:column;align-items:flex-start;gap:.3rem;text-align:left;cursor:pointer;
  background:var(--sheet);border:1px solid rgba(217,192,164,.55);border-radius:var(--r-box);padding:.85rem .9rem;color:var(--ink);
  transition:border-color .15s,transform .15s}
.fam:hover{border-color:var(--caramel)}
.fam:active{transform:scale(.98)}
.fam b{font-size:1.08rem;font-weight:600;letter-spacing:-.01em}
.fam span{font-size:.82rem;color:var(--soft);line-height:1.35}
.fam .due{width:.42rem;height:.42rem;border-radius:50%;background:var(--wrong);display:inline-block;margin-left:.35rem;vertical-align:middle}

/* ── THE MODAL CARD (the app's panel: soft corner, blurred ground) ────── */
.scrim{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:max(14px,env(safe-area-inset-top)) 14px 14px;
  background:rgba(250,247,242,.72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.card{position:relative;width:min(34rem,100%);max-height:88vh;overflow-y:auto;background:var(--sheet);border-radius:18px;
  padding:1.4rem 1.3rem 1.3rem;color:var(--ink);font-family:'Geist','Inter',system-ui,sans-serif;
  box-shadow:0 1px 2px rgba(43,33,41,.04),0 12px 28px rgba(43,33,41,.07),0 28px 64px rgba(43,33,41,.08)}
.card .x{position:absolute;top:.6rem;right:.7rem;border:none;background:none;font-size:1.1rem;color:var(--mute);cursor:pointer;padding:.5rem;line-height:1}
.card .x:hover{color:var(--ink)}
.kick{display:flex;align-items:center;gap:.55rem;font-size:.78rem;color:var(--caramel-ink);margin-bottom:.6rem}
.kick i{width:1.4rem;height:.5rem;background:var(--caramel);display:block;border-radius:2px}
.card h2{font-size:1.9rem;font-weight:700;letter-spacing:-.02em;margin:0 0 .15rem}
.card .pos{color:var(--mute);font-size:.88rem;margin-bottom:1rem}
.form{border-top:1px solid rgba(217,192,164,.5);padding:.95rem 0 .2rem}
.form.dim{opacity:.55}
.eq{display:flex;flex-wrap:wrap;align-items:center;gap:.35rem;margin-bottom:.5rem}
.tile{display:inline-block;padding:.2rem .65rem;border-radius:var(--r-tap);font-size:.86rem;font-weight:600}
.tile.base{background:var(--sand);color:var(--ink)}
.tile.aff{background:var(--core);color:var(--ring-ink)}
.op{color:var(--mute);font-size:.9rem}
.word{font-size:1.15rem;font-weight:700}
.cls{font-size:.78rem;color:var(--mute);margin-left:.15rem}
.gloss{margin:.15rem 0 .35rem;color:var(--soft);font-size:.92rem}
.ex{margin:0 0 .35rem;font-size:.98rem;line-height:1.5}
.ex b{color:var(--right);font-weight:700}
.rule{font-size:.86rem;color:var(--soft);background:rgba(138,167,156,.14);border-radius:12px;padding:.5rem .7rem;margin:.4rem 0 .5rem}
.rule b{color:var(--ink)}
.watch{margin-top:1rem;padding-top:.8rem;border-top:1px solid rgba(217,192,164,.5)}
.watch h3{font-size:.9rem;margin:0 0 .5rem}
.watch li{font-size:.88rem;color:var(--soft);margin:.35rem 0;line-height:1.45}
.watch .no{color:var(--wrong);font-weight:700;text-decoration:line-through;text-decoration-thickness:1.5px}
.watch .conf{color:var(--caramel-ink);font-weight:700}
.watch ul{padding-left:1.1rem;margin:0}
.note{font-size:.88rem;color:var(--soft);margin:.8rem 0 0}

/* ── PRACTICE ─────────────────────────────────────────────────────────── */
.dots{display:flex;justify-content:center;gap:.4rem;margin:.2rem 0 1rem}
.dots i{width:.55rem;height:.55rem;border-radius:50%;background:rgba(217,192,164,.6);display:block}
.dots i.ok{background:var(--right)} .dots i.no{background:var(--wrong)} .dots i.now{box-shadow:0 0 0 2px var(--caramel)}
.q{background:var(--sheet);border-radius:var(--r-box);padding:1.3rem 1.2rem;border:1px solid rgba(217,192,164,.55)}
.q .ask{font-size:.9rem;color:var(--soft);margin:0 0 .9rem}
.q .line{display:flex;align-items:baseline;gap:1rem;margin-bottom:1rem}
.q .sent{flex:1;font-size:1.15rem;font-weight:600;line-height:1.55;margin:0}
.q .stem{flex:none;font-weight:800;font-size:.9rem;letter-spacing:.08em;padding:.15rem .6rem;border-radius:var(--r-tap);background:rgba(43,33,41,.06)}
.blank{display:inline-block;min-width:5.5em;border-bottom:2px solid var(--ink);text-align:center;color:var(--right)}
.blank.miss{color:var(--wrong)}
.opts{display:flex;flex-wrap:wrap;gap:.5rem}
.opt{border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:var(--r-tap);padding:.6rem 1.1rem;font-size:1rem;font-weight:600;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.ok{background:var(--right-soft);border-color:var(--right);color:var(--right)}
.opt.no{background:var(--wrong-soft);border-color:var(--wrong);color:var(--wrong);text-decoration:line-through}
.opt:disabled{cursor:default}
.field{display:flex;gap:.5rem}
.field input{flex:1;min-width:0;font:inherit;font-size:1.05rem;padding:.7rem .95rem;border:1px solid var(--rule);border-radius:var(--r-box);background:var(--sheet);color:var(--ink)}
.field input:focus{outline:2px solid var(--caramel);outline-offset:1px}
.btn{border:none;border-radius:var(--r-tap);padding:.7rem 1.3rem;font-size:.95rem;font-weight:600;cursor:pointer;background:var(--ink);color:var(--sheet)}
.btn.quiet{background:none;color:var(--ink);border:1px solid var(--rule)}
.btn:disabled{opacity:.4;cursor:default}
.fb{margin:1rem 0 0;font-size:.95rem;line-height:1.5;color:var(--soft);min-height:1.5em}
.fb b.ok{color:var(--right)} .fb b.no{color:var(--wrong)}
.fb .rule{margin-top:.6rem}
.next-row{display:flex;justify-content:flex-end;margin-top:1rem}
.result{text-align:center;padding:1.6rem 1.2rem}
.result .big{font-size:3rem;font-weight:700;letter-spacing:-.03em;margin:.2rem 0}
.ring-line{font-size:.92rem;line-height:1.55;color:var(--soft);margin:1rem 0;padding:.75rem .9rem;border-radius:var(--r-box);background:rgba(74,107,92,.07)}
.ring-line b{color:var(--right)}

/* ── GAME · THE WORD LAB — the one bold thing on the page ────────────────
   The base word sits in the INTUITY ring; the affixes are pills around it.
   Tap one: if it builds a real word, the word joins the family below; if
   not, a heart goes. Words built in two steps (creative → creativity) open
   once their first step is found: tap a found word to build on it. */
.lab-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem;font-size:.9rem;color:var(--soft)}
.hearts{display:flex;gap:.25rem}
.hearts svg{width:16px;height:16px;fill:var(--wrong);transition:opacity .3s,transform .3s}
.hearts svg.gone{opacity:.2;transform:scale(.8)}
.lab{display:flex;flex-direction:column;align-items:center;gap:1.1rem;background:var(--sheet);border-radius:var(--r-box);padding:1.6rem 1rem 1.3rem;border:1px solid rgba(217,192,164,.55)}
.ring{--d:9.5rem;width:var(--d);height:var(--d);border-radius:50%;display:grid;place-items:center;position:relative;
  background:linear-gradient(145deg,#FFFFFF,#E4DDD1);box-shadow:-6px -6px 14px rgba(255,255,255,.9),8px 8px 20px rgba(43,33,41,.16)}
.ring::before{content:'';position:absolute;inset:5.5%;border-radius:50%;background:var(--sage)}
.ring::after{content:'';position:absolute;inset:14.8%;border-radius:50%;background:var(--core)}
.ring span{position:relative;z-index:2;color:var(--ring-ink);font-weight:700;font-size:1.25rem;letter-spacing:-.01em;max-width:6.3rem;text-align:center;line-height:1.1;word-break:break-word}
.ring.snap{animation:snap .45s cubic-bezier(.22,1,.36,1)}
@keyframes snap{40%{transform:scale(1.07)}}
.ring.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.affixes{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;max-width:28rem}
.aff{border:none;border-radius:var(--r-tap);padding:.55rem 1rem;font-size:1rem;font-weight:700;cursor:pointer;background:var(--core);color:var(--ring-ink);transition:transform .12s,opacity .2s}
.aff:active{transform:scale(.95)}
.aff.used{opacity:.25;cursor:default}
.aff.miss{background:var(--wrong-soft);color:var(--wrong);text-decoration:line-through}
.lab-msg{min-height:1.4em;font-size:.95rem;color:var(--soft);text-align:center;margin:0}
.found{width:100%;display:flex;flex-direction:column;gap:.5rem}
.found .row{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;padding:.55rem .7rem;border-radius:12px;background:var(--right-soft)}
.found .row .w{font-weight:700;color:var(--right)}
.found .row .g{font-size:.86rem;color:var(--soft);flex-basis:100%}
.found .row button{border:1px solid var(--right);background:none;color:var(--right);border-radius:var(--r-tap);padding:.15rem .7rem;font-size:.8rem;font-weight:600;cursor:pointer;margin-left:auto}
.lab-foot{display:flex;justify-content:space-between;align-items:center;width:100%;gap:.5rem;flex-wrap:wrap}
.cross-link{display:block;text-align:center;margin-top:2rem;font-size:.9rem;color:var(--soft)}
.cross-link a{color:var(--ink);font-weight:600}

/* ── the affix chooser ── */
.affix-row{display:flex;flex-wrap:wrap;justify-content:center;gap:.3rem;margin:0 0 .9rem}
/* .wf .chip, not .chip: the page's own ".wf button{font:inherit}" is more specific and would win */
.wf .chip{border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:var(--r-tap);padding:.22rem .6rem;font-size:.8rem;font-weight:600;line-height:1.25;min-height:0;cursor:pointer;transition:background .15s,border-color .15s}
.chip:hover{border-color:var(--ink)}
.wf .chip small{margin-left:.3rem;color:var(--mute);font-weight:600;font-size:.7rem}
.wf .chip.on{background:#14110E;border-color:#14110E;color:var(--sheet)}
.wf .chip.on small{color:var(--ring-ink)}
/* on a phone the pills are one row that scrolls sideways, the next one cut off at the edge
   to show there is more — the row stays one pill high however long the list */
@media (max-width:600px){
  .affix-row{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;
    margin-left:-1rem;margin-right:-1rem;padding:0 1rem .15rem;-webkit-overflow-scrolling:touch;
    -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 2rem),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 2rem),transparent)}
  .affix-row::-webkit-scrollbar{display:none}
  .chip{flex:none;scroll-snap-align:start}
}
.aff-meaning{text-align:center;font-size:1rem;color:var(--soft);margin:0 0 .3rem}
.aff-meaning b{color:#14110E;font-size:1.1rem}
.chip{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
/* game controls are tapped, not read: no long-press menu on a phone */
.aff,.opt,.fam,.ring,.btn,.dots{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
@media (prefers-reduced-motion:reduce){ .ring.snap,.ring.shake{animation:none} .fam,.aff{transition:none} }

/* ── EXPLORE CARDS: the app's own card, square like every INTUITY card — a small
      caramel label on top, the word in solid black, the line beneath in grey.
      The card that opens on tap is square too; buttons stay pills. ── */
.fam{border-radius:0;border:1px solid rgba(217,192,164,.6);box-shadow:0 1px 2px rgba(43,33,41,.05);padding:.8rem .85rem .9rem;gap:.3rem}
.fam .k{display:flex;align-items:center;gap:.45rem;font:600 .6rem/1.2 'Geist Mono',ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--caramel-ink)}
.fam .k i{flex:none;width:1.1rem;height:.4rem;background:var(--caramel);display:block}
.fam b{color:#14110E;font-weight:800}
.fam span{color:var(--mute)}
.card{border-radius:0}
</style>
</head>
<body>

<header class="header">
  <div class="header-top">
    <a class="back-link" href="/index.html?openModal=english" target="_top">← Use of English</a>
    <div class="header-title">
      <div class="app-title">INTUITY</div>
      <div class="app-subtitle">Part 3 · Word Families</div>
    </div>
    <span class="header-spacer">Level <b>B2</b></span>
  </div>
  <div class="mode-selector" id="modes">
    <button class="mode-btn" data-mode="explore" type="button">Explore</button>
    <button class="mode-btn" data-mode="practice" type="button">Practice</button>
    <button class="mode-btn" data-mode="game" type="button">Game</button>
  </div>
  <div class="set-tabs" id="sets"></div>
  <!-- part 3 of the shell's navigation, in the header so it stays in reach while a long list scrolls -->
  <div class="view-row"><div class="seg" id="kind" role="group" aria-label="Prefixes or suffixes">
    <button type="button" data-kind="prefix">Prefixes</button><button type="button" data-kind="suffix">Suffixes</button>
  </div></div>
</header>

<main class="wf" id="wf">
  <section id="explore"></section>
  <section id="practice" class="hidden"></section>
  <section id="game" class="hidden"></section>
  <p class="cross-link">Ready for the exam task? <a href="/skills/use-of-english/word-formation/word-formation.html">Practise Part 3 in Cambridge format</a></p>
</main>

<script src="/tools/intuity-log.js?v=1"></script>
<script src="/tools/intuity-ring.js?v=1"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const norm=s=>String(s).toLowerCase().replace(/[’']/g,"'").replace(/[.!?,;:]/g,'').replace(/\s+/g,' ').trim();
const TOPIC='word-families', PART='UoE3';

/* the set row: four word classes, then the ladder */
const SETS=[['verb','Verbs'],['noun','Nouns'],['adjective','Adjectives'],['adverb','Adverbs'],['mix1','Mix 1'],['mix2','Mix 2'],['mix3','Mix 3']];
const LADDER={mix1:['core'],mix2:['core','traps-1','traps-2'],mix3:['core','traps-1','traps-2','traps-3','traps-4']};
const P=new URLSearchParams(location.search);
let D=null, RULES={}, mode=P.get('mode')||'explore', set=P.get('set')||'mix1', kind=P.get('kind')==='prefix'?'prefix':'suffix';
/* THE AFFIX CHOOSER — the back of a good coursebook: every prefix and suffix,
   with what it means and every word built with it. The student combines
   freely: a word class (or a Mix), Prefixes or Suffixes, then one affix.
   On the class tabs the pills are that class's groups; on a Mix tab the same
   affix is gathered across every class, so dis- shows disagree, disagreement
   and dishonest together. Explore and Practice follow the choice; the Word
   Lab does not, because it needs several affixes on one word. */
let aff=P.get('aff')||'';
const CLASSES=['verb','noun','adjective','adverb'];

/* ── the pool: every form that matches the tab and the toggle ── */
function inSet(n,f){ return LADDER[set] ? LADDER[set].includes(n.set) : f.cls===set; }
function inGroup(f,label){ const g=(((D.groups||{})[f.cls]||{})[kind]||[]).find(x=>x.label===label); return !!g&&g.affixes.includes(f.affix); }
function basePool(){ const out=[]; D.nodes.forEach(n=>n.forms.forEach(f=>{ if(f.type===kind&&inSet(n,f)) out.push({n,f}); })); return out; }
function pool(){ return basePool().filter(x=>!aff||inGroup(x.f,aff)); }
/* the groups on offer here, with how many forms each has in this tab */
function groupsHere(){ const classes=LADDER[set]?CLASSES:[set], m=new Map(), B=basePool();
  classes.forEach(c=>(((D.groups||{})[c]||{})[kind]||[]).forEach(g=>{ if(!m.has(g.label)) m.set(g.label,{label:g.label,meaning:[],n:0}); const e=m.get(g.label);
    if(!e.meaning.some(x=>x.m===g.meaning)) e.meaning.push({c,m:g.meaning}); }));
  m.forEach(e=>{ e.n=B.filter(x=>inGroup(x.f,e.label)).length; });
  return [...m.values()].filter(e=>e.n>0); }
const src=(n,f)=>f.from||n.base;
const ok=(f,v)=>[f.w,f.us].filter(Boolean).map(norm).includes(norm(v));
const due=id=>{ try{ return !!(window.IntuityRing&&IntuityRing.isDue(id)); }catch(e){ return false; } };

/* one place writes every result down: the Ring for what comes back, the log for the report */
function remember(f,right){
  try{ if(window.IntuityRing){ right?IntuityRing.right(f.id):IntuityRing.miss(f.id,{topic:TOPIC,part:PART}); } }catch(e){}
  try{ if(window.INTUITY) INTUITY.log(TOPIC,f.id,right,{game:'word-families-'+mode}); }catch(e){}
}
function bold(s,w){ const i=s.toLowerCase().search(new RegExp('\\b'+w.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b'));
  return i<0?esc(s):esc(s.slice(0,i))+'<b>'+esc(s.substr(i,w.length))+'</b>'+esc(s.slice(i+w.length)); }
function gapped(s,w){ const i=s.toLowerCase().search(new RegExp('\\b'+w.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b'));
  return i<0?null:{pre:s.slice(0,i),post:s.slice(i+w.length)}; }
function eq(n,f){ const a=`<span class="tile aff">${esc(f.affix)}</span>`, b=`<span class="tile base">${esc(src(n,f))}</span>`;
  const also=f.also?`<span class="op">+</span><span class="tile aff">${esc(f.also)}</span>`:'';
  return `<span class="eq">${f.type==='prefix'?a+'<span class="op">+</span>'+b+also:b+'<span class="op">+</span>'+a}<span class="op">=</span><span class="word">${esc(f.w)}</span></span>`; }
function ruleBox(f){ const r=f.rule&&RULES[f.rule]; const a=D.affixes[f.affix];
  const bits=[]; if(r) bits.push(`<b>${esc(r.title)}.</b> ${esc(r.text||'')}`); else if(a&&a.tip) bits.push(`<b>${esc(f.affix)}</b> ${esc(a.tip)}`);
  return bits.length?`<div class="rule">${bits.join(' ')}</div>`:''; }

/* ══ NAVIGATION ══ */
function drawNav(){
  $('sets').innerHTML=SETS.map(([k,l])=>`<button class="vtab${k===set?' active':''}" type="button" data-set="${k}">${l}</button>`).join('');
  document.querySelectorAll('#modes .mode-btn').forEach(b=>{ const on=b.dataset.mode===mode; b.classList.toggle('active',on); on?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'); });
  document.querySelectorAll('#kind button').forEach(b=>{ const on=b.dataset.kind===kind; b.classList.toggle('on',on); b.setAttribute('aria-selected',on); });
  ['explore','practice','game'].forEach(v=>$(v).classList.toggle('hidden',v!==mode));
  const q=new URLSearchParams({mode,set,kind}); if(aff) q.set('aff',aff); history.replaceState(null,'',location.pathname+'?'+q);
}
function go(){ if(D&&aff&&!groupsHere().some(g=>g.label===aff)) aff=''; drawNav(); if(mode==='explore') explore(); else if(mode==='practice') practiceGate(); else labStart(); }
$('modes').addEventListener('click',e=>{ const b=e.target.closest('[data-mode]'); if(b){ mode=b.dataset.mode; go(); } });
$('sets').addEventListener('click',e=>{ const b=e.target.closest('[data-set]'); if(b){ set=b.dataset.set; go(); } });
$('kind').addEventListener('click',e=>{ const b=e.target.closest('[data-kind]'); if(b){ kind=b.dataset.kind; go(); } });

/* ══ EXPLORE: the families that have a form here; one opens as a modal card ══ */
function affixRow(){ const G=groupsHere(); if(!G.length) return '';
  return `<div class="affix-row" role="group" aria-label="Choose an affix"><button type="button" class="chip${aff?'':' on'}" data-aff="">All</button>${G.map(g=>`<button type="button" class="chip${g.label===aff?' on':''}" data-aff="${esc(g.label)}">${esc(g.label)}<small>${g.n}</small></button>`).join('')}</div>`; }
function showChosen(){ const c=document.querySelector('.affix-row .chip.on'); if(c&&c.scrollIntoView) c.scrollIntoView({block:'nearest',inline:'center'}); }
function explore(){
  if(aff){ exploreAffix(); return showChosen(); }
  const P2=pool(), fams=new Map();
  P2.forEach(({n,f})=>{ if(!fams.has(n)) fams.set(n,[]); fams.get(n).push(f); });
  const list=[...fams.entries()].sort((a,b)=>a[0].base.localeCompare(b[0].base));
  const label=(SETS.find(s=>s[0]===set)||[])[1]||'';
  $('explore').innerHTML=list.length?`${affixRow()}<p class="lead">Tap a word to see its family: how each form is built, what it means, and the spellings to watch.</p>
    <p class="count">${list.length} ${list.length===1?'family':'families'} · ${P2.length} ${kind==='prefix'?'prefixed':'suffixed'} forms in ${esc(label)}</p>
    <div class="fam-grid">${list.map(([n,fs])=>`<button class="fam" type="button" data-base="${esc(n.base)}"><small class="k"><i></i>${esc(n.pos)}</small><b>${esc(n.base)}${fs.some(f=>due(f.id))?'<i class="due" title="Still to fix"></i>':''}</b><span>${fs.map(f=>esc(f.w)).join(' · ')}</span></button>`).join('')}</div>`
    :`<p class="lead">No ${kind==='prefix'?'prefixed':'suffixed'} words in this set. Try ${kind==='prefix'?'Suffixes':'Prefixes'}, or another tab.</p>`;
}
function exploreAffix(){
  const g=groupsHere().find(x=>x.label===aff), words=pool().slice().sort((a,b)=>a.f.w.localeCompare(b.f.w));
  const many=g.meaning.length>1;
  const meaning=g.meaning.map(x=>esc(x.m)+(many?` <span class="cls">(${esc(x.c)}s)</span>`:'')).join(' · ');
  $('explore').innerHTML=`${affixRow()}<p class="aff-meaning"><b>${esc(g.label)}</b> · ${meaning}</p>
    <p class="count">${words.length} ${words.length===1?'word':'words'} · tap one to see its whole family</p>
    <div class="fam-grid">${words.map(({n,f})=>`<button class="fam" type="button" data-base="${esc(n.base)}"><small class="k"><i></i>${esc(f.cls)}</small><b>${esc(f.w)}${due(f.id)?'<i class="due" title="Still to fix"></i>':''}</b><span>${f.type==='prefix'?esc(f.affix)+' + '+esc(src(n,f)):esc(src(n,f))+' + '+esc(f.affix)}</span></button>`).join('')}</div>`;
}
$('explore').addEventListener('click',e=>{ const c=e.target.closest('.chip'); if(c){ aff=c.dataset.aff; drawNav(); explore(); return; }
  const b=e.target.closest('.fam'); if(b) openFamily(D.nodes.find(n=>n.base===b.dataset.base)); });
function openFamily(n){
  const here=new Set(pool().filter(x=>x.n===n).map(x=>x.f));
  const forms=n.forms.slice().sort((a,b)=>(here.has(b)-here.has(a)));
  const avoid=n.avoid||[];
  openCard(`<div class="kick"><i></i>Word family</div><h2>${esc(n.base)}</h2><div class="pos">${esc(n.pos)}${n.us?' · also '+esc(n.us):''}</div>
    ${forms.map(f=>`<div class="form${here.has(f)?'':' dim'}">${eq(n,f)}<div><span class="cls">${esc(f.cls)}${f.us?' · also '+esc(f.us):''}</span></div>
      <p class="gloss">${esc(f.gloss)}</p><p class="ex">${bold(f.teen||f.ex,f.w)}</p>${ruleBox(f)}</div>`).join('')}
    ${avoid.length?`<div class="watch"><h3>Watch out</h3><ul>${avoid.map(a=>a.kind==='confusable'
        ?`<li><span class="conf">${esc(a.w)}</span> is a different word. ${esc(a.why)}</li>`
        :`<li><span class="no">${esc(a.w)}</span> — ${esc(a.why)}</li>`).join('')}</ul></div>`:''}
    ${n.note?`<p class="note">${esc(n.note)}</p>`:''}`);
}

/* ══ THE MODAL CARD ══ */
function openCard(html){ closeCard(); const s=document.createElement('div'); s.className='scrim'; s.id='scrim';
  s.innerHTML=`<div class="card wf" role="dialog" aria-modal="true"><button class="x" type="button" aria-label="Close">✕</button>${html}</div>`;
  document.body.appendChild(s); s.addEventListener('click',e=>{ if(e.target===s||e.target.closest('.x')) closeCard(); });
  s.querySelector('.x').focus(); }
function closeCard(){ const s=$('scrim'); if(s) s.remove(); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeCard(); });

/* ══ PRACTICE: ten questions, mistakes first, the answer straight after ══
   Three kinds, chosen per form:
     choose — the family's real forms, the base among them: which one fits?
              It tests word class, the heart of Part 3. Never an invented
              misspelling among the options.
     type   — the sentence, the gap, the word in capitals: Part 3 itself.
     fix    — a real learner's misspelling from the data, to correct.     */
let S=null;
function practiceGate(){
  const n=pool().length, d=pool().filter(x=>due(x.f.id)).length;
  $('practice').innerHTML=n?`${affixRow()}<div class="q result"><p class="lead">Ten questions from ${n} ${aff?'words with <b>'+esc(aff)+'</b>':(kind==='prefix'?'prefixed':'suffixed')+' forms'}.${d?` <b>${d}</b> ${d===1?'is a mistake':'are mistakes'} from last time, so ${d===1?'it comes':'they come'} first.`:''}</p>
    <button class="btn" type="button" id="pStart">Start</button></div>`
    :`<p class="lead">No ${kind==='prefix'?'prefixed':'suffixed'} words in this set. Try another tab.</p>`;
  const b=$('pStart'); if(b) b.onclick=startPractice;
  $('practice').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ aff=c.dataset.aff; drawNav(); practiceGate(); });
}
function startPractice(){
  const all=shuffle(pool()); all.sort((a,b)=>due(b.f.id)-due(a.f.id));
  const items=all.map(({n,f})=>({n,f,t:pickType(n,f)})).filter(x=>x.t).slice(0,10);   /* a form with no usable sentence is left out */
  S={items,i:0,res:[],tries:0,fixed:0,half:0}; showQ();
}
function options(n,f){ const real=[n.base].concat(n.forms.map(x=>x.w)).filter((w,i,a)=>a.indexOf(w)===i&&w!==f.w);
  const conf=(n.avoid||[]).filter(a=>a.kind==='confusable'&&a.for===f.w).map(a=>a.w);
  return shuffle([f.w].concat(shuffle(conf.concat(real)).slice(0,3))); }
function pickType(n,f){ const sent=gapped(f.teen||f.ex,f.w)||gapped(f.ex,f.w); if(!sent) return null;
  const fixable=(n.avoid||[]).some(a=>a.for===f.w&&a.kind==='misspelling');
  const r=Math.random(); if(fixable&&r<.2) return 'fix'; if(options(n,f).length>=3&&r<.6) return 'choose'; return 'type'; }
function showQ(){
  const it=S.items[S.i]; if(!it) return results(); const {n,f}=it;
  S.tries=0;
  const s=f.teen&&gapped(f.teen,f.w)?f.teen:f.ex, g=gapped(s,f.w);
  const dots=S.items.map((x,i)=>`<i class="${S.res[i]===true?'ok':S.res[i]===false?'no':i===S.i?'now':''}"></i>`).join('');
  let body='';
  if(it.t==='choose') body=`<p class="ask">Which form fits the gap?</p>
      <div class="line"><p class="sent">${esc(g.pre)}<span class="blank" id="blank">&nbsp;</span>${esc(g.post)}</p></div>
      <div class="opts">${options(n,f).map(o=>`<button class="opt" type="button" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
  else if(it.t==='type') body=`<p class="ask">Use the word in capitals to form a word that fits the gap.</p>
      <div class="line"><p class="sent">${esc(g.pre)}<span class="blank" id="blank">&nbsp;</span>${esc(g.post)}</p><span class="stem">${esc(src(n,f).toUpperCase())}</span></div>
      <div class="field"><input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Your answer"><button class="btn" type="button" id="chk">Check</button></div>`;
  else { const bad=(n.avoid||[]).find(a=>a.for===f.w&&a.kind==='misspelling');
    body=`<p class="ask">One word in this sentence is spelt wrong. Type it correctly.</p>
      <div class="line"><p class="sent">${esc(g.pre)}<span class="blank miss" id="blank">${esc(bad.w)}</span>${esc(g.post)}</p></div>
      <div class="field"><input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="The correct spelling"><button class="btn" type="button" id="chk">Check</button></div>`; }
  $('practice').innerHTML=`<div class="dots" aria-label="Question ${S.i+1} of ${S.items.length}">${dots}</div><div class="q">${body}<div class="fb" id="fb" aria-live="polite"></div><div class="next-row hidden" id="nextRow"><button class="btn" type="button" id="next">${S.i+1<S.items.length?'Next':'See your result'}</button></div></div>`;
  $('practice').querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b.dataset.o,b));
  const inp=$('ans'); if(inp){ $('chk').onclick=()=>answer(inp.value); inp.addEventListener('keydown',e=>{ if(e.key==='Enter') answer(inp.value); }); setTimeout(()=>inp.focus(),80); }
  $('next').onclick=()=>{ S.i++; showQ(); };
}
function lev(a,b){ const m=[];for(let i=0;i<=a.length;i++)m[i]=[i];for(let j=0;j<=b.length;j++)m[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]; }
function answer(v,btn){
  const it=S.items[S.i]; if(S.res[S.i]!==undefined||!String(v).trim()) return; const {n,f}=it, fb=$('fb');
  const right=ok(f,v);
  if(!right&&it.t!=='choose'&&S.tries<1){                       /* typed: one more go, with a nudge */
    S.tries++; const near=lev(norm(v),norm(f.w))<=1;
    fb.innerHTML=(near?'<b class="no">Nearly</b> — check the spelling.':'<b class="no">Not quite.</b> Look at the words around the gap: what kind of word does it need?')+' It starts with <b>“'+esc(f.w.slice(0,2))+'…”</b>';
    const inp=$('ans'); inp.select(); return;
  }
  const first=right&&S.tries===0;
  S.res[S.i]=first; if(it.t==='choose') S.res[S.i]=right;
  const was=(()=>{ try{ return IntuityRing.has(f.id); }catch(e){ return false; } })();
  remember(f,S.res[S.i]);
  if(S.res[S.i]&&was){ try{ IntuityRing.has(f.id)?S.half++:S.fixed++; }catch(e){} }
  if(btn){ $('practice').querySelectorAll('.opt').forEach(b=>{ b.disabled=true; if(norm(b.dataset.o)===norm(f.w)) b.classList.add('ok'); }); if(!right) btn.classList.add('no'); }
  const inp=$('ans'); if(inp){ inp.disabled=true; $('chk').disabled=true; }
  const bl=$('blank'); bl.textContent=f.w; bl.classList.remove('miss');
  fb.innerHTML=(right?'<b class="ok">Right.</b> ':'<b class="no">The answer: '+esc(f.w)+'.</b> ')+`${eq(n,f)} <span class="cls">${esc(f.cls)}</span> — ${esc(f.gloss)}${ruleBox(f)}`;
  $('nextRow').classList.remove('hidden'); $('next').focus();
}
function results(){
  const r=S.res.filter(Boolean).length, waiting=(()=>{ try{ return pool().filter(x=>IntuityRing.has(x.f.id)).length; }catch(e){ return 0; } })();
  const bits=[]; if(S.fixed) bits.push(`<b>${S.fixed}</b> ${S.fixed===1?'mistake':'mistakes'} fixed for good`); if(S.half) bits.push(`<b>${S.half}</b> right today — ${S.half===1?'it comes':'they come'} back tomorrow to make sure`);
  $('practice').innerHTML=`<div class="q result"><p class="kick" style="justify-content:center"><i></i>Practice</p><div class="big">${r} of ${S.items.length}</div>
    <p class="lead">right first time</p><p class="ring-line">${bits.length?bits.join(' · ')+'. ':''}${waiting?`Still to fix here: <b>${waiting}</b>.`:'Nothing left to fix in this set.'}</p>
    <button class="btn" type="button" id="again">Ten more</button></div>`;
  $('again').onclick=startPractice;
}

/* ══ GAME · THE WORD LAB ══ */
let L=null;
const HEART='<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4.5 6.7 4.5c2.1 0 3.6 1.1 5.3 3 1.7-1.9 3.2-3 5.3-3 3.7 0 5.8 3.8 4.3 7.2C19.5 16.4 12 21 12 21z"/></svg>';
function targetsFrom(n,word){ return n.forms.filter(f=>f.type===kind&&src(n,f)===word&&(LADDER[set]||f.cls===set)); }
function labStart(){
  const fams=shuffle(D.nodes.filter(n=>(LADDER[set]?LADDER[set].includes(n.set):true)&&targetsFrom(n,n.base).length));
  fams.sort((a,b)=>targetsFrom(b,b.base).some(f=>due(f.id))-targetsFrom(a,a.base).some(f=>due(f.id)));
  if(!fams.length){ $('game').innerHTML=`<p class="lead">No ${kind==='prefix'?'prefixed':'suffixed'} words to build in this set. Try another tab.</p>`; return; }
  L={n:fams[0],word:fams[0].base,found:[],hearts:3,tried:new Set(),order:fams,at:0}; labDraw();
}
function labAffixes(){
  const want=targetsFrom(L.n,L.word).map(f=>f.affix);
  const allOfKind=[...new Set(D.nodes.flatMap(n=>n.forms.filter(f=>f.type===kind).map(f=>f.affix)))].filter(a=>!want.includes(a)&&a);
  const extra=shuffle(allOfKind).slice(0,Math.max(3,6-want.length));
  return L.aff||(L.aff=shuffle([...new Set(want)].concat(extra)));
}
function labDraw(msg){
  const t=targetsFrom(L.n,L.word), got=t.filter(f=>L.found.includes(f)).length, done=got===t.length, dead=L.hearts<=0;
  const affs=labAffixes();
  $('game').innerHTML=`<div class="lab-head"><span>Build every ${kind==='prefix'?'prefixed':'suffixed'} word you can from the word in the ring</span><span class="hearts">${[0,1,2].map(i=>HEART.replace('<svg',`<svg class="${i<L.hearts?'':'gone'}"`)).join('')}</span></div>
    <div class="lab"><div class="ring" id="ring"><span>${esc(L.word)}</span></div>
      <div class="affixes">${affs.map(a=>{ const hit=t.find(f=>f.affix===a&&L.found.includes(f)); const miss=L.tried.has(L.word+'|'+a)&&!hit;
        return `<button class="aff${hit?' used':''}${miss?' miss':''}" type="button" data-a="${esc(a)}"${hit||miss||done||dead?' disabled':''}>${esc(a)}</button>`; }).join('')}</div>
      <p class="lab-msg" aria-live="polite">${msg||(done?`All ${t.length} found.`:dead?'Out of hearts — here are the ones you missed.':`${got} of ${t.length} found`)}</p>
      <div class="found">${L.n.forms.filter(f=>L.found.includes(f)||((done||dead)&&src(L.n,f)===L.word&&f.type===kind)).map(f=>{
        const more=L.n.forms.some(x=>x.type===kind&&src(L.n,x)===f.w&&(LADDER[set]||x.cls===set));
        return `<div class="row"${L.found.includes(f)?'':' style="background:var(--wrong-soft)"'}><span class="w"${L.found.includes(f)?'':' style="color:var(--wrong)"'}>${esc(f.w)}</span><span class="cls">${esc(f.cls)}</span>${more&&L.found.includes(f)?`<button type="button" data-build="${esc(f.w)}">Build on it</button>`:''}<span class="g">${esc(src(L.n,f))} + ${esc(f.affix)}: ${esc(f.gloss)}</span></div>`; }).join('')}</div>
      <div class="lab-foot"><button class="btn quiet" type="button" id="labLook">See the family</button><button class="btn" type="button" id="labNext">${done||dead?'Next word':'Skip this word'}</button></div></div>`;
  $('game').querySelectorAll('.aff').forEach(b=>b.onclick=()=>labTap(b.dataset.a));
  $('game').querySelectorAll('[data-build]').forEach(b=>b.onclick=()=>{ L.word=b.dataset.build; L.aff=null; L.hearts=3; labDraw(`Now build on ${b.dataset.build}.`); });
  $('labLook').onclick=()=>openFamily(L.n);
  /* skipping is not a mistake: only running out of hearts writes misses to the Ring */
  $('labNext').onclick=()=>{
    L.at=(L.at+1)%L.order.length; const n=L.order[L.at]; L={...L,n,word:n.base,found:[],hearts:3,tried:new Set(),aff:null}; labDraw(); };
}
function labTap(a){
  const t=targetsFrom(L.n,L.word), f=t.find(x=>x.affix===a); L.tried.add(L.word+'|'+a);
  const ring=$('ring');
  if(f){ L.found.push(f); remember(f,true); labDraw(`${L.word} + ${a} = ${f.w}`); const r=$('ring'); r.classList.add('snap'); }
  else { L.hearts--; ring.classList.add('shake');
    if(L.hearts<=0) t.filter(x=>!L.found.includes(x)).forEach(x=>remember(x,false));
    setTimeout(()=>labDraw(L.hearts>0?`${L.word} + ${a} isn't a word.`:undefined),380); }
}

/* the header's real height, kept up to date as tabs wrap or the phone turns */
(function(){ const h=document.querySelector('header.header'); const set=()=>document.documentElement.style.setProperty('--wf-head',h.getBoundingClientRect().height+'px');
  set(); if(window.ResizeObserver) new ResizeObserver(set).observe(h); window.addEventListener('resize',set); })();

/* ══ BOOT ══ */
fetch('/data/use-of-english/word-formation/word-families.json',{cache:'no-cache'}).then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); }).then(d=>{
  D=d; (d.rules||[]).forEach(r=>RULES[r.id]=r);
  if(!SETS.some(s=>s[0]===set)) set='mix1'; if(!['explore','practice','game'].includes(mode)) mode='explore';
  go();
}).catch(()=>{ $('explore').innerHTML='<p class="lead">The word families didn’t load. Check your connection and reload.</p>'; });
})();
</script>
