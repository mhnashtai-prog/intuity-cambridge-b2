<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INTUITY - Word Formation</title>
  <meta name="theme-color" content="#F3F1ED">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500&family=Anton&display=swap" rel="stylesheet">
  <!-- The shell brings the header, the mode row and every token; uoe.css is
       the one stylesheet Parts 1-4 now share. This page's own stylesheet is
       gone: it held a private palette and a type stack, nothing unique. -->
  <link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=7">
  <link rel="stylesheet" href="/data/use-of-english/uoe.css?v=2">
  <style>
    /* Page-specific only. Everything shared lives in uoe.css.

       This one rule is deliberately here and not there: intuity-shell.css
       sets body{color:var(--paper)} and expects each page to set its own
       ink afterwards. If uoe.css fails to load, that rule stands and the
       page renders white on white — fully working and completely
       invisible. Declaring the ink inline means a missing stylesheet
       costs you the styling, not the page. */
    body{color:var(--ink,#14110E);background:var(--screen,#F3F1ED);}
  </style>
</head>
<body data-uoe-modes="Full text|Paragraph">
  <header class="header">
    <div class="header-top">
      <a class="back-link" href="/index.html?openModal=english" target="_top">&larr; Use of English</a>
      <div class="header-title">
        <div class="app-title">INTUITY</div>
        <div class="app-subtitle">Word Formation · Part 3</div>
      </div>
      <span class="header-spacer">Level <b>B2–C1</b></span>
    </div>
    <div class="uoe-sets"><div class="dataset-selector">
        <button class="dataset-btn" onclick="toggleDatasetMenu()" aria-label="Select quiz type">Select Type ▾</button>
        <div class="dataset-dropdown" id="datasetDropdown" role="menu">
          <button class="dataset-option active" data-index="0" role="menuitem">8 Gaps</button>
          <button class="dataset-option" data-index="1" role="menuitem">10 Gaps</button>
          <button class="dataset-option" data-index="2" role="menuitem">Single Sentences</button>
        </div>
      </div></div>
  </header>

  <div class="container">
    

    <div class="test-nav">
      <div class="dots-container" id="dotsContainer" role="navigation" aria-label="Test selection"></div>
    </div>

    <div class="test-info" id="testInfo" role="status" aria-live="polite">Loading...</div>

    <div class="content-container" id="classicContainer" role="main">
      <div class="content-header-wrapper">
        <div class="section-dots" id="sectionDotsClassic"></div>
        <div class="mode-toggle-container">
          <span class="mode-toggle-label">Text</span>
          <div class="mode-toggle-switch" id="modeToggleSwitch" onclick="toggleMode()" role="switch" aria-checked="false" aria-label="Toggle between full text and paragraph mode"></div>
          <span class="mode-toggle-label">Chunks</span>
        </div>
      </div>
      <div style="text-align: center; padding: 3rem; color: var(--poster-faint);">
        <div class="loading-spinner" style="width: 2rem; height: 2rem; margin: 0 auto 1rem;"></div>
        <div style="font-size: 1rem; margin-bottom: 0.5rem; font-weight: 500;">Loading Quiz...</div>
        <div style="font-size: 0.75rem; opacity: 0.7;">Preparing Test 1</div>
      </div>
    </div>

    <div class="content-container hidden" id="guidedContainer" role="main">
      <div class="content-header-wrapper">
        <div class="section-dots" id="sectionDotsGuided"></div>
        <div class="mode-toggle-container">
          <span class="mode-toggle-label">Text</span>
          <div class="mode-toggle-switch active" id="modeToggleSwitchGuided" onclick="toggleMode()" role="switch" aria-checked="true" aria-label="Toggle between full text and paragraph mode"></div>
          <span class="mode-toggle-label">Chunks</span>
        </div>
      </div>
    </div>

    <div class="footer" id="footer" role="toolbar">
      <button onclick="showHint()" id="hintBtn" aria-label="Get a hint">Hint</button>
      <button onclick="showAnswers()" id="showKeyBtn" aria-label="Show answer key" disabled>Key</button>
      <button onclick="repeatTest()" aria-label="Clear and restart">Clear</button>
      <button class="primary" onclick="submitAndScore()" id="submitBtn" aria-label="Submit for scoring">Submit</button>
    </div>
  </div>

  <div class="modal-overlay" id="scoreModal" role="dialog" aria-labelledby="scoreModalTitle" aria-modal="true">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="scoreModalTitle">Results</h2>
        <div class="modal-subtitle" id="modalSubtitle"></div>
      </div>
      <div class="score-display">
        <div class="score-number" id="scoreNumber" aria-label="Score">0/0</div>
      </div>
      <div class="answers-section">
        <div id="answersDisplay"></div>
      </div>
      <div class="modal-footer">
        <button class="modal-btn modal-btn-secondary" onclick="closeModal()">Close</button>
        <button class="modal-btn modal-btn-primary" onclick="nextTest()">Next</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="alert" aria-live="polite"></div>

  <script src="/data/use-of-english/uoe-modes.js?v=2"></script>
  <script>

    /* ── DOTTED LEADERS ──────────────────────────────────────────────────
       The passage files carry runs of "..........", 118 of them across the
       8-gap and 10-gap sets. On paper those dots ARE the gap — the space
       you write in. On screen the <input> is the gap, so the dots sit
       beside it as a second, fake slot: a chip, a box and a row of dots,
       three marks for one answer.

       Stripped at render rather than in the data, so the files stay
       faithful to the printed original and any new file inherits the fix.
       The space is kept, or words either side of a stripped run collide.

       DECLARED AT THE TOP OF THE SCRIPT, deliberately. It was first put
       beside the code that uses it — which turned out to be two braces
       deep inside another function, while the two call sites live in
       different functions again. A function declaration hoists within its
       own scope and no further, so the page threw
       "Can't find variable: stripLeaders" before it drew anything. A
       helper used by more than one function belongs where all of them can
       see it. */
    function stripLeaders(t){ return String(t).replace(/\s*\.{4,}\s*/g, ' '); }

    const DATASETS = [
      { name: '8 Gaps', path: '../../../data/use-of-english/word-formation/word-formation-8gaps.json' },
      { name: '10 Gaps', path: '../../../data/use-of-english/word-formation/word-formation-10gaps.json' },
      { name: 'Single Sentences', path: '../../../data/use-of-english/word-formation/word-formation-sentences.json' }
    ];

    let allTests = [];
    let currentDatasetIndex = 0;
    let currentTest = 0;
    let currentSection = 0;
    let userAnswers = {};
    let showingResults = false;
    let testScores = {};
    let currentMode = 'classic';
    let answersVisible = false;
    let inputDebounceTimers = {};
    let hintsUsed = new Set();
    let isSentenceFormat = false;
    let storageKey = '';

    function sanitizeText(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function normalizeAnswer(answer) {
      return answer.toLowerCase().trim().replace(/\s+/g, ' ').replace(/['']/g, "'");
    }

    function answersMatch(userAnswer, correctAnswer) {
      const normalized = normalizeAnswer(userAnswer);
      const correct = normalizeAnswer(correctAnswer);
      if (normalized === correct) return true;
      const variations = [
        [normalized.replace(/ise/g, 'ize'), correct],
        [normalized.replace(/our/g, 'or'), correct],
        [normalized.replace(/re$/g, 'er'), correct]
      ];
      return variations.some(([a, b]) => a === b || b === a);
    }

    function showToast(message, duration = 2500) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), duration);
    }

    function getStorageKey() {
      return 'wf_progress_' + DATASETS[currentDatasetIndex].name.toLowerCase().replace(/\s+/g, '_');
    }

    function loadProgress() {
      try {
        storageKey = getStorageKey();
        const saved = localStorage.getItem(storageKey);
        testScores = saved ? JSON.parse(saved) : {};
      } catch (e) {
        console.error('Error loading progress:', e);
        testScores = {};
      }
    }

    function saveProgress() {
      try {
        localStorage.setItem(storageKey, JSON.stringify(testScores));
      } catch (e) {
        console.error('Error saving progress:', e);
      }
    }

    function toggleDatasetMenu() {
      document.getElementById('datasetDropdown').classList.toggle('active');
    }

    document.addEventListener('click', (e) => {
      const selector = document.querySelector('.dataset-selector');
      if (selector && !selector.contains(e.target)) {
        document.getElementById('datasetDropdown').classList.remove('active');
      }
    });

    async function init() {
      try {
        loadProgress();
        setupDatasetListeners();
        await loadDataset(0);
        setupKeyboardShortcuts();
        // Removed automatic help modal - students won't read it
      } catch (error) {
        console.error('Initialization error:', error);
        showError('Failed to initialize quiz');
      }
    }

    function setupDatasetListeners() {
      document.querySelectorAll('.dataset-option').forEach((btn, index) => {
        btn.addEventListener('click', async function() {
          document.querySelectorAll('.dataset-option').forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          currentDatasetIndex = index;
          toggleDatasetMenu();
          currentTest = 0;
          currentSection = 0;
          userAnswers = {};
          hintsUsed.clear();
          await loadDataset(index);
        });
      });
    }
    
    function setupKeyboardShortcuts() {
      document.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
          const footer = document.getElementById('footer');
          if (footer.classList.contains('visible') && !showingResults) {
            e.preventDefault();
            submitAndScore();
          }
        }
        if (e.key === 'Escape') {
          closeModal();
          const dropdown = document.getElementById('datasetDropdown');
          if (dropdown.classList.contains('active')) toggleDatasetMenu();
        }
      });
    }

    async function loadDataset(index) {
      try {
        showLoadingState();
        loadProgress();
        
        const response = await fetch(DATASETS[index].path);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        
        if (!data || !data.exercises || !Array.isArray(data.exercises)) {
          throw new Error('Invalid data format');
        }
        
        allTests = data.exercises;
        isSentenceFormat = data.metadata.format === 'word-formation-sentences';
        
        createDots();
        loadTest(0);
      } catch (error) {
        console.error('Error loading dataset:', error);
        showError(`Could not load quiz: ${error.message}`);
      }
    }

    function showLoadingState() {
      const container = document.getElementById('classicContainer');
      container.innerHTML = `
        <div class="content-header-wrapper">
          <div class="section-dots" id="sectionDotsClassic"></div>
          <div class="mode-toggle-container">
            <span class="mode-toggle-label">Text</span>
            <div class="mode-toggle-switch" onclick="toggleMode()" role="switch" aria-checked="false"></div>
            <span class="mode-toggle-label">Chunks</span>
          </div>
        </div>
        <div style="text-align: center; padding: 3rem; color: var(--poster-faint);">
          <div class="loading-spinner" style="width: 2rem; height: 2rem; margin: 0 auto 1rem;"></div>
          <div style="font-size: 1rem; margin-bottom: 0.5rem; font-weight: 500;">Loading Quiz...</div>
        </div>
      `;
    }

    function showError(message) {
      const container = document.getElementById('classicContainer');
      container.innerHTML = `
        <div class="error-state">
          <div style="font-size: 3rem; margin-bottom: 1rem;">⚠</div>
          <div style="font-size: 1.125rem; color: var(--poster-ink); margin-bottom: 0.5rem;">Something went wrong</div>
          <div style="font-size: 0.875rem; color: var(--poster-faint); margin-bottom: 1rem;">${sanitizeText(message)}</div>
          <button onclick="location.reload()" class="nav-btn nav-btn-primary">Reload</button>
        </div>
      `;
    }

    function toggleMode() {
      const switchClassic = document.getElementById('modeToggleSwitch');
      const switchGuided = document.getElementById('modeToggleSwitchGuided');
      
      if (currentMode === 'classic') {
        currentMode = 'guided';
        if (switchClassic) switchClassic.classList.add('active');
        if (switchGuided) switchGuided.classList.add('active');
        document.getElementById('classicContainer').classList.add('hidden');
        document.getElementById('guidedContainer').classList.remove('hidden');
        renderGuidedMode();
        showToast('Switched to Chunks mode');
      } else {
        currentMode = 'classic';
        if (switchClassic) switchClassic.classList.remove('active');
        if (switchGuided) switchGuided.classList.remove('active');
        document.getElementById('guidedContainer').classList.add('hidden');
        document.getElementById('classicContainer').classList.remove('hidden');
        renderClassicMode();
        showToast('Switched to Text mode');
      }
    }

    function createDots() {
      const container = document.getElementById('dotsContainer');
      container.innerHTML = '';
      
      for (let i = 0; i < allTests.length; i++) {
        const dot = document.createElement('button');
        dot.className = 'test-dot';
        dot.setAttribute('aria-label', `Test ${i + 1}`);
        
        if (i === currentTest) {
          dot.classList.add('current');
          dot.setAttribute('aria-current', 'true');
        }
        
        const score = testScores[`test${i}`];
        if (score) {
          const percentage = score.bestPercentage || score.percentage;
          if (percentage === 100) {
            dot.classList.add('perfect');
            dot.innerHTML = '<span class="star-badge">⭐</span>';
          } else if (percentage >= 75) dot.classList.add('excellent');
          else if (percentage >= 60) dot.classList.add('good');
          else if (percentage >= 50) dot.classList.add('fair');
          else dot.classList.add('poor');
        }
        
        dot.onclick = () => goToTest(i);
        container.appendChild(dot);
      }
    }

    function loadTest(testIdx) {
      if (!allTests[testIdx]) return;
      
      currentTest = testIdx;
      currentSection = 0;
      showingResults = false;
      answersVisible = false;
      userAnswers = {};
      hintsUsed.clear();
      Object.values(inputDebounceTimers).forEach(clearTimeout);
      inputDebounceTimers = {};
      
      if (currentMode === 'guided') renderGuidedMode();
      else renderClassicMode();
      
      updateTestInfo();
      updateFooter();
      updateKeyButton();
      createDots();
    }

    function getTotalGaps() {
      const test = allTests[currentTest];
      if (!test) return 0;
      
      if (isSentenceFormat && test.sentences) {
        return test.sentences.filter(s => !s.isExample).length;
      } else {
        const gaps = test.gaps ? Object.keys(test.gaps).filter(n => n !== '0') : [];
        return gaps.length;
      }
    }

    function getFilledCount() {
      return Object.keys(userAnswers).filter(k => {
        const value = userAnswers[k];
        return value && value.trim() !== '' && k !== '0';
      }).length;
    }

    function renderClassicMode() {
      const test = allTests[currentTest];
      if (!test) return;
      const container = document.getElementById('classicContainer');
      
      const headerWrapper = document.createElement('div');
      headerWrapper.className = 'content-header-wrapper';
      headerWrapper.innerHTML = `
        <div class="section-dots" id="sectionDotsClassic"></div>
        <div class="mode-toggle-container">
          <span class="mode-toggle-label">Text</span>
          <div class="mode-toggle-switch" id="modeToggleSwitch" onclick="toggleMode()" role="switch" aria-checked="false"></div>
          <span class="mode-toggle-label">Chunks</span>
        </div>
      `;
      
      const titleDiv = document.createElement('div');
      titleDiv.className = 'text-title';
      titleDiv.textContent = test.title;
      
      const contentDiv = document.createElement('div');
      contentDiv.className = 'text-content';

      if (isSentenceFormat && test.sentences) {
        test.sentences.forEach((sentence, idx) => {
          const p = document.createElement('p');
          const num = sentence.number;
          
          if (sentence.isExample) {
            let exampleText = sentence.text;
            const exampleMatch = exampleText.match(/\(0\)\s+([A-Z]+)\s+(\w+)/);
            if (exampleMatch) {
              const promptWord = exampleMatch[1];
              const exampleAnswer = exampleMatch[2];
              exampleText = exampleText.replace(
                exampleMatch[0],
                `(0) <span class="prompt-word">${sanitizeText(promptWord)}</span> <span class="example-word">${sanitizeText(exampleAnswer)}</span>`
              );
            }
            p.innerHTML = stripLeaders(exampleText);
          } else {
            const value = userAnswers[num] || '';
            const correct = sentence.answer || '';
            let cls = 'gap';
            let displayValue = '';
            let isReadonly = false;
            
            if (answersVisible) {
              cls += ' key-shown';
              displayValue = sanitizeText(correct);
              isReadonly = true;
            } else if (showingResults) {
              cls += answersMatch(value, correct) ? ' correct' : ' incorrect';
              displayValue = sanitizeText(value);
              isReadonly = true;
            } else {
              displayValue = sanitizeText(value);
              if (value) cls += ' filled';
            }
            
            if (hintsUsed.has(num.toString())) cls += ' hint-active';
            
            const prompt = `<span class="prompt-word">${sanitizeText(sentence.prompt)}</span>`;
            const input = `<input type="text" class="${cls}" data-gap="${num}" value="${displayValue}" ${isReadonly ? 'readonly' : ''} autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Gap ${num}">`;
            
            let sentenceHTML = sanitizeText(sentence.text);
            const gapPattern = new RegExp(`${sentence.prompt}\\s+\\.+`, 'g');
            sentenceHTML = sentenceHTML.replace(gapPattern, `${prompt} ${input}`);
            
            p.innerHTML = sentenceHTML;
          }
          
          contentDiv.appendChild(p);
        });
      } else {
        const paragraphs = test.text.split('\n\n');
        paragraphs.forEach(para => {
          const p = document.createElement('p');
          let html = sanitizeText(para);
          
          const gapPattern = /\((\d+)\)\s*([A-Z]+)\s+/g;
          let match;
          const replacements = [];
          
          while ((match = gapPattern.exec(para)) !== null) {
            const num = match[1];
            const promptWord = match[2];
            
            if (num === '0') {
              const answerObj = test.gaps && test.gaps[num] ? test.gaps[num] : null;
              const answer = answerObj ? (answerObj.answer || answerObj) : '';
              replacements.push({
                original: match[0],
                /* The SOURCE TEXT ALREADY CARRIES THE ANSWER. Every
                   passage file writes the example as "(0) ICY icy
                   throughout the year" — prompt, then the answer, exactly
                   as the exam paper prints it. Injecting the answer again
                   produced "ICY ICY icy", which is what was on screen.
                   Verified across all 12 passage tests in the 8-gap and
                   10-gap files: 12 of 12 already have it inline.

                   So the replacement covers the prompt only, and the
                   answer that follows in the text is left to read as the
                   text. */
                replacement: `(${num}) <span class="prompt-word">${sanitizeText(promptWord)}</span>`
              });
            } else {
              const value = userAnswers[num] || '';
              const correctObj = test.gaps && test.gaps[num] ? test.gaps[num] : null;
              const correct = correctObj ? (correctObj.answer || correctObj) : '';
              let cls = 'gap';
              let displayValue = '';
              let isReadonly = false;
              
              if (answersVisible) {
                cls += ' key-shown';
                displayValue = sanitizeText(correct);
                isReadonly = true;
              } else if (showingResults) {
                cls += answersMatch(value, correct) ? ' correct' : ' incorrect';
                displayValue = sanitizeText(value);
                isReadonly = true;
              } else {
                displayValue = sanitizeText(value);
                if (value) cls += ' filled';
              }
              
              if (hintsUsed.has(num)) cls += ' hint-active';
              
              const prompt = `<span class="prompt-word">${sanitizeText(promptWord)}</span>`;
              const input = `<input type="text" class="${cls}" data-gap="${num}" value="${displayValue}" ${isReadonly ? 'readonly' : ''} autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Gap ${num}">`;
              
              replacements.push({
                original: match[0],
                replacement: `(${num}) ${prompt} ${input} `
              });
            }
          }
          
          replacements.forEach(r => {
            html = html.replace(r.original, r.replacement);
          });
          
          p.innerHTML = stripLeaders(html);
          contentDiv.appendChild(p);
        });
      }
      
      container.innerHTML = '';
      container.appendChild(headerWrapper);
      container.appendChild(titleDiv);
      container.appendChild(contentDiv);
      attachListeners();
    }

    function renderGuidedMode() {
      const test = allTests[currentTest];
      if (!test) return;
      const container = document.getElementById('guidedContainer');
      
      // Build sections based on format
      let sections = [];
      
      if (isSentenceFormat && test.sentences) {
        // For sentence format: group every 2-3 non-example sentences
        const nonExample = test.sentences.filter(s => !s.isExample);
        for (let i = 0; i < nonExample.length; i += 3) {
          const chunk = nonExample.slice(i, i + 3);
          sections.push({
            sentences: chunk,
            gaps: chunk.map(s => s.number)
          });
        }
      } else {
        // For paragraph format: use similar logic as gap-fill
        const paragraphs = test.text.split('\n\n').filter(p => p.trim());
        const gapNums = Object.keys(test.gaps).filter(n => n !== '0').map(n => parseInt(n)).sort((a, b) => a - b);
        
        let currentParagraphs = [];
        let currentGaps = [];
        
        paragraphs.forEach((para) => {
          const paraGaps = gapNums.filter(num => para.includes(`(${num})`));
          if (paraGaps.length === 0) return;
          
          if (paraGaps.length >= 2) {
            if (currentParagraphs.length > 0) {
              sections.push({ text: currentParagraphs.join('\n\n'), gaps: currentGaps });
              currentParagraphs = [];
              currentGaps = [];
            }
            sections.push({ text: para, gaps: paraGaps });
          } else {
            currentParagraphs.push(para);
            currentGaps = currentGaps.concat(paraGaps);
            if (currentGaps.length >= 2) {
              sections.push({ text: currentParagraphs.join('\n\n'), gaps: currentGaps });
              currentParagraphs = [];
              currentGaps = [];
            }
          }
        });
        
        if (currentParagraphs.length > 0) {
          sections.push({ text: currentParagraphs.join('\n\n'), gaps: currentGaps });
        }
      }
      
      const totalSections = sections.length;
      
      // Build header with section dots
      const headerWrapper = document.createElement('div');
      headerWrapper.className = 'content-header-wrapper';
      
      const dotsContainer = document.createElement('div');
      dotsContainer.className = 'section-dots';
      for (let i = 0; i < totalSections; i++) {
        const section = sections[i];
        const filled = section.gaps.every(g => userAnswers[g] || userAnswers[g.toString()]);
        const dot = document.createElement('button');
        dot.className = `section-dot ${i === currentSection ? 'current' : ''} ${filled ? 'filled' : ''}`;
        dot.textContent = i + 1;
        dot.onclick = () => jumpToSection(i);
        dotsContainer.appendChild(dot);
      }
      
      const toggleContainer = document.createElement('div');
      toggleContainer.className = 'mode-toggle-container';
      toggleContainer.innerHTML = `
        <span class="mode-toggle-label">Text</span>
        <div class="mode-toggle-switch active" id="modeToggleSwitchGuided" onclick="toggleMode()" role="switch" aria-checked="true"></div>
        <span class="mode-toggle-label">Chunks</span>
      `;
      
      headerWrapper.appendChild(dotsContainer);
      headerWrapper.appendChild(toggleContainer);
      
      // Render current section
      const section = sections[currentSection];
      const label = document.createElement('div');
      label.className = 'section-label';
      label.textContent = `Part ${currentSection + 1} of ${totalSections} • ${test.title}`;
      
      const content = document.createElement('div');
      content.className = 'text-content';
      
      if (isSentenceFormat && section.sentences) {
        // Render sentence format sections
        section.sentences.forEach(sentence => {
          const p = document.createElement('p');
          const num = sentence.number;
          const value = userAnswers[num] || '';
          const correct = sentence.answer || '';
          let cls = 'gap';
          let displayValue = '';
          let isReadonly = false;
          
          if (answersVisible) {
            cls += ' key-shown';
            displayValue = sanitizeText(correct);
            isReadonly = true;
          } else if (showingResults) {
            cls += answersMatch(value, correct) ? ' correct' : ' incorrect';
            displayValue = sanitizeText(value);
            isReadonly = true;
          } else {
            displayValue = sanitizeText(value);
            if (value) cls += ' filled';
          }
          
          if (hintsUsed.has(num.toString())) cls += ' hint-active';
          
          const prompt = `<span class="prompt-word">${sanitizeText(sentence.prompt)}</span>`;
          const input = `<input type="text" class="${cls}" data-gap="${num}" value="${displayValue}" ${isReadonly ? 'readonly' : ''} autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">`;
          
          let sentenceHTML = sanitizeText(sentence.text);
          const gapPattern = new RegExp(`${sentence.prompt}\\s+\\.+`, 'g');
          sentenceHTML = sentenceHTML.replace(gapPattern, `${prompt} ${input}`);
          
          p.innerHTML = sentenceHTML;
          content.appendChild(p);
        });
      } else {
        // Render paragraph format sections
        let sectionHtml = sanitizeText(section.text);
        
        const gapPattern = /\((\d+)\)\s*([A-Z]+)\s+/g;
        let match;
        const replacements = [];
        
        while ((match = gapPattern.exec(section.text)) !== null) {
          const num = match[1];
          const promptWord = match[2];
          
          if (num === '0') {
            const answerObj = test.gaps && test.gaps[num] ? test.gaps[num] : null;
            const answer = answerObj ? (answerObj.answer || answerObj) : '';
            replacements.push({
              original: match[0],
              replacement: `(${num}) <span class="prompt-word">${sanitizeText(promptWord)}</span> <span class="example-word">${sanitizeText(answer)}</span> `
            });
          } else {
            const value = userAnswers[num] || '';
            const correctObj = test.gaps && test.gaps[num] ? test.gaps[num] : null;
            const correct = correctObj ? (correctObj.answer || correctObj) : '';
            let cls = 'gap';
            let displayValue = '';
            let isReadonly = false;
            
            if (answersVisible) {
              cls += ' key-shown';
              displayValue = sanitizeText(correct);
              isReadonly = true;
            } else if (showingResults) {
              cls += answersMatch(value, correct) ? ' correct' : ' incorrect';
              displayValue = sanitizeText(value);
              isReadonly = true;
            } else {
              displayValue = sanitizeText(value);
              if (value) cls += ' filled';
            }
            
            if (hintsUsed.has(num)) cls += ' hint-active';
            
            const prompt = `<span class="prompt-word">${sanitizeText(promptWord)}</span>`;
            const input = `<input type="text" class="${cls}" data-gap="${num}" value="${displayValue}" ${isReadonly ? 'readonly' : ''} autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">`;
            
            replacements.push({
              original: match[0],
              replacement: `(${num}) ${prompt} ${input} `
            });
          }
        }
        
        replacements.forEach(r => {
          sectionHtml = sectionHtml.replace(r.original, r.replacement);
        });
        
        content.innerHTML = sectionHtml.split('\n\n').map(para => `<p>${para}</p>`).join('');
      }
      
      const navButtons = document.createElement('div');
      navButtons.className = 'nav-buttons';
      navButtons.innerHTML = `
        <button class="nav-btn nav-btn-secondary" ${currentSection === 0 ? 'disabled' : ''} onclick="previousSection()">← Previous</button>
        <button class="nav-btn nav-btn-primary" ${currentSection >= totalSections - 1 ? 'disabled' : ''} onclick="nextSection()">Next →</button>
      `;
      
      container.innerHTML = '';
      container.appendChild(headerWrapper);
      container.appendChild(label);
      container.appendChild(content);
      container.appendChild(navButtons);
      attachListeners();
    }

    function attachListeners() {
      document.querySelectorAll('.gap').forEach(input => {
        function resizeInput() {
          const minWidth = 64;
          const maxWidth = 160;
          const tempSpan = document.createElement('span');
          tempSpan.style.visibility = 'hidden';
          tempSpan.style.position = 'absolute';
          tempSpan.style.fontSize = '0.9375rem';
          tempSpan.style.fontFamily = input.style.fontFamily || 'inherit';
          tempSpan.style.padding = '0.5rem 0.75rem';
          tempSpan.textContent = input.value || input.placeholder || '';
          document.body.appendChild(tempSpan);
          const width = Math.min(Math.max(tempSpan.offsetWidth + 10, minWidth), maxWidth);
          document.body.removeChild(tempSpan);
          input.style.width = width + 'px';
        }
        
        resizeInput();
        
        if (!showingResults && !answersVisible) {
          input.addEventListener('input', function() {
            resizeInput();
            const num = this.dataset.gap;
            if (inputDebounceTimers[num]) clearTimeout(inputDebounceTimers[num]);
            inputDebounceTimers[num] = setTimeout(() => {
              const trimmedValue = this.value.trim();
              if (trimmedValue) {
                userAnswers[num] = trimmedValue;
                this.classList.add('filled');
              } else {
                delete userAnswers[num];
                this.classList.remove('filled');
              }
              updateFooter();
            }, 100);
          });
        }
      });
    }

    function previousSection() {
      if (currentSection > 0) {
        currentSection--;
        renderGuidedMode();
      }
    }

    function nextSection() {
      const test = allTests[currentTest];
      if (!test) return;
      
      let totalSections = 0;
      
      if (isSentenceFormat && test.sentences) {
        const nonExample = test.sentences.filter(s => !s.isExample);
        totalSections = Math.ceil(nonExample.length / 3);
      } else {
        const paragraphs = test.text.split('\n\n').filter(p => p.trim());
        const gapNums = Object.keys(test.gaps).filter(n => n !== '0').map(n => parseInt(n)).sort((a, b) => a - b);
        const sections = [];
        let currentParagraphs = [];
        let currentGaps = [];
        
        paragraphs.forEach((para) => {
          const paraGaps = gapNums.filter(num => para.includes(`(${num})`));
          if (paraGaps.length === 0) return;
          
          if (paraGaps.length >= 2) {
            if (currentParagraphs.length > 0) {
              sections.push({ text: currentParagraphs.join('\n\n'), gaps: currentGaps });
              currentParagraphs = [];
              currentGaps = [];
            }
            sections.push({ text: para, gaps: paraGaps });
          } else {
            currentParagraphs.push(para);
            currentGaps = currentGaps.concat(paraGaps);
            if (currentGaps.length >= 2) {
              sections.push({ text: currentParagraphs.join('\n\n'), gaps: currentGaps });
              currentParagraphs = [];
              currentGaps = [];
            }
          }
        });
        
        if (currentParagraphs.length > 0) {
          sections.push({ text: currentParagraphs.join('\n\n'), gaps: currentGaps });
        }
        
        totalSections = sections.length;
      }
      
      if (currentSection < totalSections - 1) {
        currentSection++;
        renderGuidedMode();
      }
    }

    function jumpToSection(idx) {
      currentSection = idx;
      renderGuidedMode();
    }

    function updateTestInfo() {
      const total = getTotalGaps();
      const filled = getFilledCount();
      const datasetName = DATASETS[currentDatasetIndex].name;
      document.getElementById('testInfo').textContent = `${datasetName} • Test ${currentTest + 1} of ${allTests.length} • ${filled}/${total} answered`;
    }

    function updateFooter() {
      const total = getTotalGaps();
      const filled = getFilledCount();
      const footer = document.getElementById('footer');
      
      if (filled === total && !showingResults) {
        footer.classList.add('visible');
      } else if (showingResults) {
        footer.classList.add('visible');
      } else {
        footer.classList.remove('visible');
      }
      updateTestInfo();
    }

    function showHint() {
      if (showingResults || answersVisible) {
        showToast('Hints not available in review mode');
        return;
      }
      
      const test = allTests[currentTest];
      let emptyGaps;
      
      if (isSentenceFormat && test.sentences) {
        emptyGaps = test.sentences.filter(s => !s.isExample && !userAnswers[s.number]).map(s => s.number.toString());
      } else {
        const gaps = test.gaps ? Object.keys(test.gaps).filter(n => n !== '0') : [];
        emptyGaps = gaps.filter(num => !userAnswers[num]);
      }
      
      if (emptyGaps.length === 0) {
        showToast('All gaps are filled');
        return;
      }
      
      const randomGap = emptyGaps[Math.floor(Math.random() * emptyGaps.length)];
      let correctAnswer;
      
      if (isSentenceFormat && test.sentences) {
        const sentence = test.sentences.find(s => s.number.toString() === randomGap);
        correctAnswer = sentence ? sentence.answer : '';
      } else {
        const answerObj = test.gaps ? test.gaps[randomGap] : null;
        correctAnswer = answerObj ? (answerObj.answer || answerObj) : '';
      }
      
      const hint = correctAnswer.charAt(0);
      hintsUsed.add(randomGap);
      const input = document.querySelector(`input[data-gap="${randomGap}"]`);
      if (input) {
        input.classList.add('hint-active');
        input.focus();
        showToast(`Gap ${randomGap}: Starts with "${hint.toUpperCase()}"`, 3500);
      }
    }

    function repeatTest() {
      userAnswers = {};
      showingResults = false;
      answersVisible = false;
      currentSection = 0;
      hintsUsed.clear();
      if (currentMode === 'guided') renderGuidedMode();
      else renderClassicMode();
      updateFooter();
      updateKeyButton();
      showToast('Cleared');
    }

    function goToTest(testIdx) {
      loadTest(testIdx);
    }

    function showAnswers() {
      if (!showingResults) {
        showToast('Submit first to enable Key');
        return;
      }
      answersVisible = !answersVisible;
      updateKeyButton();
      if (currentMode === 'guided') renderGuidedMode();
      else renderClassicMode();
      if (answersVisible) showToast('All correct answers shown in green');
      else showToast('Key hidden');
    }

    function updateKeyButton() {
      const btn = document.getElementById('showKeyBtn');
      if (btn) {
        if (showingResults) {
          btn.disabled = false;
          if (answersVisible) {
            btn.classList.add('key-active');
            btn.setAttribute('aria-pressed', 'true');
          } else {
            btn.classList.remove('key-active');
            btn.setAttribute('aria-pressed', 'false');
          }
        } else {
          btn.disabled = true;
          btn.classList.remove('key-active');
          btn.setAttribute('aria-pressed', 'false');
        }
      }
    }

    function submitAndScore() {
      const test = allTests[currentTest];
      
      let correct = 0;
      let total;
      
      if (isSentenceFormat && test.sentences) {
        const nonExample = test.sentences.filter(s => !s.isExample);
        total = nonExample.length;
        nonExample.forEach(sentence => {
          const userAns = userAnswers[sentence.number] || '';
          const correctAns = sentence.answer || '';
          if (answersMatch(userAns, correctAns)) correct++;
        });
      } else {
        const gaps = test.gaps ? Object.keys(test.gaps).filter(n => n !== '0') : [];
        total = gaps.length;
        gaps.forEach(num => {
          const userAns = userAnswers[num] || '';
          const gapObj = test.gaps[num];
          const correctAns = gapObj ? (gapObj.answer || gapObj) : '';
          if (answersMatch(userAns, correctAns)) correct++;
        });
      }
      
      const percentage = Math.round((correct / total) * 100);
      const existingScore = testScores[`test${currentTest}`];
      const isNewBest = !existingScore || percentage > (existingScore.bestPercentage || 0);
      
      testScores[`test${currentTest}`] = {
        correct,
        total,
        percentage,
        firstAttemptScore: !existingScore ? percentage : existingScore.firstAttemptScore,
        bestPercentage: Math.max(percentage, existingScore?.bestPercentage || 0),
        attempts: (existingScore?.attempts || 0) + 1,
        timestamp: new Date().toISOString(),
        hintsUsed: hintsUsed.size
      };
      
      saveProgress();
      showingResults = true;
      answersVisible = false;
      if (currentMode === 'guided') renderGuidedMode();
      else renderClassicMode();
      createDots();
      updateKeyButton();
      
      setTimeout(() => showResultsModal(test, correct, total, percentage), 200);
    }

    function showResultsModal(test, correct, total, percentage) {
      const datasetName = DATASETS[currentDatasetIndex].name;
      const existingScore = testScores[`test${currentTest}`];
      const attempts = existingScore?.attempts || 1;
      
      let subtitle = `${datasetName} • ${test.title} • Test ${currentTest + 1}`;
      if (attempts > 1) {
        subtitle += ` • Attempt ${attempts}`;
        if (percentage > (existingScore.firstAttemptScore || 0)) {
          subtitle += ' (Improved!)';
        }
      }
      if (hintsUsed.size > 0) subtitle += ` • ${hintsUsed.size} hint${hintsUsed.size !== 1 ? 's' : ''}`;
      
      document.getElementById('modalSubtitle').textContent = subtitle;
      document.getElementById('scoreNumber').textContent = `${correct}/${total}`;
      
      const answersDisplay = document.getElementById('answersDisplay');
      let html = '';
      
      if (percentage === 100 && hintsUsed.size === 0) {
        html += '<div style="text-align: center; padding: 1.5rem; font-size: 1.375rem; color: var(--tile-ok-ink); font-weight: 600;">Perfect Score ⭐<br><span style="font-size: 0.875rem; color: var(--poster-faint); font-weight: 400; margin-top: 0.5rem; display: block;">No hints used</span></div>';
      } else if (percentage === 100) {
        html += '<div style="text-align: center; padding: 1.5rem; font-size: 1.375rem; color: var(--tile-ok-ink); font-weight: 600;">Perfect Score ⭐</div>';
      } else if (percentage >= 75) {
        html += '<div style="text-align: center; padding: 1.5rem; font-size: 1.25rem; color: var(--tile-ok-ink); font-weight: 600;">Great Job!</div>';
      } else if (percentage >= 60) {
        html += '<div style="text-align: center; padding: 1.5rem; color: var(--poster-body); font-weight: 500;">Good Effort</div>';
      } else if (percentage >= 50) {
        html += '<div style="text-align: center; padding: 1.5rem; color: var(--accent-ink); font-weight: 500;">Keep Practicing</div>';
      } else {
        html += '<div style="text-align: center; padding: 1.5rem; color: var(--accent-ink); font-weight: 500;">Review & Try Again</div>';
      }
      
      if (isSentenceFormat && test.sentences) {
        test.sentences.filter(s => !s.isExample).forEach((sentence, idx) => {
          const num = sentence.number;
          const userAns = userAnswers[num] || '';
          const correctAns = sentence.answer;
          const isCorrect = answersMatch(userAns, correctAns);
          html += `
            <div class="answer-item ${isCorrect ? 'correct' : 'incorrect'}" style="animation-delay: ${idx * 50}ms">
              <span>${num}. <strong>${sanitizeText(userAns) || '(empty)'}</strong></span>
              ${!isCorrect ? `<span style="color: var(--tile-ok-ink);">→ ${sanitizeText(correctAns)}</span>` : '<span style="color: var(--tile-ok-ink);">✓</span>'}
            </div>
          `;
        });
      } else {
        const gaps = test.gaps ? Object.keys(test.gaps).filter(n => n !== '0').sort((a, b) => parseInt(a) - parseInt(b)) : [];
        gaps.forEach((num, idx) => {
          const userAns = userAnswers[num] || '';
          const gapObj = test.gaps[num];
          const correctAns = gapObj ? (gapObj.answer || gapObj) : '';
          const isCorrect = answersMatch(userAns, correctAns);
          html += `
            <div class="answer-item ${isCorrect ? 'correct' : 'incorrect'}" style="animation-delay: ${idx * 50}ms">
              <span>Gap ${num}: <strong>${sanitizeText(userAns) || '(empty)'}</strong></span>
              ${!isCorrect ? `<span style="color: var(--tile-ok-ink);">→ ${sanitizeText(correctAns)}</span>` : '<span style="color: var(--tile-ok-ink);">✓</span>'}
            </div>
          `;
        });
      }
      
      answersDisplay.innerHTML = html;
      document.getElementById('scoreModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('scoreModal').classList.remove('active');
    }

    function nextTest() {
      closeModal();
      if (currentTest < allTests.length - 1) {
        goToTest(currentTest + 1);
      } else {
        showToast('No more tests available');
      }
    }

    document.getElementById('scoreModal').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });

    window.addEventListener('load', init);
  </script>
<script>
function syncHeader(){
  var h=document.querySelector('.header');
  if(h) document.documentElement.style.setProperty('--header-h', h.offsetHeight+'px');
}
addEventListener('resize', syncHeader);
addEventListener('orientationchange', function(){ setTimeout(syncHeader,120); });
if(document.fonts && document.fonts.ready) document.fonts.ready.then(syncHeader);
if(window.ResizeObserver){ var hh=document.querySelector('.header'); if(hh) new ResizeObserver(syncHeader).observe(hh); }
syncHeader();
</script>
