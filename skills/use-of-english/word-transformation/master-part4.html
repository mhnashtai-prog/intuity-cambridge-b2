<style>
/* ═══ MASTER · PART 4 · the learning ring for key word transformation ══════
   The exam ring (word-transformation.html) practises the task. This page
   teaches how a transformation is built: the same meaning, rebuilt around
   one fixed word, in two to five words — and marked in two halves, one mark
   each, exactly as Cambridge marks it. Twin of Masters 1, 2 and 3.

   NAVIGATION, in the shell's order:
     1 .mode-selector  Explore · Practice · Game
     2 .set-tabs       Tenses · Phrasal verbs · Phrases · Conditionals ·
                       Wishes · Modals · Mix
     (no .seg — the shell makes part 3 optional)

   MARKING follows the pantry's kwt.js, which follows the exam: 2 to 5 words
   including the key word, unchanged; contractions count as two words and are
   expanded before checking; 2 marks for the whole answer, 1 for either half.
   THE GAME builds the answer from word tiles around the key word in the ring.
   DATA: /data/use-of-english/word-transformation/master-part4.json (60 items).
   ═══════════════════════════════════════════════════════════════════════ */
.wf{
  --ink:#2B2129; --sheet:#FEFCF9; --soft:#5C4E52; --mute:#8B7B78; --rule:#D9C0A4;
  --sage:#8AA79C; --caramel:#C2956E; --caramel-ink:#8A6440;
  --right:#4A6B5C; --wrong:#B4653A;
  --right-soft:rgba(74,107,92,.12); --wrong-soft:rgba(180,101,58,.13); --sand:rgba(229,209,184,.45);
  --core:#201E1C; --ring-ink:#E5D1B8;
  --r-box:16px; --r-tap:999px;
  max-width:42rem; margin:0 auto; padding:1rem 1rem 4rem; color:var(--ink);
  font-family:'Geist','Inter',system-ui,sans-serif;
}
.wf *{box-sizing:border-box}
.wf button{font:inherit}
.view-row{display:flex;justify-content:center;margin:0}
/* the shell's header is fixed; the content starts below it, at its measured height
   (seven tabs wrap to two lines on a phone, so the height is never assumed) */
main.wf{padding-top:calc(var(--wf-head,170px) + 1rem)}
.lead{color:var(--soft);font-size:.95rem;line-height:1.5;margin:0 0 1rem;text-align:center}
.count{color:var(--mute);font-size:.85rem;text-align:center;margin:-.4rem 0 1rem}
.hidden{display:none !important}

/* ── EXPLORE: the families, then one opens as a card ─────────────────── */
.fam-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr));gap:.6rem}
.fam{display:flex;flex-direction:column;align-items:flex-start;gap:.3rem;text-align:left;cursor:pointer;
  background:var(--sheet);border:1px solid rgba(217,192,164,.55);border-radius:var(--r-box);padding:.85rem .9rem;color:var(--ink);
  transition:border-color .15s,transform .15s}
.fam:hover{border-color:var(--caramel)}
.fam:active{transform:scale(.98)}
.fam b{font-size:1.08rem;font-weight:600;letter-spacing:-.01em}
.fam span{font-size:.82rem;color:var(--soft);line-height:1.35}
.fam .due{width:.42rem;height:.42rem;border-radius:50%;background:var(--wrong);display:inline-block;margin-left:.35rem;vertical-align:middle}

/* ── THE MODAL CARD (the app's panel: soft corner, blurred ground) ────── */
.scrim{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:max(14px,env(safe-area-inset-top)) 14px 14px;
  background:rgba(250,247,242,.72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.card{position:relative;width:min(34rem,100%);max-height:88vh;overflow-y:auto;background:var(--sheet);border-radius:18px;
  padding:1.4rem 1.3rem 1.3rem;color:var(--ink);font-family:'Geist','Inter',system-ui,sans-serif;
  box-shadow:0 1px 2px rgba(43,33,41,.04),0 12px 28px rgba(43,33,41,.07),0 28px 64px rgba(43,33,41,.08)}
.card .x{position:absolute;top:.6rem;right:.7rem;border:none;background:none;font-size:1.1rem;color:var(--mute);cursor:pointer;padding:.5rem;line-height:1}
.card .x:hover{color:var(--ink)}
.kick{display:flex;align-items:center;gap:.55rem;font-size:.78rem;color:var(--caramel-ink);margin-bottom:.6rem}
.kick i{width:1.4rem;height:.5rem;background:var(--caramel);display:block;border-radius:2px}
.card h2{font-size:1.9rem;font-weight:700;letter-spacing:-.02em;margin:0 0 .15rem}
.card .pos{color:var(--mute);font-size:.88rem;margin-bottom:1rem}
.form{border-top:1px solid rgba(217,192,164,.5);padding:.95rem 0 .2rem}
.form.dim{opacity:.55}
.eq{display:flex;flex-wrap:wrap;align-items:center;gap:.35rem;margin-bottom:.5rem}
.tile{display:inline-block;padding:.2rem .65rem;border-radius:var(--r-tap);font-size:.86rem;font-weight:600}
.tile.base{background:var(--sand);color:var(--ink)}
.tile.aff{background:var(--core);color:var(--ring-ink)}
.op{color:var(--mute);font-size:.9rem}
.word{font-size:1.15rem;font-weight:700}
.cls{font-size:.78rem;color:var(--mute);margin-left:.15rem}
.gloss{margin:.15rem 0 .35rem;color:var(--soft);font-size:.92rem}
.ex{margin:0 0 .35rem;font-size:.98rem;line-height:1.5}
.ex b{color:var(--right);font-weight:700}
.rule{font-size:.86rem;color:var(--soft);background:rgba(138,167,156,.14);border-radius:12px;padding:.5rem .7rem;margin:.4rem 0 .5rem}
.rule b{color:var(--ink)}
.watch{margin-top:1rem;padding-top:.8rem;border-top:1px solid rgba(217,192,164,.5)}
.watch h3{font-size:.9rem;margin:0 0 .5rem}
.watch li{font-size:.88rem;color:var(--soft);margin:.35rem 0;line-height:1.45}
.watch .no{color:var(--wrong);font-weight:700;text-decoration:line-through;text-decoration-thickness:1.5px}
.watch .conf{color:var(--caramel-ink);font-weight:700}
.watch ul{padding-left:1.1rem;margin:0}
.note{font-size:.88rem;color:var(--soft);margin:.8rem 0 0}

/* ── PRACTICE ─────────────────────────────────────────────────────────── */
.dots{display:flex;justify-content:center;gap:.4rem;margin:.2rem 0 1rem}
.dots i{width:.55rem;height:.55rem;border-radius:50%;background:rgba(217,192,164,.6);display:block}
.dots i.ok{background:var(--right)} .dots i.no{background:var(--wrong)} .dots i.now{box-shadow:0 0 0 2px var(--caramel)}
.q{background:var(--sheet);border-radius:var(--r-box);padding:1.3rem 1.2rem;border:1px solid rgba(217,192,164,.55)}
.q .ask{font-size:.9rem;color:var(--soft);margin:0 0 .9rem}
.q .line{display:flex;align-items:baseline;gap:1rem;margin-bottom:1rem}
.q .sent{flex:1;font-size:1.15rem;font-weight:600;line-height:1.55;margin:0}
.q .stem{flex:none;font-weight:800;font-size:.9rem;letter-spacing:.08em;padding:.15rem .6rem;border-radius:var(--r-tap);background:rgba(43,33,41,.06)}
.blank{display:inline-block;min-width:5.5em;border-bottom:2px solid var(--ink);text-align:center;color:var(--right)}
.blank.miss{color:var(--wrong)}
.opts{display:flex;flex-wrap:wrap;gap:.5rem}
.opt{border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:var(--r-tap);padding:.6rem 1.1rem;font-size:1rem;font-weight:600;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.ok{background:var(--right-soft);border-color:var(--right);color:var(--right)}
.opt.no{background:var(--wrong-soft);border-color:var(--wrong);color:var(--wrong);text-decoration:line-through}
.opt:disabled{cursor:default}
.field{display:flex;gap:.5rem}
.field input{flex:1;min-width:0;font:inherit;font-size:1.05rem;padding:.7rem .95rem;border:1px solid var(--rule);border-radius:var(--r-box);background:var(--sheet);color:var(--ink)}
.field input:focus{outline:2px solid var(--caramel);outline-offset:1px}
.btn{border:none;border-radius:var(--r-tap);padding:.7rem 1.3rem;font-size:.95rem;font-weight:600;cursor:pointer;background:var(--ink);color:var(--sheet)}
.btn.quiet{background:none;color:var(--ink);border:1px solid var(--rule)}
.btn:disabled{opacity:.4;cursor:default}
.fb{margin:1rem 0 0;font-size:.95rem;line-height:1.5;color:var(--soft);min-height:1.5em}
.fb b.ok{color:var(--right)} .fb b.no{color:var(--wrong)}
.fb .rule{margin-top:.6rem}
.next-row{display:flex;justify-content:flex-end;margin-top:1rem}
.result{text-align:center;padding:1.6rem 1.2rem}
.result .big{font-size:3rem;font-weight:700;letter-spacing:-.03em;margin:.2rem 0}
.ring-line{font-size:.92rem;line-height:1.55;color:var(--soft);margin:1rem 0;padding:.75rem .9rem;border-radius:var(--r-box);background:rgba(74,107,92,.07)}
.ring-line b{color:var(--right)}

/* ── GAME · THE WORD LAB — the one bold thing on the page ────────────────
   The base word sits in the INTUITY ring; the affixes are pills around it.
   Tap one: if it builds a real word, the word joins the family below; if
   not, a heart goes. Words built in two steps (creative → creativity) open
   once their first step is found: tap a found word to build on it. */
.lab-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem;font-size:.9rem;color:var(--soft)}
.hearts{display:flex;gap:.25rem}
.hearts svg{width:16px;height:16px;fill:var(--wrong);transition:opacity .3s,transform .3s}
.hearts svg.gone{opacity:.2;transform:scale(.8)}
.lab{display:flex;flex-direction:column;align-items:center;gap:1.1rem;background:var(--sheet);border-radius:var(--r-box);padding:1.6rem 1rem 1.3rem;border:1px solid rgba(217,192,164,.55)}
.ring{--d:9.5rem;width:var(--d);height:var(--d);border-radius:50%;display:grid;place-items:center;position:relative;
  background:linear-gradient(145deg,#FFFFFF,#E4DDD1);box-shadow:-6px -6px 14px rgba(255,255,255,.9),8px 8px 20px rgba(43,33,41,.16)}
.ring::before{content:'';position:absolute;inset:5.5%;border-radius:50%;background:var(--sage)}
.ring::after{content:'';position:absolute;inset:14.8%;border-radius:50%;background:var(--core)}
.ring span{position:relative;z-index:2;color:var(--ring-ink);font-weight:700;font-size:1.25rem;letter-spacing:-.01em;max-width:6.3rem;text-align:center;line-height:1.1;word-break:break-word}
.ring.snap{animation:snap .45s cubic-bezier(.22,1,.36,1)}
@keyframes snap{40%{transform:scale(1.07)}}
.ring.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.affixes{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;max-width:28rem}
.aff{border:none;border-radius:var(--r-tap);padding:.55rem 1rem;font-size:1rem;font-weight:700;cursor:pointer;background:var(--core);color:var(--ring-ink);transition:transform .12s,opacity .2s}
.aff:active{transform:scale(.95)}
.aff.used{opacity:.25;cursor:default}
.aff.miss{background:var(--wrong-soft);color:var(--wrong);text-decoration:line-through}
.lab-msg{min-height:1.4em;font-size:.95rem;color:var(--soft);text-align:center;margin:0}
.found{width:100%;display:flex;flex-direction:column;gap:.5rem}
.found .row{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;padding:.55rem .7rem;border-radius:12px;background:var(--right-soft)}
.found .row .w{font-weight:700;color:var(--right)}
.found .row .g{font-size:.86rem;color:var(--soft);flex-basis:100%}
.found .row button{border:1px solid var(--right);background:none;color:var(--right);border-radius:var(--r-tap);padding:.15rem .7rem;font-size:.8rem;font-weight:600;cursor:pointer;margin-left:auto}
.lab-foot{display:flex;justify-content:space-between;align-items:center;width:100%;gap:.5rem;flex-wrap:wrap}
.cross-link{display:block;text-align:center;margin-top:2rem;font-size:.9rem;color:var(--soft)}
.cross-link a{color:var(--ink);font-weight:600}

/* game controls are tapped, not read: no long-press menu on a phone */
.aff,.opt,.fam,.ring,.btn,.dots{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
@media (prefers-reduced-motion:reduce){ .ring.snap,.ring.shake{animation:none} .fam,.aff{transition:none} }

/* ── PART 4 additions ── */
.deck .fam span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.kw{display:inline-block;font-weight:800;font-size:.9rem;letter-spacing:.08em;padding:.2rem .7rem;border-radius:999px;background:var(--core);color:var(--ring-ink);margin:.2rem 0 .6rem}
.orig{font-size:1rem;color:var(--soft);margin:0 0 .4rem}
.half1{background:var(--right-soft);color:var(--right);border-radius:6px;padding:0 .2em;font-weight:700}
.half2{background:rgba(194,149,110,.22);color:var(--caramel-ink);border-radius:6px;padding:0 .2em;font-weight:700}
.marks{font-size:.82rem;color:var(--mute);margin:.2rem 0 .5rem}
.also{font-size:.82rem;color:var(--mute)}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:.45rem;max-width:28rem}
.built{min-height:2.6rem;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:.35rem;padding:.4rem .6rem;border-bottom:2px solid var(--ink);min-width:12rem}
.built span{font-weight:700;color:var(--right)}
.tile-btn{border:none;border-radius:999px;padding:.5rem .95rem;font-size:1rem;font-weight:700;cursor:pointer;background:var(--core);color:var(--ring-ink)}
.tile-btn:disabled{opacity:.25;cursor:default}
.tile-btn{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}


/* ── EXPLORE CARDS: the app's own card, square like every INTUITY card — a small
      caramel label on top, the word in solid black, the line beneath in grey.
      The card that opens on tap is square too; buttons stay pills. ── */
.fam{border-radius:0;border:1px solid rgba(217,192,164,.6);box-shadow:0 1px 2px rgba(43,33,41,.05);padding:.8rem .85rem .9rem;gap:.3rem}
.fam .k{display:flex;align-items:center;gap:.45rem;font:600 .6rem/1.2 'Geist Mono',ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--caramel-ink)}
.fam .k i{flex:none;width:1.1rem;height:.4rem;background:var(--caramel);display:block}
.fam b{color:#14110E;font-weight:800}
.fam span{color:var(--mute)}
.card{border-radius:0}

/* ── the Practice map ── */
.map-card{padding:1.2rem 1.1rem}
.map-head{font-size:.95rem;color:var(--soft);margin:0 0 .6rem;text-align:center}
.map-head b{color:#14110E}
.map-head span{color:var(--mute)}
.bar{display:flex;height:6px;background:rgba(217,192,164,.45);margin:0 0 1rem;overflow:hidden}
.bar i{display:block;height:100%}
.bar .master{background:var(--right)} .bar .tried{background:var(--sage)} .bar .fix{background:var(--wrong)}
.quick{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;margin:0 0 1.1rem}
.map{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:0 0 .9rem}
.sq{width:16px;height:16px;padding:0;border:none;border-radius:2px;cursor:pointer;display:inline-block;flex:none}
.sq.new{background:rgba(217,192,164,.55)} .sq.tried{background:var(--sage)} .sq.master{background:var(--right)} .sq.fix{background:var(--wrong)}
.map .sq:hover{outline:2px solid var(--ink);outline-offset:1px}
.map-legend{display:flex;flex-wrap:wrap;justify-content:center;gap:.9rem;font-size:.8rem;color:var(--soft);margin:0 0 .3rem}
.map-legend span{display:inline-flex;align-items:center;gap:.35rem}
.map-legend .sq{width:11px;height:11px;cursor:default}
.map-tip{text-align:center;font-size:.85rem;color:var(--mute);margin:.2rem 0 0}
@media (max-width:600px){ .sq{width:18px;height:18px} }
/* ── the Game round ── */
.round-head{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin:0 0 .6rem}
.round-head .dots{margin:0}
.dots i.late{background:var(--caramel)}
.streak{font-size:.8rem;font-weight:700;color:var(--caramel-ink);min-width:5.5rem;text-align:center}
.newbest{display:inline-block;background:#14110E;color:var(--ring-ink);border-radius:999px;padding:.3rem .9rem;font-size:.85rem;font-weight:700;margin:.2rem 0 .6rem}
.missed{width:100%;text-align:left;padding-left:1.1rem}
.missed li{font-size:.92rem;line-height:1.5;margin:.35rem 0;color:var(--soft)}
.dots.snap{animation:snap .45s cubic-bezier(.22,1,.36,1)}
.sq{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
</style>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const TOPIC='master-part4', PART='UoE4';
const SETS=[['tense','Tenses'],['pv','Phrasal'],['phrase','Phrases'],['cond','Conditionals'],['wish','Wishes'],['modal','Modals'],['report','Reported'],['passive','Passive'],['mix','Mix']];
const P=new URLSearchParams(location.search);
let D=null, mode=P.get('mode')||'explore', set=P.get('set')||'mix';

/* every item is graded: B2 = what B2 First sets (two elements, one mark each); B1 = the warm-up */
let lvl=new URLSearchParams(location.search).get('lvl')==='B1'?'B1':'B2';
const pool=()=>D.items.filter(i=>(set==='mix'||i.tab===set)&&(i.level||'B2')===lvl);
function emptyNote(){ return `<p class="lead">${lvl==='B1'?'No warm-up items in this tab. Try another tab, or Mix.':'No items in this tab yet.'}</p>`; }
const due=id=>{ try{ return !!(window.IntuityRing&&IntuityRing.isDue(id)); }catch(e){ return false; } };
function remember(i,right){
  try{ if(window.IntuityRing){ right?IntuityRing.right(i.id):IntuityRing.miss(i.id,{topic:TOPIC,part:PART}); } }catch(e){}
  try{ if(window.INTUITY) INTUITY.log(TOPIC,i.id,right,{game:'master-part4-'+mode}); }catch(e){}
}

/* ── marking: the pantry's kwt.js rules, which are the exam's ── */
const norm=t=>String(t).toLowerCase().replace(/[\u2018\u2019]/g,"'").replace(/[^a-z' -]/g,' ').replace(/\s+/g,' ').trim();
/* a contraction counts as two words (don't = do not); a possessive 's does not (everyone's is one word) */
const wc=t=>t.split(' ').filter(Boolean).length+(t.match(/n't\b|'(ll|ve|re|m|d)\b/g)||[]).length;
function variants(t){
  t=t.replace(/\bwon't\b/g,'will not').replace(/\bcan't\b/g,'can not').replace(/\bshan't\b/g,'shall not')
     .replace(/n't\b/g,' not').replace(/'ll\b/g,' will').replace(/'ve\b/g,' have').replace(/'re\b/g,' are').replace(/'m\b/g,' am');
  let out=[t];
  /* 's and 'd can be a contraction OR not: keep the original too, so a possessive (everyone's surprise) still matches */
  [["'d",['would','had']],["'s",['is','has']]].forEach(([c,subs])=>{ out=out.flatMap(x=>x.includes(c)?[x].concat(subs.map(s=>x.split(c).join(' '+s))):[x]); });
  /* cannot and can not are the same answer */
  return out.flatMap(x=>{ x=x.replace(/\s+/g,' ').trim(); return [x,x.replace(/\bcan not\b/g,'cannot'),x.replace(/\bcannot\b/g,'can not')]; });
}
const halves=a=>a.split('|').map(s=>s.trim());
/* both sides are expanded the same way, so "don't" in a stored answer still matches "do not" typed, and back */
function score(i,t){ const vs=variants(norm(t)); let best=0;
  i.a.forEach(ans=>{ const hs=halves(ans), h1s=variants(norm(hs[0])), h2s=variants(norm(hs[1])), fulls=variants(norm(hs.join(' ')));
    vs.forEach(v=>{ let m=0; if(fulls.includes(v)) m=2; else { const a1=h1s.some(h=>v===h||v.startsWith(h+' ')), a2=h2s.some(h=>v===h||v.endsWith(' '+h)); m=(a1||a2)?1:0; } if(m>best) best=m; }); });
  return best; }
const keyIn=(i,t)=>variants(norm(t)).some(v=>v.split(' ').includes(i.k.toLowerCase()));
function answerHTML(ans){ const [h1,h2]=halves(ans); return `<span class="half1">${esc(h1)}</span> <span class="half2">${esc(h2)}</span>`; }
function second(i,inner){ const e=String(i.e||''); return `${esc(i.b)} ${inner}${/^[,.;:!?]/.test(e)?'':' '}${esc(e)}`.trim(); }

/* ══ NAVIGATION ══ */
function drawNav(){
  $('sets').innerHTML=SETS.map(([k,l])=>`<button class="vtab${k===set?' active':''}" type="button" data-set="${k}">${l}</button>`).join('');
  document.querySelectorAll('#modes .mode-btn').forEach(b=>{ const on=b.dataset.mode===mode; b.classList.toggle('active',on); on?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'); });
  ['explore','practice','game'].forEach(v=>$(v).classList.toggle('hidden',v!==mode));
  document.querySelectorAll('#lvl button').forEach(b=>{ const on=b.dataset.lvl===lvl; b.classList.toggle('on',on); b.setAttribute('aria-selected',on); });
  const q=new URLSearchParams({mode,set}); if(lvl==='B1') q.set('lvl','B1');
  history.replaceState(null,'',location.pathname+'?'+q);
}
function go(){ drawNav(); if(mode==='explore') explore(); else if(mode==='practice') gate(); else buildStart(); }
$('modes').addEventListener('click',e=>{ const b=e.target.closest('[data-mode]'); if(b){ mode=b.dataset.mode; go(); } });
$('sets').addEventListener('click',e=>{ const b=e.target.closest('[data-set]'); if(b){ set=b.dataset.set; go(); } });
$('lvl').addEventListener('click',e=>{ const b=e.target.closest('[data-lvl]'); if(b){ lvl=b.dataset.lvl; go(); } });

/* ══ EXPLORE: each transformation, its two marked halves on the card ══ */
function explore(){
  if(!pool().length){ $('explore').innerHTML=emptyNote(); return; }
  const is=pool(), label=(SETS.find(s=>s[0]===set)||[])[1];
  $('explore').innerHTML=`<p class="lead">Each card is one transformation. Tap it to see how the answer is built, and the two halves that earn a mark each.</p>
    <p class="count">${is.length} transformations in ${esc(label)}</p>
    <div class="fam-grid deck">${is.map(i=>`<button class="fam" type="button" data-id="${esc(i.id)}"><small class="k"><i></i>${esc(D.meta.tabs[i.tab]||'')}</small><b>${esc(i.k)}${due(i.id)?'<i class="due" title="Still to fix"></i>':''}</b><span>${esc(i.s)}</span></button>`).join('')}</div>`;
}
$('explore').addEventListener('click',e=>{ const b=e.target.closest('.fam'); if(b) openItem(D.items.find(i=>i.id===b.dataset.id)); });
function openItem(i){
  openCard(`<div class="kick"><i></i>${esc(D.meta.tabs[i.tab]||'')}</div>
    <p class="orig">${esc(i.s)}</p><span class="kw">${esc(i.k)}</span>
    <p class="ex">${second(i,answerHTML(i.a[0]))}</p>
    <p class="marks">One mark for each highlighted half.</p>
    <p class="gloss">${esc(i.why)}</p>
    ${i.a.length>1?`<p class="also">Also right: ${i.a.slice(1).map(a=>esc(halves(a).join(' '))).join(' · ')}</p>`:''}`);
}

/* ══ THE MODAL CARD ══ */
function openCard(html){ closeCard(); const s=document.createElement('div'); s.className='scrim'; s.id='scrim';
  s.innerHTML=`<div class="card wf" role="dialog" aria-modal="true"><button class="x" type="button" aria-label="Close">✕</button>${html}</div>`;
  document.body.appendChild(s); s.addEventListener('click',e=>{ if(e.target===s||e.target.closest('.x')) closeCard(); }); s.querySelector('.x').focus(); }
function closeCard(){ const s=$('scrim'); if(s) s.remove(); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeCard(); });

/* ══ PRACTICE: the map of the whole tab, then ten — or any one — at a time ══
   Every transformation is a square, coloured by where the learner stands
   with it, so the whole bank is visible, the progress is measurable and any
   item can be chosen. The states come from what the app already records:
     to fix    — a mistake the Ring is asking for now
     new       — never answered
     mastered  — right at least twice, the last two right, nothing to fix
     tried     — everything in between
   Corrections come at once: Practice is for learning, and a mistake fixed
   while the learner is still thinking about it is the one that sticks. */
let S=null;
const LOGT=()=>{ try{ return (window.INTUITY&&INTUITY.items()[TOPIC])||{}; }catch(e){ return {}; } };
/* "to fix" means due NOW: a mistake answered right today turns sage at once, and
   turns clay again tomorrow when the Ring brings it back for the second time */
function state(i,L){ let held=false; try{ if(window.IntuityRing){ if(IntuityRing.isDue(i.id)) return 'fix'; held=IntuityRing.has(i.id); } }catch(e){}
  const r=L[i.id]; if(!r||!r.seen) return 'new'; if(!held&&r.right>=2&&/rr$/.test(r.trail||'')) return 'master'; return 'tried'; }
const STATE_NAME={master:'mastered',tried:'tried',fix:'to fix',new:'new'};
function gate(){
  if(!pool().length){ $('practice').innerHTML=emptyNote(); return; }
  const L=LOGT(), P=pool(), st=new Map(P.map(i=>[i,state(i,L)])), c={master:0,tried:0,fix:0,new:0};
  st.forEach(v=>c[v]++); const label=(SETS.find(x=>x[0]===set)||[])[1]||'';
  const pc=k=>P.length?(100*c[k]/P.length).toFixed(2):0;
  $('practice').innerHTML=`<div class="q map-card">
    <p class="map-head"><b>${c.master}</b> mastered · <b>${c.fix}</b> to fix · <b>${c.tried}</b> tried · <b>${c.new}</b> new<span> — ${P.length} in ${esc(label)}</span></p>
    <div class="bar" aria-hidden="true"><i class="master" style="width:${pc('master')}%"></i><i class="tried" style="width:${pc('tried')}%"></i><i class="fix" style="width:${pc('fix')}%"></i></div>
    <div class="quick">
      <button class="btn" type="button" data-q="new"${c.new?'':' disabled'}>${Math.min(10,c.new)||10} new</button>
      <button class="btn quiet" type="button" data-q="fix"${c.fix?'':' disabled'}>${Math.min(10,c.fix)||10} to fix</button>
      <button class="btn quiet" type="button" data-q="mix">10 mixed</button></div>
    <div class="map" role="group" aria-label="Every transformation in ${esc(label)}">${P.map(i=>`<button class="sq ${st.get(i)}" type="button" data-id="${esc(i.id)}" title="${esc(i.k)} · ${STATE_NAME[st.get(i)]}" aria-label="${esc(i.k)}, ${STATE_NAME[st.get(i)]}"></button>`).join('')}</div>
    <p class="map-legend"><span><i class="sq master"></i>Mastered</span><span><i class="sq tried"></i>Tried</span><span><i class="sq fix"></i>To fix</span><span><i class="sq new"></i>New</span></p>
    <p class="map-tip">Tap any square to answer that one, or let the buttons choose ten.</p></div>`;
  $('practice').querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{
    const q=b.dataset.q, all=shuffle(P);
    const pick=q==='new'?all.filter(i=>st.get(i)==='new'):q==='fix'?all.filter(i=>st.get(i)==='fix'):all.sort((x,y)=>due(y.id)-due(x.id));
    start(pick.slice(0,10)); });
  $('practice').querySelectorAll('.sq[data-id]').forEach(b=>b.onclick=()=>start([D.items.find(i=>i.id===b.dataset.id)],true));
}
function start(items,single){ S={items,i:0,res:[],marks:0,fixed:0,half:0,single:!!single}; showQ(); }
function showQ(){
  const i=S.items[S.i]; if(!i) return results();
  const dots=S.single?'':S.items.map((x,k)=>`<i class="${S.res[k]===2?'ok':S.res[k]!==undefined?'no':k===S.i?'now':''}"></i>`).join('');
  $('practice').innerHTML=`${dots?`<div class="dots" aria-label="Transformation ${S.i+1} of ${S.items.length}">${dots}</div>`:''}<div class="q">
    <p class="ask">Complete the second sentence so it means the same as the first. Use the word given and two to five words.</p>
    <p class="orig">${esc(i.s)}</p><span class="kw">${esc(i.k)}</span>
    <p class="sent">${second(i,'<span class="blank" id="blank">&nbsp;</span>')}</p>
    <div class="field" style="margin-top:.9rem"><input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Two to five words" aria-label="Your answer"><button class="btn" type="button" id="chk">Check</button></div>
    <div class="fb" id="fb" aria-live="polite"></div><div class="next-row hidden" id="nextRow"><button class="btn quiet" type="button" id="toMap">Back to the map</button><button class="btn" type="button" id="next">${S.single?'Another one':S.i+1<S.items.length?'Next':'See your result'}</button></div></div>`;
  const inp=$('ans'); $('chk').onclick=()=>answer(inp.value); inp.addEventListener('keydown',e=>{ if(e.key==='Enter') answer(inp.value); }); setTimeout(()=>inp.focus(),80);
  $('next').onclick=()=>{ if(S.single){ start(shuffle(pool()).sort((x,y)=>due(y.id)-due(x.id)).slice(0,10)); return; } S.i++; showQ(); };
  $('toMap').onclick=gate;
}
function answer(v){
  const i=S.items[S.i], fb=$('fb'); if(S.res[S.i]!==undefined) return; const t=norm(v); if(!t) return;
  const n=wc(t);
  if(n<2||n>5){ fb.innerHTML=`<b class="no">That is ${n} word${n===1?'':'s'}.</b> Use two to five, including ${esc(i.k)} — and a contraction counts as two.`; $('ans').select(); return; }
  if(!keyIn(i,t)){ fb.innerHTML=`<b class="no">Your answer must include ${esc(i.k)},</b> exactly as given.`; $('ans').select(); return; }
  const m=score(i,v); S.res[S.i]=m; S.marks+=m;
  const was=(()=>{ try{ return IntuityRing.has(i.id); }catch(e){ return false; } })();
  remember(i,m===2); if(m===2&&was){ try{ IntuityRing.has(i.id)?S.half++:S.fixed++; }catch(e){} }
  $('ans').disabled=true; $('chk').disabled=true;
  const bl=$('blank'); bl.textContent=String(v).trim(); bl.classList.toggle('miss',m<2);
  fb.innerHTML=(m===2?'<b class="ok">Two marks.</b> ':m===1?'<b class="no">One mark</b> — half of it is right. ':'<b class="no">No marks.</b> ')
    +`The answer: ${answerHTML(i.a[0])}. ${esc(i.why)}`+(i.a.length>1?`<br><span class="also">Also right: ${i.a.slice(1).map(a=>esc(halves(a).join(' '))).join(' · ')}</span>`:'');
  $('nextRow').classList.remove('hidden'); $('next').focus();
}
function results(){
  const max=S.items.length*2, waiting=(()=>{ try{ return pool().filter(i=>IntuityRing.has(i.id)).length; }catch(e){ return 0; } })();
  const bits=[]; if(S.fixed) bits.push(`<b>${S.fixed}</b> ${S.fixed===1?'mistake':'mistakes'} fixed for good`); if(S.half) bits.push(`<b>${S.half}</b> right today — ${S.half===1?'it comes':'they come'} back tomorrow to make sure`);
  $('practice').innerHTML=`<div class="q result"><p class="kick" style="justify-content:center"><i></i>Practice</p><div class="big">${S.marks} of ${max}</div>
    <p class="lead">marks, two for each transformation</p><p class="ring-line">${bits.length?bits.join(' · ')+'. ':''}${waiting?`Still to fix here: <b>${waiting}</b>.`:'Nothing left to fix in this set.'}</p>
    <div class="quick"><button class="btn quiet" type="button" id="toMap">See the map</button><button class="btn" type="button" id="again">Ten more</button></div></div>`;
  $('again').onclick=()=>start(shuffle(pool()).sort((x,y)=>due(y.id)-due(x.id)).slice(0,10)); $('toMap').onclick=gate;
}

/* ══ GAME · BUILD IT, IN ROUNDS OF SIX ══
   A game needs a goal, stakes and a reason to play again, so:
     goal    — six transformations to build, said before the round starts
     stakes  — three hearts for the whole ROUND, not per sentence: every
               mistake carries weight, and the last heart ends the round
     return  — a personal best for each tab, kept on this phone
   The six circles fill as you go: sage, built first time; caramel, built
   after a mistake; clay, missed. A streak counts first-time builds in a row.
   Corrections come at once, as on the Board; the measure is the round. */
let B=null; const ROUND=6;
const HEART='<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4.5 6.7 4.5c2.1 0 3.6 1.1 5.3 3 1.7-1.9 3.2-3 5.3-3 3.7 0 5.8 3.8 4.3 7.2C19.5 16.4 12 21 12 21z"/></svg>';
const bestKey=()=>'intuity.master4.best.'+set+(lvl==='B1'?'.warm':'');
const getBest=()=>{ try{ return +(localStorage.getItem(bestKey())||0); }catch(e){ return 0; } };
const setBest=n=>{ try{ localStorage.setItem(bestKey(),String(n)); }catch(e){} };
function buildStart(){
  if(!pool().length){ $('game').innerHTML=emptyNote(); return; }
  const best=getBest(), n=Math.min(ROUND,pool().length), played=(()=>{ try{ return localStorage.getItem(bestKey())!==null; }catch(e){ return false; } })();
  $('game').innerHTML=`<div class="lab"><div class="ring"><span>${n}</span></div>
    <p class="lead">${n} transformations to build. <b>Three hearts</b> for the whole round. ${played?`Your best here: <b>${best} of ${n}</b>.`:'Your first round sets the best to beat.'}</p>
    <button class="btn" type="button" id="bGo">Start the round</button></div>`;
  $('bGo').onclick=roundStart;
}
function roundStart(){ const q=shuffle(pool()); q.sort((a,b)=>due(b.id)-due(a.id)); B={items:q.slice(0,Math.min(ROUND,q.length)),k:0,res:[],hearts:3,streak:0,top:0,over:false}; buildDeal(); }
function buildDeal(){
  const i=B.items[B.k]; if(!i) return roundEnd();
  const words=halves(i.a[0]).join(' ').split(' ');
  const others=[...new Set(D.items.filter(x=>x!==i).flatMap(x=>halves(x.a[0]).join(' ').split(' ')))].filter(w=>!words.map(norm).includes(norm(w)));
  Object.assign(B,{i,need:words.length,tiles:shuffle(words.concat(shuffle(others).slice(0,2))).map((w,k)=>({w,k})),picked:[],miss:0,state:''});
  buildDraw();
}
function circles(){ return B.items.map((x,k)=>`<i class="${B.res[k]||(k===B.k&&!B.over?'now':'')}"></i>`).join(''); }
function buildDraw(msg){
  const i=B.i, done=B.state==='done', shown=B.state==='shown', last=B.k+1>=B.items.length||B.over;
  $('game').innerHTML=`<div class="round-head"><div class="dots" aria-label="Transformation ${B.k+1} of ${B.items.length}">${circles()}</div>
      <span class="streak${B.streak>=2?' on':''}">${B.streak>=2?B.streak+' in a row':''}</span>
      <span class="hearts">${[0,1,2].map(k=>HEART.replace('<svg',`<svg class="${k<B.hearts?'':'gone'}"`)).join('')}</span></div>
    <div class="lab"><p class="orig" style="text-align:center">${esc(i.s)}</p>
      <div class="ring" id="ring"><span>${esc(i.k)}</span></div>
      <p class="sent" style="text-align:center">${second(i,`<span class="built" id="built">${done||shown?answerHTML(i.a[0]):B.picked.map(t=>`<span>${esc(t.w)}</span>`).join(' ')||'&nbsp;'}</span>`)}</p>
      <div class="tiles">${B.tiles.map(t=>`<button class="tile-btn" type="button" data-k="${t.k}"${B.picked.includes(t)||done||shown?' disabled':''}>${esc(t.w)}</button>`).join('')}</div>
      <p class="lab-msg" aria-live="polite">${msg||(done?(B.miss?'Built, after a mistake.':'Built first time.'):shown?(B.over?'Out of hearts — here it is.':'Here it is.'):`${B.picked.length} of ${B.need} words`)}</p>
      ${done||shown?`<p class="gloss" style="text-align:center">${esc(i.why)}</p>`:''}
      <div class="lab-foot"><button class="btn quiet" type="button" id="bUndo"${B.picked.length&&!done&&!shown?'':' disabled'}>Undo</button>
        ${done||shown?`<button class="btn" type="button" id="bNext">${last?'See your round':'Next'}</button>`:`<button class="btn quiet" type="button" id="bShow">Show me</button>`}</div></div>`;
  $('game').querySelectorAll('.tile-btn').forEach(b=>b.onclick=()=>buildTap(B.tiles[+b.dataset.k]));
  $('bUndo').onclick=()=>{ B.picked.pop(); buildDraw(); };
  if($('bNext')) $('bNext').onclick=()=>{ if(last) return roundEnd(); B.k++; buildDeal(); };
  if($('bShow')) $('bShow').onclick=()=>{ if(!B.miss) remember(i,false); B.res[B.k]='no'; B.state='shown'; B.streak=0; buildDraw(); };
}
function buildTap(t){
  B.picked.push(t);
  if(B.picked.length<B.need){ buildDraw(); return; }
  const built=B.picked.map(x=>x.w).join(' ');
  if(score(B.i,built)===2){
    B.state='done'; B.res[B.k]=B.miss?'late':'ok';
    if(!B.miss){ remember(B.i,true); B.streak++; B.top=Math.max(B.top,B.streak); } else B.streak=0;
    buildDraw(); $('ring').classList.add('snap');
  } else {
    if(!B.miss) remember(B.i,false);
    B.miss++; B.hearts--; B.streak=0;
    if(B.hearts<=0){ B.over=true; B.res[B.k]='no'; B.state='shown'; buildDraw(); }
    else if(B.miss>=2){ B.res[B.k]='no'; B.state='shown'; buildDraw(`"${built}" is not it either.`); }
    else { B.picked=[]; buildDraw(`"${built}" is not it — one more try.`); }
    $('ring').classList.add('shake');
  }
}
function roundEnd(){
  /* a celebration has to mean something: on the very first round any score is a "best", so it
     isn't called one — it becomes the best to beat. A new best is only one that beats an earlier one. */
  const n=B.items.length, first=B.res.filter(r=>r==='ok').length, best=getBest(), firstRound=(()=>{ try{ return localStorage.getItem(bestKey())===null; }catch(e){ return false; } })();
  const isBest=!firstRound&&first>best;
  if(firstRound||first>best) setBest(first);
  const missed=B.items.filter((x,k)=>B.res[k]!=='ok'&&B.res[k]!==undefined), unreached=B.items.filter((x,k)=>B.res[k]===undefined);
  const head=first===n?'A perfect round.':isBest?'A new best.':firstRound?'Your first round.':B.over?'Out of hearts.':'Round complete.';
  $('game').innerHTML=`<div class="lab result"><div class="dots">${B.items.map((x,k)=>`<i class="${B.res[k]||''}"></i>`).join('')}</div>
    <p class="kick" style="justify-content:center"><i></i>${esc(head)}</p>
    <div class="big">${first} of ${n}</div><p class="lead">built first time${B.top>=2?` · best streak ${B.top}`:''}${firstRound?` · your best to beat is now ${first}`:!isBest&&best?` · your best is ${best}`:''}</p>
    ${isBest&&first>0?'<p class="newbest">New best for this tab</p>':''}
    ${missed.length?`<ul class="missed">${missed.map(i=>`<li>${second(i,answerHTML(i.a[0]))}</li>`).join('')}</ul>`:''}
    ${unreached.length?`<p class="map-tip">${unreached.length} not reached — they'll be in the next round.</p>`:''}
    ${missed.length?'<p class="ring-line">Every one you missed is in the Ring, so it comes back first.</p>':''}
    <div class="quick"><button class="btn" type="button" id="bAgain">Play another round</button></div></div>`;
  if(first===n||isBest){ const r=document.querySelector('#game .dots'); if(r) r.classList.add('snap'); }
  $('bAgain').onclick=roundStart;
}

/* the header's real height, kept up to date as tabs wrap or the phone turns */
(function(){ const h=document.querySelector('header.header'); const set=()=>document.documentElement.style.setProperty('--wf-head',h.getBoundingClientRect().height+'px');
  set(); if(window.ResizeObserver) new ResizeObserver(set).observe(h); window.addEventListener('resize',set); })();

/* ══ BOOT ══ */
fetch('/data/use-of-english/word-transformation/master-part4.json',{cache:'no-cache'}).then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); }).then(d=>{
  D=d; if(!SETS.some(s=>s[0]===set)) set='mix'; if(!['explore','practice','game'].includes(mode)) mode='explore'; go();
}).catch(()=>{ $('explore').innerHTML='<p class="lead">The transformations didn’t load. Check your connection and reload.</p>'; });
})();
