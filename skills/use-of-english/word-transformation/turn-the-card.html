<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F3F1EC">
<title>Be2FIRST — Turn the Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..900&family=Geist+Mono:wght@400..600&family=Space+Grotesk:wght@700&family=Anton&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=20261018">
<style>
/* ═══ TURN THE CARD · the printed deck, back in the app ═══
   The class plays the paper cue cards in pairs (13 packs × 12 key word
   transformations, data/cue-cards/kwt-cards.json). This page closes the loop:

     SCORE A PACK  after the paper game: tap the cards you got wrong. Each one
                   joins your review deck (review.html) with its sentence and
                   answer, and leaves after two right answers there.
     PLAY A PACK   no partner, or absent: the same 12 cards on screen, typed
                   and checked against the Cambridge rules.

   The card codes (KWT-P04-07) match the printed cards exactly. Nothing leaves
   the student's device, like the rest of the app. */
:root{--paper:#F3F1EC;--card:#FAF8F5;--ink:#14110E;--quiet:#5C5852;--faint:#8A8378;--rule:rgba(20,17,14,.12);
  --caramel:#A9774A;--sage:#527065;--clay:#B4653A}
html,body{background:var(--paper)}
body{margin:0;color:var(--ink);font-family:'Geist',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{max-width:40rem;margin:0 auto;padding:calc(var(--tc-head,96px) + 14px) 16px 56px}
.kick{font:500 11px/1 'Geist Mono',ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--caramel);display:flex;align-items:center;gap:8px}
.kick i{width:14px;height:3px;background:var(--caramel)}
h1{font-family:'Anton',Impact,sans-serif;font-weight:400;text-transform:uppercase;font-size:2.6rem;line-height:.95;margin:12px 0 8px;letter-spacing:.01em}
.lede{color:var(--quiet);line-height:1.55;margin:0 0 22px;font-size:.98rem}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:22px}
.mode{min-height:48px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;font:600 14px/1.1 'Geist',sans-serif;color:var(--ink);cursor:pointer;padding:0 12px}
.mode[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.packs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.pack{position:relative;aspect-ratio:1/1;border-radius:14px;border:1px solid var(--rule);background:var(--card);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-family:'Anton',Impact,sans-serif;font-size:2rem;color:var(--ink);
  box-shadow:0 1px 3px rgba(20,17,14,.06)}
.pack::before{content:'';position:absolute;left:0;right:0;top:0;height:5px;border-radius:14px 14px 0 0;background:var(--c)}
.pack small{font:500 10px/1 'Geist Mono',monospace;letter-spacing:.08em;color:var(--faint);text-transform:uppercase}
.pack small.got{color:var(--sage);font-weight:600}
.pack:active{transform:scale(.97)}
.back{display:inline-block;margin-bottom:14px;font:500 11px/1 'Geist Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--quiet);background:none;border:0;cursor:pointer;padding:6px 0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{min-height:76px;border-radius:12px;border:1.5px solid var(--rule);background:var(--card);cursor:pointer;text-align:left;padding:10px 12px;
  display:flex;flex-direction:column;justify-content:space-between;color:var(--ink);font-family:'Geist',sans-serif}
.tile .n{font:500 11px/1 'Geist Mono',monospace;letter-spacing:.1em;color:var(--faint)}
.tile .kw{font-family:'Anton',Impact,sans-serif;font-size:1.15rem;letter-spacing:.04em;word-break:break-word}
.tile[aria-pressed="true"]{border-color:var(--clay);background:#F6E7DD}
.tile[aria-pressed="true"] .n{color:var(--clay)}
.tile[aria-pressed="true"] .n::after{content:' · again'}
.hint{color:var(--quiet);font-size:.92rem;margin:0 0 14px;line-height:1.5}
.bar{position:sticky;bottom:12px;margin-top:20px;display:flex;gap:10px}
.btn{flex:1;min-height:52px;border-radius:999px;font:600 15px/1 'Geist',system-ui,sans-serif;cursor:pointer;border:1.5px solid var(--ink);background:var(--card);color:var(--ink)}
.btn.dark{background:var(--ink);color:var(--card)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.4;cursor:default}
.card{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:20px 20px 18px;box-shadow:0 1px 3px rgba(20,17,14,.06);position:relative;overflow:hidden}
.card::before{content:'';position:absolute;left:0;right:0;top:0;height:5px;background:var(--c)}
.meta{display:flex;justify-content:space-between;font:500 11px/1 'Geist Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.s1{font-family:'Newsreader',Georgia,serif;font-size:1.25rem;line-height:1.5;margin:16px 0 4px}
.key{font-family:'Anton',Impact,sans-serif;font-size:1.9rem;letter-spacing:.08em;margin:6px 0 4px}
.s2{font-family:'Newsreader',Georgia,serif;font-size:1.25rem;line-height:1.6;margin:4px 0 0}
.gap{display:inline-block;min-width:5rem;border-bottom:2px solid var(--ink);margin:0 .2rem;font-family:'Geist',sans-serif;font-weight:600;font-size:1.02rem;color:var(--sage);text-align:center}
.ans{width:100%;box-sizing:border-box;margin-top:16px;min-height:52px;border-radius:12px;border:1.5px solid var(--rule);padding:0 14px;font:500 17px 'Geist',sans-serif;background:#fff;color:var(--ink)}
.ans:focus{outline:none;border-color:var(--ink)}
.count{font:500 11px/1 'Geist Mono',monospace;letter-spacing:.1em;color:var(--faint);margin-top:8px;text-transform:uppercase}
.fb{margin-top:14px;padding-top:12px;border-top:1px solid var(--rule);line-height:1.5;font-size:.98rem}
.fb .ok{color:var(--sage);font-weight:700}.fb .no{color:var(--clay);font-weight:700}
.fb .why{display:block;color:var(--quiet);margin-top:4px;font-size:.92rem}
.dots{display:flex;gap:6px;margin:0 0 14px}
.dots i{flex:1;height:4px;border-radius:2px;background:rgba(20,17,14,.12)}
.dots i.done{background:var(--sage)}.dots i.miss{background:var(--clay)}.dots i.here{background:var(--ink)}
.end{text-align:center;padding:26px 8px}
.end h2{font-family:'Anton',Impact,sans-serif;font-weight:400;font-size:3rem;margin:0 0 8px}
.end p{color:var(--quiet);line-height:1.55;margin:0 0 18px}
.end a,.end button{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 24px;border-radius:999px;margin:4px;text-decoration:none;font:600 15px 'Geist',sans-serif;cursor:pointer}
.end a{background:var(--ink);color:var(--card);border:0}.end button{background:transparent;border:1.5px solid var(--ink);color:var(--ink)}
.again{font:500 12px/1.6 'Geist Mono',monospace;color:var(--clay);letter-spacing:.06em;margin:-8px 0 16px}
.err{color:var(--clay);text-align:center;padding:30px 0}
@media(max-width:420px){.grid{grid-template-columns:repeat(2,1fr)}h1{font-size:2.2rem}}
</style>
<script src="/tools/be2-brand.js?v=20261012c"></script>
</head>
<body>
<header class="header">
  <div class="header-top">
    <a class="back-link" href="/index.html" target="_top">← Home</a>
    <div class="header-title">
      <div class="app-title">INTUITY</div>
      <div class="app-subtitle">Turn the Card</div>
    </div>
    <span class="header-spacer">Part <b>4</b></span>
  </div>
</header>

<main class="wrap" id="stage"><p class="err">Loading the cards…</p></main>

<script src="/tools/be2-progress.js?v=20261012"></script>
<script>
(function () {
  var TOPIC = 'turn-the-card';
  var HREF = '/skills/use-of-english/word-transformation/turn-the-card.html';
  var COLOURS = ['#6a4374','#b8620a','#3563a0','#4f8a4c','#2f6f73','#a8443a','#B0865C','#5b5f97','#8a6d1f','#2d7d9a','#9b4f7b','#55734a','#7a5230'];
  var SAVED = 'be2.ttc.v1';                        /* last score per pack, this device only */
  var stage = document.getElementById('stage');
  var CARDS = [], mode = 'score';

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function read() { try { return JSON.parse(localStorage.getItem(SAVED) || '{}'); } catch (e) { return {}; } }
  function write(v) { try { localStorage.setItem(SAVED, JSON.stringify(v)); } catch (e) {} }
  function pad(n) { return String(n).padStart(2, '0'); }
  function pack(p) { return CARDS.filter(function (c) { return c.pack === p; }); }

  /* The Cambridge count: a contraction is two words (hadn't = had not), a possessive is one (John's). */
  var PRON = {it:1,he:1,she:1,that:1,there:1,what:1,who:1,here:1,where:1,let:1,how:1,'this':1};
  function words(a) {
    return a.toLowerCase().replace(/’/g, "'").split(/\s+/).filter(Boolean).reduce(function (n, w) {
      if (/(n't|'re|'ve|'ll|'d|'m)$/.test(w)) return n + 2;
      if (/'s$/.test(w)) return n + (PRON[w.slice(0, -2)] ? 2 : 1);
      return n + 1;
    }, 0);
  }
  function norm(s) { return String(s).toLowerCase().replace(/[’‘]/g, "'").replace(/[.,!?;:]+$/g, '').replace(/\s+/g, ' ').trim(); }

  /* For the review deck: one line that carries the whole task. */
  function promptOf(c) { return c.sentence + '  ·  ' + c.key + '  ·  ' + c.stem; }
  function report(c, ok, given) {
    if (!window.Be2) return;
    Be2.answer(TOPIC, { id: c.code, correct: ok, prompt: promptOf(c), answer: c.answers[0], given: given || '',
      rule: '2–5 words, including ' + c.key + ', which must not change. Contractions count as two words.', href: HREF + '#p' + c.pack });
  }

  /* ── 1 · THE PACKS ── */
  function home() {
    var saved = read();
    stage.innerHTML =
      '<div class="kick"><i></i>Use of English · Part 4 · cue cards</div>' +
      '<h1>Turn the Card</h1>' +
      '<p class="lede">The 13 packs you play in class, in pairs. After a game, <b>score your pack</b>: tap the cards you got wrong and they come back in your review. No partner today? <b>Play a pack</b> here instead.</p>' +
      '<div class="modes"><button class="mode" data-m="score" aria-pressed="' + (mode === 'score') + '">Score a pack</button>' +
      '<button class="mode" data-m="play" aria-pressed="' + (mode === 'play') + '">Play a pack</button></div>' +
      '<div class="packs">' + COLOURS.map(function (col, k) {
        var s = saved[k + 1];
        return '<button class="pack" style="--c:' + col + '" data-p="' + (k + 1) + '">' + pad(k + 1) +
          '<small class="' + (s && s.right === 12 ? 'got' : '') + '">' + (s ? s.right + ' / 12' : '12 cards') + '</small></button>';
      }).join('') + '</div>';
    stage.querySelectorAll('.mode').forEach(function (b) { b.onclick = function () { mode = b.dataset.m; home(); }; });
    stage.querySelectorAll('.pack').forEach(function (b) { b.onclick = function () { open(+b.dataset.p); }; });
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
  }
  function open(p) {
    try { history.replaceState(null, '', '#p' + p); } catch (e) {}
    (mode === 'play' ? play : score)(p);
  }

  /* ── 2a · SCORE A PACK (after the paper game) ── */
  function score(p) {
    var cs = pack(p), miss = {};
    function paint() {
      var n = Object.keys(miss).length;
      stage.innerHTML =
        '<button class="back" id="bk">← All packs</button>' +
        '<div class="kick" style="--caramel:' + COLOURS[p - 1] + '"><i></i>Pack ' + pad(p) + ' · score it</div>' +
        '<h1>Which did you miss?</h1>' +
        '<p class="hint">Look at your notebook. Tap every card you got wrong — your “Again” numbers. Tap again to undo.</p>' +
        '<div class="grid">' + cs.map(function (c) {
          return '<button class="tile" data-c="' + c.code + '" aria-pressed="' + !!miss[c.code] + '"><span class="n">' + pad(c.card) + '</span><span class="kw">' + esc(c.key) + '</span></button>';
        }).join('') + '</div>' +
        '<div class="bar"><button class="btn dark" id="save">Save · ' + (12 - n) + ' / 12 right</button></div>';
      document.getElementById('bk').onclick = home;
      stage.querySelectorAll('.tile').forEach(function (b) { b.onclick = function () { var k = b.dataset.c; if (miss[k]) delete miss[k]; else miss[k] = 1; paint(); }; });
      document.getElementById('save').onclick = function () {
        cs.forEach(function (c) { report(c, !miss[c.code]); });
        finish(p, 12 - n, cs.filter(function (c) { return miss[c.code]; }));
      };
    }
    paint();
  }

  /* ── 2b · PLAY A PACK (on screen, alone) ── */
  function play(p) {
    var cs = pack(p).slice(), i = 0, res = [], tries = 0;
    function dots() { return '<div class="dots">' + cs.map(function (_, k) { return '<i class="' + (res[k] === true ? 'done' : res[k] === false ? 'miss' : k === i ? 'here' : '') + '"></i>'; }).join('') + '</div>'; }
    function show() {
      if (i >= cs.length) return finish(p, res.filter(Boolean).length, cs.filter(function (_, k) { return !res[k]; }));
      var c = cs[i]; tries = 0;
      stage.innerHTML =
        '<button class="back" id="bk">← All packs</button>' + dots() +
        '<div class="card" style="--c:' + COLOURS[p - 1] + '"><div class="meta"><span>Pack ' + pad(p) + ' · card ' + pad(c.card) + '</span><span>2–5 words</span></div>' +
        '<p class="s1">' + esc(c.sentence) + '</p><div class="key">' + esc(c.key) + '</div>' +
        '<p class="s2">' + esc(c.stem).replace('___', '<span class="gap" id="gap">&nbsp;</span>') + '</p>' +
        '<input class="ans" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type the missing words">' +
        '<div class="count" id="cnt">0 words</div><div id="fb"></div></div>' +
        '<div class="bar"><button class="btn" id="turn">Turn the card</button><button class="btn dark" id="chk">Check</button></div>';
      document.getElementById('bk').onclick = home;
      var a = document.getElementById('ans');
      a.oninput = function () { var w = words(a.value); document.getElementById('cnt').textContent = w + ' word' + (w === 1 ? '' : 's') + (w > 5 ? ' · too many' : ''); };
      a.onkeydown = function (e) { if (e.key === 'Enter') check(); };
      document.getElementById('chk').onclick = check;
      document.getElementById('turn').onclick = function () { reveal(false, a.value || ''); };
      setTimeout(function () { a.focus(); }, 50);
    }
    function why(c, given) {
      var g = norm(given), kw = c.key.toLowerCase(), out = [];
      if (!new RegExp('(^|[^a-z])' + kw + '([^a-z]|$)').test(g)) out.push('use <b>' + esc(c.key) + '</b> exactly as given');
      var w = words(given); if (w > 5) out.push('keep to 2–5 words — yours has ' + w);
      return out.length ? '<span class="why">The rules: ' + out.join(', and ') + '.</span>' : '';
    }
    function check() {
      var c = cs[i], given = document.getElementById('ans').value;
      if (!given.trim()) return;
      var ok = c.answers.some(function (x) { return norm(x) === norm(given); });
      if (ok) return reveal(true, given);
      tries++;
      if (tries < 2) {
        document.getElementById('fb').innerHTML = '<div class="fb"><span class="no">Not quite — one more try.</span>' + why(c, given) + '</div>';
        return;
      }
      reveal(false, given);
    }
    function reveal(ok, given) {
      var c = cs[i], first = ok && tries === 0;
      res[i] = first;                                  /* the score counts first tries only */
      report(c, first, given);                         /* a second-try answer still comes back in review */
      document.getElementById('gap').textContent = c.answers[0];
      document.getElementById('ans').disabled = true;
      document.getElementById('fb').innerHTML = '<div class="fb">' + (first ? '<span class="ok">Right!</span> ' : ok ? '<span class="ok">Right on the second try</span> — it comes back in your review. ' : '<span class="no">The answer:</span> ') +
        '<b>' + esc(c.answers[0]) + '</b>' + (c.answers.length > 1 ? ' <span class="why">Also right: ' + c.answers.slice(1).map(esc).join(' · ') + '</span>' : '') +
        (!ok && given ? why(c, given) : '') + '</div>';
      var bar = stage.querySelector('.bar');
      bar.innerHTML = '<button class="btn dark" id="nx">' + (i + 1 < cs.length ? 'Next card' : 'See my score') + '</button>';
      document.getElementById('nx').onclick = function () { i++; show(); };
      document.getElementById('nx').focus();
    }
    show();
  }

  /* ── 3 · THE SCORE ── */
  function finish(p, right, missed) {
    var saved = read(); saved[p] = { right: right, when: Date.now() }; write(saved);
    var left = window.Be2 ? Be2.review().length : 0;
    stage.innerHTML = '<div class="end"><div class="kick" style="justify-content:center"><i></i>Pack ' + pad(p) + '</div>' +
      '<h2>' + right + ' / 12</h2>' +
      (missed.length ? '<p class="again">Again: ' + missed.map(function (c) { return pad(c.card); }).join(' · ') + '</p>' +
        '<p>' + (missed.length === 1 ? 'That card is' : 'Those ' + missed.length + ' cards are') + ' now in your review. Get each one right twice and it leaves.</p>'
        : '<p>Every card. Swap packs with another pair.</p>') +
      (left ? '<a href="/review.html">Review now · ' + left + '</a>' : '') +
      '<button id="more">Another pack</button></div>';
    document.getElementById('more').onclick = home;
  }

  function fit() { var h = document.querySelector('.header'); if (h) document.documentElement.style.setProperty('--tc-head', h.offsetHeight + 'px'); }
  fit(); window.addEventListener('resize', fit); setTimeout(fit, 300);

  fetch('/data/cue-cards/kwt-cards.json').then(function (r) { return r.json(); }).then(function (d) {
    CARDS = d.cards;
    var m = /^#p(\d+)$/.exec(location.hash);
    if (m && +m[1] >= 1 && +m[1] <= 13) { mode = 'play'; open(+m[1]); } else home();
  }).catch(function () { stage.innerHTML = '<p class="err">The cards could not be loaded. Check your connection and try again.</p>'; });
})();
</script>
</body>
</html>
