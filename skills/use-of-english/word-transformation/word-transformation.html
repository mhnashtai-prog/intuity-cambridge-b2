  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INTUITY - Word Transformation Quiz</title>
  <meta name="theme-color" content="#F3F1ED">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500&family=Anton&display=swap" rel="stylesheet">

       the one stylesheet Parts 1-4 now share. This page's own <style>

<body>
  <header class="header">
    <div class="header-top">
      <a class="back-link" href="/index.html?openModal=english" target="_top">&larr; Use of English</a>
      <div class="header-title">

        <div class="app-subtitle">Key Word Transformation · Part 4</div>
      </div>
      <span class="header-spacer">Level <b>B2</b></span>
    </div>
    <div class="uoe-sets"><div class="dataset-selector">
        <button class="dataset-btn" onclick="toggleDatasetMenu()" aria-label="Select quiz type">Select Set ▾</button>
        <div class="dataset-dropdown" id="datasetDropdown" role="menu">
          <button class="dataset-option active" data-set="set1" role="menuitem">Set 1</button>
          <button class="dataset-option" data-set="set2" role="menuitem">Set 2</button>
        </div>
      </div></div>
  </header>
  </div>

  <div class="container">
    

    <div class="test-nav">
      <div class="dots-container" id="dotsContainer" role="navigation" aria-label="Test selection"></div>
    </div>

    <div class="test-info" id="testInfo" role="status" aria-live="polite">Loading...</div>

    <div class="content-container" id="classicContainer" role="main">
      <div class="content-header-wrapper">
        <div class="section-dots" id="sectionDotsClassic"></div>
        <div class="mode-toggle-container">
          <span class="mode-toggle-label">Text</span>
          <div class="mode-toggle-switch" id="modeToggleSwitch" onclick="toggleMode()" role="switch" aria-checked="false" aria-label="Toggle between full text and sentence mode"></div>
          <span class="mode-toggle-label">Chunks</span>
        </div>
      </div>
      <div style="text-align: center; padding: 3rem; color: var(--poster-faint);">
        <div class="loading-spinner" style="width: 2rem; height: 2rem; margin: 0 auto 1rem;"></div>
        <div style="font-size: 1rem; margin-bottom: 0.5rem; font-weight: 500;">Loading Quiz...</div>
        <div style="font-size: 0.75rem; opacity: 0.7;">Preparing Test 1</div>
      </div>
    </div>

    <div class="content-container hidden" id="guidedContainer" role="main">
      <div class="content-header-wrapper">
        <div class="section-dots" id="sectionDotsGuided"></div>
        <div class="mode-toggle-container">
          <span class="mode-toggle-label">Text</span>
          <div class="mode-toggle-switch active" id="modeToggleSwitchGuided" onclick="toggleMode()" role="switch" aria-checked="true" aria-label="Toggle between full text and sentence mode"></div>
          <span class="mode-toggle-label">Chunks</span>
        </div>
      </div>
    </div>

    <div class="footer" id="footer" role="toolbar">
      <button onclick="showAnswers()" id="showKeyBtn" aria-label="Show answer key" disabled>Key</button>
      <button onclick="repeatTest()" aria-label="Clear and restart">Clear</button>
      <button class="primary" onclick="submitAndScore()" id="submitBtn" aria-label="Submit for scoring">Submit</button>
    </div>
  </div>

  <button class="help-link" onclick="toggleHelp()" aria-label="Open help guide">Help</button>

  <div class="modal-overlay" id="scoreModal" role="dialog" aria-labelledby="scoreModalTitle" aria-modal="true">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="scoreModalTitle">Results</h2>
        <div class="modal-subtitle" id="modalSubtitle"></div>
      </div>
      <div class="score-display">
        <div class="score-number" id="scoreNumber" aria-label="Score">0/0</div>
      </div>
      <div class="answers-section">
        <div id="answersDisplay"></div>
      </div>
      <div class="modal-footer">
        <button class="modal-btn modal-btn-secondary" onclick="closeModal()">Close</button>
        <button class="modal-btn modal-btn-primary" onclick="nextTest()">Next</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="helpModal" role="dialog" aria-labelledby="helpModalTitle" aria-modal="true">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="helpModalTitle">Guide</h2>
        <div class="modal-subtitle">Tips & Shortcuts</div>
      </div>
      <div class="help-content">
        <div class="help-item">
          <div class="help-item-title">Views</div>
          <div class="help-item-desc">Full text by default. Use the toggle to break sentences into manageable chunks.</div>
        </div>
        <div class="help-item">
          <div class="help-item-title">Submit Shows Results</div>
          <div class="help-item-desc">Submit displays your score and highlights correct answers in green, incorrect ones in orange.</div>
        </div>
        <div class="help-item">
          <div class="help-item-title">Key Button (After Submit)</div>
          <div class="help-item-desc">After submitting, click Key to reveal all correct answers in green.</div>
        </div>
        <div class="help-item">
          <div class="help-item-title">Score Colors</div>
          <div class="help-item-desc">100% = Lime + Star ⭐<br>75-99% = Light green<br>60-74% = Light blue<br>Below 60% = Orange/Red</div>
        </div>
        <div class="help-item">
          <div class="help-item-title">Keyboard Shortcuts</div>
          <div class="keyboard-shortcuts">
            <span class="keyboard-key">Tab</span> <span style="color: var(--poster-faint);">Next field</span>
            <span class="keyboard-key">⌘+Enter</span> <span style="color: var(--poster-faint);">Submit</span>
            <span class="keyboard-key">Esc</span> <span style="color: var(--poster-faint);">Close</span>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="modal-btn modal-btn-primary" onclick="closeHelp()" style="width: 100%;">Got it</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="alert" aria-live="polite"></div>

  <script>
    let allTests = [];
    let currentDataset = 'set1';
    let currentTest = 0;
    let currentSection = 0;
    let userAnswers = {};
    let showingResults = false;
    let testScores = {};
    let currentMode = 'classic';
    let answersVisible = false;
    
    const DATASETS = {
      'set1': '../../../data/use-of-english/word-transformation/word-transformation-6sentences.json',
      'set2': '../../../data/use-of-english/word-transformation/word-transformation-6sentences1.json'
    };

    function sanitizeText(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function normalizeAnswer(answer) {
      return answer.toLowerCase().trim().replace(/\s+/g, ' ').replace(/['']/g, "'");
    }

    // ISSUE 3 FIX: Improved answer matching with flexible word order and verb forms
    function answersMatch(userAnswer, correctAnswers) {
      const normalized = normalizeAnswer(userAnswer);
      
      return correctAnswers.some(correct => {
        const correctNorm = normalizeAnswer(correct);
        
        // Exact match
        if (normalized === correctNorm) return true;
        
        // Check variations
        const variations = [
          [normalized.replace(/ise/g, 'ize'), correctNorm],
          [normalized.replace(/our/g, 'or'), correctNorm],
          [normalized.replace(/re$/g, 'er'), correctNorm]
        ];
        
        if (variations.some(([a, b]) => a === b || b === a)) return true;
        
        // Split into words for flexible matching
        const userWords = normalized.split(' ').filter(w => w.length > 0);
        const correctWords = correctNorm.split(' ').filter(w => w.length > 0);
        
        // If word counts are very different, likely not a match
        if (Math.abs(userWords.length - correctWords.length) > 2) return false;
        
        // Check if all important words from correct answer appear in user answer
        const importantCorrectWords = correctWords.filter(w => 
          !['a', 'an', 'the', 'to', 'of', 'in', 'for', 'on', 'at', 'by', 'with'].includes(w)
        );
        
        const hasAllImportantWords = importantCorrectWords.every(word => {
          // Check exact word or common verb variations
          return userWords.some(userWord => {
            if (userWord === word) return true;
            // Check verb forms (e.g., "fancied" vs "would fancy")
            if (word.endsWith('ed') && userWord.includes(word.slice(0, -2))) return true;
            if (userWord.endsWith('ed') && word.includes(userWord.slice(0, -2))) return true;
            if (word.endsWith('ing') && userWord.includes(word.slice(0, -3))) return true;
            if (userWord.endsWith('ing') && word.includes(userWord.slice(0, -3))) return true;
            return false;
          });
        });
        
        // Check structural similarity for auxiliary verbs
        const hasAuxiliary = (words) => words.some(w => ['would', 'could', 'should', 'might', 'may', 'will', 'can'].includes(w));
        const bothHaveOrLackAuxiliary = hasAuxiliary(userWords) === hasAuxiliary(correctWords);
        
        return hasAllImportantWords && bothHaveOrLackAuxiliary;
      });
    }

    function showToast(message, duration = 2500) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), duration);
    }

    async function init() {
      try {
        loadProgress();
        setupDatasetListeners();
        await loadQuizData();
        setupKeyboardShortcuts();
        if (!localStorage.getItem('intuity_help_shown_wordtransform')) {
          setTimeout(() => {
            document.getElementById('helpModal').classList.add('active');
            localStorage.setItem('intuity_help_shown_wordtransform', 'true');
          }, 1000);
        }
      } catch (error) {
        console.error('Initialization error:', error);
        showError('Failed to initialize quiz');
      }
    }

    function setupDatasetListeners() {
      document.querySelectorAll('.dataset-option').forEach(btn => {
        btn.addEventListener('click', async function() {
          document.querySelectorAll('.dataset-option').forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          const newDataset = this.dataset.set;
          if (newDataset !== currentDataset) {
            currentDataset = newDataset;
            toggleDatasetMenu();
            currentTest = 0;
            currentSection = 0;
            userAnswers = {};
            testScores = {};
            loadProgress();
            await loadQuizData();
          }
        });
      });
    }
    
    function toggleDatasetMenu() {
      const dropdown = document.getElementById('datasetDropdown');
      dropdown.classList.toggle('active');
    }
    
    function setupKeyboardShortcuts() {
      document.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
          const footer = document.getElementById('footer');
          if (footer.classList.contains('visible') && !showingResults) {
            e.preventDefault();
            submitAndScore();
          }
        }
        if (e.key === 'Escape') {
          closeModal();
          closeHelp();
          const dropdown = document.getElementById('datasetDropdown');
          if (dropdown.classList.contains('active')) toggleDatasetMenu();
        }
      });
    }

    async function loadQuizData() {
      try {
        showLoadingState();
        const dataPath = DATASETS[currentDataset];
        const response = await fetch(dataPath);
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        const data = await response.json();
        
        if (!data || !data.exercises || !Array.isArray(data.exercises)) {
          throw new Error('Invalid data format');
        }
        
        allTests = data.exercises;
        
        // Only filter Set 2 which has incomplete data
        if (currentDataset === 'set2') {
          allTests = allTests
            .map(exercise => ({
              sentences: exercise.sentences.filter(s => 
                s.answers && 
                s.answers.length > 0 && 
                !s.answers.includes('ANSWER_NEEDED') &&
                s.answers[0] !== ''
              )
            }))
            .filter(test => test.sentences.length > 0);
        }
        
        if (allTests.length === 0) {
          throw new Error('No valid exercises found');
        }
        
        console.log(`Loaded ${allTests.length} tests from ${currentDataset}`);
        createDots();
        loadTest(0);
      } catch (error) {
        console.error('Error loading quiz data:', error);
        showError(`Could not load quiz data: ${error.message}`);
      }
    }

    function showLoadingState() {
      const container = document.getElementById('classicContainer');
      container.innerHTML = `
        <div class="content-header-wrapper">
          <div class="section-dots" id="sectionDotsClassic"></div>
          <div class="mode-toggle-container">
            <span class="mode-toggle-label">Text</span>
            <div class="mode-toggle-switch" onclick="toggleMode()" role="switch" aria-checked="false"></div>
            <span class="mode-toggle-label">Chunks</span>
          </div>
        </div>
        <div style="text-align: center; padding: 3rem; color: var(--poster-faint);">
          <div class="loading-spinner" style="width: 2rem; height: 2rem; margin: 0 auto 1rem;"></div>
          <div style="font-size: 1rem; margin-bottom: 0.5rem; font-weight: 500;">Loading Quiz...</div>
        </div>
      `;
    }

    function showError(message) {
      const container = document.getElementById('classicContainer');
      container.innerHTML = `
        <div class="error-state">
          <div style="font-size: 3rem; margin-bottom: 1rem;">⚠</div>
          <div style="font-size: 1.125rem; color: var(--poster-ink); margin-bottom: 0.5rem;">Something went wrong</div>
          <div style="font-size: 0.875rem; color: var(--poster-faint); margin-bottom: 1rem;">${sanitizeText(message)}</div>
          <button onclick="location.reload()" class="nav-btn nav-btn-primary">Reload</button>
        </div>
      `;
    }

    function loadProgress() {
      try {
        const saved = localStorage.getItem(`wordtransform_progress_${currentDataset}`);
        if (saved) testScores = JSON.parse(saved);
        else testScores = {};
      } catch (e) {
        console.error('Error loading progress:', e);
        testScores = {};
      }
    }

    function saveProgress() {
      try {
        localStorage.setItem(`wordtransform_progress_${currentDataset}`, JSON.stringify(testScores));
      } catch (e) {
        console.error('Error saving progress:', e);
      }
    }

    function toggleMode() {
      const switchClassic = document.getElementById('modeToggleSwitch');
      const switchGuided = document.getElementById('modeToggleSwitchGuided');
      
      if (currentMode === 'classic') {
        currentMode = 'guided';
        if (switchClassic) switchClassic.classList.add('active');
        if (switchGuided) switchGuided.classList.add('active');
        document.getElementById('classicContainer').classList.add('hidden');
        document.getElementById('guidedContainer').classList.remove('hidden');
        renderGuidedMode();
        showToast('Switched to Chunks mode');
      } else {
        currentMode = 'classic';
        if (switchClassic) switchClassic.classList.remove('active');
        if (switchGuided) switchGuided.classList.remove('active');
        document.getElementById('guidedContainer').classList.add('hidden');
        document.getElementById('classicContainer').classList.remove('hidden');
        renderClassicMode();
        showToast('Switched to Text mode');
      }
    }

    function createDots() {
      const container = document.getElementById('dotsContainer');
      container.innerHTML = '';
      for (let i = 0; i < 16; i++) {
        const dot = document.createElement('button');
        dot.className = 'test-dot';
        dot.setAttribute('aria-label', `Test ${i + 1}`);
        if (i === currentTest) {
          dot.classList.add('current');
          dot.setAttribute('aria-current', 'true');
        }
        const score = testScores[`test${i}`];
        if (score) {
          const percentage = score.bestPercentage || score.percentage;
          if (percentage === 100) {
            dot.classList.add('perfect');
            dot.innerHTML = '<span class="star-badge">⭐</span>';
          } else if (percentage >= 75) dot.classList.add('excellent');
          else if (percentage >= 60) dot.classList.add('good');
          else if (percentage >= 50) dot.classList.add('fair');
          else dot.classList.add('poor');
        }
        if (i < allTests.length) {
          dot.onclick = () => goToTest(i);
        } else {
          dot.style.opacity = '0.2';
          dot.style.cursor = 'not-allowed';
        }
        container.appendChild(dot);
      }
    }

    function loadTest(testIdx) {
      if (!allTests[testIdx]) return;
      currentTest = testIdx;
      currentSection = 0;
      showingResults = false;
      answersVisible = false;
      userAnswers = {};
      if (currentMode === 'guided') renderGuidedMode();
      else renderClassicMode();
      updateTestInfo();
      updateFooter();
      updateKeyButton();
    }

    // ISSUE 1 & 2 FIX: Auto-expanding input + keyword at beginning
    function renderClassicMode() {
      const test = allTests[currentTest];
      if (!test) return;
      const container = document.getElementById('classicContainer');
      
      const headerWrapper = document.createElement('div');
      headerWrapper.className = 'content-header-wrapper';
      headerWrapper.innerHTML = `
        <div class="section-dots" id="sectionDotsClassic"></div>
        <div class="mode-toggle-container">
          <span class="mode-toggle-label">Text</span>
          <div class="mode-toggle-switch" id="modeToggleSwitch" onclick="toggleMode()" role="switch" aria-checked="false"></div>
          <span class="mode-toggle-label">Chunks</span>
        </div>
      `;
      
      const contentDiv = document.createElement('div');
      test.sentences.forEach((sentence, idx) => {
        const item = document.createElement('div');
        item.className = 'sentence-item';
        
        const numberDiv = document.createElement('div');
        numberDiv.className = 'sentence-number';
        numberDiv.textContent = `Question ${sentence.number}`;
        
        const originalText = sentence.original_sentence || sentence.first_sentence || '';
        
        if (originalText) {
          const originalDiv = document.createElement('div');
          originalDiv.style.cssText = 'color: var(--poster-ink); font-size: 0.9375rem; margin-bottom: 1.25rem; line-height: 1.7; font-weight: 400;';
          originalDiv.textContent = originalText;
          item.appendChild(numberDiv);
          item.appendChild(originalDiv);
        } else {
          item.appendChild(numberDiv);
        }
        
        // Just the keyword - left-aligned
const keywordDiv = document.createElement('div');
keywordDiv.style.cssText = 'text-align: left; margin: 1rem 0 0.5rem 0;';
keywordDiv.innerHTML = `<span class="keyword">${sanitizeText(sentence.keyword).toUpperCase()}</span>`;
item.appendChild(keywordDiv);
        
        const promptDiv = document.createElement('div');
        promptDiv.className = 'sentence-prompt';
        
        const promptText = sentence.gapped_sentence || sentence.prompt || '';
        const parts = promptText.split(/\.{2,}/);
        
        if (parts.length === 2) {
          const firstPart = parts[0].trim();
          const secondPart = parts[1].trim();
          
          // ISSUE 2 FIX: Check if keyword should be at the start
          if (firstPart.length < 3) {
            // Keyword goes first
            const input = createAutoExpandingInput(idx, sentence);
            if (firstPart) promptDiv.appendChild(document.createTextNode(firstPart + ' '));
            promptDiv.appendChild(input);
            promptDiv.appendChild(document.createTextNode(' ' + secondPart));
          } else {
            // Normal case
            promptDiv.appendChild(document.createTextNode(firstPart + ' '));
            const input = createAutoExpandingInput(idx, sentence);
            promptDiv.appendChild(input);
            promptDiv.appendChild(document.createTextNode(' ' + secondPart));
          }
          
          if (showingResults && !answersVisible) {
            const isCorrect = answersMatch(userAnswers[idx] || '', sentence.answers);
            if (!isCorrect) {
              const correctDiv = document.createElement('div');
              correctDiv.className = 'correct-answer';
              correctDiv.textContent = `✓ Correct answer: ${sentence.answers[0]}`;
              promptDiv.appendChild(document.createElement('br'));
              promptDiv.appendChild(correctDiv);
            }
          }
        } else {
          promptDiv.textContent = promptText;
        }
      
        item.appendChild(promptDiv);
        contentDiv.appendChild(item);
      });
      
      container.innerHTML = '';
      container.appendChild(headerWrapper);
      container.appendChild(contentDiv);
    }

    // ISSUE 1 FIX: Helper function to create auto-expanding input
    function createAutoExpandingInput(idx, sentence) {
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'answer-input';
      input.dataset.sentence = idx;
      input.placeholder = '...';
      input.value = userAnswers[idx] || '';
      input.autocomplete = 'off';
      input.autocorrect = 'off';
      input.autocapitalize = 'off';
      input.spellcheck = false;
      input.style.minWidth = '180px';
      input.style.maxWidth = '100%';
      
      // Set initial width
      setTimeout(() => {
        if (input.value) {
          const width = calculateInputWidth(input);
          input.style.width = width + 'px';
        } else {
          input.style.width = '180px';
        }
      }, 0);
      
      if (answersVisible) {
        input.classList.add('key-shown');
        input.value = sentence.answers[0];
        input.readOnly = true;
        const width = calculateInputWidth(input);
        input.style.width = width + 'px';
      } else if (showingResults) {
        const isCorrect = answersMatch(userAnswers[idx] || '', sentence.answers);
        input.classList.add(isCorrect ? 'correct' : 'incorrect');
        input.readOnly = true;
      } else {
        input.addEventListener('input', function() {
          userAnswers[idx] = this.value.trim();
          const width = calculateInputWidth(this);
          this.style.width = width + 'px';
          updateFooter();
        });
      }
      
      return input;
    }

    function calculateInputWidth(input) {
      const tempSpan = document.createElement('span');
      tempSpan.style.visibility = 'hidden';
      tempSpan.style.position = 'absolute';
      tempSpan.style.whiteSpace = 'pre';
      tempSpan.style.fontSize = window.getComputedStyle(input).fontSize;
      tempSpan.style.fontFamily = window.getComputedStyle(input).fontFamily;
      tempSpan.style.fontWeight = window.getComputedStyle(input).fontWeight;
      tempSpan.textContent = input.value || input.placeholder;
      document.body.appendChild(tempSpan);
      const textWidth = tempSpan.offsetWidth + 40;
      document.body.removeChild(tempSpan);
      return Math.max(180, Math.min(textWidth, 600));
    }

    function renderGuidedMode() {
      const test = allTests[currentTest];
      if (!test) return;
      const container = document.getElementById('guidedContainer');
      const totalSections = test.sentences.length;
      
      const headerWrapper = document.createElement('div');
      headerWrapper.className = 'content-header-wrapper';
      
      const dotsContainer = document.createElement('div');
      dotsContainer.className = 'section-dots';
      for (let i = 0; i < totalSections; i++) {
        const filled = userAnswers[i] !== undefined && userAnswers[i] !== '';
        const dot = document.createElement('button');
        dot.className = `section-dot ${i === currentSection ? 'current' : ''} ${filled ? 'filled' : ''}`;
        dot.textContent = i + 1;
        dot.onclick = () => jumpToSection(i);
        dotsContainer.appendChild(dot);
      }
      
      const toggleContainer = document.createElement('div');
      toggleContainer.className = 'mode-toggle-container';
      toggleContainer.innerHTML = `
        <span class="mode-toggle-label">Text</span>
        <div class="mode-toggle-switch active" id="modeToggleSwitchGuided" onclick="toggleMode()" role="switch" aria-checked="true"></div>
        <span class="mode-toggle-label">Chunks</span>
      `;
      
      headerWrapper.appendChild(dotsContainer);
      headerWrapper.appendChild(toggleContainer);
      
      const sentence = test.sentences[currentSection];
      const item = document.createElement('div');
      item.className = 'sentence-item';
      
      const numberDiv = document.createElement('div');
      numberDiv.className = 'sentence-number';
      numberDiv.textContent = `Question ${sentence.number} of ${totalSections}`;
      
      const originalText = sentence.original_sentence || sentence.first_sentence || '';
      
      if (originalText) {
        const originalDiv = document.createElement('div');
        originalDiv.style.cssText = 'color: var(--poster-ink); font-size: 0.9375rem; margin-bottom: 1.25rem; line-height: 1.7; font-weight: 400;';
        originalDiv.textContent = originalText;
        item.appendChild(numberDiv);
        item.appendChild(originalDiv);
      } else {
        item.appendChild(numberDiv);
      }
      
const keywordDiv = document.createElement('div');
keywordDiv.style.cssText = 'text-align: left; margin: 1rem 0 0.5rem 0;';
keywordDiv.innerHTML = `<span class="keyword">${sanitizeText(sentence.keyword).toUpperCase()}</span>`;
item.appendChild(keywordDiv);
      
      const promptDiv = document.createElement('div');
      promptDiv.className = 'sentence-prompt';
      
      const promptText = sentence.gapped_sentence || sentence.prompt || '';
      const parts = promptText.split(/\.{2,}/);
      
      if (parts.length === 2) {
        const firstPart = parts[0].trim();
        const secondPart = parts[1].trim();
        
        if (firstPart.length < 3) {
          const input = createAutoExpandingInput(currentSection, sentence);
          if (firstPart) promptDiv.appendChild(document.createTextNode(firstPart + ' '));
          promptDiv.appendChild(input);
          promptDiv.appendChild(document.createTextNode(' ' + secondPart));
        } else {
          promptDiv.appendChild(document.createTextNode(firstPart + ' '));
          const input = createAutoExpandingInput(currentSection, sentence);
          promptDiv.appendChild(input);
          promptDiv.appendChild(document.createTextNode(' ' + secondPart));
        }
        
        if (showingResults && !answersVisible) {
          const isCorrect = answersMatch(userAnswers[currentSection] || '', sentence.answers);
          if (!isCorrect) {
            const correctDiv = document.createElement('div');
            correctDiv.className = 'correct-answer';
            correctDiv.textContent = `✓ Correct answer: ${sentence.answers[0]}`;
            promptDiv.appendChild(document.createElement('br'));
            promptDiv.appendChild(correctDiv);
          }
        }
      } else {
        promptDiv.textContent = promptText;
      }
      
      item.appendChild(promptDiv);
      
      const navButtons = document.createElement('div');
      navButtons.className = 'nav-buttons';
      navButtons.innerHTML = `
        <button class="nav-btn nav-btn-secondary" ${currentSection === 0 ? 'disabled' : ''} onclick="previousSection()">← Previous</button>
        <button class="nav-btn nav-btn-primary" ${currentSection >= totalSections - 1 ? 'disabled' : ''} onclick="nextSection()">Next →</button>
      `;
      
      container.innerHTML = '';
      container.appendChild(headerWrapper);
      container.appendChild(item);
      container.appendChild(navButtons);
      
      setTimeout(() => {
        const input = container.querySelector('.answer-input');
        if (input && !showingResults && !answersVisible) input.focus();
      }, 100);
    }

    function previousSection() {
      if (currentSection > 0) {
        currentSection--;
        renderGuidedMode();
      }
    }

    function nextSection() {
      const test = allTests[currentTest];
      if (currentSection < test.sentences.length - 1) {
        currentSection++;
        renderGuidedMode();
      }
    }

    function jumpToSection(idx) {
      currentSection = idx;
      renderGuidedMode();
    }

    function updateTestInfo() {
      const test = allTests[currentTest];
      if (!test) return;
      const total = test.sentences.length;
      const filled = Object.keys(userAnswers).filter(k => userAnswers[k]).length;
      document.getElementById('testInfo').textContent = `Test ${currentTest + 1} of ${allTests.length} • ${filled}/${total} answered`;
    }

    function updateFooter() {
      const test = allTests[currentTest];
      if (!test) return;
      const total = test.sentences.length;
      const filled = Object.keys(userAnswers).filter(k => userAnswers[k]).length;
      const footer = document.getElementById('footer');
      if (filled === total && !showingResults) {
        footer.classList.add('visible');
      } else if (showingResults) {
        footer.classList.add('visible');
      } else {
        footer.classList.remove('visible');
      }
      updateTestInfo();
    }

    function repeatTest() {
      userAnswers = {};
      showingResults = false;
      answersVisible = false;
      currentSection = 0;
      if (currentMode === 'guided') renderGuidedMode();
      else renderClassicMode();
      updateFooter();
      updateKeyButton();
      showToast('Cleared');
    }

    function goToTest(testIdx) {
      loadTest(testIdx);
      createDots();
    }

    function showAnswers() {
      if (!showingResults) {
        showToast('Submit first to enable Key');
        return;
      }
      answersVisible = !answersVisible;
      updateKeyButton();
      if (currentMode === 'guided') renderGuidedMode();
      else renderClassicMode();
      if (answersVisible) showToast('All correct answers shown in green');
      else showToast('Key hidden');
    }

    function updateKeyButton() {
      const btn = document.getElementById('showKeyBtn');
      if (btn) {
        if (showingResults) {
          btn.disabled = false;
          if (answersVisible) {
            btn.classList.add('key-active');
            btn.setAttribute('aria-pressed', 'true');
          } else {
            btn.classList.remove('key-active');
            btn.setAttribute('aria-pressed', 'false');
          }
        } else {
          btn.disabled = true;
          btn.classList.remove('key-active');
          btn.setAttribute('aria-pressed', 'false');
        }
      }
    }

    function submitAndScore() {
      const test = allTests[currentTest];
      let correct = 0;
      const total = test.sentences.length;
      test.sentences.forEach((sentence, idx) => {
        const userAns = userAnswers[idx] || '';
        if (answersMatch(userAns, sentence.answers)) correct++;
      });
      const percentage = Math.round((correct / total) * 100);
      const existingScore = testScores[`test${currentTest}`];
      const isNewBest = !existingScore || percentage > (existingScore.bestPercentage || 0);
      testScores[`test${currentTest}`] = {
        correct,
        total,
        percentage,
        bestScore: isNewBest ? correct : (existingScore?.bestScore || correct),
        bestPercentage: isNewBest ? percentage : (existingScore?.bestPercentage || percentage),
        attempts: existingScore ? existingScore.attempts + 1 : 1,
        lastAttempt: new Date().toISOString()
      };
      saveProgress();
      showingResults = true;
      answersVisible = false;
      if (currentMode === 'guided') renderGuidedMode();
      else renderClassicMode();
      createDots();
      updateKeyButton();
      setTimeout(() => showResultsModal(test, correct, total, percentage), 200);
    }

    function showResultsModal(test, correct, total, percentage) {
      const existingScore = testScores[`test${currentTest}`];
      const isNewBest = !existingScore || percentage >= (existingScore.bestPercentage || 0);
      const attempts = existingScore ? existingScore.attempts : 1;
      let subtitle = `Test ${currentTest + 1}`;
      if (attempts > 1) subtitle += ` • Attempt ${attempts}`;
      document.getElementById('modalSubtitle').textContent = subtitle;
      document.getElementById('scoreNumber').textContent = `${correct}/${total}`;
      const answersDisplay = document.getElementById('answersDisplay');
      let html = '';
      if (isNewBest) {
        let badge = '';
        if (percentage === 100) {
          badge = '<div style="text-align: center; padding: 1.5rem; font-size: 1.375rem; color: var(--tile-ok-ink); font-weight: 600;">Perfect Score ⭐</div>';
        } else if (percentage >= 75) {
          badge = '<div style="text-align: center; padding: 1.5rem; font-size: 1.25rem; color: var(--tile-ok-ink); font-weight: 600;">Great Job</div>';
        } else if (percentage >= 60) {
          badge = '<div style="text-align: center; padding: 1.5rem; color: var(--poster-body); font-weight: 500;">Good Effort</div>';
        } else if (percentage >= 50) {
          badge = '<div style="text-align: center; padding: 1.5rem; color: var(--accent-ink); font-weight: 500;">Keep Practicing</div>';
        } else {
          badge = '<div style="text-align: center; padding: 1.5rem; color: var(--accent-ink); font-weight: 500;">Review & Try Again</div>';
        }
        html += badge;
      } else {
        html += `<div style="text-align: center; padding: 1rem; color: var(--poster-faint);">Your best: ${existingScore.bestScore}/${total} (${existingScore.bestPercentage}%)</div>`;
      }
      test.sentences.forEach((sentence, idx) => {
        const userAns = userAnswers[idx] || '';
        const isCorrect = answersMatch(userAns, sentence.answers);
        html += `
          <div class="answer-item ${isCorrect ? 'correct' : 'incorrect'}" style="animation-delay: ${idx * 50}ms">
            <div class="answer-user">
              <strong>Q${sentence.number}:</strong> ${sanitizeText(userAns) || '(empty)'}
            </div>
            ${!isCorrect ? `<div class="answer-correct">✓ ${sanitizeText(sentence.answers[0])}</div>` : '<div class="answer-correct">✓</div>'}
          </div>
        `;
      });
      answersDisplay.innerHTML = html;
      document.getElementById('scoreModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('scoreModal').classList.remove('active');
    }

    function nextTest() {
      closeModal();
      if (currentTest < allTests.length - 1) {
        goToTest(currentTest + 1);
      }
    }
    
    function toggleHelp() {
      document.getElementById('helpModal').classList.add('active');
    }
    
    function closeHelp() {
      document.getElementById('helpModal').classList.remove('active');
    }

    document.getElementById('scoreModal').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });
    
    document.getElementById('helpModal').addEventListener('click', function(e) {
      if (e.target === this) closeHelp();
    });

    document.addEventListener('click', function(e) {
      const dropdown = document.getElementById('datasetDropdown');
      const selector = document.querySelector('.dataset-selector');
      if (selector && !selector.contains(e.target)) {
        dropdown.classList.remove('active');
      }
    });

    window.addEventListener('load', init);
  </script>
<script>
function syncHeader(){
  var h=document.querySelector('.header');
  if(h) document.documentElement.style.setProperty('--header-h', h.offsetHeight+'px');
}
addEventListener('resize', syncHeader);
addEventListener('orientationchange', function(){ setTimeout(syncHeader,120); });
if(document.fonts && document.fonts.ready) document.fonts.ready.then(syncHeader);
if(window.ResizeObserver){ var hh=document.querySelector('.header'); if(hh) new ResizeObserver(syncHeader).observe(hh); }
syncHeader();
</script>
</body>
</html>
