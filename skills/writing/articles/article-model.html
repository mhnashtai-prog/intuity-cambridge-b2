<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Article Model — INTUITY</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Barlow+Condensed:wght@600;700;800;900&family=Instrument+Sans:ital,wght@0,400;0,500;0,600&display=swap" rel="stylesheet"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500&family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=7">
<link rel="stylesheet" href="/data/writing/writing.css?v=2">
<style>
:root{
  --bg:#f0efec;--ink:#111111;--white:#ffffff;
  --acc:#3d9e95;--sig:#2c7a72;--txt:rgba(0,0,0,0.82);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;position:fixed;background:var(--bg);font-family:'Barlow',sans-serif;-webkit-font-smoothing:antialiased}
.shell{position:fixed;inset:0;display:flex;flex-direction:column}
.topbar{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0.65rem 1.25rem;background:rgba(240,239,236,0.95);backdrop-filter:blur(12px);border-bottom:1.5px solid rgba(0,0,0,0.07);z-index:100}
.back-link{text-decoration:none;font-size:0.72rem;font-weight:700;color:rgba(0,0,0,0.38);letter-spacing:0.05em;text-transform:uppercase;transition:color 0.2s}
.back-link:hover{color:rgba(0,0,0,0.65)}
.brand{font-family:'Barlow Condensed',sans-serif;font-size:0.7rem;font-weight:900;letter-spacing:0.28em;text-transform:uppercase;color:rgba(0,0,0,0.18)}
.topic-label{font-size:0.68rem;font-weight:700;color:rgba(0,0,0,0.38);letter-spacing:0.04em;text-align:right;max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}

.mode-row{flex-shrink:0;display:flex;justify-content:center;padding:0.6rem 1rem 0.5rem;background:rgba(240,239,236,0.8);border-bottom:1px solid rgba(0,0,0,0.06)}
.mode-pill{display:inline-flex;background:rgba(10,10,10,0.06);border-radius:2rem;padding:0.2rem}
.mode-btn{font-family:'Barlow',sans-serif;font-size:0.6rem;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;padding:0.34rem 0.95rem;border:none;background:transparent;border-radius:1.5rem;cursor:pointer;color:rgba(0,0,0,0.4);transition:all .25s}
.mode-btn:hover{color:rgba(0,0,0,0.7)}
.mode-btn.active{background:var(--sig);color:#fff}

.stage{flex:1;min-height:0;position:relative;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;align-items:center;padding:1.1rem 1rem 1.4rem}
.stage::-webkit-scrollbar{width:3px}
.stage::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.1);border-radius:2px}
.hint{width:min(420px,92vw);font-family:'Instrument Sans',sans-serif;font-style:italic;font-size:0.7rem;color:rgba(0,0,0,0.32);margin-bottom:0.8rem;text-align:center}
.stack{width:min(1120px,96vw);position:relative}
.stack.has-cards::before{content:'';position:absolute;left:1.35rem;top:0.6rem;bottom:0.6rem;width:2px;background:var(--sig);opacity:0.22;z-index:0}
.stack.phrases-on::before{display:none}

.card{position:relative;z-index:1;display:flex;background:var(--white);border-radius:1.1rem;overflow:hidden;margin-bottom:0.55rem;box-shadow:0 2px 0 rgba(255,255,255,0.8) inset,3px 5px 0 rgba(0,0,0,0.05),0 14px 36px rgba(0,0,0,0.12),0 3px 9px rgba(0,0,0,0.06);animation:cardUp .5s cubic-bezier(.22,1,.36,1) both}
@keyframes cardUp{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
.band{width:2.7rem;flex-shrink:0;background:var(--sig);display:flex;flex-direction:column;align-items:center;padding:0.85rem 0 0.95rem;gap:0.55rem}
.band-num{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.5rem;color:#fff;line-height:1}
.band-word{writing-mode:vertical-rl;text-orientation:mixed;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:0.62rem;letter-spacing:0.26em;text-transform:uppercase;color:rgba(255,255,255,0.72)}
.content{flex:1;min-width:0;padding:0.9rem 1rem 1rem}
.flow{width:2.7rem;text-align:center;color:var(--sig);opacity:0.45;font-size:0.78rem;line-height:1;margin:-0.15rem 0 0.4rem}
.line{font-family:'Barlow',sans-serif;font-weight:500;font-size:0.98rem;line-height:1.55;color:var(--txt)}
.gap{font-weight:600;color:rgba(0,0,0,0.5);letter-spacing:0.16em;padding:0 0.06rem}
.fam-tag{display:inline-block;font-family:'Barlow Condensed',sans-serif;font-size:0.56rem;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;color:var(--sig);background:rgba(44,122,114,0.1);border-radius:0.35rem;padding:0.1rem 0.4rem;margin-bottom:0.35rem}
.rline{display:flex;align-items:center;gap:0.3rem}
.rline+.rline{margin-top:0.7rem}
.rtext{flex:1;min-width:0}
.nav{display:flex;gap:0.35rem;flex-shrink:0;opacity:1;align-items:center}
.nav button{border:none;background:none;color:var(--sig);font-size:1.15rem;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;padding:0 0.05rem;font-family:'Barlow',sans-serif}
.nav button:hover{opacity:0.55}
.nav button:active{transform:scale(.85)}
@keyframes navPulse{0%,100%{opacity:1}50%{opacity:0.3}}
.nav button.teach{animation:navPulse 0.9s ease-in-out 3}
.card-note{margin-top:0.7rem;padding-top:0.55rem;border-top:1px solid rgba(0,0,0,0.06);font-family:'Instrument Sans',sans-serif;font-size:0.66rem;line-height:1.7;color:rgba(0,0,0,0.34)}
.card-note .k{color:var(--sig);opacity:0.75;margin-right:0.05rem;font-weight:600}
.card-note span.opt{margin-right:0.6rem;white-space:nowrap}
.state{width:min(420px,92vw);text-align:center;padding:2.5rem 1rem;font-family:'Instrument Sans',sans-serif;color:rgba(0,0,0,0.4);font-style:italic;font-size:0.85rem}
.state.err{color:#b4453a}

.foot{flex-shrink:0;display:flex;justify-content:center;padding:0.5rem 1rem calc(env(safe-area-inset-bottom,0px) + 0.55rem);background:rgba(240,239,236,0.95);border-top:1px solid rgba(0,0,0,0.06)}
.nav-pill{display:flex;gap:0.12rem;background:rgba(10,10,10,0.07);border-radius:2rem;padding:0.25rem 0.28rem}
.nb{background:transparent;border:none;padding:0.35rem 0.75rem;border-radius:1.5rem;font-family:'Barlow',sans-serif;font-size:0.6rem;letter-spacing:0.03em;color:rgba(0,0,0,0.28);cursor:pointer;transition:all 0.22s;white-space:nowrap;min-height:28px;font-weight:700;text-transform:uppercase}
.nb.on{background:var(--ink);color:#fff;font-weight:800}
.nb:hover:not(.on){color:rgba(0,0,0,0.5)}

/* Phrases view — one card per move (Opening / Development / Closing),
   grouped by sub-function, tap a line to reveal it "in full" */
.pcard{display:flex;align-items:stretch;background:#faf8f5;border-radius:1rem;overflow:hidden;box-shadow:0 4px 15px rgba(0,0,0,.13);margin-bottom:0.6rem;transition:transform .25s,box-shadow .25s}
.pcard:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,0,0,.18)}
.prail{width:52px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:rgba(255,255,255,.95)}
.pcard[data-sec="opening"] .prail{background:linear-gradient(135deg,#e74c3c,#c0392b)}
.pcard[data-sec="development"] .prail{background:linear-gradient(135deg,#3d9e95,#2c7a72)}
.pcard[data-sec="closing"] .prail{background:linear-gradient(135deg,#2ecc71,#27ae60)}
.pbody{flex:1;padding:1rem 1.15rem;min-width:0}
.ptitle{font-family:'Barlow Condensed',sans-serif;font-size:.8rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#1a1a1a;margin-bottom:.6rem}
.psub-label{font-family:'Barlow Condensed',sans-serif;font-size:0.62rem;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;color:#9a7d3f;margin:0.7rem 0 0.3rem}
.psub-label:first-of-type{margin-top:0}
.pitem{position:relative;cursor:pointer;font-size:.9rem;line-height:1.5;color:#2c2c2a;padding:.42rem 0;border-bottom:1px solid rgba(201,169,97,.18)}
.pitem:last-child{border-bottom:none}
.pbloom{display:none;margin-top:.55rem;background:#fff;border-radius:.7rem;box-shadow:0 6px 22px rgba(0,0,0,.14);border-left:4px solid var(--sig);padding:.75rem .9rem;animation:bloomIn .22s ease}
.pitem.open .pbloom{display:block}
@keyframes bloomIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.pbloom-tag{font-family:'Barlow Condensed',sans-serif;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:#9a7d3f;font-weight:700;margin-bottom:.4rem}
.pbloom-line{font-size:.95rem;line-height:1.6;color:#2c2c2a}
.pbloom-alts{margin-top:.5rem;padding-top:.5rem;border-top:1px solid rgba(0,0,0,.06)}
.pbloom-alt{font-size:.85rem;line-height:1.55;color:#4a463a;padding:0.15rem 0}

@media (max-width:480px){
  .stage{padding:0.85rem 0.85rem 1.1rem}
  .hint{font-size:0.66rem;margin-bottom:0.65rem}
  .stack,.hint{width:94vw}
  .band{width:2.4rem;padding:0.7rem 0 0.8rem;gap:0.45rem}
  .band-num{font-size:1.3rem}
  .band-word{font-size:0.56rem;letter-spacing:0.22em}
  .stack.has-cards::before{left:1.2rem}
  .flow{width:2.4rem;font-size:0.72rem;margin:-0.2rem 0 0.32rem}
  .content{padding:0.8rem 0.85rem 0.9rem}
  .card{margin-bottom:0.45rem}
  .line{font-size:0.9rem;line-height:1.5}
  .rline+.rline{margin-top:0.55rem}
  .nav button{font-size:1.05rem}
  .card-note{font-size:0.62rem;margin-top:0.6rem;padding-top:0.5rem}
  .card-note span.opt{margin-right:0.5rem}
}
</style>
</head>
<body data-writing="articles" data-stage="model">
<div class="shell">

  <div class="topbar">
    <a class="back-link" href="/skills/writing/writing-door.html">← Writing</a>
    <span class="brand">INTUITY</span>
    <span class="topic-label" id="topicLabel">Model</span>
  </div>

  <div class="mode-row">
    <div class="mode-pill">
      <button class="mode-btn active" id="mbCards" onclick="setView('cards')">Cards</button>
      <button class="mode-btn" id="mbPhrases" onclick="setView('phrases')">Phrases</button>
    </div>
  </div>

  <div class="stage" id="stage">
    <div class="hint">Tap the arrows on any line to juggle — every line rolls on its own.</div>
    <div class="stack" id="stack"><div class="state">Loading…</div></div>
  </div>

  <div class="foot">
    <div class="nav-pill">
      <button class="nb"    onclick="switchMode('question')">Question</button>
      <button class="nb on" onclick="switchMode('model')">Model</button>
      <button class="nb"    onclick="switchMode('sample')">Sample</button>
    </div>
  </div>
</div>

<script>
/* ══════════ ARTICLE MODEL ══════════
   article-cards-models.json holds COMPLETE lines per move (no assembly —
   the meta note is explicit: "the pools hold complete lines and the engine
   selects rather than assembles"). Development is non-sequential, so all
   three development lines roll from one mixed pool of the four families
   (describe / compare / opinion / mini-story), each line avoiding its
   siblings' current text rather than being locked to a family slot. */

const DATA_PATH = 'data/article-cards-models.json';
const EXPR_PATH = 'data/article-expressions.json';

const AudioCtx=window.AudioContext||window.webkitAudioContext;let actx=null;
function ac(){if(!actx)actx=new AudioCtx();return actx;}
function tone(f,t,d,v,delay=0){try{const c=ac(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type=t;o.frequency.value=f;const s=c.currentTime+delay;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(v,s+0.01);g.gain.exponentialRampToValueAtTime(0.0001,s+d);o.start(s);o.stop(s+d+0.05);}catch(e){}}
function sndRoll(){tone(500,'triangle',0.07,0.06);tone(660,'triangle',0.05,0.04,0.04);}

const pick = a => a[Math.floor(Math.random()*a.length)];
const pickAvoid = (pool, avoid) => {
  if(!pool||!pool.length) return {text:'...',family:''};
  const av = avoid||[];
  const free = pool.filter(x=>!av.includes(x.text));
  return pick(free.length?free:pool);
};
const fmt = s => (s||'').replace(/…/g,'<span class="gap">…</span>').replace(/\.\.\./g,'<span class="gap">...</span>');

let DATA=null, EXPR=null;
let OPEN_POOL=[], DEV_POOL=[], CLOSE_POOL=[];
let S=null, view='cards';

async function init(){
  try{
    const r = await fetch(DATA_PATH);
    if(!r.ok) throw new Error('HTTP '+r.status);
    DATA = await r.json();
  }catch(e){
    document.getElementById('stack').innerHTML =
      `<div class="state err">Couldn't load the model data.<br><span style="font-size:.72rem;opacity:.7">${DATA_PATH} — ${e.message}</span></div>`;
    return;
  }

  const sh = DATA.shared || {};
  const op = sh.opening || {};
  OPEN_POOL = [
    ...(op.question||[]).map(t=>({text:t,family:'question'})),
    ...(op.statement||[]).map(t=>({text:t,family:'statement'}))
  ];
  const dv = sh.development || {};
  DEV_POOL = [
    ...(dv.describe||[]).map(t=>({text:t,family:'Describe'})),
    ...(dv.compare||[]).map(t=>({text:t,family:'Compare'})),
    ...(dv.opinion||[]).map(t=>({text:t,family:'Opinion'})),
    ...(dv.ministory||[]).map(t=>({text:t,family:'Mini-story'}))
  ];
  const cl = sh.closing || {};
  CLOSE_POOL = [
    ...(cl.reflect||[]).map(t=>({text:t,family:'reflect'})),
    ...(cl.recommend||[]).map(t=>({text:t,family:'recommend'})),
    ...(cl.verdict||[]).map(t=>({text:t,family:'verdict'}))
  ];

  try{
    const s=sessionStorage.getItem('currentArticleQuestion');
    if(s){ const q=JSON.parse(s); const lab=q.title||q.question; if(lab) document.getElementById('topicLabel').textContent=String(lab).substring(0,30).toUpperCase(); }
  }catch(e){}

  fetchExpressions();
  seedAndRender();
}

function fetchExpressions(){
  fetch(EXPR_PATH).then(r=>r.ok?r.json():null).then(d=>{ if(d){ EXPR=d; if(view==='phrases')render(); } }).catch(()=>{});
}

function seedAndRender(){
  const open = pick(OPEN_POOL);
  const used=[];
  const dev=[0,1,2].map(()=>{ const m=pickAvoid(DEV_POOL,used); used.push(m.text); return {h:[m],i:0}; });
  const close = pick(CLOSE_POOL);
  S = { open:{h:[open],i:0}, dev, close:{h:[close],i:0} };
  render();
}

let taught=false;
function siblingAvoid(idx){
  const used=[];
  for(let j=0;j<3;j++){ if(j===idx) continue; used.push(S.dev[j].h[S.dev[j].i].text); }
  return used;
}
function roll(slot,dir,idx){
  taught=true;
  const st = slot==='dev' ? S.dev[idx] : S[slot];
  const pool = slot==='open'?OPEN_POOL : slot==='close'?CLOSE_POOL : DEV_POOL;
  if(dir>0){
    if(st.i<st.h.length-1) st.i++;
    else{
      const avoid = slot==='dev' ? siblingAvoid(idx) : [];
      st.h.push(pickAvoid(pool,avoid));
      st.i=st.h.length-1;
    }
  } else if(st.i>0){ st.i--; }
  sndRoll();
  const id = slot==='dev' ? 'ln-dev-'+idx : 'ln-'+slot;
  const el = document.getElementById(id);
  if(el) el.outerHTML = lineBlock(slot,idx);
  else render();
}
window.roll=roll;

function cur(slot,idx){ return slot==='dev' ? S.dev[idx].h[S.dev[idx].i] : S[slot].h[S[slot].i]; }
function nav(slot,idx){ const a=idx===undefined?'':idx; return `<div class="nav"><button onclick="roll('${slot}',-1,${a})">‹</button><button onclick="roll('${slot}',1,${a})">›</button></div>`; }

function lineBlock(slot,idx){
  const m = cur(slot,idx);
  const id = slot==='dev' ? 'ln-dev-'+idx : 'ln-'+slot;
  const famTag = slot==='dev' ? `<div class="fam-tag">${m.family}</div>` : '';
  return `<div class="rline" id="${id}"><div class="rtext">${famTag}<div class="line">${fmt(m.text)}</div></div>${nav(slot,idx)}</div>`;
}

function setView(v){
  view=v;
  document.getElementById('mbCards').classList.toggle('active',v==='cards');
  document.getElementById('mbPhrases').classList.toggle('active',v==='phrases');
  render();
}
window.setView=setView;

function render(){
  if(view==='phrases'){ renderPhrases(); return; }
  document.getElementById('stack').classList.remove('phrases-on');

  const devLines = [0,1,2].map(i=>lineBlock('dev',i)).join('');
  const famNote = `<div class="card-note"><span class="k">*</span>` +
    ['Describe','Compare','Opinion','Mini-story'].map(f=>`<span class="opt">${f}</span>`).join('') + `</div>`;

  document.getElementById('stack').innerHTML=`
    <div class="card"><div class="band"><span class="band-num">01</span><span class="band-word">Open</span></div>
      <div class="content">${lineBlock('open')}</div></div>
    <div class="flow">&#9662;</div>
    <div class="card"><div class="band"><span class="band-num">02</span><span class="band-word">Develop</span></div>
      <div class="content">${devLines}${famNote}</div></div>
    <div class="flow">&#9662;</div>
    <div class="card"><div class="band"><span class="band-num">03</span><span class="band-word">Close</span></div>
      <div class="content">${lineBlock('close')}</div></div>`;
  document.getElementById('stack').classList.add('has-cards');
  if(!taught){ const first=document.querySelector('.nav button'); if(first) first.classList.add('teach'); }
}

/* ══ Phrases view — article-expressions.json is already moves > function >
   sub-function, so each move becomes one card, each sub-function a labelled
   group, and tapping a line reveals it with its siblings as alternatives. ══ */
function subLabel(k){ return k.charAt(0).toUpperCase()+k.slice(1).replace(/-/g,' '); }

function renderPhrases(){
  const stack=document.getElementById('stack');
  stack.classList.add('has-cards','phrases-on');
  if(!EXPR){ stack.innerHTML='<div class="state">Loading phrases…</div>'; return; }

  const moves=EXPR.moves||{};
  const order=[['opening','Opening','📌'],['development','Development','👍'],['closing','Closing','⭐']];

  const cards = order.map(([key,label,icon])=>{
    const funcs = (moves[key]&&moves[key][key]) || {};
    const groups = Object.keys(funcs).map(sub=>{
      const entries = funcs[sub]||[];
      const items = entries.map(e=>{
        const alts = entries.filter(x=>x.t!==e.t).map(x=>x.t);
        const bloomAlts = alts.length
          ? `<div class="pbloom-alts">${alts.map(a=>`<div class="pbloom-alt">${fmt(a)}</div>`).join('')}</div>`
          : '';
        return `<div class="pitem" onclick="pbloom(this)">${fmt(e.frame||e.t)}
          <div class="pbloom"><div class="pbloom-tag">${subLabel(sub)}</div><div class="pbloom-line">${fmt(e.t)}</div>${bloomAlts}</div>
        </div>`;
      }).join('');
      return `<div class="psub-label">${subLabel(sub)}</div>${items}`;
    }).join('');
    return `<div class="pcard" data-sec="${key}"><div class="prail"><span>${icon}</span></div><div class="pbody"><div class="ptitle">${label}</div>${groups}</div></div>`;
  }).join('');

  stack.innerHTML = cards;
}
function pbloom(el){
  const wasOpen = el.classList.contains('open');
  const p = el.parentElement;
  if(p) p.querySelectorAll('.pitem.open').forEach(x=>{ if(x!==el) x.classList.remove('open'); });
  el.classList.toggle('open', !wasOpen);
}
window.pbloom=pbloom;

function switchMode(mode){
  const map={question:'article-question.html',sample:'article-sample.html'};
  if(map[mode]) window.location.href=map[mode];
}
window.switchMode=switchMode;

init();
</script>
<script src="/skills/grammar-rules/intuity-sound.js"></script>
<script src="/data/writing/writing-chrome.js?v=2"></script>
</body>
</html>
