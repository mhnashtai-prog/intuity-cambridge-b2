<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..900&family=Geist+Mono:wght@400..600&family=Space+Grotesk:wght@700&family=Anton&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&display=swap" rel="stylesheet">

<style>
:root{--bg:#f0efec;--ink:#111111;--white:#ffffff;}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;position:fixed;background:var(--bg);font-family:'Geist', sans-serif;-webkit-font-smoothing:antialiased}
.shell{position:fixed;inset:0;display:flex;flex-direction:column}

.topbar{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0.65rem 1.25rem;background:rgba(240,239,236,0.95);backdrop-filter:blur(12px);border-bottom:1.5px solid rgba(0,0,0,0.07);z-index:100}
.back-link{text-decoration:none;font-size:0.72rem;font-weight:700;color:rgba(0,0,0,0.38);letter-spacing:0.05em;text-transform:uppercase}
.brand{font-family:'Geist', sans-serif;font-size:0.7rem;font-weight:900;letter-spacing:0.28em;text-transform:uppercase;color:rgba(0,0,0,0.18)}

.filter-bar{flex-shrink:0;display:flex;align-items:center;gap:0.22rem;padding:0.4rem 1.1rem;background:rgba(240,239,236,0.85);border-bottom:1px solid rgba(0,0,0,0.06);overflow-x:auto}
.filter-bar::-webkit-scrollbar{display:none}
.ftab{background:transparent;border:none;padding:0.26rem 0.7rem;border-radius:2rem;font-family:'Geist', sans-serif;font-size:0.6875rem;font-weight:700;color:rgba(0,0,0,0.28);cursor:pointer;transition:all 0.2s;white-space:nowrap;letter-spacing:0.05em;text-transform:uppercase}
.ftab:hover{color:rgba(0,0,0,0.55);background:rgba(0,0,0,0.05)}
.ftab.active{background:var(--ink);color:#fff}

.stage{flex:1;min-height:0;position:relative;overflow-y:auto;display:flex;align-items:flex-start;justify-content:center;padding:1.5rem 0 2rem}

.foot{flex-shrink:0;display:flex;justify-content:center;padding:0.5rem 1rem calc(env(safe-area-inset-bottom,0px) + 0.55rem);background:rgba(240,239,236,0.95);border-top:1px solid rgba(0,0,0,0.06)}
.nav-pill{display:flex;gap:0.12rem;background:rgba(10,10,10,0.07);border-radius:2rem;padding:0.25rem 0.28rem}
.nb{background:transparent;border:none;padding:0.35rem 0.75rem;border-radius:1.5rem;font-family:'Geist', sans-serif;font-size:0.6875rem;letter-spacing:0.03em;color:rgba(0,0,0,0.28);cursor:pointer;transition:all 0.22s;white-space:nowrap;min-height:28px;font-weight:700;text-transform:uppercase}
.nb.on{background:var(--ink);color:#fff;font-weight:800}
.nb:hover:not(.on){color:rgba(0,0,0,0.5)}

/* ══ POSTER CARD — built on the shell's .poster (intuity-shell.css §14) ══
   Only sizing, the article body copy, and the footer nav live here.
   Everything else — paper colour, kicker block, headline font, rule —
   comes from the shell so this card matches every other page. */
.poster{width:min(730px,90vw);max-height:min(560px,82vh);display:flex;flex-direction:column;overflow:hidden;animation:cardEnter 0.4s cubic-bezier(0.2,1,0.4,1) both}
@keyframes cardEnter{from{opacity:0;transform:translateY(10px) scale(0.98)}to{opacity:1;transform:none}}

.poster-head{font-size:clamp(1.12rem,4vw,1.48rem)}

.poster-scroll{flex:1;overflow-y:auto;min-height:0}

.poster-print{font-family:var(--f-body);font-size:0.78rem;font-style:italic;color:var(--poster-faint);margin-top:0.9rem}

.poster-foot{display:flex;align-items:center;justify-content:space-between;margin-top:1.1rem;padding-top:0.9rem;border-top:1px solid var(--poster-rule)}
.poster-nav-btn{background:none;border:none;cursor:pointer;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--poster-faint);transition:background 0.15s,color 0.15s}
.poster-nav-btn:hover{background:var(--poster-fill);color:var(--poster-ink)}
.poster-nav-btn:disabled{opacity:0.25;cursor:default}
.poster-counter{font-family:var(--f-mono);font-size:0.75rem;font-weight:600;letter-spacing:0.04em;color:var(--poster-faint)}

.empty-msg{font-family:'Geist', sans-serif;font-size:0.85rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:rgba(0,0,0,0.22)}
.stage #parade{width:100%;align-self:flex-start}
.stage{padding-top:.4rem}
/* the parade's columns: the type in Anton, the question, what to cover */
.pa .kp-list{display:flex;flex-direction:column;gap:.55rem;margin-top:.6rem}
.pa .kp-item{display:flex;align-items:flex-start;gap:.55rem;font-size:clamp(14px,3.9vw,16px);font-weight:500;line-height:1.4;color:var(--pa-body)}
.pa .kp-arrow{flex-shrink:0;width:16px;height:16px;margin-top:.1rem;color:var(--caramel,#B0865C);opacity:.8}
.pa-sub{display:block;margin-top:14px;font:600 .625rem/1 var(--f-mono,'Geist Mono',monospace);letter-spacing:.18em;text-transform:uppercase;color:var(--pa-faint)}
.pa-note{display:block;margin-top:12px;font-size:13px;font-style:italic;color:var(--pa-body)}
.pa-open{display:block;margin-top:12px;padding:10px 12px;background:rgba(20,17,14,.05);font-size:14px;line-height:1.45}
.pa-open b{display:block;font:600 .625rem/1.4 var(--f-mono,'Geist Mono',monospace);letter-spacing:.16em;text-transform:uppercase;color:var(--pa-faint);margin-bottom:4px}
.pa-lock{display:flex;align-items:center;gap:8px;margin-top:10px;font:600 11px/1.3 var(--f-mono,'Geist Mono',monospace);letter-spacing:.06em;text-transform:uppercase;color:var(--pa-ink)}
.pa-lock i{font-style:normal;color:var(--pa-faint)}
/* on a phone the filters are one line that slides, not several that wrap */
@media(max-width:700px){
  .wr-filters.filter-bar{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;scrollbar-width:none;max-width:100%;
    padding:0 1rem;-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}
  .wr-filters.filter-bar::-webkit-scrollbar{display:none}
}
</style>
<link rel="stylesheet" href="/tools/parade.css?v=3">
<script src="/tools/parade.js?v=2"></script>
<script src="/tools/be2-brand.js?v=20261012c"></script>
</head>
<body data-writing="articles" data-stage="question">
<div class="shell">
  <div class="topbar">
    <a class="back-link" href="/skills/writing/writing-door.html">← Writing</a>
    <span class="brand">INTUITY</span>
    <div style="width:60px"></div>
  </div>
  <div class="filter-bar" id="filterBar"></div>
  <div class="stage" id="stage">
    <div class="loading-msg" id="loadingMsg">Loading…</div>
  </div>
  <div class="foot">
    <div class="nav-pill">
      <button class="nb on" onclick="navTo('question')">Question</button>
      <button class="nb"    onclick="navTo('model')">Model</button>
      <button class="nb"    onclick="navTo('sample')">Sample</button>
    </div>
  </div>
</div>
<script>
const QUESTIONS=[
  {id:'changes',title:'Changes!',question:'Some people love changes, others dislike them. What about you? Which changes in your life have had a big effect on you?',print:'The best articles will be printed next month.',category:'personal',type:'Personal / Reflective'},
  {id:'famous',title:'Being famous for something',question:'If you could be famous for something, what would you like to be famous for? Why?',print:'The best articles will be printed next month.',category:'opinion',type:'Hypothetical / Opinion'},
  {id:'technology',title:'Technology',question:'Which piece of technology would our lives be better without? Why?',print:'The best articles will be printed next month.',category:'opinion',type:'Opinion / Argument'},
  {id:'place',title:'A place worth visiting',question:'Is there a place in your country that you think everyone should visit? Describe it and explain why others should go.',print:'The best articles will be printed next month.',category:'descriptive',type:'Descriptive / Persuasive'},
  {id:'health',title:'Staying healthy as a student',question:'What advice would you give students who want to stay healthy while studying? Share your ideas.',print:'The best articles will be printed next month.',category:'advice',type:'Advice / Practical'},
];

const CAT_LABEL={personal:'Personal',opinion:'Opinion',descriptive:'Descriptive',advice:'Advice'};
const FILTERS=['all','personal','opinion','descriptive','advice'];

let allQs=QUESTIONS.slice(),filteredQs=QUESTIONS.slice(),current=0,activeFilter='all',touchStartX=0;

function buildFilterBar(){
  document.getElementById('filterBar').innerHTML=FILTERS.map(f=>{
    const count=f==='all'?allQs.length:allQs.filter(q=>q.category===f).length;
    if(!count&&f!=='all') return '';
    const label=f==='all'?`All (${count})`:`${CAT_LABEL[f]||f} (${count})`;
    return `<button class="ftab ${f===activeFilter?'active':''}" onclick="applyFilter('${f}')">${label}</button>`;
  }).join('');
}

function applyFilter(f){
  activeFilter=f;
  filteredQs=f==='all'?[...allQs]:allQs.filter(q=>q.category===f);
  current=0;
  buildFilterBar();
  if(filteredQs.length)showCard(0);
  else{
    const stage=document.getElementById('stage');
    const old=stage.querySelector('.poster');
    if(old)old.remove();
  }
}

/* THE PARADE: the questions as columns (tools/parade.js); the centre one
   is the chosen question. There is no plan stage for articles, so its
   pill opens the model. */
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const ARROW='<svg class="kp-arrow" width="16" height="16" viewBox="0 0 14 14" fill="none"><path d="M5 3L9 7L5 11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const pts=a=>'<span class="kp-list">'+(a||[]).map(p=>'<span class="kp-item">'+ARROW+'<span>'+p+'</span></span>').join('')+'</span>';
function showCard(idx){
  current=Math.max(0,Math.min(idx,filteredQs.length-1));
  if(!document.getElementById('parade')) document.getElementById('stage').insertAdjacentHTML('beforeend','<section id="parade" aria-label="Choose a question"></section>');
  Parade.mount(document.getElementById('parade'),{ label:'<b>Articles</b> · Choose a question', aria:'Article questions',
    items:filteredQs.map((q,i)=>({ kicker:String(i+1).padStart(2,'0')+' · Write an article · '+(q.type||CAT_LABEL[q.category]||''), title:q.title,
      html:'<span class="pa-lead">'+q.question+'</span>'+(q.print?'<span class="pa-note">'+q.print+'</span>':''),
      meta:'<b>140–190</b> words' })),
    action:'See the model', start:current, onCentre:i=>choose(i), onOpen:i=>{ choose(i); navTo('model'); } });
  choose(current);
}
function choose(i){ current=i; const q=filteredQs[i]; if(q) sessionStorage.setItem('currentArticleQuestion',JSON.stringify(q)); }

function navTo(dest){
  if(dest==='question')return;
  const map={model:'article-model.html',sample:'article-sample.html'};
  if(map[dest])window.location.href=map[dest];
}

function init(){
  document.getElementById('loadingMsg').remove();
  buildFilterBar();
  let startIdx=0;
  try{
    const last=JSON.parse(sessionStorage.getItem('currentArticleQuestion')||'{}');
    if(last.id){
      const f=filteredQs.findIndex(q=>q.id===last.id);
      if(f>=0)startIdx=f;
    }
  }catch(e){}
  if(filteredQs.length)showCard(startIdx);
}
init();
</script>
<script src="/skills/grammar-rules/intuity-sound.js"></script>
<script src="/data/writing/writing-chrome.js?v=4"></script>
</body>
</html>
