<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>INTUITY — Which task?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..900&family=Geist+Mono:wght@400..600&family=Space+Grotesk:wght@700&family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=20261105">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   WHICH TASK? · test yourself after Compare  ·  v1 (5 Nov 2026)

   Recognition before production: a student who can't tell an article from
   an essay when he reads one won't write the right one. One short extract,
   one tap, the answer at once. Then the give-away words light up and one
   line says why, so a wrong answer teaches as much as a right one.

   Twelve taps in four steps, each harder than the last:
     1 Openings (two choices) · 2 Endings (four) · 3 Exam questions (four)
     4 Body lines, Review or Report: same attitude, only the voice differs.
   Lines and reasons: data/writing/which-task.json (tools/build-which-task.py).
   A miss joins the review deck (Be2), on this device only.
   ═══════════════════════════════════════════════════════════════════════ */
:root{ --ink:#14110E; --paper:#FBF8F3; --dim:#5C5852; --line:rgba(20,17,14,.12); --car:#C2956E; --car-d:#9A5A2C;
  --ok:#4F7A63; --no:#B4532F }
body{background:var(--bg,#F3EFE8)}
.header{position:sticky;top:0;z-index:20}
.wrap{max-width:640px;margin:0 auto;padding:1.1rem var(--gutter,16px) 4rem;color:var(--ink)}
.wrap h1,.wrap p,.wrap li{color:var(--ink)}
/* the ladder: four steps, each fills as it is played */
.wt-ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:.35rem;margin:0 0 1.1rem}
.wt-rung{display:flex;flex-direction:column;gap:.35rem}
.wt-rung i{display:block;height:6px;background:rgba(20,17,14,.1);position:relative;overflow:hidden}
.wt-rung i b{position:absolute;inset:0 auto 0 0;background:var(--car);width:0;transition:width .35s ease}
.wt-rung span{font:600 .55rem/1.2 'Geist Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.wt-rung.wt-on span{color:var(--ink)}
/* the card */
.wt-card{background:var(--paper);box-shadow:0 8px 30px rgba(43,33,41,.08);padding:1.1rem 1.1rem 1.2rem}
.wt-kick{font:600 .62rem/1 'Geist Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--car-d);display:flex;justify-content:space-between;gap:.5rem}
.wt-kick em{font-style:normal;color:var(--dim)}
.wt-ask{font-family:'Anton',Impact,sans-serif;font-weight:400;font-size:1.45rem;line-height:1.05;text-transform:uppercase;margin:.55rem 0 .8rem}
.wt-ext{margin:0;padding:.2rem 0 .2rem .9rem;border-left:4px solid var(--car);font-size:1.04rem;line-height:1.6}
.wt-ext.wt-exam{font-size:.92rem;border-left-color:var(--ink);background:#F3EFE8;padding:.7rem .85rem}
.wt-ext .wt-gap{font-family:'Geist Mono',monospace;color:var(--car-d);letter-spacing:.05em}
/* the clue is invisible until the answer: then it lights up */
.wt-ext mark{background:none;color:inherit;box-shadow:none;transition:box-shadow .45s ease;padding:0 .04em}
.wt-done .wt-ext mark{box-shadow:inset 0 -.55em 0 rgba(194,149,110,.45)}
.wt-opts{display:grid;grid-template-columns:1fr 1fr;gap:.55rem;margin:1.1rem 0 0}
.wt-opt{min-height:52px;border-radius:999px;border:2px solid var(--ink);background:transparent;color:var(--ink);
  font:700 .95rem/1 var(--f-body,'Geist',sans-serif);letter-spacing:.02em;cursor:pointer}
@media(hover:hover){.wt-opt:not(:disabled):hover{background:var(--ink);color:var(--paper)}}
.wt-opt:disabled{cursor:default;opacity:.35}
.wt-opt.wt-ok{background:var(--ok);border-color:var(--ok);color:#fff;opacity:1}
.wt-opt.wt-no{background:var(--no);border-color:var(--no);color:#fff;opacity:1}
.wt-why{margin:1rem 0 0;font-size:.95rem;line-height:1.45;min-height:1.4em}
.wt-why b{font-family:'Anton',Impact,sans-serif;font-weight:400;font-size:1.1rem;letter-spacing:.02em;text-transform:uppercase;margin-right:.2em}
.wt-why .wt-yes{color:var(--ok)} .wt-why .wt-not{color:var(--no)}
.wt-go{display:flex;justify-content:flex-end;margin:.9rem 0 0}
.wt-next{min-height:48px;padding:0 1.4rem;border-radius:999px;border:0;background:var(--ink);color:var(--paper);font:700 .9rem/1 var(--f-body,'Geist',sans-serif);cursor:pointer}
.wt-next[hidden]{display:none}
/* the result */
.wt-res{text-align:center}
.wt-res .wt-big{font-family:'Anton',Impact,sans-serif;font-size:4.2rem;line-height:1;margin:.3rem 0 .2rem}
.wt-res .wt-big small{font-size:1.6rem;color:var(--dim)}
.wt-res .wt-say{color:var(--dim);margin:0 auto 1rem;max-width:30ch;line-height:1.4}
.wt-steps{list-style:none;padding:0;margin:0 0 1.2rem;text-align:left}
.wt-steps li{display:flex;justify-content:space-between;gap:.6rem;padding:.55rem 0;border-top:1px solid var(--line);font-size:.9rem}
.wt-steps li span{font:600 .62rem/1.6 'Geist Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.wt-dots{display:flex;gap:.3rem}
.wt-dots i{width:12px;height:12px;border-radius:50%;background:var(--ok)}
.wt-dots i.wt-x{background:var(--no)}
.wt-miss{text-align:left;margin:0 0 1.2rem;padding:0;list-style:none}
.wt-miss li{background:#F3EFE8;padding:.6rem .75rem;margin:0 0 .45rem;font-size:.86rem;line-height:1.45}
.wt-miss li mark{background:none;box-shadow:inset 0 -.55em 0 rgba(194,149,110,.45);color:inherit}
.wt-miss li b{display:block;font:600 .6rem/1.4 'Geist Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--car-d);margin-bottom:.2rem}
.wt-cta{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap}
.wt-cta a.wt-next{display:inline-flex;align-items:center;text-decoration:none}
.wt-cta .wt-ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
@media(prefers-reduced-motion:reduce){.wt-rung i b,.wt-ext mark{transition:none}}
</style>
<script src="/tools/be2-brand.js?v=20261112"></script>
</head>
<body>
<header class="header">
  <div class="header-top">
    <a class="back-link" href="/skills/writing/compare.html" target="_top">← Compare</a>
    <div class="header-title"><div class="app-title">INTUITY</div><div class="app-subtitle">Which task?</div></div>
    <span class="header-spacer">Level <b>B2</b></span>
  </div>
</header>
<main class="wrap">
  <div class="wt-ladder" id="ladder" aria-hidden="true"></div>
  <div id="out"><p style="text-align:center;color:var(--dim)">Loading…</p></div>
</main>
<script>
(function(){
'use strict';
const PER=3;   /* three taps a step, twelve in all */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const marked=s=>esc(s).replace(/\[\[(.+?)\]\]/g,'<mark>$1</mark>').replace(/▁▁▁/g,'<span class="wt-gap">▁▁▁</span>');
const plain=s=>String(s).replace(/\[\[|\]\]/g,'');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const $=id=>document.getElementById(id);
let D, run, at, log;

/* a step's three lines: never the same answer three times, and on the
   two-choice steps both pairs (Essay/Article, Review/Report) appear */
function draw(step){
  const pool=shuffle(D.items.filter(x=>x.step===step)), out=[];
  const by={}; pool.forEach(x=>(by[x.answer]=by[x.answer]||[]).push(x));
  const keys=shuffle(Object.keys(by));
  for(let k=0;out.length<PER&&k<20;k++){ const L=by[keys[k%keys.length]]; if(L&&L.length) out.push(L.shift()); }
  return out;
}
function start(){
  run=[]; D.steps.forEach(s=>draw(s.step).forEach(x=>run.push(x)));
  at=0; log=[]; show();
}
function ladder(){
  $('ladder').innerHTML=D.steps.map((s,k)=>{
    const done=log.filter(l=>l.x.step===s.step).length, cur=run[at]&&run[at].step===s.step;
    return '<div class="wt-rung'+(cur?' wt-on':'')+'"><i><b style="width:'+(done/PER*100)+'%"></b></i><span>'+esc(s.name)+'</span></div>';
  }).join('');
}
function show(){
  ladder();
  if(at>=run.length) return result();
  const x=run[at], S=D.steps.find(s=>s.step===x.step), n=run.filter((y,i)=>i<=at&&y.step===x.step).length;
  $('out').innerHTML='<section class="wt-card" id="card">'+
    '<div class="wt-kick"><span>Step '+x.step+' · '+esc(S.name)+'</span><em>'+n+' / '+PER+'</em></div>'+
    '<h1 class="wt-ask">'+esc(S.ask)+'</h1>'+
    '<p class="wt-ext'+(x.step===3?' wt-exam':'')+'">'+marked(x.text)+'</p>'+
    '<div class="wt-opts">'+x.options.map(o=>'<button class="wt-opt" type="button" data-o="'+esc(o)+'">'+esc(o)+'</button>').join('')+'</div>'+
    '<p class="wt-why" id="why" aria-live="polite"></p>'+
    '<div class="wt-go"><button class="wt-next" type="button" id="next" hidden>'+(at===run.length-1?'See your result':'Next')+' →</button></div></section>';
  document.querySelectorAll('.wt-opt').forEach(b=>b.onclick=()=>pick(b,x));
  $('next').onclick=()=>{ at++; show(); window.scrollTo({top:0,behavior:'smooth'}); };
}
function pick(b,x){
  const ok=b.dataset.o===x.answer;
  document.querySelectorAll('.wt-opt').forEach(o=>{ o.disabled=true; if(o.dataset.o===x.answer) o.classList.add('wt-ok'); });
  if(!ok) b.classList.add('wt-no');
  $('card').classList.add('wt-done');   /* the clue lights up */
  $('why').innerHTML='<b class="'+(ok?'wt-yes':'wt-not')+'">'+esc(x.answer)+'</b> — '+esc(x.why);
  log.push({x,ok,given:b.dataset.o}); ladder();
  try{ if(window.Be2&&Be2.answer) Be2.answer('which-task',{id:x.id,prompt:'Which task? '+plain(x.text),answer:x.answer,given:b.dataset.o,correct:ok,rule:x.why,href:'/skills/writing/compare-test.html'}); }catch(e){}
  const nx=$('next'); nx.hidden=false; nx.focus({preventScroll:true});
}
function result(){
  const right=log.filter(l=>l.ok).length, miss=log.filter(l=>!l.ok);
  const say=right===log.length?'Every one. You can tell them apart.':right>=9?'Nearly all. Look again at the ones you missed.':right>=6?'Good start. The highlighted words are the clues to learn.':'Go back to Compare, then try again: the clues will start to jump out.';
  $('out').innerHTML='<section class="wt-card wt-res">'+
    '<div class="wt-kick" style="justify-content:center"><span>Your result</span></div>'+
    '<div class="wt-big">'+right+'<small> / '+log.length+'</small></div><p class="wt-say">'+say+'</p>'+
    '<ul class="wt-steps">'+D.steps.map(s=>'<li><span>'+s.step+' · '+esc(s.name)+'</span><span class="wt-dots">'+log.filter(l=>l.x.step===s.step).map(l=>'<i class="'+(l.ok?'':'wt-x')+'"></i>').join('')+'</span></li>').join('')+'</ul>'+
    (miss.length?'<ul class="wt-miss">'+miss.map(l=>'<li><b>'+esc(l.x.answer)+' · you said '+esc(l.given)+'</b>'+marked(l.x.text).replace(/<span class="wt-gap">▁▁▁<\/span>/g,'▁▁▁')+'<br><i>'+esc(l.x.why.charAt(0).toUpperCase()+l.x.why.slice(1))+'</i></li>').join('')+'</ul>':'')+
    '<div class="wt-cta"><button class="wt-next" type="button" id="again">Try again</button><a class="wt-next wt-ghost" href="/skills/writing/compare.html">← Compare</a></div></section>';
  $('again').onclick=start;
}
fetch('/data/writing/which-task.json?v=2').then(r=>r.json()).then(d=>{ D=d; start(); })
  .catch(()=>{ $('out').innerHTML='<p style="text-align:center">This test could not load. Check your connection and try again.</p>'; });
})();
</script>
</body>
</html>
