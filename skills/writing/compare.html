<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>INTUITY — Compare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..900&family=Geist+Mono:wght@400..600&family=Space+Grotesk:wght@700&family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=20261105">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   COMPARE · two text types side by side  ·  v1 (5 Nov 2026)

   Students mix up an essay with an article, and a review with a report:
   same subject, different reader, purpose and voice. One page, two chips.
   A strip of differences first, then the same three parts of two real
   model texts from the app (same subject, so only the TYPE changes):
   Introduction, Body, Conclusion, each with one line saying what differs.

   Phone: the two paragraphs stack, the left bar says which is which
   (sage = the first type, caramel = the second). From 760px they sit
   side by side. Highlighted words are the ones that give the type away.
   ═══════════════════════════════════════════════════════════════════════ */
:root{ --a:#708A81; --b:#C2956E; --ink:#14110E; --paper:#FBF8F3; --dim:#5C5852; --line:rgba(20,17,14,.12) }
body{background:var(--bg,#F3EFE8)}
.header{position:sticky;top:0;z-index:20}
.wrap{padding-top:1.2rem !important}
.wrap{max-width:900px;margin:0 auto;padding:.9rem var(--gutter,16px) 4rem;color:var(--ink)}
/* the shared shell paints some text light; this page is ink on paper throughout */
.wrap h1,.wrap h2,.wrap .g-row > div,.wrap .txt .hd,.wrap .txt p{color:var(--ink)}
.wrap .g-row > .g-k{color:var(--dim)}
.wrap .g-row > .g-h.a{color:var(--a)} .wrap .g-row > .g-h.b{color:#9A6A3C}
.wrap .txt .hd{font-weight:700 !important;font-family:var(--f-body,'Geist',sans-serif)}
h1.cmp{font-family:'Anton',Impact,sans-serif;font-weight:400;font-size:clamp(2rem,9vw,3rem);line-height:.95;text-transform:uppercase;margin:0 0 .35rem;text-align:center}
h1.cmp .vs{color:var(--b);margin:0 .15em}
.lead{text-align:center;color:var(--dim);font-size:.9rem;margin:0 auto 1.4rem;max-width:34ch;line-height:1.4}
/* at a glance */
.glance{background:var(--paper);box-shadow:0 8px 30px rgba(43,33,41,.08);margin:0 0 2rem}
.g-row{display:grid;grid-template-columns:26% 1fr 1fr;border-top:1px solid var(--line)}
.g-row:first-child{border-top:0}
.g-row > div{padding:.6rem .55rem;font-size:.82rem;line-height:1.35}
.g-k{font:600 .6rem/1.3 'Geist Mono',monospace;letter-spacing:.06em;overflow-wrap:anywhere;text-transform:uppercase;color:var(--dim)}
.g-h{font:600 .66rem/1 'Geist Mono',monospace;letter-spacing:.12em;text-transform:uppercase}
.g-h.a{color:var(--a)} .g-h.b{color:#9A6A3C}
.g-row > .va{border-left:3px solid var(--a)} .g-row > .vb{border-left:3px solid var(--b)}
/* the three parts */
.part{margin:0 0 2.2rem}
.part h2{font-family:'Anton',Impact,sans-serif;font-weight:400;font-size:1.7rem;text-transform:uppercase;margin:0 0 .7rem;display:flex;align-items:center;gap:.6rem}
.part h2::before{content:'';width:26px;height:10px;background:var(--b);flex:none}
.pair{display:grid;grid-template-columns:1fr;gap:.6rem}
@media(min-width:760px){ .pair{grid-template-columns:1fr 1fr;gap:1rem} }
.txt{background:var(--paper);padding:.85rem 1rem .95rem;border-left:4px solid var(--a);box-shadow:0 6px 22px rgba(43,33,41,.06)}
.txt.b{border-left-color:var(--b)}
.txt .k{font:600 .64rem/1 'Geist Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--a);margin-bottom:.5rem;display:flex;justify-content:space-between;gap:.5rem}
.txt.b .k{color:#9A6A3C}
.txt .k em{font-style:normal;color:var(--dim);letter-spacing:.06em}
.txt p{margin:0;font-size:.95rem;line-height:1.55;color:var(--ink)}
.txt .hd{display:block;font-weight:700;font-size:.9rem;margin:0 0 .25rem}
.txt p + .hd{margin-top:.6rem}
mark{background:none;color:inherit;box-shadow:inset 0 -.5em 0 rgba(112,138,129,.22);padding:0 .05em}
.txt.b mark{box-shadow:inset 0 -.5em 0 rgba(194,149,110,.3)}
/* the topic arrows: under each pair, big round targets, the topic between */
.part .nav{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin:.7rem 0 0;padding:.55rem .6rem;background:var(--paper);box-shadow:0 6px 22px rgba(43,33,41,.06)}
.part .ar{width:48px;height:48px;flex:none;border-radius:50%;border:0;background:var(--ink);color:var(--paper);font-size:1.6rem;line-height:1;
  display:grid;place-items:center;cursor:pointer;padding:0 0 .12em}
.part .ar:disabled{background:rgba(20,17,14,.1);color:rgba(20,17,14,.3);cursor:default}
.part .cnt{flex:1;text-align:center;display:flex;flex-direction:column;gap:.15rem}
.part .cnt small{font:600 .58rem/1 'Geist Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#9A5A2C}
.part .cnt b{font-family:'Anton',Impact,sans-serif;font-weight:400;font-size:1.15rem;letter-spacing:.02em;text-transform:uppercase;color:var(--ink)}
.part .cnt i{font:500 .7rem/1 'Geist Mono',monospace;font-style:normal;color:var(--dim)}
.txt .src{font-size:.76rem;color:var(--dim);margin:-.25rem 0 .45rem;font-style:italic}
.txt.flip{animation:flip .28s ease-out}
@keyframes flip{from{opacity:.25;transform:translateX(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.txt.flip{animation:none}}
.diff{margin:.7rem 0 0;padding:.65rem .9rem;background:#F3EADF;font-size:.88rem;line-height:1.45;color:var(--ink)}
.diff b{font:600 .62rem/1 'Geist Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#9A5A2C;display:block;margin-bottom:.3rem}
.key{text-align:center;color:var(--dim);font-size:.78rem;margin:-1.2rem 0 1.6rem}
/* the way out: test yourself */
.test{text-align:center;margin:2.6rem 0 0;padding:1.6rem 0 0;border-top:1px solid var(--line)}
.test a{display:inline-flex;align-items:center;min-height:52px;padding:0 1.8rem;border-radius:999px;background:var(--ink);color:var(--paper) !important;
  font:700 1rem/1 var(--f-body,'Geist',sans-serif);text-decoration:none;box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--b)}
.wrap .test p{margin:.8rem 0 0;color:var(--dim);font-size:.85rem}
.wrap .test .sw-link{margin-top:1.4rem}
.wrap .test .sw-link a{display:inline-flex;min-height:44px;padding:0 1.1rem;background:none;color:#8E6238 !important;font-weight:650;text-decoration:none;align-items:center}
.wrap .test .sw-link span{display:block;margin-top:.3rem}
.key mark{box-shadow:inset 0 -.5em 0 rgba(20,17,14,.12)}
.test-top{display:inline-flex;align-items:center;min-height:32px;margin:2px 0 14px;padding:0 14px;border-radius:999px;border:1px solid #C9C1B4;
  text-decoration:none;color:#3A3530;font:600 10.5px/32px 'Geist Mono',ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;background:rgba(250,248,245,.92)}
.test-top:active{background:#EFEBE4}
</style>
<script src="/tools/be2-brand.js?v=20261112"></script>
</head>
<body>
<header class="header">
  <div class="header-top">
    <a class="back-link" href="/index.html?openModal=writing" target="_top">← Writing</a>
    <div class="header-title"><div class="app-title">INTUITY</div><div class="app-subtitle">Compare</div></div>
    <span class="header-spacer">Level <b>B2</b></span>
  </div>
  <!-- the two pairs live in the header, so they stay in reach while scrolling -->
  <div class="set-tabs" role="tablist" aria-label="Choose two text types">
    <button class="vtab chip" type="button" role="tab" data-p="essay-article">Essay ↔ Article</button>
    <button class="vtab chip" type="button" role="tab" data-p="review-report">Review ↔ Report</button>
  </div>
</header>
<main class="wrap">
  <div id="out"></div>
</main>
<script>
(function(){
/* [[words]] = the words that give the type away (highlighted) */
const PAIRS={
 'essay-article':{
  a:'Essay', b:'Article',
  lead:'Same subject, technology and how we socialise. Different reader, purpose and voice.',
  glance:[
   ['Reader','Your teacher','Readers of a magazine or website'],
   ['Purpose','Discuss the question and give your view','Interest and entertain the reader'],
   ['Register','Formal or neutral','Informal or semi-formal, lively'],
   ['Title','No title','A catchy title'],
   ['Voice','Mostly impersonal: “It is often argued”. “I” only for your opinion: “I firmly believe…”','Personal: “For me”, “I’ll never forget”'],
   ['Shape','Five paragraphs: intro, note 1, note 2, own idea, conclusion','Four or five, in the order that tells it best'],
   ['Ending','A balanced conclusion with your opinion','A final thought or a question to the reader']],
  parts:[
   {h:'Introduction',
    a:{tag:'Paragraph 1',t:'[[It is widely recognised that]] technology has transformed modern communication completely. [[It is often argued that]] digital communication has both positive and negative effects on social interaction. [[Hence, it is vital to analyse the arguments on both sides.]]'},
    b:{tag:'Paragraph 1',t:'[[Which piece of technology would our lives be better without?]] It’s a provocative question in a world where we carry our phones [[like a second heartbeat]] — [[and the answer might surprise you.]]'},
    d:'The essay states the topic and promises a balanced discussion. The article opens with a question and a vivid image to hook the reader.'},
   {h:'Body',
    a:{tag:'Paragraph 2 of 5',t:'[[The main advantage of]] technology is connecting people instantly across vast distances. [[This is because]] social media platforms allow communication with anyone worldwide. [[For example,]] families can video call relatives abroad daily and share special moments. [[As a result,]] maintaining relationships across distances becomes much easier.'},
    b:{tag:'Paragraph 3 of 4',t:'[[I’ll never forget the time]] I went two weeks without Instagram while travelling. [[By day three,]] I was reading books again. [[By day seven,]] I was having conversations I’d remember. One of the key things [[I realised]] is that the technology we think we need is often the thing standing between us and the life we actually want.'},
    d:'The essay builds one argument: point, reason, example, result. The article makes its point through a personal story told in time order.'},
   {h:'Conclusion',
    a:{tag:'Paragraph 5',t:'[[On the whole,]] technology has both significant benefits and drawbacks. [[All things considered,]] it enhances communication when used responsibly alongside real-world interaction.'},
    b:{tag:'Paragraph 4',t:'It’s hard to imagine life without our smartphones, [[but perhaps that’s exactly the problem.]] [[Whether you agree or not,]] there’s no denying that some technologies leave a more complicated impression than their creators ever intended — [[and maybe it’s time we decided who is really in control.]]'},
    d:'The essay weighs both sides and gives a clear opinion. The article leaves the reader with a thought and talks to them directly.'}]},
 'review-report':{
  a:'Review', b:'Report',
  lead:'Same subject, a place to eat. Different reader, purpose and voice.',
  glance:[
   ['Reader','Readers of a magazine or website','A teacher, principal or committee'],
   ['Purpose','Describe, evaluate and recommend','Assess the facts and suggest action'],
   ['Register','Semi-formal, personal, lively','Formal and impersonal'],
   ['Title and headings','A title, no headings','A title and a heading for every section'],
   ['Voice','First person: “I visited”, “absolutely delicious”','Objective: “It is generally agreed”, “students”'],
   ['Evidence','Your own experience','Facts and other people’s feedback'],
   ['Ending','A recommendation to the reader','Recommendations for the people in charge']],
  parts:[
   {h:'Introduction',
    a:{tag:'Paragraph 1',t:'Choosing a place for a special meal can be difficult with so many restaurants available. However, when it comes to authentic Italian cuisine, Bella Napoli [[is definitely worth considering.]] [[I visited last weekend to celebrate my birthday,]] and [[I have to say it exceeded all my expectations.]]'},
    b:{tag:'Introduction',hd:'Introduction',t:'[[The main objective of this report is to]] assess the school cafeteria and suggest improvements. [[This report is based on feedback collected from students]] who regularly use the service.'},
    d:'The review sets the scene and tells you why the writer went. The report says what it is for and where its information comes from.'},
   {h:'Body',
    a:{tag:'Paragraph 2',t:'[[What makes this restaurant particularly impressive is]] its cosy, family-run atmosphere. The thing that is most likely to impress you is the genuine warmth of the staff, who make you feel like a welcomed guest. [[By far the best feature is]] the homemade pasta — [[I ordered]] the seafood linguine and it was [[absolutely delicious.]]'},
    b:{tag:'Two sections',hd:'Current Services',t:'[[It is generally agreed that]] the cafeteria offers affordable meals and friendly service. There is a daily hot meal, as well as sandwiches and snacks. [[One positive aspect of]] the cafeteria is that it saves students time during the school day.',
       hd2:'Problems',t2:'[[However, one major concern expressed by students is]] the long queues at lunchtime. [[By far the worst aspect of]] the cafeteria is the limited seating, which forces some students to eat quickly or stand. [[This is mainly due to the fact that]] several year groups have lunch at the same time.'},
    d:'The review describes with enthusiasm, using its own experience. The report sorts facts under headings, good points first, then problems and their causes.'},
   {h:'Conclusion',
    a:{tag:'Paragraph 4',t:'[[I would highly recommend]] Bella Napoli to anyone interested in genuine Italian food. [[For anyone who is looking for]] quality cooking in a welcoming atmosphere, [[this is a must.]] [[I can assure you that]] the experience will leave a lasting impression, and the prices are very reasonable for the quality offered.'},
    b:{tag:'Two sections',hd:'Recommendations',t:'[[One key recommendation would be to]] introduce staggered lunch times to reduce queues. [[In order to improve comfort, it may be worth considering]] adding more tables or using an additional room for seating.',
       hd2:'Conclusion',t2:'[[Taking everything into account, it seems clear that]] these changes would improve student satisfaction and make lunchtime more enjoyable.'},
    d:'The review tells the reader to go. The report tells the people in charge what to change, politely and with reasons.'}]}
};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const marked=s=>esc(s).replace(/\[\[(.+?)\]\]/g,'<mark>$1</mark>');
/* SAME SUBJECT, BOTH SIDES (5 Nov 2026, Michael): the arrows step through
   PAIRS ON ONE TOPIC, so only the text type ever changes. Every arrow moves
   the whole page (both cards, all three parts) to the next topic; the topic
   sits between the arrows. The hand-marked pair stays first; the others come
   from data/writing/compare-examples.json (tools/build-compare.py). */
const TYPE={Essay:'essay',Article:'article',Review:'review',Report:'report'};
const PART={Introduction:'intro',Body:'body',Conclusion:'concl'};
const TOPICS={
 'essay-article':[
  {topic:'Technology',a:'Technology & Social Interaction',b:'Technology'},
  {topic:'Social media',a:'Social Media Addiction',b:'Technology'},
  {topic:'Health',a:'Childhood Obesity',b:'Staying healthy as a student'},
  {topic:'Fame and money',a:'Money for Sports People',b:'Being famous for something'},
  {topic:'Change',a:'Life Better Today',b:'Changes!'},
  {topic:'Travel',a:'Gap Year',b:'A place worth visiting'}],
 'review-report':[
  {topic:'Food',a:'Italian restaurant meal',b:'Assessment of School Cafeteria Services'},
  {topic:'Sport',a:'Surf camp portugal',b:'Assessment of Local Sports Facilities'},
  {topic:'Learning languages',a:'Duolingo app',b:'Evaluation of Summer Language Course'},
  {topic:'Spain',a:'Lonely planet spain',b:'Evaluation of Exchange Programme in Spain'},
  {topic:'Reading',a:'Atomic habits book',b:'Assessment of School Library Services'},
  {topic:'The environment',a:'Ocean documentary',b:'Evaluation of School Environmental Initiative'},
  {topic:'Free time',a:'Stardew valley game',b:'Assessment of Local Youth Club'}]
};
const TITLE={'Surf camp portugal':'Surf camp in Portugal','Duolingo app':'The Duolingo app','Lonely planet spain':'Lonely Planet Spain',
  'Atomic habits book':'Atomic Habits (book)','Ocean documentary':'An ocean documentary','Stardew valley game':'Stardew Valley (game)','Italian restaurant meal':'An Italian restaurant'};
const nice=s=>TITLE[s]||s;
let MORE=null; const ti={};
function pairsFor(k){ return MORE ? TOPICS[k] : TOPICS[k].slice(0,1); }
function textFor(name,h,src,i,first){
  if(i===0) return first;                      /* the hand-marked pair */
  const L=MORE[TYPE[name]][PART[h]].filter(x=>x.src===src);
  return L[0] || {tag:'',t:'(No '+h.toLowerCase()+' in this text.)'};
}
function cardHTML(x,side,name,src){
  return '<div class="k"><span>'+name+'</span><em>'+esc(x.tag)+'</em></div>'+
    '<div class="src">'+esc(nice(src))+'</div>'+
    (x.hd?'<span class="hd">'+esc(x.hd)+'</span>':'')+'<p>'+marked(x.t)+'</p>'+
    (x.hd2?'<span class="hd">'+esc(x.hd2)+'</span><p>'+marked(x.t2)+'</p>':'');
}
function navHTML(i,n,topic){
  if(n<2) return '';
  return '<div class="nav"><button class="ar" type="button" data-d="-1" aria-label="Previous theme"'+(i===0?' disabled':'')+'>‹</button>'+
    '<span class="cnt"><small>Same theme</small><b>'+esc(topic)+'</b><i>'+(i+1)+' / '+n+'</i></span>'+
    '<button class="ar" type="button" data-d="1" aria-label="Next theme"'+(i===n-1?' disabled':'')+'>›</button></div>';
}
function partHTML(P,x,i,T){
  return '<section class="part" data-h="'+x.h+'"><h2>'+x.h+'</h2><div class="pair">'+
    '<div class="txt a">'+cardHTML(textFor(P.a,x.h,T.a,i,x.a),'a',P.a,T.a)+'</div>'+
    '<div class="txt b">'+cardHTML(textFor(P.b,x.h,T.b,i,x.b),'b',P.b,T.b)+'</div></div>'+
    navHTML(i,pairsFor(key).length,T.topic)+
    '<p class="diff"><b>The difference</b>'+esc(x.d)+'</p></section>';
}
function paintParts(flip){
  const P=PAIRS[key], L=pairsFor(key), i=Math.min(ti[key]||0,L.length-1), T=L[i];
  document.getElementById('lead').textContent='Same theme: '+T.topic.toLowerCase()+'. Different reader, purpose and voice.';
  document.getElementById('parts').innerHTML=P.parts.map(x=>partHTML(P,x,i,T)).join('');
  if(flip) document.querySelectorAll('#parts .txt').forEach(el=>el.classList.add('flip'));
}
document.addEventListener('click',e=>{
  const b=e.target.closest('.ar'); if(!b||b.disabled) return;
  /* keep the tapped arrow where it was on screen while everything changes */
  const sec=b.closest('.part'), h=sec&&sec.dataset.h, y=sec?sec.getBoundingClientRect().top:0;
  ti[key]=Math.max(0,Math.min(pairsFor(key).length-1,(ti[key]||0)+(+b.dataset.d)));
  paintParts(true);
  const now=h&&document.querySelector('#parts .part[data-h="'+h+'"]'); if(now) window.scrollBy(0,now.getBoundingClientRect().top-y);
});
function paint(k){
  key=k; const P=PAIRS[key];
  document.querySelectorAll('.chip').forEach(c=>{const on=c.dataset.p===key; c.classList.toggle('active',on); c.setAttribute('aria-selected',on);});
  document.title='INTUITY — '+P.a+' or '+P.b;
  document.getElementById('out').innerHTML=
    '<h1 class="cmp">'+P.a+'<span class="vs">or</span>'+P.b+'</h1><p class="lead" id="lead"></p>'+
    /* 11 Nov 2026 (the four-way report): the game was only at the foot of a long page; it now waits at the top too */
    '<a class="test-top" href="/skills/writing/compare-test.html">Test yourself · 12 quick taps →</a>'+
    '<div class="glance" role="table" aria-label="At a glance"><div class="g-row" role="row"><div></div><div class="g-h a">'+P.a+'</div><div class="g-h b">'+P.b+'</div></div>'+
    P.glance.map(r=>'<div class="g-row" role="row"><div class="g-k">'+esc(r[0])+'</div><div class="va">'+esc(r[1])+'</div><div class="vb">'+esc(r[2])+'</div></div>').join('')+'</div>'+
    '<p class="key">The <mark>highlighted words</mark> are the ones that give each type away. The arrows change the theme for the whole page.</p>'+
    '<div id="parts"></div>'+
    /* RECOGNITION BEFORE PRODUCTION (5 Nov): straight after the contrast, check it */
    '<div class="test"><a href="/skills/writing/compare-test.html">Test yourself →</a><p>Twelve quick taps: which task is it?</p>'+
      /* 9 Nov 2026: the bridge from the familiar voice to the essay voice, as a game */
      '<p class="sw-link"><a href="/skills/writing/practice.html?kind=switch">Switch it: from an email to an essay →</a><span>The same idea, said to a friend, then written for an examiner.</span></p></div>';
  paintParts(false);
}
var key=new URLSearchParams(location.search).get('pair');
if(!PAIRS[key]) key='essay-article';            /* the more common mix-up opens first */
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ paint(c.dataset.p); history.replaceState(null,'','?pair='+c.dataset.p); window.scrollTo({top:0}); });
paint(key);
fetch('/data/writing/compare-examples.json?v=3').then(r=>r.json()).then(d=>{ MORE=d; paint(key); }).catch(()=>{});
})();
</script>
</body>
</html>
