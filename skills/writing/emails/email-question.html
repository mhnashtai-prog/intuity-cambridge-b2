<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Email Questions — Be2FIRST</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..900&family=Geist+Mono:wght@400..600&family=Space+Grotesk:wght@700&family=Anton&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&display=swap" rel="stylesheet"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..900&family=Geist+Mono:wght@400..600&family=Space+Grotesk:wght@700&family=Anton&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&display=swap" rel="stylesheet">

<style>
:root{--bg:#f0efec;--ink:#111111;--white:#ffffff;}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;position:fixed;background:var(--bg);font-family:'Geist', sans-serif;-webkit-font-smoothing:antialiased}
.shell{position:fixed;inset:0;display:flex;flex-direction:column}

/* TOPBAR */
.topbar{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0.65rem 1.25rem;background:rgba(240,239,236,0.95);backdrop-filter:blur(12px);border-bottom:1.5px solid rgba(0,0,0,0.07);z-index:100}
.back-link{text-decoration:none;font-size:0.72rem;font-weight:700;color:rgba(0,0,0,0.38);letter-spacing:0.05em;text-transform:uppercase;transition:color 0.2s}
.back-link:hover{color:rgba(0,0,0,0.65)}
.brand{font-family:'Geist', sans-serif;font-size:0.7rem;font-weight:900;letter-spacing:0.28em;text-transform:uppercase;color:rgba(0,0,0,0.18)}

/* REGISTER TOGGLE — Formal / Informal. Note: the shell's §14b already
   reskins .register-bar/.reg-btn into its capsule-tab look automatically
   (its :root-prefixed rules outrank these by specificity), so this stays
   mostly as a structural fallback rather than the visual source of truth. */
.register-bar{flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:0.35rem;padding:0.35rem 1.25rem;background:rgba(240,239,236,0.9);border-bottom:1px solid rgba(0,0,0,0.07)}
.reg-btn{display:flex;align-items:center;gap:0.35rem;padding:0.32rem 1.1rem;border-radius:2rem;border:none;font-family:'Geist', sans-serif;font-size:0.6875rem;font-weight:900;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;transition:all 0.22s cubic-bezier(0.4,0,0.2,1);background:transparent;color:rgba(0,0,0,0.3)}
.reg-btn:hover{color:rgba(0,0,0,0.55);background:rgba(0,0,0,0.05)}
.reg-btn.active{background:var(--ink);color:#fff}
.reg-icon{font-size:0.85rem}
.reg-divider{width:1px;height:18px;background:rgba(0,0,0,0.1)}

/* TYPE FILTER TABS */
.filter-bar{flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:0.25rem;padding:0.45rem 1.1rem;background:rgba(240,239,236,0.8);border-bottom:1px solid rgba(0,0,0,0.06);overflow-x:auto}
.filter-bar::-webkit-scrollbar{display:none}
.ftab{background:transparent;border:none;padding:0.28rem 0.65rem;border-radius:2rem;font-family:'Geist', sans-serif;font-size:0.6875rem;font-weight:700;color:rgba(0,0,0,0.3);cursor:pointer;transition:all 0.2s;white-space:nowrap;letter-spacing:0.06em;text-transform:uppercase}
.ftab:hover{color:rgba(0,0,0,0.55);background:rgba(0,0,0,0.05)}
.ftab.active{background:var(--ink);color:#fff}

.stage{flex:1;min-height:0;position:relative;overflow-y:auto;display:flex;align-items:flex-start;justify-content:center;padding:1.5rem 0 2rem}

.foot{flex-shrink:0;display:flex;justify-content:center;padding:0.5rem 1rem calc(env(safe-area-inset-bottom,0px) + 0.55rem);background:rgba(240,239,236,0.95);border-top:1px solid rgba(0,0,0,0.06)}
.nav-pill{display:flex;gap:0.12rem;background:rgba(10,10,10,0.07);border-radius:2rem;padding:0.25rem 0.28rem}
.nb{background:transparent;border:none;padding:0.35rem 0.75rem;border-radius:1.5rem;font-family:'Geist', sans-serif;font-size:0.6875rem;letter-spacing:0.03em;color:rgba(0,0,0,0.28);cursor:pointer;transition:all 0.22s;white-space:nowrap;min-height:28px;font-weight:700;text-transform:uppercase}
.nb.on{background:var(--ink);color:#fff;font-weight:800}
.nb:hover:not(.on){color:rgba(0,0,0,0.5)}

/* ══ POSTER CARD — built on the shell's .poster (intuity-shell.css §14) ══
   Only sizing, the email-specific bits (salutation lock, key-point list),
   and the footer nav live here. Paper colour, kicker, headline font, rule,
   pills — all come from the shell. */
.poster{width:min(730px,90vw);max-height:min(560px,82vh);display:flex;flex-direction:column;overflow:hidden;animation:cardEnter 0.4s cubic-bezier(0.2,1,0.4,1) both}
@keyframes cardEnter{from{opacity:0;transform:translateY(10px) scale(0.98)}to{opacity:1;transform:none}}

.poster-head{font-size:clamp(1.12rem,4vw,1.48rem)}

.poster-scroll{flex:1;overflow-y:auto;min-height:0}

/* the salutation → sign-off lock: uses the poster's own tokens so it reads
   as part of the card, not an imported accent colour */
.poster-lock{display:flex;align-items:center;gap:0.45rem;margin:0.15rem 0 1rem;padding:0.35rem 0.6rem;border-radius:var(--r-field);background:var(--poster-fill);font-family:var(--f-mono);font-size:0.6875rem;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--poster-ink);width:fit-content}
.poster-lock .pl-arrow{opacity:0.5}

.kp-list{display:flex;flex-direction:column;gap:0.55rem;margin-top:0.2rem}
.kp-item{display:flex;align-items:flex-start;gap:0.55rem;font-family:var(--f-body);font-size:0.85rem;font-weight:500;line-height:1.4;color:var(--poster-body)}
.kp-arrow{flex-shrink:0;width:16px;height:16px;margin-top:0.1rem;color:var(--caramel);opacity:0.8}

.poster-foot{display:flex;align-items:center;justify-content:space-between;margin-top:1.1rem;padding-top:0.9rem;border-top:1px solid var(--poster-rule)}
.poster-nav-btn{background:none;border:none;cursor:pointer;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--poster-faint);transition:background 0.15s,color 0.15s}
.poster-nav-btn:hover{background:var(--poster-fill);color:var(--poster-ink)}
.poster-nav-btn:disabled{opacity:0.25;cursor:default}
.poster-counter{font-family:var(--f-mono);font-size:0.75rem;font-weight:600;letter-spacing:0.04em;color:var(--poster-faint)}

.swipe-hint{position:absolute;bottom:1.2rem;left:50%;transform:translateX(-50%);font-size:0.6875rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:rgba(0,0,0,0.18);pointer-events:none;animation:hintFade 3.5s ease 1.5s forwards;white-space:nowrap}
@keyframes hintFade{0%{opacity:1}80%{opacity:1}100%{opacity:0}}
.loading-msg{font-family:'Geist', sans-serif;font-size:0.85rem;font-weight:700;color:rgba(0,0,0,0.25);letter-spacing:0.12em;text-transform:uppercase}
.stage #parade{width:100%;align-self:flex-start}
.stage{padding-top:.4rem}
/* the parade's columns: the type in Anton, the question, what to cover */
.pa .kp-list{display:flex;flex-direction:column;gap:.55rem;margin-top:.6rem}
.pa .kp-item{display:flex;align-items:flex-start;gap:.55rem;font-size:clamp(14px,3.9vw,16px);font-weight:500;line-height:1.4;color:var(--pa-body)}
.pa .kp-arrow{flex-shrink:0;width:16px;height:16px;margin-top:.1rem;color:var(--caramel,#B0865C);opacity:.8}
.pa-sub{display:block;margin-top:14px;font:600 .625rem/1 var(--f-mono,'Geist Mono',monospace);letter-spacing:.18em;text-transform:uppercase;color:var(--pa-faint)}
.pa-note{display:block;margin-top:12px;font-size:13px;font-style:italic;color:var(--pa-body)}
.pa-open{display:block;margin-top:12px;padding:10px 12px;background:rgba(20,17,14,.05);font-size:14px;line-height:1.45}
.pa-open b{display:block;font:600 .625rem/1.4 var(--f-mono,'Geist Mono',monospace);letter-spacing:.16em;text-transform:uppercase;color:var(--pa-faint);margin-bottom:4px}
.pa-lock{display:flex;align-items:center;gap:8px;margin-top:10px;font:600 11px/1.3 var(--f-mono,'Geist Mono',monospace);letter-spacing:.06em;text-transform:uppercase;color:var(--pa-ink)}
.pa-lock i{font-style:normal;color:var(--pa-faint)}
/* on a phone the filters are one line that slides, not several that wrap */
@media(max-width:700px){
  .wr-filters.filter-bar{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;scrollbar-width:none;max-width:100%;
    padding:0 1rem;-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}
  .wr-filters.filter-bar::-webkit-scrollbar{display:none}
}
</style>

</head>
<body data-writing="emails" data-stage="question">
<div class="shell">

  <div class="topbar">
<a class="back-link" href="/skills/writing/writing-door.html">← Writing</a>
    <span class="brand">INTUITY</span>
    <div style="width:60px"></div>
  </div>

  <!-- REGISTER TOGGLE -->
  <div class="register-bar">
    <button class="reg-btn active" id="regFormal" onclick="setRegister('formal')">
      <span class="reg-icon">🎩</span> Formal
    </button>
    <div class="reg-divider"></div>
    <button class="reg-btn" id="regInformal" onclick="setRegister('informal')">
      <span class="reg-icon">😊</span> Informal
    </button>
  </div>

  <!-- TYPE FILTER TABS -->
  <div class="filter-bar" id="filterBar"></div>

  <div class="stage" id="stage">
    <div class="loading-msg" id="loadingMsg">Loading…</div>
  </div>

  <div class="foot">
    <div class="nav-pill">
      <button class="nb on"  onclick="navTo('question')">Question</button>
      <button class="nb"     onclick="navTo('plan')">Plan</button>
      <button class="nb"     onclick="navTo('model')">Model</button>
      <button class="nb"     onclick="navTo('sample')">Sample</button>
    </div>
  </div>

</div>
<script>
/* ══ CONFIG ══════════════════════════════════════════════════════════
   The question bank is indexed by TASK TYPE, read from
   data/email-task-types.json. A task type fixes the register and the
   salutation/sign-off pair, so the register toggle is a VIEW filter,
   not a second question put to the learner. */

const TASK_PATH = 'data/email-task-types.json';

/* ══ STATE ══ */
let TASKS = null, QMAP = null, PAIRING = {};
let allFormal = [], allInformal = [];
let filteredQs = [], current = 0;
let activeRegister = 'formal';
let activeFilter   = 'all';
let touchStartX    = 0;

/* a question carries its task type; everything else is looked up */
function taskFor(q){ return (q && q.taskType && TASKS && TASKS[q.taskType]) || null; }

/* ══ REGISTER TOGGLE ══ */
function setRegister(reg) {
  activeRegister = reg;
  activeFilter   = 'all';
  current        = 0;
  document.getElementById('regFormal').classList.toggle('active', reg === 'formal');
  document.getElementById('regInformal').classList.toggle('active', reg === 'informal');
  buildFilterBar();
  applyFilter('all');
}

/* ══ FILTER BAR — task types, not topic labels ══ */
function typesInRegister(){
  const all = activeRegister === 'formal' ? allFormal : allInformal;
  const seen = [];
  all.forEach(q=>{ if(q.taskType && !seen.includes(q.taskType)) seen.push(q.taskType); });
  return seen;
}

function buildFilterBar() {
  const all = activeRegister === 'formal' ? allFormal : allInformal;
  const bar = document.getElementById('filterBar');
  bar.innerHTML = [
    `<button class="ftab ${activeFilter==='all'?'active':''}" onclick="applyFilter('all')">All (${all.length})</button>`,
    ...typesInRegister().map(t => {
      const count = all.filter(q => q.taskType === t).length;
      if (!count) return '';
      const label = (TASKS[t] && TASKS[t].label) || t;
      return `<button class="ftab ${activeFilter===t?'active':''}" onclick="applyFilter('${t}')">${label} (${count})</button>`;
    })
  ].join('');
}

function applyFilter(f) {
  activeFilter = f;
  const all = activeRegister === 'formal' ? allFormal : allInformal;
  filteredQs = f === 'all' ? [...all] : all.filter(q => q.taskType === f);
  current    = 0;
  buildFilterBar();
  if (filteredQs.length) showCard(0);
}

/* ══ THE PARADE ══ the questions as columns (tools/parade.js); the centre
   one is the chosen question, and its pill opens the plan for it */
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const ARROW='<svg class="kp-arrow" width="16" height="16" viewBox="0 0 14 14" fill="none"><path d="M5 3L9 7L5 11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const pts=a=>'<span class="kp-list">'+(a||[]).map(p=>'<span class="kp-item">'+ARROW+'<span>'+p+'</span></span>').join('')+'</span>';
function showCard(idx){
  current = Math.max(0, Math.min(idx, filteredQs.length - 1));
  if(!document.getElementById('parade')) document.getElementById('stage').insertAdjacentHTML('beforeend','<section id="parade" aria-label="Choose a question"></section>');
  const formal = activeRegister === 'formal';
  Parade.mount(document.getElementById('parade'),{ label:'<b>Emails</b> · Choose a question to plan', aria:'Email questions',
    items:filteredQs.map((q,i)=>{
      const task=taskFor(q), pair=task?PAIRING[task.pairing]:null;
      /* the greeting decides the ending before a word is written — show the lock */
      const lock=pair&&formal?'<span class="pa-lock">'+pair.salutations[0]+' <i>→</i> '+pair.signoff+'</span>':'';
      return { kicker:String(i+1).padStart(2,'0')+' · Write a'+(formal?' formal':'n informal')+' email', title:task?task.label:(q.type||'Email'),
        html:'<span class="pa-lead">'+q.question+'</span>'+lock+'<span class="pa-sub">Your email should cover</span>'+pts(q.keyPoints),
        meta:'<b>140–190</b> words' }; }),
    action:'Plan it', start:current, onCentre:i=>choose(i), onOpen:i=>{ choose(i); navTo('plan'); } });
  choose(current);
}
function choose(i){
  current=i; const q=filteredQs[i]; if(!q) return;
  const task = taskFor(q);
  sessionStorage.setItem('currentEmailQuestion', JSON.stringify({
    id: q.id, taskType: q.taskType, formality: activeRegister,
    type: task ? task.label : q.type, question: q.question, keyPoints: q.keyPoints || []
  }));
}

/* ══ FOOTER NAV ══ */
function navTo(dest) {
  if (dest === 'question') return;
  const map = {
    plan:   'email-plan.html',
    model:  'emails-cards.html',
    sample: 'email-sample.html'
  };
  if (map[dest]) window.location.href = map[dest];
}

/* ══ INIT ══ */
async function init() {
  try {
    const [rt, r1, r2] = await Promise.all([
      fetch(TASK_PATH),
      fetch('data/emails-questions-formal.json'),
      fetch('data/emails-questions-informal.json')
    ]);
    if (!rt.ok) throw new Error('email-task-types.json not found');
    const td = await rt.json();
    TASKS   = td.taskTypes || {};
    QMAP    = td.questionMap || {formal:{},informal:{},retired:[]};
    (td.salutation?.pairing || []).forEach(p => { PAIRING[p.id] = p; });

    const d1 = await r1.json();
    const d2 = await r2.json();
    const retired = QMAP.retired || [];

    /* formal uses "questions"; informal uses "emails" — normalise, tag with the
       task type, and drop anything retired from the syllabus */
    allFormal = (d1.questions || [])
      .filter(q => !retired.includes(q.type))
      .map(q => ({ ...q, taskType: QMAP.formal[q.type] }))
      .filter(q => q.taskType);

    allInformal = (d2.questions || d2.emails || [])
      .map(q => ({
        id:        q.id,
        topic:     q.topic || q.type || '',
        question:  q.questionData?.question || q.question || '',
        keyPoints: q.questionData?.keyPoints || q.keyPoints || []
      }))
      .filter(q => !retired.includes(q.topic))
      .map(q => ({ ...q, taskType: QMAP.informal[q.topic] }))
      .filter(q => q.taskType);

    document.getElementById('loadingMsg').remove();

    /* restore register, then the exact question, if returning */
    let saved = {};
    try { saved = JSON.parse(sessionStorage.getItem('currentEmailQuestion') || '{}'); } catch(e) {}
    if (saved.taskType && TASKS[saved.taskType]) activeRegister = TASKS[saved.taskType].register;
    else if (saved.formality) activeRegister = saved.formality;
    document.getElementById('regFormal').classList.toggle('active',   activeRegister === 'formal');
    document.getElementById('regInformal').classList.toggle('active', activeRegister === 'informal');

    buildFilterBar();
    applyFilter('all');

    if (saved.id) {
      const idx = filteredQs.findIndex(q => q.id === saved.id && q.taskType === saved.taskType);
      if (idx >= 0) showCard(idx);
    }

  } catch(e) {
    console.error(e);
    document.getElementById('loadingMsg').textContent = '\u26a0 Could not load questions';
  }
}
init();
</script>
<script src="/skills/grammar-rules/intuity-sound.js"></script>
