<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0"/>
<title>Email Model — INTUITY</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Barlow+Condensed:wght@600;700;800;900&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#f0efec;--ink:#111111;--white:#ffffff;
  /* email blue — the wing colour. --sig is the darkened band value so white
     text on the vertical band clears WCAG AA. */
  --acc:#4a7fb5;--sig:#2f5f8e;--txt:rgba(0,0,0,0.82);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;position:fixed;background:var(--bg);font-family:'Barlow',sans-serif;-webkit-font-smoothing:antialiased}
.shell{position:fixed;inset:0;display:flex;flex-direction:column}

/* ── TOPBAR ── */
.topbar{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0.65rem 1.25rem;background:rgba(240,239,236,0.95);backdrop-filter:blur(12px);border-bottom:1.5px solid rgba(0,0,0,0.07);z-index:100}
.back-link{text-decoration:none;font-size:0.72rem;font-weight:700;color:rgba(0,0,0,0.38);letter-spacing:0.05em;text-transform:uppercase;transition:color 0.2s}
.back-link:hover{color:rgba(0,0,0,0.65)}
.brand{font-family:'Barlow Condensed',sans-serif;font-size:0.7rem;font-weight:900;letter-spacing:0.28em;text-transform:uppercase;color:rgba(0,0,0,0.18)}
.topic-label{font-size:0.68rem;font-weight:700;color:rgba(0,0,0,0.38);letter-spacing:0.04em;text-align:right;max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}

/* ── SUBJECT TABS ── */
.topic-tabs{flex-shrink:0;display:flex;align-items:center;gap:0.25rem;padding:0.45rem 1.1rem;background:rgba(240,239,236,0.8);border-bottom:1px solid rgba(0,0,0,0.06);overflow-x:auto}
.topic-tabs::-webkit-scrollbar{display:none}
.register-bar{flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:0.35rem;padding:0.4rem 1.25rem;background:rgba(240,239,236,0.9);border-bottom:1px solid rgba(0,0,0,0.06)}
.reg-btn{display:flex;align-items:center;gap:0.3rem;padding:0.28rem 0.9rem;border-radius:2rem;border:none;font-family:'Barlow Condensed',sans-serif;font-size:0.65rem;font-weight:900;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;transition:all 0.22s;background:transparent;color:rgba(0,0,0,0.3)}
.reg-btn:hover{color:rgba(0,0,0,0.55);background:rgba(0,0,0,0.05)}
.reg-btn.active{background:var(--ink);color:#fff}
.reg-divider{width:1px;height:16px;background:rgba(0,0,0,0.1)}
.ttab{background:transparent;border:none;padding:0.28rem 0.65rem;border-radius:2rem;font-family:'Barlow',sans-serif;font-size:0.58rem;font-weight:700;color:rgba(0,0,0,0.3);cursor:pointer;transition:all 0.2s;white-space:nowrap;letter-spacing:0.06em;text-transform:uppercase}
.ttab:hover{color:rgba(0,0,0,0.55);background:rgba(0,0,0,0.05)}
.ttab.active{background:var(--ink);color:#fff}

/* ── MODE TOGGLE (Cards here / Phrases → accordion model page) ── */
.mode-row{flex-shrink:0;display:flex;justify-content:center;padding:0.5rem 1rem 0.15rem;background:rgba(240,239,236,0.8)}
.mode-pill{display:inline-flex;background:rgba(10,10,10,0.06);border-radius:2rem;padding:0.2rem}
.mode-btn{font-family:'Barlow',sans-serif;font-size:0.6rem;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;padding:0.34rem 0.95rem;border:none;background:transparent;border-radius:1.5rem;cursor:pointer;color:rgba(0,0,0,0.4);transition:all .25s;text-decoration:none}
.mode-btn:hover{color:rgba(0,0,0,0.7)}
.mode-btn.active{background:var(--sig);color:#fff}

/* ── STAGE ── */
.stage{flex:1;min-height:0;position:relative;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;align-items:center;padding:1.1rem 1rem 1.4rem}
.stage::-webkit-scrollbar{width:3px}
.stage::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.1);border-radius:2px}

.hint{width:min(420px,92vw);font-family:'Instrument Sans',sans-serif;font-style:italic;font-size:0.7rem;color:rgba(0,0,0,0.32);margin-bottom:0.8rem;text-align:center}

/* ── stack + spine ── */
.stack{width:min(1120px,96vw);position:relative}
.stack.has-cards::before{content:'';position:absolute;left:1.35rem;top:0.6rem;bottom:0.6rem;width:2px;background:var(--sig);opacity:0.22;z-index:0}
.card{position:relative;z-index:1;display:flex;background:var(--white);border-radius:1.1rem;overflow:hidden;margin-bottom:0.55rem;box-shadow:0 2px 0 rgba(255,255,255,0.8) inset,3px 5px 0 rgba(0,0,0,0.05),0 14px 36px rgba(0,0,0,0.12),0 3px 9px rgba(0,0,0,0.06);animation:cardUp .5s cubic-bezier(.22,1,.36,1) both}
@keyframes cardUp{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
.band{width:2.7rem;flex-shrink:0;background:var(--sig);display:flex;flex-direction:column;align-items:center;padding:0.85rem 0 0.95rem;gap:0.55rem}
.band-num{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.5rem;color:#fff;line-height:1}
.band-word{writing-mode:vertical-rl;text-orientation:mixed;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:0.62rem;letter-spacing:0.26em;text-transform:uppercase;color:rgba(255,255,255,0.72)}
.content{flex:1;min-width:0;padding:0.9rem 1rem 1rem}
.flow{width:2.7rem;text-align:center;color:var(--sig);opacity:0.45;font-size:0.78rem;line-height:1;margin:-0.15rem 0 0.4rem}

/* ── tiles ── */
.line{font-family:'Barlow',sans-serif;font-weight:500;font-size:0.98rem;line-height:1.55;color:var(--txt)}
.lead{color:var(--txt);font-weight:600}
.soft{color:rgba(0,0,0,0.42);font-weight:400;font-size:0.9rem}
.sig{color:var(--sig);font-weight:500;font-size:0.9rem;margin-right:0.12rem}
.view{color:rgba(0,0,0,0.36);font-weight:400;font-size:0.86rem}
.gap{font-weight:600;color:rgba(0,0,0,0.5);letter-spacing:0.16em;padding:0 0.06rem}
.ast{color:var(--sig);font-weight:600;font-size:0.7em;vertical-align:0.35em;margin-left:0.05rem}
.dev{margin-top:0.02rem;line-height:1;font-family:'Instrument Sans',sans-serif;font-size:0.72rem;color:rgba(0,0,0,0.22);letter-spacing:0.16em}

/* ── the line IS the control ── */
.rline{display:flex;align-items:center;gap:0.3rem;min-height:52px;padding:0.3rem 0.5rem;margin:0 -0.5rem;border-radius:0.6rem;cursor:pointer;touch-action:pan-y;transition:background .12s linear}
.rline:hover{background:rgba(0,0,0,0.035)}
.rline:active{background:rgba(0,0,0,0.055)}
.rline:focus-visible{outline:2px solid var(--sig);outline-offset:1px}
.rline+.rline{margin-top:0.15rem}
.rtext{flex:1;min-width:0;transition:opacity .09s linear}
.nav{display:flex;flex-shrink:0;align-items:center;margin-left:0.2rem}
.nav button{border:1.5px solid var(--sig);background:var(--white);color:var(--sig);font-size:1.5rem;font-weight:600;line-height:1;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:1;transition:transform .15s,background .15s,color .15s;font-family:'Barlow',sans-serif;padding-bottom:3px}
.nav button:hover{background:var(--sig);color:var(--white)}
.nav button:active{transform:scale(.9)}
.nav button:focus-visible{outline:2px solid var(--sig);outline-offset:2px}

/* ── in-card footnote ── */
.card-note{margin-top:0.7rem;padding-top:0.55rem;border-top:1px solid rgba(0,0,0,0.06);font-family:'Instrument Sans',sans-serif;font-size:0.66rem;line-height:1.7;color:rgba(0,0,0,0.34)}
.card-note .k{color:var(--sig);opacity:0.75;margin-right:0.05rem;font-weight:600}
.card-note span.opt{margin-right:0.6rem;white-space:nowrap}
.card-note span.opt[data-greet]{cursor:pointer;display:inline-flex;align-items:center;min-height:30px;padding:0 0.08rem;border-bottom:1px solid transparent;transition:color .15s,border-color .15s}
.card-note span.opt[data-greet]:hover{color:rgba(0,0,0,0.62)}
.card-note span.opt[data-greet][data-on]{color:var(--sig);border-bottom-color:var(--sig)}

.state{width:min(420px,92vw);text-align:center;padding:2.5rem 1rem;font-family:'Instrument Sans',sans-serif;color:rgba(0,0,0,0.4);font-style:italic;font-size:0.85rem}
.state.err{color:#b4453a}

/* ── FOOTER NAV ── */
.foot{flex-shrink:0;display:flex;justify-content:center;padding:0.5rem 1rem calc(env(safe-area-inset-bottom,0px) + 0.55rem);background:rgba(240,239,236,0.95);border-top:1px solid rgba(0,0,0,0.06)}
.nav-pill{display:flex;gap:0.12rem;background:rgba(10,10,10,0.07);border-radius:2rem;padding:0.25rem 0.28rem}
.nb{background:transparent;border:none;padding:0.35rem 0.75rem;border-radius:1.5rem;font-family:'Barlow',sans-serif;font-size:0.6rem;letter-spacing:0.03em;color:rgba(0,0,0,0.28);cursor:pointer;transition:all 0.22s;white-space:nowrap;min-height:28px;font-weight:700;text-transform:uppercase}
.nb.on{background:var(--ink);color:#fff;font-weight:800}
.nb:hover:not(.on){color:rgba(0,0,0,0.5)}

/* ── PHONE ── */
@media (prefers-reduced-motion:reduce){
  .rtext,.rline,.nav button{transition:none}
  .card{animation:none}
}
@media (max-width:480px){
  .stage{padding:0.85rem 0.85rem 1.1rem}
  .hint{font-size:0.66rem;margin-bottom:0.65rem}
  .stack,.hint{width:94vw}
  .band{width:2.4rem;padding:0.7rem 0 0.8rem;gap:0.45rem}
  .band-num{font-size:1.3rem}
  .band-word{font-size:0.56rem;letter-spacing:0.22em}
  .stack.has-cards::before{left:1.2rem}
  .flow{width:2.4rem;font-size:0.72rem;margin:-0.2rem 0 0.32rem}
  .content{padding:0.8rem 0.85rem 0.9rem}
  .card{margin-bottom:0.45rem}
  .line{font-size:0.9rem;line-height:1.5}
  .lead{font-size:0.9rem}
  .soft{font-size:0.84rem}
  .sig{font-size:0.84rem}
  .view{font-size:0.8rem}
  .gap{letter-spacing:0.13em}
  .rline+.rline{margin-top:0.45rem}
  .nav button{font-size:1.05rem}
  .card-note{font-size:0.62rem;margin-top:0.6rem;padding-top:0.5rem}
  .card-note span.opt{margin-right:0.5rem}
}
@media (max-width:360px){
  .line,.lead{font-size:0.86rem}
  .soft,.sig{font-size:0.8rem}
  .view{font-size:0.76rem}
  .band{width:2.2rem}
  .flow{width:2.2rem}
  .stack.has-cards::before{left:1.1rem}
}
</style>
</head>
<body>
<div class="shell">

  <div class="topbar">
    <a class="back-link" href="/?openModal=writing&submenu=emails">← Emails</a>
    <span class="brand">INTUITY</span>
    <span class="topic-label" id="topicLabel">Email</span>
  </div>

  <div class="register-bar">
    <button class="reg-btn active" id="regFormal"   onclick="setRegister('formal')">🎩 Formal</button>
    <div class="reg-divider"></div>
    <button class="reg-btn"        id="regInformal" onclick="setRegister('informal')">😊 Informal</button>
  </div>

  <div class="topic-tabs" id="tabsContainer"></div>

  <div class="mode-row">
    <div class="mode-pill">
      <button class="mode-btn active">Cards</button>
      <a class="mode-btn" href="emails-cards.html">Phrases</a>
    </div>
  </div>

  <div class="stage" id="stage">
    <div class="hint" id="hint">Tap any line to say it another way.</div>
    <div class="stack" id="stack"><div class="state">Loading…</div></div>
  </div>

  <div class="foot">
    <div class="nav-pill">
      <button class="nb"    onclick="switchMode('question')">Question</button>
      <button class="nb"    onclick="switchMode('plan')">Plan</button>
      <button class="nb on" onclick="switchMode('model')">Model</button>
      <button class="nb"    onclick="switchMode('sample')">Sample</button>
    </div>
  </div>
</div>

<script>
/* ════════ EMAIL CARDS — pure engine, holds no phrases. ════════
   ONE source of truth: emails/data/emails-cards-models.json, shaped
   registers > {formal, informal} > {shared, types}. Register is a dimension of
   the genre, not a second genre: the toggle picks the register, the tab row
   below is rebuilt from that register's types. Colour marks the wing, never the
   type — every register and every type stays email blue. */

const DATA_PATH = 'data/emails-cards-models.json';

/* type tabs are register-dependent; filled at runtime from the active register */
const REGISTERS = ['formal','informal'];
let TAB_ORDER = [];
let TAB_LABEL = {};

/* the three feature signpost buckets, one per feature line */
const FEAT_BUCKETS = ['first','open','standout'];
const FEAT_KEYS = ['keyOpen','keyPos','keyNeg'];

/* ── sound ── */
const AudioCtx=window.AudioContext||window.webkitAudioContext;let actx=null;
function ac(){if(!actx)actx=new AudioCtx();return actx;}
function tone(f,t,d,v,delay=0){try{const c=ac(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type=t;o.frequency.value=f;const s=c.currentTime+delay;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(v,s+0.01);g.gain.exponentialRampToValueAtTime(0.0001,s+d);o.start(s);o.stop(s+d+0.05);}catch(e){}}
function sndRoll(){tone(500,'triangle',0.07,0.06);tone(660,'triangle',0.05,0.04,0.04);}
function sndSwitch(){tone(440,'triangle',0.08,0.07);tone(580,'triangle',0.06,0.05,0.05);}

const pick = a => a[Math.floor(Math.random()*a.length)];
/* pick a value not already used on a sibling line. Works for strings AND signpost objects (compares by .t). */
const keyOf = x => (x && typeof x==='object') ? (x.t||JSON.stringify(x)) : x;
const pickAvoid = (pool, avoid) => {
  if(!pool||!pool.length) return '...';
  const av = (avoid||[]).map(keyOf);
  const free = pool.filter(x=>!av.includes(keyOf(x)));
  return pick(free.length?free:pool);
};
const fmt  = s => (s||'').replace(/\.\.\./g,'<span class="gap">...</span>');

let DATA=null, REG='formal', SH=null, T=null, TYPE=null;
let S=null, typeKeys=[];

async function init(){
  try{
    const r = await fetch(DATA_PATH);
    if(!r.ok) throw new Error('HTTP '+r.status);
    DATA = await r.json();
  }catch(e){
    document.getElementById('stack').innerHTML =
      `<div class="state err">Couldn't load the model data.<br><span style="font-size:.72rem;opacity:.7">${DATA_PATH} — ${e.message}. A fetch page must be served over http, not opened from disk.</span></div>`;
    return;
  }
  /* honour a stored question's formality if present */
  try{
    const q=JSON.parse(sessionStorage.getItem('currentEmailQuestion')||'null');
    if(q && (q.formality==='informal'||q.register==='informal')) REG='informal';
  }catch(e){}
  loadRegister(); seedAndRender();
}

/* swap the whole active dataset to the chosen register, rebuild type tabs */
function loadRegister(){
  const R = DATA.registers[REG];
  SH = R.shared;
  typeKeys = Object.keys(R.types||{});
  TAB_ORDER = typeKeys.slice();
  TAB_LABEL = {}; typeKeys.forEach(k=>TAB_LABEL[k]=R.types[k].label||k);
  if(!typeKeys.includes(TYPE)) TYPE = typeKeys[0];
  document.getElementById('regFormal').classList.toggle('active', REG==='formal');
  document.getElementById('regInformal').classList.toggle('active', REG==='informal');
  applyType(); renderTabs();
}

function setRegister(reg){
  if(reg===REG) return;
  REG=reg; TYPE=null; sndSwitch(); loadRegister(); seedAndRender();
}
window.setRegister=setRegister;

function applyType(){
  T = DATA.registers[REG].types[TYPE];
  document.getElementById('topicLabel').textContent=(T.label||TYPE).toUpperCase();
}

function renderTabs(){
  const c=document.getElementById('tabsContainer');
  c.innerHTML = TAB_ORDER.map(k=>
    `<button class="ttab ${k===TYPE?'active':''}" onclick="switchType('${k}')">${TAB_LABEL[k]||k}</button>`
  ).join('');
}
function switchType(k){
  if(!typeKeys.includes(k)||k===TYPE) return;
  TYPE=k; sndSwitch(); applyType(); renderTabs(); seedAndRender();
}

/* ── generators ── */
function genOpen(){ return {greet:pick(SH.greeting||['...']), hinge:pick(T.open.hinge), aim:pick(T.open.aim)}; }

/* a feature line: signpost (object with _join) + maybe a view + key.
   _join 'self' → the signpost completes itself, view suppressed.
   _join 'open' → short lead-in, view inserted between. */
function genFeature(i, avoid){
  avoid = avoid || {signs:[],views:[],keys:[]};
  const SPF = (T.signpostFeature) || SH.signpostFeature;
  const bucket = SPF[FEAT_BUCKETS[i]] || SPF.open || [];
  const pool   = (T.argue[FEAT_KEYS[i]]) || [];
  const sp   = pickAvoid(bucket, avoid.signs);
  const key  = pickAvoid(pool.length?pool:['...'], avoid.keys);
  const join = (sp && sp._join) || 'self';
  const view = join==='open' ? pickAvoid(SH.view, avoid.views) : null;
  return { sp, key, view, join };
}
function siblingAvoid(idx){
  const used={signs:[],views:[],keys:[]};
  for(let j=0;j<3;j++){ if(j===idx||!S) continue; const m=S.feat[j].h[S.feat[j].i];
    used.signs.push(m.sp); used.keys.push(m.key); if(m.view)used.views.push(m.view); }
  return used;
}
function genClose(){ return {recommend:pick(T.close.recommend), verdict:pick(T.close.verdict), signoff:pick(SH.signoff||['...'])}; }

function seedAndRender(){
  const used={signs:[],views:[],keys:[]};
  const feat=[];
  for(let i=0;i<3;i++){
    const m=genFeature(i,used);
    used.signs.push(m.sp); used.keys.push(m.key); if(m.view)used.views.push(m.view);
    feat.push({h:[m],i:0});
  }
  S={open:{h:[genOpen()],i:0},feat,close:{h:[genClose()],i:0}};
  render();
}

/* ── the line IS the control: tap / swipe / arrow keys roll it ── */
const REDUCED=(function(){try{return window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){return false;}})();

function stateFor(slot,idx){ return slot==='feat'?S.feat[idx]:S[slot]; }
function lineId(slot,idx){ return slot==='feat'?'ln-feat-'+idx:'ln-'+slot; }

function roll(slot,dir,idx){
  const st=stateFor(slot,idx);
  if(dir<0 && st.i>0){ st.i--; }
  else if(st.i<st.h.length-1){ st.i++; }
  else { st.h.push(slot==='open'?genOpen():slot==='close'?genClose():genFeature(idx,siblingAvoid(idx))); st.i=st.h.length-1; }
  sndRoll();
  const el=document.getElementById(lineId(slot,idx));
  if(!el){ render(); return; }
  const commit=()=>{ el.innerHTML=lineHTML(slot,idx); if(slot==='open') syncGreet(); };
  const holder=el.closest('.rtext');
  if(REDUCED||!holder){ commit(); return; }
  holder.style.opacity='0';
  setTimeout(()=>{ commit(); holder.style.opacity='1'; },90);
}
window.roll=roll; window.switchType=switchType;

const cur=(slot,idx)=> slot==='feat'?S.feat[idx].h[S.feat[idx].i]:S[slot].h[S[slot].i];

function navBack(){
  return `<div class="nav"><button type="button" aria-label="Another version" onclick="rollBack(event)">\u2039</button></div>`;
}
function rollBack(e){
  e.stopPropagation();
  const row=e.target.closest('.rline'); if(!row) return;
  const idx=row.dataset.idx!==undefined?+row.dataset.idx:undefined;
  roll(row.dataset.slot,-1,idx);
}
window.rollBack=rollBack;

/* the greeting options promote into the opening line */
function setGreet(e,i){
  e.stopPropagation();
  if(!S||!SH.greeting||!SH.greeting[i]) return;
  cur('open').greet=SH.greeting[i];
  sndRoll();
  const el=document.getElementById('ln-open');
  if(el) el.innerHTML=lineHTML('open');
  syncGreet();
}
window.setGreet=setGreet;
function syncGreet(){
  if(!S) return;
  const live=cur('open').greet;
  document.querySelectorAll('.card-note span.opt[data-greet]').forEach(el=>{
    if(el.textContent===live) el.setAttribute('data-on',''); else el.removeAttribute('data-on');
  });
}

/* ── gesture layer: the whole line is the target ── */
const TAP_SLOP=10, SWIPE_MIN=30, SWIPE_DRIFT=25;
let gx=0, gy=0, gtrack=false;
function bindGestures(){
  const stack=document.getElementById('stack');
  stack.addEventListener('pointerdown',e=>{
    if(e.target.closest('.nav')||e.target.closest('[data-greet]')) return;
    if(!e.target.closest('.rline')) return;
    gx=e.clientX; gy=e.clientY; gtrack=true;
  });
  stack.addEventListener('pointercancel',()=>{gtrack=false;});
  stack.addEventListener('pointerup',e=>{
    if(!gtrack) return; gtrack=false;
    if(e.target.closest('.nav')||e.target.closest('[data-greet]')) return;
    const row=e.target.closest('.rline'); if(!row) return;
    const dx=e.clientX-gx, dy=e.clientY-gy;
    const idx=row.dataset.idx!==undefined?+row.dataset.idx:undefined;
    if(Math.abs(dx)>=SWIPE_MIN && Math.abs(dy)<=SWIPE_DRIFT){ roll(row.dataset.slot,dx<0?1:-1,idx); return; }
    if(Math.abs(dx)<=TAP_SLOP && Math.abs(dy)<=TAP_SLOP){ roll(row.dataset.slot,1,idx); }
  });
  stack.addEventListener('keydown',e=>{
    const row=e.target.closest && e.target.closest('.rline'); if(!row) return;
    const idx=row.dataset.idx!==undefined?+row.dataset.idx:undefined;
    if(e.key==='Enter'||e.key===' '||e.key==='ArrowRight'){ e.preventDefault(); roll(row.dataset.slot,1,idx); }
    else if(e.key==='ArrowLeft'){ e.preventDefault(); roll(row.dataset.slot,-1,idx); }
  });
}

let demoed=false;
try{ demoed=sessionStorage.getItem('intuity.roll.demoed')==='1'; }catch(e){}
function demonstrate(){
  if(demoed||REDUCED) return;
  demoed=true;
  try{ sessionStorage.setItem('intuity.roll.demoed','1'); }catch(e){}
  setTimeout(()=>{ if(S) roll('open',1); },900);
}

function lineHTML(slot,idx){
  if(slot==='open'){ const o=cur('open');
    return `<span class="lead">${fmt(o.greet)}</span> <span class="soft">${o.hinge} ${fmt(o.aim)}</span>`; }
  if(slot==='close'){ const c=cur('close');
    return `${fmt(c.recommend)} ${fmt(c.verdict)} <span class="view">${fmt(c.signoff)}</span>`; }
  return featLineHTML(cur('feat',idx));
}

function featLineHTML(m){
  const raw = m.sp && m.sp.t ? m.sp.t : '';
  const spt = raw || (m.sp ? '' : '...');
  // Quiet signpost (empty text): let the key lead on its own, capitalised.
  if(raw===''){
    const k = fmt(m.key);
    const cap = k.replace(/^(<[^>]+>)?\s*([a-z])/, (mt,tag,ch)=>(tag||'')+ch.toUpperCase());
    return `${cap}<span class="ast">*</span>`;
  }
  if(m.join==='open' && m.view){
    return `<span class="sig">${spt}</span> <span class="view">${m.view}</span> ${fmt(m.key)}<span class="ast">*</span>`;
  }
  return `<span class="sig">${spt}</span> ${fmt(m.key)}<span class="ast">*</span>`;
}

function render(){
  const featLines=[0,1,2].map(i=>
    `<div class="rline" id="rl-feat-${i}" data-slot="feat" data-idx="${i}" role="button" tabindex="0" aria-label="Another way of saying this point"><div class="rtext"><div class="line" id="ln-feat-${i}">${lineHTML('feat',i)}</div><div class="dev">...</div></div>${navBack()}</div>`
  ).join('');
  const greetNote=`<div class="card-note"><span class="k">greeting:</span>`+
    (SH.greeting||[]).map((h,i)=>`<span class="opt" data-greet="${i}" role="button" tabindex="0" onclick="setGreet(event,${i})">${h}</span>`).join('')+`</div>`;
  const supportNote=`<div class="card-note"><span class="k">*</span>`+
    (SH.support||[]).map(s=>`<span class="opt">${s.move}</span>`).join('')+`</div>`;

  document.getElementById('stack').innerHTML=`
    <div class="card"><div class="band"><span class="band-num">01</span><span class="band-word">Opening</span></div>
      <div class="content"><div class="rline" id="rl-open" data-slot="open" role="button" tabindex="0" aria-label="Another way of opening"><div class="rtext"><div class="line" id="ln-open">${lineHTML('open')}</div></div>${navBack()}</div>${greetNote}</div></div>
    <div class="flow">&#9662;</div>
    <div class="card"><div class="band"><span class="band-num">02</span><span class="band-word">Body</span></div>
      <div class="content">${featLines}${supportNote}</div></div>
    <div class="flow">&#9662;</div>
    <div class="card"><div class="band"><span class="band-num">03</span><span class="band-word">Closing</span></div>
      <div class="content"><div class="rline" id="rl-close" data-slot="close" role="button" tabindex="0" aria-label="Another way of closing"><div class="rtext"><div class="line" id="ln-close">${lineHTML('close')}</div></div>${navBack()}</div></div></div>`;
  document.getElementById('stack').classList.add('has-cards');
  syncGreet();
  demonstrate();
}

function switchMode(mode){
  if(mode==='model')return;
  const map={question:'email-question.html',plan:'email-plan.html',sample:'email-sample.html'};
  if(map[mode])window.location.href=map[mode];
}
window.switchMode=switchMode;

bindGestures();
init();
