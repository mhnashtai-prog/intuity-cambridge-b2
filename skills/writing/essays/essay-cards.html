<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0"/>
<title>Essay Model — INTUITY</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Barlow+Condensed:wght@600;700;800;900&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#f0efec;--ink:#111111;--white:#ffffff;
  --acc:#7b5ea7;--sig:#6a4374;--txt:rgba(0,0,0,0.82);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;position:fixed;background:var(--bg);font-family:'Barlow',sans-serif;-webkit-font-smoothing:antialiased}
.shell{position:fixed;inset:0;display:flex;flex-direction:column}

/* ── TOPBAR ── */
.topbar{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0.65rem 1.25rem;background:rgba(240,239,236,0.95);backdrop-filter:blur(12px);border-bottom:1.5px solid rgba(0,0,0,0.07);z-index:100}
.back-link{text-decoration:none;font-size:0.72rem;font-weight:700;color:rgba(0,0,0,0.38);letter-spacing:0.05em;text-transform:uppercase;transition:color 0.2s}
.back-link:hover{color:rgba(0,0,0,0.65)}
.brand{font-family:'Barlow Condensed',sans-serif;font-size:0.7rem;font-weight:900;letter-spacing:0.28em;text-transform:uppercase;color:rgba(0,0,0,0.18)}
.topic-label{font-size:0.68rem;font-weight:700;color:rgba(0,0,0,0.38);letter-spacing:0.04em;text-align:right;max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}

/* ── TYPE TABS ── */
.topic-tabs{flex-shrink:0;display:flex;align-items:center;gap:0.25rem;padding:0.45rem 1.1rem;background:rgba(240,239,236,0.8);border-bottom:1px solid rgba(0,0,0,0.06);overflow-x:auto}
.topic-tabs::-webkit-scrollbar{display:none}
.ttab{background:transparent;border:none;padding:0.28rem 0.65rem;border-radius:2rem;font-family:'Barlow',sans-serif;font-size:0.58rem;font-weight:700;color:rgba(0,0,0,0.3);cursor:pointer;transition:all 0.2s;white-space:nowrap;letter-spacing:0.06em;text-transform:uppercase}
.ttab:hover{color:rgba(0,0,0,0.55);background:rgba(0,0,0,0.05)}
.ttab.active{background:var(--ink);color:#fff}

/* ── MODE TOGGLE ── */
.mode-row{flex-shrink:0;display:flex;justify-content:center;padding:0.5rem 1rem 0.15rem;background:rgba(240,239,236,0.8)}
.mode-pill{display:inline-flex;background:rgba(10,10,10,0.06);border-radius:2rem;padding:0.2rem}
.mode-btn{font-family:'Barlow',sans-serif;font-size:0.6rem;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;padding:0.34rem 0.95rem;border:none;background:transparent;border-radius:1.5rem;cursor:pointer;color:rgba(0,0,0,0.4);transition:all .25s;text-decoration:none}
.mode-btn:hover{color:rgba(0,0,0,0.7)}
.mode-btn.active{background:var(--sig);color:#fff}

/* ── STAGE ── */
.stage{flex:1;min-height:0;position:relative;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;align-items:center;padding:1.1rem 1rem 1.4rem}
.stage::-webkit-scrollbar{width:3px}
.stage::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.1);border-radius:2px}

.hint{width:min(420px,92vw);font-family:'Instrument Sans',sans-serif;font-style:italic;font-size:0.7rem;color:rgba(0,0,0,0.32);margin-bottom:0.8rem;text-align:center}

/* ── stack + spine ── */
.stack{width:min(1120px,96vw);position:relative}
.stack.has-cards::before{content:'';position:absolute;left:1.35rem;top:0.6rem;bottom:0.6rem;width:2px;background:var(--sig);opacity:0.22;z-index:0}

.card{position:relative;z-index:1;display:flex;background:var(--white);border-radius:1.1rem;overflow:hidden;margin-bottom:0.55rem;box-shadow:0 2px 0 rgba(255,255,255,0.8) inset,3px 5px 0 rgba(0,0,0,0.05),0 14px 36px rgba(0,0,0,0.12),0 3px 9px rgba(0,0,0,0.06);animation:cardUp .5s cubic-bezier(.22,1,.36,1) both}
@keyframes cardUp{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
.band{width:2.7rem;flex-shrink:0;background:var(--sig);display:flex;flex-direction:column;align-items:center;padding:0.85rem 0 0.95rem;gap:0.55rem}
.band-num{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.5rem;color:#fff;line-height:1}
.band-word{writing-mode:vertical-rl;text-orientation:mixed;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:0.62rem;letter-spacing:0.26em;text-transform:uppercase;color:rgba(255,255,255,0.72)}
.content{flex:1;min-width:0;padding:0.9rem 1rem 1rem}
.flow{width:2.7rem;text-align:center;color:var(--sig);opacity:0.45;font-size:0.78rem;line-height:1;margin:-0.15rem 0 0.4rem}

/* ── tiles ── */
.line{font-family:'Barlow',sans-serif;font-weight:500;font-size:0.98rem;line-height:1.55;color:var(--txt)}
.lead{color:var(--txt);font-weight:600}
.soft{color:rgba(0,0,0,0.42);font-weight:400;font-size:0.9rem}
.sig{color:var(--sig);font-weight:500;font-size:0.9rem;margin-right:0.12rem}
.view{color:rgba(0,0,0,0.36);font-weight:400;font-size:0.86rem}
.gap{font-weight:600;color:rgba(0,0,0,0.5);letter-spacing:0.16em;padding:0 0.06rem}
.ast{color:var(--sig);font-weight:600;font-size:0.7em;vertical-align:0.35em;margin-left:0.05rem}
.dev{margin-top:0.02rem;line-height:1;font-family:'Instrument Sans',sans-serif;font-size:0.72rem;color:rgba(0,0,0,0.22);letter-spacing:0.16em}

/* ── the line IS the control ── */
.rline{display:flex;align-items:center;gap:0.3rem;min-height:52px;padding:0.3rem 0.5rem;margin:0 -0.5rem;border-radius:0.6rem;cursor:pointer;touch-action:pan-y;transition:background .12s linear}
.rline:hover{background:rgba(0,0,0,0.035)}
.rline:active{background:rgba(0,0,0,0.055)}
.rline:focus-visible{outline:2px solid var(--sig);outline-offset:1px}
.rline+.rline{margin-top:0.15rem}
.rtext{flex:1;min-width:0;transition:opacity .09s linear}
.nav{display:flex;flex-shrink:0;align-items:center;margin-left:0.2rem}
.nav button{border:1.5px solid var(--sig);background:var(--white);color:var(--sig);font-size:1.5rem;font-weight:600;line-height:1;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:1;transition:transform .15s,background .15s,color .15s;font-family:'Barlow',sans-serif;padding-bottom:3px}
.nav button:hover{background:var(--sig);color:var(--white)}
.nav button:active{transform:scale(.9)}
.nav button:focus-visible{outline:2px solid var(--sig);outline-offset:2px}

/* ── in-card footnote ── */
.card-note{margin-top:0.7rem;padding-top:0.55rem;border-top:1px solid rgba(0,0,0,0.06);font-family:'Instrument Sans',sans-serif;font-size:0.66rem;line-height:1.7;color:rgba(0,0,0,0.34)}
.card-note .k{color:var(--sig);opacity:0.75;margin-right:0.05rem;font-weight:600}
.card-note span.opt{margin-right:0.6rem;white-space:nowrap}
.card-note span.opt[data-hinge]{cursor:pointer;display:inline-flex;align-items:center;min-height:30px;padding:0 0.08rem;border-bottom:1px solid transparent;transition:color .15s,border-color .15s}
.card-note span.opt[data-hinge]:hover{color:rgba(0,0,0,0.62)}
.card-note span.opt[data-hinge][data-on]{color:var(--sig);border-bottom-color:var(--sig)}

.state{width:min(420px,92vw);text-align:center;padding:2.5rem 1rem;font-family:'Instrument Sans',sans-serif;color:rgba(0,0,0,0.4);font-style:italic;font-size:0.85rem}
.state.err{color:#b4453a}

/* ── FOOTER NAV ── */
.foot{flex-shrink:0;display:flex;justify-content:center;padding:0.5rem 1rem calc(env(safe-area-inset-bottom,0px) + 0.55rem);background:rgba(240,239,236,0.95);border-top:1px solid rgba(0,0,0,0.06)}
.nav-pill{display:flex;gap:0.12rem;background:rgba(10,10,10,0.07);border-radius:2rem;padding:0.25rem 0.28rem}
.nb{background:transparent;border:none;padding:0.35rem 0.75rem;border-radius:1.5rem;font-family:'Barlow',sans-serif;font-size:0.6rem;letter-spacing:0.03em;color:rgba(0,0,0,0.28);cursor:pointer;transition:all 0.22s;white-space:nowrap;min-height:28px;font-weight:700;text-transform:uppercase}
.nb.on{background:var(--ink);color:#fff;font-weight:800}
.nb:hover:not(.on){color:rgba(0,0,0,0.5)}

/* ══ PHRASES — the same cards, with each slot opened up ══
   CARDS shows one chain. PHRASES shows the choices inside that chain.
   Same JSON, same colours, same gold gaps. */
.pgroup+.pgroup{margin-top:0.9rem;padding-top:0.75rem;border-top:1px solid rgba(0,0,0,0.07)}
.pgroup-title{font-family:'Barlow Condensed',sans-serif;font-size:0.62rem;font-weight:800;letter-spacing:0.16em;text-transform:uppercase;color:var(--sig);opacity:0.85;margin-bottom:0.35rem;display:flex;align-items:baseline;gap:0.4rem}
.pgroup-count{font-family:'Instrument Sans',sans-serif;font-size:0.6rem;font-style:italic;letter-spacing:0;text-transform:none;color:rgba(0,0,0,0.28);font-weight:400}
.pitem{position:relative;cursor:pointer;font-family:'Barlow',sans-serif;font-size:0.92rem;line-height:1.5;color:var(--txt);padding:0.42rem 0.5rem;margin:0 -0.5rem;border-radius:0.5rem;border-bottom:1px solid rgba(0,0,0,0.05);transition:background .12s linear}
.pitem:last-child{border-bottom:none}
.pitem:hover{background:rgba(0,0,0,0.035)}
.pitem .gap{color:rgba(0,0,0,0.5)}
.pbloom{display:none;margin-top:0.55rem;background:var(--bg);border-radius:0.6rem;border-left:3px solid var(--sig);padding:0.65rem 0.8rem;animation:bloomIn .2s ease}
.pitem.open{background:rgba(0,0,0,0.025)}
.pitem.open .pbloom{display:block}
@keyframes bloomIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.pbloom-tag{font-family:'Barlow Condensed',sans-serif;font-size:0.58rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--sig);font-weight:800;opacity:0.8;margin-bottom:0.3rem}
.pbloom-line{font-size:0.95rem;line-height:1.6;color:var(--txt)}

/* ── PHONE ── */
@media (max-width:480px){
  .stage{padding:0.85rem 0.85rem 1.1rem}
  .hint{font-size:0.66rem;margin-bottom:0.65rem}
  .stack,.hint{width:94vw}
  .band{width:2.4rem;padding:0.7rem 0 0.8rem;gap:0.45rem}
  .band-num{font-size:1.3rem}
  .band-word{font-size:0.56rem;letter-spacing:0.22em}
  .stack.has-cards::before{left:1.2rem}
  .flow{width:2.4rem;font-size:0.72rem;margin:-0.2rem 0 0.32rem}
  .content{padding:0.8rem 0.85rem 0.9rem}
  .card{margin-bottom:0.45rem}
  .line{font-size:0.9rem;line-height:1.5}
  .lead{font-size:0.9rem}
  .soft{font-size:0.84rem}
  .sig{font-size:0.84rem}
  .view{font-size:0.8rem}
  .gap{letter-spacing:0.13em}
  .rline+.rline{margin-top:0.1rem}
  .card-note{font-size:0.62rem;margin-top:0.6rem;padding-top:0.5rem}
  .card-note span.opt{margin-right:0.5rem}
  .nav button{width:40px;height:40px;font-size:1.35rem}
  .pitem{font-size:0.86rem}
  .pbloom-line{font-size:0.88rem}
}
@media (max-width:360px){
  .line,.lead{font-size:0.86rem}
  .soft,.sig{font-size:0.8rem}
  .view{font-size:0.76rem}
  .band{width:2.2rem}
  .flow{width:2.2rem}
  .stack.has-cards::before{left:1.1rem}
}

@media (prefers-reduced-motion:reduce){
  .rtext,.rline,.nav button,.pitem{transition:none}
  .card{animation:none}
  .pbloom{animation:none}
}
</style>
</head>
<body>
<div class="shell">

  <div class="topbar">
    <a class="back-link" href="/skills/writing/essays/essay-question">← Essays</a>
    <span class="brand">INTUITY</span>
    <span class="topic-label" id="topicLabel">Model</span>
  </div>

  <div class="topic-tabs" id="tabsContainer"></div>

  <div class="mode-row">
    <div class="mode-pill">
      <button class="mode-btn active" id="mbCards" onclick="setView('cards')">Cards</button>
      <button class="mode-btn" id="mbPhrases" onclick="setView('phrases')">Phrases</button>
    </div>
  </div>

  <div class="stage" id="stage">
    <div class="hint" id="hint">Tap any line to say it another way.</div>
    <div class="stack" id="stack"><div class="state">Loading…</div></div>
  </div>

  <div class="foot">
    <div class="nav-pill">
      <button class="nb"    onclick="switchMode('question')">Question</button>
      <button class="nb"    onclick="switchMode('plan')">Plan</button>
      <button class="nb on" onclick="switchMode('model')">Model</button>
      <button class="nb"    onclick="switchMode('sample')">Sample</button>
    </div>
  </div>
</div>

<script>

/* ════════ PURE ENGINE — holds no phrases. Everything comes from the JSON. ════════
   ONE source of truth: essays/data/essay-cards-models.json — the same file the
   slide galleries read. CARDS assembles one chain from it; PHRASES opens up the
   pools that chain is drawn from. No second corpus, no second fetch. */

const DATA_PATH = 'data/essay-cards-models.json';

const TAB_ORDER = ['for-against','problem-solution','cause-effect','agree-disagree','opinion','speculation-trends'];
const TAB_LABEL = {
  'for-against':'For & Against','problem-solution':'Problems & Solutions','cause-effect':'Cause & Effect',
  'agree-disagree':'Agree & Disagree','opinion':'Opinion','speculation-trends':'Speculation & Trends'
};
const TYPE_COLOR = {
  'opinion':'#3d9e95','for-against':'#e8723a','problem-solution':'#7b5ea7',
  'cause-effect':'#c94f6d','agree-disagree':'#4a7fb5','speculation-trends':'#c08b2f'
};
function applyAccent(type){
  const hex = TYPE_COLOR[type] || TYPE_COLOR['opinion'];
  document.documentElement.style.setProperty('--acc', hex);
  document.documentElement.style.setProperty('--sig', hex);
}

const REDUCED = (function(){
  try{ return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; }
})();

/* ── sound ── */
const AudioCtx=window.AudioContext||window.webkitAudioContext;let actx=null;
function ac(){if(!actx)actx=new AudioCtx();return actx;}
function tone(f,t,d,v,delay=0){try{const c=ac(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type=t;o.frequency.value=f;const s=c.currentTime+delay;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(v,s+0.01);g.gain.exponentialRampToValueAtTime(0.0001,s+d);o.start(s);o.stop(s+d+0.05);}catch(e){}}
function sndRoll(){tone(500,'triangle',0.07,0.06);tone(660,'triangle',0.05,0.04,0.04);}
function sndSwitch(){tone(440,'triangle',0.08,0.07);tone(580,'triangle',0.06,0.05,0.05);}

const pick = a => a[Math.floor(Math.random()*a.length)];
const pickAvoid = (pool, avoid) => {
  if(!pool||!pool.length) return '...';
  const av = avoid||[];
  const free = pool.filter(x=>!av.includes(x));
  return pick(free.length?free:pool);
};
const fmt  = s => (s||'').replace(/\.\.\./g,'<span class="gap">...</span>');
/* pools are plain strings in the essay file, but tolerate {t:...} like its siblings */
const txt  = x => (x && x.t) ? x.t : x;
const uniq = a => { const o=[]; (a||[]).forEach(x=>{ const v=txt(x); if(v&&!o.includes(v)) o.push(v); }); return o; };

let DATA=null, SH=null, T=null, TYPE=null, VIEW=null, BODYPLAN=null, KEYS=null;
let S=null;
let typeKeys=[];

async function init(){
  try{
    const r = await fetch(DATA_PATH);
    if(!r.ok) throw new Error('HTTP '+r.status);
    DATA = await r.json();
  }catch(e){
    document.getElementById('stack').innerHTML =
      `<div class="state err">Couldn't load the model data.<br><span style="font-size:.72rem;opacity:.7">${DATA_PATH} — ${e.message}. A fetch page must be served over http, not opened from disk.</span></div>`;
    renderTabs(); return;
  }

  SH = DATA.shared;
  typeKeys = Object.keys(DATA.types||{});
  if(!typeKeys.length){ document.getElementById('stack').innerHTML='<div class="state err">No essay types found.</div>'; renderTabs(); return; }

  TYPE = resolveType(typeKeys);
  applyType();
  renderTabs();
  seedAndRender();
}

function resolveType(keys){
  let t=null;
  try{
    const q=JSON.parse(sessionStorage.getItem('currentQuestion')||'null');
    if(q&&q.essayType) t=String(q.essayType).toLowerCase().replace(/[\s&]+/g,'-').replace(/-+/g,'-');
  }catch(e){}
  const alias={'for_and_against':'for-against','for-and-against':'for-against','problem_and_solution':'problem-solution','cause_and_effect':'cause-effect','agree_and_disagree':'agree-disagree','speculation_and_trends':'speculation-trends'};
  if(t&&alias[t]) t=alias[t];
  if(t&&keys.includes(t)) return t;
  return keys.includes('for-against')?'for-against':keys[0];
}

function applyType(){
  T = DATA.types[TYPE];
  applyAccent(TYPE);
  VIEW = SH.view[T.viewFlavour] || SH.view.generalisation || Object.values(SH.view)[0];

  if(Array.isArray(T.argue.bodyPlan) && T.argue.bodyPlan.length===3){
    BODYPLAN = T.argue.bodyPlan;
    KEYS = T.argue;
  }else if(T.argue.keyFor || T.argue.keyAgainst){
    BODYPLAN = ['keyFor','keyFor','keyAgainst'];
    KEYS = {keyFor:T.argue.keyFor||[], keyAgainst:T.argue.keyAgainst||[]};
  }else{
    const all=T.argue.key||[];
    const pos=all.filter(k=>/advantage|benefit|favour|positive/i.test(k));
    const neg=all.filter(k=>/disadvantage|drawback|against/i.test(k));
    BODYPLAN = ['keyFor','keyFor','keyAgainst'];
    KEYS = {keyFor:pos.length?pos:all, keyAgainst:neg.length?neg:all};
  }

  try{
    const q=JSON.parse(sessionStorage.getItem('currentQuestion')||'null');
    const lab=(q&&(q.topic||q.title))||T.label||TYPE;
    document.getElementById('topicLabel').textContent=String(lab).toUpperCase();
  }catch(e){ document.getElementById('topicLabel').textContent=(T.label||TYPE).toUpperCase(); }
}

/* ── tabs ── */
function renderTabs(){
  const c=document.getElementById('tabsContainer');
  c.innerHTML = TAB_ORDER.map(k=>{
    const has = typeKeys.includes(k);
    const lbl = (DATA && DATA.types[k] && DATA.types[k].label) || TAB_LABEL[k] || k;
    return `<button class="ttab ${k===TYPE?'active':''}" ${has?`onclick="switchType('${k}')"`:'disabled style="opacity:.35;cursor:default"'}>${lbl}</button>`;
  }).join('');
}
function switchType(k){
  if(!typeKeys.includes(k)||k===TYPE) return;
  TYPE=k; sndSwitch(); applyType(); renderTabs(); seedAndRender();
}

/* ── generators ── */
function genOpen(){ return {bg:pick(SH.background), hinge:pick(T.open.hinge), aim:pick(T.open.aim)}; }
function genArgue(i, avoid){ avoid=avoid||{views:[],keys:[],signs:[]};
  const plan=(T.argue.signpostPlan&&T.argue.signpostPlan[i])||['first','addition','turn'][i];
  const pool=(KEYS[BODYPLAN[i]]||[]);
  return {
    sign: pickAvoid(SH.signpost[plan]||SH.signpost.addition, avoid.signs),
    view: pickAvoid(VIEW, avoid.views),
    key:  pickAvoid(pool.length?pool:['...'], avoid.keys)
  };
}
function siblingAvoid(idx){
  const used={views:[],keys:[],signs:[]};
  for(let j=0;j<3;j++){ if(j===idx||!S) continue; const m=S.argue[j].h[S.argue[j].i];
    used.views.push(m.view); used.keys.push(m.key); used.signs.push(m.sign); }
  return used;
}
function genClose(){ return {summary:pick(T.close.summary), stance:pick(T.close.stance), verdict:pick(T.close.verdict)}; }

function seedAndRender(){
  const used={views:[],keys:[],signs:[]};
  const argue=[];
  for(let i=0;i<3;i++){
    const m=genArgue(i,used);
    used.views.push(m.view); used.keys.push(m.key); used.signs.push(m.sign);
    argue.push({h:[m],i:0});
  }
  S={open:{h:[genOpen()],i:0},argue,close:{h:[genClose()],i:0}};
  render();
}

/* ── rolling ── */
function stateFor(slot,idx){ return slot==='argue' ? S.argue[idx] : S[slot]; }
function lineId(slot,idx){ return slot==='argue' ? 'ln-argue-'+idx : 'ln-'+slot; }
function rowId(slot,idx){ return slot==='argue' ? 'rl-argue-'+idx : 'rl-'+slot; }

function updateBack(slot,idx){
  const row=document.getElementById(rowId(slot,idx));
  if(!row) return;
  if(stateFor(slot,idx).i>0) row.setAttribute('data-back','');
  else row.removeAttribute('data-back');
}

function roll(slot,dir,idx){
  const st = stateFor(slot,idx);
  if(dir>0){
    if(st.i<st.h.length-1) st.i++;
    else { st.h.push(slot==='open'?genOpen():slot==='close'?genClose():genArgue(idx,siblingAvoid(idx))); st.i=st.h.length-1; }
  } else if(st.i>0){ st.i--; }
  else return;
  sndRoll();
  const el = document.getElementById(lineId(slot,idx));
  if(!el){ render(); return; }
  const commit=()=>{
    el.innerHTML = lineHTML(slot,idx);
    updateBack(slot,idx);
    if(slot==='open') syncHinge();
  };
  const holder = el.closest('.rtext');
  if(REDUCED || !holder){ commit(); return; }
  holder.style.opacity='0';
  setTimeout(()=>{ commit(); holder.style.opacity='1'; }, 90);
}
window.roll=roll; window.switchType=switchType;

const cur=(slot,idx)=> slot==='argue'?S.argue[idx].h[S.argue[idx].i]:S[slot].h[S[slot].i];

function lineHTML(slot,idx){
  if(slot==='open'){const o=cur('open');return `<span class="lead">${fmt(o.bg)}</span> <span class="soft">${o.hinge}<span class="ast">*</span> <span class="gap">...</span>. ${fmt(o.aim)}</span>`;}
  if(slot==='close'){const c=cur('close');return `${fmt(c.summary)} <span class="view">${c.stance}</span> ${fmt(c.verdict)}`;}
  const m=cur('argue',idx);return `<span class="sig">${m.sign}</span> <span class="view">${m.view}</span> ${fmt(m.key)}<span class="ast">*</span>`;
}

function navBack(){
  return `<div class="nav"><button type="button" aria-label="Previous version" onclick="rollBack(event)">‹</button></div>`;
}
function rollBack(e){
  e.stopPropagation();
  const row=e.target.closest('.rline');
  if(!row) return;
  const idx = row.dataset.idx!==undefined ? +row.dataset.idx : undefined;
  roll(row.dataset.slot,-1,idx);
}
window.rollBack=rollBack;

/* ── hinge options promote into the open line ── */
function setHinge(e,i){
  e.stopPropagation();
  if(!S||!T||!T.open.hinge||!T.open.hinge[i]) return;
  cur('open').hinge = T.open.hinge[i];
  sndRoll();
  const el=document.getElementById('ln-open');
  if(el) el.innerHTML=lineHTML('open');
  syncHinge();
}
window.setHinge=setHinge;
function syncHinge(){
  if(!S) return;
  const live=cur('open').hinge;
  const opts=document.querySelectorAll('.card-note span.opt[data-hinge]');
  for(let i=0;i<opts.length;i++){
    if(opts[i].textContent===live) opts[i].setAttribute('data-on','');
    else opts[i].removeAttribute('data-on');
  }
}

/* ── gesture layer ── */
const TAP_SLOP=10, SWIPE_MIN=30, SWIPE_DRIFT=25;
let gx=0, gy=0, gtrack=false;
function bindGestures(){
  const stack=document.getElementById('stack');
  stack.addEventListener('pointerdown',e=>{
    if(e.target.closest('.nav')||e.target.closest('[data-hinge]')) return;
    if(!e.target.closest('.rline')) return;
    gx=e.clientX; gy=e.clientY; gtrack=true;
  });
  stack.addEventListener('pointercancel',()=>{gtrack=false;});
  stack.addEventListener('pointerup',e=>{
    if(!gtrack) return;
    gtrack=false;
    if(e.target.closest('.nav')||e.target.closest('[data-hinge]')) return;
    const row=e.target.closest('.rline');
    if(!row) return;
    const dx=e.clientX-gx, dy=e.clientY-gy;
    const idx = row.dataset.idx!==undefined ? +row.dataset.idx : undefined;
    if(Math.abs(dx)>=SWIPE_MIN && Math.abs(dy)<=SWIPE_DRIFT){ roll(row.dataset.slot, dx<0?1:-1, idx); return; }
    if(Math.abs(dx)<=TAP_SLOP && Math.abs(dy)<=TAP_SLOP){ roll(row.dataset.slot, 1, idx); }
  });
  stack.addEventListener('keydown',e=>{
    const row=e.target.closest && e.target.closest('.rline');
    if(!row) return;
    const idx = row.dataset.idx!==undefined ? +row.dataset.idx : undefined;
    if(e.key==='Enter'||e.key===' '||e.key==='ArrowRight'){ e.preventDefault(); roll(row.dataset.slot,1,idx); }
    else if(e.key==='ArrowLeft'){ e.preventDefault(); roll(row.dataset.slot,-1,idx); }
  });
}

/* one quiet swap, once per session */
let demoed=false;
try{ demoed = sessionStorage.getItem('intuity.roll.demoed')==='1'; }catch(e){}
function demonstrate(){
  if(demoed||REDUCED) return;
  demoed=true;
  try{ sessionStorage.setItem('intuity.roll.demoed','1'); }catch(e){}
  setTimeout(()=>{ if(view==='cards'&&S) roll('open',1); }, 900);
}

/* ══════════ PHRASES — the paradigmatic view of the same data ══════════
   Every pool the CARDS chain draws from, listed in full. Tap an expression
   and it drops into the line the student currently has on the cards. */

const POOL_LABEL={
  /* for-against genuinely turns; the other five run one direction, so their key
     pool is split: keyOpen can start the body, keyMore implies a point already made. */
  keyFor:'Key idea · in favour', keyAgainst:'Key idea · against',
  keyOpen:'Key idea · opening move', keyMore:'Key idea · continuing', key:'Key idea',
  first:'Signpost · first point', addition:'Signpost · adding', turn:'Signpost · turning'
};
const label = k => POOL_LABEL[k] || String(k).replace(/([A-Z])/g,' $1').replace(/^./,c=>c.toUpperCase());

function phraseCards(){
  if(!T||!SH) return [];
  const sp = T.argue.signpostPlan || ['first','addition','turn'];
  const signGroups = [];
  sp.forEach(k=>{ if(!signGroups.some(g=>g.key===k)) signGroups.push({key:k,label:label(k),slot:'sign',items:uniq(SH.signpost[k])}); });
  const keyGroups = [];
  (BODYPLAN||[]).forEach(k=>{ if(!keyGroups.some(g=>g.key===k)) keyGroups.push({key:k,label:label(k),slot:'key',items:uniq(KEYS[k])}); });

  return [
    {n:'01', word:'Open', groups:[
      {label:'Background', slot:'bg',    items:uniq(SH.background)},
      {label:'Hinge',      slot:'hinge', items:uniq(T.open.hinge)},
      {label:'Aim',        slot:'aim',   items:uniq(T.open.aim)}
    ]},
    {n:'02', word:'Argue', groups: signGroups.concat(
      [{label:'Stance', slot:'view', items:uniq(VIEW)}], keyGroups)},
    {n:'03', word:'Close', groups:[
      {label:'Summary', slot:'sum',     items:uniq(T.close.summary)},
      {label:'Stance',  slot:'stance',  items:uniq(T.close.stance)},
      {label:'Verdict', slot:'verdict', items:uniq(T.close.verdict)}
    ]}
  ];
}

/* the expression shown inside the chain the student is currently holding */
function demoLine(slot,val){
  const o=cur('open'), a=S.argue[0].h[S.argue[0].i], c=cur('close');
  if(slot==='bg')      return `<span class="lead">${fmt(val)}</span> <span class="soft">${o.hinge} <span class="gap">...</span>. ${fmt(o.aim)}</span>`;
  if(slot==='hinge')   return `<span class="lead">${fmt(o.bg)}</span> <span class="soft">${val} <span class="gap">...</span>. ${fmt(o.aim)}</span>`;
  if(slot==='aim')     return `<span class="lead">${fmt(o.bg)}</span> <span class="soft">${o.hinge} <span class="gap">...</span>. ${fmt(val)}</span>`;
  if(slot==='sign')    return `<span class="sig">${val}</span> <span class="view">${a.view}</span> ${fmt(a.key)}`;
  if(slot==='view')    return `<span class="sig">${a.sign}</span> <span class="view">${val}</span> ${fmt(a.key)}`;
  if(slot==='key')     return `<span class="sig">${a.sign}</span> <span class="view">${a.view}</span> ${fmt(val)}`;
  if(slot==='sum')     return `${fmt(val)} <span class="view">${c.stance}</span> ${fmt(c.verdict)}`;
  if(slot==='stance')  return `${fmt(c.summary)} <span class="view">${val}</span> ${fmt(c.verdict)}`;
  if(slot==='verdict') return `${fmt(c.summary)} <span class="view">${c.stance}</span> ${fmt(val)}`;
  return fmt(val);
}
const BLOOM_TAG={bg:'In a full opening',hinge:'In a full opening',aim:'In a full opening',
  sign:'In a body line',view:'In a body line',key:'In a body line',
  sum:'In a closing line',stance:'In a closing line',verdict:'In a closing line'};

function renderPhrases(){
  const stack=document.getElementById('stack');
  const cards=phraseCards();
  if(!cards.length){ stack.innerHTML='<div class="state">No pools for this type.</div>'; return; }
  stack.innerHTML = cards.map((c,ci)=>{
    const groups=c.groups.filter(g=>g.items.length).map(g=>{
      const items=g.items.map(v=>
        `<div class="pitem" onclick="pbloom(this)">${fmt(v)}` +
        `<div class="pbloom"><div class="pbloom-tag">${BLOOM_TAG[g.slot]||'In a line'}</div>` +
        `<div class="pbloom-line">${demoLine(g.slot,v)}</div></div></div>`
      ).join('');
      return `<div class="pgroup"><div class="pgroup-title">${g.label}<span class="pgroup-count">${g.items.length}</span></div>${items}</div>`;
    }).join('');
    return `<div class="card"><div class="band"><span class="band-num">${c.n}</span><span class="band-word">${c.word}</span></div>
      <div class="content">${groups}</div></div>` +
      (ci<cards.length-1?'<div class="flow">&#9662;</div>':'');
  }).join('');
  stack.classList.add('has-cards');
}
function pbloom(el){
  const wasOpen=el.classList.contains('open');
  const p=el.parentElement;
  if(p) p.querySelectorAll('.pitem.open').forEach(x=>{ if(x!==el) x.classList.remove('open'); });
  el.classList.toggle('open',!wasOpen);
  if(!wasOpen) sndRoll();
}
window.pbloom=pbloom;

/* ── view switch ── */
let view='cards';
function setView(v){
  view=v;
  const c=document.getElementById('mbCards'),p=document.getElementById('mbPhrases');
  if(c)c.classList.toggle('active',v==='cards');
  if(p)p.classList.toggle('active',v==='phrases');
  const h=document.getElementById('hint');
  if(h) h.textContent = v==='phrases'
    ? 'Every way of filling each slot. Tap one to see it inside a line.'
    : 'Tap any line to say it another way.';
  render();
}
window.setView=setView;

function render(){
  if(view==='phrases'){ renderPhrases(); return; }
  const openLine=lineHTML('open');
  const argueLines=[0,1,2].map(i=>`<div class="rline" id="rl-argue-${i}" data-slot="argue" data-idx="${i}" role="button" tabindex="0" aria-label="Another way of saying this line"><div class="rtext"><div class="line" id="ln-argue-${i}">${lineHTML('argue',i)}</div><div class="dev">...</div></div>${navBack()}</div>`).join('');
  const closeLine=lineHTML('close');
  const hingeNote=`<div class="card-note"><span class="k">*</span>`+(T.open.hinge||[]).map((h,i)=>`<span class="opt" data-hinge="${i}" role="button" tabindex="0" onclick="setHinge(event,${i})">${h}</span>`).join('')+`</div>`;
  const supportNote=`<div class="card-note"><span class="k">*</span>`+(SH.support||[]).map(s=>`<span class="opt">${s.move}</span>`).join('')+`</div>`;

  document.getElementById('stack').innerHTML=`
    <div class="card"><div class="band"><span class="band-num">01</span><span class="band-word">Open</span></div>
      <div class="content"><div class="rline" id="rl-open" data-slot="open" role="button" tabindex="0" aria-label="Another way of opening"><div class="rtext"><div class="line" id="ln-open">${openLine}</div></div>${navBack()}</div>${hingeNote}</div></div>
    <div class="flow">&#9662;</div>
    <div class="card"><div class="band"><span class="band-num">02</span><span class="band-word">Argue</span></div>
      <div class="content">${argueLines}${supportNote}</div></div>
    <div class="flow">&#9662;</div>
    <div class="card"><div class="band"><span class="band-num">03</span><span class="band-word">Close</span></div>
      <div class="content"><div class="rline" id="rl-close" data-slot="close" role="button" tabindex="0" aria-label="Another way of closing"><div class="rtext"><div class="line" id="ln-close">${closeLine}</div></div>${navBack()}</div></div></div>`;
  document.getElementById('stack').classList.add('has-cards');
  updateBack('open'); updateBack('close');
  for(let i=0;i<3;i++) updateBack('argue',i);
  syncHinge();
  demonstrate();
}

/* ── FOOTER NAV ── */
function switchMode(mode){
  const map={question:'essay-question.html',plan:'essay-plan.html',sample:'essay-sample.html'};
  if(map[mode])window.location.href=map[mode];
}
window.switchMode=switchMode;

bindGestures();
init();
</script>
