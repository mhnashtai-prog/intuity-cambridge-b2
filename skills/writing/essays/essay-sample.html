<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Essay Sample — INTUITY</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Barlow+Condensed:wght@700;800;900&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#f0efec;--ink:#111111;--white:#ffffff;
  --acc:#3d9e95; /* set per essay type, matches Question/Plan/Model */
  --marker:#2563EB;--marker-bg:rgba(37,99,235,0.10); /* INTUITY's informational blue */
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;position:fixed;background:var(--bg);font-family:'Barlow',sans-serif;-webkit-font-smoothing:antialiased}
.shell{position:fixed;inset:0;display:flex;flex-direction:column}

/* ── TOPBAR — identical to Plan/Model ── */
.topbar{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0.65rem 1.25rem;background:rgba(240,239,236,0.95);backdrop-filter:blur(12px);border-bottom:1.5px solid rgba(0,0,0,0.07);z-index:100}
.back-link{text-decoration:none;font-size:0.72rem;font-weight:700;color:rgba(0,0,0,0.38);letter-spacing:0.05em;text-transform:uppercase;transition:color 0.2s}
.back-link:hover{color:rgba(0,0,0,0.65)}
.brand{font-family:'Barlow Condensed',sans-serif;font-size:0.7rem;font-weight:900;letter-spacing:0.28em;text-transform:uppercase;color:rgba(0,0,0,0.18)}
.topic-label{font-size:0.68rem;font-weight:700;color:rgba(0,0,0,0.38);letter-spacing:0.04em;text-align:right;max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}

/* ── STYLE TABS (Default / Alt 1 / Alt 2) — identical component to Question's filter-bar ── */
.filter-bar{flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:0.25rem;padding:0.45rem 1.1rem;background:rgba(240,239,236,0.8);border-bottom:1px solid rgba(0,0,0,0.06);overflow-x:auto}
.filter-bar::-webkit-scrollbar{display:none}
.ftab{background:transparent;border:none;padding:0.28rem 0.75rem;border-radius:2rem;font-family:'Barlow',sans-serif;font-size:0.58rem;font-weight:700;color:rgba(0,0,0,0.3);cursor:pointer;transition:all 0.2s;white-space:nowrap;letter-spacing:0.06em;text-transform:uppercase}
.ftab:hover{color:rgba(0,0,0,0.55);background:rgba(0,0,0,0.05)}
.ftab.active{background:var(--ink);color:#fff}

/* ── TOOL ROW ── */
.tool-row{flex-shrink:0;display:flex;align-items:center;gap:0.4rem;padding:0.45rem 1.1rem;background:rgba(240,239,236,0.8);border-bottom:1px solid rgba(0,0,0,0.06)}
.tool-btn{background:transparent;border:1.5px solid rgba(0,0,0,0.12);border-radius:2rem;padding:0.28rem 0.7rem;font-family:'Barlow',sans-serif;font-size:0.58rem;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:rgba(0,0,0,0.4);cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:0.3rem;white-space:nowrap}
.tool-btn:hover{border-color:rgba(0,0,0,0.28);color:rgba(0,0,0,0.68)}
.tool-btn.active{background:var(--ink);border-color:var(--ink);color:#fff}
.tool-spacer{flex:1}
.badge{font-size:0.52rem;font-weight:800;background:var(--marker-bg);color:var(--marker);padding:0.06rem 0.32rem;border-radius:1rem;display:none}
.badge.on{display:inline}
.view-switch{display:flex;background:rgba(10,10,10,0.06);border:1.5px solid rgba(0,0,0,0.1);border-radius:2rem;padding:0.16rem}
.vs-opt{border:none;background:transparent;cursor:pointer;font-family:'Barlow',sans-serif;font-size:0.56rem;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:rgba(0,0,0,0.4);padding:0.26rem 0.65rem;border-radius:1.5rem;transition:all 0.2s}
.vs-opt.active{background:var(--ink);color:#fff}

/* ── X-RAY / PHRASES LEGEND — answers "what does blue mean" ── */
.legend{flex-shrink:0;text-align:center;font-family:'Instrument Sans',sans-serif;font-size:0.68rem;color:rgba(0,0,0,0.32);padding:0.3rem 1rem;background:rgba(240,239,236,0.8);display:none}
.legend.show{display:block}
.legend b{color:var(--marker);font-weight:600}

.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}

/* ── POSTER — identical component to Plan ── */
.poster{width:min(620px,92vw);height:min(600px,84vh);background:var(--white);border-radius:1.4rem;display:flex;flex-direction:column;overflow:hidden;position:relative;box-shadow:0 2px 0 rgba(255,255,255,0.8) inset,4px 6px 0 rgba(0,0,0,0.06),0 20px 50px rgba(0,0,0,0.18),0 4px 12px rgba(0,0,0,0.1);animation:cardUp 0.5s cubic-bezier(0.22,1,0.36,1) both}
@keyframes cardUp{0%{opacity:0;transform:scale(0.94) translateY(16px)}100%{opacity:1;transform:scale(1) translateY(0)}}
.card-scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:1.6rem 1.9rem 1.2rem}
.card-scroll::-webkit-scrollbar{width:3px}
.card-scroll::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.1);border-radius:2px}

.para-label{font-family:'Barlow Condensed',sans-serif;font-size:0.62rem;font-weight:800;letter-spacing:0.16em;text-transform:uppercase;color:var(--acc);margin-bottom:0.7rem}
.para-text{font-family:'Instrument Sans',sans-serif;font-size:1rem;line-height:1.75;color:rgba(0,0,0,0.8);margin-bottom:1.3rem}
.para-text:last-child{margin-bottom:0}

.dm{color:var(--marker);font-weight:600;background:var(--marker-bg);padding:0.05em 0.2em;border-radius:3px}
.phrase-enhanced{display:inline}
.phrase-text{color:var(--marker);font-weight:600;border-bottom:1.5px solid rgba(37,99,235,0.4);cursor:pointer;padding:0.05em 0}
.phrase-text:hover{background:var(--marker-bg);border-radius:2px}

.state-msg{padding:2.5rem 1.5rem;text-align:center;font-family:'Instrument Sans',sans-serif;font-size:0.95rem;color:rgba(0,0,0,0.32);line-height:1.6}

/* ── SLIDE NAV — identical component to Plan (Paragraphs mode only) ── */
.slide-nav{flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:1.2rem;padding:0.55rem 1rem 0.5rem}
.slide-nav.hidden{display:none}
.slide-arrow{background:none;border:1.5px solid rgba(0,0,0,0.12);width:2rem;height:2rem;border-radius:50%;font-size:0.8rem;cursor:pointer;color:rgba(0,0,0,0.35);display:flex;align-items:center;justify-content:center;transition:all 0.18s}
.slide-arrow:hover:not(:disabled){border-color:rgba(0,0,0,0.3);color:var(--ink)}
.slide-arrow:disabled{opacity:0.25;cursor:default}
.page-counter{font-family:'Barlow Condensed',sans-serif;font-size:0.68rem;font-weight:700;letter-spacing:0.08em;color:rgba(0,0,0,0.32);text-transform:uppercase}
.accent-bar{height:4px;background:var(--acc);flex-shrink:0;border-radius:0 0 1.4rem 1.4rem;opacity:0.7}

/* ── FOOTER — identical to Question/Plan/Model ── */
.foot{flex-shrink:0;display:flex;justify-content:center;padding:0.5rem 1rem calc(env(safe-area-inset-bottom,0px) + 0.55rem);background:rgba(240,239,236,0.95);border-top:1px solid rgba(0,0,0,0.06)}
.nav-pill{display:flex;gap:0.12rem;background:rgba(10,10,10,0.07);border-radius:2rem;padding:0.25rem 0.28rem}
.nb{background:transparent;border:none;padding:0.35rem 0.75rem;border-radius:1.5rem;font-family:'Barlow',sans-serif;font-size:0.6rem;letter-spacing:0.03em;color:rgba(0,0,0,0.28);cursor:pointer;transition:all 0.22s;white-space:nowrap;min-height:28px;font-weight:700;text-transform:uppercase}
.nb.on{background:var(--ink);color:#fff;font-weight:800}
.nb:hover:not(.on){color:rgba(0,0,0,0.5)}

/* ── ALTERNATIVES MODAL (bottom sheet) — kept, retinted ── */
.alt-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(6px);z-index:500;display:none;align-items:flex-end;justify-content:center;padding:1rem}
.alt-overlay.open{display:flex;animation:overlayFade 0.2s ease}
@keyframes overlayFade{from{opacity:0}to{opacity:1}}
.alt-modal{background:var(--white);border-radius:1.2rem 1.2rem 1rem 1rem;width:100%;max-width:480px;max-height:60vh;overflow:hidden;display:flex;flex-direction:column;animation:modalUp 0.3s cubic-bezier(0.34,1.56,0.64,1);box-shadow:0 -4px 40px rgba(0,0,0,0.25)}
@keyframes modalUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.alt-header{padding:1rem 1.1rem 0.8rem;border-bottom:1px solid rgba(0,0,0,0.07);display:flex;align-items:flex-start;justify-content:space-between}
.alt-title{font-family:'Barlow Condensed',sans-serif;font-size:0.85rem;font-weight:800;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink)}
.alt-phrase{font-family:'Instrument Sans',sans-serif;font-size:0.8rem;color:var(--marker);font-weight:600;margin-top:0.2rem}
.alt-close{background:rgba(0,0,0,0.06);border:none;width:28px;height:28px;border-radius:50%;font-size:1rem;color:rgba(0,0,0,0.45);cursor:pointer;display:flex;align-items:center;justify-content:center}
.alt-close:hover{background:rgba(0,0,0,0.1)}
.alt-body{overflow-y:auto;padding:0.6rem;flex:1}
.alt-category{font-family:'Barlow Condensed',sans-serif;font-size:0.56rem;font-weight:800;text-transform:uppercase;letter-spacing:0.1em;color:rgba(0,0,0,0.3);padding:0.4rem 0.5rem 0.5rem}
.alt-item{padding:0.6rem 0.75rem;border-radius:0.6rem;font-family:'Instrument Sans',sans-serif;font-size:0.85rem;font-weight:500;color:rgba(0,0,0,0.75);cursor:pointer;transition:all 0.15s;display:flex;align-items:center;justify-content:space-between;gap:0.5rem}
.alt-item:hover{background:var(--marker-bg);color:var(--marker)}
.alt-copy-hint{font-family:'Barlow Condensed',sans-serif;font-size:0.55rem;font-weight:700;color:rgba(0,0,0,0.22);text-transform:uppercase;flex-shrink:0}

.toast{position:fixed;bottom:5rem;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:0.5rem 1.15rem;border-radius:2rem;font-family:'Barlow',sans-serif;font-size:0.72rem;font-weight:700;opacity:0;pointer-events:none;transition:opacity 0.25s;z-index:600;white-space:nowrap}
.toast.show{opacity:1}

@media(max-width:600px){
  .poster{width:min(400px,94vw);height:min(560px,82vh)}
  .card-scroll{padding:1.2rem 1.3rem 1rem}
  .para-text{font-size:0.92rem;line-height:1.65}
  .tool-row{flex-wrap:wrap;row-gap:0.35rem}
}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <a class="back-link" href="/skills/writing/essays/essay-question">← Essays</a>
    <span class="brand">INTUITY</span>
    <span class="topic-label" id="topicLabel">Sample</span>
  </div>

  <div class="filter-bar" id="styleBar">
    <button class="ftab active" onclick="selectStyle('default')">Default</button>
    <button class="ftab" onclick="selectStyle('alternative1')">Alternative 1</button>
    <button class="ftab" onclick="selectStyle('alternative2')">Alternative 2</button>
  </div>

  <div class="tool-row">
    <button class="tool-btn" id="xrayBtn" onclick="toggleXRay()">X-Ray</button>
    <button class="tool-btn" id="phraseBtn" onclick="togglePhrases()">Phrases <span class="badge" id="phraseBadge"></span></button>
    <button class="tool-btn" id="copyBtn" onclick="copyAllParagraphs()">Copy essay</button>
    <div class="tool-spacer"></div>
    <div class="view-switch">
      <button class="vs-opt active" id="switchParagraphs" onclick="setViewMode(false)">Paragraphs</button>
      <button class="vs-opt" id="switchFullText" onclick="setViewMode(true)">Full Text</button>
    </div>
  </div>
  <div class="legend" id="legend"><b>Blue</b> = discourse markers / borrowable phrases — tap an underlined phrase for alternatives.</div>

  <div class="stage">
    <div class="poster">
      <div class="card-scroll" id="contentArea"><div class="state-msg">Loading sample…</div></div>
      <div class="slide-nav" id="slideNav">
        <button class="slide-arrow" id="btnPrev" onclick="goPrev()">←</button>
        <div class="page-counter" id="pageCounter">—</div>
        <button class="slide-arrow" id="btnNext" onclick="goNext()">→</button>
      </div>
      <div class="accent-bar"></div>
    </div>
  </div>

  <div class="foot">
    <div class="nav-pill">
      <button class="nb" onclick="navTo('question')">Question</button>
      <button class="nb" onclick="navTo('plan')">Plan</button>
      <button class="nb" onclick="navTo('model')">Model</button>
      <button class="nb on" onclick="navTo('sample')">Sample</button>
    </div>
  </div>
</div>

<div class="alt-overlay" id="altOverlay" onclick="closeAlt(event)">
  <div class="alt-modal" onclick="event.stopPropagation()">
    <div class="alt-header">
      <div><div class="alt-title">Alternatives</div><div class="alt-phrase" id="altPhrase"></div></div>
      <button class="alt-close" onclick="closeAlt()">×</button>
    </div>
    <div class="alt-body" id="altBody"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ══ TYPE ACCENT — same map as Plan/Model, keeps the flag colour alive here too ══ */
const TYPE_COLOR={
  'opinion':'#3d9e95','for-against':'#e8723a','problem-solution':'#7b5ea7',
  'cause-effect':'#c94f6d','agree-disagree':'#4a7fb5','speculation-trends':'#c08b2f'
};
function applyAccent(type){
  document.documentElement.style.setProperty('--acc', TYPE_COLOR[type]||TYPE_COLOR['opinion']);
}

/* ══ STATE ══ */
let question=null, paragraphs=[], currentPara=0, currentStyle='default';
let xrayOn=false, phrasesOn=false, fullTextMode=false; /* Paragraphs is the default — this is the paper companion view */
let phraseDB={}, phraseReady=false, sampleData=null;
const PARA_LABELS=['Introduction','Body 1','Body 2','Body 3','Conclusion'];

/* ══ DISCOURSE MARKERS ══ */
const DM=['To begin with','First of all','Firstly','Secondly','Thirdly','In addition','Moreover','Furthermore',
  'What is more','Besides','Additionally','On the other hand','However','Nevertheless','Nonetheless','In contrast',
  'By contrast','Conversely','Whereas','Although','Though','Despite','In spite of','Therefore','Thus','Hence',
  'Consequently','As a result','As a consequence','For this reason','Due to','Because of','Owing to','For example',
  'For instance','Such as','Namely','In particular','Specifically','To illustrate','All things considered',
  'In conclusion','To conclude','To sum up','In summary','Overall','All in all','On the whole','Finally','Lastly',
  'In my opinion','In my view','I believe','Personally','Clearly','Undoubtedly','Certainly','Indeed','Meanwhile',
  'Subsequently','Eventually','Ultimately'].sort((a,b)=>b.length-a.length);
function wrapDM(html){
  let out=html;
  DM.forEach(dm=>{
    const esc=dm.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    out=out.replace(new RegExp(`(?<![a-zA-Z])(${esc})(?![a-zA-Z])`,'g'),`<span class="dm">$1</span>`);
  });
  return out;
}

/* ══ PHRASE DATABASE ══ */
function buildPhraseDB(json){
  phraseDB={};
  const addEntry=(category,items)=>{
    if(!Array.isArray(items))return;
    items.forEach(item=>{
      const raw=(typeof item==='string')?item:(item.phrase||item.text||'');
      const phrase=raw.replace(/[.,;:!?]+$/,'').trim();
      if(!phrase||phrase.split(/\s+/).length<2)return;
      if(!phraseDB[phrase])phraseDB[phrase]={category,alternatives:[]};
      items.forEach(sib=>{
        const s=((typeof sib==='string')?sib:(sib.phrase||sib.text||'')).replace(/[.,;:!?]+$/,'').trim();
        if(s&&s!==phrase&&!phraseDB[phrase].alternatives.includes(s))phraseDB[phrase].alternatives.push(s);
      });
    });
  };
  if(Array.isArray(json))json.forEach(e=>addEntry(e.category||'Phrases',e.phrases||e.items||[]));
  else Object.entries(json).forEach(([cat,val])=>addEntry(cat,Array.isArray(val)?val:(val.phrases||val.items||[])));
  phraseReady=Object.keys(phraseDB).length>0;
}
function enhancePhrases(html){
  if(!phraseReady)return{html,count:0};
  let out=html,count=0;const seen=new Set();
  Object.keys(phraseDB).filter(p=>phraseDB[p].alternatives.length>0).sort((a,b)=>b.length-a.length).forEach(phrase=>{
    const esc=phrase.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    const re=new RegExp(`(?<![a-zA-Z<"'])(${esc})(?![a-zA-Z<"'])`,'gi');
    out=out.replace(re,match=>{
      const k=match.toLowerCase();
      if(seen.has(k))return match;
      seen.add(k);count++;
      const safe=phrase.replace(/'/g,"\\'").replace(/"/g,'\\"');
      return `<span class="phrase-enhanced"><span class="phrase-text" onclick="showAlts('${safe}')">${match}</span></span>`;
    });
  });
  return{html:out,count};
}

/* ══ PARAGRAPH EXTRACTION ══ */
function extractParagraphs(html){
  const div=document.createElement('div');div.innerHTML=html;
  const ps=div.querySelectorAll('p');
  if(ps.length>1) return Array.from(ps).map(p=>p.innerHTML.trim()).filter(Boolean);
  let raw = ps.length===1 ? ps[0].innerHTML : html;
  let parts = raw.split(/(?:<br\s*\/?>\s*){2,}/i);      /* <br><br> as paragraph break */
  if(parts.length<2) parts = raw.split(/\n\s*\n/);        /* literal blank-line break */
  parts = parts.map(s=>s.trim()).filter(Boolean);
  return parts.length ? parts : [raw.trim()].filter(Boolean);
}

/* ══ VIEW MODE ══ */
function setViewMode(isFullText){
  fullTextMode=isFullText;
  document.getElementById('switchFullText').classList.toggle('active',isFullText);
  document.getElementById('switchParagraphs').classList.toggle('active',!isFullText);
  document.getElementById('slideNav').classList.toggle('hidden',isFullText);
  render();
}

/* ══ RENDER ══ */
function updateLegend(){
  document.getElementById('legend').classList.toggle('show', xrayOn||phrasesOn);
}
function render(){
  const box=document.getElementById('contentArea');
  if(!paragraphs.length){box.innerHTML='<div class="state-msg">No sample essay found for this question yet.</div>';return;}
  let totalCount=0;
  if(fullTextMode){
    box.innerHTML=paragraphs.map(para=>{
      let h=para;
      if(phrasesOn){const r=enhancePhrases(h);h=r.html;totalCount+=r.count;}
      if(xrayOn)h=wrapDM(h);
      return `<div class="para-text">${h}</div>`;
    }).join('');
  }else{
    let h=paragraphs[currentPara]||'';
    if(phrasesOn){const r=enhancePhrases(h);h=r.html;totalCount=r.count;}
    if(xrayOn)h=wrapDM(h);
    box.innerHTML=`<div class="para-label">${PARA_LABELS[currentPara]||'Paragraph '+(currentPara+1)}</div><div class="para-text">${h}</div>`;
    updateNav();
  }
  const badge=document.getElementById('phraseBadge');
  if(phrasesOn&&totalCount>0){badge.textContent=totalCount;badge.classList.add('on');}else{badge.classList.remove('on');}
  updateLegend();
  box.scrollTop=0;
}

/* ══ PARAGRAPH NAV ══ */
function updateNav(){
  document.getElementById('btnPrev').disabled=currentPara===0;
  document.getElementById('btnNext').disabled=currentPara>=paragraphs.length-1;
  document.getElementById('pageCounter').textContent=`${PARA_LABELS[currentPara]||'P'+(currentPara+1)} · ${currentPara+1}/${paragraphs.length}`;
}
function goPrev(){if(currentPara>0){currentPara--;render();}}
function goNext(){if(currentPara<paragraphs.length-1){currentPara++;render();}}

/* ══ TOOLS ══ */
function toggleXRay(){xrayOn=!xrayOn;document.getElementById('xrayBtn').classList.toggle('active',xrayOn);render();}
function togglePhrases(){
  if(!phraseReady){showToast('Phrase bank not loaded');return;}
  phrasesOn=!phrasesOn;document.getElementById('phraseBtn').classList.toggle('active',phrasesOn);render();
}
function copyAllParagraphs(){
  const full=paragraphs.map(p=>{const d=document.createElement('div');d.innerHTML=p;return(d.textContent||'').trim();}).join('\n\n');
  navigator.clipboard.writeText(full).then(()=>showToast('Full essay copied ✓')).catch(()=>showToast('Copy failed'));
}

/* ══ STYLE SELECTOR ══ */
function selectStyle(style){
  currentStyle=style;
  document.querySelectorAll('#styleBar .ftab').forEach((b,i)=>{
    b.classList.toggle('active', ['default','alternative1','alternative2'][i]===style);
  });
  if(sampleData){
    const html=sampleData.styles?.[style]||sampleData.styles?.default||sampleData.html||'';
    paragraphs=extractParagraphs(html);
    currentPara=0;
    render();
  }
}

/* ══ ALTERNATIVES MODAL ══ */
function showAlts(phrase){
  const key=Object.keys(phraseDB).find(k=>k.toLowerCase()===phrase.toLowerCase())||phrase;
  const data=phraseDB[key];
  if(!data||!data.alternatives.length){showToast('No alternatives found');return;}
  document.getElementById('altPhrase').textContent=`"${phrase}"`;
  document.getElementById('altBody').innerHTML=
    `<div class="alt-category">${data.category} — ${data.alternatives.length} alternatives</div>`+
    data.alternatives.map(alt=>{
      const safe=alt.replace(/'/g,"\\'").replace(/"/g,'\\"');
      return `<div class="alt-item" onclick="copyAlt('${safe}')"><span>${alt}</span><span class="alt-copy-hint">tap to copy</span></div>`;
    }).join('');
  document.getElementById('altOverlay').classList.add('open');
}
function copyAlt(text){navigator.clipboard.writeText(text).then(()=>{showToast('Copied: '+text);closeAlt();}).catch(()=>showToast('Copy failed'));}
function closeAlt(e){if(e&&e.target.id!=='altOverlay')return;document.getElementById('altOverlay').classList.remove('open');}

/* ══ TOAST ══ */
let _tt;
function showToast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(_tt);_tt=setTimeout(()=>el.classList.remove('show'),2200);}

/* ══ KEYBOARD + SWIPE (Paragraphs mode only) ══ */
document.addEventListener('keydown',e=>{
  if(fullTextMode)return;
  if(e.key==='ArrowRight')goNext();
  if(e.key==='ArrowLeft')goPrev();
  if(e.key==='Escape')closeAlt();
});
let _tx=0;
if('ontouchstart' in window){
  document.addEventListener('touchstart',e=>{_tx=e.changedTouches[0].screenX;});
  document.addEventListener('touchend',e=>{
    if(fullTextMode)return;
    const dx=e.changedTouches[0].screenX-_tx;
    if(dx<-50)goNext();
    if(dx>50)goPrev();
  });
}

/* ══ FOOTER NAV — fixed to match Question/Plan/Model's actual filenames ══ */
function navTo(dest){
  if(dest==='sample')return;
  if(question)sessionStorage.setItem('currentQuestion',JSON.stringify(question));
  const map={question:'essay-question.html',plan:'essay-plan.html',model:'essay-cards.html'};
  if(map[dest])window.location.href=map[dest];
}

/* ══ INIT ══ */
async function init(){
  try{question=JSON.parse(sessionStorage.getItem('currentQuestion'));}catch(e){}
  if(!question){
    document.getElementById('contentArea').innerHTML='<div class="state-msg">No question selected.<br>Return to Questions to choose one.</div>';
    return;
  }
  applyAccent((question.essayType||'opinion').toLowerCase());
  if(question.mainQuestion||question.question)
    document.getElementById('topicLabel').textContent=(question.mainQuestion||question.question).substring(0,40).toUpperCase();

  const lookupId=question.questionId||question.id;

  fetch('data/essay-phrases.json').then(r=>r.ok?r.json():null).then(d=>{if(d)buildPhraseDB(d);}).catch(()=>{});

  try{
    const res=await fetch('data/samples.json');
    if(!res.ok)throw new Error('samples.json not found');
    const data=await res.json();
    const pool=Array.isArray(data)?data:(data.opinion||data.samples||data.essays||[]);
    const match=pool.find(s=>s.id===lookupId);
    if(!match){
      document.getElementById('contentArea').innerHTML=`<div class="state-msg">No sample essay for this question yet.<br><small style="opacity:0.4">id: ${lookupId}</small></div>`;
      return;
    }
    sampleData=match;
    const html=match.styles?.default||match.html||match.text||'';
    paragraphs=extractParagraphs(html);
    render();
  }catch(err){
    document.getElementById('contentArea').innerHTML=`<div class="state-msg">Could not load samples.json<br><small style="opacity:0.4">${err.message}</small></div>`;
  }
}
init();
</script>
