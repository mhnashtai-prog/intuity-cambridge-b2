<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Sample Essay — INTUITY</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Barlow:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&family=Barlow+Condensed:wght@700;800;900&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500&family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=7">
<link rel="stylesheet" href="/data/writing/writing.css?v=2">
<style>
:root{
  --bg:#f0efec;--ink:#111111;--white:#ffffff;--rule:rgba(0,0,0,0.07);
  --acc:#7b5ea7; /* fallback only — applyAccent(question.essayType) overrides this at init */
  --gold:#C9A961;

  /* category colours — mirror the Model page's phrase families:
     discourse = signpost / linking words, opinion = view / stance phrases,
     causal    = reason → result chain (the "support move" layer) */
  --c-discourse:#2563EB; --c-discourse-bg:rgba(37,99,235,0.10);
  --c-opinion:#7b5ea7;   --c-opinion-bg:rgba(123,94,167,0.12);
  --c-causal:#1a8f5e;    --c-causal-bg:rgba(26,143,94,0.10);
  --c-frame:#6a4374;     --c-frame-bg:rgba(106,67,116,0.10);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;position:fixed;background:var(--bg);font-family:'Barlow',sans-serif;-webkit-font-smoothing:antialiased}
.shell{position:fixed;inset:0;display:flex;flex-direction:column}

/* ── TOPBAR ── */
.topbar{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0.65rem 1.25rem;background:rgba(240,239,236,0.95);backdrop-filter:blur(12px);border-bottom:1.5px solid rgba(0,0,0,0.07);z-index:100}
.back-link{text-decoration:none;font-size:0.72rem;font-weight:700;color:rgba(0,0,0,0.38);letter-spacing:0.05em;text-transform:uppercase;transition:color 0.2s}
.back-link:hover{color:rgba(0,0,0,0.65)}
.brand{font-family:'Barlow Condensed',sans-serif;font-size:0.7rem;font-weight:900;letter-spacing:0.28em;text-transform:uppercase;color:rgba(0,0,0,0.18)}
.topic-label{font-size:0.68rem;font-weight:700;color:rgba(0,0,0,0.38);letter-spacing:0.04em;text-align:right;max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}

/* ── STAGE ── */
.stage{flex:1;min-height:0;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:.5rem 0}

/* ── FOOTER NAV ── */
.foot{flex-shrink:0;display:flex;justify-content:center;padding:0.5rem 1rem calc(env(safe-area-inset-bottom,0px) + 0.55rem);background:rgba(240,239,236,0.95);border-top:1px solid rgba(0,0,0,0.06)}
.nav-pill{display:flex;gap:0.12rem;background:rgba(10,10,10,0.07);border-radius:2rem;padding:0.25rem 0.28rem}
.nb{background:transparent;border:none;padding:0.35rem 0.75rem;border-radius:1.5rem;font-family:'Barlow',sans-serif;font-size:0.6rem;letter-spacing:0.03em;color:rgba(0,0,0,0.28);cursor:pointer;transition:all 0.22s;white-space:nowrap;min-height:28px;font-weight:700;text-transform:uppercase}
.nb.on{background:var(--ink);color:#fff;font-weight:800}
.nb:hover:not(.on){color:rgba(0,0,0,0.5)}

/* ── POSTER CARD ── */
.poster{
  /* SIZED AGAINST ITS CONTAINER, NOT THE VIEWPORT.
     83vh measured the whole window, but .poster lives in .stage — the
     window minus the header and the footer. On a short screen 83vh is
     taller than the stage, and align-items:center splits the excess, so
     the card ran up under the header and down under the foot. 100% is the
     stage; min() keeps the 560px ceiling on tall screens. */
  width:min(420px,90vw);height:min(560px,100%);max-height:100%;
  background:var(--white);border-radius:1.4rem;
  display:flex;flex-direction:column;overflow:hidden;position:relative;
  box-shadow:0 2px 0 rgba(255,255,255,0.8) inset,4px 6px 0 rgba(0,0,0,0.06),0 20px 50px rgba(0,0,0,0.18),0 4px 12px rgba(0,0,0,0.1);
  animation:cardUp 0.55s cubic-bezier(0.22,1,0.36,1) both;
}
@keyframes cardUp{
  0%{opacity:0;transform:scale(0.92) translateY(20px)}
  65%{opacity:1;transform:scale(1.01) translateY(-4px)}
  100%{opacity:1;transform:scale(1) translateY(0)}
}

/* ── FLAG ── */
.flag{position:absolute;top:-2px;left:1.8rem;width:56px;z-index:10;display:flex;flex-direction:column;align-items:center}
.flag-body{width:100%;padding:0.5rem 0 0.35rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.1rem;position:relative;background:var(--acc)}
.flag-num{font-family:'Barlow Condensed',sans-serif;font-size:1.9rem;font-weight:900;color:#fff;line-height:1;letter-spacing:-0.02em}
.flag-label{font-family:'Barlow Condensed',sans-serif;font-size:0.42rem;font-weight:900;color:rgba(255,255,255,0.75);letter-spacing:0.14em;text-transform:uppercase;line-height:1}
.flag-body::after{content:'';position:absolute;bottom:-8px;left:0;right:0;height:9px;background:var(--acc);clip-path:polygon(0% 0%,8.33% 100%,16.66% 0%,25% 100%,33.33% 0%,41.66% 100%,50% 0%,58.33% 100%,66.66% 0%,75% 100%,83.33% 0%,91.66% 100%,100% 0%)}

/* ── CARD TOOLBAR ── */
.card-toolbar{
  flex-shrink:0;padding:3.5rem 1rem 0.5rem;
  display:flex;align-items:center;gap:0.35rem;
  border-bottom:1px solid rgba(0,0,0,0.06);
  flex-wrap:wrap;
}

/* Style selector */
.style-btn{
  font-family:'Barlow Condensed',sans-serif;font-size:0.56rem;font-weight:900;
  letter-spacing:0.08em;text-transform:uppercase;
  padding:0.26rem 0.7rem;border-radius:999px;
  border:1.5px solid rgba(0,0,0,0.12);
  background:transparent;color:rgba(0,0,0,0.35);
  cursor:pointer;transition:all 0.2s;white-space:nowrap;
}
.style-btn:hover{border-color:rgba(0,0,0,0.25);color:rgba(0,0,0,0.65)}
.style-btn.active{background:var(--ink);border-color:var(--ink);color:#fff}
.style-btn.hidden{display:none}
.style-btn.guided{border-color:var(--acc);color:var(--acc)}
.style-btn.guided.active{background:var(--acc);border-color:var(--acc);color:#fff}

.toolbar-sep{width:1px;height:18px;background:rgba(0,0,0,0.08);flex-shrink:0;margin:0 0.1rem}

.toolbar-spacer{flex:1}

/* View toggle */
.view-toggle{display:flex;background:rgba(0,0,0,0.05);border-radius:999px;padding:0.18rem;gap:0.12rem}
.vt-btn{
  font-family:'Barlow Condensed',sans-serif;font-size:0.54rem;font-weight:900;
  letter-spacing:0.06em;text-transform:uppercase;
  padding:0.24rem 0.65rem;border-radius:999px;border:none;
  background:transparent;color:rgba(0,0,0,0.35);cursor:pointer;transition:all 0.2s;
}
.vt-btn:hover{color:rgba(0,0,0,0.65)}
.vt-btn.active{background:var(--ink);color:#fff}

/* X-Ray toggle — sits on its own row so it doesn't crowd style/view controls */
.xray-row{
  flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:0.5rem;
  padding:0.4rem 1.2rem;border-bottom:1px solid rgba(0,0,0,0.05);
}
.xray-toggle{display:flex;align-items:center;gap:0.4rem}
.xray-switch{
  width:30px;height:17px;border-radius:999px;background:rgba(0,0,0,0.12);
  position:relative;cursor:pointer;transition:background 0.2s;flex-shrink:0;
}
.xray-switch.on{background:var(--c-discourse)}
.xray-switch::after{
  content:'';position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;
  background:#fff;transition:transform 0.2s;box-shadow:0 1px 2px rgba(0,0,0,0.25);
}
.xray-switch.on::after{transform:translateX(13px)}
.xray-label{font-family:'Barlow Condensed',sans-serif;font-size:0.62rem;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(0,0,0,0.45)}
.legend{display:flex;gap:0.65rem;flex-wrap:wrap;justify-content:flex-end}
.legend-item{display:flex;align-items:center;gap:0.28rem;font-family:'Instrument Sans',sans-serif;font-size:0.62rem;color:rgba(0,0,0,0.42);white-space:nowrap}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.legend-dot.discourse{background:var(--c-discourse)}
.legend-dot.opinion{background:var(--c-opinion)}
.legend-dot.causal{background:var(--c-causal)}
.legend-dot.frame{background:var(--c-frame)}
.legend.hidden,.xray-row .legend.hidden{display:none}

/* ── SCROLL AREA ── */
.card-scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:1rem 1.2rem 0.5rem}
.card-scroll::-webkit-scrollbar{width:3px}
.card-scroll::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.1);border-radius:2px}

/* Essay text */
.para-label{
  font-family:'Barlow Condensed',sans-serif;font-size:0.52rem;font-weight:900;
  letter-spacing:0.18em;text-transform:uppercase;
  color:rgba(0,0,0,0.28);margin-bottom:0.5rem;
}
.para-text{
  font-family:'Instrument Sans',sans-serif;
  font-size:0.88rem;line-height:1.8;
  color:rgba(0,0,0,0.78);font-weight:400;
  margin-bottom:1.4rem;
}
.para-text:last-child{margin-bottom:0}

/* ── CATEGORY HIGHLIGHTING (X-Ray) ──
   These classes are authored directly into samples.json content —
   discourse = signpost/linking words, opinion = personal-view phrases,
   causal = reason→result chain. Colour-coding them (rather than re-detecting
   markers with a separate word list) keeps this page in sync with whatever
   phrase families the Model page teaches. */
/* ══ TOPIC SENTENCE — the expression that generated the paragraph ══ */
.topic-key{color:var(--c-discourse);cursor:pointer}
.topic-count{font-family:'Barlow Condensed',sans-serif;font-size:0.62em;font-weight:800;
  vertical-align:super;margin-left:0.12em;color:var(--c-discourse);opacity:0.75;cursor:pointer}
.topic-count:hover{opacity:1}
.alt-overlay{position:fixed;inset:0;background:rgba(20,18,22,0.5);backdrop-filter:blur(3px);
  z-index:500;display:none;align-items:flex-end;justify-content:center;padding:1rem}
.alt-overlay.open{display:flex}
.alt-modal{background:#fff;border-radius:1.1rem;width:100%;max-width:520px;max-height:70vh;
  overflow:hidden;display:flex;flex-direction:column;box-shadow:0 -4px 40px rgba(0,0,0,0.22)}
.alt-header{padding:1rem 1.15rem 0.8rem;border-bottom:1px solid rgba(0,0,0,0.07);
  display:flex;align-items:flex-start;justify-content:space-between;gap:0.6rem;flex-shrink:0}
.alt-title{font-family:'Barlow Condensed',sans-serif;font-size:0.9rem;font-weight:900;
  letter-spacing:0.04em;text-transform:uppercase;color:var(--ink)}
.alt-phrase{font-size:0.8rem;color:var(--c-discourse);font-weight:600;margin-top:0.15rem}
.alt-close{background:rgba(0,0,0,0.06);border:none;width:1.9rem;height:1.9rem;border-radius:50%;
  font-size:1rem;color:rgba(0,0,0,0.45);cursor:pointer;flex-shrink:0}
.alt-body{overflow-y:auto;padding:0.6rem;flex:1}
.alt-category{font-family:'Barlow Condensed',sans-serif;font-size:0.58rem;font-weight:800;
  letter-spacing:0.14em;text-transform:uppercase;color:rgba(0,0,0,0.3);padding:0.45rem 0.5rem 0.55rem}
.alt-item{padding:0.6rem 0.8rem;border-radius:0.55rem;font-family:'Instrument Sans',sans-serif;
  font-size:0.86rem;color:rgba(0,0,0,0.75);cursor:pointer}
.alt-item:hover{background:var(--c-discourse-bg);color:var(--c-discourse)}
.phrase-text{color:var(--c-discourse);cursor:pointer;border-bottom:1px dotted rgba(37,99,235,0.5)}
.xray-on .opinion{color:var(--c-opinion);font-weight:600;background:var(--c-opinion-bg);padding:0.05em 0.2em;border-radius:3px}
.xray-on .causal{color:var(--c-causal);font-weight:600;background:var(--c-causal-bg);padding:0.05em 0.2em;border-radius:3px}
.xray-on .frame{color:var(--c-frame);font-weight:600;background:var(--c-frame-bg);padding:0.05em 0.2em;border-radius:3px;border-bottom:1.5px dotted var(--c-frame)}


/* ══ BOARD MODE — classroom width, broadsheet columns ══ */
@media(min-width:820px){
  .poster{width:min(1180px,95vw);height:min(660px,88vh)}
  .card-scroll{padding:1.5rem 2.6rem 1.2rem}
  #infographic.board-cols .para-text{max-width:940px;margin:0 auto 1.6rem;font-size:1.22rem;line-height:1.95}
  #infographic:not(.board-cols) .para-label{max-width:660px;margin:0.4rem auto 0.6rem;font-size:0.62rem;text-align:center}
  #infographic:not(.board-cols) .para-text{max-width:660px;margin:0 auto;font-size:1.18rem;line-height:1.95}
  .state-msg{font-size:1rem}
}

/* ── PARA NAV ── */
.para-nav{
  /* Centred, for the same reason as the row below it: space-between threw
     the arrows into opposite corners of a 420px card, which is the furthest
     apart two controls that operate on the same thing can possibly be. */
  flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:.9rem;
  padding:0.5rem 1rem;border-top:1px solid rgba(0,0,0,0.06);
}
.para-nav.hidden{display:none}
.para-arrow{
  background:var(--acc);border:none;
  width:2.6rem;height:2.6rem;border-radius:50%;
  font-size:1.15rem;cursor:pointer;color:#fff;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.18s;box-shadow:0 3px 10px rgba(0,0,0,0.2);
}
.para-arrow:hover:not(:disabled){transform:scale(1.08);box-shadow:0 5px 14px rgba(0,0,0,0.28)}
.para-arrow:active:not(:disabled){transform:scale(0.95)}
.para-arrow:disabled{background:rgba(0,0,0,0.08);color:rgba(0,0,0,0.25);box-shadow:none;cursor:not-allowed}
.para-nav-label{
  font-family:'Barlow Condensed',sans-serif;font-size:0.78rem;font-weight:800;
  letter-spacing:0.1em;text-transform:uppercase;color:rgba(0,0,0,0.42);
}
  
/* ── ACCENT BAR ── */
.slot-nav{flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:.5rem;
  padding:.55rem .75rem;border-top:1px solid var(--rule,#BCB1A0);}
.slot-nav.hidden{display:none;}
.slot-arrow{width:34px;height:34px;border:none;border-radius:999px;
  background:var(--poster-fill,rgba(20,17,14,.09));color:var(--poster-ink,#14110E);
  font-size:.9rem;cursor:pointer;transition:background .15s,transform .12s;}
.slot-arrow:active{transform:scale(.94);background:var(--poster-fill-hi,rgba(20,17,14,.15));}
.slot-arrow:disabled{opacity:.35;cursor:default;}
.slot-modes{display:flex;gap:.3rem;justify-content:center;}
/* THE FOOTER IS CENTRED. The arrows were pinned to the corners with
   space-between, which on a 420px card put them as far from each other and
   from the eye as the geometry allowed — a control you have to go looking
   for. Centred, they sit under the thing they move. */
.slot-nav{flex-shrink:0;display:flex;flex-direction:column;align-items:center;
  gap:.4rem;padding:.55rem .75rem;border-top:1px solid var(--poster-rule,rgba(20,17,14,.2));}
.slot-nav.hidden{display:none;}
.slot-mode,.slot-arrow{
  font-family:var(--f-display,'Geist',sans-serif);font-weight:600;
  color:var(--poster-ink,#14110E);background:var(--poster-fill,rgba(20,17,14,.09));
  border:none;border-radius:var(--r-field,999px);cursor:pointer;
  transition:background .15s,color .15s,transform .1s cubic-bezier(.2,.8,.2,1);}
.slot-mode{font-size:.72rem;padding:.3rem .8rem;}
.slot-mode.active{background:var(--poster-ink,#14110E);color:var(--poster,#FAF8F5);}
.slot-arrow{width:32px;height:32px;font-size:.85rem;}
.slot-arrow:active:not(:disabled){transform:scale(.96);}
.slot-arrow:disabled{opacity:.34;cursor:default;}
@media(hover:hover){
  .slot-mode:hover:not(.active),.slot-arrow:hover:not(:disabled){
    background:var(--poster-fill-hi,rgba(20,17,14,.15));}
}
.slot-count{font-family:var(--f-mono,monospace);font-size:.6rem;letter-spacing:.12em;
  color:var(--poster-faint,rgba(20,17,14,.5));font-variant-numeric:tabular-nums;}

/* ── THE CARD IS A POSTER ──────────────────────────────────────────────
   Same object as the collocations card and the grammar rules: cut-square
   paper, a caramel block over a mono kicker, Anton for the placed word,
   --poster-body for the sentence. Caramel is the MARK and never a letter —
   2.7:1 is right for a rectangle and would fail for a word. */
/* ── THE GALLERY MODAL ─────────────────────────────────────────────────
   Poster on a scrim. Square corners, because paper is cut straight and
   --r-sheet is already 0 for that reason. Three weights and nothing else:
   a mono kicker in grey, the placed words in Anton black, the sentence in
   slim grey. Caramel appears twice — the 26x10 block and the key words —
   and never carries a whole line, because it measures 2.7:1 and is a mark,
   not a letter. */
.gal-scrim{position:fixed;inset:0;z-index:900;display:none;
  align-items:center;justify-content:center;padding:clamp(1rem,5vw,2rem);
  background:rgba(20,17,14,.34);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);}
.gal-scrim.open{display:flex;}
.gal-card{position:relative;width:min(560px,100%);max-height:84vh;overflow-y:auto;
  background:var(--poster,#FAF8F5);border-radius:var(--r-sheet,0);
  box-shadow:0 24px 60px -18px rgba(20,17,14,.38),0 6px 16px rgba(20,17,14,.14);
  padding:clamp(1.8rem,5vw,2.6rem) clamp(1.5rem,4.5vw,2.2rem)
          clamp(1.2rem,3.5vw,1.6rem);}
.gal-x{position:absolute;top:.9rem;right:1rem;border:none;background:none;
  font-size:1rem;line-height:1;padding:.4rem;cursor:pointer;
  color:var(--poster-faint,rgba(20,17,14,.5));}
.gal-x:hover{color:var(--poster-ink,#14110E);}
.gal-kick{display:flex;align-items:center;gap:9px;font-family:var(--f-mono,monospace);
  font-size:.56rem;letter-spacing:.22em;text-transform:uppercase;
  color:var(--poster-faint,rgba(20,17,14,.5));margin-bottom:1rem;}
.gal-kick i{display:block;width:26px;height:10px;flex:none;background:var(--caramel,#B0865C);}
.gal-head{font-family:'Anton',Impact,sans-serif;font-weight:400;letter-spacing:.01em;
  color:var(--poster-ink,#14110E);font-size:clamp(1.7rem,7vw,2.6rem);line-height:1.02;
  margin:0 0 .55rem;text-transform:uppercase;}
.gal-head::after{content:'';display:block;width:40px;height:3px;
  background:var(--poster-ink,#14110E);margin:.85rem 0 0;}
.gal-body{color:var(--poster-body,#5C5852);line-height:1.6;
  font-size:clamp(.85rem,3vw,.97rem);margin-top:1.1rem;
  border-top:1px solid var(--poster-rule,rgba(20,17,14,.2));padding-top:1.1rem;}
.gal-key{color:var(--accent-ink,#A7573C);font-weight:600;}
.gal-nav{display:flex;align-items:center;justify-content:center;gap:.9rem;margin-top:1.4rem;}
.gal-arrow{width:34px;height:34px;border:none;border-radius:var(--r-field,999px);
  background:var(--poster-fill,rgba(20,17,14,.09));color:var(--poster-ink,#14110E);
  font-size:.9rem;cursor:pointer;transition:background .15s,transform .1s;}
.gal-arrow:active:not(:disabled){transform:scale(.96);}
.gal-arrow:disabled{opacity:.34;cursor:default;}
@media(hover:hover){.gal-arrow:hover:not(:disabled){background:var(--poster-fill-hi,rgba(20,17,14,.15));}}
.gal-count{font-family:var(--f-mono,monospace);font-size:.6rem;letter-spacing:.12em;
  color:var(--poster-faint,rgba(20,17,14,.5));font-variant-numeric:tabular-nums;}
.card-cols{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;}
.accent-bar{height:4px;background:var(--acc);flex-shrink:0;border-radius:0 0 1.4rem 1.4rem;opacity:0.7}

/* ── STATE MSG ── */
.state-msg{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;gap:0.75rem;font-size:0.85rem;color:rgba(0,0,0,0.28);
  text-align:center;line-height:1.6;font-family:'Barlow',sans-serif;
}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:5rem;left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;
  padding:0.45rem 1.1rem;border-radius:2rem;
  font-family:'Barlow Condensed',sans-serif;font-size:0.7rem;font-weight:900;letter-spacing:0.06em;
  opacity:0;pointer-events:none;transition:opacity 0.25s;z-index:600;white-space:nowrap;
}
.toast.show{opacity:1}
</style>
</head>
<body data-writing="essays" data-stage="sample">
<div class="shell">

  <div class="topbar">
    <a class='back-link' href='/skills/writing/essays/essay-question'>← Essays</a>
    <span class="brand">INTUITY</span>
    <span class="topic-label" id="topicLabel">Sample</span>
  </div>

  <div class="stage">
    <div class="poster" id="posterCard">

      <div class="flag">
        <div class="flag-body">
          <span class="flag-num">05</span>
        </div>
      </div>

      <!-- Toolbar: style selector + view toggle -->
      <div class="card-toolbar">
        <button class="style-btn active" id="styleDefault"  onclick="selectStyle('default')">Default</button>
        <button class="style-btn"        id="styleAlt1"     onclick="selectStyle('alternative1')">Alt 1</button>
        <button class="style-btn"        id="styleAlt2"     onclick="selectStyle('alternative2')">Alt 2</button>
        <button class="style-btn guided hidden" id="styleGuided" onclick="selectStyle('guided')">Guided</button>
        <div class="toolbar-spacer"></div>
        <div class="view-toggle">
          <button class="vt-btn active" id="vtFull"  onclick="setViewMode(true)">Full</button>
          <button class="vt-btn"        id="vtParas" onclick="setViewMode(false)">Paragraphs</button>
        </div>
      </div>

      <!-- X-Ray toggle + legend -->
      <div class="xray-row">
        <div class="xray-toggle" onclick="toggleXray()">
          <div class="xray-switch on" id="xraySwitch"></div>
          <span class="xray-label">X-Ray</span>
        </div>
        <div class="legend" id="legend">
          <span class="legend-item"><span class="legend-dot discourse"></span>Signpost</span>
          <span class="legend-item"><span class="legend-dot opinion"></span>View</span>
          <span class="legend-item"><span class="legend-dot causal"></span>Reason → Result</span>
          <span class="legend-item"><span class="legend-dot frame"></span>Model frame</span>
        </div>
      </div>

      <!-- Content -->
      <div class="card-cols">
      <div class="card-scroll" id="infographic">
        <div class="state-msg">Loading…</div>
      </div>

      <!-- THE GALLERY HAS ITS OWN REGION.
           It used to be appended into #infographic, which is overflow-y:auto
           — so the poster rendered below the fold of the scroll area and the
           counter ticked over a card nobody could see. It sits outside the
           scroll now, which also lets it move beside the essay on a wide
           screen instead of under it. -->
      </div>

      <!-- Paragraph navigation (paragraphs mode only) -->
      <div class="para-nav hidden" id="paraNav">
        <button class="para-arrow" id="btnPrev" onclick="goPrev()" disabled>←</button>
        <div class="para-nav-label" id="paraLabel">Introduction</div>
        <button class="para-arrow" id="btnNext" onclick="goNext()">→</button>
      </div>

      <!-- ══ THE SECOND AXIS ══════════════════════════════════════════
           The row above moves ALONG the essay: introduction, then body,
           then conclusion. This one holds the slot still and moves ACROSS
           essays — sixty other introductions, then sixty other conclusions.

           That is the axis no other page in the product has, and it is the
           one that teaches the thing a model essay cannot: the function is
           fixed, the wording is not. A student who reads five samples end
           to end takes away five essays. A student who sees five
           introductions in the same slot takes away the slot, which is
           what the exam actually asks them to fill. -->
      <!-- ══ THE SECOND AXIS, IN TWO MODES ═══════════════════════════
           WHOLE — sixty other paragraphs that fill this same slot.
           PHRASES — the phrase bank for this slot: the openings, the
           thesis frames, the conclusion frames, in three variant groups.

           These are different grains of the same idea and the Hub had
           both. WHOLE shows a student what a finished introduction looks
           like; PHRASES shows the frame under it, with [topic] still a
           blank to fill. A student who has seen five introductions can
           imitate; one who has seen the fifteen frames can generate. -->
      <!-- The footer says two words and shows two arrows. Everything it
           used to say — the role, the group, the mode — is on the card
           above, where the student is already looking. -->
      <div class="slot-nav hidden" id="slotNav">
        <div class="slot-modes">
          <button class="slot-mode" id="slotToggle" onclick="toggleGallery()">Gallery</button>
        </div>

      </div>

      <div class="accent-bar"></div>
    </div>
  </div>

  <!-- ══ THE GALLERY MODAL ══════════════════════════════════════════════
       A single poster on a scrim, with nothing else on screen: no header,
       no footer, no toolbar. The card is the whole interface while it is
       open, which is what makes it read as one thing to look at rather
       than a panel bolted to the page. Same object as the grammar-rules
       card — mono kicker, Anton headline, hairline, slim grey body. -->
  <div class="gal-scrim" id="galScrim" role="dialog" aria-modal="true" aria-label="Other versions">
    <div class="gal-card" id="galCard">
      <button class="gal-x" onclick="toggleGallery()" aria-label="Close">&#10005;</button>
      <div class="gal-kick" id="galKick"><i></i><span></span></div>
      <h2 class="gal-head" id="galHead"></h2>
      <div class="gal-body" id="galBody"></div>
      <div class="gal-nav">
        <button class="gal-arrow" id="slotPrev" onclick="slotPrev()" aria-label="Previous">&larr;</button>
        <span class="gal-count" id="slotCount">1 / 1</span>
        <button class="gal-arrow" id="slotNext" onclick="slotNext()" aria-label="Next">&rarr;</button>
      </div>
    </div>
  </div>

  <div class="foot">
    <div class="nav-pill">
      <button class="nb"    onclick="navTo('question')">Question</button>
      <button class="nb"    onclick="navTo('plan')">Plan</button>
      <button class="nb"    onclick="navTo('model')">Model</button>
      <button class="nb on" onclick="navTo('sample')">Sample</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ══ STATE ══ */
let question=null,paragraphs=[],currentPara=0,currentStyle='default';
let xrayOn=true,fullTextMode=true;
let sampleData=null;
let paraLabels=['Introduction','Body 1','Body 2','Body 3','Conclusion']; /* fallback, overwritten from writingPoints */
/* Same essay-subtype palette as Question/Plan/Model — colour is sourced from
   the question file (essayType), never hardcoded per stage */
const TYPE_COLOR = {
  'opinion':'#3d9e95','for-against':'#e8723a','problem-solution':'#7b5ea7',
  'cause-effect':'#c94f6d','agree-disagree':'#4a7fb5','speculation-trends':'#c08b2f'
};
function applyAccent(type){
  document.documentElement.style.setProperty('--acc', TYPE_COLOR[type]||TYPE_COLOR['opinion']);
}

/* ══ HELPERS ══ */
function extractParagraphs(html){
  const div=document.createElement('div');div.innerHTML=html;
  const ps=div.querySelectorAll('p');
  if(ps.length>1) return Array.from(ps).map(p=>p.innerHTML.trim()).filter(Boolean);
  let raw = ps.length===1 ? ps[0].innerHTML : html;
  let parts = raw.split(/(?:<br\s*\/?>\s*){2,}/i);      /* <br><br> as paragraph break */
  if(parts.length<2) parts = raw.split(/\n\s*\n/);        /* literal blank-line break */
  parts = parts.map(s=>s.trim()).filter(Boolean);
  return parts.length ? parts : [raw.trim()].filter(Boolean);
}

function titleCase(s){
  if(!s) return s;
  return s.charAt(0).toUpperCase()+s.slice(1);
}

/* Build paragraph labels from the Plan's writingPoints so the Sample page
   reads as a direct continuation of the Plan (Intro, then each writing point,
   then Conclusion) instead of generic "Body 1/2/3". Falls back gracefully
   if the point count doesn't match the paragraph count. */
function buildParaLabels(totalParas){
  const points = (question&&Array.isArray(question.writingPoints)&&question.writingPoints.length)
    ? question.writingPoints
    : (sampleData&&Array.isArray(sampleData.writingPoints)?sampleData.writingPoints:null);

  if(points && totalParas===points.length+2){
    return ['Introduction', ...points.map(p=>titleCase(p.replace(/\s*\(your own idea\)\s*/i,''))), 'Conclusion'];
  }
  /* fallback: generic numbering that still adapts to paragraph count */
  const labels=['Introduction'];
  for(let i=1;i<totalParas-1;i++) labels.push(`Body ${i}`);
  if(totalParas>1) labels.push('Conclusion');
  return labels;
}

/* ══ VIEW MODE ══ */
function setViewMode(isFull){
  fullTextMode=isFull;
  document.getElementById('vtFull').classList.toggle('active',isFull);
  document.getElementById('vtParas').classList.toggle('active',!isFull);
  document.getElementById('paraNav').classList.toggle('hidden',isFull);
  render();
}

/* ══ X-RAY TOGGLE ══ */
function toggleXray(){
  xrayOn=!xrayOn;
  document.getElementById('xraySwitch').classList.toggle('on',xrayOn);
  document.getElementById('legend').classList.toggle('hidden',!xrayOn);
  render();
}

/* ══ RENDER ══ */

/* ══════════ TOPIC SENTENCES — read from samples.json, not guessed ══════════
   Each style carries a parallel `topics` array: one entry per paragraph, naming
   the corpus function its opening realises. The span is wrapped run-by-run so
   the authored x-ray markup is never split. */
let CORPUS=window.CORPUS||null;
function altsForFunction(path){
  if(!CORPUS||!path) return [];
  const [fn,sub]=String(path).split('/');
  for(const mv of Object.keys(CORPUS.moves||{})){
    const f=CORPUS.moves[mv][fn];
    if(!f) continue;
    const here=(f[sub]||[]).map(e=>e.t);
    if(here.length>=4) return here;
    return [].concat(...Object.keys(f).map(k=>f[k].map(e=>e.t)));
  }
  return [];
}
const escRe=w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function markTopic(html,span,path){
  if(!span||!path) return {html,count:0};
  const alts=altsForFunction(path);
  if(!alts.length) return {html,count:0};
  const words=span.split(/\s+/).filter(Boolean).map(escRe);
  if(!words.length) return {html,count:0};
  /* tolerate tags, punctuation and entities between the words */
  const between='(?:<[^>]*>|[\\s,;:.\u2019\'"()-]|&[a-z]+;)*';
  const re=new RegExp(words.join(between),'i');
  const m=re.exec(html);
  if(!m) return {html,count:0};
 const safe=String(path).replace(/'/g,"\\'");
  /* wrap each text run inside the match separately — always valid HTML */
  const wrapped=m[0].replace(/(^|>)([^<]+)/g,(all,gt,txt)=>
    txt.trim()? gt+'<span class="topic-key" onclick="showAltsFn(\''+safe+'\')">'+txt+'</span>' : all);
  const tail=`<span class="topic-count" onclick="showAltsFn('${safe}')">${alts.length}</span>`;
  return {html:html.slice(0,m.index)+wrapped+tail+html.slice(m.index+m[0].length),count:1};
}
function showAltsFn(path){
  const alts=altsForFunction(path);
  const ov=document.getElementById('altOverlay'),ph=document.getElementById('altPhrase'),bd=document.getElementById('altBody');
  if(!alts.length||!ov||!ph||!bd) return;
  ph.textContent=String(path).split('/')[0].replace(/_/g,' ');
  bd.innerHTML=`<div class="alt-category">${alts.length} ways to open this paragraph</div>`+
    alts.map(a=>`<div class="alt-item">${String(a).replace(/&/g,'&amp;').replace(/</g,'&lt;')}</div>`).join('');
  ov.classList.add('open');
}
function closeAlt(e){
  if(e&&e.target&&e.target.id!=='altOverlay') return;
  const ov=document.getElementById('altOverlay');
  if(ov) ov.classList.remove('open');
}
window.showAltsFn=showAltsFn; window.closeAlt=closeAlt;
function topicFor(i){
  const t=(sampleData&&sampleData.topics&&sampleData.topics[currentStyle])||[];
  return t[i]||null;
}

function render(){
  const box=document.getElementById('infographic');
  if(!paragraphs.length){box.innerHTML='<div class="state-msg">No sample essay found for this question yet.</div>';return;}
  let html='';
  box.classList.toggle('board-cols',fullTextMode);
  if(fullTextMode){
    html=paragraphs.map((para,i)=>{
      const t=topicFor(i);
      const d=t?markTopic(para,t.span,t.function):{html:para};
      return `<div class="para-text ${xrayOn?'xray-on':''}">${d.html}</div>`;
    }).join('');
    box.innerHTML=html;
    renderSlot();
  }else{
    const p=paragraphs[currentPara]||'';
    const t=topicFor(currentPara);
    const d=t?markTopic(p,t.span,t.function):{html:p};
    const label=paraLabels[currentPara]||`Paragraph ${currentPara+1}`;
    box.innerHTML=`<div class="para-label">${label}</div><div class="para-text ${xrayOn?'xray-on':''}">${d.html}</div>`;
    updateNav();
    renderSlot();
  }
}

/* ══ NAV ══ */
function updateNav(){
  document.getElementById('btnPrev').disabled=currentPara===0;
  document.getElementById('btnNext').disabled=currentPara>=paragraphs.length-1;
  document.getElementById('paraLabel').textContent=paraLabels[currentPara]||`Paragraph ${currentPara+1}`;
}
function goPrev(){if(currentPara>0){currentPara--;slotIndex=0;galleryOpen=false;render();}}
function goNext(){if(currentPara<paragraphs.length-1){currentPara++;slotIndex=0;galleryOpen=false;render();}}

/* ══ STYLE ══ */
function selectStyle(style){
  currentStyle=style;
  document.getElementById('styleDefault').classList.toggle('active',style==='default');
  document.getElementById('styleAlt1').classList.toggle('active',style==='alternative1');
  document.getElementById('styleAlt2').classList.toggle('active',style==='alternative2');
  document.getElementById('styleGuided').classList.toggle('active',style==='guided');
  if(sampleData){
    const html=sampleData.styles?.[style]||sampleData.styles?.default||sampleData.html||'';
    paragraphs=extractParagraphs(html);
    currentPara=0;
    paraLabels=buildParaLabels(paragraphs.length);
    render();
  }
}

/* ══ TOAST ══ */
let _tt;
function showToast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(_tt);_tt=setTimeout(()=>el.classList.remove('show'),2200);
}

/* ══ KEYBOARD + SWIPE ══ */
document.addEventListener('keydown',e=>{
  if(fullTextMode)return;
  if(e.key==='ArrowRight')goNext();
  if(e.key==='ArrowLeft')goPrev();
});
let _tx=0;
if('ontouchstart' in window){
  document.addEventListener('touchstart',e=>{_tx=e.changedTouches[0].screenX;});
  document.addEventListener('touchend',e=>{
    if(fullTextMode)return;
    const dx=e.changedTouches[0].screenX-_tx;
    if(dx<-50)goNext();if(dx>50)goPrev();
  });
}

/* ══ FOOTER NAV ══ */
function navTo(dest){
  if(dest==='sample')return;
  if(question)sessionStorage.setItem('currentQuestion',JSON.stringify(question));
  const map={question:'essay-question.html',plan:'essay-plan.html',model:'essay-cards.html'};
  if(map[dest])window.location.href=map[dest];
}

/* ══ SLOT POOL — the cross-essay axis ══════════════════════════════════
   essays-models.json holds 60 samples in 7 different paragraph shapes, so
   the labels do NOT line up: "Body Paragraph 1 - Advantage" in one sample
   is "Body Paragraph 1 - Main Point" in another. Matching on the literal
   label would give a student four alternatives where sixty exist.

   So labels are normalised to a ROLE first — opening, supporting, counter,
   closing — and the pool for a slot is every paragraph in the corpus that
   plays the same role. This is the Hub's getSectionKey idea, reduced to
   the four roles the samples actually distinguish.

   ONE FILE TO EXTEND. SLOT_SOURCE and the role table are the only things
   the other six genres need to change; everything below is generic. */
const SLOT_SOURCE  = '/skills/writing/essays/data1/essays-models.json';
const PHRASE_SOURCE = {
  hook:   '/skills/writing/essays/data1/essay-hook.json',
  thesis: '/skills/writing/essays/data1/essay-thesis.json',
  full:   '/skills/writing/essays/data1/essay-full-structures.json'
};

/* Paragraph label -> the role a slot plays. Used twice: to pool whole
   paragraphs from the 60 samples, and to pick the phrase bank section. */
function slotRole(label){
  const l=String(label||'').toLowerCase();
  if(l.includes('introduction')||l.includes('opening')) return 'opening';
  if(l.includes('conclusion')||l.includes('closing'))   return 'closing';
  if(l.includes('counter')||l.includes('disadvantage')||
     l.includes('problem')||l.includes('concern'))      return 'counter';
  /* GENERIC LABELS NEED POSITION, NOT WORDS. buildParaLabels falls back to
     "Body 1 / Body 2 / Body 3" whenever a question carries no writingPoints,
     and those say nothing about what the paragraph does. By convention the
     third body is where the counter-argument goes, so position supplies
     what the wording does not — otherwise Body 3 offers first-reason
     frames, which is the wrong move at the right slot. */
  const m=l.match(/\bbody\s*(\d+)/) || l.match(/paragraph\s*(\d+)/);
  if(m){ const n=+m[1]; return n<=1?'first':n===2?'second':'counter'; }
  if(l.includes('second')||l.includes('supporting')) return 'second';
  return 'first';
}
const ROLE_NAME = {opening:'introductions', closing:'conclusions',
                   counter:'counterpoints', first:'body paragraphs',
                   second:'body paragraphs'};
/* Which section of the phrase banks answers each role. The introduction
   draws on TWO files — the hook and the thesis — because that is what an
   introduction is made of, and the Hub paired them for the same reason. */
const ROLE_SECTIONS = {
  opening: [['hook','introduction_context'],['thesis','thesis_statement']],
  first:   [['full','argument_1']],
  second:  [['full','argument_2']],
  counter: [['full','counter_argument']],
  closing: [['full','conclusion']]
};

let slotPool={}, phraseBank=null, slotIndex=0, slotReady=false;
/* ── TWO TIERS, ONE AT A TIME ──────────────────────────────────────────
   PRIMARY (the green arrows) walks the sections of THIS sample.
   SECONDARY (the footer) opens a gallery of other essays' versions of the
   section you are standing on.

   They are never both live. With the gallery open the green arrows would
   move the slot out from under the cards a student is reading, so the
   primary tier stands down and the footer offers Close. Closing puts it
   back. One navigation is active at any moment, and the footer always says
   which. */
let galleryOpen=false;
/* One mode. See the note by .slot-modes. */
const slotMode='whole';

let slotLoading=false;
async function loadSlotPool(){
  /* Once. The pool is built by pushing into arrays, so a second run would
     silently double every slot — 120 conclusions where 60 exist. Nothing
     calls it twice today; this makes sure nothing can. */
  if(slotLoading) return; slotLoading=true;
  try{
    const r=await fetch(SLOT_SOURCE);
    if(r.ok){
      const data=await r.json();
      (data.samples||[]).forEach(smp=>(smp.paragraphs||[]).forEach(p=>{
        if(p&&p.text){ const role=slotRole(p.label);
          (slotPool[role]=slotPool[role]||[]).push(p.text); }
      }));
    }
  }catch(e){}
  try{
    const [h,t,f]=await Promise.all(Object.values(PHRASE_SOURCE).map(u=>fetch(u)));
    phraseBank={
      hook:   h.ok ? await h.json() : null,
      thesis: t.ok ? await t.json() : null,
      full:   f.ok ? await f.json() : null
    };
  }catch(e){}
  slotReady = Object.keys(slotPool).length>0 || !!phraseBank;
  renderSlot();
}

function essayKey(){
  const raw=String((question&&(question.essayType||question.type))||'opinion').toLowerCase();
  return raw.replace(/[\s-]+/g,'_');
}

/* The phrases for the current slot, flattened across default/alt1/alt2 and
   tagged with which group they came from, so a student can see that the
   three are alternatives rather than a sequence. */
function phrasesFor(role){
  if(!phraseBank) return [];
  const key=essayKey(), out=[];
  (ROLE_SECTIONS[role]||[]).forEach(([file,section])=>{
    const st=phraseBank[file]&&phraseBank[file].structures;
    const t = st && (st[key]||st.opinion);
    const sec = t && t.sections && t.sections[section];
    if(!sec||!sec.phrases) return;
    Object.entries(sec.phrases).forEach(([grp,list])=>
      (list||[]).forEach(p=>out.push({text:p,group:grp,label:sec.label})));
  });
  return out;
}

function currentRole(){ return slotRole(paraLabels[currentPara]); }
function currentPool(){
  return slotMode==='phrase' ? phrasesFor(currentRole())
                             : (slotPool[currentRole()]||[]).map(t=>({text:t}));
}


function toggleGallery(){
  galleryOpen=!galleryOpen;
  slotIndex=0;
  renderSlot();
}
window.toggleGallery=toggleGallery;
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&galleryOpen) toggleGallery(); });
document.addEventListener('click',e=>{ if(galleryOpen&&e.target&&e.target.id==='galScrim') toggleGallery(); });

/* The headline is the paragraph's own opening move — the signpost it
   starts with, up to its first comma, capped at five words. That is the
   part a student is choosing between: sixty introductions differ far more
   in how they open than in what they go on to say. The rest of the
   paragraph becomes the slim grey body underneath, which is the same
   hierarchy the grammar cards use: a placed phrase, then its explanation. */
function headlineOf(text){
  const t=String(text||'').trim();
  const upto=t.split(/,|—|;/)[0];
  const w=upto.split(/\s+/);
  return (w.length>5 ? w.slice(0,5).join(' ') : upto).replace(/[.\s]+$/,'');
}
/* One or two words in caramel, never a line: the paragraph's signpost where
   it appears in the body, so the eye can find the move inside the prose. */
function markKeys(text, head){
  const esc=String(text).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  if(!head) return esc;
  const rx=new RegExp('^('+head.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','i');
  return esc.replace(rx,'<span class="gal-key">$1</span>');
}

function renderSlot(){
  const nav=document.getElementById('slotNav'); if(!nav) return;
  const pool=currentPool();
  const offer = slotReady && !fullTextMode && paragraphs.length && pool.length>0;
  nav.classList.toggle('hidden', !offer);
  if(!offer) galleryOpen=false;

  const toggle=document.getElementById('slotToggle');
  if(toggle) toggle.textContent='Gallery';

  const scrim=document.getElementById('galScrim');
  if(scrim) scrim.classList.toggle('open', !!(offer && galleryOpen));
  if(!offer || !galleryOpen) return;

  if(slotIndex>=pool.length) slotIndex=0;
  const item=pool[slotIndex];
  const head=headlineOf(item.text);

  document.getElementById('galKick').querySelector('span').textContent =
    'Another ' + ({opening:'introduction', closing:'conclusion', counter:'counterpoint',
                   first:'body paragraph', second:'body paragraph'}[currentRole()] || 'version');
  document.getElementById('galHead').textContent=head;
  document.getElementById('galBody').innerHTML=markKeys(item.text, head);
  document.getElementById('slotCount').textContent=(slotIndex+1)+' / '+pool.length;
  document.getElementById('slotPrev').disabled=slotIndex===0;
  document.getElementById('slotNext').disabled=slotIndex>=pool.length-1;
}

function slotPrev(){ if(slotIndex>0){ slotIndex--; renderSlot(); } }
function slotNext(){ if(slotIndex<currentPool().length-1){ slotIndex++; renderSlot(); } }
window.slotPrev=slotPrev; window.slotNext=slotNext;

/* ══ INIT ══ */
async function init(){
  try{question=JSON.parse(sessionStorage.getItem('currentQuestion'));}catch(e){}

  /* The cross-essay pool loads in the background, like the expression
     corpus above it. The page never waits for it: if it never arrives the
     second axis simply does not appear, and everything else still works. */
  loadSlotPool();

  /* Topic label */
/* Topic label + accent colour — sourced from the question file, per the pipeline rule */
  if(question){
    const label=question.topic||question.topicLabel||(question.mainQuestion||question.question||'').substring(0,35);
    if(label)document.getElementById('topicLabel').textContent=label.toUpperCase();
    applyAccent(question.essayType||'opinion');
  }

  if(!question){
    document.getElementById('infographic').innerHTML='<div class="state-msg">No question selected.<br>Return to Questions to choose one.</div>';
    return;
  }

  const lookupId=question.questionId||question.id;

  /* Sample data */
  try{
    /* the expression corpus loads in the background — the page never waits for it */
    fetch('data/essays-expressions.json')
      .then(r=>r.ok?r.json():null)
      .then(d=>{ if(d){ window.CORPUS=d; CORPUS=d; render(); } })
      .catch(()=>{});
    const res=await fetch('data/samples.json');
    if(!res.ok)throw new Error('samples.json not found');
    const data=await res.json();
    const pool=Array.isArray(data)?data:(data.opinion||data.samples||data.essays||[]);
    const match=pool.find(s=>s.id===lookupId);
    if(!match){
      document.getElementById('infographic').innerHTML=`<div class="state-msg">No sample essay for this question yet.</div>`;
      return;
    }
    sampleData=match;

    /* Show the Guided button only when this essay actually has a guided style authored */
    document.getElementById('styleGuided').classList.toggle('hidden', !match.styles?.guided);

    const html=match.styles?.default||match.html||match.text||'';
    paragraphs=extractParagraphs(html);
    paraLabels=buildParaLabels(paragraphs.length);
    render();
  }catch(err){
    document.getElementById('infographic').innerHTML=`<div class="state-msg">⚠ Could not load samples.json</div>`;
  }
}

init();
</script>
<div class="alt-overlay" id="altOverlay" onclick="closeAlt(event)">
  <div class="alt-modal" onclick="event.stopPropagation()">
    <div class="alt-header">
      <div><div class="alt-title">Other ways to open this paragraph</div>
           <div class="alt-phrase" id="altPhrase"></div></div>
      <button class="alt-close" onclick="closeAlt()">×</button>
    </div>
    <div class="alt-body" id="altBody"></div>
  </div>
</div>
