<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F3F1ED">
<title>INTUITY — Essay study cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..600&family=Geist+Mono:wght@400..600&family=Anton&display=swap" rel="stylesheet">
<style>
/* ═══ ESSAY STUDY CARDS · TEST (7 Nov 2026) ════════════════════════════
   A trial of the Model cards as old paper study cards, before the layout
   goes to every task. Same data file and the same seeded roll as the
   Phrases view of essay-cards.html, so the six models per type are fixed.
   The card, from the design review:
     · no ruled lines; one hairline between Intro, Body and End
     · the role in a narrow mono margin (INTRO / BODY / END)
     · the phrase in 500, everything else 400; a gap is a plain grey "…"
     · no For / Against labels: Firstly / Moreover / However say it
     · one card, one screen; the number sits top right and never moves
   One line of chrome above the card: back, and the essay type.
   ═══════════════════════════════════════════════════════════════════ */
:root{
  --bg:#F3F1ED; --card:#FAF8F5; --ink:#141210; --body:#2A2622; --faint:#8A8378;
  --gap:#B4ADA2; --hair:rgba(20,17,14,.12); --role:#9A5A2C; --caramel:#B08A64;
  --f:'Geist',system-ui,sans-serif; --m:'Geist Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:var(--f);-webkit-font-smoothing:antialiased}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(14px + env(safe-area-inset-top)) 16px 10px;max-width:560px;width:100%;margin:0 auto}
.back{font:600 .6875rem/1 var(--m);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);text-decoration:none}
.type{position:relative;font:500 .9rem/1 var(--f);color:var(--ink)}
.type select{appearance:none;-webkit-appearance:none;border:0;background:none;font:inherit;color:inherit;
  padding:8px 22px 8px 4px;cursor:pointer;text-align:right}
.type::after{content:'';position:absolute;right:6px;top:50%;width:6px;height:6px;margin-top:-5px;
  border-right:1.5px solid var(--faint);border-bottom:1.5px solid var(--faint);transform:rotate(45deg);pointer-events:none}

main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 16px 0}
.card{width:100%;max-width:520px;background:var(--card);border:1px solid var(--hair);border-radius:6px;
  padding:14px 18px 6px;touch-action:pan-y;user-select:none;-webkit-user-select:none;
  transition:transform .22s cubic-bezier(.22,1,.36,1),opacity .22s}
.card.out-l{transform:translateX(-18px);opacity:0}.card.out-r{transform:translateX(18px);opacity:0}
/* the INTUITY hallmark, smaller (7 Nov 2026): caramel bar + spaced mono
   kicker, ESSAY in Anton with its number in caramel, a short heavy rule */
.head{padding:4px 0 14px;border-bottom:1px solid var(--hair)}
.kind{display:flex;align-items:center;gap:10px;font:500 .625rem/1.3 var(--m);letter-spacing:.24em;text-transform:uppercase;color:#6B655C}
.kind::before{content:'';flex:none;width:22px;height:7px;background:var(--caramel)}
.ttl{margin-top:8px;font:400 clamp(1.9rem,9vw,2.3rem)/1 'Anton',Impact,sans-serif;letter-spacing:.005em;color:var(--ink);text-transform:uppercase}
.ttl b{font-weight:400;color:var(--caramel)}
.rule{width:34px;height:3px;background:var(--ink);margin-top:10px}
.study{margin-top:10px;font:400 12px/1.4 var(--f);color:var(--faint)}

.sec{display:grid;grid-template-columns:3.2rem minmax(0,1fr);gap:12px;padding:16px 0}
.sec+.sec{border-top:1px solid var(--hair)}
.role{font:500 .6875rem/1 var(--m);letter-spacing:.1em;color:var(--role);padding-top:.42em}
.txt{font:400 clamp(1rem,4.2vw,1.0625rem)/1.65 var(--f);color:#4A443E}
/* less solid black (7 Nov 2026): the sentence in a soft warm grey at 400;
   only its signpost stays dark, so the eye still finds the turn */
.txt b{font-weight:500;color:var(--ink)}
.txt p+p{margin-top:.55em}
.g{color:var(--gap);font-weight:400;letter-spacing:.06em;margin:0 .08em}

.foot{width:100%;max-width:520px;display:flex;align-items:center;justify-content:space-between;
  padding:14px 2px calc(18px + env(safe-area-inset-bottom))}
.nav{border:1px solid var(--hair);background:var(--card);color:var(--ink);width:44px;height:44px;border-radius:50%;
  font:500 1.1rem/1 var(--f);cursor:pointer;display:flex;align-items:center;justify-content:center}
.nav:disabled{opacity:.35;cursor:default}
.dots{display:flex;gap:7px}
.dots span{width:6px;height:6px;border-radius:50%;background:rgba(20,17,14,.18);transition:background .2s,transform .2s}
.dots span.on{background:var(--ink);transform:scale(1.15)}
.state{color:var(--faint);font-size:.95rem;text-align:center;padding:2rem}
@media(prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<header class="top">
  <a class="back" href="/skills/writing/gate.html?task=essays">← Essay</a>
  <label class="type"><select id="type" aria-label="Essay type"></select></label>
</header>
<main>
  <article class="card" id="card" aria-live="polite"><div class="state">Loading…</div></article>
  <nav class="foot" aria-label="Cards">
    <button class="nav" id="prev" type="button" aria-label="Previous card">‹</button>
    <div class="dots" id="dots" aria-hidden="true"></div>
    <button class="nav" id="next" type="button" aria-label="Next card">›</button>
  </nav>
</main>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const DATA_PATH='/skills/writing/essays/data/essay-cards-models.json';
const PER_TYPE=6;

/* the seeded roll from essay-cards.html, call for call, so the models match */
const SEED=20260710; let _s=SEED;
function grand(){ _s|=0; _s=(_s+0x6D2B79F5)|0; let t=Math.imul(_s^_s>>>15,1|_s);
  t=(t+Math.imul(t^t>>>7,61|t))^t; return ((t^t>>>14)>>>0)/4294967296; }
const gpick=a=>a[Math.floor(grand()*a.length)];
const keyOf=x=>(x&&x.t)?x.t:x;
const gpickAvoid=(pool,av)=>{ if(!pool||!pool.length) return '...';
  const A=(av||[]).map(keyOf); const f=pool.filter(x=>!A.includes(keyOf(x))); return gpick(f.length?f:pool); };

const esc=v=>String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
/* a gap is a plain grey ellipsis; a sentence ending in a gap keeps no extra full stop */
const gaps=v=>esc(v).replace(/\s*(\.\.\.|…)/g,' <span class="g">…</span>');
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;

function build(DATA){
  const out={}; _s=SEED; const SH=DATA.shared;
  Object.keys(DATA.types).forEach(k=>{
    const T=DATA.types[k], VIEW=SH.view[T.viewFlavour]||SH.view.generalisation||Object.values(SH.view)[0];
    const A=T.argue, plan=A.bodyPlan||['keyFor','keyFor','keyAgainst'], sp=A.signpostPlan||['first','addition','turn'];
    out[k]=[];
    for(let c=1;c<=PER_TYPE;c++){
      const o={bg:gpick(SH.background),hinge:gpick(T.open.hinge),aim:gpick(T.open.aim)};
      const used={v:[],k:[],s:[]}, body=[];
      for(let i=0;i<3;i++){
        const sign=gpickAvoid(SH.signpost[sp[i]]||SH.signpost.addition,used.s); used.s.push(sign);
        const vw=gpickAvoid(VIEW,used.v); used.v.push(vw);
        const key=gpickAvoid(A[plan[i]]||['...'],used.k); used.k.push(key);
        body.push({sign:sign,rest:vw+' '+keyOf(key)});
      }
      const cl={s:gpick(T.close.summary),st:gpick(T.close.stance),v:gpick(T.close.verdict)};
      out[k].push({
        intro: gaps(o.bg)+' '+esc(o.hinge)+' <span class="g">…</span> '+gaps(cap(o.aim)),
        body: body.map(b=>'<b>'+esc(b.sign)+',</b> '+gaps(b.rest)),
        end: '<b>'+esc(cl.s)+'</b> '+gaps(cl.st+' '+cl.v)
      });
    }
  });
  return out;
}

let DATA=null, MODELS=null, type='for-against', i=0;

function paint(dir){
  const list=MODELS[type]||[], m=list[i], card=$('card');
  const label=(DATA.types[type]&&DATA.types[type].label)||type;
  const draw=()=>{
    card.innerHTML=!m?'<div class="state">No models for this type.</div>':
      '<div class="head"><div class="kind">Part 1 · '+esc(label)+'</div><h1 class="ttl">Essay <b>'+(i+1)+'</b></h1><div class="rule"></div><div class="study">Study card · '+(i+1)+' of '+list.length+'</div></div>'+
      '<section class="sec"><div class="role">INTRO</div><div class="txt"><p>'+m.intro+'</p></div></section>'+
      '<section class="sec"><div class="role">BODY</div><div class="txt">'+m.body.map(b=>'<p>'+b+'</p>').join('')+'</div></section>'+
      '<section class="sec"><div class="role">END</div><div class="txt"><p>'+m.end+'</p></div></section>';
    card.classList.remove('out-l','out-r');
  };
  if(dir){ card.classList.add(dir<0?'out-r':'out-l'); setTimeout(draw,140); } else draw();
  $('dots').innerHTML=list.map((_,k)=>'<span'+(k===i?' class="on"':'')+'></span>').join('');
  $('prev').disabled=i===0; $('next').disabled=i>=list.length-1;
  try{ history.replaceState(null,'','?type='+type+'&card='+(i+1)); }catch(e){}
}
function go(d){ const n=(MODELS[type]||[]).length; const j=i+d; if(j<0||j>=n) return; i=j; paint(d); }
$('prev').onclick=()=>go(-1); $('next').onclick=()=>go(1);
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight') go(1); else if(e.key==='ArrowLeft') go(-1); });

/* swipe left / right on the card */
let x0=null,y0=null;
$('card').addEventListener('pointerdown',e=>{x0=e.clientX;y0=e.clientY;});
$('card').addEventListener('pointerup',e=>{ if(x0==null) return; const dx=e.clientX-x0, dy=e.clientY-y0; x0=null;
  if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)*1.5) go(dx<0?1:-1); });

$('type').onchange=e=>{ type=e.target.value; i=0; paint(); };

fetch(DATA_PATH).then(r=>{ if(!r.ok) throw new Error(); return r.json(); }).then(d=>{
  DATA=d; MODELS=build(d);
  const P=new URLSearchParams(location.search);
  if(P.get('type')&&d.types[P.get('type')]) type=P.get('type');
  const c=parseInt(P.get('card'),10); if(c>=1&&c<=PER_TYPE) i=c-1;
  $('type').innerHTML=Object.keys(d.types).map(k=>'<option value="'+k+'"'+(k===type?' selected':'')+'>'+esc(d.types[k].label||k)+'</option>').join('');
  paint();
}).catch(()=>{ $('card').innerHTML='<div class="state">The cards could not load. Check your connection and reload.</div>'; });
})();
</script>
</body>
</html>
