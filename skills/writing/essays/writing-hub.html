<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Writing Hub — INTUITY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- The product's three faces. Crimson Text stays for essay prose only —
       see the note in the stylesheet; it is one line to remove. -->
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500&family=Anton&family=Crimson+Text:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=7">
  <style>
    /* ── CORNERS ARE SQUARE ───────────────────────────────────────────
       The panels — essay container, phrase list, swipe view — were rounded
       at 1 to 1.1rem. Square is the later refinement, so the card surfaces
       are square here too. The pills and toggles keep their radii: a pill
       is a pill, and .phrase-group's end-rounding is gone because it only
       existed to round the stack it sits in.

       ── THE HUB NOW SPEAKS INTUITY'S PALETTE, AND MEANS IT ────────────
       The comment above this block said the hub spoke INTUITY's palette.
       It did not: it declared its own --ink (#111111 against the shell's
       #232C31), its own --paper (#f0efec against #4A433D — the shell's
       --paper is INK, not a ground), and a --gold the system has never
       had. Three of the four names collided with shell tokens while
       meaning something different, which is worse than not using them.

       So the local block is gone. --ink, --paper, --rule, --card, --screen
       and the rest now come from intuity-shell.css and mean what they mean
       everywhere else.

       THE GOLD. var(--gold) was the page's accent, hard-coded eight times over.
       It maps to two shell tokens, not one, because it was doing two jobs:
       --caramel where it filled a shape, --accent-ink where it coloured
       words. Caramel measures 2.68:1 as type and fails; that is exactly the
       split the shell already encodes. */
    :root{
      --card-w:960px;
      --gold:var(--caramel,#B0865C);      /* blocks, fills, borders */
      --gold-ink:var(--accent-ink,#A7573C); /* the same colour, as words */
      --gold-rgb:176,134,92;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    /* The hub was the only dark screen in the product — near-black with two
       gold glows. Every other page is a light board, so a student arriving
       from the writing door met a different application. Light ground, shell
       ink, no glows. */
    body{font-family:'Geist',-apple-system,sans-serif;background:var(--screen,#F3F1ED);
      color:var(--ink,#232C31);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
    .container{position:relative;z-index:2;max-width:75rem;margin:0 auto;padding:.5rem}
    /* Header styling removed: the shell owns .header and .back-link. */
    /* MODE TOGGLE */
    .reading-mode-toggle{display:flex;justify-content:center;margin-bottom:1.5rem}
    .mode-toggle-container{display:inline-flex;background:var(--sunk,#EDE9E2);border-radius:2rem;padding:.35rem;border:1px solid rgba(var(--gold-rgb),.3);box-shadow:none}
    .mode-toggle-btn{font-family:'Geist',sans-serif;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:.6rem 1.5rem;border:none;background:transparent;border-radius:1.5rem;cursor:pointer;transition:all .4s cubic-bezier(.4,0,.2,1);color:var(--faint,#756B6E);display:flex;align-items:center;gap:.5rem;white-space:nowrap}
    .mode-toggle-btn:hover{color:var(--ink,#232C31)}
    .mode-toggle-btn.active{background:var(--gold);color:var(--card,#FAF8F5)}
    /* ESSAY CONTAINER */
    .essay-container{background:var(--card,#FAF8F5);padding:2.6rem 2.4rem 1.6rem;border-radius:0;max-width:var(--card-w);margin:0 auto 2rem;box-shadow:0 30px 60px -20px rgba(0,0,0,.45)}
    .essay-title{font-family:"Crimson Text",Georgia,serif;font-size:2rem;font-weight:700;color:var(--ink,#232C31);text-align:center;margin-bottom:2.5rem;line-height:1.3;padding-bottom:1.5rem;border-bottom:2px solid rgba(0,0,0,.1)}
    /* COMPLETE TEXT */
    .complete-text-view{display:none}.complete-text-view.active{display:block}
    .complete-paragraph{margin-bottom:2rem;padding-bottom:2rem;border-bottom:1px solid rgba(139,115,85,.15)}
    .complete-paragraph:last-of-type{border-bottom:none;margin-bottom:3rem}
    .complete-section-label{--x:0;font-family:'Geist',sans-serif;font-size:.9rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--sage-d,#456055);margin-bottom:1rem;padding-bottom:.5rem;border-bottom:2px solid rgba(var(--gold-rgb),.3)}
    .complete-paragraph-text{font-family:"Crimson Text",Georgia,serif;font-size:1.1875rem;line-height:1.85;color:var(--paper,#4A433D);text-align:justify;text-indent:2.5rem;margin:0}
    .complete-nav{display:flex;justify-content:center;align-items:center;gap:1.5rem;padding:1.5rem 0;margin-top:2rem;border-top:2px solid rgba(139,115,85,.2)}
    .complete-nav-btn{font-family:'Geist',sans-serif;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:.75rem 1.5rem;border:2px solid rgba(var(--gold-rgb),.3);border-radius:2rem;cursor:pointer;transition:all .3s cubic-bezier(.4,0,.2,1);background:transparent;color:var(--gold-ink)}
    .complete-nav-btn:hover:not(:disabled){background:rgba(var(--gold-rgb),.14);border-color:rgba(var(--gold-rgb),.5);color:var(--ink,#232C31)}
    .complete-nav-btn:disabled{opacity:.25;cursor:not-allowed}
    .complete-counter{font-family:'Geist',sans-serif;font-size:.875rem;font-weight:600;color:var(--gold-ink);letter-spacing:.05em}
    /* SECTION CARDS */
    .section-cards-view{display:none}.section-cards-view.active{display:block}
    .paragraph-section{position:relative;padding:1.75rem .5rem 60px;min-height:220px;transition:all .3s;border-bottom:2px solid rgba(139,115,85,.2);margin-bottom:1rem}
    .paragraph-section:hover{background:rgba(var(--gold-rgb),.03)}
    .section-heading{font-family:'Geist',sans-serif;font-size:.9rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--sage-d,#456055);margin-bottom:.75rem;padding-bottom:.5rem;border-bottom:2px solid rgba(var(--gold-rgb),.3)}
    .paragraph-text{font-family:"Crimson Text",Georgia,serif;font-size:1.1875rem;line-height:1.85;color:var(--paper,#4A433D);text-align:justify;text-indent:2.5rem;margin:0}
    .discourse-marker{color:var(--gold-ink);font-weight:600}
    /* PHRASE LIST */
    
    .phrase-list-view{display:none;position:relative;max-width:var(--card-w);margin:0 auto;background:var(--card,#FAF8F5);border-radius:0;border:1px solid rgba(var(--gold-rgb),.3);overflow:hidden;box-shadow:0 24px 60px -18px rgba(20,17,14,.38),0 6px 16px rgba(20,17,14,.14);min-height:450px}
    .phrase-list-view.active{display:block}
    .phrase-group{display:flex;align-items:stretch;background:var(--card,#FAF8F5);overflow:hidden;box-shadow:0 4px 15px rgba(0,0,0,.15);transition:all .3s cubic-bezier(.4,0,.2,1);min-height:140px;border-bottom:1px solid rgba(0,0,0,.05)}
    .phrase-group:first-child{}
    .phrase-group:last-child{border-bottom:none}
    .phrase-group:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,0,0,.2);z-index:1}
    /* a set is a set — three emoji made it read as three moods */
    .phrase-group-icon{width:6px;flex-shrink:0}
    .phrase-group[data-variant="default"] .phrase-group-icon{background:var(--gold)}
    .phrase-group[data-variant="alt1"]    .phrase-group-icon{background:rgba(var(--gold-rgb),.62)}
    .phrase-group[data-variant="alt2"]    .phrase-group-icon{background:rgba(var(--gold-rgb),.34)}
    .phrase-group-content{flex:1;padding:.875rem 1rem .875rem 1.125rem;display:flex;flex-direction:column;background:var(--card,#FAF8F5);min-width:0}
    .phrase-group-title{font-family:'Geist',sans-serif;font-size:.85rem;font-weight:700;color:var(--ink,#232C31);text-transform:uppercase;letter-spacing:.02em;margin-bottom:.75rem;flex-shrink:0}
    .phrase-list-wrapper{flex:1;overflow-y:auto;overflow-x:hidden;margin-right:.25rem;scrollbar-width:thin;scrollbar-color:rgba(var(--gold-rgb),.4) transparent}
    .phrase-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:.4rem;padding-bottom:.5rem;padding-right:.5rem}
    .phrase-list li{font-size:.7rem;color:var(--paper,#4A433D);line-height:1.45;font-weight:500;padding-left:1.25rem;position:relative}
    .phrase-list li::before{content:"•";position:absolute;left:0;color:var(--gold);font-weight:bold;font-size:1rem}
    .phrase-placeholder{color:var(--faint,#756B6E);font-style:italic}
    .modal-close-btn{position:absolute;top:.75rem;right:.75rem;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.4);backdrop-filter:blur(10px);border:1px solid rgba(var(--gold-rgb),.3);color:var(--gold);font-size:1.25rem;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .3s;z-index:100;font-weight:300;line-height:1}
    .modal-close-btn:hover{background:rgba(var(--gold-rgb),.3);border-color:rgba(var(--gold-rgb),.6);transform:scale(1.1) rotate(90deg)}
    /* SWIPE */
    .swipe-view{display:none;position:relative;min-height:min(52vh,420px);max-width:var(--card-w);margin:0 auto;background:var(--card,#FAF8F5);border-radius:0;border:1px solid rgba(var(--gold-rgb),.3);overflow:hidden;box-shadow:0 24px 60px -18px rgba(20,17,14,.38),0 6px 16px rgba(20,17,14,.14)}
    .swipe-view.active{display:block}
    .swipe-slides-container{position:relative;min-height:400px;overflow:hidden}
    .swipe-slide{position:absolute;top:0;left:0;width:100%;height:100%;padding:4rem 3rem;display:flex;align-items:center;justify-content:center;opacity:0;transform:translateX(100%);transition:all .5s cubic-bezier(.4,0,.2,1);pointer-events:none}
    .swipe-slide.active{opacity:1;transform:translateX(0);pointer-events:auto;z-index:10}
    .swipe-phrase-text{color:var(--ink,#232C31);font-family:'Geist',sans-serif;line-height:1.3;text-align:center;color:var(--ink,#232C31);font-weight:800;max-width:95%;width:100%;text-transform:uppercase;letter-spacing:-.02em}
    .swipe-phrase-text.size-small{font-size:4rem}.swipe-phrase-text.size-medium{font-size:2.8rem}.swipe-phrase-text.size-large{font-size:2rem}.swipe-phrase-text.size-xlarge{font-size:1.5rem;text-transform:none;letter-spacing:0;line-height:1.5}
    .swipe-phrase-text .highlight{background:none;color:var(--gold-ink);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:900}
    .swipe-nav-arrows{position:absolute;top:50%;left:0;right:0;display:flex;justify-content:space-between;padding:0 .5rem;transform:translateY(-50%);pointer-events:none;z-index:20}
    .swipe-arrow{pointer-events:auto;width:40px;height:40px;border-radius:50%;background:rgba(var(--gold-rgb),.2);border:1px solid rgba(var(--gold-rgb),.4);color:var(--gold);font-size:1.2rem;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .3s}
    .swipe-arrow:hover:not(:disabled){background:rgba(var(--gold-rgb),.35);transform:scale(1.15)}
    .swipe-arrow:disabled{opacity:.2;cursor:not-allowed}
    .swipe-nav-dots{padding:1.5rem;display:flex;justify-content:center;gap:.5rem;background:rgba(0,0,0,.2)}
    .swipe-dot{width:8px;height:8px;border-radius:50%;background:rgba(99,99,102,.3);cursor:pointer;transition:all .3s}
    .swipe-dot.active{background:var(--gold);transform:scale(1.4);box-shadow:0 0 10px rgba(var(--gold-rgb),.6)}
    /* NAV */
    .paragraph-nav-container{position:absolute;bottom:.75rem;left:.5rem;right:.5rem;display:flex;justify-content:center;align-items:center;height:36px;gap:.35rem;flex-wrap:nowrap}
    .nav-btn{font-family:'Geist',sans-serif;font-size:.6rem;font-weight:600;text-transform:uppercase;letter-spacing:.03em;padding:.35rem .65rem;border:1px solid rgba(var(--gold-rgb),.3);border-radius:1.5rem;cursor:pointer;transition:all .3s cubic-bezier(.4,0,.2,1);background:transparent;color:var(--gold-ink);white-space:nowrap;flex-shrink:0}
    .nav-btn:hover:not(:disabled){background:rgba(var(--gold-rgb),.14);border-color:rgba(var(--gold-rgb),.5);color:var(--ink,#232C31)}
    .nav-btn:disabled{opacity:.25;cursor:not-allowed}
    .view-mode-toggle-mini{display:flex;gap:.2rem;background:rgba(0,0,0,.08);padding:.2rem;border-radius:1rem;border:1px solid rgba(var(--gold-rgb),.2);flex-shrink:0}
    .view-mode-btn{padding:.3rem .5rem;border:none;background:transparent;border-radius:.7rem;font-size:.55rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;cursor:pointer;transition:all .3s cubic-bezier(.4,0,.2,1);opacity:.4;color:var(--paper,#4A433D);font-family:'Geist',sans-serif;white-space:nowrap}
    .view-mode-btn:hover{opacity:.9;background:rgba(var(--gold-rgb),.15);transform:translateY(-1px)}
    .view-mode-btn.active{background:rgba(var(--gold-rgb),.25);opacity:1;color:var(--ink,#232C31)}
    .view-mode-btn.active:hover{background:rgba(var(--gold-rgb),.35)}
    .sample-counter{font-family:'Geist',sans-serif;font-size:.6rem;font-weight:600;color:rgba(0,0,0,.35);letter-spacing:.03em;white-space:nowrap;min-width:32px;text-align:center;flex-shrink:0}
    .nav-pills{display:flex;justify-content:center;gap:1rem;padding:1.5rem 1rem;flex-wrap:wrap}
    .pill-btn{font-family:'Geist',sans-serif;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;padding:.5rem 1.2rem;border:1px solid rgba(var(--gold-rgb),.3);border-radius:2rem;cursor:pointer;transition:all .2s;background:transparent;color:var(--paper,#4A433D)}
      .pill-btn:hover{color:var(--ink,#232C31);border-color:rgba(var(--gold-rgb),.6)}
    .pill-btn.active{background:var(--gold);border-color:var(--gold);color:var(--card,#FAF8F5);font-weight:800}
    @media(max-width:768px){
      .mode-toggle-btn{font-size:.65rem;padding:.5rem 1rem}
      .paragraph-nav-container{gap:.25rem;left:.25rem;right:.25rem;bottom:.5rem}
      .nav-btn{font-size:.55rem;padding:.3rem .5rem}
      .view-mode-btn{font-size:.5rem;padding:.25rem .4rem}
      .sample-counter{font-size:.55rem;min-width:28px}
      .swipe-phrase-text.size-small{font-size:2.5rem}.swipe-phrase-text.size-medium{font-size:1.8rem}.swipe-phrase-text.size-large{font-size:1.3rem}.swipe-phrase-text.size-xlarge{font-size:1.1rem}
      .essay-container{padding:2rem 1.2rem 1.5rem}
    }
  
    /* ── CONTROLS ARE iOS PILLS ────────────────────────────────────────
       The product's control is one shape, and it is the writing door's
       footer: a light grey fill on the page ground, fully rounded, ink
       text, a darker fill on press. --poster-fill rgba(20,17,14,.09) and
       --poster-fill-hi at .15 — a tint of the ink rather than a colour, so
       it sits on any board without being retuned.

       The hub's controls were doing something else: a caramel fill for the
       selected state, caramel borders, a recessed track. That made the
       toggle the loudest thing on a screen whose subject is an essay. The
       selected pill is now stated the way the rest of the product states
       it — a solid ink pill, white text — and caramel goes back to meaning
       target language only. */
    .mode-toggle-container,.view-mode-toggle-mini{
      background:transparent;border:none;box-shadow:none;padding:0;
      display:inline-flex;gap:.35rem;}
    .mode-toggle-btn,.view-mode-btn,.complete-nav-btn,.nav-btn,.pill-btn,.swipe-arrow{
      background:var(--poster-fill,rgba(20,17,14,.09));border:none;
      border-radius:999px;color:var(--poster-ink,#14110E);
      font-family:'Geist',sans-serif;font-weight:700;
      transition:background .15s,transform .12s;opacity:1;}
    .mode-toggle-btn:active,.view-mode-btn:active,.complete-nav-btn:active,
    .nav-btn:active,.pill-btn:active,.swipe-arrow:active{
      transform:scale(.96);background:var(--poster-fill-hi,rgba(20,17,14,.15));}
    @media(hover:hover){
      .mode-toggle-btn:hover,.view-mode-btn:hover,.complete-nav-btn:hover:not(:disabled),
      .nav-btn:hover:not(:disabled),.pill-btn:hover,.swipe-arrow:hover:not(:disabled){
        background:var(--poster-fill-hi,rgba(20,17,14,.15));color:var(--poster-ink,#14110E);}
    }
    /* Selected: ink, not caramel. */
    .mode-toggle-btn.active,.view-mode-btn.active,.pill-btn.active{
      background:var(--poster-ink,#14110E);color:var(--card,#FAF8F5);}
    .complete-nav-btn:disabled,.nav-btn:disabled,.swipe-arrow:disabled{opacity:.35;}
</style>
</head>
<body>
<div class="container">
  <!-- The shell's header, byte-identical to the twelve other pages that
       carry it: back-link, INTUITY, a subtitle, a level chip. This is the
       thing a student recognises before they have read a word, and the hub
       was the page that did not have it. #brandSubtitle keeps its id so the
       existing script that rewrites it still works. -->
  <header class="header">
    <div class="header-top">
      <a class="back-link" href="/skills/writing/writing-door.html" target="_top">&larr; Writing</a>
      <div class="header-title">
        <div class="app-title">INTUITY</div>
        <div class="app-subtitle" id="brandSubtitle">Writing Hub</div>
      </div>
      <span class="header-spacer">Level <b>B2</b></span>
    </div>
  </header>

  <div class="reading-mode-toggle">
    <div class="mode-toggle-container">
      <button class="mode-toggle-btn active" onclick="setReadingMode('complete')"><span>Complete text</span></button>
      <button class="mode-toggle-btn"        onclick="setReadingMode('cards')"><span>Section cards</span></button>
    </div>
  </div>

  <div class="essay-container" id="essayContainer">
    <div id="loadingSpinner" style="text-align:center;padding:4rem;opacity:1;transition:opacity .3s">
      <div style="font-weight:600;color:var(--gold-ink)">Loading content…</div>
      <div style="margin-top:1rem;font-size:.875rem;color:#9a9186">Please wait</div>
    </div>
    <div id="mainContent" style="opacity:0;transition:opacity .3s"></div>
  </div>
</div>

<script>
let currentType=null,currentData=null,phraseData=null,paragraphIndices=[],viewModes=[],swipeIndices={},readingMode='complete',completeTextIndex=0;

const DATA_PATHS={
  essays:'/skills/writing/essays/data1/essays-models.json',
  reports:'/skills/writing/essays/data1/reports-models.json',
  reviews:'/skills/writing/essays/data1/reviews-models.json',
  emails:'/skills/writing/essays/data1/emails-models.json'
};
const PHRASE_PATHS={
  essays:{hook:'/skills/writing/essays/data1/essay-hook.json',thesis:'/skills/writing/essays/data1/essay-thesis.json',full:'/skills/writing/essays/data1/essay-full-structures.json'},
  reports:{hook:'/skills/writing/essays/data1/report-intro-purpose.json',thesis:'/skills/writing/essays/data1/report-intro-basis.json',full:'/skills/writing/essays/data1/report-full-structures.json'},
  reviews:{hook:'/skills/writing/essays/data1/review-intro-opening.json',thesis:'/skills/writing/essays/data1/review-intro-background.json',full:'/skills/writing/essays/data1/review-full-structures.json'},
  emails:{hook:'/skills/writing/essays/data1/email-opening.json',thesis:'/skills/writing/essays/data1/email-body.json',full:'/skills/writing/essays/data1/email-closing.json'}
};
const ESSAY_TYPE_MAP={essays:'for_and_against',reports:'formal_report',reviews:'product_review',emails:'informal_email'};

function getSectionKey(label,ct){
  const lk=label||'';
  if(lk==='Introduction'||lk==='INTRODUCTION'){if(ct==='essays')return'introduction_context';if(ct==='reports')return'introduction_purpose';if(ct==='reviews')return'introduction_opening';}
  const m={'Thesis':'thesis_statement','THESIS':'thesis_statement','Body Paragraph 1 - Advantage':'advantages','Body Paragraph 2 - Advantage':'advantages','Body Paragraph 3 - Disadvantage':'disadvantages','Body Paragraph 3 - Counterargument/Additional Point':'disadvantages','Conclusion':'conclusion','CONCLUSION':'conclusion','Introduction - Purpose':'introduction_purpose','Introduction - Basis':'introduction_basis','General View':'general_view','GENERAL VIEW':'general_view','Praising':'praising','PRAISING':'praising','Criticising':'criticising','CRITICISING':'criticising','Criticizing':'criticising','CRITICIZING':'criticising','Recommendation':'recommendation','RECOMMENDATION':'recommendation','Recommendations':'recommendation','RECOMMENDATIONS':'recommendation','Introduction - Opening':'introduction_opening','Introduction - Background':'introduction_background','Reputation':'introduction_background','REPUTATION':'introduction_background','Features':'features','FEATURES':'features','Features - Paragraph 1':'features','Features - Paragraph 2':'features','Opening':'opening','OPENING':'opening','Body':'body','BODY':'body','Main Content':'body','MAIN CONTENT':'body','Main content':'body','Closing':'closing','CLOSING':'closing'};
  return m[lk];
}

function setReadingMode(mode){readingMode=mode;document.querySelectorAll('.mode-toggle-btn').forEach(b=>b.classList.remove('active'));event.target.closest('.mode-toggle-btn').classList.add('active');renderWriting();}

async function loadWritingType(type){
  currentType=type;completeTextIndex=0;
  document.querySelectorAll('.pill-btn').forEach(b=>b.classList.toggle('active',b.dataset.type===type));
  document.getElementById('brandSubtitle').textContent=type.charAt(0).toUpperCase()+type.slice(1)+' Models';
  const sp=document.getElementById('loadingSpinner'),mc=document.getElementById('mainContent');
  sp.style.opacity='1';sp.style.display='block';mc.style.opacity='0';mc.style.display='none';
  try{
    const r=await fetch(DATA_PATHS[type]);if(!r.ok)throw new Error();
    currentData=await r.json();
    const[hr,tr,fr]=await Promise.all([fetch(PHRASE_PATHS[type].hook),fetch(PHRASE_PATHS[type].thesis),fetch(PHRASE_PATHS[type].full)]);
    phraseData={hook:hr.ok?await hr.json():null,thesis:tr.ok?await tr.json():null,full:fr.ok?await fr.json():null};
    if(currentData.samples?.length>0){const n=currentData.samples[0].paragraphs.length;paragraphIndices=new Array(n).fill(0);viewModes=new Array(n).fill('text');swipeIndices={};renderWriting();}
  }catch(e){
    mc.innerHTML=`<div style="text-align:center;padding:4rem;color:var(--accent-ink,#A7573C)">Could not load ${type}. Check your connection and reload.</div>`;
    mc.style.display='block';mc.style.opacity='1';sp.style.display='none';
  }
}

function renderWriting(){
  const mc=document.getElementById('mainContent'),sp=document.getElementById('loadingSpinner');
  if(!currentData?.samples)return;
  let h='';
  if(currentData.title)h+=`<div class="essay-title">${currentData.title}</div>`;
  h+=readingMode==='complete'?renderCompleteTextView():renderSectionCardsView();
  h+=`<div class="nav-pills"><button class="pill-btn ${currentType==='essays'?'active':''}" data-type="essays" onclick="loadWritingType('essays')">Essays</button><button class="pill-btn ${currentType==='reports'?'active':''}" data-type="reports" onclick="loadWritingType('reports')">Reports</button><button class="pill-btn ${currentType==='reviews'?'active':''}" data-type="reviews" onclick="loadWritingType('reviews')">Reviews</button><button class="pill-btn ${currentType==='emails'?'active':''}" data-type="emails" onclick="loadWritingType('emails')">Emails</button></div>`;
  mc.innerHTML=h;
  setTimeout(()=>{sp.style.opacity='0';setTimeout(()=>sp.style.display='none',300);mc.style.display='block';setTimeout(()=>mc.style.opacity='1',50);},100);
}

function renderCompleteTextView(){
  const s=currentData.samples[completeTextIndex],tot=currentData.samples.length;
  let h='<div class="complete-text-view active">';
  s.paragraphs.forEach(p=>{h+=`<div class="complete-paragraph">${p.label?`<div class="complete-section-label">${p.label}</div>`:''}<div class="complete-paragraph-text">${highlightFirstWords(p.text)}</div></div>`;});
  h+=`<div class="complete-nav"><button class="complete-nav-btn" onclick="navigateCompleteText(-1)" ${completeTextIndex===0?'disabled':''}>← Previous</button><div class="complete-counter">${currentType.slice(0,1).toUpperCase()+currentType.slice(1,-1)} ${completeTextIndex+1} of ${tot}</div><button class="complete-nav-btn" onclick="navigateCompleteText(1)" ${completeTextIndex===tot-1?'disabled':''}>Next →</button></div></div>`;
  return h;
}

function renderSectionCardsView(){
  const fs=currentData.samples[0];
  let h='<div class="section-cards-view active">';
  fs.paragraphs.forEach((p,pi)=>{
    const si=paragraphIndices[pi],cur=currentData.samples[si].paragraphs[pi],tot=currentData.samples.length,vm=viewModes[pi];
    h+=`<div class="paragraph-section" data-para-index="${pi}">${cur.label?`<div class="section-heading">${cur.label}</div>`:''}<div class="paragraph-text" style="display:${vm==='text'?'block':'none'}">${highlightFirstWords(cur.text)}</div>${renderListView(pi,cur.label,vm)}${renderSwipeView(pi,cur.label,vm)}<div class="paragraph-nav-container"><button class="nav-btn" onclick="navigateParagraph(${pi},-1)" ${si===0?'disabled':''}>← PREV</button>${renderViewModeToggle(pi,cur.label)}<div class="sample-counter">${si+1}/${tot}</div><button class="nav-btn" onclick="navigateParagraph(${pi},1)" ${si===tot-1?'disabled':''}>NEXT →</button></div></div>`;
  });
  return h+'</div>';
}

function navigateCompleteText(d){const n=completeTextIndex+d;if(n>=0&&n<currentData.samples.length){completeTextIndex=n;renderWriting();}}

function renderViewModeToggle(pi,label){if(!label||!getPhraseSection(label))return'';const vm=viewModes[pi];return`<div class="view-mode-toggle-mini"><button class="view-mode-btn ${vm==='list'?'active':''}" onclick="setViewMode(${pi},'list')">LIST</button><button class="view-mode-btn ${vm==='swipe'?'active':''}" onclick="setViewMode(${pi},'swipe')">SLIDE</button></div>`;}

function renderListView(pi,label,vm){
  const ps=getPhraseSection(label);if(!ps)return'';
  const isIntro=label&&label.toLowerCase().includes('introduction');
  const isPaired=isIntro||(currentType==='reviews'&&label&&label.toLowerCase().includes('reputation'));
  let h=`<div class="phrase-list-view ${vm==='list'?'active':''}"><button class="modal-close-btn" onclick="setViewMode(${pi},'text')" title="Close">×</button>`;
  if(isPaired&&phraseData?.hook&&phraseData?.thesis){
    const et=ESSAY_TYPE_MAP[currentType],hk=getSectionKey(label,currentType)||'introduction_context';
    const hs=phraseData.hook.structures[et]?.sections[hk];
    const tKey=currentType==='essays'?'thesis_statement':currentType==='reports'?'introduction_basis':'introduction_background';
    const ts=phraseData.thesis.structures[et]?.sections[tKey];
    if(hs&&ts){
      Object.keys(hs.phrases).forEach(gk=>{
        const hks=hs.phrases[gk],ths=ts.phrases[gk],max=Math.max(hks.length,ths.length);
        const lbl=gk==='default'?'Core set':gk==='alt1'?'Alternative set 1':'Alternative set 2';
        h+=`<div class="phrase-group" data-variant="${gk}"><div class="phrase-group-icon"></div><div class="phrase-group-content"><div class="phrase-group-title">${lbl}</div><div class="phrase-list-wrapper"><ul class="phrase-list">${Array.from({length:max},(_,i)=>`<li style="margin-bottom:1.5rem;padding-bottom:1.5rem;border-bottom:1px solid rgba(var(--gold-rgb),.15);list-style:none;padding-left:0"><div style="margin-bottom:.75rem;line-height:1.6">${formatPhrase(hks[i%hks.length]||hks[0])}</div><div style="line-height:1.6">${formatPhrase(ths[i%ths.length]||ths[0])}</div></li>`).join('')}</ul></div></div></div>`;
      });
      return h+'</div>';
    }
  }
  const phrases=ps.phrases;
  Object.keys(phrases).forEach(gk=>{
    const lbl=gk==='default'?'Core Phrases':gk==='alt1'?'Alternative Set 1':'Alternative Set 2';
    h+=`<div class="phrase-group" data-variant="${gk}"><div class="phrase-group-icon"></div><div class="phrase-group-content"><div class="phrase-group-title">${lbl}</div><div class="phrase-list-wrapper"><ul class="phrase-list">${phrases[gk].map(p=>`<li>${formatPhrase(p)}</li>`).join('')}</ul></div></div></div>`;
  });
  return h+'</div>';
}

function renderSwipeView(pi,label,vm){
  let slides=[];
  const isIntro=label&&label.toLowerCase().includes('introduction');
  if(isIntro&&phraseData?.hook&&phraseData?.thesis){
    const et=ESSAY_TYPE_MAP[currentType],hk=getSectionKey(label,currentType)||'introduction_context';
    const hs=phraseData.hook.structures[et]?.sections[hk];
    const tKey=currentType==='essays'?'thesis_statement':currentType==='reports'?'introduction_basis':'introduction_background';
    const ts=phraseData.thesis.structures[et]?.sections[tKey];
    if(hs&&ts)Object.keys(hs.phrases).forEach(gk=>{const hks=hs.phrases[gk],ths=ts.phrases[gk]||[],max=Math.max(hks.length,ths.length);for(let i=0;i<max;i++)slides.push({type:'paired',hook:hks[i%hks.length]||hks[0],thesis:ths[i%ths.length]||ths[0]});});
  }
  if(!slides.length){const ps=getPhraseSection(label);if(!ps)return'';Object.keys(ps.phrases).forEach(gk=>ps.phrases[gk].forEach(p=>slides.push({type:'single',text:p})));}
  const key=`para_${pi}`,cur=swipeIndices[key]||0;
  return`<div class="swipe-view ${vm==='swipe'?'active':''}"><button class="modal-close-btn" onclick="setViewMode(${pi},'text')" title="Close">×</button><div class="swipe-slides-container">${slides.map((s,i)=>{let sc='';if(s.type==='paired'){const wc=(s.hook+' '+s.thesis).replace(/\[([^\]]+)\]/g,'$1').split(/\s+/).length,sz=wc<=15?'size-medium':wc<=25?'size-large':'size-xlarge';sc=`<div class="swipe-phrase-text ${sz}" style="text-align:left;max-width:85%"><div style="margin-bottom:1.5rem;line-height:1.5">${formatPhraseForSwipe(s.hook)}</div><div style="line-height:1.5;opacity:.95">${formatPhraseForSwipe(s.thesis)}</div></div>`;}else{const wc=s.text.replace(/\[([^\]]+)\]/g,'$1').split(/\s+/).length,sz=wc<=10?'size-small':wc<=20?'size-medium':wc<=30?'size-large':'size-xlarge';sc=`<div class="swipe-phrase-text ${sz}">${formatPhraseForSwipe(s.text)}</div>`;}return`<div class="swipe-slide ${i===cur?'active':''}">${sc}</div>`;}).join('')}<div class="swipe-nav-arrows"><button class="swipe-arrow" onclick="navigateSwipe(${pi},-1)" ${cur===0?'disabled':''}>←</button><button class="swipe-arrow" onclick="navigateSwipe(${pi},1)" ${cur===slides.length-1?'disabled':''}>→</button></div></div><div class="swipe-nav-dots">${slides.map((_,i)=>`<div class="swipe-dot ${i===cur?'active':''}" onclick="goToSwipeSlide(${pi},${i})"></div>`).join('')}</div></div>`;
}

function getPhraseSection(label){
  if(!phraseData)return null;
  const et=ESSAY_TYPE_MAP[currentType];if(!et)return null;
  let sk=getSectionKey(label,currentType);
  if(!sk){
    const ll=label?.toLowerCase()||'';
    if(currentType==='essays'){if(ll.includes('introduction'))sk='introduction_context';else if(ll.includes('thesis'))sk='thesis_statement';else if(ll.includes('advantage')&&!ll.includes('disadvantage'))sk='advantages';else if(ll.includes('disadvantage')||ll.includes('counterargument')||ll.includes('additional point'))sk='disadvantages';else if(ll.includes('conclusion'))sk='conclusion';}
    else if(currentType==='reports'){if(ll.includes('introduction')&&!ll.includes('basis'))sk='introduction_purpose';else if(ll.includes('basis'))sk='introduction_basis';else if(ll.includes('general')||ll.includes('overview'))sk='general_view';else if(ll.includes('prais')||ll.includes('positive')||ll.includes('strength'))sk='praising';else if(ll.includes('critic')||ll.includes('concern')||ll.includes('negative')||ll.includes('problem'))sk='criticising';else if(ll.includes('recommend'))sk='recommendation';else if(ll.includes('conclusion'))sk='conclusion';}
    else if(currentType==='reviews'){if(ll.includes('introduction')&&!ll.includes('background'))sk='introduction_opening';else if(ll.includes('reputation')||ll.includes('background'))sk='introduction_background';else if(ll.includes('feature'))sk='features';else if(ll.includes('recommend'))sk='recommendation';}
    else if(currentType==='emails'){if(ll.includes('opening')||ll.includes('greeting'))sk='opening';else if(ll.includes('body')||ll.includes('main')||ll.includes('content'))sk='body';else if(ll.includes('closing')||ll.includes('sign'))sk='closing';}
  }
  if(!sk)return null;
  let sd=null,lt=et;
  if(currentType==='essays')sd=sk==='introduction_context'?phraseData.hook:sk==='thesis_statement'?phraseData.thesis:phraseData.full;
  else if(currentType==='reports')sd=sk==='introduction_purpose'?phraseData.hook:sk==='introduction_basis'?phraseData.thesis:phraseData.full;
  else if(currentType==='reviews')sd=sk==='introduction_opening'?phraseData.hook:sk==='introduction_background'?phraseData.thesis:phraseData.full;
  else if(currentType==='emails'){const ll=label?.toLowerCase()||'',isFormal=ll.includes('formal');lt=isFormal?'formal_email':'informal_email';sd=sk==='opening'?phraseData.hook:sk==='body'?phraseData.thesis:phraseData.full;}
  if(!sd?.structures)return null;
  const struct=sd.structures[lt];if(!struct)return null;
  let fsk=sk;
  if(currentType==='emails'){const ll=label?.toLowerCase()||'',sfx=ll.includes('formal')?'_formal':'_informal';fsk=sk+sfx;}
  let section=struct.sections[fsk];
  if(!section&&currentType==='emails'){const av=Object.keys(struct.sections||{});const m=av.find(k=>k.toLowerCase().includes(sk));section=m?struct.sections[m]:av.length?struct.sections[av[0]]:null;}
  return section||null;
}

function formatPhrase(p){return p.replace(/\[([^\]]+)\]/g,'<span class="phrase-placeholder">[$1]</span>');}
function formatPhraseForSwipe(p){return p.replace(/\[([^\]]+)\]/g,'<span class="highlight">$1</span>');}

function setViewMode(pi,mode){
  if(mode!=='text'){const ps=getPhraseSection(currentData.samples[0].paragraphs[pi].label);if(!ps)return;}
  viewModes[pi]=mode;
  if(mode==='swipe'&&swipeIndices[`para_${pi}`]===undefined)swipeIndices[`para_${pi}`]=0;
  renderWriting();
}
function navigateSwipe(pi,d){const key=`para_${pi}`,cur=swipeIndices[key]||0;const ps=getPhraseSection(currentData.samples[0].paragraphs[pi].label);if(!ps)return;let tot=0;Object.keys(ps.phrases).forEach(k=>tot+=ps.phrases[k].length);const n=cur+d;if(n>=0&&n<tot){swipeIndices[key]=n;renderWriting();}}
function goToSwipeSlide(pi,idx){swipeIndices[`para_${pi}`]=idx;renderWriting();}
function highlightFirstWords(text){const s=text.split(/([.!?]\s+)/);let r='';for(let i=0;i<s.length;i++){const t=s[i];if(t.match(/^[.!?]\s+$/)||!t.trim()){r+=t;continue;}const w=t.trim().split(/\s+/),n=Math.min(5,Math.max(3,Math.floor(w.length*.3)));r+=`<span class="discourse-marker">${w.slice(0,n).join(' ')}</span>`;if(w.length>n)r+=' '+w.slice(n).join(' ');}return r;}
function navigateParagraph(pi,d){const n=paragraphIndices[pi]+d;if(n<0||n>=currentData.samples.length)return;paragraphIndices[pi]=n;renderWriting();}

window.addEventListener('DOMContentLoaded',()=>loadWritingType('essays'));
</script>
