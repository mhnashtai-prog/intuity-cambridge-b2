<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F3F1EC">
<title>INTUITY — Expand it</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..900&family=Geist+Mono:wght@500;600&family=Anton&display=swap" rel="stylesheet">
<style>
/* ═══ EXPAND IT (26 Oct 2026) ═════════════════════════════════════════════
   Rung 3 of the ladder — guided production, the rung both the book and
   the app were missing. One point of a real question, and the student
   writes the three sentences that turn a point into a paragraph:
   Reason → Example → Result (Majid's recipe, steps 4–6: "the heart of
   every paragraph"). Each box starts with a linker the student can keep
   or change. Check = a coach, not a grade: right kind of linker, enough
   of your own words, about the question, word count. Then the student's
   paragraph sits beside a model paragraph from the samples.
   Drafts are kept on this device. Reached from the end of the Workout,
   on the same question (?q=id). */
:root{--paper:#F3F1EC;--card:#FAF8F5;--ink:#232C31;--soft:#3A3F44;--quiet:#6B655C;--faint:#8A8378;--chip:#E7E3DC;--chipH:#DDD8CF;
  --cara:#A9875F;--sage:#4F6F65;--ok:#E1EDE7;--okInk:#2F5A4B;--warn:#F7EEDC;--warnInk:#7A5512}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'Geist',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,textarea{font:inherit;color:inherit}
.ihead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;max-width:980px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + .6rem) 16px .5rem}
.back{justify-self:start;font:700 11px/1 'Geist',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#756B6E;text-decoration:none;padding:10px 4px}
.wordmark{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.app-title{font-size:1.09rem;font-weight:900;letter-spacing:.2em}
.app-subtitle{font-size:.6875rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#5C5852;margin-top:.1rem}
.lvl{justify-self:end;font:600 .6875rem/1 'Geist Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:#756B6E;background:#E8E1D6;border-radius:6px;padding:.4rem .65rem}
.lvl b{color:#4A433D}
main{max-width:980px;margin:0 auto;padding:12px 16px 120px}
.card{background:var(--card);border-radius:3px;box-shadow:0 1px 2px rgba(20,17,14,.05),0 8px 22px rgba(20,17,14,.035);padding:20px 24px 22px;margin:0 0 16px}
.lab{display:flex;align-items:center;gap:12px;font:600 11.5px/1 'Geist Mono',monospace;letter-spacing:.24em;text-transform:uppercase;color:var(--faint);margin:0 0 12px}
.lab::before{content:'';width:28px;height:10px;background:var(--cara);flex:none}
h1{margin:0 0 6px;font:400 clamp(26px,4.4vw,40px)/1 'Anton',Impact,sans-serif}
.ask{margin:0 0 4px;font-size:17px;line-height:1.45}
.do{margin:2px 0 14px;font-size:14.5px;color:var(--quiet)}
.do b{color:var(--ink);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:none;background:var(--chip);border-radius:999px;padding:9px 15px;font-size:14.5px;font-weight:500;cursor:pointer;line-height:1.3}
.chip:hover{background:var(--chipH)}
.chip[aria-pressed="true"]{background:var(--ink);color:#FAF8F5}
.topic{margin:16px 0 4px;padding:12px 16px;background:#fff;border-radius:8px;box-shadow:inset 0 0 0 1.5px rgba(20,17,14,.08);font-size:16px;line-height:1.5}
.topic small{display:block;font:600 10.5px/1 'Geist Mono',monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.step{margin:14px 0 0}
.step label{display:flex;align-items:center;gap:8px;font:600 11px/1 'Geist Mono',monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);margin:0 0 6px}
.step label i{font-style:normal;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--sc);color:var(--si);font-size:11px;letter-spacing:0}
.step label span{font-family:'Geist',sans-serif;letter-spacing:0;text-transform:none;font-size:12.5px;font-weight:500;color:var(--quiet)}
textarea{width:100%;min-height:62px;resize:vertical;border:none;border-radius:8px;background:#fff;box-shadow:inset 0 0 0 1.5px rgba(20,17,14,.12);padding:11px 14px;font-size:16px;line-height:1.5}
textarea:focus{outline:none;box-shadow:inset 0 0 0 2px var(--sage)}
.alts{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0}
.alts button{border:none;background:none;padding:2px 0;margin-right:10px;font-size:12.5px;color:var(--quiet);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.fb{margin:6px 0 0;font-size:13.5px;line-height:1.45;border-radius:6px;padding:6px 10px}
.fb.ok{background:var(--ok);color:var(--okInk)}
.fb.warn{background:var(--warn);color:var(--warnInk)}
.count{margin:14px 0 0;font-size:13.5px;color:var(--quiet)}
.count b{color:var(--ink)}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.compare h3{margin:0 0 8px;font:600 11px/1 'Geist Mono',monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
.compare p{margin:0;font-size:15.5px;line-height:1.65;color:var(--soft)}
.compare b{color:var(--ink);font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:rgba(243,241,236,.94);backdrop-filter:blur(8px);border-top:1px solid rgba(20,17,14,.1)}
.btn{border:none;border-radius:999px;padding:12px 22px;font-size:14px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;background:var(--chip);color:var(--ink)}
.btn.main{background:var(--ink);color:#FAF8F5}
.btn:disabled{opacity:.4;cursor:default}
.state{text-align:center;color:var(--faint);padding:60px 0}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,10px);opacity:0;background:#1C1C1C;color:#fff;font-size:14px;padding:9px 16px;border-radius:999px;pointer-events:none;transition:all .2s}
.toast.show{transform:translate(-50%,0);opacity:1}
@media (max-width:640px){ .card{padding:16px} .compare{grid-template-columns:1fr} textarea{font-size:16px} }
</style>
</head>
<body>
<header class="ihead">
  <a class="back" href="/skills/writing/gate.html?task=essays" target="_top">← Essay</a>
  <div class="wordmark"><div class="app-title">INTUITY</div><div class="app-subtitle">Expand it</div></div>
  <span class="lvl">Level <b>B2</b></span>
</header>
<main id="main"><p class="state">Loading…</p></main>
<div class="bar" id="bar"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P=new URLSearchParams(location.search);
const BASE='/skills/writing/essays/data/';
const store={get(k){try{return JSON.parse(localStorage.getItem('intuity.expand.'+k)||'null')}catch(e){return null}},set(k,v){try{localStorage.setItem('intuity.expand.'+k,JSON.stringify(v))}catch(e){}}};

/* the three moves, in the order of Majid's recipe (steps 4–6) */
const MOVES=[
  {key:'reason', n:4, name:'Reason', hint:'Why is this true?', sc:'#8AA79C', si:'#232C31',
   starts:['This is because','This is largely due to the fact that','The reason for this is that']},
  {key:'example',n:5, name:'Example',hint:'Show it with something real.', sc:'#9A5A2C', si:'#fff',
   starts:['For example,','For instance,','A clear example of this is']},
  {key:'result', n:6, name:'Result', hint:'What happens because of it?', sc:'#484641', si:'#fff',
   starts:['As a result,','Consequently,','This means that']}];
function job(t){ t=t.toLowerCase().trim();
  if(/^(for example|for instance|such as|in particular|especially|a clear example|take)/.test(t)) return 'example';
  if(/^(as a result|consequently|therefore|hence|thus|this means|this leads|for this reason|so\b)/.test(t)) return 'result';
  if(/^(this is because|because|this is (largely )?due|due to|owing to|since|given that|the reason|this stems)/.test(t)) return 'reason';
  if(/^(however|although|even though|despite|nevertheless|on the other hand)/.test(t)) return 'contrast';
  return null; }
const STOP=new Set('the a an and or of to in on for with at by from is are was were be been it this that these those they their there as more most many much can could would should will not no but also than then so such very really about into over your our its his her we you people'.split(' '));
const words=t=>(t.toLowerCase().match(/[a-z']+/g)||[]);
const content=t=>words(t).filter(w=>w.length>3&&!STOP.has(w));
const stem=w=>w.replace(/(ing|ed|es|s|ly|ment|ness|ity|al)$/,'').slice(0,6);

let QS=[], SM={}, Q=null, NOTE=0, D=null;

function topicSentence(){
  const p=(Q.points||[])[NOTE]||{}, lead=['To begin with','Secondly','Finally'][NOTE]||'Firstly';
  /* a clause takes "it is widely believed that"; a bare note (a noun) needs "is" */
  if(p.clause) return `${lead}, it is widely believed that ${p.clause.replace(/\.$/,'')}.`;
  return `${lead}, one important point to consider is ${((Q.writingPoints||[])[NOTE]||'this').replace(/\.$/,'')}.`;
}
function draftKey(){ return Q.id+'.'+NOTE; }
function load(){ D=store.get(draftKey())||{s:MOVES.map(m=>m.starts[0]+' ')}; }
function save(){ store.set(draftKey(),D); }

function draw(){
  const notes=(Q.writingPoints||[]).filter(n=>!/own idea/i.test(n));
  load();
  $('main').innerHTML=
    `<section class="card"><p class="lab">Today’s question</p><h1>${esc(Q.topic||'Essay')}</h1><p class="ask">${esc(Q.mainQuestion)}</p></section>`+
    `<section class="card"><p class="lab">Expand one point</p>`+
    `<p class="do"><b>Choose the point to expand.</b></p><div class="chips">${notes.map((n,i)=>`<button type="button" class="chip" data-n="${i}" aria-pressed="${i===NOTE}">${esc(n)}</button>`).join('')}</div>`+
    `<div class="topic"><small>Your paragraph starts</small>${esc(topicSentence())}</div>`+
    MOVES.map((m,i)=>`<div class="step" style="--sc:${m.sc};--si:${m.si}"><label for="t${i}"><i>${m.n}</i>${m.name} <span>— ${m.hint}</span></label>`+
      `<textarea id="t${i}" data-i="${i}" spellcheck="true" autocapitalize="sentences">${esc(D.s[i])}</textarea>`+
      `<div class="alts">${m.starts.map(st=>`<button type="button" data-i="${i}" data-s="${esc(st)}">${esc(st)} …</button>`).join('')}</div><div id="fb${i}"></div></div>`).join('')+
    `<p class="count" id="count"></p></section><div id="cmp"></div>`;
  $('main').querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{ NOTE=+b.dataset.n; draw(); });
  $('main').querySelectorAll('textarea').forEach(t=>t.oninput=()=>{ D.s[+t.dataset.i]=t.value; save(); count(); });
  $('main').querySelectorAll('.alts button').forEach(b=>b.onclick=()=>{ const i=+b.dataset.i, t=$('t'+i);
    const own=t.value.replace(new RegExp('^\\s*'+MOVES[i].starts.map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|^\\s*')),'').trim();
    t.value=b.dataset.s+' '+own; D.s[i]=t.value; save(); t.focus(); count(); });
  count();
  $('bar').innerHTML=`<button class="btn" id="newQ" type="button">New question</button><button class="btn main" id="check" type="button">Check</button>`;
  $('newQ').onclick=()=>{ pickQ(); draw(); window.scrollTo(0,0); };
  $('check').onclick=check;
}
function count(){
  const n=words(topicSentence()+' '+D.s.join(' ')).length;
  $('count').innerHTML=`Your paragraph: <b>${n} words</b> · a body paragraph is usually about 40–60.`;
}
/* a coach, not a grade */
function check(){
  const key=content(Q.mainQuestion+' '+(Q.writingPoints||[]).join(' ')+' '+topicSentence()+' '+(Q.topicPhrase||'')).map(stem);
  let good=0;
  MOVES.forEach((m,i)=>{
    const t=D.s[i].trim(), j=job(t), starter=m.starts.find(st=>t.toLowerCase().startsWith(st.toLowerCase().replace(/[ ,…]+$/,'')));
    const own=t.replace(starter?new RegExp('^'+starter.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i'):/^/,'').trim();
    const n=words(own).length, onTopic=content(own).some(w=>key.includes(stem(w)));
    const tips=[];
    if(j!==m.key) tips.push(j?`This starts like ${j==='contrast'?'a contrast':'a '+j} — the ${m.name.toLowerCase()} needs a linker like “${m.starts[0]}”.`:`Start with a ${m.name.toLowerCase()} linker, like “${m.starts[0]}”.`);
    if(n<5) tips.push(n?`Add more of your own words — ${n} is very short.`:`Write your own words after the linker.`);
    else if(n>35) tips.push('Long sentence — could it be two?');
    if(n>=5&&!onTopic) tips.push(`Is it about ${esc((Q.writingPoints||[])[NOTE]||'the point')}? Use a word from the question.`);
    if(n>=5&&!/[.!?]$/.test(t)) tips.push('End with a full stop.');
    const ok=!tips.length; if(ok) good++;
    $('fb'+i).innerHTML=`<p class="fb ${ok?'ok':'warn'}">${ok?`✓ A clear ${m.name.toLowerCase()}.`:tips.join(' ')}</p>`;
  });
  compare(good);
}
function compare(good){
  const s=SM[Q.id]; if(!s){ return; }
  const ps=[...(s.styles.default||'').matchAll(/<p>([\s\S]*?)<\/p>/g)].map(m=>m[1]).slice(1,-1);
  const note=content((Q.writingPoints||[])[NOTE]||'').map(stem);
  const model=ps.find(p=>content(p.replace(/<[^>]+>/g,'')).some(w=>note.includes(stem(w))))||ps[NOTE]||ps[0]||'';
  const mine=esc(topicSentence())+' '+D.s.map((t,i)=>{ const st=MOVES[i].starts.find(x=>t.toLowerCase().startsWith(x.toLowerCase().replace(/[ ,…]+$/,'')));
    return st?`<b>${esc(t.slice(0,st.replace(/[ …]+$/,'').length))}</b>${esc(t.slice(st.replace(/[ …]+$/,'').length))}`:esc(t); }).join(' ');
  const mod=model.replace(/<span class='\w+'>([^<]+)<\/span>/g,(m,t)=>`<b>${esc(t)}</b>`).replace(/<(?!\/?b>)[^>]+>/g,'');
  $('cmp').innerHTML=`<section class="card"><p class="lab">Compare</p><p class="do"><b>${good===3?'All three moves are there.':good+' of 3 moves are clear.'}</b> Read your paragraph next to a model. Different ideas are fine — look at the shape.</p>`+
    `<div class="compare"><div><h3>Yours</h3><p>${mine}</p></div><div><h3>Model</h3><p>${mod}</p></div></div></section>`;
  $('bar').innerHTML=`<button class="btn" id="newQ" type="button">New question</button><button class="btn" id="other" type="button">Another point</button><button class="btn" id="copy" type="button">Copy mine</button><button class="btn main" id="check" type="button">Check again</button>`;
  $('check').onclick=check;
  $('copy').onclick=()=>{ const t=topicSentence()+' '+D.s.map(x=>x.trim()).join(' ');
    (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Copied'),()=>toast('Select the text to copy it')); };
  $('other').onclick=()=>{ NOTE=(NOTE+1)%Math.max(1,(Q.writingPoints||[]).filter(n=>!/own idea/i.test(n)).length); draw(); window.scrollTo(0,0); };
  $('newQ').onclick=()=>{ pickQ(); draw(); window.scrollTo(0,0); };
  $('cmp').scrollIntoView({behavior:'smooth',block:'start'});
}
let tt=null; function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),1300); }
function pickQ(){ const pool=QS.filter(q=>SM[q.id]&&(!Q||q.id!==Q.id)); Q=pool[Math.floor(Math.random()*pool.length)]; NOTE=0; }
Promise.all([fetch(BASE+'essay-questions.json').then(r=>r.json()),fetch(BASE+'samples.json').then(r=>r.json())]).then(([q,s])=>{
  QS=q.questions||[]; let list=s[Object.keys(s)[0]]; if(!Array.isArray(list)) list=Object.values(list); list.forEach(x=>SM[x.id]=x);
  Q=QS.find(x=>x.id===P.get('q'))||null; if(!Q) pickQ(); draw();
}).catch(()=>{ $('main').innerHTML='<p class="state">This page didn’t load — reload to try again.</p>'; });
})();
</script>
</body>
</html>
