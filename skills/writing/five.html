<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>INTUITY — Your review in five</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..900&family=Geist+Mono:wght@400..600&family=Space+Grotesk:wght@700&family=Anton&display=swap" rel="stylesheet">

<style>
/* ═══════════════════════════════════════════════════════════════════════
   YOUR REVIEW IN FIVE  ·  v2 (5 Nov 2026) — the blueprint for every task

   Michael: "A kid feels he has learned the type if he can make up a mental
   model in his head: one introduction, three body phrases, one
   recommendation." Five slots, never more.

   Built from INTUITY's own parts (v2, Michael: "the mechanics and
   architecture always in INTUITY style"):
     · the writing header (writing-chrome.js): INTUITY · Review · Part 2,
       the task tabs, and the subjects as the filter row
     · the pendulum gate (as the Challenge): one object, one instruction
     · each slot in the focus card (as the Challenge's tiles)
     · the stage pill at the foot: Practise · My review

   The round: the phrase with one word as a first-letter cue and his own
   subject's name in it; he says it, finishes the gap aloud, Show it, Got
   it / Not yet. A slot right on two different days is HIS: it unlocks two
   more wordings, or his own sentence if it does the slot's job. Every
   answer joins the review deck (Be2): back after 1, 3, 7 and 21 days.
   Content: data/writing/five/<task>.json. All on this device.
   ═══════════════════════════════════════════════════════════════════════ */
:root{ --mark-sweep:#C2956E; --mark-rest:#4A433D; --mark-core:#201E1C; --mark-ink:#E5D1B8; --mark-pct:100%;
  --f5-dim:var(--soft,#5C5852); --f5-faint:var(--mute,#8A847C); --f5-rule:var(--rule,#D8CFC2); --f5-car:var(--caramel,#C2956E); --f5-card:var(--sheet,#FAF8F5) }
[hidden]{display:none!important}
.stage{max-width:36rem;margin:0 auto}
/* the subjects slide on a phone, starting from the first (a centred row that overflows hides its start) */
@media(max-width:700px){#subj{justify-content:flex-start!important}}

/* ── the gate: the pendulum and one instruction (as the Challenge) ── */
.gate{text-align:center;padding-top:2.6rem}
.gate .gate-mark{display:block;width:104px;height:104px;margin:0 auto 1.4rem;border:0;padding:0;background:none;cursor:pointer}
.gate .gate-mark .pend-dial span{font-size:1.6rem}
.kick{display:flex;align-items:center;gap:9px;font-family:var(--f-mono);font-size:0.6875rem;letter-spacing:.24em;text-transform:uppercase;color:var(--accent-ink,#8A5A35)}
.kick::before{content:'';display:block;width:26px;height:10px;flex:none;background:var(--f5-car)}
.gate .kick{justify-content:center}
.title{display:inline-block;font-family:var(--f-display);font-weight:800;font-size:clamp(1.25rem,4.4vw,1.8rem);letter-spacing:.3em;text-transform:uppercase;line-height:1.15;color:var(--ink);
  margin:.6rem 0 .8rem;padding-bottom:.7rem;border-bottom:3px double var(--ink)}
.lead{font-size:.95rem;line-height:1.55;color:var(--f5-dim);margin:0 auto 1.1rem;max-width:30rem}
.pick{max-width:24rem;margin:.4rem auto 0;padding:.9rem 0;border-top:1px solid var(--f5-rule);border-bottom:1px solid var(--f5-rule)}
.pick label{display:block;font-family:var(--f-display);font-size:.84rem;color:var(--f5-faint);margin:0 0 .5rem}
.pick input{width:100%;box-sizing:border-box;border:1.5px solid var(--ink);border-radius:999px;padding:.75rem 1.1rem;background:var(--f5-card);
  font:600 1rem var(--f-display);color:var(--ink);text-align:center}
.slots{display:flex;justify-content:center;gap:.35rem;margin:1rem 0 0}
.slots i{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;font:600 .7rem/1 var(--f-mono);font-style:normal;
  background:rgba(20,17,14,.07);color:var(--f5-faint)}
.slots i.lrn{background:#F2E6DA;color:#9A5A2C} .slots i.own{background:var(--ink);color:var(--mark-ink)}
.slots-key{font-size:.74rem;color:var(--f5-faint);margin:.45rem 0 0}
.btn{font-family:var(--f-display);font-size:.92rem;font-weight:600;padding:.8rem 1.6rem;border-radius:999px;cursor:pointer;border:1.5px solid var(--ink);background:none;color:var(--ink)}
.btn.fill{background:var(--ink);color:var(--f5-card)}
.btn:disabled{opacity:.35;cursor:default}
.cta{display:flex;justify-content:center;gap:.6rem;flex-wrap:wrap;margin-top:1.2rem}

/* ── the focus card (as the Challenge's tiles) ── */
.scrim{position:fixed;inset:0;z-index:900;display:flex;align-items:center;justify-content:center;padding:1rem;
  background:rgba(20,17,14,.34);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;transition:opacity .25s}
.scrim.on{opacity:1}
.focus{position:relative;width:min(33rem,100%);max-height:90vh;overflow-y:auto;background:var(--f5-card);border-radius:var(--r-box,4px);
  box-shadow:0 24px 60px -18px rgba(20,17,14,.38),0 6px 16px rgba(20,17,14,.14);padding:1.6rem 1.5rem 1.4rem;
  transform:translateY(24px) scale(.97);transition:transform .45s cubic-bezier(.2,1.3,.4,1)}
.scrim.on .focus{transform:none}
.focus .x{position:absolute;top:.8rem;right:.9rem;border:none;background:none;font-size:1rem;color:var(--f5-faint);cursor:pointer;padding:.4rem}
.focus h2{font-family:'Anton',Impact,var(--f-display),sans-serif;font-weight:400;font-size:clamp(1.6rem,6vw,2.1rem);line-height:1.02;color:var(--ink);margin:.45rem 0 .2rem;text-transform:uppercase}
.focus h2::after{content:'';display:block;width:40px;height:3px;background:var(--ink);margin:.65rem 0 0}
.focus .cta{justify-content:flex-start;margin-top:1rem}
.line{font-family:var(--f-display);font-weight:600;font-size:1.15rem;line-height:1.55;color:var(--ink);margin:1rem 0 .7rem}
.line .cue{color:#9A5A2C;font-weight:800;letter-spacing:.05em}
.line .nm{background:rgba(194,149,110,.26);padding:0 .2em;border-radius:3px}
.line .gap{display:inline-block;min-width:3em;border-bottom:2px dotted #9A5A2C;height:1em;vertical-align:-.15em}
.line mark{background:none;color:inherit;box-shadow:inset 0 -.55em 0 rgba(194,149,110,.45)}
.aim{font-size:.86rem;line-height:1.5;color:var(--f5-dim);margin:.2rem 0 0;padding-left:.7rem;border-left:3px solid var(--f5-car)}
/* the wordings to pick from (the Challenge's answer rows) */
.opts{display:flex;flex-direction:column;margin:1rem 0 0}
.opt{display:flex;align-items:flex-start;gap:.8rem;text-align:left;padding:.8rem .2rem;border:none;border-bottom:1px solid var(--f5-rule);background:none;
  font:inherit;font-size:.96rem;line-height:1.5;color:var(--ink);cursor:pointer}
.opt .l{flex:none;width:24px;height:24px;border-radius:50%;background:rgba(20,17,14,.07);display:grid;place-items:center;font:600 .6875rem var(--f-mono);color:var(--f5-faint);margin-top:.05rem}
.opt.on .l{background:var(--ink);color:var(--f5-card)}
.opt .nm{background:rgba(194,149,110,.26);padding:0 .2em;border-radius:3px}
.opt .gap{display:inline-block;min-width:2.4em;border-bottom:2px dotted #9A5A2C;height:1em;vertical-align:-.15em}

/* ── My review: the five, then the notebook ── */
.mine{padding-top:1.4rem}
.mine .kick{margin:0 0 .2rem}
.five{list-style:none;margin:1rem 0 1.2rem;padding:0;border-top:1px solid var(--f5-rule)}
.five li{display:grid;grid-template-columns:2rem 1fr;gap:.6rem;padding:.8rem 0;border-bottom:1px solid var(--f5-rule);font-size:.98rem;line-height:1.5;color:var(--ink)}
.five b.n{font-family:'Anton',Impact,sans-serif;font-weight:400;font-size:1.5rem;line-height:1;text-align:center}
.five small{display:flex;justify-content:space-between;gap:.5rem;font:600 .6rem/1.6 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--f5-faint);margin:0 0 .15rem}
.five .st{padding:0 .5rem;border-radius:999px;background:rgba(20,17,14,.07)}
.five .st.lrn{background:#F2E6DA;color:#9A5A2C} .five .st.own{background:var(--ink);color:var(--mark-ink)}
.five .nm{background:rgba(194,149,110,.26);padding:0 .2em;border-radius:3px}
.five .gap{display:inline-block;min-width:3em;border-bottom:2px dotted #9A5A2C;height:1em;vertical-align:-.15em}
.note{background:var(--f5-card);border-left:3px solid #D98A8A;padding:1rem 1.1rem;font-size:.92rem;line-height:1.55;color:var(--ink);box-shadow:0 12px 28px -18px rgba(35,44,49,.35)}
.note .kick{margin:0 0 .5rem}
.note p{margin:0 0 .4rem} .note p:last-child{margin:0;color:var(--f5-dim);font-size:.84rem}
.wr-foot button.wr-stage{font:inherit;font-family:var(--f-display);font-size:0.6875rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
@media(prefers-reduced-motion:reduce){.scrim,.focus{transition:none}}
</style>
<script src="/tools/be2-brand.js?v=20261012c"></script>
</head>
<body data-writing="reviews" data-stage="five">
<div class="shell">
  <div class="topbar"><a class="back-link" href="/skills/writing/gate.html?task=reviews">← Review</a><span class="brand">INTUITY</span></div>
  <div class="filter-bar" id="subj" role="tablist" aria-label="What you review"></div>
  <main class="stage" id="stage"><p style="text-align:center;color:var(--f5-faint)">Loading…</p></main>
  <div class="wr-foot foot"><div class="wr-stages" role="group" aria-label="Mode">
    <button type="button" class="wr-stage active" data-m="practise">Practise</button>
    <button type="button" class="wr-stage" data-m="mine">My review</button>
  </div></div>
</div>
<div class="scrim" id="scrim" hidden><div class="focus" id="focus" role="dialog" aria-modal="true" aria-labelledby="fTitle"></div></div>
<script>
(function(){
'use strict';
const P=new URLSearchParams(location.search);
const TASK=/^[a-z]+$/.test(P.get('task')||'')?P.get('task'):'reviews';
const KEY='be2.five.'+TASK;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>{ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const load=()=>{ try{ return JSON.parse(localStorage.getItem(KEY)||'null')||{}; }catch(e){ return {}; } };
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(ST)); }catch(e){} };
let D, ST, MODE='practise', at=0, res=[];

/* ── state ── */
function S(){ return D.subjects.find(s=>s.key===ST.key)||D.subjects[0]; }
function name(){ return (ST.names&&ST.names[ST.key])||''; }
function slotState(i){ ST.slots=ST.slots||[]; return ST.slots[i]=ST.slots[i]||{days:[]}; }
function owned(i){ return slotState(i).days.length>=2; }
function status(i){ const n=slotState(i).days.length; return n>=2?['own','Yours']:n===1?['lrn','Day 1']:['','New']; }
function way(i){ const s=slotState(i); return s.pick==='own'?null:D.slots[i].ways[typeof s.pick==='number'?s.pick:0]; }

/* a wording for HIS thing: the name boxed, the “…” a dotted gap, and the
   hidden word as its first letter (cue) or marked (shown) */
function render(w,mode){
  const s=S(), X=name()||s.eg;
  let t=esc(w.t.replace(/\{a\}/g,s.a).replace(/\{plural\}/g,s.plural)).replace(/\{X\}/g,'\u0001');
  const re=new RegExp('\\b'+w.hide+'\\b');
  if(mode==='cue') t=t.replace(re,'<span class="cue">'+w.hide[0]+'___</span>');
  else if(mode==='shown') t=t.replace(re,'<mark>'+w.hide+'</mark>');
  return t.replace(/\u0001/g,'<span class="nm">'+esc(X)+'</span>').replace(/…/g,'<span class="gap"></span>');
}
function plain(w,cue){
  const s=S(); let t=w.t.replace(/\{a\}/g,s.a).replace(/\{plural\}/g,s.plural).replace(/\{X\}/g,name()||s.eg);
  return cue?t.replace(new RegExp('\\b'+w.hide+'\\b'),w.hide[0]+'___'):t;
}

/* ── the header's filter row: the subjects ── */
function tabs(){
  $('subj').innerHTML=D.subjects.map(s=>'<button type="button" class="ftab'+(s.key===ST.key?' active':'')+'" role="tab" aria-selected="'+(s.key===ST.key)+'" data-k="'+s.key+'">'+esc(s.label.replace(/^An? /,''))+'</button>').join('');
  $('subj').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{ ST.key=b.dataset.k; save(); tabs(); paint(); });
}

/* ── PRACTISE: the pendulum gate ── */
function gate(){
  const s=S(), own=D.slots.filter((_,i)=>owned(i)).length;
  document.documentElement.style.setProperty('--mark-pct',Math.max(4,own/D.slots.length*100)+'%');
  $('stage').innerHTML='<section class="gate">'+
    '<button type="button" class="gate-mark pend-hang" id="dial" aria-label="Start"><div class="pend-dial"><span>5</span></div></button>'+
    '<div class="kick">'+esc(D.name)+' · Part 2</div><h1 class="title">Your '+esc(D.name.toLowerCase())+' in five</h1>'+
    '<p class="lead">One introduction, three features, one recommendation, about your own '+esc(s.a.replace(/^an? /,''))+'.</p>'+
    '<div class="pick"><label for="nm">Which '+esc(s.a.replace(/^an? /,''))+'? Its name</label><input id="nm" maxlength="40" autocomplete="off" placeholder="e.g. '+esc(s.eg)+'" value="'+esc(name())+'"></div>'+
    '<div class="slots" aria-label="Your five slots">'+D.slots.map((_,i)=>'<i class="'+status(i)[0]+'" title="'+esc(D.slots[i].part)+' · '+status(i)[1]+'">'+(i+1)+'</i>').join('')+'</div>'+
    '<p class="slots-key">'+(own?own+' of 5 slots are yours':'A slot is yours once you have it on two different days')+'</p>'+
    '<div class="cta"><button type="button" class="btn fill" id="go">Start</button></div></section>';
  const ok=()=>{ $('go').disabled=!$('nm').value.trim(); };
  $('nm').oninput=()=>{ ST.names=ST.names||{}; ST.names[ST.key]=$('nm').value.trim().replace(/\s+/g,' '); save(); ok(); };
  $('nm').onkeydown=e=>{ if(e.key==='Enter'&&!$('go').disabled) start(); };
  const go=()=>{ if($('go').disabled){ $('nm').focus(); return; } start(); };
  $('go').onclick=go; $('dial').onclick=go; ok();
}

/* ── the focus card ── */
function card(html){ $('focus').innerHTML='<button class="x" type="button" aria-label="Close" id="fx">✕</button>'+html;
  const s=$('scrim'); if(s.hidden){ s.hidden=false; requestAnimationFrame(()=>s.classList.add('on')); } $('fx').onclick=close; }
function close(){ const s=$('scrim'); s.classList.remove('on'); setTimeout(()=>{ s.hidden=true; paint(); },250); }
function kick(i){ return '<div class="kick">'+esc(D.name)+' · Slot '+(i+1)+' of '+D.slots.length+'</div>'; }
function title(i){ return '<h2 id="fTitle">'+esc(D.slots[i].part==='Feature'?'A feature':D.slots[i].part)+'</h2>'; }

function start(){ at=0; res=[]; slot(); }
function slot(){
  if(at>=D.slots.length) return done();
  const s=slotState(at);
  if(owned(at)&&s.pick==null) return choose();
  const w=way(at);
  if(!w){   /* his own sentence: the job, then he says it */
    card(kick(at)+title(at)+'<p class="line">Your own sentence</p><p class="aim">It must '+esc(D.slots[at].job)+'. Say it now.</p>'+
      '<div class="cta"><button type="button" class="btn fill" id="said">I said it</button><button type="button" class="btn" id="back">Choose a wording</button></div>');
    $('said').onclick=()=>mark(true,null); $('back').onclick=()=>{ delete s.pick; save(); choose(); };
    return;
  }
  card(kick(at)+title(at)+'<p class="line">'+render(w,'cue')+'</p>'+
    '<p class="aim">'+(/…/.test(w.t)?'Say it, and finish it with your own detail: '+esc(S().ask):'Say it, out loud or in your head.')+'</p>'+
    '<div class="cta"><button type="button" class="btn fill" id="see">Show it</button></div>');
  $('see').onclick=()=>reveal(w); $('see').focus({preventScroll:true});
}
function reveal(w){
  card(kick(at)+title(at)+'<p class="line">'+render(w,'shown')+'</p><p class="aim">Did you have it?</p>'+
    '<div class="cta"><button type="button" class="btn" id="no">Not yet</button><button type="button" class="btn fill" id="yes">Got it</button></div>');
  $('no').onclick=()=>mark(false,w); $('yes').onclick=()=>mark(true,w);
}
function mark(ok,w){
  const s=slotState(at), t=today();
  if(ok){ if(s.days.indexOf(t)<0) s.days.push(t); }
  else if(!owned(at)) s.days=[];          /* not his yet: start again; a slot he owns stays his */
  save(); res[at]=ok;
  if(w) try{ Be2.answer('five-'+TASK,{id:'s'+(at+1)+'-'+D.slots[at].ways.indexOf(w),correct:ok,keep:true,kind:'recall',
    prompt:plain(w,true),answer:plain(w,false),href:'/skills/writing/five.html?task='+TASK}); }catch(e){}
  at++; slot();
}
/* a slot that is his: two more wordings, or his own sentence */
function choose(){
  const ways=D.slots[at].ways; let k=0;
  const draw=()=>{
    card('<div class="kick">'+esc(D.name)+' · Slot '+(at+1)+' is yours</div><h2 id="fTitle">Pick your way</h2>'+
      '<p class="aim">To '+esc(D.slots[at].pick||D.slots[at].job)+'. This one is yours now: choose how you say it.</p><div class="opts">'+
      ways.map((w,j)=>'<button type="button" class="opt'+(j===k?' on':'')+'" data-j="'+j+'"><span class="l">'+'ABC'[j]+'</span><span>'+render(w,'plain')+'</span></button>').join('')+
      '<button type="button" class="opt'+(k==='own'?' on':'')+'" data-j="own"><span class="l">✎</span><span><b>My own sentence</b>, if it does the same job</span></button></div>'+
      '<div class="cta"><button type="button" class="btn fill" id="keep">Keep this one</button></div>');
    $('focus').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ k=b.dataset.j==='own'?'own':+b.dataset.j; draw(); });
    $('keep').onclick=()=>{ slotState(at).pick=k; save(); slot(); };
  };
  draw();
}
function done(){
  const got=res.filter(Boolean).length;
  card('<div class="kick">'+esc(D.name)+' · Five done</div><h2 id="fTitle">'+got+' of 5</h2>'+
    '<p class="aim">'+(got===5?'Every slot. Come back tomorrow: a slot is yours once you have it on two different days.':'The ones you missed come back in your review. A slot is yours once you have it on two different days.')+'</p>'+
    '<div class="cta"><button type="button" class="btn fill" id="see5">See my review</button><button type="button" class="btn" id="again">Again</button></div>');
  $('see5').onclick=()=>{ setMode('mine'); close(); };
  $('again').onclick=start;
}

/* ── MY REVIEW: his five, then the notebook ── */
function mine(){
  const X=name()||S().eg;
  $('stage').innerHTML='<section class="mine"><div class="kick">'+esc(D.name)+' · Part 2</div><h1 class="title" style="letter-spacing:.18em">'+esc(X)+'</h1>'+
    '<ol class="five">'+D.slots.map((sl,i)=>{ const w=way(i), st=status(i);
      return '<li><b class="n">'+(i+1)+'</b><div><small><span>'+esc(sl.part)+'</span><span class="st '+st[0]+'">'+st[1]+'</span></small>'+
        (w?render(w,'plain'):'<i>Your own sentence: it must '+esc(sl.job)+'</i>')+'</div></li>'; }).join('')+'</ol>'+
    '<div class="note"><div class="kick">In your notebook</div><p>Write your review of <b>'+esc(X)+'</b> in five sentences, one per slot. Finish every gap with your own details.</p>'+
      '<p>Any slot can be your own sentence, if it does the same job. Bring it to class.</p></div></section>';
}

function paint(){ if(MODE==='mine') mine(); else gate(); }
function setMode(m){ MODE=m; document.querySelectorAll('.wr-stage[data-m]').forEach(b=>{ const on=b.dataset.m===m; b.classList.toggle('active',on); if(on) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); }); paint(); window.scrollTo(0,0); }
document.querySelectorAll('.wr-stage[data-m]').forEach(b=>b.onclick=()=>setMode(b.dataset.m));

fetch('/data/writing/five/'+TASK+'.json?v=2').then(r=>{ if(!r.ok) throw 0; return r.json(); }).then(d=>{
  D=d; ST=load();
  /* v1 kept one subject {key,name}: carry it over */
  if(ST.subj&&!ST.key){ ST.key=ST.subj.key; ST.names={}; ST.names[ST.subj.key]=ST.subj.name; delete ST.subj; save(); }
  if(!D.subjects.some(s=>s.key===ST.key)) ST.key=D.subjects[0].key;
  document.title='INTUITY — Your '+D.name.toLowerCase()+' in five';
  tabs(); if(P.get('mode')==='mine') setMode('mine'); else paint();
}).catch(()=>{ $('stage').innerHTML='<p style="text-align:center">This could not load. Check your connection and try again.</p>'; });
})();
</script>
