<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>INTUITY — Your review in five</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..900&family=Geist+Mono:wght@400..600&family=Space+Grotesk:wght@700&family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=20261105">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   YOUR REVIEW IN FIVE  ·  v1 (5 Nov 2026) — the blueprint for every task

   Michael: "A kid feels he has learned the type if he can make up a mental
   model in his head: one introduction, three body phrases, one
   recommendation." So the task is five slots, never more:

     1 his subject, typed once  →  every phrase is about HIS thing
     2 one slot at a time: the phrase with one word as a first-letter cue;
       he says it and finishes the “…” aloud; Show it; Got it / Not yet
     3 a slot recalled on two different days is HIS: it unlocks two more
       ways to say it, or “my own sentence” if it does the slot's job
     4 the end: his five sentences together, for the notebook

   The shape is fixed, the content is free (Haught-Tromp 2017: a tight frame
   makes more original writing, not less); the choice is earned (scaffolding
   that fades). Every answer also joins the review deck (Be2), so each slot
   comes back after 1, 3, 7 and 21 days. All on this device.
   Content: data/writing/five/<task>.json — one file per task.
   ═══════════════════════════════════════════════════════════════════════ */
:root{ --ink:#14110E; --paper:#FBF8F3; --dim:#5C5852; --line:rgba(20,17,14,.12); --car:#C2956E; --car-d:#9A5A2C; --ok:#4F7A63 }
body{background:var(--bg,#F3EFE8)}
.header{position:sticky;top:0;z-index:20}
.wrap{max-width:560px;margin:0 auto;padding:1rem var(--gutter,16px) 4rem;color:var(--ink)}
.wrap h1,.wrap h2,.wrap p,.wrap li{color:var(--ink)}
.f5-big{font-family:'Anton',Impact,sans-serif;font-weight:400;font-size:1.7rem;line-height:1.02;text-transform:uppercase;margin:.3rem 0 .8rem}
.f5-tiles{display:grid;grid-template-columns:1fr 1fr;gap:.45rem;margin:0 0 .9rem}
.f5-tile{border:2px solid transparent;background:var(--paper);padding:.75rem .5rem;text-align:center;font:600 .92rem/1.2 var(--f-body,'Geist',sans-serif);color:var(--ink);cursor:pointer}
.f5-tile i{display:block;font-style:normal;font-size:1.35rem;margin-bottom:.2rem}
.f5-tile.f5-on{border-color:var(--ink)}
.f5-tile.f5-more{background:transparent;border:1.5px dashed rgba(20,17,14,.25);font-size:.84rem;color:var(--dim);padding:.5rem}
.f5-tile.f5-more.f5-on{border:2px solid var(--ink);color:var(--ink)}
.f5-more-pick{display:flex;flex-direction:column;gap:.35rem}
.f5-more-pick button{border:0;background:none;font:inherit;color:inherit;cursor:pointer;padding:.15rem}
.f5-more-pick button.f5-on{font-weight:700;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.f5-lbl{font-size:.82rem;color:var(--dim);margin:0 0 .3rem}
.f5-in{width:100%;box-sizing:border-box;border:2px solid var(--ink);border-radius:999px;padding:.8rem 1rem;font:600 1rem var(--f-body,'Geist',sans-serif);background:#fff;color:var(--ink);margin:0 0 .8rem}
.f5-b{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;border-radius:999px;border:2px solid var(--ink);background:transparent;color:var(--ink);
  font:700 .95rem/1 var(--f-body,'Geist',sans-serif);cursor:pointer;text-decoration:none;box-sizing:border-box}
.f5-b.f5-dark{background:var(--ink);color:var(--paper)}
.f5-b:disabled{opacity:.35;cursor:default}
.f5-small{text-align:center;color:var(--dim);font-size:.8rem;margin:.6rem 0 0}
.f5-who{display:flex;justify-content:center;align-items:center;gap:.5rem;font-size:.82rem;color:var(--dim);margin:0 0 .6rem}
.f5-who b{color:var(--ink)}
.f5-who button{border:0;background:none;color:var(--car-d);font:600 .78rem var(--f-body,'Geist',sans-serif);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:.3rem}
.f5-dots{display:flex;gap:.3rem;justify-content:center;margin:0 0 .8rem}
.f5-dots i{width:10px;height:10px;border-radius:50%;background:rgba(20,17,14,.12)}
.f5-dots i.f5-here{background:var(--ink)} .f5-dots i.f5-got{background:var(--ok)} .f5-dots i.f5-not{background:var(--car)}
.f5-card{background:var(--paper);box-shadow:0 8px 30px rgba(43,33,41,.08);padding:1.1rem 1.1rem 1.2rem}
.f5-kick{font:600 .62rem/1 'Geist Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--car-d);display:flex;justify-content:space-between;gap:.5rem}
.f5-kick em{font-style:normal;color:var(--dim)}
.f5-ph{font-size:1.25rem;line-height:1.5;font-weight:500;margin:.8rem 0 .5rem}
.f5-cue{color:var(--car-d);font-weight:700;letter-spacing:.04em}
.f5-nm{background:rgba(194,149,110,.26);padding:0 .2em;border-radius:3px;font-weight:600}
.f5-gap{display:inline-block;min-width:3.2em;border-bottom:2px dotted var(--car-d);height:1em;vertical-align:-.15em}
.f5-ph mark{background:none;color:inherit;box-shadow:inset 0 -.55em 0 rgba(194,149,110,.45)}
.f5-hint{color:var(--dim);font-size:.86rem;line-height:1.4;margin:0 0 1rem}
.f5-two{display:grid;grid-template-columns:1fr 1fr;gap:.55rem}
.f5-unl{display:inline-block;background:#E1EBE4;color:var(--ok);font:600 .62rem/1 'Geist Mono',monospace;letter-spacing:.1em;text-transform:uppercase;padding:.45rem .7rem;border-radius:999px;margin:0 0 .5rem}
.f5-opt{display:flex;gap:.65rem;align-items:flex-start;width:100%;text-align:left;background:#fff;border:2px solid transparent;padding:.75rem .8rem;margin:0 0 .45rem;
  font:400 .95rem/1.45 var(--f-body,'Geist',sans-serif);color:var(--ink);cursor:pointer;box-sizing:border-box}
.f5-opt i{flex:none;width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);margin-top:.2em}
.f5-opt.f5-on{border-color:var(--ink)} .f5-opt.f5-on i{background:var(--ink);box-shadow:inset 0 0 0 3px #fff}
/* the end: his review, one row per slot */
.f5-lad{display:flex;flex-direction:column;gap:.4rem;margin:0 0 1rem;padding:0;list-style:none}
.f5-lad li{display:grid;grid-template-columns:1.6rem 1fr;gap:.5rem;background:var(--paper);padding:.65rem .75rem;font-size:.92rem;line-height:1.45}
.f5-lad b.f5-n{font-family:'Anton',Impact,sans-serif;font-weight:400;font-size:1.3rem;line-height:1.1;text-align:center}
.f5-lad small{display:flex;justify-content:space-between;gap:.5rem;font:600 .58rem/1.5 'Geist Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:0 0 .15rem}
.f5-st{padding:.1rem .45rem;border-radius:999px;white-space:nowrap}
.f5-own{background:#E1EBE4;color:var(--ok)} .f5-lrn{background:#F2E6DA;color:var(--car-d)} .f5-new{background:#ECE8E1;color:var(--dim)}
.f5-note{background:#fff;border:1px solid var(--line);border-left:3px solid #D98A8A;padding:.85rem 1rem;margin:0 0 1.1rem;font-size:.92rem;line-height:1.5}
.f5-note h2{font:600 .62rem/1 'Geist Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--car-d);margin:0 0 .45rem}
.f5-note p{margin:0 0 .35rem} .f5-note p:last-child{margin:0;color:var(--dim);font-size:.82rem}
.f5-cta{display:grid;grid-template-columns:1fr 1fr;gap:.55rem}
</style>
<script src="/tools/be2-brand.js?v=20261012c"></script>
</head>
<body>
<header class="header">
  <div class="header-top">
    <a class="back-link" id="back" href="/skills/writing/gate.html?task=reviews" target="_top">← Review</a>
    <div class="header-title"><div class="app-title">INTUITY</div><div class="app-subtitle" id="sub">Your review in five</div></div>
    <span class="header-spacer">Level <b>B2</b></span>
  </div>
</header>
<main class="wrap"><div id="out"><p style="text-align:center;color:var(--dim)">Loading…</p></div></main>
<script>
(function(){
'use strict';
const P=new URLSearchParams(location.search);
const TASK=/^[a-z]+$/.test(P.get('task')||'')?P.get('task'):'reviews';
const KEY='be2.five.'+TASK;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>{ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const load=()=>{ try{ return JSON.parse(localStorage.getItem(KEY)||'null')||{}; }catch(e){ return {}; } };
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(ST)); }catch(e){} };
let D, ST, at, res;

function subj(){ return D.subjects.find(s=>s.key===(ST.subj&&ST.subj.key)); }
function slotState(i){ ST.slots=ST.slots||[]; return ST.slots[i]=ST.slots[i]||{days:[]}; }
function owned(i){ return slotState(i).days.length>=2; }
function status(i){ const n=slotState(i).days.length; return n>=2?['f5-own','🔓 Yours']:n===1?['f5-lrn','Day 1']:['f5-new','New']; }
function way(i){ const s=slotState(i); return s.pick==='own'?null:D.slots[i].ways[typeof s.pick==='number'?s.pick:0]; }

/* a way's text for HIS thing, as HTML: the name boxed, the “…” a dotted gap,
   and (cue) the hidden word as its first letter, or (shown) marked */
function render(w,mode){
  const S=subj(), X=ST.subj.name;
  let t=esc(w.t.replace(/\{a\}/g,S.a).replace(/\{plural\}/g,S.plural)).replace(/\{X\}/g,'\u0001');
  const re=new RegExp('\\b'+w.hide+'\\b');
  if(mode==='cue') t=t.replace(re,'<span class="f5-cue">'+w.hide[0]+'___</span>');
  else if(mode==='shown') t=t.replace(re,'<mark>'+w.hide+'</mark>');
  return t.replace(/\u0001/g,'<span class="f5-nm">'+esc(X)+'</span>').replace(/…/g,'<span class="f5-gap"></span>');
}
function plain(w,cue){
  const S=subj();
  let t=w.t.replace(/\{a\}/g,S.a).replace(/\{plural\}/g,S.plural).replace(/\{X\}/g,ST.subj.name);
  return cue?t.replace(new RegExp('\\b'+w.hide+'\\b'),w.hide[0]+'___'):t;
}

/* ── 1 · HIS SUBJECT ─────────────────────────────────────────────────── */
function pickSubject(){
  let k=ST.subj&&ST.subj.key||null;
  const main=D.subjects.filter(s=>!s.more), more=D.subjects.filter(s=>s.more);
  const draw=()=>{
    const S=D.subjects.find(s=>s.key===k), inMore=S&&S.more;
    $('out').innerHTML='<h1 class="f5-big">What will you review?</h1><div class="f5-tiles">'+
      main.map(s=>'<button type="button" class="f5-tile'+(s.key===k?' f5-on':'')+'" data-k="'+s.key+'"><i>'+s.icon+'</i>'+esc(s.label)+'</button>').join('')+
      '<div class="f5-tile f5-more'+(inMore?' f5-on':'')+'"><div class="f5-more-pick">'+more.map(s=>'<button type="button" class="'+(s.key===k?'f5-on':'')+'" data-k="'+s.key+'">'+s.icon+' '+esc(s.label)+'</button>').join('')+'</div></div></div>'+
      '<p class="f5-lbl">'+(S?'Which '+esc(S.a.replace(/^an? /,''))+'? Its name':'Its name')+'</p>'+
      '<input class="f5-in" id="nm" maxlength="40" autocomplete="off" placeholder="'+(S?'e.g. '+esc(S.eg):'Pick one above first')+'"'+(S?'':' disabled')+' value="'+esc(ST.subj&&ST.subj.key===k?ST.subj.name:'')+'">'+
      '<button type="button" class="f5-b f5-dark" id="go" disabled>Start →</button><p class="f5-small">Five sentences. About 3 minutes.</p>';
    document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{ const v=$('nm').value; k=b.dataset.k; draw(); $('nm').value=v; ok(); $('nm').focus(); });
    const ok=()=>{ $('go').disabled=!(k&&$('nm').value.trim()); };
    $('nm').oninput=ok; ok();
    $('nm').onkeydown=e=>{ if(e.key==='Enter'&&!$('go').disabled) $('go').click(); };
    $('go').onclick=()=>{
      const name=$('nm').value.trim().replace(/\s+/g,' ');
      /* a new subject keeps what he owns: the phrases are his, not the game's */
      ST.subj={key:k,name}; save(); start();
    };
  };
  draw();
}

/* ── 2 · ONE SLOT AT A TIME ──────────────────────────────────────────── */
function start(){ at=0; res=[]; slot(); window.scrollTo(0,0); }
function head(){
  return '<p class="f5-who">Your review of <b>'+esc(ST.subj.name)+'</b><button type="button" id="chg">change</button></p>'+
    '<div class="f5-dots">'+D.slots.map((_,k)=>'<i class="'+(res[k]===true?'f5-got':res[k]===false?'f5-not':k===at?'f5-here':'')+'"></i>').join('')+'</div>';
}
function kick(i){ return '<div class="f5-kick"><span>Slot '+(i+1)+' · '+esc(D.slots[i].part)+'</span><em>'+(i+1)+' / '+D.slots.length+'</em></div>'; }
function wire(){ const c=$('chg'); if(c) c.onclick=pickSubject; }
function slot(){
  if(at>=D.slots.length) return end();
  const s=slotState(at);
  if(owned(at)&&s.pick==null) return choose();
  const w=way(at);
  if(!w){   /* his own sentence: the job, then he says it */
    $('out').innerHTML=head()+'<section class="f5-card">'+kick(at)+'<p class="f5-ph">Your own sentence</p>'+
      '<p class="f5-hint">It must <b>'+esc(D.slots[at].job)+'</b>. Say it now.</p>'+
      '<button type="button" class="f5-b f5-dark" id="done">I said it</button><p class="f5-small"><button type="button" class="f5-who" id="rep" style="margin:0 auto;border:0;background:none;color:var(--car-d);text-decoration:underline;cursor:pointer">Choose a phrase instead</button></p></section>';
    wire(); $('done').onclick=()=>mark(true,null); $('rep').onclick=()=>{ delete s.pick; save(); choose(); };
    return;
  }
  $('out').innerHTML=head()+'<section class="f5-card">'+kick(at)+'<p class="f5-ph">'+render(w,'cue')+'</p>'+
    '<p class="f5-hint">'+(/…/.test(w.t)?'Say it, and finish it with your own detail: '+esc(subj().ask):'Say it, out loud or in your head.')+'</p>'+
    '<button type="button" class="f5-b f5-dark" id="see">Show it</button></section>';
  wire(); $('see').onclick=()=>reveal(w); $('see').focus({preventScroll:true});
}
function reveal(w){
  $('out').innerHTML=head()+'<section class="f5-card">'+kick(at)+'<p class="f5-ph">'+render(w,'shown')+'</p>'+
    '<p class="f5-hint">Did you have it?</p><div class="f5-two"><button type="button" class="f5-b" id="no">Not yet</button><button type="button" class="f5-b f5-dark" id="yes">Got it</button></div></section>';
  wire(); $('no').onclick=()=>mark(false,w); $('yes').onclick=()=>mark(true,w);
}
function mark(ok,w){
  const s=slotState(at), t=today();
  if(ok){ if(s.days.indexOf(t)<0) s.days.push(t); }
  else if(!owned(at)) s.days=[];          /* not his yet: start again; a slot he owns stays his */
  save(); res[at]=ok;
  if(w) try{ Be2.answer('five-'+TASK,{id:'s'+(at+1)+'-'+D.slots[at].ways.indexOf(w),correct:ok,keep:true,kind:'recall',
    prompt:plain(w,true),answer:plain(w,false),href:'/skills/writing/five.html?task='+TASK}); }catch(e){}
  at++; slot();
}

/* ── 3 · EARN THE CHOICE ─────────────────────────────────────────────── */
function choose(){
  const ways=D.slots[at].ways; let k=0;
  const draw=()=>{
    $('out').innerHTML=head()+'<section class="f5-card"><span class="f5-unl">🔓 Slot '+(at+1)+' is yours</span>'+
      '<h1 class="f5-big" style="font-size:1.35rem;margin:.1rem 0 .7rem">Pick your way to '+esc(D.slots[at].pick||D.slots[at].job)+'</h1>'+
      ways.map((w,j)=>'<button type="button" class="f5-opt'+(j===k?' f5-on':'')+'" data-j="'+j+'"><i></i><span>'+render(w,'plain')+'</span></button>').join('')+
      '<button type="button" class="f5-opt'+(k==='own'?' f5-on':'')+'" data-j="own"><i></i><span><b>My own sentence</b> · it must '+esc(D.slots[at].job)+'</span></button>'+
      '<button type="button" class="f5-b f5-dark" id="keep" style="margin-top:.5rem">Keep this one</button></section>';
    wire();
    document.querySelectorAll('.f5-opt').forEach(b=>b.onclick=()=>{ k=b.dataset.j==='own'?'own':+b.dataset.j; draw(); });
    $('keep').onclick=()=>{ slotState(at).pick=k; save(); slot(); };
  };
  draw();
}

/* ── 4 · HIS REVIEW ──────────────────────────────────────────────────── */
function end(){
  const got=res.filter(Boolean).length;
  $('out').innerHTML='<p class="f5-who">Your review of <b>'+esc(ST.subj.name)+'</b><button type="button" id="chg">change</button></p>'+
    '<ol class="f5-lad">'+D.slots.map((sl,i)=>{ const w=way(i), st=status(i);
      return '<li><b class="f5-n">'+(i+1)+'</b><div><small><span>'+esc(sl.part)+'</span><span class="f5-st '+st[0]+'">'+st[1]+'</span></small>'+
        (w?render(w,'plain'):'<i>Your own sentence: '+esc(sl.job)+'</i>')+'</div></li>'; }).join('')+'</ol>'+
    '<div class="f5-note"><h2>In your notebook</h2><p>Write your review of <b>'+esc(ST.subj.name)+'</b> in five sentences, one per slot. Finish every gap with your own details.</p>'+
      '<p>Any slot can be your own sentence, if it does the same job. Bring it to class.</p></div>'+
    '<div class="f5-cta"><button type="button" class="f5-b" id="again">Again</button><a class="f5-b f5-dark" href="'+esc($('back').href)+'">Done</a></div>'+
    '<p class="f5-small">'+got+' of 5 today. A slot is yours once you have it on two different days.</p>';
  wire(); $('again').onclick=start; window.scrollTo(0,0);
}

fetch('/data/writing/five/'+TASK+'.json?v=2').then(r=>{ if(!r.ok) throw 0; return r.json(); }).then(d=>{
  D=d; ST=load();
  document.title='INTUITY — Your '+D.name.toLowerCase()+' in five'; $('sub').textContent='Your '+D.name.toLowerCase()+' in five';
  $('back').textContent='← '+D.name; $('back').href='/skills/writing/gate.html?task='+TASK;
  if(ST.subj&&subj()&&!P.has('change')) start(); else pickSubject();
}).catch(()=>{ $('out').innerHTML='<p style="text-align:center">This could not load. Check your connection and try again.</p>'; });
})();
</script>
</body>
</html>
