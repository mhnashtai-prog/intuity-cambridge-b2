/* ═══════════════════════════════════════════════════════════════════════
   YOUR REVIEW IN FIVE  ·  v3 (5 Nov 2026) — the blueprint for every task

   Michael: "A kid feels he has learned the type if he can make up a mental
   model in his head: one introduction, three body phrases, one
   recommendation." Five slots, never more. For a 14-year-old on his own,
   with no teacher in the room:

   THE GATE gives him something to do in one second: the pendulum says START (6 Nov: "Start" tells him what happens; "tap" only names the gesture).
   TAP. One line (5 sentences. 1 review.), five progress circles, nothing
   to read first. His subject (a game, a series…) is the header's filter
   row; the name of his game is the first card, one tap on a chip.

   THE LADDER (v3, Michael: "why assume that clicking a pill teaches the
   whole phrase?"). Each slot meets its WHOLE phrase on five steps, the
   support taken away one step at a time (vanishing cues):
       1 Select       which one does this job?
       2 Match        the first half, and the end that fits
       3 Sort         the pieces in order
       4 Fill         three words gone, first letters given, typed
       5 Memory       only the job shown: he writes the whole phrase
   One card per slot per session, at that slot's step, so a session is five
   quick cards and mixes the activities by itself. A slot climbs one step a
   day at most (the spacing is in the game); a miss drops it one step, not
   to the start. Done from memory on a later day = the slot is HIS: it can
   then change its wording. After a right answer on a phrase with a “…”, he
   finishes it his own way, and My review shows his own sentences.
   The app checks everything itself: no "I knew it" buttons.

   Built from INTUITY's parts: the writing header (writing-chrome.js), the
   pendulum, the Challenge's focus card, the stage pill (Practise · My
   review). Every answer joins the review deck (Be2). All on this device.
   Content: data/writing/five/<task>.json.
   ═══════════════════════════════════════════════════════════════════════ */

.rungs{display:flex;justify-content:center;gap:.5rem;margin:1.5rem 0 0}
.rungs i{position:relative;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;font:600 .72rem/1 var(--f-mono);font-style:normal;color:var(--f5-dim);

.rungs i::before{content:'';position:absolute;inset:4px;border-radius:50%;background:var(--f5-card)}

.scrim > .focus h2.fq{font-family:var(--f-display,'Geist'),system-ui,sans-serif!important;text-transform:none!important;font-weight:500!important;font-size:clamp(1.25rem,5.4vw,1.45rem)!important;line-height:1.28!important;letter-spacing:-.01em!important}

.steps5{display:flex;gap:4px;margin:.75rem 0 0}

.aim{font-size:.88rem;line-height:1.45;color:var(--f5-dim);margin:.9rem 0 0;padding-left:.7rem;border-left:3px solid var(--f5-car)}

/* 1 Select · 2 Match: answer rows (the Challenge's) */
.opts{display:flex;flex-direction:column;margin:.6rem 0 0}

@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
/* 4 Fill: the boxes sit in the sentence */
.line input.w{font:inherit;color:var(--ink);border:0;border-bottom:2px solid var(--ink);background:rgba(194,149,110,.12);border-radius:3px 3px 0 0;padding:0 .2em;

textarea.wr,input.wr{width:100%;box-sizing:border-box;border:1.5px solid var(--ink);border-radius:var(--r-box,4px);background:#fff;padding:.75rem .85rem;

.job{font-family:'Anton',Impact,sans-serif;font-size:1.35rem;text-transform:uppercase;color:var(--ink);margin:.9rem 0 0}
.use{font-size:.85rem;color:var(--f5-dim);margin:.3rem 0 0}
/* the name chips */
.chips{display:flex;flex-wrap:wrap;gap:.45rem;margin:1rem 0 0}
/* ── My review ── */
.mine{padding-top:1.4rem}
.title{display:inline-block;font-family:var(--f-display);font-weight:800;font-size:clamp(1.25rem,4.4vw,1.8rem);letter-spacing:.18em;text-transform:uppercase;line-height:1.15;color:var(--ink);

.five .st{padding:0 .5rem;border-radius:999px;background:rgba(20,17,14,.07)} .five .st.own{background:var(--ink);color:var(--mark-ink)}

.wr-foot button.wr-stage{font:inherit;font-family:var(--f-display);font-size:0.6875rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}

<script>
(function(){
'use strict';
const P=new URLSearchParams(location.search);
const TASK=/^[a-z]+$/.test(P.get('task')||'')?P.get('task'):'reviews';
const KEY='be2.five.'+TASK;
/* EVERY TASK (7 Nov 2026): one page, data/writing/five/<task>.json per task */
const TNAME={essays:'Essay',reviews:'Review',reports:'Report',emails:'Email',articles:'Article',story:'Story'};
document.body.setAttribute('data-writing',TASK);
{ const b=document.querySelector('.back-link'); if(b){ b.href='/skills/writing/gate.html?task='+TASK; b.textContent='← '+(TNAME[TASK]||'Writing'); } }
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>{ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const sfx=k=>{ try{ if(window.SFX&&SFX[k]) SFX[k](); }catch(e){} };
/* 8 Nov 2026: the Board games' glitter and fireworks, after the card has drawn (tools/intuity-cheer.js) */
const cheer=(how,sel)=>setTimeout(()=>{ try{ if(!window.Cheer) return; const el=document.querySelector(sel||'#fTitle');
  if(how==='big') Cheer.finale(); else if(how==='done') Cheer.done(el); else Cheer.right(el); }catch(e){} },60);
const load=()=>{ try{ return JSON.parse(localStorage.getItem(KEY)||'null')||{}; }catch(e){ return {}; } };
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(ST)); }catch(e){} };
let D, ST, MODE='practise', at=0, res=[];

const STEP=[null,
  {k:'select',name:'Select',how:'Tap the sentence that does this job.'},
  {k:'match', name:'Match',how:'Tap the end that fits.'},
  {k:'sort',  name:'Sort', how:'Tap the pieces in the right order.'},
  {k:'fill',  name:'Fill the gaps',how:'Type the missing words. The first letter is your clue.',howTap:'Tap the missing words in order. The first letter is your clue.'},
  {k:'memory',name:'From memory',how:'Write the whole sentence. Only its job is shown.',howTap:'Build the whole sentence. Two pieces don’t belong.'}];
/* NO KEYBOARD (v4, 5 Nov): for students who won't type on a phone, Fill and
   From memory are tapped, still checked by the app: Fill offers three words
   for each gap (same first letter where it can), From memory builds the
   sentence from its pieces with two that don't belong. ?tap=1 or the switch
   in How it works; remembered on this device. */
const howOf=(st,r)=>ST.tap&&st.howTap?st.howTap:st.how;
/* A NEW KID'S CARD (7 Nov 2026): the kicker says which sentence ("Sentence 3
   of 5 · Second reason"), the title is the question itself (Select) or what
   to do, a small line names the step, and the instruction shows only the
   first time a step appears. Before, a card said "3 · REASON / SELECT",
   two different "of 5" bars, and the same instruction twice. */
const LB=i=>D.slots[i].label||D.slots[i].part;
const STEPT={select:null,match:'Which end fits?',sort:'Put it in order',fill:'Fill the gaps',memory:'From memory'};
const STEPV={select:'pick it',match:'match it',sort:'order it',fill:'fill it',memory:'from memory'};
let PRACTICE=false;   /* "Practise anyway": a round that does not move the steps */

/* ── state ── */
function SUB(){ return D.subjects.find(s=>s.key===ST.key)||D.subjects[0]; }
function name(){ return (ST.names&&ST.names[ST.key])||''; }
function X(){ return name()||SUB().eg; }
function slot(i){ ST.slots=ST.slots||[]; const s=ST.slots[i]=ST.slots[i]||{}; if(!s.rung) s.rung=1; return s; }
function way(i){ const s=slot(i); return s.pick==='own'?null:D.slots[i].ways[typeof s.pick==='number'?s.pick:0]; }
function ideas(){ ST.ideas=ST.ideas||{}; return ST.ideas[ST.key]=ST.ideas[ST.key]||{}; }

/* a wording, filled for HIS thing */
function fill(w){ const s=SUB(); return w.t.replace(/\{a\}/g,s.a).replace(/\{plural\}/g,s.plural).replace(/\{X\}/g,X()); }
const body=t=>t.replace(/\s*…\s*$/,'').trim();          /* the phrase without its open end */
const open=t=>/…\s*$/.test(t);
/* to HTML: the name boxed, the open end a dotted gap (or his idea) */
function html(t,idea){
  let h=esc(t); const n=esc(X());
  if(n) h=h.split(n).join('<span class="nm">'+n+'</span>');
  return h.replace(/…\s*$/,idea?'<span class="idea">'+esc(idea)+'</span>':'<span class="gap"></span>');
}
/* the phrase in pieces: words, with his thing's name kept as one piece */
function tokens(t){ const n=X(); return body(t).split(n).map((p,i,a)=>p.trim().split(/\s+/).filter(Boolean).concat(i<a.length-1?['\u0001'+n]:[])).flat(); }
const shown=w=>w.charAt(0)==='\u0001'?w.slice(1):w;
const norm=s=>String(s).toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' ]+/g,' ').replace(/\s+/g,' ').trim();
function lev(a,b){ const m=a.length,n=b.length; if(Math.abs(m-n)>1) return 2; const d=[...Array(n+1).keys()];
  for(let i=1;i<=m;i++){ let p=d[0]; d[0]=i; for(let j=1;j<=n;j++){ const t=d[j]; d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1)); p=t; } } return d[n]; }
const near=(a,b)=>{ a=norm(a); b=norm(b); return a===b||(b.length>4&&lev(a,b)<=1); };

/* ── the header's filter row: the subjects ── */
function tabs(){
  $('subj').innerHTML=D.subjects.map(s=>'<button type="button" class="ftab'+(s.key===ST.key?' active':'')+'" role="tab" aria-selected="'+(s.key===ST.key)+'" data-k="'+s.key+'">'+esc(s.label.replace(/^An? /,''))+'</button>').join('');
  $('subj').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{ ST.key=b.dataset.k; save(); tabs(); paint(); });
}

/* ── PRACTISE: the gate ── */
function climbable(){ return D.slots.filter((_,i)=>{ const s=slot(i); return s.rday!==today(); }).length; }
function gate(){
  const tot=D.slots.reduce((a,_,i)=>a+(slot(i).own?5:slot(i).rung-1),0), started=ST.slots&&ST.slots.some(x=>x&&(x.rung>1||x.own));
  document.documentElement.style.setProperty('--mark-pct',Math.max(4,tot/25*100)+'%');
  const c=climbable();
  $('stage').innerHTML='<section class="gate">'+
    '<button type="button" class="gate-mark pend-hang" id="dial" aria-label="Start"><div class="pend-dial"><span>START</span></div></button>'+
    '<h1 class="big">5 sentences.<br>1 '+esc(D.name.toLowerCase())+'.</h1><p class="sm">About 2 minutes</p>'+
    '<div class="rungs" aria-label="Your five sentences">'+D.slots.map((_,i)=>{ const s=slot(i);
      return '<i class="'+(s.own?'own':'')+'" style="--p:'+(s.own?100:(s.rung-1)*25)+'" title="'+esc(D.slots[i].part)+(s.own?' · yours':' · step '+s.rung+' of 5')+'"><b>'+(s.own?'✓':i+1)+'</b></i>'; }).join('')+'</div>'+
    (started?'<p class="today">'+(c?'Today '+c+' can climb a step':'All climbed today. They climb again tomorrow.')+'</p>'+(c?'':'<button type="button" class="how" id="again">Practise anyway</button>'):'')+
    '<button type="button" class="how" id="how">How it works</button></section>';
  $('dial').onclick=()=>start(!c&&started); $('how').onclick=how;
  if($('again')) $('again').onclick=()=>start(true);
}
function how(){
  card('<div class="kick">How it works</div><h2 id="fTitle">5 sentences, 5 steps</h2>'+
    '<p class="aim">'+(D.how?esc(D.how):'A review in five sentences: one to open it, two features, one drawback, one to recommend it. All about your own '+esc(SUB().a.replace(/^an? /,''))+'.')+'</p>'+
    '<p class="aim">Each sentence climbs five steps: select it, match its halves, sort its pieces, fill its gaps, then build it from memory.</p>'+
    '<p class="aim">One step a day: come back tomorrow and it climbs again. Write it from memory on a new day, and it’s yours ✓.</p>'+
    '<label class="kb"><input type="checkbox" id="kb"'+(ST.tap?'':' checked')+'> Type my answers <small>(off: tap only)</small></label>'+
    '<div class="cta"><button type="button" class="btn fill" id="ok">Got it</button></div>');
  $('kb').onchange=()=>{ ST.tap=!$('kb').checked; save(); };
  $('ok').onclick=close;
}

/* ── the focus card ── */
function card(h){ $('focus').innerHTML='<button class="x" type="button" aria-label="Close" id="fx">✕</button>'+h;
  const s=$('scrim'); if(s.hidden){ s.hidden=false; requestAnimationFrame(()=>s.classList.add('on')); } $('fx').onclick=close; $('focus').scrollTop=0; }
/* ONE SCREEN: step the card down until nothing scrolls (watches every change to it) */
function fitFocus(){ const f=$('focus'); if(!f) return; f.classList.remove('fit1','fit2','fit3','fit4');
  for(const k of ['fit1','fit2','fit3','fit4']){ if(f.scrollHeight<=f.clientHeight+1) break; f.classList.add(k); } }
{ let q=0; new MutationObserver(()=>{ if(q) return; q=requestAnimationFrame(()=>{ q=0; fitFocus(); }); }).observe(document.getElementById('focus'),{childList:true,subtree:true}); }
addEventListener('resize',()=>fitFocus());
function close(){ const s=$('scrim'); s.classList.remove('on'); setTimeout(()=>{ s.hidden=true; paint(); },250); }
function head(i,r){
  const st=STEP[r], seen=(ST.seen=ST.seen||{})[st.k];
  const qt=!STEPT[st.k];   /* Select: the title is the question, in sentence case */
  return '<div class="kick">'+(i+1)+' of '+D.slots.length+' · '+esc(LB(i))+'</div><h2 id="fTitle"'+(qt?' class="fq"':'')+'>'+esc(STEPT[st.k]||D.slots[i].q||st.name)+'</h2>'+
    '<div class="steps5" aria-label="Step '+r+' of 5">'+[1,2,3,4,5].map(k=>'<i class="'+(k<r?'on':k===r?'now':'')+'"></i>').join('')+'</div>'+
    '<p class="stepl">Step '+r+' of 5 · '+esc(STEPV[st.k])+(PRACTICE?' · practice':'')+'</p>'+
    (seen?'':'<p class="aim"><span class="new">NEW</span>'+esc(howOf(st,r))+'</p>');
}

/* ── a session: his thing's name first (once), then one card per slot ── */
function start(practice){ PRACTICE=!!practice; sfx('unlock'); at=0; res=[]; if(!name()) return askName(); next(); }
function askName(){
  const s=SUB();
  const NA=D.nameAsk||{};
  card('<div class="kick">'+esc(NA.kick||'Your '+s.a.replace(/^an? /,''))+'</div><h2 id="fTitle">'+esc(NA.title||'Which one?')+'</h2><p class="aim">'+esc(NA.aim||'Pick one you know well. You’ll write about it.')+'</p>'+
    '<div class="chips">'+s.picks.map(p=>'<button type="button" class="chip" data-n="'+esc(p)+'">'+esc(p)+'</button>').join('')+
    '<button type="button" class="chip" id="own">✎ My own</button></div><div id="ownBox" hidden><input class="wr" id="ownIn" maxlength="40" placeholder="'+esc(NA.placeholder||'Its name')+'"><div class="cta"><button type="button" class="btn fill" id="ownGo" disabled>Go</button></div></div>');
  $('focus').querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>setName(b.dataset.n));
  $('own').onclick=()=>{ $('ownBox').hidden=false; $('ownIn').focus(); };
  $('ownIn').oninput=()=>{ $('ownGo').disabled=!$('ownIn').value.trim(); };
  $('ownIn').onkeydown=e=>{ if(e.key==='Enter'&&$('ownIn').value.trim()) setName($('ownIn').value); };
  $('ownGo').onclick=()=>setName($('ownIn').value);
}
function setName(n){ ST.names=ST.names||{}; ST.names[ST.key]=n.trim().replace(/\s+/g,' ').slice(0,40); save(); sfx('pop'); preview(); }
/* SHAPE FIRST (7 Nov 2026): the whole five, once per topic, before sentence 1 */
function preview(){
  ST.pv=ST.pv||{}; if(ST.pv[ST.key]) return next();
  ST.pv[ST.key]=1; save();
  card('<div class="kick">Your '+esc(D.name.toLowerCase())+' · '+esc(X())+'</div><h2 id="fTitle">Here it is</h2>'+
    '<p class="aim">Five sentences make your '+esc(D.name.toLowerCase())+'. Now learn them, one at a time.</p>'+
    '<ol class="pv">'+D.slots.map((sl,i)=>{ const w=way(i)||sl.ways[0]; return '<li><small>'+esc(LB(i))+'</small><span>'+html(fill(w))+'</span></li>'; }).join('')+'</ol>'+
    '<div class="cta"><button type="button" class="btn fill" id="pvGo">Start</button></div>');
  $('pvGo').onclick=()=>next();
}
function next(){
  if(at>=D.slots.length) return done();
  const s=slot(at), w=way(at);
  if(!w) return ownSentence();
  const r=s.own?(Math.random()<.5?4:5):s.rung;   /* his already: keep it fresh */
  ({1:select,2:match,3:sort,4:gaps,5:memory})[r](w,r);
}
/* the other slots' sentences, for the wrong options */
function others(i,pred){ return shuffle(D.slots.map((_,j)=>j).filter(j=>j!==i&&(!pred||pred(j)))).map(j=>way(j)||D.slots[j].ways[0]); }

/* 1 · SELECT: which one does this job? */
function select(w,r){
  const opts=shuffle([w].concat(others(at,j=>D.slots[j].part!==D.slots[at].part).slice(0,2)));
  card(head(at,r)+'<div class="opts">'+
    opts.map((o,k)=>'<button type="button" class="opt" data-k="'+k+'"><span class="l">'+'ABC'[k]+'</span><span>'+html(fill(o))+'</span></button>').join('')+'</div><div id="after"></div>');
  $('focus').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const ok=opts[+b.dataset.k]===w;
    $('focus').querySelectorAll('.opt').forEach((x,k)=>{ x.disabled=true; if(opts[k]===w) x.classList.add('ok'); });
    if(!ok) b.classList.add('no');
    result(ok,w,r);
  });
}
/* 2 · MATCH: the first half, and the end that fits */
function halves(t){ const b=body(t), c=b.indexOf(','); if(c>0&&c<b.length-2) return [b.slice(0,c+1),b.slice(c+1).trim()+(open(t)?' …':'')];
  const ws=b.split(' '), m=Math.ceil(ws.length/2); return [ws.slice(0,m).join(' '),ws.slice(m).join(' ')+(open(t)?' …':'')]; }
function match(w,r){
  const [a,b]=halves(fill(w)), ends=[b];
  others(at).forEach(o=>{ const e=halves(fill(o))[1]; if(ends.length<3&&ends.indexOf(e)<0) ends.push(e); });
  const opts=shuffle(ends);
  card(head(at,r)+'<p class="line">'+html(a)+' …</p><div class="opts">'+
    opts.map((o,k)=>'<button type="button" class="opt" data-k="'+k+'"><span class="l">'+'ABC'[k]+'</span><span>… '+html(o)+'</span></button>').join('')+'</div><div id="after"></div>');
  $('focus').querySelectorAll('.opt').forEach(x=>x.onclick=()=>{
    const ok=opts[+x.dataset.k]===b;
    $('focus').querySelectorAll('.opt').forEach((y,k)=>{ y.disabled=true; if(opts[k]===b) y.classList.add('ok'); });
    if(!ok) x.classList.add('no');
    result(ok,w,r);
  });
}
/* 3 · SORT: tap the pieces in order (two words a piece; his thing's name is one) */
function pieces(t){ const tk=tokens(t), pcs=[];
  for(let i=0;i<tk.length;){ if(tk[i][0]==='\u0001'){ pcs.push(shown(tk[i])); i++; continue; }
    const two=tk[i+1]&&tk[i+1][0]!=='\u0001'; pcs.push(two?tk[i]+' '+tk[i+1]:tk[i]); i+=two?2:1; }
  return pcs; }
function sort(w,r,extra){
  const pcs=pieces(fill(w));
  const pool=shuffle(pcs.map((p,k)=>({p,k})).concat((extra||[]).map(p=>({p,k:-1})))); let n=0, miss=0;
  card(head(at,r)+(extra?'<p class="job">'+esc(D.slots[at].pick||D.slots[at].job)+'</p>':'')+'<div class="built" id="built"></div><div class="pool" id="pool">'+
    pool.map((x,j)=>'<button type="button" class="chip" data-j="'+j+'">'+esc(x.p)+'</button>').join('')+'</div><div id="after"></div>');
  $('pool').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
    const x=pool[+b.dataset.j];
    if(x.k>=0&&pcs[x.k]===pcs[n]){ $('built').insertAdjacentHTML('beforeend','<span class="pc">'+html(x.p)+'</span>'); b.remove(); n++; sfx('pop');
      if(n===pcs.length){ if(open(w.t)) $('built').insertAdjacentHTML('beforeend','<span class="pc"><span class="gap"></span></span>'); result(miss<=1,w,r); } }
    else { miss++; b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); sfx('wrong'); }
  });
}
/* 4 · FILL: three words gone (from the key word on), first letters as clues */
function gaps(w,r){
  if(ST.tap) return gapsTap(w,r);
  const tk=tokens(fill(w)); let k=tk.findIndex(t=>norm(t)===w.hide); if(k<0) k=0;
  const idx=[]; for(let j=k;j<tk.length&&idx.length<3;j++) if(tk[j][0]!=='\u0001') idx.push(j);
  for(let j=k-1;j>=0&&idx.length<3;j--) if(tk[j][0]!=='\u0001') idx.unshift(j);
  const word=t=>t.replace(/^[^A-Za-z0-9]+|[^A-Za-z0-9']+$/g,''), punct=t=>t.slice(word(t).length+t.indexOf(word(t)));
  let line=tk.map((t,j)=>{ if(t[0]==='\u0001') return '<span class="nm">'+esc(shown(t))+'</span>';
    if(idx.indexOf(j)<0) return esc(t);
    const a=word(t); return '<input class="w" data-a="'+esc(a)+'" style="width:'+(Math.max(3,a.length)+1)+'ch" placeholder="'+esc(a[0])+'" autocomplete="off" autocapitalize="off" spellcheck="false">'+esc(punct(t)); }).join(' ');
  if(open(w.t)) line+=' <span class="gap"></span>';
  card(head(at,r)+'<p class="line">'+line+'</p><div class="cta"><button type="button" class="btn fill" id="chk">Check</button></div><div id="after"></div>');
  const ins=[...$('focus').querySelectorAll('input.w')];
  ins.forEach((x,j)=>x.onkeydown=e=>{ if((e.key===' '||e.key==='Enter')&&ins[j+1]){ e.preventDefault(); ins[j+1].focus(); } else if(e.key==='Enter') $('chk').click(); });
  setTimeout(()=>ins[0]&&ins[0].focus(),350);
  $('chk').onclick=()=>{
    let ok=true; ins.forEach(x=>{ const g=near(x.value,x.dataset.a); x.classList.add(g?'ok':'no'); x.readOnly=true; if(!g){ ok=false; x.value=x.dataset.a; } });
    $('chk').parentNode.remove(); result(ok,w,r);
  };
}
/* 4 · FILL, no keyboard: three words to choose from for each gap, in order */
function gapsTap(w,r){
  const tk=tokens(fill(w)); let k=tk.findIndex(t=>norm(t)===w.hide); if(k<0) k=0;
  const idx=[]; for(let j=k;j<tk.length&&idx.length<3;j++) if(tk[j][0]!=='\u0001') idx.push(j);
  for(let j=k-1;j>=0&&idx.length<3;j--) if(tk[j][0]!=='\u0001') idx.unshift(j);
  const word=t=>t.replace(/^[^A-Za-z0-9]+|[^A-Za-z0-9']+$/g,'');
  /* every word of every wording, for the wrong choices */
  const bank=[...new Set(D.slots.map(s=>s.ways.map(x=>tokens(fill(x)).filter(t=>t[0]!=='\u0001').map(word))).flat(2).filter(Boolean))];
  let g=0, miss=0;
  const line=()=>tk.map((t,j)=>{ if(t[0]==='\u0001') return '<span class="nm">'+esc(shown(t))+'</span>'; const q=idx.indexOf(j);
    if(q<0) return esc(t); const a=word(t), rest=esc(t.slice(t.indexOf(a)+a.length));
    return q<g?'<span class="tg ok">'+esc(a)+'</span>'+rest:'<span class="tg'+(q===g?' cur':'')+'">'+esc(a[0])+'…</span>'+rest; }).join(' ')+(open(w.t)?' <span class="gap"></span>':'');
  const choices=()=>{ const a=word(tk[idx[g]]), na=norm(a);
    const same=shuffle(bank.filter(b=>norm(b)!==na&&b[0].toLowerCase()===a[0].toLowerCase())), any=shuffle(bank.filter(b=>norm(b)!==na));
    const wrong=[...new Set(same.concat(any))].slice(0,2); return shuffle([a].concat(wrong)); };
  const draw=()=>{ const ch=g<idx.length?choices():[];
    card(head(at,r)+'<p class="line">'+line()+'</p><div class="pool" id="pool">'+ch.map(c=>'<button type="button" class="chip" data-c="'+esc(c)+'">'+esc(c)+'</button>').join('')+'</div><div id="after"></div>');
    $('pool').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
      if(norm(b.dataset.c)===norm(word(tk[idx[g]]))){ g++; sfx('pop'); if(g===idx.length){ draw(); result(miss<=1,w,r); } else draw(); }
      else { miss++; b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); sfx('wrong'); }
    }); };
  draw();
}
/* 5 · MEMORY: only the job; he writes the whole phrase */
function memory(w,r){
  if(ST.tap){ /* two pieces that don't belong, from the other sentences */
    const mine=pieces(fill(w)), ex=[]; shuffle(others(at).map(o=>pieces(fill(o))).flat()).forEach(p=>{ if(ex.length<2&&mine.indexOf(p)<0&&ex.indexOf(p)<0&&p!==X()) ex.push(p); });
    return sort(w,r,ex); }
  card(head(at,r)+'<p class="job">'+esc(D.slots[at].pick||D.slots[at].job)+'</p><p class="use">About <span class="nm">'+esc(X())+'</span>'+(open(w.t)?'. Write the phrase; you finish it after.':'.')+'</p>'+
    '<textarea class="wr" id="mem" rows="3" autocapitalize="sentences" spellcheck="false" placeholder="Your sentence"></textarea><div class="cta"><button type="button" class="btn fill" id="chk" disabled>Check</button></div><div id="after"></div>');
  $('mem').oninput=()=>{ $('chk').disabled=$('mem').value.trim().split(/\s+/).length<3; };
  setTimeout(()=>$('mem').focus(),350);
  $('chk').onclick=()=>{
    const want=norm(body(fill(w))).split(' '), got=norm($('mem').value.replace(/…/g,'')).split(' ');
    /* the words he has, in order (a slip of one letter counts) */
    const L=Array(want.length+1).fill(0).map(()=>Array(got.length+1).fill(0));
    for(let i=want.length-1;i>=0;i--) for(let j=got.length-1;j>=0;j--) L[i][j]=near(got[j],want[i])?1+L[i+1][j+1]:Math.max(L[i+1][j],L[i][j+1]);
    const hit=[]; for(let i=0,j=0;i<want.length&&j<got.length;){ if(near(got[j],want[i])){ hit[i]=1; i++; j++; } else if(L[i+1][j]>=L[i][j+1]) i++; else j++; }
    const ok=L[0][0]/want.length>=.85;
    $('mem').readOnly=true; $('chk').parentNode.remove();
    const shownW=body(fill(w)).split(' ');
    result(ok,w,r,ok&&hit.filter(Boolean).length===want.length?null:shownW.map((x,i)=>hit[i]?esc(x):'<mark>'+esc(x)+'</mark>').join(' '));
  };
}
/* his own sentence (a slot he chose to write his own way) */
function ownSentence(){
  card('<div class="kick">'+(at+1)+' of '+D.slots.length+' · '+esc(LB(at))+'</div><h2 id="fTitle">Your own</h2><p class="aim">Write your own sentence. It must '+esc(D.slots[at].job)+'.</p>'+
    '<textarea class="wr" id="mem" rows="3" placeholder="Your sentence">'+esc((ideas()['own'+at])||'')+'</textarea><div class="cta"><button type="button" class="btn fill" id="chk">Save</button><button type="button" class="btn" id="back">Choose a wording</button></div>');
  $('chk').onclick=()=>{ const v=$('mem').value.trim(); if(v.split(/\s+/).length<5){ $('mem').focus(); return; } ideas()['own'+at]=v; save(); res[at]=true; sfx('correct'); at++; next(); };
  $('back').onclick=()=>{ delete slot(at).pick; save(); next(); };
}

/* ── the result of a card: climb or drop, then his own idea ── */
function result(ok,w,r,diff){
  const s=slot(at), t=today(); let line;
  const r0=s.rung, rd0=s.rday, own0=s.own;   /* restored after a practice round */
  (ST.seen=ST.seen||{})[STEP[r].k]=1;
  if(ok){
    if(r===5&&!s.own&&s.rday!==t){ s.own=true; s.rday=t; line='<b class="yes">It’s yours ✓</b> You wrote it from memory.'; sfx('fanfare'); cheer('big'); }
    else if(!s.own&&s.rday!==t&&s.rung<5){ s.rung++; s.rday=t; line='<b class="yes">Yes!</b> Up to step '+s.rung+': '+esc(STEP[s.rung].name.toLowerCase())+', tomorrow.'; sfx('correct'); cheer('right','.yes'); }
    else { line='<b class="yes">Yes!</b> '+(s.own?'Still yours.':r===5?'Do it again on another day and it’s yours.':'Already climbed today. Tomorrow it goes up.'); sfx('correct'); cheer('right','.yes'); }
  } else {
    const drop=!s.own&&s.rung>1; if(drop) s.rung--;
    /* Select and Match already show the right one in green */
    line='<b class="no">Not yet.</b> '+(drop?'Back to step '+s.rung+'. ':s.own?'':'It comes back tomorrow. ')+(r<=2?'':'Here it is:<span class="full">'+(diff||html(fill(w)))+'</span>'); sfx('wrong');
  }
  if(PRACTICE){ s.rung=r0; s.rday=rd0; s.own=own0;
    line=(ok?'<b class="yes">Yes!</b> ':'<b class="no">Not yet.</b> '+(r<=2?'':'Here it is:<span class="full">'+(diff||html(fill(w)))+'</span> '))+'Practice round: your steps stay as they are.'; }
  save(); res[at]=ok;
  try{ Be2.answer('five-'+TASK,{id:'s'+(at+1)+'-'+D.slots[at].ways.indexOf(w),correct:ok,keep:true,kind:'recall',
    prompt:fill(w).replace(new RegExp('\\b'+w.hide+'\\b'),w.hide[0]+'___'),answer:fill(w),href:'/skills/writing/five.html?task='+TASK}); }catch(e){}
  const wantIdea=ok&&open(w.t)&&(r>=3||!ideas()[at]);
  $('after').innerHTML='<p class="fb">'+line+'</p>'+(wantIdea?
    '<p class="aim" style="margin-top:.9rem"><b>Now make it yours.</b> '+(a=>/\?\s*$/.test(a)?'Finish it: '+esc(a):'Finish it with '+esc(a)+'.')(against(at)?SUB().askBad:SUB().ask)+'</p><input class="wr" id="idea" maxlength="80" placeholder="your own idea" value="'+esc(ideas()[at]||'')+'">':'')+
    '<div class="cta"><button type="button" class="btn fill" id="nx">'+(at===D.slots.length-1?'Finish':'Next')+' →</button></div>';
  $('nx').onclick=()=>{ const v=$('idea')&&$('idea').value.trim(); if(v){ ideas()[at]=v; save(); } at++; next(); };
  $('nx').focus({preventScroll:true}); $('after').scrollIntoView({block:'nearest',behavior:'smooth'});
}
function done(){
  const got=res.filter(Boolean).length;
  card('<div class="kick">Five done</div><h2 id="fTitle">'+got+' of 5</h2>'+
    '<div class="rungs" style="justify-content:flex-start;margin-top:1rem">'+D.slots.map((_,i)=>{ const s=slot(i); return '<i class="'+(s.own?'own':'')+'" style="--p:'+(s.own?100:(s.rung-1)*25)+'"><b>'+(s.own?'✓':i+1)+'</b></i>'; }).join('')+'</div>'+
    '<p class="aim">'+(PRACTICE?'Practice round done. ':got===5?'Every one. ':'The ones you missed come back tomorrow. ')+'Each sentence climbs one step a day.</p>'+
    '<div class="cta"><button type="button" class="btn fill" id="see5">See my '+esc(D.name.toLowerCase())+'</button>'+(D.bridge?'<button type="button" class="btn" id="qx">Try a real question</button>':'')+'</div>');
  sfx(got===5?'jingle':'rise'); if(got===5) cheer(PRACTICE?'done':'big'); else if(got) cheer('done');
  $('see5').onclick=()=>{ setMode('mine'); close(); };
  if($('qx')) $('qx').onclick=bridge;
}

/* ── THE BRIDGE: his five on a real exam question (6 Nov) ──────────────
   Owning five sentences about Minecraft is not yet answering "tell us what
   you learnt". A real Part 2 question from the bank, chosen for his
   subject: for each of its points he taps the sentence that covers it (a
   point that describes goes in a feature; "would others like it?" in the
   recommendation). Then the plan shows each point INSIDE the gap it fills:
   the points are what his “…” are for. Checked by the app. */
let QS=null, QI=0;
function bridge(){
  if(!QS) return fetch(D.bridge.questions).then(r=>r.json()).then(d=>{ QS=d.questions; QI=0; bridge(); }).catch(()=>{});
  const want=D.bridge.bySubject[ST.key]||[], order=QS.filter(q=>want.indexOf(q.id)>-1).concat(QS.filter(q=>want.indexOf(q.id)<0));
  const q=order[QI%order.length], noun=D.bridge.noun[q.id]||'thing', rec=new RegExp(D.bridge.recommend,'i');
  const pts=q.keyPoints.map(t=>({t,rec:rec.test(t)})), nFeat=pts.filter(x=>!x.rec).length;
  /* his name if his thing is this kind of thing; otherwise "your documentary" */
  const mine=SUB().a.replace(/^an? /,'').split(' ').pop()===noun.split(' ').pop(), Xq=mine?X():'your '+noun;
  const a=(/^[aeiou]/.test(noun)?'an ':'a ')+noun;
  const fillQ=w=>w.t.replace(/\{a\}/g,a).replace(/\{plural\}/g,noun+'s').replace(/\{X\}/g,Xq);
  let k=0, miss=0; const put=[];
  /* "Describe the gameplay" → "the gameplay": what goes in the gap */
  const gist=t=>t.replace(/^(describe|explain|tell us|say|information (on|about)|the)\s+/i,m=>/^the\s/i.test(m)?m:'').replace(/^./,c=>c.toLowerCase());
  const label=i=>(i+1)+' · '+D.slots[i].part;
  const draw=()=>{
    const done=k>=pts.length;
    let h='<div class="kick">A real exam question</div><h2 id="fTitle">Use your five</h2>'+
      '<div class="q"><b>'+esc(q.announcement||'')+'</b> '+esc(q.question)+'</div>';
    if(!done){
      h+='<p class="aim">Point '+(k+1)+' of '+pts.length+': which of your five covers it?</p><p class="line" style="font-size:1.02rem">'+esc(pts[k].t)+'</p>'+
        '<div class="pool" id="pool">'+D.slots.map((_,i)=>'<button type="button" class="chip" data-i="'+i+'">'+esc(label(i))+'</button>').join('')+'</div><p class="fb" id="hint"></p>';
    } else {
      /* the plan: his five for THIS question, each point in its gap */
      const at2={}; put.forEach((i,j)=>{ (at2[i]=at2[i]||[]).push(pts[j].t); });
      h+='<p class="aim">'+(miss?'Done. ':'All right first time. ')+'Here is your plan for this question: each point goes in the gap it fills.</p><ol class="five plan">'+
        D.slots.map((sl,i)=>{ const p=at2[i];
          /* a third point in the drawback's place takes a feature's wording */
          const w=i===3&&p?D.slots[2].ways[2]:way(i);
          const note=p?' <span class="idea">→ '+esc(p.map(gist).join(' · '))+'</span>':'';
          const t=w?esc(fillQ(w)).replace(/\s*…\s*$/,' <span class="gap"></span>')+note:'<i>Your own sentence</i>'+note;
          return '<li><b class="n">'+(i+1)+'</b><div><small><span>'+esc(i===3&&p?'Feature, not the drawback':sl.part)+'</span></small>'+t+(i===3&&p?'<br><small style="display:block;margin-top:.2rem">Three points to cover: the third takes the drawback’s place.</small>':'')+'</div></li>'; }).join('')+'</ol>'+
        '<p class="aim">In your notebook: write this review, 140–190 words, with a detail for every point.</p>'+
        '<div class="cta"><button type="button" class="btn fill" id="qn">Another question</button><button type="button" class="btn" id="qd">Done</button></div>';
    }
    card(h);
    if(!done) $('pool').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
      const i=+b.dataset.i, P=pts[k], used=put.filter(x=>x===i).length;
      const featOK=(i===1||i===2||(i===3&&nFeat>2))&&!used;
      const ok=P.rec?i===4:featOK;
      if(ok){ put.push(i); k++; sfx('pop'); draw(); if(k>=pts.length) sfx(miss?'rise':'jingle'); }
      else { miss++; b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); sfx('wrong');
        $('hint').textContent=P.rec?'“Would others like it?” is what the recommendation is for.':i===0?'The introduction names it; a point like this needs a feature.':used&&(i===1||i===2)?'That feature already covers a point. Use the other one.':'A point that describes it goes in a feature.'; }
    });
    else { $('qn').onclick=()=>{ QI++; bridge(); }; $('qd').onclick=close; }
  };
  draw();
}

/* ── MY REVIEW: his five, with his own ideas, then the notebook ── */
const against=i=>!!D.slots[i].against||/drawback/i.test(D.slots[i].part);
/* MY <TASK> (7 Nov 2026): his five as the five card, filled — the fixed
   phrase dark, his own words grey, a caramel … where he hasn't written yet.
   Each line ends in its step (2/5); a ✓ line is his, and tapping ✓ changes
   its wording. */
function mine(){
  const id=ideas(), H=D.headings||{};
  const line=i=>{ const w=way(i), s=slot(i), sl=D.slots[i];
    const own=x=>'<span class="fc-own">'+esc(x)+'</span>';
    const h=w?esc(fill(w)).replace(/\s*…\s*$/,id[i]?' '+own(id[i]):' '+FiveCard.gap):(id['own'+i]?own(id['own'+i]):FiveCard.gap);
    return h+(s.own?'<button type="button" class="f5st fc-meta chg" data-i="'+i+'" aria-label="'+esc(sl.part)+': yours. Change the wording">✓</button>'
      :'<span class="f5st fc-meta" aria-label="'+esc(sl.part)+': step '+s.rung+' of 5">'+s.rung+'/5</span>'); };
  const n=D.slots.length, mid=D.slots.map((_,i)=>i).slice(1,n-1);
  $('stage').innerHTML='<section class="mine"><div class="fc-wrap">'+FiveCard.card({label:(D.part||'Part 2')+' · '+X(),task:D.name,n:1,
      openHead:H.open||'',closeHead:H.close||'',open:[line(0)],
      body:mid.map(i=>({html:line(i),against:against(i),head:H.body||''})),close:[line(n-1)]})+'</div>'+
    '<div class="note"><div class="kick">In your notebook</div><p>'+(D.notebook?esc(D.notebook).replace(/&lt;b&gt;\{X\}&lt;\/b&gt;/g,'<b>'+esc(X())+'</b>').replace(/\{X\}/g,esc(X())):'Write your review of <b>'+esc(X())+'</b> in five sentences, one per slot. Then check:')+'</p>'+
      '<ul class="ticks">'+(D.ticks||['I named it in the first sentence.','Each feature has a detail of my own.','I said who would enjoy it.','I didn’t copy any example word for word.','I read it aloud once.']).map(x=>'<li><label><input type="checkbox"><span>'+esc(x)+'</span></label></li>').join('')+'</ul>'+
      '<p class="tch">Five ticks? It’s '+(/^[aeiou]/i.test(D.name)?'an ':'a ')+esc(D.name.toLowerCase())+'. In class, show your teacher.</p></div>'+
    (D.bridge?'<button type="button" class="btn fill" id="qx" style="display:block;margin:1.2rem auto 0">Try your five on a real exam question →</button>':'')+'</section>';
  if($('qx')) $('qx').onclick=bridge;
  $('stage').querySelectorAll('.chg').forEach(b=>b.onclick=()=>choose(+b.dataset.i));
}
/* a slot that is his: another wording, or his own sentence */
function choose(i){
  const ways=D.slots[i].ways, cur=slot(i).pick; let k=typeof cur==='number'?cur:cur==='own'?'own':0;
  const draw=()=>{
    card('<div class="kick">'+(i+1)+' of '+D.slots.length+' · '+esc(LB(i))+' · Yours ✓</div><h2 id="fTitle">Pick your way</h2><p class="aim">To '+esc(D.slots[i].pick||D.slots[i].job)+'. A new wording starts at step 3.</p><div class="opts">'+
      ways.map((w,j)=>'<button type="button" class="opt'+(j===k?' on':'')+'" data-j="'+j+'"><span class="l">'+'ABC'[j]+'</span><span>'+html(fill(w))+'</span></button>').join('')+
      '<button type="button" class="opt'+(k==='own'?' on':'')+'" data-j="own"><span class="l">✎</span><span><b>My own sentence</b>, if it does the same job</span></button></div>'+
      '<div class="cta"><button type="button" class="btn fill" id="keep">Keep this one</button></div>');
    $('focus').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ k=b.dataset.j==='own'?'own':+b.dataset.j; draw(); });
    $('keep').onclick=()=>{ const s=slot(i); if(k!==s.pick&&!(k===0&&s.pick==null)){ s.pick=k; s.rung=3; s.rday=null; } save(); close(); };
  };
  draw();
}

function paint(){ if(MODE==='mine') mine(); else gate(); }
function setMode(m){ MODE=m; document.querySelectorAll('.wr-stage[data-m]').forEach(b=>{ const on=b.dataset.m===m; b.classList.toggle('active',on); if(on) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); }); paint(); window.scrollTo(0,0);
  /* the header's task tabs keep the mode: Essay → Review stays in My … or Practise */
  document.querySelectorAll('.mode-selector a.mode-btn').forEach(x=>{ x.href=x.href.replace(/&mode=mine\b/,'')+(m==='mine'?'&mode=mine':''); }); }
document.querySelectorAll('.wr-stage[data-m]').forEach(b=>b.onclick=()=>setMode(b.dataset.m));

fetch('/data/writing/five/'+TASK+'.json?v=7').then(r=>{ if(!r.ok) throw 0; return r.json(); }).then(d=>{
  D=d; ST=load();
  /* earlier versions: one subject {key,name}; slots by days right */
  if(ST.subj&&!ST.key){ ST.key=ST.subj.key; ST.names={}; ST.names[ST.subj.key]=ST.subj.name; delete ST.subj; }
  (ST.slots||[]).forEach(s=>{ if(s&&s.days&&!s.rung){ s.rung=s.days.length>=2?4:s.days.length?2:1; delete s.days; } });
  if(!D.subjects.some(s=>s.key===ST.key)) ST.key=D.subjects[0].key;
  /* v4: slot 4 became the drawback, so its progress and ideas start again */
  if(TASK==='reviews'&&(ST.v||0)<4){ if(ST.slots&&ST.slots[3]) ST.slots[3]={rung:1}; Object.values(ST.ideas||{}).forEach(o=>{ delete o[3]; delete o.own3; }); ST.v=4; }
  if(P.get('tap')==='1') ST.tap=true; else if(P.get('tap')==='0') ST.tap=false;
  save();
  document.title='INTUITY — Your '+D.name.toLowerCase()+' in five';
  { const m=document.querySelector('.wr-stage[data-m="mine"]'); if(m) m.textContent='My '+D.name.toLowerCase(); }
  $('subj').setAttribute('aria-label','What you write about');
  tabs(); if(P.get('mode')==='mine') setMode('mine'); else paint();
}).catch(()=>{ $('stage').innerHTML='<p style="text-align:center">This could not load. Check your connection and try again.</p>'; });
})();
</script>
