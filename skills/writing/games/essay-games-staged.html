<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTUITY — Structure Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600;700&family=Anton&display=swap" rel="stylesheet">
<style>
  /* ═══════════════════════════════════════════════════════════════════
     TOKENS — unchanged from the shared system.
     ═══════════════════════════════════════════════════════════════════ */
  :root{
    --r-sheet:22px;     /* CHANGED — the modal is now the poster sheet, so it gets the shell's radius back */
    --r-field:0;        /* everything else in this page stays bare */
    --r-chip:0;

    --f-display:'Geist','Inter',system-ui,sans-serif;
    --f-body:'Geist','Inter',system-ui,sans-serif;
    --f-mono:'Geist Mono',ui-monospace,monospace;

    --screen:#F3F1ED;
    --card:#FAF8F5;

    --ink:#232C31;
    --dim:#5C5852;
    --faint:#756B6E;
    --rule:#BCB1A0;

    --caramel:#B0865C;
    --poster-ink:#14110E;
    --poster-body:#5C5852;
    --poster-faint:rgba(20,17,14,.50);
    --poster-fill:rgba(20,17,14,.09);
    --poster-fill-hi:rgba(20,17,14,.15);
    --poster-rule:rgba(20,17,14,.16);
    --scrim:rgba(20,17,14,.55);

    --ok:#3A6B50;
    --wrong:#A23B2C;
  }

  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    overflow:hidden;min-height:100vh;background:var(--screen);color:var(--ink);
    font-family:var(--f-body);-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;align-items:center;
    padding:0 0 20px;
  }
  button,a{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
  :focus-visible{outline:2px solid var(--caramel);outline-offset:2px}
  .cond{font-family:var(--f-mono)}
  main{flex:1;min-height:0;width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;padding:0 16px}

  /* ═══════════════════════════════════════════════════════════════════
     THE HEADER — Reading's five rows, carrying this page's five axes:
     type (mode-selector), stage (set-tabs), game (setrow + dots),
     view (viewtog). Same skeleton across the product; only the content
     that fills each slot changes per page.
     ═══════════════════════════════════════════════════════════════════ */
  .header{width:100%;flex:none;background:var(--card);
    border-bottom:1px solid var(--poster-rule);padding:calc(14px + env(safe-area-inset-top)) 16px 0;}
  .header-top{display:flex;align-items:flex-start;justify-content:space-between;
    padding-bottom:.9rem;gap:.6rem;}
  .back-link{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.1em;
    text-transform:uppercase;color:var(--poster-faint);padding-top:.25rem;flex:none;}
  .back-link:hover{color:var(--poster-ink);}
  .header-title{flex:1;text-align:center;}
  .app-title{display:inline-flex;align-items:center;gap:.4rem;
    font-family:var(--f-display);font-weight:800;
    font-size:1.15rem;letter-spacing:-.03em;color:var(--poster-ink);}
  .app-title::before{content:'';flex:none;width:7px;height:7px;
    border-radius:2px;background:var(--caramel);}
  .app-subtitle{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.14em;
    text-transform:uppercase;color:var(--poster-faint);margin-top:.2rem;}
  .header-spacer{flex:none;display:flex;align-items:center;gap:.5rem;
    font-family:var(--f-mono);font-size:.62rem;letter-spacing:.06em;color:var(--poster-faint);
    padding-top:.2rem;}
  .mute{font-size:1rem;line-height:1;color:var(--poster-faint);}
  .mute:hover{color:var(--caramel);}

  /* Row 2 — TYPE, the top-level switch (Reading's Part 5/6/7 slot). */
  .mode-selector{display:flex;gap:1.4rem;justify-content:center;
    padding-bottom:.8rem;flex-wrap:wrap;}
  .mode-btn{font-family:var(--f-mono);font-size:.64rem;font-weight:700;letter-spacing:.1em;
    text-transform:uppercase;color:var(--poster-faint);padding-bottom:.25rem;transition:color .15s;}
  .mode-btn:hover{color:var(--poster-ink);}
  .mode-btn.active{color:var(--poster-ink);box-shadow:inset 0 -2px 0 var(--caramel);}

  /* Row 3 — STAGE, the item list within the current type (Reading's Text 1–12 slot). */
  .set-tabs{display:flex;gap:1.1rem;overflow-x:auto;scrollbar-width:none;
    -webkit-overflow-scrolling:touch;padding-bottom:.8rem;flex-wrap:wrap;justify-content:center;}
  .set-tabs::-webkit-scrollbar{display:none;}
  .tabitem{flex:none;font-family:var(--f-mono);font-size:.6rem;font-weight:600;
    letter-spacing:.08em;text-transform:uppercase;color:var(--poster-faint);
    padding-bottom:.2rem;white-space:nowrap;transition:color .15s;}
  .tabitem:hover{color:var(--poster-ink);}
  .tabitem.active{color:var(--poster-ink);box-shadow:inset 0 -2px 0 var(--poster-rule);}

  .wrapper{width:100%;max-width:560px;flex:1;min-height:0;display:flex;flex-direction:column;
    padding:0 16px;overflow:hidden;}

  /* Row 4 — GAME, the current lens on that stage (Reading's gap-dot setrow). */
  .setrow{display:flex;align-items:center;justify-content:center;gap:.6rem;padding:1rem 0 .8rem;}
  .arrow{width:30px;height:30px;flex:none;font-size:1.1rem;color:var(--poster-faint);
    display:flex;align-items:center;justify-content:center;transition:color .15s;}
  .arrow:hover{color:var(--poster-ink);}
  .tdots{display:flex;gap:1.3rem;align-items:center;}
  .tdot{font-family:var(--f-mono);font-size:.6rem;font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;color:var(--poster-faint);padding-bottom:.15rem;transition:color .15s;}
  .tdot:hover{color:var(--poster-ink);}
  .tdot.active{color:var(--poster-ink);box-shadow:inset 0 -2px 0 var(--caramel);}
  .tdot.done{color:var(--ok);}

  /* Row 5 — VIEW, Stages vs Full text (Reading's Per gap / Full text slot). */
  .viewrow{display:flex;justify-content:center;padding-bottom:1rem;}
  .viewtog{display:inline-flex;gap:1.4rem;}
  .viewbtn{font-family:var(--f-mono);font-size:.6rem;font-weight:700;letter-spacing:.1em;
    text-transform:uppercase;color:var(--poster-faint);padding-bottom:.2rem;transition:color .15s;}
  .viewbtn:hover{color:var(--poster-ink);}
  .viewbtn.active{color:var(--poster-ink);box-shadow:inset 0 -2px 0 var(--caramel);}

  /* ── THE STAGE — now the filled poster card, same object as Reading's
     .mc-card: white paper, a hairline border, a soft lifted shadow, and
     a kicker row (caramel bar + meta) with a counter on the right. ── */
  #shell{flex:1;min-height:0;width:100%;display:none;flex-direction:column;align-items:center;overflow-y:auto;padding:.2rem 0 1rem;}
  #shell.on{display:flex}
  .card{position:relative;width:100%;background:var(--card);
    border:1px solid var(--poster-rule);border-radius:16px;
    box-shadow:0 1px 2px rgba(20,17,14,.05),0 12px 30px -16px rgba(20,17,14,.16);
    padding:1.3rem 1.3rem 1.4rem;
    display:flex;flex-direction:column;flex:1 1 auto;min-height:0;}

  .cardhead{position:relative;flex:none;display:flex;align-items:center;
    justify-content:space-between;flex-wrap:wrap;gap:.3rem .8rem;
    padding-bottom:.85rem;margin-bottom:1rem;border-bottom:1px solid var(--poster-rule)}
  .step-label{display:flex;align-items:center;gap:9px;font-family:var(--f-mono);
    font-size:.6rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:var(--poster-faint);}
  .step-label::before{content:'';display:block;flex:none;width:20px;height:8px;background:var(--caramel);}
  .title{width:100%;order:3;margin-top:.15rem;font-family:var(--f-display);font-weight:700;
    font-size:clamp(1.25rem,4.2vw,1.6rem);letter-spacing:-.01em;color:var(--poster-ink);line-height:1.15}
  .game-badge{font-family:var(--f-mono);font-size:.6rem;font-weight:700;letter-spacing:.1em;
    text-transform:uppercase;color:var(--poster-faint);}

  .body{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:0;display:flex;flex-direction:column;gap:.4rem}
  .body::-webkit-scrollbar{width:5px}
  .body::-webkit-scrollbar-thumb{background:var(--poster-rule)}

  /* ── ORDER THE SUPPORTS ── */
  .os-claim{padding:0 0 .9rem;border-bottom:1px solid var(--poster-rule);margin-bottom:.2rem}
  .os-claim .tag{font-family:var(--f-mono);font-size:.56rem;letter-spacing:.18em;color:var(--caramel);font-weight:700}
  .os-claim .text{font-family:var(--f-body);font-size:1rem;line-height:1.45;color:var(--poster-ink);margin-top:.25rem}

  .os-supports{display:flex;flex-direction:column;counter-reset:os}
  .os-item{border:none;border-top:1px solid var(--poster-rule);
    padding:.85rem 0 .85rem 1.7rem;position:relative;cursor:grab;
    font-family:var(--f-body);font-size:.96rem;line-height:1.45;color:var(--poster-ink);
    transition:opacity .12s,color .12s}
  .os-supports .os-item:first-child{border-top:none}
  .os-item::before{counter-increment:os;content:counter(os);position:absolute;left:0;top:.85rem;
    font-family:var(--f-mono);font-size:.72rem;color:var(--poster-faint)}
  .os-item:hover{color:var(--caramel)}
  .os-item.dragging{opacity:.4}
  .os-item.picked{color:var(--caramel)}
  .os-item.picked::before{color:var(--caramel)}
  .os-item.locked{color:var(--ok)}
  .os-item.locked::before{color:var(--ok)}
  .os-whole{font-family:var(--f-body);font-size:.96rem;line-height:1.7;color:var(--poster-body)}
  .os-whole .frame{color:var(--caramel)}
  .os-win{color:var(--ok);font-family:var(--f-mono);letter-spacing:.14em;font-size:.7rem;
    font-weight:700;padding:0 0 .7rem;text-transform:uppercase}

  .jump{display:flex;gap:1.2rem;flex-wrap:wrap;padding:.2rem 0 .5rem}
  .jbtn{color:var(--poster-faint);font-family:var(--f-mono);font-size:.68rem;letter-spacing:.1em;
    font-weight:700;padding-bottom:.15rem}
  .jbtn:hover{color:var(--poster-ink);box-shadow:inset 0 -2px 0 var(--caramel)}
  .hint{color:var(--poster-faint);font-size:.8rem;padding:0 0 .8rem;line-height:1.4}

  /* ── PUZZLE ── */
  .pz-line{min-height:44px;padding:.4rem 0 .7rem;border-bottom:1px solid var(--poster-rule);
    display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:flex-start}
  .pz-empty{color:var(--poster-faint)}
  .pz-pool{display:flex;flex-wrap:wrap;gap:.5rem 1.1rem;padding-top:.8rem}
  .pz-w{font-family:var(--f-body);font-size:.94rem;color:var(--poster-ink);cursor:pointer;
    user-select:none;padding-bottom:.1rem;transition:color .12s}
  .pz-w:hover{color:var(--caramel);box-shadow:inset 0 -2px 0 var(--caramel)}
  .pz-w.placed{color:var(--poster-faint);text-decoration:line-through;text-decoration-thickness:1px}
  .pz-nudge{width:100%;color:var(--poster-faint);font-size:.72rem;padding-top:.4rem;font-family:var(--f-body)}

  /* ── BUILDER PASSAGE / SENTENCE ── */
  .bd-sent{font-family:var(--f-body);font-size:.98rem;line-height:1.5;color:var(--poster-ink);
    padding:0 0 .8rem;border-bottom:1px solid var(--poster-rule)}
  .bd-slot{display:inline-block;color:var(--poster-rule);border-bottom:2px solid var(--poster-rule);
    letter-spacing:.06em;padding:0 3px}
  .bd-slot.active{border-bottom-color:var(--caramel);color:var(--caramel)}
  .bd-note{color:var(--poster-faint);font-size:.72rem;padding-top:.3rem;line-height:1.4}
  .stub{text-align:center;color:var(--poster-faint);font-family:var(--f-body);font-size:.86rem;
    padding:2.2rem 1rem;line-height:1.6}
  .stub b{color:var(--poster-ink)}

  .actions{flex:none;display:flex;gap:1.6rem;align-items:baseline;justify-content:center;
    flex-wrap:wrap;padding:1rem 0 .3rem;border-top:1px solid var(--poster-rule);margin-top:.6rem}
  .actions button{font-family:var(--f-mono);letter-spacing:.1em;font-size:.68rem;font-weight:700;
    text-transform:uppercase;cursor:pointer;color:var(--poster-faint);transition:color .15s}
  .actions button:hover{color:var(--poster-ink)}
  .actions .primary{color:var(--poster-ink);box-shadow:inset 0 -2px 0 var(--caramel);padding-bottom:.15rem}
  .actions .primary:hover{color:var(--caramel)}
  .actions .primary:disabled,.actions button:disabled{opacity:.35;cursor:default;box-shadow:none}

  #loading{color:var(--poster-faint);padding:3rem;font-size:.85rem;font-family:var(--f-mono)}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  @media (min-width:1100px){
    main{max-width:920px}
    .card{width:100%}
    .title{font-size:clamp(2rem,3vw,2.7rem)}
    .step-label{font-size:.68rem;letter-spacing:.24em}
    .game-badge{font-size:.68rem}
    .hint{font-size:15px}
    .os-claim .text{font-size:1.25rem}
    .os-item{font-size:1.15rem;line-height:1.55;padding:1.1rem 0 1.1rem 2.1rem}
    .os-whole{font-size:1.15rem;line-height:1.8}
    .pz-w{font-size:1.05rem}
    .bd-sent{font-size:1.1rem}
    .actions{padding:1.3rem 0 .3rem;gap:2rem}
    .actions button{font-size:.78rem}
  }

  @media (max-width:560px){
    .header{padding:calc(10px + env(safe-area-inset-top)) 12px 0}
    .app-title{font-size:1rem}
    main{padding:0 12px}
    .card{padding:1.05rem 1rem 1.2rem;border-radius:14px}
    .cardhead{padding-bottom:.8rem;margin-bottom:.8rem}
    .title{font-size:clamp(1.2rem,6.5vw,1.5rem)}
    .os-item{font-size:.92rem;padding:.8rem 0 .8rem 1.5rem;min-height:44px;display:flex;align-items:center}
    .pz-w{font-size:.9rem;min-height:38px;display:inline-flex;align-items:center}
    .bd-sent{font-size:.92rem}
    .actions{padding:.8rem 0 .3rem;gap:1.2rem}
    .actions button{min-height:40px}
    .os-whole{font-size:.92rem}
  }

  @media (max-height:840px){
    .cardhead{padding-bottom:.7rem;margin-bottom:.7rem}
    .title{font-size:clamp(1.2rem,3.4vw,1.6rem)}
    .step-label{font-size:.56rem;margin-bottom:.2rem}
  }

  /* ── PUZZLE: paragraph forming sentence by sentence ── */
  .pz-built{font-family:var(--f-body);font-size:.96rem;line-height:1.6;color:var(--poster-ink);
    padding:0 0 .8rem;border-bottom:1px solid var(--poster-rule);min-height:44px}
  .pz-built .frame{color:var(--caramel)}
  .pz-dots{display:flex;gap:.9rem;justify-content:center;align-items:center;padding:.7rem 0 0}
  .pz-dot{font-family:var(--f-mono);font-size:.68rem;font-weight:700;
    color:var(--poster-faint);cursor:pointer;padding-bottom:.1rem;transition:color .15s}
  .pz-dot:hover{color:var(--poster-ink)}
  .pz-dot.on{color:var(--caramel);box-shadow:inset 0 -2px 0 var(--caramel)}
  .pz-dot.done{color:var(--ok)}
  .pz-dot.done.on{color:var(--ok);box-shadow:inset 0 -2px 0 var(--ok)}
  .pz-dot.part{color:var(--caramel)}

  .ps-done{cursor:pointer;transition:color .12s}
  .ps-done:hover{color:var(--caramel)}
  .ps-place{color:var(--poster-ink);cursor:pointer}
  .ps-place:hover{color:var(--caramel)}
  .ps-gap{color:var(--poster-rule);letter-spacing:.08em}
  .ps-todo{color:var(--poster-rule);letter-spacing:.1em;font-size:.9em}

  /* ── STORYBOARD ── */
  .sb-count{font-family:var(--f-display);font-weight:800;font-size:1.6rem;color:var(--caramel);
    margin-top:.5rem;line-height:1}
  .sb-blank{display:inline-block;border:none;border-bottom:2px solid var(--caramel);
    background:transparent;padding:0 2px;margin:0 1px;
    font-family:var(--f-body);font-size:inherit;color:var(--poster-ink);text-align:center}
  .sb-blank:focus{outline:none;border-bottom-color:var(--caramel)}
  .sb-flashing{color:var(--poster-ink)}
  .sb-blank.wrong{color:var(--wrong);border-bottom-color:var(--wrong);font-weight:600}
  .sb-given{color:var(--poster-faint);border-bottom:1px solid var(--poster-rule);
    padding:0 2px;font-style:italic}
  .sb-tally{display:block;color:var(--caramel);font-size:.68rem;letter-spacing:.05em;padding-top:.3rem;
    font-family:var(--f-mono);font-weight:700}

  /* ── TOAST ── */
  #toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,10px);z-index:200;
    background:var(--poster-ink);color:var(--card);padding:.55rem 1.1rem;
    font-size:.78rem;font-family:var(--f-body);
    opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
  #toast.on{opacity:1;transform:translate(-50%,0)}

  /* ── PRIZE ── */
  .prize{text-align:center;padding:.6rem 0 .2rem}
  .prize-badge{font-family:var(--f-display);font-weight:900;font-size:2.4rem;color:var(--caramel);line-height:1}
  .prize-title{font-family:var(--f-mono);font-size:.85rem;font-weight:700;letter-spacing:.22em;
    color:var(--poster-ink);margin-top:.2rem;text-transform:uppercase}
  .prize-sub{color:var(--poster-faint);font-size:.78rem;margin-top:.35rem}

  .spark{position:absolute;top:38%;width:5px;height:5px;background:var(--caramel);
    opacity:.7;animation:fly 1s ease-out forwards;pointer-events:none}
  @keyframes fly{0%{opacity:.7;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--dx),-90px)}}
  @media(prefers-reduced-motion:reduce){.spark{display:none}}

  /* ── BUILDER ── */
  .bd-para{line-height:1.7}
  .bd-tag{font-family:var(--f-mono);font-size:.58rem;font-weight:700;letter-spacing:.1em;
    color:var(--caramel);margin:0 4px 0 2px;vertical-align:2px}
  .bd-topic{font-family:var(--f-mono);font-size:.68rem;font-weight:700;letter-spacing:.16em;
    color:var(--caramel);text-transform:uppercase}
  .bd-intro{font-family:var(--f-body);font-size:.96rem;line-height:1.55;padding:.4rem 0 .9rem;
    border-bottom:1px solid var(--poster-rule)}
  .bd-open{color:var(--caramel);font-weight:600}
  .bd-base{color:var(--poster-ink)}
  .bd-moves{display:flex;flex-direction:column}
  .bd-row{display:flex;gap:1rem;align-items:flex-start;padding:.7rem 0;border-top:1px solid var(--poster-rule)}
  .bd-moves .bd-row:first-child{border-top:none}
  .bd-move{flex:0 0 88px;text-align:left;font-family:var(--f-mono);font-size:.62rem;font-weight:700;
    letter-spacing:.08em;color:var(--poster-faint);cursor:pointer;padding-top:.1rem;transition:color .12s}
  .bd-move:hover{color:var(--poster-ink)}
  .bd-move.on{color:var(--caramel)}
  .bd-line{flex:1;min-width:0;font-family:var(--f-body);font-size:.9rem;line-height:1.45;
    color:var(--poster-ink);cursor:pointer}
  .bd-hintline{color:var(--poster-rule);font-style:italic;font-size:.82rem}
  @media(min-width:1100px){ .bd-line{font-size:1.02rem} .bd-intro{font-size:1.12rem}
    .bd-move{flex-basis:108px;font-size:.7rem} }

  /* ═══════════════════════════════════════════════════════════════════
     THE BUILDER MODAL — now Reading's rd-sheet/rd-card: the same object
     as the choice card in Reading Part 5/6 and every other poster modal
     in the product, rather than a page-specific sheet. Bottom sheet on
     a phone (options are full sentences, same reasoning as Reading);
     centred on wider screens.
     ═══════════════════════════════════════════════════════════════════ */
  .rd-sheet{position:fixed;inset:0;z-index:300;display:none;
    align-items:flex-end;justify-content:center;
    background:var(--scrim);backdrop-filter:blur(6px);padding:0;}
  .rd-sheet.on{display:flex;}
  .rd-card{width:min(560px,100%);max-height:88vh;overflow-y:auto;
    background:var(--card);border-radius:var(--r-sheet) var(--r-sheet) 0 0;
    padding:1.4rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom,0px));
    box-shadow:0 -18px 50px -18px rgba(20,17,14,.40);}
  @media(min-width:560px){
    .rd-sheet{align-items:center;}
    .rd-card{border-radius:var(--r-sheet);padding-bottom:1.4rem;}
  }
  .rd-card-kick{display:flex;align-items:center;gap:9px;margin-bottom:.5rem;
    font-family:var(--f-mono);font-size:.62rem;font-weight:700;letter-spacing:.16em;
    text-transform:uppercase;color:var(--poster-ink);}
  .rd-card-kick::before{content:'';display:block;flex:none;width:26px;height:10px;
    background:var(--caramel);}
  .rd-card-hint{font-family:var(--f-body);font-style:italic;font-size:.82rem;
    color:var(--poster-faint);margin-bottom:1rem;}

  .rd-opt{display:flex;width:100%;align-items:flex-start;gap:.7rem;
    text-align:left;font-family:var(--f-display);font-size:.94rem;font-weight:500;
    line-height:1.5;color:var(--poster-ink);background:var(--poster-fill);
    border:none;border-radius:var(--r-chip,10px);padding:.8rem .9rem;
    margin-bottom:.45rem;cursor:pointer;transition:background .15s;}
  @media(hover:hover){ .rd-opt:hover{background:var(--poster-fill-hi);} }
  .rd-opt:active{transform:scale(.99);}
  .rd-opt .let{font-family:var(--f-mono);font-size:.76rem;font-weight:400;
    color:var(--poster-faint);flex:none;padding-top:.12em;}
  .rd-opt.chosen{background:var(--poster-ink);color:var(--card);}
  .rd-opt.chosen .let{color:var(--card);opacity:.6;}
  .rd-opt.clear{font-family:var(--f-mono);font-size:.68rem;color:var(--poster-faint);
    background:none;justify-content:center;}
  .rd-close{width:100%;margin-top:.4rem;font-family:var(--f-display);
    font-size:.66rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    padding:.7rem;border:none;border-radius:999px;cursor:pointer;
    background:none;color:var(--poster-faint);}
  @media(hover:hover){ .rd-close:hover{background:var(--poster-fill);color:var(--poster-ink);} }
@media(min-width:1600px){ .rd-card{width:min(2550px,92vw);padding:2.3rem 2.8rem;border-radius:0;} .rd-opt{font-size:1.12rem} }
</style>
</head>
<body>

<!-- ═══ ROW 1+2 of the shell: identity row, then the type switch ═══ -->
<header class="header">
  <div class="header-top">
    <a class="back-link" href="/skills/writing/games/menu" target="_top">&larr; Writing</a>
    <div class="header-title">
      <div class="app-title">INTUITY</div>
      <div class="app-subtitle" id="pageSubtitle">Essay Games</div>
    </div>
    <span class="header-spacer">
      <button class="mute" id="newTextBtn" type="button" aria-label="New text" title="Another model text">&#8635;</button>
      <span id="textTag">Text —/—</span>
    </span>
  </div>

  <!-- Row 2 — TYPE. Reading's Part 5/6/7 slot; here, the writing type. -->
  <nav class="mode-selector" id="typeStrip" aria-label="Writing type"></nav>

  <!-- Row 3 — GAME. Reading's Text 1–12 slot; here, which mechanic you're
       practising with. A plain tab list, not dots: the four games are
       categories, not a sequence, so there is no "next game" the way
       there is a "next gap". -->
  <div class="set-tabs" id="gameTabs"></div>
</header>

<main>
  <div class="wrapper">
    <!-- Row 4 — STAGE. Reading's gap setrow (arrows + dots); here, the
         essay's stages — genuinely ordered (Intro → Body 1 → … →
         Conclusion), so this is the one that earns the sequential device. -->
    <div class="setrow">
      <button class="arrow" id="prevStage" type="button" aria-label="Previous stage">&lsaquo;</button>
      <div class="tdots" id="stageDots" role="tablist" aria-label="Choose a stage"></div>
      <button class="arrow" id="nextStage" type="button" aria-label="Next stage">&rsaquo;</button>
    </div>

    <!-- Row 5 — VIEW. Reading's Per gap / Full text slot. -->
    <div class="viewrow">
      <div class="viewtog" role="group" aria-label="Stages or full text">
        <button class="viewbtn active" id="mbStages" type="button" data-view="stages">Stages</button>
        <button class="viewbtn" id="mbFull" type="button" data-view="full">Full text</button>
      </div>
    </div>

    <div id="loading" style="display:none">Loading&hellip;</div>
    <div id="shell">
      <div class="card" id="card">
        <div class="cardhead" id="cardhead">
          <span class="step-label" id="stepLabel">STAGE</span>
          <div class="title" id="stageTitle">INTRODUCTION</div>
          <span class="game-badge" id="gameBadge">ORDER THE SUPPORTS</span>
        </div>
        <div class="body" id="cardBody"></div>
        <div class="actions" id="cardActions"></div>
      </div>
    </div>
  </div>
</main>

<!-- The choice card — Reading's rd-sheet/rd-card, the same object used
     for the sentence picker in Reading Part 5/6. -->
<div class="rd-sheet" id="bdModal" role="dialog" aria-modal="true" aria-label="Choose a move">
  <div class="rd-card">
    <div class="rd-card-kick" id="bdmMove"></div>
    <div class="rd-card-hint" id="bdmHint"></div>
    <div id="bdmOpts"></div>
    <button class="rd-close" id="bdmClose" type="button">&times; Close</button>
  </div>
</div>

<script>
(function(){
  'use strict';
  const TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints>0;
  if(TOUCH) document.body.classList.add('touch');
  const MOVE_HINT = TOUCH ? 'Tap one sentence, then another, to swap them.'
                          : 'Drag the sentences into the order that reads best.';

  const TYPES=[
    {id:'essays', label:'ESSAY',  desc:'Claim → support → link',  ico:'01'},
    {id:'reports',label:'REPORT', desc:'Findings, laid out plainly',ico:'02'},
    {id:'reviews',label:'REVIEW', desc:'Verdict, then the reasons', ico:'03'},
    {id:'emails', label:'EMAIL',  desc:'Ask, context, sign-off',    ico:'04'}
  ];
  const DATA={essays:'/skills/writing/games/data/essays-models.json',
    reports:'/skills/writing/games/data/reports-models.json',
    reviews:'/skills/writing/games/data/reviews-models.json',
    emails:'/skills/writing/games/data/emails-models.json'};
  const FRAMES=['This is because','For example','As a result','Firstly','Secondly','Furthermore',
    'Moreover','In addition','However','On the other hand','For instance','Because of this',
    'Consequently','Therefore','To begin with','What is more','I firmly believe that','In my view',
    'In conclusion','To sum up','Nowadays','These days'];

  const GAMES=[
    {id:'sequence', nm:'Sequence'},
    {id:'story',    nm:'Storyboard'},
    {id:'puzzle',   nm:'Puzzle'},
    {id:'builder',  nm:'Builder'}
  ];

  let type=null, stages=[], play=[], fullText=false, si=0, game='sequence', solved=new Set();

  /* ── Row 2: TYPE, in the mode-selector ── */
  function renderTypeStrip(){
    const s=document.getElementById('typeStrip'); s.innerHTML='';
    TYPES.forEach(t=>{
      const b=document.createElement('button');
      b.className='mode-btn'+(t.id===type?' active':'');
      b.textContent=t.label;
      b.onclick=()=>{ if(t.id!==type) chooseType(t.id); };
      s.appendChild(b);
    });
  }
  function chooseType(id){
    type=id;
    renderTypeStrip();
    initType(id);
  }

  function buildStages(){
    const sample=DATASET.samples[sampleIdx];
    stages=sample.paragraphs.map(p=>({
      label:shortLabel(p.label), full:p.label,
      sents:p.text.trim().split(/(?<=[.!?])\s+/).filter(Boolean)
    }));
  }
  document.getElementById('newTextBtn').onclick=function(){
    if(!DATASET||DATASET.samples.length<2) return;
    let n=sampleIdx; while(n===sampleIdx) n=Math.floor(Math.random()*DATASET.samples.length);
    sampleIdx=n; solved=new Set(); pzStage=-1; si=0;
    buildStages(); rebuildPlay(); renderStrip(); load(firstPlayable());
    document.getElementById('textTag').textContent='Text '+(sampleIdx+1)+'/'+DATASET.samples.length;
  };
  function rebuildPlay(){
    play = fullText
      ? [{label:'Full Text', sents: stages.reduce((a,s)=>a.concat(s.sents),[])}]
      : stages;
  }
  let order=[], curSupports=[], curClaim='';

  let DATASET=null, sampleIdx=0;
  function initType(t){
    document.getElementById('loading').style.display='block';
    document.getElementById('loading').textContent='Loading\u2026';
    fetch(DATA[t]).then(r=>r.json()).then(d=>{
      DATASET=d;
      if(!(d.samples&&d.samples.length)){fail('No content.');return;}
      sampleIdx=Math.floor(Math.random()*d.samples.length);
      buildStages();
      const TYPE_LABEL={essays:'ESSAY',reports:'REPORT',reviews:'REVIEW',emails:'EMAIL',articles:'ARTICLE'};
      document.getElementById('pageSubtitle').textContent=(TYPE_LABEL[t]||'WRITING')+' Games';
      document.getElementById('textTag').textContent='Text '+(sampleIdx+1)+'/'+d.samples.length;
      document.getElementById('loading').style.display='none';
      document.getElementById('shell').classList.add('on');
      solved=new Set(); pzStage=-1; sbStage=-1; ftFocus=null; si=0; fullText=false;
      document.getElementById('mbStages').classList.add('active');
      document.getElementById('mbFull').classList.remove('active');
      rebuildPlay(); renderStrip(); renderGames(); load(firstPlayable());
    }).catch(()=>fail('Could not load game data.'));
  }

  function fail(m){document.getElementById('loading').style.display='block';document.getElementById('loading').textContent=m;}
  function playable(i){ if(!play[i])return false;
    const n=play[i].sents.length;
    return n>=1; }
  function firstPlayable(){ for(let i=0;i<play.length;i++) if(playable(i)) return i; return 0; }
  function shortLabel(l){
    if(/introduction/i.test(l))return'Introduction';
    if(/conclusion/i.test(l))return'Conclusion';
    const b=l.match(/body paragraph\s*(\d)/i); if(b)return'Body '+b[1];
    const p=l.match(/^(.+?)\s*-\s*paragraph\s*(\d)/i); if(p)return p[1].trim()+' '+p[2];
    return l.split('-')[0].trim();
  }

  /* ── Row 3: GAME, as a plain tab list — categories, not a sequence,
     so it takes the set-tabs device rather than the arrow+dot one. ── */
  function renderGames(){
    const s=document.getElementById('gameTabs'); s.innerHTML='';
    GAMES.forEach(gm=>{
      const b=document.createElement('button');
      b.className='tabitem'+(gm.id===game?' active':'');
      b.textContent=gm.nm;
      b.onclick=()=>{ if(gm.id!==game){ game=gm.id; ftFocus=null; renderGames(); load(si); } };
      s.appendChild(b);
    });
  }

  /* ── Row 4: STAGE, as dots between the two arrows — Introduction through
     Conclusion is a genuine order, the same reason Reading's gaps get
     this device. ── */
  function renderStrip(){
    const d=document.getElementById('stageDots'); d.innerHTML='';
    const row=document.querySelector('.setrow');
    const hide=(fullText||game==='builder');
    row.style.display = hide ? 'none' : 'flex';
    if(hide) return;
    play.forEach((st,i)=>{
      const b=document.createElement('button');
      b.className='tdot'+(i===si?' active':'')+(solved.has(i+':'+game)?' done':'');
      b.textContent=st.label;
      b.onclick=()=>load(i);
      d.appendChild(b);
    });
  }
  document.getElementById('prevStage').onclick=function(){
    if(!play.length) return;
    const i=(si-1+play.length)%play.length; load(i);
  };
  document.getElementById('nextStage').onclick=function(){
    if(!play.length) return;
    const i=(si+1)%play.length; load(i);
  };

  /* ── Row 5: VIEW, Stages / Full text ── */
  document.getElementById('mbStages').onclick=()=>window._mode(false);
  document.getElementById('mbFull').onclick=()=>window._mode(true);

  function load(i){
    si=i;
    const st=play[i];
    document.getElementById('stepLabel').textContent=(game==='builder'?'CHOOSE YOUR MOVES':(fullText?'WHOLE ESSAY':'STAGE '+(i+1)+' OF '+play.length));
    document.getElementById('stageTitle').textContent=
      game==='builder' ? 'BUILD A PARAGRAPH'
      : (fullText ? (ftFocus? ftFocus.label.toUpperCase() : 'THE WHOLE TEXT') : st.label.toUpperCase());
    const gm=GAMES.find(g=>g.id===game);
    document.getElementById('gameBadge').textContent=gm.nm.toUpperCase();
    renderStrip();
    renderGames();
    if(game==='builder')            { renderBuilder(); return; }
    if(fullText && !ftFocus)        { renderFullMap(); return; }
    const target = (fullText && ftFocus) ? ftFocus : st;
    if(game==='sequence')      renderSequence(target);
    else if(game==='story')    renderStoryboard(target);
    else                       renderPuzzle(target);
    if(fullText && ftFocus){
      const a=document.getElementById('cardActions');
      a.insertAdjacentHTML('afterbegin','<button onclick="window._ftBack()">← BACK TO TEXT</button>');
    }
  }

  // ── ORDER THE SUPPORTS in-card ──
  function renderOrder(st){
    curClaim=st.sents[0]||'';
    curSupports=st.sents.slice(1);
    const body=document.getElementById('cardBody');
    const actions=document.getElementById('cardActions');
    if(fullText){
      body.innerHTML='<div class="stub"><b>Order Supports</b> works on one paragraph at a time \u2014 a claim with its support.<br><br>For the whole essay, try <b>Sequence</b> or <b>Puzzle</b>.</div>';
      actions.innerHTML=''; return;
    }
    if(curSupports.length<2){
      const opts=play.map((x,i)=>({x,i})).filter(o=>playable(o.i));
      body.innerHTML=`<div class="stub"><b>${st.label}</b> has only ${st.sents.length} sentence${st.sents.length===1?'':'s'} \u2014 too few to re-order.<br><br>Order the flow in a longer section:</div>
        <div class="jump" id="jumpRow">${opts.map(o=>`<button class="jbtn cond" onclick="window._go(${o.i})">${o.x.label.toUpperCase()}</button>`).join('')}</div>`;
      actions.innerHTML='';
      return;
    }
    order=shuffle(curSupports.map((_,k)=>k));
    if(order.every((v,k)=>v===k)) order.reverse();
    body.innerHTML=`<div class="hint">${MOVE_HINT}</div>
      <div class="os-claim"><span class="tag cond">CLAIM</span><div class="text">${curClaim}</div></div>
      <div class="os-supports" id="osSupports"></div>`;
    paintSupports();
    actions.innerHTML=`<button class="ghost" onclick="window._shuffle()">SHUFFLE</button>
      <button class="primary" id="osCheck" onclick="window._check()">CONFIRM THE ORDER</button>`;
  }
  function paintSupports(){
    const box=document.getElementById('osSupports'); box.innerHTML='';
    order.forEach(origIdx=>{
      const el=document.createElement('div');
      el.className='os-item'; el.draggable=!TOUCH;
      el.textContent=curSupports[origIdx];
      wire(el); box.appendChild(el);
    });
  }
  let dragEl=null,pick=null;
  function wire(el){
    el.addEventListener('dragstart',()=>{dragEl=el;el.classList.add('dragging');});
    el.addEventListener('dragend',()=>{el.classList.remove('dragging');commit();});
    el.addEventListener('dragover',e=>{e.preventDefault();
      const box=document.getElementById('osSupports');const after=afterEl(box,e.clientY);
      if(dragEl&&dragEl!==el){after==null?box.appendChild(dragEl):box.insertBefore(dragEl,after);}});
    el.addEventListener('click',()=>{
      if(el.classList.contains('locked'))return;
      if(!pick){pick=el;el.classList.add('picked');}
      else{if(pick!==el){const box=document.getElementById('osSupports');
        const pi=[...box.children].indexOf(pick),ei=[...box.children].indexOf(el);
        pi<ei?box.insertBefore(el,pick):box.insertBefore(pick,el);}
        pick.classList.remove('picked');pick=null;commit();}});
  }
  function afterEl(box,y){return[...box.querySelectorAll('.os-item:not(.dragging)')].reduce((c,ch)=>{
    const b=ch.getBoundingClientRect();const o=y-b.top-b.height/2;
    return(o<0&&o>c.offset)?{offset:o,element:ch}:c;},{offset:-Infinity,element:null}).element;}
  function commit(){order=[...document.querySelectorAll('#osSupports .os-item')]
    .map(el=>curSupports.indexOf(el.textContent));}
  function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}

  window._shuffle=()=>load(si);
  window._check=()=>{
    commit();
    const els=[...document.querySelectorAll('#osSupports .os-item')];
    if(order.every((v,k)=>v===k)){
      els.forEach(el=>el.classList.add('locked'));
      solved.add(si+':order'); win();
    }else{
      els.forEach((el,k)=>el.classList.toggle('locked',order[k]===k));
      const n=order.filter((v,k)=>v===k).length;
      const btn=document.getElementById('osCheck');
      btn.textContent=n>0?n+' IN PLACE \u2014 KEEP GOING':'TRY AGAIN';
      setTimeout(()=>{if(btn)btn.textContent='CONFIRM THE ORDER';},1500);
    }
  };
  function win(){
    const whole=[curClaim,...curSupports].map(lightFrames).join(' ');
    document.getElementById('cardBody').innerHTML=
      `<div class="os-win">\u2713 THAT FLOWS</div><div class="os-whole">${whole}</div>`;
    document.getElementById('cardActions').innerHTML=
      `<button class="ghost" onclick="window._shuffle()">AGAIN</button>
       <button class="primary" onclick="window._next()">NEXT STAGE \u2192</button>`;
    renderStrip();
  }
  window._next=()=>load((si+1)%play.length);
  window._go=(i)=>load(i);
  function lightFrames(s){let o=s;FRAMES.forEach(f=>{
    const re=new RegExp('\\b'+f.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i');
    o=o.replace(re,m=>`<span class="frame">${m}</span>`);});return o;}


  /* ═══ FULL TEXT ═══ */
  let ftFocus=null, ftDone={};
  function ftKey(p,s){ return p+':'+s; }
  function ftMark(){ return ftDone[game]||(ftDone[game]=new Set()); }
  function stageKey(){ return fullText ? ('F'+(ftFocus?ftFocus.key:'map')) : si; }

  function renderFullMap(){
    const body=document.getElementById('cardBody'), actions=document.getElementById('cardActions');
    const done=ftMark();
    const gm=GAMES.find(g=>g.id===game);
    const scope = game==='sequence' ? 'paragraph' : 'sentence';

    body.innerHTML=
      '<div class="hint">Tap any '+scope+' to work on it with <b>'+gm.nm+'</b>. '+
      'Nothing is set — choose wherever you like.</div>'+
      '<div class="ft-text" id="ftText">'+
      stages.map((st,p)=>
        '<p class="ft-p" data-p="'+p+'"><span class="ft-lab">'+st.label+'</span>'+
        st.sents.map((sent,sIdx)=>
          '<span class="ft-s'+(done.has(ftKey(p,sIdx))?' done':'')+'" data-p="'+p+'" data-s="'+sIdx+'">'+
          lightFrames(sent)+'</span>').join(' ')+
        '</p>').join('')+
      '</div>';

    [].slice.call(body.querySelectorAll('.ft-s')).forEach(el=>{
      el.onclick=()=>{
        const p=+el.getAttribute('data-p'), sIdx=+el.getAttribute('data-s');
        if(game==='sequence'){
          if(stages[p].sents.length<2){ toast('That paragraph has only one sentence.'); return; }
          ftFocus={key:'p'+p, p:p, label:stages[p].label, sents:stages[p].sents.slice()};
        } else {
          ftFocus={key:ftKey(p,sIdx), p:p, s:sIdx, label:stages[p].label,
                   sents:[stages[p].sents[sIdx]]};
        }
        load(si);
      };
    });

    const total=stages.reduce((a,st)=>a+st.sents.length,0);
    actions.innerHTML='<span class="ft-count">'+done.size+' of '+total+' done with '+gm.nm.toLowerCase()+'</span>'+
      (done.size?'<button onclick="window._ftClear()">CLEAR MARKS</button>':'');
  }
  window._ftClear=function(){ ftDone[game]=new Set(); load(si); };
  window._ftBack=function(){
    if(ftFocus){
      const d=ftMark();
      if(game==='sequence') stages[ftFocus.p].sents.forEach((_,k)=>d.add(ftKey(ftFocus.p,k)));
      else if(ftFocus.s!=null) d.add(ftKey(ftFocus.p,ftFocus.s));
    }
    ftFocus=null; load(si);
  };

  /* ═══ SEQUENCE ═══ */
  let seqOrder=[], seqSents=[];
  function renderSequence(st){
    seqSents=st.sents.slice();
    const body=document.getElementById('cardBody'), actions=document.getElementById('cardActions');
    if(seqSents.length<2){
      body.innerHTML='<div class="stub">This stage is a single sentence — nothing to sequence.</div>';
      actions.innerHTML=''; return;
    }
    seqOrder=shuffle(seqSents.map((_,k)=>k));
    if(seqOrder.every((v,k)=>v===k)) seqOrder.reverse();
    body.innerHTML='<div class="hint">'+MOVE_HINT+'</div><div class="os-supports" id="seqBox"></div>';
    const box=document.getElementById('seqBox');
    seqOrder.forEach(i=>{
      const el=document.createElement('div'); el.className='os-item'; el.draggable=!TOUCH;
      el.textContent=seqSents[i];
      wireDrag(el,'seqBox',()=>{ seqOrder=readOrder('seqBox',seqSents); });
      box.appendChild(el);
    });
    actions.innerHTML='<button onclick="window._reload()">SHUFFLE</button><button class="primary" id="seqCheck" onclick="window._seqCheck()">CONFIRM THE ORDER</button>';
  }
  window._seqCheck=function(){
    seqOrder=readOrder('seqBox',seqSents);
    const els=[].slice.call(document.querySelectorAll('#seqBox .os-item'));
    if(seqOrder.every((v,k)=>v===k)){
      els.forEach(el=>el.classList.add('locked'));
      solved.add(stageKey()+':sequence');
      showWhole(seqSents,'\u2713 THAT READS WELL');
    } else gentle(els,seqOrder,'seqCheck','CONFIRM THE ORDER');
  };

  /* ═══ STORYBOARD ═══ */
  let sbStage=-1, sbSents=[], sbIdx=0, sbDone=new Set(), sbS={}, sbShowing=false, sbTimer=null;
  const SB_MAX_TRIES=3, SB_MAX_READS=3;
  function sbWords(i){ return (sbSents[i]||'').split(/\s+/).filter(Boolean); }
  function sbKey(w){ return (w||'').toLowerCase().replace(/[^a-z0-9']/g,''); }
  function sbGet(i){
    if(!sbS[i]) sbS[i]={found:new Set(), given:new Set(), typed:{}, tries:0, reads:0};
    return sbS[i];
  }
  function renderStoryboard(st){
    if(sbStage!==stageKey()){ sbStage=stageKey(); sbSents=st.sents.slice(); sbIdx=0; sbDone=new Set(); sbS={}; sbOpen(0); }
    paintStory();
  }
  function sbOpen(i){
    sbIdx=i; sbShowing=false;
    if(sbTimer){clearInterval(sbTimer);sbTimer=null;}
    const S=sbGet(i);
    if(sbDone.has(i)) sbWords(i).forEach((_,k)=>S.found.add(k));
  }
  function sbSettled(i){ const S=sbGet(i); return S.found.size+S.given.size===sbWords(i).length; }
  function sbPartial(i){
    const words=sbWords(i), S=sbGet(i), out=[]; let gap=false;
    words.forEach((w,k)=>{
      if(S.found.has(k)||S.given.has(k)){ out.push('<span class="ps-place">'+w+'</span>'); gap=false; }
      else if(!gap){ out.push('<span class="ps-todo">…</span>'); gap=true; }
    });
    return out.join(' ');
  }
  function paintStory(){
    const body=document.getElementById('cardBody'), actions=document.getElementById('cardActions');
    const S=sbGet(sbIdx), words=sbWords(sbIdx), saved=sbDone.has(sbIdx);
    const complete=sbDone.size===sbSents.length;
    const out=S.tries>=SB_MAX_TRIES;

    const box=sbSents.map((s,i)=>{
      if(sbDone.has(i))
        return '<span class="ps-done" data-edit="'+i+'" title="Tap to do it again">'+lightFrames(s)+'</span>';
      if(i===sbIdx){
        if(sbShowing) return '<span class="sb-flashing">'+lightFrames(s)+'</span>';
        return sbWords(i).map((w,k)=>{
          if(S.found.has(k)) return '<span class="ps-place">'+w+'</span>';
          if(S.given.has(k)) return '<span class="sb-given" title="shown after three attempts">'+w+'</span>';
          const val=(S.typed[k]||'').replace(/"/g,'&quot;');
          return '<input class="sb-blank" data-k="'+k+'" value="'+val+'" '+
                 'style="width:'+Math.max(2.6,Math.min(sbKey(w).length*0.62,9))+'em" '+
                 'autocomplete="off" spellcheck="false">';
        }).join(' ');
      }
      const P=sbS[i];
      if(sbShowing) return '';
      return (P && (P.found.size||P.given.size)) ? sbPartial(i) : '<span class="ps-todo">…</span>';
    }).filter(Boolean).join(' ');

    const tally=(!saved && S.reads>0)
      ? '<span class="sb-tally">'+S.found.size+' / '+words.length+' correct'+
        (S.tries?' · attempt '+Math.min(S.tries+1,SB_MAX_TRIES)+' of '+SB_MAX_TRIES:'')+'</span>' : '';

    body.innerHTML =
      '<div class="pz-built">'+box+(sbShowing?'<div class="sb-count" id="sbCount"></div>':'')+'</div>' +
      '<div class="hint">'+(complete ? 'The paragraph is complete. Tap any sentence to do it again.'
        : sbShowing ? 'Read it — it disappears in a moment.'
        : saved ? 'Sentence '+(sbIdx+1)+' is saved. Tap a dot for the next one.'
        : S.reads===0 ? 'Sentence '+(sbIdx+1)+' of '+sbSents.length+' — tap SHOW ME, then fill every blank.'
        : out ? 'Three attempts used — the missing words are shown.'
        : 'Type a word in each blank, then check. Red means try again.')+tally+'</div>' +
      '<div class="pz-dots" id="pzDots"></div>';

    [].slice.call(body.querySelectorAll('.ps-done')).forEach(el=>{
      el.onclick=()=>{ const i=+el.getAttribute('data-edit'); sbDone.delete(i); sbS[i]=null; sbOpen(i); paintStory(); };
    });
    [].slice.call(body.querySelectorAll('.sb-blank')).forEach(inp=>{
      const k=+inp.getAttribute('data-k');
      if(S.wrongSet && S.wrongSet.has(k)) inp.classList.add('wrong');
      inp.oninput=()=>{ S.typed[k]=inp.value; inp.classList.remove('wrong'); };
      inp.onkeydown=(e)=>{
        if(e.key==='Enter'){ e.preventDefault();
          const all=[].slice.call(document.querySelectorAll('.sb-blank'));
          const j=all.indexOf(inp); if(j>-1&&all[j+1]) all[j+1].focus(); else window._sbCheck(); }
      };
    });
    const first=body.querySelector('.sb-blank'); if(first&&!sbShowing&&S.reads>0) first.focus();

    const dots=document.getElementById('pzDots');
    sbSents.forEach((_,i)=>{
      const d=document.createElement('button');
      const P=sbS[i], part=P&&(P.found.size||P.given.size)&&!sbDone.has(i);
      d.className='pz-dot'+(i===sbIdx?' on':'')+(sbDone.has(i)?' done':(part?' part':''));
      d.textContent=String(i+1);
      d.onclick=()=>{ sbOpen(i); paintStory(); };
      dots.appendChild(d);
    });

    const nextUndone=sbSents.findIndex((_,i)=>!sbDone.has(i) && i!==sbIdx);
    actions.innerHTML = sbShowing ? ''
      : (saved
          ? '<button onclick="window._sbAgain()">DO IT AGAIN</button>'+
            (nextUndone>-1?'<button class="primary" onclick="window._sbGo('+nextUndone+')">NEXT SENTENCE →</button>':'')
          : (S.reads<SB_MAX_READS
              ? '<button onclick="window._sbRead()">'+(S.reads?'SHOW ME AGAIN ('+(SB_MAX_READS-S.reads)+' left)':'SHOW ME')+'</button>'
              : '<button disabled>NO READS LEFT</button>')+
            (S.reads&&!sbSettled(sbIdx)&&!out ? '<button class="primary" onclick="window._sbCheck()">CHECK</button>' : '')+
            (sbSettled(sbIdx)||out ? '<button class="primary" onclick="window._sbConfirm()">CONFIRM SENTENCE</button>' : ''))
      + (complete ? '<button class="primary" onclick="window._sbFinish()">SEE IT WHOLE →</button>' : '');
  }
  const SB_CHEER=['Good recall.','Nice one.','That is coming back to you.','Steady.','Well remembered.'];
  const SB_NUDGE=['Close — look again.','Nearly. One more go.','Almost there.'];
  window._sbCheck=function(){
    const S=sbGet(sbIdx), words=sbWords(sbIdx);
    S.wrongSet=new Set();
    words.forEach((w,k)=>{
      if(S.found.has(k)||S.given.has(k)) return;
      const typed=(S.typed[k]||'').trim();
      if(!typed) return;
      if(sbKey(typed)===sbKey(w)) S.found.add(k); else S.wrongSet.add(k);
    });
    S.tries++;
    const before=S.lastFound||0, gained=S.found.size-before; S.lastFound=S.found.size;
    if(S.tries>=SB_MAX_TRIES){ words.forEach((_,k)=>{ if(!S.found.has(k)) S.given.add(k); }); S.wrongSet=new Set(); }
    paintStory();
    if(S.found.size===words.length) toast('That sentence is yours.');
    else if(gained>=3) toast(SB_CHEER[Math.floor(Math.random()*SB_CHEER.length)]);
    else if(S.wrongSet && S.wrongSet.size) toast(SB_NUDGE[Math.floor(Math.random()*SB_NUDGE.length)]);
  };
  window._sbRead=function(){
    const S=sbGet(sbIdx), words=sbWords(sbIdx);
    if(S.reads>=SB_MAX_READS) return;
    let secs=Math.max(4,Math.round(words.length*0.7));
    sbShowing=true; S.reads++; paintStory();
    const tick=()=>{
      const c=document.getElementById('sbCount'); if(c) c.textContent=secs;
      if(secs<=0){ clearInterval(sbTimer); sbTimer=null; sbShowing=false; paintStory(); return; }
      secs--;
    };
    tick(); sbTimer=setInterval(tick,1000);
  };
  window._sbConfirm=function(){
    sbDone.add(sbIdx); solved.add(stageKey()+':story');
    const left=sbSents.length-sbDone.size;
    if(left>0) toast(left===1?'One sentence to go.':'Sentence '+sbDone.size+' of '+sbSents.length+' done.');
    const next=sbSents.findIndex((_,i)=>!sbDone.has(i));
    if(next>-1) sbOpen(next);
    paintStory();
  };
  window._sbGo=function(i){ sbOpen(i); paintStory(); };
  window._sbAgain=function(){ sbDone.delete(sbIdx); sbS[sbIdx]=null; sbOpen(sbIdx); paintStory(); };
  window._sbFinish=function(){
    let given=0, total=0;
    sbSents.forEach((_,i)=>{ const S=sbGet(i); total+=sbWords(i).length; given+=S.given.size; });
    const pct=total?Math.round(((total-given)/total)*100):0;
    if(pct===100) sbPrize();
    else showWhole(sbSents,'✓ THE PARAGRAPH IS COMPLETE  ·  '+pct+'% FROM MEMORY');
  };
  function sbPrize(){
    document.getElementById('cardBody').innerHTML=
      '<div class="prize"><div class="prize-badge">100%</div>'+
      '<div class="prize-title">PERFECT RECALL</div>'+
      '<div class="prize-sub">Every word from memory — nothing shown to you.</div>'+
      '<div class="os-whole" style="margin-top:.7rem">'+sbSents.map(lightFrames).join(' ')+'</div></div>';
    document.getElementById('cardActions').innerHTML=
      '<button onclick="window._reload()">AGAIN</button>'+
      '<button class="primary" onclick="window._next()">NEXT STAGE →</button>';
    burst();
  }

  /* ═══ PUZZLE ═══ */
  let pzStage=-1, pzSents=[], pzIdx=0, pzDone=new Set(), pzPlaced=[], pzPool=[];
  function renderPuzzle(st){
    if(pzStage!==stageKey()){ pzStage=stageKey(); pzSents=st.sents.slice(); pzIdx=0; pzDone=new Set(); openSentence(0); }
    paintPuzzle();
  }
  const PZ_BREAK=/(?<=,)\s+|\s+(?=(?:and|but|so|because|which|that|when|if|although|while|as|in|on|at|through|among|during|with|for|by|from|before|after|since)\b)/i;
  function unitsOf(sent){
    const words=(sent||'').split(/\s+/).filter(Boolean);
    if(words.length<=14) return words;
    let parts=(sent||'').split(PZ_BREAK).filter(Boolean);
    const merged=[];
    parts.forEach(p=>{
      if(merged.length && p.split(/\s+/).length===1 && !/,$/.test(merged[merged.length-1]))
        merged[merged.length-1]+=' '+p;
      else merged.push(p);
    });
    return merged.length>=3 ? merged : words;
  }
  function openSentence(i){
    pzIdx=i;
    const u=unitsOf(pzSents[i]);
    if(pzDone.has(i)){ pzPlaced=u.slice(); pzPool=[]; }
    else{ pzPlaced=[]; pzPool=shuffle(u.slice()); }
  }
  function paintPuzzle(){
    const body=document.getElementById('cardBody'), actions=document.getElementById('cardActions');
    const words=unitsOf(pzSents[pzIdx]);
    const saved=pzDone.has(pzIdx), complete=pzDone.size===pzSents.length;
    const ready=!saved && pzPlaced.length===words.length;

    const box=pzSents.map((s,i)=>{
      if(pzDone.has(i))
        return '<span class="ps-done" data-edit="'+i+'" title="Tap to edit">'+lightFrames(s)+'</span>';
      if(i===pzIdx){
        const placed=pzPlaced.map((w,k)=>'<span class="ps-place" data-i="'+k+'" title="Tap to take it back">'+w+'</span>').join(' ');
        const left=words.length-pzPlaced.length;
        return placed + (left>0 ? (placed?' ':'')+'<span class="ps-gap">'+'▁▁▁ '.repeat(Math.min(left,6)).trim()+'</span>' : '');
      }
      return '<span class="ps-todo">…</span>';
    }).filter(Boolean).join(' ');

    body.innerHTML =
      '<div class="pz-built">'+box+'</div>' +
      '<div class="hint">'+(complete
        ? 'The paragraph is complete. Tap any sentence to edit it.'
        : saved
          ? 'Sentence '+(pzIdx+1)+' is saved. Tap a dot for the next one.'
          : 'Sentence '+(pzIdx+1)+' of '+pzSents.length+' — tap the words in order, then confirm.')+'</div>' +
      (saved ? '' : '<div class="pz-pool" id="pzPool"></div>') +
      '<div class="pz-dots" id="pzDots"></div>';

    [].slice.call(body.querySelectorAll('.ps-done')).forEach(el=>{
      el.onclick=()=>{ const i=+el.getAttribute('data-edit'); pzDone.delete(i); openSentence(i); paintPuzzle(); };
    });
    [].slice.call(body.querySelectorAll('.ps-place')).forEach(el=>{
      el.onclick=()=>{ const i=+el.getAttribute('data-i'); pzPool.push(pzPlaced[i]); pzPlaced.splice(i,1); paintPuzzle(); };
    });

    const pool=document.getElementById('pzPool');
    if(pool){
      pool.innerHTML=pzPool.map((w,i)=>'<span class="pz-w" data-p="'+i+'">'+w+'</span>').join('');
      [].slice.call(pool.querySelectorAll('.pz-w')).forEach(el=>{
        el.onclick=()=>{ const i=+el.getAttribute('data-p'); pzPlaced.push(pzPool[i]); pzPool.splice(i,1); paintPuzzle(); };
      });
    }

    const dots=document.getElementById('pzDots');
    pzSents.forEach((_,i)=>{
      const d=document.createElement('button');
      d.className='pz-dot'+(i===pzIdx?' on':'')+(pzDone.has(i)?' done':'');
      d.textContent=String(i+1);
      d.onclick=()=>{ openSentence(i); paintPuzzle(); };
      dots.appendChild(d);
    });

    const nextUndone=pzSents.findIndex((_,i)=>!pzDone.has(i) && i!==pzIdx);
    actions.innerHTML =
      (saved ? '<button onclick="window._pzEdit()">EDIT THIS SENTENCE</button>'
             : '<button onclick="window._pzReset()">RESET</button>') +
      (saved && nextUndone>-1 ? '<button class="primary" onclick="window._pzGo('+nextUndone+')">NEXT SENTENCE →</button>' : '') +
      (!saved ? '<button class="primary" id="pzConfirm" '+(ready?'':'disabled')+' onclick="window._pzConfirm()">CONFIRM SENTENCE</button>' : '') +
      (complete ? '<button class="primary" onclick="window._pzFinish()">SEE IT WHOLE →</button>' : '');
  }

  window._pzConfirm=function(){
    const words=unitsOf(pzSents[pzIdx]);
    if(pzPlaced.join(' ')===words.join(' ')){
      pzDone.add(pzIdx); solved.add(stageKey()+':puzzle');
      const next=pzSents.findIndex((_,i)=>!pzDone.has(i));
      if(next>-1) openSentence(next);
      paintPuzzle();
    } else {
      const l=document.getElementById('pzLine');
      if(l&&!l.querySelector('.pz-nudge'))
        l.insertAdjacentHTML('beforeend','<div class="pz-nudge">All the words are there — try another arrangement.</div>');
    }
  };
  window._pzGo=function(i){ openSentence(i); paintPuzzle(); };
  window._pzEdit=function(){ pzDone.delete(pzIdx); openSentence(pzIdx); paintPuzzle(); };
  window._pzReset=function(){ openSentence(pzIdx); paintPuzzle(); };
  window._pzFinish=function(){ showWhole(pzSents,'✓ THE PARAGRAPH IS COMPLETE'); };

  /* ═══ BUILDER ═══ */
  const BD_MOVES=[
    {k:'reason',  label:'REASON',   hint:'why it is so'},
    {k:'example', label:'EXAMPLE',  hint:'show it happening'},
    {k:'result',  label:'RESULT',   hint:'what follows'},
    {k:'compare', label:'COMPARE',  hint:'set beside something'},
    {k:'contrast',label:'CONTRAST', hint:'the other side'}
  ];
  let bdData=null, bdTopic=0, bdPick={}, bdOpen='', bdShown=false;

  function renderBuilder(){
    const body=document.getElementById('cardBody'), actions=document.getElementById('cardActions');
    if(!bdData){
      body.innerHTML='<div class="stub">Loading topics…</div>'; actions.innerHTML='';
      fetch('/skills/writing/games/data/master-data.json').then(r=>r.json()).then(d=>{
        bdData=d; bdTopic=Math.floor(Math.random()*(d.topics||[]).length);
        bdNewTopic(false); paintBuilder();
      }).catch(()=>{ body.innerHTML='<div class="stub">Could not load the builder topics.</div>'; });
      return;
    }
    paintBuilder();
  }
  function bdNewTopic(advance){
    if(advance){ let n=bdTopic; while(n===bdTopic&&bdData.topics.length>1) n=Math.floor(Math.random()*bdData.topics.length); bdTopic=n; }
    bdPick={}; bdShown=false;
    const pool=[];
    Object.values(bdData.openers||{}).forEach(a=>pool.push(...a));
    bdOpen=pool.length?pool[Math.floor(Math.random()*pool.length)]:'';
  }
  function bdLight(t){
    let out=t;
    (bdData.linking_words||[]).forEach(w=>{
      const re=new RegExp('\\b('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')\\b','gi');
      out=out.replace(re,'<span class="frame">$1</span>');
    });
    return out;
  }
  function bdIntro(){
    const t=bdData.topics[bdTopic];
    let base=t.base||'';
    if(/that\s*$/i.test(bdOpen)) base=base.charAt(0).toLowerCase()+base.slice(1);
    return '<span class="bd-open">'+bdOpen+'</span> <span class="bd-base">'+base+'</span>';
  }
  function paintBuilder(){
    const body=document.getElementById('cardBody'), actions=document.getElementById('cardActions');
    const t=bdData.topics[bdTopic];
    const chosen=BD_MOVES.filter(m=>bdPick[m.k]!=null);

    if(bdShown){
      const para=[bdIntro().replace(/<[^>]+>/g,'')]
        .concat(chosen.map(m=>t[m.k][bdPick[m.k]]));
      body.innerHTML='<div class="os-win">✓ YOUR PARAGRAPH</div>'+
        '<div class="os-whole">'+para.map(bdLight).join(' ')+'</div>'+
        '<div class="hint">'+chosen.length+' move'+(chosen.length===1?'':'s')+' used: '+
        chosen.map(m=>m.label.toLowerCase()).join(' · ')+'</div>';
      actions.innerHTML='<button onclick="window._bdBack()">KEEP BUILDING</button>'+
        '<button class="primary" onclick="window._bdNew()">NEW TOPIC →</button>';
      return;
    }

    body.innerHTML=
      '<div class="bd-topic">'+t.title+'</div>'+
      '<div class="pz-built bd-intro">'+bdIntro()+'</div>'+
      '<div class="hint">Pick a sentence for any move you want. None of them is compulsory.</div>'+
      '<div class="bd-moves" id="bdMoves"></div>';

    const wrap=document.getElementById('bdMoves');
    BD_MOVES.forEach(m=>{
      const opts=t[m.k]||[];
      const row=document.createElement('div');
      row.className='bd-row'+(bdPick[m.k]!=null?' filled':'');
      const picked=bdPick[m.k]!=null?bdLight(opts[bdPick[m.k]]):'';
      row.innerHTML=
        '<button class="bd-move'+(bdPick[m.k]!=null?' on':'')+'" data-m="'+m.k+'">'+m.label+'</button>'+
        '<div class="bd-line">'+(picked||'<span class="bd-hintline">'+m.hint+'</span>')+'</div>';
      wrap.appendChild(row);
    });
    [].slice.call(wrap.querySelectorAll('.bd-move')).forEach(b=>{
      b.onclick=()=>window._bdPickMove(b.getAttribute('data-m'));
    });
    [].slice.call(wrap.querySelectorAll('.bd-line')).forEach((el,idx)=>{
      el.onclick=()=>window._bdPickMove(BD_MOVES[idx].k);
    });

    actions.innerHTML=
      '<button onclick="window._bdNew()">NEW TOPIC</button>'+
      '<button class="primary" '+(chosen.length?'':'disabled')+' onclick="window._bdShow()">SEE MY PARAGRAPH →</button>';
  }

  /* ── the choice card: now built as rd-card-kick / rd-card-hint / rd-opt,
     the same markup Reading uses for its sentence picker. ── */
  window._bdPickMove=function(k){
    const m=BD_MOVES.find(x=>x.k===k), t=bdData.topics[bdTopic], opts=t[k]||[];
    document.getElementById('bdmMove').textContent=m.label;
    document.getElementById('bdmHint').textContent=m.hint;
    const box=document.getElementById('bdmOpts'); box.innerHTML='';
    opts.forEach((o,i)=>{
      const b=document.createElement('button');
      b.className='rd-opt'+(bdPick[k]===i?' chosen':'');
      b.innerHTML='<span class="let">'+(i+1)+'</span><span>'+bdLight(o)+'</span>';
      b.onclick=()=>{ bdPick[k]=i; window._bdClose(); paintBuilder(); toast('Added — '+m.hint+'.'); };
      box.appendChild(b);
    });
    if(bdPick[k]!=null){
      const clr=document.createElement('button');
      clr.className='rd-opt clear'; clr.textContent='Remove this move';
      clr.onclick=()=>{ delete bdPick[k]; window._bdClose(); paintBuilder(); };
      box.appendChild(clr);
    }
    const mod=document.getElementById('bdModal');
    mod.classList.add('on'); mod.setAttribute('aria-hidden','false');
  };
  window._bdClose=function(){
    const mod=document.getElementById('bdModal');
    mod.classList.remove('on'); mod.setAttribute('aria-hidden','true');
  };
  document.getElementById('bdmClose').onclick=window._bdClose;
  window._bdNew=function(){ bdNewTopic(true); paintBuilder(); };
  window._bdShow=function(){ bdShown=true; paintBuilder(); burst(); };
  window._bdBack=function(){ bdShown=false; paintBuilder(); };
  window._bdReset=function(){ bdNewTopic(false); paintBuilder(); };

  /* ── shared helpers ── */
  function readOrder(boxId, source){
    return [].slice.call(document.querySelectorAll('#'+boxId+' .os-item')).map(el=>source.indexOf(el.textContent));
  }
  function gentle(els,ord,btnId,label){
    els.forEach((el,k)=>el.classList.toggle('locked',ord[k]===k));
    const n=ord.filter((v,k)=>v===k).length, btn=document.getElementById(btnId);
    if(btn){ btn.textContent = n>0 ? n+' IN PLACE — KEEP GOING' : 'TRY AGAIN';
      setTimeout(()=>{ if(btn) btn.textContent=label; },1500); }
  }
  function showWhole(sents,msg){
    document.getElementById('cardBody').innerHTML=
      '<div class="os-win">'+msg+'</div><div class="os-whole">'+sents.map(lightFrames).join(' ')+'</div>';
    document.getElementById('cardActions').innerHTML=
      '<button onclick="window._reload()">AGAIN</button><button class="primary" onclick="window._next()">NEXT STAGE →</button>';
    renderStrip();
  }
  let toastT=null;
  function toast(msg){
    let el=document.getElementById('toast');
    if(!el){ el=document.createElement('div'); el.id='toast'; document.body.appendChild(el); }
    el.textContent=msg; el.classList.add('on');
    clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('on'),1900);
  }
  function burst(){
    const host=document.querySelector('.card'); if(!host) return;
    for(let i=0;i<18;i++){
      const b=document.createElement('i'); b.className='spark';
      b.style.left=(15+Math.random()*70)+'%';
      b.style.animationDelay=(Math.random()*0.35)+'s';
      b.style.setProperty('--dx',(Math.random()*80-40)+'px');
      host.appendChild(b); setTimeout(()=>b.remove(),1600);
    }
  }
  window._reload=function(){ load(si); };
  window._mode=function(on){
    if(on===fullText) return;
    fullText=on; solved=new Set(); pzStage=-1; sbStage=-1; ftFocus=null; si=0;
    document.getElementById('mbStages').classList.toggle('active',!on);
    document.getElementById('mbFull').classList.toggle('active',on);
    rebuildPlay(); renderStrip(); load(firstPlayable());
  };
  function wireDrag(el,boxId,after){
    el.addEventListener('dragstart',()=>{ dragEl=el; el.classList.add('dragging'); });
    el.addEventListener('dragend',()=>{ el.classList.remove('dragging'); if(after) after(); });
    el.addEventListener('dragover',e=>{ e.preventDefault();
      const box=document.getElementById(boxId); const a=afterEl(box,e.clientY);
      if(dragEl&&dragEl!==el){ a==null ? box.appendChild(dragEl) : box.insertBefore(dragEl,a); } });
    el.addEventListener('click',()=>{
      if(el.classList.contains('locked')) return;
      if(!pick){ pick=el; el.classList.add('picked'); }
      else{
        if(pick!==el){ const box=document.getElementById(boxId);
          const pi=[].slice.call(box.children).indexOf(pick), ei=[].slice.call(box.children).indexOf(el);
          pi<ei ? box.insertBefore(el,pick) : box.insertBefore(pick,el); }
        pick.classList.remove('picked'); pick=null; if(after) after();
      }});
  }

  /* ═══ boot ═══ */
  const params=new URLSearchParams(location.search);
  const urlType=params.get('type');
  chooseType((urlType && DATA[urlType]) ? urlType : 'essays');

  document.addEventListener('keydown',e=>{ if(e.key==='Escape') window._bdClose&&window._bdClose(); });
  document.addEventListener('click',e=>{ if(e.target && e.target.id==='bdModal') window._bdClose(); });
})();
</script>
</body>
