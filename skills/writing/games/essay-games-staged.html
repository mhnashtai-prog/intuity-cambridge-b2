<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTUITY — Structure Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ═══════════════════════════════════════════════════════════════════
     TOKENS — the same set intuity-shell.css / uoe.css / reading.css use.
     One family (Geist + Geist Mono), squared surfaces, one accent
     (caramel), no shadow beyond a single hairline, no gradient anywhere.
     ═══════════════════════════════════════════════════════════════════ */
  :root{
    --r-sheet:0;      /* cards, modals — paper is cut straight */
    --r-field:3px;    /* a slot: something a word/tile goes into */
    --r-chip:4px;     /* a button or tab */

    --f-display:'Geist','Inter',system-ui,sans-serif;
    --f-body:'Geist','Inter',system-ui,sans-serif;
    --f-mono:'Geist Mono',ui-monospace,monospace;

    --screen:#F3F1ED;
    --card:#FAF8F5;
    --tile-bg:#E8E1D6;
    --tile-bg-press:#DAD1C2;
    --tile-ink:#1C1A18;
    --slot-bg:#DED7CA;
    --tile-ok-bg:#D2E3D6;  --tile-ok-ink:#1F4230;
    --tile-no-bg:#F3D9D2;  --tile-no-ink:#6E2416;

    --ink:#232C31;
    --dim:#5C5852;
    --faint:#756B6E;
    --rule:#BCB1A0;

    --caramel:#B0865C;      /* the one accent in the whole product */
    --poster-ink:#14110E;
    --poster-body:#5C5852;
    --poster-faint:rgba(20,17,14,.50);
    --poster-fill:rgba(20,17,14,.09);
    --poster-fill-hi:rgba(20,17,14,.15);
    --poster-rule:rgba(20,17,14,.20);

    --ok:#3A6B50;
    --wrong:#A23B2C;
  }

  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    overflow:hidden;min-height:100vh;background:var(--screen);color:var(--ink);
    font-family:var(--f-body);-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;align-items:center;
    padding:calc(16px + env(safe-area-inset-top)) 16px 20px;
  }
  button,a{font:inherit;color:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--caramel);outline-offset:2px}
  .cond{font-family:var(--f-mono)}
  main{flex:1;min-height:0;width:100%;max-width:520px;display:flex;flex-direction:column;align-items:center}

  /* ── TOP BAR — flat, mono, no colour beyond the one accent on the active item ── */
  #top{width:100%;display:flex;align-items:center;justify-content:space-between;margin-bottom:.6rem;gap:.5rem;flex-wrap:wrap}
  #top a,#top button.linklike{color:var(--faint);text-decoration:none;font-size:.68rem;
    letter-spacing:.1em;background:none;border:none;cursor:pointer;font-family:var(--f-mono)}
  #top a:hover,#top button.linklike:hover{color:var(--poster-ink)}
  #top .brand{color:var(--poster-ink);font-size:.66rem;letter-spacing:.24em;font-weight:700;flex:none}

  #typeStrip{display:flex;gap:.3rem;order:3;width:100%;justify-content:center}
  .tpip{background:none;border:none;border-radius:var(--r-chip);
    padding:.32rem .8rem;font-family:var(--f-mono);font-size:.6rem;font-weight:700;
    letter-spacing:.08em;text-transform:uppercase;color:var(--poster-faint);cursor:pointer;
    transition:background .15s,color .15s;white-space:nowrap}
  .tpip:hover{background:var(--poster-fill);color:var(--poster-ink)}
  .tpip.current{background:var(--tile-bg);color:var(--tile-ink);font-weight:800}
  @media(min-width:640px){ #typeStrip{order:0;width:auto;justify-content:flex-start} }

  /* ── STAGE STRIP ── */
  #strip{width:100%;display:flex;gap:.35rem;flex-wrap:wrap;justify-content:center;margin-bottom:.7rem}
  .pip{background:none;border:none;border-radius:var(--r-chip);
    padding:.3rem .7rem;font-family:var(--f-mono);font-size:.58rem;font-weight:700;
    letter-spacing:.1em;text-transform:uppercase;color:var(--poster-faint);cursor:pointer;
    transition:background .15s,color .15s;white-space:nowrap}
  .pip:hover{background:var(--poster-fill);color:var(--poster-ink)}
  .pip.current{background:var(--tile-bg);color:var(--tile-ink);font-weight:800}
  .pip.done{color:var(--caramel);box-shadow:inset 0 0 0 1px rgba(176,134,92,.4)}

  /* ── THE STAGE CARD — flat paper, square corners, one hairline shadow ── */
  #shell{flex:1;min-height:0;width:100%;display:none;flex-direction:column;align-items:center}
  #shell.on{display:flex}
  .card{position:relative;width:min(500px,96vw);background:var(--card);border-radius:var(--r-sheet);
    overflow:hidden;display:flex;flex-direction:column;flex:1 1 auto;min-height:0;max-height:100%;
    box-shadow:0 1px 3px rgba(20,17,14,.10);
    animation:cardIn .22s cubic-bezier(.2,.8,.2,1) both}
  @keyframes cardIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .header{position:relative;flex:none;padding:1.2rem 1.4rem 1.1rem;overflow:hidden;
    background:var(--card);border-bottom:1px solid var(--poster-rule)}
  /* the big stage numeral: a quiet watermark, not a coloured hero */
  .ghost-num{position:absolute;right:-.3rem;bottom:-1rem;font-family:var(--f-display);
    font-weight:900;font-size:clamp(5rem,20vw,8rem);line-height:1;color:rgba(20,17,14,.05);
    letter-spacing:-.03em;pointer-events:none}
  .step-label{font-family:var(--f-mono);font-size:.58rem;font-weight:700;letter-spacing:.22em;
    text-transform:uppercase;color:var(--poster-faint);margin-bottom:.35rem;display:block}
  .title{font-family:var(--f-display);font-weight:800;font-size:clamp(1.35rem,5vw,1.85rem);
    letter-spacing:-.01em;text-transform:uppercase;color:var(--poster-ink);line-height:1.05}
  .game-badge{display:inline-block;margin-top:.55rem;height:19px;padding:0 .55rem;line-height:19px;
    border-radius:var(--r-chip);background:var(--poster-fill);font-family:var(--f-mono);
    font-size:.55rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--poster-faint)}

  .body{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:1rem 1.3rem 1.1rem;display:flex;flex-direction:column;gap:.4rem}
  .body::-webkit-scrollbar{width:5px}
  .body::-webkit-scrollbar-thumb{background:var(--poster-rule);border-radius:3px}

  /* ── ORDER THE SUPPORTS ── */
  .os-claim{background:var(--poster-fill);border-radius:var(--r-field);padding:.7rem .85rem}
  .os-claim .tag{font-family:var(--f-mono);font-size:.55rem;letter-spacing:.18em;color:var(--caramel);font-weight:700}
  .os-claim .text{font-family:var(--f-body);font-size:.98rem;line-height:1.4;color:var(--poster-ink);margin-top:.15rem}
  .os-supports{display:flex;flex-direction:column;gap:.4rem}
  .os-item{background:var(--tile-bg);border:none;border-radius:var(--r-chip);
    padding:.62rem .8rem;position:relative;cursor:grab;
    font-family:var(--f-body);font-size:.92rem;line-height:1.4;color:var(--tile-ink);
    transition:background .12s,transform .1s}
  .os-item:hover{background:var(--tile-bg-press)}
  .os-item.dragging{opacity:.5}
  .os-item.picked{box-shadow:inset 0 0 0 2px var(--caramel)}
  .os-item.locked{background:var(--tile-ok-bg);color:var(--tile-ok-ink)}
  .os-whole{font-family:var(--f-body);font-size:.92rem;line-height:1.65;color:var(--poster-body);padding:.15rem}
  .os-whole .frame{color:var(--caramel);font-weight:600}
  .os-win{color:var(--ok);font-family:var(--f-mono);letter-spacing:.14em;font-size:.7rem;
    font-weight:700;text-align:center;padding:.4rem;text-transform:uppercase}

  .jump{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;padding:0 0 .5rem}
  .jbtn{background:var(--tile-bg);color:var(--tile-ink);border:none;border-radius:999px;
    padding:.5rem 1.05rem;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.1em;
    font-weight:700;cursor:pointer;transition:background .15s}
  .jbtn:hover{background:var(--tile-bg-press)}
  .hint{color:var(--poster-faint);font-size:.76rem;text-align:center;padding:.05rem 0 .3rem;line-height:1.35}

  /* ── PUZZLE ── */
  .pz-line{min-height:44px;background:var(--poster-fill);border-radius:var(--r-field);
    padding:.5rem .6rem;display:flex;flex-wrap:wrap;gap:.35rem;align-items:flex-start}
  .pz-empty{color:var(--poster-faint)}
  .pz-pool{display:flex;flex-wrap:wrap;gap:.35rem;padding-top:.5rem}
  .pz-w{background:var(--tile-bg);border:none;border-radius:var(--r-field);padding:.32rem .62rem;
    font-family:var(--f-body);font-size:.9rem;color:var(--tile-ink);cursor:pointer;user-select:none;
    transition:background .12s}
  .pz-w:hover{background:var(--tile-bg-press)}
  .pz-w.placed{background:var(--poster-fill-hi)}
  .pz-nudge{width:100%;color:var(--poster-faint);font-size:.7rem;padding-top:.35rem;font-family:var(--f-body)}

  /* ── BUILDER PASSAGE / SENTENCE ── */
  .bd-sent{font-family:var(--f-body);font-size:.95rem;line-height:1.5;color:var(--poster-ink);
    background:var(--poster-fill);border-radius:var(--r-field);padding:.62rem .75rem}
  .bd-slot{color:var(--caramel);font-weight:700}
  .bd-opts{display:flex;flex-direction:column;gap:.4rem;padding-top:.55rem}
  .bd-opt{background:var(--card);box-shadow:inset 0 0 0 1px var(--poster-rule);border-radius:var(--r-field);
    padding:.55rem .7rem;text-align:left;font-family:var(--f-body);font-size:.9rem;color:var(--poster-ink);
    cursor:pointer;transition:background .12s}
  .bd-opt:hover{background:var(--poster-fill)}
  .bd-opt.right{box-shadow:inset 0 0 0 2px var(--ok);background:var(--tile-ok-bg)}
  .bd-opt.other{opacity:.5}
  .bd-note{color:var(--poster-faint);font-size:.7rem;padding-top:.2rem;line-height:1.35}
  .stub{text-align:center;color:var(--poster-faint);font-family:var(--f-body);font-size:.85rem;
    padding:2rem 1rem;line-height:1.55}
  .stub b{color:var(--poster-ink)}

  /* ── ACTION ROW ── */
  .actions{flex:none;display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;padding:.15rem 1.3rem .9rem}
  .actions button{font-family:var(--f-mono);letter-spacing:.1em;font-size:.68rem;font-weight:700;
    text-transform:uppercase;border-radius:999px;padding:.55rem 1.1rem;cursor:pointer;
    border:none;background:var(--poster-fill);color:var(--poster-ink);transition:background .15s,transform .1s}
  .actions button:hover{background:var(--poster-fill-hi)}
  .actions button:active{transform:scale(.97)}
  .actions .primary{background:var(--caramel);color:var(--card);font-weight:700}
  .actions .primary:hover{filter:brightness(.95)}
  .actions .primary:disabled,.actions button:disabled{opacity:.35;cursor:default}

  /* ── GAME PICKER — mono labels carry it; emoji desaturated, not colour ── */
  #games{flex:none;width:100%;max-width:500px;margin-top:12px;display:grid;
    grid-template-columns:repeat(4,1fr);gap:.5rem}
  .gbtn{background:var(--card);box-shadow:inset 0 0 0 1px var(--poster-rule);border-radius:var(--r-chip);
    padding:.7rem .3rem;text-align:center;cursor:pointer;transition:background .15s,box-shadow .15s}
  .gbtn:hover{background:var(--poster-fill)}
  .gbtn.on{box-shadow:inset 0 0 0 2px var(--caramel);background:rgba(176,134,92,.10)}
  .gbtn .ico{font-size:1.15rem;display:block;margin-bottom:.3rem;
    filter:grayscale(1) contrast(1.05);opacity:.55}
  .gbtn.on .ico{opacity:.85}
  .gbtn .nm{font-family:var(--f-mono);font-size:.6rem;font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;color:var(--poster-faint);line-height:1.15}
  .gbtn.on .nm{color:var(--caramel);font-weight:800}

  #fulltext{flex:none;margin-top:10px;color:var(--poster-faint);font-size:.68rem;letter-spacing:.08em;
    background:var(--poster-fill);border:none;border-radius:999px;padding:.5rem 1.1rem;
    cursor:pointer;font-family:var(--f-mono)}
  #fulltext:hover{color:var(--poster-ink);background:var(--poster-fill-hi)}

  #loading{color:var(--poster-faint);padding:3rem;font-size:.85rem;font-family:var(--f-mono)}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* ── large screens ── */
  @media (min-width:1100px){
    main{max-width:900px}
    .tpip{font-size:.72rem;padding:.4rem 1.05rem}
    .card{width:min(860px,88vw)}
    .header{padding:1.8rem 2.1rem 1.7rem}
    .title{font-size:clamp(2.2rem,3.3vw,3.1rem)}
    .step-label{font-size:.72rem;letter-spacing:.24em}
    .game-badge{font-size:.68rem;height:23px;line-height:23px;padding:0 .75rem}
    .ghost-num{font-size:clamp(8rem,12vw,12rem)}
    .body{padding:1.5rem 2.1rem 1.6rem;gap:.7rem}
    .hint{font-size:15px}
    .os-claim{padding:1rem 1.25rem}
    .os-claim .text{font-size:1.25rem}
    .os-item{font-size:1.15rem;line-height:1.5;padding:.9rem 1.1rem}
    .os-whole{font-size:1.15rem;line-height:1.75}
    .pz-line{min-height:64px;padding:.85rem 1rem;gap:.5rem}
    .pz-w{font-size:1.1rem;padding:.5rem .85rem}
    .bd-sent{font-size:1.15rem;padding:.9rem 1.1rem}
    .bd-opt{font-size:1.1rem;padding:.75rem 1rem}
    .actions{padding:.3rem 2.1rem 1.5rem;gap:.7rem}
    .actions button{font-size:.82rem;padding:.75rem 1.4rem}
    .pip{font-size:.72rem;padding:.42rem 1rem}
    #games{max-width:860px;gap:.7rem}
    .gbtn{padding:1rem .5rem}
    .gbtn .ico{font-size:1.5rem}
    .gbtn .nm{font-size:.7rem}
    #fulltext{font-size:.78rem;padding:.6rem 1.3rem}
    #top .brand{font-size:.85rem}
  }
  @media (min-width:1600px){
    main{max-width:1080px}
    .card{width:min(1040px,82vw)}
    .title{font-size:clamp(2.6rem,3.5vw,3.6rem)}
    .os-item,.bd-opt,.pz-w,.os-whole{font-size:1.25rem}
    .os-claim .text,.bd-sent{font-size:1.3rem}
  }

  /* ── phone ── */
  @media (max-width:560px){
    body{padding:calc(10px + env(safe-area-inset-top)) 10px 18px}
    main{max-width:100%}
    #top{margin-bottom:.5rem}
    #top a,#top .brand,#top button.linklike{font-size:.62rem}
    #strip{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;
      -webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
    #strip::-webkit-scrollbar{display:none}
    .pip{flex:none;padding:.42rem .75rem;font-size:.6rem}
    .header{padding:.95rem 1rem .9rem}
    .title{font-size:clamp(1.25rem,7vw,1.75rem)}
    .ghost-num{font-size:clamp(4rem,20vw,5.5rem);bottom:-.75rem}
    .body{padding:.85rem .9rem .9rem}
    .os-item{font-size:.9rem;padding:.7rem .65rem;min-height:48px;display:flex;align-items:center}
    .pz-w{font-size:.88rem;padding:.5rem .65rem;min-height:40px;display:inline-flex;align-items:center}
    .pz-line{min-height:56px;gap:.4rem}
    .bd-opt{font-size:.9rem;padding:.62rem .65rem;min-height:46px}
    .bd-sent{font-size:.9rem;padding:.62rem .65rem}
    .actions{padding:.15rem 1rem 1rem;gap:.45rem;flex-wrap:wrap}
    .actions button{padding:.65rem 1rem;font-size:.65rem;min-height:44px;flex:1 1 auto}
    #games{grid-template-columns:repeat(2,1fr);gap:.5rem}
    .gbtn{padding:.85rem .4rem;min-height:70px;display:flex;flex-direction:column;
      align-items:center;justify-content:center}
    .gbtn .ico{font-size:1.15rem;margin-bottom:.35rem}
    .gbtn .nm{font-size:.62rem}
    #fulltext{width:100%;padding:.7rem 1rem;min-height:44px}
    .os-whole{font-size:.9rem}
    .tpip{font-size:.56rem;padding:.28rem .65rem}
  }

  /* short screens */
  @media (max-height:840px){
    .header{padding:.85rem 1.3rem .8rem}
    .title{font-size:clamp(1.25rem,3.6vw,1.75rem)}
    .ghost-num{font-size:clamp(4rem,12vw,5.5rem);bottom:-.7rem}
    .step-label{font-size:.54rem;margin-bottom:.2rem}
    .game-badge{margin-top:.35rem;height:17px;line-height:17px}
    .body{padding:.75rem 1.2rem .8rem}
    .actions{padding:.1rem 1.2rem .7rem}
    #games{margin-top:.5rem}
    .gbtn{padding:.5rem .4rem}
    .gbtn .ico{font-size:1rem;margin-bottom:.2rem}
    .gbtn .nm{font-size:.56rem}
    #fulltext{margin-top:.45rem;padding:.4rem .9rem;font-size:.62rem}
    #strip{margin-bottom:.45rem}
  }

  /* ── PUZZLE: paragraph forming sentence by sentence ── */
  .pz-built{font-family:var(--f-body);font-size:.92rem;line-height:1.5;color:var(--poster-ink);
    background:var(--poster-fill);border-radius:var(--r-field);padding:.55rem .7rem;min-height:52px}
  .pz-built .frame{color:var(--caramel);font-weight:600}
  .pz-built .pending{color:var(--poster-faint)}
  .pz-dots{display:flex;gap:.4rem;justify-content:center;align-items:center;padding:.4rem 0 0}
  .pz-dot{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--rule);
    background:var(--card);font-family:var(--f-mono);font-size:.68rem;font-weight:700;
    color:var(--poster-faint);cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:background .15s,box-shadow .15s}
  .pz-dot:hover{box-shadow:inset 0 0 0 1px var(--caramel)}
  .pz-dot.on{background:var(--caramel);box-shadow:none;color:var(--card)}
  .pz-dot.done{box-shadow:none;background:var(--tile-ok-bg);color:var(--tile-ok-ink)}
  .pz-dot.done.on{background:var(--ok);color:var(--card)}
  .pz-dot.part{box-shadow:inset 0 0 0 1.5px var(--caramel);color:var(--caramel)}
  .pz-solved-note{text-align:center;color:var(--poster-faint);font-size:.7rem;padding:.35rem 0 .1rem}

  #modeToggle{display:inline-flex;background:var(--poster-fill);border-radius:999px;padding:2px;gap:2px}
  .mtb{background:none;border:none;border-radius:999px;padding:.35rem .8rem;cursor:pointer;
    font-size:.6rem;letter-spacing:.1em;font-weight:700;color:var(--poster-faint);white-space:nowrap;
    font-family:var(--f-mono)}
  .mtb:hover{color:var(--poster-ink)}
  .mtb.on{background:var(--tile-bg);color:var(--tile-ink)}
  @media (min-width:1100px){ .mtb{font-size:.72rem;padding:.45rem 1rem} }
  @media (max-width:560px){ .mtb{font-size:.55rem;padding:.35rem .55rem;letter-spacing:.08em} }

  .ps-done{cursor:pointer;transition:background .12s;border-radius:2px}
  .ps-done:hover{background:var(--poster-fill)}
  .ps-now{color:var(--poster-body);background:var(--poster-fill);border-radius:3px;padding:0 3px}
  .ps-todo{color:var(--poster-rule);letter-spacing:.1em;font-size:.9em}

  #newText{flex:none;background:var(--poster-fill);border:none;border-radius:999px;
    color:var(--poster-faint);font-size:.6rem;letter-spacing:.08em;font-weight:700;
    padding:.4rem .7rem;cursor:pointer;font-family:var(--f-mono)}
  #newText:hover{color:var(--poster-ink);background:var(--poster-fill-hi)}
  @media (min-width:1100px){ #newText{font-size:.72rem;padding:.5rem .9rem} }
  @media (max-width:560px){ #newText{font-size:.55rem;padding:.32rem .5rem} }

  /* ── STORYBOARD ── */
  .sb-flash{font-family:var(--f-body);font-size:.98rem;line-height:1.5;color:var(--poster-ink);
    background:var(--poster-fill);border-radius:var(--r-field);padding:.85rem 1rem;text-align:center}
  .sb-flash .frame{color:var(--caramel);font-weight:600}
  .sb-count{font-family:var(--f-display);font-weight:800;font-size:1.7rem;color:var(--caramel);
    margin-top:.4rem;line-height:1}
  .sb-blanks{font-family:var(--f-body);font-size:.98rem;line-height:1.9;color:var(--poster-ink);
    background:var(--poster-fill);border-radius:var(--r-field);padding:.7rem .8rem;min-height:60px}
  .sb-w{display:inline-block;margin:0 2px}
  .sb-w.got{color:var(--poster-ink)}
  .sb-w.gap{color:transparent;border-bottom:2px solid var(--caramel);cursor:pointer;
    letter-spacing:.06em;user-select:none}
  .sb-w.gap:hover{background:var(--poster-fill-hi)}
  .sb-in{display:flex;gap:.4rem;padding-top:.55rem}
  .sb-in input{flex:1;min-width:0;padding:.55rem .7rem;border:none;box-shadow:inset 0 0 0 1px var(--poster-rule);
    border-radius:var(--r-field);font-family:var(--f-body);font-size:.9rem;color:var(--poster-ink);
    background:var(--card);min-height:42px}
  .sb-in input:focus{outline:none;box-shadow:inset 0 0 0 2px var(--caramel)}
  .sb-in input.miss{box-shadow:inset 0 0 0 2px var(--wrong);background:var(--tile-no-bg)}
  .sb-in button{border:none;background:var(--caramel);color:var(--card);border-radius:var(--r-field);
    padding:0 1rem;font-family:var(--f-mono);letter-spacing:.1em;font-size:.68rem;font-weight:700;
    cursor:pointer;min-height:42px}
  @media (min-width:1100px){ .sb-flash,.sb-blanks{font-size:1.25rem} .sb-count{font-size:2.1rem} }

  .ps-place{background:var(--poster-fill-hi);border-radius:3px;padding:0 3px;cursor:pointer}
  .ps-place:hover{background:rgba(176,134,92,.18)}
  .ps-gap{color:var(--poster-rule);letter-spacing:.08em}

  .sb-blank{display:inline-block;border:none;box-shadow:inset 0 -2px 0 var(--caramel);
    background:var(--poster-fill);border-radius:2px;padding:1px 4px;margin:0 1px;
    font-family:var(--f-body);font-size:inherit;color:var(--poster-ink);text-align:center}
  .sb-blank:focus{outline:none;box-shadow:inset 0 -2px 0 var(--caramel);background:var(--poster-fill-hi)}
  .sb-flashing{background:var(--poster-fill-hi);border-radius:3px;padding:1px 4px}
  .sb-blank.wrong{color:var(--wrong);box-shadow:inset 0 -2px 0 var(--wrong);background:var(--tile-no-bg);font-weight:600}
  .sb-given{color:var(--poster-faint);background:var(--poster-fill);box-shadow:inset 0 -2px 0 var(--poster-rule);
    border-radius:2px;padding:0 3px;font-style:italic}
  .sb-tally{display:block;color:var(--caramel);font-size:.68rem;letter-spacing:.05em;padding-top:.2rem;
    font-family:var(--f-mono);font-weight:700}

  /* ── TOAST ── */
  #toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,10px);z-index:200;
    background:var(--poster-ink);color:var(--card);border-radius:999px;padding:.55rem 1.1rem;
    font-size:.78rem;font-family:var(--f-body);box-shadow:0 10px 26px rgba(20,17,14,.2);
    opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
  #toast.on{opacity:1;transform:translate(-50%,0)}

  /* ── PRIZE ── */
  .prize{text-align:center;padding:.4rem 0 .1rem}
  .prize-badge{font-family:var(--f-display);font-weight:900;font-size:2.6rem;color:var(--caramel);line-height:1}
  .prize-title{font-family:var(--f-mono);font-size:.85rem;font-weight:700;letter-spacing:.22em;
    color:var(--poster-ink);margin-top:.15rem;text-transform:uppercase}
  .prize-sub{color:var(--poster-faint);font-size:.78rem;margin-top:.3rem}

  /* ── celebration marks: flat, monochrome, brief — not confetti ── */
  .card{position:relative;overflow:hidden}
  .spark{position:absolute;top:38%;width:5px;height:5px;border-radius:1px;background:var(--caramel);
    opacity:.7;animation:fly 1s ease-out forwards;pointer-events:none}
  @keyframes fly{0%{opacity:.7;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--dx),-90px)}}
  @media(prefers-reduced-motion:reduce){.spark{display:none}}

  /* ── BUILDER ── */
  .bd-para{line-height:1.7}
  .bd-plain{color:var(--poster-body)}
  .bd-slot{display:inline-block;color:var(--poster-rule);border-bottom:2px solid var(--poster-rule);
    letter-spacing:.06em;padding:0 3px}
  .bd-slot.active{border-bottom-color:var(--caramel);background:var(--poster-fill-hi);color:var(--caramel)}
  .bd-tag{font-family:var(--f-mono);font-size:.58rem;font-weight:700;letter-spacing:.1em;
    color:var(--card);background:var(--caramel);border-radius:2px;padding:1px 4px;margin:0 4px 0 2px;vertical-align:2px}
  .bd-topic{font-family:var(--f-mono);font-size:.66rem;font-weight:700;letter-spacing:.16em;
    color:var(--caramel);text-transform:uppercase}
  .bd-intro{font-family:var(--f-body);font-size:.94rem;line-height:1.5}
  .bd-open{color:var(--caramel);font-weight:600}
  .bd-base{color:var(--poster-ink)}
  .bd-moves{display:flex;flex-direction:column;gap:.4rem}
  .bd-row{display:flex;gap:.6rem;align-items:flex-start}
  .bd-move{flex:0 0 84px;border:none;background:var(--poster-fill);border-radius:var(--r-chip);
    padding:.5rem .35rem;font-family:var(--f-mono);font-size:.62rem;font-weight:700;letter-spacing:.08em;
    color:var(--poster-faint);cursor:pointer;min-height:38px;transition:background .12s,color .12s}
  .bd-move:hover{background:var(--poster-fill-hi);color:var(--poster-ink)}
  .bd-move.on{background:var(--caramel);color:var(--card)}
  .bd-line{flex:1;min-width:0;font-family:var(--f-body);font-size:.88rem;line-height:1.4;
    color:var(--poster-ink);padding-top:.5rem;cursor:pointer}
  .bd-hintline{color:var(--poster-rule);font-style:italic;font-size:.8rem}
  .bd-choices{display:flex;flex-direction:column;gap:.4rem;padding:.1rem 0 .35rem 92px}
  .bd-choice{text-align:left;background:var(--card);box-shadow:inset 0 0 0 1px var(--poster-rule);
    border-radius:var(--r-field);padding:.5rem .7rem;font-family:var(--f-body);font-size:.84rem;
    line-height:1.4;color:var(--poster-ink);cursor:pointer;transition:background .12s}
  .bd-choice:hover{background:var(--poster-fill)}
  .bd-choice.on{box-shadow:inset 0 0 0 2px var(--caramel);background:rgba(176,134,92,.08)}
  .bd-choice.clear{font-family:var(--f-mono);font-size:.68rem;color:var(--poster-faint);box-shadow:none;
    background:var(--poster-fill)}
  @media(max-width:560px){ .bd-choices{padding-left:0} .bd-move{flex-basis:72px;font-size:.56rem} }
  @media(min-width:1100px){ .bd-line,.bd-choice{font-size:1.05rem} .bd-intro{font-size:1.15rem}
    .bd-move{flex-basis:104px;font-size:.7rem} }

  /* ── BUILDER MODAL — a sheet, same family as everywhere else in the product ── */
  #bdModal{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;
    background:rgba(20,17,14,.6);padding:1rem}
  #bdModal.on{display:flex}
  .bdm-card{position:relative;width:min(560px,94vw);max-height:82vh;overflow-y:auto;
    background:var(--card);border-radius:var(--r-sheet);padding:1.35rem 1.2rem 1.1rem;
    box-shadow:0 20px 50px -18px rgba(20,17,14,.38);
    animation:cardIn .18s cubic-bezier(.2,.8,.2,1) both}
  .bdm-x{position:absolute;top:.7rem;right:.7rem;width:28px;height:28px;border-radius:50%;cursor:pointer;
    background:var(--poster-fill);border:none;color:var(--poster-faint);font-size:.72rem}
  .bdm-x:hover{color:var(--poster-ink);background:var(--poster-fill-hi)}
  .bdm-head{margin-bottom:.85rem}
  .bdm-move{font-family:var(--f-mono);font-size:.85rem;font-weight:700;letter-spacing:.2em;
    color:var(--caramel);display:block;text-transform:uppercase}
  .bdm-hint{color:var(--poster-faint);font-size:.76rem;font-style:italic}
  .bdm-opts{display:flex;flex-direction:column;gap:.5rem}
  .bdm-opt{display:flex;gap:.65rem;text-align:left;align-items:flex-start;cursor:pointer;
    background:var(--poster-fill);border:none;border-radius:var(--r-field);padding:.7rem .8rem;
    font-family:var(--f-body);font-size:.92rem;line-height:1.45;color:var(--poster-ink);
    transition:background .12s}
  .bdm-opt:hover{background:var(--poster-fill-hi)}
  .bdm-opt.on{box-shadow:inset 0 0 0 2px var(--caramel);background:rgba(176,134,92,.1)}
  .bdm-opt .frame{color:var(--caramel)}
  .bdm-n{flex:0 0 auto;font-family:var(--f-mono);font-weight:700;color:var(--caramel);font-size:.78rem;padding-top:.1rem}
  .bdm-opt.clear{justify-content:center;font-family:var(--f-mono);font-size:.72rem;
    color:var(--poster-faint);background:none;box-shadow:inset 0 0 0 1px var(--poster-rule)}
  @media(min-width:1100px){ .bdm-opt{font-size:1.05rem} .bdm-card{width:min(680px,90vw);padding:1.6rem 1.4rem} }

  /* ── FULL TEXT MAP ── */
  .ft-text{font-family:var(--f-body);font-size:.92rem;line-height:1.7;color:var(--poster-ink);
    background:var(--poster-fill);border-radius:var(--r-field);padding:.7rem .8rem}
  .ft-p{margin:0 0 .6rem}
  .ft-p:last-child{margin-bottom:0}
  .ft-lab{display:block;font-family:var(--f-mono);font-size:.56rem;font-weight:700;
    letter-spacing:.16em;color:var(--caramel);text-transform:uppercase;margin-bottom:.15rem}
  .ft-s{cursor:pointer;border-radius:2px;padding:0 2px;transition:background .12s}
  .ft-s:hover{background:var(--poster-fill-hi)}
  .ft-s.done{background:var(--tile-ok-bg);box-shadow:inset 0 -2px 0 var(--ok)}
  .ft-s .frame{color:var(--caramel);font-weight:600}
  .ft-count{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.06em;
    color:var(--poster-faint);align-self:center;padding:0 .4rem}
  @media(min-width:1100px){ .ft-text{font-size:1.1rem;line-height:1.75;padding:.9rem 1rem} }
</style>
</head>
<body>
<main>
  <div id="top">
    <span class="brand cond" id="brandTag">INTUITY</span>
    <div id="typeStrip"></div>
    <button id="newText" class="cond" onclick="window._newText()" title="Another model text">&#8635; <span id="textTag">NEW TEXT</span></button>
    <div id="modeToggle">
      <button class="mtb cond on" id="mbStages" onclick="window._mode(false)">STAGES</button>
      <button class="mtb cond" id="mbFull" onclick="window._mode(true)">FULL TEXT</button>
    </div>
  </div>

  <div id="strip"></div>
  <div id="loading" style="display:none">Loading&hellip;</div>
  <div id="shell">
    <div class="card" id="card">
      <div class="header" id="header">
        <div class="ghost-num" id="ghostNum">01</div>
        <span class="step-label" id="stepLabel">STAGE</span>
        <div class="title" id="stageTitle">INTRODUCTION</div>
        <span class="game-badge" id="gameBadge">ORDER THE SUPPORTS</span>
      </div>
      <div class="body" id="cardBody"></div>
      <div class="actions" id="cardActions"></div>
    </div>

    <div id="games"></div>
  </div>
</main>

<div id="bdModal" aria-hidden="true">
  <div class="bdm-card" role="dialog" aria-modal="true">
    <button class="bdm-x" onclick="window._bdClose()" aria-label="Close">&#10005;</button>
    <div class="bdm-head"><span class="bdm-move" id="bdmMove"></span><span class="bdm-hint" id="bdmHint"></span></div>
    <div class="bdm-opts" id="bdmOpts"></div>
  </div>
</div>

<script>
(function(){
  'use strict';
  const TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints>0;
  if(TOUCH) document.body.classList.add('touch');
  const MOVE_HINT = TOUCH ? 'Tap one sentence, then another, to swap them.'
                          : 'Drag the sentences into the order that reads best.';

  /* ═══ WRITING TYPES — now just a header row, not a gate ═══ */
  const TYPES=[
    {id:'essays', label:'ESSAY',  desc:'Claim → support → link',  ico:'01'},
    {id:'reports',label:'REPORT', desc:'Findings, laid out plainly',ico:'02'},
    {id:'reviews',label:'REVIEW', desc:'Verdict, then the reasons', ico:'03'},
    {id:'emails', label:'EMAIL',  desc:'Ask, context, sign-off',    ico:'04'}
  ];
  const DATA={essays:'/skills/writing/games/data/essays-models.json',
    reports:'/skills/writing/games/data/reports-models.json',
    reviews:'/skills/writing/games/data/reviews-models.json',
    emails:'/skills/writing/games/data/emails-models.json'};
  const ACCENTS=['#3d9e95','#e8723a','#7b5ea7','#c94f6d','#c08b2f'];
  const FRAMES=['This is because','For example','As a result','Firstly','Secondly','Furthermore',
    'Moreover','In addition','However','On the other hand','For instance','Because of this',
    'Consequently','Therefore','To begin with','What is more','I firmly believe that','In my view',
    'In conclusion','To sum up','Nowadays','These days'];

  const GAMES=[
    {id:'sequence',ico:'\uD83D\uDCD1', nm:'Sequence'},
    {id:'story',   ico:'\uD83C\uDFAF', nm:'Storyboard'},
    {id:'puzzle',  ico:'\uD83E\uDDE9', nm:'Puzzle'},
    {id:'builder', ico:'\u270D\uFE0F', nm:'Builder'}
  ];

  let type=null, stages=[], play=[], fullText=false, si=0, game='sequence', solved=new Set();

  /* ── type switcher, living in the header itself — no gate, nothing to click through ── */
  function renderTypeStrip(){
    const s=document.getElementById('typeStrip'); s.innerHTML='';
    TYPES.forEach(t=>{
      const b=document.createElement('button');
      b.className='tpip cond'+(t.id===type?' current':'');
      b.textContent=t.label;
      b.onclick=()=>{ if(t.id!==type) chooseType(t.id); };
      s.appendChild(b);
    });
  }
  function chooseType(id){
    type=id;
    renderTypeStrip();
    initType(id);
  }

  function buildStages(){
    const sample=DATASET.samples[sampleIdx];
    stages=sample.paragraphs.map(p=>({
      label:shortLabel(p.label), full:p.label,
      sents:p.text.trim().split(/(?<=[.!?])\s+/).filter(Boolean)
    }));
  }
  window._newText=function(){
    if(!DATASET||DATASET.samples.length<2) return;
    let n=sampleIdx; while(n===sampleIdx) n=Math.floor(Math.random()*DATASET.samples.length);
    sampleIdx=n; solved=new Set(); pzStage=-1; si=0;
    buildStages(); rebuildPlay(); renderStrip(); load(firstPlayable());
    const t=document.getElementById('textTag');
    if(t) t.textContent='TEXT '+(sampleIdx+1)+'/'+DATASET.samples.length;
  };
  function rebuildPlay(){
    play = fullText
      ? [{label:'Full Text', sents: stages.reduce((a,s)=>a.concat(s.sents),[])}]
      : stages;
  }
  let order=[], curSupports=[], curClaim='';

  let DATASET=null, sampleIdx=0;
  function initType(t){
    document.getElementById('loading').style.display='block';
    document.getElementById('loading').textContent='Loading\u2026';
    document.getElementById('strip').style.display='flex';
    fetch(DATA[t]).then(r=>r.json()).then(d=>{
      DATASET=d;
      if(!(d.samples&&d.samples.length)){fail('No content.');return;}
      sampleIdx=Math.floor(Math.random()*d.samples.length);
      buildStages();
      const TYPE_LABEL={essays:'ESSAY',reports:'REPORT',reviews:'REVIEW',emails:'EMAIL',articles:'ARTICLE'};
      document.getElementById('brandTag').textContent=(TYPE_LABEL[t]||'WRITING')+' GAMES';
      document.getElementById('textTag').textContent='TEXT '+(sampleIdx+1)+'/'+d.samples.length;
      document.getElementById('loading').style.display='none';
      document.getElementById('shell').classList.add('on');
      solved=new Set(); pzStage=-1; sbStage=-1; ftFocus=null; si=0; fullText=false;
      document.getElementById('mbStages').classList.add('on');
      document.getElementById('mbFull').classList.remove('on');
      rebuildPlay(); renderStrip(); renderGames(); load(firstPlayable());
    }).catch(()=>fail('Could not load game data.'));
  }

  function fail(m){document.getElementById('loading').style.display='block';document.getElementById('loading').textContent=m;}
  function playable(i){ if(!play[i])return false;
    const n=play[i].sents.length;
    return n>=1; }
  function firstPlayable(){ for(let i=0;i<play.length;i++) if(playable(i)) return i; return 0; }
  function shortLabel(l){
    if(/introduction/i.test(l))return'Introduction';
    if(/conclusion/i.test(l))return'Conclusion';
    const b=l.match(/body paragraph\s*(\d)/i); if(b)return'Body '+b[1];
    const p=l.match(/^(.+?)\s*-\s*paragraph\s*(\d)/i); if(p)return p[1].trim()+' '+p[2];
    return l.split('-')[0].trim();
  }

  function renderStrip(){
    const s=document.getElementById('strip'); s.innerHTML='';
    s.style.display = (fullText||game==='builder') ? 'none' : 'flex';
    play.forEach((st,i)=>{
      const b=document.createElement('button');
      b.className='pip cond'+(i===si?' current':'')+(solved.has(i+':'+game)?' done':'');
      b.textContent=st.label; b.onclick=()=>load(i);
      s.appendChild(b);
    });
  }
  function renderGames(){
    const g=document.getElementById('games'); g.innerHTML='';
    GAMES.forEach(gm=>{
      const b=document.createElement('div');
      b.className='gbtn'+(gm.id===game?' on':'');
      b.innerHTML=`<span class="ico">${gm.ico}</span><span class="nm cond">${gm.nm}</span>`;
      b.onclick=()=>{game=gm.id; ftFocus=null; renderGames(); load(si);};
      g.appendChild(b);
    });
  }

  function load(i){
    si=i;
    const st=play[i];
    const accent=ACCENTS[i%ACCENTS.length];
    document.documentElement.style.setProperty('--accent',accent);
    const card=document.getElementById('card');
    card.style.setProperty('--accent',accent);
    document.getElementById('header').style.background=accent;
    document.getElementById('ghostNum').textContent=String(i+1).padStart(2,'0');
    document.getElementById('stepLabel').textContent=(game==='builder'?'CHOOSE YOUR MOVES':(fullText?'WHOLE ESSAY':'STAGE '+(i+1)+' OF '+play.length));
    document.getElementById('stageTitle').textContent=
      game==='builder' ? 'BUILD A PARAGRAPH'
      : (fullText ? (ftFocus? ftFocus.label.toUpperCase() : 'THE WHOLE TEXT') : st.label.toUpperCase());
    const gm=GAMES.find(g=>g.id===game);
    document.getElementById('gameBadge').textContent=gm.nm.toUpperCase();
    // re-trigger slide anim
    card.classList.remove('card'); void card.offsetWidth; card.classList.add('card');
    renderStrip();
    if(game==='builder')            { renderBuilder(); return; }
    if(fullText && !ftFocus)        { renderFullMap(); return; }
    const target = (fullText && ftFocus) ? ftFocus : st;
    if(game==='sequence')      renderSequence(target);
    else if(game==='story')    renderStoryboard(target);
    else                       renderPuzzle(target);
    if(fullText && ftFocus){
      const a=document.getElementById('cardActions');
      a.insertAdjacentHTML('afterbegin','<button onclick="window._ftBack()">← BACK TO TEXT</button>');
    }
  }

  // ── ORDER THE SUPPORTS in-card ──
  function renderOrder(st){
    curClaim=st.sents[0]||'';
    curSupports=st.sents.slice(1);
    const body=document.getElementById('cardBody');
    const actions=document.getElementById('cardActions');
    if(fullText){
      body.innerHTML='<div class="stub"><b>Order Supports</b> works on one paragraph at a time \u2014 a claim with its support.<br><br>For the whole essay, try <b>Sequence</b> or <b>Puzzle</b>.</div>';
      actions.innerHTML=''; return;
    }
    if(curSupports.length<2){
      const opts=play.map((x,i)=>({x,i})).filter(o=>playable(o.i));
      body.innerHTML=`<div class="stub"><b>${st.label}</b> has only ${st.sents.length} sentence${st.sents.length===1?'':'s'} \u2014 too few to re-order.<br><br>Order the flow in a longer section:</div>
        <div class="jump" id="jumpRow">${opts.map(o=>`<button class="jbtn cond" onclick="window._go(${o.i})">${o.x.label.toUpperCase()}</button>`).join('')}</div>`;
      actions.innerHTML='';
      return;
    }
    order=shuffle(curSupports.map((_,k)=>k));
    if(order.every((v,k)=>v===k)) order.reverse();
    body.innerHTML=`<div class="hint">${MOVE_HINT}</div>
      <div class="os-claim"><span class="tag cond">CLAIM</span><div class="text">${curClaim}</div></div>
      <div class="os-supports" id="osSupports"></div>`;
    paintSupports();
    actions.innerHTML=`<button class="ghost" onclick="window._shuffle()">SHUFFLE</button>
      <button class="primary" id="osCheck" onclick="window._check()">CONFIRM THE ORDER</button>`;
  }
  function paintSupports(){
    const box=document.getElementById('osSupports'); box.innerHTML='';
    order.forEach(origIdx=>{
      const el=document.createElement('div');
      el.className='os-item'; el.draggable=!TOUCH;
      el.textContent=curSupports[origIdx];
      wire(el); box.appendChild(el);
    });
  }
  let dragEl=null,pick=null;
  function wire(el){
    el.addEventListener('dragstart',()=>{dragEl=el;el.classList.add('dragging');});
    el.addEventListener('dragend',()=>{el.classList.remove('dragging');commit();});
    el.addEventListener('dragover',e=>{e.preventDefault();
      const box=document.getElementById('osSupports');const after=afterEl(box,e.clientY);
      if(dragEl&&dragEl!==el){after==null?box.appendChild(dragEl):box.insertBefore(dragEl,after);}});
    el.addEventListener('click',()=>{
      if(el.classList.contains('locked'))return;
      if(!pick){pick=el;el.classList.add('picked');}
      else{if(pick!==el){const box=document.getElementById('osSupports');
        const pi=[...box.children].indexOf(pick),ei=[...box.children].indexOf(el);
        pi<ei?box.insertBefore(el,pick):box.insertBefore(pick,el);}
        pick.classList.remove('picked');pick=null;commit();}});
  }
  function afterEl(box,y){return[...box.querySelectorAll('.os-item:not(.dragging)')].reduce((c,ch)=>{
    const b=ch.getBoundingClientRect();const o=y-b.top-b.height/2;
    return(o<0&&o>c.offset)?{offset:o,element:ch}:c;},{offset:-Infinity,element:null}).element;}
  function commit(){order=[...document.querySelectorAll('#osSupports .os-item')]
    .map(el=>curSupports.indexOf(el.textContent));}
  function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}

  window._shuffle=()=>load(si);
  window._check=()=>{
    commit();
    const els=[...document.querySelectorAll('#osSupports .os-item')];
    if(order.every((v,k)=>v===k)){
      els.forEach(el=>el.classList.add('locked'));
      solved.add(si+':order'); win();
    }else{
      els.forEach((el,k)=>el.classList.toggle('locked',order[k]===k));
      const n=order.filter((v,k)=>v===k).length;
      const btn=document.getElementById('osCheck');
      btn.textContent=n>0?n+' IN PLACE \u2014 KEEP GOING':'TRY AGAIN';
      setTimeout(()=>{if(btn)btn.textContent='CONFIRM THE ORDER';},1500);
    }
  };
  function win(){
    const whole=[curClaim,...curSupports].map(lightFrames).join(' ');
    document.getElementById('cardBody').innerHTML=
      `<div class="os-win">\u2713 THAT FLOWS</div><div class="os-whole">${whole}</div>`;
    document.getElementById('cardActions').innerHTML=
      `<button class="ghost" onclick="window._shuffle()">AGAIN</button>
       <button class="primary" onclick="window._next()">NEXT STAGE \u2192</button>`;
    renderStrip();
  }
  window._next=()=>load((si+1)%play.length);
  window._go=(i)=>load(i);
  function lightFrames(s){let o=s;FRAMES.forEach(f=>{
    const re=new RegExp('\\b'+f.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i');
    o=o.replace(re,m=>`<span class="frame">${m}</span>`);});return o;}


  /* ═══ FULL TEXT — the whole sample, and the student chooses ═══
     Nothing is prescribed. The complete text is on screen; tap any sentence
     and the game you have selected runs on it. Sequence takes the paragraph
     that sentence belongs to. Worked sentences are marked. Free will.   ═══ */
  let ftFocus=null, ftDone={};                 // ftDone['puzzle']=Set('p:s')
  function ftKey(p,s){ return p+':'+s; }
  function ftMark(){ return ftDone[game]||(ftDone[game]=new Set()); }
  function stageKey(){ return fullText ? ('F'+(ftFocus?ftFocus.key:'map')) : si; }

  function renderFullMap(){
    const body=document.getElementById('cardBody'), actions=document.getElementById('cardActions');
    const done=ftMark();
    const gm=GAMES.find(g=>g.id===game);
    const scope = game==='sequence' ? 'paragraph' : 'sentence';

    body.innerHTML=
      '<div class="hint">Tap any '+scope+' to work on it with <b>'+gm.nm+'</b>. '+
      'Nothing is set — choose wherever you like.</div>'+
      '<div class="ft-text" id="ftText">'+
      stages.map((st,p)=>
        '<p class="ft-p" data-p="'+p+'"><span class="ft-lab">'+st.label+'</span>'+
        st.sents.map((sent,sIdx)=>
          '<span class="ft-s'+(done.has(ftKey(p,sIdx))?' done':'')+'" data-p="'+p+'" data-s="'+sIdx+'">'+
          lightFrames(sent)+'</span>').join(' ')+
        '</p>').join('')+
      '</div>';

    [].slice.call(body.querySelectorAll('.ft-s')).forEach(el=>{
      el.onclick=()=>{
        const p=+el.getAttribute('data-p'), sIdx=+el.getAttribute('data-s');
        if(game==='sequence'){
          if(stages[p].sents.length<2){ toast('That paragraph has only one sentence.'); return; }
          ftFocus={key:'p'+p, p:p, label:stages[p].label, sents:stages[p].sents.slice()};
        } else {
          ftFocus={key:ftKey(p,sIdx), p:p, s:sIdx, label:stages[p].label,
                   sents:[stages[p].sents[sIdx]]};
        }
        load(si);
      };
    });

    const total=stages.reduce((a,st)=>a+st.sents.length,0);
    actions.innerHTML='<span class="ft-count">'+done.size+' of '+total+' done with '+gm.nm.toLowerCase()+'</span>'+
      (done.size?'<button onclick="window._ftClear()">CLEAR MARKS</button>':'');
  }
  window._ftClear=function(){ ftDone[game]=new Set(); load(si); };
  window._ftBack=function(){
    if(ftFocus){
      // anything finished in the focused piece is marked on the map
      const d=ftMark();
      if(game==='sequence') stages[ftFocus.p].sents.forEach((_,k)=>d.add(ftKey(ftFocus.p,k)));
      else if(ftFocus.s!=null) d.add(ftKey(ftFocus.p,ftFocus.s));
    }
    ftFocus=null; load(si);
  };

  /* ═══ SEQUENCE — drag every sentence into order (works at any stage, incl. the 2-sentence intro) ═══ */
  let seqOrder=[], seqSents=[];
  function renderSequence(st){
    seqSents=st.sents.slice();
    const body=document.getElementById('cardBody'), actions=document.getElementById('cardActions');
    if(seqSents.length<2){
      body.innerHTML='<div class="stub">This stage is a single sentence — nothing to sequence.</div>';
      actions.innerHTML=''; return;
    }
    seqOrder=shuffle(seqSents.map((_,k)=>k));
    if(seqOrder.every((v,k)=>v===k)) seqOrder.reverse();
    body.innerHTML='<div class="hint">'+MOVE_HINT+'</div><div class="os-supports" id="seqBox"></div>';
    const box=document.getElementById('seqBox');
    seqOrder.forEach(i=>{
      const el=document.createElement('div'); el.className='os-item'; el.draggable=!TOUCH;
      el.textContent=seqSents[i];
      wireDrag(el,'seqBox',()=>{ seqOrder=readOrder('seqBox',seqSents); });
      box.appendChild(el);
    });
    actions.innerHTML='<button onclick="window._reload()">SHUFFLE</button><button class="primary" id="seqCheck" onclick="window._seqCheck()">CONFIRM THE ORDER</button>';
  }
  window._seqCheck=function(){
    seqOrder=readOrder('seqBox',seqSents);
    const els=[].slice.call(document.querySelectorAll('#seqBox .os-item'));
    if(seqOrder.every((v,k)=>v===k)){
      els.forEach(el=>el.classList.add('locked'));
      solved.add(stageKey()+':sequence');
      showWhole(seqSents,'\u2713 THAT READS WELL');
    } else gentle(els,seqOrder,'seqCheck','CONFIRM THE ORDER');
  };

  /* ═══ STORYBOARD — dictation, one sentence at a time, nothing ever lost ═══
     Every sentence keeps its own progress, so moving between them never
     erases work. The paragraph is incremental: what you have done stays
     on screen as context for what comes next.                          ═══ */
  let sbStage=-1, sbSents=[], sbIdx=0, sbDone=new Set(), sbS={}, sbShowing=false, sbTimer=null;
  const SB_MAX_TRIES=3, SB_MAX_READS=3;
  function sbWords(i){ return (sbSents[i]||'').split(/\s+/).filter(Boolean); }
  function sbKey(w){ return (w||'').toLowerCase().replace(/[^a-z0-9']/g,''); }
  function sbGet(i){
    if(!sbS[i]) sbS[i]={found:new Set(), given:new Set(), typed:{}, tries:0, reads:0};
    return sbS[i];
  }
  function renderStoryboard(st){
    if(sbStage!==stageKey()){ sbStage=stageKey(); sbSents=st.sents.slice(); sbIdx=0; sbDone=new Set(); sbS={}; sbOpen(0); }
    paintStory();
  }
  function sbOpen(i){
    sbIdx=i; sbShowing=false;
    if(sbTimer){clearInterval(sbTimer);sbTimer=null;}
    const S=sbGet(i);
    if(sbDone.has(i)) sbWords(i).forEach((_,k)=>S.found.add(k));
  }
  function sbSettled(i){ const S=sbGet(i); return S.found.size+S.given.size===sbWords(i).length; }
  /* a sentence in progress, shown as context: known words, gaps collapsed to one … */
  function sbPartial(i){
    const words=sbWords(i), S=sbGet(i), out=[]; let gap=false;
    words.forEach((w,k)=>{
      if(S.found.has(k)||S.given.has(k)){ out.push('<span class="ps-place">'+w+'</span>'); gap=false; }
      else if(!gap){ out.push('<span class="ps-todo">…</span>'); gap=true; }
    });
    return out.join(' ');
  }
  function paintStory(){
    const body=document.getElementById('cardBody'), actions=document.getElementById('cardActions');
    const S=sbGet(sbIdx), words=sbWords(sbIdx), saved=sbDone.has(sbIdx);
    const complete=sbDone.size===sbSents.length;
    const out=S.tries>=SB_MAX_TRIES;

    const box=sbSents.map((s,i)=>{
      if(sbDone.has(i))
        return '<span class="ps-done" data-edit="'+i+'" title="Tap to do it again">'+lightFrames(s)+'</span>';
      if(i===sbIdx){
        if(sbShowing) return '<span class="sb-flashing">'+lightFrames(s)+'</span>';
        return sbWords(i).map((w,k)=>{
          if(S.found.has(k)) return '<span class="ps-place">'+w+'</span>';
          if(S.given.has(k)) return '<span class="sb-given" title="shown after three attempts">'+w+'</span>';
          const val=(S.typed[k]||'').replace(/"/g,'&quot;');
          return '<input class="sb-blank" data-k="'+k+'" value="'+val+'" '+
                 'style="width:'+Math.max(2.6,Math.min(sbKey(w).length*0.62,9))+'em" '+
                 'autocomplete="off" spellcheck="false">';
        }).join(' ');
      }
      const P=sbS[i];
      if(sbShowing) return '';
      return (P && (P.found.size||P.given.size)) ? sbPartial(i) : '<span class="ps-todo">…</span>';
    }).filter(Boolean).join(' ');

    const tally=(!saved && S.reads>0)
      ? '<span class="sb-tally">'+S.found.size+' / '+words.length+' correct'+
        (S.tries?' · attempt '+Math.min(S.tries+1,SB_MAX_TRIES)+' of '+SB_MAX_TRIES:'')+'</span>' : '';

    body.innerHTML =
      '<div class="pz-built">'+box+(sbShowing?'<div class="sb-count" id="sbCount"></div>':'')+'</div>' +
      '<div class="hint">'+(complete ? 'The paragraph is complete. Tap any sentence to do it again.'
        : sbShowing ? 'Read it — it disappears in a moment.'
        : saved ? 'Sentence '+(sbIdx+1)+' is saved. Tap a dot for the next one.'
        : S.reads===0 ? 'Sentence '+(sbIdx+1)+' of '+sbSents.length+' — tap SHOW ME, then fill every blank.'
        : out ? 'Three attempts used — the missing words are shown.'
        : 'Type a word in each blank, then check. Red means try again.')+tally+'</div>' +
      '<div class="pz-dots" id="pzDots"></div>';

    [].slice.call(body.querySelectorAll('.ps-done')).forEach(el=>{
      el.onclick=()=>{ const i=+el.getAttribute('data-edit'); sbDone.delete(i); sbS[i]=null; sbOpen(i); paintStory(); };
    });
    [].slice.call(body.querySelectorAll('.sb-blank')).forEach(inp=>{
      const k=+inp.getAttribute('data-k');
      if(S.wrongSet && S.wrongSet.has(k)) inp.classList.add('wrong');
      inp.oninput=()=>{ S.typed[k]=inp.value; inp.classList.remove('wrong'); };
      inp.onkeydown=(e)=>{
        if(e.key==='Enter'){ e.preventDefault();
          const all=[].slice.call(document.querySelectorAll('.sb-blank'));
          const j=all.indexOf(inp); if(j>-1&&all[j+1]) all[j+1].focus(); else window._sbCheck(); }
      };
    });
    const first=body.querySelector('.sb-blank'); if(first&&!sbShowing&&S.reads>0) first.focus();

    const dots=document.getElementById('pzDots');
    sbSents.forEach((_,i)=>{
      const d=document.createElement('button');
      const P=sbS[i], part=P&&(P.found.size||P.given.size)&&!sbDone.has(i);
      d.className='pz-dot'+(i===sbIdx?' on':'')+(sbDone.has(i)?' done':(part?' part':''));
      d.textContent=String(i+1);
      d.onclick=()=>{ sbOpen(i); paintStory(); };
      dots.appendChild(d);
    });

    const nextUndone=sbSents.findIndex((_,i)=>!sbDone.has(i) && i!==sbIdx);
    actions.innerHTML = sbShowing ? ''
      : (saved
          ? '<button onclick="window._sbAgain()">DO IT AGAIN</button>'+
            (nextUndone>-1?'<button class="primary" onclick="window._sbGo('+nextUndone+')">NEXT SENTENCE →</button>':'')
          : (S.reads<SB_MAX_READS
              ? '<button onclick="window._sbRead()">'+(S.reads?'SHOW ME AGAIN ('+(SB_MAX_READS-S.reads)+' left)':'SHOW ME')+'</button>'
              : '<button disabled>NO READS LEFT</button>')+
            (S.reads&&!sbSettled(sbIdx)&&!out ? '<button class="primary" onclick="window._sbCheck()">CHECK</button>' : '')+
            (sbSettled(sbIdx)||out ? '<button class="primary" onclick="window._sbConfirm()">CONFIRM SENTENCE</button>' : ''))
      + (complete ? '<button class="primary" onclick="window._sbFinish()">SEE IT WHOLE →</button>' : '');
  }
  const SB_CHEER=['Good recall.','Nice one.','That is coming back to you.','Steady.','Well remembered.'];
  const SB_NUDGE=['Close — look again.','Nearly. One more go.','Almost there.'];
  window._sbCheck=function(){
    const S=sbGet(sbIdx), words=sbWords(sbIdx);
    S.wrongSet=new Set();
    words.forEach((w,k)=>{
      if(S.found.has(k)||S.given.has(k)) return;
      const typed=(S.typed[k]||'').trim();
      if(!typed) return;
      if(sbKey(typed)===sbKey(w)) S.found.add(k); else S.wrongSet.add(k);
    });
    S.tries++;
    const before=S.lastFound||0, gained=S.found.size-before; S.lastFound=S.found.size;
    if(S.tries>=SB_MAX_TRIES){ words.forEach((_,k)=>{ if(!S.found.has(k)) S.given.add(k); }); S.wrongSet=new Set(); }
    paintStory();
    if(S.found.size===words.length) toast('That sentence is yours.');
    else if(gained>=3) toast(SB_CHEER[Math.floor(Math.random()*SB_CHEER.length)]);
    else if(S.wrongSet && S.wrongSet.size) toast(SB_NUDGE[Math.floor(Math.random()*SB_NUDGE.length)]);
  };
  window._sbRead=function(){
    const S=sbGet(sbIdx), words=sbWords(sbIdx);
    if(S.reads>=SB_MAX_READS) return;
    let secs=Math.max(4,Math.round(words.length*0.7));
    sbShowing=true; S.reads++; paintStory();
    const tick=()=>{
      const c=document.getElementById('sbCount'); if(c) c.textContent=secs;
      if(secs<=0){ clearInterval(sbTimer); sbTimer=null; sbShowing=false; paintStory(); return; }
      secs--;
    };
    tick(); sbTimer=setInterval(tick,1000);
  };
  window._sbConfirm=function(){
    sbDone.add(sbIdx); solved.add(stageKey()+':story');
    const left=sbSents.length-sbDone.size;
    if(left>0) toast(left===1?'One sentence to go.':'Sentence '+sbDone.size+' of '+sbSents.length+' done.');
    const next=sbSents.findIndex((_,i)=>!sbDone.has(i));
    if(next>-1) sbOpen(next);
    paintStory();
  };
  window._sbGo=function(i){ sbOpen(i); paintStory(); };
  window._sbAgain=function(){ sbDone.delete(sbIdx); sbS[sbIdx]=null; sbOpen(sbIdx); paintStory(); };
  window._sbFinish=function(){
    let given=0, total=0;
    sbSents.forEach((_,i)=>{ const S=sbGet(i); total+=sbWords(i).length; given+=S.given.size; });
    const pct=total?Math.round(((total-given)/total)*100):0;
    if(pct===100) sbPrize();
    else showWhole(sbSents,'✓ THE PARAGRAPH IS COMPLETE  ·  '+pct+'% FROM MEMORY');
  };
  function sbPrize(){
    document.getElementById('cardBody').innerHTML=
      '<div class="prize"><div class="prize-badge">100%</div>'+
      '<div class="prize-title">PERFECT RECALL</div>'+
      '<div class="prize-sub">Every word from memory — nothing shown to you.</div>'+
      '<div class="os-whole" style="margin-top:.7rem">'+sbSents.map(lightFrames).join(' ')+'</div></div>';
    document.getElementById('cardActions').innerHTML=
      '<button onclick="window._reload()">AGAIN</button>'+
      '<button class="primary" onclick="window._next()">NEXT STAGE →</button>';
    burst();
  }

  /* ═══ PUZZLE — sort → CONFIRM → the sentence is saved into the paragraph ═══
     The paragraph starts incomplete (blank slots) and is complete when the
     exercise is over. Tap any saved sentence to edit it again.            ═══ */
  let pzStage=-1, pzSents=[], pzIdx=0, pzDone=new Set(), pzPlaced=[], pzPool=[];
  function renderPuzzle(st){
    if(pzStage!==stageKey()){ pzStage=stageKey(); pzSents=st.sents.slice(); pzIdx=0; pzDone=new Set(); openSentence(0); }
    paintPuzzle();
  }
  const PZ_BREAK=/(?<=,)\s+|\s+(?=(?:and|but|so|because|which|that|when|if|although|while|as|in|on|at|through|among|during|with|for|by|from|before|after|since)\b)/i;
  function unitsOf(sent){
    const words=(sent||'').split(/\s+/).filter(Boolean);
    if(words.length<=14) return words;                 // short enough for word tiles
    let parts=(sent||'').split(PZ_BREAK).filter(Boolean);
    const merged=[];                                    // no one-word slivers
    parts.forEach(p=>{
      if(merged.length && p.split(/\s+/).length===1 && !/,$/.test(merged[merged.length-1]))
        merged[merged.length-1]+=' '+p;
      else merged.push(p);
    });
    return merged.length>=3 ? merged : words;
  }
  function openSentence(i){
    pzIdx=i;
    const u=unitsOf(pzSents[i]);
    if(pzDone.has(i)){ pzPlaced=u.slice(); pzPool=[]; }
    else{ pzPlaced=[]; pzPool=shuffle(u.slice()); }
  }
  function paintPuzzle(){
    const body=document.getElementById('cardBody'), actions=document.getElementById('cardActions');
    const words=unitsOf(pzSents[pzIdx]);
    const saved=pzDone.has(pzIdx), complete=pzDone.size===pzSents.length;
    const ready=!saved && pzPlaced.length===words.length;

    // ONE box. Confirmed sentences stay; the current one forms in its own position.
    const box=pzSents.map((s,i)=>{
      if(pzDone.has(i))
        return '<span class="ps-done" data-edit="'+i+'" title="Tap to edit">'+lightFrames(s)+'</span>';
      if(i===pzIdx){
        const placed=pzPlaced.map((w,k)=>'<span class="ps-place" data-i="'+k+'" title="Tap to take it back">'+w+'</span>').join(' ');
        const left=words.length-pzPlaced.length;
        return placed + (left>0 ? (placed?' ':'')+'<span class="ps-gap">'+'▁▁▁ '.repeat(Math.min(left,6)).trim()+'</span>' : '');
      }
      return '<span class="ps-todo">…</span>';
    }).filter(Boolean).join(' ');

    body.innerHTML =
      '<div class="pz-built">'+box+'</div>' +
      '<div class="hint">'+(complete
        ? 'The paragraph is complete. Tap any sentence to edit it.'
        : saved
          ? 'Sentence '+(pzIdx+1)+' is saved. Tap a dot for the next one.'
          : 'Sentence '+(pzIdx+1)+' of '+pzSents.length+' — tap the words in order, then confirm.')+'</div>' +
      (saved ? '' : '<div class="pz-pool" id="pzPool"></div>') +
      '<div class="pz-dots" id="pzDots"></div>';

    // tap a saved sentence → edit it
    [].slice.call(body.querySelectorAll('.ps-done')).forEach(el=>{
      el.onclick=()=>{ const i=+el.getAttribute('data-edit'); pzDone.delete(i); openSentence(i); paintPuzzle(); };
    });
    // tap a placed word → send it back to the pool
    [].slice.call(body.querySelectorAll('.ps-place')).forEach(el=>{
      el.onclick=()=>{ const i=+el.getAttribute('data-i'); pzPool.push(pzPlaced[i]); pzPlaced.splice(i,1); paintPuzzle(); };
    });

    const pool=document.getElementById('pzPool');
    if(pool){
      pool.innerHTML=pzPool.map((w,i)=>'<span class="pz-w" data-p="'+i+'">'+w+'</span>').join('');
      [].slice.call(pool.querySelectorAll('.pz-w')).forEach(el=>{
        el.onclick=()=>{ const i=+el.getAttribute('data-p'); pzPlaced.push(pzPool[i]); pzPool.splice(i,1); paintPuzzle(); };
      });
    }

    const dots=document.getElementById('pzDots');
    pzSents.forEach((_,i)=>{
      const d=document.createElement('button');
      d.className='pz-dot'+(i===pzIdx?' on':'')+(pzDone.has(i)?' done':'');
      d.textContent=String(i+1);
      d.onclick=()=>{ openSentence(i); paintPuzzle(); };
      dots.appendChild(d);
    });

    const nextUndone=pzSents.findIndex((_,i)=>!pzDone.has(i) && i!==pzIdx);
    actions.innerHTML =
      (saved ? '<button onclick="window._pzEdit()">EDIT THIS SENTENCE</button>'
             : '<button onclick="window._pzReset()">RESET</button>') +
      (saved && nextUndone>-1 ? '<button class="primary" onclick="window._pzGo('+nextUndone+')">NEXT SENTENCE →</button>' : '') +
      (!saved ? '<button class="primary" id="pzConfirm" '+(ready?'':'disabled')+' onclick="window._pzConfirm()">CONFIRM SENTENCE</button>' : '') +
      (complete ? '<button class="primary" onclick="window._pzFinish()">SEE IT WHOLE →</button>' : '');
  }

  window._pzConfirm=function(){
    const words=unitsOf(pzSents[pzIdx]);
    if(pzPlaced.join(' ')===words.join(' ')){
      pzDone.add(pzIdx); solved.add(stageKey()+':puzzle');
      const next=pzSents.findIndex((_,i)=>!pzDone.has(i));
      if(next>-1) openSentence(next);
      paintPuzzle();
    } else {
      const l=document.getElementById('pzLine');
      if(l&&!l.querySelector('.pz-nudge'))
        l.insertAdjacentHTML('beforeend','<div class="pz-nudge">All the words are there — try another arrangement.</div>');
    }
  };
  window._pzGo=function(i){ openSentence(i); paintPuzzle(); };
  window._pzEdit=function(){ pzDone.delete(pzIdx); openSentence(pzIdx); paintPuzzle(); };
  window._pzReset=function(){ openSentence(pzIdx); paintPuzzle(); };
  window._pzFinish=function(){ showWhole(pzSents,'✓ THE PARAGRAPH IS COMPLETE'); };

  /* ═══ BUILDER — compose a paragraph from the moves you choose ═══
     A topic sentence is given. Pick a sentence for whichever moves you want:
     reason, example, result, compare, contrast. Nothing is compulsory and
     there is no order to obey — the moves are options, not a recipe.   ═══ */
  const BD_MOVES=[
    {k:'reason',  label:'REASON',   hint:'why it is so'},
    {k:'example', label:'EXAMPLE',  hint:'show it happening'},
    {k:'result',  label:'RESULT',   hint:'what follows'},
    {k:'compare', label:'COMPARE',  hint:'set beside something'},
    {k:'contrast',label:'CONTRAST', hint:'the other side'}
  ];
  let bdData=null, bdTopic=0, bdPick={}, bdOpen='', bdExpanded=null, bdShown=false;

  function renderBuilder(){
    const body=document.getElementById('cardBody'), actions=document.getElementById('cardActions');
    if(!bdData){
      body.innerHTML='<div class="stub">Loading topics…</div>'; actions.innerHTML='';
      fetch('/skills/writing/games/data/master-data.json').then(r=>r.json()).then(d=>{
        bdData=d; bdTopic=Math.floor(Math.random()*(d.topics||[]).length);
        bdNewTopic(false); paintBuilder();
      }).catch(()=>{ body.innerHTML='<div class="stub">Could not load the builder topics.</div>'; });
      return;
    }
    paintBuilder();
  }
  function bdNewTopic(advance){
    if(advance){ let n=bdTopic; while(n===bdTopic&&bdData.topics.length>1) n=Math.floor(Math.random()*bdData.topics.length); bdTopic=n; }
    bdPick={}; bdExpanded=null; bdShown=false;
    const pool=[];
    Object.values(bdData.openers||{}).forEach(a=>pool.push(...a));
    bdOpen=pool.length?pool[Math.floor(Math.random()*pool.length)]:'';
  }
  function bdLight(t){
    let out=t;
    (bdData.linking_words||[]).forEach(w=>{
      const re=new RegExp('\\b('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')\\b','gi');
      out=out.replace(re,'<span class="frame">$1</span>');
    });
    return out;
  }
  function bdIntro(){
    const t=bdData.topics[bdTopic];
    let base=t.base||'';
    if(/that\s*$/i.test(bdOpen)) base=base.charAt(0).toLowerCase()+base.slice(1);
    return '<span class="bd-open">'+bdOpen+'</span> <span class="bd-base">'+base+'</span>';
  }
  function paintBuilder(){
    const body=document.getElementById('cardBody'), actions=document.getElementById('cardActions');
    const t=bdData.topics[bdTopic];
    const chosen=BD_MOVES.filter(m=>bdPick[m.k]!=null);

    if(bdShown){
      const para=[bdIntro().replace(/<[^>]+>/g,'')]
        .concat(chosen.map(m=>t[m.k][bdPick[m.k]]));
      body.innerHTML='<div class="os-win">✓ YOUR PARAGRAPH</div>'+
        '<div class="os-whole">'+para.map(bdLight).join(' ')+'</div>'+
        '<div class="hint">'+chosen.length+' move'+(chosen.length===1?'':'s')+' used: '+
        chosen.map(m=>m.label.toLowerCase()).join(' · ')+'</div>';
      actions.innerHTML='<button onclick="window._bdBack()">KEEP BUILDING</button>'+
        '<button class="primary" onclick="window._bdNew()">NEW TOPIC →</button>';
      return;
    }

    body.innerHTML=
      '<div class="bd-topic">'+t.title+'</div>'+
      '<div class="pz-built bd-intro">'+bdIntro()+'</div>'+
      '<div class="hint">Pick a sentence for any move you want. None of them is compulsory.</div>'+
      '<div class="bd-moves" id="bdMoves"></div>';

    const wrap=document.getElementById('bdMoves');
    BD_MOVES.forEach(m=>{
      const opts=t[m.k]||[];
      const row=document.createElement('div');
      row.className='bd-row'+(bdPick[m.k]!=null?' filled':'');
      const picked=bdPick[m.k]!=null?bdLight(opts[bdPick[m.k]]):'';
      row.innerHTML=
        '<button class="bd-move'+(bdPick[m.k]!=null?' on':'')+'" data-m="'+m.k+'">'+m.label+'</button>'+
        '<div class="bd-line">'+(picked||'<span class="bd-hintline">'+m.hint+'</span>')+'</div>';
      wrap.appendChild(row);
    });
    [].slice.call(wrap.querySelectorAll('.bd-move')).forEach(b=>{
      b.onclick=()=>window._bdPickMove(b.getAttribute('data-m'));
    });
    [].slice.call(wrap.querySelectorAll('.bd-line')).forEach((el,idx)=>{
      el.onclick=()=>window._bdPickMove(BD_MOVES[idx].k);
    });

    actions.innerHTML=
      '<button onclick="window._bdNew()">NEW TOPIC</button>'+
      '<button class="primary" '+(chosen.length?'':'disabled')+' onclick="window._bdShow()">SEE MY PARAGRAPH →</button>';
  }
  window._bdPickMove=function(k){
    const m=BD_MOVES.find(x=>x.k===k), t=bdData.topics[bdTopic], opts=t[k]||[];
    document.getElementById('bdmMove').textContent=m.label;
    document.getElementById('bdmHint').textContent=m.hint;
    const box=document.getElementById('bdmOpts'); box.innerHTML='';
    opts.forEach((o,i)=>{
      const b=document.createElement('button');
      b.className='bdm-opt'+(bdPick[k]===i?' on':'');
      b.innerHTML='<span class="bdm-n">'+(i+1)+'</span><span>'+bdLight(o)+'</span>';
      b.onclick=()=>{ bdPick[k]=i; window._bdClose(); paintBuilder(); toast('Added — '+m.hint+'.'); };
      box.appendChild(b);
    });
    if(bdPick[k]!=null){
      const clr=document.createElement('button');
      clr.className='bdm-opt clear'; clr.textContent='Remove this move';
      clr.onclick=()=>{ delete bdPick[k]; window._bdClose(); paintBuilder(); };
      box.appendChild(clr);
    }
    const mod=document.getElementById('bdModal');
    mod.classList.add('on'); mod.setAttribute('aria-hidden','false');
  };
  window._bdClose=function(){
    const mod=document.getElementById('bdModal');
    mod.classList.remove('on'); mod.setAttribute('aria-hidden','true');
  };
  window._bdNew=function(){ bdNewTopic(true); paintBuilder(); };
  window._bdShow=function(){ bdShown=true; paintBuilder(); burst(); };
  window._bdBack=function(){ bdShown=false; paintBuilder(); };
  window._bdReset=function(){ bdNewTopic(false); paintBuilder(); };

  /* ── shared helpers for the ported games ── */
  function readOrder(boxId, source){
    return [].slice.call(document.querySelectorAll('#'+boxId+' .os-item')).map(el=>source.indexOf(el.textContent));
  }
  function gentle(els,ord,btnId,label){
    els.forEach((el,k)=>el.classList.toggle('locked',ord[k]===k));
    const n=ord.filter((v,k)=>v===k).length, btn=document.getElementById(btnId);
    if(btn){ btn.textContent = n>0 ? n+' IN PLACE — KEEP GOING' : 'TRY AGAIN';
      setTimeout(()=>{ if(btn) btn.textContent=label; },1500); }
  }
  function showWhole(sents,msg){
    document.getElementById('cardBody').innerHTML=
      '<div class="os-win">'+msg+'</div><div class="os-whole">'+sents.map(lightFrames).join(' ')+'</div>';
    document.getElementById('cardActions').innerHTML=
      '<button onclick="window._reload()">AGAIN</button><button class="primary" onclick="window._next()">NEXT STAGE →</button>';
    renderStrip();
  }
  let toastT=null;
  function toast(msg){
    let el=document.getElementById('toast');
    if(!el){ el=document.createElement('div'); el.id='toast'; document.body.appendChild(el); }
    el.textContent=msg; el.classList.add('on');
    clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('on'),1900);
  }
  function burst(){
    const host=document.querySelector('.card'); if(!host) return;
    for(let i=0;i<18;i++){
      const b=document.createElement('i'); b.className='spark';
      b.style.left=(15+Math.random()*70)+'%';
      b.style.animationDelay=(Math.random()*0.35)+'s';
      b.style.setProperty('--dx',(Math.random()*80-40)+'px');
      host.appendChild(b); setTimeout(()=>b.remove(),1600);
    }
  }
  window._reload=function(){ load(si); };
  window._mode=function(on){
    if(on===fullText) return;
    fullText=on; solved=new Set(); pzStage=-1; sbStage=-1; ftFocus=null; si=0;
    document.getElementById('mbStages').classList.toggle('on',!on);
    document.getElementById('mbFull').classList.toggle('on',on);
    rebuildPlay(); renderStrip(); load(firstPlayable());
  };
  function wireDrag(el,boxId,after){
    el.addEventListener('dragstart',()=>{ dragEl=el; el.classList.add('dragging'); });
    el.addEventListener('dragend',()=>{ el.classList.remove('dragging'); if(after) after(); });
    el.addEventListener('dragover',e=>{ e.preventDefault();
      const box=document.getElementById(boxId); const a=afterEl(box,e.clientY);
      if(dragEl&&dragEl!==el){ a==null ? box.appendChild(dragEl) : box.insertBefore(dragEl,a); } });
    el.addEventListener('click',()=>{
      if(el.classList.contains('locked')) return;
      if(!pick){ pick=el; el.classList.add('picked'); }
      else{
        if(pick!==el){ const box=document.getElementById(boxId);
          const pi=[].slice.call(box.children).indexOf(pick), ei=[].slice.call(box.children).indexOf(el);
          pi<ei ? box.insertBefore(el,pick) : box.insertBefore(pick,el); }
        pick.classList.remove('picked'); pick=null; if(after) after();
      }});
  }

  /* ═══ boot: the header is the only gate there ever is — pick a type and go straight in ═══ */
  const params=new URLSearchParams(location.search);
  const urlType=params.get('type');
  chooseType((urlType && DATA[urlType]) ? urlType : 'essays');

  document.addEventListener('keydown',e=>{ if(e.key==='Escape') window._bdClose&&window._bdClose(); });
  document.addEventListener('click',e=>{ if(e.target && e.target.id==='bdModal') window._bdClose(); });
})();
</script>
</body>
