<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>INTUITY — Writing Games</title>
<meta name="theme-color" content="#EBE8E1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500&family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=7">
<style>
/* ══════════════════════════════════════════════════════════════════════
   WRITING GAMES — four exercises, one spine

   WHY FOUR AND NOT ONE LONGER ONE. The old game staged everything around
   ordering: shuffle the sentences, put them back. Ordering tests ONE thing
   — whether a student can follow a text's thread — and a B2 candidate who
   can already do that gets nothing from the next round. So each exercise
   here isolates a different competence, and they are deliberately not
   variations on a theme:

     SHAPE     the parts of an essay, in order          — macro structure
     ROLE      what a paragraph is DOING                — genre awareness
     JOIN      the linker the sentence needs            — cohesion
     INTRUDER  the sentence that came from elsewhere    — coherence

   A student who is strong at one is routinely weak at another, which is
   the point: four scores tell a teacher something one score cannot.

   TAP, NOT DRAG. gerunds-sort.html is the best game in the product and it
   has no drag at all — ten click handlers and nothing else. Drag needs two
   code paths, breaks under a scrolling container, and on a phone competes
   with the gesture that scrolls the page. Every answer here is one tap.

   THE SCORE IS A STREAK, NOT A TOTAL. Taken from gerunds-sort: a running
   streak raises the multiplier, and a miss costs MORE than the streak just
   earned. A total rewards grinding; a streak rewards attention, and makes
   a wrong tap cost something the moment it happens. multiplierFor is the
   one place a streak length becomes a number, so the badge and the bar can
   never disagree.
   ══════════════════════════════════════════════════════════════════════ */
:root{
  /* Tokens the shell does not define. Same values the Phrase Bank and the
     writing door declare locally, so the three agree. */
  --board:#EBE8E1;
  --sage:#527065;
  --hot:#A7573C;
  --spring:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{background:var(--board);color:var(--ink,#232C31);
  font-family:'Geist',system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;overflow:hidden;}

/* ── HUD ──────────────────────────────────────────────────────────────
   Three numbers and a bar. The bar is POINTS, not questions answered, so
   a streak makes it fill faster than the deck shortens — and a miss slides
   it backwards, which is felt in a way a reset counter is not. */
.hud{flex:none;display:flex;align-items:center;gap:.8rem;
  padding:.7rem clamp(.8rem,3vw,1.4rem) .55rem;}
.hud .back{font-family:var(--f-mono,'Geist Mono',monospace);font-size:.58rem;
  letter-spacing:.14em;text-transform:uppercase;color:var(--faint,#756B6E);
  text-decoration:none;margin-right:auto;}
.hud .back:hover{color:var(--ink,#232C31);}
.hud .stat{font-family:var(--f-mono,'Geist Mono',monospace);font-size:.56rem;
  letter-spacing:.14em;text-transform:uppercase;color:var(--faint,#756B6E);
  display:flex;align-items:baseline;gap:.35em;}
.hud .stat b{font-family:'Anton',Impact,sans-serif;font-size:.95rem;font-weight:400;
  color:var(--poster-ink,#14110E);font-variant-numeric:tabular-nums;
  display:inline-block;transition:transform .2s var(--spring),color .15s;}
.hud .stat.pop b{transform:scale(1.32);}
.hud .stat.live b{color:var(--hot);}
.hud .mult{font-family:var(--f-mono,'Geist Mono',monospace);font-size:.52rem;
  color:var(--hot);opacity:0;transition:opacity .2s;}
.hud .mult.on{opacity:1;}
.hud .snd{border:none;background:none;cursor:pointer;font-size:.85rem;opacity:.5;padding:.2rem;}
.hud .snd:hover{opacity:1;}

.bar{flex:none;height:3px;background:var(--poster-fill,rgba(20,17,14,.09));
  margin:0 clamp(.8rem,3vw,1.4rem);}
.bar i{display:block;height:100%;width:0;background:var(--sage);
  transition:width .45s var(--spring),background .2s;}
.bar i.sting{background:var(--hot);}

/* ── THE BOARD ────────────────────────────────────────────────────────
   One poster, centred, square-cut. Everything an exercise needs happens
   inside it, so moving between the four never changes the furniture. */
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
  padding:clamp(.6rem,2.5vw,1.2rem);}
.poster{width:min(560px,100%);max-height:100%;overflow-y:auto;
  background:var(--poster,#FAF8F5);border-radius:var(--r-sheet,0);
  box-shadow:0 1px 3px rgba(20,17,14,.10),0 18px 44px -20px rgba(20,17,14,.30);
  padding:clamp(1.3rem,4vw,2rem) clamp(1.1rem,3.5vw,1.7rem) clamp(1rem,3vw,1.4rem);
  animation:rise .4s var(--spring) both;}
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.kick{display:flex;align-items:center;gap:9px;font-family:var(--f-mono,'Geist Mono',monospace);
  font-size:.56rem;letter-spacing:.22em;text-transform:uppercase;
  color:var(--poster-faint,rgba(20,17,14,.5));margin-bottom:.9rem;}
.kick i{display:block;width:26px;height:10px;flex:none;background:var(--caramel,#B0865C);}
.prompt{font-family:'Anton',Impact,sans-serif;font-weight:400;text-transform:uppercase;
  font-size:clamp(1.25rem,5.2vw,1.8rem);line-height:1.02;color:var(--poster-ink,#14110E);
  margin-bottom:.35rem;}
.prompt::after{content:'';display:block;width:38px;height:3px;
  background:var(--poster-ink,#14110E);margin:.75rem 0 0;}
.passage{font-size:clamp(.86rem,3vw,.97rem);line-height:1.6;
  color:var(--poster-body,#5C5852);margin:1rem 0 0;}
.passage .blank{display:inline-block;min-width:5.5em;border-bottom:2px solid var(--caramel,#B0865C);
  text-align:center;color:var(--poster-ink,#14110E);font-weight:600;}

/* ── OPTIONS ──────────────────────────────────────────────────────────
   One tap each. The whole row is the target: 44px minimum, because a
   student's thumb is the input device and a small target is a wrong
   answer the interface caused. */
.opts{display:flex;flex-direction:column;gap:.5rem;margin-top:1.1rem;}
.opt{display:flex;align-items:center;gap:.75rem;width:100%;min-height:46px;
  text-align:left;border:none;cursor:pointer;font:inherit;
  background:var(--poster-fill,rgba(20,17,14,.09));color:var(--poster-ink,#14110E);
  border-radius:var(--r-field,10px);padding:.6rem .85rem;
  font-size:clamp(.8rem,2.9vw,.9rem);line-height:1.4;
  transition:background .15s,transform .12s var(--spring),color .15s;}
.opt .n{font-family:var(--f-mono,'Geist Mono',monospace);font-size:.6rem;
  color:var(--poster-faint,rgba(20,17,14,.5));flex:none;}
.opt:active:not(:disabled){transform:scale(.985);}
@media(hover:hover){.opt:hover:not(:disabled){background:var(--poster-fill-hi,rgba(20,17,14,.15));}}
.opt.hit{background:var(--sage);color:#FAF8F5;animation:pop .32s var(--spring);}
.opt.hit .n{color:rgba(255,255,255,.6);}
.opt.miss{background:var(--hot);color:#FAF8F5;animation:shake .34s;}
.opt.miss .n{color:rgba(255,255,255,.6);}
.opt.show{outline:2px solid var(--sage);outline-offset:-2px;}
.opt:disabled{cursor:default;}
@keyframes pop{40%{transform:scale(1.03)}100%{transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}
  45%{transform:translateX(5px)}70%{transform:translateX(-3px)}}

/* SHAPE uses the same option row as a numbered slot list. */
.slotline{display:flex;align-items:center;gap:.5rem;margin-top:.5rem;
  font-family:var(--f-mono,'Geist Mono',monospace);font-size:.55rem;
  letter-spacing:.14em;text-transform:uppercase;color:var(--poster-faint,rgba(20,17,14,.5));}
.slotline b{font-family:'Anton',Impact,sans-serif;font-size:.8rem;font-weight:400;
  letter-spacing:.02em;color:var(--poster-ink,#14110E);}

.note{margin-top:1rem;padding-top:.9rem;border-top:1px solid var(--poster-rule,rgba(20,17,14,.2));
  font-size:.78rem;line-height:1.5;color:var(--poster-body,#5C5852);
  display:none;animation:rise .3s var(--spring) both;}
.note.on{display:block;}
.note b{color:var(--poster-ink,#14110E);}

.foot{display:flex;justify-content:center;gap:.5rem;margin-top:1.2rem;}
.btn{border:none;cursor:pointer;font:inherit;font-weight:700;
  font-size:clamp(.7rem,2.6vw,.78rem);letter-spacing:.02em;
  padding:.62rem 1.3rem;border-radius:var(--r-field,999px);
  background:var(--poster-ink,#14110E);color:var(--poster,#FAF8F5);
  transition:transform .12s var(--spring),opacity .15s;}
.btn.ghost{background:var(--poster-fill,rgba(20,17,14,.09));color:var(--poster-ink,#14110E);}
.btn:active{transform:scale(.96);}

/* ── THE GATE ─────────────────────────────────────────────────────────
   Four exercises, four marks. Same medallion the family menu uses, so the
   choice reads as part of the product rather than a game's own menu. */
.gate{width:min(560px,100%);}
.gate .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.7rem;margin-top:1.1rem;}
.card{border:none;cursor:pointer;font:inherit;text-align:left;
  background:var(--poster-fill,rgba(20,17,14,.09));border-radius:var(--r-sheet,0);
  padding:1rem .9rem;transition:background .15s,transform .12s var(--spring);}
.card:active{transform:scale(.97);}
@media(hover:hover){.card:hover{background:var(--poster-fill-hi,rgba(20,17,14,.15));}}
.card .dial{--d:38px;width:var(--d);height:var(--d);border-radius:50%;position:relative;
  display:flex;align-items:center;justify-content:center;margin-bottom:.6rem;
  background:linear-gradient(145deg,var(--card,#FAF8F5),#E4DDD1);
  box-shadow:-3px -3px 7px rgba(255,255,255,.9),4px 4px 10px rgba(43,33,41,.16);}
.card .dial::before{content:'';position:absolute;inset:5%;border-radius:50%;background:var(--sage);}
.card .dial::after{content:'';position:absolute;inset:15%;border-radius:50%;background:#14110E;}
.card .dial span{position:relative;z-index:2;font-family:'Anton',Impact,sans-serif;
  font-size:.8rem;color:var(--card,#FAF8F5);}
.card h3{font-family:'Anton',Impact,sans-serif;font-weight:400;text-transform:uppercase;
  font-size:.98rem;letter-spacing:.02em;color:var(--poster-ink,#14110E);}
.card p{font-size:.72rem;line-height:1.4;color:var(--poster-body,#5C5852);margin-top:.2rem;}
.card .best{font-family:var(--f-mono,'Geist Mono',monospace);font-size:.52rem;
  letter-spacing:.12em;text-transform:uppercase;color:var(--poster-faint,rgba(20,17,14,.5));
  margin-top:.5rem;}

.msg{text-align:center;color:var(--poster-body,#5C5852);font-size:.85rem;padding:2rem 0;}
@media(max-width:420px){ .gate .grid{grid-template-columns:1fr;} }
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important;}}
</style>
</head>
<body>

<div class="hud">
  <a class="back" href="/skills/writing/writing-door.html">&larr; Writing</a>
  <span class="stat" id="scoreWrap">score <b id="score">0</b></span>
  <span class="stat" id="streakWrap">streak <b id="streak">0</b><span class="mult" id="mult">&times;1</span></span>
  <button class="snd" id="sndBtn" type="button" title="Sound on/off">&#128266;</button>
</div>
<div class="bar"><i id="fill"></i></div>

<div class="stage" id="stage">
  <div class="msg">Loading&hellip;</div>
</div>

<script src="/skills/grammar-rules/intuity-sound.js"></script>
<script>
/* ══ DATA ══════════════════════════════════════════════════════════════
   essays-models.json is 60 complete essays, each five labelled
   paragraphs. That single file feeds all four exercises — the labels give
   ROLE its answers, the paragraph order gives SHAPE its sequence, and the
   sentences inside give JOIN and INTRUDER their material. No exercise
   needs authoring beyond what already exists. */
const DATA_URL   = '/skills/writing/games/data/essays-models.json';
const MASTER_URL = '/skills/writing/games/data/master-data.json';

const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const shuffle = a => { const b=[...a]; for(let i=b.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[b[i],b[j]]=[b[j],b[i]];} return b; };
const pick = a => a[(Math.random()*a.length)|0];
const sfx  = n => { try{ if(window.SFX && SFX[n]) SFX[n](); }catch(e){} };

let SAMPLES = [], LINKERS = [];

/* ══ SCORING ═══════════════════════════════════════════════════════════
   One model for all four. multiplierFor is the ONLY place a streak length
   becomes a number — used for gains AND losses, so the badge and the bar
   can never disagree about what a streak of N is worth.

   BASE_LOSS is deliberately larger than BASE_GAIN. A miss at a ×1 streak
   costs more than a hit earns, so guessing is never free; and because the
   loss is multiplied too, breaking a long streak hurts in proportion to
   what it was worth. That is the whole engine: attention pays, and it
   pays more the longer it is sustained. */
const BASE_GAIN = 10, BASE_LOSS = 14;
const multiplierFor = n => n >= 12 ? 2.2 : n >= 8 ? 1.7 : n >= 4 ? 1.3 : 1;
const ROUNDS = 10;

let score=0, streak=0, best=0, round=0, points=0, maxPoints=1, locked=false, mode=null;

function hudPop(el){ el.classList.add('pop'); setTimeout(()=>el.classList.remove('pop'),200); }
function paintHud(){
  $('score').textContent = score;
  $('streak').textContent = streak;
  const m = multiplierFor(streak);
  $('mult').textContent = '\u00d7' + m;
  $('mult').classList.toggle('on', m > 1);
  $('streakWrap').classList.toggle('live', streak >= 4);
  $('fill').style.width = Math.max(0, Math.min(100, points / maxPoints * 100)) + '%';
}
function award(correct){
  const mult = multiplierFor(streak);          /* the streak walked in with */
  if(correct){
    streak++; best = Math.max(best, streak);
    const gain = Math.round(BASE_GAIN * mult);
    score += gain; points = Math.min(maxPoints, points + gain);
    hudPop($('score')); hudPop($('streak')); sfx('correct');
  }else{
    const loss = Math.round(BASE_LOSS * mult);
    score = Math.max(0, score - loss);
    points = Math.max(0, points - loss);
    streak = 0;
    hudPop($('score')); sfx('wrong');
    $('fill').classList.add('sting');
    setTimeout(()=>$('fill').classList.remove('sting'), 420);
  }
  paintHud();
}

/* ══ SOUND ═════════════════════════════════════════════════════════════
   The shared module, not a second synthesiser. essay-games-staged.html
   grew its own Web-Audio tones and its own mute key, so muting there did
   nothing anywhere else. One module, one key, one state. */
let soundOn = localStorage.getItem('intuity-sound') !== 'off';
function paintSound(){
  $('sndBtn').innerHTML = soundOn ? '&#128266;' : '&#128263;';
  try{ if(window.SFX && SFX.set) SFX.set(soundOn); }catch(e){}
}
$('sndBtn').onclick = () => {
  soundOn = !soundOn;
  localStorage.setItem('intuity-sound', soundOn ? 'on' : 'off');
  paintSound(); if(soundOn) sfx('correct');
};

/* ══ ROLES ═════════════════════════════════════════════════════════════
   The labels in the corpus are wordy and inconsistent — "Body Paragraph 2
   - Disadvantage" in one sample, "Body Paragraph 2 - Supporting Point" in
   another. Both are the same MOVE. Normalising to four roles is what lets
   ROLE ask a fair question, and lets INTRUDER pull a decoy that is the
   same kind of paragraph rather than an obviously foreign one. */
function roleOf(label, i, total){
  const l = String(label||'').toLowerCase();
  if(i === 0) return 'opening';
  if(i === total-1) return 'closing';
  if(/counter|disadvantage|drawback|problem|against/.test(l)) return 'counter';
  return 'support';
}
const ROLE_NAME = { opening:'Introduction', support:'Supporting point',
                    counter:'Counter-argument', closing:'Conclusion' };
const ROLE_WHY = {
  opening:'It sets the topic up and states a position — nothing is being argued yet.',
  support:'It makes a claim and backs it with a reason or an example.',
  counter:'It concedes or objects — the turn against what came before.',
  closing:'It restates the position and closes; no new argument arrives here.'
};

function sentencesOf(text){
  return String(text).split(/(?<=[.!?])\s+/).map(s=>s.trim()).filter(s=>s.length>18);
}

/* ══ THE FOUR ══════════════════════════════════════════════════════════ */
const GAMES = {
  shape: {
    n:1, name:'Shape', blurb:'Put the five parts of an essay back in order.',
    build(){
      /* One paragraph at a time, asked in a random slot: "which part comes
         third?" That is harder than re-ordering a visible list, because
         the student must hold the whole shape in mind rather than compare
         two neighbours. */
      const s = pick(SAMPLES), paras = s.paragraphs;
      const idx = 1 + ((Math.random()*(paras.length-2))|0);   /* never the ends */
      const right = paras[idx];
      const others = shuffle(paras.filter((_,i)=>i!==idx)).slice(0,3);
      return {
        kick:'Shape \u00b7 essay structure',
        prompt:'Which comes ' + ['first','second','third','fourth','fifth'][idx] + '?',
        passage:'', 
        options: shuffle([right, ...others]).map(p=>({
          text: sentencesOf(p.text)[0] || p.text.slice(0,120),
          ok: p === right
        })),
        note:'<b>Position ' + (idx+1) + ' is the ' + ROLE_NAME[roleOf(right.label, idx, paras.length)].toLowerCase() +
             '.</b> ' + ROLE_WHY[roleOf(right.label, idx, paras.length)]
      };
    }
  },
  role: {
    n:2, name:'Role', blurb:'Name what a paragraph is doing in the essay.',
    build(){
      const s = pick(SAMPLES), paras = s.paragraphs;
      const idx = (Math.random()*paras.length)|0;
      const role = roleOf(paras[idx].label, idx, paras.length);
      const wrong = shuffle(Object.keys(ROLE_NAME).filter(r=>r!==role)).slice(0,3);
      return {
        kick:'Role \u00b7 what this paragraph does',
        prompt:'What is this?',
        passage: esc(paras[idx].text),
        options: shuffle([role, ...wrong]).map(r=>({ text:ROLE_NAME[r], ok:r===role })),
        note:'<b>' + ROLE_NAME[role] + '.</b> ' + ROLE_WHY[role]
      };
    }
  },
  join: {
    n:3, name:'Join', blurb:'Choose the linker the sentence actually needs.',
    build(){
      /* A real sentence from the corpus with its opening linker removed.
         The decoys are other linkers from master-data, so every option is
         plausible English — the question is which relation is being
         signalled, not which phrase exists. */
      let host=null, linker=null, guard=0;
      while(!host && guard++ < 60){
        const s = pick(SAMPLES), p = pick(s.paragraphs);
        for(const sent of sentencesOf(p.text)){
          const hit = LINKERS.find(l => sent.toLowerCase().startsWith(l.toLowerCase()));
          if(hit){ host = sent; linker = hit; break; }
        }
      }
      if(!host) return null;
      const stem = host.slice(linker.length).replace(/^[,\s]+/,'');
      const wrong = shuffle(LINKERS.filter(l=>l!==linker)).slice(0,3);
      return {
        kick:'Join \u00b7 cohesion',
        prompt:'Which linker?',
        passage:'<span class="blank">&nbsp;</span>, ' + esc(stem),
        options: shuffle([linker, ...wrong]).map(l=>({ text:l, ok:l===linker })),
        note:'<b>' + esc(linker) + '</b> is what the original uses. The linker names the relation between this sentence and the one before it \u2014 read that relation first, then choose.'
      };
    }
  },
  intruder: {
    n:4, name:'Intruder', blurb:'Spot the sentence that came from another essay.',
    build(){
      /* Three sentences from one paragraph and one from a different essay
         entirely. Coherence at its most concrete: the intruder is fluent,
         grammatical and on-topic-ish, and gives itself away only by not
         belonging to this thread. */
      let host=null, guard=0;
      while(guard++ < 40){
        const p = pick(pick(SAMPLES).paragraphs);
        const ss = sentencesOf(p.text);
        if(ss.length >= 3){ host = ss.slice(0,3); break; }
      }
      if(!host) return null;
      let alien=null, g2=0;
      while(!alien && g2++ < 40){
        const ss = sentencesOf(pick(pick(SAMPLES).paragraphs).text);
        const c = ss.find(x => !host.includes(x));
        if(c) alien = c;
      }
      if(!alien) return null;
      return {
        kick:'Intruder \u00b7 coherence',
        prompt:'Which does not belong?',
        passage:'',
        options: shuffle([...host.map(t=>({text:t,ok:false})), {text:alien, ok:true}]),
        note:'<b>The intruder is fluent English.</b> It gives itself away by breaking the thread \u2014 a new subject, or a reference to something this paragraph never mentioned.'
      };
    }
  }
};

/* ══ FLOW ══════════════════════════════════════════════════════════════ */
function gate(){
  mode = null;
  const cards = Object.entries(GAMES).map(([k,g]) => {
    const b = localStorage.getItem('intuity-wg-best-'+k);
    return '<button class="card" data-k="'+k+'">'+
      '<span class="dial"><span>'+g.n+'</span></span>'+
      '<h3>'+g.name+'</h3><p>'+g.blurb+'</p>'+
      '<div class="best">'+(b ? 'best streak '+b : 'not played')+'</div></button>';
  }).join('');
  $('stage').innerHTML =
    '<div class="poster gate"><div class="kick"><i></i>Writing \u00b7 four exercises</div>'+
    '<div class="prompt">Pick your ground</div>'+
    '<div class="grid">'+cards+'</div></div>';
  $('stage').querySelectorAll('.card').forEach(c =>
    c.onclick = () => { sfx('unlock'); startGame(c.dataset.k); });
}

function startGame(key){
  mode = key; score = 0; streak = 0; best = 0; round = 0;
  points = 0; maxPoints = ROUNDS * BASE_GAIN;
  paintHud(); nextRound();
}

function nextRound(){
  if(round >= ROUNDS) return summary();
  let q = null, guard = 0;
  while(!q && guard++ < 8) q = GAMES[mode].build();
  if(!q) return summary();
  round++;
  locked = false;

  $('stage').innerHTML =
    '<div class="poster">'+
      '<div class="kick"><i></i>'+q.kick+'</div>'+
      '<div class="prompt">'+q.prompt+'</div>'+
      (q.passage ? '<div class="passage">'+q.passage+'</div>' : '')+
      '<div class="slotline">Round <b>'+round+'</b> of <b>'+ROUNDS+'</b></div>'+
      '<div class="opts">'+ q.options.map((o,i)=>
        '<button class="opt" data-ok="'+(o.ok?1:0)+'" data-i="'+i+'">'+
        '<span class="n">'+String(i+1).padStart(2,'0')+'</span>'+
        '<span>'+esc(o.text)+'</span></button>').join('') +'</div>'+
      '<div class="note" id="note">'+q.note+'</div>'+
      '<div class="foot" id="foot"></div>'+
    '</div>';

  $('stage').querySelectorAll('.opt').forEach(b => b.onclick = () => answer(b));
}

function answer(btn){
  if(locked) return;
  locked = true;
  const ok = btn.dataset.ok === '1';
  const all = [...$('stage').querySelectorAll('.opt')];
  all.forEach(b => b.disabled = true);
  btn.classList.add(ok ? 'hit' : 'miss');
  /* On a miss the right answer is shown, not hidden: the point of the
     round is the noticing, and a student who never sees the answer learns
     only that they were wrong. */
  if(!ok) all.find(b => b.dataset.ok === '1').classList.add('show');
  award(ok);
  $('note').classList.add('on');
  $('foot').innerHTML = '<button class="btn" id="nx">'+(round>=ROUNDS?'Finish':'Next')+'</button>';
  $('nx').onclick = nextRound;
}

function summary(){
  const key = 'intuity-wg-best-'+mode;
  const prev = +(localStorage.getItem(key)||0);
  if(best > prev) localStorage.setItem(key, best);
  $('stage').innerHTML =
    '<div class="poster">'+
      '<div class="kick"><i></i>'+GAMES[mode].name+' \u00b7 done</div>'+
      '<div class="prompt">'+score+' points</div>'+
      '<div class="passage">Longest streak <b>'+best+'</b>'+
        (best > prev ? ' \u2014 a new best.' : (prev? ' \u00b7 your best is '+prev+'.' : '.'))+
      '</div>'+
      '<div class="foot">'+
        '<button class="btn" id="again">Again</button>'+
        '<button class="btn ghost" id="back">All four</button>'+
      '</div></div>';
  $('again').onclick = () => startGame(mode);
  $('back').onclick = gate;
  sfx(best > prev ? 'unlock' : 'correct');
}

/* ══ BOOT ══════════════════════════════════════════════════════════════ */
Promise.all([
  fetch(DATA_URL).then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP '+r.status))),
  fetch(MASTER_URL).then(r => r.ok ? r.json() : null).catch(() => null)
]).then(([corpus, master]) => {
  SAMPLES = (corpus.samples || []).filter(s => (s.paragraphs||[]).length >= 4);
  LINKERS = (master && master.linking_words) ? master.linking_words
          : ['However','Therefore','For example','In addition','This is because','As a result'];
  if(!SAMPLES.length) throw new Error('no samples');
  paintSound();
  gate();
}).catch(err => {
  $('stage').innerHTML = '<div class="msg">Could not load the essay corpus.<br>'+
    'Check your connection and reload.</div>';
  console.error(err);
});
</script>
