    if(on){ const pr=pills.getBoundingClientRect(), r=on.getBoundingClientRect(); pills.scrollBy({left:(r.left+r.width/2)-(pr.left+pr.width/2),behavior:RM?'auto':'smooth'}); }
  }
  $('mbStages').onclick=()=>{ if(view!=='stages'){ view='stages'; load(firstPlayable(si)); } };
  $('mbFull').onclick=()=>{ if(view!=='full'&&game!=='builder'){ view='full'; load(); } };

  function setHead(eyebrow,title,hideStars){ $('stepLabel').textContent=eyebrow; $('stageTitle').textContent=title; paintStars(hideStars); }
  function setActions(html){ $('cardActions').innerHTML=html; }

  /* ═══ LOAD — every entry point comes through here ═══ */
  let epoch=0;   // bumps on every load, so a stale async step never touches a new task
  function load(i){
    epoch++;
    if(typeof i==='number') si=i;
    closeSheet('sumSheet'); closeSheet('pickSheet');
    $('banner').classList.remove('on');
    stars=3;
    if(game==='builder'){ view='stages'; run=null; renderControls(); startStage(1); renderBuilder(); return; }
    if(view==='full'){
      run={full:true,k:0,starsLog:[]};
      renderControls();
      if(game==='sequence'){ startStage(1); renderParagraphOrder(); }
      else { startStage(stages.length); startParagraph(0); }
      return;
    }
    if(!playable(si)) si=firstPlayable(si);
    run={full:false,k:si,starsLog:[]};
    renderControls(); startStage(1); startParagraph(si);
  }
  function startParagraph(p){
    stars=3; run.k=p;
    const st=stages[p], n=stages.length;
    setHead((run.full?'Paragraph ':'Stage ')+(p+1)+' of '+n,st.label);
    $('cardBody').scrollTop=0;
    if(run.full) renderControls();
    if(game==='sequence') renderSequence(st);
    else if(game==='puzzle') renderPuzzle(st);
    else renderRecall(st);
  }
  async function paragraphDone(){
    const ep=epoch;
    run.starsLog.push(stars);
    cleared.add(game+':'+run.k);
    renderControls();
    if(run.full&&run.k<stages.length-1){
      await bannerMoment('Paragraph cleared',stages[run.k].label,stars);
      if(ep===epoch&&stageRunning) startParagraph(run.k+1);
      return;
    }
    if(ep===epoch) showSummary('win');
  }

  /* ═══ SEQUENCE — put the sentences of one paragraph in order ═══ */
  function reorderList(box,keys,html){
    const L={order:keys.slice(),locked:new Set(),els:new Map(),sel:null,busy:false,drag:null};
    keys.forEach(k=>{
      const el=document.createElement('div');
      el.className='tile'; el.tabIndex=0; el.dataset.k=k;
      el.setAttribute('aria-roledescription','sortable sentence');
      el.innerHTML='<div class="tx">'+html(k)+'</div><div class="grip" aria-hidden="true"><i></i><i></i><i></i></div>';
      L.els.set(k,el);
      makeDraggable(el,{
        canDrag:e=>!L.busy&&!L.locked.has(+e.dataset.k),
        onStart:(e,ph)=>{ if(L.sel!=null){ L.els.get(L.sel).classList.remove('sel'); L.sel=null; } L.drag={k:+e.dataset.k,ph}; },
        onDrop:()=>{ L.drag=null; },
        onMove:(e,ph,x,y)=>{
          const k=+e.dataset.k, yr=y-box.getBoundingClientRect().top;
          let target=0;
          L.order.forEach(q=>{ if(q===k) return; const c=L.els.get(q); if(c.offsetTop+c.offsetHeight/2<yr) target++; });
          moveTo(k,target);
        },
        onTap:e=>{
          const k=+e.dataset.k; if(L.busy||L.locked.has(k)) return;
          if(L.sel==null){ L.sel=k; e.classList.add('sel'); sfxPick(); return; }
          const a=L.sel; L.els.get(a).classList.remove('sel'); L.sel=null;
          if(a===k) return;
          swap(a,k); sfxDrop();
        }
      });
      el.addEventListener('keydown',ev=>{
        const k=+el.dataset.k; if(L.busy||L.locked.has(k)) return;
        if(ev.key!=='ArrowUp'&&ev.key!=='ArrowDown') return;
        ev.preventDefault();
        const pos=L.order.indexOf(k);
        const free=L.order.map((q,i)=>i).filter(i=>!L.locked.has(L.order[i]));
        const ni=free[free.indexOf(pos)+(ev.key==='ArrowUp'?-1:1)];
        if(ni==null) return;
        swap(k,L.order[ni]); el.focus();
      });
    });
    const nodeOf=k=>(L.drag&&L.drag.k===k)?L.drag.ph:L.els.get(k);
    function paint(){
      const nodes=L.order.map(nodeOf);
      flip(nodes.filter(n=>!n.classList.contains('ghost')),()=>nodes.forEach(n=>box.appendChild(n)));
    }
    function moveTo(k,slot){
      if(slot<0||slot>=L.order.length||L.locked.has(L.order[slot])) return;
      const free=L.order.map((q,i)=>i).filter(i=>!L.locked.has(L.order[i]));
      const freeKeys=free.map(i=>L.order[i]);
      const from=freeKeys.indexOf(k), to=free.indexOf(slot);
      if(from<0||to<0||from===to) return;
      freeKeys.splice(from,1); freeKeys.splice(to,0,k);
      const next=L.order.slice(); free.forEach((s,j)=>next[s]=freeKeys[j]);
      L.order=next; paint();
    }
    function swap(a,b){ const ia=L.order.indexOf(a), ib=L.order.indexOf(b); L.order[ia]=b; L.order[ib]=a; paint(); }
    L.order.forEach(k=>box.appendChild(L.els.get(k)));
    return L;
  }
  function derange(n){ let o; do{ o=shuffle([...Array(n).keys()]); }while(n>1&&o.every((v,i)=>v===i)); return o; }

  let SEQ=null;
  function renderSequence(st){
    $('cardBody').innerHTML='<p class="hint">'+(TOUCH?'Drag the sentences into order, or tap two to swap them.':'Drag the sentences into order, or click two to swap them.')+'</p><div class="rlist" id="rlist"></div>';
    SEQ={st,checks:0};
    SEQ.list=reorderList($('rlist'),derange(st.sents.length),k=>lightFrames(st.sents[k]));
    setActions('<button class="btn primary" id="seqCheck" type="button">Check order</button>');
    $('seqCheck').onclick=()=>checkOrder(false);
  }
  /* FULL TEXT · SEQUENCE — the paragraphs, not the sentences.
     Structure at the scale an examiner reads it; the opening words of each
     paragraph are the evidence, and the labels appear only once earned. */
  function renderParagraphOrder(){
    stars=3;
    setHead('Whole text','Paragraph order');
    $('cardBody').innerHTML='<p class="hint">Each card is one paragraph. Its opening words tell you where it belongs.</p><div class="rlist" id="rlist"></div>';
    SEQ={full:true,checks:0};
    SEQ.list=reorderList($('rlist'),derange(stages.length),k=>{
      const s=stages[k].sents, more=s.length-2;
      return '<span class="plabel">'+esc(stages[k].label)+'</span><span class="clamp">'+lightFrames(s.slice(0,2).join(' '))+'</span>'+
        (more>0?'<span class="more">+ '+more+' more sentence'+(more===1?'':'s')+'</span>':'');
    });
    setActions('<button class="btn primary" id="seqCheck" type="button">Check order</button>');
    $('seqCheck').onclick=()=>checkOrder(true);
  }
  async function checkOrder(full){
    const L=SEQ.list, btn=$('seqCheck'), ep=epoch;
    if(L.busy) return;
    L.busy=true; btn.disabled=true;
    if(L.sel!=null){ L.els.get(L.sel).classList.remove('sel'); L.sel=null; }
    const allRight=L.order.every((k,i)=>k===i);
    let newly=0;
    for(const [pos,k] of L.order.entries()){
      const el=L.els.get(k);
      if(k===pos&&!L.locked.has(k)){
        newly++; L.locked.add(k);
        el.classList.add('locked','lockin'); if(full) el.classList.add('named');
        sfxLock(newly-1); buzz(8);
        setTimeout(()=>el.classList.remove('lockin'),520);
        await wait(RM?0:120);
        if(ep!==epoch) return;
      } else if(k!==pos){
        el.classList.add('bad','shake'); setTimeout(()=>el.classList.remove('bad','shake'),650);
      }
    }
    const key=full?topicKey()+'|paragraph-order':topicKey()+'|'+SEQ.st.full+'|order';
    for(let j=0;j<newly;j++) registerHit();
    if(allRight){
      logItem(key,SEQ.checks===0);
      await wait(RM?0:420); if(ep!==epoch) return;
      if(full){
        run.starsLog=[stars];
        showWhole(stages,'The whole text, in order');
        confetti(90);
        await wait(RM?300:1500); if(ep!==epoch) return;
        showSummary('win');
      } else {
        showWhole([SEQ.st],'That reads well');
        confetti(45);
        await wait(RM?300:1300); if(ep!==epoch) return;
        paragraphDone();
      }
      return;
    }
    SEQ.checks++;
    registerMiss(full?'Paragraph order':SEQ.st.label+': sentence order');
    logItem(key,false); loseStar();
    btn.textContent=L.order.filter((k,i)=>k===i).length+' of '+L.order.length+' in place';
    await wait(1200); if(ep!==epoch) return;
    L.busy=false; btn.textContent='Check order'; btn.disabled=false;
  }

  function showWhole(list,msg){
    let d=0;
    const paras=list.map(st=>'<p>'+(list.length>1?'<span class="lab s" style="animation-delay:'+d+'ms">'+esc(st.label)+'</span>':'')+
      st.sents.map(s=>'<span class="s" style="animation-delay:'+(d+=RM?0:70)+'ms">'+lightFrames(s)+'</span>').join(' ')+'</p>').join('');
    $('cardBody').innerHTML='<div class="winline">'+checkIcon()+esc(msg)+'</div><div class="whole">'+paras+'</div>';
    $('cardBody').scrollTop=0;
    setActions('');
  }
  const checkIcon=()=>'<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="10" fill="currentColor"/><path d="M5.8 10.3l2.7 2.6 5.7-6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  /* the text rebuilt so far — earlier paragraphs of a full-text run */
  function sofarHTML(){
    if(!run||!run.full||run.k===0) return '';
    return '<div class="sofar">'+stages.slice(0,run.k).map(st=>'<p><span class="lab">'+esc(st.label)+'.</span> '+st.sents.map(lightFrames).join(' ')+'</p>').join('')+'</div>';
  }
  function appendBuilt(text){
    const b=$('built'); if(!b) return;
    if(b.childNodes.length) b.appendChild(document.createTextNode(' '));
    const s=document.createElement('span'); s.className='s fresh'; s.innerHTML=lightFrames(text); b.appendChild(s);
  }

  /* ═══ PUZZLE — rebuild each sentence from its pieces ═══
     Long sentences come apart at phrase boundaries, not word by word: a
     51-word report sentence is nine pieces, not fifty-one, and each piece
     is a chunk a writer actually reuses. */
  const PZ_BREAK=/(?<=,)\s+|\s+(?=(?:and|but|so|because|which|who|that|when|if|although|while|whereas|as|in|on|at|through|among|during|with|for|by|from|before|after|since|to|than)\b)/i;
  const wc=s=>s.split(/\s+/).length;
  function unitsOf(sent){
    const words=sent.split(/\s+/).filter(Boolean);
    if(words.length<=9) return words;
    let parts=[];
    sent.split(PZ_BREAK).filter(Boolean).forEach(p=>{
      if(parts.length&&wc(p)<=1&&!/,$/.test(parts[parts.length-1])) parts[parts.length-1]+=' '+p; else parts.push(p);
    });
    if(parts.length>1&&wc(parts[0])===1){ parts[1]=parts[0]+' '+parts[1]; parts.shift(); }
    while(parts.length>9){
      let bi=0,bn=Infinity;
      for(let i=0;i<parts.length-1;i++){ const n=wc(parts[i])+wc(parts[i+1]); if(n<bn){bn=n;bi=i;} }
      parts.splice(bi,2,parts[bi]+' '+parts[bi+1]);
    }
    if(parts.length<4){ parts=[]; for(let i=0;i<words.length;i+=3) parts.push(words.slice(i,i+3).join(' ')); }
    while(parts.length>9) parts.splice(parts.length-2,2,parts[parts.length-2]+' '+parts[parts.length-1]);
    return parts;
  }
  let PZ=null;
  function renderPuzzle(st){
    PZ={st,idx:0};
    $('cardBody').innerHTML=sofarHTML()+'<div class="built" id="built"></div>'+
      '<div class="line" id="line" data-empty="Tap or drag the pieces here"></div>'+
      '<div class="pool" id="pool"></div><p class="hint" id="pzHint" style="margin-top:6px"></p>';
    openPiece(0);
  }
  function openPiece(i){
    const st=PZ.st;
    Object.assign(PZ,{idx:i,units:unitsOf(st.sents[i]),lockN:0,tries:0,busy:false});
    const line=$('line'), pool=$('pool');
    line.innerHTML=''; pool.innerHTML=''; line.classList.remove('won');
    let order; do{ order=shuffle(PZ.units.map((_,k)=>k)); }while(order.length>1&&order.every((v,k)=>PZ.units[v]===PZ.units[k]));
    PZ.els=PZ.units.map((u,k)=>{
      const el=document.createElement('div'); el.className='chunk'; el.tabIndex=0; el.dataset.id=k; el.textContent=u;
      el.setAttribute('role','button');
      makeDraggable(el,{
        canDrag:e=>!PZ.busy&&!e.classList.contains('locked'),
        onMove:(e,ph,x,y)=>dragChunk(e,ph,x,y),
        onDrop:()=>afterChange(),
        onTap:e=>tapChunk(e)
      });
      el.addEventListener('keydown',ev=>{ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); tapChunk(el); }});
      return el;
    });
    order.forEach(k=>pool.appendChild(PZ.els[k]));
    hintPiece();
    setActions('<button class="btn tinted" id="pzClear" type="button">Clear line</button>');
    $('pzClear').onclick=clearLine;
  }
  const lineCount=()=>[...$('line').children].filter(c=>!c.classList.contains('ghost')&&!c.classList.contains('dragsrc')).length;
  function hintPiece(){
    const left=PZ.units.length-lineCount();
    $('pzHint').innerHTML='Sentence <b>'+(PZ.idx+1)+'</b> of '+PZ.st.sents.length+' · '+(left?left+' piece'+(left===1?'':'s')+' left':'checking…');
  }
  function tapChunk(el){
    if(PZ.busy||el.classList.contains('locked')) return;
    const line=$('line'), pool=$('pool');
    flip(PZ.els,()=>{ (el.parentNode===pool?line:pool).appendChild(el); });
    sfxDrop(); afterChange();
  }
  function dragChunk(el,ph,x,y){
    const line=$('line'), pool=$('pool'), lr=line.getBoundingClientRect();
    const others=PZ.els.filter(c=>c!==el);
    if(y>=lr.top-16&&y<=lr.bottom+10){
      const kids=[...line.children].filter(c=>c!==el&&c!==ph);
      let before=null;
      for(const c of kids){
        const r=c.getBoundingClientRect();
        if(y<r.top){ before=c; break; }
        if(y<=r.bottom&&x<r.left+r.width/2){ before=c; break; }
      }
      const nLocked=kids.filter(c=>c.classList.contains('locked')).length;
      if(before&&before.classList.contains('locked')) before=kids[nLocked]||null;
      if(ph.parentNode===line&&(ph.nextElementSibling===before||(before===null&&(!ph.nextElementSibling||ph.nextElementSibling===el)))) return;
      flip(others,()=>{ before?line.insertBefore(ph,before):line.appendChild(ph); },300);
    } else if(ph.parentNode===line&&y>lr.bottom+10){
      flip(others,()=>pool.appendChild(ph),300);
    }
  }
  function afterChange(){
    hintPiece();
    clearTimeout(PZ.t);
    if(lineCount()===PZ.units.length) PZ.t=setTimeout(checkPiece,340);
  }
  function clearLine(){
    if(PZ.busy) return;
    const line=$('line'), pool=$('pool');
    flip(PZ.els,()=>[...line.children].filter(c=>!c.classList.contains('locked')).forEach(c=>pool.appendChild(c)));
    hintPiece();
  }
  async function checkPiece(){
    const line=$('line'), pool=$('pool'), ep=epoch; if(!line||PZ.busy) return;
    const kids=[...line.children];
    if(kids.length!==PZ.units.length||document.querySelector('.chunk.ghost,.chunk.dragsrc')) return;
    PZ.busy=true;
    let pre=0; while(pre<kids.length&&kids[pre].textContent===PZ.units[pre]) pre++;
    const key=topicKey()+'|'+PZ.st.full+'|s'+PZ.idx;
    if(pre===kids.length){
      kids.forEach((c,i)=>{ c.classList.add('locked','wave'); c.style.animationDelay=(RM?0:i*45)+'ms'; });
      line.classList.add('won'); sfxLock(0); setTimeout(()=>sfxLock(2),110); setTimeout(()=>sfxLock(4),220); buzz(12);
      registerHit(); logItem(key,PZ.tries===0);
      $('pzHint').innerHTML='Sentence <b>'+(PZ.idx+1)+'</b> of '+PZ.st.sents.length+' · done';
      await wait(RM?100:760); if(ep!==epoch) return;
      appendBuilt(PZ.st.sents[PZ.idx]);
      const next=PZ.idx+1;
      if(next<PZ.st.sents.length){ openPiece(next); }
      else { $('line').remove(); $('pool').remove(); $('pzHint').textContent=''; setActions(''); await wait(RM?100:500); if(ep===epoch) paragraphDone(); }
      return;
    }
    PZ.tries++;
    registerMiss(PZ.st.label+', sentence '+(PZ.idx+1)+': “'+PZ.st.sents[PZ.idx]+'”');
    logItem(key,false); loseStar();
    for(let i=PZ.lockN;i<pre;i++){ kids[i].classList.add('locked'); sfxLock(i-PZ.lockN); }
    PZ.lockN=pre;
    const wrong=kids.slice(pre);
    wrong.forEach(c=>c.classList.add('bad','shake'));
    await wait(RM?50:540); if(ep!==epoch) return;
    wrong.forEach(c=>c.classList.remove('bad','shake'));
    flip(PZ.els,()=>shuffle(wrong).forEach(c=>pool.appendChild(c)),420);
    PZ.busy=false;
    $('pzHint').innerHTML=pre?'The first <b>'+pre+'</b> piece'+(pre===1?' is':'s are')+' right and locked. The rest went back.':'The first piece was wrong, so every piece went back.';
  }

  /* ═══ STORYBOARD — read it, it vanishes, bring it back ═══
     Not every word: the linking frames and the longer content words — the
     language a B2 writer is marked on. Short function words stay printed,
     so this is memory for structure and vocabulary, not a typing test on
     a phone keyboard. */
  const STOP=new Set(('a an the and or but so of to in on at by for with from as is are was were be been being it its '+
    'this that these those there their they them he she his her we our you your i my me not no do does did have has had '+
    'will would can could should may might must than then very also into over such which who whom whose what when where '+
    'while if because about more most some any all each other only just many much even well both one own').split(' '));
  const normW=w=>String(w||'').toLowerCase().replace(/[’‘`´]/g,"'").replace(/[^a-z0-9']/g,'');
  function pickBlanks(tokens){
    const clean=tokens.map(normW), chosen=new Set();
    FRAMES.forEach(f=>{ const fw=f.toLowerCase().split(' ').map(normW);
      for(let i=0;i+fw.length<=clean.length;i++){ if(fw.every((w,j)=>clean[i+j]===w)){ fw.forEach((_,j)=>chosen.add(i+j)); break; } } });
    const cap=Math.max(1,Math.min(8,Math.round(tokens.length*.34)));
    const cands=tokens.map((t,i)=>i).filter(i=>!chosen.has(i)&&clean[i].length>=5&&!STOP.has(clean[i])&&!(i>0&&/^[A-Z]/.test(tokens[i])))
      .sort((a,b)=>clean[b].length-clean[a].length);
    for(const i of cands){ if(chosen.size>=cap) break; chosen.add(i); }
    if(!chosen.size){ let bi=0; clean.forEach((w,i)=>{ if(w.length>clean[bi].length) bi=i; }); chosen.add(bi); }
    return chosen;
  }
  let RC=null, rcTok=0;
  function renderRecall(st){
    RC={st,idx:0};
    $('cardBody').innerHTML=sofarHTML()+'<div class="built" id="built"></div><div class="readbox" id="readbox"></div><p class="hint" id="rcHint" style="margin-top:12px"></p>';
    openRecall(0);
  }
  function openRecall(i){
    const tokens=RC.st.sents[i].split(/\s+/).filter(Boolean);
    Object.assign(RC,{idx:i,tokens,blanks:pickBlanks(tokens),found:new Set(),given:new Set(),typed:{},tries:0,reads:0,phase:'read',early:0});
    startRead();
  }
  function startRead(){
    RC.phase='read'; RC.reads++;
    const secs=Math.max(4,Math.round(RC.tokens.length*.55)+1);
    RC.readMs=secs*1000; RC.readEnd=performance.now()+RC.readMs;
    const C=2*Math.PI*17, tok=++rcTok;
    $('readbox').innerHTML='<div class="readhead"><span>Sentence '+(RC.idx+1)+' of '+RC.st.sents.length+' · read it</span>'+
      '<div class="ring" id="ring"><svg viewBox="0 0 40 40" aria-hidden="true"><circle class="trk" cx="20" cy="20" r="17"/><circle class="arc" id="arc" cx="20" cy="20" r="17" stroke-dasharray="'+C+'" stroke-dashoffset="0"/></svg><b id="ringN">'+secs+'</b></div></div>'+
      '<div class="rsent" id="rsent">'+RC.tokens.map((t,k)=>'<span class="rw'+(RC.blanks.has(k)?' target':'')+'">'+esc(t)+'</span>').join(' ')+'</div>';
    $('rcHint').innerHTML='The underlined words will disappear. Tap <b>I’ve got it</b> early for a quick-read bonus.';
    setActions('<button class="btn primary" id="rcReady" type="button">I’ve got it</button>');
    $('rcReady').onclick=()=>endRead(true);
    let last=-1;
    (function f(t){
      if(!RC||RC.phase!=='read'||tok!==rcTok) return;
      const arc=$('arc'); if(!arc) return;
      const left=Math.max(0,RC.readEnd-t), s=Math.ceil(left/1000);
      arc.setAttribute('stroke-dashoffset',String(C*(1-left/RC.readMs)));
      $('ringN').textContent=s; $('ring').classList.toggle('warn',s<=2);
      if(s!==last){ if(s<=3&&s>0) sfxTick(); last=s; }
      if(left<=0){ endRead(false); return; }
      requestAnimationFrame(f);
    })(performance.now());
  }
  async function endRead(early){
    if(RC.phase!=='read') return;
    const ep=epoch;
    RC.phase='vanish';
    if(early&&RC.reads===1) RC.early=Math.max(0,Math.ceil((RC.readEnd-performance.now())/1000));
    setActions('');
    const ws=[...document.querySelectorAll('#rsent .rw.target')];
    noise(.35,.04,now(),true);
    ws.forEach((w,i)=>setTimeout(()=>w.classList.add('gone'),RM?0:i*55));
    await wait(RM?60:ws.length*55+380); if(ep!==epoch) return;
    paintRecall(true);
  }
  function paintRecall(focusFirst){
    RC.phase='recall';
    const settled=k=>RC.found.has(k)||RC.given.has(k);
    $('readbox').innerHTML='<div class="readhead"><span>Sentence '+(RC.idx+1)+' of '+RC.st.sents.length+' · bring it back</span></div>'+
      '<div class="rsent" id="rsent">'+RC.tokens.map((t,k)=>{
        if(!RC.blanks.has(k)) return '<span class="rw">'+esc(t)+'</span>';
        if(RC.found.has(k)) return '<span class="rw ok">'+esc(t)+'</span>';
        if(RC.given.has(k)) return '<span class="rw given">'+esc(t)+'</span>';
        const w=Math.max(3,Math.min(10,normW(t).length*.62+1.4));
        const ph=RC.tries>=2?esc(normW(t).charAt(0)):'';
        return '<input class="blank" data-k="'+k+'" style="width:'+w+'em" value="'+esc(RC.typed[k]||'')+'" placeholder="'+ph+'" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="next" aria-label="Missing word">';
      }).join(' ')+'</div>';
    [...document.querySelectorAll('#rsent .blank')].forEach(inp=>{
      const k=+inp.dataset.k;
      inp.addEventListener('input',()=>{
        RC.typed[k]=inp.value; inp.classList.remove('bad');
        if(normW(inp.value)&&normW(inp.value)===normW(RC.tokens[k])) acceptWord(inp,k);
      });
      inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); const all=[...document.querySelectorAll('#rsent .blank')], j=all.indexOf(inp); if(all[j+1]) all[j+1].focus(); else checkRecall(); } });
    });
    const open=[...RC.blanks].filter(k=>!settled(k)).length;
    $('rcHint').innerHTML=open?('<b>'+open+'</b> word'+(open===1?'':'s')+' to bring back.'+(RC.tries>=2?' First letters are showing.':'')):'';
    setActions('<button class="btn tinted narrow" id="rcAgain" type="button" '+(RC.reads<3?'':'disabled')+'>Show again<span class="cost">−<svg viewBox="0 0 24 24" aria-label="one star">'+STAR+'</svg></span></button>'+
      '<button class="btn primary" id="rcCheck" type="button">Check</button>');
    $('rcAgain').onclick=()=>{ if(RC.reads>=3||RC.phase!=='recall') return; loseStar(); registerMiss(null); startRead(); };
    $('rcCheck').onclick=checkRecall;
    const first=document.querySelector('#rsent .blank');
    if(focusFirst&&first) first.focus({preventScroll:true});
  }
  function acceptWord(inp,k){
    RC.found.add(k);
    const span=document.createElement('span'); span.className='rw ok pop'; span.textContent=RC.tokens[k];
    const all=[...document.querySelectorAll('#rsent .blank')], j=all.indexOf(inp);
    inp.replaceWith(span); sfxLock(RC.found.size%6); buzz(6);
    const rest=all.filter(x=>x!==inp), nxt=rest[j]||rest[0];
    const open=[...RC.blanks].filter(q=>!RC.found.has(q)&&!RC.given.has(q)).length;
    $('rcHint').innerHTML=open?'<b>'+open+'</b> word'+(open===1?'':'s')+' to bring back.':'';
    if(!open) completeRecall(); else if(nxt) nxt.focus({preventScroll:true});
  }
  function checkRecall(){
    if(RC.phase!=='recall') return;
    const open=[...RC.blanks].filter(k=>!RC.found.has(k)&&!RC.given.has(k));
    if(!open.length){ completeRecall(); return; }
    RC.tries++;
    registerMiss(RC.st.label+', sentence '+(RC.idx+1)+': '+open.map(k=>'“'+RC.tokens[k].replace(/[^\w'’-]/g,'')+'”').join(', '));
    logItem(topicKey()+'|'+RC.st.full+'|s'+RC.idx,false); loseStar();
    if(RC.tries>=3){
      open.forEach(k=>RC.given.add(k));
      paintRecall(false); setActions('');
      $('rcHint').innerHTML='Three checks used. The missing words are shown in grey.';
      RC.phase='shown';
      setTimeout(()=>{ if(RC.phase==='shown') completeRecall(true); },1600);
      return;
    }
    document.querySelectorAll('#rsent .blank').forEach(inp=>{ inp.classList.add('bad','shake'); setTimeout(()=>inp.classList.remove('shake'),450); });
    if(RC.tries===2) setTimeout(()=>{ if(RC.phase==='recall') paintRecall(true); },520);
    $('rcHint').innerHTML=RC.tries===1?'Not yet. One more check, then the first letters appear.':'First letters are coming up.';
  }
  async function completeRecall(force){
    if(RC.phase==='done'||(RC.phase!=='recall'&&!force)) return;
    const ep=epoch;
    RC.phase='done'; setActions('');
    if(!RC.given.size){
      registerHit();
      if(RC.tries===0) logItem(topicKey()+'|'+RC.st.full+'|s'+RC.idx,true);
      if(RC.tries===0&&RC.reads===1&&RC.early) bonus(RC.early*20,'quick read');
    }
    await wait(RM?100:620); if(ep!==epoch) return;
    appendBuilt(RC.st.sents[RC.idx]);
    const next=RC.idx+1;
    if(next<RC.st.sents.length) openRecall(next);
    else { $('readbox').remove(); $('rcHint').textContent=''; await wait(RM?100:450); if(ep===epoch) paragraphDone(); }
  }

  /* ═══ BUILDER — a paragraph from moves ═══ */
  const BD_MOVES=[{k:'reason',label:'Reason',hint:'Why it is so'},{k:'example',label:'Example',hint:'Show it happening'},
    {k:'result',label:'Result',hint:'What follows'},{k:'compare',label:'Compare',hint:'Set it beside something'},{k:'contrast',label:'Contrast',hint:'The other side'}];
  let bdData=null, bdTopic=0, bdPick={}, bdOpen='', bdLast=null;
  const bdStars=n=>n>=4?3:n>=3?2:n>=2?1:0;
  function renderBuilder(){
    setHead('Build a paragraph','Builder');
    if(!bdData){
      stars=0; paintStars(false);
      $('cardBody').innerHTML='<p class="hint">Loading topics…</p>'; setActions('');
      fetch('/skills/writing/games/data/master-data.json').then(r=>{ if(!r.ok) throw 0; return r.json(); }).then(d=>{
        bdData=d; bdTopic=Math.floor(Math.random()*(d.topics||[]).length); bdNewTopic(false); if(game==='builder') paintBuilder();
      }).catch(()=>{ $('cardBody').innerHTML='<p class="hint">The builder topics didn’t load. Reload the page to try again.</p>'; });
      return;
    }
    paintBuilder();
  }
  function bdNewTopic(advance){
    if(advance){ let n=bdTopic; while(n===bdTopic&&bdData.topics.length>1) n=Math.floor(Math.random()*bdData.topics.length); bdTopic=n; }
    bdPick={}; bdLast=null;
    const pool=[]; Object.values(bdData.openers||{}).forEach(a=>pool.push(...a));
    bdOpen=pool.length?pool[Math.floor(Math.random()*pool.length)]:'';
  }
  function bdLight(t){
    let out=esc(t);
    (bdData.linking_words||[]).forEach(w=>{ const re=new RegExp('\\b('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')\\b','i'); out=out.replace(re,'<span class="frame">$1</span>'); });
    return out;
  }
  function bdBase(){
    let base=bdData.topics[bdTopic].base||'';
    if(/that\s*$/i.test(bdOpen)) base=base.charAt(0).toLowerCase()+base.slice(1);
    return {open:bdOpen,base};
  }
  function paintBuilder(){
    const t=bdData.topics[bdTopic], chosen=BD_MOVES.filter(m=>bdPick[m.k]!=null), b=bdBase();
    const before=stars; stars=bdStars(chosen.length); paintStars(false);
    if(stars>before){ const el=$('stars').children[stars-1]; if(el&&!RM) el.animate([{transform:'scale(.2)'},{transform:'scale(1.3)'},{transform:'scale(1)'}],{duration:450,easing:'cubic-bezier(.2,1.4,.4,1)'}); }
    $('stageTitle').textContent=t.title;
    $('cardBody').innerHTML=
      '<div class="bd-para"><span class="open">'+esc(b.open)+'</span> '+esc(b.base)+
        chosen.map(m=>' <span class="'+(m.k===bdLast?'add':'')+'">'+bdLight(t[m.k][bdPick[m.k]])+'</span>').join('')+'</div>'+
      '<div class="gauge"><div class="tk">'+BD_MOVES.map((m,i)=>'<i class="'+(i<chosen.length?'on':'')+(bdLast&&i===chosen.length-1?' new':'')+'"></i>').join('')+'</div>'+
        '<span>'+chosen.length+' of 5 moves</span></div>'+
      '<p class="hint">Develop the idea. Two moves earn a star, three earn two, four or more earn all three.</p>'+
      '<div class="group">'+BD_MOVES.map(m=>{
        const on=bdPick[m.k]!=null;
        return '<button class="row'+(on?' on':'')+'" type="button" data-m="'+m.k+'"><span class="k">'+m.label+'</span>'+
          '<span class="v">'+(on?bdLight(t[m.k][bdPick[m.k]]):esc(m.hint))+'</span>'+
          '<svg class="chev" viewBox="0 0 8 14" aria-hidden="true"><path d="M1 1l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>';
      }).join('')+'</div>';
    document.querySelectorAll('.row[data-m]').forEach(r=>r.onclick=()=>openPick(r.dataset.m));
    setActions('<button class="btn tinted narrow" id="bdNew" type="button">New topic</button>'+
      '<button class="btn primary" id="bdDone" type="button" '+(chosen.length?'':'disabled')+'>Finish paragraph</button>');
    $('bdNew').onclick=()=>{ bdNewTopic(true); stars=0; startStage(1); paintBuilder(); };
    $('bdDone').onclick=finishBuilder;
  }
  function openPick(k){
    const m=BD_MOVES.find(x=>x.k===k), opts=bdData.topics[bdTopic][k]||[];
    $('pickTitle').textContent=m.label; $('pickHint').textContent=m.hint+'. Choose one.';
    const box=$('pickOpts'); box.innerHTML='';
    opts.forEach((o,i)=>{
      const b=document.createElement('button'); b.type='button';
      b.className='opt'+(bdPick[k]===i?' chosen':''); b.innerHTML=bdLight(o);
      b.onclick=()=>{
        const isNew=bdPick[k]==null; bdPick[k]=i; bdLast=k; closeSheet('pickSheet');
        setTimeout(()=>{ paintBuilder(); if(isNew) registerHit(); },220);
      };
      box.appendChild(b);
    });
    if(bdPick[k]!=null){
      const r=document.createElement('button'); r.type='button'; r.className='opt remove'; r.textContent='Remove this move';
      r.onclick=()=>{ delete bdPick[k]; bdLast=null; closeSheet('pickSheet'); setTimeout(paintBuilder,220); };
      box.appendChild(r);
    }
    openSheet('pickSheet');
  }
  function finishBuilder(){
    const chosen=BD_MOVES.filter(m=>bdPick[m.k]!=null), t=bdData.topics[bdTopic], b=bdBase();
    stars=bdStars(chosen.length);
    run={full:false,k:0,starsLog:[stars]};
    const para=[b.open+' '+b.base].concat(chosen.map(m=>t[m.k][bdPick[m.k]]));
    $('cardBody').innerHTML='<div class="winline">'+checkIcon()+'Your paragraph</div><div class="whole"><p>'+
      para.map((s,i)=>'<span class="s" style="animation-delay:'+(RM?0:i*120)+'ms">'+bdLight(s)+'</span>').join(' ')+'</p></div>';
    setActions('');
    if(stars>=2) confetti(60);
    const ep=epoch; setTimeout(()=>{ if(ep===epoch) showSummary('win'); },900);
  }

  /* ═══ SHEETS ═══ */
  function openSheet(id){ const s=$(id); s.classList.add('on'); requestAnimationFrame(()=>requestAnimationFrame(()=>s.classList.add('show'))); }
  function closeSheet(id){ const s=$(id); if(!s.classList.contains('on')) return; s.classList.remove('show'); setTimeout(()=>{ if(!s.classList.contains('show')) s.classList.remove('on'); },RM?0:320); }
  $('pickSheet').addEventListener('click',e=>{ if(e.target.id==='pickSheet') closeSheet('pickSheet'); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSheet('pickSheet'); });

  let sumAction='next';
  async function showSummary(outcome){
    pauseClock();
    const ep=epoch, win=outcome==='win';
    win?sfxWin():sfxLoss();
    let earned=0;
    if(win) earned=(run&&run.full&&game!=='sequence')
      ? Math.round(run.starsLog.reduce((a,b)=>a+b,0)/Math.max(1,run.starsLog.length))
      : stars;
    const [letter,word]=grade();
    const gname=GAMES.find(g=>g.id===game).nm;
    const title=game==='builder'?((bdData&&bdData.topics[bdTopic].title)||'Builder'):(run&&run.full?(game==='sequence'?'Paragraph order':'The whole text'):((stages[run?run.k:si]||{}).label||''));
    $('sumKick').textContent=win?(run&&run.full?'Text complete':'Stage cleared'):'Time’s up';
    $('sumKick').classList.toggle('loss',!win);
    $('sumTitle').textContent=title+' · '+gname;
    $('sumStars').innerHTML=[0,1,2].map(()=>starSVG()).join('');
    $('sumStars').setAttribute('aria-label',earned+' of 3 stars');
    $('sumGrade').textContent=win?letter:'—';
    $('sumStats').innerHTML=(game==='builder')
      ?'<div><b>'+BD_MOVES.filter(m=>bdPick[m.k]!=null).length+'</b><span>moves</span></div><div><b>'+stageBestCombo+'</b><span>best streak</span></div><div><b>'+earned+'/3</b><span>stars</span></div>'
      :'<div><b>'+stageHits+'</b><span>right</span></div><div><b>'+stageMisses+'</b><span>slips</span></div><div><b>'+stageBestCombo+'</b><span>best streak</span></div>';
    const m=missLog.filter(Boolean), mm=$('sumMissed');
    if(m.length){ mm.hidden=false; mm.innerHTML='<h4>Worth another look</h4>'+m.slice(0,4).map(x=>'<p>'+esc(x)+'</p>').join(''); }
    else mm.hidden=true;
    $('sumNote').textContent=win?word:'The clock ran out before the task was finished.';
    if(game==='builder') sumAction='topic';
    else if(!win) sumAction='again';
    else if(run&&run.full) sumAction='text';
    else sumAction=nextStageIndex()==null?'full':'next';
    $('sumNext').textContent={topic:'New topic',again:'Try again',text:'New text',full:'Try the full text',next:'Next stage'}[sumAction];
    $('sumAgain').style.display=(sumAction==='again')?'none':'';
    $('sumScore').textContent='0';
    openSheet('sumSheet');
    try{ if(window.INTUITY) INTUITY.session('writing-'+type,game,{view,stars:earned,score:stageScore,hits:stageHits,misses:stageMisses}); }catch(e){}
    await wait(RM?0:420); if(ep!==epoch) return;
    const svgs=$('sumStars').children;
    for(let i=0;i<earned;i++){ svgs[i].classList.add('drop'); sfxStar(i); buzz(10); await wait(RM?0:280); if(ep!==epoch) return; }
    countUp($('sumScore'),stageScore,900);
    if(win&&earned===3) confetti(160);
  }
  function countUp(el,to,ms){
    if(RM||!to){ el.textContent=to; return; }
    const t0=performance.now();
    (function f(t){ const p=Math.min(1,(t-t0)/ms); el.textContent=Math.round(to*(1-Math.pow(1-p,3))); if(p<1) requestAnimationFrame(f); })(t0);
  }
  function nextStageIndex(){ for(let i=si+1;i<stages.length;i++) if(playable(i)) return i; return null; }
  $('sumAgain').onclick=()=>{ if(game==='builder'){ closeSheet('sumSheet'); stars=0; startStage(1); paintBuilder(); } else load(); };
  $('sumNext').onclick=()=>{
    if(sumAction==='topic'){ closeSheet('sumSheet'); bdNewTopic(true); stars=0; startStage(1); paintBuilder(); return; }
    if(sumAction==='again'){ load(); return; }
    if(sumAction==='text'){ closeSheet('sumSheet'); $('newTextBtn').click(); return; }
    if(sumAction==='full'){ view='full'; load(); return; }
    load(nextStageIndex());
  };

  /* ═══ HUD wiring and boot ═══ */
  document.querySelectorAll('#timerModes .mbtn').forEach(b=>{
    b.classList.toggle('on',b.dataset.m===timerMode);
    b.onclick=()=>{ timerMode=b.dataset.m; localStorage.setItem('intuity-writing-timer',timerMode);
      document.querySelectorAll('#timerModes .mbtn').forEach(x=>x.classList.toggle('on',x.dataset.m===timerMode));
      if(DATASET) load(); };
  });
  $('muteBtn').onclick=()=>setMute(!soundOn);
  setMute(soundOn);

  const params=new URLSearchParams(location.search);
  const g=params.get('game'); if(g&&GAMES.some(x=>x.id===g)) game=g;
  if(params.get('view')==='full') view='full';
  renderGames();
  const urlType=params.get('type');
  chooseType((urlType&&DATA[urlType])?urlType:'essays');
})();
</script>
</body>
</html>
