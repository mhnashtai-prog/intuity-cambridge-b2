<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>INTUITY — Essay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..900&family=Geist+Mono:wght@400..600&family=Space+Grotesk:wght@700&family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=20261105">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   WRITING — THE GATE (25 Oct 2026, Essay first)

   The same object as the Speaking gate: the shell's pendulum, nothing
   redrawn. A student arriving at a task makes ONE decision here — quick
   revision, work on a question, or the Model Generator — so the slide
   behind the first door no longer has to advertise the other two. Each
   dial carries a one-line promise, because a 14-year-old choosing between
   "revision" and "a question" needs to know what is behind each.
   Every "← back" in the journey returns here (sessionStorage).
   ═══════════════════════════════════════════════════════════════════════ */
:root{
  --accent:#DD8E58; --accent-ink:#9A5A2C;
  --mark-sweep:#708A81; --mark-rest:#4A433D; --mark-core:#201E1C; --mark-ink:#E5D1B8; --mark-pct:100%;
  --dial:clamp(92px,21vw,128px);
}
.header{position:sticky}
.header::after{display:none}
body{min-height:100dvh;display:flex;flex-direction:column}
.gate{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:1.5rem var(--gutter,16px) 3rem}
/* centred when it fits, top-aligned when it does not: justify-content:center
   pushed the Start here ring under the header on a phone (7 Nov 2026) */
.gate::before,.gate::after{content:'';flex:1 1 0}
.dials{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:clamp(2.2rem,7vh,3.6rem) clamp(1.6rem,7vw,4.5rem);max-width:820px}
.four .dials{max-width:560px}
.dial-b{display:flex;flex-direction:column;align-items:center;gap:.75rem;width:clamp(150px,30vw,210px);
  border:none;background:none;padding:0;cursor:pointer;font:inherit;color:inherit;text-decoration:none}
.dial-b .pend-hang{display:block;width:var(--dial);height:var(--dial);will-change:transform;backface-visibility:hidden;
  animation:pendCalm 5.2s cubic-bezier(.37,0,.63,1) infinite}
@keyframes pendCalm{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@media(prefers-reduced-motion:reduce){ .dial-b .pend-hang{animation:none;transform:rotate(0)} }
.dial-b .pend-dial span{font-size:calc(var(--dial) * .3)}
.dial-name{font-family:var(--f-display);font-size:.95rem;font-weight:700;letter-spacing:.01em;color:var(--ink,#232C31);transition:color .15s}
.dial-promise{font-size:.8rem;line-height:1.35;color:var(--dim,#5C5852);text-align:center;margin-top:-.35rem}
.dial-b:hover .dial-name,.dial-b:focus-visible .dial-name{color:var(--accent-ink)}
.dial-b:focus-visible{outline:none}
.dial-b:focus-visible .pend-hang{outline:2px solid var(--accent-ink);outline-offset:7px;border-radius:50%}
.dial-b:active .pend-hang{transform:scale(.95)}
/* a phone held sideways: one row of three */
@media (max-height:520px) and (orientation:landscape){
  :root{--dial:84px}
  .gate{padding:.6rem 16px 1rem}
  .dials{flex-wrap:nowrap;gap:2rem}
}
/* optional: watch a short presentation before choosing a door */
.watch{display:inline-flex;align-items:center;gap:.5rem;margin:.6rem 0 clamp(3.6rem,10vh,5.2rem);padding:.45rem .95rem .45rem .5rem;
  border:1.5px solid rgba(20,17,14,.18);border-radius:999px;background:none;color:var(--ink,#232C31);text-decoration:none;font:600 .85rem/1 var(--f-body)}
.watch[hidden]{display:none}   /* tasks without clips (Story) show nothing, not an empty ring */
.watch i{width:1.45rem;height:1.45rem;border-radius:50%;background:#8AA79C;display:grid;place-items:center;flex:none}
.watch i::after{content:"";margin-left:2px;border-left:6px solid #fff;border-top:4px solid transparent;border-bottom:4px solid transparent}
.watch span{font:500 .72rem/1 var(--f-mono);letter-spacing:.06em;color:var(--dim,#5C5852)}
/* Start here (5 Nov, Michael): the clip is a pendulum like the doors, rimmed in
   caramel like the Ultimate Challenge on the menu, so the first thing to watch
   looks like the first door, and is still only a link. */
.watch{display:flex;flex-direction:column;align-items:center;gap:.6rem;width:auto;margin:0 0 clamp(2.8rem,7vh,3.8rem);padding:0;
  border:0;border-radius:0;background:none;text-align:center;--mark-sweep:#C2956E;--mark-rest:#C2956E}
.watch .pend-hang{display:block;width:var(--dial);height:var(--dial);animation:pendCalm 5.2s cubic-bezier(.37,0,.63,1) infinite;animation-delay:-1.3s}
@media(prefers-reduced-motion:reduce){ .watch .pend-hang{animation:none} }
.watch .pend-dial span{width:0;height:0;border-left:calc(var(--dial) * .17) solid var(--mark-ink);border-top:calc(var(--dial) * .1) solid transparent;
  border-bottom:calc(var(--dial) * .1) solid transparent;margin-left:calc(var(--dial) * .05)}
.watch .w-n{font-family:var(--f-display);font-size:.95rem;font-weight:700;letter-spacing:.01em;color:var(--ink,#232C31)}
.watch .w-p{font:400 .8rem/1.35 var(--f-body);letter-spacing:0;color:var(--dim,#5C5852);margin-top:-.35rem;max-width:24ch}
.watch:hover .w-n,.watch:focus-visible .w-n{color:var(--accent-ink)}
</style>
<script src="/tools/be2-brand.js?v=20261111"></script>
<script src="/skills/grammar-rules/intuity-sound.js"></script>
<style>
/* THE STAGE PAGES' HEADER (7 Nov 2026), Essay first: "ESSAY · PART 1 ▾" opens
   the task list, a sound switch where the level chip was, the same as on
   Question, Plan, Model and Sample, so nothing changes as you step in */
.g-pick{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;margin-top:2px;padding:3px 6px 3px 8px;border-radius:8px;
  font:600 .6875rem/1.2 var(--f-display,'Geist',system-ui,sans-serif);letter-spacing:.2em;text-transform:uppercase;color:#4A443E}
.g-pick::after{content:'';flex:none;width:5px;height:5px;margin:-3px 2px 0 0;border-right:1.5px solid #8A8378;border-bottom:1.5px solid #8A8378;transform:rotate(45deg)}
.g-pick:active{background:rgba(20,17,14,.06)}.g-pick:focus-visible{outline:2px solid #B0865C;outline-offset:2px}
.g-mute{all:unset;cursor:pointer;justify-self:end;padding:8px;line-height:0;color:var(--ink,#232C31);opacity:.8}
.g-mute.off{opacity:.4}
.g-bg{position:fixed;inset:0;z-index:90;background:rgba(20,17,14,.35)}
.g-sheet{position:fixed;left:0;right:0;bottom:0;z-index:91;background:#FAF8F5;border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px rgba(20,17,14,.18)}
.g-sheet h3{margin:4px 0 10px;font:500 .6875rem/1 'Geist Mono',ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase;color:#8A8378}
.g-sheet div{display:flex;flex-wrap:wrap;gap:8px}
.g-opt{all:unset;cursor:pointer;padding:10px 14px;border-radius:999px;background:rgba(20,17,14,.06);font:500 .9rem/1 var(--f-body,'Geist',system-ui,sans-serif);color:#14110E}
.g-opt.on{background:#14110E;color:#FAF8F5}
/* Start here and Essentials, side by side, the two doors outside the numbers */
.tops{display:flex;justify-content:center;align-items:flex-start;gap:clamp(1.6rem,7vw,4.5rem);margin:0 0 clamp(2.8rem,7vh,3.8rem)}
.tops .watch{margin:0;width:clamp(150px,30vw,210px)}
.ess2 .pend-hang{animation-delay:-3.1s}
.ess2 .pend-dial span.pg{width:calc(var(--dial) * .26);height:calc(var(--dial) * .34);margin:0;border:0;border-radius:2px;background:var(--mark-ink);
  display:flex;flex-direction:column;justify-content:center;gap:calc(var(--dial) * .045);padding:0 calc(var(--dial) * .05);box-sizing:border-box}
.ess2 .pend-dial span.pg i{display:block;width:auto;height:2px;background:#201E1C;opacity:.75;border-radius:1px;place-items:normal}
.ess2 .pend-dial span.pg i::after{display:none}
.ess2 .pend-dial span.pg i:last-child{width:60%}
/* Essentials: the quick fix, beside Start here and outside the numbered route */
.ess{display:flex;align-items:center;gap:12px;max-width:420px;width:100%;box-sizing:border-box;margin:-1.4rem 0 clamp(2.4rem,6vh,3.2rem);padding:12px 14px 12px 16px;
  background:#F3EADF;border-left:3px solid #B0865C;color:#14110E;text-decoration:none}
.ess b{font:700 .95rem/1.2 var(--f-display);flex:none}
.ess span{flex:1;font:400 .8rem/1.35 var(--f-body);color:#5C5852}
.ess i{font-style:normal;font-size:1.3rem;color:#9A5A2C}
.ess:active{background:#EEE2D3}.ess:focus-visible{outline:2px solid #9A5A2C;outline-offset:2px}
</style>
</head>
<body>
<header class="header">
  <div class="header-top">
    <a class="back-link" id="back" href="/index.html?openModal=writing" target="_top">← Writing</a>
    <div class="header-title"><div class="app-title">INTUITY</div><div class="app-subtitle" id="sub">Essay</div></div>
    <span class="header-spacer">Level <b>B2</b></span>
  </div>
</header>
<main class="gate"><a class="watch" id="watch" hidden></a><div class="dials" id="dials"></div></main>
<script>
/* YOUR <TASK> IN FIVE: what door 1 promises, per task (data/writing/five/<task>.json) */
const FIVE_DOOR={reviews:'One intro, two features, a drawback, a recommendation, about your own thing',
  essays:'One intro, two reasons, the other side, your conclusion, on a topic you choose',
  articles:'One hook, a description, a moment, a downside, a last thought, about something you love',
  reports:'The aim, two strengths, a concern, a recommendation, about a place you know',
  emails:'A greeting, an answer, your news, a problem, a goodbye, to a friend you name',
  story:'The scene, two moments of action, a twist, the ending, for a character you name'};
/* the print set's card types for each task (cue-cards-print.html ?type=) */
let ESS=null;
const PRINT={essays:'fa,op,ad,ps,ce,st',articles:'ar',emails:'ef-app,ef-req,ei-news,ei-advice',reviews:'rv',reports:'rp',story:'sy'};
(function(){
'use strict';
const P=new URLSearchParams(location.search);
const TASKS={
  essays:  {name:'Essay',  q:'/skills/writing/essays/essay-question.html',              gen:'essays'},
  emails:  {name:'Email / Letter',  q:'/skills/writing/emails/email-question.html',              gen:'emails'},
  articles:{name:'Article',q:'/skills/writing/articles/article-question.html',          gen:'articles'},
  reviews: {name:'Review', q:'/skills/writing/reviews/review-question-selector.html',   gen:'reviews'},
  reports: {name:'Report', q:'/skills/writing/reports/report-question-selector.html',   gen:'reports'},
  story:   {name:'Story',  q:'/skills/writing/narrative/narrative-question.html', gen:'story'}   /* Story generator: 29 Oct */
};
Object.keys(TASKS).forEach(k=>{ const t=TASKS[k]; t.doors=[
  /* TEACH BEFORE TESTING (5 Nov 2026): a student alone met "1 · Quick
     revision" first and revised phrases for a text nobody had introduced.
     The order now teaches, then practises, then revises: Watch (above, never
     forced) → the question → the Board → the revision sheet; the Model
     Generator is the open-ended extra. */
  /* YOUR REVIEW IN FIVE (5 Nov): the shape first, on his own subject. The
     blueprint; other tasks get theirs once data/writing/five/<task>.json exists */
  /* 7 Nov 2026: every task has its five now */
  /* A STUDY REFERENCE (7 Nov 2026): the exam is written on paper and marked
     by the teacher, so a student comes here to look something up. Model
     answers move up to door 2 (one tap, any topic, no question to choose
     first), and a paper door prints the phrase cards to keep beside the
     page. The Sample tab inside "Work on a question" still needs a chosen
     question, so it cannot be door 2 by itself. */
  ].concat(FIVE_DOOR[k]?[{name:'Your '+(k==='story'?'story':t.name.toLowerCase())+' in five',promise:FIVE_DOOR[k],url:'/skills/writing/five.html?task='+k}]:[])
  .concat(t.gen?[{name:'Model answers',promise:'Read a full '+t.name.toLowerCase().replace(' / letter','')+', then another, as many as you like',url:'/skills/writing/model-generator.html?type='+t.gen+'&support=full'}]:[])
  .concat([
  {name:'Work on a question',promise:'Choose a question and build your answer step by step',url:t.q},
  {name:'Board',promise:'Sort, match and order the '+t.name.toLowerCase()+'’s expressions',url:'/skills/challenge/challenge.html?board=1&section=writing&topic=writing-'+(k==='story'?'story':k.replace(/s$/,''))},
  {name:'Quick revision',promise:'All the key phrases, then recall them',url:'/skills/writing/sheet.html?task='+k}])
  .concat(PRINT[k]?[{name:'Study cards',promise:(PRINT[k].indexOf(',')>0?'Every card for every type, start to finish. ':'Every card, start to finish. ')+'Read them or print one',url:'/skills/writing/cue-cards-print.html?type='+PRINT[k]}]:[]);
  /* A FIRST-TIMER'S ORDER (7 Nov 2026), Essay first as the blueprint: learn
     the shape, use it on a question, practise the phrases, recall them
     later, then the extras. Model answers moves to 5: met first, an endless
     stream of finished essays invites reading before trying, and "Work on
     a question" already ends with a model and a sample. Board and Quick
     revision get names a kid can read (and Recall no longer sounds like
     the Writing menu's Revision Round). */
  /* 7 Nov 2026: every task now follows the Essay blueprint */
  {
    const by=n=>t.doors.find(d=>d.name===n);
    const word=k==='story'?'story':k==='emails'?'email':t.name.toLowerCase();
    const g=by('Board'); if(g){ g.name='Phrase game'; g.promise='Sort, match and order the '+word+'’s phrases'; }
    /* BUILD YOUR OWN (7 Nov 2026): the generator became a wheel; Spin a line,
       or flip to Ready to read a finished essay. Opens on study card 1. */
    const mo=by('Model answers'); if(mo){ mo.name='Build your own'; mo.promise='Spin each line into your own '+word+', or read a ready one'; mo.url='/skills/writing/build.html?type='+t.gen; }
    /* ESSENTIALS (7 Nov 2026): the old Quick revision sheet is the quick fix
       for a student with the exam tomorrow, not a step in the route, so it
       leaves the numbers and sits beside Start here. "Essentials": literal,
       neutral for teachers and parents, and close to its word in most of
       the students' languages (essencial, esencial, essentiel). */
    const r=t.doors.findIndex(d=>d.name==='Quick revision');
    if(r>=0){ t.ess=t.doors[r].url; t.doors.splice(r,1); }
    const order=['Your '+(k==='story'?'story':t.name.toLowerCase())+' in five','Work on a question','Phrase game','Build your own','Study cards'];
    t.doors.sort((a,b)=>{ const i=order.indexOf(a.name), j=order.indexOf(b.name); return (i<0?99:i)-(j<0?99:j); });
  }
  t.doors.forEach((d,i)=>d.n=i+1); });
/* four doors sit two by two, like the Speaking hub */
if((TASKS[new URLSearchParams(location.search).get('task')]||TASKS.essays).doors.length===4) document.documentElement.classList.add('four');
const key=TASKS[P.get('task')]?P.get('task'):'essays', T=TASKS[key];
document.getElementById('sub').textContent=T.name;
/* the stage pages' header (see the style above): every task since 7 Nov 2026 */
{
  const PARTS={essays:'Part 1'}, LABEL={essays:'Essay',reviews:'Review',reports:'Report',emails:'Email',articles:'Article',story:'Story'};
  const sub=document.getElementById('sub'), pick=document.createElement('button');
  pick.type='button'; pick.className='g-pick'; pick.textContent=T.name+' · '+(PARTS[key]||'Part 2');
  pick.setAttribute('aria-haspopup','dialog'); pick.setAttribute('aria-label','Change task: '+T.name);
  sub.replaceWith(pick);
  const close=()=>{ document.querySelectorAll('.g-bg,.g-sheet').forEach(n=>n.remove()); pick.focus(); };
  pick.onclick=()=>{
    const bg=document.createElement('div'); bg.className='g-bg'; bg.onclick=close;
    const sh=document.createElement('div'); sh.className='g-sheet'; sh.setAttribute('role','dialog'); sh.setAttribute('aria-label','Choose a task');
    sh.innerHTML='<h3>Task</h3><div>'+Object.keys(LABEL).map(k=>k===key?'<button type="button" class="g-opt on" aria-current="page">'+LABEL[k]+'</button>':'<a class="g-opt" href="?task='+k+'">'+LABEL[k]+'</a>').join('')+'</div>';
    sh.querySelector('.on').onclick=close;
    document.body.append(bg,sh); sh.querySelector('.g-opt').focus();
  };
  addEventListener('keydown',e=>{ if(e.key==='Escape'&&document.querySelector('.g-sheet')) close(); });
  const lv=document.querySelector('.header-spacer'), mb=document.createElement('button');
  mb.type='button'; mb.className='g-mute';
  const paint=()=>{ const on=!window.SFX||SFX.isOn();
    mb.innerHTML='<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z" fill="currentColor" stroke="none"/>'+
      (on?'<path d="M15.5 9.2a4 4 0 0 1 0 5.6"/><path d="M18 6.8a7.4 7.4 0 0 1 0 10.4"/>':'<path d="M16 9.5l5 5M21 9.5l-5 5"/>')+'</svg>';
    mb.setAttribute('aria-label',on?'Sound on':'Sound off'); mb.classList.toggle('off',!on); };
  mb.onclick=()=>{ if(window.SFX) SFX.toggle(); paint(); };
  paint(); if(lv) lv.replaceWith(mb);
}
document.title='INTUITY — '+T.name;
/* everything behind these doors comes back here */
try{ sessionStorage.setItem('intuity.sheetReturn',JSON.stringify({task:key,url:location.pathname+'?task='+key,label:T.name})); }catch(e){}
document.getElementById('back').onclick=()=>{ try{ sessionStorage.removeItem('intuity.sheetReturn'); }catch(e){} };
/* tasks with a presentation get an optional ▶ Watch first (never forced) */
const WATCH={reviews:'3 short clips',essays:'3 short clips',reports:'3 short clips',articles:'1 short clip',emails:'1 short clip',story:'1 short clip'};
/* "Start here": the clip is where the task is explained (who reads it, what it
   does, how the words split), so it leads the page, but it is a link, not a gate */
if(WATCH[key]){ const w=document.getElementById('watch'); w.hidden=false; w.href='/skills/writing/watch.html?task='+key;
  const what={essays:'an essay',emails:'an email or letter',articles:'an article',reviews:'a review',reports:'a report',story:'a story'}[key];
  w.setAttribute('aria-label','Start here: what '+what+' is, in '+WATCH[key]);
  w.innerHTML='<div class="pend-hang" aria-hidden="true"><div class="pend-dial"><span></span></div></div>'+
    '<span class="w-n">Start here</span><span class="w-p">What '+what+' is, in '+WATCH[key]+'</span>'; }
/* Essentials as a pendulum (7 Nov 2026): it can be a student's first
   encounter, so it hangs beside Start here, caramel like it, outside the
   numbered route; its face is one page */
if(T.ess){ const ESS={url:T.ess};
  const w=document.getElementById('watch'), row=document.createElement('div'); row.className='tops';
  const e=document.createElement('a'); e.className='watch ess2'; e.href=ESS.url;
  e.setAttribute('aria-label','Essentials: every key phrase on one page');
  e.innerHTML='<div class="pend-hang" aria-hidden="true"><div class="pend-dial"><span class="pg"><i></i><i></i><i></i></span></div></div>'+
    '<span class="w-n">Essentials</span><span class="w-p">Every key phrase on one page</span>';
  w.parentNode.insertBefore(row,w); row.appendChild(w); row.appendChild(e);
}
const box=document.getElementById('dials');
T.doors.forEach((d,i)=>{
  const a=document.createElement('a');
  a.className='dial-b'; a.href=d.url; a.setAttribute('aria-label',d.name+': '+d.promise);
  a.innerHTML='<div class="pend-hang" style="animation-delay:'+(i*-1.7).toFixed(2)+'s" aria-hidden="true"><div class="pend-dial"><span>'+d.n+'</span></div></div>'+
    '<span class="dial-name">'+d.name+'</span><span class="dial-promise">'+d.promise+'</span>';
  box.appendChild(a);
});
})();
</script>
</body>
