<!DOCTYPE html>

<head>

<style>
/* ═══════════════════════════════════════════════════════════════════════
   HEAR THE PHRASES · v1 (13 Nov 2026)

   Door 2 of the Essay, Review and Report gates: the skeleton phrases a
   pupil must keep, 13 per task (5 introduction, 5 body, 3 conclusion),
   from Michael's Writing Portfolio. The essay body is 18: three for each
   kind of question, each labelled with the question it answers, so the
   pupil can stack them and see why each one is worth learning.

   Maya says each phrase. Four views, one section at a time:
     Hear   the phrases as a list; tap one for its card (the key word,
            the traps, why), or hear them all
     Sort   Maya says it, the pupil taps the words back in order: two
            near-miss traps sit among them
     Write  Maya says it, the pupil types it from memory
     Which  (essay body) Maya says it, the pupil taps the question it answers
   A check, a score (2 on the first listen, 1 after a replay), a run and a
   personal best; every miss goes to the review deck.

   This is a way to keep writing phrases, not Listening practice: the app
   does not teach the Listening paper (owner's decision, 12 Nov 2026).
   ═══════════════════════════════════════════════════════════════════════ */
:root{ --mark-sweep:#C2956E; --mark-rest:#4A433D; --mark-core:#201E1C; --mark-ink:#E5D1B8; --mark-pct:4%;
  --h-ink:#14110E; --h-paper:#FAF8F5; --h-dim:#5C5852; --h-faint:#8A847C; --h-line:rgba(20,17,14,.12);
  --h-car:#B0865C; --h-ok:#4F7A63; --h-no:#B4532F }
[hidden]{display:none!important}
body{background:var(--bg,#F3EFE8)}
.top{position:sticky;top:0;z-index:20;background:var(--bg,#F3EFE8)}
.top .header{position:static}
.secs{display:flex;justify-content:center;padding:.15rem var(--gutter,16px) 0}
.mode-row{display:flex;justify-content:center;padding:.35rem var(--gutter,16px) .5rem}
.stage{max-width:36rem;margin:0 auto;padding:.6rem var(--gutter,16px) 6rem;color:var(--h-ink)}

/* ── HEAR: the list, in the study card's look ── */
.list.fc-card{padding-bottom:10px}
.list .fc-t{font-size:clamp(28px,8.4vw,34px)}
.hp-all{display:flex;align-items:center;gap:.55rem;margin:.9rem 0 .2rem;min-height:44px;padding:0 1.1rem 0 .5rem;border:0;border-radius:999px;background:var(--h-ink);color:var(--h-paper);font:650 .86rem/1 var(--f-body,'Geist',sans-serif);cursor:pointer}
.hp-all .pl{width:30px;height:30px;border-radius:50%;background:var(--h-car);display:grid;place-items:center;font-size:.72rem;color:var(--h-ink)}
.grp{padding:.9rem 0 .2rem;border-top:1px solid var(--h-line)}
.grp:first-of-type{border-top:0}
.grp-t{font:500 10.5px/1.3 'Geist Mono',ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase;color:#9A5A2C}
.grp-q{font:500 .98rem/1.35 var(--f-body,'Geist',sans-serif);font-style:italic;color:var(--h-ink);margin:.2rem 0 .3rem}
.row{display:flex;align-items:flex-start;gap:.7rem;width:100%;border:0;background:none;text-align:left;padding:.6rem 0;cursor:pointer;color:#4A443E;font:400 clamp(15px,4.1vw,16.5px)/1.5 var(--f-body,'Geist',sans-serif);-webkit-tap-highlight-color:transparent}
.row+.row{border-top:1px dashed rgba(20,17,14,.1)}
.row .ic{flex:none;width:28px;height:28px;margin-top:.05rem;border-radius:50%;border:1.5px solid rgba(20,17,14,.22);display:grid;place-items:center;font-size:.62rem;color:var(--h-ink);transition:background .2s,border-color .2s}
.row.on .ic{background:var(--h-car);border-color:var(--h-car)}
.row.on{color:var(--h-ink)}
.row b{font-weight:650;color:var(--h-ink);text-decoration:underline;text-decoration-color:var(--h-car);text-decoration-thickness:2px;text-underline-offset:3px}
.gap{color:#B4ADA2;letter-spacing:.06em}
.hp-bar{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.peek{min-height:44px;margin:.9rem 0 .2rem;padding:0 .6rem;border:0;background:none;color:#8E6238;font:650 .84rem/1 var(--f-body,'Geist',sans-serif);cursor:pointer}
/* a row waiting for its phrase: a faint line where the words will land */
.row.ghost{cursor:default;pointer-events:none}
.row.ghost .tx{opacity:0}
.row.ghost .ic{opacity:.25}
.row .tx{transition:opacity .35s}
.row.ghost{background:linear-gradient(rgba(20,17,14,.07),rgba(20,17,14,.07)) no-repeat 2.4rem 50%/62% 9px}
.row.land{animation:land .9s ease-out}
@keyframes land{0%{background-color:rgba(176,134,92,.22)}100%{background-color:transparent}}
/* the poster that flies */
.fly{position:fixed;left:50%;top:44%;z-index:950;width:min(30rem,calc(100% - 2rem));transform:translate(-50%,-50%) scale(.92);opacity:0;pointer-events:none;
  transition:transform .38s cubic-bezier(.2,1.25,.4,1),opacity .3s}
.fly.in{opacity:1;transform:translate(-50%,-50%)}
.fly .fc-card{border:0;padding:18px 18px 16px;box-shadow:0 26px 60px -18px rgba(20,17,14,.42),0 6px 16px rgba(20,17,14,.14)}
.fly .fc-k{justify-content:flex-start}
.fly-n{margin-left:auto;letter-spacing:.1em}
.focus .fly-n{display:none}
/* in flight the card drops its centring and its own transition, then glides */
.fly.flying{transition:transform .62s cubic-bezier(.55,0,.25,1),opacity .62s cubic-bezier(.8,0,1,1);opacity:0}
.fly.gone{opacity:0}
/* THE CARD's insides, from the Watch player: size says what is fixed */
.pc .fc-k{justify-content:flex-start}
.pc .pc-t{font-size:clamp(24px,7vw,28px);line-height:1.02;padding-bottom:11px;border-bottom:1.5px solid rgba(20,17,14,.16);text-transform:none;padding-right:2rem}
.pc-ex{display:block;padding:13px 0 4px;font:700 clamp(17px,4.8vw,19px)/1.38 var(--f-body,'Geist',sans-serif);color:var(--h-ink)}
.pc-ex b{text-decoration:underline;text-decoration-color:var(--h-car);text-decoration-thickness:2.5px;text-underline-offset:3px}
.pc-q{display:block;font-size:.84rem;line-height:1.4;color:var(--h-dim);margin:.2rem 0 0}
.pc-q em{color:var(--h-ink)}
.pc-smp{display:block;margin-top:12px;padding:11px 0 4px;border-top:1px dashed rgba(20,17,14,.18)}
.pc-smp small{display:block;font:600 9px/1 'Geist Mono',ui-monospace,monospace;letter-spacing:.2em;text-transform:uppercase;color:#7A5C3A;margin-bottom:7px}
.pc-s{display:block;font:400 clamp(15.5px,4.3vw,17px)/1.5 var(--f-body,'Geist',sans-serif);color:#4A4540}
.sk{font-weight:650;color:var(--h-ink);background:linear-gradient(transparent 60%,rgba(138,167,156,.45) 60%);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.sk b{font-weight:750;text-decoration:underline;text-decoration-color:var(--h-car);text-decoration-thickness:2px;text-underline-offset:3px}
.own{color:#4A4540}
.nm{font-weight:650;color:var(--h-ink);border:1.5px solid rgba(169,135,95,1);background:rgba(169,135,95,.14);border-radius:3px;padding:0 3px}
.pill-g{display:inline-block;width:24px;height:8px;border-radius:5px;background:rgba(169,135,95,.38);margin:0 3px;vertical-align:middle}
.shape s{font-size:.82rem;color:var(--h-faint);font-style:italic}
.shape-n{font:500 .62rem/1.3 'Geist Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--h-faint);margin:-.2rem 0 .6rem}
.line .fx{font-size:.9rem;letter-spacing:0;color:var(--h-faint);font-style:italic}
.cta{display:flex;justify-content:center;margin:1.2rem 0 0}
.cta button{min-height:48px;padding:0 1.5rem;border:0;border-radius:999px;background:var(--h-ink);color:var(--h-paper);font:700 .94rem/1 var(--f-body,'Geist',sans-serif);cursor:pointer;box-shadow:0 0 0 3px var(--bg,#F3EFE8),0 0 0 6px var(--h-car)}

/* ── the gate: the pendulum starts a round, as on every gate ── */
.gate{text-align:center;padding-top:2rem}
.gate .gate-mark{display:block;width:124px;height:124px;margin:0 auto 1.4rem;border:0;padding:0;background:none;cursor:pointer}
.gate .gate-mark .pend-dial span{font-size:1rem;letter-spacing:.12em;padding-left:.12em}
.big{font-family:'Anton',Impact,sans-serif;font-weight:400;font-size:clamp(2.2rem,10.5vw,3rem);line-height:.98;text-transform:uppercase;color:var(--h-ink);margin:0}
.sm{font-size:.86rem;line-height:1.45;color:var(--h-dim);margin:.6rem auto 0;max-width:22rem}
.tally{font:600 .62rem/1 'Geist Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#9A5A2C;margin:1rem 0 0}

/* ── a round: the poster lying on the page ── */
.poster.round{margin-top:.4rem}
.poster-kick{justify-content:space-between}
.poster-kick span:first-child{display:flex;align-items:center;gap:9px}
.stats{display:flex;gap:.45rem;margin:-.25rem 0 .8rem}
.stats span{font:600 .64rem/1 'Geist Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--h-dim);background:var(--poster-fill,rgba(20,17,14,.09));padding:.42rem .6rem;border-radius:3px}
.stats span.hot{background:var(--h-ink);color:var(--h-paper)}
.say{display:flex;align-items:center;gap:.8rem;margin:0 0 1rem}
.say button{flex:none;width:58px;height:58px;border-radius:50%;border:0;background:var(--h-ink);color:var(--h-car);font-size:1.15rem;cursor:pointer;display:grid;place-items:center;box-shadow:0 0 0 3px var(--h-paper),0 0 0 5px var(--h-car)}
.say button.talk{animation:talk 1s ease-in-out infinite}
@keyframes talk{50%{box-shadow:0 0 0 3px var(--h-paper),0 0 0 9px rgba(176,134,92,.45)}}
.say p{margin:0;font-size:.84rem;line-height:1.4;color:var(--h-dim)}
.say p b{color:var(--h-ink)}
/* the line being rebuilt */
.line{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem .35rem;min-height:3rem;padding:.75rem 0;border-top:1px solid var(--poster-rule,rgba(20,17,14,.2));border-bottom:1px solid var(--poster-rule,rgba(20,17,14,.2))}
.line .fx{font:500 1rem/1 var(--f-body,'Geist',sans-serif);color:#B4ADA2;letter-spacing:.06em}
.slot{min-width:2.6rem;min-height:2.1rem;padding:.35rem .6rem;border:0;border-bottom:2px solid rgba(20,17,14,.28);background:none;font:600 .95rem/1.15 var(--f-body,'Geist',sans-serif);color:var(--h-ink);cursor:pointer;border-radius:0}
.slot.next{border-bottom-color:var(--h-car)}
.slot.full{background:var(--poster-fill,rgba(20,17,14,.09));border-radius:var(--r-field,3px);border-bottom-color:transparent}
.slot.ok{background:#E3EDE6;color:var(--h-ok)}
.slot.no{background:#F6E4DC;color:var(--h-no);text-decoration:line-through}
.tray{display:flex;flex-wrap:wrap;gap:.45rem;margin:1rem 0 0;justify-content:center}
.tray .poster-pill{min-height:42px;font-size:.95rem}
/* Write */
.shape{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center;margin:0 0 .6rem}
.shape i{display:block;width:16px;height:4px;border-radius:2px;background:rgba(20,17,14,.22)}
.shape s{text-decoration:none;color:#B4ADA2;font-size:.9rem;padding:0 .15rem}
.shape em{font:500 .62rem/1 'Geist Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--h-faint);font-style:normal;margin-left:.4rem}
.inp{display:block;width:100%;box-sizing:border-box;padding:.8rem .85rem;border:1.5px solid var(--h-ink);border-radius:var(--r-field,3px);background:#fff;font:400 1.02rem/1.4 var(--f-body,'Geist',sans-serif);color:var(--h-ink)}
.inp:focus{outline:2px solid var(--h-car);outline-offset:1px}
.inp.ok{border-color:var(--h-ok);background:#F1F6F2} .inp.no{border-color:var(--h-no)}
/* Which */
.opts{display:flex;flex-direction:column;gap:.5rem}
.opt{display:block;width:100%;text-align:left;padding:.75rem .9rem;border:1.5px solid var(--h-line);border-radius:var(--r-field,3px);background:var(--h-paper);cursor:pointer;color:var(--h-ink);font:500 .96rem/1.35 var(--f-body,'Geist',sans-serif)}
.opt small{display:block;font:500 .58rem/1 'Geist Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#9A5A2C;margin-bottom:.35rem}
.opt.ok{border-color:var(--h-ok);background:#E3EDE6} .opt.no{border-color:var(--h-no);background:#F6E4DC}
/* the check and the answer */
.go{display:block;width:100%;min-height:50px;margin:1.1rem 0 0;border:0;border-radius:var(--r-chip,4px);background:var(--h-ink);color:var(--h-paper);font:700 .95rem/1 var(--f-body,'Geist',sans-serif);letter-spacing:.02em;cursor:pointer}
.go:disabled{background:rgba(20,17,14,.12);color:rgba(20,17,14,.35);cursor:default}
.ans{margin:1rem 0 0;padding:.8rem .9rem;background:#F3EADF;border-left:3px solid var(--h-car)}
.ans .ph{font:500 1.02rem/1.45 var(--f-body,'Geist',sans-serif);color:var(--h-ink);margin:0}
.ans .ph b{text-decoration:underline;text-decoration-color:var(--h-car);text-decoration-thickness:2px;text-underline-offset:3px}
.ans .ph u{text-decoration:none;background:#F6D9CC;border-radius:2px;padding:0 .1em}
.ans .why{font-size:.86rem;line-height:1.45;color:var(--h-dim);margin:.45rem 0 0}
.ans.ok{background:#E9F1EC;border-left-color:var(--h-ok)}

/* ── the cards: FiveCard's study card, as a modal ── */
.scrim{position:fixed;inset:0;z-index:900;display:flex;align-items:center;justify-content:center;padding:1rem;
  background:rgba(20,17,14,.34);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;transition:opacity .25s}
.scrim.on{opacity:1}
.focus{position:relative;width:min(31rem,100%);max-height:calc(100dvh - 1.25rem);overflow-y:auto;
  box-shadow:0 24px 60px -18px rgba(20,17,14,.38),0 6px 16px rgba(20,17,14,.14);border-radius:6px;
  transform:translateY(24px) scale(.97);transition:transform .45s cubic-bezier(.2,1.3,.4,1)}
.scrim.on .focus{transform:none}
.focus .fc-card{border:0;padding:18px 18px 6px}
.focus .x{position:absolute;top:.55rem;right:.6rem;z-index:2;width:40px;height:40px;border:none;background:none;font-size:1rem;color:#8A8378;cursor:pointer}
.focus .fc-t.score{font-size:clamp(54px,17vw,72px)}
.not s{color:var(--h-no);text-decoration-thickness:1.5px;margin-right:.7rem}
.play{display:inline-flex;align-items:center;gap:.5rem;min-height:40px;padding:0 1rem 0 .4rem;border:0;border-radius:999px;background:var(--h-ink);color:var(--h-paper);font:600 .82rem/1 var(--f-body,'Geist',sans-serif);cursor:pointer;margin-top:12px}
.play i{width:28px;height:28px;border-radius:50%;background:var(--h-car);color:var(--h-ink);display:grid;place-items:center;font-style:normal;font-size:.66rem}
.cnav{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:10px 0 12px;border-top:1px solid rgba(20,17,14,.12)}
.cnav button{width:44px;height:44px;border-radius:50%;border:0;background:var(--h-ink);color:var(--h-paper);font-size:1.3rem;cursor:pointer;display:grid;place-items:center;padding:0 0 .1em}
.cnav button:disabled{background:rgba(20,17,14,.1);color:rgba(20,17,14,.3);cursor:default}
.cnav span{font:500 .72rem/1 'Geist Mono',monospace;color:var(--h-dim)}
.miss{display:flex;align-items:flex-start;gap:.55rem;width:100%;border:0;background:none;text-align:left;padding:.35rem 0;cursor:pointer;font:400 .92rem/1.45 var(--f-body,'Geist',sans-serif);color:#4A443E}
.miss i{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid rgba(20,17,14,.22);display:grid;place-items:center;font-style:normal;font-size:.5rem;margin-top:.1rem;color:var(--h-ink)}
.outs{display:flex;flex-direction:column;gap:.4rem;padding:6px 0 14px}
.outs .pri{min-height:50px;border:0;border-radius:999px;background:var(--h-ink);color:var(--h-paper);font:700 .95rem/1 var(--f-body,'Geist',sans-serif);cursor:pointer}
.outs .sec{min-height:44px;border:0;background:none;color:#8E6238;font:650 .92rem/1 var(--f-body,'Geist',sans-serif);cursor:pointer}
@media(prefers-reduced-motion:reduce){.scrim,.focus{transition:none}.say button.talk{animation:none}}
</style>

<div class="top">
  <header class="header">
    <div class="header-top">
      <a class="back-link" id="back" href="/skills/writing/gate.html?task=essays" target="_top">← Essay</a>
      <div class="header-title"><div class="app-title">INTUITY</div><div class="app-subtitle">Hear the phrases</div></div>
      <span class="header-spacer">Level <b>B2</b></span>
    </div>
  </header>
  <nav class="secs"><div class="mode-selector" id="secs" role="tablist" aria-label="Section"></div></nav>
  <div class="mode-row"><div class="seg" id="views" role="tablist" aria-label="View"></div></div>
</div>
<main class="stage" id="stage"><p style="text-align:center;color:var(--h-faint)">Loading…</p></main>
<div class="scrim" id="scrim" hidden><div class="focus" id="focus" role="dialog" aria-modal="true"></div></div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P=new URLSearchParams(location.search);
const store={get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
             set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }};
const shuffle=a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const bare=w=>String(w).replace(/[^\w'-]/g,'');
const isGap=w=>/…/.test(w)&&!bare(w);

let D=null, T=null, K='essays', S=null, VIEW='hear', AUDIO={};
const VIEWS=[['hear','Hear'],['sort','Sort'],['write','Write'],['which','Which?']];
const hasWhich=()=>S&&S.items.some(x=>x.q);
const mem=k=>'intuity.hear.'+K+'.'+k;

/* ── MAYA: recorded if we have it, otherwise the phone's own voice ── */
const A=new Audio(); A.preload='auto';
let tok={dead:true};
function voice(){ const v=(window.speechSynthesis&&speechSynthesis.getVoices())||[];
  return v.find(x=>/en-GB/i.test(x.lang)&&/female|serena|kate|martha|libby|sonia/i.test(x.name))||v.find(x=>/en-GB/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null; }
/* Maya says the example sentence, not the bare skeleton: "Few people would deny
   that online shopping has changed the way we live." (13 Nov 2026) */
const SPOKEN={};
const plainFill=f=>String(f).replace(/[{}]/g,'');
function fullText(it){ let g=0; return it.p.split(' ').map(w=>isGap(w)?plainFill((it.f||[])[g++]||'')+w.replace('…',''):w).join(' ')
  .replace(/([.?!])[.,]/g,'$1').replace(/\s+/g,' ').trim(); }
const spoken=p=>SPOKEN[p]||p.replace(/\s*…\s*/g,' ').replace(/\s+([,.?])/g,'$1').replace(/^[,\s]+|[,\s]+$/g,'').replace(/,(?=[.?])/g,'');
function speak(p,t){
  return new Promise(res=>{
    if(t&&t.dead) return res();
    const text=spoken(p), done=()=>{ clearTimeout(guard); res(); };
    const guard=setTimeout(done,1600+text.split(' ').length*560);
    const url=AUDIO[p];
    if(url){ A.onended=done; A.onerror=()=>tts(text,done); A.src=url; A.currentTime=0; A.play().catch(()=>tts(text,done)); return; }
    tts(text,done);
  });
}
function tts(text,done){
  if(!window.speechSynthesis) return;
  try{ speechSynthesis.cancel(); }catch(e){}
  const u=new SpeechSynthesisUtterance(text), v=voice(); if(v) u.voice=v;
  u.lang='en-GB'; u.rate=.86; u.onend=done; u.onerror=done; speechSynthesis.speak(u);
}
function hush(){ tok.dead=true; A.pause(); document.querySelectorAll('.fly').forEach(x=>x.remove()); try{ speechSynthesis.cancel(); }catch(e){} document.querySelectorAll('.talk,.row.on').forEach(e=>e.classList.remove('talk','on')); }
async function say(p,btn){ hush(); const t=tok={dead:false}; if(btn) btn.classList.add('talk'); await speak(p,t); if(btn) btn.classList.remove('talk'); }

/* the phrase as HTML: the key word marked, every gap a small caramel pill */
/* the example: the fixed words on a sage underlay, the pupil's own words quieter,
   the thing reviewed in a caramel box (the Watch player's three marks) */
function exampleHTML(it){
  let g=0, keyed=false, run=[];
  const out=[], flush=()=>{ if(run.length){ out.push('<span class="sk">'+run.join(' ')+'</span>'); run=[]; } };
  it.p.split(' ').forEach(w=>{
    if(isGap(w)){ flush(); const f=esc((it.f||[])[g++]||'').replace(/\{([^}]+)\}/g,'<span class="nm">$1</span>'); out.push('<span class="own">'+f+esc(w.replace('…',''))+'</span>'); return; }
    if(!keyed&&bare(w)===it.k){ keyed=true; const m=/^(\W*)([\w'-]+)(\W*)$/.exec(w)||['',w,'','']; run.push(esc(m[1])+'<b>'+esc(m[2])+'</b>'+esc(m[3])); return; }
    run.push(esc(w));
  });
  flush(); return out.join(' ').replace(/(<\/span>) ([.,?])/g,'$1$2');
}
function phraseHTML(it,cls){
  let keyed=false;
  return it.p.split(' ').map(w=>{
    if(isGap(w)) return '<span class="pill-g" aria-label="your words"></span>'+esc(w.replace('…',''));
    if(!keyed&&bare(w)===it.k){ keyed=true; const m=/^(\W*)([\w'-]+)(\W*)$/.exec(w)||['',w,'','']; return esc(m[1])+'<b'+(cls?' class="k"':'')+'>'+esc(m[2])+'</b>'+esc(m[3]); }
    return esc(w);
  }).join(' ');
}

/* ── the two header rows: which section, which view ── */

/* ═══ HEAR: the section as a study card, grouped by question where it has them.
   HEAR THEM ALL (13 Nov 2026, the owner's design): the list starts empty, its
   question labels already in place. Maya says the phrases without a break;
   each one appears as a poster card while she says it, then flies down into
   its place in the list, and the next one comes. At the end the whole section
   is on the screen: the poster for attention, the list for the overview. ═══ */
let HI=0;   /* the next phrase to fly in */
function hear(){
  const groups=[]; S.items.forEach((it,i)=>{ const g=groups[groups.length-1]; if(it.q&&g&&g.q===it.q) g.items.push(i); else groups.push({q:it.q,type:it.type,items:[i]}); });
  const row=i=>'<button type="button" class="row ghost" data-i="'+i+'" tabindex="-1"><span class="ic">▶</span><span class="tx">'+phraseHTML(S.items[i])+'</span></button>';
  HI=0;
  $('stage').innerHTML='<div class="fc-card list"><span class="fc-k">'+esc(T.name+' · '+T.kick)+'</span><span class="fc-t">'+esc(S.name)+'</span><span class="fc-bar" aria-hidden="true"></span>'+
    '<span class="fc-study" id="hint">'+S.items.length+' phrases'+(hasWhich()?', three for each kind of question':'')+'. Maya says them all; watch each one land.</span>'+
    '<span class="hp-bar"><button type="button" class="hp-all" id="all"><span class="pl">▶</span><span>Hear them all</span></button><button type="button" class="peek" id="peek">Just show them</button></span>'+
    groups.map(g=>'<div class="grp">'+(g.q?'<div class="grp-t">'+esc(g.type)+'</div><p class="grp-q">'+esc(g.q)+'</p>':'')+g.items.map(row).join('')+'</div>').join('')+
    '</div><div class="cta"><button type="button" data-view="sort">Sort them from memory →</button></div>';
  $('all').onclick=playAll;
  $('peek').onclick=()=>{ hush(); for(let i=HI;i<S.items.length;i++) land(i,true); HI=S.items.length; ended(); };
  document.querySelectorAll('.row').forEach(b=>b.onclick=()=>{ if(!b.classList.contains('ghost')) card(+b.dataset.i); });
}
/* a phrase reaches the list: the row shows, can be tapped for its card */
function land(i,quiet){
  const r=document.querySelector('.row[data-i="'+i+'"]'); if(!r) return;
  r.classList.remove('ghost'); r.removeAttribute('tabindex');
  if(!quiet){ r.classList.add('land'); setTimeout(()=>r.classList.remove('land'),900); }
}
function ended(){
  const b=$('all'); if(!b) return; delete b.dataset.on;
  b.lastChild.textContent=HI>=S.items.length?'Hear them again':'Go on';
  $('peek').hidden=HI>=S.items.length;
  if(HI>=S.items.length) $('hint').textContent='All '+S.items.length+' are here. Tap one for its card: the key word, the traps, why.';
}
const pause=ms=>new Promise(r=>setTimeout(r,ms));
const calm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
async function playAll(){
  const b=$('all');
  if(b.dataset.on){ hush(); ended(); return; }                 /* Stop: what has landed stays */
  if(HI>=S.items.length){ HI=0; document.querySelectorAll('.row').forEach(r=>{ r.classList.add('ghost'); r.setAttribute('tabindex','-1'); }); }
  hush(); const t=tok={dead:false}; b.dataset.on=1; b.lastChild.textContent='Stop'; $('peek').hidden=true;
  for(;HI<S.items.length&&!t.dead;HI++){
    const i=HI, it=S.items[i], r=document.querySelector('.row[data-i="'+i+'"]');
    if(r){ const y=r.getBoundingClientRect().top; if(y<innerHeight*.35||y>innerHeight*.8){ scrollBy({top:y-innerHeight*.62,behavior:calm?'auto':'smooth'}); await pause(380); } }
    if(t.dead) break;
    const f=flyCard(it,i);
    await pause(60); f.classList.add('in');
    await speak(it.p,t); if(t.dead) break;
    await pause(420); if(t.dead) break;
    await flyTo(f,r); land(i);
    await pause(260);
  }
  if(!t.dead){ HI=S.items.length; ended(); if(window.Cheer){ try{ Cheer.tick(b); }catch(e){} } }
}
/* THE CARD (13 Nov 2026, from the owner: the giant headline looked inflated).
   As in the Watch player: a short Anton title, the expression in bold with its
   gaps as pills, then the example under a dashed line. */
function topicOf(it){ return K==='essays'?(it.t||''):T.topic||''; }
function cardHTML(it,i){
  return '<span class="fc-k">'+esc(T.name+' · '+S.name)+'<span class="fly-n">'+(i+1)+' / '+S.items.length+'</span></span>'+
    '<span class="fc-t pc-t">'+esc(it.type||S.name)+'</span>'+
    '<span class="pc-ex">'+phraseHTML(it)+'</span>'+
    (it.q?'<span class="pc-q">Answers: <em>'+esc(it.q)+'</em></span>':'')+
    ((it.f||[]).length?'<span class="pc-smp"><small>'+esc(topicOf(it))+'</small><span class="pc-s">'+exampleHTML(it)+'</span></span>':'');
}
/* the poster that flies */
function flyCard(it,i){
  document.querySelectorAll('.fly').forEach(x=>x.remove());
  const f=document.createElement('div'); f.className='fly'; f.setAttribute('aria-live','polite');
  f.innerHTML='<span class="fc-card pc">'+cardHTML(it,i)+'</span>';
  document.body.appendChild(f);
  return f;
}
/* the flight: the card shrinks onto its row's words, then hands over to them */
function flyTo(f,r){
  return new Promise(res=>{
    const tx=r&&r.querySelector('.tx');
    if(!tx||calm){ f.classList.add('gone'); setTimeout(()=>{ f.remove(); res(); },calm?250:300); return; }
    const a=f.getBoundingClientRect(), z=tx.getBoundingClientRect(), k=Math.max(.12,z.width/a.width);
    /* pin the card where it is, without its centring, then glide from there */
    f.style.transition='none'; f.style.left=a.left+'px'; f.style.top=a.top+'px'; f.style.transform='none'; f.style.transformOrigin='0 0';
    void f.offsetWidth;
    f.classList.add('flying'); f.style.transition='';
    f.style.transform='translate('+(z.left-a.left)+'px,'+(z.top-a.top)+'px) scale('+k+')';
    setTimeout(()=>{ f.remove(); res(); },640);
  });
}

/* ── THE PHRASE CARD: FiveCard's study card, the phrase as its headline ── */
function card(i){
  const it=S.items[i], n=S.items.length;
  open('<span class="fc-card pc">'+cardHTML(it,i)+
    '<button type="button" class="play" id="cPlay"><i>▶</i>Maya says it</button>'+
    '<span class="fc">'+
      '<span class="fc-sec"><span class="fc-role">Key</span><span class="fc-in"><span class="fc-p not"><b style="color:#14110E;font-weight:600">'+esc(it.k)+'</b> &nbsp;not&nbsp; '+it.x.map(x=>'<s>'+esc(x)+'</s>').join('')+'</span></span></span>'+
      '<span class="fc-sec"><span class="fc-role">Why</span><span class="fc-in"><span class="fc-p">'+esc(it.w)+'</span></span></span>'+
    '</span>'+
    '<span class="cnav"><button type="button" id="cPrev" aria-label="Previous phrase"'+(i?'':' disabled')+'>‹</button><span>'+(i+1)+' of '+n+'</span><button type="button" id="cNext" aria-label="Next phrase"'+(i<n-1?'':' disabled')+'>›</button></span></span>');
  $('cPlay').onclick=()=>say(it.p,$('cPlay'));

function open(h){
  $('focus').innerHTML='<button class="x" type="button" aria-label="Close" id="fx">✕</button>'+h;
  const s=$('scrim'); if(s.hidden){ s.hidden=false; requestAnimationFrame(()=>s.classList.add('on')); }
  $('fx').onclick=close; $('focus').scrollTop=0;
}
function close(){ hush(); const s=$('scrim'); s.classList.remove('on'); setTimeout(()=>{ s.hidden=true; },250); }
$('scrim').addEventListener('click',e=>{ if(e.target.id==='scrim') close(); });
addEventListener('keydown',e=>{ if(e.key==='Escape'&&!$('scrim').hidden) close(); });

/* ═══ THE GATE: the pendulum starts a round ═══ */
const GATE={
  sort:['By ear.','Maya says a phrase. Tap its words back in order. Two of them are traps.'],
  write:['From memory.','Maya says a phrase. Type it, word for word.'],
  which:['Which question?','Maya says a phrase. Tap the question it answers.']};
function roundOf(){
  if(!S.round) return shuffle(S.items);
  /* the essay body: one phrase for each kind of question, so a round covers them all */
  const by={}; S.items.forEach(x=>(by[x.type]=by[x.type]||[]).push(x));
  return shuffle(Object.values(by).map(a=>a[Math.floor(Math.random()*a.length)])).slice(0,S.round);
}
function bestKey(){ return mem(S.id+'.'+VIEW+'.best'); }
function gate(){
  const n=S.round||S.items.length, best=store.get(bestKey(),null);
  document.documentElement.style.setProperty('--mark-pct',best?Math.max(4,Math.round(best/(2*n)*100))+'%':'4%');
  $('stage').innerHTML='<section class="gate">'+
    '<button type="button" class="gate-mark pend-hang" id="dial" aria-label="Start"><div class="pend-dial"><span>START</span></div></button>'+
    '<h1 class="big">'+n+' phrases.<br>'+esc(GATE[VIEW][0])+'</h1><p class="sm">'+esc(GATE[VIEW][1])+'</p>'+
    (best!=null?'<p class="tally">Your best: '+best+' of '+(2*n)+'</p>':'<p class="tally">2 points on the first listen, 1 after a replay</p>')+'</section>';
  $('dial').onclick=start;
}

/* ═══ A ROUND ═══ */
let R=null;
function stopRound(){ R=null; }
function start(){ R={view:VIEW,items:roundOf(),i:0,pts:0,run:0,longest:0,miss:[]}; item(); }
function item(){
  const r=R, it=r.items[r.i]; r.replays=0; r.done=false;
  $('stage').innerHTML='<section class="poster round" id="pc">'+
    '<div class="poster-kick"><span><i></i>'+esc(T.name+' · '+S.name)+'</span><span>'+(r.i+1)+' / '+r.items.length+'</span></div>'+
    '<div class="stats"><span>'+r.pts+' pts</span><span class="'+(r.run>=3?'hot':'')+'">Run '+r.run+'</span></div>'+
    '<div class="say"><button type="button" id="sayB" aria-label="Hear it again">▶</button><p id="sayT"><b>Listen.</b> One more listen costs a point.</p></div>'+
    '<div id="work"></div><div id="after"></div></section>';
  $('sayB').onclick=()=>{ if(!r.done&&r.replays++===0) $('sayT').innerHTML='<b>Replayed.</b> This one is worth 1 point now.'; say(it.p,$('sayB')); };
  ({sort:sortWork,write:writeWork,which:whichWork})[r.view](it);
  say(it.p,$('sayB'));
}

/* Sort: the phrase's own words (long ones in chunks of two or three, never more
   than seven tiles), the key word on its own tile, and its two traps beside it */
function units(it){
  const w=it.p.split(' '); let keyed=false;
  let g=0;
  let u=w.map(t=>{ if(isGap(t)) return {t,fixed:1,fill:plainFill((it.f||[])[g++]||'…')+t.replace('…','')}; const k=!keyed&&bare(t)===it.k; if(k) keyed=true; return {t,key:k}; });
  const mov=()=>u.filter(x=>!x.fixed).length;
  while(mov()>7){
    let best=-1, bl=1e9;
    for(let i=0;i<u.length-1;i++){ const a=u[i], b=u[i+1]; if(a.fixed||b.fixed||a.key||b.key) continue; const l=a.t.length+b.t.length; if(l<bl){ bl=l; best=i; } }
    if(best<0) break;
    u.splice(best,2,{t:u[best].t+' '+u[best+1].t});
  }
  return u;
}
function sortWork(it){
  const r=R, u=units(it), slots=u.filter(x=>!x.fixed), kt=u.find(x=>x.key);
  const tail=kt?(/\W*$/.exec(kt.t)[0]):'';
  const tiles=shuffle(slots.map(x=>x.t).concat(it.x.map(x=>x+tail)));
  const fill=[];
  const paint=()=>{
    let si=0;
    $('line').innerHTML=u.map(x=>{ if(x.fixed) return '<span class="fx">'+esc(x.fill)+'</span>'; const k=si++, f=fill[k];
      return '<button type="button" class="slot'+(f!=null?' full':'')+(f==null&&k===fill.length?' next':'')+'" data-s="'+k+'">'+(f!=null?esc(tiles[f]):'&nbsp;')+'</button>'; }).join('');
    $('tray').innerHTML=tiles.map((t,i)=>'<button type="button" class="poster-pill'+(fill.includes(i)?' used':'')+'" data-t="'+i+'"'+(fill.includes(i)?' disabled':'')+'>'+esc(t)+'</button>').join('');
    $('chk').disabled=fill.length<slots.length;
    $('line').querySelectorAll('.slot.full').forEach(b=>b.onclick=()=>{ if(r.done) return; fill.splice(+b.dataset.s); paint(); });
    $('tray').querySelectorAll('.poster-pill:not(.used)').forEach(b=>b.onclick=()=>{ if(r.done||fill.length>=slots.length) return; fill.push(+b.dataset.t); paint(); });
  };
  $('work').innerHTML='<div class="line" id="line"></div><div class="tray" id="tray"></div><button type="button" class="go" id="chk" disabled>Check</button>';
  paint();
  $('chk').onclick=()=>{
    if(r.done) return;
    const ok=slots.every((x,k)=>tiles[fill[k]]===x.t);
    $('line').querySelectorAll('.slot').forEach((b,k)=>{ b.classList.add(tiles[fill[k]]===slots[k].t?'ok':'no'); });
    $('chk').hidden=true;
    const given=fill.map(f=>tiles[f]).join(' ');
    const trap=it.x.find(x=>fill.some(f=>tiles[f]===x+tail));
    mark(it,ok,trap||given);
  };
}
/* Write: the shape of the phrase (one bar per word), then a box */
const CONTR={"it's":'it is',"there's":'there is',"i'm":'i am',"don't":'do not',"doesn't":'does not',"isn't":'is not',"won't":'will not',"can't":'cannot',"you're":'you are',"i'd":'i would',"what's":'what is',"that's":'that is'};
const norm=s=>String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/…/g,' ').replace(/[^a-z' -]/g,' ').replace(/\s+/g,' ').trim().split(' ').map(w=>CONTR[w]||w).join(' ').replace(/can not/g,'cannot');
function writeWork(it){
  const r=R; let g=0;
  const segs=it.p.split(' ').map(w=>isGap(w)?{own:plainFill((it.f||[])[g++]||'…')}:{w:1});
  $('work').innerHTML='<div class="shape" aria-hidden="true">'+segs.map(x=>x.own?'<s>'+esc(x.own)+'</s>':'<i></i>').join('')+'</div><p class="shape-n">'+segs.filter(x=>x.w).length+' words to write: the phrase, not the grey words</p>'+
    '<input class="inp" id="inp" type="text" autocomplete="off" autocapitalize="sentences" spellcheck="false" placeholder="Type the phrase Maya used" aria-label="The phrase">'+
    '<button type="button" class="go" id="chk" disabled>Check</button>';
  const inp=$('inp');
  inp.oninput=()=>{ $('chk').disabled=!inp.value.trim(); };
  inp.onkeydown=e=>{ if(e.key==='Enter'&&inp.value.trim()) $('chk').click(); };
  setTimeout(()=>inp.focus({preventScroll:true}),80);
  $('chk').onclick=()=>{
    if(r.done) return;
    const want=norm(it.p), got=norm(inp.value), ok=want===got||got===norm(fullText(it));
    inp.classList.add(ok?'ok':'no'); inp.readOnly=true; $('chk').hidden=true;
    /* the words the pupil missed or changed, marked in the right phrase */
    const have={}; got.split(' ').forEach(w=>have[w]=(have[w]||0)+1);
    r.wrongWords=it.p.split(' ').map(w=>{ if(isGap(w)) return null; const n=norm(w); if(have[n]){ have[n]--; return false; } return true; });
    mark(it,ok,inp.value.trim());
  };
}
/* Which: the question this phrase answers, among two others */
function whichWork(it){
  const r=R, qs=[...new Set(S.items.map(x=>x.q))].filter(q=>q!==it.q);
  const opts=shuffle([it.q].concat(shuffle(qs).slice(0,2)));
  const typeOf=q=>(S.items.find(x=>x.q===q)||{}).type||'';
  $('work').innerHTML='<div class="opts">'+opts.map(q=>'<button type="button" class="opt" data-q="'+esc(q)+'"><small>'+esc(typeOf(q))+'</small>'+esc(q)+'</button>').join('')+'</div>';
  $('work').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(r.done) return; const ok=b.dataset.q===it.q;
    b.classList.add(ok?'ok':'no'); if(!ok) $('work').querySelector('.opt[data-q="'+CSS.escape(it.q)+'"]').classList.add('ok');
    mark(it,ok,b.dataset.q,opts);
  });
}

/* ── the check: points, the run, the review deck ── */
function mark(it,ok,given,opts){
  const r=R; r.done=true;
  const pts=ok?(r.replays?1:2):0; r.pts+=pts;
  if(ok){ r.run++; r.longest=Math.max(r.longest,r.run); } else { r.run=0; r.miss.push(it); }
  const st=document.querySelector('.stats'); if(st) st.innerHTML='<span>'+r.pts+' pts</span><span class="'+(r.run>=3?'hot':'')+'">Run '+r.run+'</span>';
  try{
    if(window.Be2&&Be2.answer){
      if(r.view==='which') Be2.answer('writing-hear',{id:'which-'+it.id,prompt:spoken(it.p),ask:'Which question does it answer?',answer:it.q,given:ok?'':given,correct:ok,opts:opts,rule:it.type+': '+it.p,href:location.pathname+'?task='+K+'&sec='+S.id+'&view=which'});
      else { let keyed=false; const blank=it.p.split(' ').map(w=>{ if(!keyed&&bare(w)===it.k){ keyed=true; return w.replace(it.k,'_____'); } return w; }).join(' ');
        Be2.answer('writing-hear',{id:it.id,prompt:T.name+' · '+S.name+': '+blank,answer:it.k,given:ok?'':String(given).slice(0,80),correct:ok,opts:shuffle([it.k].concat(it.x)),rule:it.w,href:location.pathname+'?task='+K+'&sec='+S.id+'&view='+r.view}); }
    }
  }catch(e){}
  const pc=$('pc'), last=r.i>=r.items.length-1;
  if(ok){
    if(window.Cheer){ try{ Cheer.right(pc.querySelector('.slot.ok:last-of-type,.inp,.opt.ok')||pc,!r.replays); Cheer.run(r.run,pc); }catch(e){} }
    $('after').innerHTML='<div class="ans ok"><p class="ph">'+((it.f||[]).length?exampleHTML(it):phraseHTML(it))+'</p></div>';
    setTimeout(()=>{ if(R===r) next(); },1500);
  } else {
    if(window.Cheer){ try{ Cheer.soft(); }catch(e){} }
    pc.classList.remove('shake'); void pc.offsetWidth; pc.classList.add('shake');
    let ph=phraseHTML(it);
    if(r.view==='write'&&r.wrongWords){ let k=0; ph=it.p.split(' ').map(w=>{ const bad=r.wrongWords[k++]; if(isGap(w)) return '<span class="pill-g"></span>'+esc(w.replace('…','')); const h=bare(w)===it.k?phraseHTML({p:w,k:it.k}):esc(w); return bad?'<u>'+h+'</u>':h; }).join(' '); }
    $('after').innerHTML='<div class="ans"><p class="ph">'+ph+'</p><p class="why">'+esc(r.view==='which'?it.type+': '+it.q:it.w)+'</p></div><button type="button" class="go" id="nx">'+(last?'See your score':'Next')+'</button>';
    $('nx').onclick=next;
    setTimeout(()=>say(it.p,$('sayB')),350);
  }
}
function next(){ hush(); const r=R; if(!r) return; if(r.i<r.items.length-1){ r.i++; item(); window.scrollTo({top:0}); } else finish(); }

/* ── THE RESULT CARD ── */
function finish(){
  const r=R, max=2*r.items.length, key=bestKey(), prev=store.get(key,null), isBest=prev==null||r.pts>prev;
  if(isBest) store.set(key,r.pts);
  const order=VIEWS.filter(v=>v[0]!=='hear'&&(v[0]!=='which'||hasWhich())).map(v=>v[0]);
  const nv=order[order.indexOf(r.view)+1], ns=T.sections[T.sections.indexOf(S)+1];
  const nextLabel=nv?(nv==='write'?'Now write them →':'Which question? →'):ns?ns.name+' →':'Back to the list';
  open('<span class="fc-card"><span class="fc-k">'+esc(T.name+' · '+S.name+' · '+VIEWS.find(v=>v[0]===r.view)[1])+'</span>'+
    '<span class="fc-t score">'+r.pts+' <span class="fc-n">/ '+max+'</span></span><span class="fc-bar" aria-hidden="true"></span>'+
    '<span class="fc-study">'+(isBest?(prev==null?'Your first score here.':'A new best! It was '+prev+'.'):'Your best is '+prev+'.')+' Longest run: '+r.longest+'.</span>'+
    '<span class="fc">'+(r.miss.length?'<span class="fc-sec"><span class="fc-role">Again</span><span class="fc-in">'+r.miss.map((it,i)=>'<button type="button" class="miss" data-m="'+i+'"><i>▶</i><span>'+phraseHTML(it)+'</span></button>').join('')+'<span class="fc-p" style="font-size:.8rem;color:#8A8378;margin-top:.3rem">These come back in your Daily 5.</span></span></span>':
      '<span class="fc-sec"><span class="fc-role">All</span><span class="fc-in"><span class="fc-p">Every phrase right. Try them in <b>Write</b>, or use them in a real '+esc(T.name.toLowerCase())+'.</span></span></span>')+'</span>'+
    '<span class="outs"><button type="button" class="pri" id="again">Again</button><button type="button" class="sec" id="onward">'+esc(nextLabel)+'</button></span></span>');
  document.querySelectorAll('.miss').forEach(b=>b.onclick=()=>say(r.miss[+b.dataset.m].p));
  $('again').onclick=()=>{ close(); setTimeout(start,260); };
  $('onward').onclick=()=>{ close(); if(nv){ VIEW=nv; } else if(ns){ S=ns; VIEW='hear'; } else VIEW='hear';
    store.set(mem('sec'),S.id); store.set(mem('view'),VIEW); setTimeout(show,260); };
  if(window.Cheer){ try{ isBest&&r.pts>0?Cheer.done($('focus')):Cheer.tick($('focus')); if(r.pts===max) Cheer.finale(); }catch(e){} }
  R=null;
}

/* ── load ── */
Promise.all([
  fetch('/data/writing/hear-phrases.json',{cache:'no-cache'}).then(r=>r.json()),
  fetch('/data/writing/hear-phrases-audio.json',{cache:'no-cache'}).then(r=>r.ok?r.json():{}).catch(()=>({}))
]).then(([d,a])=>{
  D=d; AUDIO=a||{};
  Object.values(D.tasks).forEach(t=>t.sections.forEach(s=>s.items.forEach(it=>{ SPOKEN[it.p]=fullText(it); })));
  K=D.tasks[P.get('task')]?P.get('task'):'essays'; T=D.tasks[K];
  $('back').textContent='← '+T.name; $('back').href='/skills/writing/gate.html?task='+K;
  document.title='INTUITY — Hear the phrases · '+T.name;
  S=T.sections.find(s=>s.id===(P.get('sec')||store.get(mem('sec'),'')))||T.sections[0];
  const v=P.get('view')||store.get(mem('view'),'hear'); VIEW=VIEWS.some(x=>x[0]===v)?v:'hear';
  show();
}).catch(()=>{ $('stage').innerHTML='<p style="text-align:center">The phrases didn’t load. Check your connection and reload.</p>'; });
})();
</script>
