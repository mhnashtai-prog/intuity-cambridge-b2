<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>INTUITY — How to use Writing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..900&family=Geist+Mono:wght@400..600&family=Anton&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   WRITING — HOW TO USE (14 Nov 2026): the "How to use" pill on the Writing
   menu. Three short clips in Maya's voice, the Watch stage and its rules:
     1 · Why   good writers practise, and use ready-made expressions
     2 · Openings  each task opens its own way: five modal cards
     3 · How   three parts · the four doors · notebook, by heart, exercises
   The words on screen are only what to remember; the expressions appear
   whole, exactly as Maya says them (sage underlay). The doors frame copies
   the task page, so the page is recognised, not learned. Each clip ends on
   a still worth a screenshot.
   Every frame is a pure function of one clock t. Until Maya's recording
   exists (AUDIO below), the clock is the wall clock, timed to the script
   at her pace, and the line she will say shows under the stage.
   ═══════════════════════════════════════════════════════════════════════ */
:root{
  --paper:#F3F1EC; --card:#FBFAF7; --ink:#141210; --dim:#5C5852; --faint:#8C867E; --line:rgba(20,17,14,.16);
  --sage:#8AA79C; --sage-ink:#4F6B61; --caramel:#A9875F; --caramel-ink:#7A5C3A; --car:#C2956E;
  --anton:'Anton',Impact,sans-serif; --geist:'Geist',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace; --hand:'Kalam','Bradley Hand',cursive;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#201E1C;color:var(--ink);font-family:var(--geist);-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#fit{position:relative;flex:none}
#stage{position:absolute;left:0;top:0;width:360px;height:640px;transform-origin:0 0;background:var(--paper);overflow:hidden;cursor:pointer}
html.rec,html.rec body{background:var(--paper)}
.xc{position:absolute;top:9px;right:10px;z-index:10;width:30px;height:30px;border-radius:50%;background:rgba(20,17,14,.07);color:rgba(20,17,14,.55);display:grid;place-items:center;font:500 13px/1 var(--geist);text-decoration:none}
.rec .xc{display:none}
.bars{position:absolute;left:20px;right:52px;top:18px;display:flex;gap:5px;z-index:3}
.rec .bars{right:20px}
.bars i{flex:1;height:3px;background:rgba(20,17,14,.12);border-radius:2px;overflow:hidden}
.bars i b{display:block;height:100%;width:0;background:var(--ink)}
.lab{position:absolute;left:20px;top:36px;z-index:3;font:600 9.5px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
.brand{position:absolute;left:20px;bottom:18px;z-index:3;font:500 9.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.brand b{color:var(--ink);font-weight:600}
.sc{position:absolute;left:20px;right:20px;top:60px;bottom:44px}
.sc>*{position:absolute;left:0;right:0}

/* the marks (as in Watch) */
.x{font-weight:680;color:var(--ink);background:linear-gradient(transparent 60%,rgba(138,167,156,.45) 60%);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.k{font:600 9.5px/1.3 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
.mega{font:400 104px/.86 var(--anton);text-transform:uppercase;letter-spacing:-.01em}
.big{font:400 58px/.92 var(--anton);text-transform:uppercase}
.mid{font:400 34px/1 var(--anton);text-transform:uppercase}
.sub{font:400 19px/1.35 var(--geist);color:var(--dim)}
.strike{position:absolute;left:-6px;right:-6px;top:47%;height:9px;background:var(--car);transform-origin:left center;transform:scaleX(0)}

/* 1 · the staircase: it does not happen overnight */
.stairs svg{width:100%;height:150px;overflow:visible}
.stairs path{fill:none;stroke:var(--sage-ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.stairs .d{font:600 9.5px/1 var(--mono);letter-spacing:.16em;fill:var(--faint)}

/* 2 · word by word, then one expression */
.tiles{display:flex;gap:6px;flex-wrap:wrap}
.tiles span{font:500 19px/1 var(--geist);padding:10px 11px;background:#E7E2DA;border-radius:4px;color:#6E675E}
.chunk{display:inline-block;font:700 23px/1 var(--geist);padding:14px 16px;background:var(--card);border-left:5px solid var(--sage);box-shadow:0 18px 30px -20px rgba(20,17,14,.5)}
.chunk .x{font-weight:700}

/* 3 · the deck */
.deck{height:230px}
.deck .cd{position:absolute;left:50%;top:20px;width:176px;margin-left:-88px;height:140px;background:var(--card);padding:16px 16px 0;
  box-shadow:0 1px 0 rgba(20,17,14,.05),0 20px 34px -24px rgba(20,17,14,.55);transform-origin:50% 120%}
.deck .cd i{display:block;width:26px;height:8px;background:var(--caramel);margin-bottom:12px}
.deck .cd b{display:block;font:400 11px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--faint);margin-bottom:9px}
.deck .cd p{font:650 16px/1.3 var(--geist)}
.deck .cd:nth-child(3){z-index:3}.deck .cd:nth-child(2),.deck .cd:nth-child(4){z-index:2}
.tag{display:inline-block;font:600 10px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:#fff;background:var(--caramel);padding:7px 10px;border-radius:999px}

/* clip 2 · the five tasks, then the openings as modal cards (the FiveCard look) */
.tasks{display:flex;flex-direction:column;gap:4px}
.tasks .mid{font-size:50px;line-height:.98}
.nextstep{display:flex;align-items:center;justify-content:center;gap:14px}
.nextstep .dot{width:58px;height:58px;border-radius:50%;background:#201E1C;box-shadow:0 0 0 4px #708A81;display:grid;place-items:center;font:900 24px/1 var(--geist);color:#E5D1B8;flex:none}
.nextstep>span:last-child{font:400 34px/1 var(--anton);text-transform:uppercase}
.nextstep small{display:block;font:600 9.5px/1 var(--mono);letter-spacing:.2em;color:var(--faint);margin-bottom:6px}
.stack{height:470px}
.oc{position:absolute;left:0;right:0;top:0;background:#FAF8F5;border:1px solid rgba(20,17,14,.12);border-radius:6px;padding:16px 18px 14px;
  box-shadow:0 1px 0 rgba(20,17,14,.05),0 26px 46px -26px rgba(20,17,14,.5);transform-origin:50% 0;opacity:0}
.ml{display:flex;align-items:center;gap:10px;font:500 10px/1.3 var(--mono);letter-spacing:.24em;text-transform:uppercase;color:#6B655C}
.ml::before{content:'';width:22px;height:7px;flex:none;background:#B0865C}
.mt{margin-top:8px;font:400 34px/1 var(--anton);text-transform:uppercase;letter-spacing:.005em;color:var(--ink)}
.mb{display:block;width:28px;height:3px;background:var(--ink);margin:10px 0 4px}
.os{padding:14px 0 4px;border-top:1px solid rgba(20,17,14,.12);margin-top:10px}
.os small{display:block;font:500 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#9A5A2C;margin-bottom:8px}
.os p{font:400 22px/1.45 var(--geist);color:var(--ink)}
.os .x{font-weight:600}
.os .own{display:inline-block;font:500 13px/1 var(--mono);letter-spacing:.04em;color:#7A5C3A;background:rgba(169,135,95,.16);border-radius:999px;padding:4px 8px;vertical-align:2px}
.of{margin-top:12px;font:500 10px/1 var(--mono);letter-spacing:.2em;color:var(--faint);text-align:right}

/* 4 · the page in three parts */
.page{background:var(--card);padding:6px 16px;box-shadow:0 22px 44px -28px rgba(20,17,14,.45)}
.band{padding:16px 0 15px;border-top:1px dashed var(--line);position:relative}
.band:first-child{border-top:0}
.band .bl{display:flex;align-items:center;gap:8px;min-height:14px}
.band .bl .k{color:var(--ink)}
.band .st{display:inline-block;margin-top:8px;font:600 9px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--caramel-ink);border:1px solid rgba(169,135,95,.55);padding:3px 6px;border-radius:3px}
.band p{margin-top:9px;font:500 17px/1.3 var(--geist);display:inline-block;border:1.5px solid rgba(169,135,95,var(--nb,0));background:rgba(169,135,95,calc(var(--nb,0)*.12));border-radius:3px;padding:2px 4px;margin-left:-4px}

/* 5 · the four doors, as on the task page */
.doors{display:grid;grid-template-columns:1fr 1fr;gap:34px 12px;padding-top:40px}
.door{display:flex;flex-direction:column;align-items:center;text-align:center;gap:9px;position:relative}
.hang{position:relative;width:84px;height:84px;transform-origin:50% -30px}
.hang::before{content:'';position:absolute;left:50%;top:-30px;width:1px;height:30px;background:linear-gradient(180deg,transparent,rgba(20,17,14,.35));transform:translateX(-50%)}
.hang::after{content:'';position:absolute;left:50%;top:-33px;width:6px;height:6px;border-radius:50%;background:rgba(20,17,14,.35);transform:translateX(-50%)}
.dial{position:absolute;inset:0;border-radius:50%;background:linear-gradient(145deg,#FAF8F5,#E4DDD1);box-shadow:-4px -4px 9px rgba(255,255,255,.9),5px 5px 13px rgba(43,33,41,.16);display:flex;align-items:center;justify-content:center}
.dial::before{content:'';position:absolute;inset:5%;border-radius:50%;background:conic-gradient(#708A81 100%,#4A433D 0)}
.dial::after{content:'';position:absolute;inset:13.5%;border-radius:50%;background:#201E1C}
.dial span{position:relative;z-index:2;font:900 25px/1 var(--geist);color:#E5D1B8}
.door .dn{font:700 15px/1.2 var(--geist)}
.door .dp{font:400 12.5px/1.35 var(--geist);color:var(--dim);max-width:15ch}
.thumb{position:absolute;width:46px;height:46px;border-radius:50%;background:rgba(20,17,14,.26);border:2px solid rgba(255,255,255,.9);box-shadow:0 6px 14px rgba(20,17,14,.2);z-index:4;pointer-events:none}

/* 6 · a screen is not enough: the notebook */
.phone{left:50%!important;right:auto!important;width:118px;height:220px;margin-left:-59px;border:3px solid var(--ink);border-radius:22px;background:var(--card)}
.phone::before{content:'';position:absolute;left:50%;top:9px;width:34px;height:5px;border-radius:3px;background:var(--ink);margin-left:-17px}
.phone i{position:absolute;left:14px;right:14px;height:7px;border-radius:4px;background:#E2DCD2}
.nb{height:250px;background:#FFFEFA;box-shadow:0 22px 44px -28px rgba(20,17,14,.45);
  background-image:linear-gradient(90deg,transparent 38px,rgba(196,90,70,.45) 38px,rgba(196,90,70,.45) 39.5px,transparent 39.5px),repeating-linear-gradient(transparent 0 37px,rgba(70,110,160,.22) 37px 38px);
  background-position:0 0,0 22px}
.nb .hw{position:absolute;left:52px;top:44px;right:12px;font:400 30px/38px var(--hand);color:#1F2B44;white-space:pre-wrap}
.nb .hw b{font-weight:400;opacity:0}
.habits{display:flex;flex-direction:column;gap:10px}
.habits div{display:flex;align-items:center;gap:12px;font:600 21px/1 var(--geist)}
.habits div::before{content:'✓';width:28px;height:28px;border-radius:50%;background:var(--sage-ink);color:#fff;display:grid;place-items:center;font:700 15px/1 var(--geist);flex:none}

/* 7 · ten minutes a day */
.week{display:flex;justify-content:space-between}
.week div{display:flex;flex-direction:column;align-items:center;gap:8px}
.week i{display:block;width:30px;height:30px;border-radius:50%;border:2px solid var(--sage-ink);background:var(--sage-ink);transform:scale(0)}
.week small{font:600 9.5px/1 var(--mono);letter-spacing:.12em;color:var(--faint)}
.week .ring{position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;border:2px solid #CFC8BD}
.week .dw{position:relative;width:30px;height:30px}
.cram{position:relative;height:96px;background:#E7E2DA;display:flex;flex-direction:column;justify-content:center;padding:0 18px}
.cram b{font:400 30px/1 var(--anton);text-transform:uppercase;color:#6E675E}
.cram small{font:600 9.5px/1.3 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-top:6px}
.cram .strike{top:44%;height:7px;background:#B4532F}
.go{display:inline-block;background:var(--sage);color:#fff;font:600 17px/1 var(--geist);padding:15px 24px;border-radius:999px;text-decoration:none}
.doorlist{display:flex;flex-direction:column;gap:7px}
.doorlist div{display:grid;grid-template-columns:26px 1fr;align-items:baseline;font:600 16px/1.2 var(--geist)}
.doorlist b{font:400 20px/1 var(--anton);color:var(--sage-ink)}

/* the line Maya will say, while there is no recording yet */
.say{width:min(100vw,460px);padding:10px 16px 0;font:italic 400 13px/1.4 var(--geist);color:#CFC8BD;text-align:center;min-height:3.2em;flex:none}
.say b{font:600 9px/1 var(--mono);font-style:normal;letter-spacing:.16em;text-transform:uppercase;color:#8C867E;display:block;margin-bottom:4px}
.rec .say{display:none}

/* controls — app only (as in Watch) */
.ctl{width:min(100vw,460px);display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:10px 12px 4px;flex:none}
.ctl button{font:500 12.5px/1 var(--geist);color:#E9E4DB;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);padding:9px 12px;border-radius:999px;cursor:pointer}
.ctl button.on{background:#F3F1EC;color:#201E1C;border-color:#F3F1EC}
.rec .ctl{display:none}
.veil{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:9;background:rgba(243,241,236,.84);backdrop-filter:blur(2px);font:600 15px/1 var(--geist);color:var(--ink)}
.veil[hidden]{display:none}
.veil .play{width:74px;height:74px;border-radius:50%;background:var(--ink);display:grid;place-items:center}
.veil .play::after{content:"";margin-left:6px;border-left:22px solid var(--paper);border-top:14px solid transparent;border-bottom:14px solid transparent}
.veil .vr{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.veil .vr a,.veil .vr button{font:600 15px/1 var(--geist);padding:13px 18px;border-radius:999px;border:1.5px solid var(--ink);background:none;color:var(--ink);text-decoration:none;cursor:pointer}
.veil .vr a{background:var(--ink);color:#fff}
@media(prefers-reduced-motion:reduce){.veil{backdrop-filter:none}}
</style>
</head>

</div></div>

<script>
(function(){
'use strict';
const Q=new URLSearchParams(location.search), REC=Q.has('rec');
if(REC) document.documentElement.classList.add('rec');
const $=id=>document.getElementById(id), stage=$('stage'), fit=$('fit');
const ease=p=>1-Math.pow(1-p,3), cl=v=>Math.min(1,Math.max(0,v));
const back=p=>1+2.2*Math.pow(p-1,3)+1.2*Math.pow(p-1,2);   /* ease-out with a small overshoot: the snap */

/* Maya's recording, once it exists: one mp3 for both clips (the times below are its seconds) */
const AUDIO=null;
const PARTS=['Why','Openings','How'], B=79;   /* B: clip 3 starts here; its times are B + seconds */
const CLIPS=[[0,24],[24,B],[B,B+58]];

/* ── THE SCRIPT, with the second each line starts (Maya's pace, about 1.85 words a second) ── */
const SAY=[
  [0.3,"Good writers aren't born."],
  [2.9,"They practise, like a swimmer or a guitarist, and it doesn't happen overnight."],
  [11,"They don't build every sentence from zero:"],
  [15,"they use ready-made expressions, like “On the other hand” or “The main reason is that”."],
  [24.3,"Every task has its own expressions: the essay, the review, the report, the email, the article and the story."],
  [34,"And each one opens in its own way."],
  [38.5,"An essay starts with the big picture."],
  [42.8,"A review grabs the reader's attention right away."],
  [47.2,"A report states its mission clearly."],
  [51.4,"An email matches the vibe: friendly for a friend, formal for a company."],
  [58.6,"An article talks straight to the reader."],
  [63,"And a story starts with the sentence you're given, then sets the scene."],
  [71,"Learn the openings, and everything else gets easier."],
  [75.5,"Your first step: Learn it."],
  [B+0.3,"Every task has three parts: an introduction, a body, and a conclusion."],
  [B+6.7,"In a story, a beginning, a middle, and an end."],
  [B+11.7,"Each part has its own job and its own expressions."],
  [B+17.7,"Four steps."],
  [B+19.2,"Step one, Learn it: the shape, the models and the expressions."],
  [B+25.2,"Step two, Practise it: play with them until you remember them."],
  [B+31.2,"Step three, Work on a question: build an answer, step by step."],
  [B+37.7,"Step four, Write it: your own answer, from memory."],
  [B+43.2,"Copy the expressions into your notebook."],
  [B+47.2,"Ten minutes a day beats two hours the night before."],
  [B+53.2,"Let's start."]
];

/* THE OPENINGS (15 Nov 2026, the owner and the critique): every task opens its own way,
   each on a modal card in the FiveCard look; the card before steps back into a stack.
   [label, job (the card's title), [[row label, sentence, appears]], start]; {word} = the pupil's own.
   The story's first sentence is given in the exam, so its card says so. */
const OPEN=[
  ['The essay · Part 1','Start with the big picture',[['',"Nowadays, people often debate whether {topic} is a positive or negative thing."]],38.5],
  ['The review · Part 2','Grab their attention',[['',"Have you ever wondered what it’s like to {visit X}? Let me tell you all about it."]],42.8],
  ['The report · Part 2','State your mission clearly',[['',"The aim of this report is to outline the main issues with {topic} and suggest ways to improve it."]],47.2],
  ['The email · Part 1','Match the vibe immediately',[['Informal',"Thanks so much for your email! It’s great to hear from you, and I’d love to tell you about …"],['Formal',"I am writing in response to your advertisement regarding …",55.2]],51.4],
  ['The article · Part 2','Talk straight to the reader',[['',"Imagine a world without {X}. Hard to picture, isn’t it?"]],58.6],
  ['The story · Part 2','Start with the given sentence',[['Given',"It was the last day of the summer holidays."],['Then set the scene',"{Name} had no idea what was about to happen.",66.6]],63]
];
const sent=x=>x.replace(/\{([^}]*)\}|([^{]+)/g,(m,o,t)=>o!=null?'<span class="own">'+o+'</span>':'<span class="x">'+t+'</span>');

/* ── THE SCENES: [start, html]. data-t = appears; data-out = leaves; other data-* = one movement each ── */
const DOORS=[['Learn it','The shape, the models, the expressions',B+19.2],['Practise it','Play until you remember',B+25.2],['Work on a question','Build an answer, step by step',B+31.2],['Write it','Your own answer, from memory',B+37.7]];
const SC=[
  {t:0, clip:0, h:
    '<div class="k rv" data-t="0.2" style="top:40px">Good writers are</div>'+
    '<div class="mega rv" data-t="0.3" style="top:62px"><span style="position:relative;display:inline-block">Born<i class="strike" data-g="1.7"></i></span></div>'+
    '<div class="big rv" data-t="3.1" style="top:166px;font-size:52px;color:var(--sage-ink)">Practised.</div>'+
    '<div class="stairs rv" data-t="7.4" style="top:270px"><svg viewBox="0 0 320 150"><path data-draw="7.6" data-dur="3.2" d="M4 140 H52 V116 H100 V92 H148 V70 H196 V48 H244 V26 H292 V6 H316"/>'+
      '<text class="d rv" data-t="7.8" x="4" y="160">DAY 1</text><text class="d rv" data-t="10.4" x="316" y="-6" text-anchor="end">DAY 60</text></svg></div>'+
    '<div class="sub rv" data-t="8.6" style="top:470px">Not overnight.</div>'},
  {t:11, clip:0, h:
    '<div class="k rv" data-t="11.2" style="top:40px">Word by word</div>'+
    '<div class="tiles" style="top:66px" data-dim="17">'+['On','the','other','hand'].map((w,i)=>'<span class="rv wob" data-t="'+(11.6+i*0.85)+'">'+w+'</span>').join('')+'</div>'+
    '<div class="k rv" data-t="16.6" style="top:178px">Or one expression</div>'+
    '<div style="top:204px"><span class="chunk snap" data-t="17.4"><span class="x">On the other hand,</span></span></div>'+
    '<div style="top:290px"><span class="chunk snap" data-t="20.9"><span class="x">The main reason is that</span></span></div>'+
    '<div class="sub rv" data-t="22" style="top:390px">Good writers don’t start from zero.</div>'},
  /* clip 2 · the openings: all six tasks named, then one card each */
  {t:24, clip:1, h:
    '<div class="k rv" data-t="24.4" style="top:30px">Every task · its own expressions</div>'+
    '<div class="tasks" style="top:58px">'+['Essay','Review','Report','Email','Article','Story'].map((w,i)=>'<div class="mid rv" data-t="'+[26.2,27.3,28.3,29.5,30.6,31.8][i]+'">'+w+'</div>').join('')+'</div>'+
    '<div class="sub rv" data-t="34.2" style="top:440px">Each one opens<br>in its own way.</div>'},
  {t:38.3, clip:1, h:
    '<div class="k rv" data-t="38.4" style="top:8px">How each one opens</div>'+
    '<div class="stack" style="top:62px">'+OPEN.map((c,i)=>'<div class="oc" data-card="'+c[3]+'" data-i="'+i+'"><div class="ml">'+c[0]+'</div><div class="mt">'+c[1]+'</div><span class="mb"></span>'+
      c[2].map((r,j)=>'<div class="os'+(r[2]?' rv':'')+'"'+(r[2]?' data-t="'+r[2]+'"':'')+'>'+(r[0]?'<small>'+r[0]+'</small>':'')+'<p>'+sent(r[1])+'</p></div>').join('')+
      '<div class="of">'+(i+1)+' / '+OPEN.length+'</div></div>').join('')+'</div>'},
  {t:71, clip:1, h:
    '<div class="big rv" data-t="71.1" style="top:20px;font-size:50px">Learn the<br>openings.</div>'+
    '<div class="sub rv" data-t="72.4" style="top:128px">Everything else gets easier.</div>'+
    '<div class="deck" style="top:196px">'+OPEN.map((c,i)=>'<div class="cd" data-fan="'+(72.9+i*0.16)+'" data-r="'+((i-2.5)*6)+'" data-dx="'+((i-2.5)*27)+'"><i></i><b>'+c[0].split(' · ')[0].replace('The ','')+'</b><p><span class="x">'+c[2][0][1].replace(/\{[^}]*\}/g,'…').split(/[.?!]/)[0].split(' ').slice(0,6).join(' ')+' …</span></p></div>').join('')+'</div>'+
    /* the action, not a promise (the critique): where to begin */
    '<div class="nextstep rv" data-t="75.6" style="top:430px"><span class="dot">1</span><span><small>Your first step</small>Learn it</span></div>'},
  /* clip 3 · how: the three parts, the four steps, the habits */
  {t:B, clip:2, h:
    '<div class="k rv" data-t="'+(B+0.3)+'" style="top:22px">Every task · three parts</div>'+
    '<div class="page rv" data-t="'+(B+0.6)+'" style="top:50px">'+
      [['Introduction','Beginning: set the scene','Open: say what it is about',B+2.4],['Body','Middle: what happens','Develop: one idea a paragraph',B+3.9],['Conclusion','End: how it ends','Close: your view or your advice',B+5.4]]
      .map((b,i)=>'<div class="band"><div class="bl"><span class="k rv" data-t="'+b[3]+'">'+b[0]+'</span></div>'+
        '<p class="rv nmb" data-t="'+(b[3]+0.2)+'" data-nb="'+(B+12.2+i*0.5)+'">'+b[2]+'</p>'+
        '<div class="st rv" data-t="'+(B+7+i*0.7)+'">Story · '+b[1]+'</div></div>').join('')+'</div>'+
    '<div class="sub rv" data-t="'+(B+12.6)+'" style="top:430px">Each part: its own job,<br>its own expressions.</div>'},
  {t:B+17.5, clip:2, h:
    '<div class="k rv" data-t="'+(B+17.6)+'" style="top:6px">Every task page · four steps</div>'+
    '<div class="doors" style="top:10px">'+DOORS.map((d,i)=>'<div class="door" data-lit="'+d[2]+'"><div class="hang" data-swing="'+i+'"><div class="dial"><span>'+(i+1)+'</span></div></div><div class="dn">'+d[0]+'</div><div class="dp">'+d[1]+'</div></div>').join('')+'</div>'+
    '<div class="thumb" id="thumb" style="left:auto;right:auto" data-tap="'+(B+41.6)+'"></div>'},
  {t:B+43, clip:2, h:
    '<div class="phone" data-shrink="'+(B+44.3)+'" style="top:70px"><i style="top:40px"></i><i style="top:58px;right:34px"></i><i style="top:76px"></i><i style="top:94px;right:48px"></i></div>'+
    '<div class="big rv" data-t="'+(B+43.1)+'" data-out="'+(B+44.5)+'" style="top:320px;text-align:center">A screen<br>isn’t enough.</div>'+
    '<div class="nb rv" data-t="'+(B+44.9)+'" style="top:20px"><div class="hw" data-write="'+(B+45.2)+'" data-dur="1.8">On the other hand,</div></div>'+
    '<div class="habits" style="top:310px"><div class="rv" data-t="'+(B+45.4)+'">Notebook</div><div class="rv" data-t="'+(B+45.9)+'">By heart</div><div class="rv" data-t="'+(B+46.4)+'">Exercises</div></div>'},
  {t:B+47.2, clip:2, h:
    '<div class="k rv" data-t="'+(B+47.3)+'" style="top:30px">Ten minutes a day</div>'+
    '<div class="week" style="top:62px">'+'MTWTFSS'.split('').map((d,i)=>'<div><span class="dw"><span class="ring"></span><i data-pop="'+(B+47.7+i*0.32)+'"></i></span><small>'+d+'</small></div>').join('')+'</div>'+
    '<div class="k rv" data-t="'+(B+50.4)+'" style="top:160px">Beats</div>'+
    '<div class="cram rv" data-t="'+(B+50.7)+'" style="top:186px"><b>2 hours</b><small>The night before</small><i class="strike" data-g="'+(B+51.7)+'"></i></div>'},
  {t:B+53.2, clip:2, h:
    '<div class="big rv" data-t="'+(B+53.3)+'" style="top:20px">10 min<br>a day.</div>'+
    '<div class="doorlist" style="top:170px">'+DOORS.map((d,i)=>'<div class="rv" data-t="'+(B+53.8+i*0.15)+'"><b>'+(i+1)+'</b>'+d[0]+'</div>').join('')+'</div>'+
    '<div class="habits" style="top:330px;gap:8px"><div class="rv" data-t="'+(B+54.6)+'" style="font-size:16px">Notebook · By heart · Exercises</div></div>'+
    '<div style="top:420px"><a class="go rv" id="start" data-t="'+(B+55.1)+'" href="/index.html?openModal=writing">Let’s start</a></div>'}
];
/* each clip ends on its last scene, held: a still worth a screenshot */
const END=CLIPS[CLIPS.length-1][1];

/* ── the stage ── */
function size(){
  const W=Math.min(document.documentElement.clientWidth||innerWidth,window.visualViewport?visualViewport.width:innerWidth,innerWidth);
  const H=window.visualViewport?visualViewport.height:innerHeight;
  const ch=REC?0:$('ctl').offsetHeight+$('say').offsetHeight, k=Math.min(W/360,(H-ch)/640);
  fit.style.width=360*k+'px'; fit.style.height=640*k+'px'; stage.style.transform='scale('+k+')';
}
addEventListener('resize',size);

let built=-1;
function build(i){
  $('sc').innerHTML=SC[i].h; built=i;
  $('lab').textContent=(SC[i].clip+1)+' · '+PARTS[SC[i].clip];
  $('sc').querySelectorAll('[data-draw]').forEach(p=>{ const L=p.getTotalLength(); p.style.strokeDasharray=L; p.dataset.len=L; });
  $('sc').querySelectorAll('[data-write]').forEach(h=>{ h.innerHTML=[...h.textContent].map(c=>'<b>'+(c===' '?' ':c)+'</b>').join(''); });
  /* the opening cards share one height, so the stack behind stays tidy */
  /* the opening cards keep their own height, in the middle third of the screen */
  const cs=[...$('sc').querySelectorAll('.oc')]; if(cs.length){ const mx=Math.max(...cs.map(c=>c.offsetHeight));
    $('sc').querySelector('.stack').style.top=Math.max(40,Math.round((536-mx)/2))+'px'; }
  const th=$('thumb'); if(th){ const d=$('sc').querySelector('.door .hang'), r=d.getBoundingClientRect(), s=$('sc').getBoundingClientRect(), k=r.width/84;
    th.dataset.x=((r.left-s.left)/k+44); th.dataset.y=((r.top-s.top)/k+44); }
}
function draw(t){
  let i=0; while(i<SC.length-1&&t>=SC[i+1].t) i++;
  if(i!==built) build(i);
  const s=SC[i], nxt=i<SC.length-1?SC[i+1].t:1e9, sc=$('sc');
  const enter=ease(cl((t-s.t)/0.45)), leave=SC[i+1]&&SC[i+1].clip!==s.clip?1:cl((nxt-t)/0.3);
  sc.style.opacity=Math.min(i===0?1:enter,leave); sc.style.transform='translateY('+((i===0?0:(1-enter)*16)-(1-leave)*8).toFixed(1)+'px)';
  sc.querySelectorAll('.rv').forEach(el=>{
    const p=ease(cl((t-(+el.dataset.t))/0.45)), o=el.dataset.out?cl((+el.dataset.out+0.35-t)/0.35):1;
    el.style.opacity=Math.min(p,o); if(el.tagName!=='text') el.style.transform='translateY('+((1-p)*8).toFixed(1)+'px)';
  });
  /* the word tiles stutter in, then step back when the expression arrives */
  sc.querySelectorAll('.wob').forEach(el=>{ const a=t-(+el.dataset.t); if(a>0&&a<0.5) el.style.transform='rotate('+(Math.sin(a*30)*4*(1-a/0.5)).toFixed(2)+'deg)'; });
  sc.querySelectorAll('[data-dim]').forEach(el=>{ el.style.opacity=(1-0.6*ease(cl((t-(+el.dataset.dim))/0.5))).toFixed(2); });
  /* the expression drops in whole, and snaps */
  sc.querySelectorAll('.snap').forEach(el=>{ const p=cl((t-(+el.dataset.t))/0.55); el.style.opacity=cl(p*3); el.style.transform='translateY('+(-70*(1-back(p))).toFixed(1)+'px)'; });
  sc.querySelectorAll('[data-g]').forEach(el=>{ el.style.transform='scaleX('+ease(cl((t-(+el.dataset.g))/0.4)).toFixed(3)+')'; });
  sc.querySelectorAll('[data-draw]').forEach(p=>{ const q=cl((t-(+p.dataset.draw))/(+p.dataset.dur)); p.style.strokeDashoffset=(+p.dataset.len*(1-q)).toFixed(1); });
  sc.querySelectorAll('[data-fan]').forEach(el=>{ const p=back(cl((t-(+el.dataset.fan))/0.6)), q=cl((t-(+el.dataset.fan)+0.3)/0.3);
    el.style.opacity=q; el.style.transform='translateX('+(+el.dataset.dx*p).toFixed(1)+'px) rotate('+(+el.dataset.r*p).toFixed(2)+'deg)'; });
  /* the openings: each card rises as a modal; the ones before step back into a stack */
  sc.querySelectorAll('[data-card]').forEach(el=>{ const i=+el.dataset.i, p=ease(cl((t-(+el.dataset.card))/0.5));
    let d=0; OPEN.forEach((c,j)=>{ if(j>i) d+=ease(cl((t-c[3])/0.5)); });
    el.style.zIndex=i+1; el.style.opacity=(p*(d>2.6?Math.max(0,3.4-d):1)).toFixed(2);
    el.style.transform='translateY('+((1-p)*70-d*14).toFixed(1)+'px) scale('+(1-d*0.045).toFixed(3)+')';
    /* a card behind shows only its top edge: no second task's words under the top card */
    const cut=cl(d); el.style.clipPath=cut>0?'inset(0 0 calc('+(cut*100).toFixed(1)+'% - '+(cut*40).toFixed(1)+'px) 0 round 6px)':'';
    el.style.filter=d>0.05?'brightness('+(1-Math.min(d,1)*0.04).toFixed(3)+')':''; });
  sc.querySelectorAll('[data-nb]').forEach(el=>el.style.setProperty('--nb',cl((t-(+el.dataset.nb))/0.4).toFixed(2)));
  /* the doors swing as on the page; each lights up when Maya names it */
  sc.querySelectorAll('[data-swing]').forEach(el=>{ el.style.transform='rotate('+(4*Math.sin((t/5.2+(+el.dataset.swing)*-0.33)*2*Math.PI)).toFixed(2)+'deg)'; });
  sc.querySelectorAll('[data-lit]').forEach(el=>{ const p=ease(cl((t-(+el.dataset.lit))/0.5)), on=t>=s.t+0.3;
    el.style.opacity=on?(0.28+0.72*p).toFixed(2):cl((t-s.t)/0.45)*0.28;
    el.querySelectorAll('.dn,.dp').forEach(x=>x.style.opacity=p); });
  const th=$('thumb'); if(th&&th.dataset.x){ const a=t-(+th.dataset.tap);
    th.style.left=th.dataset.x+'px'; th.style.top=(+th.dataset.y+40*(1-ease(cl((a+0.9)/0.8))))+'px';
    th.style.opacity=a<-0.9?0:a<0.9?1:cl(1-(a-0.9)/0.4); th.style.transform='scale('+(a>0&&a<0.3?0.82:1)+')';
    const d1=sc.querySelector('.door .dial'); if(d1) d1.style.transform='scale('+(a>0&&a<0.3?0.94:1)+')'; }
  sc.querySelectorAll('[data-shrink]').forEach(el=>{ const p=ease(cl((t-(+el.dataset.shrink))/0.6)), e=ease(cl((t-s.t)/0.4));
    el.style.opacity=(e*(1-p)).toFixed(2); el.style.transform='scale('+(1-0.45*p).toFixed(3)+')'; });
  sc.querySelectorAll('[data-write]').forEach(h=>{ const L=h.children.length, n=Math.floor(cl((t-(+h.dataset.write))/(+h.dataset.dur))*L);
    [...h.children].forEach((c,j)=>c.style.opacity=j<n?1:0); });
  sc.querySelectorAll('[data-pop]').forEach(el=>{ el.style.transform='scale('+back(cl((t-(+el.dataset.pop))/0.35)).toFixed(3)+')'; });
  /* the bars, and the line Maya says */
  const bs=$('bars').children; CLIPS.forEach(([a,b],p)=>{ bs[p].firstChild.style.width=(cl((t-a)/(b-a))*100)+'%'; });
  if(!AUDIO){ let j=-1; SAY.forEach((x,k)=>{ if(t>=x[0]) j=k; }); const line=j<0?'':SAY[j][1];
    if($('say').dataset.l!==line){ $('say').dataset.l=line; $('say').innerHTML=line?'<b>Maya will say · preview</b>'+line:''; } }
}

/* ── the clock: the recording, or the wall clock ── */
let audio=null, playing=false, t0=0, tAt=0, to=END, part=-1;
const now=()=>audio&&!audio.paused&&audio.currentTime>0?audio.currentTime:(playing?tAt+(performance.now()-t0)/1000:tAt);
function loop(){ if(!playing) return; const t=now(); draw(Math.min(t,to)); if(t>=to){ stop(); return; } requestAnimationFrame(loop); }
function play(a,b){ to=b; tAt=a; playing=true; $('veil').hidden=true; t0=performance.now();
  if(audio){ const A=audio, go=()=>{ A.currentTime=a; A.play().catch(()=>{ audio=null; t0=performance.now(); }); };
    if(A.readyState>=1) go(); else { A.addEventListener('loadedmetadata',go,{once:true}); A.load(); } }
  requestAnimationFrame(loop); }
function pause(){ tAt=now(); playing=false; if(audio) audio.pause(); veil('Paused · tap to go on','pause'); }
function resume(){ if(audio){ audio.currentTime=tAt; audio.play(); } playing=true; t0=performance.now(); $('veil').hidden=true; requestAnimationFrame(loop); }
function stop(){ playing=false; if(audio) audio.pause(); tAt=to;
  if(!REC){ /* the clip's last frame stays: a still worth a screenshot; the end row sits under it */
    const last=part<0||part===PARTS.length-1;
    veil('','end'); const v=$('veil'); v.style.background='transparent'; v.style.backdropFilter='none'; v.style.justifyContent='flex-end'; v.style.paddingBottom='46px';
    $('vrow').innerHTML='<button type="button" id="again">↻ Again</button>'+(last?'':'<button type="button" id="vnext">Clip '+(part+2)+' · '+PARTS[part+1]+' ›</button>');
    $('again').onclick=e=>{ e.stopPropagation(); go(part); };
    if($('vnext')) $('vnext').onclick=e=>{ e.stopPropagation(); go(part+1); };
    if(last) $('vrow').hidden=true;   /* "Let's start" is on the frame itself */
  } }
function veil(txt,mode){ const v=$('veil'); v.hidden=false; v.removeAttribute('style'); $('vtx').textContent=txt; v.dataset.mode=mode;
  $('vplay').hidden=mode==='end'; $('vrow').hidden=mode!=='end'; }
stage.onclick=e=>{
  if(e.target.closest('.vr')||e.target.closest('.go')||e.target.closest('.xc')) return;
  if(playing) return pause();
  if($('veil').dataset.mode==='pause') return resume();
  go(part);
};
function go(p){ part=p; [...$('ctl').querySelectorAll('button')].forEach(b=>b.classList.toggle('on',+b.dataset.p===p));
  if(p<0) play(0,END); else play(CLIPS[p][0],CLIPS[p][1]); }

/* the cross and "Let's start" go back where the pupil came from (the Writing menu) */
const ref=(()=>{ try{ const r=new URL(document.referrer); return r.origin===location.origin&&r.pathname!==location.pathname?r.pathname+r.search:null; }catch(e){ return null; } })();
const home=ref&&/index\.html|^\/$/.test(ref)?'/index.html?openModal=writing':ref||'/index.html?openModal=writing';
$('xc').href=home; $('xc').onclick=e=>{ e.stopPropagation(); if(audio) audio.pause(); };
if(AUDIO&&!Q.has('silent')){ audio=new Audio(AUDIO); audio.preload='auto'; }
if(!REC){ $('ctl').innerHTML='<button data-p="-1" class="on">Watch all</button>'+PARTS.map((p,i)=>'<button data-p="'+i+'">'+(i+1)+' · '+p+'</button>').join('');
  $('ctl').querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.p)); }
$('bars').innerHTML=CLIPS.map(()=>'<i><b></b></i>').join('');
const sp=Q.get('part'); if(sp!==null&&PARTS[+sp]) part=+sp;
size(); draw(part<0?1.2:CLIPS[part][0]+1.2); veil(REC?'Tap to start':'Tap to watch','start');
document.fonts.ready.then(()=>{ built=-1; draw(tAt||(part<0?1.2:CLIPS[part][0]+1.2)); size(); window.HOW.ready=true; });
/* "Let's start" is drawn fresh with each scene: point it home too */
new MutationObserver(()=>{ const s=$('start'); if(s) s.href=home; }).observe($('sc'),{childList:true});
window.HOW={ready:false, seek:t=>{ $('veil').hidden=true; draw(t); }, end:END, clips:CLIPS};
})();
</script>
