<style>
:root{
  --bg:#f0efec;--ink:#111111;--white:#ffffff;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;position:fixed;background:var(--bg);font-family:'Geist', sans-serif;-webkit-font-smoothing:antialiased}
.shell{position:fixed;inset:0;display:flex;flex-direction:column}

.topbar{flex-shrink:0;display:flex;align-items:flex-start;justify-content:space-between;padding:0.65rem 1.25rem;background:rgba(240,239,236,0.95);backdrop-filter:blur(12px);border-bottom:1.5px solid rgba(0,0,0,0.07);z-index:100}
.back-link{text-decoration:none;font-size:0.72rem;font-weight:700;color:rgba(0,0,0,0.38);letter-spacing:0.05em;text-transform:uppercase;transition:color 0.2s}
.back-link:hover{color:rgba(0,0,0,0.65)}
.brand{font-family:'Geist', sans-serif;font-size:0.7rem;font-weight:900;letter-spacing:0.28em;text-transform:uppercase;color:rgba(0,0,0,0.18)}

.filter-bar{flex-shrink:0;display:flex;align-items:center;gap:0.25rem;padding:0.45rem 1.1rem;background:rgba(240,239,236,0.8);border-bottom:1px solid rgba(0,0,0,0.06);overflow-x:auto}
.filter-bar::-webkit-scrollbar{display:none}
.ftab{background:transparent;border:none;padding:0.28rem 0.65rem;border-radius:2rem;font-family:'Geist', sans-serif;font-size:0.6875rem;font-weight:700;color:rgba(0,0,0,0.3);cursor:pointer;transition:all 0.2s;white-space:nowrap;letter-spacing:0.06em;text-transform:uppercase}
.ftab:hover{color:rgba(0,0,0,0.55);background:rgba(0,0,0,0.05)}
.ftab.active{background:var(--ink);color:#fff}

.stage{flex:1;min-height:0;position:relative;overflow-y:auto;display:flex;align-items:flex-start;justify-content:center;padding:1.5rem 0 2rem}

.foot{flex-shrink:0;display:flex;justify-content:center;padding:0.5rem 1rem calc(env(safe-area-inset-bottom,0px) + 0.55rem);background:rgba(240,239,236,0.95);border-top:1px solid rgba(0,0,0,0.06)}
.nav-pill{display:flex;gap:0.12rem;background:rgba(10,10,10,0.07);border-radius:2rem;padding:0.25rem 0.28rem}
.nb{background:transparent;border:none;padding:0.35rem 0.75rem;border-radius:1.5rem;font-family:'Geist', sans-serif;font-size:0.6875rem;letter-spacing:0.03em;color:rgba(0,0,0,0.28);cursor:pointer;transition:all 0.22s;white-space:nowrap;min-height:28px;font-weight:700;text-transform:uppercase}
.nb.on{background:var(--ink);color:#fff;font-weight:800}
.nb:hover:not(.on){color:rgba(0,0,0,0.5)}

/* ══ POSTER CARD — now built on the shell's .poster (intuity-shell.css §14) ══
   Only sizing, the essay-specific list, and the footer nav live here.
   Everything else — paper colour, kicker block, headline font, rule,
   pills — comes from the shell so this card matches every other page. */
.poster{width:min(730px,90vw);max-height:min(560px,82vh);display:flex;flex-direction:column;overflow:hidden;animation:cardEnter 0.4s cubic-bezier(0.2,1,0.4,1) both}
@keyframes cardEnter{from{opacity:0;transform:translateY(10px) scale(0.98)}to{opacity:1;transform:none}}

.poster-scroll{flex:1;overflow-y:auto;min-height:0}

.kp-list{display:flex;flex-direction:column;gap:0.55rem;margin-top:0.2rem}
.kp-item{display:flex;align-items:flex-start;gap:0.55rem;font-family:var(--f-body);font-size:0.85rem;font-weight:500;line-height:1.4;color:var(--poster-body)}
.kp-arrow{flex-shrink:0;width:16px;height:16px;margin-top:0.1rem;color:var(--caramel);opacity:0.8}

.poster-foot{display:flex;align-items:center;justify-content:space-between;margin-top:1.1rem;padding-top:0.9rem;border-top:1px solid var(--poster-rule)}
.poster-nav-btn{background:none;border:none;cursor:pointer;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--poster-faint);transition:background 0.15s,color 0.15s}
.poster-nav-btn:hover{background:var(--poster-fill);color:var(--poster-ink)}
.poster-nav-btn:disabled{opacity:0.25;cursor:default}
.poster-counter{font-family:var(--f-mono);font-size:0.75rem;font-weight:600;letter-spacing:0.04em;color:var(--poster-faint)}

.swipe-hint{position:absolute;bottom:1.2rem;left:50%;transform:translateX(-50%);font-size:0.6875rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:rgba(0,0,0,0.18);pointer-events:none;animation:hintFade 3.5s ease 1.5s forwards;white-space:nowrap}
@keyframes hintFade{0%{opacity:1}80%{opacity:1}100%{opacity:0}}
.stage #parade{width:100%;align-self:flex-start}
.stage{padding-top:.4rem}
/* on a phone the essay types are one line that slides, not five that
   wrap: the strip below is what needs the height */
@media(max-width:700px){
  .wr-filters.filter-bar{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;scrollbar-width:none;max-width:100%;
    padding:0 1rem;-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}
  .wr-filters.filter-bar::-webkit-scrollbar{display:none}
}
/* the parade's columns, for an essay question: the type in Anton, the
   question, then what the essay should cover */
.pa .kp-list{margin-top:.6rem}
.pa .kp-item{font-size:clamp(14px,3.9vw,16px)}
.pa-sub{display:block;margin-top:14px;font:600 .625rem/1 var(--f-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--pa-faint)}
.pm{display:block}
.pm-w{display:block;margin:10px 0 2px;font:600 .6rem/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--pa-faint)}
.pm-w:first-child{margin-top:0}
.pm-p{display:block;font-size:clamp(13.5px,3.6vw,15px);line-height:1.45;font-weight:500}
.cin .btn,#cAct .btn{white-space:nowrap}
.pm-more{display:flex;justify-content:center;margin:2px 0 6px}
.mine{max-width:520px;margin:10px auto 0;padding:0 16px}
.mine-h{font:600 .625rem/1 var(--f-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--pa-faint,#8A8378);margin:10px 0 6px}
.mine-c{display:block;width:100%;text-align:left;border:none;background:#FCFAF7;border-radius:12px;padding:10px 12px;margin:0 0 6px;cursor:pointer;font:inherit;color:#14110E}
.mine-c b{display:block;font-size:13px;margin-bottom:2px} .mine-c span{font-size:13px;color:#5C5852;line-height:1.4}
.pm-more .btn{font:600 14px/1 'Geist',sans-serif;padding:11px 20px!important;border-radius:999px!important;border:none;background:rgba(118,118,128,.12)!important;color:#14110E;cursor:pointer}
.mp{margin:4px 0 0;font-size:clamp(15px,3.9vw,17px);line-height:1.55;font-weight:500}
.loading-msg{font-family:'Geist', sans-serif;font-size:0.85rem;font-weight:700;color:rgba(0,0,0,0.25);letter-spacing:0.12em;text-transform:uppercase}
</style>

<style>
/* the procession's instruction and arrows (2 Nov 2026) */
.pm-do{max-width:520px;margin:-4px auto 10px;padding:0 24px;text-align:center;font-size:15px;line-height:1.45;color:#3A3530}
.pm-do b{color:#14110E;font-weight:650}
.pm-nav{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 12px}
.pm-nav .pa-count{margin:0;min-width:64px;text-align:center;font:600 13px/1 'Geist Mono',monospace;letter-spacing:.06em;color:#5C5852}
.pm-nav .pa-count b{color:#14110E}
.pm-ar{width:44px;height:44px;border-radius:50%;border:none;background:rgba(118,118,128,.12);color:#14110E;font:500 26px/1 'Geist',sans-serif;cursor:pointer;display:grid;place-items:center;padding:0 0 3px}
.pm-ar:disabled{opacity:.3;cursor:default}
/* THE TASK GALLERY (2 Nov): a card's pill opens a clean screen of 13 models
   of that one task, with its own arrows; × goes back to the same card */
.gal{position:fixed;inset:0;z-index:250;display:flex;flex-direction:column;background:#F0EFEC;opacity:0;visibility:hidden;transition:opacity .2s ease,visibility 0s .2s}
body.gal-open .gal{opacity:1;visibility:visible;transition:opacity .22s ease,visibility 0s}
body.gal-open{overflow:hidden}
.gal-top{flex:none;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;max-width:640px;width:100%;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 20px 4px}
.gal-k{font:500 .6875rem/1.3 'Geist Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:rgba(20,17,14,.5);margin:0 0 4px}
.gal-t{font:400 clamp(28px,8vw,38px)/1 'Anton',Impact,sans-serif;color:#14110E;margin:0}
.gal-x{flex:none;width:44px;height:44px;border-radius:50%;border:none;background:transparent;color:rgba(20,17,14,.5);display:grid;place-items:center;cursor:pointer}
.gal-x svg{width:13px;height:13px}
.gal-nav{flex:none;display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 0 4px}
.gal-count{margin:0;min-width:64px;text-align:center;font:600 13px/1 'Geist Mono',monospace;letter-spacing:.06em;color:#5C5852}
.gal-count b{color:#14110E}
.gal-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.gal-body .pa-h,.gal-body .pa-nav{display:none}   /* the gallery has its own arrows in its header */
/* the pill that opens it sits inside every card, above its footer (the teacher, 2 Nov) */
#parade .pa-b{display:flex;flex-direction:column}
/* THE FIVE CARD in the strip and the gallery: the parade's own header becomes
   the hallmark — giant black task and number, the short thick rule */
#parade .pa-t,#galBody .pa-t{font:400 clamp(34px,10vw,44px)/1 'Anton',Impact,sans-serif;text-transform:uppercase;letter-spacing:.005em;color:#14110E;
  margin:10px 0 22px;padding-bottom:0;border-bottom:0;position:relative}
#parade .pa-t::after,#galBody .pa-t::after{content:'';position:absolute;left:0;bottom:-12px;width:40px;height:4px;background:#14110E}
/* tight: the whole model on one screen (fitCards sets the size) */
#parade .pa-b,#galBody .pa-b{letter-spacing:-.005em}
#parade .fc-p,#galBody .fc-p{font-size:1em!important;line-height:1.36}
#parade .fc-end .fc-p,#galBody .fc-end .fc-p{font-size:1.04em!important}
#parade .fc-rule,#galBody .fc-rule{margin:.7em 0}
#parade .fc-list,#galBody .fc-list{gap:.45em}
#parade .fc-li,#galBody .fc-li{padding-left:1.15em}
#parade .fc-li::before,#galBody .fc-li::before{top:.5em;width:.45em;height:.45em}
#parade .fc-h,#galBody .fc-h{font-size:.84em;margin-bottom:.15em}
#parade .pa-f,#galBody .pa-f{margin-top:10px;padding-top:8px}
#parade .pa-f .pm-new{margin:0;padding:8px 14px;font-size:13px}
#parade .pa-track{padding-bottom:8px}
#parade .pa-col:not(.on) .pa-t::after{opacity:.42}
.pa .fc .k,.pa .fc .sg{font-weight:inherit}
.pa .fc .vw{color:inherit}
.pa .fc .fc-own{color:#6A625A;font-weight:400}
.pm-new{align-self:center;margin:auto 0 0;display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:999px;
  background:#14110E;color:#F6F3EE;font:600 14px/1 'Geist',sans-serif;letter-spacing:.01em;cursor:pointer;-webkit-tap-highlight-color:transparent}
.pm-new:active{transform:scale(.97)}
.pm-gap{display:block;height:18px;flex:none}
</style>
<!--
  THE MODEL GENERATOR — the fifth stage of every writing task
  (Question · Plan · Model · Generate · Sample).

  PARADE: the subject's generated models side by side (tools/parade.js),
  the same strip as the Question pages. Six per subject, seeded, so the
  gallery is the same on every visit and a teacher can say "open RS-3".
  CARD: the chosen model whole, every key expression on one card; each
  line rolls (‹ ›) and the line left showing is the one kept. SUPPORT
  (Full · Starters · Moves) fades the scaffolding.
  WRITE: the card becomes the draft — ruled lines under each expression,
  the question's points to cover, a 140–190 word bar; kept on the device.

  DATA — the same files the five Model pages read, nothing new:
    Essay    essays/data/essay-cards-models.json
    Review   reviews/data/reviews-cards-models.json
    Report   reports/data/reports-cards-models.json
    Email    emails/data/emails-structure-formal.json, -informal.json
    Article  articles/data/article-cards-models.json
  ?type=essays|reviews|reports|emails|articles picks the task (the Generate
  pill passes it); &subject=<key> picks the subject.
-->
<style>
/* The Generator is the Question page with no footer: same header, same
   parade, same cinema. Only what the question page lacks lives here. */
.wr-foot{display:none!important}
.stage{padding-bottom:1.5rem}
.gp{color:var(--caramel,#B0865C);font-weight:700}
.bl{background:rgba(176,134,92,.16);padding:0 3px;border-radius:3px;white-space:nowrap}
.sg{font-weight:700}
.k{font-weight:700}
.ex{font-weight:400;color:#8C857D}
.ex .vw{color:inherit}
.vw{color:var(--poster-body,#5C5852)}
.pa .kp-item b{color:var(--poster-ink,#14110E);font-weight:650}

/* ══ THE CINEMA — one model, lights down ══ */
.scrim{position:fixed;inset:0;z-index:300;background:rgba(20,17,14,.36);opacity:0;pointer-events:none;transition:opacity .35s}
body.cin-open .scrim{opacity:1;pointer-events:auto}
.cin{--card:#FAF8F5;--ink2:#14110E;--body2:#5C5852;--faint2:rgba(20,17,14,.5);--rule2:rgba(20,17,14,.2);--fill2:rgba(20,17,14,.08);
  position:fixed;z-index:310;inset:0;display:flex;flex-direction:column;background:var(--card);color:var(--ink2);opacity:0;visibility:hidden;
  transition:opacity .2s ease,visibility 0s .2s;font-family:'Geist',sans-serif}
body.cin-open .cin{opacity:1;visibility:visible;transition:opacity .26s ease,visibility 0s}
@media (min-width:700px){ .cin{--cw:min(760px,94vw);--ch:min(calc(100vh - 48px),900px);left:calc(50% - var(--cw)/2);right:auto;width:var(--cw);
  height:var(--ch);top:calc((100vh - var(--ch))/2);bottom:auto;box-shadow:0 30px 60px -30px rgba(20,17,14,.5)} }
.cin button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
.cnav{flex:none;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
.cclose{width:44px;height:44px;border-radius:50%;background:transparent!important;display:grid;place-items:center;color:var(--faint2);justify-self:end}
@media(hover:hover){.cclose:hover{background:var(--fill2)!important;color:var(--ink2)}}
.cclose svg{width:12px;height:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;justify-self:center;width:100%;max-width:230px;height:32px;padding:2px;border-radius:10px;background:var(--fill2)}
.seg button{border-radius:8px;font-size:13px;font-weight:600;color:var(--body2)}
.seg button.on{background:#fff;color:var(--ink2);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg button:disabled{opacity:.4;cursor:default}
.bars{display:flex;gap:6px;padding:0 18px}
.bars i{flex:1;height:4px;border-radius:2px;background:var(--rule2);transition:background .3s}
.bars i.on{background:var(--ink2)}
.cbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:4px 18px 12px}
.ccol{max-width:42rem;margin:0 auto}
.kick{display:flex;align-items:center;gap:9px;font-family:'Geist Mono',monospace;font-size:.6875rem;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--faint2)}
.kick::before{content:'';display:block;width:26px;height:10px;flex:none;background:#B0865C}
.title{font-family:'Anton',Impact,sans-serif;font-weight:400;letter-spacing:.01em;line-height:1;font-size:clamp(28px,7vw,38px);margin:8px 0 2px}
.secw{font-family:'Geist Mono',monospace;font-size:.75rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  padding:14px 0 10px;border-bottom:1px solid var(--rule2);display:flex;gap:10px;align-items:baseline}
.secw b{font-family:'Anton',Impact,sans-serif;font-weight:400;font-size:1.6rem;letter-spacing:0;line-height:1}
.secsub{font-size:13px;color:var(--body2);margin:8px 0 2px}
.ln{display:flex;align-items:center;gap:2px;padding:6px 0;border-bottom:1px solid var(--rule2)}
.lt{flex:1;font-size:clamp(15px,3.9vw,17px);line-height:1.4;font-weight:500;transition:opacity .12s}
.rl{width:32px;height:44px;flex:none;display:grid;place-items:center;font-size:22px!important;font-weight:600;color:#B0865C!important;border-radius:8px}
.rl:hover{background:var(--fill2)!important}
.rl:disabled{opacity:.25;cursor:default}
.tip{font-size:12.5px;color:var(--body2);margin-top:8px}
.wsec{padding:6px 0 4px;border-bottom:1px solid var(--rule2)}
.wsec .secw{padding:8px 0 4px}
.wsec .ln:last-child{border-bottom:0}
/* THE FIVE CARD in Make your own (7 Nov 2026): the same card, with its ‹ › —
   no section labels; two hairlines; the body's lines bulleted */
.cin #cTitle{font:400 clamp(40px,12vw,52px)/1 'Anton',Impact,sans-serif;text-transform:uppercase;letter-spacing:.005em;color:#14110E;margin:12px 0 26px;position:relative}
.cin #cTitle::after{content:'';position:absolute;left:0;bottom:-16px;width:46px;height:4px;background:#14110E}
.cin #cTitle .fc-n{color:#B0865C}
#cMain .secw{display:none}
#cMain .wsec{border-bottom:1px solid #CFC8BE;padding:10px 0}
#cMain .wsec:last-of-type{border-bottom:0}
#cMain .ln{border-bottom:0}
#cMain .wsec:nth-of-type(2) .lt{position:relative;padding-left:20px}
#cMain .wsec:nth-of-type(2) .lt::before{content:'';position:absolute;left:0;top:.55em;width:8px;height:8px;background:#14110E}
#cMain .lt .k,#cMain .lt .sg{font-weight:500}
#cMain .lt .gp{color:#9A5A2C;font-weight:600}
/* ONE SCREEN in Make your own: fitCin steps the lines down until nothing scrolls */
#cMain .lt{font-size:var(--cin-fs,clamp(15px,3.9vw,17px))}
#cin.tight #cMain .ln{padding:1px 0} #cin.tight #cMain .wsec{padding:4px 0} #cin.tight #cMain .lt{line-height:1.32} #cin.tight #cMain .tip{margin:4px 0 0;font-size:12px} #cin.tight .cbody{padding-bottom:4px} #cin.tight #cTitle{font-size:30px;margin:6px 0 16px} #cin.tight #cTitle::after{bottom:-10px;height:3px}
.wl{font-size:16px;line-height:1.5;font-weight:500;padding:3px 0}
.cact{flex:none;display:flex;justify-content:center;gap:8px;padding:10px 14px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -1px 0 var(--rule2);background:var(--card)}
.btn{text-transform:none!important;letter-spacing:normal!important;font-family:'Geist',sans-serif!important;display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;background:var(--fill2)!important}
.btn.go{background:var(--ink2)!important;color:#F6F3EE!important}
.seg.s3{grid-template-columns:repeat(3,minmax(0,1fr));max-width:270px}
.mv{font-size:14px;color:var(--body2);padding:8px 0 10px;line-height:1.45}
.mv i{font-style:normal;font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.08em;color:var(--faint2)}
/* WRITE — the skeleton becomes the draft, on paper */
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:12px 0 0}
.chips .lab{font:600 10px 'Geist Mono',monospace;letter-spacing:.16em;color:var(--faint2);margin-right:2px}
.chip{font:500 12.5px 'Geist',sans-serif!important;padding:6px 11px!important;border-radius:999px;background:var(--fill2)!important;color:var(--body2)!important}
.chip.on{background:#E3EFE6!important;color:#1F5A3B!important}
.paper{margin-top:12px;background:#fff;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.1);padding:6px 16px 14px}
.pl{font:600 10px 'Geist Mono',monospace;letter-spacing:.16em;color:var(--faint2);margin:14px 0 2px;text-transform:uppercase}
.kx{display:flex;gap:6px;align-items:baseline;font:600 12.5px/1.35 'Geist',sans-serif;color:#8E6238;margin:8px 0 0}

<script>
(function(){
'use strict';
let TYPE=document.body.getAttribute('data-writing');
const PAGE=TYPE;   /* the task the student arrived from; TYPE follows the open model */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
/* the gaps a student fills: "...", "…" and [Placeholders] */
const fmt=s=>esc(s).replace(/\.\.\.|…/g,'<span class="gp">…</span>').replace(/\[([^\]]+)\]/g,'<span class="bl">[$1]</span>');
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
const keyOf=x=>(x&&x.t)?x.t:x;
/* a line that ends in a word gets its full stop; one ending in a gap or mark keeps it */
const stop=h=>/[.!?…:,]\s*$|\.\.\.\s*$|<\/span>\s*$/.test(h.replace(/<span class="bl">[^<]*<\/span>\s*$/,'x'))?h:h+'.';
/* the review hinge follows the subject's name: after a gap it takes a comma, after a full sentence a [Name] */
/* one joining rule for every review page: /data/writing/review-open.js */
const nameChip=h=>h.replace(/\[Name\]/g,'<span class="bl">[Name]</span>');
const hinged=(bg,hinge)=>{ const P=ReviewOpen.parts(bg,hinge); return nameChip(fmt(P.lead))+' <span class="vw">'+nameChip(fmt(P.mid))+'</span>'; };
const comma=s=>/[,.;:]$/.test(s)?s:s+',';
const plain=h=>h.replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"');

/* seeded for the gallery (same six every visit), Math.random for rolling */
let _s=0;
function seeded(seed){ _s=seed|0; return function(){ _s=(_s+0x6D2B79F5)|0; let t=Math.imul(_s^_s>>>15,1|_s);
  t=(t+Math.imul(t^t>>>7,61|t))^t; return ((t^t>>>14)>>>0)/4294967296; }; }
let R=Math.random;
const pick=a=>a&&a.length?a[Math.floor(R()*a.length)]:'…';
const pickAvoid=(pool,av)=>{ if(!pool||!pool.length) return '…'; const A=(av||[]).map(keyOf);
  const f=pool.filter(x=>!A.includes(keyOf(x))); return pick(f.length?f:pool); };

/* ══ ENGINES — each subject becomes a recipe: sections of lines, and every
   line knows how to generate itself again, avoiding what its neighbours
   already say. A line returns {html, used:[...]} . ══ */
const SRC={
  essays:['essays/data/essay-cards-models.json'],
  reviews:['reviews/data/reviews-cards-models.json'],
  reports:['reports/data/reports-cards-models.json'],
  emails:['emails/data/emails-structure-formal.json','emails/data/emails-structure-informal.json'],
  articles:['articles/data/article-cards-models.json'],
  story:['narrative/data/story-generator.json']
};
const TAG={essays:'Essay',reviews:'Review',reports:'Report',emails:'Email',articles:'Article',story:'Story'};

function recipesEssays(D){
  const SH=D.shared;
  return Object.keys(D.types).map(k=>{
    const T=D.types[k], A=T.argue;
    const VIEW=SH.view[T.viewFlavour]||SH.view.generalisation||Object.values(SH.view)[0];
    const plan=A.bodyPlan||['keyFor','keyFor','keyAgainst'], sp=A.signpostPlan||['first','addition','turn'];
    const body=[0,1,2].map(i=>av=>{ const s=pickAvoid(SH.signpost[sp[i]]||SH.signpost.addition,av.s), v=pickAvoid(VIEW,av.v), y=pickAvoid(A[plan[i]]||['…'],av.k);
      return {html:`<span class="sg">${esc(comma(s))}</span> <span class="vw">${esc(v)}</span> <span class="k">${fmt(y)}</span>`,used:{s,v,k:y},against:plan[i]==='keyAgainst'}; });
    return {key:k,label:T.label||k,sections:[
      {word:'Introduction',sub:'Background · your aim',lines:[()=>({html:`<span class="k">${fmt(pick(SH.background))}</span> <span class="vw">${esc(pick(T.open.hinge))} <span class="gp">…</span>.</span> <span class="k">${fmt(pick(T.open.aim))}</span>`})]},
      {word:'Body',sub:'Three points, each signposted',lines:body},
      {word:'Conclusion',sub:'Sum up · your verdict',lines:[()=>({html:`<span class="k">${esc(pick(T.close.summary))}</span> <span class="vw">${esc(pick(T.close.stance))}</span> ${fmt(pick(T.close.verdict))}`})]}
    ]};
  });
}
function recipesReviews(D){
  const SH=D.shared, B=['first','open','standout'], K=['keyOpen','keyMore','keyMore'];
  return Object.keys(D.types).map(k=>{
    const T=D.types[k];
    const feat=[0,1,2].map(i=>av=>{ const s=pickAvoid(SH.signpostFeature[B[i]]||SH.signpostFeature.open||[],av.s), y=pickAvoid(T.argue[K[i]]||['…'],av.k);
      if((s._join||'self')==='open'){ const v=pickAvoid(SH.view||[],av.v);
        return {html:stop(`<span class="sg">${esc(keyOf(s))}</span> <span class="vw">${esc(v)}</span> ${fmt(keyOf(y))}`),used:{s,v,k:y}}; }
      return {html:stop(`<span class="sg">${esc(keyOf(s))}</span> ${fmt(keyOf(y))}`),used:{s,k:y}}; });
    return {key:k,label:T.label||k,sections:[
      {word:'Introduction',sub:'Hook · what it is · first impression',lines:[()=>{ const bg=pick(SH.background), hg=pick(T.open.hinge), P=ReviewOpen.parts(bg,hg);
        return {html:`<span class="k">${hinged(bg,hg)}</span>${P.gap?' <span class="gp">…</span>. <span class="ex">'+esc(pick(T.open.aim))+'</span>':''}`}; }]},
      {word:'Features',sub:'Three features, each signposted',lines:feat},
      {word:'Recommendation',sub:'Who it is for · final verdict',lines:[()=>({html:`<span class="k">${fmt(pick(T.close.summary))} ${esc(pick(T.close.stance))}</span> <span class="ex">${fmt(pick(T.close.verdict))}</span>`})]}
    ]};
  });
}
function recipesReports(D){
  const SH=D.shared, B=['first','open','standout'], K=['keyGen','keyPos','keyNeg'];
  return Object.keys(D.types).map(k=>{
    const T=D.types[k];
    const find=[0,1,2].map(i=>av=>{ const s=pickAvoid(SH.signpostFeature[B[i]]||[],av.s), y=pickAvoid(T.argue[K[i]]||['…'],av.k);
      return {html:stop(`<span class="sg">${esc(keyOf(s))}</span> ${fmt(keyOf(y))}`),used:{s,k:y},against:K[i]==='keyNeg'}; });
    return {key:k,label:T.label||k,sections:[
      {word:'Aim · Basis',sub:'Why the report · where the facts came from',lines:[
        ()=>({html:`<span class="k">${fmt(pick(SH.background))}</span> <span class="ex">${fmt(pick(T.open.aim))}</span>`}),
        ()=>({html:`<span class="k">${fmt(pick(SH.method||['…']))}</span>`})]},
      {word:'Findings',sub:'General view · strengths · weaknesses',lines:find},
      {word:'Recommendation',sub:'What should happen · conclusion',lines:[
        ()=>({html:`<span class="k">${fmt(pick(T.close.recommend||['…']))}</span> <span class="gp">…</span>`}),
        ()=>({html:`<span class="k">${fmt(pick(T.close.summary))}</span> <span class="ex">${fmt(pick(T.close.verdict))}</span>`})]}
    ]};
  });
}
function recipesEmails(list){
  const out=[];
  list.forEach(D=>{ ['formal','informal'].forEach(reg=>{ const R0=D[reg]; if(!R0) return;
    Object.keys(R0).forEach(k=>{ const T=R0[k], S=T.sections||{};
      const sec=(key,n,fixedFirst)=>{ const s=S[key]; if(!s) return null; const P=s.phrases||[];
        const lines=[]; for(let i=0;i<n;i++){
          if(i===0&&fixedFirst) lines.push(()=>({html:fmt(P[0]),used:{k:P[0]}}));
          else lines.push(av=>{ const pool=fixedFirst?P.slice(1):P; const y=pickAvoid(pool,av.k); return {html:fmt(y),used:{k:y}}; }); }
        return {word:(s.label||key).split(':')[0],sub:(s.label||'').split(':').slice(1).join(':').trim()||s.purpose||'',lines}; };
      out.push({key:reg+'-'+k,label:(reg==='formal'?'Formal · ':'Informal · ')+(T.title||k),sections:[sec('opening',2,true),sec('main',3,false),sec('closing',2,false)].filter(Boolean)});
    }); }); });
  return out;
}
function recipesArticles(D){
  const SH=D.shared, O=[].concat(...Object.values(SH.opening)), C=[].concat(...Object.values(SH.closing));
  const fams=Object.keys(SH.development);
  const dev=[0,1,2].map(()=>av=>{ const fam=pickAvoid(fams,av.s);   /* three different moves */
    const y=pickAvoid(SH.development[fam],av.k);
    return {html:`<span class="sg">${esc(cap(fam==='ministory'?'mini-story':fam))}</span> · ${fmt(y)}`,used:{s:fam,k:y}}; });
  return [{key:'general',label:'Any topic',sections:[
    {word:'Opening',sub:'Hook the reader',lines:[()=>({html:'<span class="k">'+fmt(pick(O))+'</span>'})]},
    {word:'Development',sub:'Describe · Compare · Opinion · Mini-story',lines:dev},
    {word:'Closing',sub:'Sign off with style',lines:[()=>({html:'<span class="k">'+fmt(pick(C))+'</span>'})]}
  ]}];
}
/* STORY (29 Oct 2026): a story only works if every paragraph follows the one
   before, so each model is a fixed, coherent mini-story; what rotates is the
   target language (suspense, time, feeling, ending) — short and focused. */
function recipesStory(D){
  const P=Object.assign({},D.pools);
  return D.stories.map(S=>{
    const pools=Object.assign({},P,{feel:S.feel,end:S.end,close:S.close});
    const line=x=>av=>{ if(x.pool==='look'){ const y=pickAvoid(S.look,av.k); return {html:'<span class="sg">'+esc(y)+'</span>',used:{k:y}}; }
      const e=pickAvoid(pools[x.pool],av.k); return {html:'<span class="sg">'+esc(e)+'</span> '+esc(x.t),used:{k:e}}; };
    return {key:S.key,label:S.label,sections:[
      {word:'Set the scene',sub:'Past simple · past perfect · past continuous',lines:[()=>({html:'<span class="k">'+esc(S.given)+'</span>'}),()=>({html:'<span class="ex">'+esc(S.before)+'</span>'}),()=>({html:'<span class="ex">'+esc(S.background)+'</span>'})]},
      {word:'Build the tension',sub:'Suspense · time · feeling',lines:S.tension.map(line)},
      {word:'How it ended',sub:'Feeling · closing time · looking back',lines:S.ending.map(line)}]};
  });
}
const BUILD={story:d=>recipesStory(d[0]),essays:d=>recipesEssays(d[0]),reviews:d=>recipesReviews(d[0]),reports:d=>recipesReports(d[0]),emails:d=>recipesEmails(d),articles:d=>recipesArticles(d[0])};

/* ── a MODEL is one recipe, run: every line keeps its history so ‹ goes back ── */
function avoidFor(model,si,li){
  const av={s:[],v:[],k:[]};
  model.secs[si].lines.forEach((L,j)=>{ if(j===li||!L.h.length) return; const u=L.h[L.i].used; if(!u) return;
    if(u.s) av.s.push(u.s); if(u.v) av.v.push(u.v); if(u.k) av.k.push(u.k); });
  return av;
}
function runRecipe(rec,n){
  const m={rec,n,secs:rec.sections.map(s=>({word:s.word,sub:s.sub,lines:s.lines.map(()=>({h:[],i:0}))}))};
  rec.sections.forEach((s,si)=>s.lines.forEach((gen,li)=>{ m.secs[si].lines[li].h.push(gen(avoidFor(m,si,li))); }));
  return m;
}

let RECIPES=[], SUBJ=null, MODELS=[], OPEN=null;
const ABBR=s=>{ const w=s.replace(/^(Formal|Informal) · /,'').split(/[\s/&·-]+/).filter(Boolean); return (w.length>1?w.map(x=>x[0]).join(''):(w[0]||'').slice(0,2)).slice(0,2).toUpperCase(); };

/* THE PROCESSION (2 Nov 2026): one strip of 13 finished models, one for
   every task type, the same 13 as the printed cue cards. Story keeps its
   own strip: one card per story. The task tabs above jump along the strip. */
const SET13=[
  {t:'essays',m:'For & Against'},{t:'essays',m:'Opinion'},{t:'essays',m:'Agree & Disagree'},
  {t:'essays',m:'Problems & Solutions'},{t:'essays',m:'Cause & Effect'},{t:'essays',m:'Speculation & Trends'},
  {t:'articles',name:'Article'},
  {t:'emails',m:/^Formal · Job/i,name:'Formal email · Application',short:'Application email'},
  {t:'emails',m:/^Formal · Request/i,name:'Formal email · Request',short:'Request email'},
  {t:'emails',m:/^Informal · React/i,name:'Informal email · News & plans',short:'News email'},
  {t:'emails',m:/^Informal · Giving Advice/i,name:'Informal email · Advice',short:'Advice email'},
  {t:'reviews',name:'Review',all:true},{t:'reports',name:'Report',all:true}];
const PART={essays:'Part 1'};
let ALL={}, LINE=[], PA=null;
async function init(){
  const types=PAGE==='story'?['story']:['essays','reviews','reports','emails','articles'];
  try{ await Promise.all(types.map(t=>Promise.all(SRC[t].map(p=>fetch(p).then(r=>{ if(!r.ok) throw new Error(p); return r.json(); })))
    .then(d=>{ ALL[t]=BUILD[t](d).filter(r=>r.sections.length); }))); }
  catch(e){ $('loading').textContent='⚠ Could not load the model data'; return; }
  const urlSub=new URLSearchParams(location.search).get('subject');
  /* the subject the student is working on, for one task: from ?subject= or the Question page */
  const wantFor=t=>{ TYPE=t; RECIPES=ALL[t]; const want=(t===PAGE&&urlSub)||fromQuestion(); TYPE=PAGE; if(!want) return null;
    const R0=ALL[t], reg=want.split('-')[0], w=want.slice(reg.length+1).replace(/[^a-z]/g,'').slice(0,5);
    return R0.find(r=>r.key===want)||(w&&want.indexOf('-')>0?R0.find(r=>r.key.indexOf(reg+'-')===0&&r.key.replace(/[^a-z]/g,'').indexOf(w)>=0):null)||R0.find(r=>r.key.indexOf(want)===0)||null; };
  LINE=PAGE==='story'?ALL.story.map(r=>({t:'story',name:r.label,short:r.label,recs:[r],rot:0}))
    :SET13.map(x=>{ const R0=ALL[x.t]||[], recs=x.all?R0:R0.filter(r=>typeof x.m==='string'?r.label===x.m:(x.m?x.m.test(r.label):true));
        return recs.length?{t:x.t,name:x.name||recs[0].label,short:x.short||x.name||recs[0].label,all:!!x.all,recs,rot:0}:null; }).filter(Boolean);
  /* start on the arriving task; a review or report starts on the student's subject */
  let start=Math.max(0,LINE.findIndex(x=>x.t===PAGE));
  if(PAGE!=='story'){ const w=wantFor(PAGE);
    if(w){ const k=LINE.findIndex(x=>x.t===PAGE&&x.recs.includes(w)); if(k>=0){ start=k; LINE[k].rot=LINE[k].recs.indexOf(w); } } }
  else if(urlSub){ const k=LINE.findIndex(x=>x.recs[0].key===urlSub); if(k>=0) start=k; }
  tabs(); gallery(start);
}
/* the header's task tabs jump along the strip instead of reloading */

}
function saveMine(m){
  const list=mineList(), id=Date.now().toString(36);
  list.unshift({id,label:m.title||m.rec.label,secs:m.secs.map(S=>({word:S.word,sub:S.sub,lines:S.lines.map(L=>L.h[L.i].html)}))});
  try{ localStorage.setItem(MKEY(),JSON.stringify(list.slice(0,12))); }catch(e){}
  drawMine();
}
function delMine(id){ try{ localStorage.setItem(MKEY(),JSON.stringify(mineList().filter(x=>x.id!==id))); }catch(e){} drawMine(); }
function openMine(k){
  const e=mineAll()[k]; if(!e) return; const x=e.x; TYPE=e.t; SUBJ=e.sub; RECIPES=ALL[TYPE]||RECIPES;
  OPEN={saved:true,savedId:x.id,n:'mine-'+x.id,tag:'My model '+(k+1),rec:{label:x.label},
    secs:x.secs.map(S=>({word:S.word,sub:S.sub,lines:S.lines.map(h=>({h:[{html:h}],i:0}))}))};
  MODE='card'; document.body.classList.add('cin-open'); $('cin').setAttribute('aria-hidden','false');
  try{ history.pushState({gen:1},''); }catch(e){}
  paint();
}
function drawMine(){
  let box=$('mine'); if(!box){ box=document.createElement('section'); box.id='mine'; box.className='mine'; }
  $('parade').appendChild(box);
  const list=mineAll();
  box.innerHTML=list.length?`<p class="mine-h">My models · ${list.length}</p>`+list.map((e,k)=>
    `<button class="mine-c" type="button" data-k="${k}"><b>${esc(e.x.label||('My model '+(k+1)))}</b><span>${esc(plain(e.x.secs[0].lines[0]).slice(0,90))}…</span></button>`).join(''):'';
  box.querySelectorAll('.mine-c').forEach(b=>b.onclick=()=>openMine(+b.dataset.k));
}

/* WRITE — the skeleton becomes the draft. Each key expression heads a ruled
   line where the student writes the whole sentence; the expression is
   pre-written at Full, started at Starters, left out at Moves. The draft is
   kept on this device, per model. */
const DKEY=()=>'intuity.gen.draft.'+TYPE+'.'+SUBJ+'.'+OPEN.n;
function loadDraft(){ if(OPEN.draft) return OPEN.draft; let d=null; try{ d=JSON.parse(localStorage.getItem(DKEY())||'null'); }catch(e){}
  return (OPEN.draft=d&&d.t?d:{t:{},c:[]}); }
let saveT=0;
function saveDraft(d,now){ clearTimeout(saveT); const w=()=>{ try{ localStorage.setItem(DKEY(),JSON.stringify(d)); }catch(e){} }; if(now) w(); else saveT=setTimeout(w,250); }
/* the question's own points to cover, when the student came from a question on this subject */
function points(){
  const read=k=>{ try{ return JSON.parse(sessionStorage.getItem(k)||'null'); }catch(e){ return null; } };
  const key={essays:'currentQuestion',reviews:'currentReviewQuestion',reports:'currentReportQuestion',emails:'currentEmailQuestion',articles:'currentArticleQuestion'}[TYPE];
  const q=read(key); if(!q) return [];
  const fq=fromQuestion(); if(TYPE!=='articles'&&fq&&SUBJ!==fq&&SUBJ.indexOf(fq)!==0) return [];
  return (q.writingPoints||q.keyPoints||q.points||[]).map(x=>typeof x==='string'?x:(x.text||x.point||'')).filter(Boolean).slice(0,4);
}
/* TIMED — five paragraphs (intro, the three body moves, conclusion), each
   with its own clock: tap Start, study it at Full for 40 seconds, then the
   expressions shrink to Starters and a 3-minute fuse burns while the
   student finishes it from memory. The fuse fizzles, never explodes. */
const STUDY=40, FUSE=180;
let TIMED=false; try{ TIMED=localStorage.getItem('intuity.gen.timed')==='1'; }catch(e){}
let TICK=0;
function units(m){ const out=[], mid=m.secs.length>2?1:-1;
  m.secs.forEach((S,si)=>{ if(si===mid) S.lines.forEach((L,li)=>out.push({si,lines:[li],label:S.word+' · '+(li+1)}));
    else out.push({si,lines:S.lines.map((L,li)=>li),label:S.word}); });
  return out; }
const mmss=t=>{ const a=Math.abs(Math.round(t)); return (t<0?'+':'')+Math.floor(a/60)+':'+String(a%60).padStart(2,'0'); };

function lineBlock(m,d,si,li,lvl,ro){
  const S=m.secs[si], L=S.lines[li], k=si+'-'+li, sv=(d.t[k]||'').trim();
  const pre=lvl==='full'?given(L):lvl==='starters'?plain(starter(L)).replace(/\s*…\s*$/,' '):'';
  const untouched=!sv||sv===given(L).trim()||sv===plain(L.h[L.i].html).trim()||sv===plain(starter(L)).replace(/\s*…\s*$/,'').trim();
  const val=untouched?pre:d.t[k];   /* only what the student typed survives a change of support */
  /* the line above shows only what the box does not already hold */
  const full=plain(L.h[L.i].html).trim();
  const ex=exText(L.h[L.i].html);
  const lab=lvl==='starters'?'#'
    :(given(L).trim()===full?'@':'e.g. … '+(ex&&!SGRX.test(L.h[L.i].html)?ex:plain(L.h[L.i].html.replace(SGRX,'')).trim()).replace(/\.$/,''));   /* @ = a frame: status only */
  return (lvl==='moves'||!lab?'':`<div class="kx" id="kx-${k}"${lab==='@'?' data-frame="1"':''}${lab==='#'?' data-st="1"':''}><span class="no">○</span><span>${lab==='@'?'keep the expression':lab==='#'?'':esc(lab)}</span></div>`)+
    `<textarea class="wr" spellcheck="false" autocorrect="off" autocapitalize="sentences" data-gramm="false" data-gramm_editor="false" data-enable-grammarly="false" data-k="${k}"${ro?' readonly':''} aria-label="${esc(S.word)}, sentence ${li+1}" placeholder="${lvl==='moves'?esc(S.sub||'Write your sentence'):'Start with the expression above, finish it your way'}">${esc(val)}</textarea>`;
}

/* ══ CHECK IT THE EXAMINER'S WAY (3 Nov 2026, from the pedagogical audit) ══
   The student wrote a whole text and nothing asked them to review it. Under
   the word count: Cambridge's four scales, one statement each, written for
   this task. One tap ticks a scale; the ticks are saved with the draft.
   A self-review, not a mark: it says what to look for before Copy or Print. */
const CA_FOR={
  essays:'Formal or neutral throughout, and my opinion is clear from start to end',
  emails:'The register suits the reader (friend: friendly; manager: polite), with a fitting opening and close',
  articles:'A catchy title and a lively, personal voice that talks to the reader',
  reviews:'I describe, I evaluate, and I end with a clear recommendation',
  reports:'A title, headings and a neutral tone, ending with recommendations',
  story:'It uses the words or sentence I was given and keeps the reader wanting to know what happens'
};
function checkItems(m){
  return [
    {k:'Content',t:m.type==='essays'?'Both given points are answered, plus my own idea':m.type==='emails'?'Every note in the task is answered':m.type==='story'?'The story follows the task: its opening line or words, its title':'Every point in the question is answered'},
    {k:'Communicative achievement',t:CA_FOR[m.type]||CA_FOR.essays},
    {k:'Organisation',t:'Each paragraph has one job, and linking words join the ideas'},
    {k:'Language',t:'A range of words and structures, with no errors that stop the reader'}];
}
function checkHTML(m,d){
  const its=checkItems(m), on=d.ck||[];
  return `<div class="ck"><div class="ck-h"><span>CHECK IT LIKE THE EXAMINER</span><b>${on.length} / ${its.length}</b></div>`+
    its.map((x,i)=>`<button type="button" class="ck-i${on.includes(i)?' on':''}" data-ck="${i}" aria-pressed="${on.includes(i)}"><i>${on.includes(i)?'✓':''}</i><span><b>${esc(x.k)}</b>${esc(x.t)}</span></button>`).join('')+
    `<p class="ck-n">${on.length===its.length?'All four checked: copy or print it for your teacher.':'Read your text once for each line, then tick it.'}</p></div>`;
}
function paintWrite(){
  const m=OPEN, d=loadDraft(), pts=points();
  clearInterval(TICK);
  $('supp').style.visibility=TIMED?'hidden':'';
  const T=m.timer||(m.timer={u:{}});
  let body;
  if(!TIMED){
    body=m.secs.map((S,si)=>`<div class="pl">${String(si+1).padStart(2,'0')} · ${esc(S.word)}</div>`+
      S.lines.map((L,li)=>lineBlock(m,d,si,li,SUPPORT,false)).join('')).join('');
  } else {
    body=units(m).map((U,ui)=>{ const st=T.u[ui]||{ph:'idle'};
      const head=`<div class="ul"><span class="pl">${String(ui+1).padStart(2,'0')} · ${esc(U.label)}</span>`+
        (st.ph==='idle'?`<button type="button" class="tbtn go" data-start="${ui}">Start ▸</button>`
        :st.ph==='study'?`<span class="clk" id="clk-${ui}">0:${String(STUDY).padStart(2,'0')}</span><button type="button" class="tbtn" data-ready="${ui}">Ready ›</button>`
        :st.ph==='write'?`<span class="clk" id="clk-${ui}">3:00</span><button type="button" class="tbtn go" data-done="${ui}">Done ✓</button>`
        :`<span class="clk ok">✓ ${mmss(st.used)}</span><button type="button" class="tbtn" data-again="${ui}">Again</button>`)+`</div>`;
      const fuse=st.ph==='study'?`<div class="fuse study"><i id="fz-${ui}"></i></div>`:st.ph==='write'?`<div class="fuse"><i id="fz-${ui}"></i><b id="sp-${ui}"></b></div><p class="fizz" id="fx-${ui}" hidden>Time’s up. Keep going, or tap Done.</p>`:'';
      const first=U.lines.length>1||U.lines[0]===0||m.secs.length<3||U.si!==1;   /* a section's guide shows once */
      const lines=st.ph==='idle'?(first?`<p class="mv">${esc(m.secs[U.si].sub||'')}</p>`:'')
        :U.lines.map(li=>lineBlock(m,d,U.si,li,st.ph==='study'?'full':'starters',st.ph==='study')).join('');
      return `<div class="unit ph-${st.ph}">`+head+fuse+lines+`</div>`; }).join('');
    const doneU=units(m).map((U,ui)=>T.u[ui]).filter(x=>x&&x.ph==='done');
    if(doneU.length===units(m).length) body+=`<p class="times">Your times · ${units(m).map((U,ui)=>'¶'+(ui+1)+' '+mmss(T.u[ui].used)).join(' · ')} · total ${mmss(doneU.reduce((a,x)=>a+x.used,0))}</p>`;
  }
  $('cMain').innerHTML=
    `<div class="tmode"><button type="button" class="tbtn${TIMED?' on':''}" id="tToggle" aria-pressed="${TIMED}">⏱ Timed</button><span>${TIMED?'Study 40 s · then 3 min per paragraph':'Turn on to race the clock, paragraph by paragraph'}</span></div>`+
    (pts.length?`<div class="chips"><span class="lab">COVER</span>${pts.map((p,i)=>`<button type="button" class="chip${d.c.includes(i)?' on':''}" data-i="${i}" aria-pressed="${d.c.includes(i)}">${d.c.includes(i)?'✓ ':''}${esc(p)}</button>`).join('')}</div>`:'')+
    `<div class="paper">`+body+`</div>`+
    `<div class="wc"><div class="row"><span id="wcN">0 WORDS</span><span>TARGET 140–190</span></div>
      <div class="bar"><i class="fill" id="wcF"></i><i class="mk" style="left:${140/220*100}%"></i><i class="mk" style="left:${190/220*100}%"></i></div></div>`+
    checkHTML(m,d)+
    `<p class="tip">${TIMED?'Tap Start on a paragraph. Read the expressions while the clock runs, then finish the paragraph from memory before the fuse burns out.':SUPPORT==='moves'?'Every word is yours this time: follow the moves, no key expressions given.':SUPPORT==='starters'?'Complete each expression from memory, then add your own details. ✓ appears once you have written on past the given words.':'Keep the key expressions and fill every … with your own ideas about your subject. A caramel sentence is an example, not something to copy. ✓ means you kept the expression.'}</p>`;
  const tas=[...$('cMain').querySelectorAll('textarea.wr')];
  const fit=t=>{ t.style.height='auto'; t.style.height=Math.max(60,t.scrollHeight)+'px'; };
  const update=()=>{
    let n=0; Object.keys(d.t).forEach(k=>{ n+=((d.t[k]||'').match(/[A-Za-zÀ-ÿ0-9’'-]+/g)||[]).length; });
    tas.forEach(t=>{ if(!(t.dataset.k in d.t)) n+=(t.value.match(/[A-Za-zÀ-ÿ0-9’'-]+/g)||[]).length;
      const kx=$('kx-'+t.dataset.k); if(kx){ const [si,li]=t.dataset.k.split('-').map(Number), f=fixedPart(m.secs[si].lines[li]);
        const wc=x=>(String(x).match(/[A-Za-zÀ-ÿ0-9’'-]+/g)||[]).length;
        let ok=f?norm(t.value).indexOf(norm(f))>=0:t.value.trim().length>0;
        if(kx.dataset.st) ok=ok&&wc(t.value)>=wc(plain(starter(m.secs[si].lines[li])))+3;   /* past the given words */
        const mk=kx.firstChild; mk.className=ok?'ok':'no'; mk.textContent=ok?'✓':'○';
        if(kx.dataset.frame) kx.lastChild.textContent=ok?'expression kept':'keep the expression'; } });
    $('wcN').textContent=n+' WORDS';
    const F=$('wcF'); F.style.width=Math.min(100,n/220*100)+'%'; F.className='fill'+(n>=140&&n<=190?' in':n>190?' over':'');
  };
  tas.forEach(t=>{ fit(t); t.addEventListener('input',()=>{ d.t[t.dataset.k]=t.value; saveDraft(d); fit(t); update(); }); });
  $('cMain').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ const i=+c.dataset.i, at=d.c.indexOf(i);
    if(at<0) d.c.push(i); else d.c.splice(at,1); saveDraft(d,true); paintWrite(); });
  $('cMain').querySelectorAll('.ck-i').forEach(b=>b.onclick=()=>{ const i=+b.dataset.ck; d.ck=d.ck||[]; const at=d.ck.indexOf(i);
    if(at<0) d.ck.push(i); else d.ck.splice(at,1); saveDraft(d,true); paintWrite(); });
  $('tToggle').onclick=()=>{ TIMED=!TIMED; try{ localStorage.setItem('intuity.gen.timed',TIMED?'1':'0'); }catch(e){} paintWrite(); };
  /* the clocks */
  const now=()=>Date.now()/1000;
  const go=(ui,ph)=>{ T.u[ui]=Object.assign(T.u[ui]||{},{ph,t0:now()}); paintWrite();
    if(ph==='write'){ const f=$('cMain').querySelector('.unit.ph-write textarea.wr'); if(f){ f.focus({preventScroll:false}); f.setSelectionRange(f.value.length,f.value.length); } } };
  $('cMain').querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>{
    Object.keys(T.u).forEach(k=>{ const x=T.u[k]; if(x.ph==='study'||x.ph==='write'){ x.ph='done'; x.used=now()-x.t0+(x.ph==='write'?0:0); } });
    go(+b.dataset.start,'study'); });
  $('cMain').querySelectorAll('[data-ready]').forEach(b=>b.onclick=()=>go(+b.dataset.ready,'write'));
  $('cMain').querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{ const x=T.u[+b.dataset.done]; x.used=now()-x.t0; x.ph='done'; paintWrite(); });
  $('cMain').querySelectorAll('[data-again]').forEach(b=>b.onclick=()=>{ T.u[+b.dataset.again]={ph:'idle'}; paintWrite(); });
  const live=Object.keys(T.u).find(k=>T.u[k].ph==='study'||T.u[k].ph==='write');
  if(TIMED&&live!==undefined){
    const ui=+live, x=T.u[ui];
    const tick=()=>{ const el=now()-x.t0, clk=$('clk-'+ui), fz=$('fz-'+ui); if(!clk){ clearInterval(TICK); return; }
      if(x.ph==='study'){ const left=STUDY-el; clk.textContent=mmss(Math.max(0,left)); if(fz) fz.style.width=Math.max(0,left/STUDY*100)+'%';
        if(left<=0){ clearInterval(TICK); try{ if(window.SFX&&SFX.isOn()&&SFX.pop) SFX.pop(); }catch(e){} go(ui,'write'); } }
      else { const left=FUSE-el; clk.textContent=mmss(left); clk.classList.toggle('late',left<0);
        if(fz) fz.style.width=Math.max(0,left/FUSE*100)+'%'; const sp=$('sp-'+ui); if(sp) sp.style.left=Math.max(0,left/FUSE*100)+'%';
        if(left<=0){ const fx=$('fx-'+ui); if(fx&&fx.hidden){ fx.hidden=false; try{ if(window.SFX&&SFX.isOn()&&SFX.wrong) SFX.wrong(); }catch(e){} } } } };
    tick(); TICK=setInterval(tick,250);
  }
  update();
  $('cAct').innerHTML=`<button class="btn" type="button" id="aBack">← Model</button><button class="btn" type="button" id="aCopy">Copy</button><button class="btn" type="button" id="aPrint">Print</button>`;
  $('aBack').onclick=()=>{ clearInterval(TICK); MODE='card'; paint(); };
  $('aPrint').onclick=()=>window.print();
  $('aCopy').onclick=()=>{
    const txt=m.secs.map((S,si)=>S.lines.map((L,li)=>(d.t[si+'-'+li]||'').trim()).filter(Boolean).join(' ')).filter(Boolean).join('\n\n');
    const done=()=>{ $('aCopy').textContent='Copied ✓'; setTimeout(()=>{ if($('aCopy')) $('aCopy').textContent='Copy'; },1600); };
    try{ navigator.clipboard.writeText(txt).then(done,()=>{}); }catch(e){}
  };
}
function roll(si,li,d){
  const m=OPEN, L=m.secs[si].lines[li];
  if(d<0){ if(L.i>0) L.i--; }
  else if(L.i<L.h.length-1) L.i++;
  else { L.h.push(m.rec.sections[si].lines[li](avoidFor(m,si,li))); L.i=L.h.length-1; }
  try{ if(window.SFX&&SFX.isOn()&&SFX.pop) SFX.pop(); }catch(e){}
  const sv=$('aSave'); if(sv){ sv.textContent='Save my model'; sv.disabled=false; }   /* changed again: save again */
  const el=$('lt-'+si+'-'+li), row=el.closest('.ln');
  el.style.opacity='0';
  setTimeout(()=>{ el.innerHTML=viewHTML(L); el.style.opacity='1'; row.querySelector('[data-d="-1"]').disabled=L.i===0; },90);
}
init();
})();
</script>
