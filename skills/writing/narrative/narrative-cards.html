<style>
:root{
  --bg:#f0efec;--ink:#111111;--white:#ffffff;
  /* lettuce = Review stage identity (matches review-model.html) */
  --acc:#9A6E72;--sig:#946A6E;   /* Story's colour, much calmer (30 Oct): a dusty rose, not crimson */ --txt:rgba(0,0,0,0.82);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;position:fixed;background:var(--bg);font-family:'Geist', sans-serif;-webkit-font-smoothing:antialiased}
.shell{position:fixed;inset:0;display:flex;flex-direction:column}

/* ── TOPBAR ── */
.topbar{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0.65rem 1.25rem;background:rgba(240,239,236,0.95);backdrop-filter:blur(12px);border-bottom:1.5px solid rgba(0,0,0,0.07);z-index:100}
.back-link{text-decoration:none;font-size:0.72rem;font-weight:700;color:rgba(0,0,0,0.38);letter-spacing:0.05em;text-transform:uppercase;transition:color 0.2s}
.back-link:hover{color:rgba(0,0,0,0.65)}
.brand{font-family:'Geist', sans-serif;font-size:0.7rem;font-weight:900;letter-spacing:0.28em;text-transform:uppercase;color:rgba(0,0,0,0.18)}
.topic-label{font-size:0.6875rem;font-weight:700;color:rgba(0,0,0,0.38);letter-spacing:0.04em;text-align:right;max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}

/* ── SUBJECT TABS ── */
.topic-tabs{flex-shrink:0;display:flex;align-items:center;gap:0.25rem;padding:0.45rem 1.1rem;background:rgba(240,239,236,0.8);border-bottom:1px solid rgba(0,0,0,0.06);overflow-x:auto}
.topic-tabs::-webkit-scrollbar{display:none}
.ttab{background:transparent;border:none;padding:0.28rem 0.65rem;border-radius:2rem;font-family:'Geist', sans-serif;font-size:0.6875rem;font-weight:700;color:rgba(0,0,0,0.3);cursor:pointer;transition:all 0.2s;white-space:nowrap;letter-spacing:0.06em;text-transform:uppercase}
.ttab:hover{color:rgba(0,0,0,0.55);background:rgba(0,0,0,0.05)}
.ttab.active{background:var(--ink);color:#fff}

/* ── (Cards/Phrases toggle removed — narrative uses the 3-tab footer) ── */

/* ── STAGE ── */
.stage{flex:1;min-height:0;position:relative;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;align-items:center;padding:1.1rem 1rem 1.4rem}
.stage::-webkit-scrollbar{width:3px}
.stage::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.1);border-radius:2px}

.hint{width:min(420px,92vw);font-family:'Geist', sans-serif;font-style:italic;font-size:0.7rem;color:rgba(0,0,0,0.32);margin-bottom:0.8rem;text-align:center}

/* ── stack + spine ── */
.stack{width:min(1120px,96vw);position:relative}   /* same column as every Model page (30 Oct) */
.stack.has-cards::before{content:'';position:absolute;left:1.35rem;top:0.6rem;bottom:0.6rem;width:2px;background:var(--sig);opacity:0.22;z-index:0}
.card{position:relative;z-index:1;display:flex;background:var(--white);border-radius:1.1rem;overflow:hidden;margin-bottom:0.55rem;box-shadow:0 2px 0 rgba(255,255,255,0.8) inset,3px 5px 0 rgba(0,0,0,0.05),0 14px 36px rgba(0,0,0,0.12),0 3px 9px rgba(0,0,0,0.06);animation:cardUp .5s cubic-bezier(.22,1,.36,1) both}
@keyframes cardUp{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
.band{width:2.7rem;flex-shrink:0;background:var(--sig);display:flex;flex-direction:column;align-items:center;padding:0.85rem 0 0.95rem;gap:0.55rem}
.band-num{font-family:'Geist', sans-serif;font-weight:900;font-size:1.5rem;color:#fff;line-height:1}
.band-word{writing-mode:vertical-rl;text-orientation:mixed;font-family:'Geist', sans-serif;font-weight:700;font-size:0.6875rem;letter-spacing:0.26em;text-transform:uppercase;color:rgba(255,255,255,0.72)}
.content{flex:1;min-width:0;padding:0.9rem 1rem 1rem}
.flow{width:2.7rem;text-align:center;color:var(--sig);opacity:0.45;font-size:0.78rem;line-height:1;margin:-0.15rem 0 0.4rem}

/* ── tiles ── */
.line{font-family:'Geist', sans-serif;font-weight:500;font-size:0.98rem;line-height:1.55;color:var(--txt)}
.lead{color:var(--txt);font-weight:600}
.soft{color:rgba(0,0,0,0.42);font-weight:400;font-size:0.9rem}
.sig{color:var(--sig);font-weight:500;font-size:0.9rem;margin-right:0.12rem}
.view{color:rgba(0,0,0,0.36);font-weight:400;font-size:0.86rem}
.gap{font-weight:600;color:rgba(0,0,0,0.5);letter-spacing:0.16em;padding:0 0.06rem}
.ast{color:var(--sig);font-weight:600;font-size:0.7em;vertical-align:0.35em;margin-left:0.05rem}
.dev{margin-top:0.02rem;line-height:1;font-family:'Geist', sans-serif;font-size:0.72rem;color:rgba(0,0,0,0.22);letter-spacing:0.16em}

/* ── rollable line + quiet arrows ── */
.rline{display:flex;align-items:center;gap:0.3rem}
.rline+.rline{margin-top:0.55rem}
.rtext{flex:1;min-width:0}
.nav{display:flex;gap:0.35rem;flex-shrink:0;opacity:1;align-items:center}
.nav button{border:none;background:none;color:var(--sig);font-size:1.15rem;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;padding:0 0.05rem;font-family:'Geist', sans-serif}
.nav button:hover{opacity:0.55}
.nav button:active{transform:scale(.85)}
@keyframes navPulse{0%,100%{opacity:1}50%{opacity:0.3}}
.nav button.teach{animation:navPulse 0.9s ease-in-out 3}

/* ── in-card footnote ── */
.card-note{margin-top:0.7rem;padding-top:0.55rem;border-top:1px solid rgba(0,0,0,0.06);font-family:'Geist', sans-serif;font-size:0.6875rem;line-height:1.7;color:rgba(0,0,0,0.34)}

.card-note span.opt{margin-right:0.6rem;white-space:nowrap}

.state{width:min(420px,92vw);text-align:center;padding:2.5rem 1rem;font-family:'Geist', sans-serif;color:rgba(0,0,0,0.4);font-style:italic;font-size:0.85rem}
.state.err{color:#b4453a}

/* ── FOOTER NAV ── */
.foot{flex-shrink:0;display:flex;justify-content:center;padding:0.5rem 1rem calc(env(safe-area-inset-bottom,0px) + 0.55rem);background:rgba(240,239,236,0.95);border-top:1px solid rgba(0,0,0,0.06)}
.nav-pill{display:flex;gap:0.12rem;background:rgba(10,10,10,0.07);border-radius:2rem;padding:0.25rem 0.28rem}
.nb{background:transparent;border:none;padding:0.35rem 0.75rem;border-radius:1.5rem;font-family:'Geist', sans-serif;font-size:0.6875rem;letter-spacing:0.03em;color:rgba(0,0,0,0.28);cursor:pointer;transition:all 0.22s;white-space:nowrap;min-height:28px;font-weight:700;text-transform:uppercase}

<script>
/* ════════ NARRATIVE CARDS — four fixed stages. Each stage = one card with a rotating FRAME + a RECIPE + INGREDIENT banks. Hybrid model: scaffold + raw material, student assembles their own sentence. ════════ */

const DATA_PATH = 'data/narrative-cards-models.json';

/* the four narrative stages, in fixed sequence */
const STAGE_ORDER = ['scene','develop','tension','resolution'];

/* ── sound ── */
const AudioCtx=window.AudioContext||window.webkitAudioContext;let actx=null;
function ac(){if(!actx)actx=new AudioCtx();return actx;}
function tone(f,t,d,v,delay=0){try{const c=ac(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type=t;o.frequency.value=f;const s=c.currentTime+delay;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(v,s+0.01);g.gain.exponentialRampToValueAtTime(0.0001,s+d);o.start(s);o.stop(s+d+0.05);}catch(e){}}
function sndRoll(){tone(500,'triangle',0.07,0.06);tone(660,'triangle',0.05,0.04,0.04);}
function sndSwitch(){tone(440,'triangle',0.08,0.07);tone(580,'triangle',0.06,0.05,0.05);}

const pick = a => a[Math.floor(Math.random()*a.length)];
/* pick a value not already used on a sibling line. Works for strings AND signpost objects (compares by .t). */
const keyOf = x => (x && typeof x==='object') ? (x.t||JSON.stringify(x)) : x;
const pickAvoid = (pool, avoid) => {
  if(!pool||!pool.length) return '...';
  const av = (avoid||[]).map(keyOf);
  const free = pool.filter(x=>!av.includes(keyOf(x)));
  return pick(free.length?free:pool);
};
const fmt  = s => (s||'').replace(/\.\.\./g,'<span class="gap">...</span>');

let DATA=null, STAGES=null, STAGE=null;
let frameIdx=0, taught=false;

async function init(){
  try{
    const r = await fetch(DATA_PATH);
    if(!r.ok) throw new Error('HTTP '+r.status);
    DATA = await r.json();
  }catch(e){
    document.getElementById('stack').innerHTML =
      `<div class="state err">Couldn't load the model data.<br><span style="font-size:.72rem;opacity:.7">${DATA_PATH} — ${e.message}. A fetch page must be served over http, not opened from disk.</span></div>`;
    return;
  }
  STAGES = DATA.stages||{};
  const keys = STAGE_ORDER.filter(k=>STAGES[k]);
  if(!keys.length){ document.getElementById('stack').innerHTML='<div class="state err">No narrative stages found.</div>'; return; }
  /* arriving from an expressions badge: open the stage those words belong to */
  let want=null;
  try{ want=new URLSearchParams(location.search).get('stage'); }catch(e){}
  STAGE = (want && STAGES[want]) ? want : keys[0];
  applyStage(); renderTabs(); render();
  if(want && STAGES[want]){
    const b=document.querySelector('.build-row');
    if(b) setTimeout(()=>b.scrollIntoView({behavior:'smooth',block:'center'}),350);
  }
}

function savedQuestion(){
  try{ return JSON.parse(sessionStorage.getItem('currentNarrativeQuestion')||'null'); }
  catch(e){ return null; }
}

function applyStage(){
  frameIdx=0; seedBuild();
  /* the stages are the same whatever the task, but the learner arrived here
     from a specific one — say so, or the page reads as generic reference */
  const q=savedQuestion();
  const lab=(STAGES[STAGE].label||STAGE).toUpperCase();
  /* the shared header replaces the old topbar, so the label may not exist (as on the Review cards) */
  { const el=document.getElementById('topicLabel'); if(el) el.textContent = q && q.title ? `${q.title} · ${lab}` : lab; }
}

function renderTabs(){
  const c=document.getElementById('tabsContainer');
  c.innerHTML = STAGE_ORDER.filter(k=>STAGES[k]).map(k=>
    `<button class="ttab ${k===STAGE?'active':''}" onclick="switchStage('${k}')">${STAGES[k].label||k}</button>`
  ).join('');
}
function switchStage(k){
  if(!STAGES[k]||k===STAGE) return;
  STAGE=k; sndSwitch(); applyStage(); renderTabs(); window.__phJump=true; render();
}
window.switchStage=switchStage;

/* roll the frame for the current stage */
function rollFrame(dir){
  const frames=STAGES[STAGE].frames||['...'];
  frameIdx=(frameIdx+dir+frames.length)%frames.length;
  taught=true; sndRoll(); render();
}
window.rollFrame=rollFrame;

/* ── recipe chips ── */
function recipeHTML(recipe){
  return (recipe||[]).map(r=>`<span class="recipe-chip">${r}</span>`).join('<span class="recipe-plus">+</span>');
}

/* ══ THE LADDER ═══════════════════════════════════════════════════════
   Ingredients carry a grade: 1 plain, 2 B2 core, 3 ambitious. Within one
   class the three grades are the SAME choice point at three levels —
   walked / hurried / hurtled — so stacking them vertically makes the
   upgrade visible without needing a synonym map. Where the other genres
   grade by register, narrative grades by vividness. */
const GRADE={1:{k:'plain',t:'Plain'},2:{k:'core',t:'B2 core'},3:{k:'vivid',t:'Ambitious'}};

const slug = c => c.replace(/[^a-z]/gi,'');
const wordOf = x => (x && typeof x==='object') ? x.w : x;
const gradeOf = x => (x && typeof x==='object' && x.grade) ? x.grade : 2;

/* The banks ARE the picker. A modal would cover the ladder, and rolling would
   hide it: tap for a random word and you never see that you landed on a plain
   one when a B2 word was sitting beside it. Here the choice is direct, the
   alternatives stay on screen, and the upgrade is an action you perform. */
function ingredientBanks(ings){
  return Object.entries(ings||{}).map(([cat,words])=>{
    const id=slug(cat);
    const rows=[1,2,3].map(g=>{
      const ws=(words||[]).map((w,i)=>[w,i]).filter(([w])=>gradeOf(w)===g);
      if(!ws.length) return '';
      return `<div class="ing-row g${g}"><span class="ing-g">${GRADE[g].t}</span><div class="ing-words">${
        ws.map(([w,i])=>`<button type="button" class="ing-word g${g}" data-cat="${id}" data-i="${i}" onclick="choose('${cat.replace(/'/g,"\\'")}',${i})">${wordOf(w)}</button>`).join('')}</div></div>`;
    }).join('');
    return `<div class="ing-grp"><div class="ing-cat">${cat}<span class="ing-n">${(words||[]).length}</span></div>${rows}</div>`;
  }).join('');
}

function choose(cat,i){
  if(BUILD[cat]===i) return;
  BUILD[cat]=i; taught=true; sndRoll();
  paintSlot(cat); paintChosen(cat);
}
window.choose=choose;

/* the chosen word is marked in the bank too, so the slot and the ladder agree */
function paintChosen(cat){
  const id=slug(cat);
  document.querySelectorAll(`.ing-word[data-cat="${id}"]`).forEach(el=>{
    el.classList.toggle('picked', +el.dataset.i===BUILD[cat]);
  });
}
function paintSlot(cat){
  const el=document.getElementById('bw-'+slug(cat));
  if(!el) return;
  el.style.opacity='0';
  setTimeout(()=>{ el.innerHTML=buildWordHTML(cat); el.style.opacity='1'; },90);
}
function paintAll(){ Object.keys(STAGES[STAGE].ingredients||{}).forEach(c=>{ paintSlot(c); paintChosen(c); }); }

function shuffleAll(){
  seedBuild(); taught=true; sndSwitch();
  paintAll();
}
window.shuffleAll=shuffleAll;

/* ══ ASSEMBLE ═════════════════════════════════════════════════════════
   The banks are a palette; this makes it generative. One word is drawn
   from each class and each slot rolls on its own, so the learner sees a
   combination rather than a list — the paradigmatic choice the genre is
   actually built on. */
let BUILD={};
function seedBuild(){
  BUILD={};
  const ings=STAGES[STAGE].ingredients||{};
  Object.keys(ings).forEach(cat=>{ BUILD[cat]=Math.floor(Math.random()*(ings[cat]||[]).length); });
}
function rollSlot(cat){
  const pool=(STAGES[STAGE].ingredients||{})[cat]||[];
  if(pool.length<2) return;
  let i=BUILD[cat];
  while(i===BUILD[cat]) i=Math.floor(Math.random()*pool.length);
  BUILD[cat]=i; taught=true; sndRoll();
  paintSlot(cat);
}
window.rollSlot=rollSlot;
function buildWordHTML(cat){
  const pool=(STAGES[STAGE].ingredients||{})[cat]||[];
  const x=pool[BUILD[cat]||0];
  return `<span class="bw-word g${gradeOf(x)}">${wordOf(x)}</span>`;
}
function buildHTML(){
  const ings=STAGES[STAGE].ingredients||{};
  const slots=Object.keys(ings).map(cat=>
    `<div class="bslot">
       <span class="bcat">${cat}</span>
       <span class="bw" id="bw-${slug(cat)}">${buildWordHTML(cat)}</span>
     </div>`).join('');
  return `<div class="build-row"><div class="build-head"><span class="build-lead">your sentence</span>`+
    `<button type="button" class="shuffle-btn" onclick="shuffleAll()">Shuffle all</button></div>`+
    `<div class="build-slots">${slots}</div></div>`;
}

/* CALM (30 Oct 2026): the word banks fold away until asked for; the
   sentence and its Shuffle stay in view. Set the scene also shows the
   three past tenses, as on the sheet and in the clip. */
let BANKS=false;
function toggleBanks(){ BANKS=!BANKS; const w=document.getElementById('ingWrap'), b=document.getElementById('banksBtn'); if(!w) return;
  w.hidden=!BANKS; b.setAttribute('aria-expanded',String(BANKS)); b.innerHTML=(BANKS?'Hide the words':'Change the words')+' <span aria-hidden="true">'+(BANKS?'▴':'▾')+'</span>'; }
window.toggleBanks=toggleBanks;
function tenseStrip(){
  return `<div class="tense-strip"><span class="ts-k">Three past tenses</span>
    <span class="ts-i"><i style="background:#A9875F"></i><b>Before</b> had been waiting</span>
    <span class="ts-i"><i style="background:#8AA79C"></i><b>Background</b> was falling</span>
    <span class="ts-i"><i style="background:#232C31"></i><b>Events</b> ran, saw</span></div>`;
}
/* PHRASES: the traditional list, for the student who wants everything on one
   page — every stage, every frame, every word bank, nothing to tap open */
let view='cards';
function setView(v){
  view=v;
  document.getElementById('mbCards').classList.toggle('active',v==='cards');
  document.getElementById('mbPhrases').classList.toggle('active',v==='phrases');
  const h=document.getElementById('hint');
  if(h) h.textContent=v==='cards'?'Tap Open to see the frame closer — and choose another wording.':'Every stage on one page · tap a stage above to jump to it';
  render();
}
window.setView=setView;
function renderPhrases(){
  const keys=Object.keys(STAGES).sort((a,b)=>(STAGES[a].order||0)-(STAGES[b].order||0));
  document.getElementById('stack').innerHTML=keys.map((k,i)=>{ const st=STAGES[k];
    const frames=(st.frames||[]).map(f=>`<div class="pline">${fmt(f)}</div>`).join('');
    const banks=Object.entries(st.ingredients||{}).map(([cat,pool])=>
      `<div class="pgroup"><div class="pgroup-title">${cat}<span class="pgroup-count">${pool.length}</span></div><div class="pwords">${pool.map(x=>gradeOf(x)>=3?'<b>'+wordOf(x)+'</b>':wordOf(x)).join(' · ')}</div></div>`).join('');
    return `<div class="card" id="ph-${k}"><div class="band"><span class="band-num">${String(st.order||i+1).padStart(2,'0')}</span><span class="band-word">${st.label||k}</span></div>
      <div class="content"><div class="pgroup"><div class="pgroup-title">Frames<span class="pgroup-count">${(st.frames||[]).length}</span></div>${frames}</div>${banks}</div></div>`+(i<keys.length-1?'<div class="flow">&#9662;</div>':'');
  }).join('');
  document.getElementById('stack').classList.add('has-cards');
  const t=document.getElementById('ph-'+STAGE); if(t&&window.__phJump){ t.scrollIntoView({block:'start',behavior:'smooth'}); } window.__phJump=false;
}
function render(){
  if(view==='phrases'){ renderPhrases(); return; }
  const st = STAGES[STAGE];
  const frames = st.frames||['...'];
  const frame = frames[frameIdx % frames.length];
  const num = String(st.order||1).padStart(2,'0');

  document.getElementById('stack').innerHTML=`
    <div class="card"><div class="band"><span class="band-num">${num}</span><span class="band-word">${st.label||STAGE}</span></div>
      <div class="content">
        <div class="stage-purpose">${st.purpose||''}</div>

        <div class="frame-row">
          <div class="frame-lead">frame</div>
          <div class="rline"><div class="rtext"><div class="line frame-line">${fmt(frame)}</div></div>
            ${OC_pill('frame')}
          </div>
        </div>

        ${STAGE==='scene'?tenseStrip():''}
        ${buildHTML()}

        <button type="button" class="banks-btn" id="banksBtn" aria-expanded="${BANKS?'true':'false'}" onclick="toggleBanks()">${BANKS?'Hide the words':'Change the words'} <span aria-hidden="true">${BANKS?'▴':'▾'}</span></button>
        <div class="ing-wrap" id="ingWrap"${BANKS?'':' hidden'}>${ingredientBanks(st.ingredients)}
          <div class="card-note narr-note"><span class="k">how</span> tap a word to place it in your sentence &mdash; then write the sentence in your own words</div></div>
      </div>
    </div>`;
  document.getElementById('stack').classList.add('has-cards');
  Object.keys(STAGES[STAGE].ingredients||{}).forEach(paintChosen);
}
/* OPEN › (27 Oct): the frame opens as the poster card; Another wording
   walks through the stage's frames, and the chosen question's sample
   story shows its paragraph for this stage */
let OC_SMP=null, OC_Q=null;
try{ OC_Q=JSON.parse(sessionStorage.getItem('currentNarrativeQuestion')||'null'); }catch(e){}
fetch('/skills/writing/narrative/data/narrative-samples.json').then(r=>r.ok?r.json():null).then(d=>{ OC_SMP=d; }).catch(()=>{});
window.OC={
  line:()=>{ const fr=STAGES[STAGE].frames||['...']; return fmt(fr[frameIdx%fr.length]); },
  state:()=>({i:frameIdx%((STAGES[STAGE].frames||['']).length)}),
  roll:(slot,dir)=>rollFrame(dir),
  label:()=>String(STAGES[STAGE].order||1).padStart(2,'0')+' · '+(STAGES[STAGE].label||STAGE),
  head:()=>STAGES[STAGE].label||STAGE,
  sample:()=>{ const L=OC_SMP&&OC_SMP.samples; if(!L||!OC_Q) return null;
    const smp=L.find(x=>x.title===OC_Q.title)||L.find(x=>x.question===OC_Q.opening); if(!smp) return null;
    const p=(smp.paragraphs||[])[(STAGES[STAGE].order||1)-1]; if(!p) return null;
    return String(p.text).replace(/[«»]/g,'').split(/(?<=[.!?])\s+/).slice(0,2).join(' '); }};

/* ── FOOTER NAV ── */
function switchMode(mode){
  if(mode==='model')return;
  const map={question:'narrative-question.html',sample:'narrative-sample.html'};
  if(map[mode])window.location.href=map[mode];
}
window.switchMode=switchMode;

init();
</script>
<script src="/data/writing/writing-chrome.js?v=13"></script>
</body>
</html>
