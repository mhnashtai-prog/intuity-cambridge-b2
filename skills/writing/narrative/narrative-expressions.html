<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Narrative Expressions — INTUITY</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900&family=Barlow:ital,wght@0,400;0,600;0,700;0,800&family=Barlow+Condensed:wght@700;800;900&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#f0efec;--ink:#111111;--white:#ffffff;
  --acc:#c94f6d;--acc-d:#c74767;--acc-lt:rgba(176,106,44,0.08);--acc-mid:rgba(176,106,44,0.4);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;position:fixed;background:var(--bg);font-family:'Barlow',sans-serif;-webkit-font-smoothing:antialiased}
.shell{position:fixed;inset:0;display:flex;flex-direction:column}

.topbar{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0.65rem 1.25rem;background:rgba(240,239,236,0.95);backdrop-filter:blur(12px);border-bottom:1.5px solid rgba(0,0,0,0.07);z-index:100}
.back-link{text-decoration:none;font-size:0.72rem;font-weight:700;color:rgba(0,0,0,0.38);letter-spacing:0.05em;text-transform:uppercase}
.back-link:hover{color:rgba(0,0,0,0.65)}
.brand{font-family:'Barlow Condensed',sans-serif;font-size:0.7rem;font-weight:900;letter-spacing:0.28em;text-transform:uppercase;color:rgba(0,0,0,0.18)}
.label{font-size:0.68rem;font-weight:700;color:rgba(0,0,0,0.38);letter-spacing:0.04em;text-transform:uppercase}

.stage{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:1.2rem 1rem 2rem;display:flex;justify-content:center}
.stage::-webkit-scrollbar{width:4px}.stage::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.1);border-radius:2px}
.sheet{width:min(560px,94vw)}

.intro{text-align:center;margin-bottom:1.4rem}
.intro-title{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:900;color:var(--ink);margin-bottom:0.3rem}
.intro-sub{font-family:'Instrument Sans',sans-serif;font-style:italic;font-size:0.82rem;color:rgba(0,0,0,0.45)}

.grp{background:var(--white);border-radius:1rem;padding:0.9rem 1.1rem;margin-bottom:0.8rem;box-shadow:0 2px 8px rgba(0,0,0,0.05),0 1px 0 rgba(0,0,0,0.02)}
.stage-head{font-family:'Barlow Condensed',sans-serif;font-size:0.68rem;font-weight:900;
  letter-spacing:0.2em;text-transform:uppercase;color:var(--acc);opacity:0.85;
  margin:1.4rem 0 0.5rem;padding-bottom:0.3rem;border-bottom:1.5px solid color-mix(in srgb, var(--acc) 25%, transparent)}
.stage-head:first-child{margin-top:0}
.wrow{display:flex;align-items:baseline;gap:0.5rem;margin-bottom:0.3rem}
.wg{flex-shrink:0;width:4.4rem;font-family:'Barlow Condensed',sans-serif;font-size:0.52rem;font-weight:800;
  letter-spacing:0.12em;text-transform:uppercase;color:rgba(0,0,0,0.28);padding-top:0.2rem}
.wrow.g2 .wg{color:var(--acc);opacity:0.75}
.wrow.g3 .wg{color:var(--acc-d)}
.word.g1{background:rgba(0,0,0,0.045);color:rgba(0,0,0,0.5)}
.word.g2{background:color-mix(in srgb, var(--acc) 11%, transparent);color:rgba(0,0,0,0.78)}
.word.g3{background:color-mix(in srgb, var(--acc) 18%, transparent);color:var(--acc-d);font-weight:600}
.grp-head{display:flex;align-items:baseline;gap:0.6rem;margin-bottom:0.6rem;border-bottom:1px solid rgba(0,0,0,0.06);padding-bottom:0.45rem}
.grp-cat{font-family:'Barlow Condensed',sans-serif;font-size:0.95rem;font-weight:900;letter-spacing:0.03em;text-transform:uppercase;color:var(--acc)}
.grp-head{display:flex;align-items:baseline;gap:0.5rem;flex-wrap:wrap}
.grp-practise{margin-left:auto;display:inline-flex;align-items:center;gap:0.3rem;flex-shrink:0;
  padding:0.24rem 0.62rem;border:none;border-radius:2rem;background:var(--acc);color:#fff;
  font-family:'Barlow Condensed',sans-serif;font-size:0.55rem;font-weight:900;letter-spacing:0.09em;
  text-transform:uppercase;text-decoration:none;cursor:pointer;white-space:nowrap;
  box-shadow:0 2px 0 rgba(0,0,0,0.12);transform-origin:50% 130%;
  animation:gpWobble 8s ease-in-out infinite}
.grp-practise:hover{filter:brightness(1.08)}
.grp-practise:active{transform:scale(0.94)}
.grp:nth-child(3) .grp-practise{animation-delay:1.6s}
.grp:nth-child(5) .grp-practise{animation-delay:3.2s}
.grp:nth-child(7) .grp-practise{animation-delay:4.8s}
@keyframes gpWobble{
  0%{transform:rotate(0) scale(1)} 2%{transform:rotate(-5deg) scale(1.06)}
  4%{transform:rotate(4deg) scale(1.06)} 6%{transform:rotate(-3deg) scale(1.04)}
  8%{transform:rotate(2deg) scale(1.02)} 11%{transform:rotate(0) scale(1)}
  100%{transform:rotate(0) scale(1)}}
@media (prefers-reduced-motion:reduce){ .grp-practise{animation:none} }
.grp-hint{font-family:'Instrument Sans',sans-serif;font-style:italic;font-size:0.72rem;color:rgba(0,0,0,0.38)}
.words{display:flex;flex-wrap:wrap;gap:0.35rem}
.word{font-family:'Instrument Sans',sans-serif;font-size:0.82rem;color:rgba(0,0,0,0.72);background:var(--acc-lt);border:1px solid rgba(176,106,44,0.15);border-radius:0.55rem;padding:0.2rem 0.6rem}

.practice-link{display:flex;align-items:center;justify-content:center;gap:0.5rem;width:100%;margin-top:0.4rem;padding:0.85rem;background:var(--acc);color:#fff;border:none;border-radius:1rem;font-family:'Barlow Condensed',sans-serif;font-size:0.9rem;font-weight:900;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;text-decoration:none;transition:background 0.2s;box-shadow:0 4px 14px rgba(201,79,109,0.3)}
.practice-link:hover{background:var(--acc-d)}

.foot{flex-shrink:0;display:flex;justify-content:center;padding:0.5rem 1rem calc(env(safe-area-inset-bottom,0px) + 0.55rem);background:rgba(240,239,236,0.95);border-top:1px solid rgba(0,0,0,0.06)}
.nav-pill{display:flex;gap:0.12rem;background:rgba(10,10,10,0.07);border-radius:2rem;padding:0.25rem 0.28rem}
.nb{background:transparent;border:none;padding:0.35rem 0.9rem;border-radius:1.5rem;font-family:'Barlow',sans-serif;font-size:0.62rem;color:rgba(0,0,0,0.3);cursor:pointer;transition:all 0.22s;font-weight:700;text-transform:uppercase}
.nb.on{background:var(--ink);color:#fff;font-weight:800}
.nb:hover:not(.on){color:rgba(0,0,0,0.5)}
.loading{font-family:'Barlow Condensed',sans-serif;font-size:0.85rem;font-weight:700;color:rgba(0,0,0,0.25);letter-spacing:0.12em;text-transform:uppercase;text-align:center;padding:2rem}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <a class="back-link" href="/?openModal=writing">← Writing</a>
    <span class="brand">INTUITY</span>
    <span class="label">Expressions</span>
  </div>

  <div class="stage" id="stage"><div class="loading">Loading…</div></div>

  <div class="foot">
    <div class="nav-pill">
      <button class="nb"    onclick="navTo('question')">Questions</button>
      <button class="nb"    onclick="navTo('sample')">Samples</button>
      <button class="nb on" onclick="navTo('expressions')">Expressions</button>
    </div>
  </div>
</div>
<script>
const DATA_PATH='data/narrative-expressions.json';

/* ── the sleeping giant ────────────────────────────────────────────────
   A word list is a reference; building a sentence from it is the practice.
   That link existed, once, at the very bottom of the page — below eight
   groups and several hundred pixels of scroll. Almost nobody reached it.
   Now every group carries its own badge, and it lands on the STAGE that
   group belongs to, so the practice is about the words just read rather
   than the page in general. */
const STAGE_ORDER=['scene','develop','tension','resolution'];
const GRADE={1:'Plain',2:'B2 core',3:'Ambitious'};
const wordOf  = x => (x && typeof x==='object') ? x.w : x;
const gradeOf = x => (x && typeof x==='object' && x.grade) ? x.grade : 2;

/* groups arrive tagged with their stage, so the page reads in story order —
   scene, develop, tension, resolution — rather than as one flat list */
function renderGroups(groups){
  return STAGE_ORDER.map(sk=>{
    const mine=groups.filter(g=>(g.stage||'scene')===sk);
    if(!mine.length) return '';
    const label=(mine[0].stageLabel)||sk;
    return `<div class="stage-head">${label}</div>`+mine.map(g=>`
      <div class="grp">
        <div class="grp-head"><span class="grp-cat">${g.category||''}</span><span class="grp-hint">${g.hint||''}</span><a class="grp-practise" href="narrative-cards.html?stage=${sk}">Practise <span aria-hidden="true">&#8250;</span></a></div>
        ${[1,2,3].map(gr=>{
          const ws=(g.words||[]).filter(w=>gradeOf(w)===gr);
          if(!ws.length) return '';
          return `<div class="wrow g${gr}"><span class="wg">${GRADE[gr]}</span><div class="words">${
            ws.map(w=>`<span class="word g${gr}">${wordOf(w)}</span>`).join('')}</div></div>`;
        }).join('')}
      </div>`).join('');
  }).join('');
}
async function init(){
  let groups=[];
  try{ groups=(await (await fetch(DATA_PATH)).json()).groups||[]; }
  catch(e){ document.getElementById('stage').innerHTML='<div class="loading">⚠ Could not load expressions</div>'; return; }
  document.getElementById('stage').innerHTML=`
    <div class="sheet">
      <div class="intro">
        <div class="intro-title">Narrative Language</div>
        <div class="intro-sub">the words that make a story move — plain, B2, ambitious</div>
      </div>
      ${renderGroups(groups)}
      <a class="practice-link" href="narrative-cards.html">Build a sentence with these →</a>
    </div>`;
}
function navTo(dest){
  if(dest==='expressions')return;
  const map={question:'narrative-question.html',sample:'narrative-sample.html'};
  if(map[dest])window.location.href=map[dest];
}
window.navTo=navTo;
init();
</script>
</body>
</html>
