<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Narrative Questions — INTUITY</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Barlow:ital,wght@0,400;0,600;0,700;0,800&family=Barlow+Condensed:wght@700;800;900&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500&family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=7">
<link rel="stylesheet" href="/data/writing/writing.css?v=2">
<style>
:root{--bg:#f0efec;--ink:#111111;--white:#ffffff;}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;position:fixed;background:var(--bg);font-family:'Barlow',sans-serif;-webkit-font-smoothing:antialiased}
.shell{position:fixed;inset:0;display:flex;flex-direction:column}

.topbar{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0.65rem 1.25rem;background:rgba(240,239,236,0.95);backdrop-filter:blur(12px);border-bottom:1.5px solid rgba(0,0,0,0.07);z-index:100}
.back-link{text-decoration:none;font-size:0.72rem;font-weight:700;color:rgba(0,0,0,0.38);letter-spacing:0.05em;text-transform:uppercase;transition:color 0.2s}
.back-link:hover{color:rgba(0,0,0,0.65)}
.brand{font-family:'Barlow Condensed',sans-serif;font-size:0.7rem;font-weight:900;letter-spacing:0.28em;text-transform:uppercase;color:rgba(0,0,0,0.18)}
.counter{font-size:0.68rem;font-weight:700;color:rgba(0,0,0,0.38);letter-spacing:0.04em}

.stage{flex:1;min-height:0;position:relative;overflow-y:auto;display:flex;align-items:flex-start;justify-content:center;padding:1.5rem 0 2rem}

/* ══ POSTER CARD — built on the shell's .poster (intuity-shell.css §14) ══
   Only sizing, the story-specific opening-quote box, and the footer nav
   live here. Paper colour, kicker, headline font, rule — all shell. */
.poster{width:min(730px,90vw);max-height:min(560px,82vh);display:flex;flex-direction:column;overflow:hidden;animation:cardEnter 0.4s cubic-bezier(0.2,1,0.4,1) both}
@keyframes cardEnter{from{opacity:0;transform:translateY(10px) scale(0.98)}to{opacity:1;transform:none}}

.poster-head{font-size:clamp(1.12rem,4vw,1.48rem)}

.poster-scroll{flex:1;overflow-y:auto;min-height:0}

/* the opening-line quote: uses the poster's own tokens, styled with the
   shell's fill so it reads as part of the card, not an imported accent */
.poster-quote{background:var(--poster-fill);border-radius:var(--r-field);padding:0.7rem 0.9rem;margin:0.9rem 0}
.poster-quote-lead{font-family:var(--f-mono);font-size:0.58rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--poster-faint);margin-bottom:0.3rem}
.poster-quote-line{font-family:'Playfair Display',serif;font-style:italic;font-size:1rem;line-height:1.4;color:var(--poster-ink)}

.kp-list{display:flex;flex-direction:column;gap:0.55rem;margin-top:0.2rem}
.kp-item{display:flex;align-items:flex-start;gap:0.55rem;font-family:var(--f-body);font-size:0.85rem;font-weight:500;line-height:1.4;color:var(--poster-body)}
.kp-arrow{flex-shrink:0;width:16px;height:16px;margin-top:0.1rem;color:var(--caramel);opacity:0.8}

.poster-print{font-family:'Playfair Display',serif;font-style:italic;font-size:0.75rem;color:var(--poster-faint);text-align:center;margin-top:0.9rem}

.poster-foot{display:flex;align-items:center;justify-content:space-between;margin-top:1.1rem;padding-top:0.9rem;border-top:1px solid var(--poster-rule)}
.poster-nav-btn{background:none;border:none;cursor:pointer;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--poster-faint);transition:background 0.15s,color 0.15s}
.poster-nav-btn:hover{background:var(--poster-fill);color:var(--poster-ink)}
.poster-nav-btn:disabled{opacity:0.25;cursor:default}
.poster-counter{font-family:var(--f-mono);font-size:0.75rem;font-weight:600;letter-spacing:0.04em;color:var(--poster-faint)}

.foot{flex-shrink:0;display:flex;justify-content:center;padding:0.5rem 1rem calc(env(safe-area-inset-bottom,0px) + 0.55rem);background:rgba(240,239,236,0.95);border-top:1px solid rgba(0,0,0,0.06)}
.nav-pill{display:flex;gap:0.12rem;background:rgba(10,10,10,0.07);border-radius:2rem;padding:0.25rem 0.28rem}
.nb{background:transparent;border:none;padding:0.35rem 0.9rem;border-radius:1.5rem;font-family:'Barlow',sans-serif;font-size:0.62rem;letter-spacing:0.03em;color:rgba(0,0,0,0.3);cursor:pointer;transition:all 0.22s;font-weight:700;text-transform:uppercase}
.nb.on{background:var(--ink);color:#fff;font-weight:800}
.nb:hover:not(.on){color:rgba(0,0,0,0.5)}
.loading{font-family:'Barlow Condensed',sans-serif;font-size:0.85rem;font-weight:700;color:rgba(0,0,0,0.25);letter-spacing:0.12em;text-transform:uppercase}
</style>
</head>
<body data-writing="story" data-stage="question">
<div class="shell">
  <div class="topbar">
    <a class="back-link" href="/skills/writing/writing-door.html">← Writing</a>
    <span class="brand">INTUITY</span>
    <span class="counter" id="counter">Narrative</span>
  </div>

  <div class="stage" id="stage"><div class="loading" id="loading">Loading…</div></div>

  <div class="foot">
    <div class="nav-pill">
      <button class="nb on" onclick="navTo('question')">Question</button>
      <button class="nb"    onclick="navTo('sample')">Sample</button>
      <button class="nb"    onclick="navTo('model')">Model</button>
    </div>
  </div>
</div>
<script>
const DATA_PATH='data/narrative-questions.json';
let QS=[], cur=0, tsX=0;

async function init(){
  try{ const r=await fetch(DATA_PATH); QS=(await r.json()).questions||[]; }
  catch(e){ document.getElementById('loading').textContent='⚠ Could not load questions'; return; }
  if(!QS.length){ document.getElementById('loading').textContent='No prompts yet'; return; }
  show(0);
}

function show(i){
  cur=Math.max(0,Math.min(i,QS.length-1));
  const q=QS[cur];
  const stage=document.getElementById('stage');
  stage.innerHTML=`
    <div class="poster">
      <div class="poster-kick"><i></i><span>${String(cur+1).padStart(2,'0')} · Write a story · Narrative</span></div>
      <div class="poster-scroll">
        <h3 class="poster-head">${q.title||''}</h3>
        <hr class="poster-rule">
        <p class="poster-body">${q.prompt||''}</p>
        ${q.opening?`<div class="poster-quote"><div class="poster-quote-lead">Begin your story with</div><div class="poster-quote-line">"${q.opening}"</div></div>`:''}
        <div class="poster-sub">Your story should</div>
        <div class="kp-list">${(q.points||[]).map(p=>`<div class="kp-item"><svg class="kp-arrow" width="16" height="16" viewBox="0 0 14 14" fill="none"><path d="M5 3L9 7L5 11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>${p}</span></div>`).join('')}</div>
        <div class="poster-print">The best stories will be printed next month.</div>
      </div>
      <div class="poster-foot">
        <button class="poster-nav-btn" onclick="go(-1)" ${cur===0?'disabled':''}><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9 3L5 7L9 11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <span class="poster-counter">${cur+1} / ${QS.length}</span>
        <button class="poster-nav-btn" onclick="go(1)" ${cur===QS.length-1?'disabled':''}><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M5 3L9 7L5 11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    </div>`;
  try{ sessionStorage.setItem('currentNarrativeQuestion',JSON.stringify(q)); }catch(e){}
}
function go(d){ const n=cur+d; if(n>=0&&n<QS.length) show(n); }
window.go=go;

document.addEventListener('touchstart',e=>{tsX=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tsX;if(dx<-55)go(1);if(dx>55)go(-1);},{passive:true});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1);});

function navTo(dest){
  if(dest==='question')return;
  const map={model:'narrative-cards.html',sample:'narrative-sample.html'};
  if(map[dest])window.location.href=map[dest];
}
window.navTo=navTo;
init();
</script>
<script src="/skills/grammar-rules/intuity-sound.js"></script>
<script src="/data/writing/writing-chrome.js?v=2"></script>
</body>
</html>
