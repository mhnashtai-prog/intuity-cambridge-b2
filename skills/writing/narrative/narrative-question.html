<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Narrative Questions — Be2FIRST</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..900&family=Geist+Mono:wght@400..600&family=Space+Grotesk:wght@700&family=Anton&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&display=swap" rel="stylesheet"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..900&family=Geist+Mono:wght@400..600&family=Space+Grotesk:wght@700&family=Anton&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&display=swap" rel="stylesheet">

<style>
:root{--bg:#f0efec;--ink:#111111;--white:#ffffff;}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;position:fixed;background:var(--bg);font-family:'Geist', sans-serif;-webkit-font-smoothing:antialiased}
.shell{position:fixed;inset:0;display:flex;flex-direction:column}

.topbar{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0.65rem 1.25rem;background:rgba(240,239,236,0.95);backdrop-filter:blur(12px);border-bottom:1.5px solid rgba(0,0,0,0.07);z-index:100}
.back-link{text-decoration:none;font-size:0.72rem;font-weight:700;color:rgba(0,0,0,0.38);letter-spacing:0.05em;text-transform:uppercase;transition:color 0.2s}
.back-link:hover{color:rgba(0,0,0,0.65)}
.brand{font-family:'Geist', sans-serif;font-size:0.7rem;font-weight:900;letter-spacing:0.28em;text-transform:uppercase;color:rgba(0,0,0,0.18)}
.counter{font-size:0.6875rem;font-weight:700;color:rgba(0,0,0,0.38);letter-spacing:0.04em}

.stage{flex:1;min-height:0;position:relative;overflow-y:auto;display:flex;align-items:flex-start;justify-content:center;padding:1.5rem 0 2rem}

/* ══ POSTER CARD — built on the shell's .poster (intuity-shell.css §14) ══
   Only sizing, the story-specific opening-quote box, and the footer nav
   live here. Paper colour, kicker, headline font, rule — all shell. */
.poster{width:min(730px,90vw);max-height:min(560px,82vh);display:flex;flex-direction:column;overflow:hidden;animation:cardEnter 0.4s cubic-bezier(0.2,1,0.4,1) both}
@keyframes cardEnter{from{opacity:0;transform:translateY(10px) scale(0.98)}to{opacity:1;transform:none}}

.poster-head{font-size:clamp(1.12rem,4vw,1.48rem)}

.poster-scroll{flex:1;overflow-y:auto;min-height:0}

/* the opening-line quote: uses the poster's own tokens, styled with the
   shell's fill so it reads as part of the card, not an imported accent */
.poster-quote{background:var(--poster-fill);border-radius:var(--r-field);padding:0.7rem 0.9rem;margin:0.9rem 0}
.poster-quote-lead{font-family:var(--f-mono);font-size:0.6875rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--poster-faint);margin-bottom:0.3rem}
.poster-quote-line{font-family:'Newsreader', serif;font-style:italic;font-size:1rem;line-height:1.4;color:var(--poster-ink)}

.kp-list{display:flex;flex-direction:column;gap:0.55rem;margin-top:0.2rem}
.kp-item{display:flex;align-items:flex-start;gap:0.55rem;font-family:var(--f-body);font-size:0.85rem;font-weight:500;line-height:1.4;color:var(--poster-body)}
.kp-arrow{flex-shrink:0;width:16px;height:16px;margin-top:0.1rem;color:var(--caramel);opacity:0.8}

.poster-print{font-family:'Newsreader', serif;font-style:italic;font-size:0.75rem;color:var(--poster-faint);text-align:center;margin-top:0.9rem}

.poster-foot{display:flex;align-items:center;justify-content:space-between;margin-top:1.1rem;padding-top:0.9rem;border-top:1px solid var(--poster-rule)}
.poster-nav-btn{background:none;border:none;cursor:pointer;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--poster-faint);transition:background 0.15s,color 0.15s}
.poster-nav-btn:hover{background:var(--poster-fill);color:var(--poster-ink)}
.poster-nav-btn:disabled{opacity:0.25;cursor:default}
.poster-counter{font-family:var(--f-mono);font-size:0.75rem;font-weight:600;letter-spacing:0.04em;color:var(--poster-faint)}

.foot{flex-shrink:0;display:flex;justify-content:center;padding:0.5rem 1rem calc(env(safe-area-inset-bottom,0px) + 0.55rem);background:rgba(240,239,236,0.95);border-top:1px solid rgba(0,0,0,0.06)}
.nav-pill{display:flex;gap:0.12rem;background:rgba(10,10,10,0.07);border-radius:2rem;padding:0.25rem 0.28rem}
.nb{background:transparent;border:none;padding:0.35rem 0.9rem;border-radius:1.5rem;font-family:'Geist', sans-serif;font-size:0.6875rem;letter-spacing:0.03em;color:rgba(0,0,0,0.3);cursor:pointer;transition:all 0.22s;font-weight:700;text-transform:uppercase}
.nb.on{background:var(--ink);color:#fff;font-weight:800}
.nb:hover:not(.on){color:rgba(0,0,0,0.5)}
.loading{font-family:'Geist', sans-serif;font-size:0.85rem;font-weight:700;color:rgba(0,0,0,0.25);letter-spacing:0.12em;text-transform:uppercase}
.stage #parade{width:100%;align-self:flex-start}
.stage{padding-top:.4rem}
/* the parade's columns: the type in Anton, the question, what to cover */
.pa .kp-list{display:flex;flex-direction:column;gap:.55rem;margin-top:.6rem}
.pa .kp-item{display:flex;align-items:flex-start;gap:.55rem;font-size:clamp(14px,3.9vw,16px);font-weight:500;line-height:1.4;color:var(--pa-body)}
.pa .kp-arrow{flex-shrink:0;width:16px;height:16px;margin-top:.1rem;color:var(--caramel,#B0865C);opacity:.8}
.pa-sub{display:block;margin-top:14px;font:600 .625rem/1 var(--f-mono,'Geist Mono',monospace);letter-spacing:.18em;text-transform:uppercase;color:var(--pa-faint)}
.pa-note{display:block;margin-top:12px;font-size:13px;font-style:italic;color:var(--pa-body)}
.pa-open{display:block;margin-top:12px;padding:10px 12px;background:rgba(20,17,14,.05);font-size:14px;line-height:1.45}
.pa-open b{display:block;font:600 .625rem/1.4 var(--f-mono,'Geist Mono',monospace);letter-spacing:.16em;text-transform:uppercase;color:var(--pa-faint);margin-bottom:4px}
.pa-lock{display:flex;align-items:center;gap:8px;margin-top:10px;font:600 11px/1.3 var(--f-mono,'Geist Mono',monospace);letter-spacing:.06em;text-transform:uppercase;color:var(--pa-ink)}
.pa-lock i{font-style:normal;color:var(--pa-faint)}
/* on a phone the filters are one line that slides, not several that wrap */
@media(max-width:700px){
  .wr-filters.filter-bar{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;scrollbar-width:none;max-width:100%;
    padding:0 1rem;-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}
  .wr-filters.filter-bar::-webkit-scrollbar{display:none}
}
</style>
<link rel="stylesheet" href="/tools/parade.css?v=3">
<script src="/tools/parade.js?v=2"></script>
<script src="/tools/be2-brand.js?v=20261012c"></script>
</head>
<body data-writing="story" data-stage="question">
<div class="shell">
  <div class="topbar">
    <a class="back-link" href="/skills/writing/writing-door.html">← Writing</a>
    <span class="brand">INTUITY</span>
    <span class="counter" id="counter">Narrative</span>
  </div>

  <div class="stage" id="stage"><div class="loading" id="loading">Loading…</div></div>

  <div class="foot">
    <div class="nav-pill">
      <button class="nb on" onclick="navTo('question')">Question</button>
      <button class="nb"    onclick="navTo('sample')">Sample</button>
      <button class="nb"    onclick="navTo('model')">Model</button>
    </div>
  </div>
</div>
<script>
const DATA_PATH='data/narrative-questions.json';
let QS=[], cur=0, tsX=0;

async function init(){
  try{ const r=await fetch(DATA_PATH); QS=(await r.json()).questions||[]; }
  catch(e){ document.getElementById('loading').textContent='⚠ Could not load questions'; return; }
  if(!QS.length){ document.getElementById('loading').textContent='No prompts yet'; return; }
  show(0);
}

/* THE PARADE: the prompts as columns (tools/parade.js); the centre one is
   the chosen prompt. There is no plan stage for stories, so its pill
   opens the model. */
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const ARROW='<svg class="kp-arrow" width="16" height="16" viewBox="0 0 14 14" fill="none"><path d="M5 3L9 7L5 11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const pts=a=>'<span class="kp-list">'+(a||[]).map(p=>'<span class="kp-item">'+ARROW+'<span>'+p+'</span></span>').join('')+'</span>';
function show(i){
  cur=Math.max(0,Math.min(i,QS.length-1));
  const stage=document.getElementById('stage');
  if(!document.getElementById('parade')) stage.innerHTML='<section id="parade" aria-label="Choose a prompt"></section>';
  Parade.mount(document.getElementById('parade'),{ label:'<b>Stories</b> · Choose a prompt', aria:'Story prompts',
    items:QS.map((q,k)=>({ kicker:String(k+1).padStart(2,'0')+' · Write a story', title:q.title||'Story',
      html:'<span class="pa-lead">'+(q.prompt||'')+'</span>'+(q.opening?'<span class="pa-open"><b>Begin your story with</b>“'+q.opening+'”</span>':'')+
        ((q.points||[]).length?'<span class="pa-sub">Your story should</span>'+pts(q.points):''),
      meta:'<b>140–190</b> words' })),
    action:'See the model', start:cur, onCentre:k=>choose(k), onOpen:k=>{ choose(k); navTo('model'); } });
  choose(cur);
}
function choose(k){ cur=k; try{ sessionStorage.setItem('currentNarrativeQuestion',JSON.stringify(QS[k])); }catch(e){} }

function navTo(dest){
  if(dest==='question')return;
  const map={model:'narrative-cards.html',sample:'narrative-sample.html'};
  if(map[dest])window.location.href=map[dest];
}
window.navTo=navTo;
init();
</script>
<script src="/skills/grammar-rules/intuity-sound.js"></script>
<script src="/data/writing/writing-chrome.js?v=4"></script>
</body>
</html>
