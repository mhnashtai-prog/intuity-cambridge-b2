<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sample Story — INTUITY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500&family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=12">
<link rel="stylesheet" href="/data/writing/writing.css?v=2">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   STORY · SAMPLE — on the Writing sample blueprint

   Four stories, four paragraphs each: Scene, Develop, Tension, Resolution.
   The two things this page always did well stay: the CRAFT NOTE under each
   paragraph (the technique behind it), and the link from each paragraph to
   the practice cards for its stage. Everything else is the shared sample
   design — paper card, capsule switches, one reading column, caramel X-ray.
   ═══════════════════════════════════════════════════════════════════════ */
:root{ --acc:#c94f6d; }
.poster{position:relative}
.flag{position:absolute;top:-2px;left:1.8rem;width:56px;z-index:10;display:flex;flex-direction:column;align-items:center}
.flag-body{width:100%;padding:.5rem 0 .35rem;display:flex;flex-direction:column;align-items:center;gap:.1rem;position:relative;background:var(--acc)}
.flag-num{font-family:var(--f-display);font-size:1.6rem;font-weight:900;color:#fff;line-height:1}
.flag-label{font-family:var(--f-mono);font-size:.42rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.8)}
.flag-body::after{content:'';position:absolute;bottom:-8px;left:0;right:0;height:9px;background:var(--acc);
  clip-path:polygon(0% 0%,8.33% 100%,16.66% 0%,25% 100%,33.33% 0%,41.66% 100%,50% 0%,58.33% 100%,66.66% 0%,75% 100%,83.33% 0%,91.66% 100%,100% 0%)}
.card-toolbar{display:flex;align-items:center;flex-wrap:wrap}
.toolbar-spacer{flex:1}
.xray-row{display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.state-msg{padding:3rem 1rem;text-align:center;color:var(--faint)}
/* the story's own title and task line */
.st-title{font-family:'Anton',Impact,var(--f-display),sans-serif;font-weight:400;font-size:clamp(1.7rem,4.6vw,2.4rem);line-height:1.05;
  letter-spacing:.005em;color:var(--ink);margin:0 0 .3rem}
.st-task{font-size:.9rem;line-height:1.5;color:var(--dim);margin:0 0 1.4rem}
.st-task b{font-family:var(--f-mono);font-size:.58rem;font-weight:400;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-right:.35rem}
/* key expressions: caramel when X-ray is on, plain otherwise */
.key-x{transition:color .2s}
.xray-on .key-x{color:var(--accent-ink,#9A5A2C);font-weight:600}
/* the craft note: shown with Craft notes on */
.note{display:none;margin:.7rem 0 0;padding:.55rem 0 .1rem .8rem;border-left:2px solid var(--accent,#DD8E58);font-size:.88rem;line-height:1.55;color:var(--sentence)}
.crafting .note{display:block}
.note .tag{display:block;font-family:var(--f-mono);font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink,#9A5A2C);margin-bottom:.15rem}
.note a{display:inline-block;margin-top:.4rem;font-family:var(--f-mono);font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--accent-ink,#9A5A2C);text-decoration:none}
.note a:hover{text-decoration:underline}
.story-row{display:flex;justify-content:center;gap:.2rem;flex-wrap:wrap;padding:.4rem 1rem .2rem}
.story-row button{position:relative;font-family:var(--f-mono);font-size:.64rem;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);
  background:none;border:none;padding:.6rem .6rem;cursor:pointer;white-space:nowrap}
.story-row button.active{color:var(--ink)}
.story-row button.active::after{content:'';position:absolute;left:.6rem;right:.6rem;bottom:.35rem;height:1.5px;background:var(--accent,#DD8E58)}
</style>
<link rel="stylesheet" href="/data/writing/sample.css?v=1">
</head>
<body data-writing="story" data-stage="sample">
<div class="shell">
  <nav class="story-row" id="storySeg" role="tablist" aria-label="Story"></nav>
  <div class="stage">
    <div class="poster" id="posterCard">
      <div class="flag"><div class="flag-body"><span class="flag-num">S</span><span class="flag-label">Story</span></div></div>

      <div class="card-toolbar">
        <div class="toolbar-spacer"></div>
        <div class="view-toggle">
          <button class="vt-btn active" id="vtFull" onclick="setViewMode(true)">Full</button>
          <button class="vt-btn" id="vtParas" onclick="setViewMode(false)">Paragraphs</button>
        </div>
      </div>

      <div class="xray-row">
        <span><button class="tool on" type="button" id="xrayBtn" onclick="toggleXray()" aria-pressed="true">X-ray</button>
        <button class="tool" type="button" id="craftBtn" onclick="toggleCraft()" aria-pressed="false">Craft notes</button></span>
        <div class="legend" id="legend"></div>
      </div>

      <div class="card-scroll" id="infographic"><div class="state-msg">Loading…</div></div>

      <div class="para-nav hidden" id="paraNav">
        <button class="para-arrow" id="btnPrev" onclick="goPrev()" disabled aria-label="Previous paragraph">←</button>
        <div class="para-nav-label" id="paraLabel">1 / 4</div>
        <button class="para-arrow" id="btnNext" onclick="goNext()" aria-label="Next paragraph">→</button>
      </div>
    </div>
  </div>

  <div class="foot">
    <div class="nav-pill">
      <button class="nb"    onclick="navTo('question')">Question</button>
      <button class="nb"    onclick="navTo('model')">Model</button>
      <button class="nb on" onclick="navTo('sample')">Sample</button>
    </div>
  </div>
</div>

<script>
const DATA_PATH='data/narrative-samples.json';
let SAMPLES=[], cur=0, xrayOn=true, craftOn=false, fullTextMode=true, currentPara=0;
const esc=t=>String(t==null?'':t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* ══ THE CHAIN — the story chosen on the Question page opens here ══ */
function savedQuestion(){ try{ return JSON.parse(sessionStorage.getItem('currentNarrativeQuestion')||'null'); }catch(e){ return null; } }
function indexForQuestion(q){
  if(!q) return 0;
  const want=String(q.id||'').replace(/^q_/,'');
  let i=SAMPLES.findIndex(s=>String(s.id||'').replace(/^s_/,'')===want);
  if(i<0 && q.title) i=SAMPLES.findIndex(s=>s.title===q.title);
  return i<0?0:i;
}
function pick(i){
  cur=i; currentPara=0; renderStories(); render();
  /* choosing a story here is choosing a task — keep Question and Model in step */
  const s=SAMPLES[cur]; if(!s) return;
  try{ const q=savedQuestion()||{}; q.id='q_'+String(s.id||'').replace(/^s_/,''); q.title=s.title||q.title; q.opening=s.question||q.opening;
       sessionStorage.setItem('currentNarrativeQuestion',JSON.stringify(q)); }catch(e){}
}
window.pick=pick;

/* ══ the four stages, read from each craft note's leading tag ══ */
const STAGE={SCENE:'scene',DEVELOP:'develop',TENSION:'tension',RESOLUTION:'resolution'};
function stageOf(note){ const m=String(note||'').match(/^([A-Z]+)/); return (m&&STAGE[m[1]])||null; }
function stageName(p,i){ const st=stageOf(p.note); return st? st.charAt(0).toUpperCase()+st.slice(1) : 'Paragraph '+(i+1); }
function keys(t){ return esc(t).replace(/«([^»]+)»/g,'<span class="key-x">$1</span>'); }
function noteHTML(p){
  if(!p.note) return '';
  const m=String(p.note).match(/^([A-Z][A-Z →'\-]*(?:\([^)]*\))?[^a-z:]*[:—])\s*(.*)$/s);
  const tag=m?m[1].replace(/[:—]\s*$/,''):'', body=m?m[2]:p.note, st=stageOf(p.note);
  return `<div class="note">${tag?`<span class="tag">${esc(tag)}</span>`:''}${esc(body)}`+
    (st?`<br><a href="narrative-cards.html?stage=${st}">Build one like this ›</a>`:'')+`</div>`;
}

/* ══ switches ══ */

function renderStories(){
  const seg=document.getElementById('storySeg');
  seg.innerHTML=SAMPLES.map((s,i)=>`<button type="button" role="tab" aria-selected="${i===cur}" class="${i===cur?'active':''}" onclick="pick(${i})">${esc(s.title||('Story '+(i+1)))}</button>`).join('');
}
function setViewMode(full){
  fullTextMode=full;
  document.getElementById('vtFull').classList.toggle('active',full);
  document.getElementById('vtParas').classList.toggle('active',!full);
  document.getElementById('paraNav').classList.toggle('hidden',full);
  render();
}
function toggleXray(){ xrayOn=!xrayOn; const b=document.getElementById('xrayBtn'); b.classList.toggle('on',xrayOn); b.setAttribute('aria-pressed',String(xrayOn)); render(); }
function toggleCraft(){ craftOn=!craftOn; const b=document.getElementById('craftBtn'); b.classList.toggle('on',craftOn); b.setAttribute('aria-pressed',String(craftOn)); render(); }
window.setViewMode=setViewMode; window.toggleXray=toggleXray; window.toggleCraft=toggleCraft;

/* ══ RENDER — the blueprint: one reading column; Paragraphs is the card ══ */
function render(){
  const box=document.getElementById('infographic'), s=SAMPLES[cur];
  if(!s){ box.innerHTML='<div class="state-msg">No sample story yet.</div>'; return; }
  const P=s.paragraphs||[], cls=(xrayOn?'xray-on ':'')+(craftOn?'crafting':'');
  if(fullTextMode){
    box.innerHTML=`<div class="measure ${cls}"><h2 class="st-title">${esc(s.title||'')}</h2>`+
      `<p class="st-task"><b>In response to</b>${esc(s.question||'—')}</p>`+
      P.map((p,i)=>`<section class="fpara"><div class="fp-kick">${esc(stageName(p,i))}</div><div class="para-text">${keys(p.text||'')}</div>${noteHTML(p)}</section>`).join('')+`</div>`;
  }else{
    if(currentPara>=P.length) currentPara=0;
    const p=P[currentPara]||{text:''};
    box.innerHTML=`<div class="measure ${cls}"><article class="pcard"><div class="poster-kick"><i></i><span>${esc(s.title||'')} · Paragraph ${currentPara+1} of ${P.length}</span></div>`+
      `<h3 class="poster-head">${esc(stageName(p,currentPara))}</h3><div class="pc-rule"></div><div class="para-text">${keys(p.text||'')}</div>${noteHTML(p)}</article></div>`;
  }
  updateNav();
}
function updateNav(){
  const n=(SAMPLES[cur]&&SAMPLES[cur].paragraphs||[]).length;
  document.getElementById('btnPrev').disabled=currentPara===0;
  document.getElementById('btnNext').disabled=currentPara>=n-1;
  document.getElementById('paraLabel').textContent=(currentPara+1)+' / '+n;
}
function goPrev(){ if(currentPara>0){ currentPara--; render(); } }
function goNext(){ const n=(SAMPLES[cur].paragraphs||[]).length; if(currentPara<n-1){ currentPara++; render(); } }
window.goPrev=goPrev; window.goNext=goNext;
document.addEventListener('keydown',e=>{ if(fullTextMode) return;
  if(e.key==='ArrowRight'){ e.preventDefault(); goNext(); } if(e.key==='ArrowLeft'){ e.preventDefault(); goPrev(); } });

function navTo(dest){
  if(dest==='sample') return;
  const map={question:'narrative-question.html',model:'narrative-cards.html'};
  if(map[dest]) window.location.href=map[dest];
}
window.navTo=navTo;

async function init(){
  try{ SAMPLES=(await (await fetch(DATA_PATH)).json()).samples||[]; }
  catch(e){ document.getElementById('infographic').innerHTML='<div class="state-msg">Could not load the sample stories. Reload to try again.</div>'; return; }
  if(!SAMPLES.length){ document.getElementById('infographic').innerHTML='<div class="state-msg">No sample stories yet.</div>'; return; }
  cur=indexForQuestion(savedQuestion());
  renderStories(); render();
}
init();
</script>
<script src="/skills/grammar-rules/intuity-sound.js"></script>
<script src="/data/writing/writing-chrome.js?v=2"></script>
</body>
</html>
