<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>INTUITY — Phrase parade (prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..900&family=Geist+Mono:wght@400..600&family=Space+Grotesk:wght@700&family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=20261105">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   PHRASE PARADE · PROTOTYPE (22 Nov 2026, the owner + Claude). Not linked.
   The owner's handbook (B2 2025) as it moves, with no sound:
   · Hooks: page 2's "Background information" list, in three runs
     (a trend, a fact, a view). Each hook lands on its own exam topic and
     joins the list it came from.
   · Arguments: page 3's three columns as three reels: blue (listing),
     green (opinion / generalisation), pink (the point, by essay type).
     They spin and lock one by one into a sentence, the pupil's own words
     land, then the grey column develops it (a reason, an example, a result).
   Every spin is written in advance, so every sentence is one a pupil may
   copy. If it works, it becomes the ladder's Watch (View · Watch · Practise).
   ═══════════════════════════════════════════════════════════════════════ */
:root{--paper:#F3F1EC;--card:#FAF8F5;--ink:#14110E;--dim:#6B655C;--faint:#8C867E;--line:rgba(20,17,14,.12);
  --blue:#5F79A6;--blue-t:#E3E9F3;--green:#6E9257;--green-t:#E5EEDC;--pink:#B8735A;--pink-t:#F6E3DA;--grey-t:#ECE9E4;--sage:#8AA79C}
html,body{background:var(--paper)}
body{margin:0;font-family:'Geist',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.wrap{max-width:460px;margin:0 auto;padding:6px 18px 28px}
.proto{font:500 10px/1 'Geist Mono',monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);text-align:center;margin:4px 0 10px}
/* the stage */
.stage{position:relative;height:min(640px,calc(100svh - var(--hh,110px) - 46px));min-height:520px;user-select:none;-webkit-user-select:none;cursor:pointer}
.bars{display:flex;gap:4px;margin-bottom:12px}.bars i{flex:1;height:3px;border-radius:2px;background:rgba(20,17,14,.12);overflow:hidden}.bars b{display:block;height:100%;width:0;background:var(--ink)}
.k{font:600 10px/1.3 'Geist Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
.layer{position:absolute;left:0;right:0;top:22px;bottom:0}
/* reels */
.reel{position:relative;height:74px;border-radius:6px;overflow:hidden;margin-bottom:8px;border:1px solid var(--line)}
.reel small{position:absolute;left:0;right:0;top:0;padding:8px 12px 5px;z-index:2;font:600 9px/1 'Geist Mono',monospace;letter-spacing:.18em;text-transform:uppercase}
.reel .strip{position:absolute;left:0;right:0;top:0;will-change:transform}
.reel .strip div{height:74px;display:flex;align-items:center;padding:22px 12px 4px;box-sizing:border-box;font:600 19px/1.15 'Geist',sans-serif;letter-spacing:-.01em}
.reel small{background:inherit}
.reel::after{content:'';position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 10px 12px -10px rgba(20,17,14,.18),inset 0 -10px 12px -10px rgba(20,17,14,.18)}
.r1{background:var(--blue-t)}.r1 small,.r1 .strip div{color:var(--blue)}
.r2{background:var(--green-t)}.r2 small,.r2 .strip div{color:var(--green)}
.r3{background:var(--pink-t)}.r3 small,.r3 .strip div{color:var(--pink)}
.r1 .strip div{color:#3F5A86}.r2 .strip div{color:#4C6E37}.r3 .strip div{color:#8E4F38}
.type{float:right;font:600 9px/1 'Geist Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--pink)}
/* the sentence, and the develop line */
.sent{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px 16px 13px;box-shadow:0 22px 36px -26px rgba(20,17,14,.5);font:400 18px/1.5 'Geist',sans-serif;color:#7A746B}
.sent .p1{color:#3F5A86;font-weight:650}.sent .p2{color:#4C6E37;font-weight:650}.sent .p3{color:#8E4F38;font-weight:650}
.dev{margin-top:10px;background:var(--grey-t);border-radius:6px;padding:12px 16px 12px;font:400 17px/1.45 'Geist',sans-serif;color:#7A746B}
.dev small{display:block;font:600 9px/1 'Geist Mono',monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);margin-bottom:7px}
.dev b{color:var(--ink);font-weight:650}
/* hooks: the poster lands, then joins the list */
.run{position:absolute;left:0;right:0;top:120px;text-align:center}
.run .big{font:400 92px/.9 'Anton',sans-serif;text-transform:uppercase;letter-spacing:-.005em}
.run .sub{margin-top:10px;font:400 18px/1.3 'Geist',sans-serif;color:var(--dim)}
.poster{position:absolute;left:0;right:0;top:40px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px 18px 16px;box-shadow:0 30px 50px -30px rgba(20,17,14,.55)}
.poster .ml{display:flex;align-items:center;gap:10px;font:500 10px/1.3 'Geist Mono',monospace;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
.poster .ml::before{content:'';width:22px;height:7px;background:#B0865C}
.poster .q{margin-top:12px;font:italic 400 14px/1.35 'Geist',sans-serif;color:var(--faint)}
.poster p{margin:10px 0 0;font:400 23px/1.4 'Geist',sans-serif;color:#7A746B}
.poster p b{color:var(--ink);font-weight:650}
.list{position:absolute;left:0;right:0;top:300px;display:flex;flex-direction:column;gap:6px}
.list div{font:600 15px/1.25 'Geist',sans-serif;color:var(--ink);padding-left:12px;border-left:3px solid var(--sage)}
.list .k{border:0;padding:0;margin-bottom:2px}
/* hooks as a fan (the owner, 22 Nov 2026: "a context and nothing more", as in How to use's Openings) */
.fan{position:absolute;left:0;right:0;top:40px;height:420px}
.fc{position:absolute;left:7%;right:7%;top:130px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px 18px 20px;
  box-shadow:0 1px 0 rgba(20,17,14,.05),0 26px 44px -28px rgba(20,17,14,.55);transform-origin:50% 140%;opacity:0;will-change:transform}
.fc i{display:block;width:26px;height:8px;background:#B0865C;margin-bottom:12px}
.fc small{display:block;font:500 10px/1 'Geist Mono',monospace;letter-spacing:.22em;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
.fc p{margin:0;font:400 21px/1.42 'Geist',sans-serif;color:#7A746B}
.fc p b{color:var(--ink);font-weight:650}
.fcount{position:absolute;right:0;top:0;font:500 10px/1 'Geist Mono',monospace;letter-spacing:.2em;color:var(--faint)}
.embed #hdr,.embed .proto{display:none}
.embed .wrap{padding-top:58px}
.embed .stage{height:calc(100svh - 86px);min-height:480px}
/* the end */
.end{position:absolute;inset:0;overflow:auto}
.end ol{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:9px}
.end li{font:400 15px/1.4 'Geist',sans-serif;color:#7A746B;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.end li b{color:var(--ink);font-weight:650}
.end .p1{color:#3F5A86;font-weight:650}.end .p2{color:#4C6E37;font-weight:650}.end .p3{color:#8E4F38;font-weight:650}
.row{display:flex;gap:10px;justify-content:center;margin-top:16px}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 20px;border-radius:999px;border:1px solid #C9C1B4;background:var(--card);color:var(--ink);font:600 .95rem/1 'Geist',sans-serif;text-decoration:none;cursor:pointer}
.btn i{font-style:normal;color:#708A81}
.hint{position:absolute;left:0;right:0;bottom:0;text-align:center}
.paused .hint .k{color:var(--ink)}
@media(prefers-reduced-motion:reduce){.reel .strip{transition:none}}
</style>
</head>
<body>
<header class="header" id="hdr">
  <div class="header-top">
    <a class="back-link" href="/skills/writing/phrases-ladder.html?task=essay" target="_top">← Ladder</a>
    <div class="header-title"><div class="app-title">INTUITY</div><div class="app-subtitle">Phrase parade</div></div>
    <span class="header-spacer">Level <b>B2</b></span>
  </div>
  <div class="set-tabs" role="tablist" aria-label="Parade" id="tabs"></div>
</header>
<main class="wrap" id="app">
  <div class="proto">Prototype · watch, no sound · tap to pause</div>
  <div class="stage" id="stage">
    <div class="bars" id="bars"></div>
    <div class="layer" id="layer"></div>
    <div class="hint"><span class="k" id="hint">Tap to pause</span></div>
  </div>
</main>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ease=p=>1-Math.pow(1-p,3), cl=v=>Math.min(1,Math.max(0,v)), back=p=>1+2.2*Math.pow(p-1,3)+1.2*Math.pow(p-1,2);
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ── page 2 · Background information: the hook, in three runs ── */
const HOOKS=[
  ['Trend','Something is changing',[
    ['Do young people spend too much time online?','Nowadays,','more and more teenagers spend their free time online.'],
    ['Is working from home better than working in an office?','Over the past few years, there has been a significant increase in','the number of people working from home.'],
    ['Should schools start later in the morning?','There is a growing recognition that','sleep affects how well students learn.'],
    ['What can people do to protect the environment?','There is growing concern that','plastic is damaging our oceans.']]],
  ['Fact','Something everyone knows',[
    ['Have smartphones made our lives better?','Few people would deny that','smartphones have changed the way we live.'],
    ['Does tourism do more harm than good?','It is a well-established fact that','tourism creates millions of jobs.'],
    ['Should sport be compulsory at school?','It is common knowledge that','regular exercise is good for body and mind.'],
    ['Do teenagers read enough?','Recent studies show that','teenagers read fewer books than their parents did.'],
    ['Should music be taught in every school?','','Music {has always played a significant role in our lives.}']]],
  ['View','What people think',[
    ['Is homework necessary?','It is often argued that','homework does more harm than good.'],
    ['Does money bring happiness?','It is generally assumed that','people who earn more are happier.'],
    ['Is it better to live in a city or in the countryside?','It is widely believed that','city life is more stressful than life in the countryside.'],
    ['Is it important to be rich?','We can all accept the fact that','money cannot buy everything.']]]
];

/* ── page 3 · Conclusion: open the last paragraph, then give the verdict ── */
const CONCL=[
  ['Verdict','{On balance, I believe that} the benefits of phones in class outweigh the drawbacks.'],
  ['Verdict','{All things considered, I firmly believe that} tourism does more good than harm.'],
  ['Despite the challenges','{To sum up, it seems that in spite of the challenges regarding} online learning, {it is clear that} it gives students more freedom.'],
  ['Despite the challenges','{In conclusion, as far as I can judge, despite some of the views expressed, it is clear that} homework still has a place in school.'],
  ['Despite the challenges','{On the whole, even though there are concerns about} screen time, {I am convinced that} phones should not be banned.'],
  ['Verdict','{All in all, it seems to me that} city life has more to offer than it takes away.']
];
const FANS={hooks:['Hooks',HOOKS.flatMap(r=>r[2].map(h=>[r[0],h]))],conclusion:['Conclusion',CONCL.map(([k,t])=>[k,['','',t]])]};
/* ── page 3 · Introducing the arguments: the columns, as reels ── */
const COL={
  1:['Firstly,','To begin with,','First of all,','In the first place,','For one thing,','Secondly,','Apart from that,','Moreover,','Furthermore,','In addition,','On the other hand,','However,'],
  2:['in my view,','it is my sincere belief that','it seems to me that','it is beyond doubt that','from my point of view,','as far as I can judge,','it appears that','as far as I’m concerned,','it is important to acknowledge that','it is often maintained that','it is often argued that','it is commonly known that','it is widely held that','by and large,'],
  3:['the main advantage of','the main argument in favour of','one benefit of','one positive aspect of','the key disadvantage of','the argument against','the obvious drawback of','one effective way to deal with','one approach would be to','by far the best way to tackle','one major factor','one major cause of','it is likely that','in all likelihood,']
};
const TYPE=w=>{ const i=COL[3].indexOf(w); return i<7?'For & against':i<10?'Problems & solutions':i<12?'Cause & effect':'Speculating'; };
/* a spin: [blue, green, pink, the pupil's own words, [develop word, the rest]] */
const ARGS={
  first:['First reason',[
    ['Firstly,','it is often argued that','the main advantage of','smartphones in class is that pupils can check facts in seconds.',['This is because','they carry the internet in their pocket.']],
    ['To begin with,','it seems to me that','one benefit of','online learning is that students can study at their own pace.',['For example,','they can watch a lesson again before a test.']],
    ['In the first place,','it is widely held that','one positive aspect of','tourism is that it creates jobs for local people.',['As a result,','young people do not have to move away to find work.']],
    ['First of all,','it is beyond doubt that','one major cause of','stress among teenagers is the pressure of exams.',['This is largely due to the fact that','results decide which university they go to.']],
    ['For one thing,','in my view,','by far the best way to tackle','pollution is to ban cars from city centres.',['For instance,','streets could become parks and cycle lanes.']],
    ['Firstly,','as far as I can judge,','it is likely that','more people will work from home in the future.',['This is because','companies save money on offices.']]]],
  second:['Second reason',[
    ['Secondly,','it is often maintained that','one benefit of','phones in class is that parents can contact their children easily.',['For example,','they can send a message if a lesson ends late.']],
    ['Moreover,','it seems to me that','one positive aspect of','online courses is that they are often cheaper.',['As a result,','more people can afford to study.']],
    ['Furthermore,','it is commonly known that','one major factor','in poor sleep is the light from screens at night.',['This is because','it tells the brain that it is still daytime.']],
    ['Apart from that,','in my view,','one approach would be to','give pupils less homework at weekends.',['Given that','teenagers need rest, they would return to school refreshed.']],
    ['Moreover,','by and large,','the main argument in favour of','school uniforms is that they save families money.',['For instance,','parents do not have to buy fashionable clothes.']],
    ['Secondly,','it is my sincere belief that','by far the best way to tackle','bullying is to talk about it openly.',['In particular,','younger pupils need to know who they can turn to.']]]],
  other:['The other side',[
    ['On the other hand,','it is important to acknowledge that','the obvious drawback of','phones in class is that they distract pupils.',['For example,','a single message can break their concentration.']],
    ['However,','it is often argued that','the key disadvantage of','online learning is that students can feel lonely.',['This is because','they rarely meet their classmates.']],
    ['On the other hand,','it is widely held that','the argument against','tourism is that popular cities become overcrowded.',['As a result,','rents rise and local people have to move.']],
    ['However,','as far as I’m concerned,','the obvious drawback of','working from home is that people feel isolated.',['Consequently,','some workers become less motivated.']],
    ['On the other hand,','it is beyond doubt that','the key disadvantage of','school uniforms is that they can be expensive.',['In particular,','blazers cost far more than ordinary jackets.']],
    ['However,','it appears that','the argument against','banning cars is that shops in the centre may lose customers.',['This is largely due to the fact that','many people do their shopping by car.']]]]
};
const TABS=[['hooks','Hooks'],['first','First reason'],['second','Second reason'],['other','The other side'],['conclusion','Conclusion']];

/* ── the clock: one t, paused by a tap; every frame is drawn from t ── */
const QS=new URLSearchParams(location.search), EMBED=QS.has('embed');
/* EMBED: inside the ladder's Watch (View · Watch · Practise): no header, no tabs, just the parade */
if(EMBED) document.documentElement.classList.add('embed');
let TAB=QS.get('p')||'hooks', T=0, last=0, paused=false, PLAN=null, built='';
const SPIN=10.5, HOOK=5.0;   /* the owner, 22 Nov 2026: five seconds a card */
function plan(){
  if(FANS[TAB]){ const ev=[]; let t=0.3; FANS[TAB][1].forEach(()=>{ ev.push({k:'hook',n:ev.length,a:t,b:t+HOOK}); t+=HOOK; }); return {ev,end:t+0.6}; }
  const L=ARGS[TAB][1]; return {ev:L.map((s,i)=>({k:'spin',i,a:i*SPIN,b:(i+1)*SPIN})),end:L.length*SPIN};
}
function tabs(){
  $('tabs').innerHTML=TABS.map(([k,n])=>`<button type="button" class="vtab${k===TAB?' active':''}" role="tab" aria-selected="${k===TAB}" data-p="${k}">${n}</button>`).join('');
  $('tabs').querySelectorAll('[data-p]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); TAB=b.dataset.p; start(); });
}
function start(){ tabs(); PLAN=plan(); T=0; built=''; paused=false; $('stage').classList.remove('paused'); $('hint').textContent='Tap to pause';
  const n=FANS[TAB]?FANS[TAB][1].length:ARGS[TAB][1].length;
  $('bars').innerHTML=Array.from({length:n},()=>'<i><b></b></i>').join(''); }

const P=(n,s)=>'<span class="p'+n+'">'+esc(s)+'</span>';
const hookHTML=h=>h[1]?'<b>'+esc(h[1])+'</b> '+esc(h[2]):esc(h[2]).replace(/\{([^}]*)\}/g,'<b>$1</b>');
const hookExpr=h=>h[1]||'… '+h[2].match(/\{([^}]*)\}/)[1];
const spinHTML=s=>P(1,s[0])+' '+P(2,s[1])+' '+P(3,s[2])+' '+esc(s[3]);

/* a reel: the column, three times over, so it can spin and wrap */
const H=74;
function reelHTML(n,label){ const c=COL[n]; return `<div class="reel r${n}"><small>${label}</small><div class="strip" data-n="${n}">${c.concat(c,c).map(w=>'<div>'+esc(w)+'</div>').join('')}</div></div>`; }
function pos(n,from,to,p){ const L=COL[n].length; let a=COL[n].indexOf(from), b=COL[n].indexOf(to); if(b<=a) b+=L; b+=L;   /* at least one full turn */
  const x=a+(b-a)*ease(p); return ((x%L)+L)%L+L; }

function draw(){
  const ev=PLAN.ev, t=T; let e=ev.find(x=>t>=x.a&&t<x.b)||(t<ev[0].a?ev[0]:(t<PLAN.end-0.6+0.6&&t<ev[ev.length-1].b+0.6?ev[ev.length-1]:null));
  const bs=[...$('bars').children]; let bi=0;
  ev.forEach(x=>{ if(x.k==='run') return; const b=bs[bi++]; if(b) b.firstChild.style.width=(cl((t-x.a)/(x.b-x.a))*100)+'%'; });
  if(!e){ if(built!=='end'){ built='end'; endScreen(); } return; }
  const u=t-e.a, L=$('layer');
  if(e.k==='hook'){
    const all=FANS[TAB][1];
    if(built!=='fan'+TAB){ built='fan'+TAB;
      L.innerHTML='<div class="fan">'+all.map(([kind,h],j)=>'<div class="fc"><i></i><small>'+kind+'</small><p>'+hookHTML(h)+'</p></div>').join('')+'</div><div class="fcount" id="fcount"></div>'; }
    const cards=[...L.querySelectorAll('.fc')], at=PLAN.ev.filter(x=>x.k==='hook').map(x=>x.a);
    cards.forEach((c,j)=>{
      const p=RM?1:cl((t-at[j])/0.6); if(t<at[j]-0.05){ c.style.opacity=0; return; }
      /* how far this card has been pushed back by the ones dealt after it */
      let d=0; for(let k=j+1;k<at.length;k++) d+=ease(cl((t-at[k])/0.5));
      const side=j%2?1:-1, dd=Math.min(d,4);
      c.style.zIndex=j+1;
      c.style.opacity=(cl(p*3)*(d>3.2?Math.max(0,4.2-d):1)).toFixed(2);
      c.style.transform='translate('+(side*dd*10).toFixed(1)+'px,'+((-110*(1-back(p)))-dd*4).toFixed(1)+'px) rotate('+(side*dd*3.4).toFixed(2)+'deg) scale('+(1-dd*0.03).toFixed(3)+')';
      /* a card behind shows its top edge and label, not its words */
      c.querySelector('p').style.opacity=(1-cl(d)).toFixed(2);
    });
    $('fcount').textContent=(e.n+1)+' / '+all.length;
    return; }
  /* a spin */
  const S=ARGS[TAB][1], s=S[e.i], pr=S[(e.i+S.length-1)%S.length], id='s'+TAB+e.i;
  if(built!==id){ built=id;
    L.innerHTML=`<div class="k">${esc(ARGS[TAB][0])} <span class="type">${esc(TYPE(s[2]))}</span></div><div style="height:10px"></div>`+
      reelHTML(1,'1 · Listing')+reelHTML(2,'2 · Opinion / generalisation')+reelHTML(3,'3 · Your point')+
      `<div class="sent">${spinHTML(s)}</div><div class="dev"><small>Develop it</small><b>${esc(s[4][0])}</b> ${esc(s[4][1])}</div>`; }
  const LOCK=[1.0,1.5,2.0];
  [1,2,3].forEach((n,k)=>{ const st=L.querySelector('.strip[data-n="'+n+'"]'), p=RM?1:cl(u/LOCK[k]);
    const x=pos(n,pr[k],s[k],p); st.style.transform='translateY('+(-(x*H)).toFixed(1)+'px)';
    st.parentNode.style.boxShadow=p>=1?'0 0 0 2px rgba(20,17,14,'+(0.18*(1-cl((u-LOCK[k])/0.6))).toFixed(2)+')':''; });
  const sp=ease(cl((u-2.5)/0.5)), sent=L.querySelector('.sent'); sent.style.opacity=sp; sent.style.transform='translateY('+((1-sp)*10)+'px)';
  const dp=ease(cl((u-4.4)/0.5)), dev=L.querySelector('.dev'); dev.style.opacity=dp; dev.style.transform='translateY('+((1-dp)*10)+'px)';
  const out=cl((e.b-t)/0.35); sent.style.opacity=Math.min(sp,out); dev.style.opacity=Math.min(dp,out);
}
function endScreen(){
  const L=$('layer'), hooks=!!FANS[TAB];
  const items=hooks?FANS[TAB][1].map(([k,h])=>'<li><span class="k">'+esc(k)+'</span><br>'+hookHTML(h)+'</li>'):ARGS[TAB][1].map(s=>'<li>'+spinHTML(s)+' <b>'+esc(s[4][0])+'</b> '+esc(s[4][1])+'</li>');
  L.innerHTML=`<div class="end"><div class="k">${hooks?FANS[TAB][0]+' · all '+items.length:esc(ARGS[TAB][0])+' · six sentences, one pattern'}</div><ol>${items.join('')}</ol>
    <div class="row"><button type="button" class="btn" id="again">↻ Again</button><a class="btn" id="prac" href="/skills/writing/phrases-ladder.html?task=essay">Practise <i>›</i></a></div></div>`;
  $('again').onclick=e=>{ e.stopPropagation(); start(); };
  if(EMBED) $('prac').onclick=e=>{ e.preventDefault(); e.stopPropagation(); parent.postMessage({parade:'practise',p:TAB},location.origin); };
  $('hint').textContent='';
}
function loop(ts){ const dt=last?Math.min(0.1,(ts-last)/1000):0; last=ts; if(!paused&&PLAN&&T<PLAN.end+0.01) T+=dt; if(PLAN) draw(); requestAnimationFrame(loop); }
$('stage').onclick=e=>{ if(e.target.closest('a,button')||built==='end') return; paused=!paused; $('stage').classList.toggle('paused',paused); $('hint').textContent=paused?'Paused · tap to go on':'Tap to pause'; };
/* swipe: next / previous card */
let sx=0; $('stage').addEventListener('touchstart',e=>{ sx=e.touches[0].clientX; },{passive:true});
$('stage').addEventListener('touchend',e=>{ const dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)<60||!PLAN) return;
  const st=PLAN.ev.filter(x=>x.k!=='run').map(x=>x.a); const cur=st.filter(a=>a<=T+0.01).length-1;
  const j=dx<0?Math.min(st.length,cur+1):Math.max(0,cur-1); T=j>=st.length?PLAN.end:st[j]; built=''; },{passive:true});
window.PARADE={seek:t=>{ T=t; built=''; draw(); }, tab:k=>{ TAB=k; start(); }, plan:()=>PLAN};
function size(){ const h=$('hdr'), H=!EMBED&&getComputedStyle(h).position==='fixed'?h.offsetHeight:0;
  $('app').style.marginTop=H+'px'; document.documentElement.style.setProperty('--hh',H+'px'); }
addEventListener('resize',size); try{ new ResizeObserver(size).observe($('hdr')); }catch(e){}
size(); start(); requestAnimationFrame(loop);
})();
</script>
