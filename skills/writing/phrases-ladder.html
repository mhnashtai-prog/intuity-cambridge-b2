<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Phrase Ladder · INTUITY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..900&family=Geist+Mono:wght@400..600&family=Space+Grotesk:wght@700&family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=20261105">
<link rel="stylesheet" href="/tools/five-card.css?v=7">
<script src="/tools/intuity-overflow.js?v=3"></script>
<style>
/* ════════════════════════════════════════════════════════════════════════
   PHRASE LADDER  (on the Writing menu as Phrases, 21 Nov 2026).
   The owner: "how are we helping kids to recall phrases and aid retention?"
   Pupils have already MET the phrases in Learn it, so practice starts with
   retrieval. Each phrase climbs five steps:
     1 Choose it   2 Type the key word   3 Rebuild from first letters
     4 Write it from the job alone   5 Use it about a topic
   Step 2 comes back the same day; then 1, 3, 7 days. A miss keeps its step and
   comes back tomorrow (25 Nov 2026, criticism-free: nothing is ever taken away).
   Each step shows the phrase in a different sentence (three topics), so the
   phrase, not one sentence, is learnt. View: one card per phrase plus its
   slip; the other ways fold away on the card.
   ?free=1 lifts the wait, for trying it out.
   Data: data/writing/phrases-by-job.json (each job's lead phrase).
   ════════════════════════════════════════════════════════════════════════ */
:root{--ink:#14110E;--car:#C2956E;--car2:#9A6A3C;--sage:#708A81;--sage2:#8AA79C;--dim:#5C5852;--faint:#8A8378;--ground:#F3F1ED;--line:rgba(20,17,14,.12)}
html,body{background:var(--ground)}
.wrap{max-width:560px;margin:0 auto;padding:clamp(16px,3.5vh,30px) 22px calc(env(safe-area-inset-bottom,0px) + 28px);color:var(--ink)}
.kick{display:flex;align-items:center;gap:10px;font:600 .6875rem/1 'Geist Mono',ui-monospace,monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.kick i{width:26px;height:9px;background:var(--car);flex:none}
.kick .sp{flex:1}
.kick b{color:var(--ink);font-weight:600}
h1.t{margin:.8rem 0 .2rem;font:800 clamp(2.1rem,10vw,3rem)/1 'Geist',sans-serif;letter-spacing:-.03em}
.lede{margin:.6rem 0 1.2rem;font:400 1.02rem/1.5 'Geist',sans-serif;color:var(--dim)}
/* the ladder: one row per phrase, six steps */
.lad{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.lad li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.lad .nm{flex:1;min-width:0}
.lad .nm b{display:block;font:700 .95rem/1.25 'Geist',sans-serif}
.lad .nm span{display:block;font:400 .9rem/1.35 'Geist',sans-serif;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps{display:flex;gap:3px;flex:none}
.steps i{width:7px;height:16px;border-radius:2px;background:#E2DCD2}
.steps i.on{background:var(--sage)}
.steps.own i{background:var(--car)}
.legend{margin:.9rem 0 0;font:400 .85rem/1.5 'Geist',sans-serif;color:var(--faint)}
.go{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 30px;border:none;border-radius:999px;background:var(--ink);color:#fff;font:700 1rem/1 'Geist',sans-serif;cursor:pointer;text-decoration:none}
.go:active{transform:scale(.97)}
.go[disabled]{opacity:.35}
.ghost{border:none;background:none;font:600 .9rem/1 'Geist',sans-serif;color:var(--car2);padding:12px;cursor:pointer}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:1.4rem}
/* a question */
.meter{display:flex;justify-content:space-between;align-items:baseline;margin:.2rem 0 0;padding:10px 0;border-bottom:1px solid var(--line);
  font:600 .625rem/1 'Geist Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.meter b{font:400 1.35rem/1 'Anton',Impact,sans-serif;color:var(--ink);letter-spacing:0;margin-left:6px}
.rung{display:inline-flex;align-items:center;gap:8px;margin:1.3rem 0 0;font:700 .6875rem/1 'Geist Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--sage)}
.rung .steps i{height:10px;width:6px}
.job{margin:.55rem 0 0;font:800 clamp(1.25rem,5.6vw,1.6rem)/1.15 'Geist',sans-serif;letter-spacing:-.015em;color:var(--sage)}
.ask{margin:.35rem 0 0;font:400 .98rem/1.45 'Geist',sans-serif;color:var(--dim)}
.big{margin:1.1rem 0 0;font:800 clamp(1.75rem,8vw,2.6rem)/1.12 'Geist',sans-serif;letter-spacing:-.025em}
.big .el{color:#B4ADA2}
.big .k{position:relative;z-index:0}
.big .k::after{content:"";position:absolute;z-index:-1;left:-.05em;right:-.05em;bottom:.06em;height:.3em;background:var(--car);opacity:.55}
.big .gapw{display:inline-block;min-width:3.6em;border-bottom:4px solid var(--ink);color:transparent;line-height:1}
.big .gapw.ok{color:#2F4D42;border-color:var(--sage)}
.big .gapw.no{color:var(--car2);border-color:var(--car)}
.big .w{display:inline-block;opacity:0;transform:translateY(.35em);animation:land .45s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes land{to{opacity:1;transform:none}}
.hintl{margin:1.1rem 0 0;font:600 clamp(1.25rem,6vw,1.7rem)/1.3 'Geist Mono',ui-monospace,monospace;letter-spacing:.04em;color:var(--ink);word-spacing:.15em}
.gram{margin:.8rem 0 0;font:600 .9rem/1.3 'Geist Mono',monospace;color:var(--dim)}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:1.3rem}
.opts button{min-height:54px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font:600 1.1rem/1 'Geist',sans-serif;color:var(--ink);cursor:pointer}
.opts button.ok{border-color:var(--sage);background:#EAF1EE;color:#2F4D42}
.opts button.no{border-color:var(--car);background:#FBF1E8;color:var(--car2)}
.field{display:flex;flex-direction:column;gap:10px;margin-top:1.3rem}
.field textarea,.field input{font:500 1.1rem/1.4 'Geist',sans-serif;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);resize:none;width:100%;box-sizing:border-box}
.field textarea:focus,.field input:focus{outline:none;border-color:var(--ink)}
.fb{margin:1rem 0 0;font:400 1rem/1.5 'Geist',sans-serif;color:var(--dim)}
.fb .yes{color:#2F4D42} .fb .no{color:var(--car2)}
.fb .ans{display:block;margin-top:.4rem;font-weight:700;color:var(--ink)}
.fb .ans mark{background:none;box-shadow:inset 0 -3px 0 var(--car);color:inherit}
/* the end */
.score{display:block;margin:.6rem 0 0;font:400 5rem/1 'Anton',Impact,sans-serif}
.cap{font:400 1rem/1.5 'Geist',sans-serif;color:var(--dim);margin:.3rem 0 1.2rem}
.test{display:inline-block;margin-left:auto;padding:4px 8px;border-radius:999px;background:#EDE3D6;color:var(--car2);font:700 .6rem/1 'Geist Mono',monospace;letter-spacing:.12em}

/* the ladder home (the owner, 21 Nov): The Question's track, straightened into a vertical ladder.
   Same parts as the board game: a raised cream bezel, a sage rim, a black core, sage hairlines between
   tiles, an Anton number and a mono name. About 2.5 cm wide on a phone. What a rung holds is beside it. */
.meter span+span{text-align:center}.meter span:last-child{text-align:right}
.ladder{--lw:255px;--bz:8px;--sg:9px;position:relative;display:grid;grid-template-columns:var(--lw);justify-content:center;margin:1.6rem auto 0;max-width:100%}
.ladder::before{content:"";position:absolute;left:50%;transform:translateX(-50%);top:36px;bottom:40px;width:var(--lw);max-width:100%;border-radius:6px;background:linear-gradient(165deg,#FFFFFF,#E4DDD1);
  box-shadow:-6px -6px 9px rgba(255,255,255,.9),8px 8px 12px rgba(43,33,41,.16)}
.ladder .cap,.rg .cell{position:relative;grid-column:1;margin:0 var(--bz)!important;background:#201E1C;border-left:var(--sg) solid #8AA79C;border-right:var(--sg) solid #8AA79C;box-sizing:border-box}
.ladder .cap{display:block;height:26px}
.ladder .cap.top{margin-top:var(--bz)!important}
.ladder .cap.bot{margin-bottom:var(--bz)!important;border-top:1.8px solid #8AA79C;height:30px}
.rg{display:contents;cursor:pointer}
.rg .cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:104px;border-top:1.8px solid #8AA79C;cursor:pointer;transition:background .2s}
.rg:active .cell{background:#2C2926}
.rg .no{font:400 2.6rem/1 'Anton',Impact,sans-serif;color:#E5D1B8;letter-spacing:.02em;transition:opacity .3s}
.rg .fm{font:600 .82rem/1.15 'Geist Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:rgba(229,209,184,.85);text-align:center;padding:0 4px}
.rg .tk{position:absolute;right:10px;top:10px;width:22px;height:22px}
.rg .nw{position:absolute;right:10px;top:10px;font:700 .56rem/1 'Geist Mono',monospace;letter-spacing:.14em;text-transform:uppercase;font-style:normal;color:#201E1C;background:#C2956E;padding:4px 7px;border-radius:999px}
.rg .cell .pr{display:flex;flex-direction:row;gap:10px;margin-top:4px}
.rg .cell .steps i{background:rgba(229,209,184,.18)}
.rg .cell .steps i.on{background:#8AA79C}
.rg .cell .steps.own i{background:#C2956E}
.rg .tk svg{width:100%;height:100%}
.rg .lb{grid-column:2;align-self:center;display:block;min-width:0;cursor:pointer;text-align:left}
.rg .lb em{display:inline-block;margin-bottom:6px;font:700 .56rem/1 'Geist Mono',monospace;letter-spacing:.14em;font-style:normal;color:#201E1C;background:#C2956E;padding:3px 7px;border-radius:999px}
.rg .lb small{display:block;font:400 .9rem/1.35 'Geist',sans-serif;color:var(--dim)}
.rg .pr{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.rg .steps i{width:9px;height:11px;border-radius:2px}
.rg.done .no{opacity:.4}
.rg.done .cell{cursor:pointer}
.rg.mine .no{color:#C2956E}
.rg.nope .cell{animation:nope .35s}
@keyframes nope{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (max-width:360px){.ladder{--lw:240px}}
/* the legs: only the rails run on past the first and last hairline, no black between (21 Nov) */
.ladder .cap{background:none!important;margin-top:0!important;margin-bottom:0!important}
.ladder .cap.bot{border-top:none!important}
.ladder .rg:nth-last-child(2) .cell{border-bottom:1.8px solid #8AA79C}

.how{margin:1rem .2rem 0;font:400 .9rem/1.5 'Geist',sans-serif;color:var(--dim);text-align:center}
.how b{color:var(--ink);font-weight:600}

/* the three things a pupil needs: why, how to learn, how to use the tools */
.why{margin:.4rem 0 0;font:800 clamp(1.7rem,7.6vw,2.3rem)/1.05 'Geist',sans-serif;letter-spacing:-.03em;color:var(--ink)}
.why2{margin:.45rem 0 0;font:400 1rem/1.45 'Geist',sans-serif;color:var(--dim)}
.six{display:grid;grid-template-columns:repeat(5,1fr);list-style:none;margin:1.1rem 0 0;padding:3px;border-radius:12px;background:#E3DED6}
/* 21 Nov 2026 (the owner): the six steps in the iOS segmented style, like the View | Practise switch */
.six li{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;font:600 .75rem/1 'Geist',sans-serif;letter-spacing:.02em;text-transform:none;color:var(--faint)}
.six li+li::before{content:"";position:absolute;left:0;top:25%;bottom:25%;width:1px;background:rgba(20,17,14,.12)}
.six b{font:700 .95rem/1 'Geist',sans-serif;color:var(--ink)}
.six-cap{margin:.6rem 0 0;font:400 .88rem/1.4 'Geist',sans-serif;color:var(--faint);text-align:center}
.six-cap b{color:var(--ink);font-weight:600}
.pick{margin:1.2rem 0 0;text-align:center;font:600 .6875rem/1 'Geist Mono',monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--sage)}
.ladder{margin-top:.5rem!important}
.rg .cell{min-height:92px!important}
.look{display:block;margin:1rem auto 0;text-align:center;font:600 .9rem/1 'Geist',sans-serif;color:var(--car2);text-decoration:none;padding:10px}

/* the iOS switch: View | Practise */
.mode{position:relative;display:grid;grid-template-columns:1fr 1fr;max-width:300px;margin:1.1rem auto 0;padding:3px;border-radius:999px;background:rgba(20,17,14,.07)}   /* 27 Nov 2026: toggles black on light grey */
.mode .thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:999px;background:#14110E;box-shadow:none;transition:transform .28s cubic-bezier(.3,.7,.2,1)}
.mode .thumb.r{transform:translateX(100%)}
.mode.m3{grid-template-columns:1fr 1fr 1fr;max-width:330px}
.mode.m3 .thumb{width:calc(33.333% - 2px)}
.mode button svg{width:.62rem;height:.62rem;margin-right:.38rem;vertical-align:-.04rem}
.parade{position:fixed;inset:0;z-index:80;background:var(--paper,#F3F1EC)}
.parade iframe{display:block;width:100%;height:100%;border:0}
.parade .px{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;z-index:2}
.mode button{position:relative;z-index:1;min-height:38px;border:none;background:none;font:700 .8rem/1 'Geist',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);cursor:pointer}
.mode button[aria-selected="true"]{color:#F6F3EE}
.mode button:not([aria-selected="true"]){color:#4A4541}   /* one tone (26 Nov 2026) */
/* view slides */
.vs{margin-top:1rem;touch-action:pan-y}
.vk{display:flex;align-items:baseline;gap:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.vk span{font:400 1.6rem/1 'Anton',Impact,sans-serif;color:var(--car2)}
.vk b{font:600 .75rem/1 'Geist Mono',monospace;letter-spacing:.16em;text-transform:uppercase}
.vj{padding:1.1rem 0 1.2rem;border-bottom:1px solid var(--line)}
.vj h3{margin:0;font:800 1.15rem/1.2 'Geist',sans-serif;color:var(--sage);letter-spacing:-.01em}
.vb{margin-top:.5rem!important;font-size:clamp(1.6rem,7.2vw,2.2rem)!important}
.vtip{margin:.6rem 0 0;padding-left:10px;border-left:3px solid var(--car);font:400 .95rem/1.4 'Geist',sans-serif;color:#7A5C3A}
.vor{margin-top:.8rem}
.vor>span{display:block;font:600 .6rem/1 'Geist Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-bottom:.3rem}
.vor p{margin:.25rem 0 0;font:500 1.02rem/1.35 'Geist',sans-serif;color:var(--dim)}
.vor p .kw{font-weight:700;color:var(--ink);box-shadow:inset 0 -3px 0 rgba(194,149,110,.55)}
.vor .el,.vj .el{color:#B4ADA2}
.vnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:1rem}
.arw{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font:400 1.6rem/1 'Geist',sans-serif;color:var(--ink);cursor:pointer}
.arw[disabled]{opacity:.3;cursor:default}
.dots{display:flex;gap:8px}
.dots button{width:9px;height:9px;padding:0;border-radius:50%;border:none;background:#D8D1C6;cursor:pointer}
.dots button.on{background:var(--sage);transform:scale(1.25)}
/* a practice: always a way back, and a way to see the answer */
.sbar{position:sticky;top:var(--hh,0px);z-index:15;margin:0 -22px;padding:10px 22px;background:var(--ground);display:flex;align-items:center;gap:12px;font:600 .6875rem/1 'Geist Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.sbar b{color:var(--ink)}
.sbar .test{margin-left:auto}
.back{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font:700 .8rem/1 'Geist',sans-serif;letter-spacing:.02em;text-transform:none;color:var(--ink);cursor:pointer}
.showme{display:block;margin:1.2rem auto 0;border:none;background:none;padding:10px;font:600 .9rem/1 'Geist',sans-serif;color:var(--car2);text-decoration:underline;text-underline-offset:3px;cursor:pointer}

/* the Portuguese-speaker slip: struck out, then the right form slides in */
.slip{margin:.9rem 0 0;padding:10px 12px;border-radius:10px;background:#F7EFE6;border:1px solid #EAD9C6}
.sl-tag{display:block;font:600 .58rem/1 'Geist Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:#9A6A3C;margin-bottom:6px}
.sl-x{position:relative;display:inline-block;margin:0;font:500 1.02rem/1.35 'Geist',sans-serif;color:#9A6A3C}
.sl-x::after{content:"";position:absolute;left:-2px;right:-2px;top:52%;height:2px;background:#B0A89C;transform:scaleX(0);transform-origin:left;animation:strike .45s .7s forwards}
@keyframes strike{to{transform:scaleX(1)}}
.sl-ok{margin:.3rem 0 0;font:700 1.05rem/1.35 'Geist',sans-serif;color:#2F4D42;opacity:0;transform:translateX(-8px);animation:slin .4s 1.3s forwards}
.sl-ok::before{content:"✓ ";color:#708A81}
@keyframes slin{to{opacity:1;transform:none}}
.sl-why{margin:.35rem 0 0;font:400 .85rem/1.4 'Geist',sans-serif;color:var(--dim);opacity:0;animation:slin .4s 1.8s forwards}
/* register swipe */
.regbtn{min-height:44px;padding:0 20px;border-radius:999px;border:1px solid #C9C1B4;background:rgba(250,248,245,.92);font:700 .85rem/1 'Geist',sans-serif;color:var(--ink);cursor:pointer}
.rcard{margin:1.2rem 0 0;min-height:150px;display:flex;align-items:center;justify-content:center;padding:22px;border-radius:16px;background:#201E1C;box-shadow:inset 0 0 0 4px #8AA79C,0 10px 20px -12px rgba(20,17,14,.6);transition:transform .35s,opacity .35s;touch-action:pan-y}
.rcard p{margin:0;font:700 clamp(1.3rem,6vw,1.7rem)/1.25 'Geist',sans-serif;color:#E5D1B8;text-align:center}
.rcard.gol{transform:translateX(-30px) rotate(-4deg);opacity:.75}
.rcard.gor{transform:translateX(30px) rotate(4deg);opacity:.75}
.rbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:1rem}
.rb{min-height:54px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font:700 1rem/1 'Geist',sans-serif;color:var(--ink);cursor:pointer}
.rb.no{color:#9A6A3C}.rb.yes{color:#2F4D42}
@media (prefers-reduced-motion:reduce){.sl-x::after{animation:none;transform:none}.sl-ok,.sl-why{animation:none;opacity:1;transform:none}}

/* staged View: one thing at a time */
.vbar{display:flex;gap:4px;margin:1rem 0 0}
.vbar i{flex:1;height:4px;border-radius:2px;background:#E2DCD2}
.vbar i.d{background:#8AA79C}.vbar i.on{background:#201E1C}
.vstage{min-height:46vh;display:flex;flex-direction:column;justify-content:flex-start;padding:1.4rem 0 1.2rem;touch-action:pan-y}
.vlab{margin:0 0 .6rem;font:800 1.15rem/1.2 'Geist',sans-serif;color:var(--sage)}
.vfade{opacity:0;animation:slin .4s 1.4s forwards}
.vx{margin:.2rem 0 0;font:600 clamp(1.4rem,6.4vw,1.9rem)/1.25 'Geist',sans-serif;color:#9A6A3C}
.vx span{background:linear-gradient(#B0A89C,#B0A89C) 0 58%/0% 3px no-repeat;-webkit-box-decoration-break:clone;box-decoration-break:clone;animation:strike2 .6s .7s forwards}
@keyframes strike2{to{background-size:100% 3px}}
.vok{margin:.7rem 0 0;font:800 clamp(1.5rem,6.8vw,2rem)/1.2 'Geist',sans-serif;color:#2F4D42;opacity:0;transform:translateX(-8px);animation:slin .45s 1.4s forwards}
.vok::before{content:"✓ ";color:#708A81}
.vwhy{margin:1rem 0 0;font:400 1.02rem/1.45 'Geist',sans-serif;color:var(--dim);opacity:0;animation:slin .45s 2s forwards}
.valt{margin:.2rem 0 .8rem;font:700 clamp(1.4rem,6.4vw,1.9rem)/1.2 'Geist',sans-serif;letter-spacing:-.02em;color:var(--ink);opacity:0;transform:translateY(8px);animation:slin .45s forwards}
.valt .kw{box-shadow:inset 0 -.28em 0 rgba(194,149,110,.55)}
.valt .el{color:#B4ADA2}
.vtag{display:block;margin:0 0 .3rem;font:600 .6rem/1 'Geist Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--car2)}
.vnext{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:.6rem}
.vnext .go{flex:1;max-width:260px;margin-left:auto}
@media (prefers-reduced-motion:reduce){.vfade,.vok,.vwhy,.valt{animation:none;opacity:1;transform:none}.vx span{animation:none;background-size:100% 3px}}

/* the model sentence: the phrase met in context, with a voice */
.model{margin:1.3rem 0 0;padding:14px 16px 12px;border-radius:12px;background:#fff;border:1px solid var(--line)}
.model .mlab{display:block;font:600 .6rem/1 'Geist Mono',monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--sage);margin-bottom:8px}
.model p{margin:0;font:400 1.12rem/1.45 'Geist',sans-serif;color:var(--dim)}
.model p b{font-weight:700;color:var(--ink)}
.hear{display:inline-flex;align-items:center;gap:8px;margin-top:10px;border:none;background:none;padding:0;cursor:pointer;font:600 .6875rem/1 'Geist Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}
.hear svg{width:34px;height:34px}

(function(){
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}}};
const FREE=/[?&]free=1/.test(location.search);
const today=()=>{ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const sfx=k=>{ try{ if(window.SFX&&SFX[k]) SFX[k](); }catch(e){} };
const cheer=(f,...a)=>{ try{ if(window.Cheer&&Cheer[f]) return Cheer[f](...a); }catch(e){} };
let MODE='view', VI=0;
let D=null, F=new URLSearchParams(location.search).get('task')||store.get('be2.phrases.for')||'essay', POOL=[], ST=null, S=null;

const STEP=['','Choose it','Type the key word','Rebuild it','From the job alone','Use it'];
const DAYN=Math.floor(Date.now()/864e5);

/* ---------- text helpers ---------- */
const keyOf=t=>(/\[([^\]]+)\]/.exec(t)||[])[1]||'';
const plain=t=>t.replace(/\[([^\]]+)\]/g,'$1');
/* what a pupil types: the phrase without the … gaps */
const bare=t=>plain(t).replace(/…/g,' ').replace(/\s+([,.])/g,'$1').replace(/^[\s,]+|[\s,]+$/g,'').replace(/\s+/g,' ').trim();
const norm=s=>String(s).toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' ]+/g,' ').replace(/\s+/g,' ').trim();
function lev(a,b){ const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; } return p[n]; }
const sim=(a,b)=>{ a=norm(a); b=norm(b); return 1-lev(a,b)/Math.max(a.length,b.length,1); };
/* is the phrase inside a longer sentence? the best window of the same length */
function within(sent,ph){ const w=norm(sent).split(' '), p=norm(ph).split(' '), n=p.length; let best=0;
  for(let L=Math.max(1,n-1);L<=n+1;L++) for(let i=0;i+L<=w.length;i++) best=Math.max(best,sim(w.slice(i,i+L).join(' '),p.join(' ')));
  return best; }
const showT=(t,mode)=>{ /* mode: 'k' marks the key, 'gap' hides it */
  let h=esc(t.replace(/ +…/g,' …')).replace(/…/g,'<span class="el">…</span>');
  return h.replace(/\[([^\]]+)\]/,(m,k)=>mode==='gap'?'<span class="gapw" id="slot">'+k+'</span>':'<span class="k">'+k+'</span>'); };
const landT=t=>{ let i=0; return t.replace(/ +…/g,' …').split(/ +/).map(tok=>{
  const h=esc(tok).replace(/…/g,'<span class="el">…</span>').replace(/\[([^\]]+)\]/,'<span class="k">$1</span>');
  return '<span class="w" style="animation-delay:'+(i++*.16).toFixed(2)+'s">'+h+'</span>'; }).join(' '); };
const letters=t=>bare(t).split(' ').map(w=>w.replace(/^([A-Za-z])[A-Za-z’']*/,(m,c)=>c+'_'.repeat(Math.min(m.length-1,6)))).join(' ');
const topic=()=>{ try{ const f=JSON.parse(store.get('be2.five.essays')||'null'); if(f&&f.names&&f.names[f.key]) return f.names[f.key]; }catch(e){} return TOPICS[DAYN%TOPICS.length]; };


/* 22 Nov 2026: the slip Portuguese speakers make WITH EACH LEAD PHRASE, per task (a slip about a
   different phrase was a second lesson). [not, use instead, why]. Shared ones are reused by key. */
const S_={
  besides:['Besides of this, …','What is more, …','Besides has no of (além disso). Or say: What is more.'],
  dueto:['This is largely due to the fact of …','This is largely due to the fact that …','O facto de = the fact that, then subject + verb.'],
  recommend:['I would strongly recommend you to go …','I would strongly recommend going …','Recommend + -ing, or recommend that you go.'],
  convinced:['Personally, I am convinced of that …','Personally, I am convinced that …','Convencido de que = convinced that. No of before that.'],
  otherhand:['In the other hand, …','On the other hand, …','On, not in: on the other hand.'],
  allinall:['Resuming, …','All in all, …','Resuming means starting again (retomar).'],
  considered:['All things considering, …','All things considered, …','Tudo considerado: considered, the past participle.'],
  inconv:['The key inconvenient of … is that …','The key disadvantage of … is that …','Inconvenient is an adjective. The noun is disadvantage (um inconveniente).']
};
const L1={
  essay:{
    hook:['Few people would deny that the smartphones have changed …','Few people would deny that smartphones have changed …','Things in general take no "the": smartphones, not the smartphones (os smartphones).'],
    weigh:['It is worth to weigh up the benefits and drawbacks of …','It is worth weighing up the benefits and drawbacks of …','Worth + -ing: it is worth weighing up (vale a pena pesar).'],
    reason1:['In first place, it is often argued that the main advantage of … is that …','Firstly, it is often argued that the main advantage of … is that …','In first place is not English. Say Firstly (em primeiro lugar).'],
    reason2:['Secondly, it is widely believed that other point in favour of … is that …','Secondly, it is widely believed that another point in favour of … is that …','One more point = another point (outro ponto), not other.'],
    otherside:['In the other hand, it must be acknowledged that one serious drawback of … is that …','On the other hand, it must be acknowledged that one serious drawback of … is that …','On, not in: on the other hand.'],
    conclusion:['In balance, I believe that …','On balance, I believe that …','On, not in: on balance, like on the other hand.'],
  },
  email:{
    'open-email':['Dear Sir or Madame,','Dear Sir or Madam,','English Madam has no e.'],
    opinion:['According to me, …','It is my view that …','According to is for other people: according to experts.'],
    add:S_.besides, reason:S_.dueto,
    example:['Per example, …','For instance, …','Not per. In English: for instance, for example.'],
    contrast:['However the price is high.','However, the price is high.','However takes a comma after it.'],
    recommend:S_.recommend,
    ask:['I would be grateful if you can …','I would be grateful if you could …','Would goes with could: both polite, both past.'],
    signoff:['Attentively,','Yours faithfully,','Attentively means paying attention. Atenciosamente = Yours faithfully.']
  },
  article:{
    start:['Imagine a world where there is not phones.','Imagine a world where there are no phones.','Não há telemóveis = there are no phones.'],
    opinion:S_.convinced,
    reader:['Believe or not, …','Believe it or not, …','Keep the it: believe it or not (acredites ou não).'],
    add:S_.besides,
    reason:['The reason for this is because …','The reason for this is that …','Reason already means why. Reason … is that.'],
    example:['Take, per example, …','Take …, for example.','Not per: for example.'],
    contrast:S_.otherhand, recommend:S_.recommend, finish:S_.allinall
  },
  review:{
    start:['When it comes to choose a …','When it comes to choosing a …','Here to is a preposition: comes to choosing.'],
    opinion:S_.convinced, add:S_.besides,
    example:['An example clear of this is …','A clear example of this is …','The adjective goes before the noun: a clear example.'],
    contrast:['Despite of its many strengths, …','Despite its many strengths, …','Apesar de = despite. No of.'],
    good:['What impressed me more was …','What impressed me most was …','O que mais me impressionou: most, the top of all.'],
    bad:['… is far of ideal.','… is far from ideal.','Longe de = far from.'],
    recommend:S_.recommend, finish:S_.allinall
  },
  report:{
    start:['The aim of this report is analyse …','The aim of this report is to analyse …','O objetivo é analisar: aim is TO + verb.'],
    reason:S_.dueto, contrast:S_.otherhand,
    result:['This has lead to …','This has led to …','Lead now, led in the past and after has.'],
    people:['It was generally agree that …','It was generally agreed that …','Was + past participle: was agreed.'],
    good:['By far the better aspect of … was …','By far the best aspect of … was …','De longe o melhor, out of many: the best.'],
    bad:S_.inconv, recommend:S_.recommend, finish:S_.considered
  },
  story:{
    start:['I will never forget the day in which I …','I will never forget the day I …','Just the day I … : no in which.'],
    happen:['Without warn, …','Without warning, …','After without: -ing or a noun.'],
    time:['Some moments after, …','Moments later, …','Time + later: moments later, an hour later.'],
    feel:['For my horror, …','To my horror, …','Para meu horror = to my horror.'],
    tension:['Little she knew that …','Little did she know that …','Little first, then did + she + know.'],
    finish:['It was a day she will never forget.','It was a day she would never forget.','A story is in the past: would never forget.']
  }

/* 22 Nov 2026: wrong options that are CLOSE (same meaning area or a Portuguese false friend),

const DECOY={deny:['refuse','doubt'],weighing:['measuring','thinking'],firstly:['primarily','initially'],benefit:['profit','favour'],
  moreover:['although','therefore'],further:['other','farther'],hand:['side','way'],drawback:['inconvenient','damage'],
  considered:['considering','consider'],believe:['defend','agree'],outweigh:['overcome','outnumber'],madam:['madame','lady'],
  view:['vision','sight'],more:['plus','extra'],due:['thanks','because'],instance:['case','exemple'],however:['although','despite'],
  recommend:['indicate','remind'],grateful:['graceful','gratified'],faithfully:['attentively','faithful'],imagine:['suppose','think'],
  convinced:['convicted','convincing'],not:['no','never'],reason:['cause','motive'],take:['make','give'],all:['total','final'],
  comes:['goes','turns'],clear:['clean','light'],despite:['although','however'],impressed:['impressing','imposed'],
  ideal:['idea','perfectly'],aim:['finality','aims'],led:['lead','leaded'],agreed:['agree','accorded'],far:['much','long'],
  disadvantage:['inconvenient','damage'],forget:['remember','forgot'],warning:['warn','advice'],moments:['instants','times'],
  horror:['horrible','horrifying'],know:['knew','known'],

    <p class="why2">${S.extra?'Extra practice never moves a step. Each phrase climbs when it is due.':'Each phrase comes back when it is due: the higher the step, the longer the wait.'}</p>
    <ul class="lad" style="margin-top:1rem">${S.list.map(x=>{ const s=st(x.id); return `<li><span class="nm"><b>${esc(x.job)}</b><span>${esc(plain(x.p.t))}</span></span>${stepsHTML(s.rung,s.rung>=TOP)}</li>`; }).join('')}</ul>
    <div class="row">${(()=>{ const d=S.extra?0:POOL.filter(due).length; return d?`<button type="button" class="go" id="more2">Keep going: ${Math.min(PER,d)} more ›</button><button type="button" class="ghost" id="h">Ladder</button>`:'<button type="button" class="go" id="h">Back to the ladder</button>'; })()}</div>`;
  if(up) cheer('done',$('app').querySelector('.why'));
  $('h').onclick=home; if($('more2')) $('more2').onclick=()=>start(); scrollTo(0,0);
}
/* the shell's header is fixed: keep the page clear of it */
/* 21 Nov 2026 (the owner: "how does the user stop and go back?"): the header is fixed and grows when its
   fonts arrive, so the page re-measures it whenever it changes; the ‹ Back / ‹ Ladder bar then sticks just
   under it, so the way out is on screen however far a pupil scrolls */
function size(){ const h=$('hdr'), fx=getComputedStyle(h).position==='fixed', H=fx?h.offsetHeight:0;
  $('app').style.marginTop=H+'px'; document.documentElement.style.setProperty('--hh',H+'px'); }
addEventListener('resize',size);
try{ new ResizeObserver(size).observe($('hdr')); }catch(e){}
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(size);
/* the essay introduction comes from the same source as Build and Cards (essay-cards-models.json) */
const FIVE={essay:'essays',email:'emails',article:'articles',review:'reviews',report:'reports',story:'story'};
Promise.all([fetch('/data/writing/phrases-by-job.json?v=8').then(r=>r.json()),
  fetch('/data/writing/phrase-ladder.json?v=3').then(r=>r.ok?r.json():null).catch(()=>null).then(j=>{ LD=j; }),
  Promise.all(Object.entries(FIVE).map(([k,f])=>fetch('/data/writing/five/'+f+'.json?v=10').then(r=>r.ok?r.json():null).catch(()=>null)
    .then(j=>{ if(j){ BASICS[k]=new Set(); j.slots.forEach(sl=>sl.ways.forEach(w=>BASICS[k].add(pnorm(w.t.split('…')[0])))); } })))])
.then(([d])=>{ D=d; if(!D.tasks[F]) F='essay'; tabs(); size(); pool(); home(); });
})();
</script>
