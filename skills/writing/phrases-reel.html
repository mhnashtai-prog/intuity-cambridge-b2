<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Phrases · Reel · INTUITY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..900&family=Geist+Mono:wght@400..600&family=Space+Grotesk:wght@700&family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=20261105">
<script src="/tools/intuity-overflow.js?v=3"></script>
<style>
/* ════════════════════════════════════════════════════════════════════════
   PHRASES · REEL  (21 Nov 2026, prototype, not yet on the menu).
   The owner: "the lists are always the options, not a teaching approach;
   incremental, gradual, at a glance, focus-grabbing, poster style, TikTok
   inspired". One job per screen. The phrase lands word by word, then its
   grammar, then two other ways to say it. Swipe up for the next job. The
   play ring replays the landing (Maya's voice goes here once recorded).
   The list stays one tap away for looking things up.
   Data: data/writing/phrases-by-job.json (the same as the list).
   ════════════════════════════════════════════════════════════════════════ */
:root{--ink:#14110E;--car:#C2956E;--car2:#9A6A3C;--sage:#708A81;--sage2:#8AA79C;--dim:#5C5852;--faint:#8A8378;--ground:#F3F1ED}
html,body{background:var(--ground)}
body{overflow:hidden}
.header{position:relative;z-index:20;max-width:100vw;overflow:hidden}
.reel{height:calc(100dvh - var(--hh,96px));overflow-y:auto;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior:contain}
.reel::-webkit-scrollbar{display:none}
.slide{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;box-sizing:border-box;
  display:flex;flex-direction:column;padding:clamp(18px,5vh,40px) 24px 22px;max-width:640px;margin:0 auto}
.kick{display:flex;align-items:center;gap:10px;font:600 .6875rem/1 'Geist Mono',ui-monospace,monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.kick i{width:26px;height:9px;background:var(--car);flex:none}
.kick b{color:var(--ink);font-weight:600}
.job{margin:.9rem 0 0;font:800 clamp(1.15rem,5vw,1.5rem)/1.15 'Geist',system-ui,sans-serif;color:var(--sage);letter-spacing:-.01em}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;padding-bottom:7vh}
/* the poster: the phrase, big */
.hero{margin:0;font:800 clamp(2rem,9.4vw,3.3rem)/1.08 'Geist',system-ui,sans-serif;letter-spacing:-.025em;color:var(--ink)}
.hero .w{display:inline-block;opacity:0;transform:translateY(.35em);transition:opacity .35s,transform .45s cubic-bezier(.2,.8,.2,1)}
.hero .k{position:relative;z-index:0}
.hero .k::after{content:"";position:absolute;z-index:-1;left:-.06em;right:-.06em;bottom:.06em;height:.3em;background:var(--car);opacity:.55;transform:scaleX(0);transform-origin:left;transition:transform .5s .1s}
.hero .el{color:#B4ADA2}
.slide.in .hero .w{opacity:1;transform:none}
.slide.in .hero .k::after{transform:scaleX(1);transition-delay:var(--kd,1s)}
.after{opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s}
.slide.in .after{opacity:1;transform:none;transition-delay:var(--ad,1.4s)}
.slide.in .after.two{transition-delay:calc(var(--ad,1.4s) + .5s)}
.gram{margin:1.1rem 0 0;font:600 .95rem/1.3 'Geist Mono',ui-monospace,monospace;color:var(--dim)}
.tip{margin:.7rem 0 0;padding-left:10px;border-left:3px solid var(--car);font:400 .95rem/1.4 'Geist',sans-serif;color:#7A5C3A}
.or{margin:1.6rem 0 0;padding-top:.9rem;border-top:1px solid rgba(20,17,14,.12)}
.or>span{display:block;font:600 .625rem/1 'Geist Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-bottom:.5rem}
.or p{margin:.35rem 0 0;font:500 clamp(1rem,4.4vw,1.15rem)/1.35 'Geist',sans-serif;color:var(--dim)}
.or p mark{background:none;color:var(--ink);font-weight:700}
.or .el{color:#B4ADA2}
/* the foot of a slide: the ring that replays (Maya's voice later), and where you are */
.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px}
.ring{display:inline-flex;align-items:center;gap:10px;border:none;background:none;padding:0;cursor:pointer;font:600 .6875rem/1 'Geist Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}
.ring svg{width:46px;height:46px;flex:none}
.ring:active svg{transform:scale(.94)}
.count{font:400 1.6rem/1 'Anton',Impact,sans-serif;color:var(--ink)}
.count small{font-size:.9rem;color:var(--faint)}
.hint{position:absolute;left:0;right:0;bottom:84px;text-align:center;font:600 .6875rem/1 'Geist Mono',monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);
  opacity:0;transition:opacity .4s 2.6s;pointer-events:none}
.slide.in .hint{opacity:1}
.hint b{display:block;font-size:1.2rem;color:var(--sage);animation:nudge 1.6s ease-in-out infinite;margin-bottom:4px}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
/* progress: one tick per job, down the right edge */
.ticks{position:fixed;right:8px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;z-index:10}
.ticks i{width:4px;height:14px;border-radius:2px;background:rgba(20,17,14,.13);transition:background .3s,height .3s}
.ticks i.on{background:var(--sage);height:24px}
/* the list, for looking things up: always one tap away */
.list{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:15;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 16px;
  border-radius:999px;background:#fff;border:1px solid rgba(20,17,14,.14);box-shadow:0 2px 8px rgba(20,17,14,.08);font:700 .75rem/1 'Geist',sans-serif;letter-spacing:.04em;color:var(--ink);text-decoration:none}
.end .stage{align-items:flex-start}
.end h2{margin:0;font:800 clamp(2rem,9vw,3rem)/1.05 'Geist',sans-serif;letter-spacing:-.025em}
.end p{font:400 1.05rem/1.5 'Geist',sans-serif;color:var(--dim);max-width:30rem}
.end .go{display:inline-flex;align-items:center;min-height:48px;padding:0 24px;border-radius:999px;background:var(--ink);color:#fff;font:700 15px/1 'Geist',sans-serif;text-decoration:none;margin-top:.6rem}
@media (prefers-reduced-motion:reduce){.hero .w,.after,.hero .k::after{transition:none}.hint b{animation:none}}
</style>
<script src="/tools/be2-brand.js?v=20261125"></script>
</head>
<body>
<header class="header" id="hdr">
  <div class="header-top">
    <a class="back-link" href="/skills/writing/phrases.html" target="_top">← Phrases</a>
    <div class="header-title"><div class="app-title">INTUITY</div><div class="app-subtitle">Phrases</div></div>
    <span class="header-spacer">Level <b>B2</b></span>
  </div>
  <div class="set-tabs" role="tablist" aria-label="Show phrases for" id="tabs"></div>
</header>
<main class="reel" id="reel" aria-live="polite"></main>
<nav class="ticks" id="ticks" aria-hidden="true"></nav>
<a class="list" id="list" href="/skills/writing/phrases.html">☰ List</a>
<script src="/skills/grammar-rules/intuity-sound.js?v=2"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}}};
const R=store.get('be2.phrases.reg')==='informal'?'informal':'formal';
let D=null, F=new URLSearchParams(location.search).get('task')||store.get('be2.phrases.for')||'essay', JOBS=[];
const fits=p=>p.for.indexOf(F)>=0&&(F!=='email'||!p.reg||p.reg===R||p.reg==='both');
const lead=p=>(p.lead&&p.lead.indexOf(F)>=0?0:2)+(F==='email'&&p.reg==='both'?1:0);

/* the poster phrase: every word its own span, so they land one by one */
function hero(t){
  let i=0; const out=[];
  t.replace(/ +…/g,'\u00A0…').split(/ +/).forEach(tok=>{
    const key=/\[([^\]]+)\]/.exec(tok);
    let h;
    if(key) h=esc(tok.replace(/\[[^\]]+\]/,'\u0001')).replace('\u0001','<span class="k">'+esc(key[1])+'</span>');
    else h=esc(tok).replace(/…/g,'<span class="el">…</span>');
    out.push('<span class="w" style="transition-delay:'+(i*.14).toFixed(2)+'s">'+h+'</span>'); i++;
  });
  return {html:out.join(' '),n:i};
}
const small=t=>esc(t.replace(/ +…/g,'\u00A0…')).replace(/\[([^\]]+)\]/,'<mark>$1</mark>').replace(/…/g,'<span class="el">…</span>');
const PLAY='<svg viewBox="0 0 46 46" aria-hidden="true"><circle cx="23" cy="23" r="21" fill="#fff" stroke="#8AA79C" stroke-width="3"/><circle cx="23" cy="23" r="15.5" fill="#201E1C"/><path d="M20 17.5v11l9-5.5z" fill="#E5D1B8"/></svg>';

function tabs(){
  $('tabs').innerHTML=Object.keys(D.tasks).map(k=>`<button type="button" class="vtab${k===F?' active':''}" role="tab" aria-selected="${k===F}" data-f="${k}">${esc(D.tasks[k])}</button>`).join('');
  $('tabs').querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ if(F===b.dataset.f) return; F=b.dataset.f; store.set('be2.phrases.for',F); tabs(); build(); });
  $('list').href='/skills/writing/phrases.html';
}
function build(){
  JOBS=D.jobs.map(j=>Object.assign({},j,{list:j.phrases.filter(fits).sort((a,b)=>lead(a)-lead(b))})).filter(j=>j.list.length);
  const N=JOBS.length, task=D.tasks[F];
  $('reel').innerHTML=JOBS.map((j,i)=>{ const p=j.list[0], h=hero(p.t), kd=(h.n*.14+.2).toFixed(2), ad=(h.n*.14+.6).toFixed(2), alt=j.list.slice(1,3);
    return `<section class="slide" data-i="${i}" style="--kd:${kd}s;--ad:${ad}s">
      <div class="kick"><i></i><span>${esc(task)} · <b>${String(i+1).padStart(2,'0')}</b> / ${String(N).padStart(2,'0')}</span></div>
      <h2 class="job">${esc(j.name)}</h2>
      <div class="stage">
        <p class="hero">${h.html}</p>
        ${p.g?`<p class="gram after">${esc(p.g)}</p>`:''}
        ${p.tip?`<p class="tip after">${esc(p.tip)}</p>`:''}
        ${alt.length?`<div class="or after two"><span>Or</span>${alt.map(a=>`<p>${small(a.t)}</p>`).join('')}</div>`:''}
      </div>
      <div class="foot"><button type="button" class="ring" data-again="${i}" aria-label="Play it again">${PLAY}Again</button><span></span></div>
      ${i===0?'<div class="hint"><b>↑</b>Swipe up · next job</div>':''}
    </section>`; }).join('')+
    `<section class="slide end" data-i="${N}"><div class="kick"><i></i><span>${esc(task)} · the end</span></div>
      <div class="stage"><h2>${N} jobs.<br>${N} phrases.</h2><p>That is a whole ${esc(task.toLowerCase())}. Open the list to learn them three at a time, with a score.</p>
      <a class="go" href="/skills/writing/phrases.html">Open the list ›</a></div></section>`;
  $('ticks').innerHTML=JOBS.map(()=>'<i></i>').join('');
  $('reel').scrollTop=0;
  $('reel').querySelectorAll('[data-again]').forEach(b=>b.onclick=()=>again(b.closest('.slide')));
  watch();
}
function again(s){ s.classList.remove('in'); void s.offsetWidth; requestAnimationFrame(()=>s.classList.add('in')); }
let io=null;
function watch(){
  if(io) io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{
    const s=e.target, i=+s.dataset.i;
    if(e.isIntersecting&&e.intersectionRatio>.6){ s.classList.add('in');
      $('ticks').querySelectorAll('i').forEach((t,k)=>t.classList.toggle('on',k===i)); }
    else if(e.intersectionRatio<.2) s.classList.remove('in');
  }),{root:$('reel'),threshold:[0,.2,.6,1]});
  $('reel').querySelectorAll('.slide').forEach(s=>io.observe(s));
}
function size(){ document.documentElement.style.setProperty('--hh',$('hdr').offsetHeight+'px'); }
fetch('/data/writing/phrases-by-job.json?v=8').then(r=>r.json()).then(d=>{ D=d; if(!D.tasks[F]) F='essay'; tabs(); size(); build(); });
addEventListener('resize',size);
})();
</script>
</body>
</html>
