<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>INTUITY — Phrases</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..900&family=Geist+Mono:wght@400..600&family=Space+Grotesk:wght@700&family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=20261105">
<link rel="stylesheet" href="/tools/five-card.css?v=7">

<style>
/* ═════════════════════════════════════════════════════════════════════════
   PHRASES · by what you want to say  (19 Nov 2026, a learner's review: "my
   question is How do I give my opinion?, How do I recommend something?").
   The one cross-task reference in Writing, under Help yourself. It keeps
   what Essentials did well (phrases grouped by their job) without its wall
   of text: a job is one card, three phrases on it, the rest one tap away,
   and "Learn these 3" turns the lookup into recall (a gap, three choices, a
   score, a run and a best). The filter in the header narrows every card to
   one task. Data: data/writing/phrases-by-job.json.
   ═════════════════════════════════════════════════════════════════════════ */
:root{--ink:#14110E;--paper:#FAF8F5;--car:#C2956E;--car2:#9A6A3C;--sage:#708A81;--dim:#5C5852;--faint:#8A8378;--line:rgba(20,17,14,.12)}
.header{position:sticky;top:0;z-index:20;max-width:100vw;overflow:hidden}
.wrap{max-width:720px;margin:0 auto;padding:1.1rem var(--gutter,16px) 4rem;color:var(--ink)}
/* the task filter: the page's second header row */
/* 19 Nov 2026 (a learner: "the active chip is an underline while the others are pills"):
   plain tabs and the one sliding pill, from tools/intuity-overflow.js, as on every other page */
/* THE ENTRY (19 Nov 2026, the owner: "no noise, simple, an option", then
   "unity among all pages, lists and modal cards"). The list sits on the
   shell's poster, the same paper, kicker and inks as a Vocabulary card:
   caramel block + PHRASES · ESSAY, rows split by the card's own hairline,
   the job in the card's ink, its first phrase in the card's body grey, the
   gap in the FiveCard's grey. Each row is a choice; the arrow says so. */
.wrap .poster{padding-top:clamp(1.1rem,4vw,1.5rem);padding-bottom:.3rem}
.wrap .poster-kick{margin-bottom:.35rem}
.jobs{list-style:none;margin:0;padding:0}
.jobs li+li{border-top:1px solid var(--poster-rule)}
.job{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 0;box-sizing:border-box;text-align:left;
  background:none;border:none;cursor:pointer;color:var(--poster-ink);font:inherit;-webkit-tap-highlight-color:transparent}
.job:active{background:rgba(176,134,92,.08)}
.job:focus-visible{outline:2px solid var(--caramel);outline-offset:2px}
.job .tx{flex:1;min-width:0}
.job .nm{display:block;font-family:var(--f-display);font-weight:700;font-size:clamp(1rem,4.4vw,1.06rem);line-height:1.3;color:var(--poster-ink)}
.job .eg{display:block;margin-top:3px;font-family:var(--f-display);font-weight:400;font-size:1rem;line-height:1.45;color:var(--poster-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.job .eg .g{color:#B4ADA2;letter-spacing:.06em}
.job .chev{flex:none;width:18px;height:18px;color:var(--poster-faint);transition:transform .15s}
.job:active .chev{transform:translateX(2px)}
.job .bst{flex:none;font-family:var(--f-mono);font-size:.6875rem;letter-spacing:.08em;color:#4A6B5C}
/* Email's Formal | Informal switch sits in the card's kicker, which asks the question it answers */
.wrap .poster-kick #kickT{flex:1;min-width:0;color:#4A4540}   /* 20 Nov: the page's question, darker so it is read */
.regseg{flex:none;margin-left:auto;letter-spacing:0;text-transform:none}
.regseg[hidden]{display:none}
.regseg button{min-height:30px;padding:.25rem .85rem;font-size:.75rem;letter-spacing:.02em}
.wrap .poster-kick:has(.regseg:not([hidden])){margin-bottom:0;margin-top:-6px}
.empty{text-align:center;color:var(--dim);margin:2rem 0}
/* THE CARD: the FiveCard look. On a phone it takes the whole screen (close at
   the top, the button pinned at the bottom, the phrases scroll between), so
   nothing is ever cut off. Named .jcard, not .sheet: the shell's .sheet rule
   (inset:0, padding, a pale veil) was squeezing the old modal to half the
   screen and clipping its top and bottom. */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(20,17,14,.45);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.jcard{position:fixed;z-index:61;inset:0;display:flex;flex-direction:column;box-sizing:border-box;
  transform:translateY(16px);opacity:0;pointer-events:none;transition:opacity .2s,transform .22s}
.jcard.open{transform:none;opacity:1;pointer-events:auto}
.jcard .fc-card{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;border:none;border-radius:0;
  padding:calc(env(safe-area-inset-top,0px) + 18px) 20px calc(env(safe-area-inset-bottom,0px) + 14px)}
.jcard .bd{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;margin:0 -20px;padding:0 20px 8px}
.jcard .ft{flex:none;border-top:1px solid var(--line);margin:0 -20px;padding:12px 20px 0}
.jcard .ft .acts{margin-top:0}
@media (min-width:600px){
  .jcard{inset:auto;left:50%;top:50%;width:min(560px,calc(100vw - 48px));max-height:calc(100dvh - 48px);transform:translate(-50%,-47%)}
  .jcard.open{transform:translate(-50%,-50%)}
  .jcard .fc-card{border-radius:0;padding:20px 20px 16px;box-shadow:0 30px 60px -30px rgba(20,17,14,.55)}
}
.x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);right:10px;width:44px;height:44px;border:none;border-radius:50%;background:#EDE8E0;color:var(--ink);font-size:16px;cursor:pointer}
@media (min-width:600px){.x{top:10px}}
.ph{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column}
.ph li{padding:12px 0;border-top:1px solid var(--line)}
.ph li:last-child{border-bottom:1px solid var(--line)}
.ph .t{display:block;font:500 clamp(18px,4.9vw,20px)/1.35 'Geist',system-ui,sans-serif;color:var(--ink)}
/* the key word: the caramel underline a strong collocation partner carries, the same mark meaning the same thing */
.ph .t .g{color:#B4ADA2;letter-spacing:.06em}
.ph .t mark{background:none;color:inherit;font-weight:700;box-shadow:inset 0 -2px 0 var(--caramel)}
.gr1{margin:14px 0 -6px;font:400 14px/1.35 'Geist',system-ui,sans-serif;color:#6B655C}
.ph .tip{display:block;margin-top:4px;padding-left:10px;border-left:2px solid #C2956E;font:400 13.5px/1.35 'Geist',system-ui,sans-serif;color:#7A5C3A}
.ph .gr{display:block;margin-top:4px;font:400 14px/1.35 'Geist',system-ui,sans-serif;color:#6B655C}
.ph .tg{display:block;margin-top:5px;font:600 9.5px/1 'Geist Mono',ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.ph.more .t{font-size:16px;font-weight:400}
.morebtn{display:block;margin:10px auto 0;border:none;background:none;font:600 13px/1 'Geist',sans-serif;color:var(--car2);padding:10px;cursor:pointer}
.acts{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px}
.go{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 22px;border:none;border-radius:999px;background:var(--ink);color:#fff;font:700 15px/1 'Geist',sans-serif;cursor:pointer}
.go:active{transform:scale(.97)}
.nav{display:flex;align-items:center;gap:6px;font:600 11px/1 'Geist Mono',monospace;letter-spacing:.12em;color:var(--faint)}
.nav button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:18px;cursor:pointer}
.nav button:disabled{opacity:.35}
/* LEARN THESE 3 */
.score{display:flex;justify-content:space-between;margin-top:14px;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  font:600 10px/1 'Geist Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.score b{font:400 20px/1 'Anton',Impact,sans-serif;color:var(--ink);letter-spacing:0;margin-left:6px;vertical-align:-3px}
.dots{display:flex;gap:6px;justify-content:center;margin:14px 0 4px}
.dots i{width:9px;height:9px;border-radius:50%;background:#E2DCD2}
.dots i.ok{background:var(--sage)}.dots i.no{background:var(--car)}.dots i.on{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--ink)}
.q{margin:14px 0 4px;font:500 clamp(19px,5.2vw,22px)/1.4 'Geist',sans-serif;text-align:center}
.q .g{color:#B4ADA2}
.q .gslot{display:inline-block;min-width:4.2em;border-bottom:2.5px solid var(--ink);color:transparent;line-height:1.15}
.q .gslot.ok{color:#2F4D42;border-color:var(--sage)}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.opts button{min-height:50px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font:600 17px/1 'Geist',sans-serif;color:var(--ink);cursor:pointer}
.opts button.no{border-color:var(--car);color:var(--car2);background:#FBF1E8}
.opts button.ok{border-color:var(--sage);background:#EAF1EE;color:#2F4D42}
.big{display:block;text-align:center;margin:14px 0 2px;font:400 64px/1 'Anton',Impact,sans-serif}
.cap{text-align:center;color:var(--dim);font-size:15px;line-height:1.45;margin:6px 0 0}
@media (prefers-reduced-motion:reduce){.jcard,.scrim{transition:none}}
</style>
<script src="/tools/be2-brand.js?v=20261127g"></script>

<body>
<header class="header">
  <div class="header-top">
    <a class="back-link" href="/skills/writing/phrases-ladder.html" target="_top">← Ladder</a>
    <div class="header-title"><div class="app-title">INTUITY</div><div class="app-subtitle">Phrases</div></div>
    <span class="header-spacer">Level <b>B2</b></span>
  </div>
  <div class="set-tabs" role="tablist" aria-label="Show phrases for" id="tabs"></div>
</header>
<main class="wrap">
  <section class="poster" aria-labelledby="kick">
    <div class="poster-kick" id="kick"><i></i><span id="kickT">Phrases</span>
      <span class="seg regseg" id="regRow" role="tablist" aria-label="Who are you writing to?" hidden><button type="button" role="tab" data-r="formal">Formal</button><button type="button" role="tab" data-r="informal">Informal</button></span>
    </div>
    <ul class="jobs" id="jobs"></ul>
  </section>
</main>
<div class="scrim" id="scrim"></div>
<div class="jcard" id="sheet" role="dialog" aria-modal="true" aria-labelledby="cT"></div>

<script src="/skills/grammar-rules/intuity-sound.js?v=2"></script>
<script src="/tools/intuity-cheer.js?v=2"></script>
<script src="/tools/intuity-log.js?v=1"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}}};
let R=store.get('be2.phrases.reg')==='informal'?'informal':'formal';
let D=null, F=store.get('be2.phrases.for')||'essay', JOBS=[], OPEN=-1, MORE=false, RUN=0;

/* a phrase on screen: the key word marked, every … grey */
const show=(t,gap)=>esc(t).replace(/…/g,'<span class="g">…</span>').replace(/\[([^\]]+)\]/,(m,k)=>gap?'<span class="gslot" id="slot">'+esc(k)+'</span>':'<mark>'+k+'</mark>');
const keyOf=p=>(/\[([^\]]+)\]/.exec(p.t)||[])[1]||'';
/* Email: the Formal | Informal switch keeps the phrases for that letter, and those that suit both */
const fits=p=>(F==='all'||p.for.indexOf(F)>=0)&&(F!=='email'||!p.reg||p.reg===R||p.reg==='both');
/* formal / informal matters in one task only: the email or letter */
/* the switch carries the register now (a learner: thirteen tagged rows was too long), so no tags */
const reg=p=>'';
const tags=p=>p.for.map(k=>D.tasks[k]).join(' · ');
const FK=()=>F==='email'?'email-'+R:F;
const bestOf=id=>+(store.get('be2.phrases.best.'+id+'.'+FK())||0);

function tabs(){
  /* 19 Nov 2026, the owner: no 'All tasks'; a pupil writes one task at a time, Essay first */
  const T=Object.keys(D.tasks).map(k=>[k,D.tasks[k]]);
  $('tabs').innerHTML=T.map(([k,n])=>`<button type="button" class="vtab${k===F?' active':''}" role="tab" aria-selected="${k===F}" data-f="${k}">${esc(n)}</button>`).join('');
  $('tabs').querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ F=b.dataset.f; store.set('be2.phrases.for',F); tabs(); grid(); });
}
function regRow(){
  $('regRow').hidden=F!=='email';
  $('regRow').querySelectorAll('[data-r]').forEach(b=>{ const on=b.dataset.r===R; b.classList.toggle('on',on); b.setAttribute('aria-selected',on);
    b.onclick=()=>{ if(R===b.dataset.r) return; R=b.dataset.r; store.set('be2.phrases.reg',R); grid(); }; });
}
function grid(){
  regRow();
  /* the kicker asks the page's question; the header and the tab already say Phrases and the task */
  $('kickT').textContent=F==='email'?'Who is it to?':'What do you want to do?';
  /* a phrase that leads for this task comes first (Article's hook, Report's aim, Email's opening) */
  const lead=p=>(p.lead&&p.lead.indexOf(F)>=0?0:2)+(F==='email'&&p.reg==='both'?1:0);
  JOBS=D.jobs.map(j=>Object.assign({},j,{list:j.phrases.filter(fits).sort((a,b)=>lead(a)-lead(b))})).filter(j=>j.list.length);
  /* a row: the job, and the first phrase it gives you, so the choice explains itself */
  const eg=t=>esc(t.replace(/\[([^\]]+)\]/,'$1')).replace(/…/g,'<span class="g">…</span>');
  $('jobs').innerHTML=JOBS.length?JOBS.map((j,i)=>{ const b=bestOf(j.id), n=Math.min(3,j.list.length);
    return `<li><button type="button" class="job" data-i="${i}"><span class="tx"><span class="nm">${esc(j.name)}${reg(j.list[0])}</span><span class="eg">${eg(j.list[0].t)}</span></span>`+
      `${b?`<span class="bst" aria-label="Best ${b} of ${n}">★ ${b}/${n}</span>`:''}<svg class="chev" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4l5 5-5 5"/></svg></button></li>`; }).join('')
    :'<li class="empty">No phrases for this task yet.</li>';
  $('jobs').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>open(+b.dataset.i));
}

/* THE CARD */
function open(i){ OPEN=i; MORE=false; card(); $('scrim').classList.add('open'); $('sheet').classList.add('open'); }
function close(){ $('scrim').classList.remove('open'); $('sheet').classList.remove('open'); OPEN=-1; grid(); }
function head(j){ return `<button type="button" class="x" id="cX" aria-label="Close">✕</button>`+
  `<span class="fc-k">Phrases · ${esc(F==='all'?j.sub:F==='email'?(R==='formal'?'Formal email':'Informal email'):D.tasks[F])}</span><span class="fc-t" id="cT">${esc(j.name)}</span><span class="fc-bar" aria-hidden="true"></span>`; }
/* one frame for every view of the card: head, a scrolling body, a pinned foot */
const frame=(j,body,foot)=>`<div class="fc-card">${head(j)}<div class="bd">${body}</div>${foot?`<div class="ft">${foot}</div>`:''}</div>`;
function card(){
  const j=JOBS[OPEN], top=j.list.slice(0,3), rest=j.list.slice(3), b=bestOf(j.id);
  /* the grammar that follows the phrase, one grey line (a learner: "the most useful part of Essentials") */
  /* when every phrase on show takes the same grammar, it is said once, above them (a learner) */
  const shown=MORE?j.list:top, gs=shown.map(p=>p.g||''), one=gs[0]&&gs.every(g=>g===gs[0])&&shown.length>1?gs[0]:'';
  /* the slip to avoid, one short line (20 Nov 2026, a learner: "show the typical B2 mistake") */
  const li=p=>`<li><span class="t">${show(p.t)}${reg(p)}</span>${p.g&&!one?`<span class="gr">${esc(p.g)}</span>`:''}${p.tip?`<span class="tip">${esc(p.tip)}</span>`:''}${F==='all'?`<span class="tg">${esc(tags(p))}</span>`:''}</li>`;
  $('sheet').innerHTML=frame(j,(one?`<p class="gr1">All ${shown.length}: ${esc(one)}</p>`:'')+`<ul class="ph">${top.map(li).join('')}</ul>`+
    (rest.length?(MORE?`<ul class="ph more">${rest.map(li).join('')}</ul>`:`<button type="button" class="morebtn" id="cMore">+ ${rest.length} more</button>`):''),
    `<div class="acts"><button type="button" class="go" id="cGo">Learn ${top.length>1?'these '+top.length:'this one'}${b?' · ★ '+b:''}</button>`+
    `<span class="nav"><button type="button" id="cPrev" aria-label="Previous"${OPEN?'':' disabled'}>‹</button>${OPEN+1}/${JOBS.length}<button type="button" id="cNext" aria-label="Next"${OPEN<JOBS.length-1?'':' disabled'}>›</button></span></div>`);
  wire(); if($('cMore')) $('cMore').onclick=()=>{ MORE=true; card(); };
  $('cGo').onclick=()=>learn(j);
}
function wire(){
  $('cX').onclick=close;
  const p=$('cPrev'), n=$('cNext');
  if(p) p.onclick=()=>{ if(OPEN>0){ OPEN--; MORE=false; card(); } };
  if(n) n.onclick=()=>{ if(OPEN<JOBS.length-1){ OPEN++; MORE=false; card(); } };
}

/* LEARN THESE 3: the key word goes; three choices; first try scores */
let L=null;
function learn(j){
  const items=j.list.slice(0,3), keys=j.phrases.map(keyOf);
  const pool=D.jobs.flatMap(x=>x.phrases.map(keyOf));
  L={j,items,at:0,score:0,res:[],tries:0,opts:items.map(p=>{ const k=keyOf(p), lk=k.toLowerCase();
    const near=keys.concat(pool).filter((x,i,a)=>x&&x.toLowerCase()!==lk&&a.findIndex(y=>y.toLowerCase()===x.toLowerCase())===i);
    /* two decoys: from the same job first (they compete), then the rest of the bank */
    const same=near.filter(x=>keys.indexOf(x)>=0).sort(()=>Math.random()-.5), other=near.filter(x=>keys.indexOf(x)<0).sort(()=>Math.random()-.5);
    return [k].concat(same.concat(other).slice(0,2)).sort(()=>Math.random()-.5); })};
  ask();
}
function ask(){
  const j=L.j, p=L.items[L.at];
  $('sheet').innerHTML=frame(j,
    `<div class="score"><span>Score<b>${L.score}</b></span><span>Run<b>${RUN}</b></span><span>Best<b>${bestOf(j.id)}</b></span></div>`+
    `<div class="dots">${L.items.map((_,i)=>`<i class="${L.res[i]===1?'ok':L.res[i]===0?'no':''}${i===L.at?' on':''}"></i>`).join('')}</div>`+
    `<p class="q">${show(p.t,true)}</p><div class="opts">${L.opts[L.at].map(o=>`<button type="button" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>`);
  $('cX').onclick=close; L.tries=0;
  $('sheet').querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>pick(b));
}
function pick(b){
  const k=keyOf(L.items[L.at]), ok=b.dataset.o===k;
  if(!ok){ L.tries++; b.classList.add('no'); b.disabled=true; RUN=0; if(window.Cheer) Cheer.soft();
    if(L.res[L.at]==null){ L.res[L.at]=0; }
    try{ if(window.INTUITY) INTUITY.log('writing','phrase-'+L.j.id+'-'+L.at,false,{game:'phrases'}); }catch(e){}
    return; }
  const first=L.res[L.at]==null; if(first){ L.res[L.at]=1; L.score++; RUN++; }
  b.classList.add('ok'); $('slot').classList.add('ok');
  $('sheet').querySelectorAll('[data-o]').forEach(x=>x.disabled=true);
  if(window.Cheer){ Cheer.right($('slot'),first); if(first&&RUN>=3&&RUN%3===0) Cheer.streak($('slot')); }
  try{ if(window.INTUITY&&first) INTUITY.log('writing','phrase-'+L.j.id+'-'+L.at,true,{game:'phrases'}); }catch(e){}
  setTimeout(()=>{ L.at++; if(L.at<L.items.length) ask(); else end(); },first?750:1100);
}
function end(){
  const j=L.j, n=L.items.length, was=bestOf(j.id), nb=L.score>was;
  if(nb) store.set('be2.phrases.best.'+j.id+'.'+FK(),String(L.score));
  const nx=OPEN<JOBS.length-1?JOBS[OPEN+1]:null;
  $('sheet').innerHTML=frame(j,`<span class="big" id="bigS">${L.score}/${n}</span>`+
    `<p class="cap">${L.score===n?'All three, first time.':L.score?'Have another go: the gaps you missed come back.':'They come back next time. Read them once more, then try again.'}${nb&&was?' <b>New best!</b>':''}</p>`+
    `<div class="score"><span>Run<b>${RUN}</b></span><span>Best<b>${Math.max(was,L.score)}/${n}</b></span></div>`,
    `<div class="acts"><button type="button" class="go" id="cAgain">Again</button>${nx?`<button type="button" class="go" id="cOn" style="background:#fff;color:var(--ink);border:1.5px solid var(--ink)">${esc(nx.name)} ›</button>`:''}</div>`);
  $('cX').onclick=close;
  $('cAgain').onclick=()=>{ MORE=false; card(); };
  if($('cOn')) $('cOn').onclick=()=>{ OPEN++; MORE=false; card(); };
  if(window.Cheer){ if(L.score===n) Cheer.done($('bigS')); else Cheer.tick($('bigS')); }
  try{ if(window.INTUITY) INTUITY.session('writing','phrases',{kept:L.score,missed:n-L.score}); }catch(e){}
}

$('scrim').onclick=close;
addEventListener('keydown',e=>{ if(e.key==='Escape'&&OPEN>=0) close(); });
/* a sideways swipe on the card moves to the next job (not during Learn) */
{ let sx=0,sy=0; $('sheet').addEventListener('touchstart',e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; },{passive:true});
  $('sheet').addEventListener('touchend',e=>{ if(!$('cGo')) return; const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
