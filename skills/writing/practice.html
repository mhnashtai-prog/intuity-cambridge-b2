<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>INTUITY — Writing · Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..900&family=Geist+Mono:wght@400..600&family=Space+Grotesk:wght@700&family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=20261105">
<link rel="stylesheet" href="/tools/five-card.css?v=6">
<style>
/* PRACTICE (8 Nov 2026, the teacher's idea): finish a sentence from the
   phrase bank about something you know - my phone, my city, homework, the
   school canteen. Producing the rest of a phrase about your own life is what
   makes it stick; the prompt always stops where the marks are (an opinion,
   a reason, a formal finding). One card at a time, as many as you like. */
:root{--ink:#14110E;--grey:#8A8378;--car:#B0865C;--car2:#8E6238;--rule:rgba(20,17,14,.12)}
body{background:#F2EFEA;color:var(--ink);margin:0;font-family:'Geist',system-ui,sans-serif;min-height:100dvh;display:flex;flex-direction:column}
.pr-tabs{display:flex;justify-content:safe center;gap:0;padding:4px 6px 0;overflow-x:auto;scrollbar-width:none}
.pr-tabs::-webkit-scrollbar{display:none}
.pr-tab{all:unset;cursor:pointer;padding:8px clamp(3px,1.3vw,8px) 7px;font:600 clamp(10.5px,2.9vw,11.5px)/1 'Geist Mono',ui-monospace,monospace;letter-spacing:clamp(.04em,.6vw,.1em);text-transform:uppercase;color:#9A948B;border-bottom:2px solid transparent;white-space:nowrap}
.pr-tab[aria-selected=true]{color:var(--ink);border-bottom-color:#D8915C}
.pr-tab:focus-visible{outline:2px solid var(--car);outline-offset:2px}
.pr-seg{display:flex;justify-content:center;margin:10px auto 10px;padding:3px;border-radius:999px;background:rgba(20,17,14,.06);width:max-content;max-width:calc(100% - 32px)}
.pr-seg button{all:unset;cursor:pointer;padding:7px 13px;border-radius:999px;font:600 12.5px/1 'Geist',sans-serif;color:#8A8378;white-space:nowrap}
.pr-seg button[aria-checked=true]{background:var(--ink);color:#F6F3EE}
.pr-seg button:focus-visible{outline:2px solid var(--car);outline-offset:2px}
main{flex:1;display:flex;flex-direction:column;align-items:center;padding:calc(var(--hh,190px) + 14px) 16px calc(24px + env(safe-area-inset-bottom))}
.pr-card{width:100%;max-width:520px;box-shadow:0 10px 30px rgba(20,17,14,.08);border-radius:8px!important;padding:18px 18px 6px!important;touch-action:pan-y}
.pr-card .fc-t{font-size:clamp(34px,10vw,44px)!important;margin-top:10px}
.pr-card .fc-bar{width:40px;height:4px;margin-top:10px}
.pr-card .fc{margin-top:16px}
.pr-p{display:block;font-size:clamp(17px,4.6vw,19px);line-height:1.5;color:var(--ink);font-weight:500}
.pr-p .t{color:var(--car2)}
.pr-p .fc-gap{color:#B4ADA2}
.pr-ex{display:block;margin-top:10px;padding-top:10px;border-top:1px dashed rgba(20,17,14,.14);font-size:15px;line-height:1.5;color:#6A625A}
.pr-ex[hidden]{display:none}
.pr-ex .about{display:block;font:500 10.5px/1.3 'Geist Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#9A948B;margin-bottom:4px}
.pr-ex .ph{color:var(--ink);font-weight:500}
.pr-ex .no{display:block;margin-top:6px;color:#A39B90}
.pr-ex .no s{text-decoration-color:#B0865C;text-decoration-thickness:1.5px}
.pr-ex .no b{font:600 10.5px/1 'Geist Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#9A5A2C;margin-right:6px;text-decoration:none}
.pr-turn{display:block;margin:4px 0 12px;font-size:12.5px;color:var(--grey)}
.pr-act{display:flex;gap:10px;justify-content:center;margin-top:18px}
.pr-act button{all:unset;cursor:pointer;padding:12px 22px;border-radius:999px;font:600 15px/1 'Geist',sans-serif;background:rgba(20,17,14,.07);color:var(--ink)}
.pr-act .go{background:var(--ink);color:#F6F3EE;display:inline-flex;align-items:center;gap:8px}
.pr-act button[hidden]{display:none}
.pr-act button:focus-visible{outline:2px solid var(--car);outline-offset:2px}
.pr-act button:active{transform:scale(.97)}
.pr-card.out{opacity:0;transform:translateX(-16px);transition:opacity .14s ease,transform .14s ease}
.pr-card.in{opacity:0;transform:translateX(16px)}
.pr-card{transition:opacity .16s ease,transform .16s ease}
@media (prefers-reduced-motion:reduce){ .pr-card{transition:none} }
/* SORT (8 Nov 2026, the teacher's idea): which task, which part? Two rows of
   pills; the card checks itself once both are chosen. The topic is hidden, so
   the phrase alone has to tell. */
.pr-kindrow{display:flex;justify-content:center;margin:6px 0 4px}
.pr-kind{display:inline-flex;padding:4px;border-radius:999px;background:rgba(20,17,14,.07)}
.pr-kind button{all:unset;position:relative;cursor:pointer;padding:10px clamp(12px,4vw,22px);border-radius:999px;font:700 13px/1 'Geist',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#8A8378}
.pr-kind button[aria-checked=true]{background:#14110E;color:#F6F3EE}
.pr-kind button:focus-visible{outline:2px solid var(--car);outline-offset:2px}
body.sorting #tabs,body.sorting #seg{display:none}
/* SWITCH IT (9 Nov 2026): the same idea, from an email to a friend to an essay */
.sw-from{display:block;margin:16px 0 4px;font:500 10.5px/1.3 'Geist Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#9A948B}
.sw-e{display:block;padding:10px 14px;border-left:3px solid #8AA79C;background:rgba(138,167,156,.10);font-size:clamp(17px,4.6vw,19px);line-height:1.45;color:var(--ink);font-weight:500}
.sw-t{display:block;margin-top:8px;font:500 12px/1.5 'Geist Mono',monospace;letter-spacing:.02em;color:#6A625A}
.sw-opts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.sw-o{all:unset;position:relative;cursor:pointer;display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-radius:12px;border:1px solid rgba(20,17,14,.18);background:#FBF9F5;font-size:16px;line-height:1.45;color:#3A3530;-webkit-tap-highlight-color:transparent;transition:border-color .15s,background .15s}
.sw-o .dot{flex:none;margin-top:3px;width:14px;height:14px;border-radius:50%;box-sizing:border-box;border:1.5px solid rgba(20,17,14,.3);transition:background .15s,border-color .15s}
.sw-o[aria-checked=true]{border-color:var(--ink);color:var(--ink)}
.sw-o[aria-checked=true] .dot{background:var(--ink);border-color:var(--ink)}
.sw-o.ok{background:#4F6B61;border-color:#4F6B61;color:#fff}.sw-o.ok .dot{background:#fff;border-color:#fff}
.sw-o.no{background:rgba(176,134,92,.12);border-color:rgba(176,134,92,.5);color:#7A5C3A}.sw-o.no .tx{text-decoration:line-through;text-decoration-color:#B0865C}
.sw-o.no .dot{background:#B0865C;border-color:#B0865C}
.sw-o .why{display:block;margin-top:4px;font-size:13px;font-weight:600;text-decoration:none;color:#9A5A2C}
.sw-o:focus-visible{outline:2px solid var(--car);outline-offset:2px}
.sw-opts.done .sw-o{cursor:default}
/* FINISH IT AS A PUZZLE (8 Nov 2026, the teacher's idea): the ending in word chips to put back in order */
.fi-tray{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px;min-height:40px}
.fi-c{all:unset;position:relative;cursor:pointer;padding:10px 14px;border-radius:999px;border:1px solid rgba(20,17,14,.18);background:#FBF9F5;font:600 15px/1.1 'Geist',sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;transition:transform .12s}
.fi-c:active{transform:scale(.95)}
.fi-c:focus-visible{outline:2px solid var(--car);outline-offset:2px}
.fi-w{all:unset;position:relative;cursor:pointer;color:var(--ink);border-bottom:2px solid var(--car);padding:0 1px;margin-right:.28em;-webkit-tap-highlight-color:transparent}
.fi-w.lock{cursor:default;border-bottom-color:#4F6B61}
.fi-w.in{animation:fiIn .22s cubic-bezier(.3,1.5,.5,1)}
@keyframes fiIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fi-slot{transition:color .3s}
.fi-done{color:#4F6B61}
.fi-shown{color:#9A5A2C}
.pr-p.wait{color:#A39B90;font-size:14.5px;line-height:1.4}.pr-p.wait .t{color:#C2A88C}
.fi-no{display:block;margin-top:6px;color:#A39B90}
.fi-no s{text-decoration-color:#B0865C;text-decoration-thickness:1.5px}
.fi-no b{font:600 10.5px/1 'Geist Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#9A5A2C;margin-right:6px}
.fi-tray:empty::after{content:'All placed: check it.';font-size:13px;color:#A39B90;align-self:center}
@media (prefers-reduced-motion:reduce){ .fi-w.in{animation:none} }
.so-ask{display:block;font-size:14px;line-height:1.4;color:#8A8378}
.so-p{display:block;margin:16px 0 6px;font-size:clamp(18px,4.8vw,20px);line-height:1.5;font-weight:500;color:var(--ink)}
.so-p .fc-gap{color:#B4ADA2}
.so-q{display:block;margin:16px 0 6px;font:500 10.5px/1.3 'Geist Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#9A948B}
.so-pick{width:100%;max-width:520px;box-sizing:border-box;margin:20px auto 0;padding:0 2px}
.so-pick[hidden]{display:none}
.so-pick .so-ask{margin:0 0 4px;padding-top:14px;border-top:1px solid var(--rule);text-align:center;font-size:15px;color:#5C5852}
.so-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.so-row button{all:unset;position:relative;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:9px;-webkit-tap-highlight-color:transparent}
.so-row .pl{display:block;width:100%;box-sizing:border-box;text-align:center;padding:10px 2px;border-radius:999px;border:1px solid rgba(20,17,14,.18);font:600 14px/1 'Geist',sans-serif;color:#5C5852;background:#FBF9F5;transition:background .15s,color .15s,border-color .15s}
.so-row .dot{width:14px;height:14px;border-radius:50%;box-sizing:border-box;border:1.5px solid rgba(20,17,14,.3);transition:background .15s,border-color .15s,transform .2s}
.so-row button[aria-checked=true] .pl{border-color:var(--ink);color:var(--ink)}
.so-row button[aria-checked=true] .dot{background:var(--ink);border-color:var(--ink);transform:scale(1.1)}
.so-row button.ok .pl{background:#4F6B61;border-color:#4F6B61;color:#fff}
.so-row button.ok .dot{background:#4F6B61;border-color:#4F6B61}
.so-row button.no .pl{background:rgba(176,134,92,.16);border-color:rgba(176,134,92,.5);color:#7A5C3A;text-decoration:line-through}
.so-row button.no .dot{background:#B0865C;border-color:#B0865C}
.so-row button:focus-visible .pl{outline:2px solid var(--car);outline-offset:2px}
.so-row.done button{cursor:default}
.pr-act button:disabled{opacity:.35;cursor:default}
.so-why{display:block;margin:16px 0 8px;padding-top:12px;border-top:1px dashed rgba(20,17,14,.14);font-size:14.5px;line-height:1.5;color:#5C5852}
.so-why b{color:var(--ink)}
.so-hud[hidden]{display:none}
.so-hud{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:14px;font:500 11px/1.4 'Geist Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#8A8378}
.so-hud b{font-size:13px;color:var(--ink)}
.so-fire{opacity:0;transition:opacity .3s}.so-fire.on{opacity:1}
.so-big{display:block;margin:14px 0 4px;font:400 clamp(64px,20vw,88px)/1 'Anton',Impact,sans-serif;color:var(--ink)}
.so-praise{display:block;font-size:18px;font-weight:500;color:var(--ink)}
.so-sub{display:block;margin-top:6px;font:500 11px/1.4 'Geist Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#8A8378}
.so-best{display:block;margin-top:4px;font:500 11px/1.4 'Geist Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#8A8378}
.so-best.new{color:#B0865C}
.so-acts{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 10px}
.so-acts button{all:unset;cursor:pointer;padding:12px 18px;border-radius:999px;font:600 15px/1 'Geist',sans-serif;background:rgba(20,17,14,.07);color:var(--ink)}
.so-acts .go{background:var(--ink);color:#F6F3EE}
.so-acts button:focus-visible{outline:2px solid var(--car);outline-offset:2px}
.so-why[hidden]{display:none}
</style>
</head>
<body>
<header class="header">
  <div class="header-top">
    <a class="back-link" href="/index.html?openModal=writing" target="_top">← Writing</a>
    <div class="header-title"><div class="app-title">INTUITY</div><div class="app-subtitle">Writing · Practice</div></div>
    <span class="header-spacer">Level <b>B2</b></span>
  </div>
  <!-- 8 Nov 2026: the two activities sit where Learn · Practise · Play sit on the grammar pages, named for what they do -->
  <div class="pr-kindrow"><span class="pr-kind" id="kind" role="radiogroup" aria-label="Choose an activity"><button type="button" role="radio" data-v="finish">Finish it</button><button type="button" role="radio" data-v="sort">Sort it</button><button type="button" role="radio" data-v="switch">Switch it</button></span></div>
  <div class="pr-tabs" id="tabs" role="tablist" aria-label="Task"></div>
  <div class="pr-seg" id="seg" role="radiogroup" aria-label="Part"></div>
</header>
<main>
  <article class="fc-card pr-card" id="card" aria-live="polite"></article>
  <section class="so-pick" id="pick" aria-label="Where does this phrase belong?" hidden></section>
  <div class="pr-act"><button type="button" class="go" id="bCheck" hidden>Check</button><button type="button" class="go" id="bNext">Next <span aria-hidden="true">›</span></button></div>
</main>
<script src="/skills/grammar-rules/intuity-sound.js"></script>
<script src="/tools/intuity-cheer.js?v=2"></script>
<script src="/tools/intuity-log.js?v=1"></script>
<script src="/tools/be2-progress.js?v=20261105b"></script>
<script>
(async function(){
  const $=id=>document.getElementById(id);
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  let D; try{ D=await fetch('/data/writing/practice.json?v=3',{cache:'no-cache'}).then(r=>r.json()); }
  catch(e){ $('card').textContent='Could not load the practice cards.'; return; }
  const TASKS=Object.keys(D.tasks), MODES=[['full','Full'],['intro','Introduction'],['body','Body'],['end','Conclusion']], ROLE={intro:'Intro',body:'Body',end:'End'};
  const q=new URLSearchParams(location.search), mem=k=>{ try{ return localStorage.getItem('intuity.practice.'+k); }catch(e){ return null; } }, keep=(k,v)=>{ try{ localStorage.setItem('intuity.practice.'+k,v); }catch(e){} };
  let TASK=TASKS.includes(q.get('task'))?q.get('task'):TASKS.includes(mem('task'))?mem('task'):'essays';
  let MODE=MODES.some(m=>m[0]===q.get('mode'))?q.get('mode'):MODES.some(m=>m[0]===mem('mode'))?mem('mode'):'full';
  let N=0, CUR=null;
  const KINDS=['finish','sort','switch'];
  let KIND=KINDS.includes(q.get('kind'))?q.get('kind'):KINDS.includes(mem('kind'))?mem('kind'):'finish', SORT=null;
  const SORT_TASKS=['essays','reports','reviews'].filter(k=>D.tasks[k]), PARTS=[['intro','Introduction'],['body','Body'],['end','Conclusion']];
  const WHY={essays:'An essay weighs up an issue in a neutral voice.',reports:'A report is formal: findings and recommendations about a place or an event.',reviews:'A review talks to the reader and gives an opinion of something.',
    intro:'It sets the scene.',body:'It develops one point.',end:'It sums up or recommends.'};
  /* shuffled bags, so a phrase or topic does not come back until the others have */
  const bags={};
  const draw=(key,list)=>{ let b=bags[key]; if(!b||!b.length){ b=bags[key]=list.map((_,i)=>i).sort(()=>Math.random()-.5); } return list[b.pop()]; };
  const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
  /* the bank phrase dark, the topic caramel, the student's part a grey … */
  function fill(p,t,k,cls){
    return esc(p).replace(/\{T\}/g,`<span class="${cls}">${esc(cap(t))}</span>`).replace(/\{t\}/g,`<span class="${cls}">${esc(t)}</span>`).replace(/\{k\}/g,esc(k||'')).replace(/…/g,'<span class="fc-gap">…</span>');
  }
  /* FINISH IT AS A PUZZLE (8 Nov 2026, the teacher's idea): the app cannot mark a
     free ending, so nothing was at stake. Now the model ending comes back as word
     chips to tap into order, then Check. A slip keeps the words already right
     and sends the rest back for a second go; a second miss shows the line. Rounds
     of five cards, a tally, a run, a best to beat - the same game as Sort. */
  const FROUND=5;
  let FR=null;
  const usable=P=>P.ex&&P.ex.end&&/…\s*$/.test(P.p)&&(P.p.match(/…/g)||[]).length===1;
  /* chips are words, but a/an/the travel with their noun, and a long ending joins its
     shortest neighbours until there are eight chips at most: the phrases stay whole */
  const chunk=str=>{ const w=str.trim().split(/\s+/), out=[];
    for(let i=0;i<w.length;i++){ if(/^(a|an|the)$/i.test(w[i])&&i<w.length-1){ out.push(w[i]+' '+w[i+1]); i++; } else out.push(w[i]); }
    while(out.length>8){ let m=0; for(let i=1;i<out.length-1;i++) if(out[i].length+out[i+1].length<out[m].length+out[m+1].length) m=i; out.splice(m,2,out[m]+' '+out[m+1]); }
    return out; };
  const mix=n=>{ const ix=[...Array(n).keys()]; if(n<2) return ix; let g=0; do{ ix.sort(()=>Math.random()-.5); }while(ix.every((v,i)=>v===i)&&g++<9); return ix; };
  const lineOf=(s,P)=>({s,P,ans:chunk(P.ex.end),tray:null,placed:[],lock:0,tries:0,state:''});
  function newFR(same){
    const deck=same&&FR?FR.deck:[];
    FR={deck,card:0,kept:0,missed:0,run:0,best:0,n:(FR?FR.n:0)+(same?0:1),end:false,per:MODE==='full'?4:1};
  }
  function deal(){
    if(!FR||FR.end) newFR(false);
    if(FR.card>=FROUND){ FR.end=true; CUR=null; return; }
    let spec=FR.deck[FR.card];
    if(!spec){
      const T=D.tasks[TASK];
      const regs=[...new Set(T.prompts.filter(usable).map(p=>p.r).filter(Boolean))], reg=regs.length?regs[Math.floor(Math.random()*regs.length)]:null;
      const by=s=>T.prompts.filter(p=>p.s===s&&usable(p)&&(!reg||p.r===reg));
      const pick=s=>draw(TASK+':f:'+s+':'+reg,by(s));
      const two=()=>{ const a=pick('body'); let b=pick('body'), k=0; while(b===a&&k++<5) b=pick('body'); return [a,b]; };
      spec={reg,lines:MODE==='full'?[['intro',pick('intro')],...two().map(P=>['body',P]),['end',pick('end')]]:[[MODE,pick(MODE)]]};
      FR.deck[FR.card]=spec;
    }
    CUR={reg:spec.reg,lines:spec.lines.map(([s,P])=>lineOf(s,P)),at:0};
    CUR.lines.forEach(L=>L.tray=mix(L.ans.length)); N=FR.card+1;
  }
  const fhud=()=>{ const tot=FROUND*FR.per, done=FR.kept+FR.missed; return done===0?'<span class="so-hud" hidden></span>':
    `<span class="so-hud"><span><b>${FR.kept}</b> right</span><span><b>${FR.missed}</b> missed</span><span><b>${tot-done}</b> to go</span>`+
    `<span class="so-fire${FR.run>=2?' on':''}">🔥 <b>${FR.run}</b></span></span>`; };
  const head=L=>fill(L.P.p.replace(/\s*…\s*$/,' '),L.P.ex.t,L.P.ex.k,'t');
  function slot(L,i){
    if(L.state==='kept') return `<span class="fi-done">${esc(L.P.ex.end)}</span>`;
    if(L.state==='shown') return `<span class="fi-shown">${esc(L.P.ex.end)}</span>`;
    if(i!==CUR.at) return '<span class="fc-gap">…</span>';
    return L.placed.map((c,j)=>`<button type="button" class="fi-w${j<L.lock?' lock':''}" data-j="${j}">${esc(L.ans[c])}</button>`).join('')+
      (L.placed.length<L.ans.length?'<span class="fc-gap">…</span>':'');
  }
  function paint(){
    $('bNext').hidden=true;
    if(!CUR){ $('pick').hidden=true; $('bCheck').hidden=true; return paintFinishEnd(); }
    const T=D.tasks[TASK]; let prev='';
    const rows=CUR.lines.map((L,i)=>{ const role=L.s===prev?'':ROLE[L.s]; prev=L.s;
      return `<span class="fc-sec"><span class="fc-role">${role}</span><span class="fc-in"><span class="pr-p${i>CUR.at?' wait':''}">${head(L)}<span class="fi-slot" id="fs${i}">${slot(L,i)}</span></span></span></span>`; }).join('');
    $('card').innerHTML=`<span class="fc-k">Finish it · ${esc(T.label)}${CUR.reg?' · '+esc(CUR.reg):''} · Round ${FR.n}</span><span class="fc-t">${esc(T.label)} <span class="fc-n">${N}</span></span><span class="fc-bar" aria-hidden="true"></span>`+
      fhud()+`<span class="fc">${rows}</span><span class="so-why" id="soWhy" hidden></span>`;
    tray();
  }
  function tray(){
    const L=CUR.lines[CUR.at];
    $('pick').hidden=false;
    const left=L.tray.filter(c=>!L.placed.includes(c));
    $('pick').innerHTML=`<span class="so-ask">${CUR.lines.length>1?'Line '+(CUR.at+1)+' of '+CUR.lines.length+': f':'F'}inish it. Tap the words in order.</span>`+
      `<div class="fi-tray">${left.map(c=>`<button type="button" class="fi-c" data-c="${c}">${esc(L.ans[c])}</button>`).join('')}</div>`;
    $('bCheck').hidden=false; $('bCheck').disabled=L.placed.length<L.ans.length;
    /* in Full the card is tall: bring the chips into view when a new line starts */
    if(!L.placed.length&&CUR.lines.length>1){ const r=$('pick').getBoundingClientRect(); if(r.top+120>innerHeight) $('pick').scrollIntoView({block:'end',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}); }
  }
  function reslot(fresh){
    const i=CUR.at, el=$('fs'+i); if(!el) return; el.innerHTML=slot(CUR.lines[i],i);
    if(fresh!=null){ const w=el.querySelector(`.fi-w[data-j="${fresh}"]`); if(w) w.classList.add('in'); }
  }
  const tickS=()=>{ if(window.SFX) try{ if(SFX.isOn()) SFX.tick(); }catch(_){} };
  $('pick').addEventListener('click',e=>{
    if(KIND!=='finish'||!CUR) return; const b=e.target.closest('.fi-c'); if(!b) return;
    const L=CUR.lines[CUR.at]; if(L.state) return;
    L.placed.push(+b.dataset.c); tickS(); reslot(L.placed.length-1); tray();
  });
  $('card').addEventListener('click',e=>{
    if(KIND!=='finish'||!CUR) return; const w=e.target.closest('.fi-w'); if(!w||w.classList.contains('lock')) return;
    const L=CUR.lines[CUR.at]; if(L.state) return;
    L.placed.splice(+w.dataset.j,1); reslot(); tray();
  });
  function checkFinish(){
    const L=CUR&&CUR.lines[CUR.at]; if(!L||L.state||L.placed.length<L.ans.length) return;
    const got=L.placed.map(c=>L.ans[c]); let p=0; while(p<got.length&&got[p]===L.ans[p]) p++;
    const ok=p===got.length, first=!L.tries; L.tries++;
    const w=$('soWhy'), T=D.tasks[TASK], idx=T.prompts.indexOf(L.P);
    const no=L.P.no?`<span class="fi-no"><b>Not</b><s>${esc(L.P.no)}</s></span>`:'';
    let done=false;
    if(ok){ L.state='kept'; FR.kept++; FR.run++; FR.best=Math.max(FR.best,FR.run); done=true;
      w.innerHTML='<b>'+esc(pickOf(RIGHT_LINES))+'</b> '+esc(cap(T.what))+'.'+no; }
    else if(first){
      L.lock=p; L.placed=L.placed.slice(0,p); FR.run=0;
      w.innerHTML=p?`<b>Nearly!</b> The first ${p===1?'word is':p+' pieces are'} right. Try the rest.`:'<b>Not yet.</b> Start again: which piece comes first?';
    } else { L.state='shown'; FR.missed++; FR.run=0; done=true;
      w.innerHTML='<b>'+esc(pickOf(MISS_LINES))+'</b> Here’s how it goes.'+no; }
    w.hidden=false;
    if(done) try{ if(window.INTUITY) INTUITY.log('writing','finish-'+TASK+'-'+idx,ok,{game:'finish',task:TASK,part:L.s}); }catch(e){}
    const h=$('card').querySelector('.so-hud'); if(h) h.outerHTML=fhud();
    reslot(); if(!done){ tray(); if(window.Cheer) Cheer.soft(); return; }
    $('bCheck').hidden=true; $('pick').hidden=true;
    if(window.Cheer){
      if(ok){ Cheer.right($('fs'+CUR.at),first); if(FR.run>=3&&FR.run%3===0) Cheer.streak($('card').querySelector('.so-fire')); }
      else Cheer.soft();
    }
    clearTimeout(AUTO);
    const last=CUR.at>=CUR.lines.length-1;
    if(!last){ AUTO=setTimeout(()=>{ CUR.at++; $('soWhy').hidden=true; paint(); },ok?1300:2600); }
    else { FR.card++; $('bNext').hidden=false; AUTO=setTimeout(next,ok?1500:2800); }
  }
  function paintFinishEnd(){
    const tot=FROUND*FR.per, key='intuity.best.finish.'+TASK+'.'+MODE;
    try{ if(window.INTUITY) INTUITY.session('writing','finish',{kept:FR.kept,missed:FR.missed}); }catch(e){}
    let best=0; try{ best=+localStorage.getItem(key)||0; }catch(e){}
    const newBest=FR.kept>best; if(newBest) try{ localStorage.setItem(key,String(FR.kept)); }catch(e){}
    const f=FR.kept/tot, line=f===1?'Perfect round: every line in place.':f>=.75?'Great run: barely any got away.':f>=.5?'Solid work. A few worth another look.':'A tricky set: good ones to come back to.';
    $('card').innerHTML=`<span class="fc-k">Finish it · Round ${FR.n} done</span><span class="so-big">${FR.kept} / ${tot}</span>`+
      `<span class="so-praise">${esc(line)}</span>`+
      `<span class="so-sub">${FR.missed?FR.missed+' missed':'none missed'}${FR.best>=3?' · best run '+FR.best:''}</span>`+
      (newBest||best?`<span class="so-best${newBest&&best?' new':''}">${newBest?(best?'New best · beat '+best+' / '+tot:'First score to beat'):'Your best · '+best+' / '+tot}</span>`:'')+
      `<span class="so-acts"><button type="button" id="soAgain">↻ These again</button><button type="button" class="go" id="soNext">Next five →</button></span>`;
    $('soAgain').onclick=()=>{ newFR(true); deal(); paint(); };
    $('soNext').onclick=()=>{ newFR(false); deal(); paint(); };
    if(window.Cheer){ const big=$('card').querySelector('.so-big'); if(FR.kept===tot) Cheer.finale(); else if(newBest&&best) Cheer.streak(big); else if(f>=.75) Cheer.done(big); else Cheer.tick(big); }
  }
  /* SORT IN ROUNDS (8 Nov 2026, after the vocabulary Rack, Pegs and Pairs):
     nine phrases a round and a live tally - kept, missed, left, and a 🔥 run
     from two in a row. A miss is not the end of that phrase: it comes back
     three cards later for a second go. Three in a row is a fanfare. After
     nine, the round's card: 7 / 9, a line of praise, the same nine again or
     the next nine. Every answer is written to the INTUITY log, so practising
     here keeps the home page's streak alive. The next card comes by itself. */
  const ROUND=9, RIGHT_LINES=['Nice catch!','Exactly right!','Straight to it!','Sharp eyes!','Right in one!','Got it!'],
        AGAIN_LINES=['So close: it comes back in a moment.','Good guess: you will see it again.'],
        MISS_LINES=['Worth remembering.','Keep going!'];
  const pickOf=a=>a[Math.floor(Math.random()*a.length)];
  let RD=null, AUTO=null;
  function newRound(same){
    const all=SORT_TASKS.flatMap(k=>D.tasks[k].prompts.map((P,i)=>({k,P,id:'sort-'+k+'-'+i})));
    const items=same&&RD?RD.items.map(x=>({k:x.k,P:x.P,id:x.id})):Array.from({length:ROUND},()=>draw('sort',all));
    RD={items,q:items.map((_,i)=>i),pos:0,kept:0,missed:0,run:0,best:0,n:(RD?RD.n:0)+(same?0:1),end:false};
    items.forEach(x=>{ x.tries=0; x.state=''; });
  }
  function dealSort(){
    clearTimeout(AUTO);
    if(!RD||RD.end) newRound(false);
    if(RD.pos>=RD.q.length){ RD.end=true; SORT=null; return; }
    SORT=RD.items[RD.q[RD.pos]]; SORT.pick={};
  }
  /* the tally appears once there is something to count (8 Nov 2026: a first-timer saw three zeros to decode) */
  const hud=()=>(RD.pos===0)?'<span class="so-hud" hidden></span>':
    `<span class="so-hud"><span><b>${RD.kept}</b> right</span><span><b>${RD.missed}</b> missed</span><span><b>${ROUND-RD.kept-RD.missed}</b> to go</span>`+
    `<span class="so-fire${RD.run>=2?' on':''}">🔥 <b>${RD.run}</b></span></span>`;
  function paintSort(){
    $('bNext').hidden=true;   /* Next appears after Check; before that it only skipped */
    if(!SORT){ $('pick').hidden=true; $('bCheck').hidden=true; return paintEnd(); }
    const {k,P}=SORT, txt=esc(P.p).replace(/\{T\}|\{t\}|\{k\}/g,'…').replace(/…(\s*…)+/g,'…').replace(/…/g,'<span class="fc-gap">…</span>');
    const row=(name,list)=>`<div class="so-row" role="radiogroup" aria-label="${name==='task'?'Which task':'Which part'}" data-r="${name}">`+list.map(([v,l])=>`<button type="button" role="radio" aria-checked="false" data-v="${v}"><span class="pl">${l}</span><span class="dot" aria-hidden="true"></span></button>`).join('')+`</div>`;
    $('card').innerHTML=`<span class="fc-k">Sort · Round ${RD.n}${SORT.tries?' · second go':''}</span><span class="fc-t">Sort <span class="fc-n">${RD.kept+RD.missed+1}</span></span><span class="fc-bar" aria-hidden="true"></span>`+
      hud()+`<span class="so-p">${txt}</span>`+
      `<span class="so-why" id="soWhy" hidden></span>`;
    /* 8 Nov 2026, from the teacher's sketch: the card holds only the phrase; the choices sit under it,
       a dot under each to fill, and Check when both are filled, so a pupil can change their mind first */
    $('pick').hidden=false;
    $('pick').innerHTML=`<span class="so-ask">Where does this phrase belong?</span>`+row('task',SORT_TASKS.map(t=>[t,D.tasks[t].label]))+row('part',PARTS);
    $('bCheck').hidden=false; $('bCheck').disabled=true;
    $('pick').querySelectorAll('.so-row').forEach(r=>r.onclick=e=>{ const b=e.target.closest('button'); if(!b||r.classList.contains('done')) return;
      r.querySelectorAll('button').forEach(x=>x.setAttribute('aria-checked',String(x===b))); SORT.pick[r.dataset.r]=b.dataset.v;
      if(window.SFX) try{ if(SFX.isOn()) SFX.tick(); }catch(_){}
      $('bCheck').disabled=!(SORT.pick.task&&SORT.pick.part); });
  }
  function checkSort(){
    if(!SORT||!SORT.pick.task||!SORT.pick.part||$('pick').querySelector('.so-row.done')) return;
    $('bCheck').hidden=true;
    const x=SORT, {k,P}=x, okT=x.pick.task===k, okP=x.pick.part===P.s, ok=okT&&okP, first=!x.tries; x.tries++;
    $('pick').querySelectorAll('.so-row').forEach(r=>{ r.classList.add('done'); const want=r.dataset.r==='task'?k:P.s;
      r.querySelectorAll('button').forEach(b=>{ const v=b.dataset.v, mine=b.getAttribute('aria-checked')==='true';
        b.classList.toggle('ok',v===want); b.classList.toggle('no',mine&&v!==want); }); });
    let head;
    if(ok){ x.state='kept'; RD.kept++; RD.run++; RD.best=Math.max(RD.best,RD.run); head=pickOf(RIGHT_LINES); }
    else if(first){ RD.run=0; head=pickOf(AGAIN_LINES); RD.q.splice(Math.min(RD.pos+4,RD.q.length),0,RD.q[RD.pos]); }   /* it comes back */
    else { x.state='missed'; RD.missed++; RD.run=0; head=pickOf(MISS_LINES); }
    RD.pos++;
    const T=D.tasks[k].label, Pt=PARTS.find(y=>y[0]===P.s)[1];
    const w=$('soWhy'); w.hidden=false;
    w.innerHTML='<b>'+esc(head)+'</b> '+(ok?'':'It’s <b>'+esc(T)+' · '+esc(Pt)+'</b>. ')+esc(okT?(ok?WHY[k]:''):WHY[k])+(okP||ok?'':' '+esc(WHY[P.s]));
    const h=$('card').querySelector('.so-hud'); if(h) h.outerHTML=hud();
    if(window.Cheer){
      if(ok){ $('pick').querySelectorAll('.so-row button.ok .pl').forEach(b=>Cheer.right(b,first));
        if(RD.run>=3&&RD.run%3===0) Cheer.streak($('card').querySelector('.so-fire')); }
      else Cheer.soft();
    }
    try{ if(window.INTUITY) INTUITY.log('writing',x.id,ok,{game:'sort',task:k,part:P.s}); }catch(e){}
    $('bNext').hidden=false;
    clearTimeout(AUTO); AUTO=setTimeout(next,ok?1400:2600);   /* the next card comes by itself; Next skips the wait */
  }
  function praise(n){ const f=n/ROUND; return f===1?'Perfect round: every one sorted.':f>=.75?'Great run: barely any got away.':f>=.5?'Solid work. A few worth another look.':'A tricky set: good ones to come back to.'; }
  function paintEnd(){
    $('bNext').hidden=true;
    try{ if(window.INTUITY) INTUITY.session('writing','sort',{kept:RD.kept,missed:RD.missed}); }catch(e){}
    /* a score to beat: your own best round (8 Nov 2026) */
    let best=0; try{ best=+localStorage.getItem('intuity.best.sort')||0; }catch(e){}
    const newBest=RD.kept>best; if(newBest) try{ localStorage.setItem('intuity.best.sort',String(RD.kept)); }catch(e){}
    $('card').innerHTML=`<span class="fc-k">Sort · Round ${RD.n} done</span><span class="so-big">${RD.kept} / ${ROUND}</span>`+
      `<span class="so-praise">${esc(praise(RD.kept))}</span>`+
      `<span class="so-sub">${RD.missed?RD.missed+' missed':'none missed'}${RD.best>=3?' · best run '+RD.best:''}</span>`+
      (newBest||best?`<span class="so-best${newBest&&best?' new':''}">${newBest?(best?'New best · beat '+best+' / '+ROUND:'First score to beat'):'Your best · '+best+' / '+ROUND}</span>`:'')+
      `<span class="so-acts"><button type="button" id="soAgain">↻ These nine again</button><button type="button" class="go" id="soNext">Next nine →</button></span>`;
    $('soAgain').onclick=()=>{ newRound(true); dealSort(); paintSort(); };
    $('soNext').onclick=()=>{ newRound(false); dealSort(); paintSort(); };
    if(window.Cheer){ const big=$('card').querySelector('.so-big'); if(RD.kept===ROUND) Cheer.finale(); else if(newBest&&best) Cheer.streak(big); else if(RD.kept>=7) Cheer.done(big); else Cheer.tick(big); }
  }
  /* SWITCH IT (9 Nov 2026, the teacher's point that emails feel familiar and essays alien):
     an idea said to a friend, and three essay versions. One keeps the idea in the essay
     voice; one is still chatty; one is formal but holds a grammar slip. Rounds of eight,
     a miss comes back once, then the line that shows what changed. */
  const SWR=8; let SW=null, SWD=null, SWI=null;
  async function swData(){ if(SWD) return SWD; try{ SWD=(await fetch('/data/writing/switch.json?v=1',{cache:'no-cache'}).then(r=>r.json())).items; }catch(e){ SWD=[]; } return SWD; }
  function newSwitch(same){
    const items=same&&SW?SW.items:Array.from({length:Math.min(SWR,SWD.length)},()=>draw('switch',SWD.map((x,i)=>i)));
    SW={items,q:items.map((_,i)=>i),pos:0,kept:0,missed:0,run:0,best:0,tries:{},n:(SW?SW.n:0)+(same?0:1),end:false};
  }
  function dealSwitch(){ clearTimeout(AUTO); if(!SW||SW.end) newSwitch(false); if(SW.pos>=SW.q.length){ SW.end=true; SWI=null; return; }
    const k=SW.q[SW.pos], it=SWD[SW.items[k]];
    SWI={k,it,opts:[{t:it.ok,ok:true}].concat(it.no.map(x=>({t:x.t,why:x.why}))).sort(()=>Math.random()-.5),pick:-1,done:false}; }
  const swhud=()=>{ const n=SW.kept+SW.missed; return n===0&&SW.pos===0?'<span class="so-hud" hidden></span>':
    `<span class="so-hud"><span><b>${SW.kept}</b> right</span><span><b>${SW.missed}</b> missed</span><span><b>${SW.items.length-n}</b> to go</span><span class="so-fire${SW.run>=2?' on':''}">🔥 <b>${SW.run}</b></span></span>`; };
  function paintSwitch(){
    $('bNext').hidden=true;
    if(!SWI){ $('pick').hidden=true; $('bCheck').hidden=true; return paintSwitchEnd(); }
    const second=SW.tries[SWI.k];
    $('card').innerHTML=`<span class="fc-k">Switch it · Round ${SW.n}${second?' · second go':''}</span><span class="fc-t">Switch <span class="fc-n">${SW.kept+SW.missed+1}</span></span><span class="fc-bar" aria-hidden="true"></span>`+
      swhud()+`<span class="sw-from">To a friend, in an email</span><span class="sw-e">${esc(SWI.it.e)}</span><span class="so-why" id="soWhy" hidden></span>`;
    $('pick').hidden=false;
    $('pick').innerHTML=`<span class="so-ask">Which is the same idea in an essay?</span><div class="sw-opts" role="radiogroup" aria-label="Essay versions">`+
      SWI.opts.map((o,i)=>`<button type="button" class="sw-o" role="radio" aria-checked="false" data-i="${i}"><span class="dot" aria-hidden="true"></span><span><span class="tx">${esc(o.t)}</span></span></button>`).join('')+`</div>`;
    $('bCheck').hidden=false; $('bCheck').disabled=true;
  }
  $('pick').addEventListener('click',e=>{
    if(KIND!=='switch'||!SWI||SWI.done) return; const b=e.target.closest('.sw-o'); if(!b) return;
    SWI.pick=+b.dataset.i; $('pick').querySelectorAll('.sw-o').forEach(x=>x.setAttribute('aria-checked',String(x===b))); tickS(); $('bCheck').disabled=false;
  });
  function checkSwitch(){
    if(!SWI||SWI.done||SWI.pick<0) return; SWI.done=true; $('bCheck').hidden=true;
    const o=SWI.opts[SWI.pick], ok=!!o.ok, first=!SW.tries[SWI.k]; SW.tries[SWI.k]=(SW.tries[SWI.k]||0)+1;
    const box=$('pick').querySelector('.sw-opts'); box.classList.add('done');
    box.querySelectorAll('.sw-o').forEach((b,i)=>{ const x=SWI.opts[i]; if(x.ok) b.classList.add('ok'); else if(i===SWI.pick){ b.classList.add('no'); b.children[1].insertAdjacentHTML('beforeend','<span class="why">'+esc(x.why)+'</span>'); } });
    let head;
    if(ok){ SW.kept++; SW.run++; SW.best=Math.max(SW.best,SW.run); head=pickOf(RIGHT_LINES); }
    else if(first){ SW.run=0; head=pickOf(AGAIN_LINES); SW.q.splice(Math.min(SW.pos+4,SW.q.length),0,SW.q[SW.pos]); }
    else { SW.missed++; SW.run=0; head=pickOf(MISS_LINES); }
    SW.pos++;
    const w=$('soWhy'); w.hidden=false; w.innerHTML='<b>'+esc(head)+'</b><span class="sw-t">'+esc(SWI.it.t)+'</span>';
    const h=$('card').querySelector('.so-hud'); if(h) h.outerHTML=swhud();
    try{ if(window.INTUITY) INTUITY.log('writing','switch-'+SW.items[SWI.k],ok,{game:'switch'}); }catch(e){}
    if(window.Cheer){ if(ok){ Cheer.right(box.querySelector('.sw-o.ok .dot'),first); if(SW.run>=3&&SW.run%3===0) Cheer.streak($('card').querySelector('.so-fire')); } else Cheer.soft(); }
    $('bNext').hidden=false;
    /* a right answer moves on by itself; after a slip the page waits, so the change can be read */
    clearTimeout(AUTO); if(ok) AUTO=setTimeout(next,2600);
  }
  function paintSwitchEnd(){
    const tot=SW.items.length;
    try{ if(window.INTUITY) INTUITY.session('writing','switch',{kept:SW.kept,missed:SW.missed}); }catch(e){}
    let best=0; try{ best=+localStorage.getItem('intuity.best.switch')||0; }catch(e){}
    const newBest=SW.kept>best; if(newBest) try{ localStorage.setItem('intuity.best.switch',String(SW.kept)); }catch(e){}
    const f=SW.kept/tot, line=f===1?'Perfect round: every switch in the essay voice.':f>=.75?'Great run: you hear the difference.':f>=.5?'Solid work. A few worth another look.':'A tricky set: good ones to come back to.';
    $('card').innerHTML=`<span class="fc-k">Switch it · Round ${SW.n} done</span><span class="so-big">${SW.kept} / ${tot}</span><span class="so-praise">${esc(line)}</span>`+
      `<span class="so-sub">${SW.missed?SW.missed+' missed':'none missed'}${SW.best>=3?' · best run '+SW.best:''}</span>`+
      (newBest||best?`<span class="so-best${newBest&&best?' new':''}">${newBest?(best?'New best · beat '+best+' / '+tot:'First score to beat'):'Your best · '+best+' / '+tot}</span>`:'')+
      `<span class="so-acts"><button type="button" id="soAgain">↻ These again</button><button type="button" class="go" id="soNext">Next eight →</button></span>`;
    $('soAgain').onclick=()=>{ newSwitch(true); dealSwitch(); paintSwitch(); };
    $('soNext').onclick=()=>{ newSwitch(false); dealSwitch(); paintSwitch(); };
    if(window.Cheer){ const big=$('card').querySelector('.so-big'); if(SW.kept===tot) Cheer.finale(); else if(newBest&&best) Cheer.streak(big); else if(f>=.75) Cheer.done(big); else Cheer.tick(big); }
  }
  async function start(){ if(KIND==='sort'){ dealSort(); paintSort(); } else if(KIND==='switch'){ await swData(); dealSwitch(); paintSwitch(); } else { deal(); paint(); } }
  function next(){
    /* finishing cards is its own run: every fifth card, a jingle */
    clearTimeout(AUTO); if(KIND==='sort'&&RD&&RD.end) return; if(KIND==='finish'&&(!CUR||FR.end)) return; if(KIND==='switch'&&(!SW||SW.end)) return;
    const c=$('card'), go=start;
    if(matchMedia('(prefers-reduced-motion: reduce)').matches){ go(); return; }
    c.classList.add('out'); setTimeout(()=>{ go(); c.classList.remove('out'); c.classList.add('in'); requestAnimationFrame(()=>requestAnimationFrame(()=>c.classList.remove('in'))); },150);
  }
  function kind(){
    document.body.classList.toggle('sorting',KIND!=='finish');
    $('kind').querySelectorAll('button').forEach(b=>b.setAttribute('aria-checked',String(b.dataset.v===KIND)));
  }
  $('kind').onclick=e=>{ const b=e.target.closest('button'); if(!b||b.dataset.v===KIND) return; KIND=b.dataset.v; keep('kind',KIND); clearTimeout(AUTO); FR=null; kind();
    if(typeof room==='function') room(); start(); };
  function chrome(){
    $('tabs').innerHTML=TASKS.map(k=>`<button type="button" class="pr-tab" role="tab" data-k="${k}" aria-selected="${k===TASK}">${esc(D.tasks[k].label)}</button>`).join('');
    $('seg').innerHTML=MODES.map(([m,l])=>`<button type="button" role="radio" data-m="${m}" aria-checked="${m===MODE}">${l}</button>`).join('');
  }
  $('tabs').onclick=e=>{ const b=e.target.closest('.pr-tab'); if(!b||b.dataset.k===TASK) return; TASK=b.dataset.k; keep('task',TASK); clearTimeout(AUTO); FR=null; chrome(); deal(); paint(); };
  $('seg').onclick=e=>{ const b=e.target.closest('button'); if(!b||b.dataset.m===MODE) return; MODE=b.dataset.m; keep('mode',MODE); clearTimeout(AUTO); FR=null; chrome(); deal(); paint(); };
  $('bNext').onclick=next;
  $('bCheck').onclick=()=>KIND==='sort'?checkSort():KIND==='switch'?checkSwitch():checkFinish();
  /* no swipe: both games are answered first, and a swipe skipped the card unscored */
  /* the shell's header is fixed: the card starts under it */
  const room=()=>{ const h=document.querySelector('.header'); if(h) document.documentElement.style.setProperty('--hh',Math.round(h.getBoundingClientRect().height)+'px'); };
  addEventListener('resize',room);
  chrome(); kind(); room(); start();
})();
</script>
</body>
