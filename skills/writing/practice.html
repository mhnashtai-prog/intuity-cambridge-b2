<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>INTUITY — Writing · Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..900&family=Geist+Mono:wght@400..600&family=Space+Grotesk:wght@700&family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=20261105">
<link rel="stylesheet" href="/tools/five-card.css?v=6">
<style>
/* PRACTICE (8 Nov 2026, the teacher's idea): finish a sentence from the
   phrase bank about something you know - my phone, my city, homework, the
   school canteen. Producing the rest of a phrase about your own life is what
   makes it stick; the prompt always stops where the marks are (an opinion,
   a reason, a formal finding). One card at a time, as many as you like. */
:root{--ink:#14110E;--grey:#8A8378;--car:#B0865C;--car2:#8E6238;--rule:rgba(20,17,14,.12)}
body{background:#F2EFEA;color:var(--ink);margin:0;font-family:'Geist',system-ui,sans-serif;min-height:100dvh;display:flex;flex-direction:column}
.pr-tabs{display:flex;justify-content:safe center;gap:0;padding:4px 16px 0;overflow-x:auto;scrollbar-width:none}
.pr-tabs::-webkit-scrollbar{display:none}
.pr-tab{all:unset;cursor:pointer;padding:8px 8px 7px;font:600 11.5px/1 'Geist Mono',ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:#9A948B;border-bottom:2px solid transparent;white-space:nowrap}
.pr-tab[aria-selected=true]{color:var(--ink);border-bottom-color:#D8915C}
.pr-tab:focus-visible{outline:2px solid var(--car);outline-offset:2px}
.pr-seg{display:flex;justify-content:center;margin:10px auto 10px;padding:3px;border-radius:999px;background:rgba(20,17,14,.06);width:max-content;max-width:calc(100% - 32px)}
.pr-seg button{all:unset;cursor:pointer;padding:7px 13px;border-radius:999px;font:600 12.5px/1 'Geist',sans-serif;color:#8A8378;white-space:nowrap}
.pr-seg button[aria-checked=true]{background:var(--ink);color:#F6F3EE}
.pr-seg button:focus-visible{outline:2px solid var(--car);outline-offset:2px}
main{flex:1;display:flex;flex-direction:column;align-items:center;padding:calc(var(--hh,190px) + 14px) 16px calc(24px + env(safe-area-inset-bottom))}
.pr-card{width:100%;max-width:520px;box-shadow:0 10px 30px rgba(20,17,14,.08);border-radius:8px!important;padding:18px 18px 6px!important;touch-action:pan-y}
.pr-card .fc-t{font-size:clamp(34px,10vw,44px)!important;margin-top:10px}
.pr-card .fc-bar{width:40px;height:4px;margin-top:10px}
.pr-card .fc{margin-top:16px}
.pr-p{display:block;font-size:clamp(17px,4.6vw,19px);line-height:1.5;color:var(--ink);font-weight:500}
.pr-p .t{color:var(--car2)}
.pr-p .fc-gap{color:#B4ADA2}
.pr-ex{display:block;margin-top:10px;padding-top:10px;border-top:1px dashed rgba(20,17,14,.14);font-size:15px;line-height:1.5;color:#6A625A}
.pr-ex[hidden]{display:none}
.pr-ex .about{display:block;font:500 10.5px/1.3 'Geist Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#9A948B;margin-bottom:4px}
.pr-ex .ph{color:var(--ink);font-weight:500}
.pr-ex .no{display:block;margin-top:6px;color:#A39B90}
.pr-ex .no s{text-decoration-color:#B0865C;text-decoration-thickness:1.5px}
.pr-ex .no b{font:600 10.5px/1 'Geist Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#9A5A2C;margin-right:6px;text-decoration:none}
.pr-turn{display:block;margin:4px 0 12px;font-size:12.5px;color:var(--grey)}
.pr-act{display:flex;gap:10px;justify-content:center;margin-top:18px}
.pr-act button{all:unset;cursor:pointer;padding:12px 22px;border-radius:999px;font:600 15px/1 'Geist',sans-serif;background:rgba(20,17,14,.07);color:var(--ink)}
.pr-act .go{background:var(--ink);color:#F6F3EE;display:inline-flex;align-items:center;gap:8px}
.pr-act button:focus-visible{outline:2px solid var(--car);outline-offset:2px}
.pr-act button:active{transform:scale(.97)}
.pr-card.out{opacity:0;transform:translateX(-16px);transition:opacity .14s ease,transform .14s ease}
.pr-card.in{opacity:0;transform:translateX(16px)}
.pr-card{transition:opacity .16s ease,transform .16s ease}
@media (prefers-reduced-motion:reduce){ .pr-card{transition:none} }
</style>
</head>
<body>
<header class="header">
  <div class="header-top">
    <a class="back-link" href="/index.html?openModal=writing" target="_top">← Writing</a>
    <div class="header-title"><div class="app-title">INTUITY</div><div class="app-subtitle">Writing · Practice</div></div>
    <span class="header-spacer">Level <b>B2</b></span>
  </div>
  <div class="pr-tabs" id="tabs" role="tablist" aria-label="Task"></div>
  <div class="pr-seg" id="seg" role="radiogroup" aria-label="Part"></div>
</header>
<main>
  <article class="fc-card pr-card" id="card" aria-live="polite"></article>
  <div class="pr-act"><button type="button" id="bEx" aria-expanded="false">Example</button><button type="button" class="go" id="bNext">Next <span aria-hidden="true">›</span></button></div>
</main>
<script>
(async function(){
  const $=id=>document.getElementById(id);
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  let D; try{ D=await fetch('/data/writing/practice.json?v=2',{cache:'no-cache'}).then(r=>r.json()); }
  catch(e){ $('card').textContent='Could not load the practice cards.'; return; }
  const TASKS=Object.keys(D.tasks), MODES=[['full','Full'],['intro','Introduction'],['body','Body'],['end','Conclusion']], ROLE={intro:'Intro',body:'Body',end:'End'};
  const q=new URLSearchParams(location.search), mem=k=>{ try{ return localStorage.getItem('intuity.practice.'+k); }catch(e){ return null; } }, keep=(k,v)=>{ try{ localStorage.setItem('intuity.practice.'+k,v); }catch(e){} };
  let TASK=TASKS.includes(q.get('task'))?q.get('task'):TASKS.includes(mem('task'))?mem('task'):'essays';
  let MODE=MODES.some(m=>m[0]===q.get('mode'))?q.get('mode'):MODES.some(m=>m[0]===mem('mode'))?mem('mode'):'full';
  let N=0, CUR=null;
  /* shuffled bags, so a phrase or topic does not come back until the others have */
  const bags={};
  const draw=(key,list)=>{ let b=bags[key]; if(!b||!b.length){ b=bags[key]=list.map((_,i)=>i).sort(()=>Math.random()-.5); } return list[b.pop()]; };
  const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
  /* the bank phrase dark, the topic caramel, the student's part a grey … */
  function fill(p,t,k,cls){
    return esc(p).replace(/\{T\}/g,`<span class="${cls}">${esc(cap(t))}</span>`).replace(/\{t\}/g,`<span class="${cls}">${esc(t)}</span>`).replace(/\{k\}/g,esc(k||'')).replace(/…/g,'<span class="fc-gap">…</span>');
  }
  function exHTML(P){
    const e=P.ex; let s;
    if(e.full) s=esc(e.full);
    else { const head=P.p.replace(/\s*…\s*$/,' ').replace(/\{T\}/g,cap(e.t)).replace(/\{t\}/g,e.t).replace(/\{k\}/g,e.k||'');
      s=`<span class="ph">${esc(head.replace(/…/g,'').trimEnd())}</span> ${esc(e.end)}`; }
    const no=P.no?`<span class="no"><b>Not</b><s>${esc(P.no)}</s></span>`:'';
    return `<span class="about">About ${esc(e.t)}</span>${s}${no}`;
  }
  function deal(){
    const T=D.tasks[TASK], top=draw(TASK+':topic',T.topics);
    /* an email keeps one register: formal to an organisation, friendly to a friend */
    const regs=[...new Set(T.prompts.map(p=>p.r).filter(Boolean))], reg=regs.length?regs[Math.floor(Math.random()*regs.length)]:null;
    const by=s=>T.prompts.filter(p=>p.s===s&&(!reg||p.r===reg));
    const pick=s=>draw(TASK+':'+s+':'+reg,by(s));
    /* two different body lines, even when the shuffled pile runs out between them */
    const two=()=>{ const a=pick('body'); let b=pick('body'), k=0; while(b===a&&k++<5) b=pick('body'); return [a,b]; };
    const parts=MODE==='full'?[['intro',[pick('intro')]],['body',two()],['end',[pick('end')]]]:[[MODE,[pick(MODE)]]];
    CUR={top,parts,reg}; N++;
  }
  function paint(){
    const T=D.tasks[TASK], [t,k]=CUR.top;
    const sec=([s,ps])=>`<span class="fc-sec"><span class="fc-role">${ROLE[s]}</span><span class="fc-in">`+
      ps.map(P=>`<span class="pr-p">${fill(P.p,t,k,'t')}</span><span class="pr-ex" hidden>${exHTML(P)}</span>`).join('')+`</span></span>`;
    $('card').innerHTML=`<span class="fc-k">Practice · ${esc(T.label)}${CUR.reg?' · '+esc(CUR.reg):''}</span><span class="fc-t">${esc(T.label)} <span class="fc-n">${N}</span></span><span class="fc-bar" aria-hidden="true"></span>`+
      `<span class="fc">${CUR.parts.map(sec).join('')}</span><span class="pr-turn">Finish it aloud or on paper: ${esc(T.what)}.</span>`;
    $('bEx').setAttribute('aria-expanded','false'); $('bEx').textContent='Example';
  }
  function next(){
    const c=$('card'), go=()=>{ deal(); paint(); };
    if(matchMedia('(prefers-reduced-motion: reduce)').matches){ go(); return; }
    c.classList.add('out'); setTimeout(()=>{ go(); c.classList.remove('out'); c.classList.add('in'); requestAnimationFrame(()=>requestAnimationFrame(()=>c.classList.remove('in'))); },150);
  }
  function chrome(){
    $('tabs').innerHTML=TASKS.map(k=>`<button type="button" class="pr-tab" role="tab" data-k="${k}" aria-selected="${k===TASK}">${esc(D.tasks[k].label)}</button>`).join('');
    $('seg').innerHTML=MODES.map(([m,l])=>`<button type="button" role="radio" data-m="${m}" aria-checked="${m===MODE}">${l}</button>`).join('');
  }
  $('tabs').onclick=e=>{ const b=e.target.closest('.pr-tab'); if(!b||b.dataset.k===TASK) return; TASK=b.dataset.k; keep('task',TASK); N=0; chrome(); deal(); paint(); };
  $('seg').onclick=e=>{ const b=e.target.closest('button'); if(!b||b.dataset.m===MODE) return; MODE=b.dataset.m; keep('mode',MODE); chrome(); deal(); paint(); };
  $('bNext').onclick=next;
  $('bEx').onclick=()=>{ const open=$('bEx').getAttribute('aria-expanded')!=='true';
    document.querySelectorAll('.pr-ex').forEach(x=>x.hidden=!open); $('bEx').setAttribute('aria-expanded',String(open)); $('bEx').textContent=open?'Hide example':'Example'; };
  /* a swipe to the left is Next */
  let x0=null,y0=0;
  $('card').addEventListener('touchstart',e=>{ x0=e.touches[0].clientX; y0=e.touches[0].clientY; },{passive:true});
  $('card').addEventListener('touchend',e=>{ if(x0===null) return; const t=e.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0; x0=null;
    if(dx<-50&&Math.abs(dx)>Math.abs(dy)*1.4) next(); },{passive:true});
  /* the shell's header is fixed: the card starts under it */
  const room=()=>{ const h=document.querySelector('.header'); if(h) document.documentElement.style.setProperty('--hh',Math.round(h.getBoundingClientRect().height)+'px'); };
  addEventListener('resize',room);
  chrome(); room(); deal(); paint();
})();
</script>
</body>
</html>
