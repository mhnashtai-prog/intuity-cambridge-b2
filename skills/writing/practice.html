<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>INTUITY — Writing · Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..900&family=Geist+Mono:wght@400..600&family=Space+Grotesk:wght@700&family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=20261105">
<link rel="stylesheet" href="/tools/five-card.css?v=6">
<style>
/* PRACTICE (8 Nov 2026, the teacher's idea): finish a sentence from the
   phrase bank about something you know - my phone, my city, homework, the
   school canteen. Producing the rest of a phrase about your own life is what
   makes it stick; the prompt always stops where the marks are (an opinion,
   a reason, a formal finding). One card at a time, as many as you like. */
:root{--ink:#14110E;--grey:#8A8378;--car:#B0865C;--car2:#8E6238;--rule:rgba(20,17,14,.12)}
body{background:#F2EFEA;color:var(--ink);margin:0;font-family:'Geist',system-ui,sans-serif;min-height:100dvh;display:flex;flex-direction:column}
.pr-tabs{display:flex;justify-content:safe center;gap:0;padding:4px 16px 0;overflow-x:auto;scrollbar-width:none}
.pr-tabs::-webkit-scrollbar{display:none}
.pr-tab{all:unset;cursor:pointer;padding:8px 8px 7px;font:600 11.5px/1 'Geist Mono',ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:#9A948B;border-bottom:2px solid transparent;white-space:nowrap}
.pr-tab[aria-selected=true]{color:var(--ink);border-bottom-color:#D8915C}
.pr-tab:focus-visible{outline:2px solid var(--car);outline-offset:2px}
.pr-seg{display:flex;justify-content:center;margin:10px auto 10px;padding:3px;border-radius:999px;background:rgba(20,17,14,.06);width:max-content;max-width:calc(100% - 32px)}
.pr-seg button{all:unset;cursor:pointer;padding:7px 13px;border-radius:999px;font:600 12.5px/1 'Geist',sans-serif;color:#8A8378;white-space:nowrap}
.pr-seg button[aria-checked=true]{background:var(--ink);color:#F6F3EE}
.pr-seg button:focus-visible{outline:2px solid var(--car);outline-offset:2px}
main{flex:1;display:flex;flex-direction:column;align-items:center;padding:calc(var(--hh,190px) + 14px) 16px calc(24px + env(safe-area-inset-bottom))}
.pr-card{width:100%;max-width:520px;box-shadow:0 10px 30px rgba(20,17,14,.08);border-radius:8px!important;padding:18px 18px 6px!important;touch-action:pan-y}
.pr-card .fc-t{font-size:clamp(34px,10vw,44px)!important;margin-top:10px}
.pr-card .fc-bar{width:40px;height:4px;margin-top:10px}
.pr-card .fc{margin-top:16px}
.pr-p{display:block;font-size:clamp(17px,4.6vw,19px);line-height:1.5;color:var(--ink);font-weight:500}
.pr-p .t{color:var(--car2)}
.pr-p .fc-gap{color:#B4ADA2}
.pr-ex{display:block;margin-top:10px;padding-top:10px;border-top:1px dashed rgba(20,17,14,.14);font-size:15px;line-height:1.5;color:#6A625A}
.pr-ex[hidden]{display:none}
.pr-ex .about{display:block;font:500 10.5px/1.3 'Geist Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#9A948B;margin-bottom:4px}
.pr-ex .ph{color:var(--ink);font-weight:500}
.pr-ex .no{display:block;margin-top:6px;color:#A39B90}
.pr-ex .no s{text-decoration-color:#B0865C;text-decoration-thickness:1.5px}
.pr-ex .no b{font:600 10.5px/1 'Geist Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#9A5A2C;margin-right:6px;text-decoration:none}
.pr-turn{display:block;margin:4px 0 12px;font-size:12.5px;color:var(--grey)}
.pr-act{display:flex;gap:10px;justify-content:center;margin-top:18px}
.pr-act button{all:unset;cursor:pointer;padding:12px 22px;border-radius:999px;font:600 15px/1 'Geist',sans-serif;background:rgba(20,17,14,.07);color:var(--ink)}
.pr-act .go{background:var(--ink);color:#F6F3EE;display:inline-flex;align-items:center;gap:8px}
.pr-act button[hidden]{display:none}
.pr-act button:focus-visible{outline:2px solid var(--car);outline-offset:2px}
.pr-act button:active{transform:scale(.97)}
.pr-card.out{opacity:0;transform:translateX(-16px);transition:opacity .14s ease,transform .14s ease}
.pr-card.in{opacity:0;transform:translateX(16px)}
.pr-card{transition:opacity .16s ease,transform .16s ease}
@media (prefers-reduced-motion:reduce){ .pr-card{transition:none} }
/* SORT (8 Nov 2026, the teacher's idea): which task, which part? Two rows of
   pills; the card checks itself once both are chosen. The topic is hidden, so
   the phrase alone has to tell. */
.pr-kindwrap{background:none!important;padding:0!important}
.pr-kind{display:inline-flex;padding:2px;border-radius:999px;background:rgba(20,17,14,.06)}
.pr-kind button{all:unset;cursor:pointer;padding:5px 10px;border-radius:999px;font:600 11.5px/1 'Geist',sans-serif;letter-spacing:0;text-transform:none;color:#8A8378}
.pr-kind button[aria-checked=true]{background:#14110E;color:#F6F3EE}
.pr-kind button:focus-visible{outline:2px solid var(--car);outline-offset:2px}
body.sorting #tabs,body.sorting #seg,body.sorting #bEx{display:none}
.so-p{display:block;margin:18px 0 6px;font-size:clamp(18px,4.8vw,20px);line-height:1.5;font-weight:500;color:var(--ink)}
.so-p .fc-gap{color:#B4ADA2}
.so-q{display:block;margin:16px 0 6px;font:500 10.5px/1.3 'Geist Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#9A948B}
.so-row{display:flex;padding:3px;border-radius:999px;background:rgba(20,17,14,.06)}
.so-row button{all:unset;cursor:pointer;flex:1;text-align:center;padding:10px 4px;border-radius:999px;font:600 14px/1 'Geist',sans-serif;color:#5C5852}
.so-row button[aria-checked=true]{background:#14110E;color:#F6F3EE}
.so-row button.ok{background:#4F6B61;color:#fff}
.so-row button.no{background:rgba(176,134,92,.22);color:#7A5C3A;text-decoration:line-through}
.so-row button:focus-visible{outline:2px solid var(--car);outline-offset:2px}
.so-row.done button{cursor:default}
.so-why{display:block;margin:16px 0 8px;padding-top:12px;border-top:1px dashed rgba(20,17,14,.14);font-size:14.5px;line-height:1.5;color:#5C5852}
.so-why b{color:var(--ink)}
.so-hud{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:14px;font:500 11px/1.4 'Geist Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#8A8378}
.so-hud b{font-size:13px;color:var(--ink)}
.so-fire{opacity:0;transition:opacity .3s}.so-fire.on{opacity:1}
.so-big{display:block;margin:14px 0 4px;font:400 clamp(64px,20vw,88px)/1 'Anton',Impact,sans-serif;color:var(--ink)}
.so-praise{display:block;font-size:18px;font-weight:500;color:var(--ink)}
.so-sub{display:block;margin-top:6px;font:500 11px/1.4 'Geist Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#8A8378}
.so-best{display:block;margin-top:4px;font:500 11px/1.4 'Geist Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#8A8378}
.so-best.new{color:#B0865C}
.so-acts{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 10px}
.so-acts button{all:unset;cursor:pointer;padding:12px 18px;border-radius:999px;font:600 15px/1 'Geist',sans-serif;background:rgba(20,17,14,.07);color:var(--ink)}
.so-acts .go{background:var(--ink);color:#F6F3EE}
.so-acts button:focus-visible{outline:2px solid var(--car);outline-offset:2px}
.so-why[hidden]{display:none}
</style>
</head>
<body>
<header class="header">
  <div class="header-top">
    <a class="back-link" href="/index.html?openModal=writing" target="_top">← Writing</a>
    <div class="header-title"><div class="app-title">INTUITY</div><div class="app-subtitle">Writing · Practice</div></div>
    <span class="header-spacer pr-kindwrap"><span class="pr-kind" id="kind" role="radiogroup" aria-label="Practice"><button type="button" role="radio" data-v="finish">Finish</button><button type="button" role="radio" data-v="sort">Sort</button></span></span>
  </div>
  <div class="pr-tabs" id="tabs" role="tablist" aria-label="Task"></div>
  <div class="pr-seg" id="seg" role="radiogroup" aria-label="Part"></div>
</header>
<main>
  <article class="fc-card pr-card" id="card" aria-live="polite"></article>
  <div class="pr-act"><button type="button" id="bEx" aria-expanded="false">Example</button><button type="button" class="go" id="bNext">Next <span aria-hidden="true">›</span></button></div>
</main>
<script src="/skills/grammar-rules/intuity-sound.js"></script>
<script src="/tools/intuity-cheer.js?v=2"></script>
<script src="/tools/intuity-log.js?v=1"></script>
<script src="/tools/be2-progress.js?v=20261105b"></script>
<script>
(async function(){
  const $=id=>document.getElementById(id);
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  let D; try{ D=await fetch('/data/writing/practice.json?v=2',{cache:'no-cache'}).then(r=>r.json()); }
  catch(e){ $('card').textContent='Could not load the practice cards.'; return; }
  const TASKS=Object.keys(D.tasks), MODES=[['full','Full'],['intro','Introduction'],['body','Body'],['end','Conclusion']], ROLE={intro:'Intro',body:'Body',end:'End'};
  const q=new URLSearchParams(location.search), mem=k=>{ try{ return localStorage.getItem('intuity.practice.'+k); }catch(e){ return null; } }, keep=(k,v)=>{ try{ localStorage.setItem('intuity.practice.'+k,v); }catch(e){} };
  let TASK=TASKS.includes(q.get('task'))?q.get('task'):TASKS.includes(mem('task'))?mem('task'):'essays';
  let MODE=MODES.some(m=>m[0]===q.get('mode'))?q.get('mode'):MODES.some(m=>m[0]===mem('mode'))?mem('mode'):'full';
  let N=0, CUR=null;
  let KIND=q.get('kind')==='sort'?'sort':mem('kind')==='sort'?'sort':'finish', SORT=null;
  const SORT_TASKS=['essays','reports','reviews'].filter(k=>D.tasks[k]), PARTS=[['intro','Introduction'],['body','Body'],['end','Conclusion']];
  const WHY={essays:'An essay weighs up an issue in a neutral voice.',reports:'A report is formal: findings and recommendations about a place or an event.',reviews:'A review talks to the reader and gives an opinion of something.',
    intro:'It sets the scene.',body:'It develops one point.',end:'It sums up or recommends.'};
  /* shuffled bags, so a phrase or topic does not come back until the others have */
  const bags={};
  const draw=(key,list)=>{ let b=bags[key]; if(!b||!b.length){ b=bags[key]=list.map((_,i)=>i).sort(()=>Math.random()-.5); } return list[b.pop()]; };
  const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
  /* the bank phrase dark, the topic caramel, the student's part a grey … */
  function fill(p,t,k,cls){
    return esc(p).replace(/\{T\}/g,`<span class="${cls}">${esc(cap(t))}</span>`).replace(/\{t\}/g,`<span class="${cls}">${esc(t)}</span>`).replace(/\{k\}/g,esc(k||'')).replace(/…/g,'<span class="fc-gap">…</span>');
  }
  function exHTML(P){
    const e=P.ex; let s;
    if(e.full) s=esc(e.full);
    else { const head=P.p.replace(/\s*…\s*$/,' ').replace(/\{T\}/g,cap(e.t)).replace(/\{t\}/g,e.t).replace(/\{k\}/g,e.k||'');
      s=`<span class="ph">${esc(head.replace(/…/g,'').trimEnd())}</span> ${esc(e.end)}`; }
    const no=P.no?`<span class="no"><b>Not</b><s>${esc(P.no)}</s></span>`:'';
    return `<span class="about">About ${esc(e.t)}</span>${s}${no}`;
  }
  function deal(){
    const T=D.tasks[TASK], top=draw(TASK+':topic',T.topics);
    /* an email keeps one register: formal to an organisation, friendly to a friend */
    const regs=[...new Set(T.prompts.map(p=>p.r).filter(Boolean))], reg=regs.length?regs[Math.floor(Math.random()*regs.length)]:null;
    const by=s=>T.prompts.filter(p=>p.s===s&&(!reg||p.r===reg));
    const pick=s=>draw(TASK+':'+s+':'+reg,by(s));
    /* two different body lines, even when the shuffled pile runs out between them */
    const two=()=>{ const a=pick('body'); let b=pick('body'), k=0; while(b===a&&k++<5) b=pick('body'); return [a,b]; };
    const parts=MODE==='full'?[['intro',[pick('intro')]],['body',two()],['end',[pick('end')]]]:[[MODE,[pick(MODE)]]];
    CUR={top,parts,reg}; N++;
  }
  function paint(){
    $('bNext').hidden=false;
    const T=D.tasks[TASK], [t,k]=CUR.top;
    const sec=([s,ps])=>`<span class="fc-sec"><span class="fc-role">${ROLE[s]}</span><span class="fc-in">`+
      ps.map(P=>`<span class="pr-p">${fill(P.p,t,k,'t')}</span><span class="pr-ex" hidden>${exHTML(P)}</span>`).join('')+`</span></span>`;
    $('card').innerHTML=`<span class="fc-k">Practice · ${esc(T.label)}${CUR.reg?' · '+esc(CUR.reg):''}</span><span class="fc-t">${esc(T.label)} <span class="fc-n">${N}</span></span><span class="fc-bar" aria-hidden="true"></span>`+
      `<span class="fc">${CUR.parts.map(sec).join('')}</span><span class="pr-turn">Finish it aloud or on paper: ${esc(T.what)}.</span>`;
    $('bEx').setAttribute('aria-expanded','false'); $('bEx').textContent='Example';
  }
  /* SORT IN ROUNDS (8 Nov 2026, after the vocabulary Rack, Pegs and Pairs):
     nine phrases a round and a live tally - kept, missed, left, and a 🔥 run
     from two in a row. A miss is not the end of that phrase: it comes back
     three cards later for a second go. Three in a row is a fanfare. After
     nine, the round's card: 7 / 9, a line of praise, the same nine again or
     the next nine. Every answer is written to the INTUITY log, so practising
     here keeps the home page's streak alive. The next card comes by itself. */
  const ROUND=9, RIGHT_LINES=['Nice catch!','Exactly right!','Straight to it!','Sharp eyes!','Right in one!','Got it!'],
        AGAIN_LINES=['So close: it comes back in a moment.','Good guess: you will see it again.'],
        MISS_LINES=['Worth remembering.','Keep going!'];
  const pickOf=a=>a[Math.floor(Math.random()*a.length)];
  let RD=null, AUTO=null;
  function newRound(same){
    const all=SORT_TASKS.flatMap(k=>D.tasks[k].prompts.map((P,i)=>({k,P,id:'sort-'+k+'-'+i})));
    const items=same&&RD?RD.items.map(x=>({k:x.k,P:x.P,id:x.id})):Array.from({length:ROUND},()=>draw('sort',all));
    RD={items,q:items.map((_,i)=>i),pos:0,kept:0,missed:0,run:0,best:0,n:(RD?RD.n:0)+(same?0:1),end:false};
    items.forEach(x=>{ x.tries=0; x.state=''; });
  }
  function dealSort(){
    clearTimeout(AUTO);
    if(!RD||RD.end) newRound(false);
    if(RD.pos>=RD.q.length){ RD.end=true; SORT=null; return; }
    SORT=RD.items[RD.q[RD.pos]]; SORT.pick={};
  }
  const hud=()=>`<span class="so-hud"><span><b>${RD.kept}</b> kept</span><span><b>${RD.missed}</b> missed</span><span><b>${ROUND-RD.kept-RD.missed}</b> left</span>`+
    `<span class="so-fire${RD.run>=2?' on':''}">🔥 <b>${RD.run}</b></span></span>`;
  function paintSort(){
    $('bNext').hidden=false;
    if(!SORT) return paintEnd();
    const {k,P}=SORT, txt=esc(P.p).replace(/\{T\}|\{t\}|\{k\}/g,'…').replace(/…(\s*…)+/g,'…').replace(/…/g,'<span class="fc-gap">…</span>');
    const row=(name,list)=>`<span class="so-row" role="radiogroup" data-r="${name}">`+list.map(([v,l])=>`<button type="button" role="radio" aria-checked="false" data-v="${v}">${l}</button>`).join('')+`</span>`;
    $('card').innerHTML=`<span class="fc-k">Sort · Round ${RD.n}${SORT.tries?' · second go':''}</span><span class="fc-t">Sort <span class="fc-n">${RD.kept+RD.missed+1}</span></span><span class="fc-bar" aria-hidden="true"></span>`+
      hud()+`<span class="so-p">${txt}</span>`+
      `<span class="so-q">Which task?</span>`+row('task',SORT_TASKS.map(t=>[t,D.tasks[t].label]))+
      `<span class="so-q">Which part?</span>`+row('part',PARTS)+
      `<span class="so-why" id="soWhy" hidden></span>`;
    $('card').querySelectorAll('.so-row').forEach(r=>r.onclick=e=>{ const b=e.target.closest('button'); if(!b||r.classList.contains('done')) return;
      r.querySelectorAll('button').forEach(x=>x.setAttribute('aria-checked',String(x===b))); SORT.pick[r.dataset.r]=b.dataset.v;
      if(SORT.pick.task&&SORT.pick.part) checkSort(); });
  }
  function checkSort(){
    const x=SORT, {k,P}=x, okT=x.pick.task===k, okP=x.pick.part===P.s, ok=okT&&okP, first=!x.tries; x.tries++;
    $('card').querySelectorAll('.so-row').forEach(r=>{ r.classList.add('done'); const want=r.dataset.r==='task'?k:P.s;
      r.querySelectorAll('button').forEach(b=>{ const v=b.dataset.v, mine=b.getAttribute('aria-checked')==='true';
        b.classList.toggle('ok',v===want); b.classList.toggle('no',mine&&v!==want); }); });
    let head;
    if(ok){ x.state='kept'; RD.kept++; RD.run++; RD.best=Math.max(RD.best,RD.run); head=pickOf(RIGHT_LINES); }
    else if(first){ RD.run=0; head=pickOf(AGAIN_LINES); RD.q.splice(Math.min(RD.pos+4,RD.q.length),0,RD.q[RD.pos]); }   /* it comes back */
    else { x.state='missed'; RD.missed++; RD.run=0; head=pickOf(MISS_LINES); }
    RD.pos++;
    const T=D.tasks[k].label, Pt=PARTS.find(y=>y[0]===P.s)[1];
    const w=$('soWhy'); w.hidden=false;
    w.innerHTML='<b>'+esc(head)+'</b> '+(ok?'':'It’s <b>'+esc(T)+' · '+esc(Pt)+'</b>. ')+esc(okT?(ok?WHY[k]:''):WHY[k])+(okP||ok?'':' '+esc(WHY[P.s]));
    const h=$('card').querySelector('.so-hud'); if(h) h.outerHTML=hud();
    if(window.Cheer){
      if(ok){ $('card').querySelectorAll('.so-row button.ok').forEach(b=>Cheer.right(b,first));
        if(RD.run>=3&&RD.run%3===0) Cheer.streak($('card').querySelector('.so-fire')); }
      else Cheer.soft();
    }
    try{ if(window.INTUITY) INTUITY.log('writing',x.id,ok,{game:'sort',task:k,part:P.s}); }catch(e){}
    clearTimeout(AUTO); AUTO=setTimeout(next,ok?1400:2600);   /* the next card comes by itself; Next skips the wait */
  }
  function praise(n){ const f=n/ROUND; return f===1?'Perfect round: every one sorted.':f>=.75?'Great run: barely any got away.':f>=.5?'Solid work. A few worth another look.':'A tricky set: good ones to come back to.'; }
  function paintEnd(){
    $('bNext').hidden=true;
    try{ if(window.INTUITY) INTUITY.session('writing','sort',{kept:RD.kept,missed:RD.missed}); }catch(e){}
    /* a score to beat: your own best round (8 Nov 2026) */
    let best=0; try{ best=+localStorage.getItem('intuity.best.sort')||0; }catch(e){}
    const newBest=RD.kept>best; if(newBest) try{ localStorage.setItem('intuity.best.sort',String(RD.kept)); }catch(e){}
    $('card').innerHTML=`<span class="fc-k">Sort · Round ${RD.n} done</span><span class="so-big">${RD.kept} / ${ROUND}</span>`+
      `<span class="so-praise">${esc(praise(RD.kept))}</span>`+
      `<span class="so-sub">${RD.missed?RD.missed+' missed':'none missed'}${RD.best>=3?' · best run '+RD.best:''}</span>`+
      (newBest||best?`<span class="so-best${newBest&&best?' new':''}">${newBest?(best?'New best · beat '+best+' / '+ROUND:'First score to beat'):'Your best · '+best+' / '+ROUND}</span>`:'')+
      `<span class="so-acts"><button type="button" id="soAgain">↻ These nine again</button><button type="button" class="go" id="soNext">Next nine →</button></span>`;
    $('soAgain').onclick=()=>{ newRound(true); dealSort(); paintSort(); };
    $('soNext').onclick=()=>{ newRound(false); dealSort(); paintSort(); };
    if(window.Cheer){ const big=$('card').querySelector('.so-big'); if(RD.kept===ROUND) Cheer.finale(); else if(newBest&&best) Cheer.streak(big); else if(RD.kept>=7) Cheer.done(big); else Cheer.tick(big); }
  }
  function next(){
    /* finishing cards is its own run: every fifth card, a jingle */
    if(KIND==='finish'&&N%5===0&&window.Cheer) Cheer.done($('card').querySelector('.fc-n'));
    clearTimeout(AUTO); if(KIND==='sort'&&RD&&RD.end) return;
    const c=$('card'), go=()=>{ if(KIND==='sort'){ dealSort(); paintSort(); } else { deal(); paint(); } };
    if(matchMedia('(prefers-reduced-motion: reduce)').matches){ go(); return; }
    c.classList.add('out'); setTimeout(()=>{ go(); c.classList.remove('out'); c.classList.add('in'); requestAnimationFrame(()=>requestAnimationFrame(()=>c.classList.remove('in'))); },150);
  }
  function kind(){
    document.body.classList.toggle('sorting',KIND==='sort');
    $('kind').querySelectorAll('button').forEach(b=>b.setAttribute('aria-checked',String(b.dataset.v===KIND)));
  }
  $('kind').onclick=e=>{ const b=e.target.closest('button'); if(!b||b.dataset.v===KIND) return; KIND=b.dataset.v; keep('kind',KIND); N=0; kind();
    if(typeof room==='function') room(); if(KIND==='sort'){ dealSort(); paintSort(); } else { deal(); paint(); } };
  function chrome(){
    $('tabs').innerHTML=TASKS.map(k=>`<button type="button" class="pr-tab" role="tab" data-k="${k}" aria-selected="${k===TASK}">${esc(D.tasks[k].label)}</button>`).join('');
    $('seg').innerHTML=MODES.map(([m,l])=>`<button type="button" role="radio" data-m="${m}" aria-checked="${m===MODE}">${l}</button>`).join('');
  }
  $('tabs').onclick=e=>{ const b=e.target.closest('.pr-tab'); if(!b||b.dataset.k===TASK) return; TASK=b.dataset.k; keep('task',TASK); N=0; chrome(); deal(); paint(); };
  $('seg').onclick=e=>{ const b=e.target.closest('button'); if(!b||b.dataset.m===MODE) return; MODE=b.dataset.m; keep('mode',MODE); chrome(); deal(); paint(); };
  $('bNext').onclick=next;
  $('bEx').onclick=()=>{ const open=$('bEx').getAttribute('aria-expanded')!=='true';
    document.querySelectorAll('.pr-ex').forEach(x=>x.hidden=!open); $('bEx').setAttribute('aria-expanded',String(open)); $('bEx').textContent=open?'Hide example':'Example'; };
  /* a swipe to the left is Next */
  let x0=null,y0=0;
  $('card').addEventListener('touchstart',e=>{ x0=e.touches[0].clientX; y0=e.touches[0].clientY; },{passive:true});
  $('card').addEventListener('touchend',e=>{ if(x0===null) return; const t=e.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0; x0=null;
    if(dx<-50&&Math.abs(dx)>Math.abs(dy)*1.4) next(); },{passive:true});
  /* the shell's header is fixed: the card starts under it */
  const room=()=>{ const h=document.querySelector('.header'); if(h) document.documentElement.style.setProperty('--hh',Math.round(h.getBoundingClientRect().height)+'px'); };
  addEventListener('resize',room);
  chrome(); kind(); room(); if(KIND==='sort'){ dealSort(); paintSort(); } else { deal(); paint(); }
})();
</script>
</body>
