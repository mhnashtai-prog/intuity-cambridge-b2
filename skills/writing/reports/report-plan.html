<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Report Plan — INTUITY</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Barlow+Condensed:wght@700;800;900&family=Instrument+Sans:wght@400;500;600&family=Caveat:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#f0efec;--ink:#111111;--white:#ffffff;
  /* fixed five-colour theme, one hue per section slot (matches the original report palette) */
  --t-intro:#3d9e95;   --t-intro-d:#2a6f68;
  --k1:#e8723a;         /* Body */
  --k2:#7b5ea7;         /* Issues */
  --k3:#c94f6d;         /* Recommendations */
  --t-end:#c08b2f;      --t-end-d:#8a641f;
  --gold:#9a7d3f;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;position:fixed;background:var(--bg);font-family:'Barlow',sans-serif;-webkit-font-smoothing:antialiased}
.shell{position:fixed;inset:0;display:flex;flex-direction:column}

.topbar{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0.65rem 1.25rem;background:rgba(240,239,236,0.95);backdrop-filter:blur(12px);border-bottom:1.5px solid rgba(0,0,0,0.07);z-index:100}
.back-link{text-decoration:none;font-size:0.72rem;font-weight:700;color:rgba(0,0,0,0.38);letter-spacing:0.05em;text-transform:uppercase;transition:color 0.2s}
.back-link:hover{color:rgba(0,0,0,0.65)}
.brand{font-family:'Barlow Condensed',sans-serif;font-size:0.7rem;font-weight:900;letter-spacing:0.28em;text-transform:uppercase;color:rgba(0,0,0,0.18)}
.topic-label{font-size:0.68rem;font-weight:700;color:rgba(0,0,0,0.38);letter-spacing:0.04em;text-align:right;max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}

.topic-tabs{flex-shrink:0;display:flex;align-items:center;gap:0.25rem;padding:0.45rem 1.1rem;background:rgba(240,239,236,0.8);border-bottom:1px solid rgba(0,0,0,0.06);overflow-x:auto}
.topic-tabs::-webkit-scrollbar{display:none}
.ttab{background:transparent;border:none;padding:0.28rem 0.7rem;border-radius:2rem;font-family:'Barlow Condensed',sans-serif;font-size:0.58rem;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(0,0,0,0.3);cursor:pointer;transition:all 0.2s;white-space:nowrap}
.ttab:hover{color:rgba(0,0,0,0.55);background:rgba(0,0,0,0.05)}
.ttab.active{background:var(--ink);color:#fff}

.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:0.5rem 0}

.foot{flex-shrink:0;display:flex;justify-content:center;padding:0.5rem 1rem calc(env(safe-area-inset-bottom,0px) + 0.55rem);background:rgba(240,239,236,0.95);border-top:1px solid rgba(0,0,0,0.06)}
.nav-pill{display:flex;gap:0.12rem;background:rgba(10,10,10,0.07);border-radius:2rem;padding:0.25rem 0.28rem}
.nb{background:transparent;border:none;padding:0.35rem 0.75rem;border-radius:1.5rem;font-family:'Barlow',sans-serif;font-size:0.6rem;letter-spacing:0.03em;color:rgba(0,0,0,0.28);cursor:pointer;transition:all 0.22s;white-space:nowrap;min-height:28px;font-weight:700;text-transform:uppercase}
.nb.on{background:var(--ink);color:#fff;font-weight:800}
.nb:hover:not(.on){color:rgba(0,0,0,0.5)}

/* ── POSTER ──
   Sized off the actual .stage box (which flexbox already shrinks correctly
   to account for topbar + topic-tabs + foot), NOT off raw viewport height.
   report-plan.html has one more chrome row (.topic-tabs) than essay/review,
   so a vh-based height here doesn't know that row exists and can make the
   card taller than the space really available — clipping the ribbon at
   the top. Percentage-of-parent avoids that regardless of which chrome
   rows are present. */
.poster{
  width:min(420px,90vw);height:min(540px,94%);
  background:var(--white);border-radius:1.4rem;
  display:flex;flex-direction:column;overflow:hidden;position:relative;
  box-shadow:0 2px 0 rgba(255,255,255,0.8) inset,4px 6px 0 rgba(0,0,0,0.06),0 20px 50px rgba(0,0,0,0.18),0 4px 12px rgba(0,0,0,0.1);
  animation:cardUp 0.55s cubic-bezier(0.22,1,0.36,1) both;
}
@keyframes cardUp{
  0%{opacity:0;transform:scale(0.92) translateY(20px)}
  65%{opacity:1;transform:scale(1.01) translateY(-4px)}
  100%{opacity:1;transform:scale(1) translateY(0)}
}

/* ── FLAG ── */
.flag{position:absolute;top:-2px;left:1.8rem;width:56px;z-index:10;display:flex;flex-direction:column;align-items:center}
.flag-body{width:100%;padding:0.5rem 0 0.35rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.15rem;position:relative;background:var(--t-intro)}
.flag-num{font-family:'Barlow Condensed',sans-serif;font-size:1.9rem;font-weight:900;color:#fff;line-height:1;letter-spacing:-0.02em}
.flag-body::after{content:'';position:absolute;bottom:-8px;left:0;right:0;height:9px;background:var(--t-intro);clip-path:polygon(0% 0%,8.33% 100%,16.66% 0%,25% 100%,33.33% 0%,41.66% 100%,50% 0%,58.33% 100%,66.66% 0%,75% 100%,83.33% 0%,91.66% 100%,100% 0%)}

/* ── TYPE BADGE ── */
.type-badge{position:absolute;top:1rem;right:1.3rem;font-family:'Barlow Condensed',sans-serif;font-size:0.58rem;font-weight:800;letter-spacing:0.18em;text-transform:uppercase;color:var(--t-intro);opacity:0.6}

/* ── SCROLL ── */
.card-scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:3.2rem}
.card-scroll::-webkit-scrollbar{width:3px}
.card-scroll::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.1);border-radius:2px}

.accent-bar{height:4px;background:var(--t-intro);flex-shrink:0;border-radius:0 0 1.4rem 1.4rem;opacity:0.7}

/* ══ KEYS VIEW ══ */
.poster.temple-wide{width:min(1180px,95vw);height:min(660px,94%)}
.keysview{display:flex;flex-direction:column;padding:0.55rem 1.2rem 1.1rem;min-height:100%;gap:0.55rem}

.kq{align-self:center;max-width:94%;display:flex;align-items:baseline;gap:0.45rem;padding:0.1rem 0 0.15rem}
.kq-lock{font-size:0.62rem;opacity:0.45}
.kq-text{font-family:'Caveat',cursive;font-size:1.08rem;font-weight:600;color:rgba(30,28,25,0.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.ksig{display:flex;align-items:baseline;gap:0.9rem;padding:0.4rem 0.2rem;cursor:pointer;transition:opacity 0.18s}
.ksig:hover{opacity:0.85}
.ksig.intro{border-bottom:1.5px solid rgba(0,0,0,0.07)}
.ksig.concl{border-top:1.5px solid rgba(0,0,0,0.07)}
.ksig-badge{flex-shrink:0;font-family:'Barlow Condensed',sans-serif;font-size:0.6rem;font-weight:900;letter-spacing:0.12em;text-transform:uppercase;color:#fff;border-radius:1rem;padding:0.2rem 0.6rem 0.22rem}
.ksig.intro .ksig-badge{background:var(--t-intro)}
.ksig.concl .ksig-badge{background:var(--t-end)}
.ksig-notes{flex:1;display:flex;flex-wrap:wrap;column-gap:1.1rem;row-gap:0;min-width:0;align-items:baseline}
.ks-note{font-family:'Caveat',cursive;font-size:1.25rem;font-weight:500;line-height:1.25;color:#2c2c2a}
.ks-note+.ks-note::before{content:'·';margin-right:0.5rem;opacity:0.28;font-family:'Barlow',sans-serif;font-size:0.8rem}

.keys-row{flex:1;min-height:0;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:1.4rem;padding:0.35rem 0.3rem 0.15rem;align-items:stretch}
.key{display:flex;flex-direction:column;height:100%;cursor:pointer;transition:transform 0.18s}
.key:hover{transform:translateY(-2px)}
.key:active{transform:scale(0.985)}
.key:nth-child(1){--kc:var(--k1);--paper:#c5dcf2;--fold:#a9c8e6;--pi:#16304a;--pl:#40658c}
.key:nth-child(2){--kc:var(--k2);--paper:#f7e5a8;--fold:#e2cd86;--pi:#4a3a10;--pl:#8a6f22}
.key:nth-child(3){--kc:var(--k3);--paper:#f6c9d2;--fold:#e3aab6;--pi:#4d1c28;--pl:#94465a}

.k-note{position:relative;background:var(--paper);border-radius:1px 1px 3px 3px;padding:0.7rem 0.8rem 0.95rem;box-shadow:0 1px 1px rgba(30,28,24,0.10),0 12px 18px -12px rgba(30,28,24,0.45)}
.k-note::after{content:'';position:absolute;right:0;bottom:0;width:24px;height:24px;background:linear-gradient(135deg,rgba(255,255,255,0) 46%,rgba(255,255,255,0.75) 50%,var(--fold) 54%);box-shadow:-2px -2px 4px rgba(30,28,24,0.14);border-radius:0 0 3px 0}
.key:nth-child(1) .k-note{transform:rotate(-1.1deg)}
.key:nth-child(2) .k-note{transform:rotate(0.8deg)}
.key:nth-child(3) .k-note{transform:rotate(-0.6deg)}
.k-note-lab{font-family:'Barlow Condensed',sans-serif;font-size:0.6rem;font-weight:800;letter-spacing:0.16em;text-transform:uppercase;color:var(--pl);margin-bottom:0.18rem;line-height:1.1}
.k-note-idea{font-family:'Caveat',cursive;font-size:1.45rem;font-weight:500;line-height:1.18;color:rgba(0,0,0,0.9)}
.k-note-idea .kv{font-weight:700;font-size:1em;color:inherit}
.k-note-idea .gap{opacity:0.4}

.k-tree{margin:0.85rem 0 0 1rem;padding:0}
.k-branch{padding:0.28rem 0}
.k-suptext{position:relative;padding-left:0.85rem;font-family:'Instrument Sans',sans-serif;font-size:0.95rem;line-height:1.32;color:#2c2c2a}
.k-suptext::before{content:'';position:absolute;left:0;top:0.55em;width:5px;height:5px;border-radius:50%;background:var(--pl);opacity:0.5}
.mv{display:block;font-family:'Barlow Condensed',sans-serif;font-size:0.6rem;font-weight:600;letter-spacing:0.18em;color:var(--gold);line-height:1.2;margin-bottom:1px;padding-left:0.85rem}

.kv{font-weight:600;font-style:normal}
.k-note-idea .kv{color:inherit}
.ks-note .kv{font-size:1.1em;color:rgba(25,22,18,0.95)}

.k-caption{font-family:'Barlow Condensed',sans-serif;font-size:0.55rem;font-weight:800;letter-spacing:0.2em;text-transform:uppercase;color:rgba(0,0,0,0.3);text-align:center;margin-top:0.15rem}

@media(min-width:820px){
  .keysview{padding:0.7rem 2rem 1.2rem;gap:0.7rem}
  .keys-row{gap:2.4rem;padding:0.6rem 0.6rem 0.2rem}
  .k-note{padding:0.9rem 1rem 1.2rem}
  .k-note-lab{font-size:0.68rem}
  .k-note-idea{font-size:1.75rem}
  .k-tree{margin-left:1.15rem}
  .k-suptext{font-size:1.02rem}
  .kq-text{font-size:1.2rem}
  .ks-note{font-size:1.12rem}
}
@media(max-width:700px){
  .keysview{padding:0.15rem 0.55rem 0.2rem;gap:0.1rem}
  .kq{padding:0.02rem 0 0.04rem;gap:0.25rem}
  .kq-lock{font-size:0.42rem}
  .kq-text{font-size:0.58rem}
  .ksig{gap:0.4rem;padding:0.1rem 0.08rem}
  .ksig-badge{font-size:0.4rem;padding:0.08rem 0.32rem 0.1rem}
  .ksig-notes{column-gap:0.4rem}
  .ks-note{font-size:0.55rem;line-height:1.12}
  .keys-row{grid-auto-flow:row;grid-auto-columns:unset;gap:0.55rem;padding:0.02rem 0}
  .k-note{padding:0.45rem 0.5rem 0.65rem}
  .k-note::after{width:15px;height:15px}
  .k-note-lab{font-size:0.42rem;letter-spacing:0.1em}
  .k-note-idea{font-size:0.82rem;line-height:1.12}
  .key:nth-child(1) .k-note{transform:rotate(-0.5deg)}
  .key:nth-child(2) .k-note{transform:rotate(0.4deg)}
  .key:nth-child(3) .k-note{transform:rotate(-0.3deg)}
  .k-tree{margin:0.4rem 0 0 0.5rem}
  .k-branch{padding:0.1rem 0}
  .k-suptext{font-size:0.55rem;line-height:1.08}
  .mv{font-size:0.38rem}
  .k-caption{display:none}
}

/* ── NO DATA STATE ── */
.no-data{padding:2.5rem 1.5rem;text-align:center;font-family:'Instrument Sans',sans-serif;font-size:1.1rem;color:rgba(0,0,0,0.25);line-height:1.6}

/* ══ SECTION MODAL ══ */
.section-modal{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center}
.section-modal.open{display:flex}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,13,10,0.5);display:flex;align-items:center;justify-content:center;padding:1.5rem;animation:modalFade 0.2s ease both}
@keyframes modalFade{from{opacity:0}to{opacity:1}}
.modal-card{position:relative;width:min(440px,92vw);max-height:82vh;overflow-y:auto;background:var(--white);border-radius:1.3rem;padding:1.7rem 1.5rem 1.4rem;box-shadow:4px 8px 0 rgba(0,0,0,0.06),0 30px 60px rgba(0,0,0,0.3);animation:modalUp 0.32s cubic-bezier(0.22,1,0.36,1) both;color:var(--ink)}
.modal-card::-webkit-scrollbar{width:3px}
.modal-card::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.12);border-radius:2px}
@keyframes modalUp{0%{opacity:0;transform:scale(0.9) translateY(24px)}100%{opacity:1;transform:scale(1) translateY(0)}}
.modal-close{position:absolute;top:0.8rem;right:0.8rem;width:1.9rem;height:1.9rem;border-radius:50%;border:none;background:rgba(0,0,0,0.06);cursor:pointer;font-size:0.8rem;color:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;transition:background 0.18s}
.modal-close:hover{background:rgba(0,0,0,0.12)}
.modal-badgerow{display:flex;align-items:center;gap:0.5rem;margin-bottom:0.35rem}
.modal-num{font-family:'Barlow Condensed',sans-serif;font-size:1rem;font-weight:900;color:currentColor;opacity:0.55}
.modal-role{font-family:'Barlow Condensed',sans-serif;font-size:0.55rem;font-weight:900;letter-spacing:0.16em;text-transform:uppercase;color:#fff;background:currentColor;border-radius:1rem;padding:0.14rem 0.55rem 0.18rem}
.modal-title{font-family:'Barlow Condensed',sans-serif;font-size:1.5rem;font-weight:900;text-transform:uppercase;line-height:1.05;color:var(--ink);margin:0.2rem 0 0.15rem}
.modal-purpose{font-family:'Barlow',sans-serif;font-size:0.62rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:rgba(0,0,0,0.32);margin-bottom:0.85rem;padding-bottom:0.75rem;border-bottom:1px dashed rgba(0,0,0,0.1)}
.modal-claim{font-family:'Instrument Sans',sans-serif;font-size:1.15rem;font-weight:500;color:#2c2c2a;margin:0.2rem 0 0.4rem}
.modal-nav{display:flex;justify-content:space-between;align-items:center;margin-top:1rem;padding-top:0.7rem;border-top:1px solid rgba(0,0,0,0.06)}
.modal-nav-btn{background:rgba(0,0,0,0.05);border:none;border-radius:1.2rem;padding:0.32rem 0.75rem;font-family:'Barlow Condensed',sans-serif;font-size:0.6rem;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(0,0,0,0.5);cursor:pointer;transition:all 0.18s}
.modal-nav-btn:hover:not(:disabled){background:rgba(0,0,0,0.1);color:var(--ink)}
.modal-nav-btn:disabled{opacity:0.25;cursor:default}
.modal-card.mrole-intro{color:var(--t-intro)}
.modal-card.mrole-body{color:var(--k1)}
.modal-card.mrole-key2{color:var(--k2)}
.modal-card.mrole-key3{color:var(--k3)}
.modal-card.mrole-end{color:var(--t-end)}

.loading-msg{font-family:'Barlow Condensed',sans-serif;font-size:0.85rem;font-weight:700;color:rgba(0,0,0,0.25);letter-spacing:0.12em;text-transform:uppercase}
</style>
</head>
<body>
<div class="shell">

  <div class="topbar">
    <a class="back-link" href="report-question-selector.html">← Questions</a>
    <span class="brand">INTUITY</span>
    <span class="topic-label" id="topicLabel">—</span>
  </div>

  <div class="topic-tabs" id="topicTabs"></div>

  <div class="stage" id="stage">
    <div class="loading-msg" id="loadingMsg">Loading…</div>
  </div>

  <div class="foot">
    <div class="nav-pill">
      <button class="nb" onclick="navTo('question')">Question</button>
      <button class="nb on" onclick="navTo('plan')">Plan</button>
      <button class="nb" onclick="navTo('model')">Model</button>
      <button class="nb" onclick="navTo('sample')">Sample</button>
    </div>
  </div>

</div>

<div class="section-modal" id="sectionModal"></div>

<script>
/* ══════════ REPORT PLAN — restyled to match review-plan.html's Keys board ══════════
   data/report-plan-data.json is keyed by report "type" (what topic-tabs switch between);
   each entry holds {label, sections:[{num,title,phrase,idea,bullets}, ...]} — five
   sections (Introduction, Body, Issues, Recommendations, Conclusion), which map onto
   review's intro-strip / 3-key-row / conclusion-strip layout exactly. */

/* ══ SOUND — short chimes, same convention as review-plan.html ══ */
const AudioCtx=window.AudioContext||window.webkitAudioContext;
let actx=null;
function ac(){if(!actx)actx=new AudioCtx();return actx;}
function tone(freq,type,dur,vol,delay=0){
  try{const ctx=ac(),osc=ctx.createOscillator(),g=ctx.createGain();osc.connect(g);g.connect(ctx.destination);osc.type=type;osc.frequency.value=freq;const t=ctx.currentTime+delay;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);osc.start(t);osc.stop(t+dur+0.05);}catch(e){}
}
function sndDrop(){tone(360,'sine',0.18,0.12);tone(500,'sine',0.12,0.07,0.08);}
function sndOpen(){tone(420,'sine',0.14,0.09);tone(560,'sine',0.1,0.06,0.07);}
function sndClose(){tone(560,'sine',0.1,0.07);tone(380,'sine',0.14,0.05,0.08);}
function sndSwitch(){tone(500,'triangle',0.08,0.08);tone(660,'triangle',0.06,0.05,0.05);}

/* ══ STATE ══ */
let PLANS=null;
let order=[];        /* report type keys, in a stable order */
let currentIdx=0;
let plan=null;

function kv(t){return String(t==null?'':t).replace(/«([^»]+)»/g,'<b class="kv">$1</b>');}
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

/* ══ THE KEYS RENDERER ══ */
function renderTemple(area){
  const secs=(plan&&plan.sections)||[];
  if(secs.length<3){ area.innerHTML='<div class="no-data">This plan has too few sections to lay out.</div>'; return; }
  const intro=secs[0], concl=secs[secs.length-1], cols=secs.slice(1,-1);
  const q=(plan.label)||'';

  const strip=(sec,cls,idx)=>{
    const bits=[];
    if(sec.idea) bits.push(sec.idea);
    (sec.bullets||[]).forEach(b=>bits.push(b));
    const notes=bits.map(b=>`<span class="ks-note">${kv(b)}</span>`).join('');
    const num=String(sec.num||(idx+1)).padStart(2,'0');
    return `<div class="ksig ${cls}" onclick="openSectionModal(${idx})">
      <span class="ksig-badge">${num} ${esc(sec.title||'')}</span>
      <div class="ksig-notes">${notes}</div></div>`;
  };

  const keyHTML=cols.map((sec,ci)=>{
    const num=String(sec.num||(ci+2)).padStart(2,'0');
    const bullets=(sec.bullets||[]).map(b=>`<div class="k-branch"><div class="k-suptext">${kv(b)}</div></div>`).join('');
    return `<div class="key" onclick="openSectionModal(${ci+1})">
      <div class="k-note">
        <div class="k-note-lab">${num} &middot; ${esc(sec.title||'')}</div>
        <div class="k-note-idea">${kv(sec.idea||'')}<span class="gap"> …</span></div>
      </div>
      <div class="k-tree">${bullets}</div>
    </div>`;
  }).join('');

  area.innerHTML=`<div class="keysview">
    <div class="kq"><span class="kq-lock">📄</span><span class="kq-text">${esc(q)}</span></div>
    ${strip(intro,'intro',0)}
    <div class="keys-row">${keyHTML}</div>
    ${strip(concl,'concl',secs.length-1)}
    <div class="k-caption">Tap any section for the full card</div>
  </div>`;
  area.scrollTop=0;
}

/* ══ SECTION MODAL ══ */
function openSectionModal(idx){
  const secs=(plan&&plan.sections)||[];
  const sec=secs[idx];
  if(!sec)return;
  const roleMap=['intro','body','key2','key3','end'];
  const labelMap=['Introduction','Body','Issues','Recommendations','Conclusion'];
  const role = idx===0 ? 'intro' : (idx===secs.length-1 ? 'end' : (roleMap[idx]||'body'));
  const roleLabel = sec.title || labelMap[idx] || 'Section';
  const bullets=(sec.bullets||[]).map(b=>`<div class="k-branch"><div class="k-suptext">${kv(b)}</div></div>`).join('');
  const modal=document.getElementById('sectionModal');
  modal.innerHTML=`<div class="modal-backdrop" onclick="closeSectionModal()">
    <div class="modal-card mrole-${role}" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeSectionModal()">✕</button>
      <div class="modal-badgerow">
        <span class="modal-num">${String(sec.num||idx+1).padStart(2,'0')}</span>
        <span class="modal-role">${esc(roleLabel)}</span>
      </div>
      <div class="modal-title">${esc(sec.title||'')}</div>
      <div class="modal-purpose">${esc(sec.phrase||'')}</div>
      <div class="modal-claim">${kv(sec.idea||'')}</div>
      <div class="k-tree">${bullets}</div>
      <div class="modal-nav">
        <button class="modal-nav-btn" onclick="openSectionModal(${idx-1})" ${idx<=0?'disabled':''}>← Prev</button>
        <button class="modal-nav-btn" onclick="openSectionModal(${idx+1})" ${idx>=secs.length-1?'disabled':''}>Next →</button>
      </div>
    </div>
  </div>`;
  modal.classList.add('open');
  sndOpen();
}
function closeSectionModal(){
  const modal=document.getElementById('sectionModal');
  if(!modal||!modal.classList.contains('open'))return;
  modal.classList.remove('open');
  modal.innerHTML='';
  sndClose();
}
window.openSectionModal=openSectionModal;
window.closeSectionModal=closeSectionModal;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSectionModal();});

/* ══ RENDER ══ */
function renderContent(){
  const stage=document.getElementById('stage');
  stage.innerHTML=`<div class="poster" id="posterCard">
    <div class="flag"><div class="flag-body"><span class="flag-num" id="flagNum">01</span></div></div>
    <div class="type-badge">Plan</div>
    <div class="card-scroll" id="contentArea"></div>
    <div class="accent-bar"></div>
  </div>`;
  const poster=document.getElementById('posterCard');
  poster.classList.toggle('temple-wide', window.innerWidth>=820);
  document.getElementById('flagNum').textContent=String(currentIdx+1).padStart(2,'0');

  const area=document.getElementById('contentArea');
  if(!plan){
    area.innerHTML=`<div class="no-data">No plan found for this report.<br>Choose a question first.</div>`;
    return;
  }
  renderTemple(area);
}

/* ══ TABS / NAVIGATE ══ */
function buildTabs(){
  const c=document.getElementById('topicTabs');
  c.innerHTML=order.map((k,i)=>`<button class="ttab ${i===currentIdx?'active':''}" onclick="loadIdx(${i})">${esc((PLANS[k]&&PLANS[k].label)||k)}</button>`).join('');
}
function loadIdx(i){
  closeSectionModal();
  if(i===currentIdx){ return; }
  currentIdx=Math.max(0,Math.min(i,order.length-1));
  sndSwitch();
  const id=order[currentIdx];
  plan=PLANS[id]||null;
  document.getElementById('topicLabel').textContent=String((plan&&plan.label)||id).toUpperCase();
  buildTabs();
  renderContent();
}
window.loadIdx=loadIdx;

/* ══ FOOTER NAV ══ */
function navTo(dest){
  if(dest==='plan')return;
  try{
    const s=sessionStorage.getItem('currentReportQuestion');
    const q=s?JSON.parse(s):{};
    q.id=order[currentIdx];
    sessionStorage.setItem('currentReportQuestion',JSON.stringify(q));
  }catch(e){}
  const map={question:'report-question-selector.html',model:'reports-cards.html',sample:'report-sample.html'};
  if(map[dest])window.location.href=map[dest];
}
window.navTo=navTo;

window.addEventListener('resize',()=>{
  const poster=document.getElementById('posterCard');
  if(poster) poster.classList.toggle('temple-wide', window.innerWidth>=820);
});

/* ══ INIT ══ */
async function init(){
  let savedId=null;
  try{
    const s=sessionStorage.getItem('currentReportQuestion');
    if(s){ const q=JSON.parse(s); savedId=q.id||null; }
  }catch(e){}

  try{
    const r=await fetch('data/report-plan-data.json');
    if(!r.ok)throw new Error(`HTTP ${r.status} — data/report-plan-data.json not found`);
    PLANS=await r.json();
    order=Object.keys(PLANS);
    if(!order.length){ document.getElementById('stage').innerHTML='<div class="no-data">No report plans found.</div>'; return; }
    const at=savedId?order.indexOf(savedId):-1;
    currentIdx=at>=0?at:0;
    plan=PLANS[order[currentIdx]];
    document.getElementById('topicLabel').textContent=String((plan&&plan.label)||order[currentIdx]).toUpperCase();
    buildTabs();
    renderContent();
    sndDrop();
  }catch(e){
    console.error(e);
    document.getElementById('stage').innerHTML='<div class="no-data">⚠ Could not load plan data.<br>Check that report-plan-data.json is deployed.</div>';
  }
}
init();
</script>
</body>
</html>
