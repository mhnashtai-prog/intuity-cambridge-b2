<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Sample Report — INTUITY</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&family=Barlow+Condensed:wght@700;800;900&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#f0efec;--ink:#111111;--white:#ffffff;--rule:rgba(0,0,0,0.07);
 --acc:#c2681f;
  --gold:#C9A961;

  /* category colours — matches the Model page's phrase families */
  --c-discourse:#2563EB; --c-discourse-bg:rgba(37,99,235,0.10);
  --c-opinion:#7b5ea7;   --c-opinion-bg:rgba(123,94,167,0.12);
  --c-causal:#1a8f5e;    --c-causal-bg:rgba(26,143,94,0.10);
  --c-frame:#6a4374;     --c-frame-bg:rgba(106,67,116,0.10);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;position:fixed;background:var(--bg);font-family:'Barlow',sans-serif;-webkit-font-smoothing:antialiased}
.shell{position:fixed;inset:0;display:flex;flex-direction:column}

/* ── TOPBAR ── */
.topbar{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0.65rem 1.25rem;background:rgba(240,239,236,0.95);backdrop-filter:blur(12px);border-bottom:1.5px solid rgba(0,0,0,0.07);z-index:100;position:relative}
.back-link{text-decoration:none;font-size:0.72rem;font-weight:700;color:rgba(0,0,0,0.38);letter-spacing:0.05em;text-transform:uppercase;transition:color 0.2s}
.back-link:hover{color:rgba(0,0,0,0.65)}
.brand{font-family:'Barlow Condensed',sans-serif;font-size:0.7rem;font-weight:900;letter-spacing:0.28em;text-transform:uppercase;color:rgba(0,0,0,0.18)}
.topic-label{font-size:0.68rem;font-weight:700;color:rgba(0,0,0,0.38);letter-spacing:0.04em;text-align:right;max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;display:flex;align-items:center;gap:0.5rem}
.menu-btn{background:#000;border:1px solid rgba(0,0,0,0.12);width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s;flex-shrink:0}
.menu-btn:hover{background:rgba(0,0,0,0.85)}
.menu-btn:active{transform:scale(0.95)}
.menu-dots{display:flex;gap:3px}
.menu-dots span{width:3px;height:3px;border-radius:50%;background:#fff}
.menu-dropdown{position:absolute;top:calc(100% + 0.4rem);right:1.25rem;background:#fff;border-radius:0.75rem;box-shadow:0 0 0 1px rgba(0,0,0,0.08),0 8px 24px rgba(0,0,0,0.12);min-width:200px;padding:0.5rem;z-index:200;display:none}
.menu-dropdown.open{display:block;animation:menuSlide 0.2s ease-out}
@keyframes menuSlide{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.menu-section-label{padding:0.4rem 0.85rem 0.2rem;font-size:0.62rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:rgba(0,0,0,0.3)}
.menu-item{padding:0.6rem 0.85rem;border-radius:0.5rem;font-size:0.78rem;font-weight:500;color:rgba(0,0,0,0.7);cursor:pointer;transition:all 0.15s;display:flex;align-items:center;justify-content:space-between;gap:0.5rem}
.menu-item:hover{background:rgba(0,0,0,0.04);color:rgba(0,0,0,0.9)}

/* ── STAGE ── */
.stage{flex:1;min-height:0;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:0.75rem 0}

/* ── FOOTER NAV ── */
.foot{flex-shrink:0;display:flex;justify-content:center;padding:0.5rem 1rem calc(env(safe-area-inset-bottom,0px) + 0.55rem);background:rgba(240,239,236,0.95);border-top:1px solid rgba(0,0,0,0.06)}
.nav-pill{display:flex;gap:0.12rem;background:rgba(10,10,10,0.07);border-radius:2rem;padding:0.25rem 0.28rem}
.nb{background:transparent;border:none;padding:0.35rem 0.75rem;border-radius:1.5rem;font-family:'Barlow',sans-serif;font-size:0.6rem;letter-spacing:0.03em;color:rgba(0,0,0,0.28);cursor:pointer;transition:all 0.22s;white-space:nowrap;min-height:28px;font-weight:700;text-transform:uppercase}
.nb.on{background:var(--ink);color:#fff;font-weight:800}
.nb:hover:not(.on){color:rgba(0,0,0,0.5)}

/* ── POSTER CARD ── */
.poster{
width:min(420px,90vw);height:min(560px,100%);
  background:var(--white);border-radius:1.4rem;
  display:flex;flex-direction:column;overflow:hidden;position:relative;
  box-shadow:0 2px 0 rgba(255,255,255,0.8) inset,4px 6px 0 rgba(0,0,0,0.06),0 20px 50px rgba(0,0,0,0.18),0 4px 12px rgba(0,0,0,0.1);
  animation:cardUp 0.55s cubic-bezier(0.22,1,0.36,1) both;
}
@keyframes cardUp{
  0%{opacity:0;transform:scale(0.92) translateY(20px)}
  65%{opacity:1;transform:scale(1.01) translateY(-4px)}
  100%{opacity:1;transform:scale(1) translateY(0)}
}

/* ── FLAG ── */
.flag{position:absolute;top:-2px;left:1.8rem;width:56px;z-index:10;display:flex;flex-direction:column;align-items:center}
.flag-body{width:100%;padding:0.5rem 0 0.35rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.1rem;position:relative;background:var(--acc)}
.flag-num{font-family:'Barlow Condensed',sans-serif;font-size:1.5rem;font-weight:900;color:#fff;line-height:1;letter-spacing:-0.02em}
.flag-label{font-family:'Barlow Condensed',sans-serif;font-size:0.42rem;font-weight:900;color:rgba(255,255,255,0.75);letter-spacing:0.14em;text-transform:uppercase;line-height:1}
.flag-body::after{content:'';position:absolute;bottom:-8px;left:0;right:0;height:9px;background:var(--acc);clip-path:polygon(0% 0%,8.33% 100%,16.66% 0%,25% 100%,33.33% 0%,41.66% 100%,50% 0%,58.33% 100%,66.66% 0%,75% 100%,83.33% 0%,91.66% 100%,100% 0%)}

/* ── CARD TOOLBAR (style selector + view toggle) ── */
.card-toolbar{
  flex-shrink:0;padding:3.5rem 1rem 0.5rem;
  display:flex;align-items:center;gap:0.35rem;
  border-bottom:1px solid rgba(0,0,0,0.06);
  flex-wrap:wrap;
}
.style-btn{
  font-family:'Barlow Condensed',sans-serif;font-size:0.56rem;font-weight:900;
  letter-spacing:0.08em;text-transform:uppercase;
  padding:0.26rem 0.7rem;border-radius:999px;
  border:1.5px solid rgba(0,0,0,0.12);
  background:transparent;color:rgba(0,0,0,0.35);
  cursor:pointer;transition:all 0.2s;white-space:nowrap;
}
.style-btn:hover{border-color:rgba(0,0,0,0.25);color:rgba(0,0,0,0.65)}
.style-btn.active{background:var(--ink);border-color:var(--ink);color:#fff}
.toolbar-spacer{flex:1}
.view-toggle{display:flex;background:rgba(0,0,0,0.05);border-radius:999px;padding:0.18rem;gap:0.12rem}
.vt-btn{
  font-family:'Barlow Condensed',sans-serif;font-size:0.54rem;font-weight:900;
  letter-spacing:0.06em;text-transform:uppercase;
  padding:0.24rem 0.65rem;border-radius:999px;border:none;
  background:transparent;color:rgba(0,0,0,0.35);cursor:pointer;transition:all 0.2s;
}
.vt-btn:hover{color:rgba(0,0,0,0.65)}
.vt-btn.active{background:var(--ink);color:#fff}

/* ── X-RAY / PHRASES ROW ── */
.xray-row{
  flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:0.5rem;
  padding:0.4rem 1.2rem;border-bottom:1px solid rgba(0,0,0,0.05);flex-wrap:wrap;
}
.xray-toggle{display:flex;align-items:center;gap:0.4rem;cursor:pointer}
.xray-switch{
  width:30px;height:17px;border-radius:999px;background:rgba(0,0,0,0.12);
  position:relative;cursor:pointer;transition:background 0.2s;flex-shrink:0;
}
.xray-switch.on{background:var(--c-discourse)}
.xray-switch::after{
  content:'';position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;
  background:#fff;transition:transform 0.2s;box-shadow:0 1px 2px rgba(0,0,0,0.25);
}
.xray-switch.on::after{transform:translateX(13px)}
.xray-label{font-family:'Barlow Condensed',sans-serif;font-size:0.62rem;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(0,0,0,0.45)}
.phrase-badge{font-family:'Barlow Condensed',sans-serif;font-size:0.55rem;font-weight:900;
  background:var(--c-discourse-bg);color:var(--c-discourse);padding:0.05rem 0.32rem;
  border-radius:1rem;margin-left:0.25rem;display:none}
.phrase-badge.on{display:inline}
.legend{display:flex;gap:0.65rem;flex-wrap:wrap;justify-content:flex-end}
.legend-item{display:flex;align-items:center;gap:0.28rem;font-family:'Instrument Sans',sans-serif;font-size:0.62rem;color:rgba(0,0,0,0.42);white-space:nowrap}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--c-discourse)}
.legend.hidden{display:none}

/* ── STAGE DOTS (sections mode) ── */
.stage-dots-row{flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:1.5rem;padding:0.6rem 1.2rem;border-bottom:1px solid rgba(0,0,0,0.05)}
.stage-dots-row.hidden{display:none}
.stage-dot-wrapper{display:flex;flex-direction:column;align-items:center;gap:0.3rem;cursor:pointer;transition:all 0.2s;padding:0.2rem 0.4rem;border-radius:0.5rem}
.stage-dot-wrapper:hover{background:rgba(0,0,0,0.04)}
.stage-dot{width:8px;height:8px;border-radius:50%;background:rgba(0,0,0,0.15);transition:all 0.25s cubic-bezier(0.4,0,0.2,1)}
.stage-dot-label{font-family:'Barlow Condensed',sans-serif;font-size:0.56rem;font-weight:800;text-transform:uppercase;letter-spacing:0.08em;color:rgba(0,0,0,0.3);transition:color 0.2s}
.stage-dot-wrapper.current .stage-dot{background:var(--acc);box-shadow:0 0 0 3px rgba(194,104,31,0.2);transform:scale(1.25)}
.stage-dot-wrapper.current .stage-dot-label{color:var(--acc)}

/* ── SCROLL AREA ── */
.card-scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:1rem 1.2rem 0.5rem}
.card-scroll::-webkit-scrollbar{width:3px}
.card-scroll::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.1);border-radius:2px}

.para-label{font-family:'Barlow Condensed',sans-serif;font-size:0.52rem;font-weight:900;letter-spacing:0.18em;text-transform:uppercase;color:rgba(0,0,0,0.28);margin-bottom:0.4rem}
.section-heading{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.05rem;color:var(--acc);margin-bottom:0.75rem;letter-spacing:0.01em}
.para-text{font-family:'Instrument Sans',sans-serif;font-size:0.88rem;line-height:1.8;color:rgba(0,0,0,0.78);font-weight:400;margin-bottom:1.4rem}
.para-text:last-child{margin-bottom:0}

.topic-key{color:var(--c-discourse);cursor:pointer}
.topic-count{font-family:'Barlow Condensed',sans-serif;font-size:0.62em;font-weight:800;vertical-align:super;margin-left:0.12em;color:var(--c-discourse);opacity:0.75;cursor:pointer}
.topic-count:hover{opacity:1}

.xray-on .dm{color:inherit;font-weight:600;background:var(--c-discourse-bg);padding:0.05em 0.2em;border-radius:3px;cursor:text}

.phrase-enhanced{position:relative;display:inline}
.phrase-text{color:var(--c-discourse);font-weight:600;border-bottom:1.5px solid rgba(37,99,235,0.4);cursor:pointer;padding:0.05em 0;transition:background 0.15s}
.phrase-text:hover{background:var(--c-discourse-bg);border-radius:2px}
.phrase-hint-btn{background:var(--c-discourse-bg);border:none;border-radius:50%;width:18px;height:18px;font-size:0.6rem;cursor:pointer;vertical-align:middle;margin-left:2px;display:inline-flex;align-items:center;justify-content:center;transition:background 0.15s}
.phrase-hint-btn:hover{background:rgba(37,99,235,0.2)}

/* ══ BOARD MODE — classroom width, broadsheet columns ══ */
@media(min-width:820px){
 .poster{width:min(1180px,95vw);height:min(660px,100%)}
  .card-scroll{padding:1.5rem 2.6rem 1.2rem}
  #infographic.board-cols .para-text{max-width:940px;margin:0 auto 1.6rem;font-size:1.22rem;line-height:1.95}
  #infographic.board-cols .para-label,
  #infographic.board-cols .section-heading{max-width:940px;margin-left:auto;margin-right:auto}
  #infographic:not(.board-cols) .para-label{max-width:660px;margin:0.4rem auto 0.6rem;font-size:0.62rem;text-align:center}
  #infographic:not(.board-cols) .section-heading{max-width:660px;margin:0 auto 0.75rem;text-align:center}
  #infographic:not(.board-cols) .para-text{max-width:660px;margin:0 auto;font-size:1.18rem;line-height:1.95}
  .state-msg{font-size:1rem}
}

/* ── PARA NAV ── */
.para-nav{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0.5rem 1rem;border-top:1px solid rgba(0,0,0,0.06)}
.para-nav.hidden{display:none}
.para-arrow{background:var(--acc);border:none;width:2.6rem;height:2.6rem;border-radius:50%;font-size:1.15rem;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center;transition:all 0.18s;box-shadow:0 3px 10px rgba(0,0,0,0.2)}
.para-arrow:hover:not(:disabled){transform:scale(1.08);box-shadow:0 5px 14px rgba(0,0,0,0.28)}
.para-arrow:active:not(:disabled){transform:scale(0.95)}
.para-arrow:disabled{background:rgba(0,0,0,0.08);color:rgba(0,0,0,0.25);box-shadow:none;cursor:not-allowed}
.para-nav-label{font-family:'Barlow Condensed',sans-serif;font-size:0.78rem;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;color:rgba(0,0,0,0.42)}

/* ── ACCENT BAR ── */
.accent-bar{height:4px;background:var(--acc);flex-shrink:0;border-radius:0 0 1.4rem 1.4rem;opacity:0.7}

/* ── STATE MSG ── */
.state-msg{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:0.75rem;font-size:0.85rem;color:rgba(0,0,0,0.28);text-align:center;line-height:1.6;font-family:'Barlow',sans-serif}

/* ── ALT MODAL ── */
.alt-overlay{position:fixed;inset:0;background:rgba(20,18,22,0.5);backdrop-filter:blur(3px);z-index:500;display:none;align-items:flex-end;justify-content:center;padding:1rem}
.alt-overlay.open{display:flex;animation:altFade .2s ease both}
@keyframes altFade{from{opacity:0}to{opacity:1}}
.alt-modal{background:var(--white);border-radius:1.1rem;width:100%;max-width:520px;max-height:70vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 -4px 40px rgba(0,0,0,0.22);animation:altUp .28s cubic-bezier(.34,1.56,.64,1) both}
@keyframes altUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.alt-header{padding:1rem 1.15rem 0.8rem;border-bottom:1px solid rgba(0,0,0,0.07);display:flex;align-items:flex-start;justify-content:space-between;gap:0.6rem;flex-shrink:0}
.alt-title{font-family:'Barlow Condensed',sans-serif;font-size:0.9rem;font-weight:900;letter-spacing:0.04em;text-transform:uppercase;color:var(--ink)}
.alt-phrase{font-size:0.82rem;color:var(--c-discourse);font-weight:600;margin-top:0.15rem}
.alt-close{background:rgba(0,0,0,0.06);border:none;width:1.9rem;height:1.9rem;border-radius:50%;font-size:1rem;color:rgba(0,0,0,0.45);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.alt-close:hover{background:rgba(0,0,0,0.11)}
.alt-body{overflow-y:auto;padding:0.6rem;flex:1}
.alt-category{font-family:'Barlow Condensed',sans-serif;font-size:0.58rem;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:rgba(0,0,0,0.3);padding:0.45rem 0.5rem 0.55rem}
.alt-item{padding:0.62rem 0.8rem;border-radius:0.55rem;font-family:'Instrument Sans',sans-serif;font-size:0.88rem;color:rgba(0,0,0,0.75);cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:space-between;gap:0.5rem}
.alt-item:hover{background:var(--c-discourse-bg);color:var(--c-discourse)}
.alt-copy-hint{font-family:'Barlow Condensed',sans-serif;font-size:0.55rem;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;color:rgba(0,0,0,0.22);flex-shrink:0}

.toast{position:fixed;bottom:5rem;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:0.45rem 1.1rem;border-radius:2rem;font-family:'Barlow Condensed',sans-serif;font-size:0.7rem;font-weight:900;letter-spacing:0.06em;opacity:0;pointer-events:none;transition:opacity 0.25s;z-index:600;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="shell">

  <div class="topbar">
    <a href="report-question-selector.html" class="back-link">← Questions</a>
    <span class="brand">INTUITY</span>
    <span class="topic-label">
      SAMPLE REPORT
      <div class="menu-btn" id="menuBtn" onclick="toggleMenu()">
        <div class="menu-dots"><span></span><span></span><span></span></div>
      </div>
    </span>
    <div class="menu-dropdown" id="menuDropdown">
      <div class="menu-section-label">Options</div>
      <div class="menu-item" onclick="copyAllSections()">📋 Copy full report<span></span></div>
    </div>
  </div>

  <div class="stage">
    <div class="poster" id="posterCard">

      <div class="flag">
        <div class="flag-body">
          <span class="flag-num">R</span>
          <span class="flag-label">Report</span>
        </div>
      </div>

      <div class="card-toolbar">
        <button class="style-btn active" id="styleDefault" onclick="selectStyle('default')">Default</button>
        <button class="style-btn" id="styleFormal" onclick="selectStyle('formal')">Alternative 1</button>
        <button class="style-btn" id="stylePro" onclick="selectStyle('professional')">Alternative 2</button>
        <div class="toolbar-spacer"></div>
        <div class="view-toggle">
          <button class="vt-btn active" id="switchFullText" onclick="setViewMode(true)">Full Text</button>
          <button class="vt-btn" id="switchSections" onclick="setViewMode(false)">Sections</button>
        </div>
      </div>

      <div class="xray-row">
        <div class="xray-toggle" onclick="toggleXRay()">
          <div class="xray-switch" id="xraySwitch"></div>
          <span class="xray-label">X-Ray</span>
        </div>
        <div class="xray-toggle" onclick="togglePhrases()">
          <div class="xray-switch" id="phraseSwitch"></div>
          <span class="xray-label">Phrases<span class="phrase-badge" id="phraseBadge"></span></span>
        </div>
        <div class="legend" id="legend">
          <span class="legend-item"><span class="legend-dot"></span>Signpost</span>
        </div>
      </div>

      <div class="stage-dots-row hidden" id="stageDots"></div>

      <div class="card-scroll" id="infographic">
        <div class="state-msg">Loading sample…</div>
      </div>

      <div class="para-nav hidden" id="paraNav">
        <button class="para-arrow" id="btnPrev" onclick="goPrev()" disabled>←</button>
        <div class="para-nav-label" id="paraLabel">Introduction</div>
        <button class="para-arrow" id="btnNext" onclick="goNext()">→</button>
      </div>

      <div class="accent-bar"></div>
    </div>
  </div>

  <div class="foot">
    <div class="nav-pill">
      <button class="nb" onclick="navTo('question')">question</button>
      <button class="nb" onclick="navTo('plan')">plan</button>
      <button class="nb" onclick="navTo('model')">model</button>
      <button class="nb on" onclick="navTo('sample')">sample</button>
    </div>
  </div>
</div>

<div class="alt-overlay" id="altOverlay" onclick="closeAlt(event)">
  <div class="alt-modal" onclick="event.stopPropagation()">
    <div class="alt-header">
      <div>
        <div class="alt-title">Alternative Expressions</div>
        <div class="alt-phrase" id="altPhrase"></div>
      </div>
      <button class="alt-close" onclick="closeAlt()">×</button>
    </div>
    <div class="alt-body" id="altBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ════════════════════════════════
   STATE
════════════════════════════════ */
let question      = null;
let sections      = [];     // Array of {heading, content}
let currentSection = 0;
let currentStyle  = 'default';
let xrayOn        = false;
let phrasesOn     = false;
let fullTextMode  = true;
let phraseDB      = {};
let phraseReady   = false;
let sampleData    = null;

const SECTION_LABELS = ['Introduction', 'Body', 'Issues', 'Recommendations', 'Conclusion'];
const STAGE_SHORT    = ['Intro', 'Body', 'Issues', 'Recommend', 'Concl.'];

/* ════════════════════════════════
   DISCOURSE MARKERS — X-Ray
════════════════════════════════ */
const DM = [
  'The main objective of this report is to assess',
  'The main objective of this report is to evaluate',
  'This report focuses on',
  'The primary aim of this report is to',
  'The purpose of this report is to',
  'This report is based on',
  'The findings in this report are drawn from',

function wrapDM(html) {
  let out = html;
  DM.forEach(dm => {
    const esc = dm.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    const re  = new RegExp(`(?<![a-zA-Z<"'])(${esc})(?![a-zA-Z<"'])`, 'g');
    if (new RegExp(`<span class="phrase-text"[^>]*>[^<]*${esc}`,'i').test(out)) return;
    out = out.replace(re, `<span class="dm">$1</span>`);
  });
  return out;
}

/* ════════════════════════════════
   PHRASE DATABASE
════════════════════════════════ */
function buildPhraseDB(json) {
  phraseDB = {};
  CORPUS = json || null;
  const moves = (json && json.moves) || {};
  const keyOf = t => {
    const segs = String(t).split(/\.\.\.|…/)
      .map(x => x.trim().replace(/^[^A-Za-z]+/, '').replace(/[.,;:!?]+$/, ''))
      .filter(x => x.split(/\s+/).length >= 3);
    return segs.sort((a, b) => b.length - a.length)[0] || '';
  };
  Object.keys(moves).forEach(mv => {
    const funcs = moves[mv] || {};
    Object.keys(funcs).forEach(fn => {
      const subs = funcs[fn] || {};
      const whole = [].concat(...Object.keys(subs).map(sb => subs[sb].map(e => e.t)));
      Object.keys(subs).forEach(sb => {
        const here = subs[sb].map(e => e.t);
        const pool = here.length >= 4 ? here : whole;
        const label = mv + ' — ' + fn.replace(/_/g, ' ');
        subs[sb].forEach(e => {
          const k = keyOf(e.t);
          if (!k) return;
          const alts = pool.filter(x => x !== e.t);
          if (!phraseDB[k] || alts.length > phraseDB[k].alternatives.length)
            phraseDB[k] = { category: label, alternatives: alts };
        });
      });
    });
  });
  phraseReady = Object.keys(phraseDB).length > 0;
}

let CORPUS = null;
function altsForFunction(path) {
  if (!CORPUS || !path) return [];
  const bits = String(path).split('/'), fn = bits[0], sub = bits.slice(1).join('/');
  const moves = CORPUS.moves || {};
  for (const mv of Object.keys(moves)) {
    const f = moves[mv][fn];
    if (!f) continue;
    const here = (f[sub] || []).map(e => e.t);
    if (here.length >= 4) return here;
    return [].concat(...Object.keys(f).map(k => f[k].map(e => e.t)));
  }
  return [];
}
function showAltsFn(path) {
  const alts = altsForFunction(path);
  const ov = document.getElementById('altOverlay'),
        ph = document.getElementById('altPhrase'),
        bd = document.getElementById('altBody');
  if (!alts.length || !ov || !ph || !bd) return;
  ph.textContent = String(path).split('/')[0].replace(/_/g, ' ');
  bd.innerHTML = `<div class="alt-category">${alts.length} ways to open this section</div>` +
    alts.map(a => {
      const safe = String(a).replace(/'/g, "\\'").replace(/"/g, '&quot;');
      return `<div class="alt-item" onclick="copyAlt('${safe}')"><span>${String(a).replace(/&/g,'&amp;').replace(/</g,'&lt;')}</span><span class="alt-copy-hint">tap to copy</span></div>`;
    }).join('');
  ov.classList.add('open');
}
window.showAltsFn = showAltsFn;
function markTopic(html, span, path) {
  if (!span || !path) return { html, count: 0 };
  const alts = altsForFunction(path);
  if (!alts.length) return { html, count: 0 };
  const words = span.split(/\s+/).filter(Boolean)
    .map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  if (!words.length) return { html, count: 0 };
  const between = '(?:<[^>]*>|[\\s,;:.\u2019\'"()-]|&[a-z]+;)*';
  const m = new RegExp(words.join(between), 'i').exec(html);
  if (!m) return { html, count: 0 };
  const wrapped = m[0].replace(/(^|>)([^<]+)/g, (all, gt, txt) =>
    txt.trim() ? gt + '<span class="topic-key">' + txt + '</span>' : all);
  const safe = String(path).replace(/'/g, "\\'");
  const tail = `<span class="topic-count" onclick="showAltsFn('${safe}')">${alts.length}</span>`;
  return { html: html.slice(0, m.index) + wrapped + tail + html.slice(m.index + m[0].length), count: 1 };
}
function topicFor(i) {
  const t = (sampleData && sampleData.topics && sampleData.topics[currentStyle]) || [];
  return t[i] || null;
}

function enhancePhrases(html) {
  if (!phraseReady) return { html, count: 0 };
  let out = html, count = 0;
  const seen = new Set();
  Object.keys(phraseDB)
    .filter(p => phraseDB[p].alternatives.length > 0)
    .sort((a,b) => b.length - a.length)
    .forEach(phrase => {
      const esc = phrase.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      const re  = new RegExp(`(?<![a-zA-Z<"'])(${esc})(?![a-zA-Z<"'])`, 'gi');
      out = out.replace(re, match => {
        const k = match.toLowerCase();
        if (seen.has(k)) return match;
        seen.add(k); count++;
        const safe = phrase.replace(/'/g,"\\'").replace(/"/g,'\\"');
        return `<span class="phrase-enhanced"><span class="phrase-text" onclick="showAlts('${safe}')">${match}</span><button class="phrase-hint-btn" onclick="event.stopPropagation();showAlts('${safe}')">💡</button></span>`;
      });
    });
  return { html: out, count };
}

/* ════════════════════════════════
   EXTRACT SECTIONS
════════════════════════════════ */
function extractSections(html) {
  const div = document.createElement('div');
  div.innerHTML = html;
  const reportSections = div.querySelectorAll('.report-section');
  if (reportSections.length) {
    return Array.from(reportSections).map(sec => ({
      heading: sec.querySelector('.section-heading')?.innerHTML || '',
      content: sec.querySelector('.section-content')?.innerHTML || ''
    }));
  }
  return [];
}

/* ════════════════════════════════
   VIEW MODE
════════════════════════════════ */
function setViewMode(isFullText) {
  fullTextMode = isFullText;
  document.getElementById('switchFullText').classList.toggle('active', isFullText);
  document.getElementById('switchSections').classList.toggle('active', !isFullText);
  document.getElementById('stageDots').classList.toggle('hidden', isFullText);
  document.getElementById('paraNav').classList.toggle('hidden', isFullText);
  render();
}

/* ════════════════════════════════
   RENDER
════════════════════════════════ */
function render() {
  const box = document.getElementById('infographic');
  box.classList.toggle('board-cols', fullTextMode);
  if (!sections.length) {
    box.innerHTML = `<div class="state-msg">No sample report found for this question yet.</div>`;
    return;
  }

  let html = '';
  let totalPhraseCount = 0;

  if (fullTextMode) {
    html = sections.map((sec, idx) => {
      const label = SECTION_LABELS[idx] || `Section ${idx+1}`;
      let heading = sec.heading;
      let content = sec.content;

      if (phrasesOn) {
        const r1 = enhancePhrases(heading);
        heading = r1.html;
        totalPhraseCount += r1.count;

        const r2 = enhancePhrases(content);
        content = r2.html;
        totalPhraseCount += r2.count;
      }

      const tp = topicFor(idx);
      if (tp && tp.function) content = markTopic(content, tp.span, tp.function).html;

      if (xrayOn) {
        heading = wrapDM(heading);
        content = wrapDM(content);
      }

      return `<div class="para-label">${label}</div>
              <div class="section-heading">${heading}</div>
              <div class="para-text ${xrayOn ? 'xray-on' : ''}">${content}</div>`;
    }).join('');
    box.innerHTML = html;

  } else {
    const sec = sections[currentSection];
    if (!sec) {
      box.innerHTML = `<div class="state-msg">No content for this section.</div>`;
      return;
    }

    let heading = sec.heading;
    let content = sec.content;

    if (phrasesOn) {
      const r1 = enhancePhrases(heading);
      heading = r1.html;
      totalPhraseCount += r1.count;

      const r2 = enhancePhrases(content);
      content = r2.html;
      totalPhraseCount += r2.count;
    }

    if (xrayOn) {
      heading = wrapDM(heading);
      content = wrapDM(content);
    }

    const label = SECTION_LABELS[currentSection] || `Section ${currentSection+1}`;
    box.innerHTML = `
      <div class="para-label">${label}</div>
      <div class="section-heading">${heading}</div>
      <div class="para-text ${xrayOn ? 'xray-on' : ''}">${content}</div>`;
  }

  const badge = document.getElementById('phraseBadge');
  if (phrasesOn && totalPhraseCount > 0) {
    badge.textContent = totalPhraseCount;
    badge.classList.add('on');
  } else {
    badge.classList.remove('on');
  }

  if (!fullTextMode) updateNav();
}

/* ════════════════════════════════
   NAVIGATION
════════════════════════════════ */
function buildDots(count) {
  document.getElementById('stageDots').innerHTML =
    Array.from({length: count}, (_,i) =>
      `<div class="stage-dot-wrapper${i===0?' current':''}" onclick="goTo(${i})">
         <div class="stage-dot"></div>
         <span class="stage-dot-label">${STAGE_SHORT[i] || 'S'+(i+1)}</span>
       </div>`).join('');
}

function updateNav() {
  document.getElementById('btnPrev').disabled = currentSection === 0;
  document.getElementById('btnNext').disabled = currentSection >= sections.length - 1;
  document.getElementById('paraLabel').textContent = SECTION_LABELS[currentSection] || `Section ${currentSection+1}`;
  document.querySelectorAll('.stage-dot-wrapper').forEach((el,i) =>
    el.classList.toggle('current', i === currentSection));
}

function goPrev() { if (currentSection > 0) { currentSection--; render(); } }
function goNext() { if (currentSection < sections.length-1) { currentSection++; render(); } }
function goTo(i)  { if (i >= 0 && i < sections.length) { currentSection = i; render(); } }

/* ════════════════════════════════
   TOOLS
════════════════════════════════ */
function toggleXRay() {
  xrayOn = !xrayOn;
  document.getElementById('xraySwitch').classList.toggle('on', xrayOn);
  render();
}

function togglePhrases() {
  if (!phraseReady) { showToast('Phrase bank not loaded'); return; }
  phrasesOn = !phrasesOn;
  document.getElementById('phraseSwitch').classList.toggle('on', phrasesOn);
  render();
}

function copyAllSections() {
  const full = sections.map(s => {
    const div = document.createElement('div');
    div.innerHTML = s.heading + '\n\n' + s.content;
    return (div.textContent || '').trim();
  }).join('\n\n\n');
  navigator.clipboard.writeText(full)
    .then(() => { showToast('Full report copied ✓'); closeMenu(); })
    .catch(() => showToast('Copy failed'));
}

/* ════════════════════════════════
   STYLE SELECTOR
════════════════════════════════ */
function selectStyle(style) {
  currentStyle = style;
  document.getElementById('styleDefault').classList.toggle('active', style === 'default');
  document.getElementById('styleFormal').classList.toggle('active',  style === 'formal');
  document.getElementById('stylePro').classList.toggle('active',     style === 'professional');

  if (sampleData) {
    const html = sampleData.styles?.[style] || sampleData.styles?.default || '';
    sections = extractSections(html);
    currentSection = 0;
    buildDots(sections.length);
    render();
  }
}

/* ════════════════════════════════
   ALTERNATIVES MODAL
════════════════════════════════ */
function showAlts(phrase) {
  const key = Object.keys(phraseDB).find(k => k.toLowerCase() === phrase.toLowerCase()) || phrase;
  const data = phraseDB[key];
  if (!data || !data.alternatives.length) { showToast('No alternatives found'); return; }

  document.getElementById('altPhrase').textContent = `"${phrase}"`;
  document.getElementById('altBody').innerHTML =
    `<div class="alt-category">${data.category} — ${data.alternatives.length} alternatives</div>` +
    data.alternatives.map(alt => {
      const safe = alt.replace(/'/g,"\\'").replace(/"/g,'\\"');
      return `<div class="alt-item" onclick="copyAlt('${safe}')"><span>${alt}</span><span class="alt-copy-hint">tap to copy</span></div>`;
    }).join('');

  document.getElementById('altOverlay').classList.add('open');
}

function copyAlt(text) {
  navigator.clipboard.writeText(text)
    .then(() => { showToast('Copied: ' + text); closeAlt(); })
    .catch(() => showToast('Copy failed'));
}

function closeAlt(e) {
  if (e && e.target.id !== 'altOverlay') return;
  document.getElementById('altOverlay').classList.remove('open');
}

/* ════════════════════════════════
   MENU
════════════════════════════════ */
function toggleMenu() { document.getElementById('menuDropdown').classList.toggle('open'); }
function closeMenu()  { document.getElementById('menuDropdown').classList.remove('open'); }
document.addEventListener('click', e => {
  if (!document.getElementById('menuDropdown').contains(e.target) &&
      !document.getElementById('menuBtn').contains(e.target)) closeMenu();
});

/* ════════════════════════════════
   TOAST
════════════════════════════════ */
let _tt;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(_tt); _tt = setTimeout(() => el.classList.remove('show'), 2200);
}

/* ════════════════════════════════
   KEYBOARD + SWIPE
════════════════════════════════ */
document.addEventListener('keydown', e => {
  if (fullTextMode) return;
  if (e.key === 'ArrowRight') goNext();
  if (e.key === 'ArrowLeft')  goPrev();
  if (e.key === 'Escape')     closeAlt();
});
let _tx = 0;
if ('ontouchstart' in window) {
  document.addEventListener('touchstart', e => { _tx = e.changedTouches[0].screenX; });
  document.addEventListener('touchend',   e => {
    if (fullTextMode) return;
    const dx = e.changedTouches[0].screenX - _tx;
    if (dx < -50) goNext();
    if (dx >  50) goPrev();
  });
}

/* ════════════════════════════════
   FOOTER NAV
════════════════════════════════ */
function navTo(dest) {
  if (dest === 'sample') return;
  if (question) sessionStorage.setItem('currentReportQuestion', JSON.stringify(question));
  const map = {
    question: 'report-question-selector.html',
    plan:     'report-plan.html',
    model:    'reports-cards.html',
  };
  if (map[dest]) window.location.href = map[dest];
}

/* ════════════════════════════════
   INIT
════════════════════════════════ */
async function init() {
  fetch('data/reports-expressions.json')
    .then(r => r.ok ? r.json() : null)
    .then(d => { if (d) buildPhraseDB(d); })
    .catch(() => {});

  try { question = JSON.parse(sessionStorage.getItem('currentReportQuestion')); } catch(e) {}
  if (!question) {
    document.getElementById('infographic').innerHTML =
      `<div class="state-msg">No question selected.<br>Return to Questions to choose one.</div>`;
    return;
  }

  try {
    const res = await fetch('data/report-samples.json');
    if (!res.ok) throw new Error('data/report-samples.json not found');
    const data = await res.json();
    const pool = data.reports || [];
    const match = pool.find(r => r.id === question.id);

    if (!match) {
      document.getElementById('infographic').innerHTML =
        `<div class="state-msg">No sample report for this question yet.<br>
         <small style="opacity:0.35;margin-top:0.5rem;display:block;">id: ${question.id}</small></div>`;
      return;
    }

    sampleData = match;
    const html = match.styles?.default || '';
    sections = extractSections(html);
    buildDots(sections.length);
    render();

  } catch(err) {
    document.getElementById('infographic').innerHTML =
      `<div class="state-msg">Could not load data/report-samples.json<br>
       <small style="opacity:0.35;margin-top:0.5rem;display:block;">${err.message}</small></div>`;
  }
}

init();
</script>
