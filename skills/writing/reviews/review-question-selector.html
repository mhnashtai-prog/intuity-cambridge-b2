<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Review Questions — INTUITY</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Barlow:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Barlow+Condensed:wght@700;800;900&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500&family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=7">
<link rel="stylesheet" href="/data/writing/writing.css?v=2">
<style>
:root{
  --bg:#f0efec;--ink:#111111;--white:#ffffff;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;position:fixed;background:var(--bg);font-family:'Barlow',sans-serif;-webkit-font-smoothing:antialiased}
.shell{position:fixed;inset:0;display:flex;flex-direction:column}

/* ── TOPBAR ── */
.topbar{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0.65rem 1.25rem;background:rgba(240,239,236,0.95);backdrop-filter:blur(12px);border-bottom:1.5px solid rgba(0,0,0,0.07);z-index:100}
.back-link{text-decoration:none;font-size:0.72rem;font-weight:700;color:rgba(0,0,0,0.38);letter-spacing:0.05em;text-transform:uppercase;transition:color 0.2s}
.back-link:hover{color:rgba(0,0,0,0.65)}
.brand{font-family:'Barlow Condensed',sans-serif;font-size:0.7rem;font-weight:900;letter-spacing:0.28em;text-transform:uppercase;color:rgba(0,0,0,0.18)}

/* ── FILTER BAR ── */
.filter-bar{flex-shrink:0;display:flex;align-items:center;gap:0.25rem;padding:0.45rem 1.1rem;background:rgba(240,239,236,0.8);border-bottom:1px solid rgba(0,0,0,0.06);overflow-x:auto}
.filter-bar::-webkit-scrollbar{display:none}
.ftab{background:transparent;border:none;padding:0.28rem 0.65rem;border-radius:2rem;font-family:'Barlow',sans-serif;font-size:0.58rem;font-weight:700;color:rgba(0,0,0,0.3);cursor:pointer;transition:all 0.2s;white-space:nowrap;letter-spacing:0.06em;text-transform:uppercase}
.ftab:hover{color:rgba(0,0,0,0.55);background:rgba(0,0,0,0.05)}
.ftab.active{background:var(--ink);color:#fff}

/* ── STAGE ── */
.stage{flex:1;min-height:0;position:relative;overflow-y:auto;display:flex;align-items:flex-start;justify-content:center;padding:1.5rem 0 2rem}

/* ── FOOTER NAV ── */
.foot{flex-shrink:0;display:flex;justify-content:center;padding:0.5rem 1rem calc(env(safe-area-inset-bottom,0px) + 0.55rem);background:rgba(240,239,236,0.95);border-top:1px solid rgba(0,0,0,0.06)}
.nav-pill{display:flex;gap:0.12rem;background:rgba(10,10,10,0.07);border-radius:2rem;padding:0.25rem 0.28rem}
.nb{background:transparent;border:none;padding:0.35rem 0.75rem;border-radius:1.5rem;font-family:'Barlow',sans-serif;font-size:0.6rem;letter-spacing:0.03em;color:rgba(0,0,0,0.28);cursor:pointer;transition:all 0.22s;white-space:nowrap;min-height:28px;font-weight:700;text-transform:uppercase}
.nb.on{background:var(--ink);color:#fff;font-weight:800}
.nb:hover:not(.on){color:rgba(0,0,0,0.5)}

/* ══ POSTER CARD — built on the shell's .poster (intuity-shell.css §14) ══
   Only sizing, the review-specific list, and the footer nav live here.
   Everything else — paper colour, kicker block, headline font, rule,
   pills — comes from the shell so this card matches every other page. */
.poster{width:min(730px,90vw);max-height:min(560px,82vh);display:flex;flex-direction:column;overflow:hidden;animation:cardEnter 0.4s cubic-bezier(0.2,1,0.4,1) both}
@keyframes cardEnter{from{opacity:0;transform:translateY(10px) scale(0.98)}to{opacity:1;transform:none}}

.poster-head{font-size:clamp(1.12rem,4vw,1.48rem)}

.poster-scroll{flex:1;overflow-y:auto;min-height:0}

.kp-list{display:flex;flex-direction:column;gap:0.55rem;margin-top:0.2rem}
.kp-item{display:flex;align-items:flex-start;gap:0.55rem;font-family:var(--f-body);font-size:0.85rem;font-weight:500;line-height:1.4;color:var(--poster-body)}
.kp-arrow{flex-shrink:0;width:16px;height:16px;margin-top:0.1rem;color:var(--caramel);opacity:0.8}

.poster-foot{display:flex;align-items:center;justify-content:space-between;margin-top:1.1rem;padding-top:0.9rem;border-top:1px solid var(--poster-rule)}
.poster-nav-btn{background:none;border:none;cursor:pointer;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--poster-faint);transition:background 0.15s,color 0.15s}
.poster-nav-btn:hover{background:var(--poster-fill);color:var(--poster-ink)}
.poster-nav-btn:disabled{opacity:0.25;cursor:default}
.poster-counter{font-family:var(--f-mono);font-size:0.75rem;font-weight:600;letter-spacing:0.04em;color:var(--poster-faint)}

/* ── HINTS ── */
.swipe-hint{position:absolute;bottom:1.2rem;left:50%;transform:translateX(-50%);font-size:0.58rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:rgba(0,0,0,0.18);pointer-events:none;animation:hintFade 3.5s ease 1.5s forwards;white-space:nowrap}
@keyframes hintFade{0%{opacity:1}80%{opacity:1}100%{opacity:0}}
.loading-msg{font-family:'Barlow Condensed',sans-serif;font-size:0.85rem;font-weight:700;color:rgba(0,0,0,0.25);letter-spacing:0.12em;text-transform:uppercase}
</style>
</head>
<body data-writing="reviews" data-stage="question">
<div class="shell">
  <div class="topbar">
<a class="back-link" href="/skills/writing/writing-door.html">← Writing</a>
    <span class="brand">INTUITY</span>
    <div style="width:60px"></div>
  </div>

  <div class="filter-bar" id="filterBar"></div>

  <div class="stage" id="stage">
    <div class="loading-msg" id="loadingMsg">Loading…</div>
    <div class="swipe-hint">swipe to browse</div>
  </div>

  <div class="foot">
    <div class="nav-pill">
      <button class="nb on"  onclick="navTo('question')">Question</button>
      <button class="nb"     onclick="navTo('plan')">Plan</button>
      <button class="nb"     onclick="navTo('model')">Model</button>
      <button class="nb"     onclick="navTo('sample')">Sample</button>
    </div>
  </div>
</div>

<script>
/* ── CATEGORY → LABEL (colour is no longer per-category; the shell's
   single accent now marks every card the same way) ── */
const CAT_LABEL={
  'entertainment':'Entertainment',
  'food':'Food & Restaurants',
  'travel':'Travel & Places',
  'books':'Books',
  'technology':'Technology',
};

/* filter tabs — 'all' + each category */
const FILTERS=['all','entertainment','food','travel','books','technology'];

let allQs=[],filteredQs=[],current=0,activeFilter='all',touchStartX=0;

/* ── BUILD FILTER BAR ── */
function buildFilterBar(){
  document.getElementById('filterBar').innerHTML=FILTERS.map(f=>{
    const count=f==='all'?allQs.length:allQs.filter(q=>q.category===f).length;
    const label=f==='all'?`All (${count})`:`${CAT_LABEL[f]||f} (${count})`;
    return `<button class="ftab ${f===activeFilter?'active':''}" onclick="applyFilter('${f}')">${label}</button>`;
  }).join('');
}

function applyFilter(f){
  activeFilter=f;
  filteredQs=f==='all'?[...allQs]:allQs.filter(q=>q.category===f);
  current=0;
  buildFilterBar();
  if(filteredQs.length)showCard(0);
  else{
    const stage=document.getElementById('stage');
    const old=stage.querySelector('.poster');
    if(old)old.remove();
  }
}

/* ── BUILD CARD ── */
function buildCard(q,idx,total){
  const catLabel=CAT_LABEL[q.category]||q.category||'Review';
  const points=q.keyPoints||[];
  const el=document.createElement('div');
  el.className='poster';
  el.innerHTML=`
    <div class="poster-kick"><i></i><span>${String(idx+1).padStart(2,'0')} · Write a review · ${catLabel}</span></div>
    <div class="poster-scroll">
      <h3 class="poster-head">${q.question}</h3>
      <hr class="poster-rule">
      <div class="poster-sub">Your review should cover</div>
      <div class="kp-list">${points.map(p=>`
        <div class="kp-item">
          <svg class="kp-arrow" width="16" height="16" viewBox="0 0 14 14" fill="none">
            <path d="M5 3L9 7L5 11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>${p}</span>
        </div>`).join('')}
      </div>
    </div>
    <div class="poster-foot">
      <button class="poster-nav-btn" onclick="go(-1)" ${idx===0?'disabled':''}><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9 3L5 7L9 11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <span class="poster-counter">${idx+1} / ${total}</span>
      <button class="poster-nav-btn" onclick="go(1)" ${idx===total-1?'disabled':''}><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M5 3L9 7L5 11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>`;
  return el;
}

/* ── SHOW CARD ── */
function showCard(idx){
  current=Math.max(0,Math.min(idx,filteredQs.length-1));
  const stage=document.getElementById('stage');
  const old=stage.querySelector('.poster');
  if(old)old.remove();
  const q=filteredQs[current];
  if(!q)return;
  stage.appendChild(buildCard(q,current,filteredQs.length));
  /* write sessionStorage for the chain */
 sessionStorage.setItem('currentReviewQuestion',JSON.stringify({
    id:          q.id,
    questionId:  q.id,
    question:    q.question,
    announcement:q.announcement||'',
    context:     q.context||'',
    keyPoints:   q.keyPoints||[],
    category:    q.category||'',
    subject:     q.subject||''
  }));
}

function go(dir){
  const n=current+dir;
  if(n<0||n>=filteredQs.length)return;
  showCard(n);
}

/* ── SWIPE & KEYBOARD ── */
document.addEventListener('touchstart',e=>{touchStartX=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-touchStartX;
  if(dx<-55)go(1);
  if(dx>55)go(-1);
},{passive:true});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')go(1);
  if(e.key==='ArrowLeft')go(-1);
});

/* ── FOOTER NAV ── */
function navTo(dest){
  if(dest==='question')return;
  const map={
    plan:    'review-plan.html',
    model:   'reviews-cards.html',
    sample:  'review-sample.html'
  };
  if(map[dest])window.location.href=map[dest];
}

/* ── INIT ── */
async function init(){
  try{
    const r=await fetch('data/review-questions.json');
    if(!r.ok)throw new Error();
    const data=await r.json();
    allQs=data.questions||[];

    /* If the JSON uses reviewTypes to tag questions, apply category from that map */
    const reviewTypes=data.reviewTypes||{};
    if(Object.keys(reviewTypes).length){
      /* Build a reverse map: id → category */
      const idToCategory={};
      Object.entries(reviewTypes).forEach(([cat,ids])=>{
        (Array.isArray(ids)?ids:[]).forEach(id=>{idToCategory[id]=cat;});
      });
      allQs=allQs.map(q=>({...q,category:q.category||idToCategory[q.id]||'entertainment'}));
    }

    filteredQs=[...allQs];
    document.getElementById('loadingMsg').remove();
    buildFilterBar();

    /* restore last question */
    let startIdx=0;
    try{
      const saved=sessionStorage.getItem('currentReviewQuestion');
      if(saved){
        const q=JSON.parse(saved);
        const id=q.questionId||q.id;
        if(id){
          const f=filteredQs.findIndex(x=>x.id===id);
          if(f>=0)startIdx=f;
        }
      }
    }catch(e){}
    if(filteredQs.length)showCard(startIdx);
  }catch(e){
    document.getElementById('loadingMsg').textContent='⚠ Could not load questions';
  }
}
init();
</script>
<script src="/skills/grammar-rules/intuity-sound.js"></script>
<script src="/data/writing/writing-chrome.js?v=2"></script>
</body>
</html>
