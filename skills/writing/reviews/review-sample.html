<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Sample Review — INTUITY</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Barlow:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&family=Barlow+Condensed:wght@700;800;900&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#f0efec;--ink:#111111;--white:#ffffff;--rule:rgba(0,0,0,0.07);
  --acc:#5a9657; /* fallback only — applyAccent(question.essayType) overrides this at init */
  --gold:#C9A961;

  /* category colours — mirror the Model page's phrase families:
     discourse = signpost / linking words, opinion = view / stance phrases,
     causal    = reason → result chain (the "support move" layer) */
  --c-discourse:#2563EB; --c-discourse-bg:rgba(37,99,235,0.10);
  --c-opinion:#7b5ea7;   --c-opinion-bg:rgba(123,94,167,0.12);
  --c-causal:#1a8f5e;    --c-causal-bg:rgba(26,143,94,0.10);
  --c-frame:#6a4374;     --c-frame-bg:rgba(106,67,116,0.10);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;position:fixed;background:var(--bg);font-family:'Barlow',sans-serif;-webkit-font-smoothing:antialiased}
.shell{position:fixed;inset:0;display:flex;flex-direction:column}

/* ── TOPBAR ── */
.topbar{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0.65rem 1.25rem;background:rgba(240,239,236,0.95);backdrop-filter:blur(12px);border-bottom:1.5px solid rgba(0,0,0,0.07);z-index:100}
.back-link{text-decoration:none;font-size:0.72rem;font-weight:700;color:rgba(0,0,0,0.38);letter-spacing:0.05em;text-transform:uppercase;transition:color 0.2s}
.back-link:hover{color:rgba(0,0,0,0.65)}
.brand{font-family:'Barlow Condensed',sans-serif;font-size:0.7rem;font-weight:900;letter-spacing:0.28em;text-transform:uppercase;color:rgba(0,0,0,0.18)}
.topic-label{font-size:0.68rem;font-weight:700;color:rgba(0,0,0,0.38);letter-spacing:0.04em;text-align:right;max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}

/* ── STAGE ── */
.stage{flex:1;min-height:0;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}

/* ── FOOTER NAV ── */
.foot{flex-shrink:0;display:flex;justify-content:center;padding:0.5rem 1rem calc(env(safe-area-inset-bottom,0px) + 0.55rem);background:rgba(240,239,236,0.95);border-top:1px solid rgba(0,0,0,0.06)}
.nav-pill{display:flex;gap:0.12rem;background:rgba(10,10,10,0.07);border-radius:2rem;padding:0.25rem 0.28rem}
.nb{background:transparent;border:none;padding:0.35rem 0.75rem;border-radius:1.5rem;font-family:'Barlow',sans-serif;font-size:0.6rem;letter-spacing:0.03em;color:rgba(0,0,0,0.28);cursor:pointer;transition:all 0.22s;white-space:nowrap;min-height:28px;font-weight:700;text-transform:uppercase}
.nb.on{background:var(--ink);color:#fff;font-weight:800}
.nb:hover:not(.on){color:rgba(0,0,0,0.5)}

/* ── POSTER CARD ── */
.poster{
  width:min(420px,90vw);height:min(560px,83vh);
  background:var(--white);border-radius:1.4rem;
  display:flex;flex-direction:column;overflow:hidden;position:relative;
  box-shadow:0 2px 0 rgba(255,255,255,0.8) inset,4px 6px 0 rgba(0,0,0,0.06),0 20px 50px rgba(0,0,0,0.18),0 4px 12px rgba(0,0,0,0.1);
  animation:cardUp 0.55s cubic-bezier(0.22,1,0.36,1) both;
}
@keyframes cardUp{
  0%{opacity:0;transform:scale(0.92) translateY(20px)}
  65%{opacity:1;transform:scale(1.01) translateY(-4px)}
  100%{opacity:1;transform:scale(1) translateY(0)}
}

/* ── FLAG ── */
.flag{position:absolute;top:-2px;left:1.8rem;width:56px;z-index:10;display:flex;flex-direction:column;align-items:center}
.flag-body{width:100%;padding:0.5rem 0 0.35rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.1rem;position:relative;background:var(--acc)}
.flag-num{font-family:'Barlow Condensed',sans-serif;font-size:1.9rem;font-weight:900;color:#fff;line-height:1;letter-spacing:-0.02em}
.flag-label{font-family:'Barlow Condensed',sans-serif;font-size:0.42rem;font-weight:900;color:rgba(255,255,255,0.75);letter-spacing:0.14em;text-transform:uppercase;line-height:1}
.flag-body::after{content:'';position:absolute;bottom:-8px;left:0;right:0;height:9px;background:var(--acc);clip-path:polygon(0% 0%,8.33% 100%,16.66% 0%,25% 100%,33.33% 0%,41.66% 100%,50% 0%,58.33% 100%,66.66% 0%,75% 100%,83.33% 0%,91.66% 100%,100% 0%)}

/* ── CARD TOOLBAR ── */
.card-toolbar{
  flex-shrink:0;padding:3.5rem 1rem 0.5rem;
  display:flex;align-items:center;gap:0.35rem;
  border-bottom:1px solid rgba(0,0,0,0.06);
  flex-wrap:wrap;
}

/* Style selector */
.style-btn{
  font-family:'Barlow Condensed',sans-serif;font-size:0.56rem;font-weight:900;
  letter-spacing:0.08em;text-transform:uppercase;
  padding:0.26rem 0.7rem;border-radius:999px;
  border:1.5px solid rgba(0,0,0,0.12);
  background:transparent;color:rgba(0,0,0,0.35);
  cursor:pointer;transition:all 0.2s;white-space:nowrap;
}
.style-btn:hover{border-color:rgba(0,0,0,0.25);color:rgba(0,0,0,0.65)}
.style-btn.active{background:var(--ink);border-color:var(--ink);color:#fff}
.style-btn.hidden{display:none}
.style-btn.guided{border-color:var(--acc);color:var(--acc)}
.style-btn.guided.active{background:var(--acc);border-color:var(--acc);color:#fff}

.toolbar-sep{width:1px;height:18px;background:rgba(0,0,0,0.08);flex-shrink:0;margin:0 0.1rem}

.toolbar-spacer{flex:1}

/* View toggle */
.view-toggle{display:flex;background:rgba(0,0,0,0.05);border-radius:999px;padding:0.18rem;gap:0.12rem}
.vt-btn{
  font-family:'Barlow Condensed',sans-serif;font-size:0.54rem;font-weight:900;
  letter-spacing:0.06em;text-transform:uppercase;
  padding:0.24rem 0.65rem;border-radius:999px;border:none;
  background:transparent;color:rgba(0,0,0,0.35);cursor:pointer;transition:all 0.2s;
}
.vt-btn:hover{color:rgba(0,0,0,0.65)}
.vt-btn.active{background:var(--ink);color:#fff}

/* X-Ray toggle — sits on its own row so it doesn't crowd style/view controls */
.xray-row{
  flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:0.5rem;
  padding:0.4rem 1.2rem;border-bottom:1px solid rgba(0,0,0,0.05);
}
.xray-toggle{display:flex;align-items:center;gap:0.4rem}
.xray-switch{
  width:30px;height:17px;border-radius:999px;background:rgba(0,0,0,0.12);
  position:relative;cursor:pointer;transition:background 0.2s;flex-shrink:0;
}
.xray-switch.on{background:var(--c-discourse)}
.xray-switch::after{
  content:'';position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;
  background:#fff;transition:transform 0.2s;box-shadow:0 1px 2px rgba(0,0,0,0.25);
}
.xray-switch.on::after{transform:translateX(13px)}
.xray-label{font-family:'Barlow Condensed',sans-serif;font-size:0.62rem;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(0,0,0,0.45)}
.legend{display:flex;gap:0.65rem;flex-wrap:wrap;justify-content:flex-end}
.legend-item{display:flex;align-items:center;gap:0.28rem;font-family:'Instrument Sans',sans-serif;font-size:0.62rem;color:rgba(0,0,0,0.42);white-space:nowrap}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.legend-dot.discourse{background:var(--c-discourse)}
.legend-dot.opinion{background:var(--c-opinion)}
.legend-dot.causal{background:var(--c-causal)}
.legend-dot.frame{background:var(--c-frame)}
.legend.hidden,.xray-row .legend.hidden{display:none}

/* ── SCROLL AREA ── */
.card-scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:1rem 1.2rem 0.5rem}
.card-scroll::-webkit-scrollbar{width:3px}
.card-scroll::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.1);border-radius:2px}

/* Essay text */
.para-label{
  font-family:'Barlow Condensed',sans-serif;font-size:0.52rem;font-weight:900;
  letter-spacing:0.18em;text-transform:uppercase;
  color:rgba(0,0,0,0.28);margin-bottom:0.5rem;
}
.para-text{
  font-family:'Instrument Sans',sans-serif;
  font-size:0.88rem;line-height:1.8;
  color:rgba(0,0,0,0.78);font-weight:400;
  margin-bottom:1.4rem;
}
.para-text:last-child{margin-bottom:0}

/* ── CATEGORY HIGHLIGHTING (X-Ray) ──
   These classes are authored directly into samples.json content —
   discourse = signpost/linking words, opinion = personal-view phrases,
   causal = reason→result chain. Colour-coding them (rather than re-detecting
   markers with a separate word list) keeps this page in sync with whatever
   phrase families the Model page teaches. */
.xray-on .discourse{color:var(--c-discourse);font-weight:600;background:var(--c-discourse-bg);padding:0.05em 0.2em;border-radius:3px}
.xray-on .opinion{color:var(--c-opinion);font-weight:600;background:var(--c-opinion-bg);padding:0.05em 0.2em;border-radius:3px}
.xray-on .causal{color:var(--c-causal);font-weight:600;background:var(--c-causal-bg);padding:0.05em 0.2em;border-radius:3px}
.xray-on .frame{color:var(--c-frame);font-weight:600;background:var(--c-frame-bg);padding:0.05em 0.2em;border-radius:3px;border-bottom:1.5px dotted var(--c-frame)}


/* ══ BOARD MODE — classroom width, broadsheet columns ══ */
@media(min-width:820px){
  .poster{width:min(1180px,95vw);height:min(660px,88vh)}
  .card-scroll{padding:1.5rem 2.6rem 1.2rem}
  #infographic.board-cols .para-text{max-width:940px;margin:0 auto 1.6rem;font-size:1.22rem;line-height:1.95}
  #infographic:not(.board-cols) .para-label{max-width:660px;margin:0.4rem auto 0.6rem;font-size:0.62rem;text-align:center}
  #infographic:not(.board-cols) .para-text{max-width:660px;margin:0 auto;font-size:1.18rem;line-height:1.95}
  .state-msg{font-size:1rem}
}

/* ── PARA NAV ── */
.para-nav{
  flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
  padding:0.5rem 1rem;border-top:1px solid rgba(0,0,0,0.06);
}
.para-nav.hidden{display:none}
.para-arrow{
  background:var(--acc);border:none;
  width:2.6rem;height:2.6rem;border-radius:50%;
  font-size:1.15rem;cursor:pointer;color:#fff;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.18s;box-shadow:0 3px 10px rgba(0,0,0,0.2);
}
.para-arrow:hover:not(:disabled){transform:scale(1.08);box-shadow:0 5px 14px rgba(0,0,0,0.28)}
.para-arrow:active:not(:disabled){transform:scale(0.95)}
.para-arrow:disabled{background:rgba(0,0,0,0.08);color:rgba(0,0,0,0.25);box-shadow:none;cursor:not-allowed}
.para-nav-label{
  font-family:'Barlow Condensed',sans-serif;font-size:0.78rem;font-weight:800;
  letter-spacing:0.1em;text-transform:uppercase;color:rgba(0,0,0,0.42);
}
  
/* ── ACCENT BAR ── */
.accent-bar{height:4px;background:var(--acc);flex-shrink:0;border-radius:0 0 1.4rem 1.4rem;opacity:0.7}

/* ── STATE MSG ── */
.state-msg{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;gap:0.75rem;font-size:0.85rem;color:rgba(0,0,0,0.28);
  text-align:center;line-height:1.6;font-family:'Barlow',sans-serif;
}

/* ── TOAST ── */
/* ══ PHRASE LAYER — tap an expression, see what else says the same job ══ */
.phrase-enhanced{position:relative;display:inline}
.phrase-text{color:var(--c-discourse);font-weight:600;border-bottom:1.5px solid rgba(37,99,235,0.4);
  cursor:pointer;padding:0.05em 0;transition:background .15s}
.phrase-text:hover{background:var(--c-discourse-bg);border-radius:2px}
.phrase-hint-btn{background:var(--c-discourse-bg);border:none;border-radius:50%;
  width:18px;height:18px;font-size:0.6rem;cursor:pointer;vertical-align:middle;margin-left:2px;
  display:inline-flex;align-items:center;justify-content:center;transition:background .15s}
.phrase-hint-btn:hover{background:rgba(37,99,235,0.2)}
.phrase-badge{font-family:'Barlow Condensed',sans-serif;font-size:0.55rem;font-weight:900;
  background:var(--c-discourse-bg);color:var(--c-discourse);padding:0.05rem 0.32rem;
  border-radius:1rem;margin-left:0.25rem;display:none}
.phrase-badge.on{display:inline}

.alt-overlay{position:fixed;inset:0;background:rgba(20,18,22,0.5);backdrop-filter:blur(3px);
  z-index:500;display:none;align-items:flex-end;justify-content:center;padding:1rem}
.alt-overlay.open{display:flex;animation:altFade .2s ease both}
@keyframes altFade{from{opacity:0}to{opacity:1}}
.alt-modal{background:var(--white,#fff);border-radius:1.1rem;width:100%;max-width:520px;max-height:70vh;
  overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 -4px 40px rgba(0,0,0,0.22);animation:altUp .28s cubic-bezier(.34,1.56,.64,1) both}
@keyframes altUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.alt-header{padding:1rem 1.15rem 0.8rem;border-bottom:1px solid rgba(0,0,0,0.07);
  display:flex;align-items:flex-start;justify-content:space-between;gap:0.6rem;flex-shrink:0}
.alt-title{font-family:'Barlow Condensed',sans-serif;font-size:0.9rem;font-weight:900;
  letter-spacing:0.04em;text-transform:uppercase;color:var(--ink,#111)}
.alt-phrase{font-size:0.82rem;color:var(--c-discourse);font-weight:600;margin-top:0.15rem}
.alt-close{background:rgba(0,0,0,0.06);border:none;width:1.9rem;height:1.9rem;border-radius:50%;
  font-size:1rem;color:rgba(0,0,0,0.45);cursor:pointer;display:flex;align-items:center;
  justify-content:center;flex-shrink:0}
.alt-close:hover{background:rgba(0,0,0,0.11)}
.alt-body{overflow-y:auto;padding:0.6rem;flex:1}
.alt-category{font-family:'Barlow Condensed',sans-serif;font-size:0.58rem;font-weight:800;
  letter-spacing:0.14em;text-transform:uppercase;color:rgba(0,0,0,0.3);padding:0.45rem 0.5rem 0.55rem}
.alt-item{padding:0.62rem 0.8rem;border-radius:0.55rem;font-family:'Instrument Sans',sans-serif;
  font-size:0.88rem;color:rgba(0,0,0,0.75);cursor:pointer;transition:all .15s;
  display:flex;align-items:center;justify-content:space-between;gap:0.5rem}
.alt-item:hover{background:var(--c-discourse-bg);color:var(--c-discourse)}
.alt-copy-hint{font-family:'Barlow Condensed',sans-serif;font-size:0.55rem;font-weight:800;
  letter-spacing:0.1em;text-transform:uppercase;color:rgba(0,0,0,0.22);flex-shrink:0}

.toast{
  position:fixed;bottom:5rem;left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;
  padding:0.45rem 1.1rem;border-radius:2rem;
  font-family:'Barlow Condensed',sans-serif;font-size:0.7rem;font-weight:900;letter-spacing:0.06em;
  opacity:0;pointer-events:none;transition:opacity 0.25s;z-index:600;white-space:nowrap;
}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="shell">

  <div class="topbar">
    <a class='back-link' href='/skills/writing/reviews/review-question-selector'>← Reviews</a>
    <span class="brand">INTUITY</span>
    <span class="topic-label" id="topicLabel">Sample</span>
  </div>

  <div class="stage">
    <div class="poster" id="posterCard">

      <div class="flag">
        <div class="flag-body">
          <span class="flag-num" id="flagNum">01</span>
        </div>
      </div>

      <!-- Toolbar: style selector + view toggle -->
      <div class="card-toolbar">
        <button class="style-btn active" id="styleDefault"  onclick="selectStyle('default')">Default</button>
        <button class="style-btn"        id="styleAlt1"     onclick="selectStyle('alternative1')">Alt 1</button>
        <button class="style-btn"        id="styleAlt2"     onclick="selectStyle('alternative2')">Alt 2</button>
        <div class="toolbar-spacer"></div>
        <div class="view-toggle">
          <button class="vt-btn active" id="vtFull"  onclick="setViewMode(true)">Full</button>
          <button class="vt-btn"        id="vtParas" onclick="setViewMode(false)">Paragraphs</button>
        </div>
      </div>

      <!-- X-Ray + Phrases -->
      <div class="xray-row">
        <div class="xray-toggle" onclick="toggleXray()">
       <div class="xray-switch on" id="xraySwitch"></div>
          <span class="xray-label">X-Ray</span>
        </div>
        <div class="xray-toggle" onclick="togglePhrases()">
          <div class="xray-switch" id="phraseSwitch"></div>
          <span class="xray-label">Phrases<span class="phrase-badge" id="phraseBadge"></span></span>
        </div>
        <div class="legend" id="legend">
          <span class="legend-item"><span class="legend-dot discourse"></span>Signpost</span>
        </div>
      </div>

      <!-- Content -->
      <div class="card-scroll" id="infographic">
        <div class="state-msg">Loading…</div>
      </div>

      <!-- Paragraph navigation (paragraphs mode only) -->
      <div class="para-nav hidden" id="paraNav">
        <button class="para-arrow" id="btnPrev" onclick="goPrev()" disabled>←</button>
        <div class="para-nav-label" id="paraLabel">Introduction</div>
        <button class="para-arrow" id="btnNext" onclick="goNext()">→</button>
      </div>

      <div class="accent-bar"></div>
    </div>
  </div>

  <div class="foot">
    <div class="nav-pill">
      <button class="nb"    onclick="navTo('question')">Question</button>
      <button class="nb"    onclick="navTo('plan')">Plan</button>
      <button class="nb"    onclick="navTo('model')">Model</button>
      <button class="nb on" onclick="navTo('sample')">Sample</button>
    </div>
  </div>
</div>

<div class="alt-overlay" id="altOverlay" onclick="closeAlt(event)">
  <div class="alt-modal" onclick="event.stopPropagation()">
    <div class="alt-header">
      <div>
        <div class="alt-title">Other ways to say it</div>
        <div class="alt-phrase" id="altPhrase"></div>
      </div>
      <button class="alt-close" onclick="closeAlt()">×</button>
    </div>
    <div class="alt-body" id="altBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ══════════ SAMPLE REVIEW — the essay-sample blueprint, review data ══════════
   data/samples.json is keyed by question id; each record holds default /
   alternative1 / alternative2, and each version is a list of {label,sentences[]}.
   Labels come from the data, so paragraph names need no guessing.
   No X-Ray: the review samples were written independently of
   reviews-cards-models.json, so there is nothing reliable to highlight yet. */

const GREEN='#5a9657';
function applyAccent(){ document.documentElement.style.setProperty('--acc',GREEN); }

let SAMPLES=null, QUESTIONS=null;
let order=[], currentIdx=0;
let styleKey='default', fullTextMode=true, currentPara=0;
let sections=[];

const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function loadSections(){
  const id=order[currentIdx];
  const rec=(SAMPLES&&SAMPLES[id])||null;
  const ver=(rec&&(rec[styleKey]||rec.default))||[];
  sections=ver.map((s,i)=>({
    label:s.label||('Paragraph '+(i+1)),
    text:(s.sentences||[]).map(esc).join(' ')
  }));
  if(currentPara>=sections.length) currentPara=0;
}

function selectStyle(k){
  styleKey=k;
  const map={'default':'styleDefault','alternative1':'styleAlt1','alternative2':'styleAlt2'};
  Object.keys(map).forEach(x=>{
    const b=document.getElementById(map[x]);
    if(b)b.classList.toggle('active',x===k);
  });
  loadSections(); render();
}
window.selectStyle=selectStyle;

function setViewMode(full){
  fullTextMode=full;
  document.getElementById('vtFull').classList.toggle('active',full);
  document.getElementById('vtParas').classList.toggle('active',!full);
  document.getElementById('paraNav').classList.toggle('hidden',full);
  render();
}
window.setViewMode=setViewMode;

/* ══════════ X-RAY — curated discourse markers, no annotation needed ══════════
   Lifted from review-master.html: a hand-tuned list that covers ~71% of the
   sample sentences. Marked spans use the essay page's `discourse` class, so
   Signpost is the same blue everywhere on the site. */
const DM = [
  'To begin with','First of all','Firstly','Secondly','Thirdly',
  'In addition','Moreover','Furthermore','What is more','Besides','Additionally',
  'On the other hand','However','Nevertheless','Nonetheless',
  'In contrast','By contrast','Conversely','Whereas','Although','Though',
  'Despite','In spite of',
  'Therefore','Thus','Hence','Consequently',
  'As a result','As a consequence','For this reason',
  'Due to','Because of','Owing to',
  'For example','For instance','Such as','Namely',
  'In particular','Specifically','To illustrate',
  'All things considered','In conclusion','To conclude',
  'To sum up','In summary','Overall','All in all','On the whole',
  'Finally','Lastly',
  'In my opinion','In my view','I believe','Personally',
  'Clearly','Undoubtedly','Certainly','Indeed',
  'Meanwhile','Subsequently','Eventually','Ultimately',
  'When it comes to','Choosing','Selecting',
  'What makes','The thing that','By far the best',
  'Known for','Located','Designed by',
  'I would highly recommend','I would definitely recommend',
  'For anyone who is looking for','This is a must',
  'I can assure you that','I guarantee that',
  'This is','which you cannot afford to miss',
  'Another feature worth mentioning',
  'One of the most impressive','One thing I really appreciated',
  'What I found particularly','I would not hesitate to recommend',
  'It is equally suitable',
  'If you are looking for',
  'The first thing that strikes you','The first thing that will strike you',
  'Beyond the','Beyond this',
  'What really sets','What really elevates','What really keeps','What really made',
  'What really distinguished','What really elevated',
  'I would strongly urge',
  'It is, without doubt','without doubt',
  'Whether you are','This combination of','This level of',
  'This balance of','This mix of','Rather than','Unlike many'
].sort((a,b)=>b.length-a.length);

/* the lookahead keeps matches out of HTML attributes the phrase layer added */
function wrapMarkers(html){
  let out=html;
  DM.forEach(dm=>{
    const e=dm.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    out=out.replace(new RegExp(`(?<![a-zA-Z<"'])(${e})(?![a-zA-Z<"'])`,'g'),'<span class="discourse">$1</span>');
  });
  return out;
}

/* ══════════ PHRASE LAYER — tap an expression for alternatives ══════════ */
let phraseDB={}, phraseReady=false;
function buildPhraseDB(json){
  phraseDB={};
  const add=(category,items)=>{
    if(!Array.isArray(items))return;
    const clean=x=>String((typeof x==='string')?x:(x&&(x.phrase||x.text))||'').replace(/[.,;:!?]+$/,'').trim();
    items.forEach(item=>{
      const p=clean(item);
      if(!p||p.split(/\s+/).length<2)return;
      if(!phraseDB[p])phraseDB[p]={category,alternatives:[]};
      items.forEach(sib=>{
        const s=clean(sib);
        if(s&&s!==p&&!phraseDB[p].alternatives.includes(s))phraseDB[p].alternatives.push(s);
      });
    });
  };
  if(Array.isArray(json)){
    json.forEach(e=>add(e.category||'Phrases', e.phrases||e.items||[]));
  }else if(json&&typeof json==='object'){
    Object.entries(json).forEach(([cat,val])=>{
      if(!val||typeof val!=='object')return;
      if(val.categories){
        val.categories.forEach(c=>(c.subcategories||[]).forEach(sub=>add(c.title||cat, sub.phrases||[])));
      }
    });
  }
  /* families the JSON bank doesn't cover, carried over from review-master */
  [ {category:'Opening',        phrases:['If you are looking for','If you are planning','If you want']},
    {category:'First impression',phrases:['The first thing that strikes you','The first thing that will strike you','The first thing you notice','What immediately strikes you']},
    {category:'Beyond the obvious',phrases:['Beyond the visuals','Beyond the technical skill','Beyond the performance','Beyond the atmosphere','Beyond the food itself','Beyond the teaching itself','Beyond the theory']},
    {category:'What stands out',phrases:['What really sets this','What really elevates','What really keeps you','What really made','What really distinguished','What really elevated']},
    {category:'Strong recommendation',phrases:['I would strongly urge','I would strongly recommend','I would strongly advise']},
    {category:'Certainty',      phrases:['It is, without doubt','without doubt','There is no doubt that','It goes without saying']},
    {category:'Whichever reader',phrases:['Whether you are','Whether you know','Whether you have','Regardless of whether you']},
    {category:'This combination',phrases:['This combination of','This level of','This balance of','This mix of','This degree of']},
    {category:'Contrasting',    phrases:['Rather than','Unlike many','Unlike most','In contrast to many']}
  ].forEach(e=>add(e.category,e.phrases));
  phraseReady=Object.keys(phraseDB).length>0;
}

function enhancePhrases(html){
  if(!phraseReady) return {html,count:0};
  let out=html,count=0; const seen=new Set();
  Object.keys(phraseDB).filter(p=>phraseDB[p].alternatives.length>0)
    .sort((a,b)=>b.length-a.length)
    .forEach(phrase=>{
      const e=phrase.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      out=out.replace(new RegExp(`(?<![a-zA-Z<"'])(${e})(?![a-zA-Z<"'])`,'gi'),m=>{
        const k=m.toLowerCase();
        if(seen.has(k))return m;
        seen.add(k); count++;
        const safe=phrase.replace(/'/g,"\\'").replace(/"/g,'&quot;');
        return `<span class="phrase-enhanced"><span class="phrase-text" onclick="showAlts('${safe}')">${m}</span><button class="phrase-hint-btn" onclick="event.stopPropagation();showAlts('${safe}')">💡</button></span>`;
      });
    });
  return {html:out,count};
}

function showAlts(phrase){
  const key=Object.keys(phraseDB).find(k=>k.toLowerCase()===String(phrase).toLowerCase())||phrase;
  const d=phraseDB[key];
  if(!d||!d.alternatives.length){ showToast('No alternatives found'); return; }
  document.getElementById('altPhrase').textContent='“'+phrase+'”';
  document.getElementById('altBody').innerHTML=
    `<div class="alt-category">${esc(d.category)} — ${d.alternatives.length} alternatives</div>`+
    d.alternatives.map(a=>{
      const safe=String(a).replace(/'/g,"\\'").replace(/"/g,'&quot;');
      return `<div class="alt-item" onclick="copyAlt('${safe}')"><span>${esc(a)}</span><span class="alt-copy-hint">tap to copy</span></div>`;
    }).join('');
  document.getElementById('altOverlay').classList.add('open');
}
function copyAlt(text){
  try{ navigator.clipboard.writeText(text).then(()=>{showToast('Copied');closeAlt();},()=>showToast('Copy failed')); }
  catch(e){ showToast('Copy failed'); }
}
function closeAlt(e){
  if(e&&e.target&&e.target.id!=='altOverlay')return;
  document.getElementById('altOverlay').classList.remove('open');
}
window.showAlts=showAlts; window.copyAlt=copyAlt; window.closeAlt=closeAlt;

let _toastTimer;
function showToast(msg){
  const el=document.getElementById('toast');
  if(!el)return;
  el.textContent=msg; el.classList.add('show');
  clearTimeout(_toastTimer); _toastTimer=setTimeout(()=>el.classList.remove('show'),2000);
}

/* ══ the two toggles ══ */
let xrayOn=true, phrasesOn=true;
function toggleXray(){
  xrayOn=!xrayOn;
  document.getElementById('xraySwitch').classList.toggle('on',xrayOn);
  document.getElementById('legend').classList.toggle('hidden',!xrayOn);
  render();
}
function togglePhrases(){
  if(!phraseReady){ showToast('Phrase bank not loaded'); return; }
  phrasesOn=!phrasesOn;
  document.getElementById('phraseSwitch').classList.toggle('on',phrasesOn);
  render();
}
window.toggleXray=toggleXray; window.togglePhrases=togglePhrases;

/* phrases run BEFORE the markers, so the marker lookahead can skip the
   onclick attributes the phrase layer introduces */
function dress(text){
  let out=text, n=0;
  if(phrasesOn){ const r=enhancePhrases(out); out=r.html; n=r.count; }
  if(xrayOn)   out=wrapMarkers(out);
  return {html:out,count:n};
}

function render(){
  const box=document.getElementById('infographic');
  if(!sections.length){ box.innerHTML='<div class="state-msg">No sample review found for this question yet.</div>'; return; }
  box.classList.toggle('board-cols',fullTextMode);
  if(fullTextMode){
    let total=0;
    box.innerHTML=sections.map(s=>{
      const d=dress(s.text); total+=d.count;
      return `<div class="para-label">${esc(s.label)}</div><div class="para-text ${xrayOn?'xray-on':''}">${d.html}</div>`;
    }).join('');
    setPhraseBadge(total);
  }else{
    const s=sections[currentPara]||{label:'',text:''};
    const d=dress(s.text);
    box.innerHTML=`<div class="para-label">${esc(s.label)}</div><div class="para-text ${xrayOn?'xray-on':''}">${d.html}</div>`;
    setPhraseBadge(d.count);
    updateNav();
  }
  box.scrollTop=0;
}

function setPhraseBadge(n){
  const b=document.getElementById('phraseBadge');
  if(!b)return;
  b.textContent=n||'';
  b.classList.toggle('on',!!(phrasesOn&&n));
}

function goPrev(){ if(currentPara>0){ currentPara--; render(); } }
function goNext(){ if(currentPara<sections.length-1){ currentPara++; render(); } }
window.goPrev=goPrev; window.goNext=goNext;
function updateNav(){
  const p=document.getElementById('btnPrev'), n=document.getElementById('btnNext'), l=document.getElementById('paraLabel');
  if(p)p.disabled=currentPara===0;
  if(n)n.disabled=currentPara>=sections.length-1;
  if(l)l.textContent=(sections[currentPara]&&sections[currentPara].label)||('Paragraph '+(currentPara+1));
}

function loadIdx(i){
  currentIdx=Math.max(0,Math.min(i,order.length-1));
  const id=order[currentIdx];
  const meta=(QUESTIONS||[]).find(q=>q.id===id);
  const lab=(meta&&(meta.topic||meta.question))||id;
  document.getElementById('topicLabel').textContent=String(lab).substring(0,40).toUpperCase();
  const f=document.getElementById('flagNum');
  if(f)f.textContent=String(currentIdx+1).padStart(2,'0');
  currentPara=0;
  loadSections(); render();
}

async function init(){
  applyAccent();
  let savedId=null;
  try{
    const s=sessionStorage.getItem('currentReviewQuestion');
    if(s){ const q=JSON.parse(s); savedId=q.id||q.questionId||null; }
  }catch(e){}
  try{
    /* the phrase bank loads in the background — the page never waits for it */
    fetch('data/complete-review-phrase-bank1.json')
      .then(r=>r.ok?r.json():null)
      .then(d=>{ if(d){ buildPhraseDB(d); } })
      .catch(()=>{});
    const [sm,qs]=await Promise.all([
      fetch('data/samples.json').then(r=>r.json()),
      fetch('data/review-questions.json').then(r=>r.json()).catch(()=>null)
    ]);
    SAMPLES=sm;
    QUESTIONS=(qs&&qs.questions)||[];
    order=QUESTIONS.map(q=>q.id).filter(id=>SAMPLES[id]);
    Object.keys(SAMPLES).forEach(id=>{ if(!order.includes(id)) order.push(id); });
    if(!order.length){ document.getElementById('infographic').innerHTML='<div class="state-msg">No sample reviews found.</div>'; return; }
    const at=savedId?order.indexOf(savedId):-1;
    loadIdx(at>=0?at:0);
  }catch(e){
    console.error(e);
    document.getElementById('infographic').innerHTML='<div class="state-msg">⚠ Could not load sample data.</div>';
  }
}

function navTo(dest){
  if(dest==='sample')return;
  try{
    const s=sessionStorage.getItem('currentReviewQuestion');
    const q=s?JSON.parse(s):{};
    const id=order[currentIdx];
    q.id=id; q.questionId=id;
    const meta=(QUESTIONS||[]).find(x=>x.id===id);
    if(meta){ q.subject=meta.subject||q.subject||''; q.category=meta.category||q.category||''; }
    sessionStorage.setItem('currentReviewQuestion',JSON.stringify(q));
  }catch(e){}
  const map={question:'review-question-selector.html',plan:'review-plan.html',model:'reviews-cards.html'};
  if(map[dest])window.location.href=map[dest];
}
window.navTo=navTo;

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ closeAlt(); return; }
  if(!fullTextMode){ if(e.key==='ArrowLeft')goPrev(); if(e.key==='ArrowRight')goNext(); }
});

init();
</script>
