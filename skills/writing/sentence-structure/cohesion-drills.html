<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Be2FIRST — Cohesion Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..900&family=Geist+Mono:wght@400..600&family=Space+Grotesk:wght@700&family=Anton&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&display=swap" rel="stylesheet">
<style>
  :root{
    --f-display:'Geist', system-ui, sans-serif;--f-mono:'Geist Mono', ui-monospace, monospace;--f-poster:'Anton', Impact, sans-serif;
    --screen:#F3F1ED;--card:#FAF8F5;--ink:#232C31;--dim:#5C5852;--faint:#756B6E;--rule:#BCB1A0;--caramel:#B0865C;
    --poster-ink:#14110E;--poster-body:#5C5852;--poster-faint:rgba(20,17,14,.50);--poster-fill:rgba(20,17,14,.08);--poster-rule:rgba(20,17,14,.20);
    --good:#1F7A4A;--good-soft:#DCEFE2;--good-ink:#1B4A31;--bad:#C4402F;--bad-soft:#F6DDD7;--link:#8E6238;
    --pill:#E3DED5;--pill-press:#D6D0C4;--ease:cubic-bezier(.2,.9,.3,1);
  }
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:#F3F1EC}html,body{height:100%}
  body{overflow:hidden;background:#F3F1EC;color:var(--ink);font-family:'Geist', system-ui, sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center}
  button,a{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
  :focus-visible{outline:2px solid var(--caramel);outline-offset:2px}

  .header{width:100%;flex:none;background:var(--card);border-bottom:1px solid var(--poster-rule);padding:calc(14px + env(safe-area-inset-top)) 16px 0}
  .header-top{display:flex;align-items:flex-start;justify-content:space-between;padding-bottom:.9rem;gap:.6rem}
  .back-link{font-family:var(--f-mono);font-size:0.6875rem;letter-spacing:.1em;text-transform:uppercase;color:var(--poster-faint);padding-top:.25rem;flex:none;text-decoration:none;font-weight:700}
  .back-link:hover{color:var(--poster-ink)}
  .header-title{flex:1;text-align:center}
  .app-title{display:inline-flex;align-items:center;gap:.4rem;font-weight:800;font-size:1.15rem;letter-spacing:-.03em;color:var(--poster-ink)}
  .app-title::before{content:'';width:7px;height:7px;border-radius:2px;background:var(--caramel)}
  .app-subtitle{font-family:var(--f-mono);font-size:0.6875rem;letter-spacing:.14em;text-transform:uppercase;color:var(--poster-faint);margin-top:.2rem}
  .header-spacer{flex:none;width:4.5rem}
  .mode-selector,.set-tabs{display:flex;gap:1.4rem;justify-content:center;padding-bottom:.8rem;flex-wrap:wrap}
  .set-tabs{gap:1.1rem}
  .mode-btn,.tabitem{font-family:var(--f-mono);font-size:0.6875rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--poster-faint);padding-bottom:.25rem;transition:color .15s}
  .tabitem{font-size:0.6875rem;font-weight:600;letter-spacing:.08em}
  .mode-btn:hover,.tabitem:hover{color:var(--poster-ink)}
  .mode-btn.active{color:var(--poster-ink);box-shadow:inset 0 -2px 0 var(--caramel)}
  .tabitem.active{color:var(--poster-ink);box-shadow:inset 0 -2px 0 var(--poster-rule)}
  @media (max-width:560px){.header{padding:calc(10px + env(safe-area-inset-top)) 12px 0}.app-title{font-size:1rem}.header-spacer{width:2rem}}

  .page{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;background:var(--screen)}
  main{flex:1;min-height:0;width:100%;overflow-y:auto;overscroll-behavior:contain}
  .pm{width:100%;max-width:42rem;margin:0 auto;padding:20px 20px 0}

  /* the stepper rail */
  .rail{display:flex;gap:6px;margin-bottom:16px}
  .st{flex:1;font-family:var(--f-mono);font-size:0.6875rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--poster-faint);padding-top:8px;box-shadow:inset 0 3px 0 var(--poster-rule);transition:color .3s,box-shadow .3s}
  .st i{font-style:normal;margin-right:5px}
  .st.on{color:var(--poster-ink);box-shadow:inset 0 3px 0 var(--caramel)}
  .st.done{color:var(--good);box-shadow:inset 0 3px 0 var(--good)}

  /* the exam task, pinned like the paper */
  .task{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.10);padding:14px 16px;margin-bottom:18px}
  .kick{display:flex;align-items:center;gap:9px;margin-bottom:.45rem;font-family:var(--f-mono);font-size:0.6875rem;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--poster-faint)}
  .kick::before{content:'';width:26px;height:10px;flex:none;background:var(--caramel)}
  .task p{font-size:15px;line-height:1.5;color:var(--poster-ink);font-style:italic}
  .tags{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--faint)}
  .tags a{color:var(--link);text-decoration:none;font-weight:600}
  .title{font-family:var(--f-poster);font-weight:400;letter-spacing:.01em;line-height:1;font-size:clamp(26px,7.4vw,36px);color:var(--poster-ink);padding-bottom:8px}
  .instr{font-size:15px;line-height:1.5;color:var(--poster-body);padding-bottom:12px}
  .stage{animation:in .45s var(--ease) both}
  @keyframes in{from{opacity:0;transform:translateY(10px)}}

  .para-wrap{border-top:1px solid var(--poster-rule);padding:22px 0 18px}
  /* 9 Nov 2026: lighter and calmer on a phone: regular weight, a size down, room between sentences */
  .para{font-size:clamp(17px,4.5vw,20px);line-height:1.9;font-weight:400;letter-spacing:.003em;color:var(--poster-ink);max-width:36em}
  .lk{color:var(--link);font-weight:650}
  .fix{color:var(--bad);font-weight:650}
  .para input{font:inherit;font-size:.82em;font-weight:600;color:var(--poster-ink);background:rgba(20,17,14,.07);border:none;border-radius:3px;box-shadow:inset 0 -2px 0 #77706A;padding:.1em .45em;margin:0 2px;outline:none;vertical-align:baseline;max-width:100%}
  .para input:focus{background:rgba(20,17,14,.12);box-shadow:inset 0 -2px 0 var(--caramel)}
  .para input.ok{background:var(--good-soft);box-shadow:none;color:var(--good-ink)}
  .para input.no{background:var(--bad-soft);box-shadow:none;color:var(--bad);text-decoration:line-through}
  @media (max-width:640px){.para input{font-size:16px}}
  .hintbar{display:flex;flex-wrap:wrap;gap:6px;padding:10px 0}
  .hw{padding:6px 12px;border-radius:999px;background:var(--poster-fill);font-size:14px;font-weight:600;color:var(--poster-ink)}
  .seg{display:grid;grid-template-columns:1fr 1fr;height:30px;width:220px;padding:2px;border-radius:10px;background:var(--poster-fill);margin:0 0 10px}
  .seg button{border-radius:8px;font-size:13px;font-weight:600;color:var(--dim)}
  .seg button.on{background:#fff;color:var(--poster-ink);box-shadow:0 1px 3px rgba(20,17,14,.12)}
  /* 9 Nov 2026: the passage list folds into the task card - ‹ Shopping · 1 of 4 › */
  .pnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-4px -6px 8px}
  .pnav button{width:34px;height:34px;border-radius:50%;font-size:20px;line-height:1;color:var(--poster-ink)}
  .pnav button:disabled{opacity:.25;cursor:default}
  .pnav span{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--poster-ink);text-align:center}
  .pnav span small{font-weight:500;color:var(--poster-faint);letter-spacing:.06em}
  .cbest{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--poster-faint);padding-top:8px}
  .cbest.new{color:var(--caramel)}
  .prun{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--poster-faint);opacity:0;transition:opacity .3s}.prun.on{opacity:1}
  .counter{display:flex;margin:12px 0 4px;border-top:1px solid var(--poster-rule);border-bottom:1px solid var(--poster-rule)}
  .counter div{flex:1;padding:8px 4px;text-align:center}
  .counter div+div{box-shadow:inset 1px 0 0 var(--poster-rule)}
  .counter b{display:block;font-size:22px;font-weight:800;line-height:1.1;color:var(--poster-ink)}
  .counter span{font-size:11px;font-weight:600;color:var(--faint)}
  .why{border-top:1px solid var(--poster-rule);padding:10px 0;font-size:15px;line-height:1.5;color:var(--poster-body)}
  .why b{color:var(--poster-ink)}
  .why .x{color:var(--bad)}
  .fb{font-size:15px;line-height:1.5;color:var(--poster-body);padding:10px 0}
  .fb.yes{color:var(--good-ink)}.fb.no{color:var(--bad)}
  /* 9 Nov 2026 — Patterns: five tabs fit one row at phone width */
  #modes{gap:clamp(.7rem,3.2vw,1.4rem)}
  .pgap{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--caramel);color:transparent}
  .popts{display:flex;flex-direction:column;gap:8px;padding-top:14px}
  .pbtn{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;padding:10px 16px;border-radius:999px;background:var(--poster-fill);font-size:18px;font-weight:600;color:var(--poster-ink);text-align:left}
  .pbtn small{font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.06em;color:var(--faint);text-align:right}
  .pbtn.ok{background:var(--good-soft);color:var(--good-ink)}
  .pbtn.no{background:var(--bad-soft);color:var(--bad)}
  .pbtn:disabled{cursor:default}
  /* the four shapes of what follows a linker: a box (noun), a bar (clause), a full stop (new sentence), an arrow (verb) */
  .pkey{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;margin-top:14px;padding-top:12px;border-top:1px solid var(--poster-rule);font-size:13px;color:var(--poster-body)}
  .pk{display:flex;align-items:center;gap:8px}
  .pk i{flex:none;display:block;width:16px;height:12px}
  .pk-noun i{border:2px solid var(--link);border-radius:2px}
  .pk-clause i{height:4px;background:var(--link);border-radius:2px}
  .pk-sent i{width:8px;height:8px;border-radius:50%;background:var(--link)}
  .pk-inf i{height:0;border-top:2px solid var(--link);position:relative}
  .pk-inf i::after{content:'';position:absolute;right:-1px;top:-6px;width:7px;height:7px;border-top:2px solid var(--link);border-right:2px solid var(--link);transform:rotate(45deg)}
  textarea{width:100%;min-height:96px;resize:vertical;font:inherit;font-size:17px;line-height:1.5;padding:12px;border:none;border-radius:3px;background:rgba(20,17,14,.07);color:var(--poster-ink);outline:none}
  textarea:focus{box-shadow:0 0 0 2px rgba(176,134,92,.6)}
  .actions{position:sticky;bottom:0;margin:20px -20px 0;display:flex;justify-content:center;gap:6px;padding:10px 20px calc(14px + env(safe-area-inset-bottom));background:var(--card);box-shadow:0 -1px 0 var(--poster-rule)}
  .btn{height:42px;min-width:128px;padding:0 22px;border-radius:999px;font-size:15px;font-weight:600;white-space:nowrap}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--pill);color:var(--poster-ink)}.btn.primary:active{background:var(--pill-press)}
  .btn.quiet{color:var(--dim);min-width:0;padding:0 16px}
  .btn:disabled{opacity:.4;cursor:default}
  .rev{border-top:1px solid var(--poster-rule);padding:14px 0}
  .rev b{font-size:17px;color:var(--poster-ink)}
  .rev p{font-size:13px;color:var(--faint);margin-top:2px}
  .rev .miss{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .rev .miss span{padding:3px 10px;border-radius:999px;background:var(--bad-soft);color:var(--bad);font-size:13px;font-weight:600}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').toLowerCase().replace(/[’´`]/g,"'").replace(/[.,!?]+$/,'').trim().replace(/\s+/g,' ');
const cap=w=>w.charAt(0).toUpperCase()+w.slice(1);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;};

/* ═══ PASSAGES ═══ Each blank accepts every valid answer, not one. {n} marks a blank.
   `from` ties the passage to the Grammar module so the two surfaces share a vocabulary. */
const P=[
 {id:'link-shopping',mode:'linking',title:'Shopping',from:'Grammar · Contrasting',kind:'Essay',
  task:"Some people say online shopping is better than shopping in stores. Write a paragraph giving your opinion.",
  text:"Online shopping offers convenience and variety. {1}, many people still prefer physical stores. Traditional shopping lets customers examine products directly. {2}, online purchases rely on product descriptions. Some retailers combine both approaches. {3}, they offer online ordering with in-store pickup.",
  b:{1:{ok:["however","nevertheless","even so","that said"],why:"Contrast: this idea goes against the one before it."},
     2:{ok:["in contrast","on the other hand","by contrast","however"],why:"Contrast between two ways of shopping."},
     3:{ok:["for example","for instance"],why:"The sentence gives an example of retailers combining both approaches."}},
  distract:["therefore","similarly","moreover"],
  write:{prompt:"Write one sentence about online shopping that starts with a contrast linker.",bank:["however","nevertheless","on the other hand","in contrast","even so","that said","by contrast"],model:"Online shopping is convenient. However, I prefer shops because I can try things on.",comma:true}},
 {id:'link-social',mode:'linking',title:'Social media',from:'Grammar · Result',kind:'Essay',
  task:"Teenagers spend too much time on social media. Write a paragraph on the effects and what can be done.",
  /* 9 Nov 2026: blank 2 used to be "…, parents often set screen time limits" — a response, not an
     addition, and "therefore" (offered as a wrong answer) also fitted. Blank 2 is now a true addition. */
  text:"Many teenagers spend hours on social media. {1}, they sometimes neglect homework and sleep. {2}, constant notifications make it hard to concentrate in class. To deal with this, many parents set screen time limits. Schools are also acting. {3}, some ban phones during lessons.",
  b:{1:{ok:["as a result","consequently","therefore","as a consequence"],why:"Result: neglecting homework is caused by the hours online."},
     2:{ok:["in addition","moreover","furthermore","what is more","besides","also"],why:"Addition: a second problem of the same kind."},
     3:{ok:["for instance","for example"],why:"Example of how schools are acting."}},
  distract:["however","in contrast","although"],
  write:{prompt:"Write one sentence about homework that shows a result, starting with a linker.",bank:["as a result","consequently","therefore","as a consequence","for this reason"],model:"Homework takes hours. As a result, many students sleep too little.",comma:true}},
 {id:'ref-tech',mode:'reference',title:'Technology',from:'Cohesion · Reference',kind:'Article',
  task:"Write an article about how technology has changed photography.",
  text:"Digital cameras have revolutionised photography. {1} allow photographers to see results instantly. {2} means mistakes can be corrected immediately. Modern smartphones now include powerful cameras, making {3} perfect for everyday photography. Professional photographers still prefer dedicated cameras because {4} offer better control.",
  b:{1:{ok:["they","these"],why:"A plural noun (digital cameras) is picked up by they or these."},
     2:{ok:["this","that"],why:"This sums up the whole previous idea: seeing results instantly."},
     3:{ok:["them"],why:"Object of 'making': smartphones becomes them."},
     4:{ok:["they"],why:"Subject of 'offer': dedicated cameras becomes they."}},
  distract:["it","those","its"],
  write:{prompt:"Write two sentences about phones. Use they, it or this in the second, so the reader knows what it refers to.",bank:["they","it","this","these","them"],model:"Phones are everywhere. They help us stay in touch, but this can be distracting."}},
 {id:'sub-climate',mode:'substitution',title:'Climate',from:'Cohesion · Substitution',kind:'Essay',
  task:"Young people care about climate change. Write a paragraph about what they are doing.",
  text:"Many teenagers are worried about climate change. {1} often join environmental campaigns. Some teenagers organise school protests, while other {2} focus on cutting their carbon footprint. {3} inspire adults to take the issue more seriously.",
  b:{1:{ok:["young people","students","youngsters","the younger generation"],soft:["they"],why:"Use a fresh noun phrase so 'teenagers' is not repeated."},
     2:{ok:["students","young people","pupils","youngsters"],why:"A synonym avoids repeating 'teenagers'."},
     3:{ok:["these activists","these protesters","these young people","these campaigners"],why:"'These' plus a new noun links back and adds meaning."}},
  distract:["the same teenagers","they all"],
  write:{prompt:"Write two sentences about sport. Name the same group of people in two different ways.",bank:[],model:"Footballers train daily. These athletes also follow strict diets."}},
 /* 9 Nov 2026: more passages, so Revisit has something to space */
 {id:'link-jobs',mode:'linking',title:'Part-time jobs',from:'Grammar · Adding',kind:'Essay',
  task:"Should teenagers have part-time jobs while they are at school? Write a paragraph giving both sides.",
  text:"Many teenagers take part-time jobs at weekends. {1}, they earn their own money and learn how to manage it. {2}, they develop useful skills such as teamwork and punctuality. {3}, working long hours can leave little time for homework.",
  b:{1:{ok:["as a result","consequently","therefore","as a consequence"],why:"Result: earning money comes from having the job."},
     2:{ok:["in addition","moreover","furthermore","what is more","besides","also"],why:"Addition: a second advantage of the same kind."},
     3:{ok:["however","on the other hand","nevertheless","even so"],why:"Contrast: the paragraph turns to a disadvantage."}},
  distract:["for example","similarly","in other words"],
  write:{prompt:"Write one sentence about part-time jobs that adds a second advantage, starting with a linker.",bank:["in addition","moreover","furthermore","what is more","besides","also"],model:"Jobs teach responsibility. What is more, they look good on a CV.",comma:true}},
 {id:'link-uniform',mode:'linking',title:'School uniforms',from:'Grammar · Examples',kind:'Essay',
  task:"Students should be allowed to wear what they like at school. Do you agree?",
  text:"Some schools require students to wear a uniform. {1}, many schools in the UK expect pupils to wear a blazer and tie. Supporters say uniforms reduce the pressure to follow fashion. {2}, parents spend less money on clothes. {3}, critics argue that uniforms limit self-expression.",
  b:{1:{ok:["for example","for instance"],why:"Example: UK schools show what a uniform rule looks like."},
     2:{ok:["in addition","moreover","furthermore","what is more","besides","also"],why:"Addition: another argument on the same side."},
     3:{ok:["however","on the other hand","by contrast","in contrast","nevertheless"],why:"Contrast: the other side of the argument begins."}},
  distract:["therefore","in other words","similarly"],
  write:{prompt:"Write one sentence that gives an example of a school rule, starting with a linker.",bank:["for example","for instance"],model:"Many schools have strict rules. For instance, phones must stay in lockers.",comma:true}},
 {id:'ref-club',mode:'reference',title:'Volunteering',from:'Cohesion · Reference',kind:'Report',
  task:"Write a report for your head teacher about a school club and why students should join it.",
  text:"Our school started a volunteering club last year. {1} meets every Friday after lessons. Members visit a care home, where {2} help the residents with shopping and games. Many residents say {3} visits are the best part of their week. {4} has made the club one of the most popular in the school.",
  b:{1:{ok:["it"],why:"A singular noun (the club) is picked up by it."},
     2:{ok:["they"],why:"Subject of 'help': members becomes they."},
     3:{ok:["these","their","the members'"],why:"These visits points back to the visits just described."},
     4:{ok:["this","that"],why:"This sums up the whole previous idea: the residents' reaction."}},
  distract:["its","those","them"],
  write:{prompt:"Write two sentences about a club or team. Use it, they or this in the second, so the reader knows what it refers to.",bank:["it","they","this","these","them","their"],model:"Our school has a chess club. It meets on Tuesdays, and this has made chess very popular."}},
 {id:'sub-tourism',mode:'substitution',title:'Tourism',from:'Cohesion · Substitution',kind:'Article',
  task:"Write an article about how tourism affects the place where you live.",
  text:"Every summer, thousands of tourists come to our island. {1} arrive mainly for the beaches and the mild weather. However, the large number of {2} causes traffic jams in the small villages. Local councils are now trying to attract {3} in winter as well.",
  b:{1:{ok:["visitors","these visitors","holidaymakers","these holidaymakers","travellers","these travellers"],soft:["they"],why:"Use a fresh noun phrase so 'tourists' is not repeated."},
     2:{ok:["visitors","holidaymakers","travellers","people"],why:"A synonym avoids repeating 'tourists'."},
     3:{ok:["visitors","holidaymakers","travellers"],soft:["them"],why:"Another synonym keeps the same people in view."}},
  distract:["the tourists","tourist"],
  write:{prompt:"Write two sentences about your town. Name the people who visit it in two different ways.",bank:[],model:"Cruise passengers fill the streets in the morning. By evening, these day visitors have gone."}}
];
/* ═══ PATTERNS — what comes after the linker (9 Nov 2026) ═══
   The class cards mix linkers that take different grammar. Use of English Part 2 and
   Part 4 test exactly this: despite + noun, although + clause, so as to + verb… */
const PAT={noun:'+ noun / -ing',clause:'+ subject + verb',sent:'New sentence + comma',inf:'+ verb'};
const PT={'despite':'noun','in spite of':'noun','due to':'noun','owing to':'noun','because of':'noun','as well as':'noun','apart from':'noun','unlike':'noun','compared to':'noun',
  'although':'clause','even though':'clause','because':'clause','since':'clause','whereas':'clause','while':'clause','so that':'clause','given that':'clause',
  'however':'sent','nevertheless':'sent','as a result':'sent','in addition':'sent','moreover':'sent','also':'sent','what is more':'sent','even so':'sent','consequently':'sent',
  'so as not to':'inf','in order to':'inf','so as to':'inf'};
const Q=[
 {s:"{} the heavy rain, the match went ahead.",o:["Despite","Although","However"]},
 {s:"{} it was raining heavily, the match went ahead.",o:["Although","Despite","In spite of"]},
 {s:"It was raining heavily. {}, the match went ahead.",o:["Nevertheless","Although","Despite"]},
 {s:"The flight was cancelled {} the storm.",o:["due to","because","therefore"]},
 {s:"The flight was cancelled {} there was a storm.",o:["because","due to","owing to"]},
 {s:"There was a storm. {}, the flight was cancelled.",o:["As a result","Because","Due to"]},
 {s:"She left home early {} miss the last bus.",o:["so as not to","so that","because"]},
 {s:"He saved money {} buy a new bike.",o:["in order to","so that","due to"]},
 {s:"He saved money {} he could buy a new bike.",o:["so that","in order to","so as to"]},
 {s:"{} playing football, she swims twice a week.",o:["As well as","Moreover","Also"]},
 {s:"She plays football. {}, she swims twice a week.",o:["In addition","As well as","Apart from"]},
 {s:"{} my brother, I love spicy food.",o:["Unlike","Whereas","However"]},
 {s:"My brother hates spicy food, {} I love it.",o:["whereas","unlike","however"]},
 {s:"{} cities, villages are usually quiet at night.",o:["Compared to","Whereas","While"]},
 {s:"{} the fact that he was tired, he finished the race.",o:["Despite","Although","Even though"]},
 {s:"{} he was tired, he finished the race.",o:["Even though","Despite","In spite of"]},
 {s:"{} being expensive, the course was worth it.",o:["In spite of","Although","Even though"]},
 {s:"{} the high cost, few students joined the trip.",o:["Owing to","Since","Because"]},
 {s:"{} the bus was late, we missed the start of the film.",o:["Since","Due to","Owing to"]},
 {s:"{} maths, he enjoys every subject.",o:["Apart from","Moreover","Although"]},
 {s:"The hotel was cheap. {}, it was close to the beach.",o:["What is more","As well as","Apart from"]},
 {s:"{} you are tired, you should rest before the exam.",o:["Given that","Due to","Despite"]},
 {s:"The plan failed. {}, nobody gave up.",o:["Even so","Even though","Despite"]},
 {s:"Prices rose sharply. {}, many families cut back on holidays.",o:["Consequently","Owing to","Because of"]}
];
const ROUND=8;
const pt=w=>PT[w.toLowerCase()];
const MODES={linking:'Linking',reference:'Reference',substitution:'Substitution'};

/* ═══ MEMORY — what the student missed, so it can come back ═══ */
const K='intuity-cohesion-v2';
let store;try{store=JSON.parse(localStorage.getItem(K))||{};}catch(e){store={};}
store.missed=store.missed||{};store.res=store.res||{};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(store));}catch(e){}};
const log=(k,ok)=>{try{if(window.INTUITY) INTUITY.log('cohesion-v2',k,ok,{});}catch(e){}};
/* 10 Nov 2026: a card for the review deck - the sentence around the gap, the linker and why */
const rv=(topic,r)=>{try{if(window.Be2&&Be2.answer) Be2.answer(topic,Object.assign({href:location.pathname},r));}catch(e){}};
const gapSentence=(p,n)=>{ const t=p.text.replace('{'+n+'}','___').replace(/\{\d\}/g,m=>{ const k=+m[1]; return p.b[k].ok[0].replace(/^./,c=>c.toUpperCase()); });
  return (window.Be2&&Be2.around)?Be2.around(t,'___'):t; };

let mode='linking',pi=0,step=0,ans={},res={},hint=false,checked=false,view='with',wres=null,wtext='',order=[];
const pm=$('pm');
const pass=()=>P.filter(p=>p.mode===mode)[pi];
const stepsOf=p=>p.mode==='linking'?['Notice','Recall','Compare','Write']:['Recall','Compare','Write'];
function reset(){ans={};res={};hint=false;checked=false;view='with';wres=null;wtext='';step=0;order=[];}

/* paragraph renderer: fn(n, before) returns the HTML for blank n */
function para(p,fn){
  const parts=p.text.split(/\{(\d)\}/);let out='',before='';
  parts.forEach((s,i)=>{ if(i%2){out+=fn(+s,before);} else {out+=esc(s);before+=s;} });
  return out;
}
const startsSentence=b=>/(^|[.!?]\s*)$/.test(b);
const choppy=p=>esc(p.text.replace(/\{\d\},\s?(\w)/g,(m,c)=>c.toUpperCase()));
const pick=(p,n)=>{const r=res[n];return r&&r.st!=='x'?norm(ans[n]):p.b[n].ok[0];};

function tabs(){
  document.querySelectorAll('#modes .mode-btn').forEach(b=>b.classList.toggle('active',b.dataset.m===mode));
  $('sets').style.display='none';
}
function pnav(){
  const list=P.filter(p=>p.mode===mode);
  return '<div class="pnav"><button type="button" id="pPrev" aria-label="Previous passage"'+(pi>0?'':' disabled')+'>‹</button><span>'+esc(list[pi].title)+' <small>· '+(pi+1)+' of '+list.length+'</small></span><button type="button" id="pNext" aria-label="Next passage"'+(pi<list.length-1?'':' disabled')+'>›</button></div>';
}
document.addEventListener('click',e=>{ const b=e.target.closest('#pPrev,#pNext'); if(!b||b.disabled) return; pi+=b.id==='pNext'?1:-1; reset(); draw(); });

const cbest=k=>{ try{ return +localStorage.getItem('intuity.best.cohesion.'+k)||0; }catch(e){ return 0; } };
const cput=(k,v)=>{ try{ localStorage.setItem('intuity.best.cohesion.'+k,String(v)); }catch(e){} };
const cheer=(f,...a)=>{ try{ if(window.Cheer) Cheer[f](...a); }catch(e){} };
function bestLine(k,n,t){ const b=cbest(k), nb=n>b; if(nb) cput(k,n);
  return {nb:nb&&b>0,html:'<p class="cbest'+(nb&&b?' new':'')+'">'+(nb?(b?'New best · beat '+b+' / '+t:'First score to beat'):'Your best · '+b+' / '+t)+'</p>'}; }
function taskCard(p){
  return '<div class="task">'+pnav()+'<div class="kick">Cambridge B2 First · Writing · '+p.kind+'</div><p>'+esc(p.task)+'</p>'+
    '<div class="tags"><span>'+esc(p.from)+'</span><span>Marked under Organisation</span></div></div>';
}
function rail(p,S){
  return '<div class="rail">'+S.map((s,i)=>'<span class="st'+(i===step?' on':i<step?' done':'')+'"><i>'+(i+1)+'</i>'+s+'</span>').join('')+'</div>';
}

/* PATTERNS: rounds of eight; each sentence has one linker whose grammar fits */
let pq=[],pn=0,pick2=null,pok=0,prun=0,pres=[];
function newRound(){
  const miss=Object.keys(store.missed);
  /* items holding a linker the student has missed before come first, then the rest at random */
  const all=shuffle(Q).sort((a,b)=>(miss.indexOf(b.o[0].toLowerCase())>=0)-(miss.indexOf(a.o[0].toLowerCase())>=0));
  pq=all.slice(0,ROUND).map(q=>({s:q.s,ok:q.o[0],o:shuffle(q.o)}));pn=0;pick2=null;pok=0;prun=0;pres=[];
}
function patternKey(){
  return '<div class="pkey">'+Object.keys(PAT).map(k=>'<span class="pk pk-'+k+'"><i aria-hidden="true"></i>'+esc(PAT[k])+'</span>').join('')+'</div>';
}
function drawPatterns(){
  if(!pq.length) newRound();
  if(pn>=pq.length){
    store.res.patterns={r:pok,h:0,t:pq.length,at:Date.now()};save();
    pm.innerHTML='<div class="stage"><div class="kick">Round complete</div><h1 class="title">What comes next?</h1>'+
      '<div class="counter"><div><b>'+pok+'</b><span>right</span></div><div><b>'+(pq.length-pok)+'</b><span>missed</span></div></div>'+
      (()=>{ const bl=bestLine('patterns',pok,pq.length); setTimeout(()=>{ const big=pm.querySelector('.counter b'); if(pok===pq.length) cheer('finale'); else if(bl.nb) cheer('streak',big); else if(pok>=6) cheer('done',big); else cheer('tick',big); },200); return bl.html; })()+
      '<p class="instr" style="padding-top:12px">'+(pok===pq.length?'Every pattern right. Next round mixes in new sentences.':'The linkers you missed come back first in the next round, and wait in Revisit.')+'</p>'+patternKey()+'</div>'+
      '<div class="actions"><button class="btn primary" id="again" type="button">New round</button></div>';
    $('again').onclick=()=>{newRound();draw();};
    return;
  }
  const q=pq[pn],done=pick2!=null,right=done&&pick2===q.ok;
  const gap=done?'<span class="lk">'+esc(q.ok)+'</span>':'<span class="pgap">______</span>';
  let h='<div class="stage"><div class="kick">'+(pn+1)+' of '+pq.length+' <span class="prun'+(prun>=2?' on':'')+'">· 🔥 '+prun+'</span></div><h1 class="title">What comes next?</h1>'+
    '<span class="rbar" aria-hidden="true">'+pq.map((_,i)=>'<i class="'+(pres[i]||(i===pn&&!done?'now':''))+'"></i>').join('')+'</span>'+
    '<p class="instr">Only one linker fits the grammar of this sentence. Look at what comes after the gap.</p>'+
    '<div class="para-wrap"><p class="para">'+esc(q.s).replace('{}',gap)+'</p></div>'+
    '<div class="popts">'+q.o.map(w=>{const c=!done?'':w===q.ok?' ok':w===pick2?' no':'';
      return '<button class="pbtn'+c+'" type="button" data-w="'+esc(w)+'"'+(done?' disabled':'')+'>'+esc(w)+(done?'<small>'+esc(PAT[pt(w)]||'')+'</small>':'')+'</button>';}).join('')+'</div>';
  if(done){
    const need=PAT[pt(q.ok)];
    h+=right?'<div class="fb yes">✓ <b>'+esc(q.ok)+'</b> '+esc(need)+'.</div>'
      :'<div class="why"><b class="x">'+esc(pick2)+'</b> takes '+esc(PAT[pt(pick2)]||'a different pattern').toLowerCase().replace(/^\+ /,'')+'. Here the gap needs <b>'+esc(q.ok)+'</b>: '+esc(need).toLowerCase().replace(/^\+ /,'')+'.</div>'+patternKey();
  }
  h+='</div>';
  pm.innerHTML=h+'<div class="actions">'+(done?'<button class="btn primary" id="pnx" type="button">'+(pn+1<pq.length?'Next':'See score')+'</button>':'')+'</div>';
  pm.querySelectorAll('.pbtn').forEach(b=>b.onclick=()=>{
    if(pick2!=null) return; pick2=b.dataset.w; const ok=pick2===q.ok;
    pres[pn]=ok?'ok':'no';
    if(ok){ pok++; prun++; } else { prun=0; store.missed[q.ok.toLowerCase()]=(store.missed[q.ok.toLowerCase()]||0)+1; }
    save();log('patterns:'+q.ok.toLowerCase(),ok);
    rv('cohesion-patterns',{id:q.s.slice(0,60),correct:ok,prompt:q.s.replace('{}','___'),answer:q.ok,given:ok?'':pick2,rule:PAT[pt(q.ok)]||'',opts:q.o});
    draw();
    const nb=pm.querySelector('.pbtn.ok'); if(ok){ cheer('right',nb,true); if(prun>=3&&prun%3===0) cheer('streak',pm.querySelector('.prun')); } else cheer('soft');
  });
  if($('pnx')) $('pnx').onclick=()=>{pn++;pick2=null;draw();};
}
function draw(){
  tabs();$('main').scrollTop=0;
  if(mode==='revisit') return drawRevisit();
  if(mode==='patterns') return drawPatterns();
  const p=pass(),S=stepsOf(p);
  let h=rail(p,S)+taskCard(p),a='';
  if(step>=S.length) return drawDone(p,S);
  const name=S[step];
  if(name==='Notice'){
    h+='<div class="stage"><h1 class="title">Read it first</h1><p class="instr">This paragraph has no linking words. Read it aloud in your head. What feels wrong?</p><div class="para-wrap"><p class="para">'+choppy(p)+'</p></div></div>';
    a='<button class="btn primary" id="go" type="button">It feels choppy. Fix it</button>';
  }
  if(name==='Recall'){
    h+='<div class="stage"><h1 class="title">Recall</h1><p class="instr">Type the missing word from memory. More than one answer can be right.'+(hint?'':' Stuck? Ask for a hint.')+'</p><div class="para-wrap"><p class="para">'+
      para(p,(n,b)=>{const L=Math.max(...p.b[n].ok.map(x=>x.length));const r=res[n];
        return '<input type="text" data-n="'+n+'" style="width:'+(L+4)+'ch" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Blank '+n+'" '+
          (checked?'readonly class="'+(r.st==='x'?'no':'ok')+'" ':'')+'value="'+esc(ans[n]||'')+'">';})+'</p></div>'+
      (hint&&!checked?'<div class="hintbar">'+order.map(w=>'<span class="hw">'+esc(w)+'</span>').join('')+'</div>':'');
    if(checked){
      const wrong=Object.keys(p.b).filter(n=>res[n].st==='x');
      h+=wrong.length?wrong.map(n=>'<div class="why"><b class="x">Blank '+n+'.</b> Try <b>'+esc(p.b[n].ok[0])+'</b>. '+esc(p.b[n].why)+'</div>').join(''):'<div class="fb yes">✓ Every blank recalled.</div>';
      h+='</div>';
      a='<button class="btn primary" id="go" type="button">Compare</button>';
    } else {
      h+='</div>';
      a=(hint?'':'<button class="btn quiet" id="hint" type="button">Hint</button>')+'<button class="btn primary" id="chk" type="button">Check</button>';
    }
  }
  if(name==='Compare'){
    const lk=view==='with',isL=p.mode==='linking';
    h+='<div class="stage"><h1 class="title">Compare</h1><p class="instr">'+(isL?'Switch to feel what the linking words do for the reader.':'Here is the finished paragraph with the words that hold it together.')+'</p>'+
      (isL?'<div class="seg"><button class="'+(lk?'on':'')+'" data-v="with" type="button">With links</button><button class="'+(lk?'':'on')+'" data-v="without" type="button">Without</button></div>':'')+
      '<div class="para-wrap"><p class="para">'+(lk||!isL?para(p,(n,b)=>{const w=pick(p,n);return '<span class="'+(res[n]&&res[n].st==='x'?'fix':'lk')+'">'+esc(startsSentence(b)?cap(w):w)+'</span>';}):choppy(p))+'</p></div>'+
      Object.keys(p.b).map(n=>'<div class="why"><b>'+esc(p.b[n].ok[0])+'</b> · '+esc(p.b[n].why)+'</div>').join('')+
      '<div class="tags" style="padding-top:10px"><a href="band-descriptors.html">See what Band 5 Organisation looks like →</a></div></div>';
    a='<button class="btn primary" id="go" type="button">Now you write</button>';
  }
  if(name==='Write'){
    h+='<div class="stage"><h1 class="title">Your turn</h1><p class="instr">'+esc(p.write.prompt)+'</p><textarea id="wt" placeholder="Write here…">'+esc(wtext)+'</textarea>'+(wres?'<div class="fb '+wres.cls+'">'+wres.html+'</div>':'')+'</div>';
    a='<button class="btn primary" id="'+(wres?'go':'wchk')+'" type="button">'+(wres?'Finish':'Check my sentence')+'</button>';
  }
  pm.innerHTML=h+'<div class="actions">'+a+'</div>';
  bind(p,name);
}

function bind(p,name){
  const go=$('go');
  if(go) go.onclick=()=>{step++;draw();};
  if(name==='Recall'){
    pm.querySelectorAll('.para input').forEach(i=>{
      i.oninput=()=>{ans[i.dataset.n]=i.value;};
      i.onkeydown=e=>{if(e.key==='Enter'){const all=[...pm.querySelectorAll('.para input')],k=all.indexOf(i);if(all[k+1])all[k+1].focus();else if($('chk'))$('chk').click();}};
    });
    if($('hint')) $('hint').onclick=()=>{hint=true;order=shuffle(Object.keys(p.b).map(n=>p.b[n].ok[0]).concat(p.distract));draw();};
    if($('chk')) $('chk').onclick=()=>{
      Object.keys(p.b).forEach(n=>{
        const v=norm(ans[n]),b=p.b[n];
        const ok=b.ok.indexOf(v)>=0||(b.soft||[]).indexOf(v)>=0;
        res[n]={st:ok?(hint?'h':'r'):'x'};
        if(!ok){store.missed[b.ok[0]]=(store.missed[b.ok[0]]||0)+1;}
        log(p.id+':'+n,ok);
        rv('cohesion',{id:p.id+':'+n,correct:ok&&!hint,prompt:gapSentence(p,n),answer:b.ok[0],given:ok?'':(ans[n]||''),rule:b.why||'',accept:b.ok.concat(b.soft||[])});
      });
      checked=true;save();draw();
      const ins=[...pm.querySelectorAll('.para input')], good=ins.filter(i=>i.classList.contains('ok'));
      if(good.length===ins.length) cheer('done',pm.querySelector('.fb.yes')||ins[ins.length-1]);
      else if(good.length){ good.forEach((i,k)=>setTimeout(()=>cheer('right',i,!hint),k*160)); }
      else cheer('soft');
    };
  }
  if(name==='Compare') pm.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{view=b.dataset.v;draw();});
  if(name==='Write'){
    const t=$('wt');t.oninput=()=>{wtext=t.value;};
    if($('wchk')) $('wchk').onclick=()=>{wtext=t.value;wres=checkWrite(p);draw();};
  }
}

function checkWrite(p){
  const w=p.write,txt=wtext.trim();
  if(txt.split(/\s+/).filter(Boolean).length<4) return {cls:'no',html:'Write a full sentence first.'};
  if(!w.bank.length) return {cls:'yes',html:'Compare with this model: <b>'+esc(w.model)+'</b> Did you name the same group in two different ways?'};
  const hit=w.bank.find(x=>new RegExp('\\b'+x.replace(/ /g,'\\s+')+'\\b','i').test(txt));
  if(!hit) return {cls:'no',html:'No linker from this set found. Try one of: '+w.bank.slice(0,4).map(esc).join(', ')+'.<br>Model: <i>'+esc(w.model)+'</i>'};
  let tip='';
  if(w.comma&&norm(txt.slice(0,hit.length))===hit&&txt.charAt(hit.length)!==',') tip=' Add a comma after “'+esc(hit)+'” at the start of a sentence.';
  return {cls:'yes',html:'✓ You used <b>'+esc(hit)+'</b>.'+tip+'<br>Model: <i>'+esc(w.model)+'</i>'};
}

function drawDone(p,S){
  const k=Object.keys(p.b),r=k.filter(n=>res[n]&&res[n].st==='r').length,h=k.filter(n=>res[n]&&res[n].st==='h').length,x=k.length-r-h;
  store.res[p.id]={r:r,h:h,t:k.length,at:Date.now()};save();
  const list=P.filter(q=>q.mode===mode),next=list[pi+1];
  pm.innerHTML='<div class="stage"><div class="kick">Passage complete</div><h1 class="title">'+esc(p.title)+'</h1>'+
    '<div class="counter"><div><b>'+r+'</b><span>recalled</span></div><div><b>'+h+'</b><span>with a hint</span></div><div><b>'+x+'</b><span>missed</span></div></div>'+
    (()=>{ const bl=bestLine(p.id,r,k.length); setTimeout(()=>{ const big=pm.querySelector('.counter b'); if(r===k.length) cheer('finale'); else if(bl.nb) cheer('streak',big); else cheer('tick',big); },200); return bl.html; })()+
    '<p class="instr" style="padding-top:12px">'+(x||h?'Words you missed or needed a hint for will wait in Revisit. Come back to them tomorrow.':'All recalled without help. Try the next passage, then return to this one in a few days.')+'</p></div>'+
    '<div class="actions"><button class="btn quiet" id="again" type="button">Try again</button>'+(next?'<button class="btn primary" id="nx" type="button">Next passage</button>':'<button class="btn primary" id="rv" type="button">Revisit</button>')+'</div>';
  $('again').onclick=()=>{reset();draw();};
  if($('nx')) $('nx').onclick=()=>{pi++;reset();draw();};
  if($('rv')) $('rv').onclick=()=>{mode='revisit';draw();};
}

function drawRevisit(){
  const miss=Object.entries(store.missed).sort((a,b)=>b[1]-a[1]).slice(0,10);
  pm.innerHTML='<div class="stage"><div class="kick">Bring it back</div><h1 class="title">Revisit</h1><p class="instr">Retrieval works best when it is spaced. Redo the passages you scored lowest on, and look at the words you keep missing.</p>'+
    (miss.length?'<div class="rev"><b>Words to bring back</b><div class="miss">'+miss.map(m=>'<span>'+esc(m[0])+' · '+m[1]+'</span>').join('')+'</div></div>':'')+
    (()=>{const r=store.res.patterns;return '<div class="rev"><button type="button" data-pat="1" style="text-align:left;width:100%"><b>What comes next?</b><p>Patterns · '+(r?r.r+' right of '+r.t+' last round':'not tried yet')+'</p></button></div>';})()+
    P.map((p,i)=>{const r=store.res[p.id];return '<div class="rev"><button type="button" data-id="'+p.id+'" style="text-align:left;width:100%"><b>'+esc(p.title)+'</b><p>'+MODES[p.mode]+' · '+esc(p.from)+' · '+(r?r.r+' recalled, '+r.h+' with a hint of '+r.t:'not tried yet')+'</p></button></div>';}).join('')+'</div>';
  pm.querySelectorAll('[data-pat]').forEach(b=>b.onclick=()=>{mode='patterns';newRound();draw();});
  pm.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{const p=P.find(q=>q.id===b.dataset.id);mode=p.mode;pi=P.filter(q=>q.mode===mode).indexOf(p);reset();draw();});
}

document.querySelectorAll('#modes .mode-btn').forEach(b=>b.onclick=()=>{mode=b.dataset.m;pi=0;reset();draw();});
const from=new URLSearchParams(location.search).get('from');
if(from==='essays'){const a=$('backLink');a.href='../../../index.html?openModal=writing&submenu=essays';a.innerHTML='← Essays';}
draw();
})();
</script>
</body>
</html>
