<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>INTUITY - Sentence Builder</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ═══════════════════════════════════════════════════════════════════
       TOKENS — the same flat system as every other INTUITY page:
       Geist + Geist Mono, warm neutral surfaces, square-cut cards,
       one accent (caramel), no gradient, no blur, no glow.
       ═══════════════════════════════════════════════════════════════════ */
    :root{
      --r-sheet:0;
      --r-field:3px;
      --r-chip:4px;

      --f-display:'Geist','Inter',system-ui,sans-serif;
      --f-body:'Geist','Inter',system-ui,sans-serif;
      --f-mono:'Geist Mono',ui-monospace,monospace;

      --screen:#F3F1ED;
      --card:#FAF8F5;
      --tile-bg:#E8E1D6;
      --tile-bg-press:#DAD1C2;
      --tile-ink:#1C1A18;

      --ink:#232C31;
      --dim:#5C5852;
      --faint:#756B6E;
      --rule:#BCB1A0;

      --caramel:#B0865C;
      --poster-ink:#14110E;
      --poster-body:#5C5852;
      --poster-faint:rgba(20,17,14,.50);
      --poster-fill:rgba(20,17,14,.08);
      --poster-fill-hi:rgba(20,17,14,.14);
      --poster-rule:rgba(20,17,14,.18);

      --ok:#3A6B50;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      overflow-x: hidden;
      width: 100%;
    }

    body {
      font-family: var(--f-body);
      background: var(--screen);
      color: var(--ink);
      min-height: 100vh;
      position: relative;
      -webkit-font-smoothing: antialiased;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    /* the ambient glow washes are gone — a flat screen colour needs none */
    body::before { content: none; }

    .container {
      position: relative;
      z-index: 2;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
      overflow-x: hidden;
    }

    /* ── HEADER — flat paper, square corners, one hairline ── */
    .global-header {
      background: var(--card);
      border-radius: var(--r-sheet);
      padding: 1rem 1.5rem;
      margin-bottom: 1rem;
      text-align: center;
      border-bottom: 1px solid var(--poster-rule);
      box-shadow: 0 1px 3px rgba(20,17,14,.08);
      position: relative;
    }

    .header-brand-logo {
      font-family: var(--f-display);
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: .18em;
      color: var(--poster-ink);
      text-transform: uppercase;
    }

    .header-subtitle {
      font-family: var(--f-mono);
      font-size: 0.62rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--poster-faint);
      margin-top: 0.3rem;
    }

    .header-left {
      position: absolute;
      left: 1.5rem;
      top: 50%;
      transform: translateY(-50%);
    }

    .header-actions {
      position: absolute;
      right: 1.5rem;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .home-link {
      color: var(--poster-faint);
      text-decoration: none;
      font-family: var(--f-mono);
      font-size: 0.66rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      padding: 0.4rem 0.85rem;
      border-radius: var(--r-chip);
      background: var(--poster-fill);
      transition: background .15s, color .15s;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      min-height: 44px;
      justify-content: center;
    }

    .home-link:hover {
      color: var(--poster-ink);
      background: var(--poster-fill-hi);
    }

    .home-link:active {
      transform: scale(0.97);
    }

    /* ── TOGGLE NAVIGATION — flat row ── */
    .toggle-navigation {
      background: var(--card);
      border-radius: var(--r-sheet);
      padding: 1rem 1.5rem;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      box-shadow: 0 1px 3px rgba(20,17,14,.06);
    }

    .toggle-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .toggle-label {
      font-family: var(--f-mono);
      font-size: 0.66rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      white-space: nowrap;
      transition: color 0.2s;
    }

    .toggle-label.active {
      color: var(--caramel);
    }

    .toggle-label.inactive {
      color: var(--poster-faint);
    }

    /* the switch: flat pill, caramel when on — no glow, no coloured ring */
    .toggle-switch {
      position: relative;
      width: 40px;
      height: 22px;
      background: var(--poster-fill);
      border-radius: 999px;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
      min-width: 40px;
    }

    .toggle-switch:active {
      transform: scale(0.96);
    }

    .toggle-knob {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 18px;
      height: 18px;
      background: var(--card);
      border-radius: 50%;
      transition: left 0.2s;
      box-shadow: 0 1px 2px rgba(20,17,14,.2);
    }

    /* ── MAIN CONTENT CARD — square, flat, one hairline shadow ── */
    .unified-box {
      background: var(--card);
      border-radius: var(--r-sheet);
      box-shadow: 0 1px 3px rgba(20,17,14,.08);
      overflow: hidden;
    }

    /* ── STAGE DOTS ── */
    .stage-dots-section {
      padding: 0.85rem 1rem;
      background: var(--poster-fill);
      border-bottom: 1px solid var(--poster-rule);
      display: flex;
      justify-content: center;
      gap: 1.5rem;
    }

    .stage-dots-section.hidden {
      display: none;
    }

    .stage-dot-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
      cursor: pointer;
      padding: 0.5rem;
      min-width: 44px;
      min-height: 44px;
      justify-content: center;
    }

    .stage-dot {
      width: 0.85rem;
      height: 0.85rem;
      border-radius: 50%;
      background: none;
      box-shadow: inset 0 0 0 1.5px var(--rule);
      transition: all 0.2s;
    }

    .stage-dot-wrapper.current .stage-dot {
      background: var(--caramel);
      box-shadow: none;
      transform: scale(1.2);
    }

    .stage-dot-label {
      font-family: var(--f-mono);
      font-size: 0.56rem;
      font-weight: 700;
      color: var(--poster-faint);
      text-transform: uppercase;
      letter-spacing: .04em;
      transition: color 0.2s;
    }

    .stage-dot-wrapper.current .stage-dot-label {
      color: var(--caramel);
      font-weight: 800;
    }

    /* ── CONTENT AREA — flat paper, no gradient ── */
    .content-area {
      position: relative;
      padding: 3rem 2.5rem;
      min-height: 500px;
      background: var(--card);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .content-inner {
      width: 100%;
      max-width: 900px;
    }

    /* ── X-RAY BUTTON — flat chip ── */
    .xray-btn {
      position: absolute;
      top: 1rem;
      right: 1rem;
      padding: 0.5rem 1rem;
      border-radius: 999px;
      border: none;
      background: var(--poster-fill);
      color: var(--caramel);
      font-family: var(--f-mono);
      font-size: 0.66rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s;
      min-height: 44px;
      min-width: 44px;
    }

    .xray-btn:hover {
      background: var(--poster-fill-hi);
    }

    .xray-btn:active {
      transform: scale(0.96);
    }

    /* ── SENTENCE CONTENT ── */
    .sentence-title {
      font-family: var(--f-display);
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--poster-ink);
      margin-bottom: 0.5rem;
      text-align: center;
    }

    .sentence-subtitle {
      font-family: var(--f-mono);
      font-size: 0.7rem;
      color: var(--poster-faint);
      text-align: center;
      margin-bottom: 2rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .sentence-builder {
      font-family: var(--f-body);
      font-size: 1rem;
      line-height: 1.75;
      color: var(--poster-ink);
      font-weight: 600;
      text-align: left;
      margin-bottom: 2rem;
    }

    /* additions: one accent, fading toward faint as levels build up —
       not five unrelated hues of blue */
    .sentence-builder .addition {
      font-family: var(--f-body);
      font-size: 0.95rem;
      font-weight: 400;
      opacity: 0.9;
    }

    .addition-complete { color: var(--caramel) !important; }
    .addition-enhanced { color: var(--caramel) !important; opacity: .85; }
    .addition-complex  { color: var(--poster-body) !important; }
    .addition-advanced { color: var(--poster-body) !important; opacity: .8; }
    .addition-mastery  { color: var(--poster-faint) !important; }

    .step-text .addition {
      font-family: var(--f-body) !important;
      font-size: 1rem !important;
      font-weight: 500 !important;
      opacity: 0.9;
    }

    .full-progression {
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
    }

    /* each level: flat fill, a caramel mark that deepens with level rather
       than five saturated hues (amber/lime/emerald/cyan) racing each other */
    .progression-step {
      padding: 1.3rem 1.4rem;
      background: var(--poster-fill);
      border-radius: var(--r-field);
      border-left: 3px solid var(--caramel);
      transition: background 0.15s;
    }

    .progression-step:hover {
      background: var(--poster-fill-hi);
    }

    .step-level-1 { border-left-color: rgba(176,134,92,.35); }
    .step-level-2 { border-left-color: rgba(176,134,92,.5); }
    .step-level-3 { border-left-color: rgba(176,134,92,.65); }
    .step-level-4 { border-left-color: rgba(176,134,92,.82); }
    .step-level-5 { border-left-color: var(--caramel); }

    .step-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.9rem;
      flex-wrap: wrap;
      gap: .4rem;
    }

    .step-status {
      font-family: var(--f-mono);
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 0.3rem 0.7rem;
      border-radius: 999px;
      background: var(--tile-bg);
      color: var(--tile-ink);
    }

    /* the final level is marked the way the rest of the product marks a
       correct answer — the shared ok pair, not a sixth hue */
    .status-mastery { background: var(--tile-bg); color: var(--caramel); font-weight:800; }

    .step-structure {
      font-family: var(--f-mono);
      font-size: 0.66rem;
      color: var(--poster-faint);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .step-text {
      font-family: var(--f-body);
      font-size: 1rem;
      line-height: 1.7;
      color: var(--poster-ink);
      font-weight: 700;
      margin-bottom: 0.9rem;
    }

    .step-text .addition {
      color: var(--poster-body) !important;
      opacity: 1 !important;
    }

    .step-level-4 .step-text .addition,
    .step-level-5 .step-text .addition {
      color: var(--caramel) !important;
    }

    .step-explanation {
      font-family: var(--f-body);
      font-size: 0.85rem;
      line-height: 1.55;
      color: var(--poster-faint);
      padding: 0.7rem 0.8rem;
      background: var(--card);
      box-shadow: inset 0 0 0 1px var(--poster-rule);
      border-radius: var(--r-field);
    }

    /* ── NAV FOOTER ── */
    .nav-footer {
      padding: 0.85rem 1rem;
      background: var(--poster-fill);
      border-top: 1px solid var(--poster-rule);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
    }

    .nav-footer.hidden {
      display: none;
    }

    .nav-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: var(--tile-bg);
      color: var(--tile-ink);
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-btn:hover:not(:disabled) {
      background: var(--tile-bg-press);
    }

    .nav-btn:active:not(:disabled) {
      transform: scale(0.95);
    }

    .nav-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .nav-info {
      font-family: var(--f-mono);
      font-size: 0.7rem;
      color: var(--poster-faint);
    }

    .loading {
      text-align: center;
      color: var(--poster-faint);
      font-family: var(--f-mono);
      font-size: 0.85rem;
    }

    /* ── Mobile Responsive ── */
    @media (max-width: 768px) {
      .container {
        padding: max(0.5rem, env(safe-area-inset-top)) max(0.5rem, env(safe-area-inset-right)) max(0.5rem, env(safe-area-inset-bottom)) max(0.5rem, env(safe-area-inset-left));
      }
      .global-header { padding: 0.75rem 1rem; }
      .header-brand-logo { font-size: 1rem; }
      .header-subtitle { font-size: 0.58rem; }
      .header-actions { left: 1rem; gap: 0.35rem; }
      .home-link {
        font-size: 0.6rem;
        padding: 0.35rem 0.7rem;
      }
      .toggle-navigation { padding: 0.85rem 1rem; gap: 1rem; }
      .toggle-group { gap: 0.6rem; }
      .toggle-label { font-size: 0.58rem; }
      .toggle-switch { width: 38px; height: 20px; }
      .toggle-knob { width: 16px; height: 16px; }
      .stage-dots-section { padding: 0.75rem 0.85rem; gap: 1rem; }
      .stage-dot { width: 0.75rem; height: 0.75rem; }
      .stage-dot-label { font-size: 0.5rem; }
      .content-area { padding: 2rem 1.25rem; min-height: 400px; }
      .xray-btn { top: 0.75rem; right: 0.75rem; padding: 0.45rem 0.85rem; font-size: 0.6rem; }
      .sentence-builder { font-size: 0.95rem; line-height: 1.65; }
      .sentence-title { font-size: 1.1rem; }
      .sentence-subtitle { font-size: 0.64rem; }
      .nav-footer { padding: 0.75rem 0.85rem; }
      .nav-btn { width: 40px; height: 40px; font-size: 1rem; }
      .nav-info { font-size: 0.62rem; }
      .step-text { font-size: 0.92rem; }
    }

    @media (max-width: 480px) {
      .toggle-navigation {
        flex-direction: column;
        align-items: stretch;
        gap: 0.75rem;
      }

      .toggle-group {
        justify-content: center;
      }
    }

    @media (max-width: 400px) {
      .header-actions {
        position: static;
        margin-top: 0.75rem;
        justify-content: center;
        transform: none;
        left: auto;
      }

      .global-header {
        text-align: center;
      }

      .header-brand-logo { font-size: 0.95rem; }
    }

    @media (max-width: 374px) {
      .toggle-label {
        font-size: 0.52rem;
      }

      .header-brand-logo {
        font-size: 0.88rem;
      }

      .stage-dots-section {
        gap: 0.75rem;
      }

      .stage-dot-label {
        font-size: 0.46rem;
      }
    }

    @media (max-width: 768px) and (orientation: landscape) {
      .content-area {
        min-height: 300px;
        padding: 1.5rem 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
  
    <!-- Header -->
    <div class="global-header">
      <div class="header-brand-logo">INTUITY</div>
      <div class="header-subtitle">Sentence Builder</div>
      
     <div class="header-actions">
        <a href="#" id="backLink" class="home-link">← Sentence Structure</a>
      </div>
    </div>  <!-- This closes .global-header -->
    
    <!-- Toggle Navigation --> 
    <div class="toggle-navigation">
      <div class="toggle-group">
        <span class="toggle-label" id="levelLabel">📊 Level</span>
        <div class="toggle-switch" id="modeToggle" onclick="toggleMode()">
          <div class="toggle-knob" id="modeKnob"></div>
        </div>
        <span class="toggle-label" id="progressionLabel">📈 Progression</span>
      </div>
    </div>

    <!-- Main Content Card -->
    <div class="unified-box">
      
      <!-- Stage Dots (Now 5 levels) -->
      <div class="stage-dots-section" id="stageDots">
        <div class="stage-dot-wrapper current" onclick="goToStage(0)">
          <div class="stage-dot"></div>
          <span class="stage-dot-label">Level 1</span>
        </div>
        <div class="stage-dot-wrapper" onclick="goToStage(1)">
          <div class="stage-dot"></div>
          <span class="stage-dot-label">Level 2</span>
        </div>
        <div class="stage-dot-wrapper" onclick="goToStage(2)">
          <div class="stage-dot"></div>
          <span class="stage-dot-label">Level 3</span>
        </div>
        <div class="stage-dot-wrapper" onclick="goToStage(3)">
          <div class="stage-dot"></div>
          <span class="stage-dot-label">Level 4</span>
        </div>
        <div class="stage-dot-wrapper" onclick="goToStage(4)">
          <div class="stage-dot"></div>
          <span class="stage-dot-label">Level 5</span>
        </div>
      </div>

      <!-- Content Area -->
      <div class="content-area">
        <button class="xray-btn" id="xrayBtn" onclick="toggleXRay()">Structure</button>
        
        <div class="content-inner" id="contentInner">
          <div class="loading">Loading sentence data...</div>
        </div>
      </div>

      <!-- Navigation Footer -->
      <div class="nav-footer" id="navFooter">
        <button class="nav-btn" id="prevBtn" onclick="prevExample()">←</button>
        <div class="nav-info" id="navInfo">Example 1 of 8</div>
        <button class="nav-btn" id="nextBtn" onclick="nextExample()">→</button>
      </div>

    </div>

  </div>

  <script>
    // State
    let currentMode = 'level';
    let currentLevel = 0;
    let currentExampleIndex = 0;
    let showStructure = false;

    let examplesData = [];

    const levelLabels = ['Complete', 'Enhanced', 'Complex', 'Advanced', 'Mastery'];

    // Initialize
    async function init() {
      try {
        const response = await fetch('data/sentence-builder.json');
        const data = await response.json();
        examplesData = data.examples || [];

        updateUI();
        render();
      } catch (error) {
        console.error('Error loading data:', error);
        document.getElementById('contentInner').innerHTML = '<div class="loading">Error loading data</div>';
      }
    }

    function toggleMode() {
      currentMode = currentMode === 'level' ? 'progression' : 'level';
      updateUI();
      render();
    }

    function toggleXRay() {
      showStructure = !showStructure;
      document.getElementById('xrayBtn').textContent = showStructure ? 'Normal' : 'Structure';
      render();
    }

    function goToStage(index) {
      currentLevel = index;
      updateStageDots();
      render();
    }

    function prevExample() {
      if (currentExampleIndex > 0) {
        currentExampleIndex--;
        currentLevel = 0;
        updateUI();
        render();
      }
    }

    function nextExample() {
      if (currentExampleIndex < examplesData.length - 1) {
        currentExampleIndex++;
        currentLevel = 0;
        updateUI();
        render();
      }
    }

    function updateUI() {
      const modeKnob = document.getElementById('modeKnob');
      modeKnob.style.left = currentMode === 'progression' ? '20px' : '2px';

      document.getElementById('levelLabel').className = 'toggle-label ' + (currentMode === 'level' ? 'active' : 'inactive');
      document.getElementById('progressionLabel').className = 'toggle-label ' + (currentMode === 'progression' ? 'active' : 'inactive');

      const showDots = currentMode === 'level' && examplesData.length > 0;
      document.getElementById('stageDots').className = 'stage-dots-section' + (showDots ? '' : ' hidden');

      const showNav = examplesData.length > 0;
      document.getElementById('navFooter').className = 'nav-footer' + (showNav ? '' : ' hidden');

      document.getElementById('prevBtn').disabled = currentExampleIndex === 0;
      document.getElementById('nextBtn').disabled = currentExampleIndex === examplesData.length - 1;
      document.getElementById('navInfo').textContent = `Example ${currentExampleIndex + 1} of ${examplesData.length}`;

      updateStageDots();
    }

    function updateStageDots() {
      const dots = document.querySelectorAll('.stage-dot-wrapper');
      dots.forEach((wrapper, i) => {
        wrapper.className = 'stage-dot-wrapper' + (i === currentLevel ? ' current' : '');
      });
    }

    function render() {
      const container = document.getElementById('contentInner');
      const currentExample = examplesData[currentExampleIndex];
      
      if (!currentExample) {
        container.innerHTML = '<div class="loading">No example available</div>';
        return;
      }

      if (currentMode === 'level') {
        // Show single level
        const step = currentExample.steps[currentLevel];
        if (!step) {
          container.innerHTML = '<div class="loading">No content for this level</div>';
          return;
        }

        container.innerHTML = `
          <div class="sentence-title">${currentExample.topic}</div>
          <div class="sentence-subtitle">Level ${currentLevel + 1}: ${levelLabels[currentLevel]}</div>
          <div class="sentence-builder level-${currentLevel + 1}">${step.text}</div>
          ${showStructure ? `
            <div style="background: rgba(0, 0, 0, 0.3); border-radius: 0.75rem; padding: 1.5rem; border-left: 4px solid #C9A961;">
              <div style="font-size: 0.7rem; font-weight: 700; color: #C9A961; text-transform: uppercase; margin-bottom: 0.75rem;">
                ${step.structure}
              </div>
              <div style="font-size: 0.9rem; line-height: 1.6; color: #9ca3af;">
                ${step.explanation}
              </div>
            </div>
          ` : ''}
        `;
      } else {
        // Show full progression
        let html = `
          <div class="sentence-title">${currentExample.topic}</div>
          <div class="sentence-subtitle">Full Progression</div>
          <div class="full-progression">
        `;
        
        currentExample.steps.forEach((step, idx) => {
          const statusClasses = ['status-complete', 'status-enhanced', 'status-complex', 'status-advanced', 'status-mastery'];
          
          html += `
            <div class="progression-step step-level-${idx + 1}">
              <div class="step-header">
                <div class="step-structure">Level ${idx + 1}: ${step.structure}</div>
                <div class="step-status ${statusClasses[idx]}">${step.status}</div>
              </div>
              <div class="step-text">${step.text}</div>
              ${showStructure ? `<div class="step-explanation">${step.explanation}</div>` : ''}
            </div>
          `;
        });
        
        html += '</div>';
        container.innerHTML = html;
      }
    }
    
// Dynamic back button setup
    function setupBackButton() {
      const backLink = document.getElementById('backLink');
      const urlParams = new URLSearchParams(window.location.search);
      const from = urlParams.get('from');
      
      if (from === 'essays') {
        backLink.href = '../../../index.html?openModal=writing&submenu=essays';
        backLink.innerHTML = '<span style="margin-right: 0.4rem;">←</span>Essays';
      } else {
        backLink.href = '../../../index.html?openModal=writing&submenu=sentence-structure';
        backLink.innerHTML = '<span style="margin-right: 0.4rem;">←</span>Sentence Structure';
      }
    }

    // Call setup when page loads
    window.addEventListener('DOMContentLoaded', setupBackButton);

    init();
  </script>
</body>
</html>
