<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Be2FIRST — Sentence Types</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..900&family=Geist+Mono:wght@400..600&family=Space+Grotesk:wght@700&family=Anton&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&display=swap" rel="stylesheet">
<style>
  :root{
    --f-display:'Geist', system-ui, sans-serif;--f-mono:'Geist Mono', ui-monospace, monospace;--f-poster:'Anton', Impact, sans-serif;
    --screen:#F3F1ED;--card:#FAF8F5;--ink:#232C31;--dim:#5C5852;--faint:#756B6E;--caramel:#B0865C;
    --poster-ink:#14110E;--poster-body:#5C5852;--poster-faint:rgba(20,17,14,.50);
    --poster-fill:rgba(20,17,14,.08);--poster-rule:rgba(20,17,14,.20);--ease:cubic-bezier(.2,.9,.3,1);
  }
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:#F3F1EC}html,body{height:100%}
  body{overflow:hidden;background:#F3F1EC;color:var(--ink);font-family:'Geist', system-ui, sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center}
  button,a{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
  :focus-visible{outline:2px solid var(--caramel);outline-offset:2px}

  /* HEADER — same as Sentence Builder */
  .header{width:100%;flex:none;background:var(--card);border-bottom:1px solid var(--poster-rule);padding:calc(14px + env(safe-area-inset-top)) 16px 0}
  .header-top{display:flex;align-items:flex-start;justify-content:space-between;padding-bottom:.9rem;gap:.6rem}
  .back-link{font-family:var(--f-mono);font-size:0.6875rem;letter-spacing:.1em;text-transform:uppercase;color:var(--poster-faint);padding-top:.25rem;flex:none;text-decoration:none;font-weight:700}
  .back-link:hover{color:var(--poster-ink)}
  .header-title{flex:1;text-align:center}
  .app-title{display:inline-flex;align-items:center;gap:.4rem;font-family:var(--f-display);font-weight:800;font-size:1.15rem;letter-spacing:-.03em;color:var(--poster-ink)}
  .app-title::before{content:'';flex:none;width:7px;height:7px;border-radius:2px;background:var(--caramel)}
  .app-subtitle{font-family:var(--f-mono);font-size:0.6875rem;letter-spacing:.14em;text-transform:uppercase;color:var(--poster-faint);margin-top:.2rem}
  .header-spacer{flex:none;width:4.5rem}
  .mode-selector{display:flex;gap:clamp(.55rem,2.6vw,1.4rem);justify-content:center;padding-bottom:.8rem;flex-wrap:wrap}
  .mode-btn{font-family:var(--f-mono);font-size:0.6875rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--poster-faint);padding-bottom:.25rem;transition:color .15s}
  .mode-btn:hover{color:var(--poster-ink)}
  .mode-btn.active{color:var(--poster-ink);box-shadow:inset 0 -2px 0 var(--caramel)}
  @media (max-width:560px){.header{padding:calc(10px + env(safe-area-inset-top)) 12px 0}.app-title{font-size:1rem}}

  .page{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;background:var(--screen)}
  main{flex:1;min-height:0;width:100%;overflow-y:auto;overscroll-behavior:contain}
  .pm{width:100%;max-width:42rem;margin:0 auto;padding:24px 20px 40px}

  /* CONTENT */
  .kick{display:flex;align-items:center;gap:9px;margin-bottom:.5rem;font-family:var(--f-mono);font-size:0.6875rem;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--poster-faint)}
  .kick::before{content:'';display:block;width:26px;height:10px;flex:none;background:var(--caramel)}
  .title{font-family:var(--f-poster);font-weight:400;letter-spacing:.01em;line-height:1;font-size:clamp(26px,7.4vw,36px);color:var(--poster-ink);padding-bottom:6px}
  .type{border-top:1px solid var(--poster-rule);margin-top:22px;padding-top:16px;animation:rise .45s var(--ease) both}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .type h2{font-size:20px;font-weight:800;letter-spacing:-.02em;color:var(--poster-ink)}
  .type .desc{font-size:14px;line-height:1.5;color:var(--faint);font-style:italic;margin-top:4px}
  .pat{padding:14px 0;border-bottom:1px solid var(--poster-rule)}
  .pat:first-of-type{margin-top:10px;border-top:1px solid var(--poster-rule)}
  .pat-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .pat-h b{font-size:15px;font-weight:650;color:var(--poster-ink)}
  .lv{flex:none;display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;font-family:var(--f-mono);font-size:0.6875rem;font-weight:700;letter-spacing:.06em;background:var(--poster-fill);color:var(--poster-body)}
  .lv.l-b1{background:rgba(20,17,14,.14)}
  .lv.l-b2{background:rgba(20,17,14,.26);color:var(--poster-ink)}
  .lv.l-c1{background:var(--poster-ink);color:#fff}
  .ex{font-size:clamp(17px,4.6vw,20px);line-height:1.5;font-weight:500;letter-spacing:-.01em;color:var(--poster-ink);margin-top:6px}
  .st{font-family:var(--f-mono);font-size:12px;line-height:1.5;color:var(--dim);margin-top:8px;padding:7px 10px;border-radius:3px;background:var(--poster-fill)}
  .basics{all:unset;cursor:pointer;display:inline-block;margin:2px 0 6px;font:600 12.5px/1 'Geist',sans-serif;color:#8A8378;border-bottom:1px solid rgba(20,17,14,.18);padding-bottom:2px}
  .basics:focus-visible{outline:2px solid #B0865C;outline-offset:3px}
  .msg{padding:60px 0;text-align:center;font-size:14px;color:var(--faint)}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

  /* ═══ 9 Nov 2026 — LEARN · SPOT IT · UPGRADE: the reference becomes a game, like Practice and the Board ═══ */
  .kindrow{display:flex;justify-content:center;padding:2px 0 12px}
  .kind{display:inline-flex;padding:4px;border-radius:999px;background:rgba(20,17,14,.07)}
  .kind button{position:relative;padding:10px clamp(12px,4vw,20px);border-radius:999px;font:700 12px/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:#8A8378;transition:background .2s,color .2s}
  .kind button[aria-checked=true]{background:#14110E;color:#F6F3EE}
  .mode-selector[hidden]{display:none}
  .g-how{font-size:14px;line-height:1.45;color:var(--faint);margin:-2px 0 14px}
  .g-card{position:relative;background:var(--card);border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.08);padding:20px 18px 18px;animation:rise .4s var(--ease) both}
  .g-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .g-k{font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--poster-faint)}
  .g-run{font-family:var(--f-mono);font-size:12px;font-weight:600;padding:6px 10px;border-radius:999px;background:#EDE3D6;color:#7A5C3A;opacity:0;transform:scale(.9);transition:opacity .25s,transform .3s var(--ease)}
  .g-run.on{opacity:1;transform:none}.g-run.hot{background:#7A5C3A;color:#fff}
  .g-bar{display:flex;gap:5px;margin:14px 0 4px}
  .g-bar i{flex:1;height:5px;border-radius:3px;background:#E3DED5;transition:background .3s}
  .g-bar i.ok{background:#8AA79C}.g-bar i.no{background:#C9A57F}.g-bar i.now{background:var(--poster-ink)}
  .g-s{margin:16px 0 4px;font-size:clamp(21px,5.8vw,26px);line-height:1.4;font-weight:600;letter-spacing:-.015em;color:var(--poster-ink)}
  .g-s mark{background:none;color:inherit;border-radius:3px;transition:background .4s,color .4s}
  .g-s mark.on{background:#EDE3D6;color:#7A5C3A;box-shadow:0 0 0 3px #EDE3D6}
  .g-from{margin-top:12px;padding:10px 12px;border-radius:4px;background:var(--poster-fill);font-size:16px;line-height:1.45;color:var(--poster-body)}
  .g-goal{margin-top:14px;font-size:clamp(22px,6vw,28px);line-height:1.15;font-family:var(--f-poster);letter-spacing:.01em;color:var(--poster-ink)}
  .g-ask{margin:16px 0 0;font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--poster-faint)}
  .g-opts{display:flex;flex-direction:column;gap:10px;margin-top:10px}
  .g-opt{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:14px 18px;border:1.5px solid rgba(20,17,14,.16);border-radius:10px;background:#fff;text-align:left;font-size:18px;line-height:1.35;font-weight:600;color:var(--poster-ink);transition:background .2s,border-color .2s,color .2s,transform .12s}
  .g-opt:active{transform:scale(.985)}
  .g-opts.long .g-opt{font-size:16.5px;font-weight:500}
  .g-opt.ok{background:#4F6B61;border-color:#4F6B61;color:#fff}
  .g-opt.no{background:rgba(176,134,92,.12);border-color:rgba(176,134,92,.5);color:#7A5C3A;text-decoration:line-through;text-decoration-color:rgba(122,92,58,.5)}
  .g-opt.dim{opacity:.45}
  .g-opt[disabled]{cursor:default}
  .g-opt svg{flex:none}
  .g-why{margin-top:14px;padding-top:12px;border-top:1px dashed rgba(20,17,14,.16);font-size:15px;line-height:1.5;color:var(--poster-body)}
  .g-why b{color:var(--poster-ink)}
  .g-hud{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:14px;font:500 11px/1.4 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:#8A8378}
  .g-hud b{font-size:13px;color:var(--poster-ink)}
  .g-act{position:sticky;bottom:0;display:flex;justify-content:center;gap:8px;margin:18px -20px 0;padding:12px 20px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to bottom,rgba(243,241,237,0),var(--screen) 30%)}
  .g-act button,.g-act a{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 26px;border-radius:999px;font-size:16px;font-weight:600;text-decoration:none;background:rgba(20,17,14,.07);color:var(--poster-ink)}
  .g-act .go{background:#14110E;color:#F6F3EE}
  .g-act button:active{transform:scale(.97)}
  .g-big{display:block;margin:10px 0 4px;font:400 clamp(64px,20vw,92px)/1 var(--f-poster);color:var(--poster-ink)}
  .g-praise{font-size:19px;font-weight:600;color:var(--poster-ink)}
  .g-sub{margin-top:6px;font:500 11px/1.5 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:#8A8378}
  .g-sub.new{color:var(--caramel)}
  .g-band{margin-top:16px;padding:12px 14px;border-left:3px solid var(--caramel);background:#F1E4D4;font-size:14px;line-height:1.45;color:var(--poster-ink)}
  .g-miss{margin-top:14px;display:flex;flex-direction:column;gap:6px}
  .g-miss span{font-size:14.5px;line-height:1.4;color:var(--poster-body)}
  .g-miss span b{color:var(--poster-ink)}
  .g-second{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#7A5C3A}
  .g-tick{width:20px;height:20px}
  @media (prefers-reduced-motion:reduce){.g-run,.g-opt,.g-s mark{transition:none}}
</style>

<body>
<div class="page">
<header class="header">
  <div class="header-top">
  <a class="back-link" id="backLink" href="../../../index.html?openModal=writing&submenu=sentence">← Sentence Structure</a>
    <div class="header-title">
      <div class="app-title">INTUITY</div>
      <div class="app-subtitle">Sentence Types</div>
    </div>
    <span class="header-spacer"></span>
  </div>
  <!-- 9 Nov 2026: Learn · Spot it · Upgrade, where Learn · Practise · Play sit on the grammar pages -->
  <div class="kindrow"><span class="kind" id="kind" role="radiogroup" aria-label="Choose an activity">
    <button type="button" role="radio" data-v="learn">Learn</button><button type="button" role="radio" data-v="spot">Spot it</button><button type="button" role="radio" data-v="up">Upgrade</button>
  </span></div>
  <nav class="mode-selector" id="tabs" role="tablist" aria-label="Category"></nav>
</header>
<main id="main"><section class="pm" id="pm"><p class="msg">Loading…</p></section></main>
</div>
<script src="/skills/grammar-rules/intuity-sound.js"></script>
<script src="/tools/intuity-cheer.js?v=2"></script>
<script src="/tools/intuity-log.js?v=1"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const pickOf=a=>a[(Math.random()*a.length)|0];
const mem=k=>{try{return localStorage.getItem('intuity.stypes.'+k);}catch(e){return null;}};
const keep=(k,v)=>{try{localStorage.setItem('intuity.stypes.'+k,v);}catch(e){}};
const log=(id,ok,game)=>{try{if(window.INTUITY) INTUITY.log('sentence-types',id,ok,{game:game});}catch(e){}};
const cheer=(f,...a)=>{try{if(window.Cheer) Cheer[f](...a);}catch(e){}};
let data=null,G=null,cat=null,view='learn';
/* 8 Nov 2026: a B2 student starts on B1-B2 patterns; the seven A2 basics fold away, one tap to see */
let BASICS=false;

/* back link: from=essays returns to Essays */
(function(){ const from=new URLSearchParams(location.search).get('from'), a=$('backLink');
  if(from==='essays'&&a){ a.href='/index.html?openModal=writing&submenu=essays'; a.innerHTML='&larr; Essays'; } })();

/* ═══ the switch ═══ */
function kind(){
  $('kind').querySelectorAll('button').forEach(b=>b.setAttribute('aria-checked',String(b.dataset.v===view)));
  $('tabs').hidden=view!=='learn';
}
$('kind').querySelectorAll('button').forEach(b=>b.onclick=()=>{ if(view===b.dataset.v&&view!=='learn') return; view=b.dataset.v; keep('view',view); kind(); start(); });
function start(){ $('main').scrollTop=0; if(view==='learn') return draw(); newRound(view); play(); }

/* ═══ LEARN: the reference, as before ═══ */
function tabs(){
  $('tabs').innerHTML=data.categories.map(c=>'<button class="mode-btn'+(c.id===cat?' active':'')+'" type="button" role="tab" aria-selected="'+(c.id===cat)+'" data-id="'+esc(c.id)+'">'+esc(c.name)+'</button>').join('');
  $('tabs').querySelectorAll('.mode-btn').forEach(b=>b.onclick=()=>{ cat=b.dataset.id; tabs(); draw(); });
}
function draw(){
  const c=data.categories.find(x=>x.id===cat); if(!c) return;
  const nA2=c.types.reduce((n,t)=>n+t.patterns.filter(p=>p.level==='A2').length,0);
  const show=p=>BASICS||p.level!=='A2';
  $('pm').innerHTML='<div class="kick">Sentence types</div><h1 class="title">'+esc(c.name)+'</h1>'+
    (nA2?'<button type="button" class="basics" id="basics" aria-pressed="'+BASICS+'">'+(BASICS?'Hide the A2 basics':'Show the A2 basics ('+nA2+')')+'</button>':'')+
    c.types.filter(t=>t.patterns.some(show)).map((t,i)=>'<section class="type" style="animation-delay:'+(i*60)+'ms"><h2>'+esc(t.name)+'</h2><p class="desc">'+t.description+'</p>'+
      t.patterns.filter(show).map(p=>'<div class="pat"><div class="pat-h"><b>'+p.pattern+'</b><span class="lv l-'+esc(String(p.level).toLowerCase())+'">'+esc(p.level)+'</span></div>'+
        '<p class="ex">“'+p.example+'”</p><p class="st">'+p.structure+'</p></div>').join('')+'</section>').join('')+
    '<div class="g-act"><button type="button" class="go" id="toSpot">Test yourself: Spot it</button></div>';
  const bb=$('basics'); if(bb) bb.onclick=()=>{ BASICS=!BASICS; const y=$('main').scrollTop; draw(); $('main').scrollTop=y; };
  $('toSpot').onclick=()=>{ view='spot'; keep('view',view); kind(); start(); };
  $('main').scrollTop=0;
}

/* ═══ THE GAMES ═══
   Spot it: which kind of sentence is this? Nine a round. The part that gives it away lights up after the answer.
   Upgrade: two plain sentences and a B2 target; one version is right, the other two hold the mistakes
   B2 students really make. Six a round.
   Both: a bar of the round, a run (3 in a row = fanfare), a missed one comes back once at the end for a
   second go, a score to beat, and every answer goes to the INTUITY log so the home streak counts. */
const ROUND={spot:9,up:6};
const NAME={spot:'Spot it',up:'Upgrade'};
const RIGHT=['Nice catch!','Exactly right!','Sharp eyes!','Right in one!','Got it!','Spot on!'];
const UPRIGHT=['That’s B2!','Examiner-ready!','Clean and correct!','Nailed it!','Band 5 move!'];
function newRound(g){
  const pool=g==='spot'?data.games.spot:data.games.up;
  const missed=JSON.parse(mem('miss.'+g)||'[]');
  /* 9 Nov 2026: up to half the round is sentences missed last time; the rest are the ones
     seen longest ago (never seen first), so new items reach the pupil before old ones repeat */
  const seen=JSON.parse(mem('seen.'+g)||'[]'), age=i=>{ const k=seen.indexOf(i); return k<0?-1:k; };
  const back=shuffle(pool.map((_,i)=>i).filter(i=>missed.indexOf(i)>=0)).slice(0,Math.floor(ROUND[g]/2));
  const rest=shuffle(pool.map((_,i)=>i).filter(i=>back.indexOf(i)<0)).sort((a,b)=>age(a)-age(b));
  const order=shuffle(back.concat(rest.slice(0,ROUND[g]-back.length)));
  keep('seen.'+g,JSON.stringify(seen.filter(i=>order.indexOf(i)<0).concat(order)));
  G={g,q:order.map(i=>({i,second:false})),pos:0,res:[],kept:0,missed:0,run:0,best:0,pick:null,opts:null,n:(G&&G.g===g?G.n:0)+1,missList:[]};
}
const item=()=>{const x=G.q[G.pos];return (G.g==='spot'?data.games.spot:data.games.up)[x.i];};
function bar(){
  const n=ROUND[G.g];let h='';
  for(let k=0;k<n;k++){const r=G.res[k];h+='<i class="'+(r===true?'ok':r===false?'no':(k===G.pos&&!G.q[G.pos].second?'now':''))+'"></i>';}
  return '<div class="g-bar" aria-hidden="true">'+h+'</div>';
}
function hud(){
  const n=ROUND[G.g],done=G.kept+G.missed;
  return done?'<div class="g-hud"><span><b>'+G.kept+'</b> right</span><span><b>'+G.missed+'</b> missed</span><span><b>'+(n-done)+'</b> to go</span></div>':'';
}
function runPill(){ return '<span class="g-run'+(G.run>=2?' on':'')+(G.run>=3?' hot':'')+'" id="run">'+G.run+' in a row</span>'; }
function markTell(s,tell,on){
  if(!tell) return esc(s); const k=s.indexOf(tell); if(k<0) return esc(s);
  return esc(s.slice(0,k))+'<mark class="'+(on?'on':'')+'">'+esc(tell)+'</mark>'+esc(s.slice(k+tell.length));
}
const TICK='<svg class="g-tick" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 10.5l3.4 3.3L15 6.8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function play(){
  if(G.pos>=G.q.length) return end();
  const it=item(), x=G.q[G.pos], done=G.pick!=null, spot=G.g==='spot';
  if(!G.opts) G.opts=spot?shuffle(it.o):shuffle(it.o.map((o,k)=>({t:o.t,why:o.why,ok:k===0})));
  const isOk=o=>spot?o===it.a:o.ok, txt=o=>spot?o:o.t;
  const firstOk=done&&isOk(G.pick);
  let h='<div class="kick">'+NAME[G.g]+' · Round '+G.n+'</div>'+
    (G.n===1&&G.pos===0&&!done?'<p class="g-how">'+(spot?'Read the sentence. What kind is it? The words that give it away light up after you answer.':'Make the plain sentences B2. One version is right; the others hold the mistakes examiners see most.')+'</p>':'')+
    '<div class="g-card"><div class="g-top"><span class="g-k">'+(x.second?'<span class="g-second">Second go</span>':(G.pos+1)+' of '+ROUND[G.g])+'</span>'+runPill()+'</div>'+bar();
  if(spot){
    h+='<p class="g-s">'+markTell(it.s,it.tell,done)+'</p><p class="g-ask">What kind of sentence is it?</p>';
  } else {
    h+='<p class="g-goal">'+esc(it.goal)+'</p><div class="g-from">'+esc(it.from)+'</div><p class="g-ask">Which version is right?</p>';
  }
  h+='<div class="g-opts'+(spot?'':' long')+'" id="opts">'+G.opts.map((o,k)=>{
      let c=''; if(done){ if(isOk(o)) c=' ok'; else if(txt(o)===txt(G.pick)) c=' no'; else c=' dim'; }
      return '<button type="button" class="g-opt'+c+'" data-k="'+k+'"'+(done?' disabled':'')+'><span>'+esc(txt(o))+'</span>'+(done&&isOk(o)?TICK:'')+'</button>';
    }).join('')+'</div>';
  if(done){
    const head=firstOk?pickOf(spot?RIGHT:UPRIGHT):'Not quite.';
    h+='<div class="g-why"><b>'+esc(head)+'</b> '+(spot?esc(it.why):firstOk?'Two ideas, one controlled sentence.':esc(G.pick.why||''))+'</div>';
  }
  h+=hud()+'</div>';
  h+='<div class="g-act">'+(done?'<button type="button" class="go" id="next">'+(G.pos+1<G.q.length?'Next ›':'See your score')+'</button>':'')+'</div>';
  $('pm').innerHTML=h;
  $('opts').querySelectorAll('.g-opt').forEach(b=>b.onclick=()=>answer(G.opts[+b.dataset.k],b));
  if($('next')) $('next').onclick=()=>{ G.pos++; G.pick=null; G.opts=null; play(); $('main').scrollTop=0; };
}
function answer(o,btn){
  if(G.pick!=null) return;
  const it=item(), x=G.q[G.pos], spot=G.g==='spot', ok=spot?o===it.a:o.ok;
  G.pick=o;
  if(!x.second){
    G.res[G.pos]=ok;
    if(ok){ G.kept++; G.run++; G.best=Math.max(G.best,G.run); }
    else { G.missed++; G.run=0; G.q.push({i:x.i,second:true}); G.missList.push(x.i); }
    log(G.g+':'+x.i,ok,G.g);
    /* 10 Nov 2026: a card for the review deck - the sentence, the question, the answer and why */
    try{ if(window.Be2&&Be2.answer){
      const ok1=spot?it.a:it.o[0].t;
      Be2.answer(spot?'sentence-spot':'sentence-upgrade',{id:String(x.i),correct:ok,href:location.pathname,
        prompt:spot?it.s:it.from, ask:spot?'What kind of sentence is it?':'Upgrade it: '+it.goal+'.',
        answer:ok1, given:ok?'':(spot?o:o.t), rule:spot?it.why:(ok?'':(o.why||'')), opts:spot?it.o:it.o.map(z=>z.t)}); } }catch(e){}
  } else if(ok){ G.run++; G.best=Math.max(G.best,G.run); }
  play();
  if(ok){
    const el=$('opts').querySelector('.g-opt.ok'); cheer('right',el,!x.second);
    if(G.run>=3&&G.run%3===0) cheer('streak',$('run'));
  } else cheer('soft');
}
function end(){
  const g=G.g,n=ROUND[g],key='best.'+g;
  keep('miss.'+g,JSON.stringify(G.missList));
  try{ if(window.INTUITY) INTUITY.session('sentence-types',g,{kept:G.kept,missed:G.missed}); }catch(e){}
  const best=+(mem(key)||0), newBest=G.kept>best; if(newBest) keep(key,String(G.kept));
  const f=G.kept/n;
  const praise=f===1?'Perfect round!':f>=.75?'Great work: barely any got away.':f>=.5?'Solid. A few worth another look.':'A tricky set: good ones to come back to.';
  const pool=g==='spot'?data.games.spot:data.games.up;
  const misses=G.missList.map(i=>pool[i]);
  let h='<div class="kick">'+NAME[g]+' · Round '+G.n+' done</div><div class="g-card" style="text-align:center">'+
    '<span class="g-big" id="big">'+G.kept+' / '+n+'</span><p class="g-praise">'+esc(praise)+'</p>'+
    '<p class="g-sub">'+(G.missed?G.missed+' missed':'none missed')+(G.best>=3?' · best run '+G.best:'')+'</p>'+
    (newBest||best?'<p class="g-sub'+(newBest&&best?' new':'')+'">'+(newBest?(best?'New best · beat '+best+' / '+n:'First score to beat'):'Your best · '+best+' / '+n)+'</p>':'')+
    '</div>';
  if(misses.length) h+='<div class="g-miss"><p class="g-ask" style="margin-top:6px">These come first next round</p>'+misses.map(m=>'<span>'+(g==='spot'?'<b>'+esc(m.a)+'</b> · '+esc(m.s):'<b>'+esc(m.goal)+'</b> · '+esc(m.o[0].t))+'</span>').join('')+'</div>';
  if(g==='up') h+='<div class="g-band">Cambridge marks this under <b>Language</b>. Band 5 means “a range of simple and complex grammatical forms with control”. Every upgrade here is one of them.</div>';
  h+='<div class="g-act">'+(g==='spot'?'<button type="button" id="other">Try Upgrade</button>':'<button type="button" id="other">Try Spot it</button>')+'<button type="button" class="go" id="again">Next round</button></div>';
  $('pm').innerHTML=h;
  $('again').onclick=()=>{ newRound(g); play(); $('main').scrollTop=0; };
  $('other').onclick=()=>{ view=g==='spot'?'up':'spot'; keep('view',view); kind(); start(); };
  const big=$('big');
  if(G.kept===n) cheer('finale'); else if(newBest&&best) cheer('streak',big); else if(f>=.75) cheer('done',big); else cheer('tick',big);
}

/* ═══ load ═══ */
Promise.all([
  fetch('data/sentence-type.json').then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }),
  fetch('data/sentence-type-games.json?v=2').then(r=>r.ok?r.json():{spot:[],upgrade:[]}).catch(()=>({spot:[],upgrade:[]}))
]).then(([d,gm])=>{
  data=d; data.games={spot:gm.spot||[],up:gm.upgrade||[]};
  cat=(data.categories.find(c=>c.id==='grammatical')||data.categories[0]).id; tabs();
  const want=new URLSearchParams(location.search).get('play')||mem('view');
  view=(want==='spot'&&data.games.spot.length)||(want==='up'&&data.games.up.length)?want:'learn';
  if(!data.games.spot.length) $('kind').parentNode.hidden=true;
  kind(); start();
}).catch(e=>{
  $('pm').innerHTML='<p class="msg">The sentence types didn’t load.<br>Check that data/sentence-type.json exists, then reload.<br><small>'+esc(e.message)+'</small></p>';
});
})();
</script>
