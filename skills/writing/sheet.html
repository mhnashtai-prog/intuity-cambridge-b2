<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F3F1EC">
<title>INTUITY — Writing sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&family=Geist+Mono:wght@500;600&family=Anton&display=swap" rel="stylesheet">
<style>
/* ═══ THE SHEET — one screen per task ═══════════════════════════════════
   The teacher's Writing Portfolio, as the students know it on paper: the
   task's parts in grey bands, a coloured medallion and a letter on each,
   the two halves of a part side by side, the go-to phrase in bold. One tap
   from the Writing menu lands here, and nothing has to be opened, rolled
   or chosen to see the phrases (23 Oct 2026: "kids prefer one screen and
   the rest can wait"). Everything else — questions, building a model,
   reading models, samples, the Challenge — waits in one quiet row at the
   foot of the sheet.
   Data: /data/writing/cue-generator.json — the Portfolio's structure pages
   and the Body page's support moves, proofread. */
:root{--paper:#F3F1EC;--ink:#14110E;--quiet:#5C5852;--faint:#8A8378;--band:#E7E5E1;--tab:#4A4744;--rule:rgba(20,17,14,.12);--caramel:#A9774A}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'Geist',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
.top{display:flex;align-items:center;gap:12px;max-width:1240px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 16px 6px}
.back{font:700 11px/1 'Geist',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--quiet);text-decoration:none;padding:10px 4px;white-space:nowrap}
.top .sp{flex:1}
.tbtn{font:600 13px/1 'Geist',sans-serif;padding:9px 14px;border-radius:999px;border:none;background:rgba(118,118,128,.12);color:var(--ink);cursor:pointer;white-space:nowrap}
.tbtn:active{background:rgba(118,118,128,.24)}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px 40px}
h1{margin:4px 0 2px;font-size:clamp(1.5rem,4vw,2.1rem);line-height:1.05;letter-spacing:-.01em}
h1 b{font-weight:800} h1 span{font-weight:400}
.task{margin:0 0 12px;font-size:.86rem;color:var(--quiet)}
.vars{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 14px;padding:2px 16px}
.vars::-webkit-scrollbar{display:none}
.var{flex:none;font:600 13px/1 'Geist',sans-serif;padding:9px 13px;border-radius:999px;border:1.5px solid var(--rule);background:#FAF8F5;color:var(--ink);cursor:pointer;white-space:nowrap}
.var[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#FAF8F5}
.turn{display:none;margin:0 0 12px;font-size:.82rem;color:var(--faint)}
@media (orientation:portrait) and (max-width:700px){ .turn{display:block} }

/* the bands */
.band{position:relative;background:var(--band);border-radius:6px 18px 18px 6px;margin:0 0 14px 22px;padding:14px 16px 14px 52px}
.medal{position:absolute;left:-22px;top:12px;width:60px;height:60px;border-radius:50%;background:var(--tab);display:grid;place-items:center}
.medal i{width:44px;height:44px;border-radius:50%;background:var(--c);display:grid;place-items:center;font:400 22px/1 'Anton',Impact,sans-serif;color:#2B2724;font-style:normal;
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.25)}
.band h2{margin:2px 0 8px;font-size:1.08rem;font-weight:800}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:4px 26px}
.step h3{margin:6px 0 4px;font:600 10.5px/1.2 'Geist Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.step ul{margin:0;padding:0;list-style:none}
.step li{position:relative;overflow-wrap:anywhere;padding:3px 0 3px 14px;font-size:.95rem;line-height:1.42}
.step li::before{content:'';position:absolute;left:2px;top:.72em;width:5px;height:5px;border-radius:50%;background:var(--ink)}
.step li.go{font-weight:700}
.step li small{font-weight:400;color:var(--faint);font-size:.8em;white-space:nowrap}
.support{margin:10px 0 0;border-top:1px dashed rgba(20,17,14,.18);padding-top:8px}
.support summary{cursor:pointer;list-style:none;font-size:.9rem;color:var(--quiet)}
.support summary::-webkit-details-marker{display:none}
.support summary b{color:var(--ink)}
.support summary span{color:var(--caramel);font-weight:600}
.moves{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr));gap:4px 20px;margin-top:8px}
.moves h3{margin:6px 0 2px;font:600 10.5px/1.2 'Geist Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.moves p{margin:0;font-size:.88rem;line-height:1.5}
.moves p b{font-weight:700}

/* the quiet row: everything else, one tap away */
.more{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin:20px 0 0;padding-top:14px;border-top:1px solid var(--rule)}
.more span{font:600 10.5px/1 'Geist Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-right:4px}
.more a{font-size:.88rem;color:var(--quiet);text-decoration:none;padding:8px 12px;border-radius:999px;background:rgba(118,118,128,.1)}
.more a:active{background:rgba(118,118,128,.22)}
.state{padding:40px 0;text-align:center;color:var(--faint)}

/* a phone held upright: smaller medallion, more room for the phrases */
@media (max-width:600px) and (orientation:portrait){
  .band{margin-left:16px;padding:12px 12px 12px 36px}
  .medal{left:-16px;width:44px;height:44px} .medal i{width:32px;height:32px;font-size:16px}
  .step li{font-size:.92rem}
}
/* a phone turned sideways: the sheet as the paper is — compact, columns side by side */
@media (orientation:landscape) and (max-height:520px){
  .top{padding-top:6px} h1{font-size:1.35rem} .task{margin-bottom:8px}
  .band{padding:10px 14px 10px 48px;margin-bottom:10px}
  .medal{width:52px;height:52px;top:8px} .medal i{width:38px;height:38px;font-size:19px}
  .step li{font-size:.86rem;padding:2px 0 2px 13px}
}
@media print{
  @page{size:A4 landscape;margin:10mm}
  html,body{background:#fff}
  .top,.vars,.turn,.more,.support summary span{display:none!important}
  .band{break-inside:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .medal,.medal i{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .support[open] .moves,.support .moves{display:grid}
}
</style>
</head>
<body>
<div class="top">
  <a class="back" id="back" href="/index.html?openModal=writing" target="_top">← Writing</a>
  <span class="sp"></span>
  <button class="tbtn" id="side" type="button" hidden>Sideways</button>
  <button class="tbtn" id="print" type="button">Print</button>
</div>
<main class="wrap">
  <h1 id="title"><b>Writing</b> <span>Structure</span></h1>
  <p class="task" id="task"></p>
  <div class="vars" id="vars" role="group" aria-label="Type"></div>
  <p class="turn">Turn your phone sideways to see the sheet like the paper.</p>
  <div id="sheet"><div class="state">Loading…</div></div>
  <nav class="more" id="more" aria-label="More for this task"></nav>
</main>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P=new URLSearchParams(location.search);
/* the five tasks, the Portfolio pages each one shows, and where the rest lives */
const TASKS={
  essays:  {name:'Essay', ids:['fa','op','ad','ps','ce','st'], short:{fa:'For & Against',op:'Opinion',ad:'Agree & Disagree',ps:'Problems & Solutions',ce:'Cause & Effect',st:'Speculation & Trends'},
            more:[['Questions','/skills/writing/essays/essay-question.html'],['Plan','/skills/writing/essays/essay-plan.html'],['Build a model','/skills/writing/essays/essay-model.html'],['Read models','/skills/writing/model-generator.html?type=essays'],['Samples','/skills/writing/essays/essay-sample.html']]},
  reviews: {name:'Review', ids:['rv'],
            more:[['Questions','/skills/writing/reviews/review-question-selector.html'],['Plan','/skills/writing/reviews/review-plan.html'],['Build a model','/skills/writing/reviews/reviews-cards.html'],['Read models','/skills/writing/model-generator.html?type=reviews'],['Samples','/skills/writing/reviews/review-sample.html']]},
  reports: {name:'Report', ids:['rp'],
            more:[['Questions','/skills/writing/reports/report-question-selector.html'],['Plan','/skills/writing/reports/report-plan.html'],['Build a model','/skills/writing/reports/reports-cards.html'],['Read models','/skills/writing/model-generator.html?type=reports'],['Samples','/skills/writing/reports/report-sample.html']]},
  emails:  {name:'Email', ids:['ef-app','ef-req','ei-news','ei-advice'], short:{'ef-app':'Formal · Application','ef-req':'Formal · Request','ei-news':'Informal · News & plans','ei-advice':'Informal · Advice'},
            more:[['Questions','/skills/writing/emails/email-question.html'],['Plan','/skills/writing/emails/email-plan.html'],['Build a model','/skills/writing/emails/email-model.html'],['Read models','/skills/writing/model-generator.html?type=emails'],['Samples','/skills/writing/emails/email-sample.html']]},
  articles:{name:'Article', ids:['ar'],
            more:[['Questions','/skills/writing/articles/article-question.html'],['Build a model','/skills/writing/articles/article-model.html'],['Read models','/skills/writing/model-generator.html?type=articles'],['Samples','/skills/writing/articles/article-sample.html']]}
};
const COLOURS=['#E5868C','#EE9A6B','#E79BE8','#F2D26A','#9CCFC0','#A9C3EE'];
const TASK=TASKS[P.get('task')]?P.get('task'):'essays', T=TASKS[TASK];
const VKEY='intuity.sheet.'+TASK;
let cur=P.get('v')&&T.ids.includes(P.get('v'))?P.get('v'):(()=>{ try{ const v=localStorage.getItem(VKEY); if(T.ids.includes(v)) return v; }catch(e){} return T.ids[0]; })();
let DATA=null;

/* one phrase: the go-to in bold; the grammar that follows it, small */
const li=it=>`<li class="${it.go?'go':''}">${esc(it.t)}${it.h?` <small>${esc(it.h)}</small>`:''}</li>`;
const same=(a,b)=>a&&b&&a.items.length&&a.items.map(x=>x.t).join('|')===b.items.map(x=>x.t).join('|');

function draw(){
  const t=DATA.types.find(x=>x.id===cur); if(!t){ $('sheet').innerHTML='<div class="state">This sheet is missing.</div>'; return; }
  const name=T.short?T.short[cur]:T.name;
  document.title='INTUITY — '+(T.short?T.name+' · '+name:T.name)+' sheet';
  $('title').innerHTML=`<b>${esc(T.short?name:T.name)}</b> <span>Structure</span>`;
  $('task').textContent=t.task||'';
  $('vars').innerHTML=T.ids.length>1?T.ids.map(id=>`<button class="var" type="button" data-v="${id}" aria-pressed="${id===cur}">${esc(T.short[id])}</button>`).join(''):'';
  $('vars').hidden=T.ids.length<2;
  $('vars').querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{ cur=b.dataset.v; try{ localStorage.setItem(VKEY,cur); }catch(e){} draw(); });
  $('sheet').innerHTML=t.paras.map((p,k)=>{
    /* steps: a "support it" step becomes one line under the band; a step that
       repeats the one before (First / Second question) is shown once */
    const steps=[], sup=p.steps.some(s=>s.support);
    p.steps.filter(s=>!s.support&&s.items.length).forEach(s=>{ const prev=steps[steps.length-1];
      if(same(prev,s)) prev.label+=' · '+s.label; else steps.push({label:s.label,items:s.items}); });
    const L=String.fromCharCode(65+k);
    return `<section class="band" aria-label="${esc(p.name)}"><div class="medal" aria-hidden="true"><i style="--c:${COLOURS[k%COLOURS.length]}">${L}</i></div>
      <h2>${esc(p.name)}</h2>
      <div class="cols">${steps.map(s=>`<div class="step">${steps.length>1||s.label!==p.name?`<h3>${esc(s.label)}</h3>`:''}<ul>${s.items.map(li).join('')}</ul></div>`).join('')}</div>
      ${sup?supportHTML():''}</section>`;
  }).join('');
  $('more').innerHTML='<span>When you want more</span>'+T.more.map(([l,u])=>`<a href="${u}">${esc(l)}</a>`).join('')+`<a href="/skills/writing/the-question.html">Challenge</a>`;
}
/* the Body page's support moves, folded: one line until a student wants them */
function supportHTML(){
  const mv=DATA.moves||[];
  return `<details class="support"><summary><b>Support each point:</b> ${mv.map(m=>m.move.toLowerCase()).join(', ')} <span>· show phrases</span></summary>
    <div class="moves">${mv.map(m=>`<div><h3>${esc(m.move)}</h3><p>${m.items.slice(0,5).map(it=>it.go?`<b>${esc(it.t)}</b>`:esc(it.t)).join(' · ')}</p></div>`).join('')}</div></details>`;
}

$('print').onclick=()=>{ document.querySelectorAll('details.support').forEach(d=>d.open=true); window.print(); };
/* Sideways: full screen and landscape, where the phone allows it (Android) */
if(document.fullscreenEnabled&&screen.orientation&&screen.orientation.lock&&matchMedia('(pointer:coarse)').matches){
  const b=$('side'); b.hidden=false;
  b.onclick=async()=>{ try{ if(!document.fullscreenElement) await document.documentElement.requestFullscreen(); await screen.orientation.lock('landscape'); }catch(e){} };
  document.addEventListener('fullscreenchange',()=>{ b.textContent=document.fullscreenElement?'Exit':'Sideways'; if(!document.fullscreenElement){ try{ screen.orientation.unlock(); }catch(e){} } else b.onclick=()=>document.exitFullscreen(); if(!document.fullscreenElement) b.onclick=async()=>{ try{ await document.documentElement.requestFullscreen(); await screen.orientation.lock('landscape'); }catch(e){} }; });
}
fetch('/data/writing/cue-generator.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{ DATA=d; draw(); })
  .catch(()=>{ $('sheet').innerHTML='<div class="state">The sheet didn’t load — reload to try again.</div>'; });
})();
</script>
</body>
</html>
