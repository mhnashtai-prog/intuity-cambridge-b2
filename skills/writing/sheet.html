<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F3F1EC">
<title>INTUITY — Writing sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&family=Geist+Mono:wght@500;600&family=Anton&display=swap" rel="stylesheet">
<style>
/* ═══ THE REVISION SHEET (Oct 2026) ═══════════════════════════════════════
   Tested at the school: students copy the frames, learn them and reproduce
   them in the exam. They rarely write, record or self-check here. So this
   page is built for exactly that, and made safe for it:
   · one frame per task, 2–3 lines a band, the bold line is the one to learn
   · the band heading is the paragraph's JOB, the paragraph name is the label
   · every frame carries its tail (+ a sentence…) glued on, so a copied frame
     is never a fragment
   · today's question fills the slots, so what they copy fits a real task
   · Test me hides the bold lines: reading becomes recall
   · tap a line to copy it; Print gives one A4 side
   Content: /data/writing/revision-sheet.json (cue-generator.json untouched). */
:root{--paper:#F3F1EC;--ink:#14110E;--quiet:#4F4B45;--faint:#615C55;--band:#E7E5E1;--tab:#4A4744;--rule:rgba(20,17,14,.14);
  --start:#9CCFC0;--body:#F2D26A;--end:#E5868C;--slot:#FFF6D9;--slotInk:#5A4300;--idea:#E6EEF9;--ideaInk:#1F3F6B}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'Geist',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
.top{display:flex;align-items:center;flex-wrap:wrap;gap:8px;max-width:1240px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 16px 6px}
.back{font:700 11px/1 'Geist',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--quiet);text-decoration:none;padding:10px 4px;white-space:nowrap}
.top .sp{flex:1}
.tbtn{font:600 13px/1 'Geist',sans-serif;padding:9px 14px;border-radius:999px;border:none;background:rgba(118,118,128,.13);cursor:pointer;white-space:nowrap}
.tbtn:active{transform:scale(.96)}
.tbtn[aria-pressed="true"]{background:var(--ink);color:#FAF8F5}
.exam{display:inline-flex;border-radius:999px;background:rgba(118,118,128,.13);padding:3px}
.exam button{border:none;background:none;padding:6px 11px;border-radius:999px;font:600 12px/1 'Geist',sans-serif;cursor:pointer;color:var(--quiet)}
.exam button[aria-pressed="true"]{background:#FAF8F5;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px 48px}
.tasks{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:6px -16px 10px;padding:2px 16px}
.tasks::-webkit-scrollbar{display:none}
.tasks a{flex:none;text-decoration:none;font:600 13px/1 'Geist',sans-serif;padding:8px 12px;border-radius:8px;color:var(--quiet)}
.tasks a[aria-current="page"]{background:var(--ink);color:#FAF8F5}
h1{margin:6px 0 2px;font:400 clamp(2rem,6vw,2.8rem)/1 'Anton',Impact,sans-serif;text-transform:uppercase;letter-spacing:.01em}
.line{margin:4px 0 2px;font-size:.92rem;color:var(--quiet)}
.reader{margin:0 0 10px;font-size:.92rem;color:var(--quiet)}
.reader b{color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 6px}
.chip{flex:none;font:600 13px/1 'Geist',sans-serif;padding:9px 13px;border-radius:999px;border:1.5px solid var(--rule);background:#FAF8F5;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#FAF8F5}
.when{margin:0 0 10px;font-size:.86rem;color:var(--quiet)}
.examnote{display:inline-block;margin:6px 0 4px;font:600 12px/1.3 'Geist',sans-serif;background:#FBE9D7;border-radius:999px;padding:5px 10px}
.notice{background:#FBE9D7;border-radius:12px;padding:14px 16px;margin:10px 0;font-size:.95rem;line-height:1.45}
.notice button{margin:8px 8px 0 0}

/* how to read the sheet */
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-size:.86rem;color:var(--quiet);margin:4px 0 10px}
.legend b{color:var(--ink)}
.legend details summary{cursor:pointer;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.legend table{border-collapse:collapse;margin-top:6px;font-size:.86rem}
.legend td{padding:3px 10px 3px 0;vertical-align:top}

/* today's question */
.today{background:#FAF8F5;border:1.5px solid var(--rule);border-radius:14px;padding:12px 16px;margin:0 0 14px}
.today .k{font:600 10.5px/1 'Geist Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);display:flex;align-items:center;gap:8px}
.today .k .sp{flex:1}
.today .k button{font:600 12px/1 'Geist',sans-serif;letter-spacing:0;text-transform:none;border:none;background:rgba(118,118,128,.13);border-radius:999px;padding:7px 11px;cursor:pointer;color:var(--ink)}
.today p{margin:8px 0 4px;font-size:1rem;line-height:1.45}
.today ol{margin:4px 0 0;padding-left:1.4em;font-size:.93rem;line-height:1.5;color:var(--quiet)}
.today ol li::marker{font-weight:700;color:var(--ink)}

/* word budget */
.budget{display:flex;gap:3px;margin:0 0 16px;font:600 11px/1 'Geist Mono',monospace;color:var(--ink)}
.budget span{flex:var(--w);background:var(--c);border-radius:4px;padding:6px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.budget em{font-style:normal;flex:none;padding:6px 0 6px 6px;color:var(--quiet)}

/* the bands */
.bands{display:grid;gap:14px}
.band{position:relative;background:var(--band);border-radius:6px 18px 18px 6px;margin-left:22px;padding:14px 16px 14px 50px}
.medal{position:absolute;left:-22px;top:12px;width:56px;height:56px;border-radius:50%;background:var(--tab);display:grid;place-items:center}
.medal i{width:42px;height:42px;border-radius:50%;background:var(--c);display:grid;place-items:center;font:400 22px/1 'Anton',Impact,sans-serif;color:#2B2724;font-style:normal}
.band h2{margin:2px 0 2px;font-size:1.12rem;font-weight:800;line-height:1.25}
.band .lbl{margin:0 0 6px;font:600 11px/1.3 'Geist Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.covers{display:inline-block;margin-left:8px;padding:2px 7px;border-radius:999px;background:#FAF8F5;color:var(--ink);letter-spacing:0;text-transform:none;font-family:'Geist',sans-serif}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:2px 26px}
.step h3{margin:8px 0 2px;font:600 12px/1.2 'Geist',sans-serif;color:var(--quiet)}
.step ul{margin:0;padding:0;list-style:none}
.ph{display:block;width:100%;text-align:left;border:none;background:none;cursor:pointer;border-radius:8px;
  padding:6px 8px 6px 20px;margin:1px 0 1px -8px;font-size:.98rem;line-height:1.45;position:relative;overflow-wrap:anywhere}
.ph::before{content:'';position:absolute;left:8px;top:.95em;width:5px;height:5px;border-radius:50%;background:var(--ink)}
.ph:hover{background:rgba(255,255,255,.55)}
.ph:active{transform:scale(.99)}
.ph.go{font-weight:700}
.ph.go::after{content:'learn';margin-left:8px;font:600 9.5px/1 'Geist Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);vertical-align:2px}
.tail{font-weight:500;font-size:.86em;color:var(--quiet);background:rgba(255,255,255,.75);border-radius:6px;padding:1px 6px;margin-left:4px;white-space:nowrap}
.slot{font-weight:600;background:var(--slot);color:var(--slotInk);border-radius:5px;padding:0 4px;box-shadow:inset 0 -1.5px 0 rgba(90,67,0,.25)}
.slot.empty{background:transparent;box-shadow:inset 0 0 0 1px rgba(90,67,0,.35)}
.slot.idea{background:var(--idea);color:var(--ideaInk);box-shadow:inset 0 -1.5px 0 rgba(31,63,107,.25)}
/* Test me: the bold lines become a first word + gaps; tap one to check */
.gap{display:inline-block;height:.9em;border-bottom:2px solid var(--ink);vertical-align:-2px;opacity:.55}
.ph.hidden .full{display:none}
.ph:not(.hidden) .masked{display:none}
.support{margin:10px 0 0;border-top:1px dashed rgba(20,17,14,.2);padding-top:8px}
.support summary{cursor:pointer;list-style:none;font-size:.92rem;color:var(--quiet)}
.support summary::-webkit-details-marker{display:none}
.support summary b{color:var(--ink)}
.support summary u{color:var(--ink);text-underline-offset:3px}
.moves{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:4px 20px;margin-top:6px}
.moves h3{margin:6px 0 0;font:600 12px/1.2 'Geist',sans-serif;color:var(--quiet)}

/* the model */
.model{margin:18px 0 0;background:#FAF8F5;border:1.5px solid var(--rule);border-radius:14px;padding:12px 16px}
.model summary{cursor:pointer;font-weight:700}
.model summary span{font-weight:400;color:var(--quiet)}
.model .q{font-size:.9rem;color:var(--quiet);margin:10px 0}
.model p{margin:0 0 10px;line-height:1.6;font-size:.98rem}
.model mark{background:var(--slot);color:var(--ink);font-weight:700;border-radius:4px;padding:0 3px}
.tip{margin:14px 0 0;font-size:.92rem;color:var(--quiet)}
.tip b{color:var(--ink)}

.more{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin:22px 0 0;padding-top:14px;border-top:1px solid var(--rule)}
.more span{font:600 10.5px/1 'Geist Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-right:4px}
.more a{font-size:.9rem;color:var(--ink);text-decoration:none;padding:8px 12px;border-radius:999px;background:rgba(118,118,128,.12)}
.state{padding:40px 0;text-align:center;color:var(--faint)}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;
  background:var(--ink);color:#FAF8F5;font-size:.9rem;padding:10px 16px;border-radius:999px;pointer-events:none;transition:transform .25s cubic-bezier(.2,1.4,.4,1),opacity .2s}
.toast.show{transform:translate(-50%,0);opacity:1}

@media (max-width:600px){
  .band{margin-left:16px;padding:12px 12px 12px 34px}
  .medal{left:-16px;width:42px;height:42px} .medal i{width:31px;height:31px;font-size:16px}
  .ph{font-size:.95rem}
  .budget span{font-size:10px;padding:6px 4px}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
@media print{
  @page{size:A4 landscape;margin:8mm}
  html,body{background:#fff}
  .top,.tasks,.chips,.when,.legend,.more,.toast,.model,.today .k button,.support summary u,.ph.go::after{display:none!important}
  .wrap{padding:0;max-width:none}
  h1{font-size:20pt;margin:0} .line,.reader{font-size:8.5pt;margin:0}
  .today{padding:4px 8px;margin:4px 0;border-width:1px} .today p,.today ol{font-size:8.5pt;margin:2px 0}
  .budget{margin:4px 0;font-size:7.5pt}
  .bands{grid-template-columns:1fr 1fr;gap:6px}
  .band{break-inside:avoid;padding:6px 8px 6px 30px;margin-left:12px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .medal{left:-12px;top:6px;width:30px;height:30px} .medal i{width:22px;height:22px;font-size:12px}
  .medal,.medal i,.slot,.budget span{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .band h2{font-size:10pt} .band .lbl{font-size:7pt;margin:0 0 2px} .step h3{font-size:7.5pt;margin:2px 0 0}
  .ph{font-size:8.5pt;padding:1px 0 1px 12px;margin:0;line-height:1.3} .ph::before{left:2px;top:.6em;width:4px;height:4px}
  .ph.hidden .full{display:inline!important} .ph .masked{display:none!important}
  .support{margin-top:3px;padding-top:3px} .support summary{font-size:7.5pt}
  .support .moves{display:grid!important;gap:0 10px;margin-top:2px} .moves h3{font-size:7pt}
  .tip{font-size:8pt;margin:4px 0 0}
}
</style>
</head>
<body>
<div class="top">
  <a class="back" id="back" href="/index.html?openModal=writing" target="_top">← Writing</a>
  <span class="sp"></span>
  <button class="tbtn" id="test" type="button" aria-pressed="false">Test me</button>
  <button class="tbtn" id="copyall" type="button">Copy all</button>
  <button class="tbtn" id="print" type="button">Print</button>
</div>
<main class="wrap">
  <nav class="tasks" id="tasks" aria-label="Task"></nav>
  <div id="page"><div class="state">Loading…</div></div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k){try{return localStorage.getItem('intuity.'+k)}catch(e){return null}},set(k,v){try{localStorage.setItem('intuity.'+k,v)}catch(e){}}};
const P=new URLSearchParams(location.search);
/* old links said task=essays|reviews|reports|articles|emails; Narrative now lives here as story */
const ALIAS={narrative:'story',stories:'story'};
const ORDER=['essays','emails','articles','reviews','reports','story'];
const MORE={
  essays:[['Questions','/skills/writing/essays/essay-question.html'],['Plan','/skills/writing/essays/essay-plan.html'],['Model answers','/skills/writing/model-generator.html?type=essays'],['Samples','/skills/writing/essays/essay-sample.html'],['Games','/skills/writing/games/essay-games-staged.html']],
  emails:[['Questions','/skills/writing/emails/email-question.html'],['Plan','/skills/writing/emails/email-plan.html'],['Model answers','/skills/writing/model-generator.html?type=emails'],['Samples','/skills/writing/emails/email-sample.html']],
  articles:[['Questions','/skills/writing/articles/article-question.html'],['Build a model','/skills/writing/articles/article-model.html'],['Model answers','/skills/writing/model-generator.html?type=articles'],['Samples','/skills/writing/articles/article-sample.html']],
  reviews:[['Questions','/skills/writing/reviews/review-question-selector.html'],['Plan','/skills/writing/reviews/review-plan.html'],['Model answers','/skills/writing/model-generator.html?type=reviews'],['Samples','/skills/writing/reviews/review-sample.html']],
  reports:[['Questions','/skills/writing/reports/report-question-selector.html'],['Plan','/skills/writing/reports/report-plan.html'],['Model answers','/skills/writing/model-generator.html?type=reports'],['Samples','/skills/writing/reports/report-sample.html']],
  story:[['Questions','/skills/writing/narrative/narrative-question.html'],['Story cards','/skills/writing/narrative/narrative-cards.html'],['Samples','/skills/writing/narrative/narrative-sample.html']]
};
const COL={start:'var(--start)',body:'var(--body)',end:'var(--end)'};

let D=null, KEY='essays', T=null, V=null, route=null, picked=false, testing=false;
const Q={list:[],i:0,cur:null};

/* ── slots ───────────────────────────────────────────────────────────── */
/* a note that is already a sentence becomes a thing the frame can take */
function asThing(n){
  n=String(n||'').trim().replace(/\.$/,'');
  if(/^(they|it|it's|some people|people|there|you|we)\b/i.test(n)) return 'the idea that '+n.charAt(0).toLowerCase()+n.slice(1);
  return n;
}
function slotValues(){
  const q=Q.cur, k=T.questions&&T.questions.kind, v={};
  if(!q) return v;
  if(k==='essay'){
    v.topic={t:q.topicPhrase||q.topicShort||''};
    const wp=(q.writingPoints||[]).filter(p=>!/own idea/i.test(p));
    if(wp[0]) v['note 1']={t:asThing(wp[0])};
    if(wp[1]) v['note 2']={t:asThing(wp[1])};
    if(q.suggestedOwnIdeas&&q.suggestedOwnIdeas[0]) v['your idea']={t:q.suggestedOwnIdeas[0],idea:true};
  }
  if(k==='story'){
    v.opening={t:q.opening};
    if(q.mustInclude){ v['must 1']={t:q.mustInclude[0]}; v['must 2']={t:q.mustInclude[1]}; }
  }
  return v;
}
function fill(text, vals, html){
  return text.split(/(\[[^\]]+\])/).map(part=>{
    const m=part.match(/^\[([^\]]+)\]$/);
    if(!m) return html?esc(part):part;
    const val=vals[m[1].toLowerCase()];
    if(!html) return val?val.t:part;
    if(val) return `<span class="slot${val.idea?' idea':''}"${val.idea?' title="An example — use your own idea"':''}>${esc(val.t)}</span>`;
    return `<span class="slot empty">${esc(part)}</span>`;
  }).join('');
}
/* Test me: keep the first word and the slots, gap the rest */
function masked(text, vals){
  let first=true;
  return text.split(/(\[[^\]]+\])/).map(part=>{
    if(/^\[[^\]]+\]$/.test(part)) return fill(part,vals,true);
    return part.split(/(\s+)/).map(w=>{
      if(!w.trim()) return w;
      if(first){ first=false; return esc(w); }
      const tail=w.match(/[.,!?:;—]+$/); const core=tail?w.slice(0,-tail[0].length):w;
      if(!core) return esc(w);
      return `<span class="gap" style="width:${Math.max(1.2,core.length*.55)}em"></span>${tail?esc(tail[0]):''}`;
    }).join('');
  }).join('');
}

/* ── drawing ─────────────────────────────────────────────────────────── */
function bandsNow(){ return (V||T).bands; }
function stepsFor(b){ return b.steps.filter(s=>!s.route||s.route===route); }
function kindOf(k,n){ return k===0?'start':(k===n-1?'end':'body'); }

function phrase(it, vals){
  const tail=it.h?` <span class="tail">${esc(it.h)}</span>`:'';
  const hide=testing&&it.go;
  return `<li><button type="button" class="ph${it.go?' go':''}${hide?' hidden':''}" data-copy="${esc(fill(it.t,vals,false)+(it.h?' …':''))}">`+
    `<span class="full">${fill(it.t,vals,true)}</span>${it.go?`<span class="masked">${masked(it.t,vals)}</span>`:''}${tail}</button></li>`;
}

function draw(){
  const allowed=ORDER.filter(k=>D.tasks[k]);
  $('tasks').innerHTML=allowed.map(k=>`<a href="?task=${k}"${k===KEY?' aria-current="page"':''} data-task="${k}">${esc(D.tasks[k].name)}</a>`).join('');
  $('tasks').querySelectorAll('[data-task]').forEach(a=>a.onclick=e=>{e.preventDefault(); go(a.dataset.task);});
  document.title='INTUITY — '+T.name+' sheet';


  const vals=slotValues(), bands=bandsNow(), n=bands.length;
  const reader=(V&&V.reader)||T.reader||'';
  const q=Q.cur, pts=q&&(q.writingPoints||q.keyPoints||q.mustInclude||(q.questionData&&q.questionData.keyPoints))||[];
  const qText=q&&q.opening?`“${q.opening}” ${q.prompt||''}`:q?(q.mainQuestion||q.question||(q.questionData&&q.questionData.question)||q.prompt||''):'';
  const total=bands.reduce((s,b)=>s+b.words,0);

  const EXAMNOTE={standard:'In B2 First (not the Schools version), Part 2.',schools:'In B2 First for Schools, Part 2.'};
  let h=`<h1>${esc(T.name)}</h1><p class="line">${esc(T.line)}</p>`+
    (T.exam!=='both'?`<p class="examnote">${EXAMNOTE[T.exam]}</p>`:'')+
    (T.brief?`<p class="reader">${esc(T.brief)}</p>`:'')+
    `<p class="reader"><b>Who reads it:</b> ${esc(reader)}</p>`;
  if(T.variants) h+=`<div class="chips" role="group" aria-label="Type">${T.variants.map(v=>`<button class="chip" type="button" data-v="${v.id}" aria-pressed="${v===V}">${esc(v.name)}</button>`).join('')}</div>`;
  if(T.routes){
    const r=T.routes.find(x=>x.id===route);
    h+=`<div class="chips" role="group" aria-label="Route">${T.routes.map(x=>`<button class="chip" type="button" data-r="${x.id}" aria-pressed="${x.id===route}">${esc(x.name)}</button>`).join('')}</div><p class="when">${esc(r.when)}</p>`;
  }
  h+=`<div class="legend"><span><b>Bold</b> = learn this one · tap any line to copy it</span>`+
     `<details><summary>How to read the sheet</summary><p style="margin:6px 0 2px"><span class="slot">yellow</span> = words from today's question. The grey tail says what must come next:</p><table>${D.hints.map(x=>`<tr><td><span class="tail">${esc(x[0])}</span></td><td>${esc(x[1])}</td><td><i>${esc(x[2])}</i></td></tr>`).join('')}</table></details></div>`;
  if(q){
    h+=`<section class="today" aria-label="Today's question"><div class="k">Today's question<span class="sp"></span><button type="button" id="another">Another question</button></div>`+
       `<p>${esc(qText)}</p>${pts.length?`<ol>${pts.map(p=>`<li>${esc(p)}</li>`).join('')}</ol>`:''}</section>`;
  }
  h+=`<div class="budget" aria-label="Word budget">${bands.map((b,k)=>`<span style="--w:${b.words};--c:${COL[kindOf(k,n)]}" title="${esc(b.job)}">${k+1} · ${b.words}</span>`).join('')}<em>≈ ${total} words</em></div>`;
  h+=`<div class="bands">${bands.map((b,k)=>{
    const cov=b.covers&&pts.length?`<span class="covers">covers point ${b.covers.map(c=>c+1).filter(c=>c<=pts.length).join(' + ')}</span>`:'';
    const steps=stepsFor(b);
    return `<section class="band" aria-label="${esc(b.job)}"><div class="medal" aria-hidden="true"><i style="--c:${COL[kindOf(k,n)]}">${k+1}</i></div>`+
      `<h2>${fill(b.job,vals,true)}</h2><p class="lbl">${esc(b.label)} · ~${b.words} words${cov}</p>`+
      `<div class="cols">${steps.map(s=>`<div class="step"><h3>${esc(s.label)}</h3><ul>${s.items.map(it=>phrase(it,vals)).join('')}</ul></div>`).join('')}</div>`+
      (b.support?supportHTML(vals):'')+`</section>`;
  }).join('')}</div>`;
  const M=(V&&V.model)||T.model;
  if(M&&(!M.route||M.route===route)){
    const words=M.paras.join(' ').replace(/[{}]/g,'').split(/\s+/).filter(Boolean).length;
    h+=`<details class="model"><summary>See a full answer <span>· ${words} words · the frames are highlighted</span></summary><p class="q">${esc(M.question)}</p>`+
       M.paras.map(p=>`<p>${esc(p).replace(/\{([^}]+)\}/g,'<mark>$1</mark>')}</p>`).join('')+`</details>`;
  }
  if(T.tip) h+=`<p class="tip"><b>Tip:</b> ${fill(T.tip,{},true)}</p>`;
  h+=`<nav class="more" aria-label="More for this task"><span>Go deeper</span>${(MORE[KEY]||[]).map(([l,u])=>`<a href="${u}">${esc(l)}</a>`).join('')}<a href="/skills/writing/the-question.html">Challenge</a></nav>`;
  $('page').innerHTML=h;

  $('page').querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{ V=T.variants.find(v=>v.id===b.dataset.v); store.set('sheet.'+KEY,V.id); loadQuestions(); });
  $('page').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{ route=b.dataset.r; picked=true; store.set('route.'+KEY,route); draw(); });
  if($('another')) $('another').onclick=()=>{ if(!Q.list.length) return; Q.i=(Q.i+1)%Q.list.length; Q.cur=Q.list[Q.i]; autoRoute(); draw(); };
  $('page').querySelectorAll('.ph').forEach(b=>b.onclick=()=>{
    if(b.classList.contains('hidden')){ b.classList.remove('hidden'); return; }
    copy(b.dataset.copy,'Copied');
  });
}
function supportHTML(vals){
  return `<details class="support"><summary><b>Back it up:</b> ${D.moves.map(m=>m.move.toLowerCase()).join(' · ')} <u>show phrases</u></summary>`+
    `<div class="moves">${D.moves.map(m=>`<div class="step"><h3>${esc(m.move)}</h3><ul>${m.items.map(it=>phrase(it,vals)).join('')}</ul></div>`).join('')}</div></details>`;
}

/* ── actions ─────────────────────────────────────────────────────────── */
let tt=null;
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),1400); }
function copy(text,msg){
  const done=()=>toast(msg);
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done,()=>fallback(text,done));
  else fallback(text,done);
}
function fallback(text,done){
  const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); done(); }catch(e){ toast('Select the text to copy it'); } ta.remove();
}
/* Copy all: the bold line of each band, in order — the skeleton to learn */
$('copyall').onclick=()=>{
  if(!T) return;
  const vals=slotValues();
  const lines=bandsNow().map((b,k)=>`${k+1}. ${b.job.replace(/\[[^\]]+\]/g,m=>fill(m,vals,false))}\n`+stepsFor(b).map(s=>{ const g=s.items.find(i=>i.go)||s.items[0]; return '   '+fill(g.t,vals,false)+(g.h?' '+g.h:''); }).join('\n'));
  copy(`${T.name} — the skeleton\n\n`+lines.join('\n\n'),'Skeleton copied');
};
$('test').onclick=()=>{ testing=!testing; $('test').setAttribute('aria-pressed',testing); $('test').textContent=testing?'Show all':'Test me'; if(T) draw(); if(testing) toast('Say each bold line, then tap it to check'); };
$('print').onclick=()=>{ document.querySelectorAll('details.support').forEach(d=>d.open=true); window.print(); };

function autoRoute(){
  if(!T.routes||picked) return;
  const saved=store.get('route.'+KEY);
  const t=Q.cur&&Q.cur.essayType;
  route=P.get('route')||(t?(t==='for-against'?'both':'say'):null)||saved||T.routes[0].id;
  if(!T.routes.some(r=>r.id===route)) route=T.routes[0].id;
}
function loadQuestions(){
  const src=(V&&V.questions)||T.questions;
  Q.list=[]; Q.cur=null;
  if(!src){ autoRoute(); draw(); return; }
  fetch(src.src,{cache:'no-store'}).then(r=>r.json()).then(d=>{
    let list=d.questions||d.emails||[];
    if(src.skip) list=list.filter(x=>!src.skip.includes(x.id));
    Q.list=list;
    const day=Math.floor(Date.now()/864e5);
    Q.i=list.length?day%list.length:0; Q.cur=list[Q.i]||null;
  }).catch(()=>{}).then(()=>{ autoRoute(); draw(); });
}
function go(k){
  KEY=D.tasks[k]?k:'essays'; T=D.tasks[KEY]; V=null; picked=false;
  if(T.variants){ const s=P.get('v')||store.get('sheet.'+KEY); V=T.variants.find(v=>v.id===s)||T.variants[0]; }
  history.replaceState(null,'','?task='+KEY);
  loadQuestions();
}

fetch('/data/writing/revision-sheet.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{
  D=d; let k=P.get('task'); k=ALIAS[k]||k; go(D.tasks[k]?k:'essays');
}).catch(()=>{ $('page').innerHTML='<div class="state">The sheet didn’t load — reload to try again.</div>'; });
})();
</script>
</body>
