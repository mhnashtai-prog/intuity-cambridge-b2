<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>INTUITY — Writing Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..900&family=Geist+Mono:wght@500;600&family=Anton&display=swap" rel="stylesheet">
<style>
/* ═══ THE PORTFOLIO, ON SCREEN (Oct 2026) ═════════════════════════════════
   Michael's FCE Writing Portfolio, slide for slide — twelve years the
   students' favourite. Three rules from 43 years of teaching decide what
   this page is allowed to do:
     1. no incremental stages — nothing to open, unfold or switch on
     2. no clutter — the slide and nothing else
     3. immediate — the phrases are the first thing on the screen
   So: one slide per screen, every phrase visible. A | B on the
   introduction, P on the arguments, P on the conclusion. Structure and
   Model samples are the two slides of each type, one tap apart.
   Tap a line to copy it (a silent extra: nothing on screen but a toast).
   Print gives the slide on one A4 side.
   Content: /data/writing/portfolio.json. */
:root{--ink:#1C1C1C;--title:#44546A;--band:#F1F1F7;--quiet:#555;--rule:#4472C4;
  --a-ring:#8EA9DB;--a-tab:#4472C4;--a-ink:#2F4C8A;--p1-ring:#F4A46A;--p1-tab:#E2702E;--p2-ring:#A6A6A6;--p2-tab:#6E6491}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font-family:'Geist',Calibri,'Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.ihead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;max-width:1340px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + .55rem) 16px .5rem;position:relative}
.ihead::after{content:'';position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(720px,calc(100% - 2rem));height:1px;background:rgba(0,0,0,.08)}
.wordmark{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.app-title{font-family:'Geist',system-ui,sans-serif;font-size:1.09rem;font-weight:900;letter-spacing:.2em;color:#232C31}
.app-subtitle{font-size:.6875rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#5C5852;margin-top:.1rem}
.lvl{justify-self:end;font-family:'Geist Mono',ui-monospace,monospace;font-size:.6875rem;letter-spacing:.1em;text-transform:uppercase;color:#756B6E;background:#E8E1D6;border-radius:6px;padding:.3rem .65rem}
.lvl b{color:#4A433D;font-weight:600}
.foot-print{border:none;background:none;font:600 13px/1 'Geist',sans-serif;color:#44546A;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0;margin-left:14px}
.back{justify-self:start;font:700 11px/1 'Geist',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#756B6E;text-decoration:none;padding:10px 4px;white-space:nowrap}
.sp{flex:1}
.seg{display:inline-flex;border-radius:999px;background:#EDEDF2;padding:3px}
.seg button{border:none;background:none;padding:8px 14px;border-radius:999px;font-weight:600;font-size:13px;cursor:pointer;color:#555}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.print{border:none;background:#EDEDF2;border-radius:999px;padding:9px 14px;font-weight:600;font-size:13px;cursor:pointer}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;max-width:1340px;margin:6px auto 0;padding:0 16px}
@media (min-width:900px){ .tabs{justify-content:center} }
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;text-decoration:none;font-weight:600;font-size:14px;color:#666;padding:7px 12px;border-bottom:3px solid transparent}
.tabs a[aria-current="page"]{color:var(--title);border-bottom-color:var(--rule)}
main{max-width:1340px;margin:0 auto;padding:4px 16px 28px}
h1{text-align:center;margin:4px 0 8px;font-size:clamp(1.35rem,3vw,1.9rem);font-weight:400;color:var(--title);letter-spacing:-.005em}
h1 b{font-weight:700}
.draft{text-align:center;margin:-6px 0 10px;font-size:.85rem;color:#8A5A00}

/* the slide: three bands */
.band{position:relative;display:grid;grid-template-columns:104px 26px 1fr;align-items:stretch;background:var(--band);margin:0 0 10px;border-radius:2px;min-height:120px}
.band.hasB{grid-template-columns:104px 26px 1fr 96px}
.med{position:relative;align-self:start;margin:10px 0 0 0;width:94px;height:94px}
.med::before{content:'';position:absolute;left:0;top:8px;width:24px;height:96px;background:var(--tab);clip-path:polygon(0 0,100% 0,100% 100%,50% 86%,0 100%);opacity:.95}
.med i{position:absolute;left:10px;top:0;width:82px;height:82px;border-radius:50%;background:var(--ring);display:grid;place-items:center;font-style:normal}
.med i::after{content:'';position:absolute;inset:12px;border-radius:50%;background:#fff}
.med b{position:relative;z-index:1;font-size:36px;font-weight:700;color:var(--a-ink)}
.med.right{justify-self:end;margin-right:6px}
.med.right::before{left:auto;right:0}
.med.right i{left:auto;right:10px}
.k0{--ring:var(--a-ring);--tab:var(--a-tab)} .k1{--ring:var(--p1-ring);--tab:var(--p1-tab)} .k2{--ring:var(--p2-ring);--tab:var(--p2-tab)}
.vlab{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:700;font-size:16px;text-align:center;align-self:center;padding:10px 0}
.cols{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:2px 30px;padding:10px 16px 10px 4px;align-content:center}
.col ul{list-style:none;margin:0;padding:0}
.li{display:block;width:100%;text-align:left;background:none;border:none;cursor:pointer;border-radius:6px;padding:1px 8px 1px 20px;margin:0 0 0 -8px;
  font-size:14.5px;line-height:1.4;position:relative}
.li::before{content:'•';position:absolute;left:7px;top:1px}
.li.sub{padding-left:42px}
.li.sub::before{left:28px}
.li:hover{background:rgba(255,255,255,.8)}
.li:active{transform:scale(.995)}
.li.plain::before{content:none}
.li.plain{padding-left:8px;font-weight:700;font-size:16px;margin-top:2px}
.li.note{font-style:italic;font-weight:700;cursor:default;padding-left:8px}
.li.note::before{content:none}
.li .aside{color:#666;margin-left:10px;font-size:.9em;white-space:nowrap}
.col h3{margin:0 0 4px;font-size:17px;font-weight:700}

/* the pills: a door at the point a student asks "and now what?" — one per
   band at most, outline only, never above or between the phrases */
.pill{display:inline-flex;align-items:center;gap:6px;border:1.2px solid #B9BCC8;background:#fff;color:#44546A;border-radius:999px;
  padding:5px 12px;font-size:13px;font-weight:600;text-decoration:none;cursor:pointer;white-space:nowrap;line-height:1.2}
.pill:hover{border-color:#44546A}
/* the two actions a student takes from the slide: flat, black, iOS */
.go{display:inline-flex;align-items:center;border:none;background:#1C1C1E;color:#fff;border-radius:999px;padding:9px 17px;font-size:14px;font-weight:600;
  text-decoration:none;letter-spacing:.005em;white-space:nowrap;transition:transform .12s cubic-bezier(.2,1.4,.4,1),background .15s}
.go:hover{background:#000}
.go:active{transform:scale(.96)}
.gos{display:inline-flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.go.mini{padding:4px 10px;font-size:12px;font-weight:600;line-height:1.2}
/* quiet: each band's pills wear that band's own colour, pale */
.band .go.mini{background:var(--pt);color:var(--pi)}
.band .go.mini:hover{background:var(--ph)}
.band.k0{--pt:#E3EBF8;--ph:#D3E0F5;--pi:#2F4C8A}
.band.k1{--pt:#FBE6D6;--ph:#F8D8C0;--pi:#8A3C0E}
.band.k2{--pt:#ECE8F4;--ph:#DFD9EE;--pi:#4B4170}
.stairs-link{font-size:13px;font-weight:600;color:#44546A;text-decoration:underline;text-underline-offset:3px}
.pill[aria-pressed="true"]{background:#44546A;border-color:#44546A;color:#fff}
.pdock{display:flex;justify-content:flex-end;margin:6px 0 2px}
.band .pabs{position:absolute;right:14px;bottom:10px}
.hd{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin:4px 0 8px}
.hd h1{margin:0}
.qline{text-align:center;margin:-2px 0 8px;font-size:14px;color:#44546A}
.qline q{font-style:italic}
.qline button{border:none;background:none;color:#4472C4;font-weight:600;cursor:pointer;padding:2px 6px;font-size:13px}
.slot{background:#FFF1C9;border-radius:4px;padding:0 3px;font-weight:600;color:#4A3800}
.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:2px}
/* THE PARAGRAPH RECIPE (Oct 2026, from Majid's first "Essay paragraph"
   slide): the order a body paragraph is built in, one line across the top
   of the Arguments band on every essay slide. Live for testing with
   students. Colours from the original slide, darkened to pass 4.5:1. */
.recipe{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin:0 0 8px;font-size:13.5px;font-weight:600;color:#2B2B2B}
.recipe .lead{font-weight:500;color:#555;margin-right:2px}
.recipe .st{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.recipe .st i{font-style:normal;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--sc);color:#fff;font-size:11.5px;font-weight:700}
.recipe .ar{color:#9A9AA2;font-weight:400}
/* "Paragraph structure": one label at the top of the Arguments band; it
   opens Majid's six-step "Essay paragraph" slide as a card. */
.pslab{grid-column:1/-1;justify-self:start;display:inline-flex;align-items:center;gap:7px;border:none;cursor:pointer;margin:0 0 8px;
  background:#F3E7DA;color:#7A4520;border-radius:999px;padding:5px 12px 5px 6px;font:600 13px/1.2 'Geist',sans-serif}
.pslab:hover{background:#EBDAC7}
.pslab .dots{display:inline-flex;gap:2px}
.pslab .dots i{width:7px;height:7px;border-radius:2px;background:var(--sc)}
.scrim2{position:fixed;inset:0;z-index:50;background:rgba(20,17,14,.45);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim2.open{opacity:1;pointer-events:auto}
/* the card: ONE landscape slide, INTUITY paper and tones */
.pcard{position:fixed;z-index:51;left:50%;top:50%;width:min(1180px,94vw);background:#FBF8F3;color:#232C31;border-radius:18px;
  box-shadow:0 24px 60px rgba(0,0,0,.28);padding:22px 24px 22px;transform:translate(-50%,-48%) scale(.97);opacity:0;pointer-events:none;
  transition:transform .28s cubic-bezier(.2,1.4,.4,1),opacity .2s}
.pcard.open{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
.pcard{max-height:94vh;overflow:auto}
.pcard .kick{display:flex;align-items:center;gap:9px;font:600 11px/1 'Geist',sans-serif;letter-spacing:.22em;text-transform:uppercase;color:rgba(20,17,14,.55)}
.pcard .kick i{display:block;width:26px;height:10px;background:#DD8E58}
.pcard h2{margin:8px 0 18px;font:400 clamp(26px,4vw,40px)/.95 'Anton',Impact,sans-serif;text-transform:uppercase;letter-spacing:.01em}
.pcard .x{position:absolute;top:12px;right:14px;border:none;background:none;font-size:20px;color:rgba(20,17,14,.45);cursor:pointer;padding:6px 10px}
.six{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0 3px}
.chev{background:var(--sc);color:var(--si);height:64px;display:flex;align-items:center;gap:10px;padding:0 18px 0 26px;
  clip-path:polygon(0 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,0 100%,16px 50%)}
.step6:first-child .chev{clip-path:polygon(0 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,0 100%);padding-left:16px}
.chev b{font:400 28px/1 'Anton',Impact,sans-serif}
.chev span{font-size:12.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;line-height:1.15}
.step6 ol{list-style:none;margin:12px 0 0;padding:0 8px 0 10px}
.step6 li button{display:flex;gap:6px;width:100%;text-align:left;border:none;background:none;cursor:pointer;border-radius:6px;padding:3px 4px;margin-left:-4px;
  font-size:13.5px;line-height:1.3;color:#232C31}
.step6 li button:hover{background:rgba(20,17,14,.05)}
.step6 li:first-child button{font-weight:700}
.step6 li small{flex:none;min-width:2.4em;font:600 10px/1.7 'Geist Mono',monospace;color:#9A5A2C;text-transform:uppercase}
/* the examples: five pills in a footer; one opens a body paragraph over
   the columns, the same pill (or ✕) closes it */
.sixwrap{position:relative;--ch:64px}
.exfoot{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:14px 0 0;padding-top:12px;border-top:1px solid rgba(20,17,14,.1)}
.exfoot button{border:none;cursor:pointer;border-radius:999px;padding:5px 12px;font:600 12.5px/1.2 'Geist',sans-serif;background:#EFE7DC;color:#5A3A1E}
.exfoot button:hover{background:#E6DACB}
.exfoot button[aria-pressed="true"]{background:#484641;color:#fff}
.expanel{position:absolute;left:0;right:0;top:calc(var(--ch) + 8px);bottom:0;background:#FBF8F3;border:1px solid rgba(20,17,14,.12);border-radius:12px;
  padding:14px 44px 14px 18px;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.expanel[hidden]{display:none}
.expanel .q{font:600 10.5px/1.4 'Geist',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#9A5A2C;margin:0 0 6px}
.expanel p.t{margin:0;font-size:16px;line-height:1.6;color:#232C31}
.expanel p.t b{background:#F3E7DA;border-radius:3px;padding:0 2px}
.expanel .ex{position:absolute;top:8px;right:8px;border:none;background:none;font-size:17px;color:rgba(20,17,14,.45);cursor:pointer;padding:4px 8px}
/* a phone held upright: the card turns sideways — always landscape */
@media (max-width:760px) and (orientation:portrait){
  .pcard{width:100vh;width:100dvh;height:100vw;max-height:none;border-radius:0;padding:14px 16px;
    transform:translate(-50%,-50%) rotate(90deg) scale(.97)}
  .pcard.open{transform:translate(-50%,-50%) rotate(90deg)}
}
@media (max-height:520px) and (orientation:landscape){
  .pcard{width:100vw;height:100vh;height:100dvh;border-radius:0;padding:14px 16px}
}
@media (max-width:760px) and (orientation:portrait), (max-height:520px) and (orientation:landscape){
  .pcard h2{font-size:19px;margin:3px 0 7px} .pcard .kick{font-size:9px}
  .sixwrap{--ch:44px} .exfoot{margin-top:6px;padding-top:6px;gap:4px} .exfoot button{font-size:10.5px;padding:3px 9px}
  .expanel{padding:10px 36px 10px 12px} .expanel p.t{font-size:12.5px;line-height:1.5}
  .chev{height:44px;padding:0 12px 0 20px;gap:6px}
  .step6:first-child .chev{padding-left:10px}
  .chev b{font-size:20px} .chev span{font-size:10px;letter-spacing:.04em}
  .step6 ol{margin-top:8px;padding:0 4px 0 6px}
  .step6 li button{font-size:11px;line-height:1.22;padding:1px 2px}
  .step6 li small{font-size:8.5px;min-width:2.2em}
  .step6 li small{font-size:9px}
}
/* model samples: two columns, a blue rule between */
.models{display:grid;grid-template-columns:1fr 1fr;gap:0 40px;position:relative}
.models::before{content:'';position:absolute;left:50%;top:0;bottom:0;border-left:1.5px solid var(--rule)}
.models.one{grid-template-columns:1fr}.models.one::before{content:none}
.model{min-width:0}
.plan{font-size:13.5px;line-height:1.45;margin:0 0 22px}
.plan:empty{display:none}
.plan p{margin:0}
.plan .h{font-weight:700}
.plan .q{font-weight:700;font-size:15px;margin-bottom:4px}
.mtext p{margin:0 0 14px;font-size:15px;line-height:1.55}
.mtext p.h{font-weight:700;margin:0 0 2px}
.mtext p.tight{margin:0}
.empty{color:#777;text-align:center;padding:40px 0}
.sign{text-align:right;font-size:18px;color:var(--title);margin:0 0 0 auto}
.sign b{font-weight:700}.sign span{font-size:15px}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;background:#1C1C1C;color:#fff;
  font-size:14px;padding:9px 16px;border-radius:999px;pointer-events:none;transition:transform .25s cubic-bezier(.2,1.4,.4,1),opacity .2s}
.toast.show{transform:translate(-50%,0);opacity:1}

/* a phone: same slide, stacked */
@media (max-width:760px){
  .band,.band.hasB{grid-template-columns:1fr;min-height:0;padding-top:8px}
  .med{width:56px;height:56px;margin:0 0 0 10px;position:absolute;top:8px;left:0}
  .med::before{width:16px;height:58px;top:6px}
  .med i{width:50px;height:50px;left:6px}
  .med i::after{inset:8px}
  .med b{font-size:22px}
  .med.right{display:none}
  .vlab{writing-mode:horizontal-tb;transform:none;text-align:left;padding:16px 12px 0 76px;font-size:16px;min-height:66px}
  .cols{grid-template-columns:1fr;padding:6px 12px 14px 12px;gap:0}
  .col + .col{border-top:1px dashed rgba(0,0,0,.15);margin-top:8px;padding-top:8px}
  .col .bmark{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--a-tab);color:#fff;font-weight:700;font-size:13px;margin:0 0 4px}
  .models{grid-template-columns:1fr}.models::before{content:none}
  .model + .model{border-top:1.5px solid var(--rule);padding-top:18px;margin-top:6px}
}
@media (min-width:761px){ .col .bmark{display:none} }
@media (max-width:760px){ .band .pabs{position:static;display:flex;justify-content:flex-end;padding:0 12px 12px} .band .pabs .pill{margin-left:auto} }
/* a laptop screen: keep the whole slide in view */
@media (min-width:761px) and (max-height:820px){ .pslab{margin-bottom:3px;padding:3px 10px 3px 6px} .recipe{margin-bottom:4px;font-size:13px} .recipe .st i{width:18px;height:18px} .li{font-size:13.5px;line-height:1.3} .band{min-height:0} .med{width:84px;height:84px} .med i{width:74px;height:74px} .med b{font-size:32px} .med::before{height:86px} h1{font-size:1.5rem;margin:2px 0 6px} }
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
@media print{
  @page{size:A4 landscape;margin:7mm}
  .pslab,.scrim2,.pcard,.ihead,.foot-print,.tabs,.toast,.pill,.pdock,.qline button,.gos,.stairs-link{display:none!important}
  main{padding:0;max-width:none}
  h1{margin:0 0 6px;font-size:18pt}
  .band{min-height:0;margin-bottom:6px;grid-template-columns:96px 24px 1fr;-webkit-print-color-adjust:exact;print-color-adjust:exact;break-inside:avoid}
  .band.hasB{grid-template-columns:96px 24px 1fr 88px}
  .med{width:86px;height:86px;margin-top:8px}
  .med::before{width:22px;height:88px}
  .med i{width:76px;height:76px;left:9px}
  .med i::after{inset:11px}
  .med b{font-size:32px}
  .med.right i{right:9px;left:auto}
  .med,.med i,.med::before{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .vlab{font-size:12pt}
  .cols{padding:8px 10px 8px 4px;gap:0 22px}
  .li{font-size:9.5pt;line-height:1.38;padding:1px 4px 1px 14px}
  .li::before{left:3px;top:1px}
  .li.sub{padding-left:30px}.li.sub::before{left:18px}
  .col h3{font-size:11pt;margin:0 0 2px}
  .li.plain{font-size:11pt}
  .recipe{font-size:8.5pt;margin-bottom:3px} .recipe .st i{width:14px;height:14px;font-size:7.5pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .plan{font-size:8.5pt;margin-bottom:8px}.plan .q{font-size:9.5pt}
  .mtext p{font-size:9.5pt;margin-bottom:6px;line-height:1.4}
  .sign{font-size:12pt}
}
</style>
</head>
<body>
<header class="ihead">
  <a class="back" href="/index.html?openModal=writing" target="_top" onclick="try{sessionStorage.removeItem('intuity.sheetReturn')}catch(e){}">← Writing</a>
  <div class="wordmark"><div class="app-title">INTUITY</div><div class="app-subtitle">Structure</div></div>
  <span class="lvl">Level <b>B2</b></span>
</header>
<nav class="tabs" id="tabs" aria-label="Type"></nav>
<main id="slide"><p class="empty">Loading…</p></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>fillSlots(esc(s),true).replace(/\*\*([\s\S]+?)\*\*/g,'<b>$1</b>').replace(/\*([^*]+)\*/g,'<i>$1</i>');
function fillSlots(s,html){
  if(!TRY) return s;
  return s.replace(/\[([^\]]+)\]/g,(m,k)=>{
    if(!FILLS.includes(k.toLowerCase())) return m;
    let t=TRY.topicPhrase||TRY.topicShort||m;
    if(k.charAt(0)===k.charAt(0).toUpperCase()&&k.charAt(0)!==k.charAt(0).toLowerCase()) t=t.charAt(0).toUpperCase()+t.slice(1);
    return html?`<span class="slot">${esc(t)}</span>`:t;
  });
}
const plain=s=>fillSlots(String(s).replace(/\*\*|\*/g,''),false);
const P=new URLSearchParams(location.search);
const ALIAS={narrative:'story',stories:'story'};
const store={get(k){try{return localStorage.getItem('intuity.portfolio.'+k)}catch(e){return null}},set(k,v){try{localStorage.setItem('intuity.portfolio.'+k,v)}catch(e){}}};
let D=null, TASK='essays', ID=null, VIEW='structure'; /* Model samples retired: the Sample stage does that job */
/* The four paths the page always had, as pills, in the order a student
   writes: choose a question → plan → build a model → compare samples. */
const W='/skills/writing/';
const PATHS={
  essays:  {q:W+'essays/essay-question.html', plan:W+'essays/essay-plan.html', gen:W+'model-generator.html?type=essays', samples:W+'essays/essay-sample.html'},
  emails:  {q:W+'emails/email-question.html', plan:W+'emails/email-plan.html', gen:W+'model-generator.html?type=emails', samples:W+'emails/email-sample.html'},
  articles:{q:W+'articles/article-question.html', plan:W+'articles/article-model.html', gen:W+'model-generator.html?type=articles', samples:W+'articles/article-sample.html'},
  reviews: {q:W+'reviews/review-question-selector.html', plan:W+'reviews/review-plan.html', gen:W+'model-generator.html?type=reviews', samples:W+'reviews/review-sample.html'},
  reports: {q:W+'reports/report-question-selector.html', plan:W+'reports/report-plan.html', gen:W+'model-generator.html?type=reports', samples:W+'reports/report-sample.html'},
  story:   {q:W+'narrative/narrative-question.html', plan:W+'narrative/narrative-cards.html', samples:W+'narrative/narrative-sample.html'}
};
/* "Try it on a question": the [topic] slots take a real question's words,
   in place. Essays only — they are the slides built on [topic]. Each essay
   type draws from the questions of its own kind. */
const QTYPE={fa:'for-against',ps:'problem-solution',ce:'cause-effect',ad:'opinion',op:'opinion',st:'speculation-trends'};
const FILLS=['topic','problem','issue','trend','area/topic'];
let QS=null, TRY=null, TRYI=0;
/* the model generator opens on the type the student was looking at */
const GENSUB={fa:'for-against',ps:'problem-solution',ce:'cause-effect',ad:'agree-disagree',op:'opinion',st:'speculation-trends',ef:'formal',ei:'informal'};
function pill(label,href){ return href?`<a class="pill" href="${href}">${esc(label)}</a>`:''; }

function lineHTML(s){
  if(s.startsWith('## ')) return `<h3>${fmt(s.slice(3))}</h3>`;
  if(s.startsWith('= ')) return `<button type="button" class="li plain" data-copy="${esc(plain(s.slice(2)))}">${fmt(s.slice(2))}</button>`;
  if(s.startsWith('! ')) return `<div class="li note">${fmt(s.slice(2))}</div>`;
  const sub=s.startsWith('> '), t=sub?s.slice(2):s;
  const [main,aside]=t.split(' || ');
  return `<li><button type="button" class="li${sub?' sub':''}" data-copy="${esc(plain(main))}">${fmt(main)}${aside?`<span class="aside">${fmt(aside)}</span>`:''}</button></li>`;
}
function colHTML(lines,i,showB,pl){
  const parts=[]; let open=false;
  lines.forEach(s=>{
    const isLi=!(s.startsWith('## ')||s.startsWith('= ')||s.startsWith('! '));
    if(isLi&&!open){ parts.push('<ul>'); open=true; }
    if(!isLi&&open){ parts.push('</ul>'); open=false; }
    parts.push(lineHTML(s));
  });
  if(open) parts.push('</ul>');
  return `<div class="col">${showB&&i===1?'<span class="bmark" aria-hidden="true">B</span>':''}${parts.join('')}${pl?`<div class="pdock">${pl}</div>`:''}</div>`;
}
function bandPill(k){
  /* Oct 2026: at the end of every band, the two things a student does next */
  const p=PATHS[TASK]||{};
  return `<span class="gos">${p.q?`<a class="go mini" href="${p.q}${TASK==='essays'&&QTYPE[ID]?'?type='+QTYPE[ID]:''}">Try on a question</a>`:''}${p.gen?`<a class="go mini" href="${p.gen}&support=full${GENSUB[ID]?'&subject='+GENSUB[ID]:''}">Generate a model</a>`:''}</span>`;
  const pt=PATHS[TASK]||{};
  if(k===0) return QTYPE[ID]?`<button type="button" class="pill" id="try" aria-pressed="${!!TRY}">Try it on a question</button>`:'';
  if(k===1) return pill(TASK==='articles'?'Build a model':'Plan one',pt.plan);
  if(k===2) return pill('Make your own model',pt.gen);
  return '';
}
const RECIPE=[['List','#3B66B8'],['Opinion','#C2581A'],['Argument','#6B6B6B'],['Reason','#25805A'],['Example','#46639E'],['Contrast / Result','#CC3A4A']];
/* Majid's "Essay paragraph" slide as ONE flow: six steps, two phrases
   each, in order (the first is the one to use). Step 3 is tailored to the
   essay type on screen; the rest hold for every body paragraph. INTUITY
   tones, light to dark, so the paragraph builds up as it goes. */
const SIXC=[['#E5D1B8','#232C31'],['#DD8E58','#232C31'],['#C2956E','#232C31'],['#8AA79C','#232C31'],['#9A5A2C','#FFFFFF'],['#484641','#FFFFFF']];
const ARG={
  fa:['the main advantage of … is that','one major benefit of … is that','a clear advantage of … lies in','the key disadvantage of … is that','a major drawback of … is that'],
  ps:['one possible solution would be to','a practical way to address this is to','an effective measure could be to','the government should take steps to','individuals can also play a role by'],
  ce:['one of the main causes of … is','… largely results from','a further contributing factor is','one major effect of … is that','the impact of … can be seen in'],
  ad:['one strong argument in favour of … is that','supporters of … often point out that','critics argue that … can lead to','those who disagree believe that … fails to','a key argument against … is that'],
  op:['… plays an essential role in','… is one of the most effective ways to','… has brought significant benefits to','… offers clear advantages in terms of','… is beneficial for'],
  st:['… is likely to','… is expected to become','if current patterns persist, …','should this trend continue, it could lead to','in the long term, … could']};
/* Each column from the newspaper portfolio's Body Paragraph page, in its
   order, B2 only (the C1 items stay in the PDF). The first is the one to use. */
function sixFor(id){
  const personal=id==='op'||id==='ad';
  return [
    ['List',[['P2','Firstly, / To begin with,'],['P3','Secondly, / Moreover,'],['P4','Thirdly, / Finally,'],['turn','On the other hand, / However,'],['stress','Above all, / In particular,']]],
    ['Opinion',(personal?['It seems to me that','From my point of view,','As far as I am concerned,','In my view,','I firmly believe that']
                        :['It is often argued that','It is widely believed that','It is generally accepted that','Many people think that','Research shows that']).map(t=>['',t])],
    ['Argument',(ARG[id]||ARG.fa).map(t=>['',t])],
    ['Reason',['This is because','This is largely due to the fact that','given that','since / as','The reason for this is that'].map(t=>['',t])],
    ['Example',['For example,','For instance,','In particular,','A clear example of this is','Take …, for example.','In other words,'].map(t=>['',t])],
    ['Contrast / Result',[['but','However,'],['but','Although … ,'],['but','Despite … ,'],['so','As a result,'],['so','Therefore,'],['so','Consequently,']]]
  ];
}
function psLabel(){
  return `<button type="button" class="pslab" id="psOpen" aria-haspopup="dialog"><span class="dots" aria-hidden="true">${SIXC.map(c=>`<i style="--sc:${c[0]}"></i>`).join('')}</span>Paragraph structure</button>`;
}
function sixHTML(){
  return sixFor(ID).map(([name,items],i)=>`<section class="step6" style="--sc:${SIXC[i][0]};--si:${SIXC[i][1]}"><div class="chev"><b>${String(i+1).padStart(2,'0')}</b><span>${esc(name)}</span></div><ol>`+
    items.map(([tag,t])=>`<li><button type="button" data-copy="${esc(t)}">${tag?`<small>${tag}</small>`:''}${esc(t)}</button></li>`).join('')+`</ol></section>`).join('');
}
/* five body paragraphs from this type's model essays in the portfolio,
   with the question each one answers; the frames are already in bold */
function examplesFor(S){
  const out=[];
  (S.models||[]).forEach(m=>{
    const q=(m.plan&&m.plan[0]?m.plan[0]:'').replace(/\*\*/g,'').replace(/^###\s*/,'');
    m.text.slice(1,-1).forEach(t=>{ if(!/^###/.test(t)&&t.length>60) out.push({q,t}); });
  });
  return out.slice(0,5);
}
function openPS(){
  if(!$('pcard')){
    document.body.insertAdjacentHTML('beforeend',`<div class="scrim2" id="scrim2"></div><div class="pcard" id="pcard" role="dialog" aria-modal="true" aria-label="Paragraph structure"></div>`);
    $('scrim2').onclick=closePS;
  }
  const S=D.sheets[ID];
  const EX=examplesFor(S);
  $('pcard').innerHTML=`<button type="button" class="x" id="psX" aria-label="Close">✕</button><div class="kick"><i></i>Essay · ${esc(S.tab)}</div><h2>Paragraph structure</h2>`+
    `<div class="sixwrap"><div class="six">${sixHTML()}</div><div class="expanel" id="expanel" hidden><button type="button" class="ex" id="exX" aria-label="Close example">✕</button><p class="q" id="exQ"></p><p class="t" id="exT"></p></div></div>`+
    (EX.length?`<div class="exfoot" role="group" aria-label="Examples">${EX.map((e,i)=>`<button type="button" data-ex="${i}" aria-pressed="false">Example ${i+1}</button>`).join('')}</div>`:'');
  $('psX').onclick=closePS;
  const showEx=i=>{
    const btns=$('pcard').querySelectorAll('[data-ex]'), open=i!=null&&btns[i].getAttribute('aria-pressed')!=='true';
    btns.forEach((b,j)=>b.setAttribute('aria-pressed',String(open&&j===i)));
    $('expanel').hidden=!open;
    if(open){ $('exQ').textContent=EX[i].q; $('exT').innerHTML=fmt(EX[i].t); }
  };
  $('pcard').querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>showEx(+b.dataset.ex));
  $('exX').onclick=()=>showEx(null);
  $('pcard').querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copy(b.dataset.copy));
  requestAnimationFrame(()=>{ $('scrim2').classList.add('open'); $('pcard').classList.add('open'); $('psX').focus(); });
}
function closePS(){ const c=$('pcard'); if(!c) return; c.classList.remove('open'); $('scrim2').classList.remove('open'); const o=$('psOpen'); if(o) o.focus(); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closePS(); });
function recipeHTML(){
  return `<div class="recipe" aria-label="Build each paragraph in this order"><span class="lead">Each paragraph:</span>${RECIPE.map(([t,c],i)=>
    `${i?'<span class="ar" aria-hidden="true">→</span>':''}<span class="st" style="--sc:${c}"><i>${i+1}</i>${t}</span>`).join('')}</div>`;
}
function structureHTML(S){
  return S.bands.map((b,k)=>{
    const kk=Math.min(k,2), hasB=k===0&&b.cols.length>1;
    const pl=bandPill(Math.min(k,2)), n=b.cols.length;
    /* a pill goes where the band already has room: under the shorter
       column, or floating in the empty right half of a one-column band */
    const lens=b.cols.map(c=>c.length), short=lens.lastIndexOf(Math.min(...lens));
    return `<section class="band k${kk}${hasB?' hasB':''}" aria-label="${esc(b.label||('Part '+(k+1)))}">`+
      `<div class="med k${kk}" aria-hidden="true"><i>${k===0?'<b>A</b>':''}</i></div>`+
      `<div class="vlab">${esc(b.label)}</div>`+
      `<div class="cols" style="--n:${n}">${k===1&&TASK==='essays'?psLabel():''}${b.cols.map((c,i)=>colHTML(c,i,hasB,n>1&&i===short?pl:'')).join('')}</div>`+
      (n===1&&pl?`<div class="pabs">${pl}</div>`:'')+
      (hasB?`<div class="med right k0" aria-hidden="true"><i><b>B</b></i></div>`:'')+`</section>`;
  }).join('');
}
function modelHTML(S){
  if(!S.models.length) return `<p class="empty">No model samples for this type yet.</p>`;
  return `<div class="models${S.models.length===1?' one':''}">${S.models.map(m=>{
    const plan=m.plan.map((l,j)=>l.startsWith('### ')?`<p class="h">${fmt(l.slice(4))}</p>`:(j===0&&/^\*\*/.test(l)?`<p class="q">${fmt(l)}</p>`:`<p>${fmt(l)}</p>`)).join('');
    const txt=m.text.map(p=>p.startsWith('### ')?`<p class="h">${fmt(p.slice(4))}</p>`:`<p${p.length<40?' class="tight"':''}>${fmt(p)}</p>`).join('');
    return `<article class="model"><div class="plan">${plan}</div><div class="mtext">${txt}</div></article>`;
  }).join('')}</div>`;
}
function draw(){
  const ids=D.tasks[TASK], S=D.sheets[ID];
  $('tabs').innerHTML=ids.length>1?ids.map(id=>`<a href="?task=${TASK}&s=${id}" data-s="${id}"${id===ID?' aria-current="page"':''}>${esc(D.sheets[id].tab)}</a>`).join(''):'';
  $('tabs').hidden=ids.length<2;
  $('tabs').querySelectorAll('[data-s]').forEach(a=>a.onclick=e=>{ e.preventDefault(); ID=a.dataset.s; TRY=null; store.set(TASK,ID); draw(); window.scrollTo(0,0); });
  const [strong,light]=S.title;
  const pt=PATHS[TASK]||{};
  $('slide').innerHTML=`<div class="hd"><h1><b>${esc(strong)}</b> ${VIEW==='model'?'model samples':esc(light)}</h1></div>`+
    (TRY&&VIEW==='structure'?`<p class="qline"><q>${esc(TRY.mainQuestion)}</q> <button type="button" id="tryNext">Another</button><button type="button" id="tryOff" aria-label="Back to [topic]">×</button></p>`:'')+
    (S.draft&&VIEW==='structure'?`<p class="draft">Draft — not in the paper portfolio yet</p>`:'')+
    (VIEW==='model'?modelHTML(S):structureHTML(S))+
    `<div class="foot"><span><button type="button" class="foot-print" id="print" style="margin-left:0">Print</button></span><p class="sign"><b>Majid</b><span>nashtai26</span></p></div>`;
  $('print').onclick=()=>window.print();
  if($('psOpen')) $('psOpen').onclick=openPS;
  const tb=$('try'); if(tb) tb.onclick=()=>{ if(TRY){ TRY=null; draw(); } else tryOn(0); };
  if($('tryNext')) $('tryNext').onclick=()=>tryOn(1);
  if($('tryOff')) $('tryOff').onclick=()=>{ TRY=null; draw(); };
  $('slide').querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copy(b.dataset.copy));
  document.title='INTUITY — '+S.tab+(VIEW==='model'?' model samples':' structure');
  history.replaceState(null,'',`?task=${TASK}&s=${ID}${VIEW==='model'?'&view=model':''}`);
  /* the stage pages' "← Structure" brings the student back to this slide */
  try{ sessionStorage.setItem('intuity.sheetReturn',JSON.stringify({task:TASK,url:location.pathname+location.search})); }catch(e){}
}
function tryOn(step){
  const go=()=>{ const list=QS.filter(q=>q.essayType===QTYPE[ID]); const pool=list.length?list:QS;
    TRYI=step?(TRYI+1)%pool.length:Math.floor(Math.random()*pool.length); TRY=pool[TRYI]; draw(); };
  if(QS) return go();
  fetch(PATHS.essays.q.replace('essay-question.html','data/essay-questions.json'),{cache:'no-store'}).then(r=>r.json()).then(d=>{ QS=d.questions||[]; go(); }).catch(()=>toast('Questions didn’t load'));
}
let tt=null;
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),1200); }
function copy(text){
  const ok=()=>toast('Copied');
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok,()=>fb(text,ok)); else fb(text,ok);
}
function fb(text,ok){ const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy'); ok();}catch(e){} ta.remove(); }


fetch('/data/writing/portfolio.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{
  D=d; let t=P.get('task'); t=ALIAS[t]||t; TASK=D.tasks[t]?t:'essays';
  const ids=D.tasks[TASK], want=P.get('s')||store.get(TASK);
  ID=ids.includes(want)?want:ids[0];
  draw();
}).catch(()=>{ $('slide').innerHTML='<p class="empty">The portfolio didn’t load — reload to try again.</p>'; });
})();
</script>
