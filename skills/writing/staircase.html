<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>INTUITY — Climb the stairs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&display=swap" rel="stylesheet">
<style>
/* ═══ CLIMB THE STAIRS (Oct 2026) ═════════════════════════════════════════
   The staircases from Michael's newspaper portfolio: take one phrase from
   each step, left to right, and the sentence builds. On paper the climb was
   a small grey instruction; here it IS the page — tap a phrase and it lands
   in the sentence at the top, in that step's colour. It starts as his
   threaded example, so the first thing a student sees is a finished
   sentence, not a list.
   Less academic than the paper: bullets instead of dot-runs, five phrases
   a group, plain labels ("but…" not CONCESSION). Every phrase is visible:
   nothing to open. Content: /data/writing/staircase.json */
:root{--ink:#1C1C1C;--title:#44546A;--quiet:#5B5E66;--rule:#C9CCD6;
  --c0:#4472C4;--t0:#E3EBF8;--c1:#D0651F;--t1:#FBE6D6;--c2:#6E6491;--t2:#ECE8F4;--c3:#2F7D52;--t3:#DFF1E6}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font-family:'Geist',Calibri,'Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.top{display:flex;align-items:center;gap:10px;max-width:1340px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 16px 0}
.back{font:700 11px/1 'Geist',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--quiet);text-decoration:none;padding:10px 4px}
.sp{flex:1}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs a{flex:none;text-decoration:none;font-weight:600;font-size:14px;color:#666;padding:8px 12px;border-bottom:3px solid transparent}
.tabs a[aria-current="page"]{color:var(--title);border-bottom-color:var(--c0)}
main{max-width:1340px;margin:0 auto;padding:6px 16px 32px}
h1{margin:6px 0 2px;font-size:clamp(1.4rem,3vw,1.9rem);color:var(--title);font-weight:400}
h1 b{font-weight:700}
.how{margin:0 0 12px;font-size:15px;color:var(--quiet)}

/* the sentence */
.sentence{position:sticky;top:0;z-index:2;background:#fff;padding:8px 0 10px;margin:0 0 14px;border-bottom:1px solid var(--rule)}
.line{font-size:clamp(17px,2.1vw,22px);line-height:1.55;font-weight:500;min-height:2.2em}
.seg{border-radius:5px;padding:1px 3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.s0{background:var(--t0)}.s1{background:var(--t1)}.s2{background:var(--t2)}.s3{background:var(--t3)}
.gap{color:#9AA0AA}
.acts{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.pill{border:1.2px solid #B9BCC8;background:#fff;color:var(--title);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none}
.pill:hover{border-color:var(--title)}
.eg{font-size:13.5px;color:var(--quiet);font-style:italic;margin-left:auto}

/* the stairs: each step a little higher than the last */
.stairs{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:0 22px;align-items:start}
.step{margin-top:calc(var(--up) * 30px)}
.tread{border-top:3px solid var(--c);padding-top:8px;margin-bottom:8px}
.sname{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.sname i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:12px;letter-spacing:0}
.sname small{font-weight:600;letter-spacing:.04em;text-transform:none;color:var(--quiet);font-size:12px}
.seg-eg{font-size:13px;font-style:italic;color:var(--quiet);margin:3px 0 0 30px}
.group{margin:0 0 10px}
.glab{font-size:12px;font-weight:600;color:var(--quiet);margin:0 0 2px;display:flex;align-items:center;gap:6px}
.glab b{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:4px;background:var(--c);color:#fff;font-size:11px}
.group ul{list-style:none;margin:0;padding:0}
.ph{display:block;width:100%;text-align:left;border:none;background:none;cursor:pointer;border-radius:6px;padding:3px 8px 3px 18px;margin:0 0 0 -8px;
  font-size:14.5px;line-height:1.38;position:relative}
.ph::before{content:'•';position:absolute;left:6px;top:3px;color:#8A8F99}
.ph:hover{background:#F4F5F8}
.ph:active{transform:scale(.99)}
.ph.first{font-weight:700}
.ph[aria-pressed="true"]{background:var(--t);box-shadow:inset 3px 0 0 var(--c)}
.ph .tail{color:var(--quiet);font-weight:500;font-size:.88em;margin-left:4px;white-space:nowrap}
.k0{--c:var(--c0);--t:var(--t0)}.k1{--c:var(--c1);--t:var(--t1)}.k2{--c:var(--c2);--t:var(--t2)}.k3{--c:var(--c3);--t:var(--t3)}
.sign{text-align:right;font-size:16px;color:var(--title);margin-top:10px}
.sign b{font-weight:700}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;background:#1C1C1C;color:#fff;
  font-size:14px;padding:9px 16px;border-radius:999px;pointer-events:none;transition:transform .25s cubic-bezier(.2,1.4,.4,1),opacity .2s}
.toast.show{transform:translate(-50%,0);opacity:1}
@media (max-width:760px){
  .stairs{grid-template-columns:1fr;gap:0}
  .step{margin-top:0;margin-bottom:14px}
  .eg{margin-left:0;width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="top">
  <a class="back" href="/skills/writing/sheet.html?task=essays" target="_top">← Essay structure</a>
  <span class="sp"></span>
  <nav class="tabs" id="tabs" aria-label="Part of the essay"></nav>
</div>
<main id="page"><p class="how">Loading…</p></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P=new URLSearchParams(location.search);
let D=null, PART='intro', ST=[];

const split=t=>{ const i=t.indexOf(' + '); return i<0?{main:t,tail:''}:{main:t.slice(0,i),tail:t.slice(i+1)}; };
const low=s=>/^I\b/.test(s)?s:s.charAt(0).toLowerCase()+s.slice(1);
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const isPre=(step,t)=>step.groups.some(g=>g.pre&&g.items.includes(t));

function reset(){
  ST=D.parts[PART].steps.map(s=>{ const o={pre:null,main:null}; s.pick.forEach(t=>{ if(isPre(s,t)) o.pre=t; else o.main=t; }); return o; });
}
/* Joins the picks into one sentence the way the paper climb does:
   a step that continues takes a small letter; a step marked start begins
   a new sentence; "…" marks where the student's own words go. */
function compose(){
  const steps=D.parts[PART].steps;
  const chunks=steps.map((s,i)=>{
    const st=ST[i]; let a=st.pre?split(st.pre).main:'', b=st.main?split(st.main).main:'';
    if(a&&b) b=low(b);
    return {k:i, start:!!s.start, hinge:s.name==='Hinge', text:[a,b].filter(Boolean).join(' ')};
  }).filter(c=>c.text);
  let out=[], prevEnd='';
  chunks.forEach((c,j)=>{
    let t=c.text.replace(/\.\.\./g,'…');
    const next=chunks[j+1];
    const needsGap=!/[,.?!…]$/.test(t)&&(!next||next.start||next.hinge);
    if(out.length){
      if(c.start||/[.?!]$/.test(prevEnd)){ if(!/[.?!]$/.test(prevEnd)) out[out.length-1].after+='.'; t=cap(t); }
      else { t=low(t); if(c.hinge&&!/,$/.test(prevEnd)) out[out.length-1].after+=','; }
    } else t=cap(t);
    const seg={k:c.k,text:t,after:needsGap?' …':''};
    out.push(seg); prevEnd=t+seg.after;
  });
  if(out.length){ const l=out[out.length-1]; if(!/[.?!]$/.test(l.text+l.after)) l.after+=(/,$/.test(l.text+l.after)?' …':'')+'.'; }
  return out;
}
function sentenceHTML(){
  return compose().map(s=>`<span class="seg s${s.k}">${esc(s.text)}</span>${s.after?`<span class="gap">${esc(s.after)}</span>`:''}`).join(' ');
}
const plainSentence=()=>compose().map(s=>s.text+s.after).join(' ');

function draw(){
  const part=D.parts[PART], n=part.steps.length;
  $('tabs').innerHTML=Object.keys(D.parts).map(k=>`<a href="?part=${k}" data-p="${k}"${k===PART?' aria-current="page"':''}>${esc(D.parts[k].tab)}</a>`).join('');
  $('tabs').querySelectorAll('[data-p]').forEach(a=>a.onclick=e=>{ e.preventDefault(); PART=a.dataset.p; reset(); draw(); window.scrollTo(0,0); });
  $('page').innerHTML=
    `<h1><b>${esc(part.tab)}</b> · climb the stairs</h1>`+
    `<p class="how">Take one phrase from each step, left to right. Your sentence builds here.</p>`+
    `<section class="sentence" aria-live="polite"><div class="line" id="line">${sentenceHTML()}</div>`+
    `<div class="acts"><button type="button" class="pill" id="copy">Copy the sentence</button><button type="button" class="pill" id="again">Start again</button>`+
    `<span class="eg">Majid’s example: ${esc(part.example)}</span></div></section>`+
    `<div class="stairs" style="--n:${n}">${part.steps.map((s,i)=>
      `<section class="step k${i}" style="--up:${n-1-i}" aria-label="Step ${i+1}: ${esc(s.name)}">`+
      `<div class="tread"><div class="sname"><i>${i+1}</i>${esc(s.name)}${s.by?` <small>${esc(s.by)}</small>`:''}</div><p class="seg-eg">${esc(s.eg)}</p></div>`+
      s.groups.map(g=>`<div class="group"><p class="glab">${g.mark?`<b>${g.mark}</b>`:''}${esc(g.label)}</p><ul>${g.items.map((t,j)=>{
        const {main,tail}=split(t), on=ST[i].pre===t||ST[i].main===t;
        return `<li><button type="button" class="ph${j===0?' first':''}" data-s="${i}" data-t="${esc(t)}" aria-pressed="${on}">${esc(main)}${tail?`<span class="tail">${esc(tail)}</span>`:''}</button></li>`;
      }).join('')}</ul></div>`).join('')+`</section>`).join('')}</div>`+
    `<p class="sign"><b>Majid</b>nashtai26</p>`;
  $('page').querySelectorAll('.ph').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.s, t=b.dataset.t, s=part.steps[i], key=isPre(s,t)?'pre':'main';
    ST[i][key]=ST[i][key]===t?null:t;
    $('line').innerHTML=sentenceHTML();
    b.closest('.step').querySelectorAll('.ph').forEach(x=>{ const v=x.dataset.t; x.setAttribute('aria-pressed',ST[i].pre===v||ST[i].main===v); });
  });
  $('copy').onclick=()=>copy(plainSentence());
  $('again').onclick=()=>{ reset(); draw(); };
  document.title='INTUITY — '+part.tab+' · climb the stairs';
  history.replaceState(null,'','?part='+PART);
}
let tt=null;
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),1200); }
function copy(text){
  const ok=()=>toast('Copied');
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok,()=>fb(text,ok)); else fb(text,ok);
}
function fb(text,ok){ const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy'); ok();}catch(e){} ta.remove(); }
fetch('/data/writing/staircase.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{
  D=d; PART=D.parts[P.get('part')]?P.get('part'):'intro'; reset(); draw();
}).catch(()=>{ $('page').innerHTML='<p class="how">The stairs didn’t load — reload to try again.</p>'; });
})();
</script>
</body>
</html>
