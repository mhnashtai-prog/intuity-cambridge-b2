<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>INTUITY — Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..900&family=Geist+Mono:wght@400..600&family=Anton&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   WRITING — WATCH FIRST (27 Oct 2026)

   A 9:16 poster presentation that plays itself. Every frame is a pure
   function of ONE clock, t (seconds): the recording's currentTime when
   there is a recording, the wall clock when there isn't. So the same page
   plays in the app, records cleanly on a screen recorder (?rec=1), and
   renders frame by frame into an MP4 (window.WATCH.seek).

   One take: the narration is a single ElevenLabs file. The slides find
   their places in it by the silences between them (?make=1 → Load
   recording), so nobody cuts audio by hand.
   ═══════════════════════════════════════════════════════════════════════ */
:root{
  --paper:#F3F1EC; --card:#FAF8F5; --sunk:#E9E4DB; --ink:#201E1C; --dim:#5C5852; --faint:#8C867E;
  --sage:#8AA79C; --sage-ink:#4F6B61; --caramel:#A9875F; --caramel-ink:#7A5C3A;
  --anton:'Anton',Impact,sans-serif; --geist:'Geist',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#201E1C;color:var(--ink);font-family:var(--geist);-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
/* the stage is always 360 × 640 units, scaled to fit */
#fit{position:relative;flex:none}
#stage{position:absolute;left:0;top:0;width:360px;height:640px;transform-origin:0 0;background:var(--paper);overflow:hidden;cursor:pointer}
.rec body,html.rec{background:var(--paper)}

/* furniture */
.bars{position:absolute;left:20px;right:20px;top:18px;display:flex;gap:5px;z-index:3}
.bars i{flex:1;height:3px;background:rgba(32,30,28,.12);border-radius:2px;overflow:hidden}
.bars i b{display:block;height:100%;width:0;background:var(--ink)}
.lab{position:absolute;left:28px;top:44px;display:flex;align-items:center;gap:9px;z-index:3;
  font:600 10.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--caramel-ink)}
.lab::before{content:"";width:22px;height:4px;background:var(--caramel)}
.brand{position:absolute;left:28px;right:28px;bottom:22px;display:flex;justify-content:space-between;z-index:3;
  font:500 9.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.brand b{color:var(--ink);font-weight:600}

/* a slide */
.sl{position:absolute;left:28px;right:28px;top:84px;bottom:56px;display:flex;flex-direction:column;justify-content:center;gap:18px}
.rv{will-change:opacity,transform}
.h{font:400 38px/1.02 var(--anton);text-transform:uppercase;letter-spacing:.005em}
.mega{font:400 116px/.9 var(--anton);text-transform:uppercase;letter-spacing:-.01em}
.huge{font:400 96px/.92 var(--anton);color:var(--caramel-ink);letter-spacing:-.01em;text-transform:uppercase}
.sub{font:400 19px/1.3 var(--geist);color:var(--dim)}
.rule{width:56px;height:6px;background:var(--caramel)}
.list{display:flex;flex-direction:column;gap:8px}
.list div{font:400 36px/1.05 var(--anton);text-transform:uppercase;display:flex;align-items:center;gap:14px}
.list div::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--sage);flex:none}
.foot{font:italic 400 16px/1.35 var(--geist);color:var(--dim);border-top:1px solid rgba(32,30,28,.14);padding-top:14px}
.steps{display:flex;flex-direction:column;gap:14px}
.steps div{display:grid;grid-template-columns:44px 1fr;align-items:center;font:600 21px/1.2 var(--geist)}
.steps div span{font:400 40px/1 var(--anton);color:var(--sage-ink)}
.pill{align-self:flex-start;font:600 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;
  background:var(--ink);color:var(--paper);padding:8px 12px;border-radius:999px}
.frame{background:var(--card);border-left:6px solid var(--caramel);padding:16px 16px 16px 18px;
  font:500 17px/1.5 var(--mono);color:var(--ink);box-shadow:0 1px 0 rgba(32,30,28,.06)}
.frame u{text-decoration:none;display:inline-block;min-width:44px;border-bottom:2px solid var(--sage);color:transparent;line-height:1.05}
.eg{font:400 22px/1.32 var(--geist);color:var(--ink)}
.eg small{display:block;font:600 10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--sage-ink);margin-bottom:9px}
.eg b{font-weight:400;background:linear-gradient(transparent 62%,rgba(138,167,156,.42) 62%)}
.big{font:400 58px/.98 var(--anton);text-transform:uppercase}
.cards{display:flex;flex-direction:column;gap:10px}
.cards div{background:var(--card);padding:13px 15px;font:400 18px/1.3 var(--geist)}
.cards div small{display:block;font:600 10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--sage-ink);margin-bottom:7px}
.never{display:flex;flex-direction:column;gap:14px}
.never div{font:400 25px/1.2 var(--geist);color:var(--dim);display:grid;grid-template-columns:30px 1fr;align-items:baseline}
.never div::before{content:"✕";font:600 22px/1 var(--geist);color:#A4543A}
.never div span{text-decoration:line-through;text-decoration-color:#A4543A;text-decoration-thickness:2px}
.go{align-self:flex-start;background:var(--sage);color:#fff;font:600 17px/1 var(--geist);padding:15px 22px;border-radius:999px;margin-top:6px}

/* controls — app only, never in a recording */
.ctl{width:min(100vw,460px);display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:12px 12px 4px;flex:none}
.ctl button,.ctl a{font:500 12.5px/1 var(--geist);color:#E9E4DB;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
  padding:9px 12px;border-radius:999px;cursor:pointer;text-decoration:none}
.ctl button.on{background:#F3F1EC;color:#201E1C;border-color:#F3F1EC}
.ctl a{background:none;border-color:transparent;color:#B9B2A7}
.rec .ctl,.rec .make{display:none}
.veil{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:9;
  background:rgba(243,241,236,.82);backdrop-filter:blur(2px);font:600 15px/1 var(--geist);color:var(--ink)}
.veil[hidden]{display:none}
.veil .play{width:74px;height:74px;border-radius:50%;background:var(--ink);display:grid;place-items:center}
.veil .play::after{content:"";margin-left:6px;border-left:22px solid var(--paper);border-top:14px solid transparent;border-bottom:14px solid transparent}
.veil .row{display:flex;gap:8px}
.veil .row span{font:500 13px/1 var(--geist);padding:10px 14px;border-radius:999px;background:var(--card);border:1px solid rgba(32,30,28,.14)}
/* the maker's panel (?make=1) */
.make{width:min(100vw,460px);padding:10px 14px 14px;color:#E9E4DB;font:400 12.5px/1.45 var(--geist);flex:none}
.make label,.make button{display:inline-block;font:600 12.5px/1 var(--geist);background:#8AA79C;color:#fff;border:0;border-radius:999px;padding:10px 14px;cursor:pointer;margin:4px 6px 4px 0}
.make p{color:#B9B2A7;margin-top:6px}
.make input{display:none}
</style>
</head>
<body>
<div id="fit"><div id="stage">
  <div class="bars" id="bars"></div>
  <div class="lab" id="lab"></div>
  <div class="sl" id="sl"></div>
  <div class="brand"><span><b>INTUITY</b> · B2 First</span><span id="tk"></span></div>
  <div class="veil" id="veil"><div class="play"></div><div id="vtx">Tap to watch</div></div>
</div></div>
<nav class="ctl" id="ctl"></nav>
<div class="make" id="make" hidden>
  <label>Load recording (MP3)<input type="file" id="file" accept="audio/*"></label>
  <button id="recgo" type="button">Full screen &amp; play</button>
  <p id="mk">One take from ElevenLabs. The slides find their places by the pauses.</p>
</div>
<script>
(function(){
'use strict';
const Q=new URLSearchParams(location.search);
const TASK=Q.get('task')||'reviews', REC=Q.has('rec'), MAKE=Q.has('make');
if(REC) document.documentElement.classList.add('rec');
const $=id=>document.getElementById(id);
const stage=$('stage'), fit=$('fit');
let D=null, S=[], start=[], speak=[], END=0, audio=null, marks=null;
let playing=false, t0=0, tAt=0, from=0, to=Infinity, built=-1, part=-1;

/* ── fit 360×640 into the window ── */
function size(){
  const ch=REC?0:($('ctl').offsetHeight+(MAKE?$('make').offsetHeight:0));
  const k=Math.min(innerWidth/360,(innerHeight-ch)/640);
  fit.style.width=360*k+'px'; fit.style.height=640*k+'px'; stage.style.transform='scale('+k+')';
}
addEventListener('resize',size);

/* ── words → where in the line it is said ── */
const norm=s=>s.toLowerCase().replace(/[’']/g,'').replace(/[^a-z0-9 ]+/g,' ').split(/\s+/).filter(Boolean);
function frac(say,needle,fb){
  const w=norm(say), n=norm(needle).slice(0,3);
  for(let i=0;i<=w.length-n.length;i++) if(n.every((x,j)=>w[i+j]===x)) return i/w.length;
  return fb;
}
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* ── timings: from the recording's pauses, or estimated from the words ── */
const WPS=2.55;
function timeline(){
  start=[]; speak=[];
  if(marks&&marks.length===S.length){
    start=marks.slice();
    END=(audio&&audio.duration&&isFinite(audio.duration))?audio.duration+1.2:start[start.length-1]+8;
    S.forEach((x,i)=>{ const nxt=i<S.length-1?start[i+1]:END-1.2; speak[i]=Math.max(1.2,nxt-start[i]-0.7); });
  }else{
    let t=0.6;
    S.forEach((x,i)=>{ start[i]=t; speak[i]=x.say.split(/\s+/).length/WPS;
      t+=speak[i]+(i<S.length-1&&S[i+1].part!==x.part?1.5:0.8); });
    END=t+1.4;
  }
}
const partStart=p=>{ const i=S.findIndex(x=>x.part===p); return i<=0?0:start[i]-0.35; };
const partEnd=p=>{ const i=S.findIndex(x=>x.part>p); return i<0?END:start[i]-0.35; };

/* ── one slide's markup; every reveal carries the second it appears ── */
function build(i){
  const x=S[i], sp=speak[i];
  const at=(f)=>' class="rv" data-t="'+Math.max(0,f*sp-0.15).toFixed(2)+'"';
  const r=(cls,f,html)=>'<div'+at(f).replace('class="rv"','class="rv '+cls+'"')+'>'+html+'</div>';
  let h='';
  switch(x.kind){
    case 'title': h=r('rule',0,'')+r('mega',0,esc(x.big))+r('sub',0.25,esc(x.sub))+r('eg',0.35,esc(x.say)); break;
    case 'list': h=r('h',0,esc(x.kick))+'<div class="list">'+x.lines.map((l,k)=>'<div'+at(frac(x.say,l,(k+1)/(x.lines.length+2)))+'>'+esc(l)+'</div>').join('')+'</div>'
                  +r('foot',frac(x.say,'You write',0.6),esc(x.foot)); break;
    case 'steps': h=r('h',0,esc(x.kick))+'<div class="steps">'+x.lines.map((l,k)=>'<div'+at(frac(x.say,l,(k+1)/4))+'><span>'+(k+1)+'</span>'+esc(l)+'</div>').join('')+'</div>'; break;
    case 'big': h=r('sub',0,esc(x.kick))+r('huge',0,esc(x.big))+r('sub',0.55,esc(x.sub)); break;
    case 'frame':{
      const frags=x.frame.split('…').map(s=>s.trim()).filter(s=>s.length>2);
      let ex=esc(x.ex); frags.forEach(f=>{ const e=esc(f); if(ex.includes(e)) ex=ex.replace(e,'<b>'+e+'</b>'); });
      h=r('pill',0,esc(x.head))+r('frame',0.04,esc(x.frame).replace(/…/g,'<u>…</u>'))
        +r('eg',frac(x.say,x.ex,0.5),'<small>For example</small>'+ex); break;}
    case 'rule': h=r('rule',0,'')+r('big',0,esc(x.big))+r('sub',0.4,esc(x.sub)); break;
    case 'choose': h=r('h',0,esc(x.head))+'<div class="cards">'+x.lines.map(([k,s],j)=>'<div'+at(frac(x.say,s,(j+1)/4))+'><small>'+esc(k)+'</small>'+esc(s)+'</div>').join('')+'</div>'; break;
    case 'never': h=r('h',0,'Never')+'<div class="never">'+x.lines.map((l,k)=>'<div'+at(frac(x.say,l,(k+1)/3))+'><span>'+esc(l)+'</span></div>').join('')+'</div>'; break;
    case 'end': h=r('sub',0,esc(x.kick))+r('big',0,esc(x.big))+r('sub',0.45,esc(x.sub))+r('go',0.2,'Workout ›'); break;
  }
  $('sl').innerHTML=h;
  $('lab').textContent=x.part===0?(D.label0||'The basics'):x.kick;
  $('tk').textContent=D.parts[x.part];
  built=i;
}
const ease=p=>1-Math.pow(1-p,3);

/* ── THE frame: everything on screen is decided by t ── */
function draw(t){
  let i=0; while(i<S.length-1&&t>=start[i+1]-0.35) i++;
  if(i!==built) build(i);
  const local=t-start[i]+0.35, out=i<S.length-1?start[i+1]-0.35-t:99;
  const enter=ease(Math.min(1,Math.max(0,local/0.45))), leave=Math.min(1,Math.max(0,out/0.3));
  const sl=$('sl'); sl.style.opacity=Math.min(enter,leave); sl.style.transform='translateY('+((1-enter)*18-(1-leave)*10).toFixed(1)+'px)';
  sl.querySelectorAll('.rv').forEach(el=>{
    const p=ease(Math.min(1,Math.max(0,(local-0.35-(+el.dataset.t))/0.4)));
    el.style.opacity=p; el.style.transform='translateY('+((1-p)*12).toFixed(1)+'px)';
  });
  /* the bars: one per part */
  const bs=$('bars').children;
  for(let p=0;p<bs.length;p++){ const a=partStart(p),b=partEnd(p); bs[p].firstChild.style.width=(Math.min(1,Math.max(0,(t-a)/(b-a)))*100)+'%'; }
}

/* ── the clock ── */
const now=()=>audio&&!audio.paused?audio.currentTime:(playing?tAt+(performance.now()-t0)/1000:tAt);
function loop(){
  if(!playing) return;
  const t=now(); draw(t);
  if(t>=to){ stop(true); return; }
  requestAnimationFrame(loop);
}
function play(a,b){
  from=a; to=b; tAt=a; playing=true; $('veil').hidden=true;
  if(audio){ audio.currentTime=a; audio.play().catch(()=>{ audio=null; t0=performance.now(); }); }
  t0=performance.now(); requestAnimationFrame(loop);
}
function pause(){
  if(!playing) return;
  tAt=now(); playing=false; if(audio) audio.pause();
  veil('Paused · tap to go on');
}
function resume(){ if(audio){ audio.currentTime=tAt; audio.play(); } playing=true; t0=performance.now(); $('veil').hidden=true; requestAnimationFrame(loop); }
function stop(done){
  playing=false; if(audio) audio.pause(); tAt=to;
  if(done&&!REC) veil(part<0?'Watch again':'Again', true);
}
function veil(txt,end){
  const v=$('veil'); v.hidden=false; $('vtx').textContent=txt;
  v.dataset.end=end?'1':'';
}
stage.onclick=()=>{
  if(playing) return pause();
  if($('veil').dataset.end==='1'||tAt>=to||tAt===0&&!playing&&from===0&&to===Infinity) return go(part);
  resume();
};
function go(p){
  part=p;
  [...$('ctl').querySelectorAll('button')].forEach(b=>b.classList.toggle('on',+b.dataset.p===p));
  if(p<0) play(0,END); else play(partStart(p),partEnd(p));
}

/* ── the recording: find the pauses ── */
function findMarks(buf){
  const ch=buf.getChannelData(0), sr=buf.sampleRate, hop=Math.round(sr*0.02), n=Math.floor(ch.length/hop), rms=new Float32Array(n);
  let mx=0;
  for(let f=0;f<n;f++){ let s=0; for(let j=f*hop;j<(f+1)*hop;j++) s+=ch[j]*ch[j]; rms[f]=Math.sqrt(s/hop); if(rms[f]>mx) mx=rms[f]; }
  const th=mx*0.03, runs=[]; let a=-1;
  for(let f=0;f<=n;f++){ const q=f<n&&rms[f]<th; if(q&&a<0) a=f; if(!q&&a>=0){ runs.push([a*0.02,f*0.02]); a=-1; } }
  const lead=runs.length&&runs[0][0]===0?runs[0][1]:0;
  const inner=runs.filter(r=>r[0]>0&&r[1]<n*0.02-0.05&&r[1]-r[0]>=0.45);
  if(inner.length<S.length-1) return null;
  const pick=inner.slice().sort((x,y)=>(y[1]-y[0])-(x[1]-x[0])).slice(0,S.length-1).sort((x,y)=>x[0]-y[0]);
  return [Math.max(0,lead-0.2)].concat(pick.map(r=>Math.max(r[0]+0.1,r[1]-0.2)));
}
function useAudio(url,m){
  audio=new Audio(url); audio.preload='auto';
  audio.addEventListener('loadedmetadata',()=>{ timeline(); draw(tAt); });
  if(m) marks=m;
}
async function loadFile(f){
  $('mk').textContent='Listening for the pauses…';
  const ab=await f.arrayBuffer(), ac=new (window.AudioContext||window.webkitAudioContext)();
  const buf=await ac.decodeAudioData(ab.slice(0));
  const m=findMarks(buf);
  useAudio(URL.createObjectURL(f), m);
  if(m){ marks=m; $('mk').innerHTML='Found all '+S.length+' slides in '+buf.duration.toFixed(0)+' s. Press <b>Full screen &amp; play</b>, start your screen recorder, then tap the slide.'; }
  else{ marks=null; $('mk').textContent='Could not find '+(S.length-1)+' clear pauses — the slides will follow the word count instead. (Keep the <break> tags in the script.)'; }
  timeline(); tAt=0; built=-1; draw(0);
}

/* ── start ── */
fetch('/data/writing/presentations/presentations.json').then(r=>r.json()).then(J=>{
  D=J[TASK]; if(!D){ document.body.textContent='No presentation yet.'; return; }
  S=D.slides; document.title='INTUITY — '+D.title;
  $('bars').innerHTML=D.parts.map(()=>'<i><b></b></i>').join('');
  if(D.audio&&!Q.has('silent')) useAudio(D.audio,D.marks);
  timeline();
  if(!REC){
    const back=(()=>{ try{ return JSON.parse(sessionStorage.getItem('intuity.sheetReturn')||'null'); }catch(e){ return null; } })();
    const c=$('ctl');
    c.innerHTML='<button data-p="-1" class="on">Watch it all</button>'+D.parts.map((p,i)=>'<button data-p="'+i+'">'+(i?i+' · ':'')+esc(p)+'</button>').join('')
      +'<a href="'+(back?back.url:'/skills/writing/gate.html?task='+TASK)+'">← back</a>';
    c.querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.p));
  }
  if(MAKE){ $('make').hidden=false; $('file').onchange=e=>e.target.files[0]&&loadFile(e.target.files[0]);
    $('recgo').onclick=()=>{ document.documentElement.classList.add('rec'); size(); (document.documentElement.requestFullscreen||function(){}).call(document.documentElement); veil('Tap to start'); }; }
  const startP=Q.get('part'); if(startP!==null&&D.parts[+startP]) part=+startP;
  size(); draw(part<0?3.2:partStart(part)+2.5); if(part>=0){ from=partStart(part); tAt=from; }
  veil(REC?'Tap to start':'Tap to watch');
  stage.onclick=(o=>()=>{ if(!playing&&$('veil').textContent.startsWith('Tap')){ go(part); return; } o(); })(stage.onclick);
  document.fonts.ready.then(()=>{ size(); window.WATCH.ready=true; });
});

/* for the MP4 renderer: draw any instant, no clock */
window.WATCH={ready:false, seek:t=>{ $('veil').hidden=true; draw(t); }, get end(){ return END; }, get starts(){ return start; },
  setMarks:(m,dur)=>{ marks=m; audio={duration:dur,paused:true}; timeline(); built=-1; audio=null; }};
})();
</script>
</body>
</html>
