<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>INTUITY — Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..900&family=Geist+Mono:wght@400..600&family=Anton&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   WRITING — WATCH (28 Oct 2026, v3: three clips on one recorded take)

   Watch-and-listen only: no blanks, no buttons to press inside the frame,
   nothing to get right. The voice builds one review (Café Azul); after
   each "Here are some more examples" six finished models roll past in
   silence, the current paragraph open, the rest folded so the shape of
   the whole review stays in view. Three marks, three meanings:
     sage underlay  = the expression you borrow from the sheet
     caramel box    = the thing being reviewed (yours, every time)
     underline      = the linker that carries the idea on
   Every frame is a pure function of one clock t: the recording's
   currentTime. ?rec=1 hides the controls; window.WATCH.seek renders MP4s.
   ═══════════════════════════════════════════════════════════════════════ */
:root{
  --paper:#F3F1EC; --card:#FBFAF7; --ink:#141210; --dim:#5C5852; --faint:#8C867E; --line:rgba(20,17,14,.14);
  --sage:#8AA79C; --sage-ink:#4F6B61; --caramel:#A9875F; --caramel-ink:#7A5C3A;
  --anton:'Anton',Impact,sans-serif; --geist:'Geist',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#201E1C;color:var(--ink);font-family:var(--geist);-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#fit{position:relative;flex:none}
#stage{position:absolute;left:0;top:0;width:360px;height:640px;transform-origin:0 0;background:var(--paper);overflow:hidden;cursor:pointer}
html.rec,html.rec body{background:var(--paper)}

.bars{position:absolute;left:20px;right:20px;top:18px;display:flex;gap:5px;z-index:3}
.bars i{flex:1;height:3px;background:rgba(20,17,14,.12);border-radius:2px;overflow:hidden}
.bars i b{display:block;height:100%;width:0;background:var(--ink)}
.lab{position:absolute;left:20px;top:38px;display:flex;align-items:center;gap:9px;z-index:3;font:600 10px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:#6B655C}
.lab::before{content:"";width:24px;height:8px;background:var(--caramel)}
.brand{position:absolute;left:20px;bottom:18px;z-index:3;font:500 9.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.brand b{color:var(--ink);font-weight:600}
.sc{position:absolute;left:20px;right:20px;top:62px;bottom:40px;display:flex;flex-direction:column;justify-content:center;gap:14px}

/* the three marks */
.x{background:linear-gradient(transparent 58%,rgba(138,167,156,.45) 58%);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.nm{border:1.5px solid rgba(169,135,95,var(--nb,1));background:rgba(169,135,95,calc(var(--nb,1)*.13));border-radius:3px;padding:0 3px;-webkit-box-decoration-break:clone;box-decoration-break:clone;font-weight:600}
.lk{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;text-decoration-color:var(--ink);font-weight:600}

/* clip 1 opening */
.mega{font:400 104px/.86 var(--anton);text-transform:uppercase;letter-spacing:-.01em}
.words{font:400 30px/1 var(--anton);color:var(--caramel-ink);text-transform:uppercase}
.k{font:600 9.5px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-bottom:-6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font:500 15px/1 var(--geist);padding:9px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.does{display:flex;flex-direction:column;gap:10px}
.does div{display:flex;gap:12px;align-items:baseline;font:500 20px/1.25 var(--geist)}
.does div::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--sage);flex:none;transform:translateY(-2px)}

/* the review page */
.pg{background:var(--card);padding:16px 16px 14px;box-shadow:0 1px 0 rgba(20,17,14,.05),0 18px 40px -26px rgba(20,17,14,.4)}
.ph{display:flex;justify-content:space-between;align-items:center;padding-bottom:10px;border-bottom:1.5px solid var(--line);margin-bottom:6px}
.ph b{font:400 22px/1 var(--anton);text-transform:uppercase;letter-spacing:.01em}
.ph span{font:500 13px/1 var(--geist);color:var(--faint)}
.ph span em{font-style:normal;color:var(--ink);font-weight:800}
.row{padding:7px 0 7px 10px;border-left:3px solid transparent}
.row small{display:block;font:600 9px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
.row .fold{margin-top:5px;font:400 13px/1.2 var(--geist);color:#B3ACA2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.op{border-left-color:var(--sage);padding:9px 0 10px 11px}
.row.op small{color:var(--sage-ink)}
.row .tx{margin-top:7px;font:400 17px/1.5 var(--geist);color:var(--ink)}
.row .sn{display:block;margin-top:9px;font:400 18.5px/1.45 var(--geist)}
.row .sn:first-of-type{margin-top:6px}
.row .sn i{display:block;font:600 9px/1 var(--mono);font-style:normal;letter-spacing:.18em;text-transform:uppercase;color:var(--caramel-ink);margin-bottom:5px}
.notes{display:flex;flex-direction:column;gap:7px;margin-top:10px;padding-left:14px}
.notes div{display:flex;gap:9px;align-items:baseline;font:500 15px/1.3 var(--geist);color:var(--dim)}
.notes div::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--caramel);flex:none}
.legend{display:flex;justify-content:center;gap:14px;font:400 12px/1 var(--geist);color:var(--dim)}
.car{position:relative;overflow:visible}
.track{display:flex;gap:16px;will-change:transform}
.track .pg{flex:0 0 320px;width:320px;min-width:0}
.pg.dense .ph{padding-bottom:7px;margin-bottom:2px} .pg.dense .ph b{font-size:19px}
.pg.dense .row{padding-top:5px;padding-bottom:5px} .pg.dense .row.op{padding-top:6px;padding-bottom:6px}
.pg.dense .sn{font-size:16.5px;line-height:1.38;margin-top:6px} .pg.dense .row .fold{margin-top:3px}

.big{font:400 66px/.95 var(--anton);text-transform:uppercase}
.sub{font:400 20px/1.35 var(--geist);color:var(--dim)}
.go{align-self:flex-start;background:var(--sage);color:#fff;font:600 17px/1 var(--geist);padding:15px 22px;border-radius:999px;text-decoration:none}

/* controls — app only */
.ctl{width:min(100vw,460px);display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:12px 12px 4px;flex:none}
.ctl button,.ctl a{font:500 12.5px/1 var(--geist);color:#E9E4DB;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);padding:9px 12px;border-radius:999px;cursor:pointer;text-decoration:none}
.ctl button.on{background:#F3F1EC;color:#201E1C;border-color:#F3F1EC}
.ctl a{background:none;border-color:transparent;color:#B9B2A7}
.rec .ctl{display:none}
.veil{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:9;background:rgba(243,241,236,.84);backdrop-filter:blur(2px);font:600 15px/1 var(--geist);color:var(--ink)}
.veil[hidden]{display:none}
.veil .play{width:74px;height:74px;border-radius:50%;background:var(--ink);display:grid;place-items:center}
.veil .play::after{content:"";margin-left:6px;border-left:22px solid var(--paper);border-top:14px solid transparent;border-bottom:14px solid transparent}
.veil .vr{display:flex;gap:8px}
.veil .vr a,.veil .vr button{font:600 15px/1 var(--geist);padding:13px 18px;border-radius:999px;border:1.5px solid var(--ink);background:none;color:var(--ink);text-decoration:none;cursor:pointer}
.veil .vr a{background:var(--ink);color:#fff}
</style>
</head>
<body>
<div id="fit"><div id="stage">
  <div class="bars" id="bars"></div>
  <div class="lab" id="lab"></div>
  <div class="sc" id="sc"></div>
  <div class="brand"><b>INTUITY</b> · B2 First</div>
  <div class="veil" id="veil"><div class="play" id="vplay"></div><div id="vtx">Tap to watch</div><div class="vr" id="vrow" hidden></div></div>
</div></div>
<nav class="ctl" id="ctl"></nav>
<script>
(function(){
'use strict';
const Q=new URLSearchParams(location.search);
const TASK=Q.get('task')||'reviews', REC=Q.has('rec');
if(REC) document.documentElement.classList.add('rec');
const $=id=>document.getElementById(id);
const stage=$('stage'), fit=$('fit');
let D=null, SC=[], END=0, audio=null, playing=false, t0=0, tAt=0, to=Infinity, built=-1, part=-1;

function size(){
  const ch=REC?0:$('ctl').offsetHeight, k=Math.min(innerWidth/360,(innerHeight-ch)/640);
  fit.style.width=360*k+'px'; fit.style.height=640*k+'px'; stage.style.transform='scale('+k+')';
}
addEventListener('resize',size);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* {expression}  <name>  _linker_  → the three marks */
const mark=s=>s.replace(/\{([^}]*)\}|<([^>]*)>|_([^_]*)_|([^{<_]+)/g,(m,x,n,l,p)=>
  x!=null?'<span class="x">'+esc(x)+'</span>':n!=null?'<span class="nm">'+esc(n)+'</span>':l!=null?'<span class="lk">'+esc(l)+'</span>':esc(p));
const plain=s=>s.replace(/[{}<>_]/g,'');
const ease=p=>1-Math.pow(1-p,3), cl=v=>Math.min(1,Math.max(0,v));

/* one page of a review: open paragraphs in full, the others folded */
function page(M,open,opt){
  opt=opt||{};
  let h='<div class="pg'+(open.length>1?' dense':'')+'"><div class="ph"><b>'+esc(M.tag)+'</b>'+(opt.count?'<span><em>'+opt.count[0]+'</em> / '+opt.count[1]+'</span>':'<span>Review</span>')+'</div>';
  M.p.forEach((sents,i)=>{
    const lab=esc(D.paraLabels[i]);
    if(!open.includes(i)){ h+='<div class="row"><small>'+lab+'</small><div class="fold">'+esc(plain(sents.join(' ')))+'</div></div>'; return; }
    h+='<div class="row op"><small>'+lab+'</small>';
    if(opt.show){                       /* the voice builds it, sentence by sentence */
      sents.forEach((s,j)=>{ const k=i+'.'+j, t=opt.show[k]; if(t==null) return;
        const L=opt.labels&&opt.labels[k];
        h+='<span class="sn rv" data-t="'+(L?Math.min(L[1],t):t)+'">'+(L?'<i class="rv" data-t="'+L[1]+'">'+esc(L[0])+'</i>':'')
          +'<span class="rv" data-t="'+t+'">'+mark(s)+'</span></span>'; });
    }else h+='<div class="tx">'+sents.map(mark).join(' ')+'</div>';
    h+='</div>';
  });
  if(opt.notes) h+='<div class="notes">'+opt.notes.map(n=>'<div class="rv" data-t="'+n[1]+'">'+esc(n[0])+'</div>').join('')+'</div>';
  return h+'</div>';
}
function legend(c){
  const L=[['x','expression'],c===1?['lk','linker']:['nm','what is reviewed']];
  return '<div class="legend">'+L.map(([k,w])=>'<span><span class="'+k+'">'+w+'</span></span>').join('')+'</div>';
}

function build(i){
  const s=SC[i]; let h='';
  if(s.kind==='def'){
    h='<div class="mega rv" data-t="0.1">'+esc(s.big)+'</div><div class="words rv" data-t="'+s.wt+'">'+esc(s.words)+'</div>'
     +'<div class="k rv" data-t="'+s.for[0][1]+'">Written for</div><div class="chips">'+s.for.map(f=>'<span class="rv" data-t="'+f[1]+'">'+esc(f[0])+'</span>').join('')+'</div>'
     +'<div class="k rv" data-t="'+s.does[0][1]+'">It</div><div class="does">'+s.does.map(f=>'<div class="rv" data-t="'+f[1]+'">'+esc(f[0])+'</div>').join('')+'</div>';
  }else if(s.kind==='page'){
    h='<div class="rv" data-t="'+s.t+'">'+page(D.azul,s.open,{show:s.show,labels:s.labels,notes:s.notes})+'</div>'+legend(s.clip);
  }else if(s.kind==='car'){
    h='<div class="car"><div class="track" id="track">'+D.models.map((M,k)=>page(M,s.open,{count:[k+1,D.models.length]})).join('')+'</div></div>'+legend(s.clip);
  }else if(s.kind==='end'){
    h='<div class="big rv" data-t="'+s.t+'">'+esc(s.big)+'</div><div class="sub rv" data-t="'+(s.t+0.4)+'">'+esc(s.sub)+'</div>'
     +'<a class="go rv" data-t="'+(s.t+1.2)+'" href="'+(REC?'#':D.try)+'">'+esc(s.btn)+'</a>';
  }
  $('sc').innerHTML=h; built=i;
  $('lab').textContent=(s.clip+1)+' · '+D.parts[s.clip];
}

function draw(t){
  let i=0; while(i<SC.length-1&&t>=SC[i+1].t) i++;
  if(i!==built) build(i);
  const s=SC[i], nxt=i<SC.length-1?SC[i+1].t:1e9;
  const enter=ease(cl((t-s.t)/0.45)), leave=cl((nxt-t)/0.3), sc=$('sc');
  sc.style.opacity=Math.min(i===0?1:enter,leave); sc.style.transform='translateY('+((i===0?0:(1-enter)*16)-(1-leave)*8).toFixed(1)+'px)';
  sc.querySelectorAll('.rv').forEach(el=>{ const p=ease(cl((t-(+el.dataset.t))/0.45));
    el.style.opacity=p; el.style.transform=el.tagName==='SPAN'&&!el.classList.contains('sn')?'':'translateY('+((1-p)*10).toFixed(1)+'px)';
    if(el.tagName==='SPAN'&&!el.classList.contains('sn')) el.querySelectorAll('.nm').forEach(n=>n.style.setProperty('--nb',cl((t-(+el.dataset.t)-0.55)/0.4).toFixed(2))); });
  if(s.kind==='car'){
    const N=D.models.length, f=Math.max(0,t-s.t-0.6)/s.step, k=Math.min(N-1,Math.floor(f)), w=f-k;
    const x=k+(k<N-1?ease(cl((w*s.step-(s.step-0.5))/0.5)):0);
    $('track').style.transform='translateX('+(-x*336).toFixed(1)+'px)';
  }
  const bs=$('bars').children;
  D.clips.forEach(([a,b],p)=>{ bs[p].firstChild.style.width=(cl((t-a)/(b-a))*100)+'%'; });
}

/* the clock: the recording, or the wall clock if it cannot play */
const now=()=>audio&&!audio.paused&&audio.currentTime>0?audio.currentTime:audio&&playing&&audio.readyState<3?tAt:(playing?tAt+(performance.now()-t0)/1000:tAt);
function loop(){ if(!playing) return; const t=now(); draw(t); if(t>=to){ stop(); return; } requestAnimationFrame(loop); }
function play(a,b){
  to=b; tAt=a; playing=true; $('veil').hidden=true; t0=performance.now();
  if(audio){
    const A=audio, start=()=>{ A.currentTime=a; A.play().catch(()=>{ audio=null; t0=performance.now(); }); };
    if(A.readyState>=1) start(); else { A.addEventListener('loadedmetadata',start,{once:true}); A.load(); }
  }
  requestAnimationFrame(loop);
}
function pause(){ tAt=now(); playing=false; if(audio) audio.pause(); veil('Paused · tap to go on','pause'); }
function resume(){ if(audio){ audio.currentTime=tAt; audio.play(); } playing=true; t0=performance.now(); $('veil').hidden=true; requestAnimationFrame(loop); }
function stop(){ playing=false; if(audio) audio.pause(); tAt=to; if(!REC) veil(part<0?'That’s the whole review.':'End of clip '+(part+1)+'.','end'); }
function veil(txt,mode){
  const v=$('veil'), row=$('vrow'); v.hidden=false; $('vtx').textContent=txt; v.dataset.mode=mode;
  $('vplay').hidden=mode==='end'; row.hidden=mode!=='end';
  if(mode==='end'){
    const nx=part>=0&&part<D.parts.length-1?'<button type="button" id="vnext">Clip '+(part+2)+' ›</button>':'';
    row.innerHTML='<button type="button" id="again">↻ Again</button>'+nx+(part<0||part===D.parts.length-1?'<a href="'+D.try+'">Open the cards ›</a>':'');
    $('again').onclick=e=>{ e.stopPropagation(); go(part); };
    if($('vnext')) $('vnext').onclick=e=>{ e.stopPropagation(); go(part+1); };
  }
}
stage.onclick=e=>{
  if(e.target.closest('.vr')||e.target.closest('.go')) return;
  if(playing) return pause();
  const m=$('veil').dataset.mode; if(m==='pause') return resume(); go(part);
};
function go(p){
  part=p;
  [...$('ctl').querySelectorAll('button')].forEach(b=>b.classList.toggle('on',+b.dataset.p===p));
  if(p<0) play(0,END); else play(D.clips[p][0],D.clips[p][1]);
}

fetch('/data/writing/presentations/presentations.json').then(r=>r.json()).then(J=>{
  D=J[TASK]; if(!D){ document.body.textContent='No presentation yet.'; return; }
  SC=D.scenes; END=D.end; document.title='INTUITY — '+D.title;
  $('bars').innerHTML=D.clips.map(()=>'<i><b></b></i>').join('');
  if(D.audio&&!Q.has('silent')){
    /* held in memory, so jumping to clip 2 or 3 works on any server */
    audio=new Audio(D.audio); audio.preload='auto';
    fetch(D.audio).then(r=>r.blob()).then(bl=>{ if(!playing){ audio.src=URL.createObjectURL(bl); audio.load(); } }).catch(()=>{});
  }
  if(!REC){
    const back=(()=>{ try{ return JSON.parse(sessionStorage.getItem('intuity.sheetReturn')||'null'); }catch(e){ return null; } })();
    const c=$('ctl');
    c.innerHTML='<button data-p="-1" class="on">Watch it all</button>'+D.parts.map((p,i)=>'<button data-p="'+i+'">'+(i+1)+' · '+esc(p)+'</button>').join('')
      +'<a href="'+(back?back.url:'/skills/writing/gate.html?task='+TASK)+'">← back</a>';
    c.querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.p));
  }
  const sp=Q.get('part'); if(sp!==null&&D.parts[+sp]) part=+sp;
  size(); draw(part<0?14:D.clips[part][0]+3); veil(REC?'Tap to start':'Tap to watch','start');
  document.fonts.ready.then(()=>{ size(); window.WATCH.ready=true; });
});

window.WATCH={ready:false, seek:t=>{ $('veil').hidden=true; draw(t); }, get end(){ return END; }, get clips(){ return D.clips; }};
})();
</script>
</body>
</html>
