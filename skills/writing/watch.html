<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>INTUITY — Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..900&family=Geist+Mono:wght@400..600&family=Anton&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   WRITING — WATCH (28 Oct 2026, v4: the Model card, watched)

   The clip IS the card from the Model page — caramel label, Anton title,
   the expression line, "In the sample", "Wording 1 · Another wording →".
   The voice works through Wording 1 (Café Azul); after "Here are some
   more examples" the card turns to the next wordings by itself, one
   every six seconds, each with a soft tick — what the student's thumb
   will do later on the Model page.

   Infographic rules (restraint on purpose — B2 readers, second language):
     · size says what is FIXED: the expression is large and bold; the
       student's own words are smaller and quieter.
     · three marks: sage underlay = expression · caramel box = the thing
       reviewed · underline = linker, with an arrow showing how the next
       sentence follows on.
     · one movement at a time: the expression settles, then the sample.
   Every frame is a pure function of one clock t (the recording). ?rec=1
   hides the controls; window.WATCH.seek renders the MP4s.
   ═══════════════════════════════════════════════════════════════════════ */
:root{
  --paper:#F3F1EC; --card:#FBFAF7; --ink:#141210; --dim:#5C5852; --faint:#8C867E; --line:rgba(20,17,14,.16);
  --sage:#8AA79C; --sage-ink:#4F6B61; --caramel:#A9875F; --caramel-ink:#7A5C3A;
  --anton:'Anton',Impact,sans-serif; --geist:'Geist',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#201E1C;color:var(--ink);font-family:var(--geist);-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#fit{position:relative;flex:none}
#stage{position:absolute;left:0;top:0;width:360px;height:640px;transform-origin:0 0;background:var(--paper);overflow:hidden;cursor:pointer}
html.rec,html.rec body{background:var(--paper)}

.xc{position:absolute;top:9px;right:10px;z-index:10;width:30px;height:30px;border-radius:50%;background:rgba(20,17,14,.07);color:rgba(20,17,14,.55);display:grid;place-items:center;font:500 13px/1 var(--geist);text-decoration:none}
.rec .xc{display:none}
.bars{position:absolute;left:20px;right:52px;top:18px;display:flex;gap:5px;z-index:3}
.bars i{flex:1;height:3px;background:rgba(20,17,14,.12);border-radius:2px;overflow:hidden}
.bars i b{display:block;height:100%;width:0;background:var(--ink)}
.lab{position:absolute;left:20px;top:36px;z-index:3;font:600 9.5px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
.brand{position:absolute;left:20px;bottom:18px;z-index:3;font:500 9.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.brand b{color:var(--ink);font-weight:600}
.sc{position:absolute;left:16px;right:16px;top:56px;bottom:40px;display:flex;flex-direction:column;justify-content:center;gap:14px}

/* the marks */
.x{font-weight:680;font-size:1.06em;color:var(--ink);background:linear-gradient(transparent 60%,rgba(138,167,156,.45) 60%);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.own{font-size:.94em;color:#4A4540}
.nm{font-weight:650;font-size:1.02em;color:var(--ink);border:1.5px solid rgba(169,135,95,var(--nb,1));background:rgba(169,135,95,calc(var(--nb,1)*.14));border-radius:3px;padding:0 3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.lk{font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}

/* clip 1 opening */
.mega{font:400 92px/.86 var(--anton);text-transform:uppercase;letter-spacing:-.01em;padding:0 4px}
.words{font:400 28px/1 var(--anton);color:var(--caramel-ink);text-transform:uppercase;padding:0 4px}
.budget{padding:0 4px}
.budget .bar{display:flex;gap:3px;height:16px}
.budget .bar i{display:block;background:var(--sage);transform-origin:left center}
.budget .bar i:nth-child(1),.budget .bar i:nth-child(4){background:var(--caramel)}
.budget .bl{display:flex;gap:3px;margin-top:6px}
.budget .bl span{font:600 8.5px/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.budget .bl b{display:block;font:400 14px/1 var(--anton);color:var(--ink);letter-spacing:.02em;margin-bottom:3px}
.k{font:600 9.5px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-bottom:-6px;padding:0 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 4px}
.chips span{font:500 15px/1 var(--geist);padding:9px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.does{display:flex;flex-direction:column;gap:9px;padding:0 4px}
.does div{display:flex;gap:12px;align-items:baseline;font:500 19px/1.25 var(--geist)}
.does div::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--sage);flex:none;transform:translateY(-2px)}

/* THE CARD — as on the Model page */
.oc{display:flex;flex-direction:column;background:var(--card);padding:20px 18px 14px;box-shadow:0 1px 0 rgba(20,17,14,.05),0 22px 44px -28px rgba(20,17,14,.45)}
.ml{display:flex;align-items:center;gap:11px;font:600 10px/1 var(--mono);letter-spacing:.24em;text-transform:uppercase;color:#6B655C}
.ml::before{content:"";width:30px;height:9px;background:var(--caramel);flex:none}
.mt{margin-top:11px;padding-bottom:12px;border-bottom:1.5px solid var(--line);font:400 34px/1.02 var(--anton);letter-spacing:.005em}
.ex{padding:14px 0 12px;font:720 20px/1.38 var(--geist);color:var(--ink);transform-origin:left top}
.ex .sl{white-space:nowrap}
.ex .slot{display:inline-block;width:26px;height:9px;border-radius:5px;background:rgba(169,135,95,.38);margin:0 3px;vertical-align:middle}
.steps{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:18px 0 8px}
.steps div{display:grid;grid-template-columns:40px 1fr;align-items:baseline;font:500 21px/1.3 var(--geist)}
.steps b{font:400 34px/1 var(--anton);color:var(--sage-ink)}
.exl{margin-top:9px}
.exl:first-of-type{margin-top:0}
.exl small{display:block;font:600 9px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--caramel-ink);margin-bottom:5px}
.ex{font-size:16.5px;line-height:1.36;padding:12px 0 10px}
.rw .tx{font-size:16px;line-height:1.42}
.mt{font-size:30px}
.gf{display:inline-block;font:600 9.5px/1 var(--mono);font-style:normal;letter-spacing:.18em;text-transform:uppercase;color:#fff;background:var(--caramel);padding:6px 9px;border-radius:999px;margin-bottom:10px}
.smp.bare{border-top:0;padding-top:18px}
.smp.bare .rw .tx{font-size:18.5px}
.smp{flex:1;position:relative;padding:12px 0 6px;border-top:1px dashed var(--line)}
.rw{position:relative;padding-left:24px;margin-top:10px}
.rw:first-child{margin-top:0}
.rw small{display:block;font:600 9px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.rw.lnk small{color:var(--ink)}
.rw .tx{font:400 17px/1.48 var(--geist)}
.rw svg{position:absolute;left:3px;top:-12px;width:18px;height:30px;overflow:visible}
.rw svg path{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.rw .dot{position:absolute;left:6px;top:3px;width:7px;height:7px;border-radius:50%;background:var(--sage)}
.notes{display:flex;flex-direction:column;gap:6px;padding:8px 0 4px 24px}
.notes div{display:flex;gap:9px;align-items:baseline;font:500 14.5px/1.3 var(--geist);color:var(--dim)}
.notes div::before{content:"✓";font:700 13px/1 var(--geist);color:var(--sage-ink)}
.mf{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:12px;margin-top:8px;border-top:1.5px solid var(--line)}
.mf .wv{font:400 16px/1 var(--geist);color:#6B655C}
.mf .wv b{color:var(--ink);font-weight:800}
.mf .bt{display:flex;align-items:center;gap:12px}
.mf .bk{font:400 18px/1 var(--geist);color:#C6C0B6}
.mf .nx{background:var(--ink);color:#fff;border-radius:999px;padding:12px 16px;font:700 14px/1 var(--geist);white-space:nowrap}

.tname{font:400 50px/.95 var(--anton);text-transform:uppercase;padding:0 4px}
.qq{background:var(--card);padding:22px 20px 20px;border-left:6px solid var(--caramel);box-shadow:0 22px 44px -28px rgba(20,17,14,.45)}
.qq small{display:block;font:600 9.5px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
.qq p{font:700 23px/1.3 var(--geist);color:var(--ink)}
.qn{margin-top:18px;padding-top:14px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:8px}
.qn small{margin-bottom:2px}
.qn div{display:grid;grid-template-columns:30px 1fr;align-items:baseline;font:500 18px/1.3 var(--geist)}
.qn b{font:400 24px/1 var(--anton);color:var(--sage-ink)}
.big{font:400 66px/.95 var(--anton);text-transform:uppercase;padding:0 4px}
.sub{font:400 20px/1.35 var(--geist);color:var(--dim);padding:0 4px}
.go{align-self:flex-start;margin-left:4px;background:var(--sage);color:#fff;font:600 17px/1 var(--geist);padding:15px 22px;border-radius:999px;text-decoration:none}

/* controls — app only */
.ctl{width:min(100vw,460px);display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:12px 12px 4px;flex:none}
.ctl button,.ctl a{font:500 12.5px/1 var(--geist);color:#E9E4DB;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);padding:9px 12px;border-radius:999px;cursor:pointer;text-decoration:none}
.ctl button.on{background:#F3F1EC;color:#201E1C;border-color:#F3F1EC}
.ctl a{background:none;border-color:transparent;color:#B9B2A7}
.ctl a.rel{border-color:rgba(255,255,255,.22);color:#E9E4DB}
.rec .ctl{display:none}
.rec .bars{right:20px}
.veil{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:9;background:rgba(243,241,236,.84);backdrop-filter:blur(2px);font:600 15px/1 var(--geist);color:var(--ink)}
.veil[hidden]{display:none}
.veil .play{width:74px;height:74px;border-radius:50%;background:var(--ink);display:grid;place-items:center}
.veil .play::after{content:"";margin-left:6px;border-left:22px solid var(--paper);border-top:14px solid transparent;border-bottom:14px solid transparent}
.veil .vr{display:flex;gap:8px}
.veil .vr a,.veil .vr button{font:600 15px/1 var(--geist);padding:13px 18px;border-radius:999px;border:1.5px solid var(--ink);background:none;color:var(--ink);text-decoration:none;cursor:pointer}
.veil .vr a{background:var(--ink);color:#fff}
</style>
</head>
<body>
<div id="fit"><div id="stage">
  <div class="bars" id="bars"></div>
  <a class="xc" id="xc" href="#" aria-label="Close">✕</a>
  <div class="lab" id="lab"></div>
  <div class="sc" id="sc"></div>
  <div class="brand"><b>INTUITY</b> · B2 First</div>
  <div class="veil" id="veil"><div class="play" id="vplay"></div><div id="vtx">Tap to watch</div><div class="vr" id="vrow" hidden></div></div>
</div></div>
<nav class="ctl" id="ctl"></nav>
<script>
(function(){
'use strict';
const Q=new URLSearchParams(location.search);
const TASK=Q.get('task')||'reviews', REC=Q.has('rec');
if(REC) document.documentElement.classList.add('rec');
const $=id=>document.getElementById(id);
const stage=$('stage'), fit=$('fit');
let D=null, SC=[], END=0, audio=null, playing=false, t0=0, tAt=0, to=Infinity, built=-1, wk=-1, part=-1;

function size(){
  const ch=REC?0:$('ctl').offsetHeight, k=Math.min(innerWidth/360,(innerHeight-ch)/640);
  fit.style.width=360*k+'px'; fit.style.height=640*k+'px'; stage.style.transform='scale('+k+')';
}
addEventListener('resize',size);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* {expression}  <name>  _linker_  plain = the writer's own words */
const mark=s=>s.replace(/\{([^}]*)\}|<([^>]*)>|_([^_]*)_|([^{<_]+)/g,(m,x,n,l,p)=>
  x!=null?'<span class="x">'+esc(x)+'</span>':n!=null?'<span class="nm">'+esc(n)+'</span>':l!=null?'<span class="lk">'+esc(l)+'</span>':'<span class="own">'+esc(p)+'</span>');
const frame=s=>esc(s).replace(/…([,.]?)/g,'<span class="sl"><span class="slot"></span>$1</span>');
const ease=p=>1-Math.pow(1-p,3), cl=v=>Math.min(1,Math.max(0,v));
const ARROW='<svg viewBox="0 0 18 30"><path d="M4 0 V14 Q4 22 12 22 H15"/><path d="M11 18 L15 22 L11 26"/></svg>';

/* the card body for one wording */
function wording(s,k){
  const w=s.w[k];
  let h='<div class="ml">'+esc(w.label)+'</div><div class="mt">'+esc(w.head)+'</div>';
  if(w.steps){                      /* the explanation: what this paragraph does, step by step */
    h+='<div class="steps">'+w.steps.map((x,j)=>'<div class="rv" data-t="'+x[1]+'"><b>'+(j+1)+'</b><span>'+esc(x[0])+'</span></div>').join('')+'</div>';
    return h;
  }
  /* the expression lines; a card whose sentences ARE the expressions (Email) shows none */
  if(w.ex.length||w.tag) h+='<div class="ex rv" data-t="'+w.t+'" data-settle="1">'+(w.tag?'<em class="gf">'+esc(w.tag)+'</em>':'')
    +w.ex.map(e=>'<div class="exl"><small>'+esc(e[0])+'</small>'+frame(e[1])+'</div>').join('')+'</div>';
  h+='<div class="smp'+(w.ex.length?'':' bare')+'">';
  w.rows.forEach(r=>{
    const lnk=/^_/.test(r[2]);
    h+='<div class="rw'+(lnk?' lnk':'')+' rv" data-t="'+r[1]+'">'+(lnk?ARROW:'<span class="dot"></span>')
      +(r[0]?'<small>'+esc(r[0])+'</small>':'')
      +'<div class="tx" data-nm="1" data-t="'+r[1]+'">'+mark(r[2])+'</div></div>';
  });
  h+='</div>';
  const n=s.w.filter(x=>!x.steps).indexOf(w)+1;
  h+='<div class="mf"><span class="wv">'+(w.foot?'<b>'+esc(w.foot)+'</b>':w.tag?'<b>'+esc(w.tag)+'</b>':'Wording <b>'+n+'</b>')+'</span><span class="bt"><span class="bk">←</span><span class="nx" id="nx">Another wording →</span></span></div>';
  return h;
}

function build(i){
  const s=SC[i]; let h='';
  if(s.kind==='def'){
    const tot=s.budget.reduce((a,b)=>a+b[1],0);
    h='<div class="mega rv" data-t="0.1">'+esc(s.big)+'</div><div class="words rv" data-t="'+s.wt+'">'+esc(s.words)+'</div>'
     +'<div class="budget rv" data-t="'+s.bt+'"><div class="bar">'+s.budget.map((b,j)=>'<i data-g="'+(s.bt+j*0.25)+'" style="flex:'+b[1]+'"></i>').join('')+'</div>'
     +'<div class="bl">'+s.budget.map(b=>'<span style="flex:'+b[1]+'"><b>~'+b[1]+'</b>'+esc(b[0])+'</span>').join('')+'</div></div>'
     +'<div class="k rv" data-t="'+s.for[0][1]+'">'+esc(s.forLabel||'Written for')+'</div><div class="chips">'+s.for.map(f=>'<span class="rv" data-t="'+f[1]+'">'+esc(f[0])+'</span>').join('')+'</div>'
     +'<div class="k rv" data-t="'+s.does[0][1]+'">'+esc(s.doesLabel||'It')+'</div><div class="does">'+s.does.map(f=>'<div class="rv" data-t="'+f[1]+'">'+esc(f[0])+'</div>').join('')+'</div>';
  }else if(s.kind==='type'){       /* an essay type: its name, what its body does, the question */
    h='<div class="tname rv" data-t="'+s.t+'">'+esc(s.big)+'</div><div class="sub rv" data-t="'+s.st+'">'+esc(s.sub)+'</div>'
     +'<div class="qq rv" data-t="'+s.qt+'"><small>'+esc(s.k)+'</small><p>'+esc(s.q)+'</p></div>';
  }else if(s.kind==='q'){          /* the exam question, with its notes */
    h='<div class="qq rv" data-t="'+s.t+'"><small>'+esc(s.k)+'</small><p class="rv" data-t="'+s.qt+'">'+esc(s.q)+'</p>'
     +(s.notes&&s.notes.length?'<div class="qn"><small class="rv" data-t="'+s.notes[0][1]+'">'+esc(s.notesLabel||'Notes')+'</small>'+s.notes.map((n,j)=>'<div class="rv" data-t="'+n[1]+'"><b>'+(s.notes.length>1?j+1:'“')+'</b>'+esc(n[0])+'</div>').join('')+'</div>':'')+'</div>';
  }else if(s.kind==='card'){
    h='<div class="oc rv" data-t="'+s.t+'" id="oc"></div>'; wk=-1;
  }else if(s.kind==='end'){
    h='<div class="big rv" data-t="'+s.t+'">'+esc(s.big)+'</div><div class="sub rv" data-t="'+(s.t+0.4)+'">'+esc(s.sub)+'</div>'
     +'<a class="go rv" data-t="'+(s.t+1.2)+'" href="'+(REC?'#':D.try)+'">'+esc(s.btn)+'</a>';
  }
  $('sc').innerHTML=h; built=i;
  $('lab').textContent=(s.clip+1)+' · '+D.parts[s.clip];
}

function draw(t){
  let i=0; while(i<SC.length-1&&t>=SC[i+1].t) i++;
  if(i!==built) build(i);
  const s=SC[i], nxt=i<SC.length-1?SC[i+1].t:1e9, sc=$('sc');
  if(s.kind==='card'){
    let k=0; while(k<s.w.length-1&&t>=s.w[k+1].t-0.3) k++;
    if(built===i&&s._h==null){ /* the card keeps one height for all its wordings: only the words change */
      const oc=$('oc'); let mx=0; s.w.forEach((w,j)=>{ oc.innerHTML=wording(s,j); mx=Math.max(mx,oc.offsetHeight); });
      s._h=mx; wk=-1; }
    $('oc').style.minHeight=s._h+'px';
    if(k!==wk){ $('oc').innerHTML=wording(s,k); wk=k; }
  }
  const enter=ease(cl((t-s.t)/0.45)), leave=cl((nxt-t)/0.3);
  sc.style.opacity=Math.min(i===0?1:enter,leave); sc.style.transform='translateY('+((i===0?0:(1-enter)*16)-(1-leave)*8).toFixed(1)+'px)';
  sc.querySelectorAll('.rv').forEach(el=>{
    const t1=+el.dataset.t, p=ease(cl((t-t1)/0.45));
    el.style.opacity=p;
    if(el.dataset.settle) el.style.transform='scale('+(1+0.05*(1-ease(cl((t-t1)/0.6)))).toFixed(4)+')';
    else if(!el.classList.contains('oc')) el.style.transform='translateY('+((1-p)*8).toFixed(1)+'px)';
  });
  /* the caramel box settles a moment after its sentence appears */
  sc.querySelectorAll('[data-nm]').forEach(el=>{ const t1=+el.dataset.t; el.querySelectorAll('.nm').forEach(n=>n.style.setProperty('--nb',cl((t-t1-0.9)/0.4).toFixed(2))); });
  sc.querySelectorAll('[data-g]').forEach(el=>{ el.style.transform='scaleX('+ease(cl((t-(+el.dataset.g))/0.5)).toFixed(3)+')'; });
  /* the old wording leaves just before the next one: the pill "presses" */
  if(s.kind==='card'&&$('nx')){
    const n=s.w[wk+1], dt=n?n.t-t:9, press=n&&!n.steps&&wk>=0&&!s.w[wk].steps&&dt<0.55&&dt>0?Math.sin((0.55-dt)/0.55*Math.PI):0;
    $('nx').style.transform='scale('+(1-0.07*press).toFixed(3)+')';
    if(n&&dt<0.3) $('oc').querySelectorAll('.ex,.smp,.notes').forEach(el=>el.style.opacity=Math.min(+el.style.opacity||1,dt/0.3));
  }
  const bs=$('bars').children;
  D.clips.forEach(([a,b],p)=>{ bs[p].firstChild.style.width=(cl((t-a)/(b-a))*100)+'%'; });
}

/* the clock: the recording, or the wall clock if it cannot play */
const now=()=>audio&&!audio.paused&&audio.currentTime>0?audio.currentTime:audio&&playing&&audio.readyState<3?tAt:(playing?tAt+(performance.now()-t0)/1000:tAt);
function loop(){ if(!playing) return; const t=now(); draw(t); if(t>=to){ stop(); return; } requestAnimationFrame(loop); }
function play(a,b){
  to=b; tAt=a; playing=true; $('veil').hidden=true; t0=performance.now();
  if(audio){
    const A=audio, start=()=>{ A.currentTime=a; A.play().catch(()=>{ audio=null; t0=performance.now(); }); };
    if(A.readyState>=1) start(); else { A.addEventListener('loadedmetadata',start,{once:true}); A.load(); }
  }
  requestAnimationFrame(loop);
}
function pause(){ tAt=now(); playing=false; if(audio) audio.pause(); veil('Paused · tap to go on','pause'); }
function resume(){ if(audio){ audio.currentTime=tAt; audio.play(); } playing=true; t0=performance.now(); $('veil').hidden=true; requestAnimationFrame(loop); }
function stop(){ playing=false; if(audio) audio.pause(); tAt=to; if(!REC) veil(part<0?'That’s the whole review.':'End of clip '+(part+1)+'.','end'); }
function veil(txt,mode){
  const v=$('veil'), row=$('vrow'); v.hidden=false; $('vtx').textContent=txt; v.dataset.mode=mode;
  $('vplay').hidden=mode==='end'; row.hidden=mode!=='end';
  if(mode==='end'){
    const nx=part>=0&&part<D.parts.length-1?'<button type="button" id="vnext">Clip '+(part+2)+' ›</button>':'';
    row.innerHTML='<button type="button" id="again">↻ Again</button>'+nx+(part<0||part===D.parts.length-1?'<a href="'+D.try+'">Open the cards ›</a>':'');
    $('again').onclick=e=>{ e.stopPropagation(); go(part); };
    if($('vnext')) $('vnext').onclick=e=>{ e.stopPropagation(); go(part+1); };
  }
}
stage.onclick=e=>{
  if(e.target.closest('.vr')||e.target.closest('.go')||e.target.closest('.xc')) return;
  if(playing) return pause();
  const m=$('veil').dataset.mode; if(m==='pause') return resume(); go(part);
};
function go(p){
  part=p;
  [...$('ctl').querySelectorAll('button')].forEach(b=>b.classList.toggle('on',+b.dataset.p===p));
  if(p<0) play(0,END); else play(D.clips[p][0],D.clips[p][1]);
}

fetch('/data/writing/presentations/presentations.json?v=5').then(r=>r.json()).then(J=>{
  D=J[TASK]; if(!D){ document.body.textContent='No presentation yet.'; return; }
  SC=D.scenes; END=D.end; document.title='INTUITY — '+D.title;
  $('bars').innerHTML=D.clips.map(()=>'<i><b></b></i>').join('');
  if(D.audio&&!Q.has('silent')){
    /* held in memory, so jumping to clip 2 or 3 works on any server */
    audio=new Audio(D.audio); audio.preload='auto';
    fetch(D.audio).then(r=>r.blob()).then(bl=>{ if(!playing){ audio.src=URL.createObjectURL(bl); audio.load(); } }).catch(()=>{});
  }
  if(!REC){
    const back=(()=>{ try{ return JSON.parse(sessionStorage.getItem('intuity.sheetReturn')||'null'); }catch(e){ return null; } })();
    const c=$('ctl');
    c.innerHTML='<button data-p="-1" class="on">Watch it all</button>'+(D.parts.length<2?[]:D.parts).map((p,i)=>'<button data-p="'+i+'">'+(i+1)+' · '+esc(p)+'</button>').join('')
      ;
    const xc=$('xc'); xc.href=back?back.url:'/skills/writing/gate.html?task='+TASK;
    xc.onclick=e=>{ e.stopPropagation(); if(audio) audio.pause(); };
    if(D.related) c.insertAdjacentHTML('beforeend','<a class="rel" href="?task='+encodeURIComponent(D.related.task)+'">'+esc(D.related.label)+'</a>');
    c.querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.p));
  }
  const sp=Q.get('part'); if(sp!==null&&D.parts[+sp]) part=+sp;
  size(); draw(part<0?15:D.clips[part][0]+3); veil(REC?'Tap to start':'Tap to watch','start');
  document.fonts.ready.then(()=>{ SC.forEach(x=>x._h=null); built=-1; draw(tAt||(part<0?15:D.clips[part][0]+3)); size(); window.WATCH.ready=true; });
});

window.WATCH={ready:false, seek:t=>{ $('veil').hidden=true; draw(t); }, get end(){ return END; }, get clips(){ return D.clips; }};
})();
</script>
</body>
</html>
