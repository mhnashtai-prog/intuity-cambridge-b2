<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F3F1EC">
<title>INTUITY — Essay Workout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..900&family=Geist+Mono:wght@500;600&family=Anton&display=swap" rel="stylesheet">
<style>
/* ═══ ESSAY WORKOUT (26 Oct 2026) ═════════════════════════════════════════
   The lesson from Complete First: a student learns by DOING something with
   a real question, not by reading lists. Three tap-only rounds on one exam
   question, one screen each, in the INTUITY card language (six since 26 Oct,
   with the topic-sentence round every coursebook drills):
     1 Which ideas belong?      — relevance to THIS question and its notes
     2 Which introduction works? — a real intro vs a weak one, with the why
     3 Fill the model           — choose the phrase each gap NEEDS (reason,
                                  example, result, opinion …)
   No new content: questions, notes and ideas from essay-questions.json;
   introductions and paragraphs from the 25 sample essays (samples.json),
   whose phrases are already tagged by function. Nothing to type. */
:root{--paper:#F3F1EC;--card:#FAF8F5;--ink:#232C31;--soft:#3A3F44;--quiet:#6B655C;--faint:#8A8378;--chip:#E7E3DC;--chipH:#DDD8CF;
  --cara:#A9875F;--sage:#4F6F65;--ok:#E1EDE7;--okInk:#2F5A4B;--no:#F6E3DA;--noInk:#8A3C1E}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'Geist',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.ihead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;max-width:980px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + .6rem) 16px .5rem}
.back{justify-self:start;font:700 11px/1 'Geist',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#756B6E;text-decoration:none;padding:10px 4px}
.wordmark{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.app-title{font-size:1.09rem;font-weight:900;letter-spacing:.2em}
.app-subtitle{font-size:.6875rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#5C5852;margin-top:.1rem}
.lvl{justify-self:end;font:600 .6875rem/1 'Geist Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:#756B6E;background:#E8E1D6;border-radius:6px;padding:.4rem .65rem}
.lvl b{color:#4A433D}
.rounds{display:flex;justify-content:center;gap:28px;max-width:980px;margin:4px auto 0;padding:0 16px;border-bottom:1px solid rgba(20,17,14,.12)}
.rounds span{font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#6B655C;padding:8px 0;border-bottom:2.5px solid transparent}
.rounds span.on{color:var(--ink);border-bottom-color:var(--sage)}
.rounds span.done{color:var(--okInk)}
.rounds i{font-style:normal}
@media (max-width:640px){ .rounds i{display:none} }
main{max-width:980px;margin:0 auto;padding:16px 16px 120px}
.card{background:var(--card);border-radius:3px;box-shadow:0 1px 2px rgba(20,17,14,.05),0 8px 22px rgba(20,17,14,.035);padding:20px 24px 22px;margin:0 0 16px}
.lab{display:flex;align-items:center;gap:12px;font:600 11.5px/1 'Geist Mono',monospace;letter-spacing:.24em;text-transform:uppercase;color:var(--faint);margin:0 0 12px}
.lab::before{content:'';width:28px;height:10px;background:var(--cara);flex:none}
h1{margin:0 0 6px;font:400 clamp(26px,4.4vw,40px)/1 'Anton',Impact,sans-serif;letter-spacing:.005em}
.ask{margin:0 0 4px;font-size:17px;line-height:1.45}
.notes{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--quiet)}
.notes li::before{content:'·';margin-right:6px;color:var(--faint)}
.do{margin:2px 0 14px;font-size:14.5px;color:var(--quiet)}
.do b{color:var(--ink);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:none;background:var(--chip);border-radius:999px;padding:10px 16px;font-size:15px;font-weight:500;cursor:pointer;text-align:left;line-height:1.3;transition:background .15s,transform .12s cubic-bezier(.2,1.4,.4,1)}
.chip:hover{background:var(--chipH)}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:var(--ink);color:#FAF8F5}
.chip.ok{background:var(--ok);color:var(--okInk)}
.chip.ok[aria-pressed="true"]{background:var(--okInk);color:#fff}
.chip.no{background:var(--no);color:var(--noInk)}
.chip.miss{background:transparent;box-shadow:inset 0 0 0 1.5px var(--okInk);color:var(--okInk)}
.chip:disabled{cursor:default}
.intros{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.intro{display:flex;flex-direction:column;justify-content:flex-start;border:none;text-align:left;cursor:pointer;background:#fff;border-radius:8px;padding:16px 18px;font-size:15px;line-height:1.55;color:var(--soft);
  box-shadow:inset 0 0 0 1.5px rgba(20,17,14,.1);transition:box-shadow .15s,transform .12s cubic-bezier(.2,1.4,.4,1)}
.intro:hover{box-shadow:inset 0 0 0 1.5px rgba(20,17,14,.3)}
.intro:active{transform:scale(.99)}
.intro .tag{display:block;font:600 10.5px/1 'Geist Mono',monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
.intro.ok{box-shadow:inset 0 0 0 2px var(--okInk);background:var(--ok)}
.intro.no{box-shadow:inset 0 0 0 2px var(--noInk);background:var(--no)}
.why{margin:14px 0 0;font-size:14.5px;line-height:1.5;color:var(--soft)}
.why b{color:var(--ink)}
.para{font-size:16.5px;line-height:1.9;color:var(--soft);margin:0}
.gap{display:inline-flex;align-items:center;min-width:120px;justify-content:center;border:none;background:var(--chip);border-radius:6px;padding:1px 12px;
  font:inherit;font-weight:600;color:var(--faint);cursor:pointer;vertical-align:baseline}
.gap.on{background:var(--ink);color:#FAF8F5}
.gap.filled{color:var(--ink);background:#EDE7DD}
.gap.ok{background:var(--ok);color:var(--okInk)}
.gap.no{background:var(--no);color:var(--noInk);text-decoration:line-through}
.picker{margin:14px 0 0;padding-top:12px;border-top:1px solid rgba(20,17,14,.08)}
.picker .do{margin-bottom:10px}
.lk{margin:0 0 14px;padding:0 0 12px;border-bottom:1px solid rgba(20,17,14,.07)}
.lk .para{margin:0 0 8px;font-size:16px;line-height:1.7}
.lk .prev{color:var(--faint)}
.lk .chip{padding:7px 14px;font-size:14px}
b.gap{cursor:default;min-width:70px}
.fix{font-size:13px;font-weight:600;color:var(--okInk);margin:0 2px}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:rgba(243,241,236,.94);backdrop-filter:blur(8px);border-top:1px solid rgba(20,17,14,.1)}
.btn{border:none;border-radius:999px;padding:12px 24px;font-size:14.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;background:var(--chip);color:var(--ink)}
.btn.main{background:var(--ink);color:#FAF8F5}
.btn:disabled{opacity:.4;cursor:default}
.score{text-align:center;padding:10px 0 4px}
.score b{display:block;font:400 64px/1 'Anton',Impact,sans-serif}
.score p{margin:8px 0 0;color:var(--quiet);font-size:15px}
.state{text-align:center;color:var(--faint);padding:60px 0}
@media (max-width:640px){
  .card{padding:16px 16px 18px}
  .intros{grid-template-columns:1fr}
  .rounds{gap:14px}.rounds span{font-size:11px}
  .chip{font-size:14px;padding:9px 13px}
  .para{font-size:15.5px}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>
<header class="ihead">
  <a class="back" href="/skills/writing/gate.html?task=essays" target="_top">← Essay</a>
  <div class="wordmark"><div class="app-title">INTUITY</div><div class="app-subtitle">Workout</div></div>
  <span class="lvl">Level <b>B2</b></span>
</header>
<nav class="rounds" id="rounds" aria-label="Rounds"><span><i>1 · </i>Ideas</span><span><i>2 · </i>Intro</span><span><i>3 · </i>Topic</span><span><i>4 · </i>Model</span><span><i>5 · </i>End</span><span><i>6 · </i>Link</span></nav>
<main id="main"><p class="state">Loading…</p></main>
<div class="bar"><button class="btn" id="newQ" type="button">New question</button><button class="btn main" id="go" type="button" disabled>Check</button></div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=(a,n)=>shuffle(a).slice(0,n);
const BASE='/skills/writing/essays/data/';
const NUM={This:'s',It:'s',They:'p',These:'p',this:'s',it:'s',they:'p',these:'p'};
let QS=[], SM={}, Q=null, S=null, round=0, checked=false, score=0, state={};

/* the function each tagged phrase does, in words a student uses */
/* what a phrase DOES, read from its words (the samples' tags lump reason
   with result, example with "Moreover") — gaps and wrong answers must do
   clearly different jobs, or a "wrong" answer would be right */
const FN={reason:'gives a reason',result:'gives a result',example:'gives an example',contrast:'shows the other side',opinion:'gives your opinion',conclusion:'concludes'};
function job(t){ t=t.toLowerCase();
  if(/^(in conclusion|to sum up|overall|all in all|on balance|to conclude|taking everything)/.test(t)) return 'conclusion';
  if(/^(however|although|even though|despite|nevertheless|on the other hand|whereas|while|in contrast|admittedly)/.test(t)) return 'contrast';
  if(/^(for example|for instance|such as|in particular|especially|a clear example|take)/.test(t)) return 'example';
  if(/^(as a result|consequently|therefore|hence|thus|this means|this leads|for this reason)/.test(t)) return 'result';
  if(/^(this is because|because|this is due|due to|owing to|since|given that|the reason)/.test(t)) return 'reason';
  if(/(i firmly believe|in my (view|opinion)|from my (point of view|perspective)|it seems to me|as far as i|personally|i am convinced|i believe|i think)/.test(t)) return 'opinion';
  return null; }

function paras(sample,style){
  const h=(sample.styles[style]||sample.styles.default);
  return [...h.matchAll(/<p>([\s\S]*?)<\/p>/g)].map(m=>m[1]);
}
const strip=h=>h.replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();

function newQuestion(){
  const pool=QS.filter(q=>SM[q.id]&&(!Q||q.id!==Q.id));
  Q=pool[Math.floor(Math.random()*pool.length)]; S=SM[Q.id];
  round=0; score=0; build(); draw();
}
function build(){
  /* round 1: 5 ideas that answer this question, 3 from other questions */
  const right=[...(Q.points||[]).map(p=>p.phrase),...pick(Q.suggestedOwnIdeas||[],2)].filter(Boolean).slice(0,5);
  const others=QS.filter(q=>q.id!==Q.id&&(q.relatedTopics||[]).every(t=>!(Q.relatedTopics||[]).includes(t)));
  const wrong=pick(others.flatMap(q=>(q.points||[]).map(p=>p.phrase)),3);
  state.ideas=shuffle([...right.map(t=>({t,ok:true})),...wrong.map(t=>({t,ok:false}))]);
  state.sel=new Set();
  /* round 2: the sample's own introduction vs a weak one */
  const good=strip(paras(S,'default')[0]||'');
  const weakers=[
    {t:`${Q.mainQuestion.replace(/^'|'$/g,'').replace(/^‘|’$/g,'')} This is an interesting question and in this essay I am going to write about it.`,
     why:'It copies the question and says nothing new. The examiner learns nothing about your view, and copied words don’t count towards your 140–190.'},
    {t:`Nowadays, there are many important things in the world, and people have different ideas about a lot of them. In this essay I will talk about some of these things.`,
     why:'It never names the topic. An introduction must show the reader exactly which question you are answering.'},
    {t:strip(paras(SM[pick(QS.filter(q=>q.id!==Q.id&&SM[q.id]),1)[0].id],'default')[0]||''),
     why:'Good English — but it introduces a different question. Every sentence must answer the question you were given.'}];
  const w=pick(weakers,1)[0];
  state.intros=shuffle([{t:good,ok:true},{t:w.t,ok:false,why:w.why}]);
  state.introPick=null;
  /* round 3 (26 Oct): which sentences could OPEN this paragraph? Any that
     fits counts — the point is fixed, the frame is the student's choice.
     Right: the sample's own topic sentence + the same point in other frames.
     Wrong: the opening of a DIFFERENT paragraph of the same essay. */
  (function(){
    const bp=paras(S,'default').slice(1,-1).map(strip).filter(Boolean);
    const first=t=>(t.match(/^[^.!?]+[.!?]/)||[t])[0];
    const LEAD=/^(Firstly|First of all|To begin with|To start with|In the first place|Secondly|Moreover|In addition|Furthermore|What is more|On the other hand|However|Finally|Lastly|Thirdly),\s*/i;
    const body=bp[0]||'', real=first(body), rest=body.slice(real.length).trim();
    const lead=(real.match(LEAD)||[])[1]||'Firstly';
    const stemW=w=>w.replace(/(ing|ed|es|s|ly|ment|ness|ity|al)$/,'').slice(0,6);
    const cw=t=>(t.toLowerCase().match(/[a-z]{4,}/g)||[]).map(stemW);
    const bw=new Set(cw(body)), ow=new Set(cw(bp.slice(1).join(' ')));
    /* the point that matches THIS paragraph better than the others */
    const pts=(Q.points||[]).filter(p=>p.clause).map(p=>{ const w=cw(p.clause); return {c:p.clause.replace(/\.$/,''),n:w.filter(x=>bw.has(x)).length,d:w.filter(x=>bw.has(x)).length-w.filter(x=>ow.has(x)).length}; })
      .sort((a,b)=>b.d-a.d||b.n-a.n);
    if(pts[0]&&pts[0].d<=0) pts[0].n=0;
    const opts=[{t:real,ok:true}];
    if(pts.length&&pts[0].n>0){ const c=pts[0].c;
      opts.push({t:`${lead}, it is widely believed that ${c}.`,ok:true},{t:`${lead}, one strong argument is that ${c}.`,ok:true}); }
    const other=bp[1]?first(bp[1]):((pts[1]&&`${lead}, it is often argued that ${pts[1].c}.`)||'');
    if(other) opts.push({t:other,ok:false,why:'opens a different paragraph of this essay — it makes another point'});
    const exS=(rest.match(/(?:^|\s)((?:For example|For instance)[^.!?]*[.!?])/)||[])[1];
    if(opts.length<4&&exS) opts.push({t:exS,ok:false,why:'is an example — a paragraph opens with its point, then shows it'});
    state.topic={rest,opts:shuffle(opts),sel:new Set()};
  })();
  /* round 4: a body paragraph with three phrases taken out */
  /* the body paragraph (any style) with the most phrases that do a clear job */
  /* the samples tag only some linking phrases: tag the untagged ones too */
  const PLAIN=/(^|[.!?]\s+|,\s+)(This is because|For example|For instance|As a result|Consequently|Therefore|However|Nevertheless|In my opinion|In my view|Personally,? I (?:believe|think) that|I firmly believe that|In particular)(?=[\s,])/g;
  const tagPlain=h=>h.split(/(<span class='\w+'>[^<]*<\/span>)/).map(seg=>seg.startsWith('<span')?seg:seg.replace(PLAIN,(m,pre,ph)=>pre+"<span class='x'>"+ph+"</span>")).join('');
  const bodies=['default','alternative1','alternative2'].flatMap(st=>{ const ps=paras(S,st); return ps.slice(1,-1).map(tagPlain); });
  const body=bodies.map(b=>({b,n:Math.min(3,[...b.matchAll(/<span class='\w+'>([^<]+)<\/span>/g)].filter(m=>job(m[1])).length)+Math.random()*.5}))
    .sort((x,y)=>y.n-x.n)[0]?.b||'';
  const spans=[...body.matchAll(/<span class='(\w+)'>([^<]+)<\/span>/g)].map((m,i)=>({cls:job(m[2]),t:m[2],i,a:m.index,b:m.index+m[0].length}));
  /* three gaps, never next to each other */
  const cand=shuffle(spans.filter(x=>FN[x.cls])), chosen=[];
  cand.forEach(x=>{ if(chosen.length<3&&chosen.every(c=>(x.a>c.b?x.a-c.b:c.a-x.b)>40)) chosen.push(x); });
  const gapIdx=new Set(chosen.map(x=>x.i));
  let k=-1, g=0; state.gaps=[];
  state.para=body.replace(/<span class='(\w+)'>([^<]+)<\/span>/g,(m,cls,t)=>{ k++; if(!gapIdx.has(k)) return esc(t);
    const id=g++; state.gaps.push({id,cls:job(t),t,ans:null}); return `<button type="button" class="gap" data-g="${id}">…</button>`; })
    .replace(/<[^>]+>(?!\s*…)/g,m=>m.startsWith('<button')||m.startsWith('</button')?m:'');
  /* options: each right phrase + phrases that do a DIFFERENT job */
  const all=Object.values(SM).flatMap(s=>[...((s.styles.default)||'').matchAll(/<span class='(\w+)'>([^<]+)<\/span>/g)].map(m=>({cls:job(m[2]),t:m[2].trim()})));
  const opts=new Map();
  const used=new Set(state.gaps.map(g=>g.cls));
  state.gaps.forEach(gp=>opts.set(gp.t,gp));
  const seen=new Set(); const wrongOpts=shuffle(all.filter(x=>x.cls&&!used.has(x.cls)&&x.t.length<34&&!seen.has(x.t.toLowerCase())&&seen.add(x.t.toLowerCase())));
  wrongOpts.slice(0,Math.max(3,state.gaps.length*2)).forEach(x=>{ if(!opts.has(x.t)) opts.set(x.t,null); });
  state.opts=shuffle([...opts.keys()]).slice(0,Math.max(6,state.gaps.length*3));
  state.gaps.forEach(gp=>{ if(!state.opts.includes(gp.t)) state.opts[Math.floor(Math.random()*state.opts.length)]=gp.t; });
  state.active=0;
  /* round 4: the sample's own conclusion vs a weak one (Unit 11's comments) */
  const ends=paras(S,'default'); const realEnd=strip(ends[ends.length-1]||'');
  const firstEnd=(realEnd.match(/^[^.!?]+[.!?]/)||[realEnd])[0];
  const other=pick(QS.filter(q=>q.id!==Q.id&&(q.points||[]).length),1)[0];
  const weakEnds=[
    {t:`${firstEnd} Also, I think ${(other.points[0].clause||'').replace(/^./,c=>c.toLowerCase())}.`,
     why:'It ends with a new idea. You can’t support it with reasons or examples in the last sentence — and it isn’t even about this question.'},
    {t:`To summarise, there are good and bad things about ${Q.topicPhrase||'this topic'}, and everyone has a different opinion about it.`,
     why:'It gives no opinion and no reasons. The question asks for YOUR view — the conclusion must state it and sum up why.'},
    {t:`In conclusion, that is everything I wanted to say about ${Q.topicPhrase||'this topic'}. Thank you for reading my essay.`,
     why:'It doesn’t sum up anything. A conclusion repeats your opinion briefly and the main reasons for it.'}];
  const we=pick(weakEnds,1)[0];
  state.ends=shuffle([{t:realEnd,ok:true},{t:we.t,ok:false,why:we.why}]);
  /* round 5: linking back — This / It / They / These (Unit 14) */
  /* "It is / was / seems … that" is usually a dummy it that points at nothing: skip every It + be/seem start */
  const DUMMY=/^It (is|was|seems|appears|has been|had been|would be|could be|can be|will be|might be|may be|must be|should be|remains)\b/;
  const pairs=[];
  ['default','alternative1','alternative2'].forEach(st=>paras(S,st).forEach(pa=>{ const sents=strip(pa).split(/(?<=[.!?])\s+/);
    sents.forEach((sn,i)=>{ if(i===0) return;
      const m=sn.match(/^(This|These|It|They)\s/); if(m&&!DUMMY.test(sn)) pairs.push({prev:sents[i-1],pre:'',w:m[1],rest:sn.slice(m[1].length)});
      /* mid-sentence they / these (almost always point back) */
      const mm=sn.match(/^(.{12,}?[a-z,])\s(they)\s(?!are the)/); if(mm) pairs.push({prev:sents[i-1],pre:mm[1]+' ',w:mm[2],rest:' '+sn.slice(mm[0].length)}); }); }));
  /* variety: plural They/These first (the classic mistake), then other
     This/It, and at most one "This is because" */
  const seenP=new Set(), uniq=shuffle(pairs).filter(x=>!seenP.has(x.rest)&&seenP.add(x.rest));
  const because=x=>/^\s*is because/.test(x.rest);
  const plural=uniq.filter(x=>NUM[x.w]==='p'), single=uniq.filter(x=>NUM[x.w]==='s'&&!because(x)), bec=uniq.filter(because);
  const chosenL=[...plural.slice(0,2),...single.slice(0,2),...bec.slice(0,1)].slice(0,3);
  /* never more than one "This is because" unless there is nothing else */
  if(chosenL.length<2) chosenL.push(...uniq.filter(x=>!chosenL.includes(x)).slice(0,2-chosenL.length));
  state.links=shuffle(chosenL).map(x=>({...x,ans:null}));
}
function head(){
  return `<section class="card"><p class="lab">Today’s question</p><h1>${esc(Q.topic||'Essay')}</h1><p class="ask">${esc(Q.mainQuestion)}</p>`+
    `<ul class="notes">${(Q.writingPoints||[]).map(n=>`<li>${esc(n)}</li>`).join('')}</ul></section>`;
}
function draw(){
  checked=false;
  [...$('rounds').children].forEach((s,i)=>{ s.className=i===round?'on':(i<round?'done':''); });
  $('go').textContent='Check'; $('go').disabled=true;
  if(round===6) return drawEnd();
  let h=head();
  if(round===0){
    h+=`<section class="card"><p class="lab">Round 1 · Ideas</p><p class="do"><b>Tap the ideas that belong in this essay.</b> Some come from other questions.</p>`+
       `<div class="chips">${state.ideas.map((x,i)=>`<button type="button" class="chip" data-i="${i}" aria-pressed="${state.sel.has(i)}">${esc(x.t)}</button>`).join('')}</div><p class="why" id="why"></p></section>`;
  }
  if(round===1){
    h+=`<section class="card"><p class="lab">Round 2 · Introduction</p><p class="do"><b>Which introduction would you use?</b> Tap one.</p>`+
       `<div class="intros">${state.intros.map((x,i)=>`<button type="button" class="intro" data-i="${i}"><span class="tag">Introduction ${'AB'[i]}</span>${esc(x.t)}</button>`).join('')}</div><p class="why" id="why"></p></section>`;
  }
  if(round===2){
    h+=`<section class="card"><p class="lab">Round 3 · Topic sentence</p><p class="do"><b>Tap every sentence that could open this paragraph.</b> More than one may fit.</p>`+
       `<p class="para"><b class="gap" style="min-width:70px">…</b> <span style="color:var(--soft)">${esc(state.topic.rest)}</span></p>`+
       `<div class="chips" style="margin-top:14px">${state.topic.opts.map((x,i)=>`<button type="button" class="chip" data-i="${i}" aria-pressed="false">${esc(x.t)}</button>`).join('')}</div><p class="why" id="why"></p></section>`;
  }
  if(round===3){
    h+=`<section class="card"><p class="lab">Round 4 · Fill the model</p><p class="do"><b>Tap a gap, then the phrase it needs.</b> Think about its job: a reason, an example, a result, your opinion …</p>`+
       `<p class="para" id="para">${state.para}</p><div class="picker"><div class="chips" id="opts">${state.opts.map(t=>`<button type="button" class="chip" data-o="${esc(t)}">${esc(t)}</button>`).join('')}</div><p class="why" id="why"></p></div></section>`;
  }
  if(round===4){
    h+=`<section class="card"><p class="lab">Round 5 · Conclusion</p><p class="do"><b>Which conclusion would you use?</b> Tap one.</p>`+
       `<div class="intros">${state.ends.map((x,i)=>`<button type="button" class="intro" data-i="${i}"><span class="tag">Conclusion ${'AB'[i]}</span>${esc(x.t)}</button>`).join('')}</div><p class="why" id="why"></p></section>`;
  }
  if(round===5){
    h+=`<section class="card"><p class="lab">Round 6 · Link back</p><p class="do"><b>Which word refers back to something already mentioned?</b> One word for each gap.</p>`+
       state.links.map((x,i)=>{ const W=x.pre?['this','it','they','these']:['This','It','They','These'];
         return `<div class="lk" data-l="${i}"><p class="para"><span class="prev">${esc(x.prev)}</span> ${esc(x.pre)}<b class="gap" data-lg="${i}">…</b>${esc(x.rest)}</p>`+
         `<div class="chips">${W.map(w=>`<button type="button" class="chip" data-w="${w}">${w}</button>`).join('')}</div></div>`; }).join('')+
       `<p class="why" id="why"></p></section>`;
  }
  $('main').innerHTML=h;
  wire();
}
function wire(){
  if(round===0) $('main').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{ if(checked) return; const i=+b.dataset.i;
    state.sel.has(i)?state.sel.delete(i):state.sel.add(i); b.setAttribute('aria-pressed',state.sel.has(i)); $('go').disabled=!state.sel.size; });
  if(round===1) $('main').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{ if(checked) return; check1(+b.dataset.i); });
  if(round===2) $('main').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{ if(checked) return; const i=+b.dataset.i, T=state.topic;
    T.sel.has(i)?T.sel.delete(i):T.sel.add(i); b.setAttribute('aria-pressed',T.sel.has(i)); $('go').disabled=!T.sel.size; });
  if(round===4) $('main').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{ if(checked) return; check3(+b.dataset.i); });
  if(round===5) $('main').querySelectorAll('.lk').forEach(box=>{ const i=+box.dataset.l;
    box.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{ if(checked) return; state.links[i].ans=b.dataset.w;
      box.querySelectorAll('[data-w]').forEach(x=>x.setAttribute('aria-pressed',x===b)); const g=box.querySelector('[data-lg]'); g.textContent=b.dataset.w; g.classList.add('filled');
      $('go').disabled=!state.links.every(x=>x.ans); }); });
  if(round===3){
    const paint=()=>{ $('para').querySelectorAll('[data-g]').forEach(b=>{ const g=state.gaps[+b.dataset.g];
      b.textContent=g.ans||'…'; b.classList.toggle('filled',!!g.ans); b.classList.toggle('on',+b.dataset.g===state.active&&!checked); });
      $('go').disabled=!state.gaps.every(g=>g.ans); };
    $('para').querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{ if(checked) return; state.active=+b.dataset.g; paint(); });
    $('opts').querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{ if(checked) return; const g=state.gaps[state.active]; g.ans=b.dataset.o;
      const next=state.gaps.find(x=>!x.ans); if(next) state.active=next.id; paint(); });
    paint();
  }
}
function check0(){
  checked=true; let right=0, wrong=0, total=state.ideas.filter(x=>x.ok).length;
  $('main').querySelectorAll('[data-i]').forEach(b=>{ const i=+b.dataset.i, x=state.ideas[i], on=state.sel.has(i); b.disabled=true;
    if(x.ok&&on){ b.classList.add('ok'); right++; } else if(x.ok){ b.classList.add('miss'); } else if(on){ b.classList.add('no'); wrong++; } });
  const pts=Math.max(0,right-wrong); score+=pts>=total-1?1:0;
  $('why').innerHTML=`<b>${right} of ${total} found${wrong?`, ${wrong} from another question`:''}.</b> The outlined ones also belong. Remember: write about <b>both notes</b> and add <b>one idea of your own</b>.`;
  next();
}
function check1(i){
  checked=true; const x=state.intros[i], weak=state.intros.find(y=>!y.ok);
  $('main').querySelectorAll('[data-i]').forEach((b,j)=>{ b.disabled=true; b.classList.add(state.intros[j].ok?'ok':'no'); });
  if(x.ok) score++;
  $('why').innerHTML=(x.ok?'<b>Yes.</b> ':'<b>Not this one.</b> ')+`The weaker introduction: ${esc(weak.why)} The good one sets the scene, names the topic and says what the essay will do.`;
  next();
}
function checkT(){
  checked=true; const T=state.topic; let right=0, wrong=0, total=T.opts.filter(x=>x.ok).length;
  $('main').querySelectorAll('[data-i]').forEach(b=>{ const i=+b.dataset.i, x=T.opts[i], on=T.sel.has(i); b.disabled=true;
    if(x.ok&&on){ b.classList.add('ok'); right++; } else if(x.ok){ b.classList.add('miss'); } else if(on){ b.classList.add('no'); wrong++; } });
  if(right===total&&!wrong) score++;
  const bad=T.opts.find(x=>!x.ok);
  $('why').innerHTML=`<b>${right} of ${total} found${wrong?', 1 that doesn’t fit':''}.</b> `+(total>1?'Every outlined or green one works: the point is the same, the frame is your choice. ':'')+(bad?`The other one ${esc(bad.why)}.`:'');
  next();
}
function check2(){
  checked=true; let ok=0;
  $('para').querySelectorAll('[data-g]').forEach(b=>{ const g=state.gaps[+b.dataset.g], good=g.ans===g.t; b.disabled=true;
    b.classList.remove('on','filled'); b.classList.add(good?'ok':'no'); if(good) ok++; else b.insertAdjacentHTML('afterend',`<span class="fix">→ ${esc(g.t)}</span>`); });
  $('opts').querySelectorAll('button').forEach(b=>b.disabled=true);
  if(ok===state.gaps.length) score++;
  $('why').innerHTML=`<b>${ok} of ${state.gaps.length}.</b> ${state.gaps.map(g=>`<i>${esc(g.t)}</i> ${FN[g.cls]}`).join(' · ')}. The words can change — the job can’t.`;
  next();
}
function check3(i){
  checked=true; const x=state.ends[i], weak=state.ends.find(y=>!y.ok);
  $('main').querySelectorAll('[data-i]').forEach((b,j)=>{ b.disabled=true; b.classList.add(state.ends[j].ok?'ok':'no'); });
  if(x.ok) score++;
  $('why').innerHTML=(x.ok?'<b>Yes.</b> ':'<b>Not this one.</b> ')+`The weaker conclusion: ${esc(weak.why)} The good one states your view and sums up the reasons — no new ideas.`;
  next();
}
/* singular This/It and plural They/These: swapping within a pair is
   "possible" (counts); singular for plural is the real mistake */
function check4(){
  checked=true; let ok=0;
  $('main').querySelectorAll('.lk').forEach(box=>{ const x=state.links[+box.dataset.l], g=box.querySelector('[data-lg]');
    const exact=x.ans===x.w, near=!exact&&NUM[x.ans]===NUM[x.w];
    g.classList.remove('filled'); g.classList.add(exact||near?'ok':'no'); if(exact||near) ok++;
    if(!exact) g.insertAdjacentHTML('afterend',`<span class="fix">→ ${x.w}${near?' (yours is possible too)':''}</span>`);
    box.querySelectorAll('[data-w]').forEach(b=>b.disabled=true); });
  if(ok===state.links.length) score++;
  $('why').innerHTML=`<b>${ok} of ${state.links.length}.</b> <i>This</i> and <i>It</i> point back to one thing or a whole idea; <i>They</i> and <i>These</i> point back to more than one. Check what the word refers to in the sentence before.`;
  next();
}
function next(){ $('go').disabled=false; $('go').textContent=round<5?'Next round':'Finish'; }
function drawEnd(){
  [...$('rounds').children].forEach(s=>s.className='done');
  $('main').innerHTML=head()+`<section class="card"><div class="score"><b>${score} / 6</b><p>${score===6?'A clean workout. Now write one paragraph of your own.':score>=4?'Nearly there. Now try writing a paragraph.':'Every round makes the next essay easier. Now try writing a paragraph.'}</p></div></section>`;
  $('go').textContent='Expand a point'; $('go').disabled=false;
  $('newQ').textContent='Another question';
}
$('go').onclick=()=>{
  /* the end of the workout leads into writing: same question */
  if(round===6) return location.href='/skills/writing/expand.html?q='+encodeURIComponent(Q.id);
  if(!checked){ if(round===0) return check0(); if(round===2) return checkT(); if(round===3) return check2(); if(round===5) return check4(); return; }
  round++; draw(); window.scrollTo({top:0,behavior:'smooth'});
};
$('newQ').onclick=newQuestion;
Promise.all([fetch(BASE+'essay-questions.json').then(r=>r.json()),fetch(BASE+'samples.json').then(r=>r.json())]).then(([q,s])=>{
  QS=q.questions||[]; let list=s[Object.keys(s)[0]]; if(!Array.isArray(list)) list=Object.values(list);
  list.forEach(x=>SM[x.id]=x); newQuestion();
}).catch(()=>{ $('main').innerHTML='<p class="state">The workout didn’t load — reload to try again.</p>'; });
})();
</script>
