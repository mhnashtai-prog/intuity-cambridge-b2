<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>INTUITY — Write it</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..900&family=Geist+Mono:wght@400..600&family=Space+Grotesk:wght@700&family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=20261105">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   WRITE IT · the whole task, in the app  ·  v1 (12 Nov 2026)

   From the menu audit: every door of a writing task taught its shape and
   its phrases, and no door asked for the text itself. This is the last
   door. One question (the task's own bank), the exam's 40 minutes and
   140–190 words, then the four criteria as a self-check, the same four
   the Sample stage uses. The paper and the teacher stay the real route:
   the finished text copies out in one tap to send.

   ONE TAP TO START: the pendulum is the start, as on every gate. The
   clock starts with it and keeps running if the pupil leaves and comes
   back; the draft is kept on this device, per question.
   ═══════════════════════════════════════════════════════════════════════ */
:root{ --mark-sweep:#C2956E; --mark-rest:#4A433D; --mark-core:#201E1C; --mark-ink:#E5D1B8; --mark-pct:4%;
  --w-ink:#14110E; --w-paper:#FBF8F3; --w-dim:#5C5852; --w-faint:#8A847C; --w-line:rgba(20,17,14,.12);
  --w-car:#C2956E; --w-ok:#4F7A63; --w-no:#B4532F }
[hidden]{display:none!important}
body{background:var(--bg,#F3EFE8)}
.header{position:sticky;top:0;z-index:20}
.stage{max-width:38rem;margin:0 auto;padding:1rem var(--gutter,16px) 7rem;color:var(--w-ink)}

/* the gate */
.gate{text-align:center;padding-top:2.2rem}
.gate .gate-mark{display:block;width:124px;height:124px;margin:0 auto 1.4rem;border:0;padding:0;background:none;cursor:pointer}
.gate .gate-mark .pend-dial span{font-size:1rem;letter-spacing:.12em;padding-left:.12em}
.big{font-family:'Anton',Impact,sans-serif;font-weight:400;font-size:clamp(2.2rem,10.5vw,3rem);line-height:.98;text-transform:uppercase;color:var(--w-ink);margin:0}
.sm{font-size:.84rem;color:var(--w-faint);margin:.55rem 0 0}
.tally{font:600 .62rem/1 'Geist Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#9A5A2C;margin:1rem 0 0}

/* the question */
.qcard{margin:1.4rem 0 0;padding:.85rem .95rem .95rem;background:var(--w-paper);border-left:4px solid var(--w-ink);box-shadow:0 6px 22px rgba(43,33,41,.06);text-align:left}
.qcard .k{font:600 .6rem/1 'Geist Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--w-dim);margin-bottom:.45rem;display:flex;justify-content:space-between;gap:.5rem}
.qcard .t{font-weight:700;font-size:.98rem;margin:0 0 .3rem}
.qcard .lead{font-size:.86rem;line-height:1.45;color:var(--w-dim);margin:0 0 .4rem}
.qcard .q{font-size:.95rem;line-height:1.5;margin:0}
.qcard .q.open{font-style:italic}
.qcard ul{margin:.45rem 0 0;padding-left:1.1rem;font-size:.88rem;line-height:1.45}
.qcard .lab{font:600 .58rem/1 'Geist Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#9A5A2C;margin:.6rem 0 0}
.qnav{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin:.6rem 0 0}
.qnav button{width:44px;height:44px;flex:none;border-radius:50%;border:0;background:var(--w-ink);color:var(--w-paper);font-size:1.4rem;line-height:1;display:grid;place-items:center;cursor:pointer;padding:0 0 .1em}
.qnav button:disabled{background:rgba(20,17,14,.1);color:rgba(20,17,14,.3);cursor:default}
.qnav span{font:500 .72rem/1 'Geist Mono',monospace;color:var(--w-dim)}
.draft{font-size:.8rem;color:var(--w-ok);margin:.7rem 0 0;font-weight:600}

/* writing */
.mini{display:block;width:100%;border:0;background:var(--w-paper);text-align:left;padding:.6rem .8rem;border-left:4px solid var(--w-ink);cursor:pointer;font:inherit;color:var(--w-ink)}
.mini b{display:block;font-size:.88rem}
.mini small{display:block;font-size:.74rem;color:var(--w-faint);margin-top:.15rem}
textarea#txt{display:block;width:100%;box-sizing:border-box;min-height:58vh;margin:.8rem 0 0;padding:.9rem .95rem;border:1.5px solid var(--w-ink);border-radius:4px;background:#fff;color:var(--w-ink);
  font:400 1rem/1.6 var(--f-body,'Geist',system-ui,sans-serif);resize:vertical}
textarea#txt:focus{outline:2px solid var(--w-car);outline-offset:1px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(251,248,243,.97);border-top:1px solid var(--w-line);padding:.55rem var(--gutter,16px) calc(.55rem + env(safe-area-inset-bottom))}
.bar-in{max-width:38rem;margin:0 auto;display:flex;align-items:center;gap:.8rem}
.meter{flex:1;min-width:0}
.meter .nums{display:flex;justify-content:space-between;font:600 .78rem/1 'Geist Mono',monospace;color:var(--w-ink)}
.meter .nums i{font-style:normal;color:var(--w-faint);font-weight:500}
.meter .track{position:relative;height:6px;border-radius:3px;background:rgba(20,17,14,.08);margin-top:.4rem;overflow:hidden}
.meter .zone{position:absolute;top:0;bottom:0;left:60.87%;width:21.74%;background:rgba(79,122,99,.22)}
.meter .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--w-ink);border-radius:3px;transition:width .2s}
.meter.ok .fill{background:var(--w-ok)} .meter.over .fill{background:var(--w-no)}
.clock.late{color:var(--w-no)}
.done{min-height:44px;padding:0 1.2rem;border:0;border-radius:999px;background:var(--w-ink);color:var(--w-paper);font:700 .9rem/1 var(--f-body,'Geist',sans-serif);cursor:pointer}

/* the check */
.res{text-align:center;padding-top:1.4rem}
.res .n{font-family:'Anton',Impact,sans-serif;font-size:4.2rem;line-height:1;margin:0}
.res .u{font:600 .62rem/1 'Geist Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--w-dim);margin:.35rem 0 0}
.facts{display:flex;justify-content:center;flex-wrap:wrap;gap:.4rem;margin:1rem 0 0}
.facts span{display:inline-flex;align-items:center;gap:.3rem;min-height:30px;padding:0 .75rem;border-radius:999px;border:1px solid #C9C1B4;background:var(--w-paper);font:600 .7rem/1 'Geist Mono',monospace;letter-spacing:.04em}
.facts span.ok{border-color:var(--w-ok);color:var(--w-ok)} .facts span.no{border-color:var(--w-no);color:var(--w-no)}
.chk{margin:1.6rem 0 0;text-align:left}
.chk h2{font-family:'Anton',Impact,sans-serif;font-weight:400;font-size:1.5rem;text-transform:uppercase;margin:0 0 .25rem;display:flex;align-items:center;gap:.6rem}
.chk h2::before{content:'';width:26px;height:10px;background:var(--w-car);flex:none}
.chk p.how{font-size:.84rem;color:var(--w-dim);margin:0 0 .7rem;line-height:1.45}
.tick{display:flex;gap:.7rem;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--w-line);background:var(--w-paper);padding:.7rem .8rem;margin:0 0 .45rem;border-radius:6px;cursor:pointer;font:inherit;color:var(--w-ink)}
.tick .mk{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--w-ink);display:grid;place-items:center;font-size:.8rem;margin-top:.05rem}
.tick.on{border-color:var(--w-ok);background:#EEF3EF}
.tick.on .mk{background:var(--w-ok);border-color:var(--w-ok);color:#fff}
.tick.on .mk::after{content:'✓'}
.tick b{display:block;font:600 .6rem/1.2 'Geist Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--w-dim);margin-bottom:.2rem}
.tick span{font-size:.9rem;line-height:1.4}
.next{margin:.9rem 0 0;padding:.7rem .9rem;background:#F3EADF;font-size:.88rem;line-height:1.45}
.next b{font:600 .6rem/1 'Geist Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#9A5A2C;display:block;margin-bottom:.3rem}
.outs{display:flex;flex-direction:column;align-items:center;gap:.6rem;margin:1.8rem 0 0}
.outs .pri{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 1.8rem;border:0;border-radius:999px;background:var(--w-ink);color:var(--w-paper);
  font:700 1rem/1 var(--f-body,'Geist',sans-serif);cursor:pointer;box-shadow:0 0 0 3px var(--w-paper),0 0 0 6px var(--w-car)}
.outs a,.outs .sec{display:inline-flex;align-items:center;min-height:44px;padding:0 1rem;border:0;background:none;color:#8E6238;font:650 .92rem/1 var(--f-body,'Geist',sans-serif);text-decoration:none;cursor:pointer}
.toast{position:fixed;left:50%;bottom:5.5rem;transform:translateX(-50%);background:var(--w-ink);color:var(--w-paper);padding:.55rem 1rem;border-radius:999px;font-size:.84rem;z-index:40}
</style>
<script src="/tools/be2-brand.js?v=20261113"></script>
</head>
<body>
<header class="header">
  <div class="header-top">
    <a class="back-link" id="back" href="/skills/writing/gate.html?task=essays" target="_top">← Essay</a>
    <div class="header-title"><div class="app-title">INTUITY</div><div class="app-subtitle">Write it</div></div>
    <span class="header-spacer">Level <b>B2</b></span>
  </div>
</header>
<main class="stage" id="stage"><p style="text-align:center;color:var(--w-faint)">Loading…</p></main>
<div class="bar" id="bar" hidden>
  <div class="bar-in">
    <div class="meter" id="meter"><div class="nums"><span><b id="wc">0</b> <i>words · 140–190</i></span><span class="clock" id="clock">40:00</span></div>
      <div class="track"><div class="zone"></div><div class="fill" id="fill"></div></div></div>
    <button type="button" class="done" id="doneBtn">Done</button>
  </div>
</div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P=new URLSearchParams(location.search);
const MIN=140, MAX=190, SECS=40*60;

/* each task: its name, its own question bank, and the four checks the Sample stage uses */
const TASKS={
  essays:{name:'Essay',word:'essay',src:['/skills/writing/essays/data/essay-questions.json'],
    norm:q=>({id:q.id,title:q.topic,lead:q.context,q:q.mainQuestion,lab:'Notes',list:q.writingPoints}),
    checks:[['Content','I covered both notes and added an idea of my own.'],['Communicative Achievement','It sounds right for a teacher: formal, no contractions, my opinion clear.'],['Organisation','An introduction, two or three body paragraphs and a conclusion, each with one job.'],['Language','I used some less common words and a few longer sentences I am sure of.']]},
  emails:{name:'Email / Letter',word:'email',src:['/skills/writing/emails/data/emails-questions-formal.json','/skills/writing/emails/data/emails-questions-informal.json'],
    norm:q=>{ const d=q.questionData||q; return {id:q.id+(q.questionData?'-i':'-f'),title:q.title||q.topic,lead:d.context||'',q:d.question,lab:'In your email',list:d.keyPoints}; },
    checks:[['Content','I answered every question in the message and gave all the information asked for.'],['Communicative Achievement','The tone fits the reader: formal for an organisation, friendly for a friend.'],['Organisation','A greeting, an opening, a paragraph for each point and a suitable ending.'],['Language','I used some less common words and a few longer sentences I am sure of.']]},
  articles:{name:'Article',word:'article',src:['/skills/writing/articles/data/article-questions.json'],
    norm:q=>({id:q.id,title:q.title,lead:'You see this announcement in an English-language magazine.',q:q.question,note:q.print}),
    checks:[['Content','I answered every question in the task and gave examples of my own.'],['Communicative Achievement','It talks to the reader: a catchy title, a question or two, my own voice.'],['Organisation','A title, an opening that hooks, a paragraph for each point, a closing thought.'],['Language','I used some less common words and a few longer sentences I am sure of.']]},
  reviews:{name:'Review',word:'review',src:['/skills/writing/reviews/data/review-questions.json'],
    norm:q=>({id:q.id,title:q.topic,lead:[q.context,q.announcement].filter(Boolean).join(' '),q:q.question}),
    checks:[['Content','I described it, covered every point in the question and said who it is for.'],['Communicative Achievement','It sounds like a review: lively, it talks to the reader, my opinion is clear.'],['Organisation','A title, an opening, a paragraph for each feature, a recommendation to finish.'],['Language','I used some less common words and a few longer sentences I am sure of.']]},
  story:{name:'Story',word:'story',src:['/skills/writing/narrative/data/narrative-questions.json'],
    norm:q=>({id:q.id,title:q.title,lead:q.prompt,q:q.opening,open:true,lab:'Your story must include',list:q.mustInclude}),
    checks:[['Content','I began with the sentence the task gives, used everything it must include, and the story makes sense.'],['Communicative Achievement','It keeps the reader hooked: feelings, a little suspense, a real ending.'],['Organisation','A beginning, a middle where something happens and an ending, linked by time words.'],['Language','Past tenses used well, and some less common words.']]},
  reports:{name:'Report',word:'report',src:['/skills/writing/reports/data/report-questions.json'],
    norm:q=>({id:q.id,title:String(q.id||'').replace(/-/g,' ').replace(/^./,c=>c.toUpperCase()),lead:q.context,q:q.question,lab:'In your report',list:q.keyPoints}),
    checks:[['Content','I covered every point the question asks for and made a recommendation.'],['Communicative Achievement','It sounds like a report: formal and factual, no chatty language.'],['Organisation','A title and clear headings: introduction, findings, recommendation.'],['Language','I used some less common words and a few longer sentences I am sure of.']]}
};
const K=TASKS[P.get('task')]?P.get('task'):'essays', T=TASKS[K];
$('back').textContent='← '+T.name; $('back').href='/skills/writing/gate.html?task='+K;
document.title='INTUITY — Write it · '+T.name;

const store={get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
             set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }};
const AT='intuity.write.'+K+'.at', DONE='intuity.write.'+K+'.done';
const dKey=q=>'intuity.write.'+K+'.'+q.id;
let QS=[], qi=0, tick=null;

function words(t){ return (String(t).match(/[A-Za-zÀ-ɏ0-9]+(?:['’-][A-Za-zÀ-ɏ0-9]+)*/g)||[]).length; }
function paras(t){ return String(t).split(/\n+/).filter(l=>l.trim().split(/\s+/).length>=4).length; }
function mmss(s){ const a=Math.abs(s); return (s<0?'+':'')+Math.floor(a/60)+':'+String(Math.floor(a%60)).padStart(2,'0'); }
function toast(m){ const d=document.createElement('div'); d.className='toast'; d.textContent=m; document.body.appendChild(d); setTimeout(()=>d.remove(),2200); }

function qHTML(q,full){
  return '<div class="qcard"><div class="k"><span>'+esc(T.name)+' · '+(K==='essays'?'Part 1':'Part 2')+'</span><span>'+MIN+'–'+MAX+' words</span></div>'+
    (q.title?'<p class="t">'+esc(q.title)+'</p>':'')+(q.lead?'<p class="lead">'+esc(q.lead)+'</p>':'')+
    '<p class="q'+(q.open?' open':'')+'">'+(q.open?'Begin with: ':'')+esc(q.q)+'</p>'+
    (q.list&&q.list.length&&full!==false?'<p class="lab">'+esc(q.lab||'Include')+'</p><ul>'+q.list.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'')+
    (q.note?'<p class="lead" style="margin:.5rem 0 0">'+esc(q.note)+'</p>':'')+'</div>';
}

/* ── the gate: the pendulum starts the clock ── */
function gate(){
  stop(); $('bar').hidden=true;
  const q=QS[qi], d=store.get(dKey(q),null), n=store.get(DONE,0);
  const going=d&&d.text&&!d.done;
  document.documentElement.style.setProperty('--mark-pct',Math.max(4,Math.min(100,n*10))+'%');
  $('stage').innerHTML='<section class="gate">'+
    '<button type="button" class="gate-mark pend-hang" id="dial" aria-label="Start"><div class="pend-dial"><span>'+(going?'GO ON':'START')+'</span></div></button>'+
    '<h1 class="big">1 '+esc(T.word)+'.<br>40 minutes.</h1><p class="sm">'+MIN+'–'+MAX+' words, then check it against the four criteria</p>'+
    (n?'<p class="tally">'+n+' written so far</p>':'')+
    qHTML(q)+
    '<div class="qnav"><button type="button" id="qPrev" aria-label="Previous question"'+(qi?'':' disabled')+'>‹</button><span>Question '+(qi+1)+' of '+QS.length+'</span><button type="button" id="qNext" aria-label="Next question"'+(qi<QS.length-1?'':' disabled')+'>›</button></div>'+
    (going?'<p class="draft">Your draft is kept: '+words(d.text)+' words</p>':'')+'</section>';
  $('dial').onclick=write;
  $('qPrev').onclick=()=>{ qi=Math.max(0,qi-1); store.set(AT,qi); gate(); };
  $('qNext').onclick=()=>{ qi=Math.min(QS.length-1,qi+1); store.set(AT,qi); gate(); };
}

/* ── writing: the clock runs from the first tap, the draft saves as it goes ── */
function write(){
  const q=QS[qi]; let d=store.get(dKey(q),null);
  if(!d||d.done) d={text:K==='story'&&q.open?q.q+' ':'',start:Date.now()};
  store.set(dKey(q),d);
  $('stage').innerHTML='<button type="button" class="mini" id="mini" aria-expanded="false"><b>'+esc(q.title||T.name)+'</b><small>Tap to see the question</small></button><div id="qfull" hidden>'+qHTML(q)+'</div>'+
    '<textarea id="txt" spellcheck="false" autocapitalize="sentences" placeholder="Write your '+esc(T.word)+' here. Start a new line for each paragraph." aria-label="Your '+esc(T.word)+'"></textarea>';
  $('bar').hidden=false;
  const ta=$('txt'); ta.value=d.text;
  $('mini').onclick=()=>{ const f=$('qfull'), open=f.hidden; f.hidden=!open; $('mini').setAttribute('aria-expanded',open); $('mini').querySelector('small').textContent=open?'Tap to hide the question':'Tap to see the question'; };
  ta.oninput=()=>{ d.text=ta.value; store.set(dKey(q),d); meter(d); };
  meter(d); stop(); tick=setInterval(()=>meter(d),1000);
  $('doneBtn').onclick=()=>check(q,d);
  if(!d.text||d.text.length<40) setTimeout(()=>ta.focus(),60);
}
function meter(d){
  const n=words(d.text), left=SECS-Math.floor((Date.now()-d.start)/1000);
  $('wc').textContent=n; $('fill').style.width=Math.min(100,n/230*100)+'%';
  $('meter').className='meter'+(n>=MIN&&n<=MAX?' ok':n>MAX?' over':'');
  const c=$('clock'); c.textContent=left>=0?mmss(left):'Time '+mmss(left); c.classList.toggle('late',left<0);
}
function stop(){ if(tick){ clearInterval(tick); tick=null; } }

/* ── the check: three facts the app can count, four the pupil ticks ── */
function check(q,d){
  const n=words(d.text);
  if(n<20){ toast('Write a little more first'); return; }
  stop(); $('bar').hidden=true;
  const first=!d.done; d.done=true; d.end=d.end||Date.now(); store.set(dKey(q),d);
  const mins=Math.max(1,Math.round((d.end-d.start)/60000)), inRange=n>=MIN&&n<=MAX, pc=paras(d.text);
  const needP=K==='essays'?4:3;
  if(first){ store.set(DONE,store.get(DONE,0)+1); try{ if(window.Be2&&Be2.score) Be2.score('writing',inRange); }catch(e){} }
  const ticks=new Set(d.ticks||[]);
  $('stage').innerHTML='<section class="res">'+
    '<p class="n" id="num">'+n+'</p><p class="u">words</p>'+
    '<div class="facts"><span class="'+(inRange?'ok':'no')+'">'+(inRange?'✓ In range':n<MIN?(MIN-n)+' short':(n-MAX)+' over')+'</span>'+
      '<span class="'+(pc>=needP?'ok':'no')+'">'+pc+' paragraph'+(pc===1?'':'s')+'</span>'+
      '<span class="'+(mins<=40?'ok':'no')+'">'+mins+' min</span></div></section>'+
    '<section class="chk"><h2>Check it</h2><p class="how">Read your '+esc(T.word)+' once more, then tick each line that is true. Be honest: the one you can’t tick is where to start next time.</p>'+
      T.checks.map((c,i)=>'<button type="button" class="tick'+(ticks.has(i)?' on':'')+'" data-i="'+i+'" role="checkbox" aria-checked="'+ticks.has(i)+'"><i class="mk"></i><span><b>'+esc(c[0])+'</b>'+esc(c[1])+'</span></button>').join('')+
      '<div class="next" id="next"></div></section>'+
    '<div class="outs"><button type="button" class="pri" id="copy">Copy it for your teacher</button>'+
      '<button type="button" class="sec" id="edit">Keep editing</button>'+
      '<a href="/skills/writing/build.html?type='+(K==='story'?'story':K)+'&view=models">Read a model '+esc(T.word)+' →</a>'+
      (qi<QS.length-1?'<button type="button" class="sec" id="another">Next question</button>':'')+'</div>';
  const paint=()=>{
    const miss=T.checks.filter((_,i)=>!ticks.has(i)).map(c=>c[0]);
    let tip=!inRange?(n<MIN?'Add a sentence or two to the paragraph with the least detail: under '+MIN+' words loses marks for Content.':'Cut to '+MAX+' words: take out a repeated idea, not a whole paragraph.'):'';
    $('next').innerHTML='<b>Next time</b>'+(miss.length?'Start with '+esc(miss[0])+(miss.length>1?' (then '+miss.slice(1).map(esc).join(', ')+')':'')+'. '+tip:(tip||'All four ticked. Ask your teacher to mark it, and try a new question.'));
  };
  [].forEach.call(document.querySelectorAll('.tick'),b=>b.onclick=()=>{
    const i=+b.dataset.i; ticks.has(i)?ticks.delete(i):ticks.add(i);
    b.classList.toggle('on',ticks.has(i)); b.setAttribute('aria-checked',ticks.has(i));
    d.ticks=[...ticks]; store.set(dKey(q),d); paint();
    if(ticks.has(i)&&window.Cheer){ try{ ticks.size===4?Cheer.done(b):Cheer.tick(b); }catch(e){} }
  });
  paint();
  $('copy').onclick=()=>{
    const out=q.q+'\n\n'+d.text.trim()+'\n\n('+n+' words)';
    const ok=()=>toast('Copied: paste it into a message to your teacher');
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(out).then(ok,()=>fallback(out,ok)); else fallback(out,ok);
  };
  $('edit').onclick=()=>{ d.done=false; store.set(dKey(q),d); write(); };
  if($('another')) $('another').onclick=()=>{ qi++; store.set(AT,qi); gate(); window.scrollTo({top:0}); };
  window.scrollTo({top:0});
  if(first&&inRange&&window.Cheer){ try{ Cheer.done($('num')); }catch(e){} }
}
function fallback(t,ok){ const a=document.createElement('textarea'); a.value=t; a.style.position='fixed'; a.style.opacity='0'; document.body.appendChild(a); a.select(); try{ document.execCommand('copy'); ok(); }catch(e){} a.remove(); }

/* ── load the task's own questions ── */
Promise.all(T.src.map(u=>fetch(u).then(r=>r.ok?r.json():null).catch(()=>null))).then(ds=>{
  ds.forEach(d=>{ if(!d) return; const list=Array.isArray(d)?d:(d.questions||d.emails||[]); list.forEach(x=>{ try{ const q=T.norm(x); if(q&&q.q) QS.push(q); }catch(e){} }); });
  if(!QS.length){ $('stage').innerHTML='<p style="text-align:center">The questions didn’t load. Check your connection and reload.</p>'; return; }
  const want=P.get('q'); qi=want?Math.max(0,QS.findIndex(q=>q.id===want)):Math.min(QS.length-1,+store.get(AT,0)||0);
  gate();
});
})();
</script>
