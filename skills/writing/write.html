<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>INTUITY — Write it</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..900&family=Geist+Mono:wght@400..600&family=Space+Grotesk:wght@700&family=Anton&family=Kalam:wght@400;700&display=swap" rel="stylesheet">

<style>
/* ═══════════════════════════════════════════════════════════════════════
   WRITE IT · v2 (14 Nov 2026) · a page that makes text, not a test

   From the owner: an empty box is no help. Write it is where a pupil
   CHOOSES and COMBINES: the plan, the phrases and a model are in a ribbon
   above the page, as tools are in Word, and the text is his own.
   · No clock: this is for retention, not an exam.
   · Nothing can be pasted or dropped in. A phrase is not inserted: tapping
     it pins it above the page, and the pupil types it. Typing it is how it
     sticks; when a bank phrase is typed right, the page underlines it.
   · The model is there any time (it cannot be pasted in either).
   · The pupil's writing is in a handwriting face (Kalam): the exam is
     written by hand, and his text should not look like the app's.
   The page: one box per paragraph, its job in the margin, a grey hint
   while empty. The status bar counts words (140–190), paragraphs and the
   bank phrases he has typed. Finish → the facts the app can count and the
   four criteria to tick (as in v1), then copy it for the teacher.
   ═══════════════════════════════════════════════════════════════════════ */
:root{ --mark-sweep:#C2956E; --mark-rest:#4A433D; --mark-core:#201E1C; --mark-ink:#E5D1B8; --mark-pct:4%;
  --w-ink:#14110E; --w-paper:#FFFFFF; --w-dim:#5C5852; --w-faint:#9A948B; --w-line:rgba(20,17,14,.12);
  --w-car:#C2956E; --w-ok:#4F7A63; --w-no:#B4532F; --w-hand:'Kalam','Comic Neue','Bradley Hand',cursive }
[hidden]{display:none!important}
body{background:var(--bg,#F3EFE8)}
.top{position:sticky;top:0;z-index:20;background:#FAF8F5}
.top .header{position:static}
.stage{max-width:40rem;margin:0 auto;padding:0 10px 7rem;color:var(--w-ink)}

/* ── the gate ── */
.gate{text-align:center;padding:2rem 6px 0}
.gate .gate-mark{display:block;width:124px;height:124px;margin:0 auto 1.4rem;border:0;padding:0;background:none;cursor:pointer}
.gate .gate-mark .pend-dial span{font-size:1rem;letter-spacing:.12em;padding-left:.12em}
.big{font-family:'Anton',Impact,sans-serif;font-weight:400;font-size:clamp(2.2rem,10.5vw,3rem);line-height:.98;text-transform:uppercase;color:var(--w-ink);margin:0}
.sm{font-size:.86rem;line-height:1.45;color:var(--w-dim);margin:.6rem auto 0;max-width:22rem}
.tally{font:600 .62rem/1 'Geist Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#9A5A2C;margin:1rem 0 0}
.qcard{margin:1.3rem 0 0;padding:.85rem .95rem .95rem;background:#FBF8F3;border-left:4px solid var(--w-ink);text-align:left}
.qcard .k{font:600 .6rem/1 'Geist Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--w-dim);margin-bottom:.45rem}
.qcard .t{font-weight:700;font-size:.98rem;margin:0 0 .3rem}
.qcard .lead{font-size:.86rem;line-height:1.45;color:var(--w-dim);margin:0 0 .4rem}
.qcard .q{font-size:.95rem;line-height:1.5;margin:0}
.qcard ul{margin:.45rem 0 0;padding-left:1.1rem;font-size:.88rem;line-height:1.45}
.qcard .lab{font:600 .58rem/1 'Geist Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#9A5A2C;margin:.6rem 0 0}
.qnav{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin:.6rem 0 0}
.qnav button{width:44px;height:44px;flex:none;border-radius:50%;border:1.5px solid rgba(20,17,14,.2);background:none;color:var(--w-ink);font-size:1.3rem;line-height:1;display:grid;place-items:center;cursor:pointer;padding:0 0 .1em}
.qnav button:disabled{opacity:.3;cursor:default}
.qnav span{font:500 .72rem/1 'Geist Mono',monospace;color:var(--w-dim)}
.draft{font-size:.8rem;color:var(--w-ok);margin:.7rem 0 0;font-weight:600}

/* ── THE RIBBON: four tabs (the Writing tab) and a strip of tools ── */
.rib{border-bottom:1px solid var(--w-line)}
.rtabs{display:flex;justify-content:center;gap:.25rem}
.rtabs button{position:relative;border:0;background:none;cursor:pointer;padding:.55rem .55rem .4rem;font:700 .6875rem/1 'Geist Mono',ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:#9A948B}
.rtabs button[aria-selected="true"]{color:var(--w-ink);box-shadow:inset 0 -2px 0 var(--w-car)}
.strip{display:flex;gap:8px;overflow-x:auto;padding:9px 12px 11px;scrollbar-width:none;border-top:1px solid var(--w-line);background:#F6F3EE;-webkit-user-select:none;user-select:none}
.strip::-webkit-scrollbar{display:none}
.grp{flex:none;display:flex;flex-direction:column;gap:6px;padding-right:9px;border-right:1px solid var(--w-line);max-width:86vw}
.grp:last-child{border-right:0}
.grp h6{margin:0;font:600 9px/1 'Geist Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--w-faint)}
.chips{display:flex;gap:6px}
.chip{flex:none;font:500 13px/1.25 var(--f-body,'Geist'),system-ui,sans-serif;background:#fff;border:1px solid var(--w-line);border-radius:999px;padding:9px 12px;white-space:nowrap;color:var(--w-ink);cursor:pointer;min-height:38px}
.chip.on{border-color:var(--w-car);box-shadow:inset 0 0 0 1px var(--w-car)}
.chip.ok{color:var(--w-ok);border-color:rgba(79,122,99,.45)}
.chip.no{color:var(--w-no);border-color:rgba(180,83,47,.4)}
.chip.go{background:var(--w-ink);color:#F6F3EE;border-color:var(--w-ink);font-weight:650}
.chip.quiet{cursor:default}
.strip .note{flex:none;align-self:center;font-size:.8rem;color:var(--w-dim);max-width:16rem;white-space:normal;line-height:1.35}

/* the pinned phrase: shown, never inserted */
.pin{display:flex;align-items:center;gap:.6rem;padding:.55rem 14px;background:#FFF7EC;border-bottom:1px solid rgba(194,149,110,.35);-webkit-user-select:none;user-select:none}
.pin .k{flex:none;font:600 9px/1.2 'Geist Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#9A5A2C}
.pin .p{flex:1;font:500 14px/1.35 var(--f-body,'Geist'),sans-serif;color:var(--w-ink)}
.pin.done .p{color:var(--w-ok)}
.pin.done .p::before{content:'✓ '}
.pin button{flex:none;width:36px;height:36px;border:0;background:none;color:var(--w-faint);font-size:.95rem;cursor:pointer}

/* ── THE PAGE ── */
.desk{padding:14px 0 0}
.paper{background:var(--w-paper);box-shadow:0 1px 2px rgba(0,0,0,.06),0 12px 32px -14px rgba(20,17,14,.2);border-radius:2px;padding:20px 16px 26px}
.paper .qh{border-left:3px solid #E8E1D6;padding:2px 0 2px 11px;margin-bottom:14px}
.paper .qh .k{font:600 9px/1 'Geist Mono',monospace;letter-spacing:.18em;text-transform:uppercase;color:#7A5C3A}
.paper .qh p{font-size:14px;line-height:1.45;color:var(--w-dim);margin:6px 0 0}
.paper .qh ol{margin:6px 0 0 18px;padding:0;font-size:13.5px;color:var(--w-dim);line-height:1.5}
.para{display:grid;grid-template-columns:52px 1fr;gap:6px;padding:8px 0 6px;border-top:1px dashed var(--w-line)}
.para.cur{background:linear-gradient(90deg,rgba(194,149,110,.09),transparent 70%)}
.role{font:600 8.5px/1.3 'Geist Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--w-car);padding-top:9px;word-break:break-word}
.para.cur .role{color:#9A5A2C}
/* the text box over a mirror that draws the underlines (a textarea cannot) */
.pw{position:relative}
.pw .mir,.pw textarea{font:400 19px/1.55 var(--w-hand);letter-spacing:0;padding:4px 2px;margin:0;border:0;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:break-word;width:100%;box-sizing:border-box}
.pw .mir{position:absolute;inset:0;color:transparent;pointer-events:none}
.pw .mir mark{color:transparent;background:linear-gradient(transparent 70%,rgba(194,149,110,.42) 70%);border-radius:1px}
.pw textarea{position:relative;display:block;background:transparent;color:var(--w-ink);resize:none;overflow:hidden;min-height:2.4em;caret-color:var(--w-ink)}
.pw textarea::placeholder{color:#BDB5AA;font-family:var(--f-body,'Geist'),sans-serif;font-size:14px;font-style:italic}
.pw textarea:focus{outline:none}
.addp{display:block;margin:10px 0 0 58px;border:0;background:none;color:#8E6238;font:650 .82rem/1 var(--f-body,'Geist'),sans-serif;cursor:pointer;min-height:36px}

/* ── THE STATUS BAR ── */
.status{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#14110E;color:#EDE7DD;padding:9px 12px calc(9px + env(safe-area-inset-bottom))}
.status .in{max-width:40rem;margin:0 auto;display:flex;align-items:center;gap:10px;font:600 11.5px/1 'Geist Mono',monospace;letter-spacing:.03em}
.status .wc{display:flex;align-items:center;gap:7px;white-space:nowrap}
.status .bar{position:relative;width:62px;height:5px;border-radius:3px;background:rgba(255,255,255,.16);overflow:hidden}
.status .bar .z{position:absolute;top:0;bottom:0;left:60.87%;width:21.74%;background:rgba(122,170,140,.35)}
.status .bar .f{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--w-car);transition:width .2s}
.status.ok .bar .f{background:#7AAA8C}.status.over .bar .f{background:#E07A55}
.status .sep{opacity:.3}
.status .fin{margin-left:auto;min-height:36px;padding:0 14px;border:0;border-radius:999px;background:var(--w-car);color:#14110E;font:700 12px/1 var(--f-body,'Geist'),sans-serif;cursor:pointer}

/* ── the model sheet ── */
.sheet-bg{position:fixed;inset:0;z-index:60;background:rgba(246,244,240,.72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;height:min(86vh,48rem);background:#FAF8F5;border-radius:14px 14px 0 0;box-shadow:0 -10px 40px -10px rgba(20,17,14,.3);display:flex;flex-direction:column;overflow:hidden}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 8px 18px;border-bottom:1px solid var(--w-line)}
.sheet .sh b{font:600 10px/1 'Geist Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:#7A5C3A}
.sheet .sh button{width:44px;height:44px;border:0;background:none;font-size:1rem;color:#8A8378;cursor:pointer}
.sheet iframe{flex:1;width:100%;border:0;background:#F3F1EC}

/* ── finish: the check (v1's) ── */
.res{text-align:center;padding-top:1.4rem}
.res .n{font-family:'Anton',Impact,sans-serif;font-size:4.2rem;line-height:1;margin:0}
.res .u{font:600 .62rem/1 'Geist Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--w-dim);margin:.35rem 0 0}
.facts{display:flex;justify-content:center;flex-wrap:wrap;gap:.4rem;margin:1rem 0 0}
.facts span{display:inline-flex;align-items:center;gap:.3rem;min-height:30px;padding:0 .75rem;border-radius:999px;border:1px solid #C9C1B4;background:#FBF8F3;font:600 .7rem/1 'Geist Mono',monospace;letter-spacing:.04em}
.facts span.ok{border-color:var(--w-ok);color:var(--w-ok)} .facts span.no{border-color:var(--w-no);color:var(--w-no)}
.chk{margin:1.6rem 6px 0;text-align:left}
.chk h2{font-family:'Anton',Impact,sans-serif;font-weight:400;font-size:1.5rem;text-transform:uppercase;margin:0 0 .25rem;display:flex;align-items:center;gap:.6rem}
.chk h2::before{content:'';width:26px;height:10px;background:var(--w-car);flex:none}
.chk p.how{font-size:.84rem;color:var(--w-dim);margin:0 0 .7rem;line-height:1.45}
.tick{display:flex;gap:.7rem;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--w-line);background:#FBF8F3;padding:.7rem .8rem;margin:0 0 .45rem;border-radius:6px;cursor:pointer;font:inherit;color:var(--w-ink)}
.tick .mk{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--w-ink);display:grid;place-items:center;font-size:.8rem;margin-top:.05rem}
.tick.on{border-color:var(--w-ok);background:#EEF3EF}
.tick.on .mk{background:var(--w-ok);border-color:var(--w-ok);color:#fff}
.tick.on .mk::after{content:'✓'}
.tick b{display:block;font:600 .6rem/1.2 'Geist Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--w-dim);margin-bottom:.2rem}
.tick span{font-size:.9rem;line-height:1.4}
.next{margin:.9rem 0 0;padding:.7rem .9rem;background:#F3EADF;font-size:.88rem;line-height:1.45}
.next b{font:600 .6rem/1 'Geist Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#9A5A2C;display:block;margin-bottom:.3rem}
.outs{display:flex;flex-direction:column;align-items:center;gap:.6rem;margin:1.8rem 0 0}
.outs .pri{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 1.8rem;border:0;border-radius:999px;background:var(--w-ink);color:#FBF8F3;
  font:700 1rem/1 var(--f-body,'Geist',sans-serif);cursor:pointer;box-shadow:0 0 0 3px #FBF8F3,0 0 0 6px var(--w-car)}
.outs .sec{display:inline-flex;align-items:center;min-height:44px;padding:0 1rem;border:0;background:none;color:#8E6238;font:650 .92rem/1 var(--f-body,'Geist',sans-serif);cursor:pointer}
.toast{position:fixed;left:50%;bottom:5rem;transform:translateX(-50%);background:var(--w-ink);color:#FBF8F3;padding:.55rem 1rem;border-radius:999px;font-size:.84rem;z-index:80;max-width:90vw;text-align:center}
</style>

</head>
<body>
<div class="top">
  <header class="header">
    <div class="header-top">
      <a class="back-link" id="back" href="/skills/writing/gate.html?task=essays" target="_top">← Essay</a>
      <div class="header-title"><div class="app-title">INTUITY</div><div class="app-subtitle">Write it</div></div>
      <span class="header-spacer">Level <b>B2</b></span>
    </div>
  </header>
  <div class="rib" id="rib" hidden>
    <div class="rtabs" id="rtabs" role="tablist" aria-label="Tools">
      <button type="button" role="tab" data-r="plan">Plan</button><button type="button" role="tab" data-r="phrases">Phrases</button><button type="button" role="tab" data-r="model">Model</button><button type="button" role="tab" data-r="check">Check</button>
    </div>
    <div class="strip" id="strip"></div>
  </div>
  <div class="pin" id="pin" hidden aria-live="polite"><span class="k">Type it</span><span class="p" id="pinP"></span><button type="button" id="pinX" aria-label="Unpin">✕</button></div>
</div>
<main class="stage" id="stage"><p style="text-align:center;color:var(--w-faint)">Loading…</p></main>
<div class="status" id="status" hidden><div class="in">
  <span class="wc"><b id="wc">0</b> words <span class="bar"><i class="z"></i><i class="f" id="fill"></i></span></span><span class="sep">|</span>
  <span id="pc">¶ 1/4</span><span class="sep">|</span><span id="ph" title="Bank phrases you have typed">✦ 0</span>
  <button type="button" class="fin" id="fin">Finish</button>
</div></div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P=new URLSearchParams(location.search);
const MIN=140, MAX=190;

/* each task: its question bank and the four self-checks (as v1) */
const TASKS={
  essays:{name:'Essay',word:'essay',src:['/skills/writing/essays/data/essay-questions.json'],
    norm:q=>({id:q.id,title:q.topic,lead:q.context,q:q.mainQuestion,lab:'Notes',list:q.writingPoints,etype:q.essayType}),
    checks:[['Content','I covered both notes and added an idea of my own.'],['Communicative Achievement','It sounds right for a teacher: formal, no contractions, my opinion clear.'],['Organisation','An introduction, two or three body paragraphs and a conclusion, each with one job.'],['Language','I used some less common words and a few longer sentences I am sure of.']]},
  emails:{name:'Email / Letter',word:'email',src:['/skills/writing/emails/data/emails-questions-formal.json','/skills/writing/emails/data/emails-questions-informal.json'],
    norm:q=>{ const d=q.questionData||q; return {id:q.id+(q.questionData?'-i':'-f'),title:q.title||q.topic,lead:d.context||'',q:d.question,lab:'In your email',list:d.keyPoints,informal:!!q.questionData}; },
    checks:[['Content','I answered every question in the message and gave all the information asked for.'],['Communicative Achievement','The tone fits the reader: formal for an organisation, friendly for a friend.'],['Organisation','A greeting, an opening, a paragraph for each point and a suitable ending.'],['Language','I used some less common words and a few longer sentences I am sure of.']]},
  articles:{name:'Article',word:'article',src:['/skills/writing/articles/data/article-questions.json'],
    norm:q=>({id:q.id,title:q.title,lead:'You see this announcement in an English-language magazine.',q:q.question,note:q.print}),
    checks:[['Content','I answered every question in the task and gave examples of my own.'],['Communicative Achievement','It talks to the reader: a catchy title, a question or two, my own voice.'],['Organisation','A title, an opening that hooks, a paragraph for each point, a closing thought.'],['Language','I used some less common words and a few longer sentences I am sure of.']]},
  reviews:{name:'Review',word:'review',src:['/skills/writing/reviews/data/review-questions.json'],
    norm:q=>({id:q.id,title:q.topic,lead:[q.context,q.announcement].filter(Boolean).join(' '),q:q.question}),
    checks:[['Content','I described it, covered every point in the question and said who it is for.'],['Communicative Achievement','It sounds like a review: lively, it talks to the reader, my opinion is clear.'],['Organisation','A title, an opening, a paragraph for each feature, a recommendation to finish.'],['Language','I used some less common words and a few longer sentences I am sure of.']]},
  story:{name:'Story',word:'story',src:['/skills/writing/narrative/data/narrative-questions.json'],
    norm:q=>({id:q.id,title:q.title,lead:q.prompt,q:q.opening,open:true,lab:'Your story must include',list:q.mustInclude}),
    checks:[['Content','I began with the sentence the task gives, used everything it must include, and the story makes sense.'],['Communicative Achievement','It keeps the reader hooked: feelings, a little suspense, a real ending.'],['Organisation','A beginning, a middle where something happens and an ending, linked by time words.'],['Language','Past tenses used well, and some less common words.']]},
  reports:{name:'Report',word:'report',src:['/skills/writing/reports/data/report-questions.json'],
    norm:q=>({id:q.id,title:String(q.id||'').replace(/-/g,' ').replace(/^./,c=>c.toUpperCase()),lead:q.context,q:q.question,lab:'In your report',list:q.keyPoints}),
    checks:[['Content','I covered every point the question asks for and made a recommendation.'],['Communicative Achievement','It sounds like a report: formal and factual, no chatty language.'],['Organisation','A title and clear headings: introduction, findings, recommendation.'],['Language','I used some less common words and a few longer sentences I am sure of.']]}
};
/* THE PLAN: one box per paragraph. [role, job (the grey hint), part of the text: 0 opening, 1 body, 2 close] */
const PLAN={
  essays:[['Intro','Introduce the topic and say what you will do.',0],['Note 1','{1}: a reason and an example.',1],['Note 2','{2}: the other side, or a second reason.',1],['Your idea','A point of your own, with an example.',1],['End','Your opinion, with a reason.',2]],
  emails:[['Opening','Greet the reader and say why you are writing.',0],['Point 1','Answer the first thing they asked.',1],['Point 2','The next point, with a detail.',1],['Closing','Round off and sign off in the right tone.',2]],
  articles:[['Title','A short title that makes people read.',0],['Hook','Talk to the reader: a question or a surprise.',0],['Point 1','Your first point, with an example of your own.',1],['Point 2','Your second point.',1],['Closing','A final thought or a question to the reader.',2]],
  reviews:[['Title','The name of what you review, and a hint of your view.',0],['Opening','What it is, and your first impression.',0],['Features','What is good about it, in detail.',1],['But…','What could be better.',1],['Verdict','Who it is for: recommend it or not.',2]],
  reports:[['Title','A clear, factual title.',0],['Intro','The aim of the report and how you found out.',0],['Heading 1','The first finding, under a heading.',1],['Heading 2','The second finding, under a heading.',1],['Recommend','What should be done, and why.',2]],
  story:[['Start','Start with the given sentence: who, where, when.',0],['Middle','Something happens: feelings, a little suspense.',1],['Climax','The most exciting moment.',1],['Ending','How it ends, and how they felt.',2]]
};
const SHEET_OF={'for-against':'fa',opinion:'op','agree-disagree':'ad','problem-solution':'ps','cause-effect':'ce','speculation-trends':'st'};
const LINKERS=[['Add','In addition,','Furthermore,','What is more,'],['Contrast','However,','On the other hand,','Although …,'],['Cause','This is because …','Due to …,','Since …,'],['Result','As a result,','Therefore,','Consequently,'],['Example','For example,','For instance,','such as …'],['Sum up','On balance,','All in all,','To sum up,']];
const FORMAL=k=>k==='essays'||k==='reports';   /* contractions flagged where the register is formal */

const K=TASKS[P.get('task')]?P.get('task'):'essays', T=TASKS[K];
$('back').textContent='← '+T.name; $('back').href='/skills/writing/gate.html?task='+K;
document.title='INTUITY — Write it · '+T.name;
const store={get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
             set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }};
const AT='intuity.write.'+K+'.at', DONE='intuity.write.'+K+'.done', RIBK='intuity.write.rib';
const dKey=q=>'intuity.write.'+K+'.'+q.id;
let QS=[], qi=0, PORT=null, Q=null, D=null, cur=0, RIB='plan', PIN=null, SEGS=[];

function words(t){ return (String(t).match(/[A-Za-zÀ-ɏ0-9]+(?:['’-][A-Za-zÀ-ɏ0-9]+)*/g)||[]).length; }
function toast(m){ document.querySelectorAll('.toast').forEach(x=>x.remove()); const d=document.createElement('div'); d.className='toast'; d.textContent=m; document.body.appendChild(d); setTimeout(()=>d.remove(),2400); }
const clean=s=>String(s).replace(/\*\*/g,'').replace(/^[#!]+\s*/,'').trim();

/* the task's phrases for one part of the text (0 opening, 1 body, 2 close), by sheet */
function phrasesFor(part){
  if(!PORT) return [];
  let keys=(PORT.tasks[K]||[]).slice();
  if(K==='essays'&&Q&&SHEET_OF[Q.etype]) keys.sort((a,b)=>(a===SHEET_OF[Q.etype]?-1:b===SHEET_OF[Q.etype]?1:0));
  if(K==='emails'&&Q) keys.sort((a,b)=>((a==='ei')===!!Q.informal?-1:1));
  return keys.map(k=>{ const sh=PORT.sheets[k], b=sh&&sh.bands[part]; if(!b) return null;
    const items=[]; (b.cols||[]).forEach(c=>c.forEach(i=>{ if(typeof i==='string'&&!/^[#!]/.test(i)) items.push(clean(i)); }));
    return {name:sh.tab,items}; }).filter(g=>g&&g.items.length);
}
/* what the page can recognise as a typed bank phrase: each fixed run of 3+ words */
function buildSegs(){
  const seen=new Set(); SEGS=[];
  (PORT&&PORT.tasks[K]||[]).forEach(k=>{ const sh=PORT.sheets[k]; if(!sh) return;
    sh.bands.forEach(b=>(b.cols||[]).forEach(c=>c.forEach(i=>{ if(typeof i!=='string'||/^[#!]/.test(i)) return;
      clean(i).split(/…|\.\.\.|\/|\(|\)/).forEach(seg=>{ const t=seg.replace(/[,;:.?!]+$/,'').trim();
        if(t.split(/\s+/).length>=3&&!seen.has(t.toLowerCase())){ seen.add(t.toLowerCase()); SEGS.push(t); } }); }))); });
  SEGS.sort((a,b)=>b.length-a.length);
}
function found(text){ const low=text.toLowerCase(), out=[]; SEGS.forEach(s=>{ let i=low.indexOf(s.toLowerCase()); while(i>=0){ if(!out.some(r=>i<r[1]&&i+s.length>r[0])) out.push([i,i+s.length,s]); i=low.indexOf(s.toLowerCase(),i+1); } }); return out.sort((a,b)=>a[0]-b[0]); }

/* ═══ THE GATE: choose the question; the pendulum opens the page ═══ */
function qHTML(q){
  return '<div class="qcard"><div class="k">'+esc(T.name)+' · '+(K==='essays'?'Part 1':'Part 2')+' · '+MIN+'–'+MAX+' words</div>'+
    (q.title?'<p class="t">'+esc(q.title)+'</p>':'')+(q.lead?'<p class="lead">'+esc(q.lead)+'</p>':'')+
    '<p class="q">'+(q.open?'Begin with: ':'')+esc(q.q)+'</p>'+
    (q.list&&q.list.length?'<p class="lab">'+esc(q.lab||'Include')+'</p><ul>'+q.list.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'')+
    (q.note?'<p class="lead" style="margin:.5rem 0 0">'+esc(q.note)+'</p>':'')+'</div>';
}
function gate(){
  $('rib').hidden=true; $('pin').hidden=true; $('status').hidden=true;
  const q=QS[qi], d=store.get(dKey(q),null), n=store.get(DONE,0), going=d&&textOf(d).trim()&&!d.done;
  document.documentElement.style.setProperty('--mark-pct',Math.max(4,Math.min(100,n*10))+'%');
  $('stage').innerHTML='<section class="gate">'+
    '<button type="button" class="gate-mark pend-hang" id="dial" aria-label="Start"><div class="pend-dial"><span>'+(going?'GO ON':'START')+'</span></div></button>'+
    '<h1 class="big">1 '+esc(T.word)+'.<br>Your words.</h1><p class="sm">Plan it, choose your phrases, write it in your own hand. Nothing pastes in: typing them is how they stick.</p>'+
    (n?'<p class="tally">'+n+' written so far</p>':'')+qHTML(q)+
    '<div class="qnav"><button type="button" id="qPrev" aria-label="Previous question"'+(qi?'':' disabled')+'>‹</button><span>Question '+(qi+1)+' of '+QS.length+'</span><button type="button" id="qNext" aria-label="Next question"'+(qi<QS.length-1?'':' disabled')+'>›</button></div>'+
    (going?'<p class="draft">Your draft is kept: '+words(textOf(d))+' words</p>':'')+'</section>';
  $('dial').onclick=open;
  $('qPrev').onclick=()=>{ qi=Math.max(0,qi-1); store.set(AT,qi); gate(); };
  $('qNext').onclick=()=>{ qi=Math.min(QS.length-1,qi+1); store.set(AT,qi); gate(); };
}
/* a draft: one string per paragraph (v1 kept one text; it splits on blank lines) */
function textOf(d){ return d.paras?d.paras.join('\n\n'):(d.text||''); }
function parasOf(d){ if(d.paras) return d.paras.slice(); return String(d.text||'').split(/\n\s*\n|\n/).map(s=>s.trim()).filter(Boolean); }

/* ═══ THE PAGE ═══ */
function open(){
  Q=QS[qi]; D=store.get(dKey(Q),null);
  const plan=PLAN[K];
  if(!D||D.done&&!D.reopen) D={paras:[],start:Date.now()};
  let ps=parasOf(D); while(ps.length<plan.length) ps.push('');
  if(K==='story'&&Q.open&&!ps[0]) ps[0]=Q.q+' ';
  D.paras=ps; delete D.text; D.done=false; save();
  $('stage').innerHTML='<div class="desk"><div class="paper" id="paper">'+
    '<div class="qh"><span class="k">'+esc(T.name)+' · '+(K==='essays'?'Part 1':'Part 2')+' · your question</span><p>'+esc(Q.q)+'</p>'+
      (Q.list&&Q.list.length?'<ol>'+Q.list.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol>':'')+'</div>'+
    '<div id="paras"></div><button type="button" class="addp" id="addp">+ Add a paragraph</button></div></div>';
  paintParas(); $('addp').onclick=()=>{ D.paras.push(''); save(); paintParas(); focusPara(D.paras.length-1); };
  $('rib').hidden=false; $('status').hidden=false;
  RIB=store.get(RIBK,'plan'); paintRib(); meter();
  if(!textOf(D).trim()) setTimeout(()=>focusPara(0),80);
  window.scrollTo({top:0});
}
function roleOf(i){ const plan=PLAN[K]; return plan[i]||['More','Another paragraph.',1]; }
function hintOf(i){ const r=roleOf(i); let h=r[1]; const L=(Q.list||[]).filter(x=>!/own idea/i.test(x));
  return h.replace('{1}',L[0]?'“'+L[0]+'”':'The first note').replace('{2}',L[1]?'“'+L[1]+'”':'The second note'); }
function paintParas(){
  $('paras').innerHTML=D.paras.map((t,i)=>'<div class="para'+(i===cur?' cur':'')+'" data-i="'+i+'"><span class="role">'+esc(roleOf(i)[0])+'</span>'+
    '<div class="pw"><div class="mir" aria-hidden="true"></div><textarea rows="1" spellcheck="true" autocapitalize="sentences" autocomplete="off" data-i="'+i+'" aria-label="'+esc(roleOf(i)[0])+'" placeholder="'+esc(hintOf(i))+'"></textarea></div></div>').join('');
  document.querySelectorAll('#paras textarea').forEach(ta=>{
    const i=+ta.dataset.i; ta.value=D.paras[i]; grow(ta); mirror(ta);
    ta.addEventListener('input',()=>{ D.paras[i]=ta.value; save(); grow(ta); mirror(ta); meter(); checkPin(); if(RIB==='check') paintRib(); });
    ta.addEventListener('focus',()=>{ if(cur!==i){ cur=i; document.querySelectorAll('.para').forEach(p=>p.classList.toggle('cur',+p.dataset.i===i)); meter(); if(RIB==='phrases'||RIB==='plan') paintRib(); } });
    /* NOTHING PASTES IN: typing it is how it sticks */
    ta.addEventListener('paste',e=>{ e.preventDefault(); toast('Type it yourself: that is how it sticks'); });
    ta.addEventListener('drop',e=>{ e.preventDefault(); toast('Type it yourself: that is how it sticks'); });
    ta.addEventListener('beforeinput',e=>{ if(e.inputType==='insertFromPaste'||e.inputType==='insertFromDrop'||e.inputType==='insertFromPasteAsQuotation'){ e.preventDefault(); toast('Type it yourself: that is how it sticks'); } });
    ta.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey&&ta.selectionStart===ta.value.length&&ta.value.trim()){ e.preventDefault(); if(i===D.paras.length-1){ D.paras.push(''); save(); paintParas(); } focusPara(i+1); } });
  });
}
function focusPara(i){ const ta=document.querySelector('#paras textarea[data-i="'+i+'"]'); if(ta){ ta.focus({preventScroll:false}); ta.setSelectionRange(ta.value.length,ta.value.length); } }
function grow(ta){ ta.style.height='auto'; ta.style.height=ta.scrollHeight+'px'; }
function mirror(ta){ const t=ta.value, hits=found(t); let h='', at=0; hits.forEach(([a,b])=>{ h+=esc(t.slice(at,a))+'<mark>'+esc(t.slice(a,b))+'</mark>'; at=b; }); h+=esc(t.slice(at))+'​'; ta.previousElementSibling.innerHTML=h; }
function save(){ store.set(dKey(Q),D); }
function used(){ const all=new Set(); D.paras.forEach(t=>found(t).forEach(h=>all.add(h[2].toLowerCase()))); return all.size; }
function meter(){
  const n=words(textOf(D)), filled=D.paras.filter(t=>words(t)>=4).length;
  $('wc').textContent=n; $('fill').style.width=Math.min(100,n/230*100)+'%';
  $('status').className='status'+(n>=MIN&&n<=MAX?' ok':n>MAX?' over':'');
  $('pc').textContent='¶ '+(cur+1)+'/'+D.paras.length; $('ph').textContent='✦ '+used();
  $('fin').onclick=finish;
}

/* ═══ THE RIBBON ═══ */
document.querySelectorAll('#rtabs button').forEach(b=>b.onclick=()=>{
  if(b.dataset.r==='model'){ model(); return; }
  RIB=b.dataset.r; store.set(RIBK,RIB); paintRib(); });
function paintRib(){
  document.querySelectorAll('#rtabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.r===RIB));
  const s=$('strip'); let h='';
  const part=roleOf(cur)[2];
  if(RIB==='plan'){
    h='<div class="grp"><h6>Your paragraphs</h6><div class="chips">'+PLAN[K].concat(D.paras.slice(PLAN[K].length).map(()=>['More','',1])).map((r,i)=>
      '<button type="button" class="chip'+(i===cur?' on':'')+(words(D.paras[i]||'')>=4?' ok':'')+'" data-p="'+i+'">'+(words(D.paras[i]||'')>=4?'✓ ':'')+esc(r[0])+'</button>').join('')+'</div></div>'+
      '<span class="note">'+esc(roleOf(cur)[0])+': '+esc(hintOf(cur))+'</span>';
  } else if(RIB==='phrases'){
    const gs=phrasesFor(part), label=['Opening','Body','Closing'][part];
    h=gs.map(g=>'<div class="grp"><h6>'+esc(label+' · '+g.name)+'</h6><div class="chips">'+g.items.map(p=>'<button type="button" class="chip" data-pin="'+esc(p)+'">'+esc(p)+'</button>').join('')+'</div></div>').join('')+
      '<div class="grp"><h6>Linkers</h6><div class="chips">'+LINKERS.map(l=>l.slice(1).map(p=>'<button type="button" class="chip" data-pin="'+esc(p)+'">'+esc(p)+'</button>').join('')).join('')+'</div></div>';
  } else if(RIB==='check'){
    const t=textOf(D), n=words(t), pc=D.paras.filter(x=>words(x)>=4).length, need=PLAN[K].length-(K==='essays'?1:0);
    const lk=new Set(); LINKERS.forEach(l=>l.slice(1).forEach(p=>{ const w=p.replace(/[…,]/g,'').trim().toLowerCase(); if(w&&t.toLowerCase().indexOf(w)>=0) lk.add(w); }));
    const rep=repeats(t), con=FORMAL(K)||K==='emails'&&Q&&!Q.informal?contractions(t):[];
    const notes=(Q.list||[]).filter(x=>!/own idea/i.test(x));
    h='<div class="grp"><h6>Length</h6><div class="chips"><span class="chip quiet '+(n>=MIN&&n<=MAX?'ok':'no')+'">'+(n>=MIN&&n<=MAX?'✓ ':'')+n+' words · '+MIN+'–'+MAX+'</span></div></div>'+
      (notes.length?'<div class="grp"><h6>Content · the notes</h6><div class="chips">'+notes.map(x=>{ const hit=covers(t,x); return '<span class="chip quiet '+(hit?'ok':'no')+'">'+(hit?'✓ ':'✗ ')+esc(x)+'</span>'; }).join('')+'</div></div>':'')+
      '<div class="grp"><h6>Organisation</h6><div class="chips"><span class="chip quiet '+(pc>=need?'ok':'no')+'">'+(pc>=need?'✓ ':'')+pc+' paragraphs</span><span class="chip quiet '+(lk.size>=4?'ok':'')+'">'+lk.size+' linkers</span></div></div>'+
      '<div class="grp"><h6>Language</h6><div class="chips"><span class="chip quiet '+(used()>=3?'ok':'')+'">✦ '+used()+' bank phrases</span>'+rep.map(r=>'<span class="chip quiet no">“'+esc(r[0])+'” × '+r[1]+'</span>').join('')+con.map(c=>'<span class="chip quiet no">'+esc(c)+'</span>').join('')+'</div></div>'+
      '<div class="grp"><h6>Done?</h6><div class="chips"><button type="button" class="chip go" id="fin2">Finish and tick the four</button></div></div>';
  }
  s.innerHTML=h; s.scrollLeft=0;
  s.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{ focusPara(+b.dataset.p); const el=document.querySelector('.para[data-i="'+b.dataset.p+'"]'); if(el) el.scrollIntoView({block:'center',behavior:'smooth'}); });
  s.querySelectorAll('[data-pin]').forEach(b=>b.onclick=()=>pin(b.dataset.pin));
  if($('fin2')) $('fin2').onclick=finish;
}
/* a phrase is pinned, never inserted: the pupil types it while he looks */
function pin(p){ PIN=p; $('pinP').textContent=p; $('pin').hidden=false; $('pin').classList.remove('done'); if(window.Cheer){ try{ Cheer.tick&&Cheer.tick($('pin')); }catch(e){} } focusPara(cur); checkPin(); }
$('pinX').onclick=()=>{ PIN=null; $('pin').hidden=true; };
function checkPin(){
  if(!PIN||$('pin').classList.contains('done')) return;
  /* each fixed part must be there; "Nowadays / These days" accepts either */
  const parts=PIN.split(/…|\.\.\./).map(x=>x.replace(/[,;:.?!]+$/,'').trim().toLowerCase()).filter(x=>x.length>2);
  const t=(D.paras[cur]||'').toLowerCase();
  /* a slash swaps the words before it: "who has never thought of / pictured" is
     "who has never thought of" or "who has never pictured" */
  const tidy=a=>a.replace(/[,;:.?!()]+/g,' ').replace(/\s+/g,' ').trim();
  const has=x=>{ const alts=x.split('/').map(tidy).filter(Boolean); if(alts.length<2) return t.indexOf(tidy(x))>=0;
    const first=alts[0].split(' '), vars=[alts[0]];
    alts.slice(1).forEach(a=>{ for(let k=1;k<=Math.min(3,first.length);k++) vars.push(first.slice(0,first.length-k).concat(a.split(' ')).join(' ')); });
    return vars.some(v=>v.split(' ').length>=2?t.indexOf(v)>=0:new RegExp('\\b'+v+'\\b').test(t)); };
  if(parts.length&&parts.every(has)){ $('pin').classList.add('done'); toast('Typed from the bank ✦'); if(window.Cheer){ try{ Cheer.right($('pin'),true); }catch(e){} } }
}
/* the facts the app can count */
const STOP=new Set('about after again against because before being between could their there these those which while would should other where through people really things thing think every'.split(' '));
function repeats(t){ const c={}; (t.toLowerCase().match(/[a-z']{5,}/g)||[]).forEach(w=>{ if(!STOP.has(w)) c[w]=(c[w]||0)+1; }); return Object.entries(c).filter(e=>e[1]>=3).sort((a,b)=>b[1]-a[1]).slice(0,3); }
function contractions(t){ const m=t.match(/\b\w+(?:n't|'re|'ve|'ll|'m|'d)\b/gi)||[]; return [...new Set(m.map(x=>x.toLowerCase()))].slice(0,3).map(x=>x+' → in full'); }
function covers(t,note){ const low=t.toLowerCase(); return String(note).toLowerCase().replace(/[^a-z ]/g,' ').split(/\s+/).filter(w=>w.length>=4).some(w=>low.indexOf(w.slice(0,Math.max(4,w.length-2)))>=0); }

/* ── the model: any time, in a sheet (it cannot be pasted in) ── */
function model(){
  const type=K==='story'?'story':K;
  const bg=document.createElement('div'); bg.className='sheet-bg';
  const sh=document.createElement('div'); sh.className='sheet'; sh.setAttribute('role','dialog'); sh.setAttribute('aria-label','A model '+T.word);
  sh.innerHTML='<div class="sh"><b>A model '+esc(T.word)+'</b><button type="button" aria-label="Close">✕</button></div><iframe title="A model '+esc(T.word)+'" src="/skills/writing/build.html?type='+type+'&view=models&embed=1"></iframe>';
  document.body.append(bg,sh);
  const close=()=>{ bg.remove(); sh.remove(); };
  bg.onclick=close; sh.querySelector('button').onclick=close;
  addEventListener('keydown',function k(e){ if(e.key==='Escape'){ close(); removeEventListener('keydown',k); } });
  const fr=sh.querySelector('iframe');
  fr.onload=()=>{ try{ const d=fr.contentDocument, st=d.createElement('style');
    st.textContent='.header,.topbar,nav.roof,.back-link{display:none!important}body{-webkit-user-select:none;user-select:none}';
    d.head.appendChild(st); d.addEventListener('copy',e=>e.preventDefault()); }catch(e){} };
}

/* ═══ FINISH: the facts, then the four criteria to tick (v1) ═══ */
function finish(){
  const t=textOf(D), n=words(t);
  if(n<20){ toast('Write a little more first'); return; }
  $('rib').hidden=true; $('pin').hidden=true; $('status').hidden=true;
  const first=!D.everDone; D.done=true; D.everDone=true; D.end=Date.now(); save();
  const inRange=n>=MIN&&n<=MAX, pc=D.paras.filter(x=>words(x)>=4).length, need=PLAN[K].length-(K==='essays'?1:0), u=used();
  if(first){ store.set(DONE,store.get(DONE,0)+1); try{ if(window.Be2&&Be2.score) Be2.score('writing',inRange); }catch(e){} }
  const ticks=new Set(D.ticks||[]);
  $('stage').innerHTML='<section class="res">'+
    '<p class="n" id="num">'+n+'</p><p class="u">words</p>'+
    '<div class="facts"><span class="'+(inRange?'ok':'no')+'">'+(inRange?'✓ In range':n<MIN?(MIN-n)+' short':(n-MAX)+' over')+'</span>'+
      '<span class="'+(pc>=need?'ok':'no')+'">'+pc+' paragraph'+(pc===1?'':'s')+'</span>'+
      '<span class="'+(u>=3?'ok':'')+'">✦ '+u+' bank phrase'+(u===1?'':'s')+'</span></div></section>'+
    '<section class="chk"><h2>Check it</h2><p class="how">Read your '+esc(T.word)+' once more, then tick each line that is true. Be honest: the one you can’t tick is where to start next time.</p>'+
      T.checks.map((c,i)=>'<button type="button" class="tick'+(ticks.has(i)?' on':'')+'" data-i="'+i+'" role="checkbox" aria-checked="'+ticks.has(i)+'"><i class="mk"></i><span><b>'+esc(c[0])+'</b>'+esc(c[1])+'</span></button>').join('')+
      '<div class="next" id="next"></div></section>'+
    '<div class="outs"><button type="button" class="pri" id="copy">Copy it for your teacher</button>'+
      '<button type="button" class="sec" id="edit">Keep writing</button>'+
      (qi<QS.length-1?'<button type="button" class="sec" id="another">Next question</button>':'')+'</div>';
  const paint=()=>{
    const miss=T.checks.filter((_,i)=>!ticks.has(i)).map(c=>c[0]);
    const tip=!inRange?(n<MIN?'Add a sentence or two to the paragraph with the least detail: under '+MIN+' words loses marks for Content.':'Cut to '+MAX+' words: take out a repeated idea, not a whole paragraph.'):'';
    $('next').innerHTML='<b>Next time</b>'+(miss.length?'Start with '+esc(miss[0])+(miss.length>1?' (then '+miss.slice(1).map(esc).join(', ')+')':'')+'. '+tip:(tip||'All four ticked. Ask your teacher to mark it, and try a new question.'));
  };
  document.querySelectorAll('.tick').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i; ticks.has(i)?ticks.delete(i):ticks.add(i);
    b.classList.toggle('on',ticks.has(i)); b.setAttribute('aria-checked',ticks.has(i));
    D.ticks=[...ticks]; save(); paint();
    if(ticks.has(i)&&window.Cheer){ try{ ticks.size===4?Cheer.done(b):Cheer.tick(b); }catch(e){} }
  });
  paint();
  /* his own text goes OUT to the teacher; nothing comes in */
  $('copy').onclick=()=>{
    const out=Q.q+'\n\n'+D.paras.map(x=>x.trim()).filter(Boolean).join('\n\n')+'\n\n('+n+' words)';
    const ok=()=>toast('Copied: paste it into a message to your teacher');
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(out).then(ok,()=>fallback(out,ok)); else fallback(out,ok);
  };
  $('edit').onclick=()=>{ D.reopen=true; save(); open(); };
  if($('another')) $('another').onclick=()=>{ qi++; store.set(AT,qi); gate(); window.scrollTo({top:0}); };
  window.scrollTo({top:0});
  if(first&&inRange&&window.Cheer){ try{ Cheer.done($('num')); }catch(e){} }
}
function fallback(t,ok){ const a=document.createElement('textarea'); a.value=t; a.style.position='fixed'; a.style.opacity='0'; document.body.appendChild(a); a.select(); try{ document.execCommand('copy'); ok(); }catch(e){} a.remove(); }

/* ── load: the task's questions and the portfolio (the phrases) ── */
Promise.all([
  Promise.all(T.src.map(u=>fetch(u).then(r=>r.ok?r.json():null).catch(()=>null))),
  fetch('/data/writing/portfolio.json').then(r=>r.ok?r.json():null).catch(()=>null)
]).then(([ds,port])=>{
  PORT=port; buildSegs();
  ds.forEach(d=>{ if(!d) return; const list=Array.isArray(d)?d:(d.questions||d.emails||[]); list.forEach(x=>{ try{ const q=T.norm(x); if(q&&q.q) QS.push(q); }catch(e){} }); });
  if(!QS.length){ $('stage').innerHTML='<p style="text-align:center">The questions didn’t load. Check your connection and reload.</p>'; return; }
  const want=P.get('q'); qi=want?Math.max(0,QS.findIndex(q=>q.id===want)):Math.min(QS.length-1,+store.get(AT,0)||0);
  gate();
});
})();
</script>
