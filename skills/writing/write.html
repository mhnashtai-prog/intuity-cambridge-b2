<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>INTUITY — Write it</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..900&family=Geist+Mono:wght@400..600&family=Space+Grotesk:wght@700&family=Anton&family=Kalam:wght@400;700&display=swap" rel="stylesheet">

<style>
/* ═══════════════════════════════════════════════════════════════════════
   WRITE IT · v3 (14 Nov 2026, night) · an empty page, help on call

   The owner, after trying v2's ribbon: the page itself should be empty, as
   in v1; the help is a few small pills in the header that open cards and
   close, read-only, and hardly touch the page. So:
   · Three pills: Question · Model · Phrases. (Phrases is the task's
     Essentials: the two were the same content, so one pill.)
   · Each opens a card in the FiveCard look; it can be read, nothing else:
     no selecting, no copying, and the page takes no paste or drop.
   · One sheet of paper, the pupil's own text in a handwriting face (Kalam):
     the exam is written by hand. No clock: this is for retention.
   · A thin bar: words against 140–190, Finish. Finish keeps v1's four
     criteria to tick and the copy for the teacher.
   v2 (the Word-style ribbon) is in git history: c8ac7a28.
   ═══════════════════════════════════════════════════════════════════════ */
:root{ --mark-sweep:#C2956E; --mark-rest:#4A433D; --mark-core:#201E1C; --mark-ink:#E5D1B8; --mark-pct:4%;
  --w-ink:#14110E; --w-dim:#5C5852; --w-faint:#9A948B; --w-line:rgba(20,17,14,.12);
  --w-car:#C2956E; --w-ok:#4F7A63; --w-no:#B4532F; --w-hand:'Kalam','Comic Neue','Bradley Hand',cursive }
[hidden]{display:none!important}
body{background:var(--bg,#F3F1ED)}
.top{position:sticky;top:0;z-index:20;background:#FAF8F5}
.top .header{position:static}
.stage{max-width:40rem;margin:0 auto;padding:0 10px 6rem;color:var(--w-ink)}
/* the help pills: small, quiet, in the header */
.helps{display:flex;justify-content:center;gap:6px;padding:0 0 10px}
.helps button{min-height:32px;padding:0 13px;border:1px solid rgba(20,17,14,.16);border-radius:999px;background:#fff;color:var(--w-dim);font:600 .66rem/1 'Geist Mono',ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.helps button:active{background:#F3EADF}
/* the gate */
.gate{text-align:center;padding:0 6px 0}
/* 19 Nov 2026 (the owner: "the wrong pendulum design… a little dense or too dark"): the gate is Basics'
   gate. The pendulum hangs from the header's hairline with the sage mark, no big black headline,
   one grey line, and the question on a plain white card */
:root{--mark-sweep:#8AA79C}
.gate .pend-hang::after{display:none}   /* the string meets the hairline, as on Basics: no pin */
/* the pendulum swings, the target does not (15 Nov 2026, a learner's review): the whole
   square around the dial, string included, is one still button */
.gate .gate-tap{display:block;width:200px;height:172px;margin:0 auto .2rem;border:0;padding:40px 0 0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.gate .gate-tap:focus-visible{outline:2px solid #C2956E;outline-offset:2px;border-radius:12px}
.gate .gate-mark{display:block;width:124px;height:124px;margin:0 auto}
.gate .gate-mark .pend-dial span{font-size:1rem;letter-spacing:.12em;padding-left:.12em}
.big{font-family:'Anton',Impact,sans-serif;font-weight:400;font-size:clamp(2.2rem,10.5vw,3rem);line-height:.98;text-transform:uppercase;color:var(--w-ink);margin:0}
.sm{font-size:.95rem;line-height:1.45;color:#5C5852;margin:.2rem auto 0;max-width:21rem}
/* 17 Nov 2026 (the owner): the essay's "One question, five ways" clip, as the same small PLAY pill
   as the essay's question row (writing-chrome.js): ringed, sage and black play mark */
.how-pill{display:inline-flex;margin:.9rem auto 0;padding:2.5px;border:1.2px solid #C9C1B5;border-radius:999px;text-decoration:none;-webkit-tap-highlight-color:transparent}
.how-pill span{display:inline-flex;align-items:center;gap:5px;height:30px;box-sizing:border-box;padding:0 12px 0 8px;border:1.5px solid #1E1B18;border-radius:999px;background:#FAF8F5}
.how-pill b{font:700 .625rem/1 "Geist",system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#14110E}
.wi{margin:14px auto 0;max-width:30rem;text-align:center;font-size:.875rem;line-height:1.45;color:#5C5852}
.xhow{display:flex;justify-content:center;margin-top:.2rem}
.how-pill:active span{transform:scale(.96)}.how-pill:focus-visible{outline:2px solid #C2956E;outline-offset:2px}
.tally{font:600 .62rem/1 'Geist Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#9A5A2C;margin:1rem 0 0}
.qcard{margin:1.2rem 0 0;padding:1rem 1.1rem 1.05rem;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.08);text-align:left}
.qcard .k{font:600 .6rem/1 'Geist Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--w-dim);margin-bottom:.45rem}
.qcard .t{font-weight:700;font-size:.98rem;margin:0 0 .3rem}
.qcard .lead{font-size:.86rem;line-height:1.45;color:var(--w-dim);margin:0 0 .4rem}
.qcard .q{font-size:.95rem;line-height:1.5;margin:0}
.qcard ul{margin:.45rem 0 0;padding-left:1.1rem;font-size:.88rem;line-height:1.45}
.qcard .lab{font:600 .58rem/1 'Geist Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#5E7A70;margin:.7rem 0 0}
.qnav{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin:.6rem 0 0}
.qnav button{width:44px;height:44px;flex:none;border-radius:50%;border:1.5px solid rgba(20,17,14,.2);background:none;color:var(--w-ink);font-size:1.3rem;line-height:1;display:grid;place-items:center;cursor:pointer;padding:0 0 .1em}
.qnav button:disabled{opacity:.3;cursor:default}
.qnav span{font:500 .72rem/1 'Geist Mono',monospace;color:var(--w-dim)}
.draft{font-size:.8rem;color:var(--w-ok);margin:.7rem 0 0;font-weight:600}
/* THE PAGE: one sheet, nothing else */
.paper{margin-top:12px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.06),0 12px 32px -14px rgba(20,17,14,.2);border-radius:2px;padding:18px 16px 22px}
.paper textarea{display:block;width:100%;box-sizing:border-box;min-height:calc(100dvh - 15rem);border:0;resize:none;background:transparent;color:var(--w-ink);font:400 19px/1.6 var(--w-hand);padding:0;outline:none}
.paper textarea::placeholder{color:#BDB5AA;font:italic 400 14.5px/1.5 var(--f-body,'Geist'),sans-serif}
/* the bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(250,248,245,.97);border-top:1px solid var(--w-line);padding:.55rem 14px calc(.55rem + env(safe-area-inset-bottom))}
.bar .in{max-width:40rem;margin:0 auto;display:flex;align-items:center;gap:.8rem}
.meter{flex:1;min-width:0}
.meter .nums{font:600 .78rem/1 'Geist Mono',monospace;color:var(--w-ink)}
.meter .nums i{font-style:normal;color:var(--w-faint);font-weight:500}
.meter .track{position:relative;height:6px;border-radius:3px;background:rgba(20,17,14,.08);margin-top:.4rem;overflow:hidden}
.meter .zone{position:absolute;top:0;bottom:0;left:60.87%;width:21.74%;background:rgba(79,122,99,.22)}
.meter .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--w-ink);border-radius:3px;transition:width .2s}
.meter.ok .fill{background:var(--w-ok)} .meter.over .fill{background:var(--w-no)}
.done{min-height:44px;padding:0 1.2rem;border:0;border-radius:999px;background:var(--w-ink);color:#FBF8F3;font:700 .9rem/1 var(--f-body,'Geist',sans-serif);cursor:pointer}
/* THE HELP CARDS: FiveCard's study card in a modal, read-only */
.scrim{position:fixed;inset:0;z-index:900;display:flex;align-items:center;justify-content:center;padding:1rem;background:rgba(246,244,240,.72);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);opacity:0;transition:opacity .25s}
.scrim.on{opacity:1}
.focus{position:relative;width:min(31rem,100%);max-height:calc(100dvh - 2rem);overflow-y:auto;box-shadow:0 30px 70px -30px rgba(20,17,14,.28),0 4px 14px rgba(20,17,14,.06);border-radius:2px;transform:translateY(20px) scale(.98);transition:transform .4s cubic-bezier(.2,1.3,.4,1);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.scrim.on .focus{transform:none}
.focus .fc-card{border:0;padding:26px 22px 22px}
.focus .x{position:absolute;top:.6rem;right:.6rem;z-index:2;width:44px;height:44px;border:none;background:none;font-size:1rem;color:#8A8378;cursor:pointer}
.focus .fc-t{padding-right:2rem}
.hlist{list-style:none;margin:6px 0 0;padding:0}
.hlist li{font:400 15px/1.45 var(--f-body,'Geist'),sans-serif;color:#3E3934;padding:7px 0;border-top:1px solid rgba(20,17,14,.08)}
.hlist li:first-child{border-top:0}
.hpart{display:block;margin:18px 0 0;font:600 9.5px/1 'Geist Mono',monospace;letter-spacing:.18em;text-transform:uppercase;color:#9A5A2C}
.hsets{display:flex;gap:4px;flex-wrap:wrap;margin:12px 0 0}
.hsets button{border:0;background:none;padding:.45rem .4rem .3rem;font:700 .64rem/1 'Geist Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:#9A948B;cursor:pointer}
.hsets button.on{color:var(--w-ink);box-shadow:inset 0 -2px 0 var(--w-car)}
.focus.model{width:min(34rem,100%);height:min(86dvh,52rem);display:flex;flex-direction:column}
.focus.model .fc-card{flex:none;padding-bottom:8px}
.focus.model iframe{flex:1;width:100%;border:0;background:#F3F1EC}
/* the question card, set out as the exam paper is */
.xr{display:block;margin:14px 0 0}
.xr p{margin:0 0 8px;font:400 15px/1.5 var(--f-body,'Geist'),sans-serif;color:#3E3934}
.xr b{color:var(--w-ink)}
.xbox{display:block;margin:12px 0 4px;border:1.5px solid var(--w-ink);padding:16px 16px 14px;background:#fff}
.xq{margin:0 0 12px;font:700 17px/1.45 var(--f-body,'Geist'),sans-serif;color:var(--w-ink)}
.xq.x2{font-weight:400;font-size:16px}   /* Part 2: the task in plain type, as on the paper */
.xl{margin:14px 0 2px;font:700 14px/1.3 var(--f-body,'Geist'),sans-serif;color:var(--w-ink)}
.xw{margin:6px 0 6px;font:400 14.5px/1.45 var(--f-body,'Geist'),sans-serif;color:#3E3934}
.xn{margin:6px 0 0;padding-left:1.6em;font:400 16px/1.5 var(--f-body,'Geist'),sans-serif;color:var(--w-ink)}
.xn li{padding:4px 0 4px 4px}
.xn .dots{display:inline-block;width:7em;border-bottom:1.5px dotted #8A847C;transform:translateY(-3px)}
.xb{margin:6px 0 0;padding-left:1.2em;font:400 15.5px/1.5 var(--f-body,'Geist'),sans-serif;color:var(--w-ink)}
.xb li{padding:3px 0}
/* finish */
.res{text-align:center;padding-top:1.4rem}
.res .n{font-family:'Anton',Impact,sans-serif;font-size:4.2rem;line-height:1;margin:0}
.res .u{font:600 .62rem/1 'Geist Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--w-dim);margin:.35rem 0 0}
.facts{display:flex;justify-content:center;flex-wrap:wrap;gap:.4rem;margin:1rem 0 0}
.facts span{display:inline-flex;align-items:center;min-height:30px;padding:0 .75rem;border-radius:999px;border:1px solid #C9C1B4;background:#FBF8F3;font:600 .7rem/1 'Geist Mono',monospace;letter-spacing:.04em}
.facts span.ok{border-color:var(--w-ok);color:var(--w-ok)} .facts span.no{border-color:var(--w-no);color:var(--w-no)}
.ri-pill{display:none!important}   /* Write it marks nothing wrong, so "Marked wrong? Tell us" has no job here */
.look{margin:1.1rem 6px 0;padding:.75rem .9rem;border-top:1px solid var(--w-line);border-bottom:1px solid var(--w-line);text-align:left}
.look b.h{display:block;font:600 .6rem/1 'Geist Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--w-dim);margin-bottom:.45rem}
.look p{margin:.25rem 0;font-size:.9rem;line-height:1.4}
.look p em{font-style:normal;font-weight:650}
.five5{margin:.4rem 6px 0;padding:.75rem .9rem;text-align:left}
.five5 b.h{display:block;font:600 .6rem/1 'Geist Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--w-dim);margin-bottom:.45rem}
.five5 p{margin:.25rem 0;font-size:.9rem;line-height:1.4}
.five5 .got{color:#4F7A63}.five5 .miss{color:#8A847C}
.five5 a{display:inline-block;margin-top:.35rem;padding:.4rem 0;font:700 .6875rem/1 'Geist Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:#5C5852;text-decoration:none}
.chk{margin:1.6rem 6px 0;text-align:left}
.chk h2{font-family:'Anton',Impact,sans-serif;font-weight:400;font-size:1.5rem;text-transform:uppercase;margin:0 0 .25rem;display:flex;align-items:center;gap:.6rem}
.chk h2::before{content:'';width:26px;height:10px;background:var(--w-car);flex:none}
.chk p.how{font-size:.84rem;color:var(--w-dim);margin:0 0 .7rem;line-height:1.45}
.tick{display:flex;gap:.7rem;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--w-line);background:#FBF8F3;padding:.7rem .8rem;margin:0 0 .45rem;border-radius:6px;cursor:pointer;font:inherit;color:var(--w-ink)}
.tick .mk{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--w-ink);display:grid;place-items:center;font-size:.8rem;margin-top:.05rem}
.tick.on{border-color:var(--w-ok);background:#EEF3EF}
.tick.on .mk{background:var(--w-ok);border-color:var(--w-ok);color:#fff}
.tick.on .mk::after{content:'✓'}
.tick b{display:block;font:600 .6rem/1.2 'Geist Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--w-dim);margin-bottom:.2rem}
.tick span{font-size:.9rem;line-height:1.4}
.next{margin:.9rem 0 0;padding:.7rem .9rem;background:#F3EADF;font-size:.88rem;line-height:1.45}
.next b{font:600 .6rem/1 'Geist Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#9A5A2C;display:block;margin-bottom:.3rem}
.outs{display:flex;flex-direction:column;align-items:center;gap:.6rem;margin:1.8rem 0 0}
.outs .pri{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 1.8rem;border:0;border-radius:999px;background:var(--w-ink);color:#FBF8F3;font:700 1rem/1 var(--f-body,'Geist',sans-serif);cursor:pointer;box-shadow:0 0 0 3px #FBF8F3,0 0 0 6px var(--w-car)}
.outs .sec{display:inline-flex;align-items:center;min-height:44px;padding:0 1rem;border:0;background:none;color:#8E6238;font:650 .92rem/1 var(--f-body,'Geist',sans-serif);cursor:pointer}
.toast{position:fixed;left:50%;bottom:5rem;transform:translateX(-50%);background:var(--w-ink);color:#FBF8F3;padding:.55rem 1rem;border-radius:999px;font-size:.84rem;z-index:950;max-width:90vw;text-align:center}
@media(prefers-reduced-motion:reduce){.scrim,.focus{transition:none}}
.five5.bank .need{display:flex;flex-wrap:wrap;gap:4px 14px;margin:.4rem 0 .2rem;font-size:.86rem}
.five5.bank .need span{font:500 .86rem/1.3 'Geist',system-ui,sans-serif}.five5.bank .need .hy{color:#4A6B5C;font-weight:600}.five5.bank .need .hn{color:#8A8378}
</style>

<body>
<div class="top">
  <header class="header">
    <div class="header-top">
      <a class="back-link" id="back" href="/skills/writing/gate.html?task=essays" target="_top">← Essay</a>
      <div class="header-title"><div class="app-title">INTUITY</div><div class="app-subtitle">Write it</div></div>
      <span class="header-spacer">Level <b>B2</b></span>
    </div>
  </header>
  <div class="helps" id="helps" hidden role="toolbar" aria-label="Help">
    <button type="button" data-h="question">Question</button><button type="button" data-h="model">Model</button><button type="button" data-h="phrases">Phrases</button>
  </div>
</div>
<main class="stage" id="stage"><p style="text-align:center;color:var(--w-faint)">Loading…</p></main>
<div class="bar" id="bar" hidden><div class="in">
  <div class="meter" id="meter"><div class="nums"><b id="wc">0</b> <i>words · 140–190</i></div><div class="track"><div class="zone"></div><div class="fill" id="fill"></div></div></div>
  <button type="button" class="done" id="doneBtn">Finish</button>
</div></div>
<div class="scrim" id="scrim" hidden><div class="focus" id="focus" role="dialog" aria-modal="true"></div></div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P=new URLSearchParams(location.search);
const MIN=140, MAX=190;
/* each task: its question bank and the four self-checks (v1) */
const TASKS={
  essays:{name:'Essay',word:'essay',src:['/skills/writing/essays/data/essay-questions.json','/data/writing/write-more/essays.json'],
    norm:q=>({id:q.id,title:q.topic,lead:q.context,q:q.mainQuestion,lab:'Notes',list:q.writingPoints,etype:q.essayType}),
    checks:[['Content','I covered both notes and added an idea of my own.'],['Communicative Achievement','It sounds right for a teacher: formal, no contractions, my opinion clear.'],['Organisation','An introduction, two or three body paragraphs and a conclusion, each with one job.'],['Language','I read every sentence once, only for its verb: the right tense, singular or plural.']]},
  emails:{name:'Email / Letter',word:'email',src:['/skills/writing/emails/data/emails-questions-formal.json','/skills/writing/emails/data/emails-questions-informal.json'],
    norm:q=>{ const d=q.questionData||q; return {id:q.id+(q.questionData?'-i':'-f'),title:q.title||q.topic,lead:d.context||'',q:d.question,lab:'In your email',list:d.keyPoints,informal:!!q.questionData}; },
    checks:[['Content','I answered every question in the message and gave all the information asked for.'],['Communicative Achievement','The tone fits the reader: formal for an organisation, friendly for a friend.'],['Organisation','A greeting, an opening, a paragraph for each point and a suitable ending.'],['Language','I read every sentence once, only for its verb: the right tense, singular or plural.']]},
  articles:{name:'Article',word:'article',src:['/skills/writing/articles/data/article-questions.json','/data/writing/write-more/articles.json'],
    norm:q=>({id:q.id,title:q.title,lead:'You see this announcement in an English-language magazine.',q:q.question,note:q.print}),
    checks:[['Content','I answered every question in the task and gave examples of my own.'],['Communicative Achievement','It talks to the reader: a catchy title, a question or two, my own voice.'],['Organisation','A title, an opening that hooks, a paragraph for each point, a closing thought.'],['Language','I read every sentence once, only for its verb: the right tense, singular or plural.']]},
  reviews:{name:'Review',word:'review',src:['/skills/writing/reviews/data/review-questions.json','/data/writing/write-more/reviews.json'],
    norm:q=>({id:q.id,title:q.topic,lead:[q.context,q.announcement].filter(Boolean).join(' '),q:q.question}),
    checks:[['Content','I described it, covered every point in the question and said who it is for.'],['Communicative Achievement','It sounds like a review: lively, it talks to the reader, my opinion is clear.'],['Organisation','A title, an opening, a paragraph for each feature, a recommendation to finish.'],['Language','I read every sentence once, only for its verb: the right tense, singular or plural.']]},
  story:{name:'Story',word:'story',src:['/skills/writing/narrative/data/narrative-questions.json'],
    norm:q=>({id:q.id,title:q.title,lead:q.prompt,q:q.opening,open:true,lab:'Your story must include',list:q.mustInclude}),
    checks:[['Content','I began with the sentence the task gives, used everything it must include, and the story makes sense.'],['Communicative Achievement','It keeps the reader hooked: feelings, a little suspense, a real ending.'],['Organisation','A beginning, a middle where something happens and an ending, linked by time words.'],['Language','I read every sentence once, only for its verb: the past tense, every time.']]},
  reports:{name:'Report',word:'report',src:['/skills/writing/reports/data/report-questions.json'],
    norm:q=>({id:q.id,title:String(q.id||'').replace(/-/g,' ').replace(/^./,c=>c.toUpperCase()),lead:q.context,q:q.question,lab:'In your report',list:q.keyPoints}),
    checks:[['Content','I covered every point the question asks for and made a recommendation.'],['Communicative Achievement','It sounds like a report: formal and factual, no chatty language.'],['Organisation','A title and clear headings: introduction, findings, recommendation.'],['Language','I read every sentence once, only for its verb: the right tense, singular or plural.']]}
};
/* LOOK AGAIN (14 Nov 2026, from the v2 ribbon): read-only, only on Finish, only
   what needs a second look; nothing shows when all is well. The note check matches
   words, so it asks rather than judges ("it's expensive" covers "cost" too). */
const FORMAL=k=>k==='essays'||k==='reports';
const STOP=new Set('about after again against because before being between could their there these those which while would should other where through people really things thing think every'.split(' '));
const WEAK=new Set('good nice bad big very lots get got'.split(' '));   /* short words a B2 writer leans on */
function repeats(t){ const c={}; (t.toLowerCase().match(/[a-z']+/g)||[]).forEach(w=>{ if(w.length>=5&&!STOP.has(w)||WEAK.has(w)) c[w]=(c[w]||0)+1; }); return Object.entries(c).filter(e=>e[1]>=3).sort((a,b)=>b[1]-a[1]).slice(0,2); }
/* 's after a pronoun is always a contraction (it's, there's); after a name it may be a possessive (Maria's), so those are left alone */

  [["\\bI am agree\\b","I agree"],["\\bI'm agree\\b","I agree"],["\\bdepends? of\\b","depend on"],["\\bdiscuss about\\b","discuss"],["\\bIn the other hand\\b","On the other hand"],

  R("\\b(allow|allows|allowed|enable|enables|enabled|encourage|encourages|encouraged|permit|permits)\\s+(us|them|you|people|students|children|me|him|her|users|teenagers|everyone)\\s+(communicate|do|go|make|get|have|be|stay|talk|learn|work|keep|find|see|enjoy|use|share|travel|play|watch|study|live|spend|meet|relax|discover|improve|feel|become|connect|express|create)\\b",m=>add('allow '+m[0].toLowerCase(),'<em>'+esc(m[0])+'</em>: '+esc(m[1].toLowerCase())+' someone <em>to</em> do: <em>'+esc(m[1].toLowerCase())+' '+esc(m[2])+' to '+esc(m[3])+'</em>.'));
  /* two sentences that start with the same four words (often a copying slip) */
  { const starts={}; (t.match(/[^.!?]+[.!?]/g)||[]).forEach(x=>{ const w=(x.trim().toLowerCase().match(/[a-z']+/g)||[]); if(w.length>=6){ const k=w.slice(0,4).join(' '); starts[k]=(starts[k]||0)+1; } });

    truely:'truly',finaly:'finally',comunity:'community',oportunity:'opportunity',oportunities:'opportunities',diferent:'different',beautifull:'beautiful',usefull:'useful',carefull:'careful',
    alot:'a lot',responsability:'responsibility',personaly:'personally',advertisment:'advertisement',advertisments:'advertisements',knowlege:'knowledge',dissapointed:'disappointed',dissapointing:'disappointing',
    foreing:'foreign',interessting:'interesting',writting:'writing',writen:'written',excercise:'exercise',exercice:'exercise',wierd:'weird',arguement:'argument',familys:'families',studing:'studying',

function bankHTML(t){
  if(!BANK) return '';

/* read, never copied: nothing in a card can be selected or copied */
['copy','cut','dragstart','contextmenu'].forEach(t=>$('focus').addEventListener(t,e=>e.preventDefault()));
const kick=w=>'<span class="fc-k">'+esc(T.name+' · '+w)+'</span>';
/* THE QUESTION CARD (14 Nov 2026, the owner: "just like the real exam"). Two parts,
   as the paper sets them out: the instructions with the word limit, then a ruled box
   with the question and, for the essay, its three numbered notes. */
const RUBRIC={essays:'Write an essay using <b>all</b> the notes and give reasons for your point of view.',
  emails:'Write your email.',articles:'Write your article.',reviews:'Write your review.',reports:'Write your report.',story:'Write your story.'};
function cQuestion(){
  const q=Q, part=K==='essays'?'Part 1':'Part 2';
  /* the story's box already says it must begin with the sentence */
  const lead=String(q.lead||'').replace(/Your story must begin with this sentence\.?\s*/i,'').trim();
  let box='';
  if(K==='essays'){
    const L=(q.list||[]).map(x=>String(x).replace(/^[.…\s]+(?=\(your own idea\))/i,''));
    box='<p class="xq">'+esc(q.q)+'</p><p class="xl">Notes</p><p class="xw">Write about:</p><ol class="xn">'+
      L.map(x=>/your own idea/i.test(x)?'<li><span class="dots"></span> (your own idea)</li>':'<li>'+esc(x)+'</li>').join('')+'</ol>';
  } else if(K==='story'){
    box='<p class="xw">Your story must begin with this sentence:</p><p class="xq">'+esc(q.q)+'</p>'+
      (q.list&&q.list.length?'<p class="xw">Your story must include:</p><ul class="xb">'+q.list.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'');
  } else {
    box='<p class="xq x2">'+esc(q.q)+'</p>'+(q.note?'<p class="xw">'+esc(q.note)+'</p>':'')+
      (q.list&&q.list.length?'<ul class="xb">'+q.list.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'');
  }
  open('<span class="fc-card">'+kick(part)+'<span class="fc-t">'+esc(q.title||T.name)+'</span><span class="fc-bar" aria-hidden="true"></span>'+
    '<span class="xr">'+(lead?'<p>'+esc(lead)+'</p>':'')+'<p>'+(RUBRIC[K]||'')+'</p><p>Write your answer in <b>'+MIN+'–'+MAX+'</b> words in an appropriate style.</p></span>'+
    '<span class="xbox">'+box+'</span>'+
    /* 17 Nov 2026 (the owner): stuck on how to tackle it? the clip sits with the question, not in the row */
    (K==='essays'?'<span class="xhow"><a class="how-pill" href="/skills/writing/how-essay.html" aria-label="Watch: how to answer any question, five ways"><span><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><polygon points="6,4 20,12 6,20" fill="#8AA79C" stroke="#8AA79C" stroke-width="1" stroke-linejoin="round"/><line x1="6" y1="4" x2="6" y2="20" stroke="#14110E" stroke-width="2" stroke-linecap="round"/><polygon points="6,7.4 14.2,12 6,16.6" fill="#14110E"/></svg><b>How to answer</b></span></a></span>':'')+'</span>');
}
function cModel(){
  const type=K==='story'?'story':K;
  open('<span class="fc-card">'+kick('A model')+'<span class="fc-t">Read one</span><span class="fc-bar" aria-hidden="true"></span><span class="fc-study">Read it, close it, write your own.</span></span>'+
    '<iframe title="A model '+esc(T.word)+'" src="/skills/writing/build.html?type='+type+'&view=models&embed=1"></iframe>','model');
  const fr=$('focus').querySelector('iframe');
  fr.onload=()=>{ try{ const d=fr.contentDocument, st=d.createElement('style');
    st.textContent='.header,.topbar,nav.roof,.back-link,.rf-head,.wf-foot{display:none!important}body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}';
    d.head.appendChild(st); ['copy','cut','dragstart','contextmenu'].forEach(t=>d.addEventListener(t,e=>e.preventDefault())); }catch(e){} };
}
/* Phrases: the task's essentials, by part of the text; the essay's own type first */
function cPhrases(which){
  if(!PORT){ toast('The phrases did not load'); return; }
  let keys=(PORT.tasks[K]||[]).slice();
  if(K==='essays'&&Q&&SHEET_OF[Q.etype]) keys.sort((a,b)=>(a===SHEET_OF[Q.etype]?-1:b===SHEET_OF[Q.etype]?1:0));
  if(K==='emails'&&Q) keys.sort((a,b)=>((a==='ei')===!!Q.informal?-1:1));
  const k=which&&keys.includes(which)?which:keys[0], sh=PORT.sheets[k];
  const bands=sh.bands.map(b=>{ const items=[]; (b.cols||[]).forEach(c=>c.forEach(i=>{ if(typeof i==='string'&&!/^[#!]/.test(i)) items.push(clean(i)); })); return {label:b.label,items}; }).filter(b=>b.items.length);
  open('<span class="fc-card">'+kick('Phrases')+'<span class="fc-t">'+esc(sh.tab)+'</span><span class="fc-bar" aria-hidden="true"></span>'+
    (keys.length>1?'<span class="hsets">'+keys.map(x=>'<button type="button" data-s="'+x+'" class="'+(x===k?'on':'')+'">'+esc(PORT.sheets[x].tab)+'</button>').join('')+'</span>':'')+
    bands.map(b=>'<span class="hpart">'+esc(b.label)+'</span><ul class="hlist">'+b.items.map(i=>'<li>'+esc(i)+'</li>').join('')+'</ul>').join('')+'</span>');
  $('focus').querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>cPhrases(b.dataset.s));
}

/* ═══ FINISH: the facts, then the four criteria to tick (v1) ═══ */
function finish(){
  const t=D.text, n=words(t);
  if(n<20){ toast('Write a little more first'); return; }
  $('helps').hidden=true; $('bar').hidden=true;
  const first=!D.everDone; D.done=true; D.everDone=true; D.end=Date.now(); save();
  const inRange=n>=MIN&&n<=MAX, pc=paras(t), needP=K==='essays'?4:3;
  if(first){ store.set(DONE,store.get(DONE,0)+1); try{ if(window.Be2&&Be2.score) Be2.score('writing',inRange); }catch(e){} }
  const ticks=new Set(D.ticks||[]);
  $('stage').innerHTML='<section class="res"><p class="n" id="num">'+n+'</p><p class="u">words</p>'+
    '<div class="facts"><span class="'+(inRange?'ok':'no')+'">'+(inRange?'✓ In range':n<MIN?(MIN-n)+' short':(n-MAX)+' over')+'</span>'+
    '<span class="'+(pc>=needP?'ok':'no')+'">'+pc+' paragraph'+(pc===1?'':'s')+'</span></div>'+lookHTML(t)+fiveHTML(t)+bankHTML(t)+'</section>'+
    '<section class="chk"><h2>Check it</h2><p class="how">Read your '+esc(T.word)+' once more, then tick each line that is true. Be honest: the one you can’t tick is where to start next time.</p>'+
      T.checks.map((c,i)=>'<button type="button" class="tick'+(ticks.has(i)?' on':'')+'" data-i="'+i+'" role="checkbox" aria-checked="'+ticks.has(i)+'"><i class="mk"></i><span><b>'+esc(c[0])+'</b>'+esc(c[1])+'</span></button>').join('')+
      '<div class="next" id="next"></div></section>'+
    '<div class="outs"><button type="button" class="pri" id="copy">Copy it for your teacher</button><button type="button" class="sec" id="edit">Keep writing</button>'+
      (qi<QS.length-1?'<button type="button" class="sec" id="another">Next question</button>':'')+'</div>'+
    /* 19 Nov 2026 (the owner): the app stays autonomous (no names, no links out), but a pupil working
       alone is told that a whole text gets its mark elsewhere */
    '<p class="wi">This app doesn’t mark a whole text. For a mark, give it to your teacher or try an online writing checker.</p>';
  const paint=()=>{ const miss=T.checks.filter((_,i)=>!ticks.has(i)).map(c=>c[0]);
    const tip=!inRange?(n<MIN?'Add a sentence or two to the paragraph with the least detail: under '+MIN+' words loses marks for Content.':'Cut to '+MAX+' words: take out a repeated idea, not a whole paragraph.'):'';
    $('next').innerHTML='<b>Next time</b>'+(miss.length?'Start with '+esc(miss[0])+(miss.length>1?' (then '+miss.slice(1).map(esc).join(', ')+')':'')+'. '+tip:(tip||'All four ticked. Ask your teacher to mark it, and try a new question.')); };
  document.querySelectorAll('.tick').forEach(b=>b.onclick=()=>{ const i=+b.dataset.i; ticks.has(i)?ticks.delete(i):ticks.add(i);
    b.classList.toggle('on',ticks.has(i)); b.setAttribute('aria-checked',ticks.has(i)); D.ticks=[...ticks]; save(); paint();
    if(ticks.has(i)&&window.Cheer){ try{ ticks.size===4?Cheer.done(b):Cheer.tick(b); }catch(e){} } });
  paint();
  /* his own text goes OUT to the teacher; nothing comes in */
  $('copy').onclick=()=>{ const out=Q.q+'\n\n'+t.trim()+'\n\n('+n+' words)', ok=()=>toast('Copied: paste it into a message to your teacher');
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(out).then(ok,()=>fallback(out,ok)); else fallback(out,ok); };
  $('edit').onclick=()=>{ D.reopen=true; save(); write(); };
  if($('another')) $('another').onclick=()=>{ qi++; store.set(AT,qi); gate(); window.scrollTo({top:0}); };
  window.scrollTo({top:0});
  if(first&&inRange&&window.Cheer){ try{ Cheer.done($('num')); }catch(e){} }
}
function fallback(t,ok){ const a=document.createElement('textarea'); a.value=t; a.style.position='fixed'; a.style.opacity='0'; document.body.appendChild(a); a.select(); try{ document.execCommand('copy'); ok(); }catch(e){} a.remove(); }

/* ── load: the task's questions and the phrases ── */
Promise.all([
  Promise.all(T.src.map(u=>fetch(u).then(r=>r.ok?r.json():null).catch(()=>null))),
  fetch('/data/writing/portfolio.json').then(r=>r.ok?r.json():null).catch(()=>null)
]).then(([ds,port])=>{
  PORT=port;
  ds.forEach((d,di)=>{ if(!d) return; const list=Array.isArray(d)?d:(d.questions||d.emails||[]); list.forEach(x=>{ try{ const q=T.norm(x); if(q&&q.q){ if(di>0) q.extra=1; QS.push(q); } }catch(e){} }); });
  if(!QS.length){ $('stage').innerHTML='<p style="text-align:center">The questions didn’t load. Check your connection and reload.</p>'; return; }
  const want=P.get('q'); qi=want?Math.max(0,QS.findIndex(q=>q.id===want)):Math.min(QS.length-1,+store.get(AT,0)||0);
  gate();
});
})();
</script>
<script src="/skills/grammar-rules/intuity-sound.js"></script>
<script src="/tools/intuity-cheer.js?v=2"></script>
