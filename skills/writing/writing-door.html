<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>INTUITY — Writing</title>
<meta name="theme-color" content="#F3F1ED">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500&family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=7">
<style>
  /* ── TOKENS THIS PAGE MUST DECLARE ITSELF ──────────────────────────────
     --mute is NOT in intuity-shell.css. Both index.html and the Phrase Bank
     define it locally, and I did not — so `stroke:var(--mute)` on the road
     resolved to nothing and the curve was never painted. The stems drew
     because they use --rule, which the shell does define. That one missing
     token is the whole reason the wave kept "not working": it was being
     drawn correctly and stroked with nothing.

     --sage is missing from the shell as well, so the medallions were
     falling back to --mark-sweep's own default rather than the submenu
     colour. Both declared here, with the same values the working pages
     use. */
  :root{
    --mute:#8B7B78;
    --sage:#527065;

    /* ── THE GROUND IS A RECESS, NOT THE SCREEN ─────────────────────────
       The medallion's white bloom comes from .pend-dial's own box-shadow,
       rgba(255,255,255,.9), and it was being painted here all along. It
       just had nothing to lift off.

       This page ran on --screen #F3F1ED, which is 12.7 from the highlight
       the shadow resolves to. The Phrase Bank runs on --board #EBE8E1 —
       29.7 from the same highlight, and its own comment says exactly why:
       "on --screen they would have nothing to lift off and a 1px shadow
       would be doing all the work." Same disc, same shadow, less than half
       the separation, which is the whole of the missing glow.

       So the door takes the Phrase Bank's board rather than inventing a
       third ground. Six rings on a spine is that page's composition, so it
       should be that page's surface. */
    --board:#EBE8E1;
  }

  body{color:var(--ink,#14110E);background:var(--board,#EBE8E1);
    margin:0;display:flex;flex-direction:column;min-height:100vh;
    padding-top:var(--header-h,110px);}

  /* ── THE DOOR ───────────────────────────────────────────────────────────
     Six rings on the wave — the six things the paper can ask you to write —
     and everything else in the footer as pills.

     THE WAVE IS index.html's, LINE FOR LINE. I had been rebuilding it from
     the Phrase Bank and getting it wrong three ways:

       THE ROAD IS CUBIC BÉZIERS between consecutive dots, not a sampled
       cosine. One C-curve per pair, control points at the midpoint height.
       That is why it always passes exactly through the dots and why mine,
       a cosine fitted afterwards, never looked like it.

       THE MEDALLION NEEDS width AND height. I had set --d:56px, which is
       a Phrase Bank local, and the discs collapsed to slivers.

       THERE IS A WIDTH GUARD. Every position divides by the map's measured
       width; if the map has not been laid out, that is a division by zero
       and the pills leave the page. The landing page waits a frame and
       retries rather than guessing — which is exactly the failure I could
       not reproduce and could not explain. */

  .lead{flex:none;padding:1rem var(--gutter,1rem) 0;text-align:center;}
  .lead span{font-family:var(--f-mono);font-size:.56rem;letter-spacing:.14em;
    text-transform:uppercase;color:var(--faint);line-height:1.9;}

  /* flex:1 with min-height:0 — the map takes the space that is left, which
     is how the landing page does it. No 100vh arithmetic to get wrong. */
  .map{position:relative;flex:1;min-height:0;
    margin:.4rem 10px calc(12px + env(safe-area-inset-bottom,0px));}
  .mapPath{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
  .mapPath .road{fill:none;stroke:var(--mute,#8B7B78);stroke-width:.16;stroke-linecap:round;}
  /* DECLARED AND SWITCHED OFF, exactly as index.html and the Phrase Bank
     do. Both build stems and dots and then hide them: the wave alone
     weaves past the rings, and the arms I had left visible were what made
     this read as a diagram rather than a map. */
  .mapPath .stem{stroke:var(--rule,#BCB1A0);stroke-width:.4;}
  .mapPath .dot{fill:var(--card,#FAF8F5);stroke:rgb(139,123,120);
    stroke-width:.3;}

  .nodes{position:absolute;inset:0;}
  .node{position:absolute;transform:translateY(-50%);width:100%;}

  /* ── WHAT THE NODE'S y ACTUALLY MARKS ─────────────────────────────────
     translate(-50%,-50%) centres the WHOLE pill — medallion, label and
     sublabel — on the node's y. So the medallion floats above that line by
     half the height of the text hanging under it, and the wave's apex,
     which is exactly on the line, ends up below the ring it belongs to.

     The Phrase Bank gets away with it because its pills carry a label and
     nothing else. Ours carry a sublabel too, which is enough to show.

     So the pill is anchored on the medallion instead: shifted up by its
     radius, the disc spans y−r to y+r and its centre is the node's y. The
     text hangs below and is not part of the reckoning. */
  .pill{position:absolute;top:0;transform:translate(-50%,-28px);
    display:flex;flex-direction:column;align-items:center;gap:.45rem;
    border:none;background:none;padding:0;text-decoration:none;
    cursor:pointer;transition:transform .18s var(--spring,ease);}
  .pill:active{transform:translate(-50%,-28px) scale(.94);}

  /* Explicit width and height. The shell's medallion lays its three rings
     out as percentage insets of this box, so the box has to have a size. */
  /* One measurement, not three. The Phrase Bank drives the disc and the
     numeral from a single --d, so the figure keeps its proportion at every
     size; this page had 56px, 50px and 1.15rem set independently, which is
     three things to keep in step by hand. Same values, one knob. */
  .pill .circle{--d:56px;
    width:var(--d);height:var(--d);flex:none;position:relative;z-index:2;
    --mark-sweep:var(--sage,#527065);
    --mark-rest:var(--sage,#527065);
    --mark-core:#14110E;
    --mark-ink:var(--card,#FAF8F5);
    --mark-pct:100%;}
  .pill .circle span{font-size:calc(var(--d) * .32);letter-spacing:.01em;}
  /* .pend-dial carries a two-part neumorphic shadow: a white highlight up
     and left, a dark drop down and right. On the recessed board the white
     half stopped being a highlight and became a bloom sitting under the
     disc. The disc's own gradient already turns it toward the light, so
     the highlight was saying twice what the fill says once.

     Drop only, therefore. The rings still lift off the board; they no
     longer trail anything. */
  .pill .circle{box-shadow:4px 6px 14px rgba(43,33,41,.18);}

  /* ── AND NO PALE BAND AROUND THE RIM ──────────────────────────────────
     The last white layer is not a shadow at all: .pend-dial paints
     linear-gradient(145deg, var(--card), #E4DDD1) as its own background,
     and its ::before — the sage ring — is inset 5%, so that gradient shows
     as a cream band right round the outside of every disc.

     On the gate screens that band is the bezel the mark sits in and it is
     doing a job. Here there are six of them on a spine and it just reads
     as a halo the rings did not ask for. Take the ring out to the edge and
     the band has nowhere to show. --mark-core keeps the middle, so the
     disc is exactly two things: sage rim, dark core. */
  .pill .circle::before{inset:0;}
  /* Belt and braces: the bezel is that gradient, so take the gradient away
     as well as the gap it showed through. Now there is no cream in the
     disc to leak, whatever the inset resolves to. */
  .pill .circle{background:none;}
  .pill.part .circle{--mark-rest:var(--rule);}

  .pill .lbl{width:9rem;text-align:center;
    font-family:'Anton',Impact,sans-serif;text-transform:uppercase;
    font-weight:400;font-size:.8rem;letter-spacing:.06em;line-height:1.15;
    color:var(--ink);}
  .pill .sub{font-family:var(--f-mono);font-size:.45rem;letter-spacing:.1em;
    text-transform:uppercase;color:var(--faint);margin-top:-.25rem;}

  /* ── WHAT EACH ONE CONTAINS ───────────────────────────────────────────
     Opposite the ring, across the wave, the way the Phrase Bank lists a
     family's functions. These are not decoration: a student who does not
     know that "essay" means five different argument shapes cannot choose
     between them, and the door is where that belongs.

     Taken from the data rather than written: essayType across the 25 essay
     questions, subject across the 10 review questions. So the list is what
     is actually in there, and it stays true when the content grows. */
  .cap{position:absolute;top:0;transform:translateY(-50%);
    font-size:.66rem;line-height:1.45;color:var(--faint);
    pointer-events:none;}
  .cap.right{text-align:left;}
  .cap.left{text-align:right;}
  @media(max-width:560px){ .cap{font-size:.6rem;line-height:1.4;} }

  @media(max-width:560px){
    /* the anchor follows the smaller disc */
    .pill{transform:translate(-50%,-26px);}
    .pill:active{transform:translate(-50%,-26px) scale(.94);}
    .pill .circle{--d:52px;}
    .pill .lbl{width:8rem;font-size:.72rem;letter-spacing:.04em;}
    .map{margin:.3rem 6px calc(10px + env(safe-area-inset-bottom,0px));}
    /* Phones drop the arms: at this width the caption sits directly
       opposite its ring and the connector only adds clutter. Same rule as
       index.html and the Phrase Bank. */
    .mapPath .stem{display:none;}
    .mapPath .dot{display:none;}
  }

  /* ── THE FOOTER ────────────────────────────────────────────────────────
     Four pills, one line, no wrapping. Slides and Desk are gone — they are
     still reachable from the Writing Hub, and six pills over two rows was
     starting to compete with the six rings above them, which is the thing
     the footer exists NOT to do.

     One line means the labels set the sizes, so `flex:1 1 0` with a zero
     basis divides the width evenly rather than by text length: four pills
     of one size read as one control. `min-width:0` lets them shrink below
     their content, and the type steps down twice on the way to 360px so
     "Sentence Structure" never has to wrap or clip. */
  .quiet{flex:none;padding:.9rem var(--gutter,1rem)
      calc(1.5rem + env(safe-area-inset-bottom,0px));
    border-top:1px solid var(--rule);display:flex;gap:.35rem;}
  .quiet a{flex:1 1 0;min-width:0;
    display:flex;align-items:center;justify-content:center;
    background:var(--poster-fill);border-radius:999px;
    padding:.6rem .3rem;text-decoration:none;
    font-family:var(--f-display);font-size:.55rem;font-weight:800;
    letter-spacing:.01em;color:var(--poster-ink);
    text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    transition:background .15s,transform .12s;}
  .quiet a:active{transform:scale(.96);background:var(--poster-fill-hi);}
  @media(hover:hover){ .quiet a:hover{background:var(--poster-fill-hi);} }
  @media(max-width:400px){
    .quiet{gap:.28rem;}
    .quiet a{font-size:.5rem;padding:.6rem .2rem;}
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-top">
    <a class="back-link" href="/index.html" target="_top">&larr; Skills</a>
    <div class="header-title">
      <div class="app-title">INTUITY</div>
      <div class="app-subtitle">Writing</div>
    </div>
    <span class="header-spacer">Level <b>B2</b></span>
  </div>
</header>

<div class="lead"><span>80 minutes &middot; two tasks &middot; 140&ndash;190 words each</span></div>

<div class="map" id="map">
  <svg class="mapPath" id="mapPath" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
  <div class="nodes" id="nodes"></div>
</div>

<div class="quiet">
  <!-- "Structure", not "Sentence Structure". Four pills on one line give
       each about 80px of text at 390px, and the full name needs 82px — it
       would have clipped to an ellipsis on every phone. The short form
       reads clearly enough in a row that is plainly about writing. -->
  <a href="/skills/writing/sentence-structure/sentence-builder.html">Structure</a>
  <a href="/skills/similar-words/phrase-bank.html">Phrase Bank</a>
  <a href="/skills/writing/essays/writing-hub.html">Writing Hub</a>
  <a href="/skills/writing/games/index.html">Games</a>
</div>

<script>
/* The six tasks. Every href checked against the repo, and two traps:
   Reviews and Reports keep plan and model at review-plan.html and
   review-model.html — NOT the retired review-structure / review-builder —
   and their question page is *-question-selector.html where the other four
   use *-question.html.

   `built` is how many of Question / Plan / Model / Sample exist; it drives
   the arc on the rim. */
var AREAS = [
  { n:1, name:'Essays', sub:'Part 1 · compulsory', built:4,
    kinds:['Opinion','For &amp; against','Problem &amp; solution','Cause &amp; effect','Speculation'],
    url:'/skills/writing/essays/essay-question.html' },
  { n:2, name:'Reviews', sub:'Part 2', built:4,
    kinds:['Film','Restaurant','Book','Service','Product'],
    url:'/skills/writing/reviews/review-question-selector.html' },
  { n:3, name:'Reports', sub:'General FCE', built:4,
    kinds:['Facilities','Surveys','Recommendations'],
    url:'/skills/writing/reports/report-question-selector.html' },
  { n:4, name:'Emails', sub:'Part 2', built:4,
    kinds:['Formal','Informal'],
    url:'/skills/writing/emails/email-question.html' },
  { n:5, name:'Articles', sub:'Part 2', built:3,
    url:'/skills/writing/articles/article-question.html' },
  /* No `kinds` on Articles or Narratives: their data carries no grouping
     field, and a list invented here would be the door telling a student
     something the content does not. */
  { n:6, name:'Narratives', sub:'FCE for Schools', built:2,
    url:'/skills/writing/narrative/narrative-question.html' }
];

var ROW_TOP = 12, ROW_BOT = 88;
function $(id){ return document.getElementById(id); }

function layoutFor(n){
  if(n === 1) return [{ y:(ROW_TOP+ROW_BOT)/2, side:'right' }];
  var span = ROW_BOT - ROW_TOP;
  return Array.from({length:n}, function(_,i){
    return { y: ROW_TOP + span*i/(n-1), side: i % 2 === 0 ? 'right' : 'left' };
  });
}

function buildMap(){
  var mapEl = $('map');
  if(!mapEl) return;
  /* NEVER MEASURE A THING THAT IS NOT READY.
     Every position below divides by this width. If the map has not been
     laid out — coming back from a skill page through bfcache, or a resize
     fired by the address bar animating — that is a division by zero: the
     pills get left:NaN% and leave the page, and only a reload puts them
     back. Wait a frame and try again. Straight from index.html, and the
     failure I could not otherwise explain. */
  if(mapEl.clientWidth < 40 || mapEl.getBoundingClientRect().width < 40){
    requestAnimationFrame(buildMap);
    return;
  }

  var L = layoutFor(AREAS.length);
  var w = mapEl.clientWidth || 760;
  /* HOW FAR THE RINGS SIT FROM THE CENTRE LINE.
     index.html and the Phrase Bank derive this from 46px, which lands
     around 8-12% — right for pages whose captions sit far out and need the
     middle kept clear. This page has its captions closer in and its rings
     were crowding the wave, so they move out to a flat 20% either side:
     30% and 70%. Fixed rather than derived, because it is now a
     composition decision rather than a fit-to-width one. */
  /* CLOSER ON A DESKTOP, UNCHANGED ON A PHONE.
     At +/-20% the rings sat 485px from a spine at 670 — the map read as two
     columns with a line between them rather than as one object threaded by
     the wave. 14% closes that to the Phrase Bank's spacing.

     It cannot go to 14 on a phone: .lbl is 8rem there, so a ring at 36%
     already reaches past the centre line and the labels would sit on the
     wave. Narrow screens keep 20, which is why they were rendering fine. */
  var OFFSET   = w <= 560 ? 20 : 14;
  var STEM_LEN = Math.max(30, Math.min(46, 150 / w * 100));

  var pillXs = L.map(function(n){ return n.side === 'right' ? 50 - OFFSET : 50 + OFFSET; });
  var dirs   = L.map(function(n){ return n.side === 'right' ? 1 : -1; });
  var dots   = L.map(function(n,i){ return { x: pillXs[i] + dirs[i]*STEM_LEN, y: n.y }; });

  /* ── THE WAVE ─────────────────────────────────────────────────────────
     THE AMPLITUDE IS SET, NOT DERIVED, and that is the fix.

     It used to come from the pill's outer edge — the Phrase Bank's
     `tightDots`. That works there because its rings sit close to the
     centre and their labels reach outward, so the edges are far apart. On
     this page the rings moved out to ±20%, which pushes those same edges
     INWARD toward the middle: the two tight points converged, the
     amplitude fell to 1.6%, the 3.5% floor took over, and the wave became
     the near-vertical line you spotted.

     So the swing is stated directly. Half the ring offset puts the crest
     at ±10% — the Phrase Bank's own visual amplitude — and it now tracks
     the rings instead of fighting them: move them further out and the wave
     opens up with them. */
  /* ── THE WAVE ─────────────────────────────────────────────────────────
     THE AMPLITUDE IS A LENGTH, NOT A FRACTION OF THE RING OFFSET.

     Deriving it from `tightDots` the way the Phrase Bank does collapsed
     once the rings moved out to +/-20%: those measured edges converged on
     the middle, amp fell to 1.6%, and the floor took over. Correct
     diagnosis. But OFFSET/2 replaced it with 10% — a 270px swing on a
     desktop — so the wave became wider than the gap between the rings and
     stopped reading as a spine at all.

     The Phrase Bank's wave is about 55px crest to crest whatever the
     window is doing. So state it in pixels and convert, with a floor and a
     ceiling in percent so it still opens up on a phone. It no longer
     depends on OFFSET, which is the coupling that caused both bugs. */
  var amp = Math.max(2, Math.min(5, 28 / w * 100));
  /* And never wider than the room the labels leave. .lbl is a fixed 9rem
     (8rem under 560px), so at 390px the ring's own label already reaches
     46% and a 5% wave would run underneath the word ESSAYS. Clamp to the
     gap that is actually free. */
  var LBL  = ((w <= 560 ? 128 : 144) / 2) / w * 100;
  var room = OFFSET - LBL - 1.5;
  amp = Math.max(1.6, Math.min(amp, room));
  var cx  = 50;
  var ys  = L.map(function(n){ return n.y; });
  var y0  = ys[0], yN = ys[ys.length-1];
  var gap = (yN - y0) / (ys.length - 1);
  var LAM = 2 * gap;
  /* The first ring is left of centre, so the wave leans right to meet it. */
  var sideSign = dirs[0];
  var waveX = function(y){ return cx + sideSign * amp * Math.cos(2*Math.PI*(y - y0)/LAM); };

  /* Sampled, and run a little past the first and last ring so the wave does
     not appear to start and stop at them. .mapPath is overflow:visible so
     the overshoot is not clipped. */
  var EXT = 0.5, N = 220, d = '';
  for(var k = 0; k <= N; k++){
    var y = (y0 - EXT*gap) + ((yN + EXT*gap) - (y0 - EXT*gap)) * k / N;
    d += (k ? ' L ' : 'M ') + waveX(y).toFixed(2) + ' ' + y.toFixed(2);
  }
  var svg = '<path class="road" d="' + d + '"/>';

  /* ── THE ARMS ─────────────────────────────────────────────────────────
     A stem and a dot per ring, which this page had stopped drawing. The
     comment above the CSS claimed index.html and the Phrase Bank build
     them and then hide them; they do not — both hide them only under
     560px. On a desktop they are what ties a caption to the ring it
     describes, and without them "Film . Restaurant . Book" sits nearer the
     ESSAYS label than the REVIEWS ring it belongs to.

     The arm starts on the far side of the wave from its ring and runs
     outward to the dot; the caption begins just past it. Lengths in px so
     they hold their proportion at any width. */
  var CLEAR  = 10 / w * 100;
  var STEM   = Math.max(50, Math.min(110, w * 0.075)) / w * 100;
  var CAPGAP = 8 / w * 100;

  var stemFrom = L.map(function(n,i){ return waveX(n.y) + dirs[i]*CLEAR; });
  var stemTo   = L.map(function(n,i){ return stemFrom[i] + dirs[i]*STEM; });

  L.forEach(function(n,i){
    /* Articles and Narratives carry no `kinds`, so they have no caption —
       and an arm reaching out to blank space reads as a broken link, which
       is what those two stray lines on the right and lower left were. */
    if(!AREAS[i].kinds) return;
    svg += '<line class="stem" x1="' + stemFrom[i].toFixed(2) + '" y1="' + n.y +
           '" x2="' + stemTo[i].toFixed(2) + '" y2="' + n.y + '"/>' +
           '<circle class="dot" cx="' + stemTo[i].toFixed(2) + '" cy="' + n.y + '" r="0.46"/>';
  });
  $('mapPath').innerHTML = svg;

  /* The caption starts at the dot rather than at a figure derived from the
     amplitude, so it stays tied to the arm when either one moves. */
  var capSide = L.map(function(n){ return n.side === 'right' ? 'right' : 'left'; });
  var capBox  = L.map(function(n,i){
    return dirs[i] > 0
      ? 'left:'  + (stemTo[i] + CAPGAP).toFixed(2) + '%;right:3%'
      : 'left:3%;right:' + (100 - stemTo[i] + CAPGAP).toFixed(2) + '%';
  });

  $('nodes').innerHTML = AREAS.map(function(a,i){
    return '<div class="node" style="top:' + L[i].y + '%">' +
      '<a class="pill' + (a.built < 4 ? ' part' : '') + '" href="' + a.url + '"' +
        ' style="left:' + pillXs[i] + '%"' +
        (a.built < 4 ? ' title="' + a.built + ' of 4 stages built"' : '') + '>' +
        '<span class="circle pend-dial" style="--mark-pct:' +
          Math.round(a.built/4*100) + '%"><span>' + a.n + '</span></span>' +
        '<span class="lbl">' + a.name + '</span>' +
        (a.sub ? '<span class="sub">' + a.sub + '</span>' : '') +
      '</a>' +
      (a.kinds ? '<div class="cap ' + capSide[i] + '" style="' + capBox[i] + '">' +
                 a.kinds.join(' &middot; ') + '</div>' : '') +
    '</div>';
  }).join('');
}

buildMap();
var _t = null;
addEventListener('resize', function(){ clearTimeout(_t); _t = setTimeout(buildMap, 150); });
/* A tab measured while hidden measures nothing. */
document.addEventListener('visibilitychange', function(){
  if(!document.hidden) requestAnimationFrame(buildMap);
});
addEventListener('orientationchange', function(){ setTimeout(buildMap, 150); });
addEventListener('pageshow', buildMap);          /* bfcache restore */
if(document.fonts && document.fonts.ready) document.fonts.ready.then(buildMap);
</script>
</body>
</html>
