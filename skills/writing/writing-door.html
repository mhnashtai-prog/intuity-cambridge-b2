<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>INTUITY — Writing</title>
<meta name="theme-color" content="#F3F1ED">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500&family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=7">
<style>
  body{color:var(--ink,#14110E);background:var(--screen,#F3F1ED);}

  /* ── THE DOOR ───────────────────────────────────────────────────────────
     SIX rings on the wave — the six things you can be asked to write — and
     everything else in the footer as pills.

     That division is the point. The wave is for the exam tasks; Sentence
     Structure, Phrase Bank, Writing Hub, Slides, Games and Desk are
     reference you reach for, not things the paper asks of you. Nine rings
     put them all on the same footing and the screen went shapeless.

     WHY SIX ALSO FIXES THE WAVE. It failed at nine because I had stretched
     the map to 880px to fit them, well past the dimensions the Phrase Bank
     uses, and because I had dropped two details from it: .mapPath needs
     overflow:visible or the curve is clipped where it runs past the last
     node, and .pill .circle is sized by --d rather than width/height. The
     numbers below are that page's, unchanged: ROW_TOP 15, ROW_BOT 85,
     height calc(100vh - 176px), min-height 540px, OFFSET from 46px. Six
     nodes is what they were tuned for. */

  .lead{max-width:var(--w-read);margin:0 auto;
    padding:calc(var(--header-h,110px) + 1.1rem) var(--gutter,1rem) 0;}
  .lead-rubric{font-family:var(--f-mono);font-size:.56rem;letter-spacing:.14em;
    text-transform:uppercase;color:var(--faint);text-align:center;line-height:1.9;}

  .map{position:relative;height:calc(100vh - 176px);min-height:540px;
    margin:.5rem 10px calc(12px + env(safe-area-inset-bottom,0px));}
  .mapPath{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
  .mapPath .road{fill:none;stroke:var(--mute);stroke-width:.16;stroke-linecap:round;}
  .mapPath .stem{stroke:var(--rule);stroke-width:.3;stroke-linecap:round;}

  .nodes{position:absolute;inset:0;}
  .node{position:absolute;transform:translateY(-50%);width:100%;}

  .pill{position:absolute;top:0;transform:translate(-50%,-50%);
    display:flex;flex-direction:column;align-items:center;gap:.5rem;
    border:none;background:none;text-decoration:none;
    transition:transform .14s;}
  .pill:active{transform:translate(-50%,-50%) scale(.94);}

  /* Sized by --d, as the shell's medallion expects. */
  .pill .circle{
    --d:56px;
    --mark-sweep:var(--sage);
    --mark-rest:var(--sage);
    --mark-core:#14110E;
    --mark-ink:var(--card,#FAF8F5);
    --mark-pct:100%;}
  .pill.part .circle{--mark-rest:var(--rule);}

  .pill .lbl{width:9.5rem;text-align:center;
    font-family:'Anton',Impact,sans-serif;text-transform:uppercase;
    font-weight:400;font-size:.82rem;letter-spacing:.06em;line-height:1.15;
    color:var(--ink);}
  .pill .sub{font-family:var(--f-mono);font-size:.46rem;letter-spacing:.1em;
    text-transform:uppercase;color:var(--faint);margin-top:-.3rem;}

  @media(max-width:560px){
    .pill .lbl{width:8.2rem;font-size:.74rem;letter-spacing:.04em;}
    .map{margin:.4rem 6px calc(10px + env(safe-area-inset-bottom,0px));}
    .mapPath .stem{stroke-width:.4;}
  }

  /* ── THE FOOTER ────────────────────────────────────────────────────────
     Six pills, wrapping. Grey rather than sage: the rings own the accent
     and these sit below the work. 44px tall, the iOS minimum tap target. */
  .quiet{max-width:var(--w-read);margin:0 auto;
    padding:1.1rem var(--gutter,1rem) calc(2.2rem + env(safe-area-inset-bottom,0px));
    border-top:1px solid var(--rule);
    display:flex;flex-wrap:wrap;gap:.45rem;}
  .quiet a{flex:1 1 auto;min-width:0;
    display:flex;align-items:center;justify-content:center;
    background:var(--poster-fill);border-radius:999px;
    padding:.85rem .9rem;text-decoration:none;
    font-family:var(--f-display);font-size:.66rem;font-weight:800;
    letter-spacing:.02em;color:var(--poster-ink);
    text-align:center;white-space:nowrap;
    transition:background .15s,transform .12s;}
  .quiet a:active{transform:scale(.97);background:var(--poster-fill-hi);}
  @media(hover:hover){ .quiet a:hover{background:var(--poster-fill-hi);} }
  @media(max-width:560px){
    .quiet{gap:.4rem;}
    .quiet a{font-size:.6rem;padding:.85rem .7rem;}
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-top">
    <a class="back-link" href="/index.html" target="_top">&larr; Skills</a>
    <div class="header-title">
      <div class="app-title">INTUITY</div>
      <div class="app-subtitle">Writing</div>
    </div>
    <span class="header-spacer">Level <b>B2</b></span>
  </div>
</header>

<div class="lead">
  <div class="lead-rubric">
    80 minutes &middot; two tasks &middot; 140&ndash;190 words each
  </div>
</div>

<div class="map" id="map">
  <svg class="mapPath" id="mapPath" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
  <div class="nodes" id="nodes"></div>
</div>

<div class="quiet">
  <a href="/skills/writing/sentence-structure/sentence-builder.html">Sentence Structure</a>
  <a href="/skills/similar-words/phrase-bank.html">Phrase Bank</a>
  <a href="/skills/writing/essays/writing-hub.html">Writing Hub</a>
  <a href="/skills/writing/slide-galleries-fetching.html">Slides</a>
  <a href="/skills/writing/games/index.html">Games</a>
  <a href="/skills/writing/essays/desk-mode.html">Desk</a>
</div>

<script>
/* The six tasks. Every href checked against the repo — and two traps:
   Reviews and Reports keep plan and model at review-plan.html and
   review-model.html, NOT the retired review-structure / review-builder;
   and their question page is *-question-selector.html where the other four
   use *-question.html.

   `built` is how many of Question / Plan / Model / Sample exist, and it
   drives the arc on the rim. */
var AREAS = [
  { n:1, name:'Essays',     sub:'Part 1 · compulsory', built:4,
    url:'/skills/writing/essays/essay-question.html' },
  { n:2, name:'Reviews',    sub:'Part 2', built:4,
    url:'/skills/writing/reviews/review-question-selector.html' },
  { n:3, name:'Reports',    sub:'General FCE', built:4,
    url:'/skills/writing/reports/report-question-selector.html' },
  { n:4, name:'Emails',     sub:'Part 2', built:4,
    url:'/skills/writing/emails/email-question.html' },
  { n:5, name:'Articles',   sub:'Part 2', built:3,
    url:'/skills/writing/articles/article-question.html' },
  { n:6, name:'Narratives', sub:'FCE for Schools', built:2,
    url:'/skills/writing/narrative/narrative-question.html' }
];

var ROW_TOP = 15, ROW_BOT = 85;
function $(id){ return document.getElementById(id); }

function layoutFor(n){
  if(n === 1) return [{ y:(ROW_TOP+ROW_BOT)/2, side:'right' }];
  var span = ROW_BOT - ROW_TOP;
  return Array.from({length:n}, function(_,i){
    return { y: ROW_TOP + span*i/(n-1), side: i % 2 === 0 ? 'right' : 'left' };
  });
}

function buildMap(){
  var L = layoutFor(AREAS.length);
  var w = $('map').clientWidth || 760;
  var OFFSET = Math.max(8, Math.min(18, 46 / w * 100));
  var pillXs = L.map(function(n){ return n.side === 'right' ? 50 - OFFSET : 50 + OFFSET; });

  $('nodes').innerHTML = AREAS.map(function(a,i){
    return '<div class="node" style="top:' + L[i].y + '%">' +
      '<a class="pill' + (a.built < 4 ? ' part' : '') + '" data-i="' + i + '"' +
        ' href="' + a.url + '" style="left:' + pillXs[i] + '%"' +
        (a.built < 4 ? ' title="' + a.built + ' of 4 stages built"' : '') + '>' +
        '<span class="circle pend-dial" style="--mark-pct:' +
          Math.round(a.built/4*100) + '%"><span>' + a.n + '</span></span>' +
        '<span class="lbl">' + a.name + '</span>' +
        (a.sub ? '<span class="sub">' + a.sub + '</span>' : '') +
      '</a></div>';
  }).join('');

  /* ── THE SPINE ────────────────────────────────────────────────────────
     The Phrase Bank's own construction, and the part I had been getting
     wrong. Its amplitude does not come from the medallions — it comes from
     a STEM LENGTH: each node projects a point 30-46% of the map away from
     its pill, and the wave is the cosine through those points. That is why
     its curve swings so widely and why mine, derived from the medallion
     edges, flattened to 1.5% on a phone and looked like a wobble.

     So: dots first, then the wave through them, then stems back to the
     pills. No measurement pass — the pill centres are known because they
     were just set, which is what killed the nine-node version: it read
     them back from the DOM inside a requestAnimationFrame and that step
     failed on the device. */
  var STEM = Math.max(30, Math.min(46, 150 / w * 100));
  var dots = L.map(function(n,i){
    var dir = n.side === 'right' ? 1 : -1;
    return { x: pillXs[i] + dir * STEM, y: n.y, dir: dir };
  });

  var ys = dots.map(function(d){ return d.y; });
  var y0 = ys[0], yN = ys[ys.length-1];
  var gap = (yN - y0) / (ys.length - 1);
  var LAM = 2 * gap;
  var xs = dots.map(function(d){ return d.x; });
  var cx = (Math.min.apply(null,xs) + Math.max.apply(null,xs)) / 2;
  var amp = (Math.max.apply(null,xs) - Math.min.apply(null,xs)) / 2;
  var side = Math.sign(dots[0].x - cx) || 1;
  var waveX = function(y){ return cx + side * amp * Math.cos(2*Math.PI*(y - y0)/LAM); };

  /* The curve runs a little past the first and last node so the spine does
     not appear to begin and end at them. .mapPath is overflow:visible so
     that overshoot is not clipped — the detail I had dropped. */
  var EXT = 0.55, N = 200, d = '';
  for(var k = 0; k <= N; k++){
    var y = (y0 - EXT*gap) + ((yN + EXT*gap) - (y0 - EXT*gap)) * k / N;
    d += (k ? ' L ' : 'M ') + waveX(y).toFixed(2) + ' ' + y.toFixed(2);
  }
  var svg = '<path class="road" d="' + d + '"/>';
  /* Each stem runs from the medallion's outer edge to the curve. */
  var edgePct = (28 + 6) / w * 100;
  L.forEach(function(n,i){
    var from = pillXs[i] + dots[i].dir * edgePct;
    svg += '<line class="stem" x1="' + from.toFixed(2) + '" y1="' + n.y +
           '" x2="' + waveX(n.y).toFixed(2) + '" y2="' + n.y + '"/>';
  });
  $('mapPath').innerHTML = svg;
}

buildMap();
addEventListener('resize', buildMap);
addEventListener('orientationchange', function(){ setTimeout(buildMap, 150); });
if(document.fonts && document.fonts.ready) document.fonts.ready.then(buildMap);
</script>
</body>
</html>
