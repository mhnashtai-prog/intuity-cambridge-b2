<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>INTUITY — Writing</title>
<meta name="theme-color" content="#F3F1ED">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500&family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=7">
<style>
  body{color:var(--ink,#14110E);background:var(--screen,#F3F1ED);}

  /* ── THE DOOR ───────────────────────────────────────────────────────────
     Nine rings, three by three.

     A wave stood here first — the Phrase Bank's cosine spine with the
     medallions hung either side of it. It is the better idea and it did
     not survive contact with the phone: the stems drew, the curve did
     not. The path is built in a requestAnimationFrame after measuring the
     rendered pills, and something in that sequence fails here that does
     not fail on the page it came from. Rather than keep guessing at it,
     the grid — which needs no measurement, no path, and no second pass.

     The medallion is unchanged and is still the shell's, §11: three
     concentric layers whose insets are percentages, so this is a size and
     four tokens and no new shape. Sage rim, black core, cream numeral. */

  .door{max-width:var(--w-read);margin:0 auto;
    padding:calc(var(--header-h,110px) + 1.4rem) var(--gutter,1rem) 2rem;}

  .rubric{font-family:var(--f-mono);font-size:.57rem;letter-spacing:.14em;
    text-transform:uppercase;color:var(--faint);text-align:center;
    line-height:1.9;margin-bottom:1.9rem;}

  /* One caption per band, because nine identical rings would hide the fact
     that Essay is Part 1 and compulsory while five are Part 2 and you pick
     one. The lightest way to keep the structure of the paper visible. */
  .band{display:flex;align-items:center;gap:9px;margin:0 0 1rem;
    font-family:var(--f-mono);font-size:.55rem;letter-spacing:.16em;
    text-transform:uppercase;color:var(--faint);}
  .band::before{content:'';display:block;flex:none;width:24px;height:9px;
    background:var(--sage,#527065);}
  .band.quiet::before{background:var(--rule);}
  .band + .grid{margin-bottom:2.1rem;}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.7rem .5rem;}
  .grid.one{grid-template-columns:1fr;justify-items:center;}

  .cell{display:flex;flex-direction:column;align-items:center;gap:.55rem;
    text-decoration:none;transition:transform .12s;}
  .cell:active{transform:scale(.95);}

  .cell .circle{width:84px;height:84px;
    --mark-sweep:var(--sage,#527065);
    --mark-rest:var(--sage,#527065);
    --mark-core:#14110E;
    --mark-ink:#F3EFE7;
    --mark-pct:100%;}
  .cell .circle span{font-size:1.3rem;}
  /* Not all four stages built: the rim reports the fraction that is, so
     the door is honest without needing a caption to say so. */
  .cell.part .circle{--mark-rest:var(--rule);}

  .cell b{font-family:var(--f-display);font-size:.74rem;font-weight:800;
    letter-spacing:.02em;color:var(--ink);text-align:center;line-height:1.25;}
  .cell i{font-family:var(--f-mono);font-style:normal;font-size:.45rem;
    letter-spacing:.09em;text-transform:uppercase;color:var(--faint);
    text-align:center;line-height:1.35;margin-top:-.28rem;}

  @media(max-width:360px){
    .cell .circle{width:70px;height:70px;}
    .cell .circle span{font-size:1.1rem;}
    .cell b{font-size:.66rem;}
  }

  /* ── THE THREE UNDER THE RINGS ─────────────────────────────────────────
     Slides, Games and Desk. Not tasks, so not rings — but as plain text
     they read as small print rather than as something you press. Pills:
     the product's own shape, one line, evenly divided, grey rather than
     sage so they do not compete with the nine above them. 44px tall,
     which is the iOS minimum tap target. */
  .quiet{max-width:var(--w-read);margin:0 auto;
    padding:1.3rem var(--gutter,1rem) calc(2.3rem + env(safe-area-inset-bottom,0px));
    border-top:1px solid var(--rule);display:flex;gap:.5rem;}
  .quiet a{flex:1 1 0;min-width:0;
    display:flex;align-items:center;justify-content:center;
    background:var(--poster-fill);border-radius:999px;
    padding:.85rem .5rem;text-decoration:none;
    font-family:var(--f-display);font-size:.7rem;font-weight:800;
    letter-spacing:.03em;color:var(--poster-ink);
    text-align:center;white-space:nowrap;
    transition:background .15s,transform .12s;}
  .quiet a:active{transform:scale(.97);background:var(--poster-fill-hi);}
  @media(hover:hover){ .quiet a:hover{background:var(--poster-fill-hi);} }
  @media(max-width:560px){
    .quiet{gap:.4rem;}
    .quiet a{font-size:.63rem;letter-spacing:.01em;padding:.85rem .35rem;}
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-top">
    <a class="back-link" href="/index.html" target="_top">&larr; Skills</a>
    <div class="header-title">
      <div class="app-title">INTUITY</div>
      <div class="app-subtitle">Writing</div>
    </div>
    <span class="header-spacer">Level <b>B2</b></span>
  </div>
</header>

<div class="door">
  <div class="rubric">
    The exam &middot; 80 minutes &middot; two tasks &middot; 140&ndash;190 words each
  </div>

  <div class="band">Part 1 &middot; Compulsory</div>
  <div class="grid one" id="g1"></div>

  <div class="band">Part 2 &middot; Pick one</div>
  <div class="grid" id="g2"></div>

  <div class="band quiet">Whenever you need them</div>
  <div class="grid" id="g3"></div>
</div>

<div class="quiet">
  <a href="/skills/writing/slide-galleries-fetching.html">Slides</a>
  <a href="/skills/writing/games/index.html">Games</a>
  <a href="/skills/writing/essays/desk-mode.html">Desk</a>
</div>

<script>
/* Every href checked against the repo. Two traps worth recording:

   REVIEWS AND REPORTS keep plan and model at review-plan.html and
   review-model.html — NOT review-structure.html / review-builder.html,
   which are the retired versions those replaced.

   THEIR QUESTION PAGE is *-question-selector.html, where the other four
   genres use *-question.html.

   `built` is how many of Question / Plan / Model / Sample exist, and it
   drives the arc on the rim. */
var CELLS = [
  { n:1, name:'Essays', sub:'Part 1 · compulsory', built:4,
    url:'/skills/writing/essays/essay-question.html' },

  { n:2, name:'Reviews', built:4,
    url:'/skills/writing/reviews/review-question-selector.html' },
  { n:3, name:'Reports', sub:'General FCE', built:4,
    url:'/skills/writing/reports/report-question-selector.html' },
  { n:4, name:'Emails', built:4,
    url:'/skills/writing/emails/email-question.html' },
  { n:5, name:'Articles', built:3,
    url:'/skills/writing/articles/article-question.html' },
  { n:6, name:'Narratives', sub:'FCE for Schools', built:2,
    url:'/skills/writing/narrative/narrative-question.html' },

  { n:7, name:'Sentence Structure', built:4,
    url:'/skills/writing/sentence-structure/sentence-builder.html' },
  { n:8, name:'Phrase Bank', sub:'Reinforcement', built:4,
    url:'/skills/similar-words/phrase-bank.html' },
  { n:9, name:'Writing Hub', built:4,
    url:'/skills/writing/essays/writing-hub.html' }
];

function cell(c){
  return '<a class="cell' + (c.built < 4 ? ' part' : '') + '" href="' + c.url + '"' +
    (c.built < 4 ? ' title="' + c.built + ' of 4 stages built"' : '') + '>' +
    '<span class="circle pend-dial" style="--mark-pct:' +
      Math.round(c.built/4*100) + '%"><span>' + c.n + '</span></span>' +
    '<b>' + c.name + '</b>' +
    (c.sub ? '<i>' + c.sub + '</i>' : '') +
  '</a>';
}

document.getElementById('g1').innerHTML = cell(CELLS[0]);
document.getElementById('g2').innerHTML = CELLS.slice(1,6).map(cell).join('');
document.getElementById('g3').innerHTML = CELLS.slice(6).map(cell).join('');
</script>
</body>
</html>
