<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>INTUITY — Writing</title>
<meta name="theme-color" content="#F3F1ED">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500&family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=7">
<style>
  /* The one rule that stays in the page: the shell sets
     body{color:var(--paper)} and expects each page to set its own ink. */
  body{color:var(--ink,#14110E);background:var(--screen,#F3F1ED);}

  /* ── THE DOOR ───────────────────────────────────────────────────────────
     Nine pendulums, three by three, replacing a menu of nine identical
     pills.

     THE PENDULUM IS THE SHELL'S, NOT MINE. §11 of intuity-shell.css already
     owns .pend-hang and .pend-dial — the thread, the pivot, and three
     concentric layers whose insets are PERCENTAGES, so the same object
     scales from a 96px gate mark to a 292px dial without an override.
     Colour comes from four --mark-* tokens. So this page adds a size and
     four variables and nothing else: no new medallion, no copy of one.

     That matters beyond tidiness. Defuse and Forge each carried their own
     duplicate of this shape before it was promoted; a third copy here
     would have started that again.

     The shell also defines the swing and then switches it off. Nine
     swinging discs would be a fairground, so they stay still — but the
     animation is one line away if you want it back. */

  .door{max-width:var(--w-read);margin:0 auto;
    padding:calc(var(--header-h,110px) + 1.5rem) var(--gutter,1rem) 3.5rem;}

  .door-rubric{font-family:var(--f-mono);font-size:.58rem;letter-spacing:.14em;
    text-transform:uppercase;color:var(--faint);text-align:center;
    line-height:1.9;margin-bottom:2.1rem;}

  /* The band captions. Essay is Part 1 and compulsory; the other five are
     Part 2 and you choose one. Nine identical circles would hide that, so
     one caption per band says it — the lightest way to keep the structure
     of the paper visible in a flat grid. */
  .door-band{display:flex;align-items:center;gap:9px;
    margin:0 0 1rem;font-family:var(--f-mono);font-size:.56rem;
    letter-spacing:.16em;text-transform:uppercase;color:var(--faint);}
  .door-band::before{content:'';display:block;flex:none;width:24px;height:9px;
    background:var(--sage,#527065);}
  .door-band.quiet::before{background:var(--rule);}
  .door-band + .door-band{margin-top:2.2rem;}

  .door-grid{display:grid;grid-template-columns:repeat(3,1fr);
    gap:1.6rem .6rem;margin-bottom:.4rem;}

  .door-cell{display:flex;flex-direction:column;align-items:center;gap:.6rem;
    text-decoration:none;transition:transform .12s;}
  .door-cell:active{transform:scale(.96);}

  /* The size, and the four tokens. Sage rim, black core, cream numeral —
     the palette every submenu in this product uses. */
  .door-cell .pend-hang{width:88px;height:88px;
    --mark-sweep:var(--sage,#527065);
    --mark-rest:var(--sage,#527065);
    --mark-core:#14110E;
    --mark-ink:#F3EFE7;
    --mark-pct:100%;}
  .door-cell .pend-dial span{font-size:1.35rem;}

  .door-cell b{font-family:var(--f-display);font-size:.78rem;font-weight:700;
    letter-spacing:.02em;color:var(--ink);text-align:center;line-height:1.3;}
  .door-cell i{font-family:var(--f-mono);font-style:normal;font-size:.48rem;
    letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
    text-align:center;line-height:1.4;margin-top:-.35rem;}

  /* A genre whose four stages are not all built. The pendulum stays whole —
     the rim reports it instead, which is what --mark-pct is for: the arc
     is the fraction of Question / Plan / Model / Sample that exists. */
  .door-cell.part .pend-hang{--mark-rest:var(--rule);}

  @media(max-width:360px){
    .door-cell .pend-hang{width:76px;height:76px;}
    .door-cell .pend-dial span{font-size:1.15rem;}
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-top">
    <a class="back-link" href="/index.html" target="_top">&larr; Skills</a>
    <div class="header-title">
      <div class="app-title">INTUITY</div>
      <div class="app-subtitle">Writing</div>
    </div>
    <span class="header-spacer">Level <b>B2</b></span>
  </div>
</header>

<div class="door">
  <div class="door-rubric">
    The exam &middot; 80 minutes &middot; two tasks &middot; 140&ndash;190 words each
  </div>

  <div class="door-band">Part 1 &middot; Compulsory</div>
  <div class="door-grid" id="g1"></div>

  <div class="door-band">Part 2 &middot; Pick one</div>
  <div class="door-grid" id="g2"></div>

  <div class="door-band quiet">Whenever you need them</div>
  <div class="door-grid" id="g3"></div>
</div>

<script>
/* ── THE NINE ────────────────────────────────────────────────────────────
   Every href below was checked against the repo before it was written.
   Two traps are worth recording, because both cost real time:

   REVIEWS AND REPORTS keep their plan and model at review-plan.html and
   review-model.html. NOT review-structure.html and review-builder.html —
   those are the retired versions these replaced, and pointing at them
   sends a student to a dead end that still renders.

   THE QUESTION PAGE for Reviews and Reports is *-question-selector.html,
   not *-question.html, which is what the other four genres use.

   `built` is the count of the four stages that exist. It drives the arc on
   the rim, so a genre reports what it has rather than what was intended. */
var CELLS = [
  { n:'01', label:'Essay',   sub:'Everyone writes this', built:4,
    href:'/skills/writing/essays/essay-question.html' },

  { n:'02', label:'Reviews', built:4,
    href:'/skills/writing/reviews/review-question-selector.html' },
  { n:'03', label:'Reports', sub:'General FCE', built:4,
    href:'/skills/writing/reports/report-question-selector.html' },
  { n:'04', label:'Emails',  built:4,
    href:'/skills/writing/emails/email-question.html' },
  { n:'05', label:'Articles', built:3,
    href:'/skills/writing/articles/article-question.html' },
  { n:'06', label:'Narratives', sub:'FCE for Schools', built:2,
    href:'/skills/writing/narrative/narrative-question.html' },

  { n:'07', label:'Sentence Structure', built:4,
    href:'/skills/writing/sentence-structure/sentence-builder.html' },
  { n:'08', label:'Phrase Bank', built:4,
    href:'/skills/writing/phrase-bank.html' },
  { n:'09', label:'Writing Hub', built:4,
    href:'/skills/writing/essays/writing-hub.html' }
];

function cell(c) {
  var pct = Math.round(c.built / 4 * 100);
  return '<a class="door-cell' + (c.built < 4 ? ' part' : '') + '" href="' + c.href + '"' +
    (c.built < 4 ? ' title="' + c.built + ' of 4 stages built"' : '') + '>' +
    '<div class="pend-hang" style="--mark-pct:' + pct + '%">' +
      '<div class="pend-dial"><span>' + c.n + '</span></div>' +
    '</div>' +
    '<b>' + c.label + '</b>' +
    (c.sub ? '<i>' + c.sub + '</i>' : '') +
  '</a>';
}

document.getElementById('g1').innerHTML = cell(CELLS[0]);
document.getElementById('g2').innerHTML = CELLS.slice(1, 6).map(cell).join('');
document.getElementById('g3').innerHTML = CELLS.slice(6).map(cell).join('');
</script>
</body>
</html>
