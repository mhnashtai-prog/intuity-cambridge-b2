<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>INTUITY — Writing</title>
<meta name="theme-color" content="#F3F1ED">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500&family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/grammar-rules/intuity-shell.css?v=7">
<style>
  body{color:var(--ink,#14110E);background:var(--screen,#F3F1ED);}

  /* ── THE DOOR, AS A CONSTELLATION ────────────────────────────────────────
     The same object as the Phrase Bank's family map: a cosine spine drawn
     as one SVG path, medallions alternating either side of it, a short stem
     joining each to the curve.

     Taken from that page rather than imitated, because the geometry is the
     part that would have gone wrong by hand. Two things in particular:

       THE SPINE IS COMPUTED FROM THE NODES, not drawn and then decorated.
       `waveX` is a cosine about the mean of the pill positions with its
       wavelength set to twice the row gap, so the curve passes between
       consecutive medallions however many there are. Nine nodes here where
       the phrase bank has six, and nothing needed adjusting.

       THE STEMS ARE MEASURED AFTER LAYOUT. Each pill's real edge is read
       back from the DOM and the stem redrawn to meet it, because a label
       set in Anton is not the width you predicted until the webfont lands.

     WHAT IS DIFFERENT HERE: no captions. The phrase bank lists each
     family's functions beside it because those are the targets. A genre's
     four stages are not targets from the door — you meet them on the stage
     row once you are inside — so a medallion and a name is the whole node.
     That also lets the spine swing wider, since nothing has to fit beside
     it. */

  .lead{max-width:var(--w-read);margin:0 auto;
    padding:calc(var(--header-h,110px) + 1.2rem) var(--gutter,1rem) .2rem;}
  .lead-rubric{font-family:var(--f-mono);font-size:.57rem;letter-spacing:.14em;
    text-transform:uppercase;color:var(--faint);text-align:center;line-height:1.9;}

    /* Nine nodes where the phrase bank has six, so the map is taller: below
     about 880px the medallions would sit closer than their own diameter
     and the wave between them would flatten to a wobble. The page scrolls
     instead, which is what a phone expects. */
  .map{position:relative;height:calc(100vh - 200px);min-height:880px;
    margin:.8rem 10px calc(14px + env(safe-area-inset-bottom,0px));}
  .mapPath{position:absolute;inset:0;width:100%;height:100%;}
  .mapPath .road{fill:none;stroke:var(--mute);stroke-width:.16;stroke-linecap:round;}
  .mapPath .stem{stroke:var(--mute);stroke-width:.14;stroke-linecap:round;}

  .nodes{position:absolute;inset:0;}
  .node{position:absolute;transform:translateY(-50%);width:100%;}

  .pill{position:absolute;transform:translate(-50%,-50%);
    display:flex;flex-direction:column;align-items:center;gap:.5rem;
    text-decoration:none;transition:transform .14s;}
  .pill:active{transform:translate(-50%,-50%) scale(.94);}

  /* The medallion is the shell's, §11 — three concentric layers whose
     insets are percentages, so this is a size and four tokens and no new
     shape. Sage rim, black core, cream numeral: the submenu palette. */
  .pill .circle{width:66px;height:66px;
    --mark-sweep:var(--sage,#527065);
    --mark-rest:var(--sage,#527065);
    --mark-core:#14110E;
    --mark-ink:#F3EFE7;
    --mark-pct:100%;}
  .pill .circle span{font-size:1.1rem;}
  /* A genre whose four stages are not all built. The rim reports it: the
     arc is the fraction that exists, so the door is honest without a
     caption. */
  .pill.part .circle{--mark-rest:var(--rule);}

  .pill .lbl{width:9.5rem;text-align:center;
    font-family:'Anton',Impact,sans-serif;text-transform:uppercase;
    font-weight:400;font-size:.8rem;letter-spacing:.06em;line-height:1.15;
    color:var(--ink);}
  .pill .sub{font-family:var(--f-mono);font-size:.47rem;letter-spacing:.1em;
    text-transform:uppercase;color:var(--faint);margin-top:-.3rem;}

  .band{position:absolute;left:50%;transform:translate(-50%,-50%);
    font-family:var(--f-mono);font-size:.5rem;letter-spacing:.18em;
    text-transform:uppercase;color:var(--faint);white-space:nowrap;
    background:var(--screen);padding:0 .6rem;z-index:3;}

  /* The phrase bank's own narrow-screen numbers: a 52px medallion and an
     8.2rem label. Nothing else changes, because nothing else needs to. */
  @media(max-width:560px){
    .pill .circle{width:52px;height:52px;}
    .pill .circle span{font-size:.9rem;}
    .pill .lbl{width:8.2rem;font-size:.74rem;letter-spacing:.04em;}
    .pill .sub{font-size:.44rem;}
    .mapPath .stem{stroke:var(--rule);stroke-width:.4;}
    .map{margin:.6rem 6px calc(10px + env(safe-area-inset-bottom,0px));}
  }

  /* NO NARROW-SCREEN FALLBACK, and the one that stood here was my own
     invention rather than the phrase bank's.

     I copied `.constellation.stack` from that page believing it was the
     map's escape hatch for a phone. It is not — it belongs to a different
     view on the same page, the draggable phrase cards. The FAMILY MAP has
     no fallback at all: at 560px and below it simply shrinks the medallion
     to 52px and the label to 8.2rem and keeps drawing the wave.

     Mine switched to a plain column below 560px, which is every phone, so
     the wave never appeared on the device it was designed for. Deleted.
     The map draws at every width; only the sizes change. */
  /* ── THE THREE UNDER THE SPINE ───────────────────────────────────────
     Slide galleries, Games and Desk mode. Not tasks — nothing on the wave —
     so they must not look like more nodes, but as plain underlined text
     they read as small print rather than as something you press.

     Pills: the product's own shape, the one the gaps wear in Use of English
     and the view toggles wear everywhere. One line, evenly divided, because
     three short labels compared side by side need no explanation between
     them — the words are the whole message and a subtitle under each would
     be reading matter under a row of buttons.

     Grey rather than sage. The rings own the accent on this page; these sit
     below the work and should not compete with the nine. */
  .quiet{max-width:var(--w-read);margin:0 auto;
    padding:1.3rem var(--gutter,1rem) calc(2.3rem + env(safe-area-inset-bottom,0px));
    border-top:1px solid var(--rule);
    display:flex;gap:.5rem;}

  /* flex:1 with a zero basis divides the line evenly however long the words
     are, so the three read as one control rather than three sizes. */
  .quiet a{flex:1 1 0;min-width:0;
    display:flex;align-items:center;justify-content:center;
    background:var(--poster-fill);border-radius:999px;
    padding:.85rem .5rem;text-decoration:none;
    font-family:var(--f-display);font-size:.7rem;font-weight:800;
    letter-spacing:.03em;color:var(--poster-ink);
    text-align:center;white-space:nowrap;
    transition:background .15s,transform .12s;}
  .quiet a:active{transform:scale(.97);background:var(--poster-fill-hi);}
  @media(hover:hover){ .quiet a:hover{background:var(--poster-fill-hi);} }

  @media(max-width:560px){
    .quiet{gap:.4rem;}
    .quiet a{font-size:.63rem;letter-spacing:.01em;padding:.85rem .35rem;}
  }
  @media(max-width:360px){
    .quiet a{font-size:.58rem;}
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-top">
    <a class="back-link" href="/index.html" target="_top">&larr; Skills</a>
    <div class="header-title">
      <div class="app-title">INTUITY</div>
      <div class="app-subtitle">Writing</div>
    </div>
    <span class="header-spacer">Level <b>B2</b></span>
  </div>
</header>

<div class="lead">
  <div class="lead-rubric">
    The exam &middot; 80 minutes &middot; two tasks &middot; 140&ndash;190 words each
  </div>
</div>

<div class="map" id="map">
  <svg class="mapPath" id="mapPath" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
  <div class="nodes" id="nodes"></div>
</div>

<div class="quiet">
  <a href="/skills/writing/slide-galleries-fetching.html">Slides</a>
  <a href="/skills/writing/games/index.html">Games</a>
  <a href="/skills/writing/essays/desk-mode.html">Desk</a>
</div>

<script>
/* ── THE NINE ────────────────────────────────────────────────────────────
   Every href checked against the repo. Two traps worth recording:

   REVIEWS AND REPORTS keep plan and model at review-plan.html and
   review-model.html — NOT review-structure.html / review-builder.html,
   which are the retired versions those replaced.

   THEIR QUESTION PAGE is *-question-selector.html, where the other four
   genres use *-question.html.

   `built` is how many of Question / Plan / Model / Sample exist, and it
   drives the arc on the rim. */
var AREAS = [
  { n:1, name:'Essays',   sub:'Part 1 · compulsory', built:4,
    url:'/skills/writing/essays/essay-question.html' },
  { n:2, name:'Reviews',  built:4,
    url:'/skills/writing/reviews/review-question-selector.html' },
  { n:3, name:'Reports',  sub:'General FCE', built:4,
    url:'/skills/writing/reports/report-question-selector.html' },
  { n:4, name:'Emails',   built:4,
    url:'/skills/writing/emails/email-question.html' },
  { n:5, name:'Articles', built:3,
    url:'/skills/writing/articles/article-question.html' },
  { n:6, name:'Narratives', sub:'FCE for Schools', built:2,
    url:'/skills/writing/narrative/narrative-question.html' },
  { n:7, name:'Sentence Structure', built:4,
    url:'/skills/writing/sentence-structure/sentence-builder.html' },
  { n:8, name:'Phrase Bank', sub:'Reinforcement', built:4,
    url:'/skills/similar-words/phrase-bank.html' },
  { n:9, name:'Writing Hub', built:4,
    url:'/skills/writing/essays/writing-hub.html' }
];

var ROW_TOP = 7, ROW_BOT = 94;
function $(id){ return document.getElementById(id); }

function layoutFor(n){
  if(n === 1) return [{ y:(ROW_TOP+ROW_BOT)/2, side:'right' }];
  var span = ROW_BOT - ROW_TOP;
  return Array.from({length:n}, function(_,i){
    return { y: ROW_TOP + span * i / (n-1), side: i % 2 === 0 ? 'right' : 'left' };
  });
}

function buildMap(){
  var L = layoutFor(AREAS.length);
  var w = $('map').clientWidth || 760;
  /* How far the pills sit from the centre line. Clamped so a narrow screen
     does not push a 9.5rem label off the edge. */
  var OFFSET = Math.max(9, Math.min(19, 52 / w * 100));
  var pillXs = L.map(function(n){ return n.side === 'right' ? 50 - OFFSET : 50 + OFFSET; });

  $('nodes').innerHTML = AREAS.map(function(a,i){
    return '<div class="node" style="top:' + L[i].y + '%">' +
      '<a class="pill' + (a.built < 4 ? ' part' : '') + '" data-i="' + i + '" href="' + a.url + '"' +
        ' style="left:' + pillXs[i] + '%"' +
        (a.built < 4 ? ' title="' + a.built + ' of 4 stages built"' : '') + '>' +
        '<span class="circle pend-dial" style="--mark-pct:' +
          Math.round(a.built/4*100) + '%"><span>' + a.n + '</span></span>' +
        '<span class="lbl">' + a.name + '</span>' +
        (a.sub ? '<span class="sub">' + a.sub + '</span>' : '') +
      '</a>' +
    '</div>';
  }).join('');

  /* THE SPINE, after layout. The pills' real edges are read back from the
     DOM because a label set in Anton is not the width you predicted until
     the webfont has landed — the phrase bank learned that the hard way and
     the same measurement pass is kept here. */
  requestAnimationFrame(function(){
    var mapRect = $('map').getBoundingClientRect();
    var toPct = function(px){ return px / mapRect.width * 100; };
    var GAP = toPct(14);

    var anchors = AREAS.map(function(a,i){
      var el = $('nodes').querySelector('.pill[data-i="' + i + '"] .circle');
      var r = el.getBoundingClientRect();
      var dir = L[i].side === 'right' ? 1 : -1;
      var edge = dir > 0 ? (r.right - mapRect.left) : (r.left - mapRect.left);
      return { x: toPct(edge) + dir * GAP, y: L[i].y, dir: dir };
    });

    var ys = anchors.map(function(d){ return d.y; });
    var y0 = ys[0], yN = ys[ys.length-1];
    var gap = (yN - y0) / (ys.length - 1);
    var LAM = 2 * gap;                       /* one full swing per two nodes */
    var xs = anchors.map(function(d){ return d.x; });
    var cx = (Math.min.apply(null,xs) + Math.max.apply(null,xs)) / 2;
    /* THE AMPLITUDE NEEDS A CEILING, NOT A FLOOR — and I had it backwards.
       The wave swings about the mean of the anchors, so raising the
       amplitude pushes it TOWARD the pills, not away. My first attempt
       floored it to clear the medallion radius and made the clash worse:
       9 of 9 nodes at 768px, where before only the narrow widths failed.

       The wave has to stay inside the corridor between the two columns.
       Its furthest excursion must fall short of a pill's centre by at least
       that pill's radius, so the ceiling is the offset minus the radius,
       with a little air. `rad` is measured off the rendered circle because
       it is set in px and the map works in percent.

       No floor at all. Where the corridor is narrow the wave is shallow,
       which is honest — a spine that had to bulge would be a spine drawn
       through the thing it connects. */
    var cr  = $('nodes').querySelector('.pill .circle').getBoundingClientRect();
    var rad = toPct(cr.width / 2);
    var room = OFFSET - rad - toPct(8);
    var amp = Math.min(Math.max(toPct(20),
                                (Math.max.apply(null,xs) - Math.min.apply(null,xs)) / 2),
                       Math.max(toPct(6), room));
    var side = Math.sign(anchors[0].x - cx) || 1;
    var waveX = function(y){ return cx + side * amp * Math.cos(2*Math.PI*(y - y0)/LAM); };

    /* The curve is sampled rather than solved: 240 points is smooth at any
       height and costs nothing to draw once. It runs a little past the
       first and last node so the spine does not appear to start at them. */
    var EXT = 0.62, N = 240, d = '';
    for(var k=0;k<=N;k++){
      var y = (y0 - EXT*gap) + ((yN + EXT*gap) - (y0 - EXT*gap)) * k / N;
      d += (k ? ' L ' : 'M ') + waveX(y).toFixed(2) + ' ' + y.toFixed(2);
    }
    var svg = '<path class="road" d="' + d + '"/>';
    anchors.forEach(function(p,i){
      svg += '<line class="stem" x1="' + p.x.toFixed(2) + '" y1="' + p.y +
             '" x2="' + waveX(p.y).toFixed(2) + '" y2="' + p.y + '"/>';
    });
    $('mapPath').innerHTML = svg;
  });
}

buildMap();
addEventListener('resize', buildMap);
addEventListener('orientationchange', function(){ setTimeout(buildMap, 150); });
if(document.fonts && document.fonts.ready) document.fonts.ready.then(buildMap);
</script>
</body>
</html>
