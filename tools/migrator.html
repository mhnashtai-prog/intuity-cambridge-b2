<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INTUITY - Gap-Fill Schema Migrator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
      background: #0d0d0d;
      background-image: radial-gradient(circle at 20% 50%, rgba(201, 169, 97, 0.04) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(201, 169, 97, 0.03) 0%, transparent 50%);
      min-height: 100vh;
      color: #e5e5e5;
      padding: 1rem;
    }

    .container { max-width: 64rem; margin: 0 auto; padding: 0 1rem; }

    .content-container {
      background: rgba(28, 28, 30, 0.6);
      backdrop-filter: blur(40px) saturate(150%);
      border-radius: 1.25rem;
      border: 1px solid rgba(201, 169, 97, 0.25);
      padding: 2rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    h1 {
      font-size: 0.75rem;
      font-weight: 600;
      color: #C9A961;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 0.5rem;
    }

    .lede {
      text-align: center;
      font-size: 0.8125rem;
      color: #8e8e93;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    .drop {
      border: 1px dashed rgba(201, 169, 97, 0.4);
      border-radius: 1rem;
      padding: 3rem 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      background: rgba(201, 169, 97, 0.04);
    }

    .drop:hover, .drop.over {
      background: rgba(201, 169, 97, 0.1);
      border-color: #C9A961;
    }

    .drop-title { color: #C9A961; font-weight: 600; font-size: 0.9375rem; margin-bottom: 0.375rem; }
    .drop-hint { color: #636366; font-size: 0.75rem; }

    input[type=file] { display: none; }

    .results { margin-top: 2rem; }

    .file-block {
      border-top: 1px solid rgba(84, 84, 88, 0.3);
      padding-top: 1.5rem;
      margin-top: 1.5rem;
    }

    .file-name {
      color: #f5f5f7;
      font-weight: 600;
      font-size: 0.9375rem;
      margin-bottom: 0.25rem;
    }

    .file-meta { color: #636366; font-size: 0.75rem; margin-bottom: 1.25rem; }

    .group { margin-bottom: 1.25rem; }

    .group-title {
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .group.ok .group-title { color: #10b981; }
    .group.warn .group-title { color: #C9A961; }
    .group.bad .group-title { color: #ef4444; }

    .group ul { list-style: none; }

    .group li {
      font-size: 0.8125rem;
      color: #aeaeb2;
      line-height: 1.7;
      padding-left: 1rem;
      border-left: 1px solid rgba(84, 84, 88, 0.4);
      margin-bottom: 0.125rem;
    }

    .group li .where { color: #60a5fa; font-weight: 600; }

    .more { color: #636366; font-style: italic; }

    button.download {
      padding: 0.75rem 1.5rem;
      border-radius: 0.75rem;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      background: rgba(201, 169, 97, 0.25);
      color: #C9A961;
      border: 1px solid rgba(201, 169, 97, 0.4);
      box-shadow: 0 2px 12px rgba(201, 169, 97, 0.2);
      transition: all 0.3s ease;
    }

    button.download:hover {
      background: rgba(201, 169, 97, 0.35);
      box-shadow: 0 4px 16px rgba(201, 169, 97, 0.3);
    }

    .error { color: #fb923c; font-size: 0.8125rem; }

    @media (max-width: 640px) {
      body { padding: .5rem; }
      .container { padding: 0 .25rem; }
      .content-container { padding: 1rem .75rem; }
      .drop { padding: 2rem 1rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="content-container">
      <h1>Gap-Fill Schema Migrator</h1>
      <p class="lede">
        Migrates <strong>alternativeAnswer</strong> to <strong>alternatives</strong>, removes cues that
        cannot match their sentence, and promotes an in-sentence <strong>helper</strong> to a highlighted cue.<br>
        Everything runs in this page. Nothing is uploaded.
      </p>

      <label class="drop" id="drop">
        <div class="drop-title">Choose JSON files</div>
        <div class="drop-hint">or drag them here — several at once is fine</div>
        <input type="file" id="picker" accept=".json,application/json" multiple>
      </label>

      <div class="results" id="results"></div>
    </div>
  </div>

  <script>
    /* Mirror of the renderer's parser, so the audit sees exactly what the
       page will see when it draws the sentence. */
    function parseSentence(item) {
      let m;
      if (item.blanks === 2) {
        m = item.text.match(/(.*?)_____(.*?)_____ \(([^)]+)\)(.*)/);
        if (m) return { pre: m[1], mid: m[2], hint: m[3], post: m[4] };
        m = item.text.match(/(.*?)_____(.*?)_____(.*)/);
        if (m) return { pre: m[1], mid: m[2], hint: '', post: m[3] };
        return null;
      }
      m = item.text.match(/(.*?)_____ \(([^)]+)\)(.*)/);
      if (m) return { pre: m[1], mid: '', hint: m[2], post: m[3] };
      return null;
    }

    function matches(needle, haystack) {
      if (!needle) return false;
      const escaped = needle.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      return new RegExp('\\b' + escaped + '\\b', 'i').test(haystack);
    }

    function migrate(data) {
      const tests = (data.gapfill && data.gapfill.tests) || [];
      const report = { items: 0, tests: tests.length, legacy: 0,
                       unparsable: [], deadCue: [], promoted: [], stillUnmatched: [] };

      for (const test of tests) {
        for (const item of test.sentences) {
          report.items++;
          const where = test.id + ' #' + item.id;

          if (!Array.isArray(item.alternatives)) {
            const legacy = item.alternativeAnswer;
            item.alternatives = legacy ? [legacy] : [];
            if (legacy) report.legacy++;
          }
          delete item.alternativeAnswer;

          const parsed = parseSentence(item);
          if (!parsed) { report.unparsable.push({ where: where, note: item.text }); continue; }

          const visible = [parsed.pre, parsed.mid, parsed.post].join(' ');

          /* A cue that cannot match renders nothing at all, which looks
             identical to no cue — so it is removed rather than left to fail
             silently. */
          if (item.highlightVerb && !matches(item.highlightVerb, visible)) {
            report.deadCue.push({ where: where, note: '"' + item.highlightVerb + '" is not in the sentence' });
            delete item.highlightVerb;
          }

          /* A helper whose text is already in the sentence should be
             highlighted in place, not repeated in a chip beside it. */
          if (!item.highlightVerb && item.helper && matches(item.helper, visible)) {
            item.highlightVerb = item.helper;
            delete item.helper;
            report.promoted.push({ where: where, note: 'cue "' + item.highlightVerb + '" promoted from helper' });
          }

          if (item.highlightVerb && !matches(item.highlightVerb, visible)) {
            report.stillUnmatched.push({ where: where, note: item.highlightVerb });
          }

          const ordered = {};
          for (const k of ['id', 'text', 'answer', 'alternatives', 'highlightVerb', 'helper', 'blanks']) {
            if (item[k] !== undefined && item[k] !== null) ordered[k] = item[k];
          }
          for (const k of Object.keys(item)) if (!(k in ordered) && item[k] != null) ordered[k] = item[k];
          for (const k of Object.keys(item)) delete item[k];
          Object.assign(item, ordered);
        }
      }
      return report;
    }

    /* ─── view ─── */

    function escapeHtml(v) {
      return String(v).replace(/[&<>"']/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function groupHtml(cls, title, list) {
      if (!list.length) return '<div class="group ok"><div class="group-title">' + title + ' — none</div></div>';
      const shown = list.slice(0, 12).map(entry =>
        '<li><span class="where">' + escapeHtml(entry.where) + '</span> — ' + escapeHtml(entry.note) + '</li>').join('');
      const rest = list.length > 12
        ? '<li class="more">and ' + (list.length - 12) + ' more</li>' : '';
      return '<div class="group ' + cls + '"><div class="group-title">' + title +
             ' (' + list.length + ')</div><ul>' + shown + rest + '</ul></div>';
    }

    function download(name, data) {
      const blob = new Blob([JSON.stringify(data, null, 2) + '\n'], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = name;
      a.click();
      URL.revokeObjectURL(url);
    }

    function handleFiles(files) {
      const results = document.getElementById('results');

      Array.from(files).forEach(file => {
        const block = document.createElement('div');
        block.className = 'file-block';
        block.innerHTML = '<div class="file-name">' + escapeHtml(file.name) + '</div>';
        results.appendChild(block);

        const reader = new FileReader();
        reader.onload = () => {
          let data;
          try {
            data = JSON.parse(reader.result);
          } catch (err) {
            block.innerHTML += '<div class="error">Not valid JSON — ' + escapeHtml(err.message) + '</div>';
            return;
          }

          const r = migrate(data);

          block.innerHTML +=
            '<div class="file-meta">' + r.items + ' items in ' + r.tests + ' tests · ' +
            r.legacy + ' legacy alternativeAnswer migrated</div>' +
            groupHtml('bad', 'Unparsable — these never render', r.unparsable) +
            groupHtml('warn', 'Dead cues removed', r.deadCue) +
            groupHtml('warn', 'Cues promoted from helper', r.promoted) +
            groupHtml('bad', 'Still unmatched', r.stillUnmatched);

          const btn = document.createElement('button');
          btn.className = 'download';
          btn.textContent = 'Download migrated ' + file.name;
          btn.onclick = () => download(file.name, data);
          block.appendChild(btn);
        };
        reader.readAsText(file);
      });
    }

    const drop = document.getElementById('drop');
    document.getElementById('picker').addEventListener('change', e => handleFiles(e.target.files));

    ['dragenter', 'dragover'].forEach(ev =>
      drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
    ['dragleave', 'drop'].forEach(ev =>
      drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
    drop.addEventListener('drop', e => handleFiles(e.dataTransfer.files));
  </script>
</body>
</html>
